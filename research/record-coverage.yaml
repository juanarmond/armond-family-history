      de Barbacena) migrated into the Zona da Mata, notably Além Paraíba, next to
      Piacatuba — a plausible but UNPROVEN bridge to this Simplício. Anti-merge:
      the first-generation Simplício José Ferreira Armonde died unmarried; do not
      conflate. To test the link, find this Simplício's marriage to Elisa Balbina
      Toledo and his baptism (Barbacena Piedade baptism book 1828-1872, or
      Piacatuba/Além Paraíba). Full analysis in
