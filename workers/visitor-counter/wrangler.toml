# Wrangler config for the visitor-counter Worker (CLI deploy path).
# Dashboard deploy needs none of this — see README.md.
name = "family-visitor-counter"
main = "worker.js"
compatibility_date = "2024-11-01"

# Create the namespace with:  wrangler kv namespace create COUNTER
# then paste the printed id below (and remove the placeholder).
[[kv_namespaces]]
binding = "COUNTER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
