name: Deploy family tree to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "family-tree-viewer/**"
      - "data/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate repository
        run: uv run --frozen make check

      - name: Build privacy-filtered static site
        run: uv run --frozen python scripts/build_pages_site.py

      - name: Configure GitHub Pages
        # Requires Pages to be enabled once in the repo settings
        # (Settings -> Pages -> Source: "GitHub Actions"); the Actions token
        # cannot create the Pages site itself.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
