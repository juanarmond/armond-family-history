name: Deploy family tree to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "family-tree-viewer/**"
      - "data/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate repository
        run: uv run --frozen make check

      - name: Build privacy-filtered static site
        run: |
          uv run --frozen python - <<'PY'
          from __future__ import annotations

          import json
          import shutil
          from pathlib import Path

          import yaml

          root = Path.cwd()
          viewer = root / "family-tree-viewer"
          data = root / "data"
          output = root / "_site"

          if output.exists():
              shutil.rmtree(output)
          output.mkdir()

          for filename in (
              "index.html",
              "styles.css",
              "app.js",
              "data-loader.js",
              "static-api.js",
              "favicon.svg",
          ):
              shutil.copy2(viewer / filename, output / filename)

          # The viewer imports js-yaml from a vendored local module.
          shutil.copytree(viewer / "vendor", output / "vendor")

          loader = output / "data-loader.js"
          loader.write_text(
              loader.read_text(encoding="utf-8").replace(
                  'const DATA_ROOT = "../data";',
                  'const DATA_ROOT = "./data";',
              ),
              encoding="utf-8",
          )

          (output / ".nojekyll").write_text("", encoding="utf-8")

          def load_entities(kind: str) -> dict[str, dict]:
              entities: dict[str, dict] = {}
              directory = data / kind
              if not directory.exists():
                  return entities
              for path in sorted(directory.glob("*.yaml")):
                  value = yaml.safe_load(path.read_text(encoding="utf-8"))
                  if isinstance(value, dict) and isinstance(value.get("id"), str):
                      entities[value["id"]] = value
              return entities

          people = load_entities("people")
          families = load_entities("families")
          events = load_entities("events")
          places = load_entities("places")
          sources = load_entities("sources")

          living_ids = {
              person_id
              for person_id, person in people.items()
              if person.get("privacy") == "living"
          }

          public_people: dict[str, dict] = {}
          for person_id, person in people.items():
              living = person_id in living_ids
              public_people[person_id] = {
                  "schema_version": person.get("schema_version", 1),
                  "id": person_id,
                  "preferred_name": (
                      "Private living person" if living else person.get("preferred_name", person_id)
                  ),
                  "privacy": person.get("privacy", "unknown"),
                  "name_variants": [] if living else person.get("name_variants", []),
                  "event_ids": [] if living else person.get("event_ids", []),
                  "family_ids": person.get("family_ids", []),
                  "notes": [] if living else person.get("notes", []),
              }

          public_events: dict[str, dict] = {}
          for event_id, event in events.items():
              participant_ids = {
                  item.get("person_id")
                  for item in event.get("participants", [])
                  if isinstance(item, dict)
              }
              if participant_ids & living_ids:
                  continue
              public_events[event_id] = event

          public_sources: dict[str, dict] = {}
          for source_id, source in sources.items():
              linked_people = [
                  person_id
                  for person_id in source.get("linked_people", [])
                  if person_id not in living_ids
              ]
              public_sources[source_id] = {
                  "schema_version": source.get("schema_version", 1),
                  "id": source_id,
                  "title": source.get("title", source_id),
                  "record_type": source.get("record_type", "Source"),
                  "private": bool(source.get("private", False)),
                  "linked_people": linked_people,
              }

          datasets = {
              "people": public_people,
              "families": families,
              "events": public_events,
              "places": places,
              "sources": public_sources,
          }

          entity_index: dict[str, list[str]] = {}
          for kind, entities in datasets.items():
              target = output / "data" / kind
              target.mkdir(parents=True, exist_ok=True)
              entity_index[kind] = sorted(entities)
              for entity_id, entity in entities.items():
                  (target / f"{entity_id}.yaml").write_text(
                      yaml.safe_dump(
                          entity,
                          allow_unicode=True,
                          sort_keys=False,
                          width=100,
                      ),
                      encoding="utf-8",
                  )

          (output / "entity-index.json").write_text(
              json.dumps(entity_index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              "Built privacy-filtered Pages site:",
              len(public_people), "people,",
              len(families), "families,",
              len(public_events), "events,",
              len(places), "places,",
              len(public_sources), "sources",
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
