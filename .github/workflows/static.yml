name: Deploy family tree to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "family-tree-viewer/**"
      - "data/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate repository
        run: uv run --frozen make check

      - name: Build privacy-filtered static site
        run: uv run --frozen python scripts/build_pages_site.py

      - name: Configure GitHub Pages
        # Requires Pages to be enabled once in the repo settings
        # (Settings -> Pages -> Source: "GitHub Actions"); the Actions token
        # cannot create the Pages site itself.
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare the What's new notification
        # Compare the feed readers see now with the one about to be published and write
        # at most ONE summary notification (curated entries only). Needs no secrets; an
        # unreachable live feed means no notification, never the whole history.
        run: |
          mkdir -p push
          if curl -fsSL "${{ steps.pages.outputs.base_url }}/updates.json" -o push/live-updates.json; then
            python3 scripts/push_new_updates.py --old push/live-updates.json --new _site/updates.json --write push/payload.json
          else
            echo "Live feed unavailable; no notification will be sent."
          fi

      - name: Keep the notification for the deploy job
        if: hashFiles('push/payload.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: push-payload
          path: push/payload.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      # Optional: without these repository secrets the notification steps are skipped.
      NOTIFY_ENDPOINT: ${{ secrets.NOTIFY_ENDPOINT }}
      NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Fetch the notification sender
        if: env.NOTIFY_ENDPOINT != '' && env.NOTIFY_TOKEN != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/push_new_updates.py
          sparse-checkout-cone-mode: false

      - name: Fetch the prepared notification
        id: payload
        if: env.NOTIFY_ENDPOINT != '' && env.NOTIFY_TOKEN != ''
        # No artifact simply means there was nothing new to announce.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: push-payload
          path: push

      - name: Send the What's new notification
        # Only after the new site is live, so the tap opens the updated feed.
        if: env.NOTIFY_ENDPOINT != '' && env.NOTIFY_TOKEN != '' && steps.payload.outcome == 'success'
        run: python3 scripts/push_new_updates.py --send push/payload.json
