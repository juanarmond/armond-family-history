  ## RIO TRÊS — os Muniz, saídos do mar açoriano e do piso da escala social (Antenor Muniz)

  ### Um afogamento ao largo do Garajau — e uma terra que já se partia

  O terceiro rio nasce em uma ilha açoriana diferente — não a Terceira, mas **São Miguel**, na freguesia marítima de
  **Nossa Senhora da Mãe de Deus**, no distrito da Povoação, na ponta oriental e áspera da ilha: não fidalgos, não
  mercadores, mas pequenos camponeses lavradores de sua própria terra, *proprietários*, vivendo perto o bastante do mar
  para que o mar levasse o patriarca.

  **Manoel Muniz Bytancourt** foi batizado na Mãe de Deus em 17 de junho de 1821 e, em fevereiro de 1842, casou-se com
  **Francisca Roza do Espírito Santo** sob dispensa de *impedimento de consanguinidade de quarto grau* — eram primos de
  sangue, coisa corriqueira dentro de uma pequena freguesia insular onde todos eram aparentados a todos. O sobrenome dela
  vem do calendário dos santos, e não do pai, razão pela qual seu batismo não pode ser encontrado por nome nenhum. Em 24 de
  julho de 1866, por volta de uma hora da tarde, Manoel afogou-se: seu registro de óbito diz que morreu *"na bahia, fóra do
  Garajau,"* na baía além do Garajau, *"sem receber os Sacramentos,"* que **não fez testamento** e **deixou oito filhos**,
  morador da Lomba do Botão. Aos quarenta e cinco anos, a idade que seu batismo dá; o ato diz quarenta e seis.

  Escrevia-se que esta linhagem, ao contrário dos Armond, *nunca subiu e nunca caiu*. Os registros dizem o contrário: **a
  família já estava escorregando dentro dos Açores, antes que alguém atravessasse.** Os livros da Povoação não economizam
  títulos — chamam de *Capitão* uma simples testemunha de casamento — e, ao longo de uma dezena de atos que temos desta
  família, **nenhum Muniz Bytancourt recebe jamais um tratamento honorífico, e nenhuma mulher é escrita *Dona***. Os
  padrinhos dizem o mesmo: na casa acima de Manoel, **um único casal apadrinhou seis batismos consecutivos entre 1831 e
  1841**, e nunca aparece um capitão, um padre ou um *morgado*. O apadrinhamento era o modo português corrente de atar uma
  casa a um protetor; esta família só o usou de lado, parente com parente, que é o que se faz quando não há ninguém acima a
  quem alcançar. E então a aritmética morde, em plena luz do dia: seis anos depois de o pai morrer intestado, a filha
  Claudina, de dezesseis anos, casou-se com um ***sapateiro***, e seis anos depois Anna Maria, de vinte e três, casou-se
  com um ***pedreiro***. As filhas de um proprietário casaram com artesãos em doze anos, porque a casa já não tinha porção
  de terra que as emparelhasse a lavradores de terra própria.

  Por trás de Manoel a linhagem corre mais fundo, tudo em tinta paroquial primária de Ponta Delgada: seus pais **João
  Francisco Muniz Bitancourt** e **Maria Jacintha de Medeiros**, casados na Mãe de Deus em outubro de 1819, e acima deles o
  mais velho **Manoel Muniz Bitancourt × Tereza do Amaral** e **João de Medeiros Brandão × Maria Eugenia** — uma mulher a
  quem os registros não dão sobrenome algum. Com João de Medeiros Brandão, a cadeia mais profunda deste rio fica completa de
  ponta a ponta. O catálogo de Ponta Delgada lista um inventário de bens aberto em nome dele em **27 de janeiro de 1819**,
  com sua mulher **Maria Eugénia como *inventariante*** e o falecido morador na **Lomba do Botão**; não está digitalizado e
  este arquivo não tem imagem dele, de modo que temos a descrição do catálogo, não o registro. Nove meses depois, a filha
  dele casou-se com os Muniz proprietários; quarenta e sete anos mais tarde, o filho dela era o afogado na mesma Lomba do
  Botão, intestado, com oito filhos. Uma gleba entra no registro em 1819 e, em 1866, já não sustenta os filhos nascidos
  sobre ela. **A emigração açoriana nesta família não é um infortúnio; é aritmética.**

  ### A travessia — e dois Brandão que nunca devem ser fundidos

  O filho de Manoel e Francisca, **João Monis Bittencourt**, foi batizado em 1845 em ato conjunto; um irmão foi batizado no
  mesmo dia, mas não está legivelmente nomeado na página, e a leitura de que os dois eram gêmeos fica como pista. Sua
  travessia é mais estreita do que se dizia, e mais tardia. Os registros o fixam em São Miguel em 1845 pelo próprio batismo
  e no Brasil em 23 de dezembro de 1882, data da provisão de casamento de Sapucaia: **1866 × 1882**. O antigo "1866–1870,
  logo após a morte do pai" não se apoia em nada que tenhamos. Ele casou-se com cerca de **trinta e sete anos** e gerou o
  primeiro filho documentado aos trinta e nove, e um filho de camponês casa tão tarde quando passou os vinte sem meios de
  formar casa. Diz-se que um registro de passaportes de Ponta Delgada, não catalogado aqui, traz dois passaportes de
  **1880** para homens declarados filhos de João Moniz Bettencourt e Maria Jacinta da Povoação, provavelmente seus irmãos;
  não o vimos, então é pista — mas aponta para onde a vida dele aponta, para **cerca de 1880**.

  O que um imigrante sem bens tinha de comprar no Brasil era pertencimento. Casou-se com **Susanna Rita Brandão** (o
  registro escreve *Brondão* e a trata por *D. Suzana Rita*), nascida em 20 de agosto de 1865, filha de **José do Rego
  Brandão** e **Rita Ignacia de Jesus**. A certidão de batismo dela foi copiada no registro de Sapucaia em novembro de
  1882, dezesseis anos depois do ato, e líamos esse atraso como marcador de pobreza. A leitura institucional é melhor:
  **Sapucaia só foi erigida em freguesia em 1871**, de modo que uma criança batizada em 1866 o foi sob uma paróquia
  antecessora e, para casar na nova matriz, teve de apresentar certidão do ato anterior — uma divisa de paróquia mudando,
  não uma família descuidando dos papéis.

  Susanna não foi figurante. O **registro civil de nascimento de sua filha Ritta, de 1890, descreve os dois pais como
  *lavradores*** — o único registro deste ramo que dá a uma mulher ocupação diversa de *doméstica* — na **Conceição**,
  *"distante em duas leguas da Sede desta Cidade."* O mesmo assento diz que o escrivão lavrou o termo *"que commigo assigna
  o declarante"*: **João assinou de próprio punho**, tendo caminhado duas léguas para registrar um nascimento de oito dias,
  sob um registro civil tornado obrigatório apenas no ano anterior. Ela teve **onze filhos**, e sua morte está em um
  intervalo, não em uma data — viúva em setembro de 1915, já *falecida* quando sua filha Ana morreu em 1950.

  Uma coisa precisa ser dita com clareza, porque é uma armadilha para quem vier depois. **Há duas famílias Brandão
  inteiramente não relacionadas nesta descendência, e elas nunca devem ser fundidas**: os *Rego* Brandão de Susanna, do
  vale do Paraíba do Sul, e o bisavô do próprio marido, o *Medeiros* Brandão da Povoação. Nenhum registro os liga, e
  detinham capitais opostos — de um lado uma gleba dividida até o fim, do outro nenhuma propriedade e só pertencimento.

  João morreu em 12 de setembro de 1915 no Corrego do Boa Vista, em Carangola, aos sessenta e oito anos, em casa própria, o
  funeral pago *"ás expensas de sua Familia."* O ato o chama *"natural da Ilha de São Miguel"* setenta anos depois de ele
  ter nascido lá — e nomeia o pai dele como **"Manoel Luiz Bittencourt,"** o nome do meio errado, e **não nomeia a mãe dele
  em absoluto**. Trinta e cinco anos após a travessia, a família que informava o padre já não sabia declarar corretamente
  os próprios pais do emigrante. Nada atravessou senão o nome da ilha e o sobrenome, e o sobrenome seguiu se desfigurando.

  Os Brandão de Sapucaia pagam o mesmo preço em outra moeda. **José do Rego Brandão**, nascido por volta de 1833, era o
  chefe de casa assentado a quem os recém-chegados pediam para apadrinhar seus filhos; entre 1890 e 1898, já perto dos
  sessenta, seguiu os filhos casados para Carangola e chegou como estranho. Leia os sacramentos: seu sogro sepultado em
  Sapucaia em 1868 ***"sacramentado"***; sua mulher Rita morta em Carangola em 1898 com *"não procuraram Confissão"* contra
  seu nome; ele mesmo morto ali em 1912, aos setenta e nove, ***"sem sacramentos."*** Duas mortes dentro da igreja, duas
  fora, e a diferença é uma migração — não fé perdida, mas proximidade perdida, e posição perdida. **O enraizamento é o
  único capital que a herança partível não fragmenta, e o único que uma só mudança destrói.**

  ### Os pobres invisíveis — os Azevedo

  O filho de João e Susanna, **Deocleciano Muniz Bittencourt**, nascido em Sapucaia em junho de 1892 (o dia é leitura
  incerta; mês e ano estão claros), casou-se com **Luiza Fernandes de Azevedo** em Santa Luzia de Carangola em 21 de
  outubro de 1916 — no ato nº 35, sua irmã Joventina no ato nº 34, no mesmo dia e na mesma igreja.

  A linhagem de Luiza, os **Azevedo**, é o piso de toda a faixa de classe desta árvore, e seu ato de casamento é onde o
  silêncio se torna fato declarado. **Seu único dado de alfabetização é negativo**: ela *"não saber ler nem escrever"* e
  assinaram por ela ***a rogo***, enquanto Deocleciano assinou o próprio nome na mesma página. Onze ancestrais Azevedo,
  Brandão e Machado estão atrás dela e nenhum deixa assinatura em lugar algum. Seus pais eram **José Secundino de Azevedo**
  e **Thereza Fernandes de Azevedo**, e além de seus nomes quase nada sobrevive: nenhum registro de terra, nenhum
  inventário, nada num índice judicial mineiro de 144 comarcas, nem uma linha de jornal. O nome dele se desfigura em três
  dos quatro documentos que o trazem; o dela nunca — e foi a coincidência exata do nome *dela* em uma certidão de óbito de
  1975 que permitiu reconhecer uma irmã, Alcida, sessenta anos depois. Em uma família sem propriedade, o sobrenome da mãe
  faz o trabalho que uma escritura faz em outras.

  Duas afirmações antigas precisam ser retiradas. Dizia-se que uma irmã, **Gloria Lacerda de Azevedo**, morrera em Niterói
  em 1900, pondo a família na órbita do Rio uma geração antes; era um erro de leitura de índice. Gloria morreu em Niterói
  em 9 de maio de 1960 — registro que foi lido, mas que **não está catalogado neste arquivo** — e nenhuma presença da
  família no Rio antes de 1950 está documentada. E a insinuação de uma origem na **Madeira** pertence a uma homônima de
  Carangola, colateral e não ascendente; nada documenta origem insular para os Azevedo, e não inferimos nenhuma de um
  sobrenome. Os próprios pais de Secundino e de Thereza continuam um vazio.

  Mas a pobreza aqui é documentada, não afirmada, e funciona de modo diferente da açoriana. Onde os Muniz foram
  empobrecidos *pela* divisão, os Azevedo eram pobres de modo mais absoluto: nada foi diluído porque nada existia para
  diluir. E isso cortou para os dois lados. **Foi exatamente a falta de terra que tornou este ramo móvel** — uma casa sem
  terra nada perde ao partir. Em uma geração a viúva Thereza havia seguido a filha casada para o distrito de Carangola;
  duas outras filhas terminaram na região metropolitana do Rio, Gloria em Niterói em 1960 e Alcida na Baixada Fluminense em
  1975; e o próprio filho de Luiza morreria em uma cidade do aço.

  ### O inventário de Antenor — e o espelho do Rio Um

  O filho de Deocleciano e Luiza foi **Antenor Muniz**, nascido em 2 de novembro de 1923 no distrito de **Alvorada**, em
  Carangola, e documentado, em seu casamento com **Iris Bohrer** ali em 7 de dezembro de 1949, simplesmente como um homem
  *"da lavoura,"* da terra. E então ele a deixou. Sua certidão de óbito — 17 de outubro de 2014, em Volta Redonda, aos
  noventa anos — registra-o como ***bombeiro hidráulico***, residente no Monte Castelo, com cinco filhos maiores, e traz
  quatro palavras que viram este rio inteiro: ***"deixou bens a inventariar."***

  Esse é o **primeiro inventário documentado em toda esta linhagem desde 24 de julho de 1866**, quando seu trisavô se
  afogou na Lomba do Botão, intestado, com oito filhos. Entre essas datas estão três gerações — o emigrante, o *lavrador* e
  a própria juventude de Antenor — em que a família não é registrada em lugar nenhum como possuidora de coisa alguma. E o
  mecanismo não foi terra. Foi um ofício com um **salário** por baixo dele, em uma cidade construída a partir de 1941 em
  torno da Companhia Siderúrgica Nacional expressamente para comprar esse trabalho; a CLT, de 1943, deu ao salário um piso
  e um registro, e a partir dos anos 1960 o financiamento habitacional pôs a propriedade ao alcance de um homem de ofício.
  O salário de um bombeiro hidráulico numa cidade do aço fez, em uma vida de trabalho, o que um século de lavoura não
  fizera.

  Agora ponha isso ao lado do Rio Um, porque é a coisa mais forte que esta história inteira tem a dizer. **Os dois avôs de
  Juan morreram como homens de ofício em Volta Redonda.** Geraldo Paz Armond, *padeiro*, morreu ali em 1991, descendendo da
  terra dos Toledo — de Dona Mathilde Maria de Jesus, que comprou a Fazenda da Concórdia por inteiro em 1862, viúva, em seu
  próprio nome. Antenor Muniz, *bombeiro hidráulico*, morreu ali em 2014, **subindo** de uma pequena propriedade açoriana
  fragmentada e de duas gerações agrárias sem bens. A mesma cidade, o mesmo salário, a mesma cláusula em uma certidão de
  óbito, alcançados a partir de pontas opostas da escala social. **O arco Muniz inverte o arco Armond**, e onde os dois se
  cruzam há uma família.

  A aritmética por baixo dos dois é uma só. Os **oito** filhos de Mathilde resolveram-se, em seu título de 1879, em cerca
  de **trinta** pretendentes em um único passo, enquanto o inventário do marido dela ainda fazia audiências em 1889 —
  **vinte e dois anos** de litígio, com curadores e custas debitados dele todo o caminho. Em fevereiro de 1884 Simplício
  José Ferreira Armond peticionou ao juiz de órfãos para forçar a partilha, explicitamente não em seu benefício, mas porque
  tinha *"parentes colateraes em estado de indigencia."* Cinco anos após a morte de uma matriarca dona de fazenda, alguns
  de seus próprios descendentes estavam na indigência, e um membro da família o escreveu em folha selada diante de um juiz.
  Enquanto isso, na Povoação uma pequena propriedade se repartira em oito e em Carangola uma casa se repartiu em onze.
  Antenor deixou cinco. A sucessão partível é a condição contínua desta família, e ao longo de cinco gerações a única coisa
  que mudou foi o que havia para dividir.

  Ele é **"Antenor Muniz"** em toda fonte que temos; seu irmão Aristides manteve "Bittencourt," e nenhum registro nos diz
  que Antenor o portasse formalmente. Abandoná-lo foi assimilação comum em uma família sem título nem nome de fazenda
  pendurado no nome — e é a pequena mudança que tornou esta linhagem difícil de seguir de volta até uma freguesia de
  pescadores na ponta oriental de São Miguel. E com aquele casamento de 1949 chega o quarto rio — o que vem não das ilhas
  atlânticas, mas dos Alpes.

