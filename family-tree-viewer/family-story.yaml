  ## RIO QUATRO — os Bohrer, saídos da Suíça e da Alemanha (Iris Bohrer)

  ### Os lotes pedregosos de Nova Friburgo

  O quarto rio é o mais estranho de se encontrar na confluência, porque nasce em terras frias de montanha, a um mundo de
  distância dos Açores. Por um decreto de 16 de maio de 1818, o Rei João VI — a corte portuguesa então residente no Rio,
  tendo fugido de Napoleão — contratou o assentamento de cem famílias suíças católicas de agricultores nas terras altas
  acima do Rio de Janeiro, num lugar que batizaram de **Nova Friburgo**, em homenagem ao cantão de Fribourg. O empurrão
  do outro lado foi mais forte que o atrativo: o "Ano Sem Verão" de 1816 sobre a pobreza pós-napoleônica, e um Jura que
  dividia as terras entre os herdeiros até que os quinhões não alimentassem mais uma família. O recrutamento ultrapassou
  a meta e chegou a cerca de duzentas e sessenta famílias, aproximadamente um quarto dos colonos morreu no mar, e aos
  sobreviventes entregaram-se lotes pequenos, pedregosos e íngremes, deixando-os fazer deles fazendas.

  E o pacote pode agora ser precificado, o que muda toda a história dos colonos do Rei. A cada família prometia-se um
  lote e uma casa construída, rações, sementes e animais, e um subsídio diário de **0$160 caindo para 0$080 ao longo de
  um período de estabelecimento de dois anos** — cerca de **58$000 no primeiro ano, algo como um sétimo dos ~420$000
  anuais de um trabalhador rural livre**. É um piso construído de propósito bem baixo: o bastante para manter uma
  família viva enquanto desmatava uma encosta, e projetado para acabar. O plano entregou uma **posição de partida, não
  uma trajetória**, sem nada dentro dele que impedisse um ramo de estagnar enquanto outro subia.

  O quanto a alternativa em casa devia ser ruim mede-se pela decisão de um velho. **Johann Jacob Wehrli**, batizado em
  Grindel em 17 de janeiro de 1751, embarcou no *Heureux Voyage* aos **sessenta e oito anos** — uma fazenda do Jura em
  fragmentação, mas herdável, trocada por um subsídio temporário e um lote pobre. Estava morto em Nova Friburgo já em
  1827; sua mulher **Elisabetha Borer** seguiu-o em 1832, por um ato de óbito lido no registro paroquial mas ainda não
  catalogado neste acervo.

  Elisabetha fora batizada em Erschwil em junho de 1760, e o assento dela carrega o menor e mais agudo fato social da
  família. Seu pai está escrito "Joseph Borer *fusemnistr*" — um encargo de aldeia abreviado que **ninguém conseguiu
  decifrar até hoje**; *Feuersmeister*, um mestre do fogo, é um palpite sobre uma palavra meio legível e assim deve
  permanecer. Fosse o que fosse, era trabalho não remunerado numa comuna de algumas centenas de almas: prestígio sem
  renda alguma por baixo, exatamente o que desfaz os cargos dos Armond no Rio Um, três degraus abaixo na escada social.

  ### Dois Borer, um só navio

  Eis o fato que mais muda esta seção. **Havia duas famílias Borer inteiramente sem parentesco a bordo da mesma
  travessia**, e Iris descende de ambas — a linhagem do pai vem de uma, a da mãe vem da outra. **Laurent (Lorenz)
  Borer**, de Grindel, chegou em 1819 e casou-se com **Anna Maria Werhly** em julho de 1820; **Jacob Bohrer** casou-se
  com **Catharina Moser** em agosto de 1825, e o registro chama os cônjuges de "*ambos do Cantão de Soleure, colonos
  suiços*". Os dois atos nomeiam pais diferentes, de aldeias diferentes, de modo que os dois homens **não eram irmãos**,
  e a própria compilação da colônia afirma sem rodeios que não há evidência de parentesco próximo. Cuidado com outra
  armadilha: Jacob, o imigrante, e **Jacob Borer de Grindel**, pai de Laurent, são homens diferentes com nomes quase
  idênticos.

  Duas correções cabem aqui. A freguesia de batismo de Jacob é **Beinwil**, não Erschwil: o "Erswill" do registro é uma
  má leitura, e o Staatsarchiv Solothurn buscou por inteiro o acervo católico de Erschwil sem encontrar a família. Sua
  data de nascimento continua desconhecida — o 13 de dezembro de 1801 que circula vem de uma árvore colaborativa e não
  está provado. E sua mulher era uma **Moser**, não uma "Mayer": o próprio ato de casamento dela e o batismo do filho em
  1832 escrevem ambos Moser e nomeiam seu pai José Moser, ao passo que "Mayer" sobrevive apenas num testamento ditado
  sessenta e três anos depois, sobre uma mãe havia muito falecida.

  Casar dentro da colônia comprava pertencimento, não propriedade. Os Wehrli tinham o mesmo pacote magro que Laurent, e
  a distribuição era **por família e fixa**: ele não recebeu lote próprio, mudou-se para a Casa 73 / Lote 86, a alocação
  que aquela casa já tinha, de modo que casar dentro da colônia acrescentava bocas a um único terreno pobre, e não terra
  nova. A pressão é legível numa única página do livro de casamentos de 1820 — a entrada 37 é a irmã de Anna Maria,
  Salomea, casando-se com Luiz Nicolão Vilette, com **Lourenço Borer como testemunha**, e a entrada 38 é o próprio
  casamento de Laurent. No Rio Um, casar-se para dentro significava casar-se com as terras dos Toledo; aqui significava
  um lugar à mesma mesa.

  Então os ramos divergem, em lotes vizinhos, em duas gerações. Em outubro de 1891, **Valentim Martinho Bohrer**, neto
  de Laurent, registra o nascimento da filha em São José do Ribeirão como *lavrador* — e o ato se encerra com o escrivão
  assinando "*a rogo do declarante por não saber escrever*". Três anos antes, no outro ramo, **Francisco José Bohrer**
  havia **assinado o próprio testamento**. Mesmo navio, mesmo decreto, mesmo piso pedregoso; um lavrador analfabeto e um
  testador que assina de próprio punho, na mesma geração. A variável não foi a origem, e sim se um ramo alcançou o
  comércio da vila ou ficou na terra que se fragmentava.

  ### O único momento de terra, e quanto ele valia

  Francisco José — nascido em 9 de julho de 1832, o que corrige em cinco dias o "4 de julho" da compilação impressa — é
  o ponto mais alto de todo o rio, e vale precificá-lo para que sua pequenez se faça sentir. Morreu no Alto da Serra em
  julho de 1888, aos cinquenta e seis anos, deixando um testamento registrado com testamenteiros, vinte missas por seus
  pais e um legado de **50$000 às obras da Capela de Santo Antonio**: cerca de **um oitavo do ano de um trabalhador, e
  da ordem de um vigésimo do que custava um adulto escravizado** naquelas décadas. O testamento dispõe de "*meus bens*"
  sem nomear **nenhum lote, nenhuma casa, nenhuma loja — e nenhuma pessoa escravizada**. Um testamento não deve
  inventário algum, de modo que o silêncio nada prova sozinho; mas foi ditado meses antes da Abolição, e nenhum registro
  guardado neste acervo nomeia uma pessoa escravizada em qualquer casa Bohrer, Lemos ou Silva-Ferreira. Depois a
  aritmética fechou a porta: dividido em quatro desde o início entre quatro herdeiros, com a *meação* da viúva mantendo
  metade fora do alcance deles por **mais trinta e um anos**, e a essa altura o primogênito já havia morrido. O único
  momento de terra nunca rendeu juros.

  A mulher dele também precisa de correção. **Rosa Eugenia de Lemos**, batizada em Itaboraí em outubro de 1835, é em
  geral contada como um romance — o casal que esperou vinte anos por um casamento. A *justificação* de 1879 lê-se melhor
  como um **ato de espólio**: o casamento fora celebrado em Itaboraí, em casa particular, e não fora lançado em livro
  paroquial nenhum, e uma sentença judicial mandou o vigário de Nova Friburgo abrir o assento. As testemunhas depuseram
  que ele durava "*a mais de vinte annos*" — leitura incerta, que colocaria o casamento por volta de 1858. A união era,
  portanto, socialmente completa e **documentalmente invisível por cerca de duas décadas**, e foi regularizada **nove
  anos antes do testamento**: o papel foi feito quando havia herdeiros e um espólio a garantir. O ato não declara motivo
  algum, de modo que esta é a leitura econômica, não uma leitura provada. O prestígio dela era real e inteiramente de
  posição — nomeada **primeira *testamenteira* e *tutora***, à frente do próprio irmão dela, tratada por "*Exma. Sra. D.
  Roza Bohrer*" pelo semanário da vila, e levada, em sua morte em 1919, ao sepultamento pela **Irmandade do
  Sacramento**. Sepultamento por irmandade leiga era uma respeitabilidade assinada: prestígio pago por mensalidade,
  porque terra custa uma fortuna.

  Em torno deles casou-se a outra leva da colônia, e convém ser exato sobre qual. **Carolina Klein**, que se casou com
  Valentim em novembro de 1890, aos dezessete anos, era filha dos colonos luteranos Jacob Klein e Maria Luiza Schenkel,
  e seu ato de casamento registra que ela havia primeiro "*abjurado o protestantismo … e recebido o baptismo*",
  licenciada verbalmente pelo pai. Os dela vieram com a **leva alemã de 1824**, não com a colônia suíça de 1819; alguns
  resumos de arquivo ainda os rotulam de "colônia suíça", e estão errados. Os Rutschmann vieram por outro caminho ainda,
  saídos de Bulle, no cantão de Fribourg, e a **Elisabeth Storck**, nascida na Alemanha, está registrada apenas como
  "*nascida e baptizada na Allemanha*" — em nível de país, e nada mais fino. De várias dessas pessoas é tudo o que
  temos: Heinrich Schenkel é um *Kirchenvorsteher* numa linha de um registro, Anna Clara Storck são quatro palavras,
  "*Anna Clara já fallecida*". Onde uma pessoa é pouco mais que um nome, esta história diz isso, em vez de inventar-lhe
  uma vida.

  O platô, quando veio, gastou-se dentro de uma geração. O filho de Francisco José, **Joaquim José Bohrer** — ausente de
  duas genealogias impressas de colonos, recuperado apenas porque o testamento do pai o nomeia primogênito —, mantinha
  uma venda de fundo de mato; seu irmão **Guilherme Samuel Bohrer**, tratado por Capitão, era dono do semanário
  friburguense *A Sentinella*, fundado em 30 de setembro de 1894. Um jornal e uma loja, sem cargo assalariado por baixo:
  a mesma fragilidade do Rio Um, alcançada de baixo para cima em vez de cima para baixo.

  ### Uma assinatura, e três óbitos sem nada a inventariar

  A alfabetização chegou numa única geração, e o momento é visível. Valentim não sabia escrever em 1891. Em 1923 e 1924
  seu filho **João Gonçalves Bohrer** entra sozinho no cartório de São João Baptista, declara o nascimento dos filhos —
  a família então morando no "*kilometro cento e dois*", endereço dado como uma distância ao longo de uma estrada, que é
  o que um sítio sem nome parece num registro — e **assina os assentos**. Uma competência adquirida, não um bem herdado,
  que é exatamente o tipo de ganho que uma família sem capital consegue fazer. (Seu próprio nascimento continua sem
  registro em mãos; um índice de nomes localiza um batismo em 1894 em São José do Ribeirão, mas isso é uma pista.)

  Então a experiência do espólio se faz sozinha. João Gonçalves morreu em 3 de agosto de 1970 no **Hospital da C.S.N.**,
  o hospital da própria Companhia Siderúrgica Nacional em Volta Redonda, *comerciante*, e seu registro diz que ele
  "*deixou bens a inventariar*" — havia algo a inventariar. Sete anos depois, sua viúva Celina, *costureira*, morreu, e
  o dela diz "**não deixou bens nem testamento**". Uma casa de catorze ou quinze filhos depois, nada restava a
  registrar; o ato dele conta *quinze filhos* e o dela *quatorze*, e ambos os números são preservados.

  Uma dessas filhas, nascida em 27 de fevereiro de 1929 em Presidente Soares, no Alto Jequitibá de Minas Gerais, foi
  **Iris Bohrer** — a avó materna de Juan, a foz do rio suíço-alpino. Ela era Bohrer dos dois lados, os dois troncos de
  Solothurn reencontrando-se cerca de cento e dez anos depois do desembarque, no fundo de ambas as trajetórias. Casou-se
  com Antenor Muniz em Alvorada, em dezembro de 1949 — o último acontecimento desta linhagem a se dar no campo — e
  morreu em Volta Redonda em julho de 2021, aos noventa e dois anos, registrada como *pensionista* e sem deixar bens a
  inventariar. **Três registros de óbito consecutivos sem espólio**: não uma fortuna perdida, mas a prova documentada de
  que nunca houve nesta linhagem capital herdável a perder. O que fecha o arco não é propriedade, e sim uma pensão — o
  Estado ocupando o lugar da herança que nunca veio. Mobilidade ascendente a partir de um piso tão baixo que só podia
  subir: esse é o arco dos Bohrer, a imagem espelhada da queda dos Armond.

  ---

  ## A CONFLUÊNCIA — onde quatro rios se tornam uma família

  Agora traga os rios até o ponto em que se encontram, e veja como a geografia se aperta.

  Cada uma das quatro linhas, vindas da Terceira, de Portugal continental, de São Miguel e do Jura suíço, atravessa a *mesma faixa de
  floresta brasileira* — a **Zona da Mata Mineira**, a fronteira cafeeira do século XIX que se abriu quando a antiga
  proibição da Coroa de povoar os "Sertões do Leste" finalmente caducou e a floresta virgem fértil, perto do mercado
  exportador do Rio, atraiu famílias de todas as direções. Os Armond e os Toledo *desceram* para ela das terras altas
  do ouro esgotadas (Leopoldina, Muriaé, Argirita). Os Muniz e os Bohrer *subiram* para ela do litoral e da colônia
  (Carangola, Presidente Soares). Os Guimarães e os Engrácio seguiram o comércio até ela (Carangola, Alvorada). A
  fronteira do café não é um cenário de fundo desta família; é o chão literal em que os quatro riachos separados
  correram pela primeira vez para o mesmo vale.

  E então o ponto se estreita quase além do crível. De todas as cidades daquela floresta imensa, **os dois casais de
  avós de Juan se ligam a um mesmo minúsculo distrito de Carangola: Alvorada.** Cidalia Engrácio Guimarães *nasceu* em
  Alvorada, em 1930. Antenor Muniz foi lavrador em Alvorada antes que a cidade o levasse. Iris Bohrer *casou-se* com
  Antenor em Alvorada, em 1949. Três dos quatro rios tocam fisicamente o mesmo ponto no mapa. Este é o fato geográfico
  mais nítido de todo o acervo: o funil improvável que tirou pessoas de penhascos açorianos, de encostas suíças e de
  vilas de mercado portuguesas e as depositou, a uma ou duas gerações de distância uma da outra, nas mesmas poucas
  ruas da Zona da Mata.

  Depois o século XX os separa outra vez — e, ao fazê-lo, os une para sempre. Getúlio Vargas decretou a primeira
  grande siderúrgica do Brasil, a **Companhia Siderúrgica Nacional**, em 1941, e a sonolenta cidade leiteira de
  **Volta Redonda** explodiu de menos de três mil habitantes para quase trinta e seis mil em 1950, uma cidade do aço
  planejada que sugava mão de obra de todo o entorno mineiro e do vale do Paraíba. A quebra do café havia esvaziado o
  campo; a herança partível havia fragmentado a terra que existia; a cidade do aço recolheu os pedaços e fez deles uma
  classe trabalhadora.

  E aqui os documentos entregam a simetria mais nítida de todo o arquivo, embora ela precise ser dita com precisão.
  **Dois homens desta família foram trabalhadores de ofício em Volta Redonda, e chegaram lá de direções opostas.**
  *Descendo* vinha **Aristão Ferreira Armond** — em 1931 uma autoridade policial de distrito em Muriaé, nomeado pelo
  diário oficial do estado; em 1º de novembro de 1957 registrado *"de profissão padeiro"*, morto aos setenta e oito
  anos em Volta Redonda. Toda a queda de uma linha que tivera nomeações judiciais e se casara com a Concórdia se
  completa dentro da vida de um só homem, no espaço de vinte e seis anos. *Subindo* vinha **Antenor Muniz** — um
  **bombeiro hidráulico** e o primeiro homem de sua linha desde 1866 cujo registro de óbito diz *"deixou bens a
  inventariar"*. Uma família passou cerca de quarenta anos dissolvendo um único inventário nos tribunais. A outra
  passou oitenta anos sem inventário algum e então, numa cidade do aço, finalmente teve um.

  O próprio avô de Juan, **Geraldo Paz Armond**, levou o ofício do pai, mas não o endereço do pai: os registros põem
  sua vida laboral adulta em **Irajá**, na Zona Norte do Rio, e não na cidade do aço. Volta Redonda foi para onde se
  mudou tarde e onde morreu, em 1991 — de modo que o laço da família com a cidade da usina passa pelos anos de
  trabalho do pai e pelos últimos anos dele próprio, fato mais discreto do que uma história bem-arrumada gostaria, e
  o verdadeiro. Duas gerações consecutivas de padeiros Armond é o achado; uma dinastia da cidade do aço, não.

  É essa a confluência, dita com a precisão que os registros permitem: não duas famílias encontrando-se num mesmo
  nível, mas dois movimentos opostos que se cruzam. A linha que caía e a linha que subia passaram pela mesma faixa de
  salário, na mesma cidade, na mesma década — e só porque passaram foi possível que seus filhos se casassem.

  Desse cruzamento saem os dois casamentos que fazem os pais de Juan. Do lado paterno, **Geraldo Paz Armond casou-se
  com Cidália Engrácio Guimarães** em Eugenópolis, em 31 de maio de 1952 — a linha Armond-Toledo em queda unida aos
  Guimarães, cuja posição os registros situam abaixo do que a memória familiar supõe, e aos Engrácio do comércio. Do lado materno, **Antenor Muniz casou-se com Iris Bohrer** em
  Alvorada, em 7 de dezembro de 1949 — a linha camponesa plana de São Miguel, com os Azevedo quase invisíveis
  embutidos nela, unida aos Bohrer colonos suíços em ascensão. Dois vetores de cada lado; dois casamentos; e seus
  filhos — o pai de Juan, **Luis Carlos**, filho de Geraldo e Cidalia; a mãe de Juan, **Lucinea**, filha de Antenor e
  Iris, ambos vivos e por isso aqui apenas esboçados — são os dois canais pelos quais os quatro rios, por fim, correm
  para um só leito.

  E esse leito é Juan.

  ---

  ## O SIGNIFICADO — por que teve de ser uma convergência, não uma linhagem

  Afaste-se das cenas individuais e a forma da resposta fica clara. Juan não descendeu de *um* povo. Ele é o ponto em
  que vários povos muito diferentes, movendo-se por razões inteiramente alheias entre si, acabaram por se cruzar.

  Veja o que precisava ser verdade. Uma linha luso-açoriana com oficiais, nomeações judiciais e uma fazenda escravista
  ao seu alcance precisava *cair* — por renda de ofício não herdável, herança partível, colapso do café e urbanização
  — até um padeiro numa cidade do aço. Uma linha de colonos suíços e alemães pobríssimos precisava *subir* — dos lotes
  pedregosos de Nova Friburgo, com um subsídio que valia cerca de um sétimo do salário de um trabalhador rural — pela
  lavoura colonial e pelo pequeno comércio até um comerciante naquela mesma cidade do aço. Uma linha camponesa de São
  Miguel precisava manter-se *plana*, nunca subindo e nunca caindo, de um pescador afogado a um lavrador em Alvorada,
  carregando consigo um fio Azevedo quase invisível — e então, numa última geração, inclinar-se para cima. E uma linha
  comercial de imigrante português precisava atravessar o Atlântico, ocupar um lugar modesto na fronteira do café e
  acomodar-se num comércio urbano modesto. Duas dessas trajetórias sobem, uma desce, uma se mantém nivelada e depois
  se levanta — e só poderiam produzir Juan se *todas chegassem ao mesmo nível de classe, no mesmo lugar, no mesmo
  tempo*. A linha que caía tinha de cair exatamente o quanto a linha que subia subiu. A aritmética de classe de quatro
  séculos separados tinha de somar um único número. E somou.

  Vale nomear os fios condutores, porque reaparecem em linhas que nunca se conheceram.

  **A migração** é o motor constante — a fome de terra açoriana e o chamado do ouro; a emigração portuguesa; a colônia
  suíça do Rei; a fronteira do café; a cidade do aço de Vargas. Todo ancestral deste livro é, em algum momento, alguém
  que deixa um lugar que não podia sustentá-lo. A medida dessa pressão é a decisão de um velho: Johann Jacob Wehrli
  embarcou para o Brasil aos **sessenta e oito anos**.

  **O ofício não é um patrimônio — e essa lição se repete em todos os degraus da escada.** É a coisa mais aguda que os
  documentos nos ensinaram. Simplício José Ferreira Armond parece, à primeira vista, um homem de posição: *arbitrador*
  judicial, *curador*, *delegado* de Muriaé, alfabetizado, credor, homem que sediou uma partilha de terras em sua
  própria casa. No entanto seu posto de *suplente de delegado* era **não remunerado** — um *cargo gratuito* pela Lei
  nº 261/1841 — e ele nunca foi o titular, mas segundo ou terceiro substituto. Seus papéis de *arbitrador* e *curador*
  pagavam apenas custas por diligência, que terminavam com a nomeação e não passavam a herdeiro nenhum. Seu neto era
  padeiro. E então, três degraus abaixo na escala social e a um oceano de distância, o mesmo padrão: Joseph Borer, um
  aldeão suíço, exercia um encargo paroquial que o registro grafa *"fusemnistr"* — palavra que ainda não conseguimos
  decifrar — e que conferia posição e nenhuma renda. Posição sem base salarial não sobrevive a quem a detém. Nunca
  sobreviveu, em altitude alguma.

  **Terra dividida é terra dissolvida.** Os Toledo, que tinham terra herdável, dissolveram-se mais devagar que os
  Armond, que tinham sobretudo ofício — mas ambos se dissolveram, porque um espólio repartido igualmente entre todos
  os filhos não sobrevive intacto a duas gerações. A aritmética está nos fólios, não em nossa inferência: os oito
  herdeiros de Mathilde tornaram-se cerca de trinta pretendentes; um inventário foi litigado por vinte e dois anos; aos
  herdeiros de Simplício couberam *frações do valor* de uma casa, de um moinho, de um paiol, de meio engenho. E a
  fragmentação começa antes da travessia do oceano — Manoel Muniz Bytancourt morreu intestado com oito filhos em São
  Miguel, e suas filhas casaram-se com um sapateiro e um pedreiro. A família já escorregava quando emigrou. A
  emigração foi a consequência, não a causa.

  **A instrução é o que de fato se transmitiu — e tinha de ser comprada de novo a cada geração.** Não era pública nem
  herdável. Veja-a aparecer e desaparecer pelo arquivo: Luiza Fernandes de Azevedo assinando *a rogo*, pela mão de
  outro; Valentim Martinho Bohrer registrado como *lavrador* que "não sabia escrever", enquanto seus primos da outra
  família Borer assinavam os próprios testamentos; João Gonçalves Bohrer assinando o próprio nome uma geração depois;
  a filha de Simplício assinando a própria certidão de casamento na casa do pai, em 1894 — e casando-se com um
  *lavrador* de todo modo, porque só a instrução não era escada. Num ramo, a escolaridade reentrou na família não por
  herança, mas por casamento, quando um homem se casou com uma *professora*.

  E a pura **amplitude de classe** é espantosa para uma só pessoa conter: oficiais, uma nomeação judicial e dez
  pessoas escravizadas avaliadas em três quintos de um espólio numa ponta; os Azevedo pobres que quase não deixaram
  papel algum, e um pescador que se afogou sem os sacramentos, na outra. Juan é a confluência não só de continentes,
  mas de quase toda a escala social de um mundo colonial e imperial.

  Uma última coisa pertence ao significado, porque é parte do que este arquivo *é*. Esta história já esteve errada, e
  ela o diz. No curso de uma única passagem pelos documentos verificou-se que um prenome "comprovado" pertencia a
  outro homem inteiramente; que um nascimento "corrigido" para outubro estava certo da primeira vez, em novembro,
  porque o "9br" de um escrivão quer dizer *Novembris* e não o nono mês; que uma mulher registrada aqui por anos como
  Catharina Mayer assinou o próprio casamento como Catharina **Moser**; que a Fazenda da Concórdia, tratada por muito
  tempo como o solar ancestral da família, foi na verdade comprada em 1862 e vendida até 1880. Nada disso é vergonhoso.
  É a diferença entre uma história de família e uma lenda de família. A lenda fica mais arrumada com o tempo; a
  história fica mais exata, o que muitas vezes quer dizer menos arrumada. Cada correção acima está registrada neste
  arquivo, com o documento que a impôs.

  Foi assim que todas essas pessoas, de países diferentes e séculos diferentes, acabaram como uma só pessoa. Não por
  uma única linhagem correndo firme, mas por uma convergência — centenas de ancestrais nas ilhas atlânticas, em
  Portugal continental, nas terras altas suíças e alemãs e por toda a fronteira brasileira, escoando pelo país do café
  e pela cidade do aço até que, num nível operário comum em Minas e no Rio de meados do século, os quatro rios se
  encontraram. A macro-história fez a montagem. Os documentos nos deixam assistir.

  ---

  ## Os fios ainda sendo puxados — a história não terminou

  Esta é uma história verdadeira, mas *aberta*. Vários dos rios ainda desaparecem sob a terra antes que possamos
  segui-los até a nascente, e cada uma dessas lacunas é um registro real, em algum lugar do mundo, ainda não em nossas
  mãos. Também fazem parte da história — são as perguntas que a família continua a fazer.

  1. **Os pais de Simplício — a pedra angular.** Quem era o pai de Simplício José Ferreira Armond? Até que se saiba,
     todo o tronco terceirense — Gaspar, Margarida, a tradição Ermonde/Drummond — é ascendência *possível* mas *não
     comprovada* de Juan, e tudo de grandioso que há nele precisa ser lido sob essa luz. O registro decisivo é o
     casamento de Simplício com Eliza, por volta de 1868–72, em Argirita / Bom Jesus do Rio Pardo, nunca microfilmado,
     à espera no arquivo arquidiocesano de Juiz de Fora. É o documento ausente mais valioso de toda a árvore.

  2. **Os dois Gaspares.** O Gaspar Ferreira brasileiro e o Gaspar de Souto-Maior terceirense que se casou com
     Margarida das Candeias e morreu em 1727 são um só homem que emigrou, ou dois homens separados por uma geração? A
     genealogia compilada lista apenas um. Resolver isso desloca cada ancestral terceirense uma geração para cima ou
     para baixo, e por isso o arquivo mantém a pergunta aberta em vez de arriscar um palpite.

  3. **O teto na Terceira.** O batismo, o casamento e o sepultamento de Belchior da Ponte Cardoso e os batismos de sete
     de seus filhos são hoje registros paroquiais primários em nossas mãos — o ponto documentado mais profundo da
     família. Mas tudo *acima* dos pais de sua mulher repousa numa única genealogia compilada, Mendes Forjaz, sem
     registro por trás. Duas buscas delimitadas explicam por quê: o livro de batismos de Santa Bárbara de 1610–1650
     simplesmente não está no arquivo digital, e o ato de casamento de 1598 foi localizado mas está ilegível por dano.
     Restam três ganhos baratos — dois sepultamentos que devem estar num livro já em mãos, uma cláusula numa página que
     vale reescanear e um capítulo da compilação que ainda não obtivemos.

  4. **Os pais açorianos de Francisca Roza.** Seu próprio batismo é um vazio delimitado nos livros sobreviventes de Mãe
     de Deus — nasceu antes de 1818, em registros ainda não digitalizados em Ponta Delgada. O rio de São Miguel corre
     uma geração além do que conseguimos ver.

  5. **Todo o ramo Paz.** Liliosa Paz Armond está comprovada como pessoa e comprovadamente faleceu em Eugenópolis em
     1946, mas seus pais — a família Paz inteira — são desconhecidos. Sua certidão de óbito de 1946 abriria a linha de
     uma só vez.

  6. **Os avós Azevedo.** Os pais de José Secundino e de Thereza Fernandes de Azevedo são um vazio total — um par
     inteiro de ancestrais de Juan na ponta mais pobre da árvore. O registro de óbito de sua filha Gloria, em Niterói
     em 1960, foi lido mas ainda não está catalogado aqui, e é exatamente o tipo de lacuna que se fecha rápido quando
     alguém volta para buscar a imagem.

  7. **A origem Guimarães em Portugal.** Vicente José de Carvalho Guimarães consta apenas como *natural de Portugal*;
     nenhum registro nomeia ainda sua freguesia. E a própria vila por onde a família passou está em questão — o
     registro de lugar deste arquivo põe a "Vila do Rio Claro" no estado do Rio de Janeiro, enquanto a trilha de
     pesquisa há muito supõe Rio Claro, em São Paulo. Isso está sem solução, e muda a forma da migração.

  8. **O batismo suíço de Jacob Borer.** O registro de casamento de 1825 em Nova Friburgo nomeia sua freguesia de
     origem como "Erswill", por muito tempo desdobrada como Erschwil — até que o Staatsarchiv Solothurn buscou
     integralmente nos livros católicos de Erschwil e não encontrou família alguma assim. A leitura é **Beinwil**, e o
     batismo em si continua não recuperado; a data hoje em circulação vem de uma árvore colaborativa, não de um livro.

  Além destes, cerca de dezessete retratos de ancestrais apoiam-se hoje em documentos que foram lidos mas ainda não
  catalogados formalmente neste arquivo — atos de óbito, comparecimentos em juízo, uma nota de gazeta. Cada um é um
  registro real que alguém já teve nas mãos. Trazê-los para dentro é o trabalho mais próximo e mais certo que resta.

  Os quatro rios estão mapeados quase até as nascentes. Várias das fontes seguem escondidas. Quando vierem à
  superfície — e neste tipo de trabalho elas vêm, à medida que arquivos se digitalizam, cartas são respondidas e
  certidões chegam — esta história ganhará outro capítulo, mais acima na corrente, ainda mais perto do começo de como
  Juan veio a ser.

  ---

  *Uma síntese narrativa sobre os registros documentados da família — não inventa nada e não substitui nada. Cada cena repousa numa fonte disponível neste arquivo; onde algo é inferido, tradicional ou ainda ausente, o texto o diz no momento. Pessoas vivas aparecem apenas pelo primeiro nome.*
