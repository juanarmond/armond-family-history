  ## Prólogo — a aritmética de uma única pessoa

  Conte para trás e os números ficam estranhos. Você tem dois pais, quatro avós, oito bisavós,
  dezesseis na geração anterior a essa. Continue e, quando chegar às pessoas que atravessaram oceanos — a
  geração que desembarcou de navios de madeira na areia brasileira nos anos 1700 e 1800 —, a linha já se abriu
  em leque, espalhando-se em centenas de vidas separadas, vividas em ilhas, em vales de montanha e em cidades de
  floresta que ainda não haviam sido abertas em meio às árvores. Nenhuma delas conhecia as outras. O filho órfão de um pedreiro suíço nas encostas do Jura
  não tinha razão alguma para jamais ouvir o nome de uma mulher que afogava seus rosários nas igrejas de uma pequena freguesia
  pesqueira açoriana; a família de um oficial português nas terras altas do ouro de Minas não tinha como imaginar uma família de
  colonos de fala alemã desbravando lotes pedregosos na Serra dos Órgãos. E, no entanto, cada uma dessas vidas separadas caminhava, sem
  saber, rumo ao mesmo ponto. Esse ponto é você.

  Esta é a história de como quatro rios — quatro avós, e as centenas de ancestrais que se afunilam por trás de cada
  um deles — encontraram seu caminho até uma única confluência. Dois dos rios nascem nas ilhas atlânticas e em Portugal continental — num dos casos,
  ainda não sabemos exatamente onde; um nasce nos cantões alpinos da Suíça e num campo alemão que os registros nomeiam apenas como *Allemanha*; todos os quatro correm até a mesma
  faixa de floresta brasileira no século dezenove, a fronteira do café da Zona da Mata Mineira, e são então
  dispersados de novo por uma cidade siderúrgica do século vinte. Onde finalmente se trançam é em Juan Armond. Vamos subir
  cada rio até sua nascente, e depois descer de volta.

  ---

  ## RIO UM — os Armond e os Toledo, saídos da Terceira e das terras altas do ouro (Geraldo Paz Armond)

  ### Uma casa numa ilha pequena

  Comece na Ilha Terceira, nos Açores, em meados do século dezessete — uma ilha vulcânica e verde no meio do
  Atlântico, vivendo do trigo enviado a Portugal continental, do corante azul *pastel*, do vinho e da madeira de
  navio, com sua cidade episcopal de Angra logo abaixo, um dos grandes portos de escala onde as frotas da Índia e do
  Brasil, no regresso, faziam água e se consertavam. Na freguesia rural de **São Sebastião**, em ou por volta de 9 de
  janeiro de 1615, um menino foi levado à pia e inscrito no livro como **Belchior da Ponte Cardoso**. Temos essa
  página. O assento tem poucas linhas e nomeia os pais dele — *"Belchior fo[i filho] a Manoell de Ponte e de sua
  molher Maria da Cota"* — e é por causa dessa única cláusula que **Manuel da Ponte Cardoso** e **Maria da Costa
  Leonardes** estão nesta árvore pela palavra de um sacerdote contemporâneo, e não pela reconstrução de ninguém. Uma
  genealogia impressa lhe dá o sobrenome "Valadão"; nenhum registro que temos o faz, e este arquivo carregou esse nome
  emprestado para ele até setembro de 2026, quando a leitura conjunta do batismo do filho e do seu próprio assento de
  óbito resolveu a questão. Ele era um Ponte Cardoso, como o filho.

  A vida dele está delimitada por dois registros originais separados por setenta e dois anos, o que é raro em todo
  este arquivo. Em 26 de setembro de 1650 ele casou-se com **Mariana Fagundes** em **Santa Bárbara das Nove
  Ribeiras**, a freguesia dela, no extremo oposto da ilha, seguindo o costume corrente de casar onde morava a noiva;
  essa página também sobrevive, manchada de água e com a tinta traspassada, e a cláusula que nomearia o pai dela
  degradou-se até virar um palpite entre colchetes. Os batismos de sete dos filhos do casal estão guardados como
  imagens — quinze anos da vida de uma casa num só registro, de Maria em setembro de 1651 a Isabel de Souto-Maior em
  setembro de 1666. Os registros nunca se decidem sobre como grafar esta gente; Mariana aparece uma vez, no limite
  extremo do ouvido de um escrivão cansado, simplesmente como "morsarana". Os sobrenomes ainda eram fluidos.

  Ela foi sepultada em 7 de julho de 1684, e seu assento é extraordinariamente preciso quanto ao lugar em que a
  puseram: *"sepultura da fabrica, segunda fiada nona"* — a nona cova da segunda fileira das covas da própria fábrica
  da paróquia, **dentro da igreja**. Sepultar-se no corpo da igreja era um privilégio pago, e é o único sinal de
  posição que o registro lhe dá em nome próprio; tudo o mais que diz dela é que era mulher de Belchior da Ponte. Três
  anos depois ele foi sepultado no mesmo livro, e é o seu próprio assento de óbito — não uma compilação — que lhe dá a
  patente: **Alferes de ordenanças**, alferes da milícia da freguesia. Guarde essa palavra, porque ela explica três
  séculos desta família. As *ordenanças* eram o escalão mais baixo da organização militar portuguesa, uma reserva
  territorial levantada freguesia por freguesia e oficializada por chefes de casa locais **sem remuneração**. O pai de
  Mariana, **António Martins Fagundes**, é registrado como *Capitão* dessa milícia, e o avô dela, **Pedro Lourenço
  Machado**, é creditado com uma companhia de setenta e nove homens na operação que rendeu por fome a guarnição
  castelhana do Castelo de São Filipe, acima de Angra, em 1642. Três gerações dentro da camada de oficiais de uma só
  ilha, e nenhuma dessas patentes pagava salário nem passava a um filho. Uma família assim transmite precedência e
  expectativa, não capital — exatamente o mecanismo que desfará seus descendentes no Brasil dois séculos depois.

  Seja claro quanto ao que de fato temos. O batismo, o casamento e o sepultamento de Belchior, e os batismos de sete
  de seus filhos, são **registros paroquiais originais neste arquivo**. Dos pais de Mariana para cima — **António
  Martins Fagundes** e **Catarina Machado de Faria**, e **Pedro Lourenço Machado** e **Maria Fernandes da Costa**, que
  casaram em Santa Bárbara em junho de 1598 — tudo repousa numa única genealogia compilada do século vinte, as
  *Genealogias da Ilha Terceira* de Mendes Forjaz, e em mais nada. As datas dele são exatas ao dia, portanto tinha à
  frente livros paroquiais a que não chegamos: uma pista forte, não uma prova. O assento de 1598 foi de fato
  localizado nas páginas certas do livro certo e ainda assim não se consegue ler, vencido pelo dano — uma leitura
  falhada, não uma ausência. E nada concede a esta gente armas, morgadio ou título; "Souto-Maior" e "Ponte Cardoso"
  ambos *parecem* de armas, e isso não é evidência de nada. Na linha modelada, Belchior e Mariana são os
  **octavós de Juan** — nove gerações acima dele —, os pais de ambos os seus nonavós, e Pedro Lourenço e Maria
  Fernandes os seus decavós: graus tão firmes apenas quanto o seu elo mais fraco, e o elo mais fraco é justamente o
  passo seguinte.

  ### Os dois Gaspares

  Belchior e Mariana tiveram um filho chamado Gaspar — a casa tirava os nomes dos meninos dos três Reis Magos, com
  Baltazar, Belchior e Gaspar reaparecendo pela linha como um refrão. Pela conta compilada, **Gaspar de Souto-Maior**
  foi batizado em São Sebastião em fevereiro de 1657, tornou-se *Capitão de ordenanças*, casou com **D. Margarida
  Machado** na igreja do Convento da Graça, em Angra, em 2 de outubro de 1690, e morreu na Terceira em 2 de dezembro
  de 1727. Nenhum desses três assentos está entre as páginas que guardamos; são do compilador, não nossos.

  E aí o compilador faz algo maravilhoso. Tendo registrado o casamento de 1690, ele se recusa a levar os filhos do
  casal adiante sob o nome do pai, mandando-os para outra secção da própria obra — *"por ter preferido os apelidos
  maternos"*. É desse repasse que sai o sobrenome da família: uma casa terceirense cujos filhos tomaram o nome da mãe
  em vez do do pai. A secção a que ele remete tem por título **Drummond**, e o nome levado ao Brasil — *Ermonde*,
  *Armonde*, por fim **Armond** — é geralmente tido como o abrandamento português dele: da Escócia à Madeira, aos
  Açores, ao Atlântico. É a mais antiga e mais romântica história que a família possui, e a honestidade exige duas
  admissões no mesmo sopro. Nunca lemos essa secção Drummond. E nenhum batismo, e certamente nenhum Y-DNA, prova o
  salto escocês.

  Agora o nó. O registro brasileiro mais antigo desta linha é uma única cláusula num fólio de tinta traspassada: o
  assento de casamento de 1783, em Barbacena, de Joaquim José Ferreira de Toledo, *"filho legítimo de Gaspar Ferreira
  e de Gertrudes Maria [de Toledo], de [Villa] Rica."* É tudo o que temos de **Gaspar Ferreira** — um nome, o nome de
  uma mulher e uma família assentada em Villa Rica, a capital do ouro. A pesquisa que recuperou os registros da
  Terceira propôs que ele e o Gaspar de Souto-Maior da ilha são um só homem, que atravessou e mudou o nome que usava.
  A proposta se quebra na própria aritmética: um homem que morreu na Terceira em 1727 não pode ser pai de alguém que
  se casou em Minas Gerais em 1783. Ou as datas compiladas pertencem a outra pessoa, ou o Gaspar brasileiro é filho ou
  neto do da ilha, ou simplesmente dois homens partilham um nome muito comum. Não sabemos; o arquivo mantém as duas
  leituras ao mesmo tempo em vez de arrumar uma delas para fora; e todo grau contado acima pende desse passo não
  provado.

  ### A estrada do ouro e os Armonde de Barbacena

  O que não está em dúvida é que uma família chamada **Ferreira Armonde** estava no terreno das terras altas mineiras.
  O arquivo guarda papéis coloniais de terra que os nomeiam — uma sesmaria de 1791 a José Ferreira Armonde tendo o
  **Alferes Francisco Ferreira Armonde** registrado como seu confrontante ao norte, uma concessão de 1792/94 a
  Marianno José Ferreira Armonde na **Borda do Campo**, uma queixa de 1805 movida pelo Capitão José Ferreira Armonde
  contra o juiz local por causa da soltura de um preso. Proprietários Armonde vizinhos uns dos outros, com patentes e
  tudo, no *Campo das Vertentes* das terras altas, ao longo do **Caminho Novo** — a estrada real aberta a golpes desde
  o Rio de Janeiro até as minas e transitável por tropas de mulas em 1707, por onde o ouro descia ao porto e por onde
  tudo o mais era carregado. Ao longo dela cresceu **Barbacena**, primeiro uma grande fazenda chamada Fazenda da Borda
  do Campo.

  Uma tese de doutorado sobre essa família, guardada aqui como pista e não como evidência, estuda-a de 1751 a 1850: um
  patriarca açoriano, Francisco Ferreira Armonde, morto em 1751 na Borda do Campo; um domicílio da lista nominativa de
  Barbacena de 1831 com sessenta e seis pessoas escravizadas; um monte-mor de cerca de **321:751$000** na partilha de
  1845; e acima disso a pequena aristocracia do Império — um **Barão de Pitangui**, um **Conde de Prados**, padres da
  família no vicariato de Barbacena. Um clã real, documentado e rico, e **nada neste arquivo o liga a Juan**. A tese
  até fornece o aviso mais afiado do dossiê: aquela família de Barbacena tinha o seu próprio **Simplício José Ferreira
  Armonde**, *Juiz de Paz*, com quarenta e seis anos em 1831 e já falecido na partilha de 1845 — um homônimo, e
  demonstravelmente não o nosso. A grandeza é uma possibilidade, claramente marcada como tal. Não é uma herança, e não
  é um fato.

  ### A lacuna no coração da árvore

  O próprio ancestral Armond direto de Juan, **Simplício José Ferreira Armond**, não pode ser colocado na linha
  titulada nem em nenhuma outra. A busca em jornais e inventários foi levada à exaustão e ele não aparece em lugar
  nenhum acima de si mesmo. É, por toda a evidência, um Armond real, carregando o sobrenome paterno pela linha do
  próprio pai — numa certidão de herdeiros de 1881 em que todo herdeiro Toledo carrega um sobrenome Toledo, só ele
  assina "Ferreira Armond" — mas **de quem era filho não conseguimos dizer**. O documento que nomearia seus pais, o
  casamento com Eliza por volta de 1868–72 na pequena freguesia cafeeira de **Argirita / Bom Jesus do Rio Pardo**,
  nunca foi microfilmado; aguarda no Arquivo Histórico Arquidiocesano de Juiz de Fora, em algum lugar de uma longa
  fila. O mais provável é que seja uma lacuna de registros e não uma ocultação: um chefe de casa letrado em quem os
  juízes confiavam não era homem cuja filiação fosse segredo em vida. Mas quando seu filho morreu, em 1957, a própria
  família já a tinha perdido — esse assento de óbito dá as naturalidades de Simplício e de Eliza como *"Ignorado."* O
  silêncio contra o qual trabalhamos já estava dentro de casa.

  ### O próprio Simplício — posição que era função, não patrimônio

  O que de fato sabemos dele é vívido, e mais afiado agora do que a família costumava contar. Viveu toda a sua vida
  documentada, de cerca de 1875 a cerca de 1919, nas cidades cafeeiras da Zona da Mata — Leopoldina, Muriaé, Argirita.
  Era **letrado** num mundo em sua maior parte analfabeto, e sua letra sobrevive em exatamente um lugar: uma petição
  de fevereiro de 1884 ao juiz de órfãos, encerrada com *"Simplicio Joze Ferr.a Armond. Estou sciente."* Nela pede ao
  juízo que pare de atrasar a partilha do espólio da avó de sua mulher, dizendo que, por seu próprio interesse, nada
  pediria, mas que tem *"parentes colateraes em estado de indigencia"* a quem o recebimento das quotas aliviaria. Um
  homem da classe proprietária escrevendo, de próprio punho, que seus parentes passam fome enquanto o espólio dorme no
  juízo.

  Sua posição pública era real, e era **não remunerada**. O jornal oficial do estado de 28 de julho de 1899 o faz *2.º
  suplente do subdelegado* do distrito de Boa Família, em Muriaé; o ato de 10 de setembro de 1902 o faz *3.º suplente
  do delegado de polícia* de São Paulo do Muriaé. Segundo suplente, depois terceiro suplente — **nunca o titular** —
  escalado para servir só quando chamado, em postos que eram *cargos gratuitos*, honoríficos e sem salário, sob o
  sistema de delegados da Lei nº 261 de 1841. A família por muito tempo o lembrou como *arbitrador* e *curador* de
  juízo, avaliador juramentado de espólios e tutor; isso ainda pode se confirmar, mas hoje repousa num papel notarial
  de terceiros guardado aqui apenas como contexto e num inventário não catalogado, de modo que é uma pista, não um
  fato — e, mesmo que se confirme, aquilo eram custas por diligência cobradas a um único espólio, terminando com a
  nomeação. O que ele tinha era pessoal e local. Em 1894 sua filha Aristides casou-se *"em casa de residencia do
  cidadão Simplicio José Ferreira Armand"* — os oficiais foram até a casa dele — e a mesma certidão marca o teto
  disso: a noiva de dezenove anos é lançada como *do serviço domestico* e casa com um *lavrador* de vinte e quatro
  anos, um agricultor que trabalha a terra.

  Esta é a espinha analítica de todo o arco Armond. **Cargos são função, não patrimônio.** São renda — no caso dele,
  nem isso — enquanto se os detém; não se dividem entre herdeiros e morrem com o homem. A terra na casa de Simplício
  era de sua mulher, obtida por casamento e não herdada, e se ele era um Armond natural ou colateral, não herdou coisa
  alguma do tronco de Barbacena. A queda da família nunca foi uma fortuna perdida nem um escândalo. Foi aritmética — e
  do lado de sua mulher podemos ver a aritmética sendo feita.

  ### A gente de Eliza — uma fazenda de uma geração de profundidade

  **Eliza Balbina de Toledo** é a dobradiça deste rio: a linha Armond termina em seu marido, de modo que todo
  ancestral documentado acima dele chega por ela. A ascendência de papel desta família é materna. Ela nasceu numa casa
  cafeeira escravocrata em funcionamento, num distrito que em 1883 carregava a segunda maior população escravizada de
  todas as Minas Gerais, e o peso disso tem de ser dito com franqueza: a terra que a família de Juan um dia deteve foi
  trabalhada por pessoas escravizadas, e a riqueza era riqueza do café.

  Mas não era terra ancestral, e a história vinha sendo contada errado. A **Fazenda da Concórdia** entra no registro
  em abril de 1856 não como o espólio de um homem, mas como uma posse de 200 alqueires declarada sob a Lei de Terras
  pelo pai de Eliza, **José Cezário de Toledo Lima**, *"por minha Mãe, irmãos e cunhados"* — pela mãe, pelos irmãos e
  pelos cunhados juntos, um **bem comum indiviso da família desde seu primeiro registro legal**. Foi *comprada*, de
  fato, só em **2 de agosto de 1862**, pela mãe dele já viúva, **Mathilde Maria de Jesus**, de um terceiro de outra
  província, por seis contos, e ela a comprou *"por si como meeira, e também como inventariante e cabeça do casal, em
  nome de todos seus filhos"* — uma viúva agindo pelos filhos. Carregava, desde setembro de 1859, uma dívida
  hipotecária de **3:885$000 a um por cento ao mês**, devida a Francisco Leocádio de Toledo, ele mesmo copossuidor
  declarado da mesma fazenda: o capital estava alavancado, e alavancado *dentro da família*. Em 1877 um conjunto de
  netos Toledo já vendia *"duas sortes de terras de cultura em commum na Fazenda da Concordia"*, vários deles
  assinando de São João del-Rei e do Rio de Janeiro. E por volta de **1879–80 a fazenda foi vendida para fora da
  família de vez**, no inventário de Mathilde. De uma posse declarada a uma venda forçada, a presença Toledo na
  Concórdia durou menos de um quarto de século. Uma geração de profundidade.

  O pai de Eliza é o primeiro Toledo em quatro gerações documentadas **sem cargo algum** — nenhuma patente, nenhuma
  função de juízo, nada além de propriedade. Seu inventário de 1867 é a janela mais clara que o arquivo tem sobre o
  que era, de fato, a riqueza desta família: cerca de 32.000 pés de café, uma casa de morada, um *paiol*, um
  *engenho*, uma *casa de negócio* na estrada, gado e animais de carga, um relógio de ouro e uma dúzia de talheres de
  prata — e **dez pessoas escravizadas avaliadas em 11:300$000, cerca de três quintos de todo o espólio, enquanto a
  terra nua foi avaliada em 75$000**. O registro as nomeia, então nós as nomeamos: Lucas, Pedro e Luiza, lançados *de
  nação*, nascidos na África; Miguel, Thobias, Benedicto, Faustina, Virgiliana, Joana e Eugenio, lançados *crioulo* e
  *crioula*, nascidos no Brasil. Cinco dos dez eram crianças de quatorze anos ou menos, e lançado sem cerimônia entre
  os bens da casa, por 4$000, está *"um tronco para prisão, de ferro e algemas"*. É isso que "os Toledo proprietários"
  significa nos números do próprio espólio: não principalmente imóveis, mas uma classe de ativos que o Estado
  brasileiro extinguiu sem indenização com a Lei Áurea de 1888.

  Agora acompanhe a aritmética. A **herança partilhável** dividia todo espólio brasileiro igualmente entre todos os
  filhos, e esta família era prolífica — treze filhos na geração dos bisavós de Eliza, oito na seguinte, nove na
  seguinte ainda. Quando a quota dela finalmente veio, veio como **frações literais de coisas**. A folha de pagamento,
  datada de cerca de 1919, a atribui através do marido — expressamente *"casado com Dona Eliza Balbina de Tollêdo"*,
  por direito da mulher, já que a lei do século dezenove fazia do marido o ator jurídico dos bens de uma mulher casada
  — não como propriedade, mas como quotas de valor: *"na casa de morada, sómente"* **72$910**; no *paiol* **9$113**;
  no *moinho* **3$645**; nas metades de um *engenho* e de um *ventilador* **14$582**; em 3.388 ares de *matta virgem*
  **51$037**; e nas *capoeiras* uma cifra gasta, lida como 50$546 ou 508$546, ilegível. Medido pelo parâmetro da
  própria família — uma pessoa escravizada avaliada em 1867 entre 800$000 e 1:700$000 — mesmo a leitura mais generosa
  de todo esse quinhão vale menos que o mais barato dos seres humanos que aquele espólio havia detido. E chegou
  tarde. A avó morreu por volta de 1880; os herdeiros foram listados em 1881; Simplício ainda peticionava em 1884; a
  folha é de cerca de 1919. **Uns quarenta anos em inventário**, atravessando 1888, de modo que as pessoas
  escravizadas que os espólios indivisos ainda contavam como ativos deixaram de ser propriedade enquanto os herdeiros
  esperavam. Capital congelado por quatro décadas não financia escola, nem terra, nem começo de vida; Marfiza, Aristão
  e Aristides já tinham feito seus casamentos e suas vidas muito antes de ela ser paga.

  Eliza não está entre os vendedores de 1877; sua quota ficou travada no espólio indiviso até o fim. **Nenhuma
  assinatura dela sobrevive em parte alguma deste arquivo**, e sua propriedade deixou rastro apenas em nome do marido
  — que é também por que os escrivães nunca fixaram seu nome: Eliza Balbina de Toledo, Elisa Balbina de Jesus, Eliza
  Ferreira Armand, Eliza Ferreira Toledo, quatro formas de uma só mulher ao longo de sessenta anos. Sua alfabetização
  é intestável a partir do que temos; essa é a pegada de uma mulher cujos atos jurídicos eram praticados por outrem,
  não uma evidência sobre ela. As mulheres em torno dela sabiam escrever. Sua mãe, **Claudina Brandina de Jesus**,
  viúva e juramentada como *cabeça-de-casal* de toda a fazenda, assinou suas próprias declarações em 1867, e é o
  juramento *dela* que pôs a hipoteca e a morte do marido no registro. A escolaridade no Brasil imperial era uma
  compra feita filho por filho, e podia falhar dentro de uma mesma casa.

  Um colateral completa o quadro, e ele está mais atrás do que a própria história que a família conta de sua queda.
  **António Ladislão de Toledo**, tio de Eliza, lançado como *"surdo e mudo"* em 1867 e obrigado a agir por procurador
  porque não podia jurar nem assinar, é registrado em sua morte, em 11 de fevereiro de 1909, como **carpinteiro**,
  morrendo na Fazenda da Concórdia — em terra que sua família havia vendido trinta anos antes. Um herdeiro daquele
  espólio que viveu de um ofício. A descida ao trabalho manual não começa com um padeiro urbano nos anos 1940; começa
  duas gerações antes, dentro da própria casa proprietária, empurrando membros isolados para fora da borda de baixo um
  a um enquanto a família como um todo ainda se dizia proprietária. E o ofício dele era a única coisa que alguém de
  sua geração detinha que não podia ser dividida entre herdeiros, hipotecada dentro da família, ou extinta por lei.

  Por trás de Eliza a linha remonta, sobre registros primários guardados, às terras altas do ouro do século dezoito e
  Atlântico afora. Seu bisavô **Capitão Joaquim José Ferreira de Toledo**, assentado na **Fazenda Cascalhaes**, no
  termo de Barbacena, é registrado *morador na Villa Rica* em seu casamento de 1783 — ainda que mesmo essa expressão
  seja uma leitura entre colchetes num fólio danificado — e sua patente de milícia, como toda patente neste rio, era
  uma honra não remunerada apoiada em terra. Acima dele há apenas aquela única cláusula: Gaspar Ferreira, e
  **Gertrudes Maria de Toledo**, de quem desce todo o nome "de Toledo", pois o marido era só "Ferreira". Numa família
  em que todo bem material se revelou divisível, abolível ou intransferível, a herança durável acabou sendo um
  sobrenome — e ele veio por uma mulher. A esposa dele, **Ritta Angélica Rodrigues**, foi batizada em março de 1764 na
  **Capela de São José do Ribeirão**, e esse assento nomeia o pai dela, **João Rodrigues do Valle**, como *"natural da
  freguesia de São Martinho de Ruivães, Arcebispado de Braga"* — um homem do Minho, do canto mais fragmentado em
  terras de Portugal e a maior fonte isolada da emigração setecentista para o Brasil. Essa origem sobrevive apenas
  porque um vigário, ao escrever o casamento dos pais em 1751, o chamou erradamente de homem da freguesia e corrigiu-se
  à margem. Outro quarto da ascendência de Eliza, a linha **Silva-Xavier**, trança na história homens imigrantes do
  Minho que casaram com mulheres coloniais paulistas e cavalgaram a fronteira do ouro e do gado desde Goiás até
  Barbacena, onde um batismo de 1795 os encontra estabelecidos ao lado dos Armond. Assim, mesmo antes de os quatro
  rios se encontrarem no Brasil, este já é em si uma confluência: os Açores, o Minho e a São Paulo colonial, nas
  terras altas do ouro.

  ### Aristão, Liliosa, e o vazio chamado Paz

  Na ponta moderna está **Aristão Ferreira Armond**, nascido por volta de 1879 em algum lugar de Minas Gerais — a
  atribuição a Piacatuba, mantida por muito tempo, é hoje duvidosa, e as pistas apontam antes para Rio Pardo da
  Leopoldina e Argirita. É a geração em que a posição de classe de fato muda, e os registros nos deixam ver isso
  acontecer. Ao longo de 1903, 1917 e 1922 ele ainda está dentro do mundo jurídico dos proprietários de Muriaé:
  testemunha de uma escritura de hipoteca; depois credor no espólio de um morto, recebendo **18$584** num rateio entre
  credores que o espólio não podia satisfazer por inteiro; depois requerente num inventário. Em agosto de 1931 o
  jornal oficial do estado o nomeia **subdelegado de polícia** do distrito da Limeira, depois de sua filiação, em
  abril daquele ano, ao núcleo pró-Vargas da Legião de Outubro do mesmo distrito — apadrinhamento em vez de carreira
  e, como os postos do pai, um *cargo gratuito* que nada pagava. É a última aparição documentada de autoridade Armond
  em qualquer lugar. E na mesma vida, ao morrer em 1º de novembro de 1957 em **Volta Redonda**, com setenta e oito
  anos, ele é registrado *"de profissão padeiro"*. De autoridade policial de distrito a padeiro em vinte e seis anos,
  dentro da vida de um só homem, com o óbito declarado não por um parente, mas por um comerciário agindo *"no
  impedimento ocasional de membros da família do falecido."*

  Ele casou-se com **Liliosa Paz Armond**, e aqui o rio entra na areia: toda a família **Paz** é um vazio. Liliosa é
  firmemente real — nascida em Eugenópolis, na Mata, *"nascida aqui"* como diz a certidão de casamento do filho,
  morta ali em 16 de abril de 1946, o nome datilografado de modo inconfundível num registro de 1973 do serviço de
  habilitação da Guanabara referente a seu filho José Olavo — mas seus pais são desconhecidos, e seu **silêncio
  documental é ele próprio uma peça de evidência**. Ponha-a ao lado da sogra, Eliza, que emerge numa certidão de
  herdeiros de 1879, numa partilha de 1881, numa petição de 1884 e numa folha de pagamento de 1919 justamente porque
  tinha propriedade a dividir. Liliosa não aparece em inventário algum, em registro de terra algum, em nada além das
  certidões de seus descendentes — e uma mulher que não deixa rastro de espólio é uma mulher sem nada a dividir. Duas
  mulheres numa mesma família, a uma geração de distância, com pegadas de arquivo opostas: esse contraste é o
  enunciado mais econômico de onde a descendência Armond havia chegado. O registro que abriria sua linha, sua certidão
  de óbito de 1946 em Eugenópolis, seria também o primeiro documento feito sobre ela em nome próprio, e ainda não foi
  recuperado.

  O filho deles, **Geraldo Paz Armond**, nasceu em 30 de janeiro de 1915 em Limeira, na Mata, e foi registrado
  **padeiro**, como o pai, ao casar-se em 1952 — assinando de próprio punho. Ele e a mulher viveram a vida de trabalho
  em **Irajá**, na Zona Norte do Rio de Janeiro, e não na cidade do aço; Volta Redonda veio tarde, e é onde ele
  morreu, em 18 de fevereiro de 1991, no Hospital Santa Margarida, com setenta e seis anos, aposentado. Três gerações
  cabem numa só palavra, *padeiro*, e atrás dela está toda a descida: os cargos de um avô que nada pagavam, a terra de
  uma avó que chegou em frações quarenta anos atrasada, uma economia cafeeira que desabou, e uma família que se
  urbanizou — o que, no Brasil do século vinte, significava chegar à cidade como assalariado sem terra. E, ainda
  assim, seu assento de óbito diz que ele **deixou testamento e bens a inventariar**. Não uma fazenda: o espólio de um
  homem que trabalhava, construído a partir de um salário e não recebido de ninguém. Onde a posição de seus
  antepassados vinha de honras que nada pagavam e de terra que chegava em pedaços, o que Geraldo deixou veio do
  trabalho — e isso, não a Concórdia e não o Conde de Prados, é a base que a família de fato guardou.

  Em 31 de maio de 1952, em Eugenópolis, ele havia se casado com **Cidália Engrácio Guimarães**. E com esse casamento,
  um segundo rio junta-se ao primeiro.

  ---

  ## RIO DOIS — os Guimarães e os Engrácio, saídos de Portugal pela via do comércio (Cidalia Engrácio Guimarães)

  Este é o rio que nos pede para abrir mão da versão confortável da história do imigrante. A memória da família o manda
  para o Minho; os documentos só dizem *Portugal*, e situam a família bem mais abaixo do que a memória supõe.

  ### O homem registrado em uma palavra

  **Vicente José de Carvalho Guimarães** repousa sobre uma única palavra em um único ato. No registro coletivo de
  nascimento de seus netos, de 12 de outubro de 1915, ele é *portuguez*, e nada mais: nenhum distrito, nenhum
  município, nenhuma freguesia. Ele não aparece em nenhum outro documento que este acervo guarde. "Guimarães" é um
  topônimo do norte de Portugal, mas a regra de trabalho desta família é que um sobrenome não é uma origem, e aqui a
  regra morde o próprio dono. **Não sabemos de onde em Portugal ele veio.**

  Até o lugar onde ele parou se bifurca. Casou-se com **Maria Tertuliana da Conceição**, dada nesse mesmo ato como
  *natural da Villa do Rio Claro*. A trilha de pesquisa lê isso como **Rio Claro, São Paulo**, cidade cafeeira do
  Oeste Paulista cheia de europeus recém-chegados; já o registro de lugar deste próprio acervo situa uma Vila do Rio
  Claro no estado do **Rio de Janeiro**. Ninguém conciliou as duas leituras, e a diferença muda a migração: uma coloca
  Vicente dentro do grande fluxo imigrante para o planalto cafeeiro paulista, a outra transforma a mudança posterior
  para Carangola em um salto curto e local. Um terceiro ato embaralha ainda mais — em 1964 um filho da geração
  seguinte morreu no Paraná e o declarante afirmou que seus pais eram *"ambos naturais do Estado de Minas Gerais"*,
  contra a declaração do próprio Francisco, em 1915, de que nascera na Villa do Rio Claro. A declaração mais antiga
  prevalece; a de 1964 fica anotada, não explicada.

  Os dois morreram *na cidade do Carangola* — na cidade, e não na terra que o filho lavrava — e nenhum documento dá a
  Vicente ocupação ou propriedade alguma. Emigrar é, na prática, renunciar a uma herança: esta linhagem começa no
  Brasil do zero.

  ### Francisco, que era lavrador

  Seu filho **Francisco José de Carvalho Guimarães** foi por muito tempo o ponto alto desta história, e as evidências
  já não sustentam a promoção. A patente de Alferes atribuída a ele vem de uma relação transcrita da Guarda Nacional
  de 1897, sem nenhum documento primário por trás — e o único documento que temos em mãos puxa duas vezes para o outro
  lado. Em 12 de outubro de 1915 ele registrou **os seis filhos de uma só vez**, nenhum deles registrado ao nascer, o
  mais velho com **catorze anos de atraso**, sob um decreto de anistia que enfim tornou isso possível: um domicílio
  fora da malha administrativa, não um homem que ocupasse cargo dentro dela. E suas testemunhas eram homens do pequeno
  comércio — **José Guida, *commerciante***, e **Joaquim Ferreira de Mello, *official de pharmacia*** — nenhum
  fazendeiro, nenhum padre, nenhum outro oficial. A única posição que qualquer documento em mãos lhe dá é a de
  ***lavrador***; o ato chama a ele e a **Emmerenciana Maria de Jesus** conjuntamente de *lavradores*, razão pela qual
  ela entra no acervo como trabalhadora da terra, e não como "do lar". O que Francisco comprovadamente era é um
  lavrador alfabetizado com um círculo social de cidade pequena.

  Os pais da própria Emmerenciana são as pessoas mais singelas deste livro. **Antonio Francisco da Silva** e **Maria
  Paula de Jesus** eram *naturaes deste districto* — São Francisco do Glória — e esse distrito é toda a geografia que
  deles se registrou. **Não deixaram patrimônio algum**, e é exatamente por isso que a partilha igualitária nunca
  operou sobre eles: nada a dividir, nenhum *inventário* a abrir, nenhum papel produzido. A pobreza deles é a
  conclusão, não uma lacuna da pesquisa — e sem aquela única ida de Francisco ao cartório em 1915, quatro ancestrais
  de Juan não teriam deixado rastro nenhum.

  Os desfechos dos netos deles não são suaves. **José Sobrinho** morreu lavrador na fronteira cafeeira do norte do
  Paraná em 1964, com onze filhos adultos e *"não tem bens a inventariar."* **Sebastião** morreu em Jacarezinho em
  1982, solteiro, ainda lavrador, morador do **Asilo São Vicente de Paula** — o asilo de indigentes — e *"não deixa
  bens"*. Só **João José**, morto em Volta Redonda em 1992, deixou *"bens a inventariar"*, entre uns catorze filhos.
  Seis herdeiros, depois onze e catorze: nenhuma posse modesta sobrevive duas vezes a essa aritmética.

  ### Os Engrácio: letras no lugar da terra

  O comércio que dá nome a este rio vem do outro lado do casamento. **Antonio Engracio de Souza** aparece por si mesmo
  na **lista eleitoral senatorial de 1898** de São Francisco da Glória como eleitor admitido — o que prova menos do que
  parece. A Constituição republicana de 1891 **aboliu a antiga exigência de renda** e manteve apenas a barreira da
  alfabetização, de modo que seu voto prova um cidadão, homem e adulto, **que sabia ler e escrever**, e nada
  absolutamente sobre propriedade. Nenhum documento em mãos o mostra possuindo bem algum.

  A cena mais nítida do acervo corrobora essa alfabetização. Em uma **procuração de 1917** em São Francisco do Glória
  ele assina o próprio nome como testemunha, no mesmo instrumento cujo outorgante *"declarou não saber ler nem
  escrever."* Ser o homem que assina pelo homem que não pode é uma medida exata de uma posição. Onde estava o dinheiro
  dele é mais nebuloso: surge como *credor* em um inventário de Muriaé de 1903 e em uma partilha de bens de 1909,
  ambos lidos em busca de texto completo, e não em imagens que tenhamos. Se isso se sustentar, sua riqueza era
  **crédito, e não terra** — e crédito não deixa título nem inventário, razão pela qual ele é visível nos espólios dos
  outros e em nenhum próprio. Sua mulher, **Luzia Pinheiro da Conceição**, só é nomeada por outras pessoas: os atos
  que geravam documentos no Brasil dela estavam fechados a uma mulher casada sem nada em nome próprio, de modo que a
  invisibilidade dela é um fato sobre o acervo, não sobre ela.

  ### A mudança tardia, e o que desceu o rio

  **Antonio Engracio Filho**, nascido em 15 de junho de 1894 em Minas Gerais, casou-se com a filha de Francisco,
  **Maria Aurora Guimarães** — uma família de lavradores sem base hereditária unida a uma família de comércio com
  letras e balcão. Ele era ***negociante***, e seu ato de óbito de 1964 emparelha esse ofício com *"não deixou
  bens"*: a terra se fragmenta, mas o comércio evapora quando o homem morre. Seu prenome, além de *Antonio Engracio*,
  não está estabelecido, e o filho adulto que declarou sua morte está marcado neste acervo como possivelmente vivo;
  não é nomeado aqui.

  A mudança para o Rio foi tardia — mais tardia do que esta história costumava dizer. Três documentos a fixam:
  Alvorada, Carangola, em setembro de 1930, onde ele declarou o nascimento da filha; ele e Maria Aurora ainda
  *"residente nesta cidade"* — **Eugenópolis, Minas Gerais** — na certidão de casamento dessa filha, em **maio de
  1952**; e **Pavuna**, na borda norte do Rio, quando ele morreu em junho de 1964. A casa deixou Minas entre **1952 e
  1964**, quando ele já tinha **entre cinquenta e oito e setenta anos**. Não é um jovem negociante atrás de mercado;
  encaixa-se tão bem em uma família seguindo os filhos adultos para a cidade quanto em comércio, e nenhum documento
  declara um motivo. Maria Aurora foi com ele aos quarenta e oito ou mais e morreu aos oitenta e sete em um hospital
  do Rio, em 1991, *"do lar"*, *"não deixou bens"* — uma mulher do interior que chegou tarde à capital, perdeu o
  marido poucos anos depois e ainda viveu sozinha ali por mais vinte e sete.

  Então, o que desceu por este rio? Patrimônio, não: **nenhuma pessoa dele está documentada possuindo coisa alguma**,
  de Vicente no alto a Cidalia embaixo. O que desceu foi a alfabetização, rastreável por **três gerações Engrácio** —
  um pai que assinou em 1917, um filho que precisava ler e calcular para tocar uma loja, um neto registrado no
  comércio — num tempo em que escola era privilégio comprado, recomprado a cada geração. Posta ao lado da metade
  Guimarães do mesmo casamento, em que dois cunhados lavradores morreram sem nada e um consta como não eleitor em
  1982, a diferença dentro de uma só casa é forte.

  E a linha das mulheres se curva em vez de subir — um **U**. Emmerenciana está dentro do coletivo *lavradores* de um
  domicílio: trabalho de roça não remunerado. Maria Aurora é *"do lar"*, sem nenhum papel econômico registrado, tendo
  a urbanização tirado o trabalho da roça antes de substituí-lo. A filha dela — nascida em Alvorada em **15 de
  setembro de 1930** e registrada pelo pai no mesmo dia, numa família que um dia deixara seis filhos sem registro por
  catorze anos — é **Cidalia Engracio Guimarães**, cuja certidão de óbito de 2023 a chama de ***costureira
  aposentada*** e marca *"Eleitor: Sim"*: um ofício e uma aposentadoria em nome próprio, a primeira mulher desta
  linhagem com uma renda que o Estado reconheceu como dela. Foram três gerações e uma mudança para uma cidade
  industrial até chegar ali. Casou-se com Geraldo Paz Armond em Eugenópolis em 31 de maio de 1952 e morreu em Volta
  Redonda em 2023, aos noventa e dois, sem deixar — como os dois pais — bens a inventariar. Guarde esse local de
  nascimento, Alvorada; ele está prestes a se tornar o ponto agudo de toda a história.

