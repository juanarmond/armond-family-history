en: |-
  ## Prologue — the arithmetic of a single person

  Count backwards and the numbers turn strange. You have two parents, four grandparents, eight great-grandparents,
  sixteen the generation before that. Keep going and by the time you reach the people who crossed oceans — the
  generation that stepped off wooden ships onto Brazilian sand in the 1700s and 1800s — the line has fanned out
  into hundreds of separate lives, lived on islands and in mountain valleys and in forest towns that had not yet
  been cut out of the trees. None of them knew the others. A Swiss stonemason's orphaned son in the Jura foothills
  had no reason ever to hear the name of a woman drowning her rosaries in the churches of a small Azorean fishing
  parish; a Portuguese officer's family in the gold highlands of Minas had no way of imagining a German-speaking
  colonist family clearing stony lots in the Serra dos Órgãos. And yet every one of those separate lives was, without
  knowing it, walking toward the same point. That point is you.

  This is the story of how four rivers — four grandparents, and the hundreds of ancestors funnelling down behind each
  of them — found their way to a single confluence. Two of the rivers rise in the Atlantic islands and in mainland Portugal —
  where exactly, in one case, we still do not know; one rises in the Alpine cantons of Switzerland and in a German countryside the records name only as *Allemanha*; all four run down into the same
  strip of Brazilian forest in the nineteenth century, the coffee frontier of the Zona da Mata Mineira, and are then
  scattered again by a twentieth-century steel town. Where they finally braid together is Juan Armond. Let us travel
  up each river to its source, and then come back down.

  ---

  ## RIVER ONE — the Armond and the Toledo, out of Terceira and the gold highlands (Geraldo Paz Armond)

  ### A house on a small island

  Begin on the Ilha Terceira, in the Azores, in the middle of the seventeenth century — a green volcanic island in the
  mid-Atlantic, living on wheat sent to mainland Portugal, on the blue dye *pastel*, on wine and ship's timber, its
  bishop's city of Angra one of the great ports of call where the returning India and Brazil fleets watered and
  refitted. In the rural parish of **São Sebastião**, on or about 9 January 1615, a boy was carried to the font and
  written into the book as **Belchior da Ponte Cardoso**. We have that page. The act is a few lines long and it names
  his parents — *"Belchior fo[i filho] a Manoell de Ponte e de sua molher Maria da Cota"* — and that one clause is why
  **Manuel da Ponte Cardoso** and **Maria da Costa Leonardes** stand in this tree on the word of a contemporary priest
  rather than on anybody's later reconstruction. A printed genealogy gives him the surname "Valadão"; no register we
  hold does, and this archive carried that borrowed name for him until September 2026, when reading his son's baptism
  and his own burial entry together settled it. He was a Ponte Cardoso, like his son.

  His life is bracketed by two original registers seventy-two years apart, which is rare in this whole archive. On 26
  September 1650 he married **Mariana Fagundes** at **Santa Bárbara das Nove Ribeiras**, her own parish at the far end
  of the island, following the ordinary custom of marrying where the bride lived; that page survives too,
  water-stained and ink-bled, the clause that would name her father decayed to a bracketed guess. Seven of their
  children's baptisms are held as images — fifteen years of one household's life in one register, from Maria in
  September 1651 to Isabel de Souto-Maior in September 1666. The registers never settle on how to spell these people;
  Mariana is once, at the outer limit of a tired scribe's ear, simply "morsarana." The surnames were still fluid.

  She was buried on 7 July 1684, and her act is unusually precise about where they put her: *"sepultura da fabrica,
  segunda fiada nona"* — the ninth grave in the second row of the parish fabric's own plots, **inside the church**.
  Burial within the church body was a paid privilege, and it is the one marker of standing the record gives her in her
  own right; everything else it says is that she was Belchior da Ponte's wife. Three years later he was buried in the
  same register, and it is his own death act — not any compilation — that gives his rank: **Alferes de ordenanças**,
  ensign of the parish militia. Hold that word, because it explains three centuries of this family. The *ordenanças*
  were the lowest tier of the Portuguese military organisation, a reserve raised parish by parish and officered by
  local householders **without pay**. Mariana's father, **António Martins Fagundes**, is recorded a *Capitão* of that
  militia, and her grandfather **Pedro Lourenço Machado** is credited with a company of seventy-nine men in the
  operation that starved the Castilian garrison out of the Castelo de São Filipe above Angra in 1642. Three
  generations inside the officer layer of one island, and not one of those commissions paid a wage or passed to a son.
  Such a family transmits precedence and expectation, not capital — the same mechanism that will undo its descendants
  in Brazil two centuries later.

  Be clear about how much of this we hold. Belchior's baptism, marriage and burial, and seven of his children's
  baptisms, are **original parish records in this archive**. From Mariana's parents upward — **António Martins
  Fagundes** and **Catarina Machado de Faria**, and **Pedro Lourenço Machado** and **Maria Fernandes da Costa**, who
  married at Santa Bárbara in June 1598 — everything rests on one twentieth-century compiled genealogy, Mendes
  Forjaz's *Genealogias da Ilha Terceira*, and on nothing else. His dates are day-exact, so he had parish books in
  front of him that we have not reached: a strong lead, not a proof. The 1598 act has been hunted down to the right
  pages of the right book and still cannot be read, damage defeating it — a failed read, not an absence. And nothing
  grants these people arms, an entail or a title; "Souto-Maior" and "Ponte Cardoso" both *look* armigerous, and that
  is not evidence of anything. On the modelled line, Belchior and Mariana are **Juan's
  seventh-great-grandparents**, both sets of their parents his eighth-great-, and Pedro Lourenço and Maria Fernandes
  his ninth-great- — degrees only as firm as their weakest link, and the weakest link is the very next step.

  ### The two Gaspars

  Belchior and Mariana had a son called Gaspar — the household took its boys' names from the three Magi, Baltazar and
  Belchior and Gaspar recurring down the line like a chant. On the compiled account **Gaspar de Souto-Maior** was
  baptised at São Sebastião in February 1657, became a *Capitão de ordenanças*, married **D. Margarida Machado** in
  the church of the Convento da Graça at Angra on 2 October 1690, and died on Terceira on 2 December 1727. None of
  those three acts is among the pages we hold; they are the compiler's, not ours.

  And there the compiler does something wonderful. Having recorded the 1690 marriage, he refuses to carry the couple's
  children forward under the father's name, sending them to another section of his own work — *"por ter preferido os
  apelidos maternos,"* because they preferred their mother's surnames. That is the handoff the family's surname comes
  out of: a Terceira household whose sons took the mother's name rather than the father's. The section he points to is
  headed **Drummond**, and the name carried to Brazil — *Ermonde*, *Armonde*, finally **Armond** — is generally held
  to be the Portuguese softening of it: Scotland to Madeira to the Azores to the Atlantic. It is the oldest and most
  romantic story the family owns, and honesty requires two admissions in the same breath. We have never read that
  Drummond section. And no baptism, and certainly no Y-DNA, proves the Scottish leap.

  Now the knot. The earliest Brazilian record of this line is a single clause on one ink-bled folio: the 1783
  Barbacena marriage act of Joaquim José Ferreira de Toledo, *"filho legítimo de Gaspar Ferreira e de Gertrudes Maria
  [de Toledo], de [Villa] Rica."* That is all we have of **Gaspar Ferreira** — a name, a wife's name, and a family
  seated at Villa Rica, the gold capital. The research that recovered the Terceira registers proposed that he and the
  island's Gaspar de Souto-Maior are one man, who crossed and changed the name he used. It breaks on its own
  arithmetic: a man who died on Terceira in 1727 cannot father a son who married in Minas Gerais in 1783. Either the
  compiled dates belong to someone else, or the Brazilian Gaspar is a son or grandson of the island one, or two men
  simply share a very common name. We do not know; the archive holds both readings at once rather than tidying one
  away; and every degree counted above hangs on that unproven step.

  ### The gold road and the Barbacena Armonde

  What is not in doubt is that a family called **Ferreira Armonde** was on the ground in the Minas highlands. The
  archive holds colonial land papers naming them — a 1791 sesmaria to José Ferreira Armonde with **Alferes Francisco
  Ferreira Armonde** recorded as his northern boundary neighbour, a 1792–94 grant to Marianno José Ferreira Armonde at
  the **Borda do Campo**, an 1805 complaint brought by Capitão José Ferreira Armonde against the local judge over a
  prisoner's release. Adjacent Armonde landowners, ranks and all, in the highland *Campo das Vertentes* along the
  **Caminho Novo**, the royal road hacked up from Rio de Janeiro to the mines and passable for pack-mules by 1707,
  down which gold went to the port and up which everything else was carried. Around it grew **Barbacena**, first a
  great ranch called the Fazenda da Borda do Campo.

  A doctoral thesis on that family, held here as a lead and not as evidence, studies it from 1751 to 1850: an Azorean
  patriarch, Francisco Ferreira Armonde, dead in 1751 at the Borda do Campo; a household in the 1831 Barbacena
  population list holding sixty-six enslaved people; a monte-mor of some **321:751$000** in the 1845 division; and
  above that the Empire's minor aristocracy — a **Barão de Pitangui**, a **Conde de Prados**, priests of the family in
  the Barbacena vicarage. A real, documented, wealthy clan, and **nothing in this archive attaches it to Juan**. The
  thesis even supplies the sharpest warning in the file: that Barbacena family had its own **Simplício José Ferreira
  Armonde**, a *Juiz de Paz*, forty-six in 1831 and dead by the 1845 partilha — a namesake, and demonstrably not ours.
  The grandeur is a possibility, clearly marked as one. It is not an inheritance, and it is not a fact.

  ### The gap at the heart of the tree

  Juan's own direct Armond ancestor, **Simplício José Ferreira Armond**, cannot be placed in the titled line or in any
  other. Newspaper and probate searching has been run to exhaustion and he appears nowhere above himself. He is, on
  all the evidence, a real Armond carrying the paternal surname down his own father's line — in an 1881 heir list
  where every Toledo heir carries a Toledo surname, he alone signs "Ferreira Armond" — but **whose son he was we
  cannot say**. The document that would name his parents, his marriage to Eliza around 1868–72 in the little
  coffee-country parish of **Argirita / Bom Jesus do Rio Pardo**, was never microfilmed; it waits in the Arquivo
  Histórico Arquidiocesano de Juiz de Fora, somewhere in a long queue. Most likely this is a records gap and not a
  concealment: a literate householder whom judges trusted was not a man whose parentage was a secret in his own
  lifetime. But by the time his son died in 1957 the family itself had lost it — that death entry gives both
  Simplício's and Eliza's birthplaces as *"Ignorado."* The silence we work against was already inside the house.

  ### Simplício himself — standing that was function, not asset

  What we do know of him is vivid, and sharper now than the family used to tell it. He lived his whole documented
  life, from about 1875 to about 1919, in the Zona da Mata coffee towns — Leopoldina, Muriaé, Argirita. He was
  **literate** in a mostly illiterate world, and his handwriting survives in exactly one place: a petition of February
  1884 to the orphans' judge, closing *"Simplicio Joze Ferr.a Armond. Estou sciente."* In it he asks the court to stop
  delaying the partition of his wife's grandmother's estate, saying that for his own interest he would ask nothing,
  but that he has *"parentes colateraes em estado de indigencia"* — collateral relatives in destitution — whom their
  shares would relieve. A man of the propertied class writing, in his own hand, that his cousins are going hungry
  while the estate sits in court.

  His public standing was real, and it was **unpaid**. The state gazette of 28 July 1899 makes him *2.º suplente do
  subdelegado* of the Boa Família district of Muriaé; the act of 10 September 1902 makes him *3.º suplente do delegado
  de polícia* of São Paulo do Muriaé. Second substitute, then third substitute — **never the titular** — ranked to
  serve only when called, in posts that were *cargos gratuitos*, honorary offices without salary, under the delegado
  system of Lei nº 261 of 1841. The family long remembered him as a court *arbitrador* and *curador*, a sworn
  estate-appraiser and guardian; that may yet prove true, but it rests today on a third-party notarial paper kept here
  only as context and on an uncatalogued probate, so it is a lead, not a fact — and even if it holds, those were
  per-diligence court fees charged to a single estate, ending with the appointment. What he had was personal and
  local. In 1894 his daughter Aristides was married *"em casa de residencia do cidadão Simplicio José Ferreira
  Armand"* — the officials came out to his house — and the same certificate marks the ceiling of it: the
  nineteen-year-old bride is entered *do serviço domestico* and marries a twenty-four-year-old *lavrador*, a working
  farmer.

  This is the analytical spine of the whole Armond arc. **Offices are function, not asset.** They are income — in his
  case not even income — while you hold them; they divide among no heirs and they die with the man. The land in
  Simplício's household was his wife's, married into and not inherited, and if he was a natural or collateral Armond
  he inherited nothing at all from the Barbacena trunk. The family's fall was never a lost fortune or a scandal. It
  was arithmetic — and on his wife's side we can watch the arithmetic being done.

  ### Eliza's people — a fazenda one generation deep

  **Eliza Balbina de Toledo** is the hinge of this river: the Armond line dead-ends at her husband, so every
  documented ancestor above him arrives through her. This family's paper ancestry is maternal. She was born into a
  working slaveholding coffee household in a district that by 1883 carried the second-largest enslaved population in
  all of Minas Gerais, and the weight of that has to be said plainly: the land Juan's family once held was worked by
  enslaved people, and the wealth was coffee wealth.

  But it was not ancestral land, and the story has been telling it wrong. The **Fazenda da Concórdia** enters the
  record in April 1856 not as one man's estate but as a 200-alqueire holding declared under the Lei de Terras by
  Eliza's father **José Cezário de Toledo Lima** *"por minha Mãe, irmãos e cunhados"* — for his mother, his siblings
  and his brothers-in-law together, an **undivided family commons from its first legal registration**. It was
  *bought*, outright, only on **2 August 1862**, by his widowed mother **Mathilde Maria de Jesus**, from a third party
  of another province, for six contos, and she bought it *"por si como meeira, e também como inventariante e cabeça do
  casal, em nome de todos seus filhos"* — a widow acting for her children. It carried, since September 1859, a
  hypothecary debt of **3:885$000 at one per cent a month**, owed to Francisco Leocádio de Toledo, himself a declared
  co-possessor of the very same fazenda: the capital was leveraged, and leveraged *inside the family*. By 1877 a set
  of Toledo grandchildren were selling *"duas sortes de terras de cultura em commum na Fazenda da Concordia,"* several
  signing from São João del-Rei and Rio de Janeiro. And around **1879–80 the fazenda was sold out of the family
  altogether**, in Mathilde's probate. From a claimed possession to a forced sale, the Toledo hold on the Concórdia
  lasted under a quarter of a century. One generation deep.

  Eliza's father is the first Toledo in four documented generations with **no office at all** — no captaincy, no court
  role, nothing but property. His 1867 inventory is the clearest window the archive has onto what this family's wealth
  actually was: some 32,000 coffee trees, a dwelling house, a *paiol*, an *engenho*, a roadside *casa de negócio*,
  cattle and mules, a gold watch and a dozen silver covers — and **ten enslaved people appraised at 11:300$000, about
  three-fifths of the whole estate, while the bare soil was appraised at 75$000**. The record names them, so we name
  them: Lucas, Pedro and Luiza, entered *de nação*, African-born; Miguel, Thobias, Benedicto, Faustina, Virgiliana,
  Joana and Eugenio, entered *crioulo* and *crioula*, born in Brazil. Five of the ten were children of fourteen or
  under, and listed plainly among the household goods, at 4$000, is *"um tronco para prisão, de ferro e algemas"* —
  iron stocks and shackles. That is what "the landed Toledos" means in the estate's own figures: not principally real
  estate, but an asset class the Brazilian state extinguished without compensation by the Lei Áurea of 1888.

  Then watch the arithmetic. **Partible inheritance** split every Brazilian estate equally among all the children, and
  this family bred large — thirteen children in Eliza's great-grandparents' generation, eight in the next, nine in the
  next again. When her own share finally came, it came as **literal fractions of things**. The payment folio, dated
  around 1919, allots it through her husband — expressly *"casado com Dona Eliza Balbina de Tollêdo,"* in his wife's
  right, since nineteenth-century law made the husband the legal actor for a married woman's property — not as
  property but as value shares: *"na casa de morada, sómente"* **72$910**; in the *paiol* **9$113**; in the *moinho*
  **3$645**; in the halves of an *engenho* and a *ventilador* **14$582**; in 3,388 ares of *matta virgem* **51$037**;
  and in the *capoeiras* a figure worn down to either 50$546 or 508$546, unreadable. Measured against the family's own
  benchmark — an enslaved person appraised in 1867 at between 800$000 and 1:700$000 — even the most generous reading
  of that whole allotment is worth less than the cheapest single human being that estate had held. And it arrived
  late. Her grandmother died about 1880; the heirs were listed in 1881; Simplício was still petitioning in 1884; the
  folio is around 1919. **Roughly forty years in probate**, straddling 1888, so that whatever enslaved people the
  undivided estates still counted as assets ceased to be property while the heirs waited. Capital frozen for four
  decades funds no schooling, no land and no start in life; Marfiza, Aristão and Aristides had made their marriages
  and their livings long before it was paid.

  Eliza is not among the 1877 sellers; her share stayed locked in the undivided estate to the end. **No signature of
  hers survives anywhere in this archive**, and her property left its trail only in her husband's name — which is also
  why the clerks never fixed her name: Eliza Balbina de Toledo, Elisa Balbina de Jesus, Eliza Ferreira Armand, Eliza
  Ferreira Toledo, four forms of one woman across sixty years. Her literacy is untestable from what we hold; that is
  the footprint of a woman whose legal acts were performed for her, not evidence about her. The women around her
  could write. Her mother **Claudina Brandina de Jesus**, widowed and sworn as *cabeça-de-casal* over the whole
  fazenda, signed her own declarations in 1867, and it is *her* oath that put the mortgage and her husband's death on
  the record. Schooling in imperial Brazil was a purchase made child by child, and it could lapse inside one house.

  One collateral finishes the picture, and he sits earlier than the family's own story of its fall. **António Ladislão
  de Toledo**, Eliza's uncle, recorded *"surdo e mudo"* in 1867 and obliged to act through a proxy because he could
  neither swear nor sign, is recorded at his death on 11 February 1909 as a **carpinteiro**, dying at the Fazenda da
  Concórdia — on land his family had sold thirty years before. An heir of that estate who lived by a trade. The
  descent into manual work does not begin with an urban baker in the 1940s; it begins two generations earlier, inside
  the landed household itself, pushing individual members off the bottom edge one at a time while the family as a
  whole still called itself landed. And his craft was the only thing anyone in his generation held that could not be
  divided among heirs, mortgaged inside the family, or legislated out of existence.

  Behind Eliza the line runs back on held primary records into the eighteenth-century gold highlands and across the
  Atlantic. Her great-grandfather **Capitão Joaquim José Ferreira de Toledo**, seated at the **Fazenda Cascalhaes**
  near Barbacena, is recorded *morador na Villa Rica* at his 1783 marriage — though even that phrase is a bracketed
  reading on a damaged folio — and his militia rank, like every rank in this river, was an unpaid honour resting on
  land. Above him there is only that one clause: Gaspar Ferreira, and **Gertrudes Maria de Toledo**, from whom the
  whole "de Toledo" name descends, since her husband was "Ferreira" alone. In a family whose every material asset
  proved divisible, abolishable or non-transferable, the durable inheritance turned out to be a surname, and it came
  through a woman. His wife **Ritta Angélica Rodrigues** was baptised in March 1764 at the **Capela de São José do
  Ribeirão**, and that act names her father, **João Rodrigues do Valle**, as *"natural da freguesia de São Martinho de
  Ruivães, Arcebispado de Braga"* — a Minho man, from the most land-fragmented corner of Portugal and the greatest
  single source of eighteenth-century emigration to Brazil. That origin survives only because a vicar, writing the
  parents' marriage in 1751, had wrongly called him a man of the parish and corrected himself in the margin. A
  further quarter of Eliza's ascent, the **Silva-Xavier** line, braids in Minho immigrant men who married colonial
  Paulista women and rode the gold-and-cattle frontier down from Goiás to Barbacena, where a baptism of 1795 finds
  them settled beside the Armonds. So even before the four rivers meet in Brazil, this one is already a confluence:
  the Azores, the Minho and colonial São Paulo, in the gold highlands.

  ### Aristão, Liliosa, and the blank called Paz

  Down at the modern end stands **Aristão Ferreira Armond**, born about 1879 somewhere in Minas Gerais — the long-held
  Piacatuba attribution is now doubtful, and the leads point instead to Rio Pardo da Leopoldina and Argirita. He is
  the generation in which the class position actually changes, and the records let us watch it happen. Through 1903,
  1917 and 1922 he is still inside the propertied legal world of Muriaé: witness to a mortgage deed; then a creditor
  in a dead man's estate, paid **18$584** in a share-out among creditors the estate could not satisfy in full; then a
  petitioning party in an inventory. In August 1931 the state gazette appointed him **subdelegado de polícia** of the
  Limeira district, after his enrolment that April in the pro-Vargas Legião de Outubro nucleus of the same district —
  patronage rather than a career, and, like his father's posts, a *cargo gratuito* that paid nothing. It is the last
  documented appearance of Armond authority anywhere. And in the same lifetime, at his death on 1 November 1957 at
  **Volta Redonda**, aged seventy-eight, he is recorded *"de profissão padeiro"* — a baker. From district police
  authority to baker in twenty-six years, inside one man's life, his death declared not by a relative but by a shop
  employee acting *"no impedimento ocasional de membros da família do falecido."*

  He married **Liliosa Paz Armond**, and here the river runs into sand: the entire **Paz** family is a blank. Liliosa
  is firmly real — born at Eugenópolis in the Mata, *"nascida aqui"* as her son's marriage certificate puts it, dead
  there on 16 April 1946, her name typed unmistakably on a 1973 Guanabara driver-registry entry for her son José
  Olavo — but her parents are unknown, and her documentary **silence is itself a piece of evidence**. Set her beside
  her mother-in-law Eliza, who surfaces in an 1879 heir list, an 1881 partilha, an 1884 petition and a 1919 payment
  folio precisely because she had property worth dividing. Liliosa appears in no inventory, no land record, nothing
  but her descendants' certificates — and a woman who leaves no estate trail is a woman with nothing to divide. Two
  women in one family, a generation apart, with opposite archive footprints: that contrast is the most economical
  statement of where the Armond descent had got to. The record that would open her line, her 1946 Eugenópolis death
  certificate, would also be the first document ever made about her in her own right, and it has not been retrieved.

  Their son **Geraldo Paz Armond** was born on 30 January 1915 at Limeira in the Mata, and was recorded **padeiro**,
  like his father, when he married in 1952 — signing his own name. He and his wife lived their working lives in
  **Irajá**, in Rio de Janeiro's Zona Norte, not in the steel city; Volta Redonda came late, and it is where he died,
  on 18 February 1991 at the Hospital Santa Margarida, aged seventy-six, *aposentado*. Three generations fit inside
  one word, *padeiro*, and behind it lies the whole descent: a grandfather's offices that paid nothing, a
  grandmother's land that arrived in fractions forty years late, a coffee economy that collapsed, and a family that
  urbanised — which in twentieth-century Brazil meant arriving in the city as a wage-earner with no land. And yet his
  death register says he **left a will and assets to inventory**. Not a fazenda: the estate of a working man, built
  out of a wage rather than received from anybody. Where his forebears' standing came from honours that paid nothing
  and land that arrived in pieces, what Geraldo left came from work — and that, not the Concórdia and not the Conde de
  Prados, is the foundation the family actually kept.

  On 31 May 1952, at Eugenópolis, he had married **Cidália Engrácio Guimarães**. And with that marriage, a second
  river joins the first.

  ---

  ## RIVER TWO — the Guimarães and the Engrácio, out of Portugal by way of commerce (Cidalia Engrácio Guimarães)

  This is the river that asks you to give up the comfortable version of the immigrant story. Family memory sends it to
  the Minho; the documents will only say *Portugal*, and they place the family a good deal lower than memory does.

  ### The man recorded in one word

  **Vicente José de Carvalho Guimarães** rests on a single word in a single act. In his grandchildren's collective
  birth registration of 12 October 1915 he is *portuguez*, and nothing more: no district, no municipality, no parish.
  He appears in no other record this archive holds. "Guimarães" is a northern-Portuguese toponym, but the family's own
  rule is that a surname is not an origin, and here the rule bites its owner. **We do not know where in Portugal he
  came from.**

  Even where he stopped forks. He married **Maria Tertuliana da Conceição**, stated in that same act to be *natural da
  Villa do Rio Claro*. The research trail reads that as **Rio Claro, São Paulo**, an Oeste Paulista coffee town thick
  with arriving Europeans; this archive's own place record puts a Vila do Rio Claro in the state of **Rio de
  Janeiro**. Nobody has reconciled the two, and the difference changes the migration: one reading puts Vicente inside
  the great immigrant inflow onto the paulista coffee plateau, the other makes the later move to Carangola a short
  local hop. A third act muddies it — in 1964 a son of the next generation died in Paraná and the informant declared
  his parents *"ambos naturais do Estado de Minas Gerais"*, against Francisco's own 1915 statement that he was born at
  Villa do Rio Claro. The earlier declaration governs; the 1964 one is logged, not explained away.

  Both of them died *na cidade do Carangola* — in the town, not out on the land their son farmed — and no record gives
  Vicente an occupation or a property of any kind. Emigration is in practice the renunciation of an inheritance: this
  line begins in Brazil at zero.

  ### Francisco, who was a lavrador

  His son **Francisco José de Carvalho Guimarães** has long stood as the high point of this story, and the evidence no
  longer supports the promotion. The Alferes rank attached to him comes from a transcribed 1897 Guarda Nacional roll,
  with no primary record behind it — and the one document we do hold pulls the other way twice. On 12 October 1915 he
  entered **all six of his children in one sitting**, none registered at birth, the eldest **fourteen years late**,
  under an amnesty decree that finally made it possible: a household outside the administrative net, not a man holding
  office inside it. And his witnesses were small-commercial townsmen — **José Guida, a *commerciante***, and
  **Joaquim Ferreira de Mello, an *official de pharmacia*** — no fazendeiros, no priests, no fellow officers. The only
  standing any held record gives him is ***lavrador***; the act calls him and **Emmerenciana Maria de Jesus** together
  *lavradores*, which is also why she enters the archive as a worker on the land rather than as "do lar". What
  Francisco demonstrably was is a literate farmer with a district-town circle.

  Emmerenciana's own parents are the plainest people in this book. **Antonio Francisco da Silva** and **Maria Paula de
  Jesus** were *naturaes deste districto* — São Francisco do Glória — and that district is the whole of their recorded
  geography. **They left no estate at all**, which is exactly why partible inheritance never engaged for them: nothing
  to divide, no *inventário* to open, no paper produced. Their poverty is the finding, not a hole in the research —
  and without Francisco's single 1915 errand, four of Juan's ancestors would have left no trace at all.

  Their grandchildren's endings are not gentle. **José Sobrinho** died a *lavrador* on the northern-Paraná coffee
  frontier in 1964, eleven adult children, *"não tem bens a inventariar."* **Sebastião** died at Jacarezinho in 1982,
  unmarried, still a *lavrador*, a resident of the **Asilo São Vicente de Paula** — the poorhouse — and *"não deixa
  bens"*. Only **João José**, who died at Volta Redonda in 1992, left *"bens a inventariar"*, among some fourteen
  children. Six heirs, then eleven and fourteen: no modest holding survives that arithmetic twice.

  ### The Engrácio: literacy instead of land

  The commerce in this river's name comes from the other side of the marriage. **Antonio Engracio de Souza** appears on
  the **1898 senatorial electoral roll** of São Francisco da Glória as an admitted voter — which proves less than it
  looks. The 1891 Republican constitution **abolished the old income qualification** and kept only the literacy bar,
  so his vote proves an adult male citizen **who could read and write**, and nothing whatever about property. No held
  record shows him owning any.

  The sharpest small scene in the archive corroborates the literacy. In a **1917 *procuração*** at São Francisco do
  Glória he signs his own name as a witness, in the very instrument whose grantor *"declarou não saber ler nem
  escrever."* Being the man who signs for the man who cannot is an exact measure of a position. Where his money sat is
  fainter: he surfaces as a *credor*, a creditor, in a Muriaé probate of 1903 and a property partition of 1909, both
  read from full-text search rather than images we hold. If those stand, his wealth was **credit, not land** — and
  credit leaves no title and no inventário, which is why he is visible in other people's estates and in none of his
  own. His wife **Luzia Pinheiro da Conceição** is named only ever by other people: the acts that generated documents
  in her Brazil were closed to a married woman with nothing in her own name, so her invisibility is a fact about the
  archive, not about her.

  ### The late move, and what came down

  **Antonio Engracio Filho**, born 15 June 1894 in Minas Gerais, married Francisco's daughter **Maria Aurora
  Guimarães** — a farming family with no heritable base joined to a trading family with letters and a till. He was a
  ***negociante***, and his 1964 death act pairs that trade with *"não deixou bens"*: land fragments, but commerce
  evaporates when the man dies. His given name beyond *Antonio Engracio* is not established, and the adult son who
  reported his death is marked in this archive as possibly living; he is not named here.

  The move to Rio was late — later than this story used to say. Three records pin it: Alvorada, Carangola, in
  September 1930, where he declared his daughter's birth; both he and Maria Aurora still *"residente nesta cidade"* —
  **Eugenópolis, Minas Gerais** — on that daughter's marriage certificate in **May 1952**; and **Pavuna**, on Rio's
  northern edge, when he died in June 1964. The household left Minas between **1952 and 1964**, when he was already
  **between fifty-eight and seventy**. That is not a young trader chasing a market; it fits a family following its
  grown children into the city at least as well as it fits commerce, and no record states a reason. Maria Aurora went
  with him at forty-eight or older and died at eighty-seven in a Rio hospital in 1991, *"do lar"*, *"não deixou
  bens"* — an interior woman who reached the capital late, lost her husband within a few years, and lived on alone
  there for twenty-seven more.

  So what came down this river? Not property: **not one person in it is documented owning anything**, from Vicente at
  the top to Cidalia at the bottom. What came instead was literacy, traceable across **three Engrácio generations** — a
  father who signed in 1917, a son who had to read and reckon to keep a shop, a grandson recorded in commerce — in a
  period when schooling was a purchased privilege, re-bought each generation. Set against the Guimarães side of the
  same marriage, where two *lavrador* brothers-in-law died with nothing and one is recorded a non-voter in 1982, the
  contrast inside one household is stark.

  And the women's line bends rather than climbs — a **U**. Emmerenciana sits inside a household's collective
  *lavradores*: unpaid field labour. Maria Aurora is *"do lar"*, with no economic role recorded at all, urbanisation
  having taken the farm work away before it replaced it. Her daughter — born at Alvorada on **15 September 1930** and
  registered by her father that same day, in a family that had once left six children unregistered for fourteen
  years — is **Cidalia Engracio Guimarães**, whose 2023 death certificate calls her a ***costureira aposentada*** and
  marks *"Eleitor: Sim"*: a trade and a pension in her own name, the first woman in this line with an income the state
  recognised as hers. Three generations and a move to an industrial city to get there. She married Geraldo Paz Armond
  at Eugenópolis on 31 May 1952 and died at Volta Redonda in 2023, aged ninety-two, leaving — like both her parents —
  no goods to inventory. Remember that birthplace, Alvorada; it is about to become the sharp point of the whole story.

  ---

  ## RIVER THREE — the Muniz, out of the Azorean sea and the class floor (Antenor Muniz)

  ### A drowning off the Garajau — and a holding already dividing

  The third river rises on a different Azorean island — not Terceira but **São Miguel**, in the seaward parish of
  **Nossa Senhora da Mãe de Deus** in the Povoação district, on the island's rugged eastern end: not gentry, not
  merchants, but small landholding peasant farmers, *proprietários*, living close enough to the sea that the sea took
  the patriarch.

  **Manoel Muniz Bytancourt** was baptised at Mãe de Deus on 17 June 1821, and in February 1842 he married
  **Francisca Roza do Espírito Santo** under a dispensation from a *fourth-degree consanguinity impediment* — they
  were blood cousins, ordinary inside a small island parish where everyone was related to everyone. Hers is a surname
  taken from the calendar of saints rather than from her father, which is why her own baptism cannot be found by name
  at all. On 24 July 1866, around one in the afternoon, Manoel drowned: his death record reads that he died *"na
  bahia, fóra do Garajau,"* in the bay beyond the Garajau, *"sem receber os Sacramentos,"* that he **made no will**
  and **left eight children**, a resident of the Lomba do Botão. At forty-five, the age his baptism gives; the act
  says forty-six.

  It used to be written that this line, unlike the Armonds, *never rose and never fell*. The registers say otherwise:
  **the family was already sliding inside the Azores, before anyone crossed.** The Povoação books are not sparing
  with rank — they style a mere marriage witness *Capitão* — yet across some ten acts held for this family **no Muniz
  Bytancourt is ever given an honorific, and no wife is written *Dona***. The godparents say the same: in the
  household above Manoel, **one couple sponsored six consecutive baptisms between 1831 and 1841**, and no captain,
  priest or *morgado* ever appears. Sponsorship was the standard Portuguese way of hooking a house to a patron; this
  family only used it sideways, kin to kin, which is what you do when there is nobody above you to reach. Then the
  arithmetic bites, in daylight: six years after their father died intestate his daughter Claudina, sixteen, married
  a ***sapateiro***, and six years after that Anna Maria, twenty-three, married a ***pedreiro***. A proprietor's
  daughters married artisans within twelve years, because the household no longer had a land-portion to match them to
  landholders.

  Behind Manoel the line runs deeper, all on primary parish ink from Ponta Delgada: his parents **João Francisco
  Muniz Bitancourt** and **Maria Jacintha de Medeiros**, married at Mãe de Deus in October 1819, and above them the
  elder **Manoel Muniz Bitancourt × Tereza do Amaral** and **João de Medeiros Brandão × Maria Eugenia** — a woman for
  whom the registers record no surname at all. With João de Medeiros Brandão the deepest chain in this river is
  complete end to end. The Ponta Delgada catalogue lists an estate inventory opened in his name on **27 January
  1819**, his wife **Maria Eugénia as *inventariante***, the deceased a resident of **Lomba do Botão**; it is not
  digitised and this archive holds no image, so we have the catalogue's description and not the record. Nine months
  later his daughter married into the Muniz proprietors; forty-seven years after that, her son was the drowned man at
  the same Lomba do Botão, intestate, with eight children. A plot enters the record in 1819 and by 1866 cannot carry
  the children born onto it. **The Azorean emigration in this family is not a misfortune; it is arithmetic.**

  ### The crossing — and two Brandãos that must never be merged

  Manoel and Francisca's son **João Monis Bittencourt** was baptised in 1845 in a joint act; a sibling was baptised
  the same day but is not legibly named on the page, and the reading that the two were twins stays a lead. His
  crossing is tighter than we used to say, and later. The records bound him to São Miguel in 1845 by his own baptism
  and to Brazil by 23 December 1882, the date of his Sapucaia marriage provision: **1866 × 1882**. The old
  "1866–1870, immediately on his father's death" rests on nothing we hold. He married at about **thirty-seven** and
  fathered his first documented child at thirty-nine, and a peasant son marries that late when he has spent his
  twenties without the means to form a household. An uncatalogued Ponta Delgada passport register is said to carry
  two **1880** passports for men named as sons of João Moniz Bettencourt and Maria Jacinta of Povoação, probably his
  brothers; we have not seen it, so it is a lead — but it points where his life points, to **around 1880**.

  What a propertyless immigrant had to buy in Brazil was belonging. He married **Susanna Rita Brandão** (the register
  writes her *Brondão*, and styles her *D. Suzana Rita*), born 20 August 1865, daughter of **José do Rego Brandão**
  and **Rita Ignacia de Jesus**. Her baptism certidão was copied into the Sapucaia register in November 1882, sixteen
  years after the act, and we used to read that lateness as a poverty marker. The institutional reading is better:
  **Sapucaia was erected as a freguesia only in 1871**, so a child baptised in 1866 was baptised under a predecessor
  parish, and to marry in the new matriz she had to produce a certidão of the earlier act — a parish boundary moving,
  not a family neglecting its papers.

  Susanna was no bystander. Her daughter Ritta's **1890 civil birth entry records both parents as *lavradores*** —
  the only record in this branch giving a woman an occupation other than *doméstica* — at **Conceição**, *"distante
  em duas leguas da Sede desta Cidade."* The same entry says the clerk drew the term *"que commigo assigna o
  declarante"*: **João signed it himself**, having walked two leagues in to register a birth eight days old, under a
  civil registration made compulsory only the year before. She bore **eleven children**, and her death sits in a
  bracket rather than on a date — a widow in September 1915, already *falecida* when her daughter Ana died in 1950.

  One thing must be said plainly, because it is a trap for whoever comes after. **There are two entirely unrelated
  Brandão families in this descent, and they must never be merged**: Susanna's *Rego* Brandão of the Paraíba do Sul
  valley, and her husband's own great-grandfather, the *Medeiros* Brandão of Povoação. No record connects them, and
  they held opposite capital — the one a plot divided away, the other no property at all and only belonging.

  João died on 12 September 1915 at the Corrego do Boa Vista in Carangola, at sixty-eight, in his own house, his
  funeral paid *"ás expensas de sua Familia."* The act calls him *"natural da Ilha de São Miguel"* seventy years
  after he was born there — and names his father **"Manoel Luiz Bittencourt,"** the wrong middle name, and **does not
  name his mother at all**. Thirty-five years after the crossing the family informing the priest could no longer
  state the emigrant's own parents correctly. Nothing came across but the island's name and the surname, and the
  surname went on drifting.

  The Sapucaia Brandões pay the same price in another currency. **José do Rego Brandão**, born about 1833, was the
  settled householder newcomers asked to sponsor their children; between 1890 and 1898, in his late fifties, he
  followed his married children to Carangola and arrived a stranger. Read the sacraments: his father-in-law buried at
  Sapucaia in 1868 ***"sacramentado"***; his wife Rita dead at Carangola in 1898 with *"não procuraram Confissão"*
  against her name; himself dead there in 1912, aged seventy-nine, ***"sem sacramentos."*** Two deaths inside the
  church, two outside, and the difference is one migration — not lost faith but lost proximity, and lost standing.
  **Rootedness is the one capital partible inheritance cannot fragment, and the one a single move destroys.**

  ### The invisible poor — the Azevedo

  João and Susanna's son **Deocleciano Muniz Bittencourt**, born at Sapucaia in June 1892 (the day is an uncertain
  read; the month and year are clear), married **Luiza Fernandes de Azevedo** at Santa Luzia de Carangola on 21
  October 1916 — in act nº 35, his sister Joventina in act nº 34, the same day in the same church.

  Luiza's line, the **Azevedo**, is the floor of the whole class range in this tree, and her marriage act is where
  the silence becomes a stated fact. **Her only literacy datum is a negative**: she *"não saber ler nem escrever"* and
  was signed for ***a rogo***, while Deocleciano signed his own name on the same page. Eleven Azevedo, Brandão and
  Machado ancestors stand behind her and not one leaves a signature anywhere. Her parents were **José Secundino de
  Azevedo** and **Thereza Fernandes de Azevedo**, and beyond their names almost nothing survives: no land record, no
  inventário, nothing in a 144-comarca Minas court index, not a newspaper line. His name garbles in three of the four
  documents that carry it; hers never does — and it was the exact match on *her* name in a 1975 death certificate
  that let a sister, Alcida, be recognised sixty years on. In a family with no property, the mother's surname does
  the work a title deed does elsewhere.

  Two older statements must be withdrawn. A sister, **Gloria Lacerda de Azevedo**, was said to have died at Niterói
  in 1900, putting the family in the Rio orbit a generation early; that was an index misparse. Gloria died at Niterói
  on 9 May 1960 — a record read but **not catalogued in this archive** — and no pre-1950 Rio presence is documented.
  And the hint of a **Madeiran** origin belongs to a Carangola namesake, a collateral and not an ancestor; nothing
  documents an island origin for the Azevedo, and we do not infer one from a surname. Secundino's and Thereza's own
  parents remain a blank.

  But the poverty here is documented, not asserted, and it works differently from the Azorean kind. Where the Muniz
  were impoverished *by* division, the Azevedo were poor more absolutely: nothing was diluted because nothing existed
  to dilute. And that cut both ways. **Landlessness is precisely what made this branch mobile** — a household with no
  land loses nothing by leaving. Within a generation the widowed Thereza had followed her married daughter into the
  Carangola district; two other daughters ended in the Rio metropolitan area, Gloria at Niterói in 1960 and Alcida in
  the Baixada Fluminense in 1975; and Luiza's own son would die in a steel city.

  ### Antenor's estate — and the mirror of River One

  Deocleciano and Luiza's son was **Antenor Muniz**, born on 2 November 1923 in the **Alvorada** district of Carangola
  and documented, at his marriage to **Iris Bohrer** there on 7 December 1949, simply as a man *"da lavoura,"* of the
  land. And then he left it. His death certificate — 17 October 2014, at Volta Redonda, aged ninety — records him a
  ***bombeiro hidráulico***, resident in Monte Castelo, with five adult children, and carries four words that turn
  this whole river: ***"deixou bens a inventariar."***

  That is the **first estate documented anywhere in this line since 24 July 1866**, when his great-great-grandfather
  drowned at Lomba do Botão intestate with eight children. Between those dates stand three generations — the
  emigrant, the *lavrador*, and Antenor's own youth — in which the family is nowhere recorded as owning anything. And
  the mechanism was not land. It was a trade with a **wage** underneath it, in a city built from 1941 around the
  Companhia Siderúrgica Nacional expressly to buy that labour; the 1943 labour code gave the wage a floor and a
  record, and from the 1960s housing finance put ownership within a tradesman's reach. A plumber's wage in a steel
  city did in one working life what a century of cultivation had not.

  Now set this beside River One, because it is the strongest thing the whole story has to say. **Both of Juan's
  grandfathers died as tradesmen in Volta Redonda.** Geraldo Paz Armond, *padeiro*, died there in 1991, descending
  from the Toledo land — from Dona Mathilde Maria de Jesus, who bought the Fazenda da Concórdia outright in 1862, as
  a widow, in her own name. Antenor Muniz, *bombeiro hidráulico*, died there in 2014, **ascending** from a fragmented
  Azorean smallholding and two propertyless agrarian generations. The same city, the same wage, the same clause on a
  death certificate, reached from opposite ends of the social scale. **The Muniz arc inverts the Armond arc**, and
  where the two cross is a family.

  The arithmetic underneath both is one arithmetic. Mathilde's **eight** children resolved, in her 1879 título, into
  roughly **thirty** claimants in a single step, while her husband's estate was still holding hearings in 1889 —
  **twenty-two years** of litigation, its curators and court fees charged against it the whole way. In February 1884
  Simplício José Ferreira Armond petitioned the orphans' judge to force the partition, explicitly not for himself but
  because he had *"parentes colateraes em estado de indigencia."* Five years after the death of a fazenda-owning
  matriarch, some of her own descendants were destitute, and a family member wrote it on a stamped sheet before a
  judge. Meanwhile at Povoação one smallholding had gone eight ways and at Carangola a household went eleven. Antenor
  left five. Partible succession is this family's continuous condition, and across five generations the only thing
  that changed was what there was to divide.

  He is **"Antenor Muniz"** in every source we hold; his brother Aristides kept "Bittencourt," and no record tells us
  Antenor formally bore it. Dropping it was ordinary assimilation in a family with no title or estate-name riding on
  a name — and it is the small change that made this line hard to follow back to a fishing parish on the eastern end
  of São Miguel. And with that 1949 marriage the fourth river arrives — the one that comes not from the Atlantic
  islands but from the Alps.

  ---

  ## RIVER FOUR — the Bohrer, out of Switzerland and Germany (Iris Bohrer)

  ### The stony lots of Nova Friburgo

  The fourth river is the strangest to find at the confluence, because it begins in cold mountain country a world away
  from the Azores. By a decree of 16 May 1818, King João VI — the Portuguese court then resident in Rio, having fled
  Napoleon — contracted to plant a hundred Swiss Catholic farming families in the highlands above Rio de Janeiro, at a
  place they named **Nova Friburgo**, after the canton of Fribourg. The push at the far end was harder than the pull:
  the 1816 "Year Without a Summer" on top of post-Napoleonic poverty, and a Jura that divided farms among heirs until
  the shares would no longer feed a household. Recruitment overshot to some two hundred and sixty families, roughly a
  quarter of the colonists died at sea, and the survivors were handed small, steep, stony lots and left to make farms of
  them.

  And the package can now be priced, which changes the whole story of the King's colonists. Each family was promised a
  lot and a built house, rations, seed and livestock, and a daily subsidy of **0$160 falling to 0$080 across a two-year
  establishment period** — about **58$000 in the first year, roughly one-seventh of a free rural labourer's ~420$000**.
  That is a floor built deliberately low: enough to keep a family alive while it cleared a hillside, and designed to
  stop. The scheme delivered a **starting position, not a trajectory**, with nothing in it to stop one branch stalling
  while another climbed.

  How bad the alternative at home must have been is measured by an old man's decision. **Johann Jacob Wehrli**, baptised
  at Grindel on 17 January 1751, boarded the *Heureux Voyage* at **sixty-eight** — a fragmenting but heritable Jura farm
  traded for a temporary subsidy and a poor lot. He was dead at Nova Friburgo by 1827; his wife **Elisabetha Borer**
  followed in 1832, by a death act read in the parish register but not yet catalogued here.

  Elisabetha had been baptised at Erschwil in June 1760, and her entry carries the family's smallest, sharpest social
  fact. Her father is written "Joseph Borer *fusemnistr*" — an abbreviated village duty that **nobody has yet
  deciphered**; *Feuersmeister*, a fire warden, is a guess about a half-legible word and must stay one. Whatever it was,
  it was unpaid work in a commune of a few hundred souls: standing with no income underneath it, which is exactly what
  undoes the Armond offices in River One, three rungs down the social ladder.

  ### Two Borers, one ship

  Here is the fact that most changes this section. **There were two entirely unrelated Borer families aboard the same
  crossing**, and Iris descends from both — her father's line from one, her mother's from the other. **Laurent (Lorenz)
  Borer**, of Grindel, arrived in 1819 and married **Anna Maria Werhly** in July 1820; **Jacob Bohrer** married
  **Catharina Moser** in August 1825, the register calling both spouses "*ambos do Cantão de Soleure, colonos suiços*".
  The two acts name different fathers from different villages, so the two men were **not brothers**, and the colony's
  own compilation says outright that no close kinship is evidenced. Guard against one more trap: Jacob the immigrant and
  **Jacob Borer of Grindel**, Laurent's father, are different men with near-identical names.

  Two corrections belong here. Jacob's baptism parish is **Beinwil**, not Erschwil: the register's "Erswill" is a
  misread, and the Staatsarchiv Solothurn has searched Erschwil's Catholic holdings in full without finding the family.
  His birth date remains unknown — the 13 December 1801 in circulation comes from a collaborative tree and is not
  proven. And his wife was a **Moser**, not a "Mayer": her own marriage act and her son's 1832 baptism both write Moser
  and name her father José Moser, while "Mayer" survives only in a will dictated sixty-three years later about a mother
  long dead.

  Marriage inside the colony bought belonging, not property. The Wehrlis held the same meagre package Laurent did, and
  allocation was **per family and fixed**: he received no lot of his own but moved onto Casa 73 / Lote 86, the
  household's existing allotment, so marrying inside the colony added mouths to one poor plot rather than adding land.
  The pressure is legible on a single page of the 1820 marriage book — entry 37 is Anna Maria's sister Salomea marrying
  Luiz Nicolão Vilette, with **Lourenço Borer standing as a witness**, and entry 38 is Laurent's own wedding. In River
  One, marrying in meant marrying into Toledo land; here it meant a place at the same table.

  Then the branches diverge, on adjacent lots, inside two generations. In October 1891 **Valentim Martinho Bohrer**,
  Laurent's grandson, registers his daughter's birth at São José do Ribeirão as a *lavrador* — and the act closes with
  the clerk signing "*a rogo do declarante por não saber escrever*". Three years earlier, on the other branch,
  **Francisco José Bohrer** had **signed his own will**. Same ship, same decree, same stony floor; an illiterate farmer
  and a self-signing testator in the same generation. The variable was not origin but whether a branch reached town
  trade or stayed on fragmenting land.

  ### The one landed moment, and what it was worth

  Francisco José — born 9 July 1832, which corrects the printed compilation's "4 July" by five days — is the high point
  of the whole river, and worth pricing so that its smallness can be felt. He died at the Alto da Serra in July 1888,
  aged fifty-six, leaving a registered will with executors, twenty masses for his parents, and a bequest of **50$000 to
  the works of the Capela de Santo Antonio**: about **an eighth of a labourer's year, and on the order of a twentieth of
  what one enslaved adult cost** in those decades. The will disposes of "*meus bens*" while naming **no lot, no house,
  no store — and no enslaved person at all**. A will owes no inventory, so the silence proves nothing by itself; but it
  was dictated months before Abolition, and no record held in this archive names an enslaved person in any Bohrer, Lemos
  or Silva-Ferreira household. Then the arithmetic closed the door: quartered from the outset among four heirs, with the
  widow's *meação* holding half of it beyond their reach for **thirty-one more years**, by which time the firstborn was
  himself dead. The one landed moment never compounded.

  His wife needs correcting too. **Rosa Eugenia de Lemos**, baptised at Itaboraí in October 1835, is usually told as a
  romance — the couple who waited twenty years for a wedding. Their 1879 *justificação* is better read as an **estate
  act**: the wedding had been held at Itaboraí in a private house and entered in no parish book, and a judicial sentence
  ordered the Nova Friburgo vicar to open the record. The witnesses deposed that it had stood "*a mais de vinte annos*"
  — an uncertain reading, placing the wedding about 1858. The union was therefore socially complete and **documentarily
  invisible for some two decades**, and was regularised **nine years before the will**: the paperwork was done when
  there were heirs and an estate to secure. The act gives no motive, so that is the economical reading rather than a
  proven one. Her own standing was real and entirely of position — named **first *testamenteira* and *tutora*** ahead of
  her own brother, styled "*Exma. Sra. D. Roza Bohrer*" by the town weekly, and carried at her death in 1919 to burial
  by the **Irmandade do Sacramento**. Lay-brotherhood burial was a subscribed respectability: standing paid for by dues,
  because land costs a fortune.

  Around them the colony's other intake married in, and it pays to be accurate about which. **Carolina Klein**, who
  married Valentim in November 1890 at seventeen, was the daughter of the Lutheran colonists Jacob Klein and Maria Luiza
  Schenkel, and her marriage act records that she had first "*abjurado o protestantismo … e recebido o baptismo*",
  verbally licensed by her father. Her people came with the **1824 German wave**, not the 1819 Swiss colony; some
  archive abstracts still label them "Swiss-colony", and they are wrong. The Rutschmann came by yet another road, out of
  Bulle in Canton Fribourg, and the German-born **Elisabeth Storck** is recorded only as "*nascida e baptizada na
  Allemanha*" — at country level and no further. For several of these people that is all we hold: Heinrich Schenkel is a
  *Kirchenvorsteher* in one line of one register, Anna Clara Storck four words, "*Anna Clara já fallecida*". Where a
  person is barely more than a name, this story says so rather than inventing a life.

  The plateau, when it came, was spent inside one generation. Francisco José's son **Joaquim José Bohrer** — omitted
  from two printed colonist genealogies, recovered only because his father's will names him firstborn — kept a
  back-country store; his brother **Guilherme Samuel Bohrer**, styled Capitão, owned the Nova Friburgo weekly *A
  Sentinella*, founded on 30 September 1894. A newspaper and a shop, with no salaried post underneath: the same weakness
  as River One, arrived at from below instead of above.

  ### A signature, and three deaths with nothing to inventory

  Literacy arrived in a single generation, and the moment is visible. Valentim could not write in 1891. In 1923 and 1924
  his son **João Gonçalves Bohrer** walks into the cartório of São João Baptista himself, declares his children's births
  — the family then living at "*kilometro cento e dois*", an address given as a distance along a road, which is what an
  unnamed smallholding looks like in a register — and **signs the entries**. An acquired competence rather than an
  inherited asset, which is exactly the kind of gain a family with no capital can make. (His own birth is still not
  held; a name-index places a baptism in 1894 at São José do Ribeirão, but that is a lead.)

  Then the estate experiment runs itself. João Gonçalves died on 3 August 1970 in the **Hospital da C.S.N.**, the
  Companhia Siderúrgica Nacional's own company hospital at Volta Redonda, a *comerciante*, and his record says he
  "*deixou bens a inventariar*" — there was something to inventory. Seven years later his widow Celina, a *costureira*,
  died and hers says "**não deixou bens nem testamento**". A household of fourteen or fifteen children later, nothing
  was left to record; his act counts *quinze filhos* and hers *quatorze*, and both figures are kept.

  One of those children, born on 27 February 1929 at Presidente Soares in the Alto Jequitibá of Minas Gerais, was **Iris
  Bohrer** — Juan's maternal grandmother, the Swiss-Alpine river's mouth. She was a Bohrer on both sides, the two
  Solothurn trunks rejoining some hundred and ten years after the landing, at the bottom of both trajectories. She
  married Antenor Muniz at Alvorada in December 1949 — the last event in this line to happen in the countryside — and
  died at Volta Redonda in July 2021, aged ninety-two, recorded as a *pensionista* and leaving no goods to inventory.
  **Three consecutive death records with no estate**: not a lost fortune, but documented proof that no heritable capital
  was ever in this line to lose. What closes the arc is not property but a pension — the state standing in for the
  inheritance that never came. Upward mobility off a floor so low it could only rise: that is the Bohrer arc, the
  mirror-image of the Armond fall.

  ---

  ## THE CONFLUENCE — where four rivers become one family

  Now bring the rivers down to where they meet, and watch how tight the geography becomes.

  Every one of the four lines, coming from Terceira and mainland Portugal and São Miguel and the Swiss Jura, passes through
  the *same strip of Brazilian forest* — the **Zona da Mata Mineira**, the nineteenth-century coffee frontier that
  opened up when the Crown's old prohibition on settling the eastern "Sertões do Leste" finally lapsed and fertile
  virgin forest, close to the Rio export market, drew families from every direction. The Armond and Toledo came *down*
  into it from the exhausted gold highlands (Leopoldina, Muriaé, Argirita). The Muniz and the Bohrer came *up* into it
  from the coast and the colony (Carangola, Presidente Soares). The Guimarães and Engrácio followed commerce into it
  (Carangola, Alvorada). The coffee frontier is not a backdrop to this family; it is the literal ground on which the
  four separate streams first flowed into the same valley.

  And then the point narrows almost past belief. Of all the towns in that vast forest, **both of Juan's grandparent
  couples tie to one tiny Carangola district: Alvorada.** Cidalia Engrácio Guimarães was *born* at Alvorada, in 1930.
  Antenor Muniz farmed at Alvorada before the city took him. Iris Bohrer *married* Antenor at Alvorada, in 1949. Three
  of the four rivers physically touch the same speck on the map. This is the sharpest single geographic fact in the
  whole dataset: the improbable funnel that took people off Azorean cliffs and Swiss mountainsides and out of
  Portuguese market towns, and set them down, within a generation or two of each other, in the same handful of
  Zona-da-Mata streets.

  Then the twentieth century pulls them apart again — and, in doing so, joins them for good. Getúlio Vargas decreed
  Brazil's first great steelworks, the **Companhia Siderúrgica Nacional**, in 1941, and the sleepy dairy town of
  **Volta Redonda** exploded from under three thousand people to nearly thirty-six thousand by 1950, a planned steel
  city sucking labour out of the surrounding Minas and Paraíba valley. The coffee bust had emptied the countryside;
  partible inheritance had fragmented what land there was; the steel city gathered the pieces into a working class.

  And here the documents deliver the sharpest symmetry in the entire archive, though it needs stating precisely.
  **Two men of this family were tradesmen in Volta Redonda, and they arrived there from opposite directions.** Coming
  *down* was **Aristão Ferreira Armond** — in 1931 a district police authority in Muriaé, appointed by the state
  gazette; by 1 November 1957 registered *"de profissão padeiro"*, a baker, dead at seventy-eight in Volta Redonda.
  The whole fall of a line that had held court appointments and married into the Concórdia completes inside one man's
  lifetime, in the space of twenty-six years. Coming *up* was **Antenor Muniz** — a **bombeiro hidráulico**, a
  plumber, and the first man in his line since 1866 whose death record says *"deixou bens a inventariar"*: he left
  goods to inventory. One family spent roughly forty years dissolving a single estate through the courts. The other
  spent eighty years with no estate at all, and then, in a steel town, finally had one.

  Juan's own grandfather **Geraldo Paz Armond** carried his father's trade but not his father's address: the records
  put his adult working life in **Irajá**, in Rio's Zona Norte, not in the steel city. Volta Redonda was where he
  moved late and where he died, in 1991 — so the family's tie to the mill town runs through his father's working
  years and his own last ones, which is a quieter fact than a tidy story would want, and the true one. Two
  consecutive generations of Armond bakers is the finding; a steel-town dynasty is not.

  That is the confluence, stated as precisely as the records allow: not two families meeting at a level, but two
  opposite motions crossing. The falling line and the rising line passed through the same wage bracket, in the same
  city, in the same decade — and only because they did could their children marry.

  Out of that crossing come the two marriages that make Juan's parents. On the paternal side, **Geraldo Paz Armond
  married Cidália Engrácio Guimarães** at Eugenópolis on 31 May 1952 — the falling Armond-Toledo line joined to the
  Guimarães, whose standing the records place lower than family memory does, and the trading Engrácio. On the maternal side, **Antenor Muniz married Iris Bohrer** at Alvorada
  on 7 December 1949 — the flat São Miguel peasant baseline, with the near-invisible Azevedo poor folded in, joined to
  the rising Swiss-colonist Bohrer. Two vectors on each side; two marriages; and their children — Juan's father,
  **Luis Carlos**, son of Geraldo and Cidalia; Juan's mother, **Lucinea**, daughter of Antenor and Iris, both living,
  and so drawn here only in outline — are the two channels through which all four rivers, at last, run into one bed.

  And that bed is Juan.

  ---

  ## THE MEANING — why it had to be a convergence, not a lineage

  Step back from the individual scenes and the shape of the answer is clear. Juan did not descend from *a* people. He
  is the point where several very different peoples, moving for entirely unrelated reasons, happened to intersect.

  Look at what had to be true. A Portuguese-Azorean line with officers, court appointments and a slaveholding
  fazenda in its reach had to *fall* — through non-heritable office income, partible inheritance, the coffee collapse,
  and urbanisation — all the way down to a baker in a steel town. A dirt-poor Swiss-and-German colonist line had to
  *rise* — off the stony lots of Nova Friburgo, on a subsidy worth about a seventh of a labourer's wage — through
  colonist farming and small-town commerce up to a comerciante in that same steel town. A São Miguel peasant line had
  to hold *flat*, never rising and never falling, from a drowned fisherman to a farmer at Alvorada, carrying an
  all-but-invisible poor Azevedo strand along with it — and then, in one last generation, tip upward. And a self-made
  Portuguese-immigrant commercial line had to cross the Atlantic, hold a modest place on the coffee frontier, and settle into modest
  urban trade. Two of those trajectories go up, one goes down, one stays level and then lifts — and they could only
  produce Juan if they *all arrived at the same class level in the same place at the same time*. The falling line had
  to fall exactly as far as the rising line rose. The class arithmetic of four separate centuries had to sum to one
  number. It did.

  The throughlines are worth naming, because they recur across lines that never knew each other.

  **Migration** is the constant engine — Azorean land-hunger and the gold pull; Portuguese emigration; the King's Swiss
  colony; the coffee frontier; the Vargas steel city. Every ancestor in this book is, at some point, a person leaving a
  place that could not hold them. The measure of that pressure is an old man's decision: Johann Jacob Wehrli boarded a
  ship for Brazil at **sixty-eight**.

  **Office is not an asset — and that lesson repeats at every rung of the ladder.** This is the sharpest thing the
  documents taught us. Simplício José Ferreira Armond looks, at first glance, like a man of standing: court
  *arbitrador*, *curador*, *delegado* of Muriaé, literate, a creditor, a man who hosted a land partition in his own
  house. Yet his *suplente de delegado* post was **unpaid** — a *cargo gratuito* under Lei nº 261/1841 — and he was
  never the titular holder but a second or third substitute. His *arbitrador* and *curador* roles paid only
  per-diligence court fees, which ended when the appointment ended and passed to no heir. His grandson was a baker.
  And then, three rungs down the social scale and an ocean away, the same pattern: Joseph Borer, a Swiss villager, held
  a parish duty the register writes as *"fusemnistr"* — a word we still cannot decipher — which conferred standing and
  no income whatsoever. Status without a wage-base does not survive its holder. It never did, at any altitude.

  **Land divided is land dissolved.** The Toledo, who held heritable land, dissolved more slowly than the Armond, who
  held mostly office — but both dissolved, because an estate split equally among all the children cannot survive two
  generations intact. The arithmetic is in the folios, not in our inference: Mathilde's eight heirs became some thirty
  claimants; one estate was litigated for twenty-two years; Simplício's heirs were allotted *fractions of the value* of
  a house, a mill, a granary, half a sugar engine. And the fragmentation begins before the ocean crossing — Manoel
  Muniz Bytancourt died intestate with eight children on São Miguel, and his daughters married a shoemaker and a
  bricklayer. The family was already sliding when it emigrated. Emigration was the consequence, not the cause.

  **Literacy is the thing that actually transmitted — and it had to be bought again every generation.** It was not
  public and not heritable. Watch it appear and vanish across the archive: Luiza Fernandes de Azevedo signing *a rogo*,
  by another's hand; Valentim Martinho Bohrer recorded a *lavrador* who "não sabia escrever" while his cousins in the
  other Borer family signed their own wills; João Gonçalves Bohrer signing his name one generation later; Simplício's
  daughter signing her own marriage certificate in her father's house in 1894 — and marrying a *lavrador* anyway,
  because literacy alone was not a ladder. In one branch, schooling re-entered the family not by inheritance but by
  marriage, when a man married a *professora*.

  And the sheer **class range** is staggering for one person to contain: officers, a court appointment and ten enslaved
  people valued at three-fifths of an estate at one end; the Azevedo poor who left almost no paper at all, and a
  fisherman who drowned without the sacraments, at the other. Juan is the confluence not only of continents but of
  most of the social scale of a colonial and imperial world.

  One last thing belongs in the meaning, because it is part of what this archive *is*. This story has been wrong
  before, and it says so. In the course of a single pass through the documents it turned out that a "proven" given name
  belonged to a different man entirely; that a birth corrected to October was right the first time, in November,
  because a clerk's "9br" means *Novembris* and not the ninth month; that a woman recorded here for years as Catharina
  Mayer signed her own marriage as Catharina **Moser**; that the Fazenda da Concórdia, long treated as the family's
  ancestral seat, was in fact bought in 1862 and sold by 1880. None of that is embarrassing. It is the difference
  between a family history and a family legend. A legend gets tidier over time; a history gets more accurate, which
  often means less tidy. Every correction above is recorded in this archive, with the document that forced it.

  That is how all these people, from different countries and different centuries, ended up as one person. Not by a
  single bloodline running true, but by a convergence — hundreds of ancestors on the Atlantic islands, in mainland
  Portugal, in the Swiss and German uplands, and across the Brazilian frontier, funnelling down through the coffee
  country and the steel city until, at a common working-class level in mid-century Minas and Rio, the four rivers met.
  The macro-history did the assembling. The documents let us watch it happen.

  ---

  ## The threads still being pulled — the story is not finished

  This is a true history, but it is an *open* one. Several of the rivers still disappear underground before we can
  follow them to their source, and each of those gaps is a real record, somewhere in the world, not yet in our hands.
  They are part of the story too — the questions the family is still asking.

  1. **Simplício's parents — the keystone.** Who was the father of Simplício José Ferreira Armond? Until we know, the
     whole Terceira trunk — Gaspar, Margarida, the Ermonde/Drummond tradition — is Juan's *possible* but *unproven*
     ancestry, and every grand thing in it has to be read in that light. The decisive record is Simplício's ~1868–72
     marriage to Eliza at Argirita / Bom Jesus do Rio Pardo, never microfilmed, waiting in the Juiz de Fora
     archdiocesan archive. This is the single most valuable missing document in the tree.

  2. **The two Gaspars.** Are the Brazilian Gaspar Ferreira and the Terceira Gaspar de Souto-Maior who married
     Margarida das Candeias and died in 1727 one man who emigrated, or two men a generation apart? The compiled
     genealogy lists only one. Resolving it moves every Terceira ancestor up or down a generation, so the archive
     holds the question open rather than guessing.

  3. **The ceiling on Terceira.** Belchior da Ponte Cardoso's own baptism, marriage and burial and seven of his
     children's baptisms are now held as primary parish records — the deepest documented point in the family. But
     everything *above* his wife's parents rests on a single compiled genealogy, Mendes Forjaz, with no register
     behind it. Two bounded searches explain why: the Santa Bárbara baptism book for 1610–1650 is simply missing from
     the online archive, and the 1598 marriage act has been located but is too damaged to read. Three cheap wins
     remain — two burials that should sit in a book already in hand, one clause on a page worth rescanning, and a
     chapter of the compilation we have not yet obtained.

  4. **Francisca Roza's Azorean parents.** Her own baptism is a bounded blank across the surviving Mãe de Deus books —
     she was born before 1818, in registers still undigitised at Ponta Delgada. The São Miguel river runs one
     generation further than we can yet see.

  5. **The whole Paz branch.** Liliosa Paz Armond is proven to exist and proven to have died at Eugenópolis in 1946,
     but her parents — the entire Paz family — are unknown. Her 1946 death certificate would open the line at a stroke.

  6. **The Azevedo grandparents.** José Secundino and Thereza Fernandes de Azevedo's own parents are a total blank — a
     whole couple-pair of Juan's ancestors at the poorest end of the tree. Their daughter Gloria's 1960 Niterói death
     record has been read but is not yet catalogued here, which is exactly the kind of gap that closes quickly once
     someone goes back for the image.

  7. **The Guimarães origin in Portugal.** Vicente José de Carvalho Guimarães is recorded only as *natural de
     Portugal*; no record yet names his parish. And the town the family passed through is itself in question — the
     archive's own place record puts "Vila do Rio Claro" in Rio de Janeiro state while the research trail has long
     assumed Rio Claro in São Paulo. That is unresolved, and it changes the shape of the migration.

  8. **Jacob Borer's Swiss baptism.** The 1825 Nova Friburgo marriage register names his home parish as "Erswill",
     long expanded as Erschwil — until the Staatsarchiv Solothurn searched Erschwil's Catholic registers in full and
     found no such family. The reading is **Beinwil**, and the baptism itself is still unretrieved; the date now in
     circulation comes from a collaborative tree, not a register.

  Beyond these, some seventeen ancestors' portraits currently lean on documents that have been read but not yet
  formally catalogued in this archive — death acts, court appearances, a gazette notice. Each is a real record someone
  has already held in their hands. Bringing them in is the nearest, most certain work left.

  The four rivers are mapped almost to their headwaters. Several of the springs are still hidden. When they surface —
  and in this kind of work they do surface, as archives digitise and letters are answered and certificates arrive —
  this story will grow another chapter, further upstream, closer still to the beginning of how Juan came to be.

  ---

  *A narrative synthesis over the family's documented records — it invents nothing and overrides nothing. Every scene rests on a source held in this archive; where something is inferred, traditional, or still missing, the text says so in the moment. Living people appear by first name only.*
