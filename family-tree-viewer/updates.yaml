    title_pt: "Correção: as genealogias publicadas, relidas na íntegra — 13 datas e vínculos de família apoiados só nelas agora são hipóteses; várias das suas datas são batismos, não nascimentos; a hipótese de Gaspar Ferreira ter vindo da Terceira fica mais fraca; e um irmão de Vicente Borer listado por engano foi removido, com as datas de nascimento de duas irmãs corrigidas"
