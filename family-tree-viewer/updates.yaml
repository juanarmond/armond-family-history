# Curated EDITORIAL entries for the "What's new / Novidades" feed — milestones, corrections
# and profile ("portrait") highlights that cannot be derived automatically.
#
# Every non-private DOCUMENT is added to the feed automatically by scripts/build_updates.py
# (dated from git, linked to its subject) — do NOT list individual documents here. Use this
# file only for the editorial layer that git cannot classify. The generator merges both into
# updates.json (what the viewer reads); regenerate with `make updates`.
#
# Each entry:
#   date     YYYY-MM-DD
#   kind     milestone | correction | person | document
#   title / title_pt   one-line, family-facing
#   primary  (optional) an id whose reader/panel the headline opens
#   links    (optional) entity ids shown as chips — P-#### opens the person; a source id
#            opens the record. Only reference deceased people.
#   replaces (optional) the earlier titles of an entry that is already live and dated today —
#            one title, or a list of every earlier title. Set it when rewording such an entry,
#            so the deploy does not send its notification a second time.

updates:
  - date: "2026-10-10"
    kind: correction
    title: "Correction and new ancestors: Rosa Eugenia de Lemos's four grandparents are now in the tree from two Itaboraí baptisms; her family's baptisms were re-read on the images and her parents' marriage confirmed; Francisco José Bohrer's will proves to date from 1879, and his estate went to his creditors; and the Terceira family of Belchior da Ponte Cardoso is no longer shown as a proven ancestry — the Gaspar of Vila Rica and the Gaspar of Terceira were two different men"
    title_pt: "Correção e novos antepassados: os quatro avós de Rosa Eugenia de Lemos entram na árvore por dois batismos de Itaboraí; os batismos da família foram relidos nas imagens e o casamento dos pais confirmado; o testamento de Francisco José Bohrer é de 1879, e os bens foram para os credores; e a família terceirense de Belchior da Ponte Cardoso deixa de aparecer como ascendência provada — o Gaspar de Vila Rica e o Gaspar da Terceira eram dois homens diferentes"
    replaces:
      - "Correction: the Lemos baptisms re-read on the images — Rosa Eugenia de Lemos was baptised on 12 October 1835, her parents' marriage is now confirmed by five baptisms, the supposed second wife \"Maria Nunes de Jesus\" was a misreading, and her 1879 marriage was registered at Itaboraí, not Nova Friburgo"
    links: [P-0035, P-0132, P-0134, P-0034, P-0131, P-0092, PRB-0005]

