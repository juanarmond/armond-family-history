# Curated "What's new" feed for the viewer — family-facing and bilingual.
#
# This is NOT the engineering CHANGELOG.md (that stays in git for developers). It is the
# public, human-readable record of what was added to the archive, newest first.
#
# Each entry:
#   date     YYYY-MM-DD (when the record/change was added)
#   kind     document | person | correction | milestone
#   title    English one-line, family-facing
#   title_pt Portuguese one-line
#   links    entity IDs — a P-#### opens that person's panel; a source ID (CIV/GOV/PAR/…)
#            opens that record in the reader. Only reference deceased people.
#
# Keep entries short and meaningful. Never reference a living person.

