      b.1784 Simplício José died solteiro per both Lacerda (1845 inventory, 1831
      census) and the Mauro Senra blog. The Barbacena patriarch's own origin is
      itself contested in the sources (Ilha Terceira/São Sebastião vs. a
      French/Madeira claim), so do not assert it. First crack at this Simplício's
      parentage: the full baptismal act of Marfiza (Piacatuba, 15 Feb 1873), not
      just the index row. Only the Chagas 2018 UFMG dissertation was verified; a
      "Chagas 2024" work was not found.
  - text: >-
      29 July 2026 (deep dig): the 1831 Curral Novo census (primary) confirms the
      anti-merge — the b.~1785 Simplício José was 46, solteiro and the district
      Juiz de Paz; his celibate brothers held 66 cativos. The documented Barbacena
      tree (Lacerda/Chagas) does NOT reach Piacatuba, so the bridge is currently
      unsupported. NEW lead: a MARRIED Armond, Manoel Antonio de Armond (João
      Gomes/Barbacena, 1831 census, tropeiro), is a more plausible source of a
      later "Simplício" namesake than the celibate Curral Novo brothers. The
      decisive test remains the Piacatuba marriage of this Simplício x Elisa
      (FamilySearch catalog 345430). Sources in research/resources/; outreach in
      logs/correspondence-log.md.
  - text: >-
      30 July 2026 (catalogued): the two thesis-mining leads above are now source
      records — Lacerda 2010 as PUB-0002 (published_genealogy, lead_only) and the
      1831 Curral Novo population list as GOV-0002 (census, context_only; the
