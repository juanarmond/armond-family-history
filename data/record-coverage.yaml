  notes:
  - text: >-
      Preferred name is now "Simplício José Ferreira Armond" (owner-confirmed; his
      autograph signature in PRB-0002 and the 1881 heir list PRB-0001). The source
      variants "Simplicio Armand" (CIV-0005) and "Simplício Ferreira Armond"
      (CIV-0013) are preserved.
  - text: >-
      Unverified published-genealogy lead (Mauro Senra, "Ferreira Armond — Uma
      Família Mineira", alemparaibahistoria.blogspot.com, reviewed 28 July
      2026): a Simplício [José] Ferreira Armond married Elisa Balbina Tolledo,
      and their daughter Marfisa Ferreira Armond was baptised on 15 February
      1873 in the Igreja de Nossa Senhora da Piedade, Piacatuba (Leopoldina).
      This aligns with the fuller-name lead and with the Piacatuba baptism
      registers already targeted for Aristão. Lead only; inspect the underlying
      baptism image before promoting.
  - text: >-
      29 July 2026 (thesis mining, Lacerda 2010 + Chagas 2018): the documented
      Azorean Ferreira Armonde family (patriarch Francisco Ferreira Armonde, b.
      1691 Ilha Terceira/São Sebastião; Fazenda dos Moinhos, freguesia da Piedade
      de Barbacena) migrated into the Zona da Mata, notably Além Paraíba, next to
      Piacatuba — a plausible but UNPROVEN bridge to this Simplício. Anti-merge:
      the first-generation Simplício José Ferreira Armonde died unmarried; do not
      conflate. To test the link, find this Simplício's marriage to Elisa Balbina
      Toledo and his baptism (Barbacena Piedade baptism book 1828-1872, or
      Piacatuba/Além Paraíba). Full analysis in
      logs/2026-07-29-online-gap-and-resource-research.md.
  - text: >-
      29 July 2026 (parallel research): the anti-merge is doubly documented — the
      b.1784 Simplício José died solteiro per both Lacerda (1845 inventory, 1831
      census) and the Mauro Senra blog. The Barbacena patriarch's own origin is
      itself contested in the sources (Ilha Terceira/São Sebastião vs. a
      French/Madeira claim), so do not assert it. First crack at this Simplício's
      parentage: the full baptismal act of Marfiza (Piacatuba, 15 Feb 1873), not
      just the index row. Only the Chagas 2018 UFMG dissertation was verified; a
      "Chagas 2024" work was not found.
  - text: >-
