- person_id: P-0016
  external_profiles: []
  records:
  - record_type: birth
    status: unsearched
    source_ids: []
    last_reviewed: "2026-08-14"
    next_action: >-
      First verify the identity and fuller name through Aristão's birth,
      baptism or marriage record; then search this person's own earlier record.
      Trunk lead: retrieve the Barbacena PRINCIPAL autos of Honório J. F. Armonde's
      1845 inventário (partilha/título with filiation + ages) to test the six named
      adult "Ferreira Armonde" heirs as candidate fathers; then Simplício's ~1853
      baptism / his marriage to Eliza (each names his parents).
    notes:
    - text: >-
        Collateral Barbacena Armond leads to cross-search when hunting Simplício's
        parents (2026-08-11 value gate) — connection to this P-0016 is UNPROVEN in
        every case; do NOT merge. From COARPE 55816337 (Barbacena 1831 execução, PDF
        held): the creditor Tenente Coronel Simplício José Ferreira Armonde is the
        ELDER Simplício (b.1785, Barbacena; solteiro/childless per the Lacerda thesis),
        NOT this P-0016; the same case names two further Barbacena Armonds — José
        Ferreira e Armondes (Juiz de Paz) and Honório José Ferreira Armondes (attorney),
        both b. c.1780-1810, likely kin of the elder Simplício. Add the titled-trunk
        priest padre José Joaquim Ferreira Armond (vigário of the Barbacena matriz 1820,
        "tio do conde de Prados e do visconde de Pitanguy"). Cross-search these in
        COARPE Barbacena probate + FS Full-Text + Barbacena parish books. Classified as
        leads, not FAN/entities (they appear in cases not involving our modelled people).
        SUPERSEDED (was "bounded negative", 2026-08-12): a fuller re-read of Honório José
        Ferreira Armonde's 1845 inventário (LAMPEH Mariana annex, 19pp) on 2026-08-14
        corrects the earlier "sibling/nephew heirs, no natural son" call. The 19pp held are
        only the Barbacena→Mariana CARTA PRECATÓRIA (opening petition + Mariana appraisal of
        an ironwork estate) — no auto de abertura, will text, or partilha/título de herdeiros
        with filiation or ages; those remain in the Barbacena PRINCIPAL autos (off-tool,
        AHMPAJS). The interested parties are the widow-tutora Dona Maria [Josefa?] de Santa
        Anna, guardian of Honório's MINOR children (under 12–14), plus six adult "Ferreira
        Armonde" signatories — Marcelino, Simão José, Pedro José Joaquim, Padre Francisco
        Antonio, Flavio José, Manoel Ignacio — and Anna Escolastica Umbelina de Barbosa; the
        precatória does NOT state each one's filiation to Honório. So it neither confirms nor
        rules out the trunk: Honório (dead by 1845) is at most a candidate GRANDFATHER of a
        child born ~1853, and any of the six adult Ferreira Armonde men (or a minor son grown)
        is a candidate FATHER — a LEAD only, on the matching "…José Ferreira Armond(e)" naming
        convention, never a link. Executor Antonio José Ferreira Armonde (testamenteiro; d.1852,
        will at Barbacena) and Lino José (d.1870, will → "Severiano José Ferreira") are further
        trunk members, relationships to Honório not stated here. DECISIVE next records: the
        Barbacena PRINCIPAL autos (partilha/título giving each heir's filiation, age and spouse
        — to see which are Honório's sons), paired with Simplício's own ~1853 baptism or his
        marriage to Eliza naming his parents.
    - text: >-
        Newspaper OCR (2026-08-10) — this rests on the retrieval agent's per-item dated
        reads; no newspaper images were retained, so the dates were not independently
        re-verified here. The "Ferreira Armond" sweep of O Pharol (Juiz de Fora, 11 of 13
        matches) and Correio da Manhã (1 match per decade) surfaced exactly ONE direct-line
        item: the already-catalogued 1902 Muriaé-delegado notice (NWS-0003, O Pharol 13
        Sept 1902 — O Pharol match #10). It found nothing new — no parent, no wife Eliza,
        no child, no death for Simplício; every other hit is a collateral (the titled
        Pitangui/Ferreira-Lage branch, RJ/JF civil-servant and student namesakes). This is
        a SAMPLE-bounded negative (1 match/decade for CdM), not an exhaustive one.
        DATE is the clean discriminator between the two same-named men: the elder Simplício
        (Tenente Coronel, b.1785) was active c.1810–1840 and died childless by ~1850s (so
        the 1831 execução is his), whereas ANY item naming a living Simplício Ferreira
        Armond after ~1875 is OUR Simplício (b.~1853, active Muriaé/Leopoldina 1875–1913) —
        as the 1902 delegado item (NWS-0003) proves. That window is therefore his own
        lifetime and was only thinly sampled, so it is UNDER-EXPLORED, not spent. Highest-
        value target: our Simplício's own death notice (he recurs in probates to 1913 and
