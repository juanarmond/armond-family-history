- text: >-
    Francisco José Bohrer and Rosa Eugenia de Lemos, parents of Joaquim José Bohrer
    (P-0030). The parent link rests on Alberto Bohrer's 1890 birth (CIV-0019), which
    names them as the child's paternal grandparents; their own marriage is recorded
    in PAR-0002. Strong-evidence: the parentage is stated indirectly (in a
    grandchild's birth) by Joaquim José's brother.
