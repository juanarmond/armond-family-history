documented_children:
- name: Laura Bohrer
  source_ids:
  - PRB-0005
  note: >-
    Daughter of Francisco José Bohrer and Rosa Eugenia de Lemos, a minor in 1888;
    named "Laura" among the four children/heirs in her father's 1888 will
    (PRB-0005). The will gives only the forename; surname taken from the family.
- name: Guilherme Samuel Bohrer
  source_ids:
  - CIV-0019
  - PRB-0005
  note: >-
    Brother of Joaquim José Bohrer (P-0030), resident at the Alto da Serra, Nova
    Friburgo; declared his nephew Alberto's 1890 birth (CIV-0019) in the father's
    absence, and named "Guilherme" among the four heirs in his father's 1888 will
    (PRB-0005).
- name: Fernando Bohrer
  source_ids:
  - PRB-0005
  note: >-
    Son of Francisco José Bohrer and Rosa Eugenia de Lemos, a minor in 1888; named
    "Fernando" (the youngest) among the four children/heirs in his father's 1888
    will (PRB-0005). The will gives only the forename; surname taken from the family.
event_ids:
- E-0026
notes:
- text: >-
    Francisco José Bohrer and Rosa Eugenia de Lemos, parents of Joaquim José Bohrer
    (P-0030). The parent link is now confirmed by Francisco José's own 1888 will
    (PRB-0005), which names all four children (Joaquim, Laura, Guilherme, Fernando)
    as sole heirs; it is corroborated by Alberto Bohrer's 1890 birth (CIV-0019) and
    the couple's 1879 marriage (PAR-0002).
- text: >-
    The 1888 will also names Rosa's brother "Candido Pereira de Lemos" as Francisco
    José's cunhado and second-named executor — a lead for the (still open) Lemos
    maternal line of Rosa Eugenia de Lemos (P-0035); not modelled as its own entity.
