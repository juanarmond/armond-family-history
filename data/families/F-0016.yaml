  notes:
  - text: >-
      Their marriage was justified and registered at the Nova Friburgo Matriz in
      1879 (PAR-0002), the ceremony having taken place earlier before the coadjutor
      of the Freguesia de Itaboraí. A retroactive justificação resting on witness
      testimony, so strong-evidence rather than confirmed. Francisco José's own 1888
      will (PRB-0005) additionally confirms he was "casado á face da Igreja com Roza
      Eugenia de Lemos".
