- name: >-
    Gaspar de Souto-Maior (bapt.23.2.1657 S.Sebastião; d.2.12.1727, no place printed; m.1
    2.10.1690 Convento da Graça, Angra, D. Margarida Machado; m.2 8.2.1694 S.Sebastião Maria
    Mendes de Borba; children Maria, António and Lourença bapt. S.Sebastião 1698–1701;
    possibly the father of the Barbacena patriarch Francisco Ferreira Armonde — a lead from
    PUB-0002 f. 55, unproven) [Corrected 2026-10-09 against the full verbatim transcription of
    PUB-0005: "b." is the book's abbreviation for baptised, not born; the book prints no death
    place (earlier "d.2.12.1727 S.Sebastião" and "stayed in Terceira"); the 1694 marriage and
    the 1698–1701 baptisms were omitted; and Vol. IX names the 1690 wife "D. Margarida
    Machado" — the earlier "Margarida das Candeias Machado" is not the book's form. "Margarida
    das Candeyas" comes from another source: the 1751 will of Francisco Ferreira Armonde, as
    quoted by Lacerda (PUB-0002, f. 55), names him "natural da Ilha Terceira da Freguesia da
    Vila de São Sebastião" and son of "Gaspar de Souto Maior e de sua mulher Margarida das
    Candeyas, já defuntos"; Lacerda's footnote 74, citing an online mailing-list post (a lead,
    not proof), makes Margarida das Candeyas (bapt. 29.5.1667, d. 9.4.1693, São Sebastião) the
    first wife of a Gaspar de Souto Maior bapt. 23.9.1657 (against Vol. IX's 23.2.1657), d.
    2.12.1727, who remarried Maria Mendes Borba. Whether the will's couple is this Gaspar and
    D. Margarida Machado is an open question. Vol. IX's footnote 10 names a different woman,
    D. Maria das Candeias, wife of Domingos Mendes de Borba.]
    [COMPILED — every fact in this entry rests on PUB-0005 alone. No primary Terceira baptism or marriage
    record for this Gaspar is catalogued here. An earlier version cited a "primary baptism
    register" for a birth of 23.12.1657 and a 1690 marriage act naming Belchior × Mariana;
    neither record is held, so both citations and the "compiler transposition" reading that
    demoted PUB-0005's 23.2.1657 were removed 2026-09-24. Distinct from the modelled P-0092
    (Brazil Gaspar), whose identity conflict with the 2.12.1727 S.Sebastião [corrected
    2026-10-09: no place printed] death and the 1694–1701 Terceira entries is unresolved —
    see P-0092 notes]
