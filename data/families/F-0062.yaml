  notes:
  - text: >-
      Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), married 26 September 1650
      at the church of Santa Bárbara, Terceira. Primary parish record PAR-0086 (image 0072)
      confirms both names; Vol. IV PUB-0004 ("C. em Stª Bárbara a 26.9.1650 com Belchior da
      Ponte Cardoso") and Vol. IX PUB-0005 ("C. 2ª vez em Stª Bárbara a 26.9.1650 com Mariana
      Fagundes") provide bilateral cross-reference. This was Belchior's second marriage; his
      first was with Bárbara Gato (S.g., no surviving children). The couple lived at Belo Jardim,
      in the termo of the vila da Praia, Terceira.
