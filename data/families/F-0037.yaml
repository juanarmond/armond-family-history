notes:
- text: >-
    The Borer family was common in the Erschwil/Grindel area of Solothurn canton.
    The relationship between this Joseph Borer × Anna Maria Borer family and the
    Nova Friburgo Borer immigrant families (BORER I: Jacob Borer, P-0050, b. 1801
    Erschwil; BORER II: Laurent Borer, P-0068, b. 1797 Grindel) is not established
    by primary evidence. The Raibert Wehrli blog suggested a kinship link between
    the Borer × Wehrli couples, but this remains a research lead.
