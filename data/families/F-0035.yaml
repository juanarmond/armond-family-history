notes:
- text: >-
    The patriarch Johann Jacob Wehrli (P-0072) and his wife Elisabetha Borer (P-0073)
    emigrated to Brazil in 1819 on the Heureux Voyage together with most of their
    children, including Anna Maria (P-0069). The patriarch died at Nova Friburgo on
    28 May 1827; his wife died at Nova Friburgo on 10 October 1832.
- text: >-
    Marianne and Elise Wehrli did not embark ("não embarcaram") despite being listed
    on the manifest — they stayed in Europe. The Casa Suíça DB lists nine children
    who emigrated. Anna Maria (P-0069) was the 5th daughter.
