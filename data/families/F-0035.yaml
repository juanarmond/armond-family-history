  notes:
  - text: >-
      Marriage confirmed by Swiss Catholic marriage register (Grindel parish, page 71,
      entry 4, PAR-0029): "Die 27ma Januarii 1782: Jacobus Wehrlia[?] et Elisabetha
      Borer ambo ex Grindel, Erischwyg. Testes fuerunt Heinricus Werli et Catharina
      Borer." Archived as evidence/parish/PAR-0029-wehrli-borer-marriage-1782-grindel.jpg
      (2026-08-09).
