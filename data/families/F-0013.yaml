notes:
- text: >-
    Valentim Martinho Bohrer and Carolina Bohrer, parents of João Gonçalves
    Bohrer (P-0014). Established by two corroborating civil records: João's 1970
    death (CIV-0014) and Eunir Bohrer's 1924 Nova Friburgo birth (CIV-0016,
    paternal grandparents). Two of their other children are now attested by primary
    Nova Friburgo baptism acts — Maria Clara (1908, PAR-0052) and Durval Baptista
    (1910, PAR-0053), both naming the couple as legitimate parents. João's own membership
    stays strong-evidence pending his own baptism/filiation act.
