  - text: >-
      The marriage is confirmed by the Mãe de Deus marriage record (PAR-0024, folio
      32r, event E-0053): Manoel Muniz Bitancourt married Francisca Roza do Espírito
      Santo on 17 February 1842 at N.S. Mãe de Deus, Povoação, São Miguel, dispensed
      from a 4th-degree consanguinity impediment. Corroborated by Manoel's 1866
      Povoação death (PAR-0015), which names her as his wife and states the couple had
      "oito filhos." (Corrected 11 August 2026 from a mis-identified 1845 folio-73r
      image — a different couple; see PAR-0024.)
