notes:
- text: >-
    João Muniz Bittencourt (P-0019) is the child of Manoel Muniz Bytancourt (P-0042)
    and Francisca Roza do Espirito Santo (P-0047), of Nossa Senhora Mãe de Deus,
    Povoação, Ilha de São Miguel (Açores, Portugal). Manoel's 1866 óbito (PAR-0015)
    records the couple and that they left "oito filhos"; João's own 1915 óbito
    (PAR-0007) confirms his paternity. The couple's other seven children are not
    evidenced by the located records, so only João is modelled here.
