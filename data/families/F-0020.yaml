documented_children:
- name: Maria Muniz Bytancourt
  source_ids:
  - PAR-0045
  note: >-
    Daughter of Manoel Muniz Bytancourt (P-0042) × Francisca Roza (P-0047); sister of
    the emigrant João (P-0019). Born 26 December 1842, baptised 1 January 1843
    (PAR-0045); a margin note records a death about April 1931. The couple later had a
    second daughter also named Maria (1851, below) — two distinct daughters of the name.
- name: Francisca Muniz Bitancourt
  source_ids:
  - PAR-0046
  note: >-
    Daughter of Manoel Muniz Bitancourt (P-0042) × Francisca Roza (P-0047); sister of
    João (P-0019). Born 31 August 1849, baptised 2 September 1849 (PAR-0046).
- name: Maria Muniz Bitancourt
  source_ids:
  - PAR-0047
  note: >-
    Daughter of Manoel Muniz Bitancourt (P-0042) × Francisca Roza (P-0047); sister of
    João (P-0019). Born 29 November 1851, baptised 21 December 1851 (PAR-0047). A
    namesake of the couple's 1842 daughter Maria (PAR-0045) — a distinct, later child.
- name: Manoel Muniz Bytancourt (the younger)
  source_ids:
  - PAR-0022
  note: >-
    Son of Manoel Muniz Bytancourt (P-0042) × Francisca Roza (P-0047); brother of the
    emigrant João (P-0019), with whom he was co-baptised. Born 24 March 1845 and baptised
    the same day (PAR-0022, Nº 5, fol. 59). The two brothers share the identical birth date
    in one joint act, so twinning is inferred, though "gêmeos" is not written. Named
    "Manoel" after his father (P-0042); distinguished by generation.
event_ids:
- E-0053
notes:
- text: >-
    João Muniz Bittencourt (P-0019) is the child of Manoel Muniz Bytancourt (P-0042)
    and Francisca Roza do Espirito Santo (P-0047), of Nossa Senhora Mãe de Deus,
    Povoação, Ilha de São Miguel (Açores, Portugal). The couple married on 17 February
    1842 (PAR-0024, folio 32r, E-0053); their son João was born 24 October 1845
    (PAR-0022). Manoel's 1866 óbito (PAR-0015) records that they left "oito filhos";
    João's own 1915 óbito (PAR-0007) corroborates his paternity. The couple's other
    seven children are not evidenced by the located records, so only João is modelled here.
