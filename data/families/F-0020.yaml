    notes:
    - text: >-
        Confirmed by João's own 1845 baptism (PAR-0022), which names Francisca Roza
        do Espirito Santo directly as his mother. Previously strong-evidence only
        (Manoel's 1866 death PAR-0015 named her as wife and mother of his "oito
        filhos", and João's own óbito PAR-0007 did not name her); his baptism now
        provides direct attestation.
