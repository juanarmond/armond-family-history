        the same district — her daughter Luiza, "filha legitima de Secundino Maria de Azevedo
        e D. Thereza Fernandes de Azevedo", was born and baptised at Bom Jesus de Cachoeira Alegre
        about 1898 (PAR-0012, CIV-0001), where the will's couple were heirs in November 1898 (PRB-0014).
