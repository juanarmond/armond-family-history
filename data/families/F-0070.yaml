        with no material conflict — a coherent body of primary evidence under research/README.md
        — so the link is confirmed.
      text_pt: >-
        Confirmada (elevada de evidência forte em 2026-10-12, depois de cada elo abaixo ter sido
        relido nas imagens originais). O testamento de 1890 do pai lista "Thereza, casada com
        Secundino de Azevedo" entre os cinco filhos vivos (PRB-0013), e o inventário de 1898 nomeia
        "D. Thereza de Jesus casada com Secundino de Azevedo" entre os herdeiros de Bom Jesus
        da Cachoeira Alegre (PRB-0014); o batismo de 1864, em Pousa, de Thereza de Jesus, filha
        de Manoel João Fernandes e Anna Exposta, é a mesma criança (PAR-0108; os cinco sobreviventes
        do testamento coincidem exatamente com os livros de Pousa). O passo dessa Thereza a P-0039,
        Thereza Fernandes de Azevedo, apoia-se no mesmo prenome, num marido Secundino de Azevedo
        (P-0038) e no mesmo distrito — a filha Luiza, "filha legitima de Secundino Maria de Azevedo
        e D. Thereza Fernandes de Azevedo", nasceu e foi batizada em Bom Jesus de Cachoeira Alegre
        por volta de 1898 (PAR-0012, CIV-0001), onde o casal do testamento era herdeiro em novembro
        de 1898 (PRB-0014). Nenhum registro traz as duas formas do nome juntas, mas esses registros
        primários independentes concordam sem conflito material — um conjunto coerente de evidência
        primária segundo research/README.md —, de modo que o vínculo está confirmado.
