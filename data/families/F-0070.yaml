event_ids:
- E-0142
notes:
- text: >-
    Manoel João Fernandes da Cruz and Anna Maria, a foundling: parents of Thereza (P-0039), Antenor
    Muniz's maternal grandmother. Nine children were born at the lugar do Souto, Pousa, 1855–1871,
    and four died young (PAR-0124–PAR-0135), leaving exactly the "nove filhos, achando-se vivos
    presentemente apenas cinco" of the 1890 will (PRB-0013). The family emigrated to Minas Gerais
    between late 1871 and 1885 [inference from PAR-0135 and PRB-0016].
  text_pt: >-
    Manoel João Fernandes da Cruz e Anna Maria, exposta: pais de Thereza (P-0039), avó materna
    de Antenor Muniz. Nove filhos nasceram no lugar do Souto, Pousa, entre 1855 e 1871, e quatro
    morreram pequenos (PAR-0124–PAR-0135), restando exatamente os "nove filhos, achando-se vivos
    presentemente apenas cinco" do testamento de 1890 (PRB-0013). A família emigrou para Minas
    Gerais entre o fim de 1871 e 1885 [inferência de PAR-0135 e PRB-0016].
