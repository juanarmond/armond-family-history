    notes:
    - text: >-
        Geraldo's 1952 marriage certificate (CIV-0002) is deliberately NOT cited
        on this link. The certificate is torn and water-stained exactly across
        the paternal clause — it reads "filho de [torn/stain: nome do pai
        perdido] ... e de Dona Liliosa Paz" — so it names only the mother and
        attests nothing about Aristão. Aristão's paternity therefore still rests
        on the single informant-reported filiation in Geraldo's 1991 Volta
        Redonda death act (CIV-0003) and stays strong-evidence pending Geraldo's
        own birth or baptism record (Limeira / Eugenópolis, 1915).
  - parent_id: P-0009
    relationship_type: unknown
    status: strong-evidence
    source_ids:
    - CIV-0002
    - CIV-0003
    notes:
    - text: >-
        Geraldo's 1952 marriage certificate (CIV-0002) names his mother as "Dona
        Liliosa Paz [uncertain: Armond], nascida aqui, falecida em 16-4-946" —
        the damage that destroyed the father's name spared this clause — and is
        now cited here; the stated 1946 death and Eugenópolis birth match the
        held evidence for Liliosa, so the identification is secure. The tier is
        unchanged: both attestations (Geraldo's own declaration at his 1952
        marriage and a family member's at the 1991 death registration) descend
        from the same family knowledge, so they are not two independent records
        of the birth itself.
