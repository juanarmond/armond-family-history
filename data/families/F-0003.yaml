    notes:
    - text: >-
        The government index prints the father's given name as "Aristac".
        Identity with Aristão is strongly supported by the full name pattern,
        the exact maternal name and the existing family evidence, but the
        source spelling is preserved.
    - text: >-
        The February 1975 marriage banns published in O Processo (NWS-0001) name
        José Olavo as "filho de Aristão Ferreira Armond e de d. Liliosa Paz
        Armond" and are now cited here; being a registrar's proclamas from a
        different jurisdiction (Conselheiro Lafaiete), they independently settle
        the "Aristac" print variant above as Aristão. The tier is unchanged: a
        newspaper republication of proclamas carries secondary information, as
        does the 1973 driver-dossier index, so neither is a primary record of
        the birth and no birth or baptism act for José Olavo has been located.
