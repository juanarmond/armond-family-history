notes:
- text: >-
    Parents of João Francisco Muniz Bitancourt (P-0048), established by his 1819
    Mãe de Deus marriage (PAR-0037). Extends the Muniz Bittencourt line one further
    generation, into Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel
    (Açores). Only João Francisco is modelled as a child here.
  text_pt: >-
    Pais de João Francisco Muniz Bitancourt (P-0048), estabelecidos por seu
    casamento de 1819 em Mãe de Deus (PAR-0037). Estende a linha Muniz Bittencourt
    mais uma geração, para Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel
    (Açores). Apenas João Francisco é modelado como filho aqui.
