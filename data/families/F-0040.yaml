  notes:
  - text: >-
      Manoel Muniz Bitancourt (P-0082) and Tereza do Amaral (P-0083) are named
      together as the parents of their son João Francisco Muniz Bitancourt (P-0048)
      in his 1819 Mãe de Deus marriage (PAR-0037), which attests the couple; their
      own marriage record is not located. Tereza is recorded "já defunta" in 1819.
      Corroborated by the 1843 baptism of their grandson Agostinho (PAR-0044), which
      names them as the paternal grandparents ("Manoel Munis de Betencourt e Tereza
      d'Assumpção" — a devotional variant of "do Amaral").
