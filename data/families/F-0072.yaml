    notes:
    - text: >-
        Strong evidence: eight baptisms of Bento's children (1829–1843) consistently name Manoel
        Fernandes and Jozefa Maria, of Quintã, as paternal grandparents, and the 1807 baptism
        of a Bento of the same parents and lugar is very probably his own (PAR-0109). Grandparents
        in a baptism are reported information, and the 1807 identification is not proven, so the
        link is not confirmed.
      text_pt: >-
        Evidência forte: oito batismos dos filhos de Bento (1829–1843) nomeiam sempre Manoel Fernandes
        e Jozefa Maria, de Quintã, como avós paternos, e o batismo de 1807 de um Bento dos mesmos
        pais e lugar é muito provavelmente o dele (PAR-0109). Avós num batismo são informação
        declarada, e a identificação de 1807 não está provada, por isso o vínculo não é confirmado.
