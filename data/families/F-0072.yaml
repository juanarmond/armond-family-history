notes:
- text: >-
    Manoel Fernandes and Jozefa Maria Domingues, of Quintã, São Romão da Ucha: parents of Bento
    José Fernandes (P-0141). Both dead by 29 March 1837 (PAR-0116); see P-0143 for an 1839 namesake.
  text_pt: >-
    Manoel Fernandes e Jozefa Maria Domingues, de Quintã, São Romão da Ucha: pais de Bento José
    Fernandes (P-0141). Ambos falecidos em 29 de março de 1837 (PAR-0116); ver P-0143 sobre um
    homônimo de 1839.
