  notes:
  - text: >-
      The couple is named on the cover of their joint 1867 inventário (PRB-0008):
      "INVENTÁRIO / José Cesario de Tolledo Lima / Claudina Brandina de Jesus" —
      the first primary record to state Claudina's full name. PRB-0006 (1879 Matilde
      inventário, heir #4) names them as "José Cezario de Tolledo Lima, fallecido,
      cazado que foi com D. Claudina, tambem fallecida." PRB-0009-p2 (1867 Ladisláo
      inventário) declares "a mae destes Dona Claudina Brandina de Jesus é viúva."
      No marriage record located.
