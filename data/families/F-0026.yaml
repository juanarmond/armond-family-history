    PRB-0009 Ladisláo inventário 1867, "Mathildes Olympia da Paixão, Solteira de
    vinte annos"). Widow of the late Manoel Antonio Caza[nna?] by 1879.
- name: Josephina Christina da Silva Lima
  source_ids:
  - PRB-0006
  - PRB-0009
  note: >-
    Sibling of Eliza (representante #3 in PRB-0006, 1879; representante #4 in
    PRB-0009 Ladisláo inventário 1867 as "Josefina Cristina de [Acevedo?]"). Already
