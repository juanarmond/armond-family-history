- name: Maria Bulandina (or Claudina) de Toledo
  source_ids:
  - PRB-0006
  - PRB-0008
  - PRB-0009
  note: >-
    Sibling of Eliza (representante #4 in PRB-0006 1879 as "Maria Bulandina";
    item 5 among JC's representantes in PRB-0009 1867 as "Maria Claudina de Toledo";
    end of item on PRB-0008-p8). Married Manoel Marques Jorge. The name varies between
    "Bulandina" (1879) and "Claudina" (1867) — both are the same person; the
    Bulandina/Claudina/Brandina cluster reflects the same naming pattern as the
    mother Claudina Brandina de Jesus.
- name: Ladisláo Egydio Ferreira de Toledo (younger)
  source_ids:
  - PRB-0006
  - PRB-0008
  - PRB-0009
  note: >-
    Sibling of Eliza (representante #6 in PRB-0006 1879, solteiro, 23 anos;
    item 7 in PRB-0008 1867, "Ladislao Egydio de Tolledo, Solteiro de doze annos";
    item 7 in PRB-0009-p2 1867). The YOUNGER Ladisláo — distinct from his grandfather
    P-0056 (Mathilde's husband of the same name).
- name: Geraldo Augusto de Toledo Lima
  source_ids:
  - PRB-0006
  - PRB-0008
  - PRB-0009
  note: >-
    Sibling of Eliza (representante #7 in PRB-0006 1879, solteiro, 15 anos, at
    the Corte; item 8 in PRB-0008 1867, "Geraldo, de dois annos de idade"; item 8
    in PRB-0009-p2 1867).
- name: Josefa (Josepha Olympia da Paixão)
  source_ids:
  - PRB-0006
  - PRB-0008
  - PRB-0009
  note: >-
    Sibling of Eliza (representante #8 in PRB-0006 1879 as "Josepha Olympia da
    Paixão", solteira, 12 anos; item 9 in PRB-0008 1867 as "Uma pha [filha] de seis
    meses"; item 9 in PRB-0009-p2 1867 as "Josefa, idade de seis meses"). The infant
