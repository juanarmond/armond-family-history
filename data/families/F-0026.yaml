        PRB-0008 (JC's own 1867 inventário, p8): "Simplicio José Ferrara [Ferreira]
        de Tolledo, Solteiro de quatorze annos" — item 6 of JC's children's list.
        PRB-0009 (Ladisláo's concurrent 1867 inventário, p2): "Simplicio José Perrura
        [Ferreira] de Tolledo, Solteiro de quatorze annos" — item 6 among JC's
        representantes. Two independent primary records confirm Simplício as JC's son.
