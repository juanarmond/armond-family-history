  notes:
  - text: >-
      The couple is named on the cover of their joint 1867 inventário (PRB-0008):
      "INVENTÁRIO / José Cesario de Tolledo Lima / Claudina Brandina de Jesus" —
      the first primary record to state Claudina's full name. PRB-0006 (1879 Matilde
      inventário, heir #4) names them as "José Cezario de Tolledo Lima, fallecido,
      cazado que foi com D. Claudina, tambem fallecida." PRB-0009-p2 (1867 Ladisláo
      inventário) declares "a mae destes Dona Claudina Brandina de Jesus é viúva."
      No marriage record located.
children:
- person_id: P-0017
  parent_relationships:
  - parent_id: P-0054
    relationship_type: biological
    status: confirmed
    source_ids:
    - PRB-0006
    notes:
    - text: >-
        PRB-0006 (1879 Matilde inventário, folio 9, Film 2 triage 2026-08-07): Eliza
        appears as representante #5 under heir #4 (JC × Claudina). Per 19th-century
        Brazilian inheritance law, a married woman appeared in estate proceedings through
        her husband as legal representative; item 5 reads "5º Simplicio José Ferreira
        Armond, cazado com D. Eliza Balbina de Tolledo" with her husband Simplício named
        first as her legal actor — Eliza is the actual heir. NOTE: the "Simplício José
        Ferreira de Toledo, solteiro, quatorze annos" in PRB-0008 (JC's 1867 inventário,
        item 6) and PRB-0009 (item 6 among JC's representantes) is a DIFFERENT person
        — JC's OWN SON with the Toledo surname — who died before 1879. Our Simplício
        José Ferreira ARMOND married into the Toledo family; he is NOT JC's son.
