- name: Simplício José Ferreira de Toledo
  source_ids:
  - PRB-0008
  - PRB-0009
  note: >-
    JC's own son (item 6 in PRB-0008 1867 as "Simplicio José Ferrara [Ferreira] de
    Tolledo, Solteiro de quatorze annos"; item 6 in PRB-0009-p2 1867 as "Simplicio
    José Perrura [Ferreira] de Tolledo, Solteiro de quatorze annos"). Born ~1853;
    solteiro at age ~14 in 1867; ABSENT from the 1879 Matilde inventário (PRB-0006),
    so presumably died without issue between 1867 and 1879. IMPORTANT: this person is
    DISTINCT from our Simplício José Ferreira ARMOND (P-0016), who has the Armond
    surname and married Eliza (P-0017). The identical given name "Simplício Ferreira"
    caused a prior misidentification (corrected 7 August 2026).
event_ids: []
notes:
- text: >-
    Eliza Balbina de Toledo (P-0017) is the sole structured child of JC × Claudina
    in this family. Her parentage is confirmed by PRB-0006 (1879 Matilde inventário,
    Film 2 triage 2026-08-07): she appears as representante #5 under heir #4, with her
    husband Simplício José Ferreira Armond acting as her legal representative per
    19th-century Brazilian inheritance law. All other children are documented_children
    (long deceased, no further research required). The family's existence is confirmed
    by two independent 1867 inventários (PRB-0008, PRB-0009) and the 1879 Matilde
    inventário (PRB-0006).
- text: >-
    CORRECTION history: a session on 7 August 2026 mistakenly identified "Simplício
    José Ferreira de Toledo" (JC's own son, item 6 in both 1867 inventários, b.~1853
    with Toledo surname) with our Simplício José Ferreira Armond (P-0016, Armond
    surname, Eliza's husband). This led to P-0016 being added as a structured child
    and Eliza being removed. Corrected same day once the Film 2 triage of the 1879
    Matilde inventário confirmed the legal-representative pattern and Eliza's status
    as JC's daughter.
- text: >-
    Tier audit 2026-08-13: kept confirmed under the "coherent body of primary
    evidence" clause — the partner_relationship P-0054 × P-0055 rests on three
    independent Toledo inventários (PRB-0006, PRB-0008, PRB-0009) consistently
    naming the couple; no marriage act, but no material conflict.
