  notes:
  - text: >-
      Gaspar de Souto Maior (P-0131) × Margarida (P-0136), married 2 October 1690 in the
      "Igreja de N. S.ra da Graça", entered in the São Sebastião register (E-0138). Confirmed by
      the original marriage act, PAR-0104: "a Gaspar de So-/uto f.º do Alferes Belchior de Ponte
      … e de sua m.er Mariana … Com D. Margarida … f.a de Fr.co Fer.a de Ermonde ja defunto e de
      sua m.er D. Anna". Both parties are identified by their named parents, who are those of
      their held baptisms (PAR-0099, PAR-0103). Mendes Forjaz Vol. IX (PUB-0005, p.261)
      corroborates the date and calls the bride "D. Margarida Machado"; the act's abbreviated
      surname for her, read "M.da", is uncertain on the reduced-resolution copy.
    text_pt: >-
      Gaspar de Souto Maior (P-0131) × Margarida (P-0136), casados a 2 de outubro de 1690 na
      "Igreja de N. S.ra da Graça", com assento no livro de São Sebastião (E-0138). Confirmado pelo
      assento original de casamento, PAR-0104: "a Gaspar de So-/uto f.º do Alferes Belchior de
      Ponte … e de sua m.er Mariana … Com D. Margarida … f.a de Fr.co Fer.a de Ermonde ja defunto e
      de sua m.er D. Anna". As duas partes são identificadas pelos pais nomeados, que são os dos
      respectivos baptismos guardados (PAR-0099, PAR-0103). O Vol. IX de Mendes Forjaz (PUB-0005,
      p.261) corrobora a data e chama à noiva "D. Margarida Machado"; o apelido abreviado que o
      assento lhe dá, lido "M.da", é incerto na cópia de resolução reduzida.
