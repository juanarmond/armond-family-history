partner_relationship:
  status: confirmed
  source_ids:
  - PAR-0070
  notes:
  - text: >-
      Antonio da Silva Ferreira × Maria Joanna Rocheman (Rutschmann) married 3 March 1859 at the
      Matriz de São João Baptista, Nova Friburgo (PAR-0070, event E-0094). The record names both
      parent couples — Justino da Silva × Maria Angelica (F-0055) and João José Rocheman × Isabel
      Stork (F-0054) — and states Antonio's Portuguese origin.
children:
- person_id: P-0031
  parent_relationships:
  - parent_id: P-0036
    relationship_type: biological
    status: confirmed
    source_ids:
    - CIV-0019
    - PAR-0077
    - PAR-0056
    notes:
    - text: >-
        Tier audit 2026-09-24: upgraded strong-evidence → confirmed, and the two original acts
        that state the filiation are now cited here. PAR-0077 is Lucinda's own 1863 baptism at the
        Matriz de S. João Baptista da Lagoa, Rio de Janeiro ("filha legitima de Antonio [da Silva
        Ferreira] e de Dona Maria Joanna da Silva"), recorded from the parents' declaration at the
        font. PAR-0056 is her 1884 Nova Friburgo marriage ("filha legitima de Antonio da Silva
        Ferreira, e de Maria Joanna Roschemant da Silva Ferreira"), declared by the bride herself
        21 years later, in another diocese and before another priest — an independent original,
        not a copy of the first. The 1884 act's stated birthplace ("nascida e baptisada na
        freguezia de S. João Baptista da Lagoa, na Corte") ties the two records to the same woman.
        CIV-0019 (her son Alberto's 1890 civil birth, naming the same couple as maternal
        grandparents) is retained as further corroboration.
  - parent_id: P-0037
    relationship_type: biological
    status: confirmed
    source_ids:
    - CIV-0019
    - PAR-0077
    - PAR-0056
    notes:
    - text: >-
        Tier audit 2026-09-24: upgraded strong-evidence → confirmed on the same two independent
        original acts as the paternal link — PAR-0077 (1863 baptism, "Dona Maria Joanna da Silva")
        and PAR-0056 (1884 marriage, "Maria Joanna Roschemant da Silva Ferreira"). The 1863 entry
        gives the contracted form of her name, without the Roschemant (Rutschmann) element carried
        in the 1884 act and in the couple's own 1859 marriage (PAR-0070); the same woman
        throughout, and the variant is preserved on P-0037 rather than resolved here.
  notes: []
documented_children:
- name: Octávio Ferreira da Silva
  source_ids:
  - CIV-0036
  lifespan: b. ~1868
  note: >-
    Brother of Lucinda (P-0031); son of Antonio da Silva Ferreira (P-0036) × Maria Joanna da Silva
    Ferreira (P-0037). Born ~1868, natural da Freguesia de N.S. da Conceição de Aparecida (RJ);
    operário; married Octavia Froidevaux (of the Swiss-NF colony Froidevaux family) on 28 December
    1895 at Nova Friburgo (CIV-0036), which records both his parents alive and resident at NF.
    Deceased.
- name: Maria da Gloria da Silva Ferreira
  source_ids:
  - CIV-0037
  lifespan: b. ~1876
  note: >-
    Sister of Lucinda (P-0031); daughter of Antonio da Silva Ferreira (P-0036) × Maria Joanna da
    Silva Ferreira (P-0037). Born ~1876 at Nova Friburgo; married the Portuguese Ezequiel Mathias
    Dias on 28 October 1899 at Nova Friburgo (CIV-0037), the act at which her father Antonio signs
    and her mother Maria Joanna is recorded "aqui fallecida". She was a godparent at Celina Bohrer's
    1899 baptism. Deceased.
- name: Antonio da Silva Ferreira Junior
  source_ids:
  - CIV-0035
  note: >-
    Brother of Lucinda (P-0031); son of Antonio da Silva Ferreira (P-0036) × Maria Joanna da Silva
    Ferreira (P-0037). An operário resident at Nova Friburgo, he was the declarant of his father's
    19 September 1914 Nova Friburgo civil death (CIV-0035), where the act names him "Antonio da Silva
    Ferreira Junior" reporting the death of "seu pae Antonio da Silva Ferreira" — so an adult by 1914.
    Deceased. [STRONG-EVIDENCE]
- name: Isabel da Silva Ferreira
  source_ids:
  - PAR-0082
  lifespan: b. and d. 1860
  note: >-
    Infant sister of Lucinda (P-0031); legitimate daughter of Antonio da Silva Ferreira
    (P-0036) × Maria Joanna (P-0037). Born 23 April 1860 and died 9 June 1860 (aged about
    six weeks) at Nova Friburgo, buried in the Cemitério d'esta Villa (PAR-0082). The
    mother may carry an additional Germanic surname after "Maria Joanna" in the act
    (uncertain, not asserted). Deceased.
event_ids:
- E-0094
notes:
- text: >-
    Antonio da Silva Ferreira and Maria Joanna da Silva Ferreira, parents of Lucinda
    Ferreira da Silva (P-0031). Their 1859 marriage (PAR-0070, E-0094) is now held and
    names both spouses' parents; the couple link is confirmed. Alberto Bohrer's 1890
    birth (CIV-0019) independently names them as the child's maternal grandparents
    (Antonio "e de sua mulher Maria Joanna").
