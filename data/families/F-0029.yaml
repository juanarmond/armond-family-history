  notes:
  - text: >-
      Amaro da Silva Xavier and Ignez Francisca de Lima are named as the parents of
      the bride Mathilde Maria de Jesus in her 1810 São João del Rei marriage record
      (PAR-0023): "filha legítima do Alferes Amaro da Silva Xavier e de Ignez Francisca
      de Lima, naturais e batizados da Freguesia de Barbacena." The union is independently
      corroborated by the 1777 Piracatu baptism of their daughter Maria (PAR-0025, primary)
      and by the 1838 São José del-Rei baptism certidão of their granddaughter Carolina,
      which names "Capitão Amaro da Silva Xavier e Dona Ignez Francisca de Lima" as
      paternal grandparents of Cezário's daughter (PAR-0026, derivative).
