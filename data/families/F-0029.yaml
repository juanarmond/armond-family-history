notes:
- text: >-
    Parents of Mathilde Maria de Jesus (P-0027), who married Ladisláo Egídio Ferreira
    de Toledo (P-0056) at São João del Rei on 8 May 1810. Both Amaro and Ignez are
    identified as born and baptised in the Freguesia de Barbacena. The family's own
    baptism and marriage records at Barbacena have not been located; the only primary
    attestation is the 1810 marriage record of their daughter (PAR-0023).
