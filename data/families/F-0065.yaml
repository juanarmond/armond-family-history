  notes:
  - text: >-
      Pedro Lourenço Machado (P-0129) × Maria Fernandes da Costa (P-0130), married 14 June 1598
      at Santa Bárbara, Terceira. Vol. IV (PUB-0004, p.312) records: "C. em Stª Bárbara a
      14.6.1598 com Maria Fernandes da Costa (ou de Toledo), filha de Belchior Fernandes da
      Costa e de Beatriz Pires." A primary marriage record is not held; the date is compiled.
  - text: >-
      Tier downgraded strong-evidence → hypothesis on 2026-10-09: the only source is PUB-0004, a
      published genealogy, which by policy cannot confirm and, as a lone secondary source, is
      below the strong-evidence bar of several consistent records (research/README.md,
      Confidence statuses) — the reasoning that downgraded E-0060 and E-0132. make check now
      rejects a strong-evidence conclusion resting only on published or authored narratives. A
      legible reading of the 1598 Santa Bárbara marriage act would restore it.
    text_pt: >-
      Nível rebaixado de evidência forte para hipótese em 2026-10-09: a única fonte é PUB-0004,
      uma genealogia publicada, que pela política do arquivo não pode confirmar e, sozinha, fica
      abaixo do patamar de evidência forte (vários registros concordantes; research/README.md) —
      o mesmo raciocínio que rebaixou E-0060 e E-0132. O make check agora rejeita uma conclusão
      de evidência forte apoiada só em narrativas publicadas. Uma leitura legível do assento de
      casamento de 1598 em Santa Bárbara o restabeleceria.
