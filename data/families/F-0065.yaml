notes:
- text: >-
    Pedro Lourenço Machado (P-0129) was a Capitão who led 79 men in the assault on the Castelo
    de S. Filipe, Angra, in 1642 — a significant military action documented in the compilation.
    His wife Maria Fernandes da Costa is also named "de Toledo" in the compilation, possibly
    derived from a connection to the Toledo family in Terceira (unrelated to the Minas Gerais
    Toledo line). Her parentage: Belchior Fernandes da Costa × Beatriz Pires (compiled, no
    primary image held).
- text: >-
    Mariana Fagundes (P-0124, Belchior × Mariana's wife) is the granddaughter of Pedro Lourenço
    Machado × Maria Fernandes da Costa, through their son António Martins Fagundes (P-0127).
    This makes Pedro Lourenço Machado the 4× great-grandfather of P-0092 (Gaspar Ferreira) and
    the 5× great-grandfather of Joaquim José Ferreira de Toledo (P-0057) if the Azorean chain
    is confirmed. [Corrected 2026-10-10: superseded. The identification of Gaspar de Souto
    Maior with Gaspar Ferreira (P-0092) is rejected (owner's decision); Gaspar de Souto Maior
    is a separate person, P-0131 (baptised São Sebastião 23 December 1657, PAR-0099; died
    there 2 December 1727, PAR-0100), of whom Pedro Lourenço Machado is a maternal
    great-grandfather, through António Martins Fagundes (P-0127) and Mariana Fagundes
    (P-0124). Pedro Lourenço is therefore no ancestor of P-0092 or of Joaquim José Ferreira de
    Toledo (P-0057), and the degrees above — which were also miscounted — are withdrawn. This
    couple stays in the archive as part of the Terceira Armond trunk, which family tradition
    (PUB-0002, ff. 55–56) claims for the Ferreira Armonde of Barbacena; that family would
    attach to the owner only through the unknown parents of Simplício José Ferreira Armond
    (P-0016). Neither link is proven.]
