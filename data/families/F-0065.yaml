notes:
- text: >-
    Pedro Lourenço Machado (P-0129) was a Capitão who led 79 men in the assault on the Castelo
    de S. Filipe, Angra, in 1642 — a significant military action documented in the compilation.
    His wife Maria Fernandes da Costa is also named "de Toledo" in the compilation, possibly
    derived from a connection to the Toledo family in Terceira (unrelated to the Minas Gerais
    Toledo line). Her parentage: Belchior Fernandes da Costa × Beatriz Pires (compiled, no
    primary image held).
- text: >-
    Mariana Fagundes (P-0124, Belchior × Mariana's wife) is the granddaughter of Pedro Lourenço
    Machado × Maria Fernandes da Costa, through their son António Martins Fagundes (P-0127).
    This makes Pedro Lourenço Machado the 4× great-grandfather of P-0092 (Gaspar Ferreira) and
    the 5× great-grandfather of Joaquim José Ferreira de Toledo (P-0057) if the Azorean chain
    is confirmed.
