- text: >-
    Parents of Ignez Francisca de Lima (P-0060). Named as maternal grandparents in
    the 1777 Piracatu baptism of their granddaughter Maria (PAR-0025). João Rodrigues
    de Mello (P-0066) is from Viana, Portugal (Arcebispado de Braga); Maria Francisca
    Cordeira (P-0067) is from Villa de Ouro [Ouro?], Bispado de São Paulo. Their own
    marriage and birth records have not been located; other children not attested.
