- text: >-
    Parents of Alferes Amaro da Silva Xavier (P-0059). Named as paternal grandparents
    in the 1777 Piracatu baptism of their granddaughter Maria (PAR-0025). Amaro da
    Silva Barreto (P-0064) is from Guimarães, Portugal (Arcebispado de Braga);
    Perpétua da Silva (P-0065) is from the Cidade de São Paulo. Their own marriage
    and birth records have not been located; other children not attested.
