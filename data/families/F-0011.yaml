- text: >-
    This family group records the parents named on Juan Carlos Muniz Armond's
    certified birth certificate (CIV-0008), corroborated by his Ontario
    marriage record (CIV-0009). Both are certified copies of official civil
    records giving direct primary information on his parentage, so the
    parent-child conclusions are confirmed. This does not independently assert a
    marriage or partnership between the parents.
