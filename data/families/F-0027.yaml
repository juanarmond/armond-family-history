  notes: []
documented_children:
- name: Carolina Ferreira de Toledo
  source_ids:
  - PAR-0017
  note: >-
    Daughter of Ladisláo × Matilde, baptised 21 October 1821 at the Capela dos
    Remédios, Barbacena (PAR-0017) — an aunt of Eliza. Possibly the "Carolina
    Leopoldina Marques" (⚭ Narciso Marques Braz) who is heir #5 in the 1879 inventory
    (PRB-0006), but that identity is not established, so recorded separately here.
- name: Antonio Zeferino de Toledo
  source_ids:
  - PRB-0004
  - PRB-0006
  note: >-
    Son of Mathilde × Ladisláo and heir #3 of the estate ("de M.a Perpetua nº 3",
    folio 8 of PRB-0006), married to Maria Perpétua (PRB-0004). He is Eliza's UNCLE —
    the couple wrongly hypothesised as Eliza's parents in PRB-0004 and now corrected
    by the inventory.
- name: Cezário José de Toledo
  source_ids:
  - PRB-0006
  note: >-
    Son of Mathilde and the inventariante of her 1879 estate (married to Maria José
    de Jesus). A DISTINCT person from his brother José Cezário de Toledo Lima
    (P-0054, Eliza's father) — the near-identical names are a documented trap.
event_ids:
- E-0052
notes:
- text: >-
    Parents of José Cezário de Toledo Lima (P-0054) and grandparents of Eliza Balbina
    de Toledo (P-0017). Mathilde's grandmother role (long recorded in prose from the
    1877/1881/1884 Concórdia deeds, PRB-0001/0002/0003/0004) is now a structured edge
    via her son José Cezário. This resolves Mathilde's (P-0027) previous deliberate
    orphan status.
- text: >-
    Per the 1879 inventory Mathilde had eight children (heirs). Only José Cezário
    (heir #4, the direct line) is modelled; heirs #3 Antonio Zeferino and #7 Cezário
    José are documented above. The remaining heirs — including Francisco Leocadio de
    Toledo (⚭ Maria Joaquina de Jesus) and Carolina Leopoldina Marques (⚭ Narciso
    Marques Braz) — are named across the deed cluster and the inventory but are
    recorded here only as a lead, not modelled or documented individually.
