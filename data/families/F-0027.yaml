  notes:
  - text: >-
      The marriage is now directly confirmed by the 1810 São João del Rei marriage
      record (PAR-0023, event E-0052): Ladisláo Egídio Ferreira de Toledo married
      Mathilde Maria de Jesus on 8 May 1810. Corroborated by the 1877 Concórdia/São
      Bento deed (PRB-0004, naming them as "finados avós"), the 1821 daughter
      Carolina's baptism (PAR-0017, placing the couple at Barbacena in 1821), and
      the 1862 Fazenda da Concórdia purchase deed (PRB-0007, identifying Matilde
      as widow of Ladisláo with his death therefore before 2 August 1862).
