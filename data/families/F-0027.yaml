documented_children:
- name: Carolina Ferreira de Toledo
  source_ids:
  - PAR-0017
  note: >-
    Daughter of Ladisláo × Matilde, baptised 21 October 1821 at the Capela dos
    Remédios, Barbacena (PAR-0017) — an aunt of Eliza. Possibly the "Carolina
    Leopoldina Marques" (⚭ Narciso Marques Braz) who is heir #5 in the 1879 inventory
    (PRB-0006), but that identity is not established, so recorded separately here.
- name: Aureliano de Sales Toledo
  source_ids:
  - PRB-0009
  - PRB-0006
  note: >-
    Child #5 of Ladisláo × Mathilde per PRB-0009-gen1; appears as Curador of JC's
    minor children in both PRB-0008 and PRB-0009. Not modelled; not a direct-line
    ancestor. WIFE NAME (conflict reduced 2026-08-13): a high-magnification re-read
    of PRB-0009 now reads Aureliano's wife as "D. Marianna" in the p3 herdeiros
    citation list — consistent with the p5b folio of PRB-0006 (image read 2026-08-07),
    which gives "Marianna Euphragia de Tolledo, já fallecida" (residence S. Sebastião
    dos Aflitos, termo de Santa Rita do Turvo). Both sources now agree on the forename
    "Marianna"; the gen1 título's earlier uncertain read "Marciana Espro[n?]de de
    Tolledo" is superseded by this re-read. PRB-0006 (the 1879 judicial source) remains
    preferred for the fuller name "Marianna Euphragia".
- name: Cezário [José] de Toledo
  source_ids:
  - PRB-0006
  - PRB-0009
  note: >-
    Child #6 of Ladisláo × Mathilde per PRB-0009-gen1 ("Cesario [José?] de Tolledo,
    casado com Maria [José?/Joze?] de Jesus"); also appears as the inventariante of
    Mathilde's 1879 estate (PRB-0006). A DISTINCT person from his brother José Cezário
    de Toledo Lima (P-0054) — the near-identical names are a documented trap.
- name: Maria Perpétua da Silva
  source_ids:
  - PRB-0009
  - PRB-0004
  - PRB-0006
  note: >-
    Child #1 of Ladisláo × Mathilde per PRB-0009-gen1 ("Dona Maria Perpétua da
    Silva, casada com Antonio [Zefermino/Leferme?] de Tolledo"). Her surname "da
    Silva" is puzzling given her siblings' Toledo names — possibly a maternal or
    pre-marital line. Married Antonio Zeferino de Toledo (PRB-0004). She predeceased
    Mathilde: in Mathilde's 1879 inventory (PRB-0006), her children represent her as
    heir #3 ("de M.a Perpetua nº 3"). The earlier F-0027 entry incorrectly listed
    her husband Antonio Zeferino as the child; corrected 7 August 2026. Not modelled.
- name: Ignez Umbelina de Toledo
  source_ids:
  - PRB-0009
  note: >-
    Child #2 of Ladisláo × Mathilde per PRB-0009-gen1 ("Ignez Umbelina de Tolledo,
    casada com [João?] Pedro da Silva"). Not modelled; not a direct-line ancestor.
event_ids:
- E-0052
notes:
- text: >-
    Parents of José Cezário de Toledo Lima (P-0054), who is the father of Eliza
    Balbina de Toledo (P-0017), who married Simplício José Ferreira Armond (P-0016).
    Mathilde's grandparent role in the direct line passes through JC → Eliza → the
    Armond family. CORRECTION (7 August 2026): an intermediate session incorrectly
    stated that Simplício Armond (not Eliza) was JC's child; corrected same day
    once PRB-0006 Film 2 triage confirmed Eliza as JC's daughter (see F-0026, P-0017).
- text: >-
    Per PRB-0009 (1867 Ladisláo inventário), Ladisláo and Mathilde had at least eight
    children: (1) Maria Perpétua (⚭ Antonio Zeferino de Toledo); (2) Ignez Umbelina
    (⚭ João? Pedro da Silva); (3) Carolina Leopoldina Marques (⚭ Narcísio Marques
    Braz); (4) Francisco Leocádio — modelled as P-0061; (5) Aureliano de Sales
    Toledo; (6) Cezário [José] de Toledo; (7) António Ladislão de Toledo (surdo e
    mudo) — modelled as P-0063 (died 11 Feb 1909, CIV-0024); (8) José Cesário de
    Toledo Lima (P-0054, direct line). Items 1, 2, 3, 5 and 6 are documented_children;
    items 4, 7 and 8 are structured children. Note: the earlier entry wrongly listed
    item 1's husband (Antonio Zeferino de Toledo) as the child; corrected 7 August 2026
    when PRB-0009-gen1 was read directly — Maria Perpétua da Silva is the child.
- text: >-
    MATERIAL CONFLICT (2026-08-08, conflict #15): the 1882 embargos judgment transcript
    (ladislao-1867-part05-pp309-387.md, p.383) reads "D. Maria Joaquina de Jesus,
    mulher de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Eygidio
    Ferreira de Toledo." This places Maria Joaquina as Ladisláo's DAUGHTER and Francisco
    Leocádio (P-0061) as son-in-law — not a son. This contradicts PRB-0009-gen1 which
    lists FL as child #4. Do not restructure P-0061's placement in this family until
    the p.383 image is verified. See STATUS.md material conflict #15.
- text: >-
    LEADS from 2026-08-08 inventário transcript (5-agent deep-read; image verification
    required before promoting any of these): (a) Two additional possible children of
    Ladisláo × Mathilde found in partilha precatórias: "Marianna Claudina × Francisco
    Mendes Ferreira" and "Francisca Amelia × José Mendes Pereira Junior" — would bring
    the total to 10 children; not yet added as documented_children pending image
    verification. (b) Aureliano de Sales Toledo appears to have had a second wife: "D.
    Francisca de Paula Candida" — identified in the transcript; this may explain the
    conflict between PRB-0009 ("Marciana/Marianna") and PRB-0006 p5b ("Marianna
    Euphragia, já fallecida") if Marianna Euphragia was the first wife (dead by 1879)
    and Francisca the second. (c) Narcizo Marques Braz (husband of Carolina Leopoldina
    Marques, documented_child): b. ~1822, Freq. Santa Marinha, Porto, Portugal;
    died c. 15 October 1880, Fazenda da Concórdia — from the transcript; image needed.
    (d) Partition of the Matilde estate was formally closed 3 November 1885.
- text: >-
    Parentage tier of P-0061 (Francisco Leocádio) downgraded confirmed →
    strong-evidence on 2026-08-13 (confidence-tier audit): PRB-0009 lists him as
    Ladisláo's child, but material conflict #15 (the 1882 embargos transcript
    reading him as son-in-law, not son) is unresolved, so 'confirmed' — which
    requires no material unresolved conflict — is not warranted. See STATUS.md
    conflict #15.
