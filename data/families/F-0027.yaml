event_ids: []
notes:
- text: >-
    Parents of José Cezário de Toledo Lima (P-0054) and grandparents of Eliza Balbina
    de Toledo (P-0017). Mathilde's grandmother role (long recorded in prose from the
    1877/1881/1884 Concórdia deeds, PRB-0001/0002/0003/0004) is now a structured edge
    via her son José Cezário. This resolves Mathilde's (P-0027) previous deliberate
    orphan status.
- text: >-
    Per the 1879 inventory Mathilde had eight children (heirs). Only José Cezário
    (heir #4, the direct line) is modelled; heirs #3 Antonio Zeferino and #7 Cezário
    José are documented above. The remaining heirs — including Francisco Leocadio de
    Toledo (⚭ Maria Joaquina de Jesus) and Carolina Leopoldina Marques (⚭ Narciso
    Marques Braz) — are named across the deed cluster and the inventory but are
    recorded here only as a lead, not modelled or documented individually.
