notes:
- text: >-
    Manuel da Ponte Valadão is listed in Vol. IX under the Souto Cardoso family tree as
    generation 4, son of Gaspar de Souto Cardoso × Catarina Valadão. His name variant
    "Manuel da Ponte Cardoso" is given in the compilation. The "Valadão" element of his
    name derives from his mother's family (Catarina Valadão). Both Manuel and Maria da Costa
    Leonardes died in S. Sebastião within two years of each other (1652, 1654).
- text: >-
    No primary record of this marriage or of Manuel's own birth is held. His parentage
    (Gaspar de Souto Cardoso × Catarina Valadão) is from the compiled genealogy Vol. IX
    and is not separately evidenced by a primary source. This family entity is therefore
    modelled at strong-evidence based on the Mendes Forjaz compilation.
