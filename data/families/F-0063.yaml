notes:
- text: >-
    THE VICAR IS A SON OF THIS COUPLE [PROVEN, 2026-09-24]. Two independent first-person
    statements in the São Sebastião death register TER-AH-SAOSEBASTIAO-O-1642-1696 establish
    it: a three-line marginal annotation on Manuel's 1652 act reading "M.el de Pon / te
    Cardozo / meu pai" (PAR-0097), and the body of Maria's 1654 act, "faleceo maria da Costa
    Leonardes minha mai, molher de M.el de Ponte Cardoso meu pai" (PAR-0098). The officiating
    priest was therefore a son of F-0063 and a brother of Belchior da Ponte Cardoso (P-0123).
- text: >-
    IDENTIFYING THE SON — and a correction to the retrieval agent's handoff. The handoff of
    2026-09-24 named the vicar "Manoel Coelho Souto Maior"; the images do not support that.
    Both acts are signed only "o Vig.º So[u]tomaior", with no forename; the neighbouring 1652
    entries in the same book are signed "o Vig.º Ant.º Coelho Sotto[ma]yor" [uncertain
    expansion of the abbreviated forename]; and PAR-0089 (1684, same book) names the vicar
    "Antônio Coelho Sotomayor". PUB-0005 (Vol. IX, p.259) lists exactly one priest among this
    couple's children — António Coelho Souto-Maior, b.13.2.1619, d.17.7.1686, padre vigário
    of the Matriz de São Sebastião — and no son named Manoel. The "M.el" in the 1652 margin is
    the deceased's own forename. The son is therefore identified as António Coelho Souto-Maior,
    already a documented child here; his sonship moves from [COMPILED] to [PROVEN]. He is not
    modelled as a person entity: he is a collateral with no descent and no research of his own.
- text: >-
    SOUTO MAIOR — WHERE THE SURNAME COMES FROM [STRONG LEAD, not proven]. Two of this couple's
    sons carry "Souto-Maior", and the family's vicar-son signs with it for decades. Belchior's
    son Gaspar de Souto Maior (b.23.12.1657, P-0092) — the vicar's nephew — carried it into
    the Brazilian line. It is a strong lead that Gaspar took the name from his uncle-priest,
    but it is NOT proven: Gaspar's own baptism image is at the CDN's published maximum of
    383×527 px and the filiation and priest-signature lines are illegible at that resolution.
    Do not state the uncle-to-nephew transmission as fact until a higher-resolution scan of
    that act is held.
- text: >-
    Do not confuse the vicar António Coelho Souto-Maior (b.1619, this couple's son) with his
    namesake nephew, António Coelho Souto-Maior, baptised 12 March 1654 as a son of Belchior
    da Ponte Cardoso × Mariana Fagundes (PAR-0092, family F-0062).
- text: >-
    No primary record of this marriage or of Manuel's own birth is held. His parentage
    (Gaspar de Souto Cardoso × Catarina Valadão) is from the compiled genealogy Vol. IX and is
    not separately evidenced by a primary source; those two are deliberately not modelled as
    entities, and Maria da Costa Leonardes's own parentage is not given in any held source.
    Both spouses' deaths are now documented from the original register (PAR-0097, PAR-0098),
    two years and four months apart, both at S. Sebastião.
