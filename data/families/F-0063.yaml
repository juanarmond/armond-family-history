  notes:
  - text: >-
      Manuel da Ponte Cardoso (P-0125) × Maria da Costa Leonardes (P-0126), marriage date
      and parish unknown. The union is attested by two original registers: their son
      Belchior's 1615 baptism, "Belchior fo[i filho] a Manoell de Ponte e de sua molher
      Maria da Cota" (PAR-0087), and Maria's own 1654 death act, "maria da Costa Leonardes
      … molher de M.el de Ponte Cardoso" (PAR-0098). Vol. IX (PUB-0005, p.259) records:
      "MANUEL DA PONTE VALADÃO – Ou Manuel da Ponte Cardoso. F. em S. Sebastião a 19.8.1652.
      C. c. Maria da Costa Leonardes, f. em S. Sebastião a 27.12.1654." No marriage record
      is held; both deaths are now documented at S. Sebastião (PAR-0097, PAR-0098), and the
      marriage may also have been there, but that is not confirmed.
  - text: >-
      NAME. The primary registers spell the husband "Manoell de Ponte" (1615, PAR-0087),
      "m.el de Ponte Cardozo" (1652, PAR-0097) and "M.el de Ponte Cardoso" (1654, PAR-0098).
      The surname "Valadão" appears only in the compiled genealogy PUB-0005, which derives
      it from his mother Catarina Valadão and itself offers "ou Manuel da Ponte Cardoso".
      It is retained as a compiled-genealogy name variant on P-0125, not as his name.
      His parentage — Gaspar de Souto Cardoso × Catarina Valadão — remains compiled only
      (Vol. IX p.258) and is deliberately not modelled as entities.
