  - text: >-
      Manuel da Ponte Valadão (P-0125) × Maria da Costa Leonardes (P-0126), married date
      unknown. Vol. IX (PUB-0005, p.259) records: "MANUEL DA PONTE VALADÃO – Ou Manuel da
      Ponte Cardoso. F. em S. Sebastião a 19.8.1652. C. c. Maria da Costa Leonardes, f. em
      S. Sebastião a 27.12.1654." No marriage date or primary record held. Both deaths are
      stated in S. Sebastião; the marriage may also have been in S. Sebastião but is not
      confirmed. Manuel was a son of Gaspar de Souto Cardoso × Catarina Valadão (compiled,
      Vol. IX p.258).
