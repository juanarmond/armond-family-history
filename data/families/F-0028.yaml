- text: >-
    Parents of Ladisláo Egídio Ferreira de Toledo (P-0056), confirmed by his 1787
    baptism (PAR-0019) — extending Eliza's maternal Toledo line up to the Barbacena
    Ferreira de Toledo family. Joaquim José's own parents were Gaspar Ferreira ×
