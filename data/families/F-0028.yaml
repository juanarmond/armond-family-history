event_ids: []
notes:
- text: >-
    Parents of Ladisláo Egídio Ferreira de Toledo (P-0056), confirmed by his 1787
    baptism (PAR-0019) — extending Eliza's maternal Toledo line up to the Barbacena
    Ferreira de Toledo family. The couple is further corroborated by two daughters'
    marriages (PAR-0020 Anna Belizaria 1812; PAR-0021 Carolina Francelina 1816), which
    record the father in the "João José" variant; his preferred form is "Joaquim José
    Ferreira de Toledo", per his own 1786 marriage (PAR-0018), Ladisláo's 1787 baptism
    (PAR-0019) and the legible 1810 marriage (PAR-0023). His own parents were Gaspar
    Ferreira × Gertrudes Maria [de Toledo] (Vila Rica), now modelled as family F-0045
    (P-0092 × P-0093); Ritta's were João Rodrigues [do Valle] × Izabel Ribeira (Borda do
    Campo), modelled as family F-0038 (P-0078 × P-0079). Both couples are named in Joaquim
    José and Ritta's own c.1786 marriage register (PAR-0018) — informant-reported
    parentage, held as strong-evidence; the F-0038 couple is additionally confirmed by
    Ritta's own 1764 baptism (PAR-0049).
- text: >-
    The 1833 Barbacena inventory of Rita Angélica's estate (PRB-0010) directly names
    the couple's thirteen children — headed by "Ladisláo Egídio Ferreira" (child #1),
    directly confirming Ladisláo's parentage — and records that Rita died 9 February
    1832, intestate, her widower Capitão Joaquim José being the inventariante. The other
    twelve children are recorded as documented_children above; the seven children of the
    deceased daughter Candida appear there as representantes (ages 3–13).
- text: >-
    Officiant check (2026-08-12), testing the retrieval FINDINGS' claim that Ferreira
    Armond priests officiated the family's Barbacena sacraments 1780s–1821: NOT confirmed
    on our four held records. Legible officiants — PAR-0018 (1786 marriage): provision
    from Dr. José Batista das Flores, celebrant Pe. Antonio Teles, signed Vig. José
    Feliciano; PAR-0019 (1787 baptism): Vig. Dom Agostinho [Pinto] de Castro; PAR-0021
    (1816 marriage): signed Vig. Manoel Sousa de Oliveira. The mid-entry celebrant names
    on PAR-0020 (1812) and PAR-0021 (1816) read "Rev. Pe. José Jorge/João Ferreira
    [surname worn]" — POSSIBLY the "José João Ferreira Armonde de Lima" the FINDINGS cite,
    but not legible on these ink-bled scans. Bounded negative; no Armond FAN entity
    created. A higher-resolution read of the PAR-0020/PAR-0021 celebrant lines would
    resolve it.
