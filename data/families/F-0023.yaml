event_ids:
- E-0074
notes:
- text: >-
    Parents of Manoel Muniz Bytancourt (P-0042), established by his own 1866
    Povoação death (PAR-0015) and by their own 7 October 1819 marriage (PAR-0037,
    E-0074). Extends the Muniz Bittencourt line two generations above João Muniz
    Bittencourt (P-0019), into Nossa Senhora Mãe de Deus, Povoação, Ilha de São
    Miguel (Açores, Portugal). The 1819 marriage further names each spouse's parents
    — João Francisco's parents Manoel Muniz Bitancourt × Tereza do Amaral (F-0040)
    and Maria Jacintha's parents João de Medeiros Brandão × Maria Eugenia (F-0041) —
    extending the line another generation. Only Manoel is modelled as a child here;
    other children of the couple are not evidenced by the located records.
