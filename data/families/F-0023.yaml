  notes:
  - text: >-
      João Francisco Muniz Bitancourt and Maria Jacintha de Medeiros married on 7
      October 1819 at N.S. Mãe de Deus, Povoação (PAR-0037, event E-0074) — the
      direct marriage record. Previously the marriage was attested only indirectly,
      by the "filho legitimo" statement for their son Manoel in his 1866 death
      (PAR-0015), which remains corroborating.
