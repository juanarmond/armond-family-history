- text: >-
    Parents of Manoel Muniz Bytancourt (P-0042), established by his own 1866
    Povoação death (PAR-0015). Extends the Muniz Bittencourt line two generations
    above João Muniz Bittencourt (P-0019), into Nossa Senhora Mãe de Deus, Povoação,
