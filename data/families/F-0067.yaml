partner_relationship:
  status: strong-evidence
  source_ids:
  - PAR-0101
  - PAR-0102
  notes:
  - text: >-
      José Campello de Moraes and Emerenciana Maria de Jesus are named together as the
      maternal grandparents of children of Manoel de Lemos Pereira and Maria Thereza
      de Jesus in two original Itaboraí baptism records twenty years apart — Antonio,
      21 October 1821 (PAR-0101), and João and Maria, 4 March 1841 (PAR-0102).
      Strong-evidence, not confirmed (research/README.md, Confirmed / Strong
      evidence): neither entry states a marriage — the pair is named as grandparents,
      indirect evidence of a union — and both statements presumably come from the
      same family's declarations at a grandchild's baptism, so they are not
      independent in the way a marriage act plus a grandchild's baptism would be.
      Partner role "partner", not "spouse", because no record held states that they
      were married. The retrieval side reports them as godparents together in 1822
      and as paternal grandparents in an 1840 baptism of another grandson [LEAD —
      images not held]; their marriage act (Itaboraí, before about 1800) would
      confirm the union.
    text_pt: >-
      José Campello de Moraes e Emerenciana Maria de Jesus são nomeados juntos como
      avós maternos de filhos de Manoel de Lemos Pereira e Maria Thereza de Jesus em
      dois registros originais de batismo de Itaboraí, com vinte anos de intervalo —
      Antonio, 21 de outubro de 1821 (PAR-0101), e João e Maria, 4 de março de 1841
      (PAR-0102). Strong-evidence, não confirmed (research/README.md, Confirmado /
      Evidência forte): nenhum assento declara casamento — o par é nomeado como avós,
      evidência indireta de uma união — e as duas declarações vêm presumivelmente da
      mesma família, ao batizar um neto, e não são independentes como seriam um
      assento de casamento e um batismo de neto. Papel "partner", não "spouse",
      porque nenhum registro disponível declara que eram casados. A pesquisa de
      recuperação os relata como padrinhos juntos em 1822 e como avós paternos num
      batismo de 1840 de outro neto [LEAD — imagens não disponíveis]; seu assento de
      casamento (Itaboraí, antes de cerca de 1800) confirmaria a união.
children:
- person_id: P-0053
  parent_relationships:
  - parent_id: P-0134
    relationship_type: biological
    status: strong-evidence
    source_ids:
