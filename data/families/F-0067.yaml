notes:
- text: >-
    Parents of Maria Thereza de Jesus (P-0053), hence Rosa Eugenia de Lemos's
    (P-0035) maternal grandparents — the first generation above the Itaboraí Lemos
    couple F-0025 on the mother's side. Source-qualified by the two baptism records
    that name them (PAR-0101, PAR-0102); no event is modelled for the couple, since no
    record of their marriage or deaths is held. A son, Manoel Campello de Moraes
    (Maria Thereza's probable brother), is reported by the retrieval side from an
    1840 baptism [LEAD — image not held]; he is not recorded as a documented_child,
    because no image held here names him.
  text_pt: >-
    Pais de Maria Thereza de Jesus (P-0053), portanto avós maternos de Rosa Eugenia de
    Lemos (P-0035) — a primeira geração acima do casal Lemos de Itaboraí F-0025 do lado
    materno. Qualificados pelas duas fontes de batismo que os nomeiam (PAR-0101,
    PAR-0102); nenhum evento é modelado para o casal, pois não há registro disponível
    de seu casamento ou óbitos. Um filho, Manoel Campello de Moraes (provável irmão de
    Maria Thereza), é relatado pela pesquisa de recuperação a partir de um batismo de
    1840 [LEAD — imagem não disponível]; não é registrado como documented_child, pois
    nenhuma imagem disponível aqui o nomeia.
