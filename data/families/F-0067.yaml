    notes:
    - text: >-
        Both records name José Campello de Moraes as maternal grandfather of children
        of "Manoel de Lemos Pereira" and "Maria Thereza de Jezus/Jesus" (PAR-0101,
        1821; PAR-0102, 1841), so as these records stand he is that Maria Thereza's
        father. Strong-evidence, not confirmed: the link to P-0053 rests on
        identifying that couple with Rosa Eugenia de Lemos's parents — the same two
        names, in the same full form as the couple's 1834 and 1838 entries, in the
        same Itaboraí register series; the two records, twenty years apart, agree on
        all four grandparents; and the retrieval side reports no competing couple of
        these names in its 1821-1842 sweep [LEAD]. No record states the parentage
        directly — Maria Thereza's own baptism or marriage is not held (reported to
        fall in gaps of the filmed registers). Modelled at strong-evidence on the
        owner's authorisation of 2026-10-10 ("with their link to Rosa at STRONG, not
        PROVEN").
      text_pt: >-
        Os dois registros nomeiam José Campello de Moraes como avô materno de filhos
        de "Manoel de Lemos Pereira" e "Maria Thereza de Jezus/Jesus" (PAR-0101, 1821;
        PAR-0102, 1841), de modo que, nesses registros, ele é o pai dessa Maria
        Thereza. Strong-evidence, não confirmed: o vínculo com P-0053 depende de
        identificar esse casal com os pais de Rosa Eugenia de Lemos — os mesmos dois
        nomes, na mesma forma completa dos assentos do casal de 1834 e 1838, na mesma
        série de livros de Itaboraí; os dois registros, com vinte anos de intervalo,
        concordam nos quatro avós; e a pesquisa de recuperação não relata casal
        concorrente com esses nomes na sua varredura de 1821-1842 [LEAD]. Nenhum
        registro declara a filiação diretamente — o batismo ou casamento da própria
        Maria Thereza não está disponível (relatados como caindo em lacunas dos livros
        filmados). Modelado em strong-evidence com a autorização do dono de
        2026-10-10 ("com o vínculo a Rosa em STRONG, não PROVEN").
  - parent_id: P-0135
    relationship_type: biological
    status: strong-evidence
    source_ids:
    - PAR-0101
    - PAR-0102
    notes:
    - text: >-
        As for the paternal link: "Emmerencianna Maria de Jezus" (1821) and
        "Emmerencianna/Emerencianna Maria de Jesus" (1841) is named as maternal
        grandmother of the same couple's children. Strong-evidence for the same
        identification reasons.
      text_pt: >-
        Como no vínculo paterno: "Emmerencianna Maria de Jezus" (1821) e
        "Emmerencianna/Emerencianna Maria de Jesus" (1841) é nomeada avó materna dos
        filhos do mesmo casal. Strong-evidence pelas mesmas razões de identificação.
