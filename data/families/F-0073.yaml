- text: >-
    Ignacio Francisco Lopes and Marianna da Silva, lavradores of Pousa: parents of Joaquina Rosa
    Lopes (P-0142). A possible further daughter, Andreza (Maria) Lopes, wife of Feliciano Gomes
    of Pousa, is a lead only (a neighbouring Pousa entry of 1859 names her; no kinship is stated).
  text_pt: >-
