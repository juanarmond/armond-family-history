    text_pt: >-
      Confirmado: na própria procuração de 1885 ela é "Viuva que ficou de Bento José Fernandes"
      (PRB-0016), e o óbito é o da "viuva de Bento Fernandes" (PAR-0111); o filho foi batizado
      "filho legitimo" (PAR-0106). O assento de casamento não está no livro da Ucha (varredura
      do lado da recuperação), e os casamentos de Pousa de 1755–1859 não sobreviveram.
