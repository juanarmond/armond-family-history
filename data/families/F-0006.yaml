- name: Marfiza Ferreira Armond
  source_ids:
  - CIV-0013
  lifespan: 1873–1962
  note: >-
    Sister of Aristão (P-0008); daughter of Simplício and Eliza, per her 1962
    civil death (CIV-0013, aged 89, a widow, born c.1873). The owner confirms this
    parentage.
- name: Aristides Ferreira Armand
  source_ids:
  - CIV-0023
  lifespan: b. c.1875
  note: >-
    Daughter of Simplício and Eliza (a sister of Aristão and Marfiza); married João
    Rodrigues Braga on 11 August 1894 at Boa Família (Muriaé), aged 19 (so born
    c.1875, "natural do Rio Pardo da Leopoldina"), per CIV-0023. Her father hosted
    the wedding and signed as a witness.
event_ids: []
notes:
- text: >-
    This family group records the parents of Aristão (P-0008). The couple's union is
    documented — PRB-0001 (1881) and PRB-0011 (c.1919) both name Simplício "casado com
    Dona Eliza Balbina de Toledo" — though the marriage act itself (which would name
    Simplício's own Armond parents) is not yet held.
