        notes:
          - text: >-
              CIV-0028 names Luiza Fernandes de Azevedo as Antenor's mother and
              is cited here. The tier is unchanged for the same reason as the
              paternal link: the 2014 act's filiation was taken from the 1949
              marriage certificate (CIV-0004) presented at the registration, so
              it is not an independent second source.
