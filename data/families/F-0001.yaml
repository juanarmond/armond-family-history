        notes:
          - text: >-
              Antenor's 2014 Volta Redonda civil death act (CIV-0028) states the
              filiation "DEOCLECIANO MUNIZ e LUIZA FERNANDES DE AZEVEDO" and is
              cited here at the assertion it supports. It does not raise the
              tier: the act's own averbação records that the declarant presented
              the deceased's marriage certificate from the cartório of Alvorada
              (MG), "livro 05, folhas 066" — the very document already cited as
              CIV-0004 — so the 1949 and 2014 filiations are one chain of
              information, not two independent attestations. Confirmation awaits
              Antenor's own birth or baptism act (Alvorada, Carangola, 1923).
      - parent_id: P-0013
