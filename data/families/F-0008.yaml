    notes:
    - text: >-
        Upgraded strong-evidence → confirmed (2026-09-24 citation audit). Three
        records from three different informants name Francisco José de Carvalho
        Guimarães as Maria Aurora's father, with no material conflict. (1) Her
        own civil birth registration (CIV-0007; act of 12 October 1915, livro
        4-A, fl. 23, nº 38, São Francisco do Glória), declared by Francisco
        himself, who registered her among "seus filhos" and "filhos legítimos do
        declarante ... e sua mulher Emmerenciana Maria de Jesus" — the direct
        record of the parentage, from the person with best knowledge, held as a
        certified certidão de inteiro teor, which the repository's evidence rule
        accepts as able to confirm. (2) Her daughter Cidália's 1930 Alvorada
        birth act (CIV-0022), declared by Cidália's father, naming the same
        couple as the maternal grandparents. (3) Her own 1991 Rio de Janeiro
        death act (CIV-0018), declared by a descendant. Independence: the
        declarants are her father (1915), her husband (1930) and a descendant
        (1991), in three different registries across 76 years. The 1 January
        1904 birth date agrees across CIV-0007, CIV-0002 and the age 87 recorded
        in CIV-0018; the 1915 register's "Maria Amora" is a scribal variant of
        Aurora.
  - parent_id: P-0022
    relationship_type: biological
    status: confirmed
    source_ids:
    - CIV-0007
    - CIV-0018
    - CIV-0022
    notes:
    - text: >-
        Upgraded strong-evidence → confirmed (2026-09-24 citation audit) on the
        same three-record basis as the paternal link. Emmerenciana Maria de Jesus
        is named as Maria Aurora's mother in her own 1915 birth registration
        (CIV-0007, as the declarant's wife and mother of his legitimate
        children), as the maternal grandmother in Cidália's 1930 birth act
        (CIV-0022, spelled "Emerenciana"), and in her 1991 death act (CIV-0018).
        The spelling variants Emmerenciana / Emerenciana are orthographic, not a
        conflict of identity.
