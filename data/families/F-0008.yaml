notes:
- text: >-
    The source calls the six registered children legitimate children of the
    declarant and his wife. The source is a certified derivative, so these
    assertions remain strong evidence rather than confirmed.
- text: >-
    Maria Aurora Guimarães's own 1991 civil death (CIV-0018) independently names
    the same parents, corroborating this parent-child link. It stays
    strong-evidence, not confirmed: CIV-0007 is a certified derivative and the
    CIV-0018 parentage is informant-reported at death.
- text: >-
    SUPERSEDED on the parent-child tier (2026-09-24 citation audit). Two grounds
    overturn the note above. First, a certified copy that faithfully reproduces
    an official civil record may confirm under this repository's evidence rule,
    so CIV-0007 being a certidão de inteiro teor is not itself a bar — and it is
    Maria Aurora's own birth registration, declared by her father, which is the
    direct record of her parentage rather than an informant report at death.
    Second, Cidália's 1930 Alvorada birth act (CIV-0022) is now cited on both
    parent links, adding a third independent informant (Maria Aurora's husband).
    Both parent_relationships are therefore confirmed; see the reasoning recorded
    on each. The couple's partner_relationship tier is NOT changed — the 1915 act
    calls Emmerenciana the declarant's wife but supplies no marriage date or
    place, and no marriage record has been located.
