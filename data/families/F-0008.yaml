  - CIV-0050
  lifespan: 1909–1982
  note: >-
    Brother of Maria Aurora Guimarães (P-0011) and maternal uncle of Cidalia (P-0005).
    Registered in the 1915 collective birth registration (CIV-0007; born 2 June 1909) and
