- name: José de Carvalho Guimarães (Sobrinho)
  source_ids:
  - CIV-0007
  - CIV-0049
  lifespan: 1901–1964
  note: >-
    Brother of Maria Aurora Guimarães (P-0011) and maternal uncle of Cidalia (P-0005).
    Registered in the 1915 collective birth registration (CIV-0007; born 8 November 1901)
    and documented by his 1964 Califórnia (Arapoti, PR) civil death (CIV-0049; died 21
    December 1964 aged 63, a married farmer, "natural de São Francisco da Glória, MG"),
    which names both parents. The death act styles him "José de Carvalho Guimarães
    Sobrinho" (a nephew-namesake suffix). He left eleven children (Cidalia's first cousins,
    living descendants), not modelled per the direct-line scope. Deceased.
