  note: >-
    Brother of Maria Aurora Guimarães (P-0011) and maternal uncle of Cidalia (P-0005).
    Registered in the 1915 collective birth registration (CIV-0007; born 8 November 1901)
    and documented by his 1964 Califórnia (Arapoti, PR) civil death (CIV-0049; died 21
