notes:
- text: >-
    Parents of Susanna (Suzana) Rita Brandão (P-0020), established by her 1866
    baptism (PAR-0005) and corroborated by the 1885 baptism of her daughter Anna
    (PAR-0006), where this couple stand as godparents. No marriage record
    located; the union is inferred from the legitimate-birth statement. Antonio
    Caetano Machado (Rita Ignacia's father, per the baptism's "avô materno") is now
    modelled as P-0045 with his wife Ignacia Maria de Jesus (P-0046) in family F-0022;
    his name was resolved from the earlier "Castro/Caetano" ambiguity by his 1868 óbito
    (PAR-0010) and his widow's 1878 óbito (PAR-0011).
