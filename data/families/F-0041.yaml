notes:
- text: >-
    Parents of Maria Jacintha de Medeiros (P-0049), established by her 1819 Mãe de
    Deus marriage (PAR-0037). A witness at that act, "Antonio de Medeiros Brandão",
    is very likely their son (Maria Jacintha's brother). Extends the Muniz
    Bittencourt maternal line one further generation into Nossa Senhora Mãe de Deus,
    Povoação, Ilha de São Miguel (Açores).
  text_pt: >-
    Pais de Maria Jacintha de Medeiros (P-0049), estabelecidos por seu casamento de
    1819 em Mãe de Deus (PAR-0037). Uma testemunha nesse ato, "Antonio de Medeiros
    Brandão", é muito provavelmente seu filho (irmão de Maria Jacintha). Estende a
    linha materna Muniz Bittencourt mais uma geração, para Nossa Senhora Mãe de
    Deus, Povoação, Ilha de São Miguel (Açores).
- text: >-
    Tier audit 2026-08-13: parentage edges P-0049←P-0084 and P-0049←P-0085
    downgraded confirmed → strong-evidence — both rest solely on PAR-0037 (Maria
    Jacintha's own 1819 marriage naming her parents). The partner_relationship
    P-0084 × P-0085 is kept confirmed under the "coherent body of primary
    evidence" clause: it cites the daughter's 1819 marriage (PAR-0037) plus the
    1843 baptism of grandson Agostinho (PAR-0044), two independent primary
    records naming the couple.
