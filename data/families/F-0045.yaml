notes:
- text: >-
    Parents of Joaquim José Ferreira de Toledo (P-0057), named in his own 1783
    Barbacena marriage (PAR-0018) as "Gaspar Ferreira e ... Gertrudes Maria [de
    Toledo], de [Villa] Rica". Extends Eliza's maternal Toledo line one generation
    above P-0057. The parentage rests on the son's marriage filiation
    (informant-reported), not a birth/baptism, hence strong-evidence.
- text: >-
    The family is placed "de [Villa] Rica" (Vila Rica / Ouro Preto, Minas Gerais) —
    the apparent origin of the "Ferreira" + "de Toledo" surname; "Villa" and
    Gertrudes's "de Toledo" surname are bracketed/uncertain reads on the ink-bled
    PAR-0018 folio. No records of their own are located; a direct record for the
    parentage would be Joaquim José's own ~1750s–60s Villa Rica baptism.
