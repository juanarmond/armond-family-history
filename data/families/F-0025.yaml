partner_relationship:
  status: confirmed
  source_ids:
  - PAR-0016
  - PAR-0030
  - PAR-0031
  - PAR-0032
  - PAR-0033
  - PAR-0101
  - PAR-0102
  notes:
  - text: >-
      Manoel de Lemos [Pereira] and Maria Thereza de Jesus are named as the married
      parents of their "filha legitima" Roza in the 1835 Itaboraí baptism (PAR-0016);
      the legitimate-daughter statement attests their marriage, though no marriage
      record is located.
  - text: >-
      Upgraded strong-evidence → confirmed on 2026-10-10. The 2026-08-13 tier audit rested
      on a single child's baptism; after the image re-read of 2026-10-10, five independent
      original Itaboraí baptisms (Maria 1832, Anna 1834, Roza 1835, Thomaz 1836, Polidoro
      1838 — PAR-0030, PAR-0031, PAR-0016, PAR-0032, PAR-0033) each name a "legitimo/a"
      child of this couple, and the one apparent conflict (a second mother, "Maria Nunes de
      Jesus") was a misreading, now retired. A coherent body of primary evidence with no
      material conflict (research/README.md, Confirmed). The marriage act itself is not held
      (before March 1821, per the retrieval side's reading of other baptisms — a lead).
    text_pt: >-
      Elevado de evidência forte para confirmado em 2026-10-10. A auditoria de 2026-08-13 se
      apoiava num único batismo de filho; depois da releitura das imagens em 2026-10-10, cinco
      batismos originais e independentes de Itaboraí (Maria 1832, Anna 1834, Roza 1835, Thomaz
      1836, Polidoro 1838 — PAR-0030, PAR-0031, PAR-0016, PAR-0032, PAR-0033) nomeiam cada um
      um filho "legitimo/a" deste casal, e o único conflito aparente (uma segunda mãe, "Maria
      Nunes de Jesus") era um erro de leitura, agora retirado. Um conjunto coerente de
      evidência primária sem conflito material (research/README.md, Confirmado). O assento de
      casamento em si não está guardado (antes de março de 1821, segundo a leitura de outros
      batismos pela pesquisa de recuperação — uma pista).
children:
- person_id: P-0035
  parent_relationships:
  - parent_id: P-0052
    relationship_type: biological
    status: confirmed
    source_ids:
    - PAR-0016
    - PAR-0058
    notes:
    - text: >-
        The 1835 baptism records only the forename "Roza". Identification as Rosa
        Eugenia de Lemos (P-0035) is strong but indirect: she is the couple's only
        Roza across the browsed 1832-1838 Itaboraí baptisms, in the parish where her
        1879 marriage justification was held (PAR-0002) and matching the Lemos-Itaboraí
        family (brother Candido Pereira de Lemos, named in PRB-0005). Hence
        strong-evidence rather than confirmed.
    - text: >-
        SUPERSEDED (tier audit 2026-09-24): status raised strong-evidence → confirmed, and
        PAR-0058 added. The note above turns on the 1835 register giving only the forename
        "Roza", so that the tie from the baptism to Rosa Eugenia was indirect. Her 1919 Nova
        Friburgo parish death (PAR-0058) states the filiation directly and under her full
        identity: "Roza Eugenia de Lemos Bohrer, de oitenta e seis annos de idade, natural da
        freguezia de Itaborahy ... viuva de Francisco José Bohrer e filha legitima de Manoel
        Pereira Lemos e Maria Tereza Pereira de Lemos". That is a second original act, 84 years
        later, from a different parish and informant, and it does not depend on identifying the
        1835 entry. The two records are therefore independent originals for the parentage. The
        baptism-identification caveat above still stands for the birth event E-0049; only the
        parent-child conclusion is upgraded.
  - parent_id: P-0053
    relationship_type: biological
    status: confirmed
    source_ids:
    - PAR-0016
    - PAR-0058
    notes:
    - text: >-
        Tier audit 2026-09-24: upgraded strong-evidence → confirmed on the same two independent
        originals as the paternal link — PAR-0016 (1835 Itaboraí baptism, "filha legitima de
        Manoel de Lemos e Maria Thereza de Jesus") and PAR-0058 (1919 Nova Friburgo death,
        "filha legitima de Manoel Pereira Lemos e Maria Tereza Pereira de Lemos"). The 1919 act
        gives the mother's married-surname form rather than the devotional "de Jesus" of 1835;
        both forms are preserved as variants on P-0053 and in the F-0025 notes below, and the
        divergence is a naming difference, not a conflict of identity.
  notes: []
documented_children:
- name: Candido Pereira de Lemos
  source_ids:
  - PRB-0005
  note: >-
    Brother of Rosa Eugenia de Lemos (P-0035): named "meu cunhado Candido Pereira de
    Lemos" and second-named executor in her husband Francisco José Bohrer's 1888 will
    (PRB-0005). Born before 1832 (absent from the 1832-1838 Itaboraí baptism sweep);
    his own baptism/inventário is unlocated.
    [corrected 2026-10-10: the will is dated 27 June 1879 and was opened and registered in
    1888 (PRB-0005); it is not an "1888 will", so Candido is attested alive in June 1879.]
- name: Maria de Lemos
  source_ids:
  - PAR-0030
  note: >-
    Sister of Rosa Eugenia (P-0035); baptized 14 July 1832, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos Pereira; mother: Maria [Th]ereza.
    Godfather: Capitão José Custodio Vieira. Source: PAR-0030 (individual baptism
    image, read 2026-08-10; re-read 2026-10-10). [corrected 2026-10-10 from the
    image: earlier read father "Manoel de Lemos [Ferreira]", mother "Maria Nunes [de
    Jesus]" (then explained as a scribal variant of "Maria Thereza de Jesus") and
    godfather "[Felício?] José Custódio Vieira" — all misreadings.]
- name: Anna de Lemos
  source_ids:
  - PAR-0031
  note: >-
    Sister of Rosa Eugenia (P-0035); baptized 11 February 1834, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos Pereira; mother: Maria Thereza de
    Jezus. Godparents: João José Antunes + Anna Roza da Encarnação. Source: PAR-0031
    (individual baptism image, read 2026-08-10; re-read 2026-10-10). [corrected
    2026-10-10 from the image: earlier read 12 February, father "Manoel de Lemos
    Ferreira", mother "Maria Nunes de Jesus" and godparents "José Antonio + Anna
    Roza de Guimarães" — all misreadings.]
- name: Thomaz de Lemos
  source_ids:
  - PAR-0032
  note: >-
    Brother of Rosa Eugenia (P-0035); baptized 13 June 1836, "nascido a tres mezes"
    (born about March 1836), Matriz de São João Batista de Itaborahy. Father: Manoel
    de Lemos; mother: Maria Thereza. Godparents: Capitão José Custodio Vieira + N.
    Senhora. Source: PAR-0032 (individual baptism image, read 2026-08-10; re-read
    2026-10-10). [corrected 2026-10-10 from the image: earlier recorded as "c. June
    1836" with the godparents illegible, and contrasted with a "Maria Nunes" variant
    in PAR-0030/0031 that was a misreading — the mother is "Maria Thereza" in every
    legible entry.]
- name: Polidoro de Lemos
  source_ids:
  - PAR-0033
  note: >-
    Brother of Rosa Eugenia (P-0035); baptized 18 March 1838, "nascido a tres mezes"
    (born about December 1837), Matriz de São João Batista de Itaborahy. Father:
    Manoel de Lemos Pereira; mother: Maria Thereza de Jezus. Godparents: Hermenegildo
    José de Mattos + N. Senhora. Source: PAR-0033 (individual baptism image, read
    2026-08-10; re-read 2026-10-10). ⚠️ Date history: the retrieval agent's initial
    "approximately 15 March 1838" was changed on 2026-08-10 to "c. November 1838"
    (father then read "Ferreira", mother's name and godparents "illegible").
    [corrected 2026-10-10 from the image: the entry reads "Aos desoito dias do mez de
    Março" — 18 March 1838; the November reading, the "Ferreira" and the illegible
    mother were misreadings.]
- name: Manoel Pereira de Lemos
  source_ids:
  - NWS-0002
  note: >-
    Brother of Rosa Eugenia de Lemos (P-0035), named expressly as "irmão da Exma.
    Sra. D. Roza Bohrer" in his 30 Jan 1898 death notice in A Sentinella (NWS-0002).
    Industrialist ("conhecido industrial da Venda das Pedras" — a locality of Itaboraí,
    the Lemos family's home municipality [CONTEXTUAL]; the notice ran in Nova Friburgo's A
    Sentinella but does not place him there; corrected 2026-10-08 from "Nova Friburgo"); died
    20 January 1898 aged 72 (so born c.1826 — older than Rosa, b.1835). Uncle of the
    newspaper's manager Guilherme Samuel Bohrer (Rosa's son). Not born in the
    1832–1838 Itaboraí baptism sweep (predates it), consistent with a c.1826 birth.
    Surname "Pereira de Lemos" (matching brother Candido Pereira de Lemos); the
    "Antunes de Lemos" form in the 6 Feb 1898 mass notice is a typo.
- name: Antonio de Lemos
  source_ids:
  - PAR-0101
  note: >-
    Brother of Rosa Eugenia (P-0035); baptised 21 October 1821, Matriz de Itaboraí,
    legitimate son of Manoel de Lemos Pereira and Maria Thereza de Jezus; godparents
    Antonio Joze da Fonceca and Anna Maria das Dores. Names all four grandparents
    (F-0066, F-0067). Identification with this couple STRONG. His legitimate birth by
    October 1821 shows the couple married by then.
- name: João de Lemos
  source_ids:
  - PAR-0102
  note: >-
    Brother of Rosa Eugenia (P-0035); born 16 August 1839, baptised 4 March 1841,
    Matriz de Itaboraí; godfather Rev. José Antonio Ferreira Pacheco. Probably the
    "João de Lemos Pereira" who stood godfather beside Rosa in 1858 (FAN-0014,
    FAN-0015) [INFERRED]. Identification with this couple STRONG.
- name: Maria de Lemos (b. 1840)
  source_ids:
  - PAR-0102
  note: >-
    Sister of Rosa Eugenia (P-0035); born 24 September 1840, baptised 4 March 1841,
    Matriz de Itaboraí; godfather Rev. José Antonio Ferreira Pacheco. A second daughter
    of the name (an elder Maria was baptised in 1832, PAR-0030). Identification with
    this couple STRONG.
event_ids: []
notes:
- text: >-
    Parents of Rosa Eugenia de Lemos (P-0035), the Lemos family of Itaboraí, RJ,
    established by her own 1835 Itaboraí baptism (PAR-0016). Extends the maternal
    Bohrer (Lemos) line one generation above P-0035.
- text: >-
    Rosa's siblings from the same 1832-1838 Itaborahy register (PAR-0030/0031/0032/
    0033): Maria (bapt. 14 Jul 1832), Anna (bapt. 11 Feb 1834), Thomaz (bapt. 13 Jun
    1836), Polidoro (bapt. 18 Mar 1838). All now individually catalogued with their
    own source IDs. The older Candido Pereira de Lemos (PRB-0005, unnamed in the
    baptism sweep) preceded them. [corrected 2026-10-10 from the images: Anna's,
    Thomaz's and Polidoro's dates were earlier given as 12 Feb 1834, c. Jun 1836 and
    c. Nov 1838.]
- text: >-
    RETIRED 2026-10-10 — rested on a misreading (see the 2026-10-10 note below).
    ⚠️ Mother-name discrepancy: Maria and Anna's baptisms (PAR-0030, PAR-0031) record
    the mother as "Maria Nunes [de Jesus]"; Rosa's baptism (PAR-0016) and Thomaz's
    (PAR-0032) record her as "Maria Thereza [de Jesus]". The vigário recorded the
    same woman inconsistently. P-0053 retains "Maria Thereza de Jesus" as the
    preferred form (from the majority of readings and Rosa's own entry), but "Maria
    Nunes de Jesus" is preserved as a variant documented in PAR-0030/0031.
- text: >-
    Tier audit 2026-08-13: partner_relationship P-0052 × P-0053 downgraded
    confirmed → strong-evidence. No marriage act located; the union is inferred
    from PAR-0016 (Roza's 1835 Itaboraí baptism naming them as married parents),
    a single child's-baptism record.
- text: >-
    Roza Eugenia's 1919 death (PAR-0058) names her parents as "Manoel Pereira Lemos" and
    "Maria Tereza Pereira de Lemos" — a further variant preserved here: it matches the father's
    modelled "Manoel de Lemos Pereira" (P-0052) in a different word order, and adds yet another
    form of the mother's name ("Maria Tereza Pereira de Lemos" alongside the already-noted "Maria
    Thereza de Jesus" / "Maria Nunes de Jesus", P-0053). The 1835 baptism form governs; the 1919
    forms are recorded as variants, not overwriting. [2026-10-10: the "Maria Nunes de Jesus" form
    is retired as a misreading — see the next note.]
- text: >-
    [corrected 2026-10-10 from the images: all five 1832-1838 baptisms were re-read at full
    resolution after the retrieval agent's native-resolution reading disagreed with ours. The
    mother is "Maria [Th]ereza" (1832), "Maria Thereza de Jezus" (1834, 1838), "Maria Thereza de
    Jesus" (1835) and "Maria Thereza" (1836) — never "Maria Nunes de Jesus", which was a
    misreading of PAR-0030 and PAR-0031. The father is "Manoel de Lemos Pereira" in 1832, 1834 and
    1838 and plain "Manoel de Lemos" in 1835 and 1836 — never "Ferreira". So the mother-name
    discrepancy, the "same woman recorded inconsistently" explanation and the "two women / two
    wives" alternative noted on P-0053 are retired: the name is consistent across the set.
    Corrected dates: Anna 11 Feb 1834; Rosa 12 Oct 1835 ("nascida a dez mezes"); Thomaz 13 Jun
    1836 ("nascido a tres mezes"); Polidoro 18 Mar 1838 ("nascido a tres mezes"). Godparents:
    Capitão José Custodio Vieira (Maria 1832; Thomaz 1836, with N. Senhora); João José Antunes +
    Anna Roza da Encarnação (Anna 1834); Manoel José da Silva + Ro[z]a de Maria da Conceição
    (Rosa 1835); Hermenegildo José de Mattos + N. Senhora (Polidoro 1838). Five legitimate-child
    baptisms now name the same couple (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033); the
    partner_relationship status and source_ids are left unchanged here.]
  text_pt: >-
    [corrigido em 2026-10-10 a partir das imagens: os cinco batismos de 1832-1838 foram relidos em
    resolução plena depois que a leitura do agente de recuperação, em resolução nativa, divergiu
    da nossa. A mãe é "Maria [Th]ereza" (1832), "Maria Thereza de Jezus" (1834, 1838), "Maria
    Thereza de Jesus" (1835) e "Maria Thereza" (1836) — nunca "Maria Nunes de Jesus", que era uma
    leitura errada de PAR-0030 e PAR-0031. O pai é "Manoel de Lemos Pereira" em 1832, 1834 e 1838
    e apenas "Manoel de Lemos" em 1835 e 1836 — nunca "Ferreira". Assim, a divergência no nome da
    mãe, a explicação de "mesma mulher registrada de forma inconsistente" e a alternativa de
    "duas mulheres / duas esposas" anotada em P-0053 ficam aposentadas: o nome é consistente em
    todo o conjunto. Datas corrigidas: Anna 11 fev. 1834; Rosa 12 out. 1835 ("nascida a dez
    mezes"); Thomaz 13 jun. 1836 ("nascido a tres mezes"); Polidoro 18 mar. 1838 ("nascido a tres
    mezes"). Padrinhos: Capitão José Custodio Vieira (Maria 1832; Thomaz 1836, com N. Senhora);
    João José Antunes + Anna Roza da Encarnação (Anna 1834); Manoel José da Silva + Ro[z]a de Maria
    da Conceição (Rosa 1835); Hermenegildo José de Mattos + N. Senhora (Polidoro 1838). Cinco
    batismos de filhos legítimos nomeiam agora o mesmo casal (PAR-0016, PAR-0030, PAR-0031,
    PAR-0032, PAR-0033); o status e as source_ids de partner_relationship ficam inalterados aqui.]
