  notes:
  - text: >-
      Manoel de Lemos [Pereira] and Maria Thereza de Jesus are named as the married
      parents of their "filha legitima" Roza in the 1835 Itaboraí baptism (PAR-0016);
      the legitimate-daughter statement attests their marriage, though no marriage
      record is located.
children:
- person_id: P-0035
  parent_relationships:
  - parent_id: P-0052
    relationship_type: biological
    status: strong-evidence
    source_ids:
    - PAR-0016
    notes:
    - text: >-
        The 1835 baptism records only the forename "Roza". Identification as Rosa
        Eugenia de Lemos (P-0035) is strong but indirect: she is the couple's only
        Roza across the browsed 1832-1838 Itaboraí baptisms, in the parish where her
        1879 marriage justification was held (PAR-0002) and matching the Lemos-Itaboraí
        family (brother Candido Pereira de Lemos, named in PRB-0005). Hence
        strong-evidence rather than confirmed.
  - parent_id: P-0053
