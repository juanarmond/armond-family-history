- text: >-
    Parents of Rosa Eugenia de Lemos (P-0035), the Lemos family of Itaboraí, RJ,
    established by her own 1835 Itaboraí baptism (PAR-0016). Extends the maternal
    Bohrer (Lemos) line one generation above P-0035.
- text: >-
    Rosa's siblings from the same 1832-1838 Itaborahy register: Maria (b.1832), Anna
    (b.1834), Thomaz de Lemos Pereira (b.1836) and Polidoro (b.1838) are now added as
    documented_children — parents Manoel de Lemos Pereira × Maria Thereza confirmed
    from each baptism image (read by retrieval agent, 7 August 2026; images held in
    research/from-retrieval/output/images/). Manoel (b.1831) and the older Candido
    Pereira de Lemos remain in the ledger as noted but unconfirmed from images.
    Source cataloguing for each sibling baptism is pending (images not yet promoted).
