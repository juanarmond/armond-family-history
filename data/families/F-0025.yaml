schema_version: 1
id: F-0025
partners:
- person_id: P-0052
  role: spouse
- person_id: P-0053
  role: spouse
partner_relationship:
  status: confirmed
  source_ids:
  - PAR-0016
  notes:
  - text: >-
      Manoel de Lemos [Pereira] and Maria Thereza de Jesus are named as the married
      parents of their "filha legitima" Roza in the 1835 Itaboraí baptism (PAR-0016);
      the legitimate-daughter statement attests their marriage, though no marriage
      record is located.
children:
- person_id: P-0035
  parent_relationships:
  - parent_id: P-0052
    relationship_type: biological
    status: strong-evidence
    source_ids:
    - PAR-0016
    notes:
    - text: >-
        The 1835 baptism records only the forename "Roza". Identification as Rosa
        Eugenia de Lemos (P-0035) is strong but indirect: she is the couple's only
        Roza across the browsed 1832-1838 Itaboraí baptisms, in the parish where her
        1879 marriage justification was held (PAR-0002) and matching the Lemos-Itaboraí
        family (brother Candido Pereira de Lemos, named in PRB-0005). Hence
        strong-evidence rather than confirmed.
  - parent_id: P-0053
    relationship_type: biological
    status: strong-evidence
    source_ids:
    - PAR-0016
    notes: []
  notes: []
documented_children:
- name: Candido Pereira de Lemos
  source_ids:
  - PRB-0005
  note: >-
    Brother of Rosa Eugenia de Lemos (P-0035): named "meu cunhado Candido Pereira de
    Lemos" and second-named executor in her husband Francisco José Bohrer's 1888 will
    (PRB-0005). Born before 1832 (absent from the 1832-1838 Itaboraí baptism sweep);
    his own baptism/inventário is unlocated.
- name: Maria de Lemos
  source_ids:
  - PAR-0030
  note: >-
    Sister of Rosa Eugenia (P-0035); baptized 14 July 1832, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos [Ferreira]; mother: Maria Nunes
    [de Jesus] (scribal variant of the "Maria Thereza de Jesus" in PAR-0016 — same
    woman, recorded inconsistently). Godfather: [Felício?] José Custódio Vieira.
    Source: PAR-0030 (individual baptism image, read 2026-08-10).
- name: Anna de Lemos
  source_ids:
  - PAR-0031
  note: >-
    Sister of Rosa Eugenia (P-0035); baptized 12 February 1834, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos Ferreira; mother: Maria Nunes de
    Jesus. Godparents: José Antonio + Anna Roza de Guimarães.
    Source: PAR-0031 (individual baptism image, read 2026-08-10).
- name: Thomaz de Lemos
  source_ids:
  - PAR-0032
  note: >-
    Brother of Rosa Eugenia (P-0035); baptized c. June 1836, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos; mother: Maria Thereza [de Jesus]
    (matching PAR-0016; distinct from the "Maria Nunes" variant in PAR-0030/0031 —
    same woman, see F-0025 notes). Source: PAR-0032 (individual baptism image, read
    2026-08-10).
- name: Polidoro de Lemos
  source_ids:
  - PAR-0033
  note: >-
    Brother of Rosa Eugenia (P-0035); baptized c. November 1838, Matriz de São João
    Batista de Itaborahy. Father: Manoel de Lemos Ferreira (confirmed); mother's name
    damaged and illegible in the register. Source: PAR-0033 (individual baptism image,
    read 2026-08-10). ⚠️ Date corrected from "15 March 1838" (retrieval-agent initial
    read) to c. November 1838 (direct image verification 2026-08-10).
- name: Manoel Pereira de Lemos
  source_ids:
  - NWS-0002
  note: >-
    Brother of Rosa Eugenia de Lemos (P-0035), named expressly as "irmão da Exma.
    Sra. D. Roza Bohrer" in his 30 Jan 1898 death notice in A Sentinella (NWS-0002).
    Industrialist ("conhecido industrial da Venda das Pedras", Nova Friburgo); died
    20 January 1898 aged 72 (so born c.1826 — older than Rosa, b.1835). Uncle of the
    newspaper's manager Guilherme Samuel Bohrer (Rosa's son). Not born in the
    1832–1838 Itaboraí baptism sweep (predates it), consistent with a c.1826 birth.
    Surname "Pereira de Lemos" (matching brother Candido Pereira de Lemos); the
    "Antunes de Lemos" form in the 6 Feb 1898 mass notice is a typo.
event_ids: []
notes:
- text: >-
    Parents of Rosa Eugenia de Lemos (P-0035), the Lemos family of Itaboraí, RJ,
    established by her own 1835 Itaboraí baptism (PAR-0016). Extends the maternal
    Bohrer (Lemos) line one generation above P-0035.
- text: >-
    Rosa's siblings from the same 1832-1838 Itaborahy register (PAR-0030/0031/0032/
    0033): Maria (bapt. 14 Jul 1832), Anna (bapt. 12 Feb 1834), Thomaz (bapt. c. Jun
    1836), Polidoro (bapt. c. Nov 1838). All now individually catalogued with their
    own source IDs. The older Candido Pereira de Lemos (PRB-0005, unnamed in the
    baptism sweep) preceded them.
- text: >-
    ⚠️ Mother-name discrepancy: Maria and Anna's baptisms (PAR-0030, PAR-0031) record
    the mother as "Maria Nunes [de Jesus]"; Rosa's baptism (PAR-0016) and Thomaz's
    (PAR-0032) record her as "Maria Thereza [de Jesus]". The vigário recorded the
    same woman inconsistently. P-0053 retains "Maria Thereza de Jesus" as the
    preferred form (from the majority of readings and Rosa's own entry), but "Maria
    Nunes de Jesus" is preserved as a variant documented in PAR-0030/0031.
