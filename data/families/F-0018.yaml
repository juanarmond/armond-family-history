documented_children:
- name: Alcida Fernandes de Azevedo
  source_ids:
  - CIV-0051
  lifespan: c.1895–1975
  note: >-
    Sister of Luiza (P-0013), the grandfather Antenor Muniz's mother — so Antenor's
    maternal aunt (a great-grand-aunt of Juan Armond) [STRONG-EVIDENCE, not proven]. Her 1975 Mesquita (RJ) civil death (CIV-0051, a private
    record) names her mother "Thereza Fernandes de Azevedo" (an exact match to P-0039) and
    her father as "Ascendino Maria de Azevedo" — a 1975 non-relative-informant variant of
    P-0038 ("Secundino / José Secundino Maria de Azevedo"), preserved on P-0038's
    name_variants but not overriding the 1916/1922 attestations. Born ~1895 in Minas Gerais;
    widow of a later-generation Manoel Muniz Bittencourt — the same Azevedo×Muniz Bittencourt
    endogamy seen in Luiza's own marriage. She left ten children (living descendants, not
    named). Deceased 1975.
event_ids: []
notes:
- text: >-
    José Secundino de Azevedo and Thereza Fernandes de Azevedo, parents of Luiza
    (Fernandes/Secundina) de Azevedo (P-0013). Established by two records that name
    Luiza's parents: her 1916 marriage (CIV-0001) and her son Aristides's 1922
    baptism (PAR-0003). Strong-evidence — both name the parents as reported
    information, not from the couple's own records. This group records the reported
    parents; no marriage record between them has been located.
