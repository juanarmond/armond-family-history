    - text: >-
        Citation added 2026-09-24 (under-citation audit): PAR-0034, the certified
        Arquidiocese de Mariana transcript of his 1751 Borda do Campo marriage, states
        the same parentage directly — "João Rodrigues Valle natural e baptizado nesta
        mesma freguezia filho legitimo de João Rodrigues, e Joanna Gonçalves" — and its
        closing correction fixes him as "h.[om]em de Ruvans do Arceb.o de Braga".
        The tier is deliberately left at strong-evidence: both records give only the
        bare names "João Rodrigues" and "Joanna Gonçalves", so the second citation
        corroborates the parents' names but adds nothing that discriminates them from
        any other couple of those names in Ruivais. The limiting question is the
        identification of those parents with the 1716 Ruivais marriage couple
        (PAR-0036) who are modelled as P-0080 × P-0081, and that identification still
        rests on name, parish and timeline alone.
