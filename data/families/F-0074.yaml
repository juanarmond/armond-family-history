notes:
- text: >-
    Constantino Fernandes (de Oliveira) and Roza Maria, of Quintam, São Romão da Ucha: parents
    of Manoel Fernandes (P-0143). The 1771 baptism of their son Manoel (PAR-0112) names their
    own parents (Manoel Fernandes × Maria de Oliveira, of Santa Marinha de Oleiros; Antonio José
    Ferreira × Mariana Lopes, of Santa Eulália de Oliveira); they are not modelled while the 1771
    Manoel is only hypothetically P-0143.
  text_pt: >-
    Constantino Fernandes (de Oliveira) e Roza Maria, de Quintam, São Romão da Ucha: pais de Manoel
    Fernandes (P-0143). O batismo de 1771 do filho Manoel (PAR-0112) nomeia os pais deles (Manoel
    Fernandes × Maria de Oliveira, de Santa Marinha de Oleiros; Antonio José Ferreira × Mariana
    Lopes, de Santa Eulália de Oliveira); não são modelados enquanto o Manoel de 1771 for apenas
    hipoteticamente P-0143.
