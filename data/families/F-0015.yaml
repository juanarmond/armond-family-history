  note: >-
    A further son of Antonio Engracio de Souza x Luzia Pinheiro da Conceicao, hence a
    brother of Antonio Engracio Filho (P-0010). Per his 1961 Rio de Janeiro civil death
    (CIV-0026, obito No 91.554): b. ~1896 Minas Gerais, d. 19 November 1961 aged 65,
    lavrador, married to Maria Dutra de Souza; left three adult daughters (not named in
    the record, possibly living, not modelled). A documented collateral, not a person
    entity.
event_ids: []
notes:
- text: >-
    Antonio Engracio de Souza and Luzia Pinheiro da Conceição, parents of Antonio
    Engracio Filho (P-0010). Established by his 1964 civil death (CIV-0017), which
    names both as his parents and reports them already deceased. A second independent
    primary, Hermogenes's 1961 death (CIV-0026), likewise names the couple. Strong-evidence,
    not confirmed — the parentage is informant-reported at death by a son. This
    group records the reported parents; it does not independently assert a
    marriage between them.
