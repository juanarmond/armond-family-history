notes:
- text: >-
    João Rodrigues Valle (P-0078, Portuguese-born at Ruivais, Braga) × Isabel
    Ribeiro (P-0079, of Borda do Campo). Their daughter Ritta Angélica Rodrigues
    (P-0058) married Joaquim José Ferreira de Toledo (P-0057, F-0028), grafting the
    Portuguese Rodrigues/Valle line onto the maternal Toledo trunk of Eliza Balbina
    de Toledo (P-0017).
- text: >-
    Isabel Ribeiro's parents, Manoel Nado Pestana × Anna Francisca, are named in her
    1751 marriage (PAR-0034) and are now modelled as family F-0046 (P-0094 × P-0095).
    Their Portuguese/Azorean origin — Manoel Pestana "natural da Ilha de São Jorge,
    Bispado de Angra [dos Açores]" — remains a tentative LEAD only, resting on an
    ink-damaged read of their granddaughter Ritta's 1764 baptism (PAR-0049), so it is
    not promoted to evidence. No records of their own are located.
