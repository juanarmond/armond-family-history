notes:
- text: >-
    Parents of Manoel de Lemos Pereira (P-0052), hence Rosa Eugenia de Lemos's
    (P-0035) paternal grandparents — the first generation above the Itaboraí Lemos
    couple F-0025, extending the owner's maternal Bohrer line. Source-qualified by the
    two baptism records that name them (PAR-0101, PAR-0102); no event is modelled for
    the couple, since no record of their marriage or deaths is held. Other children
    are reported by the retrieval side (a probable daughter, Maria Luiza de Jezus,
    wife of Laureano Antonio da Costa) [LEAD]; none is recorded as a
    documented_child, because no image held here names them.
  text_pt: >-
    Pais de Manoel de Lemos Pereira (P-0052), portanto avós paternos de Rosa Eugenia
    de Lemos (P-0035) — a primeira geração acima do casal Lemos de Itaboraí F-0025,
    estendendo a linha Bohrer materna do dono. Qualificados pelas duas fontes de
    batismo que os nomeiam (PAR-0101, PAR-0102); nenhum evento é modelado para o
    casal, pois não há registro disponível de seu casamento ou óbitos. Outros filhos
    são relatados pela pesquisa de recuperação (uma provável filha, Maria Luiza de
    Jezus, mulher de Laureano Antonio da Costa) [LEAD]; nenhum é registrado como
    documented_child, pois nenhuma imagem disponível aqui os nomeia.
