- name: Alberto Bohrer
  source_ids:
  - CIV-0019
  lifespan: b. 1890
  note: >-
    Younger sibling of Celina, born 17 June 1890 at the Alto da Serra, Nova
    Friburgo; his civil birth (CIV-0019, declared by their uncle Guilherme Samuel
    Bohrer) names both grandparent couples.
- name: Antonio José Bohrer
  source_ids:
  - NWS-0002
  lifespan: c.1885–1899
  note: >-
    Younger sibling of Celina (P-0015); son of Joaquim José Bohrer, named "filho de
    … Joaquim Bohrer" in his 4 April 1899 death notice in A Sentinella (NWS-0002).
    Died 2 April 1899 aged 13 (so born c.1885–1886) from a jararacussú snakebite in
    the district of São Pedro de Nova Friburgo; nephew of the paper's manager
    Guilherme Samuel Bohrer. Deceased.
event_ids: []
notes:
- text: >-
    Joaquim José Bohrer and Lucinda Ferreira da Silva, parents of Celina (Selina)
    Bohrer (P-0015). Established by two corroborating civil records: Celina's 1977
    death (CIV-0015) and Eunir Bohrer's 1924 Nova Friburgo birth (CIV-0016,
    maternal grandparents, already deceased by 1924). Strong-evidence, not
    confirmed — both are informant-reported civil records.
- text: >-
    A further son of this couple is documented by an 1891 Nova Friburgo civil
    birth (CIV-0020, born 23 December 1891) but is not listed as a documented
    child: his given name is on the register's next folio, which the retained
    image does not capture, and a marginal death note beside the entry is
    unverified. Pending a clearer image or the owner's knowledge of the name.
