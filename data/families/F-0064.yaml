  - text: >-
      António Martins Fagundes (P-0127) × Catarina Machado de Faria (P-0128). Vol. IV
      (PUB-0004, p.312) records: "António Martins Fagundes (ou Machado Fagundes), f. em
      Stª Bárbara a 17.4.1664. Capitão de ordenanças. C. c. Catarina Machado de Faria
      – vid. LEMOS, § 3º, nº 5 –." No marriage date or primary record held. The "vid. LEMOS"
      cross-reference indicates Catarina's family is documented in the LEMOS section of the
      Mendes Forjaz compilation, not yet read.
