notes:
- text: >-
    António Martins Fagundes's name in the compilation alternates between "António Martins
    Fagundes" and "Machado Fagundes" — the latter shows the Machado element adopted from
    his mother's family (Maria Fernandes da Costa, also called "de Toledo"). He died in
    Santa Bárbara (not S. Sebastião); his wife Catarina Machado de Faria's family line
    (LEMOS § 3º nº 5) has not been read and her own dates are unknown.
- text: >-
    Evidence standing, revised 2026-09-24. This family is no longer compiled-only. PAR-0086,
    the 1650 Santa Bárbara marriage act of the daughter Mariana (P-0124), is a primary record
    that names both parents and states their marriage — so the couple and both parent-child
    links to P-0124 are [PROVEN]. What remains compiled on PUB-0004 alone: the parents' fuller
    name forms, his rank and 17.4.1664 death, her LEMOS descent, the couple's marriage date,
    and every one of the documented_children below, none of whom appears in any held primary
    record. No vital record of either parent's own life — birth, marriage or death — is held.
- text: >-
    Deliberate omissions. No event entity exists for this couple's marriage: the record that
    proves the union gives no date or place for it. The documented_children remain
    documented_children (not person entities) because each is attested only by the
    compilation; they are not to be promoted on the strength of PAR-0086, which names none
    of them.
