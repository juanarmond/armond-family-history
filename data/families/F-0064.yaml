partner_relationship:
  status: confirmed
  source_ids:
  - PAR-0086
  - PUB-0004
  notes:
  - text: >-
      [PROVEN, PAR-0086] The union itself is attested by a primary record. The Santa Bárbara
      marriage act of their daughter Mariana, 26 September 1650, describes the bride as
      "filha do [illegible] Ant.º Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada" —
      "and of his wife". The register therefore states that the two were husband and wife at
      that date, independently of the compilation. The marriage date and place remain unknown;
      no marriage act of their own has been located.
  - text: >-
      [COMPILED, PUB-0004] Vol. IV (p.312) records: "António Martins Fagundes (ou Machado
      Fagundes), f. em Stª Bárbara a 17.4.1664. Capitão de ordenanças. C. c. Catarina Machado
      de Faria – vid. LEMOS, § 3º, nº 5 –." The "vid. LEMOS" cross-reference indicates
      Catarina's family is documented in the LEMOS section of the Mendes Forjaz compilation,
      not yet read. Everything in this compiled entry other than the fact of the marriage —
      his fuller name, his rank, his 1664 death, her fuller name — remains secondary only.
