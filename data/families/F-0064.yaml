    notes:
    - text: >-
        [PROVEN, PAR-0086] Mariana's own marriage act (Santa Bárbara, 26 September 1650) names
        her father in its filiation clause: "Mariana Fagunda filha do [illegible] Ant.º
        Machado". Read directly from the register image under magnification, 2026-09-24. The
        compiled attribution in PUB-0004 § 6º is thereby confirmed at primary level, not
        superseded; the register's short form "Ant.º Machado" and the compiler's "António
        Martins Fagundes ou Machado Fagundes" are the same man.
  - parent_id: P-0128
    relationship_type: biological
    status: confirmed
    source_ids:
    - PAR-0086
    - PUB-0004
    notes:
    - text: >-
        [PROVEN, PAR-0086] The same filiation clause continues "e de sua m[ulhe]r C.ta
        [Cat(arin)a] Machada" — naming the bride's mother as the father's wife. The given name
        is written abbreviated (capital C with superscript "ta") and is expanded here;
        the surname "Machada" is unambiguous. The compiled form "Catarina Machado de Faria"
        (PUB-0004 § 6º) is confirmed at primary level for the maternity, and only for that:
        the "de Faria" element and the LEMOS cross-reference remain compiled.
