notes:
- text: >-
    Parents of Isabel Ribeiro (P-0079), named in her 1751 Borda do Campo marriage
    (PAR-0034) as "Manoel Nado Pestana e ... Anna Francisca". Extends Eliza's maternal
    Toledo line one generation above P-0079. The parentage rests on the daughter's
    marriage filiation (informant-reported), not a birth/baptism, hence strong-evidence.
- text: >-
    Their granddaughter Ritta Angélica's 1764 Barbacena baptism (PAR-0049) tentatively
    adds their origin: Manoel Pestana "natural da freguesia de Nossa Senhora do Rosário
    da Ilha de São Jorge, Bispado de Angra [dos Açores]" and Anna Francisca "natural
    [da freguesia de São Jorge]" — the Azorean (Portuguese) origin behind both
    spouses' nationality. Those grandparent clauses are ink-damaged and read only
    tentatively (recorded in PAR-0049 as a LEAD, and Anna Francisca's name itself
    marked [uncertain]), so the origin carries read-uncertainty. No records of their
    own are located.
