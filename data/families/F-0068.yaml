      com Gaspar de Souto Maior (P-0131) a 2 de outubro de 1690 (E-0138, família F-0069).
documented_children:
- name: Manuel
  source_ids:
  - PAR-0105
  lifespan: bapt. 27 Dec 1661, São Sebastião, Terceira
  note: >-
    Baptised 27 December 1661 at São Sebastião, "manuel filho de Fr.co Fer.ra e de sua mulher
    Dona Anna M.da", godparents pedro [de] Sotto and Izabel, wife of Bento pacheco (PAR-0105,
    BPAR 300-dpi scan). The identification of "Fr.co Fer.ra" and "Dona Anna M.da" with this
    couple is strong, not proven: the forenames, the mother's abbreviated surname "M.da" and her
    style "Dona" match PAR-0103 in the same parish, but the father's "Ermonde" is not written.
    The retrieval side links him to a collaborative-tree profile "Alferes Manoel Machado
    Ermonde" (1661–1704) [LEAD — not a record]. Recorded here, not as a person entity, because
    no further record of him is held.
notes:
- text: >-
    Parents of Margarida (P-0136), first wife of Gaspar de Souto Maior (P-0131). Like P-0131 and
    his parents, this couple belongs to the "Terceira trunk" that family tradition claims for
    the Ferreira Armonde of Barbacena: Lacerda's thesis (PUB-0002 ff. 55–56) makes them the
    maternal grandparents of the Barbacena patriarch Francisco Ferreira Armonde (d. 1751), who
    "possuía o nome do avô materno". That tradition would reach the archive's owner only through
    the unknown parents of Simplício José Ferreira Armond (P-0016). They are not proven
    ancestors of the owner.
  text_pt: >-
    Pais de Margarida (P-0136), primeira mulher de Gaspar de Souto Maior (P-0131). Tal como o
    P-0131 e os pais dele, este casal pertence ao "tronco da Terceira" que a tradição familiar
    reivindica para os Ferreira Armonde de Barbacena: a tese de Lacerda (PUB-0002, ff. 55–56)
    faz deles os avós maternos do patriarca de Barbacena Francisco Ferreira Armonde (f. 1751), que
    "possuía o nome do avô materno". Essa tradição só chegaria ao proprietário do arquivo através
    dos pais desconhecidos de Simplício José Ferreira Armond (P-0016). Não são antepassados
    provados do proprietário.
- text: >-
    No event is linked to this family: their own marriage act is not held, and Lacerda's dates
    for the couple (1601–1672 and 1631–1704) and the retrieval side's (Francisco 1629 – 22
    August 1672; Ana baptised 8 August 1630) are leads, not modelled. Other children are not
    recorded: Lacerda and the retrieval side name none from a held record besides Margarida and
    Manuel.
  text_pt: >-
    Nenhum evento está ligado a esta família: o assento de casamento do casal não está guardado,
    e as datas de Lacerda (1601–1672 e 1631–1704) e da pesquisa de recuperação (Francisco 1629 –
    22 de agosto de 1672; Ana baptizada a 8 de agosto de 1630) são pistas, não modeladas. Outros
    filhos não são registados: Lacerda e a pesquisa de recuperação não nomeiam nenhum a partir de
    um registo guardado além de Margarida e Manuel.
