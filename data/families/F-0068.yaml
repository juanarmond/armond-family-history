partner_relationship:
  status: confirmed
  source_ids:
  - PAR-0103
  - PAR-0104
  notes:
  - text: >-
      Francisco Ferreira (de) Ermonde (P-0137) × D. Ana M[achada] (P-0138); marriage date and
      parish unknown. Two original São Sebastião acts, 23 years apart and made on different
      occasions, each call her his wife: their daughter Margarida's baptism, 29 May 1667,
      "f.a de Fr.co Fer.a Ermonde e de sua m.er D. Anna M.da" (PAR-0103), and the same
      daughter's marriage, 2 October 1690, "f.a de Fr.co Fer.a de Ermonde ja defunto e de sua
      m.er D. Anna" (PAR-0104). Confirmed under research/README.md (a coherent body of primary
      evidence with no conflict), on the same footing as F-0063 (a son's baptism plus the
      wife's own death act). A third act, Manuel's baptism of 27 December 1661, "filho de Fr.co
      Fer.ra e de sua mulher Dona Anna M.da" (PAR-0105), very probably names the same couple
      but omits "Ermonde", so it is not counted towards the status. Role "spouse" because the
      records call her "sua m.er / sua mulher". No marriage act is held; Lacerda's thesis f.
      56 (PUB-0002, after a private 2008 typescript) names the couple "Capitão Francisco
      Ferreira Ermonde ou Armonde (1601-1672) com Ana Machado, também conhecida por Maria
      Machado ou Maria das Candeyas (1631-1704)" [LEAD]; it is not cited for the status.
    text_pt: >-
      Francisco Ferreira (de) Ermonde (P-0137) × D. Ana M[achada] (P-0138); data e freguesia do
      casamento desconhecidas. Dois assentos originais de São Sebastião, com 23 anos de
      intervalo e feitos em ocasiões diferentes, chamam-lhe sua mulher: o baptismo da filha
      Margarida, 29 de maio de 1667, "f.a de Fr.co Fer.a Ermonde e de sua m.er D. Anna M.da"
      (PAR-0103), e o casamento da mesma filha, 2 de outubro de 1690, "f.a de Fr.co Fer.a de
      Ermonde ja defunto e de sua m.er D. Anna" (PAR-0104). Confirmado segundo o
      research/README.md (um conjunto coerente de evidência primária sem conflito), nos mesmos
      termos que a F-0063 (o baptismo de um filho mais o próprio assento de óbito da mulher). Um
      terceiro assento, o baptismo de Manuel a 27 de dezembro de 1661, "filho de Fr.co Fer.ra e
      de sua mulher Dona Anna M.da" (PAR-0105), nomeia muito provavelmente o mesmo casal, mas
      omite "Ermonde", pelo que não conta para o estatuto. Papel "spouse" porque os registos lhe
      chamam "sua m.er / sua mulher". Não há assento de casamento guardado; a f. 56 da tese de
      Lacerda (PUB-0002, a partir de um datiloscrito particular de 2008) nomeia o casal
      "Capitão Francisco Ferreira Ermonde ou Armonde (1601-1672) com Ana Machado, também
      conhecida por Maria Machado ou Maria das Candeyas (1631-1704)" [LEAD]; não é citada para o
      estatuto.
