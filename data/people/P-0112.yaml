profile: >-
  ## Identity

  **Maria Angelica** — a Portuguese woman, known solely from her son Antonio da Silva
  Ferreira's 1859 Nova Friburgo marriage record as the mother of that son who emigrated to
  Brazil. [PROVEN (named in PAR-0070)]

  - **Role:** mother of Antonio da Silva Ferreira (P-0036); wife of Justino da Silva
  (P-0111); family F-0055. [PROVEN — PAR-0070]

  - **Origin:** Portuguese, inferred from her son Antonio's record-attested birthplace in
  Portugal. No held document names her own parish of origin. [INFERRED/CONTEXTUAL]

  - **Birth and death:** not established. [OPEN]

  ## Family and social network

  She is named alongside her husband Justino da Silva (P-0111) in the 1859 Nova Friburgo
  marriage entry of their son Antonio — "filho legitimo de Justino da Silva e de Maria
  Angelica, natural e baptizado na Frequezia de [Guenfães? — uncertain] em Portugal"
  (PAR-0070, E-0094). [PROVEN — PAR-0070]

  Her surname "da Silva" likely passed to her son Antonio as part of the compound form "da
  Silva Ferreira" — he carried both parental surnames, "da Silva" from his mother and
  "Ferreira" from his father — and the element survives a further generation in his daughter
  Lucinda's documented name "Ferreira da Silva." [INFERRED/CONTEXTUAL — Portuguese naming
  convention]

  ## Open questions

  - Her Portuguese parish of origin and dates — accessible only after the identified
  Portuguese parish register is located (see P-0111). [OPEN]

  - Any direct record naming her. [OPEN]

  ## Sources held (this repository)

  - PAR-0070 (her son's 1859 Nova Friburgo marriage — names her and her husband Justino da
  Silva as Antonio's parents; attests Antonio's Portuguese origin).
profile_pt: >-
  ## Identidade

  **Maria Angelica** — mulher portuguesa, conhecida exclusivamente pelo registro de casamento
  de seu filho Antonio da Silva Ferreira em Nova Friburgo em 1859, no qual é nomeada como
  mãe desse filho que emigrou para o Brasil. [PROVEN (nomeada em PAR-0070)]

  - **Papel:** mãe de Antonio da Silva Ferreira (P-0036); esposa de Justino da Silva (P-0111);
  família F-0055. [PROVEN — PAR-0070]

  - **Origem:** portuguesa, inferida do local de nascimento de seu filho Antonio, atestado em
  registro primário como Portugal. Nenhum documento primário disponível nomeia a própria
  freguesia de origem de Maria Angelica. [INFERRED/CONTEXTUAL]

  - **Nascimento e óbito:** não estabelecidos. [OPEN]

  ## Família e rede social

  É nomeada ao lado de seu marido Justino da Silva (P-0111) no assento de casamento de seu
  filho Antonio em Nova Friburgo, em 1859 — "filho legitimo de Justino da Silva e de Maria
  Angelica, natural e baptizado na Frequezia de [Guenfães? — incerto] em Portugal" (PAR-0070,
  E-0094). [PROVEN — PAR-0070]

  Seu sobrenome "da Silva" provavelmente passou para seu filho Antonio como parte da forma
  composta "da Silva Ferreira" — ele carregou os dois sobrenomes parentais, "da Silva" da mãe
  e "Ferreira" do pai — e o elemento sobrevive por mais uma geração no nome documentado de
  sua filha Lucinda, "Ferreira da Silva." [INFERRED/CONTEXTUAL — convenção onomástica
  portuguesa]

  ## Questões em aberto

  - Sua freguesia de origem em Portugal e suas datas — acessíveis somente após a identificação
  do registro paroquial português correspondente (ver P-0111). [OPEN]

  - Qualquer registro que a nomeie diretamente. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0070 (casamento de seu filho em Nova Friburgo, 1859 — nomeia-a e seu marido Justino
  da Silva como pais de Antonio; atesta a origem portuguesa de Antonio).
