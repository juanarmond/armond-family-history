profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named in her son's 1859 Nova Friburgo marriage **without a surname** — "filho legitimo de Justino da Silva e de Maria Angelica" (PAR-0070). In a register where the bride's mother is given in full as "Isabel Stork", the omission is not a slip of that particular clerk's pen.

  - **[INFERRED]** Like her husband, she remained in Portugal when her son emigrated. She survives in the archive only because a Brazilian marriage act required both parents to be named — a transatlantic preservation of a name that would otherwise be invisible.

  - **[PROVEN]** The "da Silva" in her son's compound "da Silva Ferreira" comes from his father Justino da Silva, not from her. No surname is attested for her at all, and the origin of the "Ferreira" element is unresolved by any held record.

  - **[PROVEN]** The same act gives the bride's age as 18 and leaves her son's blank. Nobody in Nova Friburgo could state how old Antonio was — a measure of how completely he had left his parents' household behind.

  ## Identity

  **Maria Angelica** — a Portuguese woman, known solely from her son Antonio da Silva Ferreira's 1859 Nova Friburgo marriage record as the mother of the son who emigrated to Brazil. [PROVEN (named in PAR-0070)] Mother of Antonio da Silva Ferreira (P-0036) and so 2nd-great-grandmother of Iris Bohrer Muniz on the Silva Ferreira line (chain: Iris < Celina Bohrer < Lucinda Ferreira da Silva < Antonio < Maria Angelica).

  - **Role:** wife of Justino da Silva (P-0111); family F-0055. [PROVEN — PAR-0070]

  - **Origin:** Portuguese, inferred from her son Antonio's record-attested birthplace in Portugal. No held document names her own parish. [INFERRED/CONTEXTUAL]

  - **Birth and death:** not established. [OPEN]

  ## Standing and profession

  - **Nothing is recorded** — no occupation, no property, no surname, no act in which she is a party. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** she was not a party to any held record and cannot have signed one.

  - **The missing surname is the only status datum the act carries**, and it points to a household of modest standing: in the same entry the colonist bride's mother is named in full. [INFERRED]

  ## Family and social network

  - She is named alongside her husband Justino da Silva (P-0111) in the 1859 Nova Friburgo marriage entry of their son Antonio — "filho legitimo de Justino da Silva e de Maria Angelica, natural e baptizado na Frequezia de [Guenfães? — uncertain] em Portugal" (PAR-0070, E-0094). [PROVEN — PAR-0070]

  - **Son:** Antonio da Silva Ferreira (P-0036), who married Maria Joanna Rocheman (Rutschmann, P-0037) at Nova Friburgo on 3 March 1859. His bride's parents, João José Rocheman and Isabel Stork, were of the town's Swiss colony; the two witnesses, Domingos Baptista Bittencourt and Luiz Mathias Pinheiro, were not. [PROVEN]

  - **No kin of her own is named anywhere.** [OPEN]

  ## What we can extrapolate

  - **The naming pattern is the evidence, and it reads consistently downward** [PROVEN / INFERRED]. In one paragraph the register gives a full name and surname to the bride's mother, a bare given name to the groom's, no age for the groom, no honorific to anyone on the Portuguese side, and no property clause. Nineteenth-century clerks recorded what mattered legally and socially; this is what an act looks like when neither family has standing to record.

  - **Her contribution to the line was lineage, not property, and the archive shows both** [INFERRED / CONTEXTUAL]. Nothing suggests a dowry, holding or inheritance on her side. What descended through her son was a surname taken from his father, a Portuguese birth and legitimacy — the three things an emigrant could carry and the only three the record preserves. Whatever the family held in Portugal stayed there: a partible share in a distant freguesia is unrealisable from Brazil, so emigration functioned as disinheritance in practice even where the law provided otherwise.

  - **Her son married across, not up** [CONTEXTUAL / INFERRED]. Nova Friburgo's Swiss colony, founded 1819, was by the 1850s a community of smallholding farmers and artisans. A Portuguese immigrant marrying a colonist's daughter joined two migrant populations of comparable means. The marriage was the beginning of the family's Brazilian standing, not a transfer of anyone else's.

  - **Education is not a question the record permits** [CONTEXTUAL]. Schooling in mid-19th-century rural Portugal was limited and class-linked, and for women of her apparent standing it was essentially unavailable. Nothing ever required her to write; nothing records whether she could.

  - **Her name survives and her surname does not, which is the ordinary fate of a woman in these registers** [INFERRED]. The "da Silva" element continues two generations past her, into her granddaughter Lucinda's documented "Ferreira da Silva". Her own family name is lost at the first crossing — not because it was forgotten in Portugal, but because a Brazilian clerk in 1859 had no reason to write it down.

  ## Open questions

  - Her Portuguese parish of origin and her dates — accessible only once the identified Portuguese parish register is located (see P-0111). [OPEN]

  - Her surname, which would be the key to her own parentage and is simply absent from the only act that names her. [OPEN]

  - Any direct record naming her. [OPEN]

  ## Sources held (this repository)

  - PAR-0070 (her son's 1859 Nova Friburgo marriage — names her and her husband Justino da Silva as Antonio's parents; attests Antonio's Portuguese origin).

  ## Regional and migration context

  No record places her anywhere but Portugal, in the unconfirmed parish where her son was baptised. [CONTEXTUAL] The documented half of the story is her son's destination: Nova Friburgo, in the Rio de Janeiro highlands, founded in 1819 as a Swiss colony and by the 1850s a mixed community of colonist smallholders and Luso-Brazilian settlers that continued to attract Portuguese immigration. Portuguese emigration to Brazil in that period was overwhelmingly young, male and economically driven — a pattern in which the mother is precisely the person who stays. [CONTEXTUAL]

  ## Where to go today

  - **Her son's marriage (3 March 1859):** Matriz de São João Batista, Nova Friburgo, RJ [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Matriz%20de%20S%C3%A3o%20Jo%C3%A3o%20Batista%2C%20Nova%20Friburgo%2C%20RJ)

  - **Her own parish:** unidentified — the act's "[Guenfães]" is an uncertain read and has not been matched to a Portuguese freguesia. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada no casamento de seu filho, em Nova Friburgo, em 1859, **sem sobrenome** — "filho legitimo de Justino da Silva e de Maria Angelica" (PAR-0070). Num registro em que a mãe da noiva é dada por extenso como "Isabel Stork", a omissão não é lapso de pena daquele escrivão.

  - **[INFERRED]** Como o marido, ela permaneceu em Portugal quando o filho emigrou. Sobrevive no arquivo apenas porque um ato de casamento brasileiro exigia que ambos os pais fossem nomeados — preservação transatlântica de um nome que, de outro modo, seria invisível.

  - **[PROVEN]** O "da Silva" do composto "da Silva Ferreira" de seu filho vem do pai dele, Justino da Silva, e não dela. Nenhum sobrenome lhe é atestado, e a origem do elemento "Ferreira" não é resolvida por nenhum registro disponível.

  - **[PROVEN]** O mesmo ato dá a idade da noiva como 18 anos e deixa em branco a do filho dela. Ninguém em Nova Friburgo podia declarar a idade de Antonio — medida de quão completamente ele havia deixado para trás a casa dos pais.

  ## Identidade

  **Maria Angelica** — mulher portuguesa, conhecida unicamente pelo registro de casamento de 1859, em Nova Friburgo, de seu filho Antonio da Silva Ferreira, como mãe do filho que emigrou para o Brasil. [PROVEN (nomeada em PAR-0070)] Mãe de Antonio da Silva Ferreira (P-0036) e, portanto, trisavó de Iris Bohrer Muniz na linha Silva Ferreira (cadeia: Iris < Celina Bohrer < Lucinda Ferreira da Silva < Antonio < Maria Angelica).

  - **Papel:** esposa de Justino da Silva (P-0111); família F-0055. [PROVEN — PAR-0070]

  - **Origem:** portuguesa, inferida do local de nascimento de seu filho Antonio, atestado em registro como sendo em Portugal. Nenhum documento disponível nomeia a freguesia dela. [INFERRED/CONTEXTUAL]

  - **Nascimento e óbito:** não estabelecidos. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado** — nenhuma ocupação, propriedade, sobrenome ou ato em que seja parte. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** ela não foi parte em nenhum registro disponível e não poderia tê-lo assinado.

  - **O sobrenome ausente é o único dado de condição que o ato carrega**, e aponta para uma casa de posição modesta: na mesma entrada, a mãe da noiva colona é nomeada por extenso. [INFERRED]

  ## Família e rede social

  - Ela é nomeada ao lado de seu marido Justino da Silva (P-0111) no assento de casamento de 1859, em Nova Friburgo, de seu filho Antonio — "filho legitimo de Justino da Silva e de Maria Angelica, natural e baptizado na Frequezia de [Guenfães? — incerto] em Portugal" (PAR-0070, E-0094). [PROVEN — PAR-0070]

  - **Filho:** Antonio da Silva Ferreira (P-0036), casado com Maria Joanna Rocheman (Rutschmann, P-0037) em Nova Friburgo, em 3 de março de 1859. Os pais da noiva, João José Rocheman e Isabel Stork, eram da colônia suíça da vila; as duas testemunhas, Domingos Baptista Bittencourt e Luiz Mathias Pinheiro, não. [PROVEN]

  - **Nenhum parente seu é nomeado em parte alguma.** [OPEN]

  ## O que podemos extrapolar

  - **O padrão de nomeação é a evidência, e ele lê consistentemente para baixo** [PROVEN / INFERRED]. Num só parágrafo, o registro dá nome e sobrenome completos à mãe da noiva, apenas um prenome à do noivo, nenhuma idade ao noivo, nenhum honorífico a ninguém do lado português e nenhuma cláusula de bens. Escrivães oitocentistas registravam o que importava jurídica e socialmente; é assim que fica um ato quando nenhuma das famílias tem posição a registrar.

  - **Sua contribuição à linha foi linhagem, não propriedade, e o arquivo mostra as duas coisas** [INFERRED / CONTEXTUAL]. Nada sugere dote, posse ou herança de seu lado. O que desceu por seu filho foi um sobrenome tomado do pai, um nascimento português e legitimidade — as três coisas que um emigrante podia carregar e as únicas três que o registro preserva. O que a família tivesse em Portugal, ali ficou: uma cota partível numa freguesia distante é irrealizável a partir do Brasil, de modo que a emigração funcionou na prática como deserdação, mesmo onde a lei dispunha de outro modo.

  - **Seu filho casou-se de lado, não para cima** [CONTEXTUAL / INFERRED]. A colônia suíça de Nova Friburgo, fundada em 1819, era nos anos 1850 uma comunidade de pequenos lavradores e artesãos. Um imigrante português casando-se com a filha de um colono uniu duas populações migrantes de meios comparáveis. O casamento foi o começo da posição brasileira da família, e não a transferência da posição de outrem.

  - **A educação é pergunta que o registro não permite** [CONTEXTUAL]. A escolarização no Portugal rural de meados do século XIX era limitada e ligada à classe e, para mulheres de sua aparente condição, essencialmente indisponível. Nada jamais exigiu que escrevesse; nada registra se sabia.

  ## Questões em aberto

  - Sua freguesia portuguesa de origem e suas datas — acessíveis apenas depois de localizado o registro paroquial português identificado (ver P-0111). [OPEN]

  - Seu sobrenome, que seria a chave de sua própria filiação e está simplesmente ausente do único ato que a nomeia. [OPEN]

  - Qualquer registro direto que a nomeie. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0070 (casamento de 1859 em Nova Friburgo de seu filho — nomeia-a e a seu marido Justino da Silva como pais de Antonio; atesta a origem portuguesa de Antonio).

  ## Contexto regional e migratório

  Nenhum registro a situa em outro lugar que não Portugal, na freguesia não confirmada em que seu filho foi batizado. [CONTEXTUAL] A metade documentada da história é o destino do filho: Nova Friburgo, na serra fluminense, fundada em 1819 como colônia suíça e, nos anos 1850, comunidade mista de pequenos proprietários colonos e povoadores luso-brasileiros, que seguia atraindo imigração portuguesa. A emigração portuguesa para o Brasil naquele período era esmagadoramente jovem, masculina e de motivação econômica — padrão em que a mãe é justamente a pessoa que fica. [CONTEXTUAL]

  ## Onde ir hoje

  - **Casamento de seu filho (3 de março de 1859):** Matriz de São João Batista, Nova Friburgo, RJ [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Matriz%20de%20S%C3%A3o%20Jo%C3%A3o%20Batista%2C%20Nova%20Friburgo%2C%20RJ)

  - **Sua própria freguesia:** não identificada — o "[Guenfães]" do ato é leitura incerta e não foi correspondido a nenhuma freguesia portuguesa. [OPEN]
