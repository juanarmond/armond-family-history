profile: >-
  ## Identity

  **José Henriques de Mattos** — "Joze Henriques de Mattos" in the 21 October 1821
  Itaboraí baptism of his grandson Antonio (PAR-0101), "José Henriques de Mattos" in
  the 4 March 1841 baptisms of his grandchildren João and Maria (PAR-0102) [PROVEN].
  Both records name him as the paternal grandfather of children of Manoel de Lemos
  Pereira and Maria Thereza de Jesus, beside Anna Joaquina (in 1841, Anna Maria) da
  Conceição (P-0133). He is the father of Manoel de Lemos Pereira (P-0052) [STRONG],
  hence Rosa Eugenia de Lemos's (P-0035) paternal grandfather and the owner's
  5th-great-grandfather on his mother's Bohrer line.

  - **Nationality:** Brazilian — "todos naturaes desta Freguezia" (Itaboraí) in 1821
  and 1841 [PROVEN as written; the generic formula is read as covering him].

  - **Birth, marriage, death:** none located; born no later than about 1780
  [INFERRED].

  ## Evidence standing

  The two baptism entries are original parish records, read from the images
  [PROVEN]. That they concern Rosa's family is strong evidence, not proof: the
  parents carry exactly the names of Rosa's parents, in the same parish register
  series, and the 1821 and 1841 entries agree on all four grandparents [STRONG]. No
  record states the link outright. His son's surname differs from his: the son of a
  "Henriques de Mattos" is a "de Lemos Pereira" — ordinary in the period, when
  children often took another relative's or a devotional name [CONTEXTUAL]; where
  "Lemos Pereira" came from is unknown [OPEN].

  ## Open questions

  - Manoel de Lemos Pereira's own baptism or his marriage to Maria Thereza (Itaboraí,
  before 1821), either of which would name his parents directly and settle the link
  [OPEN]. The retrieval side reports that both fall in gaps of the filmed Itaboraí
  registers (no baptisms 1730-February 1821, no marriages 1768-1832), with the
  unfilmed books at the archdiocesan archive in Niterói [LEAD].

  - His own baptism, marriage and death — before 1821 or after 1841 [OPEN]. A probable
  daughter, Maria Luiza de Jezus, wife of Laureano Antonio da Costa, whose children's
  baptisms (1821, 1833, 1840) reportedly name "Joze Henriques de Mattos e Anna
  Joaquina" as maternal grandparents [LEAD — images not held].

  ## Sources held (this repository)

  - PAR-0101 (Antonio's 1821 Itaboraí baptism — "neto pela parte paterna de Joze
  Henriques de Mattos, e Anna Joaquina da Conceição").

  - PAR-0102 (João's and Maria's 1841 Itaboraí baptisms — "neto paterno de José
  Henriques de Mattos").
profile_pt: >-
  ## Identidade

  **José Henriques de Mattos** — "Joze Henriques de Mattos" no batismo de seu neto
  Antonio, em Itaboraí, de 21 de outubro de 1821 (PAR-0101), e "José Henriques de
  Mattos" nos batismos de seus netos João e Maria, de 4 de março de 1841 (PAR-0102)
  [PROVEN]. Os dois registros o nomeiam como avô paterno de filhos de Manoel de Lemos
  Pereira e Maria Thereza de Jesus, ao lado de Anna Joaquina (em 1841, Anna Maria) da
  Conceição (P-0133). É o pai de Manoel de Lemos Pereira (P-0052) [STRONG], portanto
  avô paterno de Rosa Eugenia de Lemos (P-0035) e hexavô do dono do arquivo pela
  linha Bohrer de sua mãe.

  - **Nacionalidade:** brasileira — "todos naturaes desta Freguezia" (Itaboraí) em
  1821 e 1841 [PROVEN como escrito; a fórmula genérica é lida como abrangendo-o].

  - **Nascimento, casamento, óbito:** nenhum localizado; nascido no máximo por volta de
  1780 [INFERRED].

  ## Situação da evidência

  Os dois assentos de batismo são registros paroquiais originais, lidos nas imagens
  [PROVEN]. Que digam respeito à família de Rosa é evidência forte, não prova: os pais
  têm exatamente os nomes dos pais de Rosa, na mesma série de livros da freguesia, e
  os assentos de 1821 e 1841 concordam nos quatro avós [STRONG]. Nenhum registro
  declara o vínculo expressamente. O sobrenome do filho difere do seu: o filho de um
  "Henriques de Mattos" é um "de Lemos Pereira" — coisa comum na época, em que os
  filhos muitas vezes tomavam o nome de outro parente ou um nome devocional
  [CONTEXTUAL]; de onde veio "Lemos Pereira" é desconhecido [OPEN].

  ## Questões em aberto

  - O próprio batismo de Manoel de Lemos Pereira ou seu casamento com Maria Thereza
  (Itaboraí, antes de 1821), qualquer dos quais nomearia diretamente seus pais e
  resolveria o vínculo [OPEN]. A pesquisa de recuperação relata que ambos caem em
  lacunas dos livros filmados de Itaboraí (sem batismos de 1730 a fevereiro de 1821,
  sem casamentos de 1768 a 1832), estando os livros não filmados no arquivo da
  arquidiocese em Niterói [LEAD].

  - Seu próprio batismo, casamento e óbito — antes de 1821 ou depois de 1841 [OPEN].
  Uma provável filha, Maria Luiza de Jezus, mulher de Laureano Antonio da Costa,
  cujos filhos batizados em 1821, 1833 e 1840 teriam como avós maternos "Joze
  Henriques de Mattos e Anna Joaquina" [LEAD — imagens não disponíveis].

  ## Fontes disponíveis (neste repositório)

  - PAR-0101 (batismo de Antonio em Itaboraí, 1821 — "neto pela parte paterna de Joze
  Henriques de Mattos, e Anna Joaquina da Conceição").

  - PAR-0102 (batismos de João e Maria em Itaboraí, 1841 — "neto paterno de José
  Henriques de Mattos").
