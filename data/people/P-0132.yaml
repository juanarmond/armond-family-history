- text: >-
    Father of Manoel de Lemos Pereira (P-0052) [STRONG], hence paternal grandfather of
    Rosa Eugenia de Lemos (P-0035) and 5th-great-grandfather of the archive's owner
    (P-0001) through his mother's Bohrer line: P-0001 → P-0003 → P-0007 (Iris) →
    P-0015 (Celina) → P-0030 (Joaquim José) → P-0035 (Rosa) → P-0052 (Manoel) →
    P-0132 (Ahnentafel 244). Known only as a grandparent: the 1821 and 1841 Itaboraí
    baptisms of three of Manoel's children name him as their paternal grandfather,
    beside Anna Joaquina (Anna Maria) da Conceição (P-0133, family F-0066). The
    records are held and read [PROVEN as records]; that the Manoel de Lemos Pereira
    they name is Rosa's father is strong evidence, not proven — same names, same
    parish register series, two records twenty years apart agreeing on all four
    grandparents, and no competing couple reported — so the parentage link to P-0052
    is held at strong-evidence (see F-0066). Modelled on the owner's authorisation of
    2026-10-10 ("with their link to Rosa at STRONG, not PROVEN").
  text_pt: >-
    Pai de Manoel de Lemos Pereira (P-0052) [STRONG], portanto avô paterno de Rosa
    Eugenia de Lemos (P-0035) e hexavô do dono do arquivo (P-0001) pela
    linha Bohrer de sua mãe: P-0001 → P-0003 → P-0007 (Iris) → P-0015 (Celina) →
    P-0030 (Joaquim José) → P-0035 (Rosa) → P-0052 (Manoel) → P-0132 (Ahnentafel 244).
    Conhecido apenas como avô: os batismos de 1821 e 1841, em Itaboraí, de três filhos
    de Manoel o nomeiam como avô paterno, ao lado de Anna Joaquina (Anna Maria) da
    Conceição (P-0133, família F-0066). Os registros estão disponíveis e lidos
    [PROVEN como registros]; que o Manoel de Lemos Pereira neles nomeado seja o pai de
    Rosa é evidência forte, não prova — mesmos nomes, mesma série de livros da
    freguesia, dois registros com vinte anos de intervalo concordando nos quatro avós,
    e nenhum casal concorrente relatado —, de modo que o vínculo de filiação com
    P-0052 fica em strong-evidence (ver F-0066). Modelado com a autorização do dono de
    2026-10-10 ("com o vínculo a Rosa em STRONG, não PROVEN").
- text: >-
    Nationality Brazilian, following his son and daughter-in-law (P-0052, P-0053): the
    1821 baptism closes the grandparent clause with "todos naturaes desta Freguezia"
    (Itaboraí), and João's 1841 entry repeats "todos naturaes desta Freguezia de
    Itaborahy". Both formulas are generic and attached to the maternal clause; they
    are read as covering him, a documented birthplace by statement rather than an
    inference from his surname. In 1821 Itaboraí lay within the Portuguese realm (the
    United Kingdom of Portugal, Brazil and the Algarves, 1815-1822): "Brazilian" here
    records a Brazilian birthplace, as on P-0052/P-0053, not a citizenship he could
    have held at his birth.
  text_pt: >-
    Nacionalidade brasileira, como seu filho e sua nora (P-0052, P-0053): o batismo
    de 1821 fecha a cláusula dos avós com "todos naturaes desta Freguezia" (Itaboraí),
    e o assento de João de 1841 repete "todos naturaes desta Freguezia de Itaborahy".
    As duas fórmulas são genéricas e vêm presas à cláusula materna; são lidas como
    abrangendo-o — um local de nascimento declarado, não uma inferência a partir do
    sobrenome. Em 1821 Itaboraí pertencia ao reino português (o Reino Unido de
    Portugal, Brasil e Algarves, 1815-1822): "brasileira" registra aqui um local de
    nascimento no Brasil, como em P-0052/P-0053, não uma cidadania que pudesse ter ao
    nascer.
