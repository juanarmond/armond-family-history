profile: >-
  ## Interesting facts

  - **[PROVEN]** He is documented only as a parent, and twice on one page: the Grindel
  Catholic baptism register, p.571, records Johann Jacob (17 January 1751) and Johann Joseph
  (23 June 1752) as children of "Johannis Whroli × Barbara Allman" (PAR-0027). No record of
  his own life is held.

  - **[PROVEN]** The godfather at the 1751 baptism was **Hans Jacob Heggendorn** — the
  Heggendorn surname standing beside Wehrli in Grindel sixty-eight years before both families
  sailed to Nova Friburgo, and ninety-three before a Heggendorn granddaughter married a Borer
  there.

  - **[PROVEN]** His Catholicism is documented rather than inferred: the register uses the
  Latin sacramental columns *Parentes / Infantes / Patrini*, and the companion Grindel
  marriage book is headed "juxta normam S. Concilii Tridentini". Grindel lay under the Roman
  Catholic Diocese of Basel.

  - **[INFERRED]** He did not emigrate. He is the last Wehrli of this line to live and die
  entirely in Switzerland — the branching point between the Wehrlis who stayed and the
  Brazilian Wehrli/Bohrer descendants who left in 1819.

  - **[CONTEXTUAL]** The Schwarzbubenland Jura of Solothurn, where Grindel sits, was Catholic,
  German-speaking and severely land-constrained: farming families subdivided their
  smallholdings across generations until the shares would not support a household. That
  pressure, built up over his own mid-18th-century generation, is what finally moved his son's
  household at 68.

  ## Identity

  **Johannes Wehrli** (recorded *Johannis Whroli* in the register; the cursive renders the
  name variously as "Whroli" and "Alroli"). Of Grindel, Soleure (Solothurn), Switzerland; the
  top of the Wehrli branch. Swiss.

  - **Couple:** husband of Barbara Alleman (P-0075) — [PROVEN] as a couple from the Grindel
  Catholic baptism register (PAR-0027, p.571), which records two of their children baptised in
  1751 and 1752. No marriage record has been located. [OPEN]

  - **Birth, death, own parents:** no vital record held [OPEN]. A FamilySearch collaborative
  tree gives his birth ~1720 and death 2 April 1776, both at Grindel [LEAD]; it attaches no
  parents to him, and a deeper "Adam Wehrli × Elsbeth Blattner" tree-ascent was examined and
  **rejected** as unsourced and date-implausible — do not mint it [rejected].

  ## Standing and profession

  Nothing is documented: no occupation, property, office, title or literacy appears in the
  only record that names him. His son Johann Jacob is recorded as an *agricultor* in the same
  village a generation later [PUB-0003], which makes a farming household the reasonable
  reading — but that is inference from the son, not a statement about the father, and the
  profile should not upgrade it. [INFERRED at most; OPEN in the record]

  ## Family and social network

  - **Children (documented):** Johann Jacob Wehrli (P-0072, b. 17 January 1751) — the 1819
  Nova Friburgo emigrant patriarch, through whom the line continues — and Johann Joseph Wehrli
  (baptised 23 June 1752; not modelled). Family F-0036. [PROVEN — PAR-0027]

  - **Godparent circle:** Hans Jacob Heggendorn at the 1751 baptism and a Joseph Wehrli at the
  1752 one — the same two surnames, plus Borer, that recombine in Grindel's registers for the
  rest of the century and then again at Nova Friburgo. [PROVEN — PAR-0027]

  - He **did not emigrate**; only his son's line went to Brazil.

  ## What we can extrapolate

  - **He is the deepest generation this branch can name, and the record supports nothing
  beyond a village [CONTEXTUAL / INFERRED].** As the father of a man born in 1751, he belongs
  to the early-18th-century Grindel Wehrli stock, reachable only through the Grindel parish
  books. Nothing gives him rank, land or office; the honest position is that the documents
  place him in a poor Catholic Jura farming parish and say no more.

  - **Wealth mechanics: heritable land, and that is exactly the problem [CONTEXTUAL].**
  Whatever the household farmed was, in principle, heritable capital — but the Jura divided
  holdings among all heirs, and he had at least two sons baptised within eighteen months of
  each other. Across two or three such generations the shares stop supporting a family. His
  household is the point at which the arithmetic was still workable; his son's is where it
  stopped being so.

  - **The colony endogamy was already assembled around him [INFERRED].** Wehrli, Heggendorn
  and Borer appear together on his children's baptism entries in 1751–52, long before any of
  them thought of Brazil. What later looks like the colony's insularity at Nova Friburgo is
  better read as a Swiss village network being transplanted whole — and this page is the
  earliest held evidence of it.

  - **The Wehrli branch's Old-World floor [CONTEXTUAL / INFERRED].** His household is the
  bottom rung from which the Bohrer arc is measured upward: no fortune ever existed here,
  which is the structural mirror image of the family's Armond line, where an
  office-and-marriage elite fell. The emigration, the colony lot, and any modest gain from
  either belong to his son's generation, not his.

  ## Open questions

  - His and Barbara Alleman's **own baptisms, marriage and burials** — the Grindel parish
  registers (Staatsarchiv Solothurn / Bistum Basel-Solothurn, or FHC microfilm) would move the
  FS tree's ~1720 and 1776 dates from lead to evidence and could name his parents. [OPEN]

  - His **parentage** — currently terminal; the rejected "Adam Wehrli × Elsbeth Blattner"
  ascent must not be adopted without a held record. [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel Catholic baptism register, p.571 — the 1751 and 1752 baptisms naming him
  and Barbara Alleman as parents; sources event E-0068).

  - Not held: the FamilySearch collaborative tree giving his ~1720 birth and 2 April 1776
  death — a lead only.

  ## Regional and migration context

  He belongs to the early-18th-century Grindel Wehrli stock of the Catholic, German-speaking
  Solothurn Jura — the Schwarzbubenland of the Thierstein district, poor upland farming
  country whose holdings were divided among heirs generation after generation. [CONTEXTUAL] He
  is the deepest generation named on this branch, and one that stayed in Switzerland: the 1815
  Tambora eruption, the 1816 "Year Without a Summer" famine and Dom João VI's 1818
  colonisation decree all came after his lifetime, and it was his son who took them.
  [CONTEXTUAL]

  ## Where to go today

  - **Home parish (b. ~1720 – d. 2 April 1776, per the FS-tree lead; he never emigrated):**
  Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn, Switzerland (GPS 47.3833,
  7.5042) [RESOLVED as a place; the records themselves OPEN] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Está documentado apenas como pai, e duas vezes numa mesma página: o livro de
  batismos católico de Grindel, p.571, registra Johann Jacob (17 de janeiro de 1751) e Johann
  Joseph (23 de junho de 1752) como filhos de "Johannis Whroli × Barbara Allman" (PAR-0027).
  Nenhum registro da própria vida dele está disponível.

  - **[PROVEN]** O padrinho do batismo de 1751 foi **Hans Jacob Heggendorn** — o sobrenome
  Heggendorn ao lado de Wehrli em Grindel sessenta e oito anos antes de ambas as famílias
  embarcarem para Nova Friburgo, e noventa e três antes de uma neta Heggendorn ali se casar
  com um Borer.

  - **[PROVEN]** Seu catolicismo é documentado, não inferido: o livro usa as colunas
  sacramentais latinas *Parentes / Infantes / Patrini*, e o livro de casamentos companheiro de
  Grindel é encabeçado "juxta normam S. Concilii Tridentini". Grindel estava sob a Diocese
  Católica Romana de Basileia.

  - **[INFERRED]** Ele não emigrou. É o último Wehrli desta linha a viver e morrer
  inteiramente na Suíça — o ponto de ramificação entre os Wehrli que ficaram e os descendentes
  brasileiros Wehrli/Bohrer que partiram em 1819.

  - **[CONTEXTUAL]** O Jura do Schwarzbubenland, em Solothurn, onde fica Grindel, era
  católico, germanófono e severamente limitado em terra: as famílias agrícolas subdividiam
  seus minifúndios ao longo das gerações até os quinhões não sustentarem um domicílio. Essa
  pressão, acumulada ao longo de sua própria geração de meados do século XVIII, é o que por
  fim moveu o domicílio do filho, aos 68 anos.

  ## Identidade

  **Johannes Wehrli** (registrado *Johannis Whroli* no livro; a cursiva grafa o nome ora
  "Whroli", ora "Alroli"). De Grindel, Soleure (Solothurn), Suíça; o topo do ramo Wehrli.
  Suíço.

  - **Casal:** marido de Barbara Alleman (P-0075) — [PROVEN] como casal pelo livro de batismos
  católico de Grindel (PAR-0027, p.571), que registra dois de seus filhos batizados em 1751 e
  1752. Nenhum registro de casamento foi localizado. [OPEN]

  - **Nascimento, óbito, próprios pais:** nenhum registro vital disponível [OPEN]. Uma árvore
  colaborativa do FamilySearch dá seu nascimento por volta de 1720 e óbito em 2 de abril de
  1776, ambos em Grindel [LEAD]; não lhe atribui pais, e uma ascendência mais profunda de
  árvore, "Adam Wehrli × Elsbeth Blattner", foi examinada e **rejeitada** como não documentada
  e implausível nas datas — não criar [rejeitada].

  ## Posição social e profissão

  Nada está documentado: nenhuma ocupação, propriedade, cargo, título ou alfabetização aparece
  no único registro que o nomeia. Seu filho Johann Jacob é registrado como *agricultor* na
  mesma aldeia uma geração depois [PUB-0003], o que torna um domicílio agrícola a leitura
  razoável — mas isso é inferência a partir do filho, não afirmação sobre o pai, e o perfil
  não deve elevá-la. [INFERRED no máximo; OPEN no registro]

  ## Família e rede social

  - **Filhos (documentados):** Johann Jacob Wehrli (P-0072, n. 17 de janeiro de 1751) — o
  patriarca emigrante de 1819 em Nova Friburgo, por quem a linha continua — e Johann Joseph
  Wehrli (batizado em 23 de junho de 1752; não modelado). Família F-0036. [PROVEN — PAR-0027]

  - **Círculo de padrinhos:** Hans Jacob Heggendorn no batismo de 1751 e um Joseph Wehrli no
  de 1752 — os mesmos dois sobrenomes, mais Borer, que se recombinam nos livros de Grindel
  pelo resto do século e depois outra vez em Nova Friburgo. [PROVEN — PAR-0027]

  - Ele **não emigrou**; apenas a linha do filho foi para o Brasil.

  ## O que podemos extrapolar

  - **É a geração mais profunda que este ramo pode nomear, e o registro não sustenta nada além
  de uma aldeia [CONTEXTUAL / INFERRED].** Como pai de um homem nascido em 1751, pertence ao
  tronco Wehrli de Grindel do início do século XVIII, alcançável apenas pelos livros
  paroquiais da aldeia. Nada lhe dá patente, terra ou cargo; a posição honesta é que os
  documentos o situam numa paróquia agrícola católica pobre do Jura e nada mais dizem.

  - **Mecânica da riqueza: terra herdável — e é exatamente esse o problema [CONTEXTUAL].** O
  que quer que o domicílio lavrasse era, em princípio, capital herdável — mas o Jura dividia
  as posses entre todos os herdeiros, e ele teve ao menos dois filhos batizados com dezoito
  meses de intervalo. Ao longo de duas ou três gerações assim, os quinhões deixam de sustentar
  uma família. Seu domicílio é o ponto em que a aritmética ainda funcionava; o do filho é onde
  deixou de funcionar.

  - **A endogamia colonial já estava montada à sua volta [INFERRED].** Wehrli, Heggendorn e
  Borer aparecem juntos nos assentos de batismo de seus filhos em 1751–52, muito antes de
  qualquer um deles pensar no Brasil. O que depois parece insularidade da colônia em Nova
  Friburgo se lê melhor como uma rede de aldeia suíça transplantada inteira — e esta página é
  a evidência mais antiga disponível disso.

  - **O piso do Velho Mundo do ramo Wehrli [CONTEXTUAL / INFERRED].** Seu domicílio é o degrau
  de base a partir do qual o arco Bohrer é medido para cima: nunca houve fortuna aqui, o que é
  a imagem espelhada estrutural da linha Armond da família, em que uma elite de cargo e
  casamento caiu. A emigração, o lote colonial e qualquer ganho modesto de um ou de outro
  pertencem à geração do filho, não à dele.

  ## Questões em aberto

  - Os **batismos, o casamento e os sepultamentos dele e de Barbara Alleman** — os livros
  paroquiais de Grindel (Staatsarchiv Solothurn / Bistum Basel-Solothurn, ou microfilme do
  FHC) moveriam as datas de ~1720 e 1776 da árvore FS de pista para evidência e poderiam
  nomear seus pais. [OPEN]

  - Sua **filiação** — hoje terminal; a ascendência rejeitada "Adam Wehrli × Elsbeth Blattner"
  não deve ser adotada sem registro disponível. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (livro de batismos católico de Grindel, p.571 — os batismos de 1751 e 1752 que o
  nomeiam, com Barbara Alleman, como pais; fundamenta o evento E-0068).

  - Não disponível: a árvore colaborativa do FamilySearch que dá seu nascimento por volta de
  1720 e óbito em 2 de abril de 1776 — apenas pista.

  ## Contexto regional e migratório

  Pertence ao tronco Wehrli de Grindel do início do século XVIII, no Jura católico e
  germanófono de Solothurn — o Schwarzbubenland do distrito de Thierstein, terra pobre de
  lavoura de planalto cujas posses eram divididas entre herdeiros geração após geração.
  [CONTEXTUAL] É a geração mais profunda nomeada neste ramo, e uma que permaneceu na Suíça: a
  erupção do Tambora em 1815, a fome do "Ano Sem Verão" de 1816 e o decreto de colonização de
  1818 de Dom João VI vieram todos depois de sua vida, e foi o filho quem os tomou.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia de origem (n. ~1720 – f. 2 de abril de 1776, conforme a pista da árvore FS;
  nunca emigrou):** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn, Suíça (GPS
  47.3833, 7.5042) [RESOLVED quanto ao lugar; os registros em si OPEN] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)
