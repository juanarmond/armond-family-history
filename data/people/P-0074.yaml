notes:
- text: >-
    Father of Johann Jacob Wehrli (P-0072). Confirmed as husband of Barbara
    Alleman (P-0075) in the Grindel Catholic parish baptism register (PAR-0027,
    page 571): two entries record children baptised in 1751 and 1752 with parents
    "Johannis Whroli × Barbara Allman." No further biographical data is known;
    no emigration record to Nova Friburgo (his son Johann Jacob emigrated on the
    Heureux Voyage in 1819, but Johannes himself is not listed on the manifest).
  text_pt: >-
    Pai de Johann Jacob Wehrli (P-0072). Confirmado como marido de Barbara
    Alleman (P-0075) no registro de batismo da paróquia católica de Grindel
    (PAR-0027, página 571): duas entradas registram filhos batizados em 1751 e
    1752 com os pais "Johannis Whroli × Barbara Allman." Nenhum outro dado
    biográfico é conhecido; nenhum registro de emigração para Nova Friburgo (seu
    filho Johann Jacob emigrou no Heureux Voyage em 1819, mas o próprio Johannes
    não consta no manifesto).
