profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** He is the deepest generation named on the Wehrli branch — a Grindel Jura farmer of the early 18th century who never emigrated, the anchor of the branch's Swiss origin before his son's generation left for Brazil in 1819.

  - **[PROVEN]** He is documented as a parent in the Grindel baptism register in at least two consecutive entries — his children Johann Jacob (1751) and Johann Joseph (1752) — making him the only person on this branch confirmed solely through his children's Swiss parish records rather than any record of his own life (PAR-0027).

  - **[CONTEXTUAL]** The Schwarzbubenland Jura of Solothurn canton, where Grindel sits, was Catholic, German-speaking and intensely land-constrained — its farming families subdivided smallholdings across generations until emigration became the only option for non-inheriting sons; his son Johann Jacob's 1819 emigration at 68 was the point at which that generational pressure finally moved the whole household.

  - **[INFERRED]** He did not emigrate; only his son Johann Jacob's line went to Brazil. He is thus the last Wehrli to live and die entirely in Switzerland — the branching point between the Swiss Wehrli who remained and the Brazilian Bohrer/Wehrli who left.

  - **[CONTEXTUAL]** The Grindel Wehrli-Borer-Heggendorn cluster that produced the 1819 Nova Friburgo colonists was already interconnected in his generation through parish life, witnessing and marriage markets — the endogamy the Nova Friburgo community later showed was built on a Swiss-village network going back to his own mid-18th-century generation.

  ## Identity

  **Johannes Wehrli** (recorded *Johannis Whroli* in the register). Of Grindel, Soleure
  (Solothurn), Switzerland; the top of the Wehrli branch. Swiss.

  - **Couple:** husband of Barbara Alleman (P-0075) — [PROVEN] as a couple from the
  Grindel Catholic baptism register (PAR-0027, p.571), which records two of their
  children baptised in 1751 and 1752. No marriage record for the couple has been
  located. [OPEN]

  - **Birth, death, own parents:** no vital record held [OPEN]. A FamilySearch
  collaborative tree gives his birth ~1720 and death 2 April 1776, both at Grindel [LEAD];
  it attaches no parents to him, and a deeper "Adam Wehrli × Elsbeth Blattner" tree-ascent
  was examined and rejected as unsourced and date-implausible — do not mint it [rejected].

  ## Family and social network

  - **Children (documented):** Johann Jacob Wehrli (P-0072, b. 17 January 1751 — the
  1819 Nova Friburgo emigrant patriarch, through whom the line continues) and Johann
  Joseph Wehrli (bapt. 23 June 1752; not modelled — F-0036). [PROVEN] (PAR-0027)

  - He **did not emigrate**; only his son's line went to Brazil.

  ## What we can extrapolate

  - **The deepest generation named on this branch [INFERRED].** As the parents of the
  1751-born patriarch, Johannes and Barbara Alleman belong to the early-18th-century
  Grindel Wehrli stock — reachable only through the Grindel parish books.

  - **The Wehrli branch's Old-World floor [CONTEXTUAL / INFERRED].** A Grindel Jura
  peasant/farming household at the bottom of the line's arc; his son the *agricultor*
  Johann Jacob continued that same smallholder floor and carried it to Nova Friburgo in
  1819 — a lateral move, not a rise. No fortune ever existed here to lose (the structural
  mirror image of the family's Armond line); the emigration and any modest colony gain
  belong to his son's generation, not his.

  ## Open questions

  - His and Barbara Alleman's vital records and their own parents would come from the
  Grindel parish registers (via a Family History Center or the Staatsarchiv Solothurn);
  his son's baptism would confirm the couple as Johann Jacob's parents at primary level.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel baptism register, p.571 — the 1751 and 1752 baptisms naming him
  and Barbara Alleman as parents).

  ## Regional and migration context

  He belongs to the early-18th-century Grindel Wehrli stock of the Catholic,
  German-speaking Solothurn Jura — the deepest generation named on this branch, and one
  that stayed in Switzerland while the next generation emigrated. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (b. ~1720 – d. 2 Apr 1776):** Kath. Pfarrkirche St. Stephan, Grindel, Kt.
  Solothurn, Switzerland (4247; GPS 47.3833, 7.5042) — he never emigrated [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** É a geração mais profunda nomeada no ramo Wehrli — um agricultor do Jura de Grindel do início do século XVIII que nunca emigrou, a âncora da origem suíça do ramo antes de a geração do filho partir para o Brasil em 1819.

  - **[PROVEN]** É documentado como pai no registo de baptismo de Grindel em pelo menos duas entradas consecutivas — os filhos Johann Jacob (1751) e Johann Joseph (1752) — tornando-o a única pessoa neste ramo confirmada exclusivamente através dos registos paroquiais suíços dos filhos e não de qualquer registo da sua própria vida (PAR-0027).

  - **[CONTEXTUAL]** O Schwarzbubenland do cantão de Solothurn, onde fica Grindel, era católico, de língua alemã e intensamente constrangido em termos fundiários — as suas famílias de agricultores subdividiam as parcelas de geração em geração até a emigração se tornar a única opção para os filhos não-herdeiros; a emigração em 1819 do filho Johann Jacob, com 68 anos, foi o ponto em que essa pressão geracional finalmente moveu todo o agregado.

  - **[INFERRED]** Não emigrou; apenas a linha do filho Johann Jacob foi para o Brasil. É assim o último Wehrli a viver e morrer inteiramente na Suíça — o ponto de bifurcação entre os Wehrli suíços que ficaram e os Bohrer/Wehrli brasileiros que partiram.

  - **[CONTEXTUAL]** O agregado Wehrli-Borer-Heggendorn de Grindel que produziu os colonos de Nova Friburgo em 1819 já estava interligado na sua geração através da vida paroquial, das testemunhas e dos mercados matrimoniais — a endogamia que a comunidade de Nova Friburgo mais tarde mostrou foi construída sobre uma rede de aldeia suíça que remonta à sua própria geração de meados do século XVIII.

  ## Identidade

  **Johannes Wehrli** (registrado *Johannis Whroli* no assento). De Grindel, Soleure
  (Solothurn), Suíça; o topo do ramo Wehrli. Suíço.

  - **Casal:** marido de Barbara Alleman (P-0075) — [PROVEN] como casal pelo registro de
  batismo da paróquia católica de Grindel (PAR-0027, p.571), que registra dois de seus
  filhos batizados em 1751 e 1752. Nenhum registro de casamento do casal foi localizado.
  [OPEN]

  - **Nascimento, óbito, próprios pais:** nenhum registro vital em mãos [OPEN]. Uma árvore
  colaborativa do FamilySearch dá seu nascimento ~1720 e óbito em 2 de abril de 1776, ambos
  em Grindel [LEAD]; ela não lhe atribui pais, e uma ascendência de árvore mais profunda
  "Adam Wehrli × Elsbeth Blattner" foi examinada e rejeitada como sem fontes e
  cronologicamente implausível — não criar [rejected].

  ## Família e rede social

  - **Filhos (documentados):** Johann Jacob Wehrli (P-0072, n. 17 de janeiro de 1751 — o
  patriarca emigrante de Nova Friburgo de 1819, por quem a linha continua) e Johann
  Joseph Wehrli (bat. 23 de junho de 1752; não modelado — F-0036). [PROVEN] (PAR-0027)

  - Ele **não emigrou**; apenas a linha de seu filho foi para o Brasil.

  ## O que podemos extrapolar

  - **A geração mais profunda nomeada neste ramo [INFERRED].** Como pais do patriarca
  nascido em 1751, Johannes e Barbara Alleman pertencem ao tronco Wehrli de Grindel do
  início do século XVIII — alcançável apenas pelos livros paroquiais de Grindel.

  - **O piso do Velho Mundo do ramo Wehrli [CONTEXTUAL / INFERRED].** Um domicílio
  camponês/agrícola do Jura de Grindel no fundo do arco da linha; seu filho, o
  *agricultor* Johann Jacob, continuou esse mesmo piso de pequeno proprietário e o levou a
  Nova Friburgo em 1819 — um movimento lateral, não uma ascensão. Nunca existiu aqui
  fortuna a perder (o inverso estrutural da linha Armond da família); a emigração e
  qualquer modesto ganho de colônia pertencem à geração de seu filho, não à dele.

  ## Questões em aberto

  - Os registros vitais dele e de Barbara Alleman e seus próprios pais viriam dos
  registros paroquiais de Grindel (via um Family History Center ou o Staatsarchiv
  Solothurn); o batismo de seu filho confirmaria o casal como pais de Johann Jacob em
  nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (registro de batismo de Grindel, p.571 — os batismos de 1751 e 1752 que o
  nomeiam, com Barbara Alleman, como pais).

  ## Contexto regional e migratório

  Pertence ao tronco Wehrli de Grindel do início do século XVIII, no Jura católico e
  germanófono de Solothurn — a geração mais profunda nomeada neste ramo, e uma que
  permaneceu na Suíça enquanto a geração seguinte emigrou. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia natal (n. ~1720 – f. 2 de abril de 1776):** Kath. Pfarrkirche St. Stephan,
  Grindel, Cantão de Solothurn, Suíça (4247; GPS 47.3833, 7.5042) — ele nunca emigrou
  [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
