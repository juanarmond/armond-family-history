profile: >-
  ## Identity

  **Johannes Wehrli** (recorded *Johannis Whroli* in the register). Of Grindel, Soleure
  (Solothurn), Switzerland; the top of the Wehrli branch. Swiss.

  - **Couple:** husband of Barbara Alleman (P-0075) — [PROVEN] as a couple from the
  Grindel Catholic baptism register (PAR-0027, p.571), which records two of their
  children baptised in 1751 and 1752. No marriage record for the couple has been
  located. [OPEN]

  - **Birth, death, own parents:** not documented; no record held. [OPEN]

  ## Family and social network

  - **Children (documented):** Johann Jacob Wehrli (P-0072, b. 17 January 1751 — the
  1819 Nova Friburgo emigrant patriarch, through whom the line continues) and Johann
  Joseph Wehrli (bapt. 23 June 1752; not modelled — F-0036). [PROVEN] (PAR-0027)

  - He **did not emigrate**; only his son's line went to Brazil.

  ## What we can extrapolate

  - **The deepest generation named on this branch [INFERRED].** As the parents of the
  1751-born patriarch, Johannes and Barbara Alleman belong to the early-18th-century
  Grindel Wehrli stock — reachable only through the Grindel parish books.

  - **The Wehrli branch's Old-World floor [CONTEXTUAL / INFERRED].** A Grindel Jura
  peasant/farming household at the bottom of the line's arc; his son the *agricultor*
  Johann Jacob continued that same smallholder floor and carried it to Nova Friburgo in
  1819 — a lateral move, not a rise. No fortune ever existed here to lose (the structural
  mirror image of the family's Armond line); the emigration and any modest colony gain
  belong to his son's generation, not his.

  ## Open questions

  - His and Barbara Alleman's vital records and their own parents would come from the
  Grindel parish registers (via a Family History Center or the Staatsarchiv Solothurn);
  his son's baptism would confirm the couple as Johann Jacob's parents at primary level.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel baptism register, p.571 — the 1751 and 1752 baptisms naming him
  and Barbara Alleman as parents).

  ## Regional and migration context

  He belongs to the early-18th-century Grindel Wehrli stock of the Catholic,
  German-speaking Solothurn Jura — the deepest generation named on this branch, and one
  that stayed in Switzerland while the next generation emigrated. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (b. ~1720 – d. 2 Apr 1776):** Kath. Pfarrkirche St. Stephan, Grindel, Kt.
  Solothurn, Switzerland (4247; GPS 47.3833, 7.5042) — he never emigrated [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Identidade

  **Johannes Wehrli** (registrado *Johannis Whroli* no assento). De Grindel, Soleure
  (Solothurn), Suíça; o topo do ramo Wehrli. Suíço.

  - **Casal:** marido de Barbara Alleman (P-0075) — [PROVEN] como casal pelo registro de
  batismo da paróquia católica de Grindel (PAR-0027, p.571), que registra dois de seus
  filhos batizados em 1751 e 1752. Nenhum registro de casamento do casal foi localizado.
  [OPEN]

  - **Nascimento, óbito, próprios pais:** não documentados; nenhum registro em mãos.
  [OPEN]

  ## Família e rede social

  - **Filhos (documentados):** Johann Jacob Wehrli (P-0072, n. 17 de janeiro de 1751 — o
  patriarca emigrante de Nova Friburgo de 1819, por quem a linha continua) e Johann
  Joseph Wehrli (bat. 23 de junho de 1752; não modelado — F-0036). [PROVEN] (PAR-0027)

  - Ele **não emigrou**; apenas a linha de seu filho foi para o Brasil.

  ## O que podemos extrapolar

  - **A geração mais profunda nomeada neste ramo [INFERRED].** Como pais do patriarca
  nascido em 1751, Johannes e Barbara Alleman pertencem ao tronco Wehrli de Grindel do
  início do século XVIII — alcançável apenas pelos livros paroquiais de Grindel.

  - **O piso do Velho Mundo do ramo Wehrli [CONTEXTUAL / INFERRED].** Um domicílio
  camponês/agrícola do Jura de Grindel no fundo do arco da linha; seu filho, o
  *agricultor* Johann Jacob, continuou esse mesmo piso de pequeno proprietário e o levou a
  Nova Friburgo em 1819 — um movimento lateral, não uma ascensão. Nunca existiu aqui
  fortuna a perder (o inverso estrutural da linha Armond da família); a emigração e
  qualquer modesto ganho de colônia pertencem à geração de seu filho, não à dele.

  ## Questões em aberto

  - Os registros vitais dele e de Barbara Alleman e seus próprios pais viriam dos
  registros paroquiais de Grindel (via um Family History Center ou o Staatsarchiv
  Solothurn); o batismo de seu filho confirmaria o casal como pais de Johann Jacob em
  nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (registro de batismo de Grindel, p.571 — os batismos de 1751 e 1752 que o
  nomeiam, com Barbara Alleman, como pais).

  ## Contexto regional e migratório

  Pertence ao tronco Wehrli de Grindel do início do século XVIII, no Jura católico e
  germanófono de Solothurn — a geração mais profunda nomeada neste ramo, e uma que
  permaneceu na Suíça enquanto a geração seguinte emigrou. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia natal (n. ~1720 – f. 2 de abril de 1776):** Kath. Pfarrkirche St. Stephan,
  Grindel, Cantão de Solothurn, Suíça (4247; GPS 47.3833, 7.5042) — ele nunca emigrou
  [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
