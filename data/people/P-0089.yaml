profile: >-
  ## Identity

  **Elebia Francisca** (also read *Estêbia Francisca*). Wife of Gonçalo Rodrigues
  (P-0088), of the Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
  Portuguese.

  - **Role:** mother of João Rodrigues (P-0080), named in her son's 13 May 1716 Ruivais
  marriage (PAR-0036; family F-0043). [strong-evidence — see P-0088 for the identity
  basis]

  - **Birth, death, own parents:** unrecorded. [OPEN]

  ## Open questions

  - **Her origin parish and her own parents** [OPEN]. A page-by-page reading of the Ruivais
  marriage register for 1664–1706 (a bounded negative from the retrieval research) found
  neither her marriage to Gonçalo Rodrigues nor her distinctive forename (Estêbia / Estévia)
  anywhere in the run — a lead, not confirmed here, that she may not have been a Ruivais
  native and that her marriage, which would name her own parents, lies in an as-yet
  unidentified home parish. [LEAD]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of her son — names her as the groom's mother).

  ## Regional and migration context

  Of São Martinho de Ruivais in the Minho highlands (Arcebispado de Braga), the origin
  parish of this branch; her grandson João Rodrigues Valle (P-0078) emigrated to Minas
  Gerais. [CONTEXTUAL]

  She stands two generations above the crossing, in the non-emigrating Minho generation. The
  Minho was Portugal's densest and most fragmented region, a smallholding minifúndio reaching
  some of Europe's highest rural densities (around 96 inhabitants per km² by 1801), whose
  surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese
  emigration to Brazil; her grandson's crossing fell under the passport regime of the
  Provisão de 20 de março de 1720 (D. João V). This is the structural driver behind the
  branch's emigration — the regional history, not a documented motive of her own.
  [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Elebia Francisca** (também lida *Estêbia Francisca*). Mulher de Gonçalo Rodrigues
  (P-0088), da Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
  Portuguesa.

  - **Papel:** mãe de João Rodrigues (P-0080), nomeada no casamento de 13 de maio de 1716
  em Ruivais de seu filho (PAR-0036; família F-0043). [evidência forte — ver P-0088 para
  a base da identidade]

  - **Nascimento, óbito, pais próprios:** sem registro. [OPEN]

  ## Questões em aberto

  - **Sua paróquia de origem e seus próprios pais** [OPEN]. Uma leitura página a página do
  livro de casamentos de Ruivais de 1664–1706 (um negativo delimitado da pesquisa de
  recuperação) não encontrou nem seu casamento com Gonçalo Rodrigues nem seu prenome
  distintivo (Estêbia / Estévia) em toda a série — uma pista, não confirmada aqui, de que ela
  pode não ter sido natural de Ruivais e de que seu casamento, que nomearia seus próprios
  pais, encontra-se numa paróquia de origem ainda não identificada. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de seu filho — nomeia-a como mãe do noivo).

  ## Contexto regional e migratório

  De São Martinho de Ruivais, nas terras altas do Minho (Arcebispado de Braga), a paróquia
  de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou para Minas Gerais.
  [CONTEXTUAL]

  Ela está duas gerações acima da travessia, na geração minhota que não emigrou. O Minho era
  a região mais densa e mais fragmentada de Portugal, um minifúndio de pequenas posses que
  alcançava algumas das mais altas densidades rurais da Europa (cerca de 96 habitantes por
  km² por volta de 1801), cujos filhos excedentes sem herança fizeram dele a maior fonte
  isolada de emigração portuguesa para o Brasil no século XVIII; a travessia de seu neto
  enquadrou-se no regime de passaportes da Provisão de 20 de março de 1720 (D. João V). Este
  é o motor estrutural por trás da emigração deste ramo — a história regional, não um motivo
  documentado dela própria. [CONTEXTUAL]
