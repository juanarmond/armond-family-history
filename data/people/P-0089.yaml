profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named in her son's 1716 Ruivais marriage (PAR-0036) as the wife of Gonçalo Rodrigues — and, unlike her husband, she is *not* marked deceased. She was alive when her son married; she outlived him.

  - **[INFERRED]** Her forename appears nowhere in the Ruivais marriage register 1664–1706 — a bounded-negative finding that strongly suggests she was not a Ruivais native. Her marriage therefore lies in her own, still-unidentified home parish, which is where her parents would be named.

  - **[INFERRED]** "Elebia" (also read "Estêbia") is not a standard saint's name in the Minho registers. An unusual forename is itself weak evidence of an origin outside the parish, and it is the single most searchable thing about her — which is why the neighbouring Montalegre / Barroso parishes are now the highest-value unread target.

  - **[CONTEXTUAL]** She stands two generations above the Atlantic crossing: her son João stayed in Ruivais; her grandson João Rodrigues Valle (b. 1728) emigrated to Minas Gerais. The land pressure that drove the family out was already in place in her lifetime, but it fell on her descendants.

  ## Identity

  **Elebia Francisca** (also read *Estêbia Francisca*; the forename is worn and both readings are preserved). Wife of Gonçalo Rodrigues (P-0088), of the Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese. Mother of João Rodrigues (P-0080) and so 4th-great-grandmother of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Role:** named in her son's 13 May 1716 Ruivais marriage (PAR-0036; family F-0043). [strong-evidence — see P-0088 for the identity basis]

  - **Birth, death, own parents:** unrecorded. [OPEN]

  ## Standing and profession

  - **Nothing is recorded.** No occupation, no property, no lugar of her own, no act in which she is a party. The 1716 entry gives her a husband and a son and nothing else. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record exists, and none could — she appears only as a name in a clause written by a priest.

  - **One negative datum is worth stating:** her husband is marked "já defunto" and she is not, so the household she headed in 1716 was a widow's. [PROVEN by omission]

  ## Family and social network

  - **Husband:** Gonçalo Rodrigues (P-0088), already deceased by May 1716.

  - **Son:** João Rodrigues (P-0080), who married Joanna Gonçalves at Ruivais in 1716; through him she is the great-grandmother of Ritta Angélica Rodrigues and the ancestor of the Brazilian Valle branch.

  - **No kin, witness, godparent or neighbour of hers is documented.** There is no FAN circle to read — the single act that names her names no one else on her side. [OPEN]

  ## What we can extrapolate

  - **She married out of the parish, which is why the line stops here** [INFERRED]. The forty-two-year bounded negative in the Ruivais marriage book is the strongest structural fact about her: a couple normally married where the bride lived, so her marriage — and with it the names of her parents — sits in a register we have not identified. The depth of this branch is limited not by her obscurity but by a marriage that happened over a ridge.

  - **Marrying in from outside was ordinary and had a cost** [CONTEXTUAL / INFERRED]. Minho highland parishes were too small to sustain endogamy, and brides routinely crossed between freguesias. But a woman who married into Ruivais arrived without the local baptismal kin her husband had — which is exactly the position her grandson João Rodrigues Valle would find himself in, in reverse, when he arrived in Minas Gerais and married a local woman to acquire a parish. The same mechanism, one ridge and one ocean apart.

  - **A widowed mother marrying off a son is an inheritance moment** [PROVEN / CONTEXTUAL]. Her husband's estate had already been divided before 1716, and it is from that divided household that her son set up his own. Two generations of that arithmetic, on a holding that could not grow, produced an emigrant.

  - **Nothing in her life is distinguishable from her neighbours', and that is the honest finding** [INFERRED]. She has no title, no property, no recorded act. What survives of her is a worn forename in one clause of one register. Every socioeconomic statement above is about the kind of household she belonged to, inferred from regional history, not about anything documented of her personally.

  ## Open questions

  - **Her origin parish and her own parents** [OPEN]. A page-by-page reading of the Ruivais marriage register for 1664–1706 — a bounded negative from the retrieval research — found neither her marriage to Gonçalo Rodrigues nor her distinctive forename (Estêbia / Estévia) anywhere in the run: a lead, not confirmed here, that she was not a Ruivais native and that her marriage, which would name her own parents, lies in an as-yet unidentified home parish. [LEAD] The neighbouring Vieira do Minho parishes (Campos, Salamonde/São Gens, Ventosa, Cantelães) were swept in September 2026 and were also negative; the Montalegre / Barroso parishes across the Rabagão (Vila Real district, at the ADVR) remain the highest-value unread target.

  - Her death, and whether a Ruivães óbito entry exists for her. [OPEN]

  - Which reading of the forename is correct — Elebia or Estêbia. [uncertain]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of her son — names her as the groom's mother).

  ## Regional and migration context

  Of São Martinho de Ruivais in the Minho highlands (Arcebispado de Braga), the origin parish of this branch; her grandson João Rodrigues Valle (P-0078) emigrated to Minas Gerais. [CONTEXTUAL] She stands two generations above the crossing, in the non-emigrating Minho generation. The Minho was Portugal's densest and most fragmented region, a smallholding minifúndio reaching some of Europe's highest rural densities (around 96 inhabitants per km² by 1801), whose surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese emigration to Brazil; her grandson's crossing fell under the passport regime of the Provisão de 20 de março de 1720 (D. João V). This is the structural driver behind the branch's emigration — the regional history, not a documented motive of her own. [CONTEXTUAL] Her own origin, if the bounded negative is read correctly, lies outside Ruivais and is not yet placed on the map. [LEAD]

  ## Where to go today

  - **Named in her son's 1716 marriage:** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada no casamento de seu filho em Ruivais, em 1716 (PAR-0036), como esposa de Gonçalo Rodrigues — e, ao contrário do marido, *não* é marcada como falecida. Estava viva quando o filho se casou; sobreviveu a ele.

  - **[INFERRED]** Seu prenome não aparece em parte alguma do registro de casamentos de Ruivais de 1664–1706 — achado negativo delimitado que sugere fortemente que ela não era natural de Ruivais. Seu casamento está, portanto, em sua própria paróquia natal, ainda não identificada, que é onde seus pais seriam nomeados.

  - **[INFERRED]** "Elebia" (também lido "Estêbia") não é nome de santa corrente nos registros minhotos. Um prenome incomum é, em si, indício fraco de origem fora da freguesia, e é a coisa mais pesquisável a seu respeito — razão pela qual as freguesias vizinhas de Montalegre / Barroso são hoje o alvo não lido de maior valor.

  - **[CONTEXTUAL]** Ela está duas gerações acima da travessia atlântica: seu filho João ficou em Ruivais; seu neto João Rodrigues Valle (n. 1728) emigrou para Minas Gerais. A pressão fundiária que expulsou a família já existia em seu tempo, mas recaiu sobre seus descendentes.

  ## Identidade

  **Elebia Francisca** (também lida *Estêbia Francisca*; o prenome está gasto e as duas leituras ficam preservadas). Esposa de Gonçalo Rodrigues (P-0088), da Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguesa. Mãe de João Rodrigues (P-0080) e, portanto, pentavó de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Papel:** nomeada no casamento de seu filho, em 13 de maio de 1716, em Ruivais (PAR-0036; família F-0043). [evidência forte — ver P-0088 quanto à base de identidade]

  - **Nascimento, óbito, pais próprios:** sem registro. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado.** Nenhuma ocupação, propriedade, lugar próprio ou ato em que seja parte. A entrada de 1716 lhe dá um marido e um filho, e nada mais. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** não existe registro assinável disponível, nem poderia existir — ela aparece apenas como nome numa cláusula escrita por um padre.

  - **Um dado negativo merece registro:** o marido é marcado "já defunto" e ela não, de modo que a casa que ela chefiava em 1716 era de viúva. [PROVEN por omissão]

  ## Família e rede social

  - **Marido:** Gonçalo Rodrigues (P-0088), já falecido em maio de 1716.

  - **Filho:** João Rodrigues (P-0080), casado com Joanna Gonçalves em Ruivais em 1716; por ele, ela é bisavó de Ritta Angélica Rodrigues e ancestral do ramo Valle brasileiro.

  - **Nenhum parente, testemunha, padrinho ou vizinho seu está documentado.** Não há círculo FAN a ler — o único ato que a nomeia não nomeia mais ninguém do lado dela. [OPEN]

  ## O que podemos extrapolar

  - **Ela casou-se fora da freguesia, e é por isso que a linha para aqui** [INFERRED]. O negativo delimitado de quarenta e dois anos no livro de casamentos de Ruivais é o fato estrutural mais forte a seu respeito: um casal normalmente se casava onde a noiva vivia, de modo que seu casamento — e com ele os nomes de seus pais — está num registro que não identificamos. A profundidade deste ramo é limitada não pela obscuridade dela, mas por um casamento que aconteceu do outro lado da serra.

  - **Casar vindo de fora era comum e tinha um custo** [CONTEXTUAL / INFERRED]. As freguesias serranas do Minho eram pequenas demais para sustentar endogamia, e as noivas cruzavam rotineiramente entre elas. Mas uma mulher que casava para dentro de Ruivais chegava sem a parentela de pia local que o marido tinha — exatamente a posição em que seu neto João Rodrigues Valle se veria, ao inverso, ao chegar a Minas Gerais e casar-se com uma local para adquirir uma freguesia. O mesmo mecanismo, com uma serra e um oceano de distância.

  - **Uma mãe viúva casando um filho é um momento de herança** [PROVEN / CONTEXTUAL]. O espólio do marido já havia sido dividido antes de 1716, e é a partir dessa casa dividida que o filho montou a sua. Duas gerações dessa aritmética, sobre uma posse que não podia crescer, produziram um emigrante.

  - **Nada em sua vida se distingue da de seus vizinhos, e esse é o achado honesto** [INFERRED]. Não tem título, propriedade nem ato registrado. O que sobrevive dela é um prenome gasto numa cláusula de um registro. Toda afirmação socioeconômica acima é sobre o tipo de casa a que pertencia, inferida da história regional, e não sobre algo documentado dela pessoalmente.

  ## Questões em aberto

  - **Sua paróquia de origem e seus próprios pais** [OPEN]. Uma leitura página a página do registro de casamentos de Ruivais de 1664–1706 — negativo delimitado vindo da pesquisa de recuperação — não encontrou nem seu casamento com Gonçalo Rodrigues nem seu prenome distintivo (Estêbia / Estévia) em toda a série: pista, não confirmada aqui, de que ela não era natural de Ruivais e de que seu casamento, que nomearia seus próprios pais, está numa paróquia natal ainda não identificada. [LEAD] As freguesias vizinhas de Vieira do Minho (Campos, Salamonde/São Gens, Ventosa, Cantelães) foram varridas em setembro de 2026 e também deram negativo; as freguesias de Montalegre / Barroso, do outro lado do Rabagão (distrito de Vila Real, no ADVR), continuam sendo o alvo não lido de maior valor.

  - Seu óbito, e se existe assento de óbito para ela em Ruivães. [OPEN]

  - Qual leitura do prenome está correta — Elebia ou Estêbia. [uncertain]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de seu filho — nomeia-a como mãe do noivo).

  ## Contexto regional e migratório

  De São Martinho de Ruivais, nas terras altas do Minho (Arcebispado de Braga), a paróquia de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou para Minas Gerais. [CONTEXTUAL] Ela está duas gerações acima da travessia, na geração minhota não emigrante. O Minho era a região mais densa e mais fragmentada de Portugal, um minifúndio de pequenas propriedades que alcançava algumas das maiores densidades rurais da Europa (cerca de 96 habitantes por km² em 1801), cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada da emigração portuguesa setecentista para o Brasil; a travessia de seu neto caiu sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V). Esse é o motor estrutural por trás da emigração do ramo — história regional, não motivo documentado dela própria. [CONTEXTUAL] Sua própria origem, se o negativo delimitado for lido corretamente, está fora de Ruivais e ainda não foi situada no mapa. [LEAD]

  ## Onde ir hoje

  - **Nomeada no casamento de seu filho, em 1716:** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
