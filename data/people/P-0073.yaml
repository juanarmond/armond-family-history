profile: >-
  ## Interesting facts

  - **[PROVEN]** Her birth on 17 June 1760 at Erschwil is confirmed by the Erschwil Catholic baptism register (PAR-0028), the entry naming her parents as Joseph Borer and Anna Maria Borer — both surnamed Borer, the deepest documented instance of Borer×Borer endogamy in the family.

  - **[CONTEXTUAL]** She emigrated at approximately 59 years old on the Heureux Voyage, which reportedly killed about a quarter of its passengers — uprooting an established farming family in the Solothurn Jura for a poor colonial lot. She died at Nova Friburgo in 1832, 13 years after arrival, having witnessed the colony's entire founding period from first settlement to Brazilian integration.

  - **[INFERRED]** Both parents carrying the Borer surname points to a small, endogamous Borer community in the Erschwil-Grindel Schwarzbubenland — the same pattern that reappears one generation down when her daughter Anna Maria married Laurent Borer, and again two generations down when her great-grandchildren bore the surname Bohrer.

  - **[CONTEXTUAL]** Her Erschwil birth (1760) and 1782 Grindel marriage suggest she moved from Erschwil to Grindel before marriage — a short move within the same tight Catholic Jura community, the kind of marriage-market geography typical of small Swiss Catholic parishes where families knew one another across village boundaries.

  - **[PROVEN]** She married Johann Jacob Wehrli on 27 January 1782 at Grindel, with witnesses Heinricus Werli and Catharina Borer named in the marriage register (PAR-0029) — placing both Wehrli and Borer surnames in the witness circle already in 1782, the Old-World root of the Nova Friburgo endogamy that persisted for three generations.

  ## Identity

  **Elisabetha Borer** (also *Elisa Borer* in the Casa Suíça database). The Wehrli
  matriarch and the earliest Borer this branch can name from a held primary baptism.

  - **Birth:** 17 June 1760 at Erschwil (Erischwyg), Soleure (Solothurn), Switzerland —
  [PROVEN] from the Erschwil Catholic baptism register (PAR-0028, church book #68;
  E-0069).

  - **Parents:** Joseph Borer (P-0076) × Anna Maria Borer (P-0077), of Erschwil —
  [PROVEN] (PAR-0028; family F-0037). Both parents were surnamed Borer. A FamilySearch
  collaborative tree instead names her parents Joannes Borer × Elisabeth Borer; this
  contradicts the held PAR-0028 baptism, which prevails — the tree pair is a navigation
  lead, not adopted [LEAD/contradicted].

  - **Marriage:** married Johann Jacob Wehrli (P-0072) on 27 January 1782 at Grindel —
  [PROVEN] (PAR-0029; E-0065). The marriage register describes the couple as "ambo ex
  Grindel, Erischwyg", so she was likely resident in Grindel by 1782 though baptised at
  Erschwil in 1760.

  - **Emigration:** arrived Nova Friburgo in 1819 aboard the *Heureux Voyage* with her
  husband's household.

  - **Death:** 10 October 1832, Nova Friburgo (PUB-0003, strong-evidence; E-0067) —
  about thirteen years after arrival. A blog gives 10 December 1832; our repository does
  not adopt it. [LEAD]

  ## Family and social network

  - **A Borer×Borer marriage above her:** her parents Joseph Borer and Anna Maria Borer
  both bore the Borer surname — a sign of a small, endogamous Borer community in Erschwil
  [PROVEN for the parents; INFERRED for the endogamy].

  - **The Borer surname enters the line through her**, and again through her son-in-law
  Laurent Borer, so it reaches later generations by two routes. Whether the Erschwil
  Borers and Grindel Borers are one family is undocumented. [PUB-0003 note; LEAD]

  - **Children:** with Johann Jacob Wehrli, including Anna Maria Werhly (P-0069), the
  immigrant matriarch of the Borer trunk. See F-0035 for the collateral children.

  ## What we can extrapolate

  - **She is the earliest, doubly-Borer root of the surname in this line [INFERRED].**
  Her parents' Borer×Borer marriage and the cluster of same-surname Borer godparents on
  her 1760 register page point to a very small, endogamous Borer community — consistent
  with, but not proof of, a single Solothurn Borer stock behind the pervasive surname in
  the tree.

  - **She embodies the Old-World floor the whole line rose from [CONTEXTUAL / INFERRED].**
  Elisabetha was a Borer daughter of the poor, land-constrained Catholic Jura
  (Erschwil/Grindel, the Schwarzbubenland) — subsistence-farming upland with too many
  heirs for too little arable land. That she emigrated at about 59, uprooting an entire
  established Wehrli household onto the 1819 *Heureux Voyage*, measures how hard the push
  was: the 1816 "Year Without a Summer" famine plus post-Napoleonic poverty made staying
  worse than a crossing that reportedly killed about a quarter of the colonists. Her
  family left no elite behind and arrived as none — it converted land-hunger into a poor
  Nova Friburgo colony lot (Casa 73 / Lote 86), the bottom-but-landed rung from which the
  entire Borer/Bohrer socioeconomic arc begins — the structural mirror image of the
  family's Armond line, which began from an office-and-marriage elite and fell.

  ## Open questions

  - Her **Nova Friburgo death record (1832)** would settle the 10 October vs 10 December
  question; her **parents' own parents** would come from the Erschwil registers (and the
  Thierstein district *Inventar- und Teilungen*). [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil baptism register — her 1760 baptism and her parents) · PAR-0029
  (Grindel marriage register — her 1782 marriage).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / Casa Suíça database) — emigration and 1832
  death.

  ## Regional and migration context

  Born at Erschwil in the Catholic Solothurn Jura, she married into the neighbouring
  Wehrli family of Grindel and emigrated with them on the *Heureux Voyage* in 1819 under
  Dom João VI's Swiss-colony scheme, driven by the region's post-Napoleonic distress.
  [CONTEXTUAL] She died at Nova Friburgo in 1832.

