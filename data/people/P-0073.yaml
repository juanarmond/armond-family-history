notes:
- text: >-
    Wife of Johann Jacob Wehrli (P-0072). Her surname 'Borer' may indicate kinship
    with the Borer immigrant families (BORER I Jacob Borer and BORER II Laurent
    Borer), but this is not confirmed — the Borer surname was common in the
    Grindel/Soleure area.
- text: >-
    Named 'Elisa Borer' in the Casa Suíça DB narrative and 'Elisabetha Borer' in
    the Grindel marriage register. Both forms preserved.
