notes:
- text: >-
    Wife of Johann Jacob Wehrli (P-0072). Born 17 June 1760, Erschwil (Erischwyg),
    Soleure (Solothurn), Switzerland — PRIMARY evidence: Erschwil Catholic parish
    baptism register (PAR-0028, church book #68): "die 17 Junii 1760, Ecisabeth,
    parents Joseph Borer fusemnistr × anna Maria Borer." Parents confirmed as
    Joseph Borer (P-0076) × Anna Maria Borer (P-0077). She died at Nova Friburgo
    on 10 October 1832 (PUB-0003, E-0067).
  text_pt: >-
    Esposa de Johann Jacob Wehrli (P-0072). Nascida em 17 de junho de 1760,
    Erschwil (Erischwyg), Soleure (Solothurn), Suíça — evidência PRIMÁRIA:
    registro de batismo da paróquia católica de Erschwil (PAR-0028, livro da
    igreja nº 68): "die 17 Junii 1760, Ecisabeth, parents Joseph Borer fusemnistr
    × anna Maria Borer." Pais confirmados como Joseph Borer (P-0076) × Anna Maria
    Borer (P-0077). Ela morreu em Nova Friburgo em 10 de outubro de 1832
    (PUB-0003, E-0067).
- text: >-
    Her surname 'Borer' may indicate kinship with the Borer immigrant families
    (BORER I Jacob Borer and BORER II Laurent Borer), but this is not confirmed by
    primary evidence — the Borer surname was common in the Grindel/Soleure area.
    Her father Joseph Borer is distinct from the immigrant Jacob Borer (P-0050,
    BORER I, b. 1801) and from Laurent Borer (P-0068, BORER II, b. 1797).
  text_pt: >-
    Seu sobrenome 'Borer' pode indicar parentesco com as famílias imigrantes
    Borer (BORER I Jacob Borer e BORER II Laurent Borer), mas isso não é
    confirmado por evidência primária — o sobrenome Borer era comum na região de
    Grindel/Soleure. Seu pai Joseph Borer é distinto do imigrante Jacob Borer
    (P-0050, BORER I, n. 1801) e de Laurent Borer (P-0068, BORER II, n. 1797).
- text: >-
    Named 'Elisa Borer' in the Casa Suíça DB narrative and 'Elisabetha Borer' in
    the Grindel marriage register (PAR-0029). The Grindel marriage register entry
    describes both parties as "ambo ex Grindel, Erischwyg" — she may have been
    resident in Grindel by 1782 despite being baptised in Erschwil in 1760.
  text_pt: >-
    Nomeada 'Elisa Borer' na narrativa do banco de dados da Casa Suíça e
    'Elisabetha Borer' no registro de casamento de Grindel (PAR-0029). A entrada
    do registro de casamento de Grindel descreve ambas as partes como "ambo ex
    Grindel, Erischwyg" — ela pode ter residido em Grindel por volta de 1782,
    apesar de ter sido batizada em Erschwil em 1760.
