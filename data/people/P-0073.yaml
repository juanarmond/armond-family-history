profile_pt: >-
  ## Factos notáveis

  - **[PROVEN]** O seu nascimento em 17 de Junho de 1760 em Erschwil é confirmado pelo registo de baptismo católico de Erschwil (PAR-0028), a entrada nomeando os seus pais como Joseph Borer e Anna Maria Borer — ambos com o apelido Borer, o caso mais profundo documentado de endogamia Borer×Borer na família.

  - **[CONTEXTUAL]** Emigrou com aproximadamente 59 anos no Heureux Voyage, que terá matado cerca de um quarto dos passageiros — arrancando uma família de agricultores estabelecida no Jura de Solothurn para um lote colonial pobre. Morreu em Nova Friburgo em 1832, 13 anos após a chegada, tendo testemunhado todo o período fundacional da colónia desde o primeiro assentamento até à integração brasileira.

  - **[INFERRED]** Ambos os pais com o apelido Borer aponta para uma pequena comunidade Borer endogâmica no Schwarzbubenland de Erschwil-Grindel — o mesmo padrão que reaparece uma geração abaixo quando a filha Anna Maria casou com Laurent Borer, e novamente duas gerações abaixo quando os bisnetos carregaram o apelido Bohrer.

  - **[CONTEXTUAL]** O seu nascimento em Erschwil (1760) e o casamento de 1782 em Grindel sugerem que se mudou de Erschwil para Grindel antes do casamento — uma curta deslocação dentro da mesma comunidade católica apertada do Jura, o tipo de geografia matrimonial típica das pequenas paróquias católicas suíças onde as famílias se conheciam através das fronteiras das aldeias.

  - **[PROVEN]** Casou com Johann Jacob Wehrli em 27 de Janeiro de 1782 em Grindel, com as testemunhas Heinricus Werli e Catharina Borer nomeadas no registo de casamento (PAR-0029) — colocando os apelidos Wehrli e Borer no círculo de testemunhas já em 1782, a raiz do Velho Mundo da endogamia de Nova Friburgo que persistiu por três gerações.

  ## Identidade

  **Elisabetha Borer** (também *Elisa Borer* no banco de dados da Casa Suíça). A matriarca
  Wehrli e a Borer mais antiga que este ramo pode nomear a partir de um batismo primário
  em mãos.

  - **Nascimento:** 17 de junho de 1760 em Erschwil (Erischwyg), Soleure (Solothurn),
  Suíça — [PROVEN] pelo registro de batismo da paróquia católica de Erschwil (PAR-0028,
  livro paroquial nº 68; E-0069).

  - **Pais:** Joseph Borer (P-0076) × Anna Maria Borer (P-0077), de Erschwil — [PROVEN]
  (PAR-0028; família F-0037). Ambos os pais tinham o sobrenome Borer. Uma árvore
  colaborativa do FamilySearch nomeia seus pais como Joannes Borer × Elisabeth Borer; isso
  contradiz o batismo em mãos PAR-0028, que prevalece — o par da árvore é uma pista de
  navegação, não adotado [LEAD/contradicted].

  - **Casamento:** casou-se com Johann Jacob Wehrli (P-0072) em 27 de janeiro de 1782 em
  Grindel — [PROVEN] (PAR-0029; E-0065). O registro de casamento descreve o casal como
  "ambo ex Grindel, Erischwyg", de modo que ela provavelmente já residia em Grindel por
  volta de 1782, embora batizada em Erschwil em 1760.

  - **Emigração:** chegou a Nova Friburgo em 1819 no *Heureux Voyage* com o domicílio do
  marido.

  - **Óbito:** 10 de outubro de 1832, Nova Friburgo (PUB-0003, evidência forte; E-0067) —
  cerca de treze anos após a chegada. Um blog dá 10 de dezembro de 1832; nosso repositório
  não o adota. [LEAD]

  ## Família e rede social

  - **Um casamento Borer×Borer acima dela:** seus pais Joseph Borer e Anna Maria Borer
  ambos tinham o sobrenome Borer — sinal de uma comunidade Borer pequena e endogâmica em
  Erschwil [PROVEN para os pais; INFERRED para a endogamia].

  - **O sobrenome Borer entra na linha por meio dela**, e novamente por meio de seu genro
  Laurent Borer, chegando às gerações posteriores por duas vias. Se os Borer de Erschwil e
  os de Grindel são uma só família é indocumentado. [nota de PUB-0003; LEAD]

  - **Filhos:** com Johann Jacob Wehrli, incluindo Anna Maria Werhly (P-0069), a matriarca
  imigrante do tronco Borer. Ver F-0035 para os filhos colaterais.

  ## O que podemos extrapolar

  - **Ela é a raiz mais antiga, e duplamente Borer, do sobrenome nesta linha [INFERRED].**
  O casamento Borer×Borer de seus pais e o conjunto de padrinhos Borer de mesmo sobrenome
  em sua página de registro de 1760 apontam para uma comunidade Borer muito pequena e
  endogâmica — consistente com, mas não prova de, um único tronco Borer de Solothurn por
  trás do sobrenome que permeia a árvore.

  - **Ela encarna o piso do Velho Mundo de onde toda a linha se ergueu [CONTEXTUAL /
  INFERRED].** Elisabetha era uma filha Borer do Jura católico pobre e com escassez de
  terra (Erschwil/Grindel, o Schwarzbubenland) — planalto de agricultura de subsistência
  com herdeiros demais para terra arável de menos. Que ela tenha emigrado por volta dos 59
  anos, desenraizando um domicílio Wehrli inteiro e estabelecido no *Heureux Voyage* de
  1819, mede quão forte foi o empurrão: a fome do "Ano Sem Verão" de 1816 somada à pobreza
  pós-napoleônica tornou ficar pior do que uma travessia que teria matado cerca de um
  quarto dos colonos. Sua família não deixou elite para trás e chegou como nenhuma —
  converteu a escassez de terra em um pobre lote de colônia em Nova Friburgo (Casa 73 /
  Lote 86), o degrau no-fundo-mas-com-terra de onde parte todo o arco socioeconômico
  Borer/Bohrer — o inverso estrutural da linha Armond da família, que partiu de uma elite
  de ofício e casamento e caiu.

  ## Questões em aberto

  - Seu **registro de óbito em Nova Friburgo (1832)** resolveria a questão 10 de outubro
  vs 10 de dezembro; os **pais de seus próprios pais** viriam dos registros de Erschwil (e
  do *Inventar- und Teilungen* do distrito de Thierstein). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (registro de batismo de Erschwil — seu batismo de 1760 e seus pais) ·
  PAR-0029 (registro de casamento de Grindel — seu casamento de 1782).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / banco de dados da Casa Suíça) — emigração e
  óbito de 1832.

  ## Contexto regional e migratório

  Nascida em Erschwil, no Jura católico de Solothurn, casou-se com a vizinha família
  Wehrli de Grindel e emigrou com eles no *Heureux Voyage* em 1819, sob o esquema de
  colônia suíça de Dom João VI, impelida pela penúria pós-napoleônica da região.
  [CONTEXTUAL] Morreu em Nova Friburgo em 1832.

