profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 17 June 1760 baptism at Erschwil names both her parents **Borer** —
  Joseph Borer and Anna Maria Borer (PAR-0028, church book #68) — the deepest documented
  instance of Borer × Borer endogamy in this family.

  - **[strong-evidence — PUB-0003, event E-0067]** She died at Nova Friburgo on **10 October
  1832**, the date given by the *Imigrantes de Nova Friburgo* / Casa Suíça compilation. The
  retrieval research reports reading her Nova Friburgo death act (Óbito L1 f.82) with the same
  date — "Ysabel Verly, viúva de Jacob Verly, natural do Cantão de Soleure, de idade de setenta
  e dois annos", buried in "cemeterio do Nº 61", the lot of her husband, who had died in 1827,
  and with the month written "outobro" [LEAD — the act is not catalogued and no scan is held
  here]. The "10 December 1832" circulating in a genealogy blog conflicts with PUB-0003 and
  with that reported reading, and is not adopted. [Corrected 2026-10-08: the death act was
  previously described here as held and proven; it is neither catalogued nor held.]

  - **[LEAD]** The reported stated age of 72 at death would imply a birth around 1760,
  agreeing with the held Erschwil baptism (PAR-0028) — but that age comes from the
  uncatalogued death act and cannot be confirmed until its image is held.

  - **[CONTEXTUAL]** She emigrated at about 59 on a crossing that killed roughly a quarter of
  the colonists, uprooting an established Jura farming household for a poor colonial lot, and
  then lived thirteen years at Nova Friburgo — long enough to see the colony's entire founding
  period, from first settlement to its absorption into Brazilian parish and municipal life.

  - **[PROVEN]** Her 1782 Grindel marriage was witnessed by **Heinricus Werli and Catharina
  Borer** — a Wehrli and a Borer at the same altar, thirty-eight years before her daughter
  Anna Maria married a Borer at Nova Friburgo. The Borer–Wehrli braid was already tied in
  Switzerland.

  - **[CONTEXTUAL]** Baptised at Erschwil in 1760 but described in 1782 as "ex
  Grindel[-Erschwyl]", she had moved the few kilometres between two parishes of the same small
  Catholic Jura world before marrying — the ordinary marriage geography of the
  Schwarzbubenland, where families knew one another across village boundaries.

  ## Identity

  **Elisabetha Borer** (also *Elisa Borer* in the Casa Suíça database; reportedly entered at
  death under her married name **"Ysabel Verly"** [LEAD — uncatalogued death act]). The Wehrli matriarch, and the earliest Borer this
  branch can name from a held primary baptism.

  - **Birth:** 17 June 1760 at Erschwil (Erischwyg), Soleure (Solothurn), Switzerland —
  [PROVEN] from the Erschwil Catholic baptism register (PAR-0028, church book #68; event
  E-0069), the entry reading "die 17 Junii 1760 … Ecisabeth", a scribal variant of Elisabetha.

  - **Parents:** Joseph Borer (P-0076) × Anna Maria Borer (P-0077), of Erschwil — [PROVEN]
  (PAR-0028; family F-0037). Both parents were surnamed Borer. A FamilySearch collaborative
  tree instead gives her parents as Joannes Borer × Elisabeth Borer; that contradicts the held
  baptism, which prevails — the tree pair is a navigation lead, not adopted
  [LEAD/contradicted].

  - **Marriage:** married Johann Jacob Wehrli (P-0072) on 27 January 1782 at Grindel —
  [PROVEN] (PAR-0029, p.71 entry 4; event E-0065). The register describes the couple as "ambo
  ex Grindel[-Erschwyl]", so she was likely resident in Grindel by 1782 though baptised at
  Erschwil in 1760.

  - **Emigration:** arrived at Nova Friburgo in 1819 aboard the *Heureux Voyage* with her
  husband's household, aged about 59; the household held Casa 73 / Lote 86.

  - **Death:** **10 October 1832**, Nova Friburgo — [strong-evidence] from PUB-0003 (*Imigrantes
  de Nova Friburgo* / Casa Suíça database; event E-0067, status strong-evidence). The retrieval
  research reports the Nova Friburgo death act (Óbito L1 f.82) as recording "Ysabel Verly, viúva
  de Jacob Verly, natural do Cantão de Soleure, de idade de setenta e dois annos" before the
  vicar Jacob Joye, buried in "cemeterio do Nº 61" — the cemetery lot of her husband, who had
  predeceased her in 1827 (Óbito L1 f.65) — with no parents named [LEAD — the act is not
  catalogued as a source and no scan is held in this repository, so none of these details is
  proven here]. The Raibert-blog "10 December 1832" conflicts with PUB-0003 and is not
  adopted; the act's reported "outobro" would settle it once held. [Corrected 2026-10-08:
  previously labelled PROVEN from the death act, which contradicted E-0067.]

  ## Standing and profession

  No occupation, property, office, title or literacy is documented for her. What the two held
  acts record is her position: a Borer daughter of Erschwil and the wife of a Grindel
  *agricultor*; the uncatalogued death act reportedly adds that she was a **widow** ("viúva de
  Jacob Verly") buried in her husband's lot [LEAD]. She survived him by about five years in the
  colony (PUB-0003). Her household's
  material base was the *Decreto de 16 de maio de 1818* settlement package: a lot and a built
  house, rations, seed and livestock, and a daily subsidy of 0$160 falling to 0$080 across two
  years, roughly 58$000 in the first year against a free rural labourer's ~420$000.
  [CONTEXTUAL — role-based]

  ## Family and social network

  - **A Borer × Borer marriage above her:** her parents Joseph Borer and Anna Maria Borer both
  bore the Borer surname, and the same 1760 register page carries a "Joseph Borer *gmüpl*" as
  godfather and a "Mari Elisabth Borr" as godmother — a page on which nearly every name is a
  Borer. [PROVEN for the parents and godparents; INFERRED for the endogamy]

  - **Husband:** Johann Jacob Wehrli (P-0072), married 1782; family F-0035. He died at Nova
  Friburgo in 1827 and she in 1832 (PUB-0003); both are reported buried in cemetery lot nº 61
  [LEAD — from the uncatalogued death acts].

  - **Children:** with Johann Jacob Wehrli, including **Anna Maria Werhly** (P-0069), the
  immigrant matriarch of the Borer trunk, and Salomea, who married on the same day as her
  sister in 1820. See F-0035 for the collateral children.

  - **The Borer surname enters this line twice through her generation** — once as her own
  maiden name and again through her son-in-law Laurent Borer of Grindel. Whether the Erschwil
  Borers and the Grindel Borers are one family is undocumented and should stay open. [LEAD]

  ## What we can extrapolate

  - **The earliest, doubly-Borer root of the surname in this line [INFERRED].** Her parents'
  Borer × Borer marriage and the cluster of Borer godparents on her own register page point to
  a very small, endogamous Borer population in Erschwil around 1760 — consistent with, but not
  proof of, a single Solothurn Borer stock behind the surname's pervasiveness in this tree.

  - **Standing: inherited, small, and transmitted as position rather than property [CONTEXTUAL
  / INFERRED].** Nothing in her record gives her family rank, office or letters. Her father
  carries an abbreviated local title ("*fusemnistr*", possibly a *Feuersmeister* or similar
  communal duty, undeciphered), which is the sort of unpaid village function that confers
  standing and no income — a parish-level analogue of the honorary offices that recur, and pay
  nothing, throughout this family's Armond line. She married laterally, into a Grindel
  *agricultor* household of the same rung.

  - **Her emigration at 59 measures the pressure exactly [CONTEXTUAL / INFERRED].** People of
  that age do not cross an ocean speculatively. That she and her 68-year-old husband uprooted
  an established, land-holding Jura household — onto a passage in which roughly a quarter of
  the colonists died of typhus and scurvy — says the alternative at home had become worse: the
  1816 "Year Without a Summer" famine, post-Napoleonic poverty, and holdings subdivided among
  heirs until the shares would not feed a family. She left no elite behind and arrived as
  none.

  - **What the move actually converted [CONTEXTUAL / INFERRED].** The household exchanged a
  fragmenting Jura smallholding for a poor, stony Nova Friburgo lot (Casa 73 / Lote 86) plus a
  two-year subsidy designed to expire — the bottom-but-landed rung from which the whole
  Borer/Bohrer arc begins, and the structural mirror image of the family's Armond line, which
  began at an office-and-marriage elite and fell. There was no fortune here to lose.

  - **She is where Swiss partible division hands over to Brazilian partible division
  [CONTEXTUAL].** The mechanism that pushed her family out of the Jura — equal division of
  holdings among heirs until the shares were unviable — applied again to the colony lot under
  Brazilian succession, across her daughter's eleven or twelve children. Her life spans the
  handover, and the branch stays flat on the far side of it for a century.

  - **Education: hers is the generation that carried the asset, and the one after next lost it
  [CONTEXTUAL / INFERRED].** The Catholic Solothurn parishes gave their smallholders German
  parish-school literacy — an asset Imperial Brazil did not supply, where schooling was a
  purchased, class-linked privilege with no free rural alternative. Nothing documents her own
  letters, so the honest label is [CONTEXTUAL]. But two generations down, on her daughter's
  branch, it is gone: her great-grandson Valentim Martinho Bohrer had his daughter's 1891
  birth registered *a rogo*, "por não saber escrever" (CIV-0045). Imported literacy behaved
  like property in Brazil: retained on the branch that reached town trade, lost on the branch
  that stayed on fragmenting land.

  - **The arc, named [INFERRED].** Erschwil Borer daughter of a Borer × Borer marriage (1760)
  → married into a Grindel farming household at 21 (1782) → emigrated at about 59 with that
  whole household (1819) → widowed in the colony (1827) → died there in 1832, reportedly buried in her
  husband's lot [LEAD]. She never rose and never fell; she moved the floor from one continent to
  another, and everything the family did afterwards was built on it.

  ## Open questions

  - Her **Nova Friburgo death record** (Óbito L1 f.82) — reported read by the retrieval
  research, but NOT HELD here: no scan is in the repository and no source is catalogued, so its
  details (age 72, widowhood, lot nº 61, "outobro") remain [LEAD] and E-0067 stays
  strong-evidence on PUB-0003. Next action: obtain the image through the retrieval sync,
  catalogue it as a parish source and cite it on E-0067. [OPEN] [Corrected 2026-10-08:
  previously marked HELD and PROVEN.]

  - Her **parents' own parents** would come from the Erschwil registers (church book #68) and
  the Thierstein district *Inventar- und Teilungen* (FHC/affiliate-gated) — the same books
  that would resolve the FS tree's competing "Joannes × Elisabeth" pair. [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil Catholic baptism register, church book #68 — her 1760 baptism and her
  parents Joseph Borer × Anna Maria Borer; sources event E-0069).

  - PAR-0029 (Grindel Catholic marriage register, p.71 entry 4 — her 1782 marriage to Johann
  Jacob Wehrli, witnesses Heinricus Werly and Catharina Borer; sources event E-0065).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / Casa Suíça database) — emigration context, the
  "Elisa Borer" name form, and the 10 October 1832 death date (sources event E-0067,
  strong-evidence).

  Not held: NF-Catedral Óbito L1 f.82, her 1832 Nova Friburgo death act, reported by the
  retrieval research as reading 10 October 1832, "Ysabel Verly, viúva de Jacob Verly", age 72,
  of the Cantão de Soleure, buried "cemeterio do Nº 61". No scan is held and no source is
  catalogued, so it is a [LEAD], not a held source.

  ## Regional and migration context

  Born at Erschwil in the Catholic Solothurn Jura, she married into the neighbouring Wehrli
  family of Grindel and emigrated with them on the *Heureux Voyage* in 1819 under Dom João
  VI's Swiss-colony scheme, driven by the region's post-Napoleonic distress, the 1816 famine
  and chronic land hunger. [CONTEXTUAL] The colony was created by the *Decreto de 16 de maio
  de 1818* to settle 100 Swiss **Catholic** families on the Fazenda do Morro Queimado;
  recruitment overshot to some 261–265 families, roughly a quarter died at sea, and the lots
  proved poor, stony and undersized. She died at Nova Friburgo in 1832, thirteen years after
  landing.

  ## Where to go today

  - **Birth (17 June 1760):** Kath. Pfarrkirche St. Peter und Paul, 4228 Erschwil, Kt.
  Solothurn, Switzerland (GPS 47.3736, 7.5431) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3736,7.5431)

  - **Marriage (27 January 1782):** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt.
  Solothurn, Switzerland (GPS 47.3833, 7.5042) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Death and burial (10 October 1832; cemetery lot nº 61 [LEAD]):** Catedral Diocesana / Igreja
  Matriz de São João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo,
  RJ (GPS -22.28159, -42.53085) — the present cathedral, inaugurated 1869, postdates her 1832
  burial, which took place through the colony's earlier São João Batista church on the same
  site [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu batismo de 17 de junho de 1760, em Erschwil, nomeia os dois pais como
  **Borer** — Joseph Borer e Anna Maria Borer (PAR-0028, livro paroquial nº 68) — o caso mais
  profundo documentado de endogamia Borer × Borer nesta família.

  - **[strong-evidence — PUB-0003, evento E-0067]** Ela morreu em Nova Friburgo em **10 de
  outubro de 1832**, data dada pela compilação *Imigrantes de Nova Friburgo* / Casa Suíça. A
  pesquisa de recuperação relata ter lido seu ato de óbito de Nova Friburgo (Óbito L1 f.82) com
  a mesma data — "Ysabel Verly, viúva de Jacob Verly, natural do Cantão de Soleure, de idade de
  setenta e dois annos", sepultada no "cemeterio do Nº 61", o lote do marido, falecido em 1827,
  e com o mês grafado "outobro" [LEAD — o ato não está catalogado e nenhuma imagem está em mãos
  aqui]. O "10 de dezembro de 1832" que circula num blog genealógico conflita com PUB-0003 e
  com essa leitura relatada, e não é adotado. [Corrigido em 2026-10-08: o ato de óbito era
  descrito aqui como disponível e provado; não está catalogado nem em mãos.]

  - **[LEAD]** A idade relatada de 72 anos no óbito implicaria nascimento por volta de 1760,
  concordando com o batismo de Erschwil disponível (PAR-0028) — mas essa idade vem do ato de
  óbito não catalogado e não pode ser confirmada até que sua imagem esteja em mãos.

  - **[CONTEXTUAL]** Emigrou por volta dos 59 anos numa travessia que matou cerca de um quarto
  dos colonos, desenraizando um domicílio agrícola estabelecido do Jura em troca de um lote
  colonial pobre, e depois viveu treze anos em Nova Friburgo — tempo bastante para acompanhar
  todo o período fundacional da colônia, do primeiro assentamento à sua absorção na vida
  paroquial e municipal brasileira.

  - **[PROVEN]** Seu casamento de 1782 em Grindel foi testemunhado por **Heinricus Werli e
  Catharina Borer** — um Wehrli e uma Borer ao mesmo altar, trinta e oito anos antes de sua
  filha Anna Maria casar-se com um Borer em Nova Friburgo. A trança Borer–Wehrli já estava
  atada na Suíça.

  - **[CONTEXTUAL]** Batizada em Erschwil em 1760, mas descrita em 1782 como "ex
  Grindel[-Erschwyl]", ela havia percorrido os poucos quilômetros entre duas paróquias do
  mesmo pequeno mundo católico do Jura antes de casar — a geografia matrimonial corriqueira do
  Schwarzbubenland, onde as famílias se conheciam por sobre os limites das aldeias.

  ## Identidade

  **Elisabetha Borer** (também *Elisa Borer* no banco de dados da Casa Suíça; segundo o relato,
  lançada no óbito sob o nome de casada **"Ysabel Verly"** [LEAD — ato de óbito não
  catalogado]). A matriarca Wehrli e a Borer mais antiga que este
  ramo pode nomear a partir de um batismo primário disponível.

  - **Nascimento:** 17 de junho de 1760, em Erschwil (Erischwyg), Soleure (Solothurn), Suíça —
  [PROVEN] pelo livro de batismos católico de Erschwil (PAR-0028, livro paroquial nº 68;
  evento E-0069), cujo assento lê "die 17 Junii 1760 … Ecisabeth", variante de escrivão de
  Elisabetha.

  - **Pais:** Joseph Borer (P-0076) × Anna Maria Borer (P-0077), de Erschwil — [PROVEN]
  (PAR-0028; família F-0037). Ambos os pais tinham o sobrenome Borer. Uma árvore colaborativa
  do FamilySearch dá, em vez disso, seus pais como Joannes Borer × Elisabeth Borer; isso
  contradiz o batismo disponível, que prevalece — o par da árvore é pista de navegação, não
  adotado [LEAD/contradicted].

  - **Casamento:** casou-se com Johann Jacob Wehrli (P-0072) em 27 de janeiro de 1782, em
  Grindel — [PROVEN] (PAR-0029, p.71, assento 4; evento E-0065). O registro descreve o casal
  como "ambo ex Grindel[-Erschwyl]", de modo que ela provavelmente já residia em Grindel em
  1782, embora batizada em Erschwil em 1760.

  - **Emigração:** chegou a Nova Friburgo em 1819 a bordo do *Heureux Voyage* com o domicílio
  do marido, por volta dos 59 anos; o domicílio ocupou a Casa 73 / Lote 86.

  - **Óbito:** **10 de outubro de 1832**, Nova Friburgo — [strong-evidence] por PUB-0003
  (*Imigrantes de Nova Friburgo* / banco de dados da Casa Suíça; evento E-0067, status
  strong-evidence). A pesquisa de recuperação relata que o ato de óbito de Nova Friburgo (Óbito
  L1 f.82) a registra como "Ysabel Verly, viúva de Jacob Verly, natural do Cantão de Soleure, de
  idade de setenta e dois annos" perante o vigário Jacob Joye, sepultada no "cemeterio do Nº 61"
  — o lote de cemitério do marido, que a precedeu em 1827 (Óbito L1 f.65) — sem nomear os pais
  [LEAD — o ato não está catalogado como fonte e nenhuma imagem está em mãos neste repositório,
  de modo que nenhum desses detalhes está provado aqui]. A variante do blog Raibert, "10 de
  dezembro de 1832", conflita com PUB-0003 e não é adotada; o "outobro" relatado do ato a
  resolveria quando estiver em mãos. [Corrigido em 2026-10-08: antes rotulado PROVEN pelo ato de
  óbito, o que contradizia E-0067.]

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo, título ou alfabetização está documentada para ela. O
  que os dois atos em mãos registram é sua posição: filha Borer de Erschwil e esposa de um
  *agricultor* de Grindel; o ato de óbito não catalogado acrescentaria, segundo o relato, que
  era **viúva** ("viúva de Jacob Verly") sepultada no lote do marido [LEAD]. Sobreviveu a ele
  cerca de cinco anos na colônia (PUB-0003). A base
  material de seu domicílio foi o pacote de assentamento do *Decreto de 16 de maio de 1818*:
  um lote e uma casa construída, víveres, sementes e gado, e um subsídio diário de 0$160
  caindo a 0$080 ao longo de dois anos, cerca de 58$000 no primeiro ano contra os ~420$000 de
  um trabalhador rural livre. [CONTEXTUAL — baseado no papel]

  ## Família e rede social

  - **Um casamento Borer × Borer acima dela:** seus pais Joseph Borer e Anna Maria Borer
  tinham ambos o sobrenome Borer, e a mesma página do livro de 1760 traz um "Joseph Borer
  *gmüpl*" como padrinho e uma "Mari Elisabth Borr" como madrinha — página em que quase todo
  nome é um Borer. [PROVEN quanto aos pais e padrinhos; INFERRED quanto à endogamia]

  - **Marido:** Johann Jacob Wehrli (P-0072), casados em 1782; família F-0035. Ele morreu em
  Nova Friburgo em 1827 e ela em 1832 (PUB-0003); ambos teriam sido sepultados no lote de
  cemitério nº 61 [LEAD — pelos atos de óbito não catalogados].

  - **Filhos:** com Johann Jacob Wehrli, entre eles **Anna Maria Werhly** (P-0069), a
  matriarca imigrante do tronco Borer, e Salomea, que se casou no mesmo dia que a irmã, em
  1820. Ver F-0035 para os filhos colaterais.

  - **O sobrenome Borer entra nesta linha duas vezes pela geração dela** — uma como seu
  próprio nome de solteira e outra pelo genro Laurent Borer, de Grindel. Se os Borer de
  Erschwil e os de Grindel são uma só família é algo não documentado e deve permanecer em
  aberto. [LEAD]

  ## O que podemos extrapolar

  - **A raiz mais antiga, e duplamente Borer, do sobrenome nesta linha [INFERRED].** O
  casamento Borer × Borer de seus pais e o conjunto de padrinhos Borer em sua própria página
  de registro apontam para uma população Borer muito pequena e endogâmica em Erschwil por
  volta de 1760 — coerente com, mas não prova de, um único tronco Borer de Solothurn por trás
  da onipresença do sobrenome nesta árvore.

  - **Posição: herdada, pequena e transmitida como lugar, não como propriedade [CONTEXTUAL /
  INFERRED].** Nada em seu registro dá à família patente, cargo ou letras. Seu pai carrega um
  título local abreviado ("*fusemnistr*", possivelmente um *Feuersmeister* ou dever comunal
  semelhante, não decifrado), que é o tipo de função de aldeia não remunerada que confere
  posição e nenhuma renda — um análogo, em escala de paróquia, dos cargos honorários que se
  repetem, sem pagar nada, por toda a linha Armond desta família. Ela casou-se lateralmente,
  num domicílio de *agricultor* de Grindel, do mesmo degrau.

  - **Sua emigração aos 59 mede a pressão com exatidão [CONTEXTUAL / INFERRED].** Pessoas
  dessa idade não cruzam um oceano em caráter especulativo. Que ela e o marido de 68 anos
  tenham desenraizado um domicílio do Jura estabelecido e com terra — numa travessia em que
  cerca de um quarto dos colonos morreu de tifo e escorbuto — diz que a alternativa em casa
  havia piorado: a fome do "Ano Sem Verão" de 1816, a pobreza pós-napoleônica e posses
  subdivididas entre herdeiros até os quinhões não alimentarem uma família. Não deixou elite
  para trás e não chegou como nenhuma.

  - **O que a mudança de fato converteu [CONTEXTUAL / INFERRED].** O domicílio trocou um
  minifúndio do Jura em fragmentação por um lote pobre e pedregoso em Nova Friburgo (Casa 73 /
  Lote 86), somado a um subsídio de dois anos concebido para expirar — o degrau
  no-fundo-mas-com-terra de onde parte todo o arco Borer/Bohrer, e a imagem espelhada
  estrutural da linha Armond da família, que partiu de uma elite de cargo e casamento e caiu.
  Não havia aqui fortuna a perder.

  - **Ela é o ponto em que a divisão partível suíça passa o bastão à brasileira
  [CONTEXTUAL].** O mecanismo que empurrou sua família para fora do Jura — divisão igual das
  posses entre herdeiros até os quinhões serem inviáveis — aplicou-se outra vez ao lote
  colonial, sob a sucessão brasileira, através dos onze ou doze filhos de sua filha. Sua vida
  abarca essa passagem, e o ramo permanece plano do outro lado dela por um século.

  - **Educação: a dela é a geração que carregou o ativo, e a segunda seguinte o perdeu
  [CONTEXTUAL / INFERRED].** As paróquias católicas de Solothurn davam a seus pequenos
  lavradores alfabetização de escola paroquial em alemão — ativo que o Brasil imperial não
  fornecia, onde a escolarização era privilégio comprado e ligado à classe, sem alternativa
  rural gratuita. Nada documenta as letras dela própria, de modo que o rótulo honesto é
  [CONTEXTUAL]. Mas duas gerações abaixo, no ramo de sua filha, elas se foram: seu bisneto
  Valentim Martinho Bohrer registrou o nascimento da filha, em 1891, *a rogo*, "por não saber
  escrever" (CIV-0045). A alfabetização importada comportou-se como propriedade no Brasil:
  mantida no ramo que alcançou o comércio urbano, perdida no ramo que permaneceu em terra que
  se fragmentava.

  - **O arco, nomeado [INFERRED].** Filha Borer de Erschwil, de um casamento Borer × Borer
  (1760) → casada aos 21 num domicílio agrícola de Grindel (1782) → emigrada por volta dos 59
  com esse domicílio inteiro (1819) → viúva na colônia (1827) → morta ali em 1832, segundo o
  relato sepultada no lote do marido [LEAD]. Nunca subiu e nunca caiu; mudou o piso de um continente para outro, e
  tudo o que a família fez depois foi construído sobre ele.

