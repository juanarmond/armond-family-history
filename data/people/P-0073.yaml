  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (livro de batismos católico de Erschwil, livro paroquial nº 68 — seu batismo de
  1760 e seus pais Joseph Borer × Anna Maria Borer; fundamenta o evento E-0069).

  - PAR-0029 (livro de casamentos católico de Grindel, p.71, assento 4 — seu casamento de 1782
  com Johann Jacob Wehrli, testemunhas Heinricus Werly e Catharina Borer; fundamenta o evento
  E-0065).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / banco de dados da Casa Suíça) — contexto de
  emigração, a forma do nome "Elisa Borer" e a data de óbito de 10 de outubro de 1832
  (fundamenta o evento E-0067, strong-evidence).

  Não em mãos: NF-Catedral Óbito L1 f.82, seu ato de óbito de 1832 em Nova Friburgo, relatado
  pela pesquisa de recuperação como lendo 10 de outubro de 1832, "Ysabel Verly, viúva de Jacob
  Verly", 72 anos, do Cantão de Soleure, sepultada no "cemeterio do Nº 61". Nenhuma imagem está
  em mãos e nenhuma fonte está catalogada, de modo que é [LEAD], não fonte disponível.

  ## Contexto regional e migratório

  Nascida em Erschwil, no Jura católico de Solothurn, casou-se com a vizinha família Wehrli de
  Grindel e emigrou com eles no *Heureux Voyage*, em 1819, sob o esquema de colônia suíça de
  Dom João VI, impelida pela penúria pós-napoleônica da região, pela fome de 1816 e pela fome
  crônica de terra. [CONTEXTUAL] A colônia foi criada pelo *Decreto de 16 de maio de 1818*
  para assentar 100 famílias suíças **católicas** na Fazenda do Morro Queimado; o recrutamento
  excedeu para cerca de 261–265 famílias, aproximadamente um quarto morreu no mar, e os lotes
  se revelaram pobres, pedregosos e subdimensionados. Ela morreu em Nova Friburgo em 1832,
  treze anos após o desembarque.

