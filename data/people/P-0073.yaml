notes:
- text: >-
    Wife of Johann Jacob Wehrli (P-0072). Born 17 June 1760, Erschwil (Erischwyg),
    Soleure (Solothurn), Switzerland — PRIMARY evidence: Erschwil Catholic parish
    baptism register (PAR-0028, church book #68): "die 17 Junii 1760, Ecisabeth,
    parents Joseph Borer fusemnistr × anna Maria Borer." Parents confirmed as
    Joseph Borer (P-0076) × Anna Maria Borer (P-0077). She died at Nova Friburgo
    on 10 October 1832 (PUB-0003, E-0067).
- text: >-
    Her surname 'Borer' may indicate kinship with the Borer immigrant families
    (BORER I Jacob Borer and BORER II Laurent Borer), but this is not confirmed by
    primary evidence — the Borer surname was common in the Grindel/Soleure area.
    Her father Joseph Borer is distinct from the immigrant Jacob Borer (P-0050,
    BORER I, b. 1801) and from Laurent Borer (P-0068, BORER II, b. 1797).
- text: >-
    Named 'Elisa Borer' in the Casa Suíça DB narrative and 'Elisabetha Borer' in
    the Grindel marriage register (PAR-0029). The Grindel marriage register entry
    describes both parties as "ambo ex Grindel, Erischwyg" — she may have been
    resident in Grindel by 1782 despite being baptised in Erschwil in 1760.
