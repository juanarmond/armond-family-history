profile: >-
  ## Interesting facts

  - **[PROVEN]** He is known from exactly one clause in one document — his son Joaquim
  José's 1783 Barbacena marriage act (PAR-0018), which names him "Gaspar Fer[reira]" and
  places the family at Villa Rica only through the son's birthplace ("n.al e batiz.do na freg.a de
  Villa Rica"; corrected 2026-10-08 from "seats the family"). No record of his own has been located in Brazil.

  - **[CONTEXTUAL]** Villa Rica (today Ouro Preto) was the capital of colonial Minas
  Gerais and the heart of gold production. By 1783, when his son married, the peak of
  around 1750 was long past and the mining economy was in decline; the family's shift
  toward Barbacena is the classic Minas trajectory off exhausted gold districts toward
  agricultural highland land.

  - **[INFERRED]** The "de Toledo" surname came through his wife Gertrudes, not through
  him — he is "Ferreira" alone. It is their son who became "Ferreira de Toledo", fusing
  both. The Toledo patriline label is therefore, at its apex, a maternal inheritance.

  - **[PROVEN — bounded negative]** SILB, the Sesmarias do Império Luso-Brasileiro
  database, returns no Toledo or Ferreira sesmeiro in Minas Gerais, and his son's Fazenda
  Cascalhaes title is likewise absent. If this family ever held a colonial land grant, it
  is not in the published record.

  - **[REJECTED 2026-10-10]** A proposed Azorean origin did not survive. He was once
  identified with Gaspar de Souto Maior of São Sebastião, Ilha Terceira, a son of Belchior da
  Ponte Cardoso × Mariana Fagundes (Mendes Forjaz, PUB-0005, Vol. IX, p.261). That man's own
  records are now held: baptised 23 December 1657 (PAR-0099), he died at São Sebastião on 2
  December 1727 aged about seventy (PAR-0100) — decades before this Gaspar's son was born at
  Villa Rica. They were two men; the Terceira man is P-0131. See below.

  ## Identity

  **Gaspar Ferreira** [PROVEN name via PAR-0018] — recovered only as the father of Joaquim
  José Ferreira de Toledo (P-0057), named in his son's 1783 Barbacena marriage act: "filho
  legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo], de [Villa] Rica" [misread — corrected 2026-10-08: the act gives the groom as "n.al e batiz.do na freg.a de Villa Rica", his birthplace, not the parents' residence]. He sits
  at the recovered apex of the documented Toledo patriline, six generations above the
  present day and three above Eliza Balbina de Toledo (P-0017). His wife was Gertrudes
  Maria de Toledo (P-0093, family F-0045).

  - **Residence / nationality:** the record gives no residence for him; it records his son
  as born and baptised in the parish of Villa Rica (Ouro Preto), Comarca de Vila Rica,
  Minas Gerais ("n.al e batiz.do na freg.a de Villa Rica"), which places Gaspar there
  around that birth by inference and is the basis for the Brazilian nationality assigned
  here; no explicit *nacionalidade* or birthplace of his own is stated. [INFERRED from the
  son's birthplace; Corrected 2026-10-08 — earlier read as the record seating the family
  at Villa Rica]

  - **Birth / death / own parents:** unknown from any held Brazilian record — no baptism,
  marriage or death record of his own is held. He would have been born in the first third
  of the 18th century to have a son marrying in 1783. His parents are unknown: the former
  modelling of him as a son of Belchior da Ponte Cardoso × Mariana Fagundes (F-0062) was
  rejected on 10 October 2026. [OPEN; birth window INFERRED, soft]

  - **The Azorean identification — REJECTED 2026-10-10, kept here as history.** This
  person was tentatively identified with "Gaspar de Souto-Maior" of Mendes Forjaz Vol. IX
  (PUB-0005), a son of Belchior da Ponte Cardoso × Mariana Fagundes (family F-0062), and the
  tree modelled that son-ship and the Terceira baptism (event E-0135) on him. The reading
  required that he had emigrated from Terceira to Villa Rica and used the name "Gaspar
  Ferreira" in place of "Gaspar de Souto-Maior". It was weak on the compiled entry itself: a
  man baptised in 1657 and given a 1727 death date could not father a son who married in
  1783, and the same entry has him marrying twice — D. Margarida Machado at the Convento da
  Graça, Angra, in 1690, and Maria Mendes de Borba at São Sebastião in 1694 — with three
  children baptised at São Sebastião in 1698–1701. The primary records now held end it: the
  Terceira Gaspar's own baptism, 23 December 1657 (PAR-0099; Vol. IX misprints 23.2.1657),
  and his death act, São Sebastião, 2 December 1727, "de idade de setenta annos", "casado com
  Maria Mendes" (PAR-0100). He lived and died on Terceira, decades before Joaquim José was
  born (c.1750–65). On 10 October 2026 the owner rejected the identification; the Terceira
  man is now a separate person, P-0131, and the F-0062 parent link for this Gaspar is
  rejected. The retrieval research's own synthesis had never made the identification: it
  keeps this Gaspar on the Toledo line. [REJECTED — two men]

  - **[LEAD] The Terceira Gaspar's own claimed Brazilian line — not this man's.** Lacerda's
  doctoral thesis on the Barbacena Ferreira Armonde (PUB-0002, ff. 55–56), following a
  private 2008 typescript by Paulo Ribeiro Luz, makes Gaspar de Souto Maior (P-0131) — the
  son of Belchior da Ponte Cardoso × Mariana Fagundes — the father of the Barbacena patriarch
  Francisco Ferreira Armonde (d. 1751) by Margarida das Candeyas Machado, a name that fits
  Vol. IX's first wife of 1690, D. Margarida Machado. Before the death act settled it, that
  tradition was one of the strands that pointed to "two men". It belongs to P-0131 and the
  Barbacena family, not to this Gaspar, and it is not proof: only the parents' names come
  from the patriarch's 1751 will as the thesis quotes it; the grandparents rest on the
  typescript and a mailing-list post, and the thesis's own dates conflict (an age of 50 in
  1747 against a mother who died in April 1693).

  ## Standing and profession

  - **Nothing is documented for him** in any held Brazilian source: no occupation, no
  rank, no property, no office. This is the honest position and should not be filled in
  from his son.

  - **Literacy [UNCLASSIFIABLE].** No signable record of his is held.

  ## Family and social network

  - Wife: Gertrudes Maria de Toledo (P-0093), family F-0045 — the apparent source of the
  family's "de Toledo" element.

  - Son (the direct line): Capitão Joaquim José Ferreira de Toledo (P-0057), who married
  Ritta Angélica Rodrigues at Barbacena in 1783 and fathered the thirteen-child Barbacena
  Toledo generation. No other children of Gaspar × Gertrudes are known. [PROVEN the son;
  siblings OPEN]

  - **Not a son of Belchior da Ponte Cardoso × Mariana Fagundes [corrected 2026-10-10].**
  Until 10 October 2026 the repository placed him as a child of P-0123 × P-0124 in family
  F-0062, on compiled evidence only, while the same family also carried a "Gaspar de
  Souto-Maior" among its documented children, described there as distinct from P-0092. That
  double reading is resolved: the parent link is marked rejected, and the Terceira Gaspar is
  modelled as P-0131. This Gaspar's own parents are unknown.

  ## What we can extrapolate

  - **The rise this family is known for appears AT his son, not above him** [INFERRED —
  the key discipline point]. It is tempting to read Joaquim José's militia captaincy and
  Fazenda Cascalhaes backwards and conclude that Gaspar was already a propertied man of
  Villa Rica. Nothing supports that. A captaincy in the Companhias de Ordenanças was a
  locally conferred, unpaid status marker earned by service and standing in a
  neighbourhood, not an inherited title; a man could acquire one without a propertied
  father. On the held evidence the Toledo line's documented ascent is one generation deep,
  and it begins with the son. What Gaspar demonstrably transmitted is a surname.

  - **A surname is the one thing here that transmitted intact** [INFERRED]. Land was
  divided, enslaved property was abolished, offices ended with their holders — but
  "Ferreira", carried from him, and "de Toledo", carried from his wife, fused into a
  compound name that four further generations bore through Barbacena, São João del Rei and
  the Zona da Mata, and that still labels a whole branch of this tree. In a family whose
  every material asset proved perishable, the most durable inheritance was onomastic.

  - **Where he stood in the colonial economy is a matter of position, not of record**
  [CONTEXTUAL]. Villa Rica in the mid-18th century was the administrative and fiscal
  centre of the richest colonial district in the Portuguese empire, and also the place
  where that wealth was visibly ending: placer gold peaked around 1750, and thereafter
  families of the comarca dispersed toward agriculture. His household is recorded there at
  the point of decline, and his son is recorded settled on Barbacena farmland by 1783.
  Whether that was a fall, a hedge or an opportunity taken, no record says.

  - **Nothing about his origin can be read from his name** [INFERRED — a caution].
  "Ferreira" is among the most common surnames in Portugal and Brazil and carries no
  regional, ethnic or class information. The compiled Azorean hypothesis rests on a
  published genealogy that is internally inconsistent with his Brazilian dates, not on
  anything in the Brazilian record; the Brazilian record says only that the family was at
  Villa Rica. No origin may be inferred here from a surname. [Corrected 2026-10-10: that
  Azorean hypothesis is now rejected — the compiled man proved to have lived and died on
  Terceira (PAR-0099, PAR-0100). His origin is simply unknown; the rejection does not rule
  out a birth anywhere, the Azores included.]

  - **The gap above him is a single, identifiable document** [INFERRED]. His son's Villa
  Rica baptism, of about 1750–1762, would name Gaspar's and Gertrudes's own parents and
  settle both the surname read and the question of where he came from in one stroke. Every online index
  is exhausted; the record, if it survives, is in the Arquivo Eclesiástico da Arquidiocese
  de Mariana. This is an unusually well-defined research target: one parish, one decade,
  one act.

  ## Open questions

  - His own baptism, marriage, death and parents — the generation above the Toledo apex.
  Online indexes are exhausted (bounded-negative across FamilySearch full-text OCR,
  FamilySearch personas, the Nilza/COARPE inventário index and the LAMPEH Mariana
  catalogue). The decisive off-tool record is his son's Villa Rica baptism (~1750–1762),
  held by the Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), which would name all
  four grandparents. [OPEN]

  - The "two Gaspars" question — RESOLVED 2026-10-10: two men. For P-0092 (Villa Rica, a
  son marrying in 1783) to be the Terceira "Gaspar de Souto-Maior" of PUB-0005, the compiled
  dates would have had to be wrong. They are not: his own baptism (23 December 1657,
  PAR-0099) and death act (São Sebastião, 2 December 1727, aged about seventy, PAR-0100) are
  now held, and he lived and died on Terceira. The owner rejected the identification; the
  Terceira man is P-0131, whose family the archive keeps as the Terceira Armond trunk — a
  family tradition that touches the owner only through Simplício José Ferreira Armond
  (P-0016), never through this Gaspar. [RESOLVED — identification rejected]

  - The former inconsistency in the data graph, where family F-0062 held P-0092 as a
  structured child *and* a separate "Gaspar de Souto-Maior" among its documented_children.
  [RESOLVED 2026-10-10: the F-0062 parent link for P-0092 is rejected and the Terceira
  Gaspar is P-0131.]

  - Any colonial land grant in his name — SILB returns no Toledo or Ferreira sesmeiro in
  Minas Gerais; if the family held a sesmaria it would be in the Registro de Sesmarias de
  Minas Gerais / Arquivo Público Mineiro. [OPEN — bounded negative]

  - Any other children of Gaspar × Gertrudes — the same Villa Rica registers. [OPEN]

  ## Sources held (this repository)

  - PAR-0018 (his son Joaquim José's 1783 Barbacena marriage — the sole record naming him,
  giving his name and his wife's name, and recording the son as born and baptised in the
  parish of Villa Rica) · PUB-0005
  (Genealogias da Ilha Terceira, Vol. IX, SOUTO-MAIOR § 1º — the source of the Azorean
  identification, rejected 2026-10-10; its Gaspar is P-0131, not this man) · PUB-0002
  (Lacerda 2010, ff. 55–56 — the Barbacena-patriarch genealogy above, which concerns P-0131;
  a lead only).

  ## Regional and migration context

  Placed at Villa Rica (Ouro Preto), Comarca de Vila Rica, Capitania de Minas Gerais, by
  inference from his son's recorded birth and baptism there [INFERRED] — the administrative
  and mining heart of 18th-century Minas. No move is documented for
  him personally. The family's Villa Rica → Barbacena movement appears in his son's
  generation and is the local expression of the gold-to-agriculture shift that followed
  the exhaustion of the placers after about 1760, when families of the mining district
  relocated to the farming Campo das Vertentes. He is the origin end of that movement, not
  its author. [CONTEXTUAL]

  ## Where to go today

  - **His son's birth and baptism parish (Villa Rica):** Basílica de N.S. do Pilar / Igreja de N.S. da
  Conceição de Antônio Dias, Ouro Preto, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Monsenhor%20Castilho%20Barbosa%2017%2C%20Ouro%20Preto%2C%20MG)

  - **The record that would name his parents (his son's ~1750s–60s Villa Rica baptism):**
  Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), Mariana, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Sao%20Pedro%20dos%20Clerigos%2C%20Mariana%2C%20MG)

  - **Colonial Ouro Preto probate, if any:** Arquivo Público Mineiro (APM), Belo
  Horizonte, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=-19.928377,-43.937097)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É conhecido por exatamente uma cláusula em um documento — o assento de
  casamento de 1783, em Barbacena, de seu filho Joaquim José (PAR-0018), que o nomeia
  "Gaspar Fer[reira]" e situa a família em Villa Rica apenas pelo local de nascimento do filho
  ("n.al e batiz.do na freg.a de Villa Rica"; corrigido em 2026-10-08). Nenhum registro próprio foi
  localizado no Brasil.

  - **[CONTEXTUAL]** Villa Rica (hoje Ouro Preto) era a capital de Minas Gerais colonial e
  o coração da produção aurífera. Em 1783, quando seu filho se casou, o auge de cerca de
  1750 havia muito passara e a economia mineradora estava em declínio; o deslocamento da
  família rumo a Barbacena é a trajetória mineira clássica, dos distritos auríferos
  esgotados para terra agrícola de planalto.

  - **[INFERRED]** O sobrenome "de Toledo" veio por sua esposa Gertrudes, não por ele —
  ele é apenas "Ferreira". É o filho que se torna "Ferreira de Toledo", fundindo os dois.
  O rótulo de patrilinha Toledo é, portanto, em seu ápice, uma herança materna.

  - **[PROVEN — negativa delimitada]** O SILB, base das Sesmarias do Império
  Luso-Brasileiro, não retorna nenhum sesmeiro Toledo ou Ferreira em Minas Gerais, e o
  título da Fazenda Cascalhaes de seu filho também está ausente. Se esta família alguma
  vez deteve concessão de terras colonial, ela não está no registro publicado.

  - **[REJEITADA em 2026-10-10]** Uma origem açoriana proposta não se sustentou. Ele chegou
  a ser identificado com Gaspar de Souto Maior, de São Sebastião, Ilha Terceira, filho de
  Belchior da Ponte Cardoso × Mariana Fagundes (Mendes Forjaz, PUB-0005, Vol. IX, p.261). Os
  registros próprios desse homem estão agora disponíveis: batizado a 23 de dezembro de 1657
  (PAR-0099), faleceu em São Sebastião a 2 de dezembro de 1727, com cerca de setenta anos
  (PAR-0100) — décadas antes de o filho deste Gaspar nascer em Villa Rica. Eram dois homens;
  o da Terceira é P-0131. Ver abaixo.

  ## Identidade

  **Gaspar Ferreira** [PROVEN o nome, via PAR-0018] — recuperado apenas como pai de
  Joaquim José Ferreira de Toledo (P-0057), nomeado no assento de casamento de 1783 do
  filho, em Barbacena: "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de
  Toledo], de [Villa] Rica" [leitura errada — corrigido em 2026-10-08: o ato dá o noivo como "n.al e batiz.do na freg.a de Villa Rica", local de nascimento dele, não residência dos pais]. Está no ápice recuperado da patrilinha Toledo documentada,
  seis gerações acima do presente e três acima de Eliza Balbina de Toledo (P-0017). Sua
  esposa era Gertrudes Maria de Toledo (P-0093, família F-0045).

  - **Residência / nacionalidade:** o registro não lhe dá residência; registra o filho como
  nascido e batizado na freguesia de Villa Rica (Ouro Preto), Comarca de Vila Rica, Minas
  Gerais ("n.al e batiz.do na freg.a de Villa Rica"), o que situa Gaspar ali por volta
  desse nascimento, por inferência, e é a base da nacionalidade brasileira aqui
  atribuída; nenhuma *nacionalidade* ou local de nascimento próprio é declarado.
  [INFERRED a partir do local de nascimento do filho; Corrigido em 2026-10-08 — antes lido
  como se o registro situasse a família em Villa Rica]

  - **Nascimento / óbito / pais próprios:** desconhecidos em qualquer registro brasileiro
  disponível — nenhum batismo, casamento ou óbito próprio está disponível. Teria nascido
  no primeiro terço do século XVIII para ter um filho casando em 1783. Os pais são
  desconhecidos: a antiga modelação dele como filho de Belchior da Ponte Cardoso × Mariana
  Fagundes (F-0062) foi rejeitada em 10 de outubro de 2026. [OPEN; janela de nascimento
  INFERRED, aproximada]

  - **A identificação açoriana — REJEITADA em 2026-10-10, mantida aqui como histórico.**
  Esta pessoa foi identificada tentativamente com o "Gaspar de Souto-Maior" de Mendes
  Forjaz, Vol. IX (PUB-0005), filho de Belchior da Ponte Cardoso × Mariana Fagundes (família
  F-0062), e a árvore modelou nele essa filiação e o batismo terceirense (evento E-0135). A
  leitura exigia que ele tivesse emigrado da Terceira para Villa Rica e usado o nome "Gaspar
  Ferreira" em lugar de "Gaspar de Souto-Maior". Era fraca na própria entrada compilada: um
  homem batizado em 1657 e com óbito dado em 1727 não poderia gerar um filho que se casasse
  em 1783, e a mesma entrada o faz casar duas vezes — com D. Margarida Machado no Convento
  da Graça, em Angra, em 1690, e com Maria Mendes de Borba em São Sebastião em 1694 — com
  três filhos batizados em São Sebastião em 1698–1701. Os registros primários agora
  disponíveis encerram a questão: o próprio batismo do Gaspar terceirense, de 23 de dezembro
  de 1657 (PAR-0099; o Vol. IX imprime por engano 23.2.1657), e o seu assento de óbito, São
  Sebastião, 2 de dezembro de 1727, "de idade de setenta annos", "casado com Maria Mendes"
  (PAR-0100). Viveu e morreu na Terceira, décadas antes do nascimento de Joaquim José
  (c.1750–65). Em 10 de outubro de 2026 o proprietário rejeitou a identificação; o homem da
  Terceira é agora uma pessoa distinta, P-0131, e o vínculo de filiação F-0062 deste Gaspar
  foi rejeitado. A síntese da própria pesquisa de recuperação nunca fizera a identificação:
  mantém este Gaspar na linha Toledo. [REJEITADA — dois homens]

  - **[LEAD] A linha brasileira atribuída ao Gaspar terceirense — não a este homem.** A tese
  de doutorado de Lacerda sobre os Ferreira Armonde de Barbacena (PUB-0002, f. 55–56),
  seguindo um material genealógico digitado e particular de 2008, de Paulo Ribeiro Luz, faz
  de Gaspar de Souto Maior (P-0131) — o filho de Belchior da Ponte Cardoso × Mariana Fagundes
  — o pai do patriarca de Barbacena, Francisco Ferreira Armonde (f. 1751), com Margarida das
  Candeyas Machado, nome que condiz com a primeira mulher de 1690 dada pelo Vol. IX, D.
  Margarida Machado. Antes de o assento de óbito decidir a questão, essa tradição foi um dos
  fios que apontavam para "dois homens". Pertence a P-0131 e à família de Barbacena, não a
  este Gaspar, e não é prova: só os nomes dos pais vêm do testamento de 1751 do patriarca,
  tal como a tese o cita; os avós assentam no material digitado e numa mensagem de lista de
  discussão, e as datas da própria tese conflitam (50 anos de idade em 1747 contra uma mãe
  falecida em abril de 1693).

  ## Posição social e profissão

  - **Nada está documentado sobre ele** em qualquer fonte brasileira disponível: nenhuma
  ocupação, posto, propriedade ou cargo. Essa é a posição honesta, e não deve ser
  preenchida a partir do filho.

  - **Letramento [UNCLASSIFIABLE].** Nenhum registro assinável dele está disponível.

  ## Família e rede social

  - Esposa: Gertrudes Maria de Toledo (P-0093), família F-0045 — a aparente fonte do
  elemento "de Toledo" da família.

  - Filho (a linha direta): Capitão Joaquim José Ferreira de Toledo (P-0057), que se casou
  com Ritta Angélica Rodrigues em Barbacena em 1783 e foi pai da geração Toledo de treze
  filhos de Barbacena. Não se conhecem outros filhos de Gaspar × Gertrudes. [PROVEN o
  filho; irmãos OPEN]

  - **Não é filho de Belchior da Ponte Cardoso × Mariana Fagundes [corrigido em
  2026-10-10].** Até 10 de outubro de 2026 o repositório o colocava como filho de P-0123 ×
  P-0124 na família F-0062, apenas com base em evidência compilada, enquanto a mesma família
  carregava também um "Gaspar de Souto-Maior" entre seus filhos documentados, ali descrito
  como distinto de P-0092. Essa dupla leitura está resolvida: o vínculo de filiação está
  marcado como rejeitado, e o Gaspar terceirense é modelado como P-0131. Os pais deste
  Gaspar são desconhecidos.

  ## O que podemos extrapolar

  - **A ascensão pela qual esta família é conhecida aparece NO filho, não acima dele**
  [INFERRED — o ponto disciplinar central]. É tentador ler a capitania de milícia e a
  Fazenda Cascalhaes de Joaquim José de trás para frente e concluir que Gaspar já era
  homem proprietário de Villa Rica. Nada sustenta isso. Uma capitania nas Companhias de
  Ordenanças era marcador de status conferido localmente, não remunerado, conquistado por
  serviço e posição numa vizinhança, e não título hereditário; um homem podia obtê-la sem
  pai proprietário. Na evidência disponível, a ascensão documentada da linha Toledo tem
  uma geração de profundidade e começa no filho. O que Gaspar comprovadamente transmitiu
  foi um sobrenome.

  - **Um sobrenome é a única coisa aqui que se transmitiu intacta** [INFERRED]. A terra
  foi dividida, a propriedade escravista foi abolida, os cargos terminaram com seus
  titulares — mas "Ferreira", vindo dele, e "de Toledo", vindo de sua esposa, fundiram-se
  num nome composto que outras quatro gerações carregaram por Barbacena, São João del Rei
  e a Zona da Mata, e que ainda rotula um ramo inteiro desta árvore. Numa família cujos
  bens materiais se mostraram todos perecíveis, a herança mais durável foi onomástica.

  - **Onde ele estava na economia colonial é questão de posição, não de registro**
  [CONTEXTUAL]. Villa Rica em meados do século XVIII era o centro administrativo e fiscal
  do distrito colonial mais rico do império português, e também o lugar onde essa riqueza
  visivelmente terminava: o ouro de aluvião teve seu auge por volta de 1750 e, depois
  disso, as famílias da comarca dispersaram-se rumo à agricultura. Sua casa está ali
  registrada no ponto do declínio, e seu filho está registrado estabelecido em terra
  agrícola de Barbacena em 1783. Se foi queda, proteção ou oportunidade aproveitada,
  nenhum registro diz.

  - **Nada sobre sua origem pode ser lido em seu nome** [INFERRED — uma cautela].
  "Ferreira" está entre os sobrenomes mais comuns de Portugal e do Brasil e não carrega
  informação regional, étnica ou de classe. A hipótese açoriana compilada repousa numa
  genealogia publicada que é internamente inconsistente com suas datas brasileiras, não em
  algo do registro brasileiro; o registro brasileiro diz apenas que a família estava em
  Villa Rica. Nenhuma origem pode ser inferida aqui a partir de um sobrenome. [Corrigido em
  2026-10-10: essa hipótese açoriana está agora rejeitada — o homem compilado viveu e morreu
  na Terceira (PAR-0099, PAR-0100). A origem dele é simplesmente desconhecida; a rejeição não
  exclui um nascimento em parte alguma, Açores incluídos.]

  - **A lacuna acima dele é um único documento identificável** [INFERRED]. O batismo de
  seu filho em Villa Rica, de cerca de 1750–1762, nomearia os próprios pais de Gaspar e de
  Gertrudes e resolveria de uma só vez tanto a leitura do sobrenome quanto a questão de
  onde ele veio. Todos os índices on-line estão esgotados; o registro, se sobreviveu, está no
  Arquivo Eclesiástico da Arquidiocese de Mariana. É um alvo de pesquisa incomumente bem
  definido: uma freguesia, uma década, um assento.

  ## Questões em aberto

  - Seu próprio batismo, casamento, óbito e pais — a geração acima do ápice Toledo. Os
  índices on-line estão esgotados (negativa delimitada em OCR de texto integral do
  FamilySearch, personas do FamilySearch, índice de inventários Nilza/COARPE e catálogo
  LAMPEH de Mariana). O registro decisivo, fora das ferramentas, é o batismo de seu filho
  em Villa Rica (~1750–1762), sob guarda do Arquivo Eclesiástico da Arquidiocese de
  Mariana (AEAM), que nomearia os quatro avós. [OPEN]

  - A questão dos "dois Gaspares" — RESOLVIDA em 2026-10-10: dois homens. Para que P-0092
  (Villa Rica, com um filho casando em 1783) fosse o "Gaspar de Souto-Maior" terceirense de
  PUB-0005, as datas compiladas teriam de estar erradas. Não estão: o próprio batismo dele
  (23 de dezembro de 1657, PAR-0099) e o assento de óbito (São Sebastião, 2 de dezembro de
  1727, com cerca de setenta anos, PAR-0100) estão agora disponíveis, e ele viveu e morreu na
  Terceira. O proprietário rejeitou a identificação; o homem da Terceira é P-0131, cuja
  família o arquivo guarda como o tronco Armond terceirense — uma tradição familiar que só
  toca o proprietário por Simplício José Ferreira Armond (P-0016), nunca por este Gaspar.
  [RESOLVIDA — identificação rejeitada]

  - A antiga inconsistência no grafo de dados, em que a família F-0062 mantinha P-0092 como
  filho estruturado *e* um "Gaspar de Souto-Maior" separado entre seus
  documented_children. [RESOLVIDA em 2026-10-10: o vínculo de filiação F-0062 de P-0092 foi
  rejeitado e o Gaspar terceirense é P-0131.]

  - Qualquer concessão de terras colonial em seu nome — o SILB não retorna sesmeiro Toledo
  ou Ferreira em Minas Gerais; se a família deteve sesmaria, estaria no Registro de
  Sesmarias de Minas Gerais / Arquivo Público Mineiro. [OPEN — negativa delimitada]

  - Quaisquer outros filhos de Gaspar × Gertrudes — os mesmos registros de Villa Rica.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0018 (casamento de 1783, em Barbacena, de seu filho Joaquim José — o único
  registro que o nomeia, dando seu nome e o da esposa, e registrando o filho como nascido
  e batizado na freguesia de Villa Rica) ·
  PUB-0005 (Genealogias da Ilha Terceira, Vol. IX, SOUTO-MAIOR § 1º — a fonte da
  identificação açoriana, rejeitada em 2026-10-10; o seu Gaspar é P-0131, não este homem) ·
  PUB-0002 (Lacerda 2010, f. 55–56 — a genealogia do patriarca de Barbacena acima, que diz
  respeito a P-0131; apenas pista).

  ## Contexto regional e migratório

  Situado em Villa Rica (Ouro Preto), Comarca de Vila Rica, Capitania de Minas Gerais, por
  inferência a partir do nascimento e batismo do filho ali registrados [INFERRED] — o
  coração administrativo e minerador das Minas setecentistas. Nenhum
  deslocamento está documentado para ele pessoalmente. O movimento Villa Rica → Barbacena
  da família aparece na geração de seu filho e é a expressão local do giro do ouro para a
  lavoura que se seguiu ao esgotamento das lavras depois de cerca de 1760, quando as
  famílias do distrito minerador se deslocaram para o Campo das Vertentes agrícola. Ele é
  a ponta de origem desse movimento, não seu autor. [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de nascimento e batismo do filho (Villa Rica):** Basílica de N.S. do Pilar / Igreja de N.S. da
  Conceição de Antônio Dias, Ouro Preto, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Monsenhor%20Castilho%20Barbosa%2017%2C%20Ouro%20Preto%2C%20MG)

  - **O registro que nomearia seus pais (o batismo de seu filho em Villa Rica,
  ~1750–60):** Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), Mariana, MG
  [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Sao%20Pedro%20dos%20Clerigos%2C%20Mariana%2C%20MG)

  - **Inventário colonial de Ouro Preto, se houver:** Arquivo Público Mineiro (APM), Belo
  Horizonte, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=-19.928377,-43.937097)
