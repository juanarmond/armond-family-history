- text: >-
    2026-10-09 — [LEAD] Lacerda's thesis (PUB-0002, ff. 55–56), following a private typescript
    ("LUZ, Paulo Ribeiro, Material genealógico sobre a família Ferreira Armonde, digitado,
    2008") and a RootsWeb AZORES mailing-list post, makes the Barbacena patriarch Francisco
    Ferreira Armonde (d. 1751) the son of Gaspar de Souto Maior and Margarida das Candeyas
    Machado and a paternal grandson of Alferes Belchior da Ponte Cardoso and his second wife
    Mariana Fagundes — that is, the son of the Gaspar of F-0062. Only the parents' names come
    from the 1751 will as quoted on f. 55 (MRSJDR, fls. 17); the grandparents do not. If the
    genealogy holds, the Terceira Gaspar's Brazilian line is the Ferreira Armonde of Barbacena,
    which makes it less likely still that he is this Gaspar Ferreira of Villa Rica: the "two
    men" reading gains. It is not proof: the thesis's own dates conflict (n. 73 has the
    patriarch aged 50 in 1747, n. 74 has his mother dying on 9.4.1693), and n. 74 gives
    Gaspar's baptism as 23.9.1657 against Vol. IX's 23.2.1657. The identification is weakened,
    not rejected; no status, link or name was changed. [Superseded 2026-10-10: the
    identification is now rejected — see the 2026-10-10 decision note. This tradition concerns
    Gaspar de Souto Maior (P-0131), not this Gaspar Ferreira.]
  text_pt: >-
