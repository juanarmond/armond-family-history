- text: >-
    Azorean origin hypothesis [COMPILED]: Mendes Forjaz Vol. IX (PUB-0005) lists a "Gaspar de
    Souto-Maior" born [corrected 2026-10-09: baptised — the book prints "b.", its abbreviation
    for baptised] 23.2.1657 in S. Sebastião, Terceira, as a son of Belchior da Ponte Cardoso
    × Mariana Fagundes (F-0062). The retrieval agent has identified this Gaspar as P-0092. The
    birth event E-0135 records his 23.2.1657 birth [corrected 2026-10-09: E-0135 is now a
    baptism event]. ⚠ CONFLICT: Vol. IX gives his death as 2.12.1727 in S. Sebastião [corrected
    2026-10-09: the book prints no place], but P-0092 is placed at Villa Rica, Minas Gerais, only by his son's birthplace, with a son
    (Joaquim José, P-0057) marrying in 1783 — inconsistent if they are the same person (the son
    would need to have been born c.1750-65, after the compiled death date). Resolution pending:
    either the 1727 death date is an error (Gaspar emigrated and the Azorean compiler lacked
    records), or P-0092 is a later-generation descendant of this Gaspar. The F-0062 parentage
    is flagged [COMPILED/LEAD] until primary evidence confirms the emigration link. [Added
    2026-10-09: the full transcription of p.261 also records his second marriage at São
    Sebastião on 8.2.1694 to Maria Mendes de Borba and three children baptised there in
    1698–1701, which keeps him on Terceira into his forties and makes the identification with
