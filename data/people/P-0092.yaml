profile: >-
  ## Identity

  **Gaspar Ferreira** [PROVEN name via PAR-0018] — recovered only as the father of Joaquim
  José Ferreira de Toledo (P-0057), named in his son's 1783 Barbacena marriage act
  (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo], de [Villa]
  Rica". He sits at the recovered apex of the documented Toledo patriline and is a direct
  ancestor of Juan through that son. His wife was Gertrudes Maria de Toledo (P-0093, family
  F-0045).

  - **Residence / nationality:** the record seats the family at Villa Rica (Ouro Preto),
  Comarca de Vila Rica, Minas Gerais — the basis for the Brazilian nationality; "Villa" is a
  bracketed/uncertain read on the ink-bled folio, and no explicit nacionalidade or birthplace
  of his own is stated. [family place; read uncertain]

  - **Birth / death / own parents:** unknown — no baptism, marriage or death record of his own
  is held. He would have been born in the early 18th century to have a son marrying by 1783.
  [OPEN; birth window INFERRED, soft]

  ## Standing and family

  - Nothing is documented for Gaspar himself. His son Joaquim José is recorded with the rank of
  **Capitão** and a landed Barbacena estate (Fazenda Cascalhães), so the Ferreira household of
  Villa Rica was of at least middling free-colonist standing — but that is inferred from the
  son, not shown for Gaspar. [INFERRED]

  - **The surname handoff** [INFERRED]: the son is "Ferreira **de Toledo**" — "Ferreira" carried
  from Gaspar, the "de Toledo" element apparently from his wife's family — so the Toledo
  patriline label at this apex is a maternal inheritance grafted onto a paternal "Ferreira".

  - **Villa Rica → Barbacena drift** [CONTEXTUAL]: Gaspar is recorded a *morador* at Villa Rica
  while his son settled in the Barbacena (Campo das Vertentes) district — the classic movement
  of Minas families off the declining gold district toward the agricultural highlands as the
  mining economy fell past its ~1750 peak.

  ## Open questions

  - His own baptism, marriage, death and parents — the generation above the Toledo apex. Online
  indexes are exhausted (bounded-negative across FamilySearch full-text OCR, FS personas, the
  Nilza/COARPE inventário index and the LAMPEH Mariana catalogue). The decisive off-tool record
  is his son's Villa Rica baptism (~1750–1762), held by the Arquivo Eclesiástico da Arquidiocese
  de Mariana (AEAM), which would name all four grandparents. [OPEN]

  - Any colonial land grant in his name — SILB (Sesmarias do Império Luso-Brasileiro) returns no
  Toledo/Ferreira sesmeiro in Minas Gerais, and his son's Fazenda Cascalhães title is likewise
  absent; if the family held a sesmaria it would be in the Registro de Sesmarias de Minas Gerais
  / Arquivo Público Mineiro. [OPEN — bounded negative]
profile_pt: >-
  ## Identidade

  **Gaspar Ferreira** [PROVEN, o nome, via PAR-0018] — recuperado apenas como pai de Joaquim
  José Ferreira de Toledo (P-0057), nomeado no assento de casamento do filho, em Barbacena por
  volta de 1786 (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo],
  de [Villa] Rica". Situa-se no ápice recuperado da patrilinhagem Toledo documentada e é
  ancestral direto de Juan por meio desse filho. Sua esposa foi Gertrudes Maria de Toledo
  (P-0093, família F-0045).

  - **Residência / nacionalidade:** o registro situa a família em Villa Rica (Ouro Preto),
  Comarca de Vila Rica, Minas Gerais — a base para a nacionalidade brasileira; "Villa" é uma
  leitura entre colchetes/incerta no fólio borrado por tinta, e nenhuma nacionalidade ou local
  de nascimento próprio é declarado. [lugar da família; leitura incerta]

  - **Nascimento / óbito / próprios pais:** desconhecidos — nenhum registro próprio de batismo,
  casamento ou óbito está disponível. Teria nascido no início do século XVIII para ter um filho
  casando-se por volta de 1786. [OPEN; janela de nascimento INFERRED, aproximada]

  ## Posição social e família

  - Nada está documentado sobre o próprio Gaspar. Seu filho Joaquim José é registrado com a
  patente de **Capitão** e uma propriedade rural em Barbacena (Fazenda Cascalhães), de modo que
  a casa Ferreira de Villa Rica era de posição ao menos média entre os colonos livres — mas isso
  é inferido do filho, não demonstrado para Gaspar. [INFERRED]

  - **A transmissão do sobrenome** [INFERRED]: o filho é "Ferreira **de Toledo**" — "Ferreira"
  vindo de Gaspar, o elemento "de Toledo" aparentemente da família da esposa — de modo que o
  rótulo da patrilinhagem Toledo, neste ápice, é uma herança materna enxertada sobre um
  "Ferreira" paterno.

  - **Deslocamento Villa Rica → Barbacena** [CONTEXTUAL]: Gaspar é registrado *morador* em Villa
  Rica enquanto seu filho se estabeleceu no distrito de Barbacena (Campo das Vertentes) — o
  movimento clássico das famílias mineiras para fora do distrito aurífero em declínio rumo às
  terras agrícolas do planalto, à medida que a economia da mineração caía após seu pico por
  volta de 1750.

  ## Questões em aberto

  - Seu próprio batismo, casamento, óbito e pais — a geração acima do ápice Toledo. Os índices
  online estão esgotados (negativo delimitado no OCR de texto completo do FamilySearch, nas
  personas do FS, no índice de inventários Nilza/COARPE e no catálogo LAMPEH de Mariana). O
  registro decisivo fora das ferramentas é o batismo de seu filho em Villa Rica (~1750–1762),
  sob guarda do Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), que nomearia os quatro
  avós. [OPEN]

  - Alguma sesmaria colonial em seu nome — a SILB (Sesmarias do Império Luso-Brasileiro) não
  retorna nenhum sesmeiro Toledo/Ferreira em Minas Gerais, e o título da Fazenda Cascalhães de
  seu filho também está ausente; se a família teve uma sesmaria, estaria no Registro de Sesmarias
  de Minas Gerais / Arquivo Público Mineiro. [OPEN — negativo delimitado]
