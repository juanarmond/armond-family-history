profile: >-
  ## Interesting facts

  - **[PROVEN]** Known only from his son Joaquim José's 1783 Barbacena marriage act (PAR-0018) — named "Gaspar Ferreira... de [Villa] Rica" with no record of his own located in Brazil, making him one of the most ephemerally documented Toledo-line ancestors.

  - **[CONTEXTUAL]** Villa Rica (today Ouro Preto) was the capital of colonial Minas Gerais and the heart of gold production; by 1783, when his son married, the gold peak of c.1750 was past and the mining economy declining. The family's shift toward Barbacena (Campo das Vertentes) is the classic Minas trajectory: moving off exhausted gold districts toward agricultural highland land.

  - **[INFERRED]** His son Joaquim José held the rank of Capitão and owned a Barbacena estate (Fazenda Cascalhães) — suggesting a family of at least middling free-colonist standing in Villa Rica. That status probably partly descended from Gaspar, though no direct evidence of his own property or rank survives.

  - **[INFERRED]** The "de Toledo" surname came through his wife Gertrudes, not through him — he was "Ferreira" alone. It is their son who became "Ferreira de Toledo," fusing both lines. The Toledo patriline label is therefore a matrilineal gift transmitted at this apex from Gertrudes, not a paternal inheritance.

  - **[COMPILED]** A tentative Azorean origin has been identified by the retrieval agent: Mendes Forjaz (PUB-0005, Vol. IX, p.261) lists a "Gaspar de Souto-Maior" born 23.2.1657 in S. Sebastião, Ilha Terceira, as a son of Belchior da Ponte Cardoso × Mariana Fagundes (family F-0062, Alferes de ordenanças). This identification rests on a compiled secondary source only. ⚠ An unresolved conflict prevents confirming it: PUB-0005 records his death as 2.12.1727 in S. Sebastião, Terceira — yet P-0092 is documented "morador na Villa Rica" with a son (P-0057) marrying in 1783, inconsistent with a 1727 Terceira death unless the compiled death date is erroneous, or P-0092 is a later-generation descendant of that Terceira Gaspar. Do NOT treat the Azorean parentage as established. [COMPILED — F-0062 connection pending; death-date conflict unresolved]

  ## Identity

  **Gaspar Ferreira** [PROVEN name via PAR-0018] — recovered only as the father of Joaquim
  José Ferreira de Toledo (P-0057), named in his son's 1783 Barbacena marriage act
  (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo], de [Villa]
  Rica". He sits at the recovered apex of the documented Toledo patriline and is a direct
  ancestor of Juan through that son. His wife was Gertrudes Maria de Toledo (P-0093, family
  F-0045).

  - **Residence / nationality:** the record seats the family at Villa Rica (Ouro Preto),
  Comarca de Vila Rica, Minas Gerais — the basis for the Brazilian nationality; "Villa" is a
  bracketed/uncertain read on the ink-bled folio, and no explicit nacionalidade or birthplace
  of his own is stated. [family place; read uncertain]

  - **Birth / death / own parents:** unknown from any held Brazilian record — no baptism,
  marriage or death record of his own in Brazil is held. He would have been born in the early
  18th century to have a son marrying by 1783. [OPEN; birth window INFERRED, soft]

  - **Tentative Azorean parentage [COMPILED]:** the retrieval agent has tentatively identified
  this person with "Gaspar de Souto-Maior" listed in Mendes Forjaz Vol. IX (PUB-0005) as a
  son of Belchior da Ponte Cardoso × Mariana Fagundes (family F-0062), born 23.2.1657 in
  S. Sebastião, Terceira. If correct, he emigrated from Terceira to Villa Rica, adopting the
  name "Gaspar Ferreira" in place of "Gaspar de Souto-Maior." ⚠ The identification remains
  unconfirmed: PUB-0005 records this Terceira Gaspar's death on 2.12.1727 in S. Sebastião —
  inconsistent with P-0092's documented presence in Villa Rica ~1750–1783 unless the compiled
  death date is wrong, or P-0092 is a son or grandson of that Terceira man. [COMPILED — death-date
  conflict unresolved; parentage NOT proven]

  ## Standing and family

  - Nothing is documented for Gaspar himself in any held Brazilian source. His son Joaquim José
  is recorded with the rank of **Capitão** and a landed Barbacena estate (Fazenda Cascalhães),
  so the Ferreira household of Villa Rica was of at least middling free-colonist standing — but
  that is inferred from the son, not shown for Gaspar. [INFERRED]

  - **The surname handoff** [INFERRED]: the son is "Ferreira **de Toledo**" — "Ferreira" carried
  from Gaspar, the "de Toledo" element apparently from his wife's family — so the Toledo
  patriline label at this apex is a maternal inheritance grafted onto a paternal "Ferreira".

  - **Villa Rica → Barbacena drift** [CONTEXTUAL]: Gaspar is recorded a *morador* at Villa Rica
  while his son settled in the Barbacena (Campo das Vertentes) district — the classic movement
  of Minas families off the declining gold district toward the agricultural highlands as the
  mining economy fell past its ~1750 peak.

  ## Open questions

  - His own baptism, marriage, death and parents — the generation above the Toledo apex. Online
  indexes are exhausted (bounded-negative across FamilySearch full-text OCR, FS personas, the
  Nilza/COARPE inventário index and the LAMPEH Mariana catalogue). The decisive off-tool record
  is his son's Villa Rica baptism (~1750–1762), held by the Arquivo Eclesiástico da Arquidiocese
  de Mariana (AEAM), which would name all four grandparents. [OPEN]

  - Any colonial land grant in his name — SILB (Sesmarias do Império Luso-Brasileiro) returns no
  Toledo/Ferreira sesmeiro in Minas Gerais, and his son's Fazenda Cascalhães title is likewise
  absent; if the family held a sesmaria it would be in the Registro de Sesmarias de Minas Gerais
  / Arquivo Público Mineiro. [OPEN — bounded negative]

  - The death-date conflict: for P-0092 (Villa Rica, son marrying 1783) to be the same person as
  the Terceira "Gaspar de Souto-Maior" of PUB-0005 (d.1727 S.Sebastião), either the compiled
  death date is in error, or P-0092 is a next-generation descendant. Not resolvable from held
  sources. [OPEN — COMPILED identification pending]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Conhecido apenas pelo assento de casamento do filho Joaquim José em Barbacena de 1783 (PAR-0018) — nomeado "Gaspar Ferreira... de [Villa] Rica" sem que nenhum registro próprio no Brasil tenha sido localizado, tornando-o um dos ancestrais da linha Toledo mais efemeramente documentados.

  - **[CONTEXTUAL]** Villa Rica (hoje Ouro Preto) era a capital de Minas Gerais colonial e o coração da produção aurífera; em 1783, quando seu filho casou, o auge do ouro de c.1750 havia passado e a economia mineira estava em declínio. O deslocamento da família para Barbacena (Campo das Vertentes) é a trajetória clássica das famílias mineiras: sair dos distritos auríferos esgotados em direção às terras agrícolas do planalto.

  - **[INFERRED]** Seu filho Joaquim José detinha a patente de Capitão e possuía uma fazenda em Barbacena (Fazenda Cascalhães) — sugerindo uma família de pelo menos média condição entre os colonos livres em Villa Rica. Essa posição provavelmente desceu em parte de Gaspar, embora nenhuma evidência direta de sua própria propriedade ou patente tenha sobrevivido.

  - **[INFERRED]** O sobrenome "de Toledo" veio de sua esposa Gertrudes, não dele — ele era apenas "Ferreira". É o filho deles quem se tornou "Ferreira de Toledo", fundindo os dois nomes. O rótulo Toledo de toda a patrilinhagem é portanto um legado matrilineal transmitido neste ápice por Gertrudes, não uma herança paterna.

  - **[COMPILED]** Uma origem açoriana tentativa foi identificada pelo agente de recuperação: Mendes Forjaz (PUB-0005, Vol. IX, p.261) lista um "Gaspar de Souto-Maior" nascido em 23.2.1657 em S. Sebastião, Ilha Terceira, como filho de Belchior da Ponte Cardoso × Mariana Fagundes (família F-0062, Alferes de ordenanças). Essa identificação assenta apenas em fonte secundária compilada. ⚠ Um conflito não resolvido impede a confirmação: PUB-0005 registra seu óbito como 2.12.1727 em S. Sebastião, Terceira — incompatível com a presença documentada de P-0092 como "morador na Villa Rica" com um filho (P-0057) casando em 1783, a menos que a data de óbito compilada esteja errada, ou P-0092 seja descendente de geração posterior desse Gaspar terceirense. NÃO tratar a filiação açoriana como estabelecida. [COMPILED — conexão F-0062 pendente; conflito de data de óbito não resolvido]

  ## Identidade

  **Gaspar Ferreira** [PROVEN, o nome, via PAR-0018] — recuperado apenas como pai de Joaquim
  José Ferreira de Toledo (P-0057), nomeado no assento de casamento do filho, em Barbacena em 1783 (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo],
  de [Villa] Rica". Situa-se no ápice recuperado da patrilinhagem Toledo documentada e é
  ancestral direto de Juan por meio desse filho. Sua esposa foi Gertrudes Maria de Toledo
  (P-0093, família F-0045).

  - **Residência / nacionalidade:** o registro situa a família em Villa Rica (Ouro Preto),
  Comarca de Vila Rica, Minas Gerais — a base para a nacionalidade brasileira; "Villa" é uma
  leitura entre colchetes/incerta no fólio borrado por tinta, e nenhuma nacionalidade ou local
  de nascimento próprio é declarado. [lugar da família; leitura incerta]

  - **Nascimento / óbito / próprios pais:** desconhecidos a partir de qualquer registro
  brasileiro disponível — nenhum registro próprio de batismo, casamento ou óbito no Brasil está
  disponível. Teria nascido no início do século XVIII para ter um filho casando-se por volta de
  1783. [OPEN; janela de nascimento INFERRED, aproximada]

  - **Filiação açoriana tentativa [COMPILED]:** o agente de recuperação identificou tentativamen-
  te esta pessoa com o "Gaspar de Souto-Maior" listado por Mendes Forjaz Vol. IX (PUB-0005) como
  filho de Belchior da Ponte Cardoso × Mariana Fagundes (família F-0062), nascido em 23.2.1657
  em S. Sebastião, Terceira. Se correto, emigrou da Terceira para Villa Rica, adotando o nome
  "Gaspar Ferreira" em substituição a "Gaspar de Souto-Maior". ⚠ A identificação permanece não
  confirmada: PUB-0005 registra o óbito desse Gaspar terceirense em 2.12.1727 em S. Sebastião —
  incompatível com a presença documentada de P-0092 em Villa Rica ~1750–1783 a menos que a data
  de óbito compilada esteja errada, ou P-0092 seja filho ou neto desse homem terceirense.
  [COMPILED — conflito de data de óbito não resolvido; filiação NÃO provada]

  ## Posição social e família

  - Nada está documentado sobre o próprio Gaspar em nenhuma fonte brasileira disponível. Seu
  filho Joaquim José é registrado com a patente de **Capitão** e uma propriedade rural em
  Barbacena (Fazenda Cascalhães), de modo que a casa Ferreira de Villa Rica era de posição ao
  menos média entre os colonos livres — mas isso é inferido do filho, não demonstrado para
  Gaspar. [INFERRED]

  - **A transmissão do sobrenome** [INFERRED]: o filho é "Ferreira **de Toledo**" — "Ferreira"
  vindo de Gaspar, o elemento "de Toledo" aparentemente da família da esposa — de modo que o
  rótulo da patrilinhagem Toledo, neste ápice, é uma herança materna enxertada sobre um
  "Ferreira" paterno.

  - **Deslocamento Villa Rica → Barbacena** [CONTEXTUAL]: Gaspar é registrado *morador* em Villa
  Rica enquanto seu filho se estabeleceu no distrito de Barbacena (Campo das Vertentes) — o
  movimento clássico das famílias mineiras para fora do distrito aurífero em declínio rumo às
  terras agrícolas do planalto, à medida que a economia da mineração caía após seu pico por
  volta de 1750.

  ## Questões em aberto

  - Seu próprio batismo, casamento, óbito e pais — a geração acima do ápice Toledo. Os índices
  online estão esgotados (negativo delimitado no OCR de texto completo do FamilySearch, nas
  personas do FS, no índice de inventários Nilza/COARPE e no catálogo LAMPEH de Mariana). O
  registro decisivo fora das ferramentas é o batismo de seu filho em Villa Rica (~1750–1762),
  sob guarda do Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), que nomearia os quatro
  avós. [OPEN]

  - Alguma sesmaria colonial em seu nome — a SILB não retorna nenhum sesmeiro Toledo/Ferreira
  em Minas Gerais, e o título da Fazenda Cascalhães de seu filho também está ausente; se a
  família teve uma sesmaria, estaria no Registro de Sesmarias de Minas Gerais / Arquivo Público
  Mineiro. [OPEN — negativo delimitado]

  - O conflito de data de óbito: para que P-0092 (Villa Rica, filho casando em 1783) seja a mesma
  pessoa que o "Gaspar de Souto-Maior" terceirense do PUB-0005 (f.1727, S.Sebastião), o óbito de
  1727 deve estar errado ou a figura de 1783 pertencer a um descendente de geração posterior —
  não resolvível a partir das fontes disponíveis. [OPEN — identificação COMPILED pendente]
