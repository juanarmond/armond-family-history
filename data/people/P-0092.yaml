    2026-10-10: the identification is REJECTED on the owner's decision. The Terceira Gaspar de
    Souto Maior is now a separate person, P-0131 — baptised at São Sebastião on 23 December 1657
    (PAR-0099) and dead there on 2 December 1727 aged about seventy (PAR-0100) — and the F-0062
    parent link for P-0092 is rejected. "The retrieval agent has identified this Gaspar as
    P-0092" was this repository's overstatement: the retrieval research's own synthesis keeps
    the Vila Rica Gaspar Ferreira on the Toledo line and never made the identification. This
    note is kept as the history of a rejected hypothesis.]
  text_pt: >-
    Hipótese de origem açoriana [COMPILED]: Mendes Forjaz, Vol. IX (PUB-0005), arrola um "Gaspar
    de Souto-Maior" nascido [corrigido em 2026-10-09: batizado — o livro imprime "b.", sua
