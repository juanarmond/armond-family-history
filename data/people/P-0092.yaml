- text: >-
    2026-10-10 — DECISION (owner): two men. The identification of this Gaspar Ferreira — the
    Vila Rica father of Cap. Joaquim José Ferreira de Toledo (P-0057), known only from his son's
    1783 Barbacena marriage act (PAR-0018) — with Gaspar de Souto Maior of São Sebastião,
    Terceira, son of Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), is
    REJECTED. The Terceira man was baptised on 23 December 1657 (PAR-0099) and died at São
    Sebastião on 2 December 1727 "de idade de setenta annos", "casado com Maria Mendes"
    (PAR-0100): he lived and died on Terceira, decades before Joaquim José was born
    (c.1750–65). He is now a separate person, P-0131, and the F-0062 parent link that made
    P-0092 a son of Belchior × Mariana is rejected (kept for the record, never joining the two).
    This Gaspar Ferreira's own parents and origin are unknown; he stays on the Toledo line,
    connected to the owner through P-0057. The notes above are kept as the history of the
    hypothesis.
  text_pt: >-
    2026-10-10 — DECISÃO (proprietário): dois homens. A identificação deste Gaspar Ferreira —
    o pai, em Vila Rica, do Cap. Joaquim José Ferreira de Toledo (P-0057), conhecido apenas pelo
    assento de casamento do filho, em Barbacena em 1783 (PAR-0018) — com Gaspar de Souto Maior,
    de São Sebastião, Terceira, filho de Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes
    (P-0124), foi REJEITADA. O homem da Terceira foi batizado a 23 de dezembro de 1657
    (PAR-0099) e faleceu em São Sebastião a 2 de dezembro de 1727, "de idade de setenta annos",
    "casado com Maria Mendes" (PAR-0100): viveu e morreu na Terceira, décadas antes do
    nascimento de Joaquim José (c.1750–65). É agora uma pessoa distinta, P-0131, e o vínculo de
    filiação F-0062 que fazia de P-0092 filho de Belchior × Mariana foi rejeitado (mantido para
    registro, sem nunca ligar os dois). Os pais e a origem deste Gaspar Ferreira são
    desconhecidos; ele continua na linha Toledo, ligado ao proprietário por P-0057. As notas
