notes:
- text: >-
    Named as the father of Joaquim José Ferreira de Toledo (P-0057) in the groom's
    1783 Barbacena marriage act (PAR-0018): "filho leg.[itimo] de Gaspar Fer[reira]
    e de Gertrudes M[aria] [de Toledo], de [Villa] Rica" [misread — corrected 2026-10-08: the act gives the groom as "n.al e batiz.do na freg.a de Villa Rica", his birthplace, not the parents' residence]. His wife is Gertrudes Maria
    de Toledo (P-0093, family F-0045). No record of his own is located; birth, death
    and own vital records are unknown. The parentage rests on the informant-reported
    filiation in his son's marriage, not a birth/baptism, hence strong-evidence.
  text_pt: >-
    Nomeado como pai de Joaquim José Ferreira de Toledo (P-0057) no assento de
    casamento do noivo, em Barbacena em 1783 (PAR-0018): "filho leg.[itimo]
    de Gaspar Fer[reira] e de Gertrudes M[aria] [de Toledo], de [Villa] Rica" [leitura errada — corrigido em 2026-10-08: o ato dá o noivo como "n.al e batiz.do na freg.a de Villa Rica", local de nascimento dele, não residência dos pais]. Sua
    esposa é Gertrudes Maria de Toledo (P-0093, família F-0045). Nenhum registro
    próprio localizado; nascimento, óbito e registros vitais próprios desconhecidos.
    A filiação assenta na declaração informada no casamento do filho, não em um
    registro de nascimento/batismo, portanto evidência forte.
- text: >-
    Nationality Brazilian [INFERRED]: PAR-0018 records his son Joaquim José as "n.al e
    batiz.do na freg.a de Villa Rica" — born and baptised in the parish of Villa Rica
    (Ouro Preto, Minas Gerais) — which places Gaspar there around the son's birth
    (c.1750s–60s) by inference; the act states no residence, nacionalidade or
    birthplace for Gaspar himself. [Corrected 2026-10-08 on a direct image re-read:
    the clause was earlier transcribed "de [Villa] Rica" and read as placing the
    family there.]
  text_pt: >-
    Nacionalidade brasileira [INFERRED]: PAR-0018 registra seu filho Joaquim José como
    "n.al e batiz.do na freg.a de Villa Rica" — nascido e batizado na freguesia de
    Villa Rica (Ouro Preto, Minas Gerais) — o que situa Gaspar ali por volta do
    nascimento do filho (c.1750–60), por inferência; o assento não declara residência,
