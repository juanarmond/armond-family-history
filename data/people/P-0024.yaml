profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named as Vicente's wife and Francisco's mother in CIV-0007 —
  establishing her existence and marriage into the Carvalho-Guimarães couple. No held
  primary record names her with her own dates, filiation or signature.

  - **[INFERRED]** She was most likely based in Vila do Rio Claro, São Paulo — where her son
  Francisco was "natural" (CIV-0007) and where her husband married (~1863–1878). Her origin
  is inferred from context, not stated in any held record.

  - **[INFERRED]** As the likely Brazilian-born wife of the Portuguese immigrant Vicente
  (P-0023), she is the native anchor that helped him put down roots — the common pattern of
  an immigrant man marrying a Brazilian-born woman on the coffee frontier. Her devotional
  surname "da Conceição" carries no class signal; her standing was being built in the new
  country, not inherited.

  - **[CONTEXTUAL]** Vila do Rio Claro (São Paulo) was a growing coffee-economy town in the
  second half of the 19th century, a booming Oeste Paulista coffee municipality and a major
  European-immigrant magnet — the textbook setting for a local Brazilian woman to meet and
  marry a newly-arrived Portuguese immigrant.

  - **[LEAD, REJECTED — 2026-08-13]** The FS public-tree node LZGL-S2G "Tertuliana Maria
  da Conceição" is NOT her — it is a woman of Salvador, Bahia (relatives "José …"
  LZGL-SFT + Enoc da Costa Lage b. 1902; no Vicente / Carvalho Guimarães / Rio Claro).
  Do not re-chase it. Our Maria Tertuliana is not published on the FS public tree.

  ## Identity

  **Maria Tertuliana da Conceição** [PROVEN] — wife of the Portuguese immigrant Vicente
  José de Carvalho Guimarães (P-0023). Not to be confused with her daughter-in-law
  Emmerenciana Maria de Jesus (P-0022): CIV-0007 was once misread as pairing Vicente with
  "Emmerenciana" — corrected: Vicente's wife = Maria Tertuliana; Emerenciana = Francisco's
  wife, one generation down.

  - **Origin:** likely Vila do Rio Claro, SP — where her son Francisco was "natural"
  (CIV-0007), implying she too was Rio-Claro-based; her parents are unknown. [INFERRED]

  - **Child (in our line):** Francisco José de Carvalho Guimarães (P-0021). [PROVEN — CIV-0007]

  - **Death:** unknown. [OPEN] (CIV-0007 records Vicente's death at Carangola; whether Maria
  Tertuliana also died there is not stated in any held record.)

  - **Birth date and parents:** not held. [OPEN]

  ## What we can extrapolate

  She is the likely Brazilian-born local half of an immigrant match. [INFERRED / CONTEXTUAL]
  As the probable Rio-Claro-based wife of the Portuguese immigrant Vicente José de Carvalho
  Guimarães, she is the native anchor that helped a newly-arrived emigrant put down roots —
  the local partner in the standard "immigrant man ⚭ Brazilian-born woman" pattern of the
  Oeste Paulista coffee frontier. Her devotional surname "da Conceição" carries no class
  signal of its own; like the couple's, her standing was being built in the new country
  rather than inherited. Her own parents and natal rung remain unrecorded [OPEN] — the one
  datum that would show what local family the immigrant married into.

  "Tertuliana" is a distinctive given name — a useful discriminator when searching the Rio
  Claro SP marriage and baptism registers for her and her children. [INFERRED]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of her grandchildren — names her as Vicente's
  wife and Francisco's mother). She appears in no other held record.

  ## Where to go today

  - **Marriage to Vicente (~1863–1878):** Igreja Matriz de São João Batista, Rua 6, Centro,
  Rio Claro, SP — still standing, the single visitable site tied to her [RESOLVED town] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)
  The Rio Claro marriage certidão (Arquivo Diocesano de Piracicaba) would name her filiation
  and confirm whether she was Brazilian-born. [OPEN — access-gated / off-tool]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É nomeada como esposa de Vicente e mãe de Francisco em CIV-0007 —
  estabelecendo sua existência e casamento no casal Carvalho-Guimarães. Nenhum registro
  primário em mãos a nomeia com datas próprias, filiação ou assinatura.

  - **[INFERRED]** Estava muito provavelmente sediada em Vila do Rio Claro, São Paulo —
  onde seu filho Francisco era "natural" (CIV-0007) e onde seu marido casou (~1863–1878).
  Sua origem é inferida pelo contexto, não declarada em nenhum registro em mãos.

  - **[INFERRED]** Como provável esposa brasileira nata do imigrante português Vicente
  (P-0023), é a âncora local que o ajudou a criar raízes — o padrão comum do homem imigrante
  que se casa com uma mulher nascida no Brasil na fronteira cafeeira. Seu sobrenome devocional
  "da Conceição" não carrega sinal de classe; sua posição estava sendo construída no novo
  país, não herdada.

  - **[CONTEXTUAL]** A Vila do Rio Claro (São Paulo) era uma cidade em crescimento na
  economia cafeeira na segunda metade do século XIX, um grande município cafeeiro do Oeste
  Paulista e importante destino de imigrantes europeus — o cenário ideal para uma mulher
  brasileira local conhecer e casar com um imigrante português recém-chegado.

  - **[LEAD, REJEITADO — 2026-08-13]** O nó da árvore pública FS LZGL-S2G "Tertuliana
  Maria da Conceição" NÃO é ela — trata-se de uma mulher de Salvador, Bahia (parentes "José
  …" LZGL-SFT + Enoc da Costa Lage n. 1902; sem Vicente / Carvalho Guimarães / Rio Claro).
  Não retomar. Nossa Maria Tertuliana não está publicada na árvore pública do FS.

  ## Identidade

  **Maria Tertuliana da Conceição** [PROVEN] — esposa do imigrante português Vicente José
  de Carvalho Guimarães (P-0023). Não confundir com sua nora Emmerenciana Maria de Jesus
  (P-0022): CIV-0007 foi certa vez lido erroneamente emparelhando Vicente com "Emmerenciana"
  — corrigido: esposa de Vicente = Maria Tertuliana; Emerenciana = esposa de Francisco, uma
  geração abaixo.

  - **Origem:** provavelmente Vila do Rio Claro, SP — onde seu filho Francisco era "natural"
  (CIV-0007), sugerindo que ela também era originária de Rio Claro; seus pais são
  desconhecidos. [INFERRED]

  - **Filho (em nossa linha):** Francisco José de Carvalho Guimarães (P-0021). [PROVEN — CIV-0007]

  - **Óbito:** desconhecido. [OPEN] (CIV-0007 registra o óbito de Vicente em Carangola; se
  Maria Tertuliana também faleceu ali não está declarado em nenhum registro em mãos.)

  - **Data de nascimento e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ela é provavelmente a metade local, nascida no Brasil, de um par imigrante. [INFERRED /
  CONTEXTUAL] Como a provável esposa baseada em Rio Claro do imigrante português Vicente José
  de Carvalho Guimarães, é a âncora nativa que ajudou um emigrante recém-chegado a lançar
  raízes — a parceira local no padrão clássico do "homem imigrante ⚭ mulher nascida no
  Brasil" da fronteira cafeeira do Oeste Paulista. Seu sobrenome devocional "da Conceição"
  não carrega sinal de classe próprio; como a do casal, sua posição estava sendo construída no
  novo país, e não herdada. Seus próprios pais e o degrau de origem permanecem não registrados
  [OPEN] — o único dado que mostraria em qual família local o imigrante se casou.

  "Tertuliana" é um nome de batismo raro — um discriminador útil ao buscar nos registros de
  casamento e batismo de Rio Claro SP por ela e seus filhos. [INFERRED]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus netos — a nomeia como esposa de
  Vicente e mãe de Francisco). Não aparece em nenhum outro registro em mãos.

  ## Onde ir hoje

  - **Casamento com Vicente (~1863–1878):** Igreja Matriz de São João Batista, Rua 6, Centro,
  Rio Claro, SP — ainda de pé, o único local visitável ligado a ela [RESOLVED town] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)
  A certidão de casamento de Rio Claro (Arquivo Diocesano de Piracicaba) nomearia sua
  filiação e confirmaria se ela era nascida no Brasil. [OPEN — acesso restrito / fora das
  ferramentas]
