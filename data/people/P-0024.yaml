profile: >-
  ## Identity

  **Maria Tertuliana da Conceição** [PROVEN] — wife of the Portuguese immigrant Vicente
  José de Carvalho Guimarães (P-0023).

  - **Origin:** native of Vila do Rio Claro [PROVEN as stated] (CIV-0007).

  - **Child (in our line):** Francisco José de Carvalho Guimarães (P-0021).

  - **Death:** at the city of Carangola (MG) [PROVEN as stated] (CIV-0007); date not
  recorded.

  - **Birth date and parents:** not held. [OPEN]

  ## Note on identity

  Not to be confused with her daughter-in-law Emmerenciana Maria de Jesus (P-0022):
  CIV-0007 was once misread as pairing Vicente with "Emmerenciana"; Maria Tertuliana is
  Vicente's wife, one generation up.

  ## What we can extrapolate

  She is the likely Brazilian-born local half of an immigrant match. [INFERRED / CONTEXTUAL]
  Recorded a native of Vila do Rio Claro (CIV-0007) and married to the Portuguese immigrant
  Vicente José de Carvalho Guimarães, she is the native anchor that helped a newly-arrived
  emigrant put down roots — the local partner in the common pattern of an immigrant man
  marrying a Brazilian-born woman on the coffee frontier. Her devotional surname "da
  Conceição" carries no class signal of its own; like the couple's, her standing was being
  built in the new country rather than inherited. Her own parents and natal rung remain
  unrecorded [OPEN] — the one datum that would show what local family the immigrant married
  into.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of her grandchildren — names her as their
  paternal grandmother, deceased at Carangola). She appears in no other held record.

  ## Where to go today

  - **Marriage to Vicente:** Igreja Matriz de São João Batista, Rua 6, Centro, Rio Claro, SP (still standing; her likely home town) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)
profile_pt: >-
  ## Identidade

  **Maria Tertuliana da Conceição** [PROVEN] — esposa do imigrante português Vicente José
  de Carvalho Guimarães (P-0023).

  - **Origem:** natural da Vila do Rio Claro [PROVEN conforme declarado] (CIV-0007).

  - **Filho (em nossa linha):** Francisco José de Carvalho Guimarães (P-0021).

  - **Óbito:** na cidade de Carangola (MG) [PROVEN conforme declarado] (CIV-0007); data
  não registrada.

  - **Data de nascimento e pais:** não obtidos. [OPEN]

  ## Nota de identidade

  Não confundir com sua nora Emmerenciana Maria de Jesus (P-0022): CIV-0007 foi certa vez
  lido erroneamente emparelhando Vicente com "Emmerenciana"; Maria Tertuliana é a esposa
  de Vicente, uma geração acima.

  ## O que podemos extrapolar

  Ela é provavelmente a metade local, nascida no Brasil, de um par imigrante. [INFERRED /
  CONTEXTUAL] Registrada como natural da Vila do Rio Claro (CIV-0007) e casada com o imigrante
  português Vicente José de Carvalho Guimarães, é a âncora nativa que ajudou um emigrante
  recém-chegado a lançar raízes — a parceira local no padrão comum do homem imigrante que se
  casa com uma mulher nascida no Brasil na fronteira cafeeira. Seu sobrenome devocional "da
  Conceição" não carrega sinal de classe próprio; como a do casal, sua posição estava sendo
  construída no novo país, e não herdada. Seus próprios pais e o degrau de origem permanecem
  não registrados [OPEN] — o único dado que mostraria em qual família local o imigrante se
  casou.

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus netos — a nomeia como a avó
  paterna, falecida em Carangola). Não aparece em nenhum outro registro obtido.

  ## Onde ir hoje

  - **Casamento com Vicente:** Igreja Matriz de São João Batista, Rua 6, Centro, Rio Claro, SP (ainda de pé; sua provável cidade natal) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)
