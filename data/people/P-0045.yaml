notes:
- text: >-
    Father of Rita Ignacia de Jesus (P-0041) — hence Susanna Rita Brandão's maternal
    grandfather. Named as the "avô materno" (godfather) in Susanna's 1866 baptism
    (PAR-0005), which is the basis for his link to Rita; his own 1868 Sapucaia death
    (PAR-0010, married, aged 70) and his widow Ignacia's 1878 death (PAR-0011) confirm
    the "Caetano" reading and give his approximate birth (c.1798). This resolves the
    earlier flagged "Antonio [Castro/Caetano] Machado" ambiguity in favour of Caetano.
  text_pt: >-
    Pai de Rita Ignacia de Jesus (P-0041) — portanto, o avô materno de Susanna
    Rita Brandão. Nomeado como "avô materno" (padrinho) no batismo de Susanna em
    1866 (PAR-0005), que é a base para sua ligação com Rita; seu próprio óbito de
    1868 em Sapucaia (PAR-0010, casado, aos 70 anos) e o óbito de 1878 de sua
    viúva Ignacia (PAR-0011) confirmam a leitura "Caetano" e fornecem seu
    nascimento aproximado (por volta de 1798). Isso resolve a ambiguidade antes
    sinalizada de "Antonio [Castro/Caetano] Machado" em favor de Caetano.
