profile: >-
  ## Interesting facts

  - **[PROVEN]** Born about 1798, he is the deepest-reaching Brazilian-born ancestor on this side of the tree — a man whose childhood was spent in colonial Brazil, before independence in 1822, and whose adult life ran the length of the Paraíba do Sul coffee boom.

  - **[PROVEN]** He was buried on 27 March 1868 in the cemetery of the **Curato** de Santo Antônio de Sapucaia, married, aged 70, of a natural death, and "sacramentado com os Sacramentos" — he had received the last rites, and a named priest, Francisco José Pimenta, signed the act (PAR-0010). Sapucaia was then still a *curato*, not yet a full parish; it was erected as a freguesia in 1871 [CONTEXTUAL].

  - **[PROVEN]** At about 68 he stood godfather at his granddaughter Susanna's baptism, where the priest labelled him "avô materno" (PAR-0005). That label is the entire basis for his fatherhood of Rita Ignacia de Jesus, and it is a good one: the officiant stated the relationship rather than leaving it to be inferred.

  - **[PROVEN]** His death act, read complete across both pages, names **neither his wife nor his parents** and references no will — a bounded negative, and the reason his own ancestry remains closed. His widow's own 1878 act (PAR-0011) is what identifies her, and it also settles the "Castro / Caetano" ambiguity in the cursive of the 1866 baptism in favour of **Caetano**.

  - **[INFERRED]** The contrast between his burial and his descendants' is documented and sharp. He died inside his parish with the sacraments; forty-four years later his son-in-law died at Carangola "sem sacramentos" (PAR-0008), and his daughter in 1898 with "não procuraram Confissão" noted against her (PAR-0009). What changed in between was not belief but a migration.

  ## Identity

  **Antonio Caetano Machado** — the Sapucaia-rooted patriarch of the maternal Machado line, and the deepest Brazilian-born ancestor documented on this branch. [PROVEN] The "Antonio [Castro / Caetano] Machado" ambiguity in his granddaughter's baptism is resolved to Caetano by his own óbito (PAR-0010) and his widow's (PAR-0011).

  - **Relationship:** 2×-great-grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs Antonio Caetano → Rita Ignacia de Jesus (P-0041) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derived from families F-0022, F-0019, F-0007 and F-0001]

  - **Born:** about **1798** (aged 70 at his 1868 burial, PAR-0010). [INFERRED from the stated age]

  - **Role:** father of Rita Ignacia de Jesus (P-0041), named "avô materno" at his granddaughter Susanna's 1866 baptism, where he also stood godfather (PAR-0005; family F-0022). [PROVEN]

  - **Spouse:** Ignacia Maria de Jesus (P-0046), named as his widow in her own 1878 Sapucaia death (PAR-0011). His own act records him "casado" but does not name her. [PROVEN that he was married; the wife identified via PAR-0011]

  - **Death:** buried 27 March 1868 in the cemetery of the Curato de Santo Antônio de Sapucaia (RJ); married, aged 70; a natural death; sacramented; officiant Francisco José Pimenta (PAR-0010, the act spanning two page images). [PROVEN]

  - **Parents and origin:** unknown; nationality left unset, since no birthplace or stated *nacionalidade* is evidenced. A research lead places a Caetano Machado family at **Cebolas** (Paraíba do Sul) — a Manoel Caetano Machado × Delphina Angélica Gonçalves whose sons married there from 1819 — and hypothesises him as one of those sons. Nothing in a held record supports it, and it is a **[LEAD]**, not a parentage. [OPEN]

  ## Standing and profession

  No occupation, property, office or title is stated for him in any held record, and his óbito references no will. [PROVEN as a negative across the held set] What the acts document instead is integration: he was buried with the sacraments in his own parish's ground, with a named officiant, and he was godfather at a family baptism two years before he died. Those are the marks of a settled, long-resident householder rather than a transient or a marginal figure. [INFERRED] His literacy is undocumented — an óbito carries the priest's signature, not the deceased's, so no literacy datum is recoverable from it. [OPEN]

  ## Family and social network

  Father of Rita Ignacia de Jesus (P-0041), who married José do Rego Brandão (P-0040), the Sapucaia householder; thereby maternal grandfather of Susanna Rita Brondão (P-0020), at whose 1866 baptism he stood godfather and was labelled "avô materno" (PAR-0005). His wife was Ignacia Maria de Jesus (P-0046), identified through her own 1878 death act rather than through any record of his.

  His Machado surname does not carry forward: his daughter used the devotional "Ignacia de Jesus" and then the married "do Rego Brandão", and no descendant in this line bears Machado. The Sapucaia godparent network into which his descendants married — the one that sponsored and then absorbed the Azorean Muniz immigrants in the 1880s — postdates him, but it rests on the parish standing he is the earliest documented holder of. A research lead ties his surname to a Caetano Machado cluster at Cebolas (Paraíba do Sul), whose documented members include a Lino Caetano Machado who died at Sapucaia in 1869, a year after him; the kinship is unproven. [LEAD]

  ## What we can extrapolate

  **1. He is where the Brazilian, non-immigrant pole of this family begins. [INFERRED / CONTEXTUAL]** Born about 1798 and dying church-embedded at Sapucaia in 1868, he is almost certainly Brazilian-born; the Atlantic crossing in this descent belongs to the Muniz, a generation later and on the other side of his granddaughter's marriage. He matters structurally: he is the reason the household into which the Azorean immigrants married was an *established* one. Three generations of continuous parish presence stood behind Susanna when she married João Muniz Bittencourt in 1882, and that depth starts with him.

  **2. His capital was belonging, and it was never convertible. [INFERRED]** He leaves no estate record, no land register, no will. What he leaves is a position — a man the parish sacraments reach, whose name a priest writes as "avô materno" without explanation, and whose descendants a generation later are the godparents newcomers ask for. That is real and it is also weightless: it has no cash value, no legal existence, and it cannot be sold, mortgaged or divided. Which is exactly why it does not appear in any archive except as a texture in vital records.

  **3. Partible inheritance never engages here, and that is the diagnostic. [INFERRED / CONTEXTUAL]** Brazilian law split estates equally among all children and could pulverise a working holding in two generations — the mechanism that explains the descent of better-off branches of this tree. No inventário follows his death, or his widow's, or his daughter's, or his son-in-law's: four deaths across fifty years, and not one estate opened. A household that leaves no probate at four consecutive deaths held nothing worth the court's fee. His line's poverty is therefore not an accident of lost records; it is consistent and documented by absence.

  **4. Education is invisible in every generation below him. [CONTEXTUAL]** Schooling in nineteenth-century rural Brazil was a purchased, class-linked privilege with no public provision to fall back on, and it had to be re-bought each generation. Neither he, nor his daughter, nor his granddaughter leaves a signature anywhere. The first documented autograph in this whole descent is his great-great-grandson Deocleciano's, in 1916 (CIV-0006) — five generations and one hundred and eighteen years after his own birth.

  **5. What he built, his grandchildren left. [INFERRED]** The rootedness he anchored at Sapucaia was the family's only asset, and it was destroyed not by division but by movement. Between 1890 and 1898 his descendants relocated to Carangola in Minas Gerais, following the coffee frontier; his daughter died there in 1898 and his son-in-law in 1912, both without the sacraments he had received. The arc of this branch is therefore not a decline from wealth — there was never wealth — but the loss of a *place*, which for a family whose capital was local standing amounts to the same thing. What his descendants carried into the twentieth century was labour, kin and a name.

  ## Open questions

  - **His parents and his own baptism** (about 1798, Sapucaia, Cebolas or nearby) — would fix the family's origin at primary level. His own óbito is a bounded negative on this: both pages are read and it names no parents. The Sapucaia marriage books begin only in 1885, so his marriage lies in the undigitised pre-1885 volumes of the predecessor parish; a digitised Cebolas marriage book for 1815–1853 is a promising target for it. [OPEN]

  - **His wife's name from a record of his own** — his óbito names no wife. Ignacia Maria de Jesus is identified only through her own 1878 act, which calls her his widow. [OPEN]

  - **His other children** — no inventário and no "N filhos" statement exists, so there is no denominator. [OPEN]

  ## Sources held (this repository)

  - PAR-0010 (his 1868 Sapucaia death and burial — age, married status, sacraments, the curato cemetery; two page images) · PAR-0011 (his widow Ignacia's 1878 Sapucaia death, which identifies her and corroborates the "Caetano" reading).

  - PAR-0005 (his granddaughter Susanna's 1866 baptism transcript — names him "avô materno" and a godfather; the basis for his fatherhood of Rita, P-0041).

  ## Regional and migration context

  A settled householder of **Santo Antônio de Sapucaia**, in the Paraíba do Sul valley (RJ) — born, living and buried in the same place, with no movement documented at any point in seventy years. [CONTEXTUAL] His lifetime covers the whole rise of the valley's coffee economy, from the 1820s frontier to the boom years of the 1850s and 1860s, and he left no part of it to his heirs. The legal framework that shaped the region — the Lei nº 581 de 1850 (Lei Eusébio de Queirós), which by ending the Atlantic slave trade drew in the Azorean immigrants his granddaughter would marry, and the Lei de Terras (nº 601, 1850), which put land on a purchase basis — falls in his last two decades. [CONTEXTUAL] The Atlantic migration in this family is not his: it belongs to the Muniz, and it arrives from outside. No origin is inferred from his surname.

  ## Where to go today

  - **Burial (27 March 1868):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — the act names the "Cemiterio deste Curato de Santo Antonio de Sapucaia"; whether the modern municipal ground is the same 1868 ground is unconfirmed [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Parish of his whole documented life (and the alternative burial ground):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nascido por volta de 1798, ele é o ancestral nascido no Brasil mais recuado deste lado da árvore — um homem cuja infância transcorreu no Brasil colonial, antes da independência de 1822, e cuja vida adulta cobriu toda a extensão do auge cafeeiro do Paraíba do Sul.

  - **[PROVEN]** Foi sepultado em 27 de março de 1868 no cemitério do **Curato** de Santo Antônio de Sapucaia, casado, aos 70 anos, de morte natural, e "sacramentado com os Sacramentos" — recebera os últimos sacramentos, e um padre nomeado, Francisco José Pimenta, assinou o ato (PAR-0010). Sapucaia ainda era então um *curato*, não uma freguesia plena; foi erigida em freguesia em 1871 [CONTEXTUAL].

  - **[PROVEN]** Por volta dos 68 anos foi padrinho no batismo de sua neta Susanna, onde o padre o rotulou "avô materno" (PAR-0005). Esse rótulo é toda a base de sua paternidade sobre Rita Ignacia de Jesus, e é uma base boa: o celebrante declarou a relação em vez de deixá-la a inferir.

  - **[PROVEN]** Seu ato de óbito, lido completo nas duas páginas, **não nomeia nem a esposa nem os pais** e não faz referência a testamento — uma negativa delimitada, e a razão de sua própria ascendência permanecer fechada. O ato de 1878 de sua viúva (PAR-0011) é o que a identifica, e também resolve a ambiguidade "Castro / Caetano" da cursiva do batismo de 1866 em favor de **Caetano**.

  - **[INFERRED]** O contraste entre seu sepultamento e o de seus descendentes está documentado e é nítido. Ele morreu dentro de sua paróquia, com os sacramentos; quarenta e quatro anos depois, seu genro morreu em Carangola "sem sacramentos" (PAR-0008), e sua filha, em 1898, com "não procuraram Confissão" anotado contra si (PAR-0009). O que mudou entre uma coisa e outra não foi a crença, mas uma migração.

  ## Identidade

  **Antonio Caetano Machado** — o patriarca da linha materna Machado, enraizado em Sapucaia, e o ancestral nascido no Brasil mais recuado documentado neste ramo. [PROVEN] A ambiguidade "Antonio [Castro / Caetano] Machado" no batismo de sua neta é resolvida para Caetano por seu próprio óbito (PAR-0010) e pelo de sua viúva (PAR-0011).

  - **Parentesco:** trisavô de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre Antonio Caetano → Rita Ignacia de Jesus (P-0041) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derivado das famílias F-0022, F-0019, F-0007 e F-0001]

  - **Nascimento:** por volta de **1798** (70 anos em seu sepultamento de 1868, PAR-0010). [INFERRED a partir da idade declarada]

  - **Papel:** pai de Rita Ignacia de Jesus (P-0041), nomeado "avô materno" no batismo de 1866 de sua neta Susanna, onde também foi padrinho (PAR-0005; família F-0022). [PROVEN]

  - **Esposa:** Ignacia Maria de Jesus (P-0046), nomeada como sua viúva no óbito dela, em 1878, em Sapucaia (PAR-0011). O próprio ato dele o registra "casado", mas não a nomeia. [PROVEN que era casado; a esposa identificada via PAR-0011]

  - **Óbito:** sepultado em 27 de março de 1868 no cemitério do Curato de Santo Antônio de Sapucaia (RJ); casado, 70 anos; morte natural; sacramentado; celebrante Francisco José Pimenta (PAR-0010, ato que se estende por duas imagens de página). [PROVEN]

  - **Pais e origem:** desconhecidos; nacionalidade não definida, pois nenhum local de nascimento ou *nacionalidade* declarada está evidenciado. Uma pista de pesquisa situa uma família Caetano Machado em **Cebolas** (Paraíba do Sul) — um Manoel Caetano Machado × Delphina Angélica Gonçalves cujos filhos ali se casaram a partir de 1819 — e formula a hipótese de que ele seja um desses filhos. Nada em registro conservado a sustenta, e trata-se de **[LEAD]**, não de filiação. [OPEN]

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo ou título lhe é declarado em qualquer registro conservado, e seu óbito não faz referência a testamento. [PROVEN como negativa no conjunto disponível] O que os atos documentam, em lugar disso, é integração: foi sepultado com os sacramentos no chão de sua própria paróquia, com celebrante nomeado, e foi padrinho num batismo de família dois anos antes de morrer. São marcas de um chefe de casa estabelecido e de longa residência, não de um transeunte ou figura marginal. [INFERRED] Sua alfabetização não está documentada — um óbito traz a assinatura do padre, não a do falecido, de modo que dele nenhum dado de alfabetização é recuperável. [OPEN]

  ## Família e rede social

  Pai de Rita Ignacia de Jesus (P-0041), que se casou com José do Rego Brandão (P-0040), o chefe de casa de Sapucaia; portanto avô materno de Susanna Rita Brondão (P-0020), em cujo batismo de 1866 foi padrinho e foi rotulado "avô materno" (PAR-0005). Sua esposa foi Ignacia Maria de Jesus (P-0046), identificada pelo ato de óbito dela, de 1878, e não por qualquer registro dele.

  Seu sobrenome Machado não segue adiante: a filha usou o devocional "Ignacia de Jesus" e depois o de casada "do Rego Brandão", e nenhum descendente desta linha traz Machado. A rede de apadrinhamento de Sapucaia na qual seus descendentes se casaram — a que patrocinou e depois absorveu os imigrantes açorianos Muniz nos anos 1880 — é posterior a ele, mas assenta na posição paroquial de que ele é o detentor documentado mais antigo. Uma pista de pesquisa liga seu sobrenome a um aglomerado Caetano Machado em Cebolas (Paraíba do Sul), cujos membros documentados incluem um Lino Caetano Machado falecido em Sapucaia em 1869, um ano depois dele; o parentesco não está provado. [LEAD]

  ## O que podemos extrapolar

  **1. É nele que começa o polo brasileiro, não imigrante, desta família. [INFERRED / CONTEXTUAL]** Nascido por volta de 1798 e morrendo entranhado na igreja em Sapucaia, em 1868, é quase certamente nascido no Brasil; a travessia atlântica nesta descendência pertence aos Muniz, uma geração depois e do outro lado do casamento de sua neta. Ele importa estruturalmente: é a razão de o lar em que os imigrantes açorianos se casaram ser um lar *estabelecido*. Três gerações de presença paroquial contínua estavam atrás de Susanna quando ela se casou com João Muniz Bittencourt em 1882, e essa profundidade começa nele.

  **2. Seu capital era o pertencimento, e nunca foi conversível. [INFERRED]** Ele não deixa registro de espólio, registro de terras nem testamento. O que deixa é uma posição — um homem a quem os sacramentos da paróquia chegam, cujo nome um padre escreve como "avô materno" sem explicação, e cujos descendentes, uma geração depois, são os padrinhos que os recém-chegados procuram. Isso é real e é também imponderável: não tem valor em caixa, não tem existência jurídica, e não pode ser vendido, hipotecado ou dividido. Exatamente por isso não aparece em arquivo algum, salvo como textura nos registros vitais.

  **3. A herança partível nunca engata aqui, e é esse o diagnóstico. [INFERRED / CONTEXTUAL]** A lei brasileira dividia os espólios igualmente entre todos os filhos e podia pulverizar uma posse produtiva em duas gerações — o mecanismo que explica a descida de ramos mais abastados desta árvore. Nenhum inventário segue sua morte, nem a de sua viúva, nem a de sua filha, nem a de seu genro: quatro mortes em cinquenta anos, e nenhum espólio aberto. Um lar que não deixa inventário em quatro mortes consecutivas nada detinha que valesse a custa judicial. A pobreza de sua linha não é, portanto, acidente de registros perdidos; é consistente e documentada por ausência.

  **4. A educação é invisível em todas as gerações abaixo dele. [CONTEXTUAL]** A escolarização no Brasil rural oitocentista era privilégio comprado e ligado à classe, sem oferta pública a que recorrer, e tinha de ser recomprada a cada geração. Nem ele, nem a filha, nem a neta deixam assinatura em parte alguma. O primeiro autógrafo documentado em toda esta descendência é o de seu tetraneto Deocleciano, em 1916 (CIV-0006) — cinco gerações e cento e dezoito anos depois de seu próprio nascimento.

  **5. O que ele construiu, seus netos deixaram para trás. [INFERRED]** O enraizamento que ele ancorou em Sapucaia era o único ativo da família, e foi destruído não pela divisão, mas pelo deslocamento. Entre 1890 e 1898 seus descendentes mudaram-se para Carangola, em Minas Gerais, seguindo a fronteira cafeeira; sua filha morreu ali em 1898 e seu genro em 1912, ambos sem os sacramentos que ele recebera. O arco deste ramo não é, portanto, um declínio a partir da riqueza — nunca houve riqueza —, mas a perda de um *lugar*, o que, para uma família cujo capital era a posição local, dá no mesmo. O que seus descendentes levaram para o século XX foi trabalho, parentela e um nome.

  ## Questões em aberto

  - **Seus pais e seu próprio batismo** (por volta de 1798, em Sapucaia, Cebolas ou cercanias) — fixariam a origem da família em nível primário. Seu próprio óbito é negativa delimitada quanto a isso: ambas as páginas foram lidas e ele não nomeia pais. Os livros de casamento de Sapucaia começam apenas em 1885, de modo que seu casamento está nos volumes não digitalizados anteriores a 1885 da paróquia antecessora; um livro digitalizado de casamentos de Cebolas para 1815–1853 é alvo promissor. [OPEN]

  - **O nome de sua esposa a partir de um registro dele próprio** — seu óbito não nomeia esposa. Ignacia Maria de Jesus é identificada apenas pelo ato dela, de 1878, que a chama de sua viúva. [OPEN]

  - **Seus demais filhos** — não existe inventário nem declaração de "N filhos", de modo que não há denominador. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0010 (seu óbito e sepultamento de 1868 em Sapucaia — idade, condição de casado, sacramentos, o cemitério do curato; duas imagens de página) · PAR-0011 (o óbito de 1878 de sua viúva Ignacia em Sapucaia, que a identifica e corrobora a leitura "Caetano").

  - PAR-0005 (a transcrição do batismo de 1866 de sua neta Susanna — nomeia-o "avô materno" e padrinho; a base de sua paternidade sobre Rita, P-0041).

  ## Contexto regional e migratório

  Um chefe de casa estabelecido em **Santo Antônio de Sapucaia**, no vale do Paraíba do Sul (RJ) — nascido, vivendo e sepultado no mesmo lugar, sem deslocamento documentado em setenta anos. [CONTEXTUAL] Sua vida cobre toda a ascensão da economia cafeeira do vale, da fronteira dos anos 1820 aos anos de auge das décadas de 1850 e 1860, e ele não deixou parte alguma dela a seus herdeiros. O arcabouço legal que moldou a região — a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que, ao encerrar o tráfico atlântico, atraiu os imigrantes açorianos com um dos quais sua neta se casaria, e a Lei de Terras (nº 601, 1850), que pôs a terra em base de compra — cai em suas duas últimas décadas. [CONTEXTUAL] A migração atlântica desta família não é a dele: pertence aos Muniz e chega de fora. Nenhuma origem é inferida de seu sobrenome.

  ## Onde ir hoje

  - **Sepultamento (27 de março de 1868):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — o ato nomeia o "Cemiterio deste Curato de Santo Antonio de Sapucaia"; se o chão municipal moderno é o mesmo de 1868 não está confirmado [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Paróquia de toda a sua vida documentada (e o terreno alternativo de sepultamento):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
