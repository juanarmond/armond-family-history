profile: >-
  ## Identity

  **Antonio Caetano Machado** — the deepest-reaching Sapucaia-born ancestor on the Brandão
  maternal line. [PROVEN] The earlier "Antonio [Castro/Caetano] Machado" ambiguity in
  Susanna's baptism is resolved to Caetano by his own óbito (PAR-0010) and his widow's
  (PAR-0011).

  - **Born:** about 1798 (aged 70 at his 1868 burial, PAR-0010). [PROVEN]

  - **Role:** father of Rita Ignacia de Jesus (P-0041) — named "avô materno" (maternal
  grandfather) at his granddaughter Susanna's baptism (PAR-0005; family F-0022) — hence
  Susanna Rita Brandão's maternal grandfather. [PROVEN]

  - **Spouse:** Ignacia Maria de Jesus (P-0046), named as his widow in her own 1878 Sapucaia
  death (PAR-0011). [PROVEN he was married; wife identified via PAR-0011]

  - **Death:** buried 27 March 1868 in the cemetery of the Curato de Santo Antônio de
  Sapucaia (RJ), married, aged 70, a natural death, sacramented (PAR-0010). [PROVEN]

  - **Origin:** nationality left unset; a Santo Antônio de Sapucaia (RJ) family. [OPEN]

  ## Standing and profession

  A locally-established, church-integrated Sapucaia man: godfather at his granddaughter's
  1866/1876 baptism and sacramented at death — markers of a settled resident, not a
  transient. No occupation or property is directly attested. [PROVEN / INFERRED]

  ## What we can extrapolate

  Born about 1798 and dying church-integrated at Sapucaia in 1868 (he received the sacraments,
  a named padre officiating, buried in the curato cemetery), he is almost certainly
  Brazilian-born — the Azorean immigration in this family sits on the Muniz side a generation
  later. The Machado/Rego Brandão maternal branch looks like the established Rio de
  Janeiro-interior family into which the immigrant Muniz brothers married. [INFERRED]

  On the socioeconomic read, he is the origin of the established-local standing the Brandão
  line later traded on: a settled, church-embedded Paraíba-valley householder, the kind of
  long-resident whose descendants become the community's godparent-class. [INFERRED /
  CONTEXTUAL] His "capital," like theirs, reads as belonging and respectability rather than
  land or office — he leaves no estate record — and standing godfather to his own granddaughter
  is the visible form of that standing (the family research reads him as an active parish
  godfather across the 1850s–60s, a lead beyond the held baptism). He anchors the Brazilian,
  non-immigrant, rooted-local pole of the whole Muniz/Brandão settlement.

  ## Open questions

  - His own parents and baptism (about 1798) — would fix the family's origin at primary
  level. [OPEN]

  ## Sources held (this repository)

  - PAR-0010 (his 1868 Sapucaia death — age, married status) · PAR-0011 (his widow Ignacia's
  1878 Sapucaia death, corroborating the marriage and the "Caetano" reading).

  - PAR-0005 (his granddaughter Susanna's 1876 baptism — names him "avô materno", the basis
  for his fatherhood of Rita P-0041).

  ## Regional and migration context

  A settled Santo Antônio de Sapucaia (RJ) householder of the Paraíba do Sul valley, born,
  living and buried in the parish. [CONTEXTUAL] As the deepest member of the Brazilian-side
  Brandão/Machado line, he is almost certainly Brazilian-born; the Atlantic immigration in
  this family is on the Muniz side, not his. The coffee economy his descendants later followed
  ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de Queirós),
  through abolition in the Lei Áurea (1888), with land under the Lei de Terras (nº 601, 1850) —
  but this is the Brazilian, receiving side, with no Atlantic crossing on his line. [CONTEXTUAL]

  ## Where to go today

  - **Burial (27 Mar 1868):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — the "Cemitério do Curato de Santo Antônio da Sapucaia"; whether the modern municipal cemetery is the same 1868 ground is unconfirmed [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Burial — parish church (alternative ground):** Igreja Matriz de Santo Antônio de Sapucaia (Praça Miguel Couto Filho, Centro, Sapucaia, RJ) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
profile_pt: >-
  ## Identidade

  **Antonio Caetano Machado** — o ancestral mais antigo nascido em Sapucaia na linha materna
  Brandão. [PROVEN] A anterior ambiguidade "Antonio [Castro/Caetano] Machado" no batismo de
  Susanna é resolvida em favor de Caetano por seu próprio óbito (PAR-0010) e pelo de sua
  viúva (PAR-0011).

  - **Nascimento:** por volta de 1798 (70 anos em seu sepultamento de 1868, PAR-0010).
  [PROVEN]

  - **Papel:** pai de Rita Ignacia de Jesus (P-0041) — nomeado "avô materno" no batismo de sua
  neta Susanna (PAR-0005; família F-0022) — portanto, avô materno de Susanna Rita Brandão.
  [PROVEN]

  - **Cônjuge:** Ignacia Maria de Jesus (P-0046), nomeada sua viúva em seu próprio óbito de
  1878 em Sapucaia (PAR-0011). [PROVEN, ele era casado; esposa identificada via PAR-0011]

  - **Óbito:** sepultado em 27 de março de 1868 no cemitério do Curato de Santo Antônio de
  Sapucaia (RJ), casado, aos 70 anos, morte natural, sacramentado (PAR-0010). [PROVEN]

  - **Origem:** nacionalidade deixada em branco; uma família de Santo Antônio de Sapucaia
  (RJ). [OPEN]

  ## Posição social e profissão

  Um homem estabelecido localmente e integrado à igreja em Sapucaia: padrinho no batismo de
  1866/1876 de sua neta e sacramentado ao falecer — marcas de um residente fixado, não de um
  transeunte. Nenhuma ocupação ou propriedade lhe é atestada diretamente. [PROVEN / INFERRED]

  ## O que podemos extrapolar

  Nascido por volta de 1798 e falecido integrado à igreja em Sapucaia em 1868 (recebeu os
  sacramentos, com um padre nomeado oficiando, sepultado no cemitério do curato), é quase
  certamente nascido no Brasil — a imigração açoriana desta família está no lado Muniz, uma
  geração depois. O ramo materno Machado/Rego Brandão assemelha-se à família estabelecida do
  interior fluminense na qual os irmãos imigrantes Muniz se casaram. [INFERRED]

  Na leitura socioeconômica, ele é a origem da posição nativo-estabelecida da qual a linha
  Brandão mais tarde se valeu: um chefe de casa fixado e integrado à igreja no vale do Paraíba,
  o tipo de morador de longa data cujos descendentes se tornam a classe padrinho da comunidade.
  [INFERRED / CONTEXTUAL] Seu "capital", como o deles, lê-se como pertencimento e
  respeitabilidade, e não como terra ou ofício — ele não deixa registro de espólio — e ser
  padrinho de sua própria neta é a forma visível dessa posição (a pesquisa da família o lê como
  padrinho ativo na freguesia ao longo dos anos 1850–60, uma pista para além do batismo
  disponível). Ele ancora o polo brasileiro, não imigrante e nativo-enraizado de todo o
  assentamento Muniz/Brandão.

  ## Questões em aberto

  - Seus próprios pais e batismo (por volta de 1798) — fixariam a origem da família em nível
  primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0010 (seu óbito de 1868 em Sapucaia — idade, condição de casado) · PAR-0011 (o óbito
  de 1878 em Sapucaia de sua viúva Ignacia, corroborando o casamento e a leitura "Caetano").

  - PAR-0005 (o batismo de 1876 de sua neta Susanna — nomeia-o "avô materno", a base para sua
  paternidade sobre Rita P-0041).

  ## Contexto regional e migratório

  Um chefe de casa estabelecido em Santo Antônio de Sapucaia (RJ), no vale do Paraíba do Sul,
  nascido, vivido e sepultado na freguesia. [CONTEXTUAL] Como o membro mais antigo da linha
  Brandão/Machado do lado brasileiro, é quase certamente nascido no Brasil; a imigração
  atlântica desta família está no lado Muniz, não no dele. A economia cafeeira que seus
  descendentes seguiram funcionava sobre a transição para o trabalho livre do pós-1850 — a Lei
  nº 581 de 1850 (Lei Eusébio de Queirós), até a abolição na Lei Áurea (1888), com a terra sob a
  Lei de Terras (nº 601, 1850) — mas este é o lado brasileiro, receptor, sem travessia atlântica
  em sua linha. [CONTEXTUAL]

  ## Onde ir hoje

  - **Sepultamento (27 mar. 1868):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — o "Cemitério do Curato de Santo Antônio da Sapucaia"; não se confirma se o cemitério municipal atual é o mesmo terreno de 1868 [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Sepultamento — igreja matriz (terreno alternativo):** Igreja Matriz de Santo Antônio de Sapucaia (Praça Miguel Couto Filho, Centro, Sapucaia, RJ) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
