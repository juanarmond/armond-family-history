notes:
- text: >-
    Mother of Manoel Muniz Bytancourt (P-0042); hence the paternal grandmother of
    João Muniz Bittencourt (P-0019). Named, with her husband João Muniz Bytancourt
    (P-0048), in her son Manoel's 1866 death (PAR-0015) as "Maria Jacintha de
    Medeiros, d'occupação domestica … natural desta freguesia" — of Nossa Senhora
    Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal). Her grandsons'
    1880 Ponta Delgada emigration passports also style them "filho de João Moniz
    Bettencourt e Maria Jacinta" (secondary corroboration, a lead only).
  text_pt: >-
    Mãe de Manoel Muniz Bytancourt (P-0042); portanto, a avó paterna de João
    Muniz Bittencourt (P-0019). Nomeada, junto com seu marido João Muniz
    Bytancourt (P-0048), no óbito de 1866 do filho Manoel (PAR-0015) como "Maria
    Jacintha de Medeiros, d'occupação domestica … natural desta freguesia" — de
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal).
    Os passaportes de emigração de 1880 de Ponta Delgada de seus netos também os
    descrevem como "filho de João Moniz Bettencourt e Maria Jacinta" (corroboração
    secundária, apenas uma pista).
profile: >-
  ## Identity

  **Maria Jacintha de Medeiros** (Brazilianised variant "Maria Jacinta"). [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); Portuguese (Açorean). [PROVEN]

  - **Occupation:** doméstica ("d'occupação domestica", PAR-0015). [PROVEN]

  - **Spouse:** João Muniz Bytancourt (P-0048), proprietário of Mãe de Deus (family
  F-0023). [PROVEN]

  - **Child:** Manoel Muniz Bytancourt (P-0042), through whom she is the paternal
  grandmother of the immigrant João Muniz Bittencourt (P-0019). [PROVEN]

  - **Birth and death:** undocumented; a late-18th-century birth is implied. [OPEN]

  ## Family and social network

  Wife of João Muniz Bytancourt (P-0048) and mother of Manoel (P-0042). The couple are
  named as paternal grandparents in the 1845 baptism of Manoel's children (PAR-0022) and in
  Manoel's 1866 death (PAR-0015). Her grandsons' 1880 Ponta Delgada emigration passports
  style them "filho de João Moniz Bettencourt e Maria Jacinta" — a secondary corroboration
  held as a lead only. [LEAD]

  ## Open questions

  - Her own baptism, marriage and death (Mãe de Deus, pre-1818) — would name her parents;
  the pre-1818 books are not digitised online. [OPEN]

  ## Sources held (this repository)

  - PAR-0015 (her son Manoel's 1866 Povoação death — names her doméstica, "natural desta
  freguesia") · PAR-0022 (the 1845 baptism of Manoel's children — paternal grandmother).

  ## Regional and migration context

  A native of the Povoação seat parish, São Miguel, and a São Miguel root of the Muniz
  trunk; no move is documented for her. [CONTEXTUAL] The Atlantic crossing belongs to her
  grandsons' generation, about 1866–1870.
profile_pt: >-
  ## Identidade

  **Maria Jacintha de Medeiros** (variante abrasileirada "Maria Jacinta"). [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); portuguesa (açoriana). [PROVEN]

  - **Ocupação:** doméstica ("d'occupação domestica", PAR-0015). [PROVEN]

  - **Cônjuge:** João Muniz Bytancourt (P-0048), proprietário de Mãe de Deus (família
  F-0023). [PROVEN]

  - **Filho:** Manoel Muniz Bytancourt (P-0042), por meio de quem é a avó paterna do
  imigrante João Muniz Bittencourt (P-0019). [PROVEN]

  - **Nascimento e óbito:** não documentados; um nascimento no final do século XVIII é
  sugerido. [OPEN]

  ## Família e rede social

  Esposa de João Muniz Bytancourt (P-0048) e mãe de Manoel (P-0042). O casal é nomeado como
  avós paternos no batismo de 1845 dos filhos de Manoel (PAR-0022) e no óbito de 1866 de
  Manoel (PAR-0015). Os passaportes de emigração de 1880 de Ponta Delgada de seus netos os
  descrevem como "filho de João Moniz Bettencourt e Maria Jacinta" — uma corroboração
  secundária mantida apenas como pista. [LEAD]

  ## Questões em aberto

  - Seu próprio batismo, casamento e óbito (Mãe de Deus, anteriores a 1818) — nomeariam seus
  pais; os livros anteriores a 1818 não estão digitalizados online. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0015 (o óbito de 1866 em Povoação de seu filho Manoel — nomeia-a doméstica, "natural
  desta freguesia") · PAR-0022 (o batismo de 1845 dos filhos de Manoel — avó paterna).

  ## Contexto regional e migratório

  Uma nativa da freguesia-sede de Povoação, São Miguel, e uma raiz micaelense do tronco
  Muniz; nenhuma mudança está documentada para ela. [CONTEXTUAL] A travessia atlântica
  pertence à geração de seus netos, por volta de 1866–1870.
