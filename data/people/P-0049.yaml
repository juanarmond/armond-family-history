notes:
- text: >-
    Mother of Manoel Muniz Bytancourt (P-0042); hence the paternal grandmother of
    João Muniz Bittencourt (P-0019). Named, with her husband João Muniz Bytancourt
    (P-0048), in her son Manoel's 1866 death (PAR-0015) as "Maria Jacintha de
    Medeiros, d'occupação domestica … natural desta freguesia" — of Nossa Senhora
    Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal). Her grandsons'
    1880 Ponta Delgada emigration passports also style them "filho de João Moniz
    Bettencourt e Maria Jacinta" (secondary corroboration, a lead only).
  text_pt: >-
    Mãe de Manoel Muniz Bytancourt (P-0042); portanto, a avó paterna de João
    Muniz Bittencourt (P-0019). Nomeada, junto com seu marido João Muniz
    Bytancourt (P-0048), no óbito de 1866 do filho Manoel (PAR-0015) como "Maria
    Jacintha de Medeiros, d'occupação domestica … natural desta freguesia" — de
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal).
    Os passaportes de emigração de 1880 de Ponta Delgada de seus netos também os
    descrevem como "filho de João Moniz Bettencourt e Maria Jacinta" (corroboração
    secundária, apenas uma pista).
