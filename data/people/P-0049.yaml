profile: >-
  ## Interesting facts

  - **[PROVEN]** She was recorded as a "doméstica" (domestic/homemaker) in her son Manoel's 1866 death register — alongside her husband João's "proprietário" status (PAR-0015). The occupation gap between spouses is a documentary convention of the period: she managed the household while he held the land, but the record gives her standing only through his.

  - **[PROVEN]** Her 1819 marriage record (PAR-0037) names her parents: João de Medeiros Brandão (P-0084) × Maria Eugenia (P-0085). A scribe later misapplied her mother's name "Eugenia" to Maria Jacintha herself in the 1842 act — a naming confusion that persisted for years until corrected by the 1819 marriage.

  - **[CONTEXTUAL]** Her surname Medeiros is one of the recurring family names of the Mãe de Deus parish at Povoação — consistent with the endogamous, inward-facing community where the same surnames recur across generations. She was marrying within the same closed parish network as her husband, perpetuating the social structure of a land-scarce island.

  - **[INFERRED]** She and her husband João (P-0048) are together the documented top of the family's Azorean land base — a proprietário couple whose small holding was divided among their children under partible inheritance, including their son Manoel (P-0042), who in turn had eight children. Three generations of partible division on a smallholding could not keep the family on the island.

  - **[CONTEXTUAL]** The Medeiros surname on São Miguel is associated with specific clusters within the island. Her parents' own origins may eventually trace back to those geographic clusters, following the pattern of endogamous communities that married within tight geographic and family networks across Azorean parish life.

  ## Identity

  **Maria Jacintha de Medeiros** (Brazilianised variant "Maria Jacinta"; recorded "Maria
  Eugenia" in the 1842 act by conflation with her mother's name). [PROVEN]

  - **Parents:** João de Medeiros Brandão (P-0084) × Maria Eugenia (P-0085), family F-0041 —
  named in her 7 October 1819 marriage (PAR-0037). [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); Portuguese (Açorean). [PROVEN]

  - **Occupation:** doméstica ("d'occupação domestica", PAR-0015). [PROVEN]

  - **Spouse:** João Muniz Bytancourt (P-0048), proprietário of Mãe de Deus (family
  F-0023); married 7 October 1819 (PAR-0037). [PROVEN]

  - **Child:** Manoel Muniz Bytancourt (P-0042), through whom she is the paternal
  grandmother of the immigrant João Muniz Bittencourt (P-0019). [PROVEN]

  - **Birth and death:** undocumented; a late-18th-century birth is implied. [OPEN]

  ## Standing and profession

  - **Doméstica** [PROVEN] — her son Manoel's 1866 death act records her "d'occupação
  domestica", alongside her husband the *proprietário*, both *naturaes desta freguesia*
  (PAR-0015). That is the standard register description of a married woman running a
  landholding peasant household; it names work, not independent standing.

  - **No honorific and no independent property recorded** [PROVEN absence] — she is never
  written *Dona* in the Povoação acts, and no property, office or transaction of her own
  appears in any held record. The absence is noted here as deliberate, not as an unsearched
  gap.

  - **Literacy not recorded** [OPEN] — no signature of hers survives in the held images; the
  Povoação formularies do not call for one from the parents or the bride.

  ## Family and social network

  Wife of João Muniz Bytancourt (P-0048) and mother of Manoel (P-0042). The couple are
  named as paternal grandparents in the 1845 baptism of Manoel's children (PAR-0022) and in
  Manoel's 1866 death (PAR-0015). A further son, Agostinho (b. 13 April 1843, bapt. 23 April
  1843), is documented by his own 1843 Mãe de Deus baptism (PAR-0044), which names her "Maria
  Jacintha de Medeiros" and both grandparent couples. Her grandsons' 1880 Ponta Delgada
  emigration passports style them "filho de João Moniz Bettencourt e Maria Jacinta" — a
  secondary corroboration held as a lead only. [LEAD]

  ## What we can extrapolate

  *Proportionate to an ancestress documented in her 1819 marriage, her children's baptisms
  and her son's 1866 death act.*

  **1. The female half of a landholding peasant household, with no standing of her own
  [PROVEN / INFERRED].** She is *doméstica* beside her *proprietário* husband (PAR-0015),
  never written *Dona*, and no property, office or transaction of hers appears in any held
  record. **[INFERRED]** Her position was entirely defined by the marriage; the heritable
  capital in the household was her husband's land, and she had no separate claim to signal.

  **2. Her childbearing is the mechanism, stated without blame [PROVEN / CONTEXTUAL].** At
  least eight of her children are documented by act between 1822 and 1843 — Manoel, an
  unnamed son, Michaelina, Rosa, Damaso, Francisco, José and Agostinho (PAR-0051, PAR-0038
  to PAR-0044) — twenty-one years of childbearing. **[CONTEXTUAL]** In a partible-succession
  society a large surviving family and a small holding are the same problem: every
  additional heir is another division of the same ground. Her son Manoel then repeated the
  pattern with eight surviving children of his own (PAR-0015), and two consecutive eight-way
  splits are what emptied the family's land base within two generations.

  **3. Her name was never stable, and that is a class fact [PROVEN / INFERRED].** The
  registers write her *Maria Jacintha de Medeiros* (PAR-0037), *Maria Jacinta de Silveiros*
  (PAR-0040), plainly *Maria Jacintha* (PAR-0038, PAR-0042, PAR-0043), and in 1842 her son's
  marriage substitutes her own mother's given name for hers — "Maria Euginia [Eugenia] de
  Medeiros" (PAR-0024). **[INFERRED]** Clerks recorded women's names from what the family
  said in the room, with no document to check against. A person whose name the parish could
  rewrite at will is a person with no paper identity of her own — the inverse of Dona
  Mathilde Maria de Jesus on the other side of the owner's tree, whose name is fixed across
  sixty years of deeds, inventories and court filings (P-0027).

  **4. Her name was also not unique, and that too is structural [PROVEN / CONTEXTUAL].** Her
  sister-in-law — a daughter of Manoel Muniz Bitancourt the elder (P-0082) and Tereza do
  Amaral (P-0083) — bore exactly the same name, *Maria Jacintha de Medeiros*, and married in
  the same church ten months before her (PAR-0048). The two women must never be merged.
  **[CONTEXTUAL]** Two brides of identical name in one small parish in consecutive years is
  what an endogamous marriage market running on a handful of surnames produces, and it is
  the same closure that later required a fourth-degree dispensation for her son's marriage
  (PAR-0024).

  **Synthesis.** What she and her husband held was land plus rooted parish belonging, and
  she personally held only the second of the two. **[INFERRED]** Belonging cost nothing and
  was real — and it was the one asset that could not be carried. Her great-grandson João
  (P-0019) had to rebuild it from scratch in Brazil by marrying into the Rego Brandão
  household, which is the clearest measure of what it had been worth.

  ## Open questions

  - Her own baptism and death (Mãe de Deus) — her 1819 marriage and parents are now
  documented (PAR-0037); the pre-1818 baptism books are not digitised online. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (her own 7 October 1819 Mãe de Deus marriage — names her and her parents) ·
  PAR-0015 (her son Manoel's 1866 Povoação death — names her doméstica, "natural desta
  freguesia") · PAR-0022 (the 1845 baptism of Manoel's children — paternal grandmother) ·
  PAR-0044 (her son Agostinho's 1843 baptism — names her "Maria Jacintha de Medeiros" and
  both grandparent couples).

  ## Regional and migration context

  A native of the Povoação seat parish, São Miguel, and a São Miguel root of the Muniz
  trunk; no move is documented for her. [CONTEXTUAL] The Atlantic crossing belongs to her
  grandsons' generation, between 1866 and 1882 (most plausibly near 1880; see P-0019).

  ## Where to go today

  - **Marriage (7 Oct 1819) and children's baptisms:** Igreja Matriz de N.S. da Mãe de
  Deus, Vila da Povoação, São Miguel, Açores, PT (GPS 37.74891, −25.24372) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Foi registrada como "doméstica" no registro de óbito de 1866 de seu filho Manoel — ao lado da condição de "proprietário" de seu marido João (PAR-0015). A diferença de ocupação entre cônjuges é uma convenção documental do período: ela geria o lar enquanto ele detinha a terra, mas o registro lhe concede posição apenas por meio dele.

  - **[PROVEN]** Seu registro de casamento de 1819 (PAR-0037) nomeia seus pais: João de Medeiros Brandão (P-0084) × Maria Eugenia (P-0085). Um escrivão mais tarde aplicou erroneamente à Maria Jacintha o nome de sua mãe "Eugenia" no ato de 1842 — uma confusão de nomes que persistiu por anos até ser corrigida pelo casamento de 1819.

  - **[CONTEXTUAL]** Seu sobrenome Medeiros é um dos nomes de família recorrentes da freguesia de Mãe de Deus, em Povoação — coerente com a comunidade endogâmica e voltada para dentro, onde os mesmos sobrenomes reaparecem por gerações. Ela se casava dentro da mesma rede paroquial fechada de seu marido, perpetuando a estrutura social de uma ilha pobre em terra.

  - **[INFERRED]** Ela e seu marido João (P-0048) são, juntos, o topo documentado da base fundiária açoriana da família — um casal de proprietários cujo pequeno lote foi dividido entre os filhos pela herança partível, incluindo seu filho Manoel (P-0042), que por sua vez teve oito filhos. Três gerações de divisão partível sobre um minifúndio não conseguiram manter a família na ilha.

  - **[CONTEXTUAL]** O sobrenome Medeiros em São Miguel está associado a agrupamentos específicos dentro da ilha. As origens dos próprios pais dela podem eventualmente remeter a esses agrupamentos geográficos, seguindo o padrão de comunidades endogâmicas que se casavam dentro de redes geográficas e familiares estreitas ao longo da vida paroquial açoriana.

  ## Identidade

  **Maria Jacintha de Medeiros** (variante abrasileirada "Maria Jacinta"; registrada "Maria
  Eugenia" no ato de 1842 por confusão com o nome de sua mãe). [PROVEN]

  - **Pais:** João de Medeiros Brandão (P-0084) × Maria Eugenia (P-0085), família F-0041 —
  nomeados em seu casamento de 7 de outubro de 1819 (PAR-0037). [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); portuguesa (açoriana). [PROVEN]

  - **Ocupação:** doméstica ("d'occupação domestica", PAR-0015). [PROVEN]

  - **Cônjuge:** João Muniz Bytancourt (P-0048), proprietário de Mãe de Deus (família
  F-0023); casaram-se em 7 de outubro de 1819 (PAR-0037). [PROVEN]

  - **Filho:** Manoel Muniz Bytancourt (P-0042), por meio de quem é a avó paterna do
  imigrante João Muniz Bittencourt (P-0019). [PROVEN]

  - **Nascimento e óbito:** não documentados; um nascimento no final do século XVIII é
  sugerido. [OPEN]

  ## Posição social e profissão

  - **Doméstica** [PROVEN] — o assento de óbito de 1866 de seu filho Manoel a registra
  "d'occupação domestica", ao lado do marido *proprietário*, ambos *naturaes desta
  freguesia* (PAR-0015). É a descrição corrente, nos registros, de uma mulher casada que
  tocava uma casa camponesa com terras; nomeia trabalho, não posição independente.

  - **Nenhum tratamento honorífico e nenhuma propriedade própria registrada** [PROVEN na
  ausência] — nunca é escrita *Dona* nos atos da Povoação, e nenhum bem, cargo ou negócio
  seu aparece em qualquer registro que tenhamos. A ausência fica aqui anotada como
  deliberada, e não como lacuna por pesquisar.

  - **Alfabetização não registrada** [OPEN] — nenhuma assinatura sua sobrevive nas imagens
  que temos; os formulários da Povoação não a exigem dos pais nem da noiva.

  ## Família e rede social

  Esposa de João Muniz Bytancourt (P-0048) e mãe de Manoel (P-0042). O casal é nomeado como
  avós paternos no batismo de 1845 dos filhos de Manoel (PAR-0022) e no óbito de 1866 de
  Manoel (PAR-0015). Um outro filho, Agostinho (n. 13 de abril de 1843, bat. 23 de abril de
  1843), está documentado por seu próprio batismo de 1843 em Mãe de Deus (PAR-0044), que a
  nomeia "Maria Jacintha de Medeiros" e a ambos os casais de avós. Os passaportes de emigração
  de 1880 de Ponta Delgada de seus netos os descrevem como "filho de João Moniz Bettencourt e
  Maria Jacinta" — uma corroboração secundária mantida apenas como pista. [LEAD]

  ## O que podemos extrapolar

  *Proporcional a uma ancestral documentada em seu casamento de 1819, nos batismos de seus
  filhos e no assento de óbito de 1866 de seu filho.*

  **1. A metade feminina de uma casa camponesa com terras, sem posição própria [PROVEN /
  INFERRED].** É *doméstica* ao lado do marido *proprietário* (PAR-0015), nunca escrita
  *Dona*, e nenhum bem, cargo ou negócio seu aparece em registro algum que tenhamos.
  **[INFERRED]** Sua posição era inteiramente definida pelo casamento; o capital herdável da
  casa era a terra do marido, e ela não tinha pretensão separada a sinalizar.

  **2. Sua fecundidade é o mecanismo, dito sem culpa [PROVEN / CONTEXTUAL].** Pelo menos
  oito de seus filhos estão documentados por ato entre 1822 e 1843 — Manoel, um filho sem
  nome legível, Michaelina, Rosa, Damaso, Francisco, José e Agostinho (PAR-0051, PAR-0038 a
  PAR-0044) — vinte e um anos de partos. **[CONTEXTUAL]** Numa sociedade de sucessão
  partilhável, família numerosa sobrevivente e propriedade pequena são o mesmo problema:
  cada herdeiro a mais é outra divisão do mesmo chão. Seu filho Manoel repetiu depois o
  padrão, com oito filhos vivos próprios (PAR-0015), e duas partilhas em oito consecutivas
  foram o que esvaziou a base fundiária da família em duas gerações.

  **3. Seu nome nunca foi estável, e isso é um fato de classe [PROVEN / INFERRED].** Os
  registros a escrevem *Maria Jacintha de Medeiros* (PAR-0037), *Maria Jacinta de Silveiros*
  (PAR-0040), simplesmente *Maria Jacintha* (PAR-0038, PAR-0042, PAR-0043) e, em 1842, o
  casamento de seu filho substitui o prenome dela pelo da própria mãe dela — "Maria Euginia
  [Eugenia] de Medeiros" (PAR-0024). **[INFERRED]** Os escrivães anotavam nomes de mulheres
  a partir do que a família dizia ali, sem documento a conferir. Uma pessoa cujo nome a
  paróquia podia reescrever à vontade é uma pessoa sem identidade em papel — o inverso de
  Dona Mathilde Maria de Jesus, do outro lado da árvore do proprietário do repositório, cujo
  nome é fixo ao longo de sessenta anos de escrituras, inventários e petições judiciais
  (P-0027).

  **4. Seu nome também não era único, e isso igualmente é estrutural [PROVEN /
  CONTEXTUAL].** Sua cunhada — filha de Manoel Muniz Bitancourt, o velho (P-0082), e de
  Tereza do Amaral (P-0083) — chamava-se exatamente *Maria Jacintha de Medeiros* e casou-se
  na mesma igreja dez meses antes dela (PAR-0048). As duas mulheres jamais devem ser
  fundidas. **[CONTEXTUAL]** Duas noivas de nome idêntico numa freguesia pequena, em anos
  consecutivos, é o que produz um mercado matrimonial endogâmico girando sobre um punhado de
  sobrenomes — o mesmo fechamento que mais tarde exigiu dispensa de quarto grau para o
  casamento de seu filho (PAR-0024).

  **Síntese.** O que ela e o marido tinham era terra mais pertencimento enraizado à
  freguesia, e ela pessoalmente tinha apenas o segundo dos dois. **[INFERRED]** O
  pertencimento nada custava e era real — e era o único bem que não podia ser levado. Seu
  bisneto João (P-0019) teve de reconstruí-lo do zero no Brasil, casando-se com a casa dos
  Rego Brandão, o que é a medida mais clara de quanto ele valia.

  ## Questões em aberto

  - Seu próprio batismo e óbito (Mãe de Deus) — seu casamento de 1819 e seus pais estão agora
  documentados (PAR-0037); os livros de batismo anteriores a 1818 não estão digitalizados
  online. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (seu próprio casamento de 7 de outubro de 1819 em Mãe de Deus — nomeia a ela e a
  seus pais) · PAR-0015 (o óbito de 1866 em Povoação de seu filho Manoel — nomeia-a doméstica,
  "natural desta freguesia") · PAR-0022 (o batismo de 1845 dos filhos de Manoel — avó paterna)
  · PAR-0044 (o batismo de 1843 de seu filho Agostinho — a nomeia "Maria Jacintha de Medeiros"
  e a ambos os casais de avós).

  ## Contexto regional e migratório

  Uma nativa da freguesia-sede de Povoação, São Miguel, e uma raiz micaelense do tronco
  Muniz; nenhuma mudança está documentada para ela. [CONTEXTUAL] A travessia atlântica
  pertence à geração de seus netos, entre 1866 e 1882 (mais plausivelmente por volta de
  1880; ver P-0019).

