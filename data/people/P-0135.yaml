    [PROVEN as records]. The link to Rosa's mother is strong evidence, not proven, for
    the reasons on F-0067 and PAR-0101/PAR-0102. Modelled on the owner's authorisation
    of 2026-10-10.
  text_pt: >-
    Mãe de Maria Thereza de Jesus (P-0053) [STRONG], portanto avó materna de Rosa
    Eugenia de Lemos (P-0035) e hexavó do dono do arquivo (P-0001) pela linha Bohrer de
    sua mãe (P-0001 → P-0003 → P-0007 → P-0015 → P-0030 → P-0035 → P-0053 → P-0135;
    Ahnentafel 247). Conhecida apenas como avó, nomeada ao lado de José Campello de
    Moraes (P-0134, família F-0067) nos batismos de 1821 e 1841, em Itaboraí, de três
    filhos de Manoel de Lemos Pereira e Maria Thereza [PROVEN como registros]. O
    vínculo com a mãe de Rosa é evidência forte, não prova, pelas razões dadas em
    F-0067 e em PAR-0101/PAR-0102. Modelada com a autorização do dono de 2026-10-10.
- text: >-
    Not the same woman as Emmerenciana Maria de Jesus (P-0022), the Engrácio/Guimarães
    line ancestor of the late nineteenth century: a different line, generation and
    place. The name was very common at Itaboraí — the retrieval side reports several
    namesakes there married to other men (Floriano José Freire, Simpliciano Nunes
    Vieira, Bento Caldeira de Oliveira and others) [LEAD] — so attach no record to her
    without her husband or a Lemos/Campello relative in it.
  text_pt: >-
    Não é a mesma mulher que Emmerenciana Maria de Jesus (P-0022), ancestral da linha
    Engrácio/Guimarães do fim do século XIX: outra linha, outra geração, outro lugar. O
    nome era muito comum em Itaboraí — a pesquisa de recuperação relata ali várias
    homônimas casadas com outros homens (Floriano José Freire, Simpliciano Nunes
    Vieira, Bento Caldeira de Oliveira e outros) [LEAD] —, de modo que não se lhe deve
    atribuir registro sem o marido ou um parente Lemos/Campello nele.
