profile: >-
  ## Identity

  **Liliosa Paz Armond**, Juan's paternal great-grandmother and the **Paz** side of
  the line. "Paz" is her maiden/family surname, carried by both of her sons. Her name
  is firmly attested across three records (CIV-0002, CIV-0003, GOV-0001). [PROVEN]

  - **Birth:** birthplace **Eugenópolis, MG** — her son Geraldo's 1952 marriage records
  her as "nascida aqui" (i.e. at Eugenópolis), and his 1991 óbito gives her as "natural
  do M.G." (CIV-0002, CIV-0003). Her exact birth date is unknown. [PROVEN place; OPEN
  date]

  - **Marriage:** married **Aristão Ferreira Armond** (P-0008); the marriage act is not
  held. [OPEN]

  - **Death:** **16 April 1946**, at Eugenópolis, MG — stated in her son Geraldo's 1952
  marriage certificate (CIV-0002, "falecida em 16-4-946"), not in her own óbito. [PROVEN
  as recorded]

  - **Parents:** **UNKNOWN** — the entire Paz family is undocumented in this repository.
  [OPEN]

  - **Children:** **Geraldo Paz Armond** (P-0004) and **José Olavo Armond** (P-0018),
  both carrying the "Paz" surname that confirms her maternity. [PROVEN]

  ## Family and social network

  She married into the Armond line through Aristão; her own Paz kin are unidentified.
  Her name is independently confirmed by the 1973 driver-dossier index for her son José
  Olavo, which records her as "Liliosa Paz Armond" (GOV-0001). [PROVEN]

  ## What we can extrapolate

  - **Her documentary silence is itself class evidence** [INFERRED]. She appears in no
  inventário, land record or estate proceeding — only as a named parent and spouse on her
  descendants' certificates. That contrasts with the landed Toledo women a generation or two
  up the Armond side, who surface repeatedly precisely because they held property that
  generated probate paper. A woman who leaves no estate trail is a woman with no land or
  capital to divide, consistent with a family already at non-propertied status by her
  generation — she married Aristão, the pivot of the Armond decline (see P-0008). For a rural
  woman of the declining working class the absence of records is the expected footprint, not
  merely a coverage gap.

  - **The "Paz" surname is the only lead into her origin** [INFERRED]. Combined with her
  Eugenópolis/Limeira death and MG birth, her family reads as a Zona-da-Mata Paz line — a
  targeted search space rather than a blank. Nothing held indicates the Paz family carried
  land or title; on present evidence they read as a modest Mata family into which Aristão —
  himself by then landless — married as a social equal. [INFERRED — thin; the 1946 óbito
  would test it]

  - Her death (1946) in MG while her sons' lives were shifting toward Rio suggests she may
  have remained on the family's last Zona-da-Mata base (Eugenópolis) while the men urbanized —
  a small texture point, not load-bearing. [INFERRED]

  A research lead not yet confirmed: a "Ferreira Paz / de Sousa Paz" family appears uniquely in
  her home Muriaé comarca (a 1897 Muriaé inventário of Olímpio de Sousa Paz and children), the
  neighbouring comarcas holding only unrelated Paz lines — so if her Paz kin are to be found,
  that cluster is the strongly-localized space to test. Liliosa is not named among its known
  heirs, so the connection is unproven. [LEAD — not promoted]

  ## Open questions

  - Her parents and the Paz family — the single decisive record is the **Eugenópolis
  1946 óbito** (inteiro teor), which should name her parents. [OPEN]

  - Her exact birth date. [OPEN]

  - Her marriage act to Aristão. [OPEN]

  ## Sources held (this repository)

  - CIV-0002 — her son Geraldo's 1952 marriage (her Eugenópolis birthplace and her 16
  April 1946 death).

  - CIV-0003 — Geraldo's 1991 death (names her as his mother, "natural do M.G.",
  deceased).

  - GOV-0001 — 1973 driver-dossier index for her son José Olavo (records her as
  "Liliosa Paz Armond").
profile_pt: >-
  ## Identidade

  **Liliosa Paz Armond**, bisavó paterna de Juan e o lado **Paz** da linha. "Paz" é seu
  sobrenome de solteira/de família, levado por ambos os seus filhos. Seu nome está
  firmemente atestado em três registros (CIV-0002, CIV-0003, GOV-0001). [PROVEN]

  - **Nascimento:** local de nascimento **Eugenópolis, MG** — o casamento de 1952 de
  seu filho Geraldo a registra como "nascida aqui" (isto é, em Eugenópolis), e o óbito
  dele de 1991 a indica como "natural do M.G." (CIV-0002, CIV-0003). Sua data exata de
  nascimento é desconhecida. [PROVEN quanto ao local; OPEN quanto à data]

  - **Casamento:** casou-se com **Aristão Ferreira Armond** (P-0008); o assento de
  casamento não foi obtido. [OPEN]

  - **Óbito:** **16 de abril de 1946**, em Eugenópolis, MG — declarado na certidão de
  casamento de 1952 de seu filho Geraldo (CIV-0002, "falecida em 16-4-946"), não em seu
  próprio óbito. [PROVEN as recorded]

  - **Pais:** **DESCONHECIDOS** — toda a família Paz está indocumentada neste
  repositório. [OPEN]

  - **Filhos:** **Geraldo Paz Armond** (P-0004) e **José Olavo Armond** (P-0018), ambos
  levando o sobrenome "Paz" que confirma sua maternidade. [PROVEN]

  ## Família e rede social

  Casou-se com a linha Armond por meio de Aristão; seus próprios parentes Paz são
  desconhecidos. Seu nome é confirmado de forma independente pelo índice de prontuário
  de motorista de 1973 de seu filho José Olavo, que a registra como "Liliosa Paz Armond"
  (GOV-0001). [PROVEN]

  ## O que podemos extrapolar

  - **Seu silêncio documental é, em si, evidência de classe** [INFERRED]. Ela não aparece em
  nenhum inventário, registro de terra ou processo de espólio — apenas como mãe e cônjuge
  nomeada nas certidões de seus descendentes. Isso contrasta com as mulheres Toledo
  proprietárias de terra uma ou duas gerações acima, do lado Armond, que surgem repetidamente
  justamente por deterem bens que geravam papelada de inventário. Uma mulher que não deixa
  rastro de espólio é uma mulher sem terra ou capital a partilhar, condizente com uma família
  já em condição não proprietária em sua geração — casou-se com Aristão, o pivô do declínio
  Armond (ver P-0008). Para uma mulher rural da classe trabalhadora em declínio, a ausência de
  registros é o rastro esperado, e não apenas uma lacuna de cobertura.

  - **O sobrenome "Paz" é a única pista sobre sua origem** [INFERRED]. Combinado com sua morte
  em Eugenópolis/Limeira e nascimento em Minas, sua família se lê como uma linha Paz da Zona da
  Mata — um espaço de busca delimitado, e não um vazio. Nada em mãos indica que a família Paz
  tivesse terra ou título; pela evidência atual, leem-se como uma família modesta da Mata na
  qual Aristão — ele próprio já sem terra — casou-se como igual social. [INFERRED — tênue; o
  óbito de 1946 o testaria]

  - Sua morte (1946) em Minas, enquanto a vida dos filhos se deslocava rumo ao Rio, sugere que
  ela pode ter permanecido na última base da família na Zona da Mata (Eugenópolis) enquanto os
  homens se urbanizavam — um pequeno detalhe de textura, não decisivo. [INFERRED]

  Uma pista de pesquisa ainda não confirmada: uma família "Ferreira Paz / de Sousa Paz" aparece
  exclusivamente em sua comarca natal de Muriaé (um inventário de Muriaé de 1897, de Olímpio de
  Sousa Paz e filhos), enquanto as comarcas vizinhas trazem apenas linhas Paz não aparentadas —
  de modo que, se seus parentes Paz houverem de ser achados, esse núcleo é o espaço fortemente
  localizado a testar. Liliosa não é nomeada entre seus herdeiros conhecidos, portanto a ligação
  é não comprovada. [LEAD — não promovido]

  ## Questões em aberto

  - Seus pais e a família Paz — o único registro decisivo é o **óbito de 1946 de
  Eugenópolis** (inteiro teor), que deveria nomear seus pais. [OPEN]

  - Sua data exata de nascimento. [OPEN]

  - Seu assento de casamento com Aristão. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0002 — casamento de 1952 de seu filho Geraldo (seu local de nascimento,
  Eugenópolis, e seu óbito em 16 de abril de 1946).

  - CIV-0003 — óbito de 1991 de Geraldo (a nomeia como sua mãe, "natural do M.G.",
  falecida).

  - GOV-0001 — índice de prontuário de motorista de 1973 de seu filho José Olavo (a
  registra como "Liliosa Paz Armond").
