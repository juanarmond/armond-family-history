- text: >-
    Ahnentafel position 9. Died 16 April 1946, per her son Geraldo's 1952 marriage
    (CIV-0002, "Liliosa Paz ... nascida aqui, falecida em 16-4-946"); the same
    record gives her birthplace as Eugenópolis, MG. Her original surname and parents
    remain unresolved — the next step is the Eugenópolis 1946 óbito (inteiro teor),
    which would name her parents.
  text_pt: >-
    Posição 9 no Ahnentafel. Falecida em 16 de abril de 1946, conforme o casamento
    de 1952 de seu filho Geraldo (CIV-0002, "Liliosa Paz ... nascida aqui, falecida
    em 16-4-946"); o mesmo registro indica seu local de nascimento como Eugenópolis,
    MG. Seu sobrenome original e seus pais permanecem indefinidos — o próximo passo é
    o óbito de 1946 de Eugenópolis (inteiro teor), que nomearia seus pais.
