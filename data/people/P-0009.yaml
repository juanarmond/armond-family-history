profile: >-
  ## Interesting facts

  - **[INFERRED]** Her documentary silence — she appears only as a named parent on her descendants' certificates, never in an estate, land record or court proceeding — is itself class evidence: women who appear in those records held property worth dividing. Her absence is the expected archive footprint of a family already at non-propertied status by the time she married Aristão.

  - **[CONTEXTUAL]** She was born and died in Eugenópolis, Minas Gerais — a Zona da Mata município in the coffee-frontier hinterland — while her sons' lives shifted toward Rio de Janeiro. She may have remained on the family's last Zona da Mata base while the next generation urbanised.

  - **[INFERRED]** Her surname "Paz" is the only lead into her origin: a "Ferreira Paz / de Sousa Paz" family cluster appears in the Muriaé comarca (an 1897 inventário), and no other Paz line is documented in nearby comarcas — giving a strongly localised search space if her parentage is ever researched.

  - **[PROVEN]** She died 16 April 1946 at Eugenópolis, MG (CIV-0002) — four years before Brazil's first national minimum wage had fully bedded in, and before the CSN's steel production began in earnest. Her sons' migration to Volta Redonda happened after her death; she never saw the industrial city.

  - **[CONTEXTUAL]** Civil registration became mandatory in Brazil from 1889; by 1916 it was standard practice. Yet no civil birth, baptism or marriage record is held for Liliosa. This is consistent with a rural, non-propertied Zona da Mata woman of her generation — her paper trail begins and ends with her role as a named parent in other people's records.

  ## Identity

  **Liliosa Paz Armond**, Juan's paternal great-grandmother and the **Paz** side of
  the line. "Paz" is her maiden/family surname, carried by both of her sons. Her name
  is firmly attested across three records (CIV-0002, CIV-0003, GOV-0001). [PROVEN]

  - **Birth:** birthplace **Eugenópolis, MG** — her son Geraldo's 1952 marriage records
  her as "nascida aqui" (i.e. at Eugenópolis), and his 1991 óbito gives her as "natural
  do M.G." (CIV-0002, CIV-0003). Her exact birth date is unknown. [PROVEN place; OPEN
  date]

  - **Marriage:** married **Aristão Ferreira Armond** (P-0008); the marriage act is not
  held. [OPEN]

  - **Death:** **16 April 1946**, at Eugenópolis, MG — stated in her son Geraldo's 1952
  marriage certificate (CIV-0002, "falecida em 16-4-946"), not in her own óbito. [PROVEN
  as recorded]

  - **Parents:** **UNKNOWN** — the entire Paz family is undocumented in this repository.
  [OPEN]

  - **Children:** six in total with Aristão — **Geraldo Paz Armond** (P-0004) and
  **José Olavo Armond** (P-0018) are primary-confirmed (both carry the "Paz" surname
  confirming her maternity). The other four — Maria Aparecida Armond de Oliveira
  (d.~2000), Lucia, Marina, and Otavia — appear on the FS Family Tree but none has a
  held birth or death record; all were searched exhaustively across the full FS ecosystem
  (Sources, Memories, record-matches, constrained and unconstrained personas) with a
  clean bounded-negative result. [PROVEN for Geraldo + José Olavo; LEAD for the
  remaining four; bounded-negative 2026-09-11]

  ## Standing and profession

  - **No occupation, office, property or literacy is recorded for her in any held
  source.** She is named only as a mother and wife, on her sons' records (CIV-0002,
  CIV-0003, GOV-0001, NWS-0001). [OPEN — the Eugenópolis 1946 óbito would be the first
  record made about her in her own right]

  - The courtesy "d. [dona] Liliosa Paz Armond" in the 1975 marriage bann for her son
  (NWS-0001) is a conventional form of address in Brazilian print of the period, not a
  marker of rank. [CONTEXTUAL]

  ## Family and social network

  She married into the Armond line through Aristão; her own Paz kin are unidentified.
  Her name is independently confirmed by the 1973 driver-dossier index for her son José
  Olavo, which records her as "Liliosa Paz Armond" (GOV-0001). [PROVEN] A 1975 newspaper
  marriage-banns notice (*O Processo* Nº 42, Cons. Lafaiete MG) for José Olavo also names
  her — "*filho de Aristão Ferreira Armond e de d. Liliosa Paz Armond*" — a second typed
  government-era attestation of her name (found 2026-09-11 via the parents' FS Memories
  tab). [secondary attestation, not yet catalogued as a standalone source]

  ## What we can extrapolate

  Liliosa's evidence is thin, and this reading is kept proportionate to it. But the thinness is
  itself the finding: she stands exactly one generation after a woman whose property generated
  four decades of court paper, and she generated none.

  - **Her documentary silence is class evidence, not a coverage gap** [INFERRED]. She appears in no
  inventário, land record, deed or estate proceeding — only as a named parent and spouse on her
  descendants' records (CIV-0002, CIV-0003, GOV-0001, NWS-0001). Set that against her mother-in-law
  Eliza Balbina de Toledo (P-0017), who surfaces in an 1879 heir list, an 1881 partilha folio, an
  1884 petition and a c.1919 payment folio — because she had property worth dividing. A woman who
  leaves no estate trail is a woman with nothing to divide. Two women in the same family, one
  generation apart, with opposite archive footprints: that contrast is the most economical statement
  of where the Armond descent had reached by her marriage.

  - **The marriage strategy that had built the family's standing stopped with her** [INFERRED]. The
  previous generation's Armond–Toledo marriage brought land, however encumbered and however late
  (see P-0016, P-0017). Nothing in the held records suggests the Paz match brought property; on
  present evidence it reads as a marriage between equals at the level Aristão — by then landless
  himself — had reached. It is a lateral match, not the upward one his father made. This is an
  inference from absence, and the Eugenópolis 1946 óbito would test it: if her parents turn out to
  have been propertied, the reading changes.

  - **Nothing is documented about her literacy, occupation or property** [OPEN]. No held record gives
  her an occupation, and no signature of hers survives. That is the expected footprint of a rural
  married woman of her generation and class rather than proof of anything about her, but it means
  the education thread — which tracked the money down this line — cannot be traced through her at
  all.

  - **Her whole documented life sits in one município** [PROVEN; reading INFERRED]. She was born at
  Eugenópolis ("nascida aqui", CIV-0002) and died there on 16 April 1946, while her sons' lives moved
  to Rio de Janeiro: Geraldo married at Eugenópolis in 1952 and died at Volta Redonda in 1991
  (CIV-0003), José Olavo was resident in Rio by 1975 (NWS-0001). Her husband Aristão died at Volta
  Redonda in 1957 (CIV-0005). The family's move out of the Zona da Mata therefore falls after her
  death — she may have been the household's last anchor to the region, though no held record says so.
  [INFERRED]

  - **She never saw the industrial city the family ended in** [PROVEN dates; CONTEXTUAL]. She died in
  1946, before the CSN at Volta Redonda had properly begun producing and before the post-war wave
  that carried Minas labour into the Rio industrial belt. The urbanization that defines her sons'
  generation happened entirely after her.

  A research lead not yet confirmed: a "Ferreira Paz / de Sousa Paz" family appears uniquely in her
  home Muriaé comarca (an 1897 Muriaé inventário of Olímpio de Sousa Paz and children), the
  neighbouring comarcas holding only unrelated Paz lines — so if her Paz kin are to be found, that
  cluster is the strongly localized space to test. Liliosa is not named among its known heirs, so
  the connection is unproven. [LEAD — not promoted]

  ## Open questions

  - Her parents and the Paz family — the single decisive record is the **Eugenópolis
  1946 óbito** (inteiro teor), which should name her parents. [OPEN]

  - Her exact birth date. [OPEN]

  - Her marriage act to Aristão. [OPEN]

  ## Sources held (this repository)

  - CIV-0002 — her son Geraldo's 1952 marriage (her Eugenópolis birthplace and her 16
  April 1946 death).

  - CIV-0003 — Geraldo's 1991 death (names her as his mother, "natural do M.G.",
  deceased).

  - GOV-0001 — 1973 driver-dossier index for her son José Olavo (records her as
  "Liliosa Paz Armond").

  ## Regional and migration context

  Her whole documented life sits in **Eugenópolis, Minas Gerais**, in the coffee-frontier
  **Zona da Mata Mineira** — born there ("nascida aqui", CIV-0002) and dead there on 16
  April 1946. No held record places her outside Minas Gerais. The family's move to the
  Rio de Janeiro industrial belt (her husband died at Volta Redonda in 1957, CIV-0005;
  her son José Olavo was resident in Rio by 1975, NWS-0001) falls entirely after her
  death. [PROVEN places; the sequencing INFERRED]

  ## Where to go today

  - **Death (16 Apr 1946):** Cartório RCPN de Eugenópolis, MG (Centro; tel (32)
  3724-1834) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Registro%20Civil%2C%20Eugenopolis%2C%20MG),
  and the Matriz São Sebastião de Eugenópolis, Praça João XXIII 145 [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Joao%20XXIII%20145%2C%20Eugenopolis%2C%20MG)

  - **Lived:** the Eugenópolis–Rosário da Limeira corridor, Zona da Mata, MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Eugenopolis%2C%20MG); the best
  Paz-origin lead (the 1897 Muriaé inventário) points to the Muriaé comarca — records at
  the Fórum/cartórios de Muriaé [RESOLVED for the comarca] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=-21.1308577,-42.3684826)
profile_pt: >-
  ## Fatos interessantes

  - **[INFERRED]** Seu silêncio documental — ela aparece apenas como mãe nomeada nas certidões de seus descendentes, nunca em inventário, registro de terra ou processo judicial — é, em si, evidência de classe: as mulheres que aparecem nesses registros detinham bens que valiam a pena dividir. A ausência dela é o rastro de arquivo esperado de uma família já em condição não proprietária no momento em que se casou com Aristão.

  - **[CONTEXTUAL]** Nasceu e faleceu em Eugenópolis, Minas Gerais — município do interior cafeeiro da Zona da Mata — enquanto a vida dos filhos se deslocava rumo ao Rio de Janeiro. Ela pode ter permanecido na última base da família na Zona da Mata enquanto a geração seguinte se urbanizava.

  - **[INFERRED]** Seu sobrenome "Paz" é a única pista sobre sua origem: um grupo familiar "Ferreira Paz / de Sousa Paz" aparece na comarca de Muriaé (inventário de 1897), e nenhuma outra linha Paz está documentada nas comarcas vizinhas — fornecendo um espaço de busca fortemente localizado caso sua filiação venha a ser pesquisada.

  - **[PROVEN]** Faleceu em 16 de abril de 1946 em Eugenópolis, MG (CIV-0002) — quatro anos antes de o primeiro salário mínimo nacional do Brasil ter se consolidado plenamente, e antes de a produção de aço da CSN começar de fato. A migração dos filhos para Volta Redonda ocorreu após sua morte; ela nunca conheceu a cidade industrial.

  - **[CONTEXTUAL]** O registro civil tornou-se obrigatório no Brasil a partir de 1889; em 1916 já era prática corrente. Mesmo assim, não há registro civil de nascimento, batismo ou casamento para Liliosa. Isso é condizente com uma mulher rural, não proprietária, da Zona da Mata de sua geração — seu rastro documental começa e termina com seu papel de mãe nomeada nos registros de outras pessoas.

  ## Identidade

  **Liliosa Paz Armond**, bisavó paterna de Juan e o lado **Paz** da linha. "Paz" é seu
  sobrenome de solteira/de família, levado por ambos os seus filhos. Seu nome está
  firmemente atestado em três registros (CIV-0002, CIV-0003, GOV-0001). [PROVEN]

  - **Nascimento:** local de nascimento **Eugenópolis, MG** — o casamento de 1952 de
  seu filho Geraldo a registra como "nascida aqui" (isto é, em Eugenópolis), e o óbito
  dele de 1991 a indica como "natural do M.G." (CIV-0002, CIV-0003). Sua data exata de
  nascimento é desconhecida. [PROVEN quanto ao local; OPEN quanto à data]

  - **Casamento:** casou-se com **Aristão Ferreira Armond** (P-0008); o assento de
  casamento não foi obtido. [OPEN]

  - **Óbito:** **16 de abril de 1946**, em Eugenópolis, MG — declarado na certidão de
  casamento de 1952 de seu filho Geraldo (CIV-0002, "falecida em 16-4-946"), não em seu
  próprio óbito. [PROVEN as recorded]

  - **Pais:** **DESCONHECIDOS** — toda a família Paz está indocumentada neste
  repositório. [OPEN]

  - **Filhos:** seis no total com Aristão — **Geraldo Paz Armond** (P-0004) e **José
  Olavo Armond** (P-0018) são confirmados por documentos primários (ambos levam o
  sobrenome "Paz" que confirma sua maternidade). Os outros quatro — Maria Aparecida
  Armond de Oliveira (f.~2000), Lucia, Marina e Otavia — constam da Árvore Genealógica
  FS, mas nenhum tem registro de nascimento ou óbito em mãos; todos foram buscados de
  forma exaustiva em todo o ecossistema FS (Fontes, Memórias, correspondências de
  registros, personas com e sem restrição de pais) com resultado de negativo delimitado.
  [PROVEN para Geraldo + José Olavo; LEAD para os outros quatro; negativo delimitado
  2026-09-11]

  ## Posição social e profissão

  - **Nenhuma ocupação, cargo, bem ou letramento está registrado para ela em qualquer
  fonte em mãos.** Ela é nomeada apenas como mãe e esposa, nos registros de seus filhos
  (CIV-0002, CIV-0003, GOV-0001, NWS-0001). [OPEN — o óbito de 1946 em Eugenópolis seria
  o primeiro registro feito sobre ela em nome próprio]

  - O tratamento "d. [dona] Liliosa Paz Armond" no edital de proclamas de 1975 de seu
  filho (NWS-0001) é forma convencional de tratamento na imprensa brasileira do período,
  não um marcador de posição social. [CONTEXTUAL]

  ## Família e rede social

  Casou-se com a linha Armond por meio de Aristão; seus próprios parentes Paz são
  desconhecidos. Seu nome é confirmado de forma independente pelo índice de prontuário
  de motorista de 1973 de seu filho José Olavo, que a registra como "Liliosa Paz Armond"
  (GOV-0001). [PROVEN] Um edital de proclamas de casamento de 1975 (*O Processo* Nº 42,
  Cons. Lafaiete MG) de José Olavo também a nomeia — "*filho de Aristão Ferreira Armond e
  de d. Liliosa Paz Armond*" — uma segunda atestação datilografada de seu nome (encontrada
  em 2026-09-11 via aba Memórias do FamilySearch dos pais). [atestação secundária, ainda
  não catalogada como fonte autônoma]

  ## O que podemos extrapolar

  As evidências sobre Liliosa são escassas, e esta leitura é mantida proporcional a elas. Mas a
  escassez é, ela própria, o achado: ela está exatamente uma geração depois de uma mulher cujo
  patrimônio gerou quatro décadas de papelada judicial, e não gerou nenhuma.

  - **Seu silêncio documental é evidência de classe, não lacuna de cobertura** [INFERRED]. Ela não
  aparece em nenhum inventário, registro de terra, escritura ou processo de espólio — apenas como mãe
  e cônjuge nomeada nos registros de seus descendentes (CIV-0002, CIV-0003, GOV-0001, NWS-0001).
  Compare-se isso com sua sogra Eliza Balbina de Toledo (P-0017), que emerge numa lista de herdeiros
  de 1879, numa folha de partilha de 1881, numa petição de 1884 e numa folha de pagamento de c.1919 —
  porque tinha bens que valia a pena dividir. Uma mulher que não deixa rastro de espólio é uma mulher
  sem nada a partilhar. Duas mulheres da mesma família, com uma geração de diferença e rastros de
  arquivo opostos: esse contraste é a formulação mais econômica de onde a descendência Armond havia
  chegado quando ela se casou.

  - **A estratégia matrimonial que construíra a posição da família parou nela** [INFERRED]. O casamento
  Armond–Toledo da geração anterior trouxe terra, por mais onerada e por mais tardia que fosse (ver
  P-0016, P-0017). Nada nos registros em mãos sugere que o enlace Paz tenha trazido bens; pela
  evidência atual, lê-se como casamento entre iguais no patamar a que Aristão — a essa altura já sem
  terra — havia chegado. É um casamento lateral, não o ascendente que o pai dele fizera. Trata-se de
  inferência a partir de ausência, e o óbito de 1946 em Eugenópolis a testaria: se os pais dela se
  revelarem proprietários, a leitura muda.

  - **Nada está documentado sobre seu letramento, sua ocupação ou seus bens** [OPEN]. Nenhum registro
  em mãos lhe atribui ocupação, e nenhuma assinatura sua sobrevive. Esse é o rastro esperado de uma
  mulher rural casada, de sua geração e classe, e não prova de coisa alguma a respeito dela; mas
  significa que o fio da instrução — que nesta linha acompanhou o dinheiro — não pode ser traçado por
  meio dela.

  - **Toda a sua vida documentada cabe em um município** [PROVEN; leitura INFERRED]. Nasceu em
  Eugenópolis ("nascida aqui", CIV-0002) e ali faleceu em 16 de abril de 1946, enquanto a vida dos
  filhos se deslocava para o Rio de Janeiro: Geraldo casou-se em Eugenópolis em 1952 e morreu em Volta
  Redonda em 1991 (CIV-0003); José Olavo residia no Rio em 1975 (NWS-0001). Seu marido Aristão morreu
  em Volta Redonda em 1957 (CIV-0005). A saída da família da Zona da Mata, portanto, é posterior à
  morte dela — ela pode ter sido a última âncora da casa na região, embora nenhum registro em mãos o
  diga. [INFERRED]

  - **Ela nunca viu a cidade industrial em que a família foi parar** [datas PROVEN; CONTEXTUAL].
  Faleceu em 1946, antes de a CSN em Volta Redonda ter de fato começado a produzir e antes da onda do
  pós-guerra que levou mão de obra mineira para o cinturão industrial do Rio. A urbanização que define
  a geração de seus filhos aconteceu inteiramente depois dela.

  Uma pista de pesquisa ainda não confirmada: uma família "Ferreira Paz / de Sousa Paz" aparece
  exclusivamente em sua comarca natal de Muriaé (um inventário de Muriaé de 1897, de Olímpio de Sousa
  Paz e filhos), enquanto as comarcas vizinhas trazem apenas linhas Paz não aparentadas — de modo que,
  se seus parentes Paz houverem de ser achados, esse núcleo é o espaço fortemente localizado a testar.
  Liliosa não é nomeada entre seus herdeiros conhecidos, portanto a ligação é não comprovada. [LEAD —
  não promovido]

  ## Questões em aberto

  - Seus pais e a família Paz — o único registro decisivo é o **óbito de 1946 de
  Eugenópolis** (inteiro teor), que deveria nomear seus pais. [OPEN]

  - Sua data exata de nascimento. [OPEN]

  - Seu assento de casamento com Aristão. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0002 — casamento de 1952 de seu filho Geraldo (seu local de nascimento,
  Eugenópolis, e seu óbito em 16 de abril de 1946).

  - CIV-0003 — óbito de 1991 de Geraldo (a nomeia como sua mãe, "natural do M.G.",
  falecida).

  - GOV-0001 — índice de prontuário de motorista de 1973 de seu filho José Olavo (a
  registra como "Liliosa Paz Armond").

  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se em **Eugenópolis, Minas Gerais**, na **Zona da
  Mata Mineira**, fronteira cafeeira — nascida ali ("nascida aqui", CIV-0002) e ali
  falecida em 16 de abril de 1946. Nenhum registro em mãos a situa fora de Minas Gerais.
  A mudança da família para o cinturão industrial do Rio de Janeiro (o marido faleceu em
  Volta Redonda em 1957, CIV-0005; o filho José Olavo residia no Rio em 1975, NWS-0001)
  é inteiramente posterior à morte dela. [lugares PROVEN; a sequência é INFERRED]

