profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Anna Clara já fallecida" — already deceased — in her daughter's 1840 Nova Friburgo marriage act, establishing she died before June 1840. (PAR-0076)

  - **[CONTEXTUAL]** Her maiden surname was not recorded in the 1840 act — a common omission for a deceased mother when her maiden name was unknown to the officiating priest. A collaborative-tree form suggests "Anna Clara Reheis" as a possible name, but this is a lead only and not attested in any held record.

  - **[LEAD / OPEN]** She is not documented as emigrating to Nova Friburgo. A ship-records receipt
  places the Storck household (Jacob Storck as head) aboard the *Caroline* arriving NF 3 May 1824,
  but whether Anna Clara was part of that voyage is not stated. She may have died before the voyage
  or remained in Blödesheim; her daughter Elisabeth arriving in NF around 1824 does not itself
  confirm Anna Clara emigrated. Exact date and place of death remain open.

  - **[CONTEXTUAL]** As a member of a German family from Hessen-Darmstadt settling in a Swiss-founded colony, her household reflects the mixed character of the Nova Friburgo immigrant community. Her early death — before her only documented daughter's 1840 marriage — left a daughter who reached the altar without a living mother.

  ## Identity

  **Anna Clara** — the mother of Elisabeth/Isabel Storck (P-0110), named "Anna Clara já fallecida"
  (already deceased) in her daughter's 1840 Nova Friburgo marriage (PAR-0076, family F-0061), so
  she was deceased by June 1840. [STRONG-EVIDENCE] A direct ancestor of Iris Bohrer Muniz (P-0007)
  five generations up (a 3×-great-grandmother), via Elisabeth Storck → Maria Joanna Rutschmann
  (P-0037) → Lucinda (P-0031) → Celina (P-0015). The family is German (her daughter was born in
  Germany); her own birthplace is not stated, so her nationality is left unset. [CONTEXTUAL]

  ## Open questions

  - Her maiden surname — the 1840 act gives none; the collaborative-tree form "Anna Clara Reheis"
  is a lead only, not asserted here. [LEAD / OPEN]

  - Her own birth, death and origin records — no held primary. [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (her daughter Elisabeth's 1840 Nova Friburgo marriage — the sole held record naming
  her, as "Anna Clara já fallecida").
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada "Anna Clara já fallecida" no assento de casamento de sua filha em 1840 em Nova Friburgo, estabelecendo que faleceu antes de junho de 1840. (PAR-0076)

  - **[CONTEXTUAL]** Seu sobrenome de solteira não foi registrado no assento de 1840 — omissão comum para uma mãe falecida quando seu nome de solteira era desconhecido do padre celebrante. Uma árvore colaborativa sugere "Anna Clara Reheis" como nome possível, mas isso é apenas uma pista e não está atestado em nenhum documento disponível.

  - **[LEAD / OPEN]** Não está documentada como emigrante para Nova Friburgo. Um recibo de
  registros de navio situa a família Storck (Jacob Storck como chefe de domicílio) no navio
  *Caroline* chegando a NF em 3 de maio de 1824, mas não é afirmado se Anna Clara estava nessa
  viagem. É possível que tenha falecido antes da viagem ou permanecido em Blödesheim; a chegada
  de sua filha Elisabeth a NF por volta de 1824 não confirma por si só que Anna Clara emigrou.
  Data e local exatos de falecimento permanecem em aberto.

  - **[CONTEXTUAL]** Como membro de uma família alemã de Hessen-Darmstadt que se estabeleceu numa colônia de fundação suíça, seu grupo familiar reflete o caráter misto da comunidade imigrante de Nova Friburgo. Sua morte precoce — antes do casamento em 1840 da única filha documentada — deixou uma filha que chegou ao altar sem mãe viva.

  ## Identidade

  **Anna Clara** — mãe de Elisabeth/Isabel Storck (P-0110), nomeada "Anna Clara já fallecida" no
  casamento de 1840 da filha em Nova Friburgo (PAR-0076, família F-0061), portanto já falecida em
  junho de 1840. [STRONG-EVIDENCE] Uma ancestral direta de Iris Bohrer Muniz (P-0007) cinco
  gerações acima (3×-bisavó), por Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda
  (P-0031) → Celina (P-0015). A família é alemã (a filha nasceu na Alemanha); o próprio local de
  nascimento dela não é declarado, de modo que sua nacionalidade fica em branco. [CONTEXTUAL]

  ## Questões em aberto

  - Seu sobrenome de solteira — o ato de 1840 não fornece nenhum; a forma de árvore colaborativa
  "Anna Clara Reheis" é apenas uma pista, não afirmada aqui. [LEAD / OPEN]

  - Seus próprios registros de nascimento, óbito e origem — nenhum primário disponível. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0076 (o casamento de 1840 da filha Elisabeth em Nova Friburgo — o único registro disponível
  que a nomeia, como "Anna Clara já fallecida").
