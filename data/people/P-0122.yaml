notes:
- text: >-
    Mother of Elisabeth/Isabel Storck (P-0110); named "Anna Clara já fallecida" (already deceased) in her daughter's 1840 Nova Friburgo marriage (PAR-0076), family F-0061 — so deceased by June 1840. The record gives no maiden surname; the collaborative-tree form "Anna Clara Reheis" is a [LEAD] only, not asserted here. German family (daughter born in Germany); nationality unset.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Four words are her entire record: "**Anna Clara já fallecida**". Her daughter's
  1840 Nova Friburgo marriage act names her, marks her dead, and gives her no surname, no date
  and no place. She was deceased by 23 June 1840 and that is the one fact established about her.
  (PAR-0076)

  - **[CONTEXTUAL]** The missing maiden surname is a convention, not a mystery. Nova Friburgo
  marriage acts of this period routinely omitted a deceased mother's family name, particularly
  when nobody present at the ceremony could supply it. The gap is the register's, not her
  family's.

  - **[LEAD]** Collaborative trees give her as "Anna Clara **Reheis**". That form appears in no
  held record and is not adopted here; the archive keeps her under the given names the act
  supplies.

  - **[LEAD / OPEN]** She is not documented as having emigrated. A secondary transcription
  places the Storck household — with Jacob Storck as head — aboard the *Caroline*, arriving at
  Nova Friburgo on 3 May 1824, but says nothing about whether Anna Clara was on that voyage. She
  may have died in Blödesheim before it, or on the way, or in Brazil between 1824 and 1840. Her
  daughter's arrival does not establish hers.

  ## Identity

  **Anna Clara** — the deceased mother of Elisabeth (Isabel) Storck (P-0110), named in her
  daughter's 1840 Nova Friburgo marriage act. Iris Bohrer Muniz's (P-0007) 3×-great-grandmother,
  by the chain Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva
  (P-0031) → Celina Bohrer (P-0015). [PROVEN that she is named; degree derived from the family
  links]

  - **Named in one record:** PAR-0076, 23 June 1840, as "de Anna Clara já fallecida", wife of
  "Tiago Storck"; family F-0061. [PROVEN]

  - **Maiden surname:** not recorded. The collaborative form "Reheis" is a lead only and is not
  asserted. [OPEN]

  - **Death:** before 23 June 1840. No date, place or cause given. [PROVEN for the bracket only]

  - **Birth, origin, nationality:** undocumented. The family is German — her daughter was
  "nascida e baptizada na Allemanha" — but nothing is stated about her own birthplace, so
  nationality is left unset. [OPEN by decision]

  ## Standing and profession

  Nothing. She appears in a subordinate clause of one sentence, as a dead wife. No occupation,
  residence, property, literacy or signature exists for her in any source held here, and none
  would be expected in a record of this kind.

  ## Family and social network

  Her documented relationships are two: to Jacob Storck (P-0121), who survived her and was
  apparently alive in June 1840, and to her daughter Elisabeth, who married the Swiss immigrant
  João José Rutschmann at the Matriz de São João Baptista, Nova Friburgo, on 23 June 1840.
  [PROVEN — PAR-0076] Her daughter therefore came to the altar without a living mother — a
  pattern repeated three times over in this group of profiles, and a plain consequence of the
  mortality the colonisation carried with it.

  ## What we can extrapolate

  - **[CONTEXTUAL]** Her family was German, from the Rhineland/Hessen countryside that the 1824
  Nova Friburgo intake drew on — a region left poor by the Napoleonic wars, hit by the harvest
  failures of 1816–17, and short of land for the next generation. The Brazilian government's
  agent Georg Anton Schäffer recruited there and some eighty families arrived on 3–4 May 1824.

  - **[INFERRED]** Whether she was part of that migration is genuinely open, and the honest
  answer matters more than a tidy one. Her daughter's presence in Brazil proves nothing about
  her: she could have died before the voyage, during it, or in the colony at any point up to
  1840. The bracket is wide and should stay wide.

  - **[CONTEXTUAL]** Her death before her daughter's 1840 marriage is the point at which the
  Storck maternal line stops in this archive, and it stops for the ordinary reason: a clerk
  wrote a dead woman's given names and nothing else. Recovering her surname requires a German
  register, not a better reading of the Brazilian one.

  ## Open questions

  - Her maiden surname, absent from the only record that names her. The "Reheis" form is a
  collaborative-tree lead, not evidence. A Blödesheim baptism for her daughter, naming both
  parents, would supply it. [LEAD / OPEN]

  - Her birth, origin and date of death — no record held, and even the country of her death is
  undetermined. [OPEN]

  - Whether she emigrated at all. The *Caroline* transcription names her husband as household
  head and is silent about her. [LEAD / OPEN]

  - Her nationality, left unset on purpose because no held record states where she was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0076** — her daughter Elisabeth's 1840 Nova Friburgo marriage act to João José
  Rutschmann; the sole held record naming her, and then only as "Anna Clara já fallecida", wife
  of Tiago (Jacob) Storck.

  ## Regional and migration context

  The German families who joined Nova Friburgo came in a second scheme, five years after the
  Swiss founding cohort: recruited by Georg Anton Schäffer after Brazilian independence, some
  eighty families arrived on 3–4 May 1824 and built the town's Lutheran congregation.
  [CONTEXTUAL] They left a countryside impoverished by war and failed harvests and arrived to
  the same stony, undersized highland lots that had already disappointed the Swiss; many
  dispersed within a generation. [CONTEXTUAL] What a held record establishes about this family
  is only what the 1840 act says: a German-born daughter, resident in the parish of São João
  Baptista, married there with her father named and her mother dead. [PROVEN]

  ## Where to go today

  - **Evangelische Laurentiuskirche, Hochborn (historic Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Rheinhessen, Germany · [Maps](https://maps.google.com/?q=49.7239,8.2008). The
  reported Storck origin parish; renamed Hochborn in 1971, the church still stands. An entry
  here for her daughter's baptism, around 1812, would name her and might give her surname.
  [APPROX — the Blödesheim origin is a LEAD]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  daughter married in June 1840, in the act that is her only trace. The present cathedral was
  inaugurated in 1869; the act belongs to the earlier church on the same site. [RESOLVED]

  - **No burial place is known — and the country is not even settled.** She died before June
  1840, and whether that was in Germany, in transit or in Brazil is undetermined. There is no
  site any evidence connects to her. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Quatro palavras são todo o seu registro: "**Anna Clara já fallecida**". O
  assento de casamento de sua filha, em 1840, em Nova Friburgo, nomeia-a, marca-a como morta e
  não lhe dá sobrenome, data nem lugar. Estava falecida em 23 de junho de 1840, e esse é o único
  fato estabelecido a seu respeito. (PAR-0076)

  - **[CONTEXTUAL]** O sobrenome de solteira ausente é uma convenção, não um mistério. Os
  assentos de casamento de Nova Friburgo daquele período omitiam rotineiramente o nome de
  família de uma mãe falecida, sobretudo quando ninguém presente à cerimônia podia informá-lo. A
  lacuna é do livro, não da família dela.

  - **[LEAD]** Árvores colaborativas a apresentam como "Anna Clara **Reheis**". Essa forma não
  aparece em nenhum documento retido e não é adotada aqui; o arquivo a mantém sob os prenomes
  que o ato fornece.

  - **[LEAD / OPEN]** Não há documentação de que ela tenha emigrado. Uma transcrição secundária
  situa o domicílio Storck — com Jacob Storck como chefe — a bordo do *Caroline*, chegado a Nova
  Friburgo em 3 de maio de 1824, mas nada diz sobre a presença de Anna Clara nessa viagem. Ela
  pode ter morrido em Blödesheim antes dela, no caminho, ou no Brasil entre 1824 e 1840. A
  chegada da filha não estabelece a dela.

  ## Identidade

  **Anna Clara** — mãe falecida de Elisabeth (Isabel) Storck (P-0110), nomeada no assento de
  casamento da filha, em 1840, em Nova Friburgo. Tetravó de Iris Bohrer Muniz (P-0007), pela
  cadeia Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva
  (P-0031) → Celina Bohrer (P-0015). [PROVEN que é nomeada; grau derivado dos vínculos
  familiares]

  - **Nomeada em um registro:** PAR-0076, 23 de junho de 1840, como "de Anna Clara já
  fallecida", esposa de "Tiago Storck"; família F-0061. [PROVEN]

  - **Sobrenome de solteira:** não registrado. A forma colaborativa "Reheis" é apenas pista e
  não é afirmada. [OPEN]

  - **Óbito:** antes de 23 de junho de 1840. Nenhuma data, lugar ou causa indicada. [PROVEN
  apenas quanto ao intervalo]

  - **Nascimento, origem e nacionalidade:** não documentados. A família é alemã — a filha era
  "nascida e baptizada na Allemanha" —, mas nada se declara sobre o local de nascimento dela
  própria, de modo que a nacionalidade fica em aberto. [OPEN por decisão]

  ## Posição social e profissão

  Nada. Ela aparece numa oração subordinada de uma única frase, como esposa morta. Não existe
  para ela, em qualquer fonte retida aqui, ocupação, residência, propriedade, alfabetização ou
  assinatura — nem se esperaria qualquer delas num documento desse tipo.

  ## Família e rede social

  Suas relações documentadas são duas: com Jacob Storck (P-0121), que lhe sobreviveu e estava
  aparentemente vivo em junho de 1840, e com a filha Elisabeth, que se casou com o imigrante
  suíço João José Rutschmann na Matriz de São João Baptista, em Nova Friburgo, em 23 de junho de
  1840. [PROVEN — PAR-0076] A filha, portanto, chegou ao altar sem mãe viva — padrão que se
  repete três vezes neste conjunto de perfis, e consequência direta da mortalidade que a
  colonização trouxe consigo.

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Sua família era alemã, do campo renano-hessiano de onde saiu a entrada de
  1824 para Nova Friburgo — região empobrecida pelas guerras napoleônicas, atingida pelas
  quebras de safra de 1816–17 e sem terra para a geração seguinte. O agente do governo
  brasileiro Georg Anton Schäffer recrutou ali, e cerca de oitenta famílias chegaram em 3–4 de
  maio de 1824.

  - **[INFERRED]** Se ela fez parte dessa migração é questão genuinamente aberta, e a resposta
  honesta importa mais do que uma resposta arrumada. A presença da filha no Brasil nada prova
  sobre ela: pode ter morrido antes da viagem, durante ela, ou na colônia em qualquer momento
  até 1840. O intervalo é largo e deve continuar largo.

  - **[CONTEXTUAL]** Sua morte antes do casamento da filha, em 1840, é o ponto em que a linha
  materna Storck para neste arquivo, e para pela razão mais ordinária: um escrivão escreveu os
  prenomes de uma mulher morta e nada mais. Recuperar seu sobrenome exige um livro alemão, não
  uma leitura melhor do brasileiro.

  ## Questões em aberto

  - Seu sobrenome de solteira, ausente do único registro que a nomeia. A forma "Reheis" é pista
  de árvore colaborativa, não evidência. Um batismo em Blödesheim para a filha, nomeando ambos
  os pais, o forneceria. [LEAD / OPEN]

  - Seu nascimento, sua origem e sua data de óbito — nenhum registro disponível, e nem mesmo o
  país de sua morte está determinado. [OPEN]

  - Se ela chegou a emigrar. A transcrição do *Caroline* nomeia o marido como chefe do domicílio
  e silencia sobre ela. [LEAD / OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — assento de casamento de 1840, em Nova Friburgo, da filha Elisabeth com João
  José Rutschmann; o único documento retido que a nomeia, e ainda assim apenas como "Anna Clara
  já fallecida", esposa de Tiago (Jacob) Storck.

  ## Contexto regional e migratório

  As famílias alemãs que se juntaram a Nova Friburgo vieram por um segundo programa, cinco anos
  após a coorte fundadora suíça: recrutadas por Georg Anton Schäffer depois da independência do
  Brasil, cerca de oitenta famílias chegaram em 3–4 de maio de 1824 e ergueram a congregação
  luterana da vila. [CONTEXTUAL] Deixaram um campo empobrecido pela guerra e pelas colheitas
  perdidas e chegaram aos mesmos lotes serranos pedregosos e exíguos que já haviam decepcionado
  os suíços; muitas se dispersaram em uma geração. [CONTEXTUAL] O que um documento retido
  estabelece sobre esta família é apenas o que diz o ato de 1840: uma filha nascida na Alemanha,
  moradora da freguesia de São João Baptista, ali casada, com o pai nomeado e a mãe morta.
  [PROVEN]

  ## Onde ir hoje

  - **Evangelische Laurentiuskirche, Hochborn (a histórica Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Renânia-Hessiana, Alemanha · [Mapa](https://maps.google.com/?q=49.7239,8.2008). A
  freguesia de origem relatada dos Storck; rebatizada Hochborn em 1971, a igreja continua de pé.
  Um assento ali para o batismo da filha, por volta de 1812, a nomearia e poderia dar seu
  sobrenome. [APPROX — a origem em Blödesheim é LEAD]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em junho de 1840, no ato que é seu único rastro. A catedral atual foi
  inaugurada em 1869; o ato pertence à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Nenhum lugar de sepultamento é conhecido — e nem o país está resolvido.** Morreu antes de
  junho de 1840, e se isso se deu na Alemanha, em trânsito ou no Brasil está indeterminado. Não
  há sítio que alguma evidência conecte a ela. [UNLOCATED]
