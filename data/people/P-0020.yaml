notes:
- text: Ahnentafel position 25.
- text: >-
    Her 1876 baptism (PAR-0005, event E-0035) records her born 20 August 1875 and
    baptized 22 March 1876, naming her parents José do Rego Brandão (P-0040) and
    Rita Ignacia de Jesus (P-0041), family F-0019 — the primary basis for that
    couple. Her married name "Rita" derives from her mother. She also appears as a
    parent in her son Deocleciano's 1892 baptism (E-0034). [Dates corrected 7 August
    2026 from PAR-0005 direct re-read: original transcription misread "vinte …
    setenta e cinco" as "onze … sessenta e cinco".]
- text: >-
    The original 1882 provision and the 1916 record of her son use materially
    different spellings. Both are preserved; no spelling is silently
    normalised.
