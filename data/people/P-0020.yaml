profile: >-
  ## Interesting facts

  - **[PROVEN]** She is recorded doing farm work in her own right. Her daughter Ritta's 1890 civil birth entry describes both parents as "**lavradores**, e moradores no lugar denominado Conceição nesta freguezia, e distante em [duas] leguas da Sede desta Cidade" (CIV-0041) — the couple farmed a locality roughly two leagues (about 13 km) outside the town of Sapucaia. It is the only record in this branch that states a woman's occupation as anything other than *doméstica*.

  - **[PROVEN]** She bore **eleven** children. Her husband's 1915 death act states he left "Onze [filhos], entre maiores e menores" (PAR-0007); five are documented by name — Anna (1884), Ritta (1890), Deocleciano (1892), Mercedes (~1898) and Joventina (~1899).

  - **[PROVEN]** The Muniz move from Sapucaia (RJ) to Carangola (MG) is datable through her children: Deocleciano was born and baptised at Sapucaia in 1892 (PAR-0004), while Joventina and Mercedes were "nascida e baptisada nesta Freguesia" of Carangola, aged 17 and 19 in 1916–17 (PAR-0013, PAR-0014). The family therefore crossed the state line between 1892 and about 1898.

  - **[PROVEN]** Her family sponsored the immigrant before absorbing him: her parents José do Rego Brandão and Rita Ignacia de Jesus stood as godparents to João Muniz Bittencourt's daughter Anna in 1885 (PAR-0006) — three years *after* Susanna's own 1882 marriage provision — and to other Muniz children besides. Godparenthood and marriage ran together, not in sequence, binding the two households twice over.

  - **[INFERRED]** By pure coincidence of surname, she married a man whose own Azorean great-grandfather was a **Brandão** — João de Medeiros Brandão of Povoação, São Miguel (P-0084, PAR-0037). The two Brandão families are unrelated: hers is a Paraíba do Sul *Rego* Brandão, his an island *Medeiros* Brandão, and no record connects them. They must never be merged.

  ## Identity

  **Susanna Rita Brondão** (also *Susana / Suzana*; *Rita / Ritta*; *Brandão*; married *Bittencourt*). A daughter of the Sapucaia Rego Brandão family who married the Azorean immigrant João Monis Bittencourt (P-0019). [PROVEN]

  - **Relationship:** paternal grandmother of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs Susanna → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derived from families F-0007 and F-0001]

  - **Parents:** José do Rego Brandão (P-0040) and Rita Ignacia de Jesus (P-0041) [PROVEN] — named in her own baptism (PAR-0005) and again, as both maternal grandparents, in her daughter Ritta's 1890 civil birth entry (CIV-0041). Her married-name element "Rita" descends from her mother.

  - **Maternal grandfather:** Antonio Caetano Machado (P-0045), named "avô materno" and a godfather at her baptism (PAR-0005).

  - **Birth and baptism:** born 20 August 1865, baptised 22 March 1866 [PROVEN] — a certidão of that baptism was presented to and copied into the Sapucaia register on 24 November 1882 (PAR-0005), a month before her marriage provision.

  - **Marriage:** to João Monis Bittencourt (P-0019), by provisão of 23 December 1882 directing the curate of Santo Antônio de Sapucaia to receive them in his matriz (PAR-0001).

  - **Children:** eleven at her husband's death (PAR-0007). Documented: Anna (b. 1884, bapt. 1885, PAR-0006; d. 1950 Guaçuí ES as Ana dos Santos Ferreira, CIV-0042); Ritta (b. 1890, CIV-0041); Deocleciano (P-0012, b./bapt. 1892, PAR-0004); Mercedes Maria (~1898, PAR-0014); Joventina (~1899, PAR-0013).

  - **Death:** **after 12 September 1915 and before 6 July 1950** [PROVEN as a bracket] — she survived João as his widow (PAR-0007), and her daughter Ana's 1950 death certificate records "Suzana Rita Brandão, falecida" (CIV-0042). No death record for her is held. [OPEN]

  - **A note on the birth year, resolved.** A 7 August 2026 edit read the baptism's decade as "setenta" (born 1875, bapt. 1876). That is chronologically impossible: she married by provisão in December 1882 and bore Anna on 19 November 1884 (PAR-0001, PAR-0006) — she cannot have been 7 and 9 years old. A direct image re-read on 11 August 2026 confirms the decade is "sessenta", giving **20 August 1865 / 22 March 1866**, which fits (married at 17, bore Anna at 19). An older reading of the day as "onze" (11) is likewise superseded by "vinte" (20). The reading history is preserved, not erased. [PROVEN]

  ## Standing and profession

  - **Lavradora** [PROVEN] — recorded with her husband as "lavradores" at Conceição, Sapucaia, in 1890 (CIV-0041). The term denotes working cultivators; it does not by itself state ownership, and no title, land register or inventário is held for the couple. [PROVEN for the occupation; ownership OPEN]

  - **Residence:** the locality of Conceição, in the Sapucaia freguesia, about two leagues from the town seat (CIV-0041) — rural, and far enough out that the parish was a day's business rather than a neighbour. Later, the Carangola district of Minas Gerais, where she was widowed in 1915 (PAR-0007) and where her daughters married (PAR-0013, PAR-0014).

  - **Honorific:** consistently "Dona" in the acts that name her — "Dona Suzana Rita … Brandão" (CIV-0041), "D. Suzana Rita Brandão" (PAR-0012, PAR-0013), "D. Suzana Rita Bittencourt" (PAR-0014). Standard courtesy for a married woman of the period rather than an index of rank. [INFERRED — the reading]

  - **Literacy:** undocumented. No held act carries her signature; she is never recorded either signing or signing *a rogo*. [OPEN — genuinely unclassifiable, not an inferred illiteracy]

  ## Family and social network

  Born into the Rego Brandão family of the Paraíba do Sul coffee valley, she is the point where the Azorean Muniz line fuses with a native household. Her parents' repeated role as godparents to the immigrant Muniz brothers' children in Sapucaia is the documented mechanism tying the two families (PAR-0006). She moved with the family from Sapucaia (RJ) to Carangola (MG), where she was widowed in 1915 and where her daughters Joventina and Mercedes married into local families (PAR-0013, PAR-0014).

  Her daughter Ana's household reached further still: Ana died in 1950 at Guaçuí, Espírito Santo (CIV-0042) — the Muniz descendants dispersing along the same Zona da Mata / Caparaó axis.

  ## What we can extrapolate

  **1. What the Brandão side brought was rootedness, and rootedness is capital that cannot be packed. [INFERRED / CONTEXTUAL]** No inventário, land title or property register survives for her parents; what they had was standing — the settled native household that newly arrived Azoreans asked to sponsor their children. For the propertyless immigrant João Muniz Bittencourt this was the one asset a newcomer cannot import: belonging in an established local family. But it has a hard limit that the family's own records expose. Social standing is place-specific. When the household left Sapucaia for Carangola in the 1890s, the land it did not own could not be lost — and neither could it be carried. Her father and mother arrive in Minas Gerais as strangers in their sixties and fifties; her own children marry into Carangola families, not Sapucaia ones. **Rootedness is the one form of capital that partible inheritance cannot fragment, and the one that a single move can destroy outright.**

  **2. Eleven children is the inheritance argument in a single number. [INFERRED / CONTEXTUAL]** Brazilian law divided an estate equally among all children. Even had this couple held a good plot at Conceição, an eleven-way partition would have left fractions too small to farm, and their children's children would have split those again. That no inventário exists for João or Susanna is consistent with there being nothing worth opening one over — and it means the household reproduced itself the way propertyless rural families did: by putting children out to labour and to marriage rather than by dividing land among them. The five daughters and sons we can trace all married locally or moved for work; none inherited a holding.

  **3. The record habits mark a rural family at the edge of the parish's reach — not a careless one. [INFERRED]** Her baptism is often read as "registered sixteen years late", but the better reading is institutional. Sapucaia was erected as a freguesia only in 1871 [CONTEXTUAL]; a child baptised in 1866 was therefore baptised under a predecessor parish, and when she came to marry in the new Sapucaia matriz in 1882 the certidão of that earlier act had to be presented and copied into the local book (PAR-0005). That is a parish boundary changing, not a family neglecting its papers. What the records *do* show is distance from clergy: she was baptised seven months after birth and her daughter Anna eight months after hers (PAR-0005, PAR-0006), whereas on São Miguel her husband's family baptised within ten days (PAR-0044). A household two leagues from the seat of a young Brazilian parish simply did not see a priest often. By 1890 the same household registered a newborn's civil birth within eight days (CIV-0041) — the new republican registry reached them faster than the church had.

  **4. Two Brandãos, two kinds of capital, one marriage. [INFERRED]** The coincidence of surnames is worth using rather than dismissing. Her husband's Azorean great-grandfather was also a Brandão (P-0084), and that family did hold land — a plot at Lomba do Botão, Povoação, with an estate inventory opened on his death in 1819. Divided across generations on a land-locked island, it ended by pushing his great-grandsons onto emigrant ships. Her own Brandãos held no land and instead held position. The two lines meet in her marriage in 1882: one family that had property and lost its sufficiency by division, one that never had property and traded in belonging. Neither could transmit anything to her eleven children but the ability to work and the people who would vouch for them.

  **5. Her fusion is the social precondition for everything after. [INFERRED]** She is the point at which the Azorean line stops being immigrant and becomes a Sapucaia-then-Carangola Brazilian family. Her son Deocleciano is the first man in this branch documented signing his own name (CIV-0006, 1916) and is recorded a *lavrador*; his son Antenor ends as an urban tradesman in Volta Redonda (CIV-0028, 2014). The arc she opens is not a decline from wealth — there was no wealth — but the slow conversion of a rural labouring household into an urban wage-earning one, with each generation's small gain (literacy, a district's worth of relatives) bought fresh rather than inherited.

  ## Open questions

  - Her death record (Carangola, MG, between 1915 and 1950) — not held; it would also give her age, hence an independent check on the 1865 birth. [OPEN]

  - Her parents' marriage (Sapucaia or its predecessor parish, before 1865) — would confirm her mother's maiden name against the married form and name her maternal grandmother. [OPEN]

  - A record-based count of her eleven children: six of the eleven are unidentified, and no inventário or probate has been located for either parent. [OPEN]

  ## Sources held (this repository)

  - PAR-0005 (her own baptism transcript — her parents and her maternal grandfather) · PAR-0001 (the 1882 marriage provisão).

  - CIV-0041 (her daughter Ritta's 1890 civil birth — records her as a *lavradora* at Conceição, Sapucaia, and names both grandparent couples) · PAR-0006 (her daughter Anna's 1885 baptism, with her own parents as godparents) · PAR-0004 (her son Deocleciano's 1892 baptism) · PAR-0013 / PAR-0014 (her daughters Joventina's and Mercedes's Carangola marriages).

  - PAR-0007 (her husband's 1915 death — names her as his widow and states eleven children) · CIV-0042 (her daughter Ana's 1950 death at Guaçuí, ES — records her as already deceased, closing the upper bracket on her own death).

  - PAR-0003, PAR-0012, CIV-0001 (her grandson's baptism and her son's religious and civil marriage) — all name her as mother or grandmother.

  ## Regional and migration context

  [CONTEXTUAL] Her life spans two Brazilian coffee regions and one internal migration. She was born and married in the **Paraíba do Sul valley** at Sapucaia (RJ), the older coffee zone that the Leopoldina Railway reached in the 1870s, and whose labour system was rebuilt after the Lei nº 581 de 1850 (Lei Eusébio de Queirós) ended the Atlantic slave trade and again after abolition in 1888 — the same transition that drew in the Azorean immigrants her family sponsored and one of whom she married. Between 1892 and about 1898 the household moved west into the **Zona da Mata Mineira** at Carangola, following the coffee frontier as it shifted off the exhausted Paraíba soils. No held record states a reason for the move; the driver is inferred from the regional history, not documented. [CONTEXTUAL] Land in both regions fell under the Lei de Terras (nº 601, 1850), which put it on a purchase basis — and no purchase, title or register is held for this family.

  ## Where to go today

  - **Born (1865/66 certidão) & married João (1882):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro, CEP 25880-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Farming household (1890):** the locality of Conceição, freguesia de Sapucaia, RJ — about two leagues from the town seat (CIV-0041) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Concei%C3%A7%C3%A3o%2C%20Sapucaia%2C%20RJ)

  - **Later home / widowed (1915):** Igreja Matriz de Santa Luzia, Carangola, MG (Praça Cel. Maximiano 138) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela está registrada exercendo trabalho agrícola em nome próprio. O assento civil de nascimento de sua filha Ritta, em 1890, descreve ambos os pais como "**lavradores**, e moradores no lugar denominado Conceição nesta freguezia, e distante em [duas] leguas da Sede desta Cidade" (CIV-0041) — o casal lavrava uma localidade a cerca de duas léguas (uns 13 km) fora da vila de Sapucaia. É o único registro deste ramo que declara a ocupação de uma mulher como algo diferente de *doméstica*.

  - **[PROVEN]** Teve **onze** filhos. O ato de óbito de seu marido, em 1915, declara que ele deixou "Onze [filhos], entre maiores e menores" (PAR-0007); cinco estão documentados pelo nome — Anna (1884), Ritta (1890), Deocleciano (1892), Mercedes (~1898) e Joventina (~1899).

  - **[PROVEN]** A mudança dos Muniz de Sapucaia (RJ) para Carangola (MG) é datável por seus filhos: Deocleciano nasceu e foi batizado em Sapucaia em 1892 (PAR-0004), ao passo que Joventina e Mercedes foram "nascida e baptisada nesta Freguesia" de Carangola, com 17 e 19 anos em 1916–17 (PAR-0013, PAR-0014). A família, portanto, cruzou a divisa entre 1892 e cerca de 1898.

  - **[PROVEN]** Sua família apadrinhou o imigrante antes de absorvê-lo: seus pais José do Rego Brandão e Rita Ignacia de Jesus foram padrinhos de Anna, filha de João Muniz Bittencourt, em 1885 (PAR-0006) — três anos *depois* da provisão de casamento de Susanna, em 1882 — e também de outros filhos Muniz. Apadrinhamento e casamento correram juntos, não em sequência, atando os dois lares em dobro.

  - **[INFERRED]** Por pura coincidência de sobrenome, casou-se com um homem cujo próprio bisavô açoriano era um **Brandão** — João de Medeiros Brandão, da Povoação, São Miguel (P-0084, PAR-0037). As duas famílias Brandão não têm parentesco: a dela é um *Rego* Brandão do Paraíba do Sul, a dele um *Medeiros* Brandão insular, e nenhum registro as liga. Jamais devem ser fundidas.

  ## Identidade

  **Susanna Rita Brondão** (também *Susana / Suzana*; *Rita / Ritta*; *Brandão*; de casada *Bittencourt*). Filha da família Rego Brandão de Sapucaia, casou-se com o imigrante açoriano João Monis Bittencourt (P-0019). [PROVEN]

  - **Parentesco:** avó paterna de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre Susanna → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derivado das famílias F-0007 e F-0001]

  - **Pais:** José do Rego Brandão (P-0040) e Rita Ignacia de Jesus (P-0041) [PROVEN] — nomeados em seu próprio batismo (PAR-0005) e de novo, como o casal de avós maternos, no assento civil de nascimento de sua filha Ritta, em 1890 (CIV-0041). O elemento "Rita" de seu nome de casada descende da mãe.

  - **Avô materno:** Antonio Caetano Machado (P-0045), nomeado "avô materno" e padrinho em seu batismo (PAR-0005).

  - **Nascimento e batismo:** nascida em 20 de agosto de 1865, batizada em 22 de março de 1866 [PROVEN] — uma certidão desse batismo foi apresentada e copiada no registro de Sapucaia em 24 de novembro de 1882 (PAR-0005), um mês antes de sua provisão de casamento.

  - **Casamento:** com João Monis Bittencourt (P-0019), por provisão de 23 de dezembro de 1882 que determinava ao cura de Santo Antônio de Sapucaia recebê-los em sua matriz (PAR-0001).

  - **Filhos:** onze ao falecimento do marido (PAR-0007). Documentados: Anna (n. 1884, bat. 1885, PAR-0006; f. 1950 em Guaçuí, ES, como Ana dos Santos Ferreira, CIV-0042); Ritta (n. 1890, CIV-0041); Deocleciano (P-0012, n./bat. 1892, PAR-0004); Mercedes Maria (~1898, PAR-0014); Joventina (~1899, PAR-0013).

  - **Óbito:** **após 12 de setembro de 1915 e antes de 6 de julho de 1950** [PROVEN como intervalo] — sobreviveu a João como viúva (PAR-0007), e a certidão de óbito de sua filha Ana, em 1950, registra "Suzana Rita Brandão, falecida" (CIV-0042). Nenhum registro de óbito dela é conservado. [OPEN]

  - **Nota sobre o ano de nascimento, resolvida.** Uma edição de 7 de agosto de 2026 leu a década do batismo como "setenta" (nascida em 1875, bat. 1876). Isso é cronologicamente impossível: ela se casou por provisão em dezembro de 1882 e teve Anna em 19 de novembro de 1884 (PAR-0001, PAR-0006) — não pode ter tido 7 e 9 anos. Uma releitura direta da imagem em 11 de agosto de 2026 confirma que a década é "sessenta", dando **20 de agosto de 1865 / 22 de março de 1866**, o que condiz (casou-se aos 17, teve Anna aos 19). Uma leitura mais antiga do dia como "onze" (11) também é superada por "vinte" (20). O histórico de leitura é preservado, não apagado. [PROVEN]

  ## Posição social e profissão

  - **Lavradora** [PROVEN] — registrada com o marido como "lavradores" em Conceição, Sapucaia, em 1890 (CIV-0041). O termo designa quem cultiva; não afirma, por si só, propriedade, e nenhum título, registro de terras ou inventário é conservado para o casal. [PROVEN quanto à ocupação; propriedade OPEN]

  - **Residência:** a localidade de Conceição, na freguesia de Sapucaia, a cerca de duas léguas da sede da vila (CIV-0041) — rural, e distante o bastante para que a paróquia fosse uma diligência de um dia, não uma vizinhança. Depois, o distrito de Carangola, em Minas Gerais, onde enviuvou em 1915 (PAR-0007) e onde suas filhas se casaram (PAR-0013, PAR-0014).

  - **Tratamento:** constantemente "Dona" nos atos que a nomeiam — "Dona Suzana Rita … Brandão" (CIV-0041), "D. Suzana Rita Brandão" (PAR-0012, PAR-0013), "D. Suzana Rita Bittencourt" (PAR-0014). Cortesia padrão para mulher casada da época, mais que índice de posição. [INFERRED — a leitura]

  - **Alfabetização:** não documentada. Nenhum ato conservado traz sua assinatura; ela nunca aparece assinando nem assinando *a rogo*. [OPEN — genuinamente inclassificável, não um analfabetismo inferido]

  ## Família e rede social

  Nascida na família Rego Brandão do vale cafeeiro do Paraíba do Sul, ela é o ponto em que a linhagem açoriana dos Muniz se funde a um lar nativo. O papel repetido de seus pais como padrinhos dos filhos dos irmãos imigrantes Muniz em Sapucaia é o mecanismo documentado que ata as duas famílias (PAR-0006). Mudou-se com a família de Sapucaia (RJ) para Carangola (MG), onde enviuvou em 1915 e onde suas filhas Joventina e Mercedes se casaram com famílias locais (PAR-0013, PAR-0014).

  O lar de sua filha Ana chegou ainda mais longe: Ana faleceu em 1950 em Guaçuí, Espírito Santo (CIV-0042) — os descendentes Muniz dispersando-se pelo mesmo eixo Zona da Mata / Caparaó.

  ## O que podemos extrapolar

  **1. O que o lado Brandão trouxe foi enraizamento, e enraizamento é o capital que não se leva na bagagem. [INFERRED / CONTEXTUAL]** Nenhum inventário, título de terra ou registro de propriedade sobrevive para seus pais; o que eles tinham era posição — o lar nativo estabelecido a quem os açorianos recém-chegados pediam para apadrinhar seus filhos. Para o imigrante sem bens João Muniz Bittencourt, esse era o único ativo que um recém-chegado não pode importar: pertencimento a uma família local estabelecida. Mas ele tem um limite duro que os próprios registros da família expõem. Posição social é específica de um lugar. Quando o lar deixou Sapucaia rumo a Carangola nos anos 1890, a terra que não possuía não podia ser perdida — e tampouco podia ser levada. Seus pais chegam a Minas Gerais como estranhos, aos sessenta e aos cinquenta anos; seus próprios filhos casam-se com famílias de Carangola, não de Sapucaia. **O enraizamento é a única forma de capital que a herança partível não fragmenta, e a única que uma só mudança pode destruir por inteiro.**

  **2. Onze filhos é o argumento sucessório resumido num número. [INFERRED / CONTEXTUAL]** A lei brasileira dividia o espólio igualmente entre todos os filhos. Mesmo que este casal tivesse uma boa gleba em Conceição, uma partilha em onze deixaria frações pequenas demais para lavrar, e os filhos de seus filhos as dividiriam de novo. Que não exista inventário de João nem de Susanna é coerente com não haver nada que justificasse abrir um — e significa que o lar se reproduziu como faziam as famílias rurais sem propriedade: pondo os filhos no trabalho e no casamento, em vez de repartir terra entre eles. As cinco filhas e filhos rastreáveis casaram-se localmente ou mudaram-se por trabalho; nenhum herdou uma posse.

  **3. Os hábitos de registro marcam uma família rural no limite do alcance da paróquia — não uma família descuidada. [INFERRED]** Seu batismo é muitas vezes lido como "registrado com dezesseis anos de atraso", mas a leitura melhor é institucional. Sapucaia só foi erigida em freguesia em 1871 [CONTEXTUAL]; uma criança batizada em 1866 foi, portanto, batizada sob uma paróquia anterior, e, ao vir casar-se na nova matriz de Sapucaia em 1882, a certidão daquele ato anterior teve de ser apresentada e copiada no livro local (PAR-0005). Isso é um limite paroquial mudando, não uma família negligenciando papéis. O que os registros *de fato* mostram é distância do clero: ela foi batizada sete meses depois de nascer, e sua filha Anna oito meses depois do nascimento dela (PAR-0005, PAR-0006), ao passo que em São Miguel a família de seu marido batizava em dez dias (PAR-0044). Um lar a duas léguas da sede de uma paróquia brasileira recém-criada simplesmente não via um padre com frequência. Em 1890, o mesmo lar registrou o nascimento civil de uma recém-nascida em oito dias (CIV-0041) — o novo registro republicano os alcançou mais depressa do que a igreja.

  **4. Dois Brandãos, dois tipos de capital, um casamento. [INFERRED]** A coincidência de sobrenomes merece ser usada, não descartada. O bisavô açoriano de seu marido também era um Brandão (P-0084), e aquela família *tinha* terra — uma gleba na Lomba do Botão, Povoação, com inventário aberto à sua morte, em 1819. Dividida ao longo das gerações numa ilha sem terra disponível, acabou empurrando seus bisnetos para os navios de emigrantes. Os Brandão dela não tinham terra e tinham, em seu lugar, posição. As duas linhas se encontram em seu casamento de 1882: uma família que teve propriedade e perdeu a suficiência pela divisão, outra que nunca teve propriedade e negociava em pertencimento. Nenhuma das duas podia transmitir a seus onze filhos mais do que a capacidade de trabalhar e as pessoas que responderiam por eles.

  **5. Sua fusão é a precondição social de tudo o que vem depois. [INFERRED]** Ela é o ponto em que a linha açoriana deixa de ser imigrante e se torna uma família brasileira de Sapucaia e depois de Carangola. Seu filho Deocleciano é o primeiro homem deste ramo documentado assinando o próprio nome (CIV-0006, 1916) e registrado como *lavrador*; o filho dele, Antenor, termina como artífice urbano em Volta Redonda (CIV-0028, 2014). O arco que ela abre não é declínio a partir da riqueza — não havia riqueza —, mas a conversão lenta de um lar rural de trabalho num lar urbano assalariado, com o pequeno ganho de cada geração (alfabetização, um distrito cheio de parentes) comprado de novo em vez de herdado.

