  ## Contexto regional e migratório

  [CONTEXTUAL] Sua vida atravessa duas regiões cafeeiras brasileiras e uma migração interna. Nasceu e casou-se no **vale do Paraíba do Sul**, em Sapucaia (RJ), a zona cafeeira mais antiga, alcançada pela Estrada de Ferro Leopoldina nos anos 1870, cujo sistema de trabalho foi refeito depois que a Lei nº 581 de 1850 (Lei Eusébio de Queirós) encerrou o tráfico atlântico e de novo após a abolição em 1888 — a mesma transição que atraiu os imigrantes açorianos que sua família apadrinhou e com um dos quais ela se casou. Entre 1892 e cerca de 1898 o lar mudou-se para oeste, para a **Zona da Mata Mineira**, em Carangola, seguindo a fronteira cafeeira à medida que ela se deslocava dos solos exauridos do Paraíba. Nenhum registro conservado declara um motivo para a mudança; o fator é inferido da história regional, não documentado. [CONTEXTUAL] A terra em ambas as regiões estava sob a Lei de Terras (nº 601, 1850), que a pôs em base de compra — e nenhuma compra, título ou registro é conservado para esta família.

