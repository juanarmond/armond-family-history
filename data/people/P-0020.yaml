profile: >-
  ## Identity

  **Susanna Rita Brondão** (also *Susana / Suzana*; *Rita / Ritta*; married *Bittencourt*).
  A daughter of the Sapucaia Rego Brandão family who married the Azorean immigrant João
  Monis Bittencourt (P-0019). [PROVEN]

  - **Parents:** José do Rego Brandão (P-0040) and Rita Ignacia de Jesus (P-0041) [PROVEN]
  — named in her own baptism (PAR-0005); her married name "Rita" descends from her mother.

  - **Maternal grandfather:** Antonio Caetano Machado (P-0045), named "avô materno" and a
  godfather at her baptism (PAR-0005).

  - **Birth and baptism:** her baptism (PAR-0005, a certidão transcribed into the Sapucaia
  book on 24 November 1882) reads, as literally re-read on 7 August 2026, born 20 August
  1875 and baptized 22 March 1876 [PROVEN as read] — but this date is contested (see Open
  questions).

  - **Marriage:** to João Monis Bittencourt (P-0019), by provisão of 23 December 1882 for
  the Sapucaia matriz (PAR-0001).

  - **Children:** eleven at her husband's death (PAR-0007). Documented: Deocleciano
  (P-0012, 1892, PAR-0004); Anna (1884, PAR-0006); Joventina (~1899, PAR-0013); Mercedes
  Maria (~1898, PAR-0014).

  - **Death:** after 12 September 1915 — she survived João as his widow (PAR-0007); no
  record held. [OPEN]

  ## Family and social network

  Born into the settled Rego Brandão family of the Paraíba do Sul coffee valley, she is
  the point where the Azorean Muniz line fuses with a native household. Her parents' role
  as godparents to the immigrant Muniz brothers' children in Sapucaia was probably the
  social mechanism that brought the two families together (PAR-0006). [INFERRED] She moved
  with the family from Sapucaia (RJ) to Carangola (MG), where she was widowed in 1915.

  ## Open questions

  - **Her birth year is a material conflict** [OPEN]. As literally read, PAR-0005 gives 20
  August 1875 (bapt. 22 March 1876); but her marriage provisão of December 1882 (PAR-0001)
  and her daughter Anna's birth on 19 November 1884 (PAR-0006) both require her to have
  been born well before 1875 — a mother cannot bear a child at age nine. The retrieval
  agent's 2026-08-10 re-read of the same act gives born 20 August 1865 (bapt. 22 March
  1866), which removes the contradiction. The repository still carries 1875 pending a
  resolving re-read; the reading history is preserved, not erased.

  - Her death record (Carangola, after 1915) — not held. [OPEN]

  ## Sources held (this repository)

  - PAR-0005 (her own baptism — her parents and maternal grandfather) · PAR-0001 (1882
  marriage provisão).

  - PAR-0004 (son Deocleciano's 1892 baptism) · PAR-0006 (daughter Anna's 1885 baptism,
  with her parents as godparents) · PAR-0013 / PAR-0014 (daughters Joventina and Mercedes'
  Carangola marriages) · PAR-0003, PAR-0012, CIV-0001 (grandson's baptism, son's religious
  and civil marriage) — all name her as mother / grandmother.
profile_pt: >-
  ## Identidade

  **Susanna Rita Brondão** (também *Susana / Suzana*; *Rita / Ritta*; de casada
  *Bittencourt*). Filha da família Rego Brandão de Sapucaia, casou-se com o imigrante
  açoriano João Monis Bittencourt (P-0019). [PROVEN]

  - **Pais:** José do Rego Brandão (P-0040) e Rita Ignacia de Jesus (P-0041) [PROVEN] —
  nomeados em seu próprio batismo (PAR-0005); seu nome de casada "Rita" deriva da mãe.

  - **Avô materno:** Antonio Caetano Machado (P-0045), nomeado "avô materno" e padrinho em
  seu batismo (PAR-0005).

  - **Nascimento e batismo:** seu batismo (PAR-0005, uma certidão transcrita no livro de
  Sapucaia em 24 de novembro de 1882) diz, conforme nova leitura literal de 7 de agosto de
  2026, nascida em 20 de agosto de 1875 e batizada em 22 de março de 1876 [PROVEN conforme
  lido] — mas essa data é contestada (ver Questões em aberto).

  - **Casamento:** com João Monis Bittencourt (P-0019), por provisão de 23 de dezembro de
  1882 para a matriz de Sapucaia (PAR-0001).

  - **Filhos:** onze ao falecimento do marido (PAR-0007). Documentados: Deocleciano
  (P-0012, 1892, PAR-0004); Anna (1884, PAR-0006); Joventina (~1899, PAR-0013); Mercedes
  Maria (~1898, PAR-0014).

  - **Óbito:** após 12 de setembro de 1915 — sobreviveu a João como viúva (PAR-0007);
  nenhum registro obtido. [OPEN]

  ## Família e rede social

  Nascida na estabelecida família Rego Brandão do vale cafeeiro do Paraíba do Sul, ela é o
  ponto onde a linhagem açoriana Muniz se funde a um lar nativo. O papel de seus pais como
  padrinhos dos filhos dos irmãos imigrantes Muniz em Sapucaia foi, provavelmente, o
  mecanismo social que aproximou as duas famílias (PAR-0006). [INFERRED] Mudou-se com a
  família de Sapucaia (RJ) para Carangola (MG), onde enviuvou em 1915.

  ## Questões em aberto

  - **O ano de seu nascimento é um conflito material** [OPEN]. Conforme lido literalmente,
  PAR-0005 dá 20 de agosto de 1875 (bat. 22 de março de 1876); mas sua provisão de
  casamento de dezembro de 1882 (PAR-0001) e o nascimento de sua filha Anna em 19 de
  novembro de 1884 (PAR-0006) exigem, ambos, que ela tenha nascido bem antes de 1875 — uma
  mãe não pode ter um filho aos nove anos. A nova leitura do mesmo assento pelo agente de
  recuperação (10/08/2026) dá nascida em 20 de agosto de 1865 (bat. 22 de março de 1866),
  o que remove a contradição. O repositório ainda mantém 1875 até uma releitura
  resolutiva; o histórico de leitura é preservado, não apagado.

  - Seu registro de óbito (Carangola, após 1915) — não obtido. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0005 (seu próprio batismo — seus pais e avô materno) · PAR-0001 (provisão de
  casamento de 1882).

  - PAR-0004 (batismo de 1892 do filho Deocleciano) · PAR-0006 (batismo de 1885 da filha
  Anna, com seus pais como padrinhos) · PAR-0013 / PAR-0014 (casamentos em Carangola das
  filhas Joventina e Mercedes) · PAR-0003, PAR-0012, CIV-0001 (batismo do neto, casamento
  religioso e civil do filho) — todos a nomeiam como mãe / avó.
