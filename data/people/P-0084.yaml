profile: >-
  ## Identity

  **João de Medeiros Brandão** — father of Maria Jacintha de Medeiros (P-0049), husband of
  Maria Eugenia (P-0085), family F-0041. [PROVEN as named]

  - **Attestation:** named as the bride's father in his daughter Maria Jacintha's 7 October
  1819 Mãe de Deus marriage (PAR-0037), and again — with his wife, as maternal grandparents —
  in his grandson Agostinho's 1843 baptism (PAR-0044). [PROVEN as named]

  - **Origin:** native of N.S. Mãe de Deus / Povoação, São Miguel (Açores); Portuguese
  (Açorean) — his daughter is recorded as native to the parish. His own records are not held.
  [INFERRED / OPEN]

  ## Family and social network

  Husband of Maria Eugenia (P-0085) and father of Maria Jacintha de Medeiros (P-0049), who
  married the Mãe de Deus landowner João Francisco Muniz Bitancourt (P-0048) in 1819 — the tie
  through which this Medeiros-Brandão line joins the Muniz proprietors and reaches the emigrant
  João Muniz Bittencourt (P-0019).

  - **A possible son, now an open question:** a witness "Antonio de Medeiros Brandão" at the
  1819 marriage (also a godfather at the 1821/1823 Muniz baptisms) was earlier read as very
  likely his son and Maria Jacintha's brother. The 2026 register sweep weakened this: a
  documented Antonio de Medeiros Brandão is son of *Francisco* de Medeiros Brandão (married Anna
  da Souza, 1816), so the 1819-witness Antonio may belong to Francisco's branch. The "Antonio =
  his son" reading is no longer safe and is downgraded to genuinely open. [OPEN — supersedes the
  earlier INFERRED reading]

  - **Namesake caution:** his daughter Maria Jacintha de Medeiros (P-0049) shares her name with
  an unrelated Maria Jacintha de Medeiros, daughter of Manoel Muniz × Tereza do Amaral (⚭ Manoel
  Cabral, 1818, PAR-0048); the two must never be merged.

  ## What we can extrapolate

  *Proportionate to a maternal-grandparent named in a marriage act and a baptism.*

  - **A rooted Medeiros-Brandão parish family married across into the Muniz proprietors
  [INFERRED / CONTEXTUAL].** The recurrence of "Medeiros" and "Brandão" across the Povoação
  registers marks the same closed, endogamous small-proprietor kin world as the Muniz (see
  P-0042). No office, title or wealth is documented — a Mãe de Deus parish family of the
  land-holding-peasant class. That his grandchildren's later marriage into the Muniz needed a
  4th-degree consanguinity dispensation is itself evidence of how tightly these parish families
  intermarried.

  - **The surname carried forward [CONTEXTUAL].** His grandson Manoel and the great-grandsons
  kept the "de Medeiros / Muniz" naming, marking the Medeiros-Brandão kin as part of the social
  scaffolding around the Muniz household — the kind of parish belonging the emigrants left
  behind. (A stronger claim, that a son António anchored the family's godparent network, rests
  on the now-weakened Antonio identification above and is not asserted.)

  ## Open questions

  - His marriage to Maria Eugenia is a bounded negative across the 1801–1822 Mãe de Deus
  marriage book (196 pages read; he appears only as a parent) → the marriage is pre-1801.
  Off-tool (BPARPD, Ponta Delgada); would confirm both parentages and Maria Eugenia's missing
  surname. [OPEN]

  - His own baptism, death and parents lie in the same pre-1801 books; off-tool. [OPEN]

  - The António de Medeiros Brandão kinship (see above) — his own record would settle whether the
  1819-witness Antonio is João's son or Francisco's. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of his daughter Maria Jacintha — names him as the bride's father) ·
  PAR-0044 (1843 baptism of his grandson Agostinho — names him and Maria Eugenia as maternal
  grandparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores) — a São Miguel root of the Muniz
  maternal line, with no move documented. [INFERRED] The crossing to Brazil is his
  great-grandsons' generation (about 1866–1870), driven by the island's *morgadio* land-lock,
  overpopulation and the 1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil
  pull ran through the Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de
  Terras (nº 601/1850), while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863
  abolished the Portuguese *morgadios*. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **João de Medeiros Brandão** — pai de Maria Jacintha de Medeiros (P-0049), marido de Maria
  Eugenia (P-0085), família F-0041. [PROVEN quanto ao nome]

  - **Atestação:** nomeado como pai da noiva no casamento de sua filha Maria Jacintha em 7 de
  outubro de 1819, em Mãe de Deus (PAR-0037), e novamente — com sua esposa, como avós maternos —
  no batismo de 1843 de seu neto Agostinho (PAR-0044). [PROVEN quanto ao nome]

  - **Origem:** natural de N.S. Mãe de Deus / Povoação, São Miguel (Açores); português
  (açoriano) — sua filha é registrada como natural da freguesia. Seus próprios registros não são
  obtidos. [INFERRED / OPEN]

  ## Família e rede social

  Marido de Maria Eugenia (P-0085) e pai de Maria Jacintha de Medeiros (P-0049), que se casou com
  o proprietário de Mãe de Deus João Francisco Muniz Bitancourt (P-0048) em 1819 — o vínculo pelo
  qual esta linha Medeiros-Brandão se une aos proprietários Muniz e alcança o emigrante João
  Muniz Bittencourt (P-0019).

  - **Um possível filho, agora questão em aberto:** uma testemunha "Antonio de Medeiros Brandão"
  no casamento de 1819 (também padrinho nos batismos Muniz de 1821/1823) foi antes lida como
  muito provavelmente seu filho e irmão de Maria Jacintha. A varredura de registros de 2026
  enfraqueceu isso: um Antonio de Medeiros Brandão documentado é filho de *Francisco* de Medeiros
  Brandão (casado com Anna da Souza, 1816), de modo que o Antonio-testemunha de 1819 pode
  pertencer ao ramo de Francisco. A leitura "Antonio = seu filho" já não é segura e é rebaixada a
  genuinamente aberta. [OPEN — supersede a leitura INFERRED anterior]

  - **Cautela de homonímia:** sua filha Maria Jacintha de Medeiros (P-0049) compartilha o nome
  com uma Maria Jacintha de Medeiros sem parentesco, filha de Manoel Muniz × Tereza do Amaral (⚭
  Manoel Cabral, 1818, PAR-0048); as duas nunca devem ser fundidas.

  ## O que podemos extrapolar

  *Proporcional a um avô materno nomeado num ato de casamento e num batismo.*

  - **Uma família de freguesia Medeiros-Brandão enraizada, casada com os proprietários Muniz
  [INFERRED / CONTEXTUAL].** A recorrência de "Medeiros" e "Brandão" nos registros da Povoação
  marca o mesmo mundo de parentesco fechado e endogâmico de pequenos proprietários dos Muniz (ver
  P-0042). Nenhum ofício, título ou riqueza é documentado — uma família de freguesia de Mãe de
  Deus da classe camponesa-proprietária. Que o casamento posterior de seus netos com os Muniz
  tenha exigido uma dispensa de consanguinidade de 4º grau é, em si, prova de quão estreitamente
  essas famílias de freguesia se casavam entre si.

  - **O sobrenome levado adiante [CONTEXTUAL].** Seu neto Manoel e os bisnetos mantiveram a
  nomenclatura "de Medeiros / Muniz", marcando o parentesco Medeiros-Brandão como parte do arcabouço
  social em torno do domicílio Muniz — o tipo de pertencimento de freguesia que os emigrantes
  deixaram para trás. (Uma afirmação mais forte, de que um filho António ancorou a rede de
  padrinhos da família, repousa na identificação de Antonio agora enfraquecida acima e não é
  afirmada.)

  ## Questões em aberto

  - Seu casamento com Maria Eugenia é um negativo delimitado em todo o livro de casamentos de Mãe
  de Deus de 1801–1822 (196 páginas lidas; ele aparece apenas como progenitor) → o casamento é
  anterior a 1801. Fora de alcance (BPARPD, Ponta Delgada); confirmaria ambas as filiações e o
  sobrenome ausente de Maria Eugenia. [OPEN]

  - Seu próprio batismo, óbito e pais estão nos mesmos livros anteriores a 1801; fora de alcance. [OPEN]

  - O parentesco de António de Medeiros Brandão (ver acima) — o registro próprio dele resolveria
  se o Antonio-testemunha de 1819 é filho de João ou de Francisco. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de sua filha Maria Jacintha — o nomeia como pai da noiva) ·
  PAR-0044 (batismo de 1843 de seu neto Agostinho — o nomeia, e a Maria Eugenia, como avós
  maternos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores) — uma raiz em São Miguel da linha
  materna Muniz, sem mudança documentada. [INFERRED] A travessia para o Brasil é da geração de
  seus bisnetos (por volta de 1866–1870), impulsionada pelo bloqueio fundiário do *morgadio* da
  ilha, pela superpopulação e pelo colapso, na década de 1860, da economia de exportação da
  laranja. [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850
  (Eusébio de Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel
  afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses.
  [CONTEXTUAL]
