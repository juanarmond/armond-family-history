notes:
- text: >-
    Father of Maria Jacintha de Medeiros (P-0049); hence the maternal
    great-grandfather of the emigrant João Muniz Bittencourt (P-0019). Named in his
    daughter's 7 October 1819 Mãe de Deus marriage (PAR-0037), husband of Maria
    Eugenia (P-0085). A witness at that same marriage, "Antonio de Medeiros
    Brandão", is very likely his son (Maria Jacintha's brother) [INFERRED]. His own
    records are not located; native to Nossa Senhora Mãe de Deus, Povoação, Ilha de
    São Miguel (Açores).
  text_pt: >-
    Pai de Maria Jacintha de Medeiros (P-0049); portanto, o trisavô materno do
    emigrante João Muniz Bittencourt (P-0019). Nomeado no casamento de sua filha em
    7 de outubro de 1819, em Mãe de Deus (PAR-0037), marido de Maria Eugenia
    (P-0085). Uma testemunha nesse mesmo casamento, "Antonio de Medeiros Brandão", é
    muito provavelmente seu filho (irmão de Maria Jacintha) [INFERRED]. Seus próprios
    registros não foram localizados; natural de Nossa Senhora Mãe de Deus, Povoação,
    Ilha de São Miguel (Açores).
