profile: >-
  ## Interesting facts

  - **[PROVEN]** He is named in two acts twenty-four years apart, and in both only as somebody's parent: as the bride's father in his daughter Maria Jacintha's marriage of 7 October 1819 (PAR-0037), and as a maternal grandparent in his grandson Agostinho's baptism of 23 April 1843 (PAR-0044). No record of his own is held.

  - **[COMPILED]** The Azores archive catalogue lists an estate inventory opened in his name on **27 January 1819** at the Tribunal da Comarca da Povoação (`PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00013`), with his wife **Maria Eugénia as inventariante** and the deceased described as "morador na **Lomba do Botão** — Povoação". The document is not digitised and no image is held, so this is a catalogue description rather than a read record — but it dates his death to about the turn of 1818–19 and says he had an estate worth inventorying.

  - **[PROVEN]** Lomba do Botão stays in the family. His grandson **Manoel Muniz Bytancourt** is recorded in 1866 as a *proprietário*, "morador na Lomba do Botão", who drowned in the bay off the Garajau at 46, made no will and left **eight children** (PAR-0015). The same locality names the household across two generations.

  - **[PROVEN — correction]** His daughter's 1819 marriage was **not** dispensed for consanguinity. The act reads "precedidas as denunciações do estilo, **sem impedimento**" (PAR-0037). The fourth-degree consanguinity dispensation belongs to a later marriage in the same line — that of his grandson Manoel to Francisca Roza do Espírito Santo in 1842 — a record read in the retrieval drop and **not catalogued in this repository**. An earlier version of this profile attached the dispensation to 1819; that was wrong and is corrected here.

  - **[INFERRED]** His surname coincides, by accident, with an unrelated Brazilian family further down the same descent: his great-grandson João Muniz Bittencourt married Susanna Rita **Brandão** of Sapucaia (P-0020), a *Rego* Brandão of the Paraíba do Sul valley. His is a São Miguel *Medeiros* Brandão. Nothing connects them, and they must never be merged.

  ## Identity

  **João de Medeiros Brandão** — a Mãe de Deus parish householder of Povoação, São Miguel, named only through his daughter and grandson. [PROVEN as named]

  - **Relationship:** 3×-great-grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs João de Medeiros Brandão → Maria Jacintha de Medeiros (P-0049) → Manoel Muniz Bytancourt (P-0042) → João Muniz Bittencourt (P-0019) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derived from families F-0041, F-0023, F-0020, F-0007 and F-0001]

  - **Spouse:** Maria Eugenia (P-0085), family F-0041; her surname is not given in either act. [PROVEN as named]

  - **Daughter:** Maria Jacintha de Medeiros (P-0049), "natural e freguez desta dita Igreja aonde foi baptizada", who married João Francisco Muniz Bitancourt at Nossa Senhora Mãe de Deus on 7 October 1819 (PAR-0037). [PROVEN]

  - **Death:** about the turn of 1818–19 — his estate inventory was opened on 27 January 1819 with his wife as administrator, so he was dead by then and his daughter married nine months later as the child of a settled estate. [COMPILED from the Azores archive catalogue; the document is not held]

  - **Birth, baptism and parents:** unknown; born perhaps between the 1750s and 1770, on the age of a daughter marrying in 1819. [INFERRED, soft — OPEN]

  - **Origin:** native of the freguesia of Nossa Senhora Mãe de Deus, Povoação, São Miguel, Açores — inferred from his daughter being recorded native and baptised there and from his own recorded residence at Lomba do Botão in the same freguesia. Portuguese. [INFERRED]

  ## Standing and profession

  No occupation or title is stated for him in either held act. [OPEN] What the archive does establish indirectly is that he held something: an estate inventory was opened on his death and administered by his widow, and the locality it names — Lomba do Botão — is the same one where his grandson is documented as a *proprietário* in 1866 (PAR-0015). The honest classification is a **land-holding peasant household of the Mãe de Deus parish**: enough property to require a partition on death, nowhere near enough to generate an office, a title or a "Dom". [COMPILED for the inventory; INFERRED for the class] His literacy is undocumented; no held act carries his signature.

  ## Family and social network

  Husband of Maria Eugenia (P-0085) and father of Maria Jacintha de Medeiros (P-0049), whose 1819 marriage to João Francisco Muniz Bitancourt joined this Medeiros Brandão household to the Muniz proprietors of the same parish — the tie through which the line reaches the emigrant João Muniz Bittencourt (P-0019) and, from him, Brazil.

  - **A possible son, now genuinely open.** A witness at the 1819 marriage, "Antonio de Medeiros Brandão" — also a godfather at Muniz baptisms in 1821 and 1823 — was once read as very probably his son and Maria Jacintha's brother. A register sweep weakened that: a documented Antonio de Medeiros Brandão is the son of *Francisco* de Medeiros Brandão and married Anna da Souza in 1816. Either two Antonios existed or the one is Francisco's. The son reading is not asserted. [OPEN — supersedes an earlier INFERRED reading]

  - **Namesake caution.** His daughter Maria Jacintha de Medeiros shares her name with an unrelated Maria Jacintha de Medeiros, daughter of Manoel Muniz × Tereza do Amaral, who married Manoel Cabral in 1818 (PAR-0048). The two must never be merged.

  ## What we can extrapolate

  **1. He is the only ancestor in this whole branch documented to have owned something. [INFERRED / COMPILED]** Across eleven Brandão, Machado and Azevedo forebears on the Brazilian side, not one death produces an inventário — four consecutive deaths in the Sapucaia line, and not a single estate opened. His does. That single catalogue entry is therefore the class hinge of the line: it marks the point above which the family had heritable capital, however small, and below which it had none. Everything Brazilian in this descent happens after the property is gone.

  **2. What he owned was land, which is the one form of capital that fragments. [CONTEXTUAL / INFERRED]** Nineteenth-century wealth came as land (heritable but divisible), office (which ends with the holder) or commerce (which tracks the economy). His was land, on an island where land was the binding constraint. Portugal's *morgadio* locked entailed estates whole onto a firstborn and left the other children nothing — but an ordinary peasant holding like his was not entailed: it went to inventory and was split. The system abolished by the Carta de Lei of 19 May 1863 therefore did not protect his plot; it simply denied his class the mechanism that protected the gentry's.

  **3. The fragmentation is documented end to end, and it runs through his plot. [INFERRED — the chain is PROVEN except where marked]** His estate is inventoried at Lomba do Botão in January 1819 [COMPILED]; his daughter marries into the Muniz proprietors nine months later [PROVEN]; her son Manoel is a *proprietário* at the same Lomba do Botão in 1866, drowns at 46, makes **no will** and leaves **eight children** [PROVEN, PAR-0015]; and within four years two of those sons — João and José — have crossed to Brazil. An intestate holding divided eight ways, on an island with no new land to take up, is not a hardship story that needs a villain. It is arithmetic. **The Azorean emigration in this family is the mathematical consequence of the property he left.**

  **4. Cousin marriage was the parish's defence against that arithmetic, and it did not work. [CONTEXTUAL / COMPILED]** His grandson's 1842 marriage required a fourth-degree consanguinity dispensation — the spouses were blood relatives — and the Medeiros, Mello and Muniz surnames recur through the Mãe de Deus registers in a tight loop. Marrying inside the kin group keeps fragmenting plots inside one family rather than dispersing them to strangers. It is the rational response to partible inheritance in a closed land market, and it buys a generation at most. His great-grandsons still left.

  **5. Education does not appear anywhere in the descent. [CONTEXTUAL]** No autograph of his survives, nor his daughter's, nor his grandson's. Schooling was a purchased, class-linked privilege that had to be re-bought each generation, and a peasant-proprietor household on São Miguel bought none of it. The first documented signature in the whole line is his great-great-great-grandson Deocleciano's, in Brazil, in 1916 (CIV-0006) — four generations and an ocean later.

  **6. The generational arc, named. [INFERRED]** From a household with an inventoried plot at Lomba do Botão (1819) → to a *proprietário* grandson drowned intestate with eight heirs (1866) → to great-grandsons emigrating to the Rio de Janeiro interior with nothing → to a Brazilian family that for four further generations owns no documented land and ends selling labour in a steel city (CIV-0028, 2014). The turning point is not a disaster but a division: the moment the Lomba do Botão holding stopped being able to support the children born onto it. His inventory is where that holding first enters the record, which makes him the top of the only descent in this branch that actually had something to lose.

  ## Open questions

  - **His 1819 inventário** (`PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00013`, Tribunal da Comarca da Povoação) — not digitised, to be ordered from BPARPD in Ponta Delgada. It would give his heir list, so his daughter's full sibling set, confirm Maria Eugénia as surviving widow, and put a value on the Lomba do Botão holding. It would not name his own parents. [OPEN — the highest-value unread document for him]

  - **His marriage to Maria Eugenia** — a bounded negative across the whole 1801–1822 Mãe de Deus marriage book (196 pages read; he appears only as a parent), so the act is pre-1801 and sits in the undigitised book of 1766–1801 at BPARPD. It would confirm both parentages and give Maria Eugenia's missing surname. The São Miguel parish registers are catalogued book-level only, with no per-act name index, so it cannot be found online. [OPEN]

  - **His own baptism, death record and parents** — the same pre-1801 books; off-tool. [OPEN]

  - **The António de Medeiros Brandão kinship** — his own record would settle whether the 1819 witness is this João's son or Francisco's, and therefore whether the 1822 "Anna" is Manoel's first cousin. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (the 7 October 1819 Mãe de Deus marriage of his daughter Maria Jacintha — names him as the bride's father and Maria Eugenia as her mother; records the marriage as "sem impedimento").

  - PAR-0044 (the 23 April 1843 Mãe de Deus baptism of his grandson Agostinho — names him and Maria Eugenia as the maternal grandparents, independently corroborating the 1819 act).

  - Context, not about him: PAR-0015 (the 1866 Povoação death of his grandson Manoel Muniz Bytancourt — *proprietário*, "morador na Lomba do Botão", drowned, no will, eight children), which is what makes the inheritance reading above evidential rather than speculative.

  ## Regional and migration context

  He lived and died at **Nossa Senhora Mãe de Deus, Povoação, São Miguel** — specifically at Lomba do Botão — with no movement documented at any point. [INFERRED for residence; COMPILED for the locality] Povoação was the first-settled site of São Miguel, a farming and coastal-fishing district that became a separate concelho only in 1839, after his death. [CONTEXTUAL] The pressures that eventually emptied it built up during and after his lifetime: a densely populated island with land locked under the *morgadio* until the Carta de Lei of 19 May 1863, chronic overpopulation, and then the collapse across the 1860s of the orange trade to Britain that had carried the island's prosperity. [CONTEXTUAL] The pull from the other side was Brazilian: the Lei nº 581 de 4 de setembro de 1850 (Lei Eusébio de Queirós) ended the Atlantic slave trade and forced the coffee Southeast toward European labour, while the Lei de Terras (nº 601, 1850) put land on a purchase basis. The crossing itself belongs to his great-grandsons, about 1866–70; he never left the parish. [CONTEXTUAL]

  ## Where to go today

  - **The family parish — his daughter's marriage (1819), his grandchildren's baptisms, and the pre-1801 books holding his own marriage:** Igreja Matriz de N.S. da Mãe de Deus, Vila da Povoação, São Miguel, Açores, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **The household's locality, named in his 1819 inventory and in his grandson's 1866 death act:** Lomba do Botão, Povoação, São Miguel, Açores, PT [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Lomba%20do%20Bot%C3%A3o%2C%20Povoa%C3%A7%C3%A3o%2C%20S%C3%A3o%20Miguel)

  - **His unread estate inventory:** Biblioteca Pública e Arquivo Regional de Ponta Delgada (BPARPD), São Miguel, Açores, PT — reference `PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00013`, not digitised [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Ponta%20Delgada)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é nomeado em dois atos separados por vinte e quatro anos, e em ambos apenas como genitor de alguém: como pai da noiva no casamento de sua filha Maria Jacintha, em 7 de outubro de 1819 (PAR-0037), e como avô materno no batismo de seu neto Agostinho, em 23 de abril de 1843 (PAR-0044). Nenhum registro próprio é conservado.

  - **[COMPILED]** O catálogo do arquivo açoriano lista um inventário aberto em seu nome em **27 de janeiro de 1819**, no Tribunal da Comarca da Povoação (`PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00013`), com sua esposa **Maria Eugénia como inventariante** e o inventariado descrito como "morador na **Lomba do Botão** — Povoação". O documento não está digitalizado e nenhuma imagem é conservada, de modo que se trata de descrição de catálogo, não de registro lido — mas data sua morte em torno da virada de 1818–19 e diz que ele tinha um espólio que valia inventariar.

  - **[PROVEN]** A Lomba do Botão permanece na família. Seu neto **Manoel Muniz Bytancourt** é registrado em 1866 como *proprietário*, "morador na Lomba do Botão", afogado na baía, fora do Garajau, aos 46 anos, sem testamento e deixando **oito filhos** (PAR-0015). A mesma localidade nomeia o lar ao longo de duas gerações.

  - **[PROVEN — correção]** O casamento de sua filha, em 1819, **não** foi dispensado por consanguinidade. O ato lê "precedidas as denunciações do estilo, **sem impedimento**" (PAR-0037). A dispensa de consanguinidade em quarto grau pertence a um casamento posterior da mesma linha — o de seu neto Manoel com Francisca Roza do Espírito Santo, em 1842 —, registro lido no lote de recuperação e **não catalogado neste repositório**. Uma versão anterior deste perfil atribuía a dispensa a 1819; estava errada e fica corrigida aqui.

  - **[INFERRED]** Seu sobrenome coincide, por acaso, com o de uma família brasileira sem parentesco mais abaixo na mesma descendência: seu bisneto João Muniz Bittencourt casou-se com Susanna Rita **Brandão**, de Sapucaia (P-0020), uma *Rego* Brandão do vale do Paraíba do Sul. O dele é um *Medeiros* Brandão de São Miguel. Nada as liga, e jamais devem ser fundidas.

  ## Identidade

  **João de Medeiros Brandão** — chefe de casa da freguesia de Mãe de Deus, Povoação, São Miguel, nomeado apenas por meio da filha e do neto. [PROVEN quanto ao nome]

  - **Parentesco:** tetravô de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre João de Medeiros Brandão → Maria Jacintha de Medeiros (P-0049) → Manoel Muniz Bytancourt (P-0042) → João Muniz Bittencourt (P-0019) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derivado das famílias F-0041, F-0023, F-0020, F-0007 e F-0001]

  - **Esposa:** Maria Eugenia (P-0085), família F-0041; seu sobrenome não é dado em nenhum dos atos. [PROVEN quanto ao nome]

  - **Filha:** Maria Jacintha de Medeiros (P-0049), "natural e freguez desta dita Igreja aonde foi baptizada", que se casou com João Francisco Muniz Bitancourt em Nossa Senhora Mãe de Deus, em 7 de outubro de 1819 (PAR-0037). [PROVEN]

  - **Óbito:** em torno da virada de 1818–19 — seu inventário foi aberto em 27 de janeiro de 1819, com a esposa como administradora, de modo que já estava morto então, e sua filha casou-se nove meses depois como filha de um espólio já acertado. [COMPILED do catálogo do arquivo açoriano; o documento não é conservado]

  - **Nascimento, batismo e pais:** desconhecidos; nascido talvez entre os anos 1750 e 1770, pela idade de uma filha que se casa em 1819. [INFERRED, frouxo — OPEN]

  - **Origem:** natural da freguesia de Nossa Senhora Mãe de Deus, Povoação, São Miguel, Açores — inferido de a filha ser registrada natural e batizada ali e de sua própria residência registrada na Lomba do Botão, na mesma freguesia. Português. [INFERRED]

  ## Posição social e profissão

  Nenhuma ocupação ou título lhe é declarada em qualquer dos dois atos conservados. [OPEN] O que o arquivo estabelece indiretamente é que ele detinha alguma coisa: um inventário foi aberto à sua morte e administrado pela viúva, e a localidade que ele nomeia — Lomba do Botão — é a mesma onde seu neto está documentado como *proprietário* em 1866 (PAR-0015). A classificação honesta é um **lar camponês com terra da freguesia de Mãe de Deus**: propriedade bastante para exigir partilha na morte, e nem de longe bastante para gerar um cargo, um título ou um "Dom". [COMPILED quanto ao inventário; INFERRED quanto à classe] Sua alfabetização não está documentada; nenhum ato conservado traz sua assinatura.

  ## Família e rede social

  Marido de Maria Eugenia (P-0085) e pai de Maria Jacintha de Medeiros (P-0049), cujo casamento de 1819 com João Francisco Muniz Bitancourt uniu este lar Medeiros Brandão aos proprietários Muniz da mesma freguesia — o laço pelo qual a linha alcança o emigrante João Muniz Bittencourt (P-0019) e, a partir dele, o Brasil.

  - **Um possível filho, agora genuinamente em aberto.** Uma testemunha no casamento de 1819, "Antonio de Medeiros Brandão" — também padrinho em batismos Muniz de 1821 e 1823 —, foi outrora lida como muito provavelmente seu filho e irmão de Maria Jacintha. Uma varredura de registros enfraqueceu isso: um Antonio de Medeiros Brandão documentado é filho de *Francisco* de Medeiros Brandão e casou-se com Anna da Souza em 1816. Ou existiram dois Antonios, ou o único é filho de Francisco. A leitura de filiação não é afirmada. [OPEN — supera uma leitura anterior marcada INFERRED]

  - **Cautela com homônima.** Sua filha Maria Jacintha de Medeiros tem o mesmo nome de uma Maria Jacintha de Medeiros sem parentesco, filha de Manoel Muniz × Tereza do Amaral, que se casou com Manoel Cabral em 1818 (PAR-0048). As duas jamais devem ser fundidas.

  ## O que podemos extrapolar

  **1. Ele é o único ancestral deste ramo documentado como tendo possuído algo. [INFERRED / COMPILED]** Entre onze antepassados Brandão, Machado e Azevedo do lado brasileiro, nenhuma morte produz inventário — quatro mortes consecutivas na linha de Sapucaia, e nenhum espólio aberto. A dele produz. Aquela única entrada de catálogo é, portanto, a dobradiça de classe da linha: marca o ponto acima do qual a família tinha capital herdável, por menor que fosse, e abaixo do qual não tinha nenhum. Tudo o que é brasileiro nesta descendência acontece depois que a propriedade já se foi.

  **2. O que ele possuía era terra, que é a única forma de capital que se fragmenta. [CONTEXTUAL / INFERRED]** A riqueza oitocentista vinha como terra (herdável, mas divisível), cargo (que acaba com o titular) ou comércio (que acompanha a economia). A dele era terra, numa ilha onde a terra era a restrição decisiva. O *morgadio* português trancava os vínculos inteiros num primogênito e nada deixava aos demais filhos — mas uma posse camponesa comum como a dele não era vinculada: ia a inventário e era repartida. O sistema abolido pela Carta de Lei de 19 de maio de 1863 não protegia, portanto, sua gleba; apenas negava à sua classe o mecanismo que protegia a da fidalguia.

  **3. A fragmentação está documentada de ponta a ponta, e passa por sua gleba. [INFERRED — a cadeia é PROVEN salvo onde marcado]** Seu espólio é inventariado na Lomba do Botão em janeiro de 1819 [COMPILED]; sua filha casa-se com os proprietários Muniz nove meses depois [PROVEN]; o filho dela, Manoel, é *proprietário* na mesma Lomba do Botão em 1866, afoga-se aos 46, **não faz testamento** e deixa **oito filhos** [PROVEN, PAR-0015]; e em quatro anos dois desses filhos — João e José — cruzaram para o Brasil. Uma posse intestada dividida em oito, numa ilha sem terra nova a ocupar, não é uma história de infortúnio que precise de vilão. É aritmética. **A emigração açoriana desta família é a consequência matemática da propriedade que ele deixou.**

  **4. O casamento entre primos foi a defesa da freguesia contra essa aritmética, e não funcionou. [CONTEXTUAL / COMPILED]** O casamento de 1842 de seu neto exigiu dispensa de consanguinidade em quarto grau — os cônjuges eram parentes de sangue — e os sobrenomes Medeiros, Mello e Muniz reaparecem em laço cerrado por todos os registros de Mãe de Deus. Casar dentro do grupo de parentes mantém as glebas fragmentadas dentro de uma mesma família, em vez de dispersá-las entre estranhos. É a resposta racional à herança partível num mercado de terras fechado, e compra, no máximo, uma geração. Seus bisnetos partiram assim mesmo.

  **5. A educação não aparece em parte alguma da descendência. [CONTEXTUAL]** Nenhum autógrafo dele sobrevive, nem da filha, nem do neto. A escolarização era privilégio comprado e ligado à classe, que tinha de ser recomprado a cada geração, e um lar camponês-proprietário de São Miguel não comprou nenhum. A primeira assinatura documentada em toda a linha é a de seu tetraneto Deocleciano, no Brasil, em 1916 (CIV-0006) — quatro gerações e um oceano depois.

  **6. O arco geracional, nomeado. [INFERRED]** De um lar com gleba inventariada na Lomba do Botão (1819) → a um neto *proprietário* afogado intestado com oito herdeiros (1866) → a bisnetos emigrando para o interior do Rio de Janeiro sem nada → a uma família brasileira que por mais quatro gerações não possui terra documentada e termina vendendo trabalho numa cidade siderúrgica (CIV-0028, 2014). O ponto de virada não é um desastre, mas uma divisão: o momento em que a posse da Lomba do Botão deixou de poder sustentar os filhos nela nascidos. Seu inventário é onde essa posse entra pela primeira vez no registro, o que faz dele o topo da única descendência deste ramo que de fato tinha algo a perder.

  ## Questões em aberto

  - **Seu inventário de 1819** (`PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00013`, Tribunal da Comarca da Povoação) — não digitalizado, a ser encomendado ao BPARPD em Ponta Delgada. Daria sua lista de herdeiros, portanto o conjunto completo de irmãos de sua filha, confirmaria Maria Eugénia como viúva sobrevivente e poria um valor sobre a posse da Lomba do Botão. Não nomearia seus próprios pais. [OPEN — o documento não lido de maior valor para ele]

  - **Seu casamento com Maria Eugenia** — negativa delimitada em todo o livro de casamentos de Mãe de Deus de 1801–1822 (196 páginas lidas; ele aparece apenas como genitor), de modo que o ato é anterior a 1801 e está no livro não digitalizado de 1766–1801, no BPARPD. Confirmaria ambas as filiações e daria o sobrenome ausente de Maria Eugenia. Os registros paroquiais de São Miguel estão catalogados apenas em nível de livro, sem índice onomástico por ato, de modo que não pode ser encontrado on-line. [OPEN]

  - **Seu próprio batismo, registro de óbito e pais** — os mesmos livros anteriores a 1801; fora do alcance das ferramentas. [OPEN]

  - **O parentesco de António de Medeiros Brandão** — um registro próprio dele resolveria se a testemunha de 1819 é filho deste João ou de Francisco, e portanto se a "Anna" de 1822 é prima em primeiro grau de Manoel. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (o casamento de 7 de outubro de 1819 em Mãe de Deus de sua filha Maria Jacintha — nomeia-o como pai da noiva e Maria Eugenia como mãe dela; registra o casamento como "sem impedimento").

  - PAR-0044 (o batismo de 23 de abril de 1843 em Mãe de Deus de seu neto Agostinho — nomeia-o, com Maria Eugenia, como o casal de avós maternos, corroborando de forma independente o ato de 1819).

  - Contexto, não sobre ele: PAR-0015 (o óbito de 1866 na Povoação de seu neto Manoel Muniz Bytancourt — *proprietário*, "morador na Lomba do Botão", afogado, sem testamento, oito filhos), que é o que torna a leitura sucessória acima evidencial e não especulativa.

  ## Contexto regional e migratório

  Viveu e morreu em **Nossa Senhora Mãe de Deus, Povoação, São Miguel** — especificamente na Lomba do Botão —, sem deslocamento documentado em momento algum. [INFERRED quanto à residência; COMPILED quanto à localidade] A Povoação foi o primeiro sítio povoado de São Miguel, um distrito de lavoura e pesca costeira que só se tornou concelho separado em 1839, depois de sua morte. [CONTEXTUAL] As pressões que acabariam por esvaziá-lo acumularam-se durante e depois de sua vida: uma ilha densamente povoada com a terra trancada sob o *morgadio* até a Carta de Lei de 19 de maio de 1863, superpopulação crônica e, então, o colapso ao longo dos anos 1860 do comércio de laranja com a Inglaterra, que sustentara a prosperidade da ilha. [CONTEXTUAL] A atração do outro lado era brasileira: a Lei nº 581 de 4 de setembro de 1850 (Lei Eusébio de Queirós) encerrou o tráfico atlântico e empurrou o Sudeste cafeeiro para a mão de obra europeia, enquanto a Lei de Terras (nº 601, 1850) pôs a terra em base de compra. A travessia em si pertence a seus bisnetos, por volta de 1866–70; ele nunca deixou a freguesia. [CONTEXTUAL]

