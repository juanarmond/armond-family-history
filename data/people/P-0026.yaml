profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** São Francisco do Glória was a district of the municipality of Carangola in the Zona da Mata Mineira — a coffee-producing region of eastern Minas Gerais that was changing rapidly in the early 20th century as the coffee economy declined and younger generations began leaving for urban work.

  - **[PROVEN]** She was the only surviving grandparent of her six grandchildren at the time of their collective 1915 birth registration — recorded "esta rezide" (still residing in the district) while all five other grandparents were already deceased (CIV-0007).

  - **[CONTEXTUAL]** The 1915 collective registration of six siblings born over multiple years was itself a consequence of the 1889 civil registration law: rural families in remote Zona da Mata districts often registered births in retrospective batches, sometimes a decade or more after the fact.

  - **[INFERRED]** Her survival into 1915 as the sole living grandparent suggests she was likely born in the 1840s–1860s, making her a woman who lived through abolition (1888), the proclamation of the Republic (1889) and the entire collapse of the Zona da Mata coffee economy.

  - **[CONTEXTUAL]** The Carangola region sat at the northern edge of the Zona da Mata's coffee belt; by 1915 the economic pressure driving younger generations toward Rio de Janeiro and eventually toward Volta Redonda's steel industry was already underway in exactly this district.

  ## Identity

  **Maria Paula de Jesus** [PROVEN as reported] — mother of Emmerenciana Maria de Jesus
  (P-0022).

  - **Origin:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007).

  - **Spouse:** Antonio Francisco da Silva (P-0025).

  - **Child (in our line):** Emmerenciana Maria de Jesus (P-0022).

  - **Living 1915:** CIV-0007 records her as still residing in the district ("esta
  rezide") in October 1915 — the only living grandparent of the six children at
  registration. [PROVEN as stated]

  - **Birth and death dates and parents:** not held. [OPEN]

  ## What we can extrapolate

  She is documented by a single word — "rezide" — and it is the most informative word in
  her record. [PROVEN / INFERRED] In October 1915 CIV-0007 lists five of the six children's
  grandparents as dead and her alone as still living in the district. She had therefore
  outlived her husband Antonio Francisco da Silva (P-0025), and she was still in São
  Francisco do Glória rather than in a child's household elsewhere: at that date the family
  had not yet begun to move.

  A widow with nothing to administer. [INFERRED / CONTEXTUAL] Under Brazilian succession a
  widow's legal position turns on whether there is an estate — a *meação* to hold, an
  *inventário* to open, a *partilha* to face among the children. None of that is visible
  here, consistent with the absence of any probate, land or notarial record naming the
  couple. Where there is no property, widowhood generates no paper; it is simply a change
  of household, which is why she survives in the archive only as a line in her
  grandchildren's birth registration. That negative is bounded: no Carangola probate index
  has been swept specifically for her name. [OPEN]

  Her longevity places her across the whole transformation of the region. [CONTEXTUAL]
  Grandmother of a child born in 1901 and still living in 1915, she was plausibly born in
  the 1840s–1860s [INFERRED — from generational spacing only; no age is stated in any held
  record]. A woman of that cohort in the Zona da Mata lived through the end of the slave
  trade (Lei Eusébio de Queirós, 1850), abolition (Lei Áurea, 1888), the Republic (1889)
  and the first phase of the coffee decline — all from inside one rural district, and
  leaving no trace of any of it beyond her own survival.

  What she transmitted was descent, not capital — but the women's line did move. [INFERRED
  / CONTEXTUAL] Her one documented child, Emmerenciana (P-0022), appears in 1915 not as "do
  lar" but inside the household's collective *lavradores* — a working farm woman, as her
  mother almost certainly was. Two generations later the women of this line are recorded
  differently: Maria Aurora (P-0011) as "do lar" in urban Rio (CIV-0018), and Cidalia
  (P-0005) as a *costureira aposentada*, a retired seamstress with a pension in her own
  name (CIV-0027). The move from unpaid family field labour to a named, pensioned trade is
  the clearest measurable improvement anywhere in this branch, and it took three
  generations and a move to the city to arrive.

  Her name is also the line's dead end upward. [OPEN] "Maria Paula de Jesus" is a
  devotional construction with no patronymic to follow, and her parents are named in no
  held record — so unlike the *Pinheiro* carried by the other grandmother of this
  generation (P-0033), her surname offers no handle for a search. The record that would
  open her line is Emmerenciana's own marriage or baptism in the Carangola region, which
  would state her filiation.

  ## Note on evidence

  She is named only as a maternal grandparent in her grandchildren's 1915 birth
  registration (CIV-0007), an informant statement at a retrospective registration; no
  record of her own is held. The retrieval draft treated this parentage as tree-only, but
  CIV-0007 supports it directly.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her and her husband as the
  maternal grandparents; records her alive in the district). She appears in no other held
  record.

  ## Where to go today

  - **Origin and residence (São Francisco do Glória district, Carangola, MG):** CIV-0007
  records her a native of this district ("naturaes deste districto") and still resident
  there in October 1915 ("esta rezide") — the located place tied to her; no earlier origin
  (and no Portuguese origin) is stated in any held record [RESOLVED — district] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=S%C3%A3o+Francisco+do+Gl%C3%B3ria%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** São Francisco do Glória era um distrito do município de Carangola, na Zona da Mata Mineira — região produtora de café no leste de Minas Gerais que passava por transformações rápidas no início do século XX com o declínio da economia cafeeira e a partida das gerações mais jovens em busca de trabalho urbano.

  - **[PROVEN]** Ela era a única avó sobrevivente dos seis netos no momento do registro coletivo de nascimento de 1915 — registrada "esta rezide" (ainda residindo no distrito) enquanto os demais cinco avós já haviam falecido (CIV-0007).

  - **[CONTEXTUAL]** O registro coletivo de 1915 de seis irmãos nascidos ao longo de vários anos foi, em si, uma consequência da lei de registro civil de 1889: famílias rurais em distritos remotos da Zona da Mata frequentemente registravam nascimentos em lotes retroativos, por vezes uma década ou mais após o fato.

  - **[INFERRED]** Sua sobrevivência até 1915 como única avó viva sugere que ela provavelmente nasceu entre as décadas de 1840 e 1860, tornando-a uma mulher que viveu a abolição (1888), a proclamação da República (1889) e todo o colapso da economia cafeeira da Zona da Mata.

  - **[CONTEXTUAL]** A região de Carangola situava-se na borda norte do cinturão cafeeiro da Zona da Mata; em 1915, a pressão econômica que impulsionava as gerações mais jovens rumo ao Rio de Janeiro e, eventualmente, à indústria siderúrgica de Volta Redonda já estava em curso exatamente neste distrito.

  ## Identidade

  **Maria Paula de Jesus** [PROVEN conforme declarado] — mãe de Emmerenciana Maria de
  Jesus (P-0022).

  - **Origem:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007).

  - **Cônjuge:** Antonio Francisco da Silva (P-0025).

  - **Filha (em nossa linha):** Emmerenciana Maria de Jesus (P-0022).

  - **Viva em 1915:** CIV-0007 a registra ainda residindo no distrito ("esta rezide") em
  outubro de 1915 — a única avó viva dos seis filhos ao tempo do registro. [PROVEN
  conforme declarado]

  - **Datas de nascimento e óbito e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ela é documentada por uma única palavra — "rezide" — e é a palavra mais informativa de seu
  registro. [PROVEN / INFERRED] Em outubro de 1915, CIV-0007 arrola cinco dos seis avós das
  crianças como falecidos e só a ela como ainda vivendo no distrito. Havia, portanto,
  sobrevivido ao marido Antonio Francisco da Silva (P-0025), e continuava em São Francisco
  do Glória, e não na casa de algum filho em outro lugar: naquela data a família ainda não
  começara a se mudar.

  Uma viúva sem nada a administrar. [INFERRED / CONTEXTUAL] Na sucessão brasileira a posição
  jurídica da viúva depende de haver espólio — uma *meação* a reter, um *inventário* a
  abrir, uma *partilha* a enfrentar entre os filhos. Nada disso é visível aqui, de modo
  coerente com a ausência de qualquer registro de inventário, terras ou notas que nomeie o
  casal. Onde não há bens, a viuvez não gera papel; é apenas uma mudança de casa, e é por
  isso que ela sobrevive no arquivo apenas como uma linha no registro de nascimento dos
  netos. Esse negativo é delimitado: nenhum índice de inventários de Carangola foi varrido
  especificamente por seu nome. [OPEN]

  Sua longevidade a atravessa por toda a transformação da região. [CONTEXTUAL] Avó de uma
  criança nascida em 1901 e ainda viva em 1915, terá nascido plausivelmente entre as décadas
  de 1840 e 1860 [INFERRED — apenas pelo espaçamento entre gerações; nenhuma idade é
  declarada em registro disponível]. Uma mulher dessa coorte na Zona da Mata viveu o fim do
  tráfico de escravizados (Lei Eusébio de Queirós, 1850), a abolição (Lei Áurea, 1888), a
  República (1889) e a primeira fase do declínio cafeeiro — tudo isso de dentro de um único
  distrito rural, sem deixar vestígio de nada disso além da própria sobrevivência.

  O que ela transmitiu foi descendência, não capital — mas a linha feminina de fato se moveu.
  [INFERRED / CONTEXTUAL] Sua única filha documentada, Emmerenciana (P-0022), aparece em 1915
  não como "do lar", mas dentro dos *lavradores* coletivos da casa — uma mulher que
  trabalhava na roça, como quase certamente sua mãe também foi. Duas gerações depois, as
  mulheres desta linha são registradas de outro modo: Maria Aurora (P-0011) como "do lar" no
  Rio urbano (CIV-0018), e Cidalia (P-0005) como *costureira aposentada*, com aposentadoria
  em nome próprio (CIV-0027). A passagem do trabalho agrícola familiar não remunerado a um
  ofício nomeado e com aposentadoria é a melhoria mensurável mais nítida de todo este ramo —
  e levou três gerações e uma mudança para a cidade para chegar.

  Seu nome é também o beco sem saída da linha para cima. [OPEN] "Maria Paula de Jesus" é uma
  construção devocional sem patronímico a seguir, e seus pais não são nomeados em nenhum
  registro disponível — de modo que, ao contrário do *Pinheiro* carregado pela outra avó
  desta geração (P-0033), seu sobrenome não oferece alça para busca. O registro que abriria
  sua linha é o próprio casamento ou batismo de Emmerenciana na região de Carangola, que
  declararia sua filiação.

  ## Nota sobre a evidência

  Ela é nomeada apenas como avó materna no registro de nascimento de 1915 de seus netos
  (CIV-0007), uma declaração de informante em registro retroativo; nenhum registro próprio
  dela foi obtido. O rascunho de recuperação tratou essa filiação como apenas de árvore
  colaborativa, mas CIV-0007 a sustenta diretamente.

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — a nomeia, com o marido, como os
  avós maternos; registra-a viva no distrito). Não aparece em nenhum outro registro
  obtido.

  ## Onde ir hoje

  - **Origem e residência (distrito de São Francisco do Glória, Carangola, MG):** CIV-0007
  a registra natural deste distrito ("naturaes deste districto") e ainda residente ali em
  outubro de 1915 ("esta rezide") — o lugar localizado ligado a ela; nenhuma origem
  anterior (nem origem portuguesa) é declarada em qualquer registro disponível
  [RESOLVED — distrito] ·
