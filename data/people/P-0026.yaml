  - **Birth and death dates and parents:** not held. [OPEN]

  ## Note on evidence

  She is named only as a maternal grandparent in her grandchildren's 1915 birth
  registration (CIV-0007), an informant statement at a retrospective registration; no
  record of her own is held. The retrieval draft treated this parentage as tree-only, but
  CIV-0007 supports it directly.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her and her husband as the
  maternal grandparents; records her alive in the district). She appears in no other held
  record.

  ## Where to go today

