  ## Identity

  **Maria Paula de Jesus** [PROVEN as reported] — mother of Emmerenciana Maria de Jesus
  (P-0022).

  - **Origin:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007).

  - **Spouse:** Antonio Francisco da Silva (P-0025).

  - **Child (in our line):** Emmerenciana Maria de Jesus (P-0022).

  - **Living 1915:** CIV-0007 records her as still residing in the district ("esta
  rezide") in October 1915 — the only living grandparent of the six children at
