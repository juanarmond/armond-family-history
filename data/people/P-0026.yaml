profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** São Francisco do Glória was a district of the municipality of Carangola in the Zona da Mata Mineira — a coffee-producing region of eastern Minas Gerais that was changing rapidly in the early 20th century as the coffee economy declined and younger generations began leaving for urban work.

  - **[PROVEN]** She was the only surviving grandparent of her six grandchildren at the time of their collective 1915 birth registration — recorded "esta rezide" (still residing in the district) while all five other grandparents were already deceased (CIV-0007).

  - **[CONTEXTUAL]** The 1915 collective registration of six siblings born over multiple years was itself a consequence of the 1889 civil registration law: rural families in remote Zona da Mata districts often registered births in retrospective batches, sometimes a decade or more after the fact.

  - **[INFERRED]** Her survival into 1915 as the sole living grandparent suggests she was likely born in the 1840s–1860s, making her a woman who lived through abolition (1888), the proclamation of the Republic (1889) and the entire collapse of the Zona da Mata coffee economy.

  - **[CONTEXTUAL]** The Carangola region sat at the northern edge of the Zona da Mata's coffee belt; by 1915 the economic pressure driving younger generations toward Rio de Janeiro and eventually toward Volta Redonda's steel industry was already underway in exactly this district.

  ## Identity

  **Maria Paula de Jesus** [PROVEN as reported] — mother of Emmerenciana Maria de Jesus
  (P-0022).

  - **Origin:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007).

  - **Spouse:** Antonio Francisco da Silva (P-0025).

  - **Child (in our line):** Emmerenciana Maria de Jesus (P-0022).

  - **Living 1915:** CIV-0007 records her as still residing in the district ("esta
  rezide") in October 1915 — the only living grandparent of the six children at
  registration. [PROVEN as stated]

  - **Birth and death dates and parents:** not held. [OPEN]

  ## Note on evidence

  She is named only as a maternal grandparent in her grandchildren's 1915 birth
  registration (CIV-0007), an informant statement at a retrospective registration; no
  record of her own is held. The retrieval draft treated this parentage as tree-only, but
  CIV-0007 supports it directly.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her and her husband as the
  maternal grandparents; records her alive in the district). She appears in no other held
  record.

  ## Where to go today

  - **Origin and residence (São Francisco do Glória district, Carangola, MG):** CIV-0007
  records her a native of this district ("naturaes deste districto") and still resident
  there in October 1915 ("esta rezide") — the located place tied to her; no earlier origin
  (and no Portuguese origin) is stated in any held record [RESOLVED — district] ·
