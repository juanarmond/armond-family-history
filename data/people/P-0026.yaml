profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** São Francisco do Glória era um distrito do município de Carangola, na Zona da Mata Mineira — região produtora de café no leste de Minas Gerais que passava por transformações rápidas no início do século XX com o declínio da economia cafeeira e a partida das gerações mais jovens em busca de trabalho urbano.

  - **[PROVEN]** Ela era a única avó sobrevivente dos seis netos no momento do registro coletivo de nascimento de 1915 — registrada "esta rezide" (ainda residindo no distrito) enquanto os demais cinco avós já haviam falecido (CIV-0007).

  - **[CONTEXTUAL]** O registro coletivo de 1915 de seis irmãos nascidos ao longo de vários anos foi, em si, uma consequência da lei de registro civil de 1889: famílias rurais em distritos remotos da Zona da Mata frequentemente registravam nascimentos em lotes retroativos, por vezes uma década ou mais após o fato.

  - **[INFERRED]** Sua sobrevivência até 1915 como única avó viva sugere que ela provavelmente nasceu entre as décadas de 1840 e 1860, tornando-a uma mulher que viveu a abolição (1888), a proclamação da República (1889) e todo o colapso da economia cafeeira da Zona da Mata.

  - **[CONTEXTUAL]** A região de Carangola situava-se na borda norte do cinturão cafeeiro da Zona da Mata; em 1915, a pressão econômica que impulsionava as gerações mais jovens rumo ao Rio de Janeiro e, eventualmente, à indústria siderúrgica de Volta Redonda já estava em curso exatamente neste distrito.

  ## Identidade

  **Maria Paula de Jesus** [PROVEN conforme declarado] — mãe de Emmerenciana Maria de
  Jesus (P-0022).

  - **Origem:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007).

  - **Cônjuge:** Antonio Francisco da Silva (P-0025).

  - **Filha (em nossa linha):** Emmerenciana Maria de Jesus (P-0022).

  - **Viva em 1915:** CIV-0007 a registra ainda residindo no distrito ("esta rezide") em
  outubro de 1915 — a única avó viva dos seis filhos ao tempo do registro. [PROVEN
  conforme declarado]

  - **Datas de nascimento e óbito e pais:** não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ela é nomeada apenas como avó materna no registro de nascimento de 1915 de seus netos
  (CIV-0007), uma declaração de informante em registro retroativo; nenhum registro próprio
  dela foi obtido. O rascunho de recuperação tratou essa filiação como apenas de árvore
  colaborativa, mas CIV-0007 a sustenta diretamente.

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — a nomeia, com o marido, como os
  avós maternos; registra-a viva no distrito). Não aparece em nenhum outro registro
  obtido.

  ## Onde ir hoje

  - **Origem e residência (distrito de São Francisco do Glória, Carangola, MG):** CIV-0007
  a registra natural deste distrito ("naturaes deste districto") e ainda residente ali em
  outubro de 1915 ("esta rezide") — o lugar localizado ligado a ela; nenhuma origem
  anterior (nem origem portuguesa) é declarada em qualquer registro disponível
  [RESOLVED — distrito] ·
