    natural de São Miguel (Açores).
profile: >-
  ## Identity

  **Manoel de Motta** ("mancebo" / "júnior", the younger; documented variant *de Mello*) —
  father of Francisca Roza do Espírito Santo (P-0047), husband of Anna de Souza (P-0087), family
  F-0042. [PROVEN as named]

  - **Name and surname adjudication:** the surname reads "de Motta" in his daughter's 1842
  marriage (PAR-0024, "Manoel de Motta mancebo"), in the held baptisms of his grandchildren
  (PAR-0045, PAR-0046, PAR-0047, all "Manoel de Motta Junior") and where he stands godfather in
  the 1843 baptism of Agostinho (PAR-0044, "Manoel da Motta Junior"); "de Mello" appears in a
  1845 baptism reading. On the weight of records "Motta" is adopted as primary and "Mello" kept
  as a documented variant (BPARPD reconcile, SE/2026/1583e); *Mattos* and *Pacheco* were rejected.
  [PROVEN for the form; variant preserved]

  - **"Júnior" / "mancebo":** the epithet implies a same-named father, Manoel de Motta (or Mello)
  the elder — a one-generation-up lead, not yet documented. [INFERRED]

  - **Origin:** São Miguel (Açores), N.S. Mãe de Deus / Povoação district — his daughter is
  recorded "natural desta freguezia"; Portuguese (Açorean). His own records are not held.
  [INFERRED / OPEN]

  ## Family and social network

  Husband of Anna de Souza (P-0087) and father of Francisca Roza do Espírito Santo (P-0047), who
  married the Mãe de Deus landowner Manoel Muniz Bytancourt (P-0042) in 1842 under a 4th-degree
  consanguinity dispensation — the tie through which this line reaches the emigrant João Muniz
  Bittencourt (P-0019) and his brother José. He is named a maternal grandparent in the held
  baptisms of three of that
  couple's daughters — Maria (1843, PAR-0045), Francisca (1849, PAR-0046) and Maria (1851,
  PAR-0047). A second daughter of his own, **Claudina** (a sister of Francisca Roza), is
  documented in those same baptisms as the maternal aunt / godmother. [PROVEN for Francisca,
  Claudina and the three grandchildren]

  ## What we can extrapolate

  *Proportionate to a maternal-grandfather documented in a marriage act and his grandchildren's
  baptisms.*

  - **Azorean maternal root of the same closed small-proprietor parish class [INFERRED /
  CONTEXTUAL].** That his daughter married a Muniz cousin under a 4th-degree consanguinity
  dispensation places the Motta line inside the same endogamous Mãe de Deus / Povoação
  peasant-proprietor kin world as the Muniz (see P-0042) — land-scarce, marrying within kin, with
  no office, title or wealth recorded. Nothing documents his standing directly; the marriage he
  gave his daughter into is the clearest measure of it.

  - **A surname obscured by devotion [INFERRED].** His daughter's devotional surname "do Espírito
  Santo" (not a family name) is why her own baptism is unfindable and why he surfaced only through
  her marriage and her children's records — a reminder that Azorean women's parentage often
  survives only in the acts of the next generation.

  ## Open questions

  - His marriage to Anna de Souza is a bounded negative across the whole 1801–1822 Mãe de Deus
  marriage book (all 196 pages read) → it is pre-1801 or in the bride's home parish (Azorean
  custom marries in the bride's parish). Nordeste / N.S. da Luz (the likely lead) is not digitised
  → off-tool (BPARPD); Achadinha, Água Retorta, Furnas and Ribeira Quente tested negative or
  off-tool. A "Manoel de Motta já-defunto 1830, Água Retorta" is a different man (married Maria do
  Amaral) — a namesake red herring, not this line. [OPEN]

  - His own baptism, death and father (Manoel de Motta/Mello the elder) lie in pre-1818 Mãe de
  Deus or N.S. da Luz books; off-tool. A candidate parent-couple, "Manoel da Motta (sr.) × Roza
  de Pimentel" (Mãe de Deus, 1813), is an unproven lead. [OPEN]

  ## Sources held (this repository)

  - PAR-0024 (1842 marriage of his daughter Francisca — names him as the bride's father) ·
  PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851 baptisms of his grandchildren — name him
  and Anna de Souza as maternal grandparents) · PAR-0044 (1843 baptism of Agostinho — he and Anna
  stand as godparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores), with no move documented — the origin
  end of the maternal chain. [INFERRED] It is his grandsons (the immigrant Muniz brothers) who
  emigrate to the Rio de Janeiro interior about 1866–1870, driven by the island's *morgadio*
  land-lock, overpopulation, the 1860s collapse of the orange-export economy and the family's 1866
  loss of Manoel Muniz Bytancourt at sea. [CONTEXTUAL] The Brazil pull ran through the Lei nº 581
  de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras (nº 601/1850), while the
  São Miguel push eased as the Carta de Lei de 19 de maio de 1863 abolished the Portuguese
  *morgadios*. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Manoel de Motta** ("mancebo" / "júnior", o mais novo; variante documentada *de Mello*) — pai
  de Francisca Roza do Espírito Santo (P-0047), marido de Anna de Souza (P-0087), família F-0042.
  [PROVEN quanto ao nome]

  - **Nome e adjudicação do sobrenome:** o sobrenome lê "de Motta" no casamento de 1842 de sua
  filha (PAR-0024, "Manoel de Motta mancebo"), nos batismos obtidos de seus netos (PAR-0045,
  PAR-0046, PAR-0047, todos "Manoel de Motta Junior") e onde é padrinho no batismo de 1843 de
  Agostinho (PAR-0044, "Manoel da Motta Junior"); "de Mello" aparece numa leitura de um batismo de
  1845. Pelo peso dos registros, "Motta" é adotado como primário e "Mello" mantido como variante
  documentada (reconcílio BPARPD, SE/2026/1583e); *Mattos* e *Pacheco* foram rejeitados. [PROVEN
  quanto à forma; variante preservada]

  - **"Júnior" / "mancebo":** o epíteto implica um pai homônimo, Manoel de Motta (ou Mello) o
  velho — uma pista de uma geração acima, ainda não documentada. [INFERRED]

  - **Origem:** São Miguel (Açores), distrito de N.S. Mãe de Deus / Povoação — sua filha é
  registrada "natural desta freguezia"; português (açoriano). Seus próprios registros não são
  obtidos. [INFERRED / OPEN]

  ## Família e rede social

  Marido de Anna de Souza (P-0087) e pai de Francisca Roza do Espírito Santo (P-0047), que se casou
  com o proprietário de Mãe de Deus Manoel Muniz Bytancourt (P-0042) em 1842 sob dispensa de
  consanguinidade de 4º grau — o vínculo pelo qual esta linha alcança o emigrante João Muniz
  Bittencourt (P-0019) e seu irmão José. É nomeado avô materno nos batismos obtidos de três filhas
  desse casal — Maria
  (1843, PAR-0045), Francisca (1849, PAR-0046) e Maria (1851, PAR-0047). Uma segunda filha sua,
  **Claudina** (irmã de Francisca Roza), está documentada nesses mesmos batismos como a tia materna
  / madrinha. [PROVEN quanto a Francisca, a Claudina e aos três netos]

  ## O que podemos extrapolar

  *Proporcional a um avô materno documentado num ato de casamento e nos batismos de seus netos.*

  - **Raiz materna açoriana da mesma classe fechada de pequenos proprietários de freguesia
  [INFERRED / CONTEXTUAL].** Que sua filha tenha se casado com um primo Muniz sob dispensa de
  consanguinidade de 4º grau coloca a linha Motta dentro do mesmo mundo de parentesco endogâmico
  de camponeses-proprietários de Mãe de Deus / Povoação dos Muniz (ver P-0042) — pobre em terra,
  casando-se entre parentes, sem ofício, título ou riqueza registrados. Nada documenta sua posição
  diretamente; o casamento em que colocou a filha é a medida mais clara dela.

  - **Um sobrenome obscurecido pela devoção [INFERRED].** O sobrenome devocional de sua filha "do
  Espírito Santo" (não um nome de família) é a razão de o batismo dela ser inencontrável e de ele
  ter surgido apenas por meio do casamento e dos registros dos filhos dela — um lembrete de que a
  filiação das mulheres açorianas muitas vezes sobrevive apenas nos atos da geração seguinte.

  ## Questões em aberto

  - Seu casamento com Anna de Souza é um negativo delimitado em todo o livro de casamentos de Mãe
  de Deus de 1801–1822 (todas as 196 páginas lidas) → é anterior a 1801 ou na freguesia natal da
  noiva (o costume açoriano casa na freguesia da noiva). Nordeste / N.S. da Luz (a pista mais
  provável) não está digitalizada → fora de alcance (BPARPD); Achadinha, Água Retorta, Furnas e
  Ribeira Quente testadas negativas ou fora de alcance. Um "Manoel de Motta já-defunto 1830, Água
  Retorta" é um homem diferente (casado com Maria do Amaral) — um falso positivo homônimo, não
  esta linha. [OPEN]

  - Seu próprio batismo, óbito e pai (Manoel de Motta/Mello o velho) estão em livros de Mãe de
  Deus ou N.S. da Luz anteriores a 1818; fora de alcance. Um casal de pais candidato, "Manoel da
  Motta (sr.) × Roza de Pimentel" (Mãe de Deus, 1813), é uma pista não provada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0024 (casamento de 1842 de sua filha Francisca — o nomeia como pai da noiva) · PAR-0045 /
  PAR-0046 / PAR-0047 (batismos de 1843, 1849 e 1851 de seus netos — o nomeiam, e a Anna de Souza,
  como avós maternos) · PAR-0044 (batismo de 1843 de Agostinho — ele e Anna são padrinhos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores), sem mudança documentada — a ponta de
  origem da cadeia materna. [INFERRED] São seus netos (os irmãos imigrantes Muniz) que emigram para
  o interior do Rio de Janeiro por volta de 1866–1870, impulsionados pelo bloqueio fundiário do
  *morgadio* da ilha, pela superpopulação, pelo colapso, na década de 1860, da economia de
  exportação da laranja e pela perda, em 1866, de Manoel Muniz Bytancourt no mar. [CONTEXTUAL] A
  atração para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) e pela
  Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel afrouxou quando a Carta de Lei de
  19 de maio de 1863 aboliu os *morgadios* portugueses. [CONTEXTUAL]
