notes:
- text: >-
    Father of Francisca Roza do Espírito Santo (P-0047); hence the maternal
    grandfather of the emigrant João Muniz Bittencourt (P-0019). Named in his
    daughter's 17 February 1842 Mãe de Deus marriage (PAR-0024) as "Manoel de Motta
    mancebo" (the younger), husband of Anna de Souza (P-0087). A retrieval read of
    the 1845 twins' baptism records the surname as "de Mello junior"; per the BPARPD
    reconcile (SE/2026/1583e) "Motta" is adopted as primary (1842 marriage + an 1847
    collateral both read "Motta"; only the 1845 baptism reads "Mello"). His own
    records are not located; native to São Miguel (Açores).
  text_pt: >-
    Pai de Francisca Roza do Espírito Santo (P-0047); portanto, o avô materno do
    emigrante João Muniz Bittencourt (P-0019). Nomeado no casamento de sua filha em
    17 de fevereiro de 1842, em Mãe de Deus (PAR-0024), como "Manoel de Motta
    mancebo" (o mais novo), marido de Anna de Souza (P-0087). Uma leitura de
    recuperação do batismo dos gêmeos de 1845 registra o sobrenome como "de Mello
    junior"; conforme o reconcílio BPARPD (SE/2026/1583e), "Motta" é adotado como
    primário (o casamento de 1842 e um colateral de 1847 leem "Motta"; apenas o
    batismo de 1845 lê "Mello"). Seus próprios registros não foram localizados;
    natural de São Miguel (Açores).
