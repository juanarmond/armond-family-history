    natural de São Miguel (Açores).
profile: >-
  ## Interesting facts

  - **[PROVEN]** His surname was contested across five documents and four readings; "de Motta" was adopted as primary only after a BPARPD reconcile (SE/2026/1583e) weighted four records against one — a reminder that for Azorean peasant families, surname spelling was a scribal convention, not a personal standard.

  - **[CONTEXTUAL]** The "mancebo" (younger) epithet appended to his name in PAR-0024 implies a same-named father — the classic São Miguel practice of recycling given names across generations, making an older "Manoel de Motta" a probable next research target in the pre-1801 Mãe de Deus books.

  - **[INFERRED]** His daughter Francisca Roza took the devotional surname "do Espírito Santo" rather than his "de Motta" — a practice that made her own baptism untraceable and his fatherhood invisible until her 1842 marriage was read; the devotional naming convention systematically obscures maternal-side women in these registers.

  - **[CONTEXTUAL]** He lived on São Miguel during the island's orange-export peak (c.1820s–1850s) and was probably dead before the blight of the 1850s–1860s that collapsed that economy; the emigration of his great-grandchildren was driven by pressures that intensified in the decade after his probable death, making him the last generation of the line who knew only São Miguel.

  ## Identity

  **Manoel de Motta** ("mancebo" / "júnior", the younger; documented variant *de Mello*) —
  father of Francisca Roza do Espírito Santo (P-0047), husband of Anna de Souza (P-0087), family
  F-0042. [PROVEN as named]

  - **Name and surname adjudication:** the surname reads "de Motta" in his daughter's 1842
  marriage (PAR-0024, "Manoel de Motta mancebo"), in the held baptisms of his grandchildren
  (PAR-0045, PAR-0046, PAR-0047, all "Manoel de Motta Junior") and where he stands godfather in
  the 1843 baptism of Agostinho (PAR-0044, "Manoel da Motta Junior"); "de Mello" appears in a
  1845 baptism reading. On the weight of records "Motta" is adopted as primary and "Mello" kept
  as a documented variant (BPARPD reconcile, SE/2026/1583e); *Mattos* and *Pacheco* were rejected.
  [PROVEN for the form; variant preserved]

  - **"Júnior" / "mancebo":** the epithet implies a same-named father, Manoel de Motta (or Mello)
  the elder — a one-generation-up lead, not yet documented. [INFERRED]

  - **Origin:** São Miguel (Açores), N.S. Mãe de Deus / Povoação district — his daughter is
  recorded "natural desta freguezia"; Portuguese (Açorean). His own records are not held.
  [INFERRED / OPEN]

  ## Standing and profession

  - **Nothing documented** [PROVEN absence]. His daughter's 1842 marriage calls him "Manoel
  de Motta mancebo" and the 1843 and 1849 baptisms of his grandchildren call him "Manoel da
  Motta Junior" (PAR-0024, PAR-0044, PAR-0046) — both terms distinguishing him from a
  same-named father rather than describing work. No occupation, property, office or
  honorific is recorded for him in any held act. The field is left unset deliberately.

  - **[PROVEN]** What the records do show is his standing as a godparent: he and his wife
  Anna de Souza sponsored the 1843 baptism of Agostinho Muniz (PAR-0044), the infant brother
  of the man who had married their daughter the year before.

  ## Family and social network

  Husband of Anna de Souza (P-0087) and father of Francisca Roza do Espírito Santo (P-0047), who
  married the Mãe de Deus landowner Manoel Muniz Bytancourt (P-0042) in 1842 under a 4th-degree
  consanguinity dispensation — the tie through which this line reaches the emigrant João Muniz
  Bittencourt (P-0019) and his brother José. He is named a maternal grandparent in the held
  baptisms of three of that
  couple's daughters — Maria (1843, PAR-0045), Francisca (1849, PAR-0046) and Maria (1851,
  PAR-0047). A second daughter of his own, **Claudina** (a sister of Francisca Roza), is
  documented in those same baptisms as the maternal aunt / godmother. [PROVEN for Francisca,
  Claudina and the three grandchildren]

  ## What we can extrapolate

  *Proportionate to a maternal grandfather documented in one marriage act, three baptisms
  and a godparenthood.*

  **1. His standing is measured by the marriage he gave his daughter, because nothing else
  is recorded [PROVEN / INFERRED].** In 1842 his daughter Francisca Roza married into a
  household of documented *proprietários* (P-0042, PAR-0015), and did so as a
  **fourth-degree blood relative**, under apostolic dispensation (PAR-0024). **[INFERRED]**
  Families do not seek consanguinity dispensations to marry strangers, and they do not seek
  them to marry up: a dispensation is itself a statement that the two households regarded
  each other as equals within one kin network. That places the Motta line in the same closed
  small-proprietor parish world as the Muniz — land-scarce, marrying inward, with no office,
  title or honorific recorded on either side.

  **2. The alliance was immediately converted into compadrio [PROVEN / INFERRED].** Fourteen
  months after the wedding, in April 1843, he and his wife Anna de Souza stood godparents to
  **Agostinho Muniz**, the infant brother of their new son-in-law (PAR-0044); his daughter
  Claudina then godmothered two of his Muniz grandchildren in 1843 and 1849 (PAR-0045,
  PAR-0046). **[INFERRED]** Neither family had land to settle on the couple, so they settled
  sponsorship on each other instead. Godparenthood here is the substitute for a dowry —
  social capital where there is no capital.

  **3. "Mancebo" and "Junior" both mark him as the younger of two [PROVEN / INFERRED].** The
  1842 marriage calls him "Manoel de Motta mancebo" and the 1843 and 1849 baptisms "Manoel
  da Motta Junior" (PAR-0024, PAR-0044, PAR-0046). **[INFERRED]** Two different clerks
  reaching for the same distinction implies a Manoel de Motta the elder living in the same
  parish — so the Motta line has depth at Mãe de Deus beyond what is documented here. The
  repository also preserves a *Mello* variant of the surname; it is kept, not resolved.

  **4. His own line is hard to follow because of his daughter's name [PROVEN / INFERRED].**
  Francisca Roza carried the devotional surname "do Espírito Santo" rather than her father's
  (P-0047), which is why her baptism cannot be found by surname and why he surfaces only
  through her 1842 marriage and her children's baptisms. **[INFERRED]** Azorean women's
  parentage of this class routinely survives only in the acts of the next generation — the
  same mechanism that nearly lost Maria Eugenia (P-0085) and Tereza do Amaral (P-0083).

  ## Open questions

  - His marriage to Anna de Souza is a bounded negative across the whole 1801–1822 Mãe de Deus
  marriage book (all 196 pages read) → it is pre-1801 or in the bride's home parish (Azorean
  custom marries in the bride's parish). Nordeste / N.S. da Luz (the likely lead) is not digitised
  → off-tool (BPARPD); Achadinha, Água Retorta, Furnas and Ribeira Quente tested negative or
  off-tool. A "Manoel de Motta já-defunto 1830, Água Retorta" is a different man (married Maria do
  Amaral) — a namesake red herring, not this line. [OPEN]

  - His own baptism, death and father (Manoel de Motta/Mello the elder) lie in pre-1818 Mãe de
  Deus or N.S. da Luz books; off-tool. A candidate parent-couple, "Manoel da Motta (sr.) × Roza
  de Pimentel" (Mãe de Deus, 1813), is an unproven lead. [OPEN]

  ## Sources held (this repository)

  - PAR-0024 (1842 marriage of his daughter Francisca — names him as the bride's father) ·
  PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851 baptisms of his grandchildren — name him
  and Anna de Souza as maternal grandparents) · PAR-0044 (1843 baptism of Agostinho — he and Anna
  stand as godparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores), with no move documented — the
  origin end of the maternal chain. [INFERRED] It is his grandsons (the immigrant Muniz
  brothers) who emigrate to the Rio de Janeiro interior between 1866 and 1882 (most
  plausibly near 1880; see P-0019), driven by the island's *morgadio* land-lock,
  overpopulation, the 1860s collapse of the orange-export economy and the family's 1866 loss
  of Manoel Muniz Bytancourt at sea. [CONTEXTUAL] The Brazil pull ran through the Lei nº 581
  de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras (nº 601/1850), while
  the São Miguel push eased as the Carta de Lei de 19 de maio de 1863 abolished the
  Portuguese *morgadios*. [CONTEXTUAL]

  ## Where to go today

  - **Godparent and father in his daughters' records:** Igreja Matriz de N.S. da Mãe
  de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coords 37.74891, -25.24372)
  [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **His own marriage to Anna de Souza (off-tool):** Nordeste parish — Igreja de N.S.
  da Luz / Matriz de São Jorge, São Miguel, or the pre-1801 Mãe de Deus books
  [APPROX; BPARPD] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu sobrenome foi contestado em cinco documentos e quatro leituras; "de Motta" foi adotado como primário apenas após um reconcílio da BPARPD (SE/2026/1583e) que ponderou quatro registros contra um — lembrando que, para famílias camponesas açorianas, a grafia do sobrenome era uma convenção do escrivão, não um padrão pessoal.

  - **[CONTEXTUAL]** O epíteto "mancebo" (mais novo) aposto ao seu nome em PAR-0024 implica um pai homônimo — a prática clássica de São Miguel de reciclar prenomes entre gerações, tornando um "Manoel de Motta" mais velho um provável alvo de pesquisa nos livros de Mãe de Deus anteriores a 1801.

  - **[INFERRED]** Sua filha Francisca Roza tomou o sobrenome devocional "do Espírito Santo" em vez de seu "de Motta" — uma prática que tornou o batismo dela intransponível e sua paternidade invisível até que o casamento de 1842 fosse lido; a convenção de nomeação devocional obscurece sistematicamente as mulheres do lado materno nesses registros.

  - **[CONTEXTUAL]** Viveu em São Miguel durante o auge das exportações de laranja da ilha (c.1820–1850) e estava provavelmente morto antes da praga das décadas de 1850–1860 que colapsou essa economia; a emigração de seus bisnetos foi impulsionada por pressões que se intensificaram na década após sua provável morte, tornando-o a última geração da linha que conheceu apenas São Miguel.

  ## Identidade

  **Manoel de Motta** ("mancebo" / "júnior", o mais novo; variante documentada *de Mello*) — pai
  de Francisca Roza do Espírito Santo (P-0047), marido de Anna de Souza (P-0087), família F-0042.
  [PROVEN quanto ao nome]

  - **Nome e adjudicação do sobrenome:** o sobrenome lê "de Motta" no casamento de 1842 de sua
  filha (PAR-0024, "Manoel de Motta mancebo"), nos batismos obtidos de seus netos (PAR-0045,
  PAR-0046, PAR-0047, todos "Manoel de Motta Junior") e onde é padrinho no batismo de 1843 de
  Agostinho (PAR-0044, "Manoel da Motta Junior"); "de Mello" aparece numa leitura de um batismo de
  1845. Pelo peso dos registros, "Motta" é adotado como primário e "Mello" mantido como variante
  documentada (reconcílio BPARPD, SE/2026/1583e); *Mattos* e *Pacheco* foram rejeitados. [PROVEN
  quanto à forma; variante preservada]

  - **"Júnior" / "mancebo":** o epíteto implica um pai homônimo, Manoel de Motta (ou Mello) o
  velho — uma pista de uma geração acima, ainda não documentada. [INFERRED]

  - **Origem:** São Miguel (Açores), distrito de N.S. Mãe de Deus / Povoação — sua filha é
  registrada "natural desta freguezia"; português (açoriano). Seus próprios registros não são
  obtidos. [INFERRED / OPEN]

  ## Posição social e profissão

  - **Nada documentado** [PROVEN na ausência]. O casamento de 1842 da filha o chama de
  "Manoel de Motta mancebo" e os batismos de 1843 e 1849 dos netos o chamam de "Manoel da
  Motta Junior" (PAR-0024, PAR-0044, PAR-0046) — ambos os termos o distinguem de um pai
  homônimo, em vez de descrever trabalho. Nenhuma ocupação, bem, cargo ou tratamento
  honorífico lhe é registrado em qualquer ato que tenhamos. O campo fica deliberadamente sem
  preencher.

  - **[PROVEN]** O que os registros mostram é sua posição como padrinho: ele e sua mulher
  Anna de Souza apadrinharam o batismo de 1843 de Agostinho Muniz (PAR-0044), o irmão
  recém-nascido do homem que se casara com a filha deles no ano anterior.

  ## Família e rede social

  Marido de Anna de Souza (P-0087) e pai de Francisca Roza do Espírito Santo (P-0047), que se casou
  com o proprietário de Mãe de Deus Manoel Muniz Bytancourt (P-0042) em 1842 sob dispensa de
  consanguinidade de 4º grau — o vínculo pelo qual esta linha alcança o emigrante João Muniz
  Bittencourt (P-0019) e seu irmão José. É nomeado avô materno nos batismos obtidos de três filhas
  desse casal — Maria
  (1843, PAR-0045), Francisca (1849, PAR-0046) e Maria (1851, PAR-0047). Uma segunda filha sua,
  **Claudina** (irmã de Francisca Roza), está documentada nesses mesmos batismos como a tia materna
  / madrinha. [PROVEN quanto a Francisca, a Claudina e aos três netos]

  ## O que podemos extrapolar

  *Proporcional a um avô materno documentado em um ato de casamento, três batismos e um
  apadrinhamento.*

  **1. Sua posição mede-se pelo casamento que deu à filha, porque nada mais está registrado
  [PROVEN / INFERRED].** Em 1842, sua filha Francisca Roza casou-se com uma casa de
  *proprietários* documentados (P-0042, PAR-0015), e o fez na condição de **parente de
  sangue em quarto grau**, sob dispensa apostólica (PAR-0024). **[INFERRED]** Famílias não
  pedem dispensa de consanguinidade para casar com estranhos, nem a pedem para casar para
  cima: a dispensa é, ela própria, a declaração de que as duas casas se viam como iguais
  dentro de uma mesma rede de parentesco. Isso situa a linhagem Motta no mesmo mundo
  paroquial fechado de pequenos proprietários dos Muniz — com pouca terra, casando para
  dentro, sem cargo, título ou tratamento honorífico registrado de nenhum dos lados.

  **2. A aliança foi imediatamente convertida em compadrio [PROVEN / INFERRED].** Catorze
  meses depois do casamento, em abril de 1843, ele e sua mulher Anna de Souza foram
  padrinhos de **Agostinho Muniz**, irmão recém-nascido de seu novo genro (PAR-0044); sua
  filha Claudina foi depois madrinha de dois de seus netos Muniz, em 1843 e 1849 (PAR-0045,
  PAR-0046). **[INFERRED]** Nenhuma das famílias tinha terra para estabelecer o casal, e
  então estabeleceram apadrinhamento uma na outra. O compadrio, aqui, é o substituto do dote
  — capital social onde não há capital.

  **3. "Mancebo" e "Junior" o marcam, ambos, como o mais novo de dois [PROVEN / INFERRED].**
  O casamento de 1842 o chama de "Manoel de Motta mancebo" e os batismos de 1843 e 1849, de
  "Manoel da Motta Junior" (PAR-0024, PAR-0044, PAR-0046). **[INFERRED]** Dois escrivães
  diferentes buscando a mesma distinção implicam um Manoel de Motta, o velho, vivendo na
  mesma freguesia — de modo que a linhagem Motta tem em Mãe de Deus profundidade além do
  aqui documentado. O repositório preserva também uma variante *Mello* do sobrenome; ela é
  mantida, não resolvida.

  **4. Sua própria linhagem é difícil de seguir por causa do nome da filha [PROVEN /
  INFERRED].** Francisca Roza levava o sobrenome devocional "do Espírito Santo", e não o do
  pai (P-0047), razão pela qual seu batismo não pode ser achado pelo sobrenome e pela qual
  ele só aflora pelo casamento dela, em 1842, e pelos batismos dos netos. **[INFERRED]** A
  filiação das mulheres açorianas desta classe costuma sobreviver apenas nos atos da geração
  seguinte — o mesmo mecanismo que quase perdeu Maria Eugenia (P-0085) e Tereza do Amaral
  (P-0083).

  ## Questões em aberto

  - Seu casamento com Anna de Souza é um negativo delimitado em todo o livro de casamentos de Mãe
  de Deus de 1801–1822 (todas as 196 páginas lidas) → é anterior a 1801 ou na freguesia natal da
  noiva (o costume açoriano casa na freguesia da noiva). Nordeste / N.S. da Luz (a pista mais
  provável) não está digitalizada → fora de alcance (BPARPD); Achadinha, Água Retorta, Furnas e
  Ribeira Quente testadas negativas ou fora de alcance. Um "Manoel de Motta já-defunto 1830, Água
  Retorta" é um homem diferente (casado com Maria do Amaral) — um falso positivo homônimo, não
  esta linha. [OPEN]

  - Seu próprio batismo, óbito e pai (Manoel de Motta/Mello o velho) estão em livros de Mãe de
  Deus ou N.S. da Luz anteriores a 1818; fora de alcance. Um casal de pais candidato, "Manoel da
  Motta (sr.) × Roza de Pimentel" (Mãe de Deus, 1813), é uma pista não provada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0024 (casamento de 1842 de sua filha Francisca — o nomeia como pai da noiva) · PAR-0045 /
  PAR-0046 / PAR-0047 (batismos de 1843, 1849 e 1851 de seus netos — o nomeiam, e a Anna de Souza,
  como avós maternos) · PAR-0044 (batismo de 1843 de Agostinho — ele e Anna são padrinhos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores), sem mudança documentada — a
  ponta de origem da cadeia materna. [INFERRED] São seus netos (os irmãos imigrantes Muniz)
  que emigram para o interior do Rio de Janeiro entre 1866 e 1882 (mais plausivelmente por
  volta de 1880; ver P-0019), impulsionados pelo bloqueio fundiário do *morgadio* da ilha,
  pela superpopulação, pelo colapso, na década de 1860, da economia de exportação da laranja
  e pela perda, em 1866, de Manoel Muniz Bytancourt no mar. [CONTEXTUAL] A atração para o
  Brasil passou pela Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) e pela Lei de
  Terras (nº 601/1850), enquanto o empurrão em São Miguel afrouxou quando a Carta de Lei de
  19 de maio de 1863 aboliu os *morgadios* portugueses. [CONTEXTUAL]

  ## Onde ir hoje

  - **Padrinho e pai nos registros de suas filhas:** Igreja Matriz de N.S. da Mãe de
  Deus, Vila da Povoação, São Miguel, Açores, Portugal (coords 37.74891, -25.24372)
  [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Seu próprio casamento com Anna de Souza (fora de alcance):** freguesia do
  Nordeste — Igreja de N.S. da Luz / Matriz de São Jorge, São Miguel, ou os livros de
  Mãe de Deus anteriores a 1801 [APPROX; BPARPD] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
