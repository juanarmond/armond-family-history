    Father of Maria Joanna Rutschmann (P-0037); named "João José Rocheman" (the priest's spelling of
    Rutschmann) in his daughter's 1841 baptism (PAR-0069) and 1859 marriage (PAR-0070). His own 1860
    Nova Friburgo death (PAR-0071) records him as "natural e baptizado na freguezia de Bulle, Cantão
