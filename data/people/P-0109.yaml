    Father of Maria Joanna Rutschmann (P-0037); named "João José Rocheman" (the priest's spelling of
    Rutschmann) in his daughter's 1841 baptism (PAR-0069) and 1859 marriage (PAR-0070), and "João José
    Rosman" in his own 1840 Nova Friburgo marriage act (PAR-0076, event E-0121). His own 1860 Nova
    Friburgo death (PAR-0071) records him as "natural e baptizado na freguezia de Bulle, Cantão de
    Friburgo, na Suíça [Bulle, canton Fribourg, Switzerland], Brasileiro naturalizado", aged 59y 10m
    22d → born ~30 August 1800; husband of Isabel/Elisabeth Storck. Swiss immigrant. His parents are
    now primary-named in his 1840 marriage act (PAR-0076) — "filho legitimo de Frederico Rosman e de
    Joanna Germana Carolina" — modelled as Frédéric Rutschmann (P-0119) × Jeanne Germaine Caroline
    (P-0120), family F-0060. Only his exact Bulle baptism date remains open, pending the
    Saint-Pierre-aux-Liens register.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Four held records span his adult life — his marriage (1840), his daughter's
  baptism (1842), her marriage (1859) and his own burial (1860) — and not one of them gives him
  an occupation. He is among the best-documented people in this group and among the least
  described.

  - **[PROVEN]** His burial entry is unusually precise: he died at half past eight in the
  evening on 22 July 1860 at Nova Friburgo, "de idade de cincoenta e nove annos, dez mezes e
  vinte e dois dias" — fifty-nine years, ten months and twenty-two days. Subtracting that from
  the date of death yields a birth about 30 August 1800. (PAR-0071)

  - **[PROVEN]** The same entry calls him "natural e baptizado na Freguezia de Bulle, Cantão de
  Fribourg, na Suíça, **Brasileiro naturalizado**". He arrived as a Swiss subject and died a
  Brazilian citizen by naturalisation, after roughly four decades in the colony. His 1840
  marriage act independently states the Bulle birthplace, so the origin rests on two records,
  not one. (PAR-0071, PAR-0076)

  - **[PROVEN]** The witnesses at his 1840 wedding, João Balmat and Maria Fabre, reappear two
  years later as the godparents of his first recorded daughter ("João Balineat com Maria
  Fabre"). The same couple stood by him twice — the clearest piece of social network any record
  in this group preserves. (PAR-0076, PAR-0069)

  - **[PROVEN]** Portuguese-speaking clerks never once wrote his surname as Rutschmann. He is
  "Rosman" in 1840 and "Rocheman" in 1842, 1859 and 1860 — four attempts, four spellings, none
  of them the original.

  ## Identity

  **João José Rutschmann**, recorded throughout his Brazilian life as **João José Rosman** or
  **Rocheman** — a Swiss immigrant from Bulle who settled permanently at Nova Friburgo and died
  there a naturalised Brazilian. Iris Bohrer Muniz's (P-0007) great-great-grandfather, by the
  chain Maria Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer
  (P-0015). [PROVEN; degree derived from the family links]

  - **Birth:** born and baptised in the parish of Bulle, Canton Fribourg, Switzerland. The place
  is stated twice (PAR-0076, PAR-0071); the date, about 30 August 1800, is calculated from the
  age recorded at his death. [PROVEN for Bulle; the date is INFERRED from PAR-0071]

  - **Parents:** legitimate son of Frédéric Rutschmann, written "Frederico Rosman" (P-0119), and
  Jeanne Germaine Caroline, written "Joanna Germana Carolina" (P-0120); family F-0060. [PROVEN —
  PAR-0076]

  - **Marriage:** to Elisabeth Storck, written "Isabella Storck" (P-0110), on 23 June 1840 at
  the Matriz de São João Baptista, Nova Friburgo, before the coadjutor João José Vivianno, with
  João Balmat and Maria Fabre as witnesses. (PAR-0076, event E-0121) [PROVEN]

  - **Death:** 22 July 1860 at 8.30 p.m., Nova Friburgo; buried the following day in the town
  cemetery by the Vigário Jacob Joye. (PAR-0071, event E-0095) [PROVEN]

  - **Nationality:** Swiss by birth, naturalised Brazilian by 1860. [PROVEN — PAR-0071]

  ## Standing and profession

  No occupation, property, office, literacy or signature appears for him in any of the four held
  records — a genuine blank, not an oversight of this profile. The 1860 burial does record that
  he was "encommendado, acompanhado, e sepultado" in the town cemetery, a normal Catholic burial
  with the parish's attendance, and the 1840 and 1859 acts place him as a parish resident.
  Naturalisation is the one formal status the records attach to him, and it says something real:
  he had enough of a permanent stake in Brazil to regularise it.

  ## Family and social network

  He married Elisabeth Storck in 1840 and the union is confirmed twice over — by the act itself
  and by his death entry twenty years later, which still names him "cazado com Isabel Stork".
  Because that entry records him as married rather than widowed, she outlived him. [PROVEN —
  PAR-0076, PAR-0071]

  Their daughter Maria Joanna (P-0037) was born 2 May 1841 and baptised on 20 February 1842,
  with João Balineat and Maria Fabre — his own wedding witnesses — as godparents. In 1859 she
  married the Portuguese immigrant Antonio da Silva Ferreira, who was himself "natural e
  baptizado na Freguezia de [Guenfães — uncertain] em Portugal": the Swiss colony line joining a
  Portuguese one, in the colony church, the year before João José died. [PROVEN — PAR-0069,
  PAR-0070]

  His own parents are named in his 1840 marriage act and nowhere else in this archive. [PROVEN —
  PAR-0076]

  ## What we can extrapolate

  - **[CONTEXTUAL]** He belongs to the 1819 cohort of Dom João VI's colonization scheme, decreed
  on 16 May 1818 and contracted to the Fribourg agent Gachet. Recruitment overshot to some
  261–265 families; they travelled from Estavayer-le-Lac on 4 July 1819 via Basel and Rotterdam
  and sailed for Rio in a fleet of eight vessels. Roughly a quarter died en route of typhus and
  scurvy. That mortality is the background against which the Rutschmann orphan lead should be
  read.

  - **[LEAD]** Secondary transcriptions of the colony records place the Rutschmann household
  aboard the *Urania*, reaching Nova Friburgo on 30 November 1819 with Casa 56 / Lote 98, and
  report that his mother died at a Dutch staging point on 5 September 1819 and his brother
  Nicolas aboard ship on 11 October — so he would have arrived an orphan of about nineteen. No
  held record names him on that passage; the lead is consistent with the cohort's known
  mortality but is not evidence.

  - **[INFERRED]** If he did arrive orphaned at nineteen with no parents to hold a lot, his
  twenty-year delay before marrying in 1840 stops looking like a gap and starts looking like the
  time it took to build a household from nothing. The inference is reasonable and the premise is
  a lead; both should be held at that level.

  - **[CONTEXTUAL / INFERRED]** His Fribourg connection runs through his mother's side, not his
  father's: he was born at Bulle, but the family's own origin is placed at Bergöschingen in the
  Klettgau (Baden-Württemberg) by the same secondary research. Bulle was where the family was,
  not necessarily where it was from — which is why "Rutschmann of Fribourg" is a convenient
  shorthand and not a documented ancestry.

  - **[CONTEXTUAL]** Naturalisation and a marriage to a German-born woman put him in the
  colony's second phase, when the Swiss and German intakes stopped being two populations and
  became one. His daughter then married a Portuguese immigrant. Within two generations the
  "Swiss colony" was simply a fluminense town.

  ## Open questions

  - His exact baptism date at Bulle. The Catholic register of Saint-Pierre-aux-Liens, Bulle,
  would confirm the day calculated from his death entry and name his parents independently of
  the 1840 act. [OPEN]

  - Whether the *Urania* passage, Casa 56 / Lote 98 and the deaths in transit are his family's,
  at primary level. [LEAD]

  - His occupation and any property, on which all four held records are silent. Nova Friburgo
  land and tax records of the 1840s–50s are the place to look. [OPEN]

  ## Sources held (this repository)

  - **PAR-0076** — his own 1840 Nova Friburgo marriage act to Isabella Storck; primary for the
  marriage date, his parents, and his birth and baptism at Bulle, Switzerland.

  - **PAR-0069** — his daughter Maria Joanna's 1841/42 baptism; names him and Elisabeth Storck
  as her parents, with Balineat and Fabre as godparents.

  - **PAR-0070** — his daughter's 1859 marriage to Antonio da Silva Ferreira; names him and
  Isabel Stork as her parents.

  - **PAR-0071** — his own 1860 burial entry; primary for the date and hour of death, his age to
  the day, his wife, his Bulle origin and his naturalised-Brazilian status.

  ## Regional and migration context

  Nova Friburgo was manufactured by decree. On 16 May 1818 Dom João VI contracted
  Sébastien-Nicolas Gachet, agent of the Canton of Fribourg, to settle 100 Swiss Catholic
  families on the Fazenda do Morro Queimado, in mountains chosen for their resemblance to
  Switzerland; the first ship reached Rio on 4 November 1819 and the settlement became Vila de
  Nova Friburgo on 3 January 1820. [CONTEXTUAL] What the colonists found was stony, undersized
  highland lots with inadequate tools and support, and many abandoned them within a few years
  and dispersed across the fluminense highlands. [CONTEXTUAL] João José Rutschmann did not
  disperse: every held record places him in the parish of São João Baptista, from his 1840
  marriage to his burial in the town cemetery in 1860, and his descendants stayed in the
  district for two more generations. [PROVEN]

  ## Where to go today

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Canton Fribourg, Switzerland ·
  [Maps](https://maps.google.com/?q=46.6175,7.0581). His stated birth and baptism parish, named
  in two held records. Still standing; its Catholic register holds the entry that would fix his
  exact birth date. [RESOLVED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where he
  married in 1840, where his daughter was baptised in 1842 and married in 1859, and the parish
  that buried him in 1860. The present cathedral was inaugurated in 1869; all of his acts belong
  to the earlier church on the same site. [RESOLVED]

  - **The old town cemetery, Nova Friburgo** — his burial place, "o Cemiterio d'esta Villa", on
  23 July 1860. The register names no plot and no monument is known, so the cemetery is the
  anchor, not a grave. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Quatro documentos retidos atravessam sua vida adulta — o casamento (1840), o
  batismo da filha (1842), o casamento dela (1859) e o próprio sepultamento (1860) — e nenhum
  deles lhe dá uma ocupação. Está entre as pessoas mais bem documentadas deste grupo e entre as
  menos descritas.

  - **[PROVEN]** Seu assento de óbito é excepcionalmente preciso: morreu às oito e meia da noite
  de 22 de julho de 1860, em Nova Friburgo, "de idade de cincoenta e nove annos, dez mezes e
  vinte e dois dias". Subtraindo isso da data da morte, obtém-se um nascimento por volta de 30
  de agosto de 1800. (PAR-0071)

  - **[PROVEN]** O mesmo assento o dá como "natural e baptizado na Freguezia de Bulle, Cantão de
  Fribourg, na Suíça, **Brasileiro naturalizado**". Chegou súdito suíço e morreu cidadão
  brasileiro por naturalização, após cerca de quatro décadas na colônia. Seu assento de
  casamento de 1840 declara, de forma independente, o nascimento em Bulle — a origem repousa em
  dois documentos, não em um. (PAR-0071, PAR-0076)

  - **[PROVEN]** As testemunhas de seu casamento de 1840, João Balmat e Maria Fabre, reaparecem
  dois anos depois como padrinhos de sua primeira filha registrada ("João Balineat com Maria
  Fabre"). O mesmo casal esteve ao seu lado duas vezes — o traço mais claro de rede social que
  algum documento deste grupo preserva. (PAR-0076, PAR-0069)

  - **[PROVEN]** Escrivães lusófonos nunca escreveram seu sobrenome como Rutschmann. É "Rosman"
  em 1840 e "Rocheman" em 1842, 1859 e 1860 — quatro tentativas, quatro grafias, nenhuma delas a
  original.

  ## Identidade

  **João José Rutschmann**, registrado em toda a sua vida brasileira como **João José Rosman**
  ou **Rocheman** — imigrante suíço de Bulle que se radicou definitivamente em Nova Friburgo e
  ali morreu brasileiro naturalizado. Trisavô de Iris Bohrer Muniz (P-0007), pela cadeia Maria
  Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer (P-0015).
  [PROVEN; grau derivado dos vínculos familiares]

  - **Nascimento:** nascido e batizado na freguesia de Bulle, Cantão de Fribourg, Suíça. O lugar
  é declarado duas vezes (PAR-0076, PAR-0071); a data, cerca de 30 de agosto de 1800, é
  calculada a partir da idade registrada em seu óbito. [PROVEN quanto a Bulle; a data é INFERRED
  a partir de PAR-0071]

  - **Pais:** filho legítimo de Frédéric Rutschmann, grafado "Frederico Rosman" (P-0119), e de
  Jeanne Germaine Caroline, grafada "Joanna Germana Carolina" (P-0120); família F-0060. [PROVEN
  — PAR-0076]

  - **Casamento:** com Elisabeth Storck, grafada "Isabella Storck" (P-0110), em 23 de junho de
  1840, na Matriz de São João Baptista, Nova Friburgo, perante o coadjutor João José Vivianno,
  tendo João Balmat e Maria Fabre como testemunhas. (PAR-0076, evento E-0121) [PROVEN]

  - **Óbito:** 22 de julho de 1860, às 20h30, em Nova Friburgo; sepultado no dia seguinte no
  cemitério da vila pelo Vigário Jacob Joye. (PAR-0071, evento E-0095) [PROVEN]

  - **Nacionalidade:** suíço de nascimento, brasileiro naturalizado em 1860. [PROVEN — PAR-0071]

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo, alfabetização ou assinatura aparece para ele em qualquer
  dos quatro documentos retidos — uma lacuna real, não um descuido deste perfil. O sepultamento
  de 1860 registra que foi "encommendado, acompanhado, e sepultado" no cemitério da vila, um
  enterro católico normal com a presença da paróquia, e os atos de 1840 e 1859 o situam como
  morador da freguesia. A naturalização é o único estatuto formal que os documentos lhe
  atribuem, e diz algo de real: ele tinha no Brasil uma participação permanente suficiente para
  regularizá-la.

  ## Família e rede social

  Casou-se com Elisabeth Storck em 1840, e a união é confirmada duas vezes — pelo próprio
  assento e pelo registro de óbito, vinte anos depois, que ainda o nomeia "cazado com Isabel
  Stork". Como esse assento o registra casado, e não viúvo, ela o sobreviveu. [PROVEN —
  PAR-0076, PAR-0071]

  A filha Maria Joanna (P-0037) nasceu em 2 de maio de 1841 e foi batizada em 20 de fevereiro de
  1842, com João Balineat e Maria Fabre — as próprias testemunhas de seu casamento — como
  padrinhos. Em 1859 ela casou-se com o imigrante português Antonio da Silva Ferreira, ele
  próprio "natural e baptizado na Freguezia de [Guenfães — incerto] em Portugal": a linha da
  colônia suíça unindo-se a uma portuguesa, na igreja da colônia, no ano anterior à morte de
  João José. [PROVEN — PAR-0069, PAR-0070]

  Seus próprios pais são nomeados em seu assento de casamento de 1840 e em nenhum outro ponto
  deste arquivo. [PROVEN — PAR-0076]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Ele pertence à coorte de 1819 do programa de colonização de Dom João VI,
  decretado em 16 de maio de 1818 e contratado com o agente friburguês Gachet. O recrutamento
  excedeu-se para cerca de 261–265 famílias; partiram de Estavayer-le-Lac em 4 de julho de 1819,
  via Basileia e Roterdã, e navegaram para o Rio numa frota de oito embarcações. Cerca de um
  quarto morreu no percurso, de tifo e escorbuto. Essa mortalidade é o pano de fundo contra o
  qual se deve ler a pista do órfão Rutschmann.

  - **[LEAD]** Transcrições secundárias dos registros da colônia situam o domicílio Rutschmann a
  bordo do *Urania*, chegado a Nova Friburgo em 30 de novembro de 1819 com a Casa 56 / Lote 98,
  e relatam que sua mãe morreu num ponto de escala holandês em 5 de setembro de 1819 e seu irmão
  Nicolas a bordo, em 11 de outubro — de modo que ele teria chegado órfão, com cerca de dezenove
  anos. Nenhum documento retido o nomeia nessa travessia; a pista é compatível com a mortalidade
  conhecida da coorte, mas não é evidência.

  - **[INFERRED]** Se de fato chegou órfão aos dezenove anos, sem pais para deter um lote, o
  intervalo de vinte anos até casar-se em 1840 deixa de parecer uma lacuna e passa a parecer o
  tempo necessário para erguer um domicílio a partir do nada. A inferência é razoável e a
  premissa é pista; ambas devem ser mantidas nesse nível.

  - **[CONTEXTUAL / INFERRED]** Sua ligação com Friburgo passa pelo lado materno, não pelo
  paterno: nasceu em Bulle, mas a mesma pesquisa secundária situa a origem da família em
  Bergöschingen, no Klettgau (Baden-Württemberg). Bulle era onde a família estava, não
  necessariamente de onde vinha — razão pela qual "Rutschmann de Friburgo" é atalho conveniente,
  e não ascendência documentada.

  - **[CONTEXTUAL]** A naturalização e o casamento com uma mulher nascida na Alemanha o situam
  na segunda fase da colônia, quando as entradas suíça e alemã deixaram de ser duas populações e
  passaram a ser uma. A filha, em seguida, casou-se com um imigrante português. Em duas
  gerações, a "colônia suíça" era simplesmente uma vila fluminense.

  ## Questões em aberto

  - A data exata de seu batismo em Bulle. O livro católico de Saint-Pierre-aux-Liens, em Bulle,
  confirmaria o dia calculado a partir do óbito e nomearia seus pais de forma independente do
  ato de 1840. [OPEN]

  - Se a travessia do *Urania*, a Casa 56 / Lote 98 e as mortes em trânsito são de sua família,
  em nível primário. [LEAD]

  - Sua ocupação e eventuais bens, sobre os quais os quatro documentos retidos silenciam. Os
  registros de terras e impostos de Nova Friburgo das décadas de 1840–50 são o lugar a procurar.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — seu próprio assento matrimonial de 1840, em Nova Friburgo, com Isabella
  Storck; primário para a data do casamento, sua filiação e seu nascimento e batismo em Bulle,
  Suíça.

  - **PAR-0069** — batismo de 1841/42 da filha Maria Joanna; nomeia-o, com Elisabeth Storck,
  como pai, e traz Balineat e Fabre como padrinhos.

  - **PAR-0070** — casamento de 1859 da filha com Antonio da Silva Ferreira; nomeia-o, com
  Isabel Stork, como pai.

  - **PAR-0071** — seu próprio assento de óbito de 1860; primário para a data e a hora da morte,
  sua idade ao dia, sua esposa, sua origem em Bulle e sua condição de brasileiro naturalizado.

  ## Contexto regional e migratório

  Nova Friburgo foi fabricada por decreto. Em 16 de maio de 1818 Dom João VI contratou
  Sébastien-Nicolas Gachet, agente do Cantão de Friburgo, para assentar 100 famílias católicas
  suíças na Fazenda do Morro Queimado, em montanhas escolhidas por lembrarem a Suíça; o primeiro
  navio chegou ao Rio em 4 de novembro de 1819 e o povoado tornou-se Vila de Nova Friburgo em 3
  de janeiro de 1820. [CONTEXTUAL] O que os colonos encontraram foram lotes serranos pedregosos
  e exíguos, com ferramentas e apoio insuficientes, e muitos os abandonaram em poucos anos,
  dispersando-se pela serra fluminense. [CONTEXTUAL] João José Rutschmann não se dispersou:
  todos os documentos retidos o situam na freguesia de São João Baptista, do casamento de 1840
  ao sepultamento no cemitério da vila em 1860, e seus descendentes permaneceram no distrito por
  mais duas gerações. [PROVEN]

  ## Onde ir hoje

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Cantão de Fribourg, Suíça ·
  [Mapa](https://maps.google.com/?q=46.6175,7.0581). Sua freguesia declarada de nascimento e
  batismo, nomeada em dois documentos retidos. Ainda de pé; seu livro católico guarda o assento
  que fixaria a data exata de seu nascimento. [RESOLVED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde se
  casou em 1840, onde a filha foi batizada em 1842 e casada em 1859, e a paróquia que o sepultou
  em 1860. A catedral atual foi inaugurada em 1869; todos os seus atos pertencem à igreja
  anterior, no mesmo sítio. [RESOLVED]

  - **O antigo cemitério da vila, Nova Friburgo** — seu lugar de sepultamento, "o Cemiterio
  d'esta Villa", em 23 de julho de 1860. O assento não indica sepultura e nenhum monumento é
  conhecido, de modo que o cemitério é a âncora, não um túmulo. [APPROX]
