    parentage family is modelled — the omission is deliberate pending a Bulle baptism.
profile: >-
  ## Identity

  **João José Rutschmann** (recorded at Nova Friburgo as **João José Rocheman** — the priest's
  phonetic rendering of the German surname) — a Swiss immigrant from Bulle, canton Fribourg, who
  settled permanently at Nova Friburgo, Rio de Janeiro, as a naturalised Brazilian citizen. [PROVEN]

  - **Role:** father of Maria Joanna Rutschmann (P-0037); husband of Elisabeth (Isabel) Storck
  (P-0110); family F-0054. [PROVEN]

  - **Birth:** born and baptised in the parish of Bulle, Canton Fribourg, Switzerland, around
  30 August 1800 — the year and place stated in his 1860 death entry ("natural e baptizado na
  Frequezia de Bulle, Cantão de Fribourg, na Suíça"), the exact day derived by back-calculating
  the age recorded in that same death entry (22 July 1860 minus 59 years, 10 months and
  22 days). [PROVEN (~1800, Bulle) — PAR-0071; exact day 30 Aug INFERRED from PAR-0071
  age-at-death]

  - **Death:** died 22 July 1860 at 8.30 p.m. at Nova Friburgo, aged 59 years, 10 months and
  22 days; buried the following day in the town cemetery; officiant Vigário Jacob Joye. [PROVEN
  — PAR-0071, event E-0095]

  - **Nationality:** Swiss by birth; a naturalised Brazilian citizen ("Brasileiro naturalizado")
  by the time of his death in 1860. [PROVEN — PAR-0071]

  ## Immigration and settlement

  A secondary transcription of the Nova Friburgo colony records places the Rutschmann household
  aboard the ship *Urania*, reaching Nova Friburgo on 30 November 1819 and assigned Casa 56 /
  Lote 98. That same secondary source records that both his parents and a brother died in transit
  — his mother before the ship departed (5 September 1819, Netherlands) and his brother Nicolas
  aboard the *Urania* (11 October 1819) — so he arrived an orphan of approximately 19. [LEAD —
  Raibert Rutschmann-Rochemont ship transcription; no held primary names him on this passage]

  ## Family and social network

  He married Elisabeth Storck (P-0110) at Nova Friburgo; the union is confirmed by his 1860
  death entry naming her as his wife ("casado com Isabel Stork"), though the marriage act
  itself is not yet held. [PROVEN (couple) — PAR-0071; OPEN (marriage date/act)]

  Their daughter Maria Joanna (P-0037) was born at Nova Friburgo on 2 May 1841 (E-0093,
  PAR-0069) and in 1859 married the Portuguese immigrant Antonio da Silva Ferreira (PAR-0070,
  E-0094), connecting the Rutschmann Swiss-colony line to the Portuguese Ferreira/da Silva
  trunk. [PROVEN]

  His parentage is not recorded in any held document; the 1860 death entry states only his Bulle
  origin and surviving wife. A secondary source names his parents as Frédéric Rutschmann and
  Jeanne Germaine Caroline, both reportedly dying in transit in 1819. [OPEN (parentage in held
  records); LEAD (parent names — Raibert blog)]

  ## Open questions

  - His Bulle baptism (~1800) — the Catholic register of Saint-Pierre-aux-Liens, Bulle, would
  confirm the exact date and his parentage. [OPEN]

  - The Nova Friburgo marriage act for the Rutschmann × Storck union — the date and filiation
  of the marriage remain unresolved; bounded to NF Casamentos c. 1828–1831. [OPEN]

  ## Sources held (this repository)

  - PAR-0069 (his daughter's 1841/42 Nova Friburgo baptism — names him as father alongside
  Elisabeth Storck).

  - PAR-0070 (his daughter's 1859 Nova Friburgo marriage — names him as father alongside
  Isabel Stork).

  - PAR-0071 (his own 1860 Nova Friburgo death entry — primary record for date, age, Bulle
  origin, wife, and naturalised-Brazilian status).
profile_pt: >-
  ## Identidade

  **João José Rutschmann** (registado em Nova Friburgo como **João José Rocheman** — a
  lusofonia fonética do sobrenome alemão adotada pelo pároco) — imigrante suíço de Bulle,
  cantão de Fribourg, que se radicou permanentemente em Nova Friburgo, Rio de Janeiro, como
  cidadão brasileiro naturalizado. [PROVEN]

  - **Papel:** pai de Maria Joanna Rutschmann (P-0037); marido de Elisabeth (Isabel) Storck
  (P-0110); família F-0054. [PROVEN]

  - **Nascimento:** nascido e baptizado na Freguesia de Bulle, Cantão de Fribourg, Suíça,
  cerca de 30 de agosto de 1800 — ano e local declarados em seu registro de óbito de 1860
  ("natural e baptizado na Frequezia de Bulle, Cantão de Fribourg, na Suíça"); o dia exato
  deriva do cálculo da idade registrada nesse mesmo óbito (22 de julho de 1860 menos 59 anos,
  10 meses e 22 dias). [PROVEN (~1800, Bulle) — PAR-0071; dia exato 30 ago. INFERRED from
  PAR-0071 age-at-death]

  - **Óbito:** faleceu em 22 de julho de 1860, às 20h30, em Nova Friburgo, com 59 anos,
  10 meses e 22 dias; sepultado no dia seguinte no Cemitério da Vila; officiante Vigário
  Jacob Joye. [PROVEN — PAR-0071, evento E-0095]

  - **Nacionalidade:** suíço de origem; brasileiro naturalizado ("Brasileiro naturalizado")
  à época de sua morte em 1860. [PROVEN — PAR-0071]

  ## Imigração e estabelecimento

  Uma transcrição secundária dos registros de colonização de Nova Friburgo situa a família
  Rutschmann a bordo do navio *Urania*, que chegou a Nova Friburgo em 30 de novembro de
  1819 com a Casa 56 / Lote 98 atribuída ao grupo. Essa mesma fonte secundária registra que
  seus pais e um irmão faleceram em trânsito — a mãe antes do embarque (5 de setembro de
  1819, Países Baixos) e o irmão Nicolas a bordo do *Urania* (11 de outubro de 1819) —,
  de modo que ele chegou órfão, com cerca de 19 anos. [LEAD — transcrição Raibert
  Rutschmann-Rochemont; nenhum documento primário o nomeia nessa passagem]

  ## Família e rede social

  Casou-se com Elisabeth Storck (P-0110) em Nova Friburgo; a união é confirmada pelo registro
  de óbito de 1860, que a nomeia como esposa sobrevivente ("casado com Isabel Stork"), embora
  o assento matrimonial em si não esteja disponível. [PROVEN (casal) — PAR-0071; OPEN
  (data/assento do casamento)]

  Sua filha Maria Joanna (P-0037) nasceu em Nova Friburgo em 2 de maio de 1841 (E-0093,
  PAR-0069) e em 1859 casou-se com o imigrante português Antonio da Silva Ferreira (PAR-0070,
  E-0094), unindo a linhagem suíça dos Rutschmann ao tronco português Ferreira/da Silva.
  [PROVEN]

  A filiação de João José não consta em nenhum documento primário disponível; o óbito de
  1860 indica apenas sua origem em Bulle e a esposa sobrevivente. Uma fonte secundária
  nomeia seus pais como Frédéric Rutschmann e Jeanne Germaine Caroline, ambos falecidos em
  trânsito em 1819. [OPEN (filiação em registros primários); LEAD (nomes dos pais — blog
  Raibert)]

  ## Questões em aberto

  - Seu batismo em Bulle (~1800) — o registro paroquial católico de Saint-Pierre-aux-Liens,
  Bulle, confirmaria a data exata e sua filiação. [OPEN]

  - O assento matrimonial Rutschmann × Storck em Nova Friburgo — data e filiação não
  resolvidas; estimado nos Casamentos de NF c. 1828–1831. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0069 (batismo de 1841/42 de sua filha em Nova Friburgo — nomeia-o como pai ao lado
  de Elisabeth Storck).

  - PAR-0070 (casamento de 1859 de sua filha em Nova Friburgo — nomeia-o como pai ao lado
  de Isabel Stork).

  - PAR-0071 (seu próprio registro de óbito de 1860 em Nova Friburgo — fonte primária para
  a data, a idade, a origem em Bulle, a esposa e a condição de brasileiro naturalizado).
