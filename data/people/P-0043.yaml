notes:
- text: >-
    The elder José do Rego Brandão — father of the José do Rego Brandão (P-0040) who
    married Rita Ignacia de Jesus. Named (with his wife Maria de Mendonça, P-0044) in
    his son's 1912 Carangola death (PAR-0008): "filho de José do Rego Brandão e de
    Maria de Mendonça". He shares his son's exact name; the two are distinguished by
    generation (this is P-0040's father). Own vital records not located. The record
    gives only "José do Rego Brandão" (preserved as the name variant); the "(o velho)"
    in the preferred name is an editorial disambiguator from his identically-named son
    (P-0040), not a source form.
  text_pt: >-
    O José do Rego Brandão mais velho — pai do José do Rego Brandão (P-0040) que
    se casou com Rita Ignacia de Jesus. Nomeado (junto com sua esposa Maria de
    Mendonça, P-0044) no óbito de 1912 do filho em Carangola (PAR-0008): "filho
    de José do Rego Brandão e de Maria de Mendonça". Ele tem exatamente o mesmo
    nome do filho; os dois são distinguidos por geração (este é o pai de P-0040).
    Registros vitais próprios não localizados. O registro fornece apenas "José do
    Rego Brandão" (preservado como variante de nome); o "(o velho)" no nome
    preferencial é um recurso editorial de desambiguação em relação ao filho
    homônimo (P-0040), não uma forma de fonte.
