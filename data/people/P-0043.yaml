profile: >-
  ## Interesting facts

  - **[PROVEN]** He is known from a single derivative mention: named as the father of the deceased in his son's 1912 Carangola death record — "filho de José do Rego Brandão e de Maria de Mendonça" (PAR-0008). No record of his own has been located.

  - **[INFERRED]** He shared his son's exact name — José do Rego Brandão — across two generations, a deliberate naming pattern. In 19th-century Paraíba do Sul valley families, repeating the father's full name in the eldest son was a common assertion of family identity and social continuity.

  - **[CONTEXTUAL]** His son (P-0040) was born about 1833 in the Paraíba do Sul valley (Sapucaia, RJ), which would place the elder José's birth perhaps around 1800–1810, in a period when the Paraíba valley was shifting from subsistence farming toward the early coffee economy that would dominate the region for the next 50 years.

  - **[INFERRED]** His son became the trusted godfather to Açorean immigrant families at Sapucaia — a role that required established, respected standing. That standing was likely inherited, or at least established, from the elder José's generation, suggesting a family with some continuity of rootedness in the Sapucaia community.

  - **[CONTEXTUAL]** The Sapucaia region of the Paraíba do Sul valley (RJ) was part of the first coffee frontier expanding inland from the Rio de Janeiro coast in the early 19th century; a family established there by the 1830s would have participated in or witnessed the early coffee economy's rise, before following its expansion to Carangola in the Zona da Mata Mineira.

  ## Identity

  **José do Rego Brandão (the elder)** — a stub ancestor known from a single derivative
  mention. [PROVEN name] The "(o velho)" is an editorial disambiguator from his
  identically-named son (P-0040), not a source form.

  - **Role:** father of the Sapucaia patriarch José do Rego Brandão (P-0040) and, through
  him and granddaughter Susanna (P-0020), a great-great-grandparent of the Muniz line
  (family F-0021). [PROVEN]

  - **Spouse:** Maria de Mendonça (P-0044). [PROVEN]

  - **Only attestation:** named, with his wife, as the parents of the deceased in his son's
  1912 Carangola death (PAR-0008). No record of his own has been located. [PROVEN via
  PAR-0008]

  - **Birth, death and origin:** unknown; nationality left unset. [OPEN]

  ## What we can extrapolate

  He is the unplaced trunk of the Brandão line's rootedness. [INFERRED — origin OPEN] Standing
  one generation above the settled Sapucaia patriarch (P-0040), he raises the branch's central
  unknown: whether the Rego Brandão line's "established-local" standing — the social rootedness
  its later members traded on (see P-0040) — was already Brazilian-rooted at his level, or
  whether his was the incoming generation. Nothing documents wealth, office or origin for him;
  the record shows only that he transmitted the Rego Brandão name to a son who became a
  respected native householder. The single question that would place him — Brazilian-born
  versus Portuguese/Açorean immigrant — is exactly the gap noted below.

  ## Open questions

  - His own records and the Rego Brandão family's origin (Brazilian-born, likely
  Rio de Janeiro interior, versus immigrant) — decisive record: his son's baptism (about
  1833) or his own marriage. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (his son José's 1912 Carangola death — the sole record naming him, as the
  deceased's father).

  ## Where to go today

  - **Presumed origin/residence:** Santo Antônio de Sapucaia, RJ (Paraíba do Sul valley; named only as
  his son's father — no record fixes an exact place) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é conhecido por uma única menção derivada: nomeado como pai do falecido no registro de óbito de 1912 de seu filho em Carangola — "filho de José do Rego Brandão e de Maria de Mendonça" (PAR-0008). Nenhum registro próprio dele foi localizado.

  - **[INFERRED]** Ele compartilhou com o filho o nome exato — José do Rego Brandão — por duas gerações, um padrão de nomeação deliberado. Nas famílias do vale do Paraíba do Sul do século XIX, repetir o nome completo do pai no filho mais velho era uma afirmação comum de identidade familiar e continuidade social.

  - **[CONTEXTUAL]** Seu filho (P-0040) nasceu por volta de 1833 no vale do Paraíba do Sul (Sapucaia, RJ), o que situaria o nascimento do José mais velho talvez por volta de 1800–1810, um período em que o vale do Paraíba estava passando da agricultura de subsistência para a economia cafeeira incipiente que dominaria a região pelos 50 anos seguintes.

  - **[INFERRED]** Seu filho tornou-se o padrinho de confiança de famílias de imigrantes açorianos em Sapucaia — papel que exigia posição estabelecida e respeitada. Essa posição foi provavelmente herdada, ou ao menos estabelecida, a partir da geração do José mais velho, sugerindo uma família com alguma continuidade de enraizamento na comunidade de Sapucaia.

  - **[CONTEXTUAL]** A região de Sapucaia, no vale do Paraíba do Sul (RJ), fazia parte da primeira fronteira cafeeira que se expandia para o interior a partir do litoral fluminense no início do século XIX; uma família estabelecida ali na década de 1830 teria participado ou testemunhado a ascensão da economia cafeeira inicial, antes de seguir sua expansão para Carangola, na Zona da Mata Mineira.

  ## Identidade

  **José do Rego Brandão (o velho)** — um ancestral esboço, conhecido por uma única menção
  derivada. [PROVEN, o nome] O "(o velho)" é um recurso editorial de desambiguação em
  relação ao filho homônimo (P-0040), não uma forma de fonte.

  - **Papel:** pai do patriarca de Sapucaia José do Rego Brandão (P-0040) e, por meio dele e
  da neta Susanna (P-0020), um trisavô da linha Muniz (família F-0021). [PROVEN]

  - **Cônjuge:** Maria de Mendonça (P-0044). [PROVEN]

  - **Única atestação:** nomeado, junto com sua esposa, como os pais do falecido no óbito de
  1912 de seu filho, em Carangola (PAR-0008). Nenhum registro próprio dele foi localizado.
  [PROVEN via PAR-0008]

  - **Nascimento, óbito e origem:** desconhecidos; nacionalidade deixada em branco. [OPEN]

  ## O que podemos extrapolar

  Ele é o tronco não localizado do enraizamento da linha Brandão. [INFERRED — origem OPEN]
  Situando-se uma geração acima do patriarca estabelecido de Sapucaia (P-0040), ele levanta o
  desconhecido central do ramo: se a posição "nativo-estabelecida" da linha Rego Brandão — o
  enraizamento social do qual seus membros posteriores se valeram (ver P-0040) — já era
  brasileira-enraizada em seu nível, ou se a sua foi a geração recém-chegada. Nada documenta
  riqueza, ofício ou origem para ele; o registro mostra apenas que ele transmitiu o nome Rego
  Brandão a um filho que se tornou um respeitado chefe de casa nativo. A única questão que o
  situaria — nascido no Brasil versus imigrante português/açoriano — é exatamente a lacuna
  apontada abaixo.

  ## Questões em aberto

  - Seus próprios registros e a origem da família Rego Brandão (nascida no Brasil,
  provavelmente no interior fluminense, versus imigrante) — registro decisivo: o batismo de
  seu filho (por volta de 1833) ou seu próprio casamento. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (o óbito de 1912 de seu filho José, em Carangola — o único registro que o
  nomeia, como pai do falecido).

  ## Onde ir hoje

  - **Origem/residência presumida:** Santo Antônio de Sapucaia, RJ (vale do Paraíba do Sul; nomeado
  apenas como pai de seu filho — nenhum registro fixa um local exato) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
