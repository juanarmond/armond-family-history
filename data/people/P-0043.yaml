profile: >-
  ## Interesting facts

  - **[PROVEN]** He survives in this archive in eight words. His son's 1912 Carangola death act says "filho [legítimo] de José do Rego Brandão e de Maria de Mendonça" (PAR-0008), and that is the whole of him. No record of his own has been located.

  - **[PROVEN]** Father and son carried the identical full name. The "(o velho)" in the preferred name is an editorial disambiguator used here, not a form any record gives.

  - **[INFERRED]** Those eight words are themselves a small finding about how this family kept its past. In 1912 an informant at Carangola could still name both parents of a 79-year-old man who had died hundreds of kilometres from where they lived. The names had been carried for roughly eighty years with no paper behind them: in a household that left no probate, no title and no letters, memory was the archive.

  - **[INFERRED]** His son was born about 1833, which places this couple's household in the early 1830s. Whether it was already in the Paraíba do Sul valley — where the son is later documented — is not established by any record.

  - **[CONTEXTUAL]** A household formed in early-1830s Brazil sat at the opening of the Paraíba valley coffee economy and in the middle of the Regency. If the family was already in that valley, it watched the region become one of the empire's richest corridors without, on the evidence of its descendants, acquiring any part of it.

  ## Identity

  **José do Rego Brandão (the elder)** — a stub ancestor known from a single derivative mention. [PROVEN as named]

  - **Relationship:** 2×-great-grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs José the elder → José do Rego Brandão (P-0040) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. Family F-0021. [derived from families F-0021, F-0019, F-0007 and F-0001]

  - **Spouse:** Maria de Mendonça (P-0044). [PROVEN as named]

  - **Only attestation:** named, with his wife, as the parents of the deceased in his son's 1912 Carangola death (PAR-0008) — a record written about eighty years after the fact and reported by an informant, not a contemporary act. [PROVEN as an attestation; derivative in quality]

  - **Birth, death and origin:** unknown. Nationality is deliberately left unset: no birthplace and no stated *nacionalidade* is evidenced for him, and none is inferred from the surname. [OPEN]

  ## Standing and profession

  Nothing whatever is documented — no occupation, office, title, property or literacy. This is not a thin record so much as a single filiation line, and it will support no reading of his standing at all. [OPEN]

  ## Family and social network

  Father of José do Rego Brandão (P-0040), the Santo Antônio de Sapucaia householder who became the godparent of choice for Azorean immigrants in the 1880s, and grandfather of Susanna Rita Brondão (P-0020), who married one of them. Nothing connects him personally to that Sapucaia network; he is known only through his son.

  ## What we can extrapolate

  He is the unplaced trunk of whatever rootedness the Brandão line had, and the honest answer is that one derivative filiation will not carry more than that. [INFERRED — origin OPEN]

  Standing one generation above the settled Sapucaia householder, he poses the branch's single real question: was the Rego Brandão family's established local standing — the belonging its later members traded on, which is the only capital this line is documented as having — already in place at his level, or did it begin with his son? The two answers imply different histories. If the standing was already his, the family was long-rooted in the Paraíba valley and his son merely inherited a position; if it began with the son, then the one asset this branch ever held was self-made in a single generation, and nothing at all came down from here.

  Nothing in the record decides between them. What can be said is narrow and worth saying precisely: no wealth, office or origin is documented for him; no estate record exists at his level or his son's; and the only thing he is shown transmitting is a name, repeated exactly. In a line that leaves no probate anywhere, name and memory are the entire inheritance — which is why the identical naming matters more here than it would in a family with land to pass on. [INFERRED]

  ## Open questions

  - His own records and the Rego Brandão family's origin — Brazilian-born, most plausibly in the Rio de Janeiro interior, versus incomer. The decisive records would be his son's baptism (about 1833) or his own marriage; Santo Antônio de Sapucaia was erected as a freguesia only in 1871, so both lie in a predecessor parish whose pre-1885 books are undigitised. [OPEN]

  - Whether he and his wife had other children — no inventário, no "N filhos" statement, no denominator. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (his son José's 1912 Carangola death — the sole record naming him, as the deceased's father).

  ## Regional and migration context

  No place is documented for him. [OPEN] His son is recorded at Santo Antônio de Sapucaia, in the Paraíba do Sul valley (RJ), and later at Carangola in the Zona da Mata Mineira, so a Paraíba valley location for this couple is a reasonable working assumption and nothing more. [INFERRED] The regional history that applies to his son — the post-1850 free-labour transition under the Lei nº 581 de 1850 (Lei Eusébio de Queirós), abolition under the Lei Áurea (1888), and land placed on a purchase basis by the Lei de Terras (nº 601, 1850) — falls mostly after his own lifetime. No origin, Portuguese or otherwise, is inferred from the surname. [CONTEXTUAL]

  ## Where to go today

  - **Presumed residence:** Santo Antônio de Sapucaia, RJ (Paraíba do Sul valley) — named only as his son's father; no record fixes a place [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele sobrevive neste arquivo em oito palavras. O ato de óbito de seu filho, em 1912, em Carangola, diz "filho [legítimo] de José do Rego Brandão e de Maria de Mendonça" (PAR-0008), e isso é tudo o que há dele. Nenhum registro próprio foi localizado.

  - **[PROVEN]** Pai e filho levavam o nome completo idêntico. O "(o velho)" no nome preferencial é um recurso editorial de desambiguação usado aqui, não uma forma que registro algum forneça.

  - **[INFERRED]** Essas oito palavras são, elas mesmas, um pequeno achado sobre como esta família guardava seu passado. Em 1912, um declarante em Carangola ainda podia nomear os dois pais de um homem de 79 anos que morrera a centenas de quilômetros de onde eles viveram. Os nomes haviam sido carregados por cerca de oitenta anos sem papel algum por trás: num lar que não deixou inventário, título nem cartas, a memória era o arquivo.

  - **[INFERRED]** Seu filho nasceu por volta de 1833, o que situa o lar deste casal no início dos anos 1830. Se já estava no vale do Paraíba do Sul — onde o filho é depois documentado — nenhum registro estabelece.

  - **[CONTEXTUAL]** Um lar formado no Brasil do início dos anos 1830 estava na abertura da economia cafeeira do vale do Paraíba e em plena Regência. Se a família já estava naquele vale, viu a região tornar-se um dos corredores mais ricos do império sem, pelo que atestam seus descendentes, adquirir parte alguma dela.

  ## Identidade

  **José do Rego Brandão (o velho)** — ancestral em esboço, conhecido por uma única menção derivada. [PROVEN quanto ao nome]

  - **Parentesco:** trisavô de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre José, o velho → José do Rego Brandão (P-0040) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. Família F-0021. [derivado das famílias F-0021, F-0019, F-0007 e F-0001]

  - **Esposa:** Maria de Mendonça (P-0044). [PROVEN quanto ao nome]

  - **Única atestação:** nomeado, com a esposa, como os pais do falecido no óbito de 1912 de seu filho em Carangola (PAR-0008) — registro lavrado cerca de oitenta anos depois do fato e informado por um declarante, não um ato contemporâneo. [PROVEN como atestação; derivado em qualidade]

  - **Nascimento, óbito e origem:** desconhecidos. A nacionalidade é deliberadamente não definida: nenhum local de nascimento e nenhuma *nacionalidade* declarada estão evidenciados para ele, e nenhuma é inferida do sobrenome. [OPEN]

  ## Posição social e profissão

  Absolutamente nada está documentado — nenhuma ocupação, cargo, título, propriedade ou alfabetização. Não é tanto um registro escasso quanto uma única linha de filiação, e ela não sustentará leitura alguma de sua posição. [OPEN]

  ## Família e rede social

  Pai de José do Rego Brandão (P-0040), o chefe de casa de Santo Antônio de Sapucaia que se tornou o padrinho preferido dos imigrantes açorianos nos anos 1880, e avô de Susanna Rita Brondão (P-0020), que se casou com um deles. Nada o liga pessoalmente àquela rede de Sapucaia; ele é conhecido apenas por meio do filho.

  ## O que podemos extrapolar

  Ele é o tronco não situado de qualquer enraizamento que a linha Brandão tenha tido, e a resposta honesta é que uma única filiação derivada não sustenta mais do que isso. [INFERRED — origem OPEN]

  Uma geração acima do chefe de casa estabelecido em Sapucaia, ele coloca a única questão real do ramo: a posição local consolidada da família Rego Brandão — o pertencimento com que seus membros posteriores negociaram, que é o único capital que esta linha está documentada tendo — já existia no nível dele, ou começou com o filho? As duas respostas implicam histórias diferentes. Se a posição já era dele, a família estava havia muito enraizada no vale do Paraíba e o filho apenas herdou um lugar; se começou com o filho, então o único ativo que este ramo jamais teve foi feito por conta própria numa só geração, e daqui absolutamente nada desceu.

  Nada no registro decide entre as duas. O que se pode dizer é estreito e vale dizer com precisão: nenhuma riqueza, cargo ou origem lhe é documentada; nenhum registro de espólio existe no nível dele nem no do filho; e a única coisa que ele é mostrado transmitindo é um nome, repetido exatamente. Numa linha que não deixa inventário em parte alguma, nome e memória são a herança inteira — e é por isso que a nomeação idêntica importa mais aqui do que importaria numa família com terra a legar. [INFERRED]

  ## Questões em aberto

  - Seus próprios registros e a origem da família Rego Brandão — nascida no Brasil, mais plausivelmente no interior do Rio de Janeiro, ou vinda de fora. Os registros decisivos seriam o batismo de seu filho (por volta de 1833) ou seu próprio casamento; Santo Antônio de Sapucaia só foi erigida em freguesia em 1871, de modo que ambos estão numa paróquia antecessora cujos livros anteriores a 1885 não estão digitalizados. [OPEN]

  - Se ele e a esposa tiveram outros filhos — não há inventário, declaração de "N filhos" nem denominador. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (o óbito de 1912 de seu filho José em Carangola — o único registro que o nomeia, como pai do falecido).

  ## Contexto regional e migratório

  Nenhum lugar lhe é documentado. [OPEN] Seu filho está registrado em Santo Antônio de Sapucaia, no vale do Paraíba do Sul (RJ), e depois em Carangola, na Zona da Mata Mineira, de modo que uma localização no vale do Paraíba para este casal é hipótese de trabalho razoável e nada além disso. [INFERRED] A história regional que se aplica ao filho — a transição para o trabalho livre pós-1850 sob a Lei nº 581 de 1850 (Lei Eusébio de Queirós), a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850) — cai majoritariamente depois de sua própria vida. Nenhuma origem, portuguesa ou outra, é inferida do sobrenome. [CONTEXTUAL]

  ## Onde ir hoje

  - **Residência presumida:** Santo Antônio de Sapucaia, RJ (vale do Paraíba do Sul) — nomeado apenas como pai de seu filho; nenhum registro fixa um lugar [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
