notes:
- text: >-
    Ahnentafel position 29 — mother of João Gonçalves Bohrer (P-0014). Named as
    "Carolina Bohrer, doméstica" in his 1970 death (CIV-0014) and as Eunir
    Bohrer's paternal grandmother in the 1924 Nova Friburgo birth (CIV-0016). Her
    maiden surname is not recorded ("Bohrer" is her married name); no record of
    her own has been located.
