- text: >-
    Ahnentafel position 29 — mother of João Gonçalves Bohrer (P-0014). Named as
    "Carolina Bohrer, doméstica" in his 1970 death (CIV-0014) and as Eunir
    Bohrer's paternal grandmother in the 1924 Nova Friburgo birth (CIV-0016).
    Her maiden surname, once known only from a collaborative-blog lead, is now
    primary-confirmed as KLEIN by her own 1890 Nova Friburgo marriage (PAR-0064):
    "Carolina Klein … filha legitima de Jacob Klein e Maria Luiza Schenkel" — a
    legitimate daughter of Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104),
    family F-0051. That record makes her 17 in 1890 (so born ~1873), "nascida,
    baptizada e moradora nesta freguesia de Nova Friburgo", and records that she
    abjured Protestantism and was baptised Catholic just before the wedding (the
    Klein family were Lutheran colonists).
