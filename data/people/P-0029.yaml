profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1890 marriage record documents a remarkable religious crossing: born and baptised Lutheran in Nova Friburgo as the daughter of colonists Jacob Klein and Maria Luiza Schenkel, she formally abjured Protestantism and was re-baptised Catholic just before marrying into the Catholic Bohrer family (PAR-0064).

  - **[CONTEXTUAL]** The Klein family were part of the 1824 German immigration wave to Nova Friburgo, supplementing the original 1819 Swiss colonists; by the 1890s, both groups had intermixed into the same highland colony community, though religious differences between Catholic and Lutheran families persisted across generations.

  - **[INFERRED]** She was recorded as "doméstica" and living at Volta Redonda in 1970, apparently outliving her son João Gonçalves (CIV-0014) — placing her at the final endpoint of the family's migration arc: from a Nova Friburgo Lutheran colonist family to a Volta Redonda worker household, spanning over 90 years of life.

  - **[CONTEXTUAL]** The Klein–Bohrer marriage in 1890 was one of many inter-family alliances within the tight Nova Friburgo colonist community, where Swiss and German colonist families intermarried frequently — the same endogamous pattern visible across the Borer, Klein, Schenkel and related surnames in the colony registers.

  - **[PROVEN]** At least seven children are now individually documented from held records: Maria Felomena (b. ~1 Oct 1891, CIV-0045), João Gonçalves (our line, b. ~1894), twins Adelaide and Carolina (b. 19 Jul 1899, PAR-0080), Valentim Luciano (b. 14 May 1902, PAR-0074), Maria Clara (b. 20 Feb 1908, PAR-0052), Durval Baptista (b. 24 Jun 1910, PAR-0053), and Maria Bohrer Teixeira (b. 8 Aug 1919, d. 2003 Niterói, CIV-0047) — all born in Nova Friburgo or Rio de Janeiro. The move to Minas Gerais and then to Volta Redonda was her son João's generation's, not her own.

  ## Identity

  **Carolina Klein** (married name **Carolina Bohrer**) — mother of João Gonçalves Bohrer
  (P-0014) and wife of Valentim Martinho Bohrer (P-0028). [PROVEN]

  - **Maiden surname:** KLEIN — primary-confirmed by her own 1890 Nova Friburgo marriage
  (PAR-0064): "Carolina Klein … filha legitima de Jacob Klein e Maria Luiza Schenkel". This
  supersedes the earlier collaborative-blog lead, which is now corroborated by a held record.
  [PROVEN]

  - **Parents:** Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104), Lutheran colonists of
  Nova Friburgo; family F-0051. [PROVEN — PAR-0064]

  - **Birth:** ~1873 at Nova Friburgo — the 1890 marriage records her as 17 and "nascida,
  baptizada e moradora nesta freguesia de Nova Friburgo". [PROVEN — PAR-0064]

  - **Religion:** raised Lutheran (the Klein colonist family); she abjured Protestantism and
  was baptised Catholic just before her 1890 marriage. [PROVEN — PAR-0064]

  - **Occupation:** doméstica (homemaker) [PROVEN as stated] (CIV-0014).

  - **Spouse:** Valentim Martinho Bohrer (P-0028), who died 23 September 1948 at Nova Friburgo
  aged 80 (PAR-0065); their son in our line is João Gonçalves Bohrer (P-0014).

  - **Children (documented):** with Valentim Martinho Bohrer — Maria Felomena Bohrer (b. ~1
  Oct 1891, CIV-0045); João Gonçalves Bohrer (P-0014, our line, b. ~1894); twins Adelaide
  Bohrer and Carolina Bohrer (b. 19 Jul 1899, PAR-0080); Valentim Luciano (b. 14 May 1902,
  PAR-0074); Maria Clara (b. 20 Feb 1908, PAR-0052); Durval Baptista (b. 24 June 1910,
  PAR-0053); and Maria Bohrer Teixeira (b. 8 Aug 1919, d. 2003 Niterói, CIV-0047) — all
  clearly deceased. Seven PROVEN by held records naming both parents. [PROVEN]

  - **Death:** **17 April 1973, São Gonçalo, RJ** [LEAD — FS personas death-registration index
  (ark 3:1:3QS7-899K-F9LB), image off-tool; certidão de óbito not held]. She was recorded
  living and "natural deste Estado" (Rio de Janeiro) at her son João Gonçalves's 1970 death
  (CIV-0014); by then she was a widow, her husband Valentim having died in 1948 (PAR-0065). If
  confirmed, she died aged ~100 — she was still a doméstica in Volta Redonda in August 1970.

  ## What we can extrapolate

  **Her two recorded occupations are the whole arc in one life.** In October 1891, at about
  eighteen, she is entered with her husband as a *lavradora* at São José do Ribeirão —
  "brazileiros, lavradores e moradores desta Parochia" (CIV-0045) [PROVEN]. In August 1970, at
  about ninety-seven, she is entered as a *doméstica* resident in Volta Redonda, outliving the
  son whose death record names her (CIV-0014) [PROVEN]. From working a parish lot in the Nova
  Friburgo serra to a domestic in the Companhia Siderúrgica Nacional steel city, inside one
  woman's lifetime. (In these registers *doméstica* covers unpaid household work as readily as
  paid service, so the 1970 entry marks a household position, not necessarily an employment
  [CONTEXTUAL].)

  **Her marriage cost her a confession, which is the clearest price anyone in this line is
  documented as paying for a match.** Her 1890 marriage act records that the bride, aged
  seventeen and "licenciada verbalmente por seu pae", had first "abjurado o protestantismo,
  fazendo a profissão de fé catholica e recebido o baptismo" (PAR-0064) [PROVEN]. Her
  Klein/Schenkel people came to Nova Friburgo in the **second** colonisation wave — the German
  families recruited out of Hessen and the Rhineland and landed in 1824, five years after the
  Swiss [CONTEXTUAL]. A different scheme, a different confession, and an identical class
  outcome: land-hungry peasants converted into smallholders of poor serra lots, with no
  heritable capital on either side of the union. Her marriage fuses the two colonies without
  raising either.

  **Her children's godparents are the map of that closed world.** Across the held baptisms the
  sponsors are her own parents (Jacob Klein and Maria Luiza Schenkel stood for the twin Carolina
  in 1900, PAR-0080), her husband's kin (João Maria Bohrer and Luiz Bohrer for Adelaide; Vicente
  Borber Junior and Hortencia Heckdorn in 1902, PAR-0074) and colony neighbours (the Heisingers
  in 1908, PAR-0052; 1910, PAR-0053) [PROVEN]. Not one carries a rank, an office or a patron's
  title. Godparenthood in propertied Brazilian families was a channel for patronage; here it
  circulates only among people of the same level. That is a class marker in the negative.
  [INFERRED]

  **A household that moved constantly without ever going anywhere.** [INFERRED] The
  registrations trace the family across the Nova Friburgo comarca — São José do Ribeirão in
  1891, Lumiar in 1900, the matriz and São Pedro from 1902 to 1910 — the movement of tenants or
  smallholders following work and land within one município, not of an establishing family. With
  at least eleven children and no property in any held record, partible succession had nothing
  to divide by the time it reached her children [CONTEXTUAL]; the next generation therefore left
  the serra entirely.

  **She is the founding-colony stock ending in the steel city.** [INFERRED] Born about 1873 to
  German-Lutheran colonists and dying after 1970, she outlived her husband by more than twenty
  years and her son João Gonçalves by more than two, and she ended her life in Volta Redonda —
  the city the CSN mill built from the 1940s [CONTEXTUAL]. That a woman of the colonist founding
  stock finishes as a *doméstica* in an industrial city is not a fall: it is the flat-to-modest
  trajectory of a line that began landless, was granted a stony lot, and never accumulated. Her
  own descent is now documented at primary level: the 1890 marriage confirms her a **Klein**,
  daughter of Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104). [PROVEN]

  ## Note on evidence

  She is documented by her own 1890 Nova Friburgo marriage (PAR-0064, which names her maiden
  surname and parents), and appears as a named parent/grandparent in her son João Gonçalves's
  1970 death (CIV-0014) and grandson Eunir's 1924 Nova Friburgo birth (CIV-0016).

  ## Sources held (this repository)

  - PAR-0064 (her own 1890 Nova Friburgo marriage — names her "Carolina Klein", her parents
  Jacob Klein × Maria Luiza Schenkel, her age/birth ~1873 and her Lutheran-to-Catholic
  conversion) · CIV-0014 (son João Gonçalves's 1970 Volta Redonda death) · CIV-0016 (grandson
  Eunir's 1924 Nova Friburgo birth).

  - PAR-0065 (her husband Valentim's 1948 Nova Friburgo death — names her as his wife) ·
  CIV-0045 (daughter Maria Felomena's 1891 São José do Ribeirão civil birth — names her as mother) ·
  PAR-0080 (twins Adelaide + Carolina's 1899 Lumiar baptism — names her as mother) ·
  PAR-0074 (son Valentim Luciano's 1902 baptism) · PAR-0052 (daughter Maria Clara's 1908
  baptism) · PAR-0053 (son Durval Baptista's 1910 baptism) · CIV-0047 (daughter Maria Bohrer
  Teixeira's 2003 Niterói death — names her as mother) — all name her as mother.

  ## Where to go today

  - **Nova Friburgo family parish:** Catedral Diocesana / Igreja Matriz de São João Batista, Centro, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, CEP 28610-390) — the parish of the Bohrer family at Nova Friburgo [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu registro de casamento de 1890 documenta uma marcante travessia religiosa: nascida e batizada luterana em Nova Friburgo como filha dos colonos Jacob Klein e Maria Luiza Schenkel, ela abjurou formalmente o protestantismo e foi rebatizada católica logo antes de se casar na família Bohrer, de tradição católica (PAR-0064).

  - **[CONTEXTUAL]** A família Klein fazia parte da onda de imigração alemã de 1824 para Nova Friburgo, que complementou os colonos suíços originais de 1819; na década de 1890, ambos os grupos já haviam se misturado na mesma comunidade colonial serrana, embora as diferenças religiosas entre famílias católicas e luteranas persistissem por gerações.

  - **[INFERRED]** Foi registrada como "doméstica" e residente em Volta Redonda em 1970, aparentemente sobrevivendo ao filho João Gonçalves (CIV-0014) — situando-a no ponto final do arco migratório da família: de uma família colona luterana de Nova Friburgo a um domicílio de trabalhadores em Volta Redonda, abrangendo mais de 90 anos de vida.

  - **[CONTEXTUAL]** O casamento Klein–Bohrer em 1890 foi uma das muitas alianças interfamiliares dentro da comunidade colona fechada de Nova Friburgo, onde famílias de colonos suíços e alemães contraíam matrimônio entre si com frequência — o mesmo padrão endogâmico visível nos sobrenomes Borer, Klein, Schenkel e afins nos registros da colônia.

  - **[PROVEN]** Pelo menos sete filhos estão agora documentados individualmente por registros em mãos: Maria Felomena (n. ~1 out. 1891, CIV-0045), João Gonçalves (nossa linha, n. ~1894), gêmeas Adelaide e Carolina (n. 19 jul. 1899, PAR-0080), Valentim Luciano (n. 14 maio 1902, PAR-0074), Maria Clara (n. 20 fev. 1908, PAR-0052), Durval Baptista (n. 24 jun. 1910, PAR-0053) e Maria Bohrer Teixeira (n. 8 ago. 1919, f. 2003 Niterói, CIV-0047) — todos nascidos em Nova Friburgo ou no Rio de Janeiro. A mudança para Minas Gerais e depois para Volta Redonda foi da geração de seu filho João, e não da sua.

  ## Identidade

  **Carolina Klein** (nome de casada **Carolina Bohrer**) — mãe de João Gonçalves Bohrer
  (P-0014) e esposa de Valentim Martinho Bohrer (P-0028). [PROVEN]

  - **Sobrenome de solteira:** KLEIN — confirmado em fonte primária pelo seu próprio casamento
  de 1890 em Nova Friburgo (PAR-0064): "Carolina Klein … filha legitima de Jacob Klein e Maria
  Luiza Schenkel". Isso supera a antiga pista de blog colaborativo, agora corroborada por um
  registro retido. [PROVEN]

  - **Pais:** Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104), colonos luteranos de Nova
  Friburgo; família F-0051. [PROVEN — PAR-0064]

  - **Nascimento:** ~1873 em Nova Friburgo — o casamento de 1890 a registra com 17 anos e
  "nascida, baptizada e moradora nesta freguesia de Nova Friburgo". [PROVEN — PAR-0064]

  - **Religião:** criada luterana (a família colona Klein); abjurou o protestantismo e foi
  batizada católica pouco antes do casamento de 1890. [PROVEN — PAR-0064]

  - **Ocupação:** doméstica [PROVEN conforme declarado] (CIV-0014).

  - **Cônjuge:** Valentim Martinho Bohrer (P-0028), falecido em 23 de setembro de 1948 em Nova
  Friburgo, aos 80 anos (PAR-0065); o filho em nossa linha é João Gonçalves Bohrer (P-0014).

  - **Filhos (documentados):** com Valentim Martinho Bohrer — Maria Felomena Bohrer (n. ~1 out.
  1891, CIV-0045); João Gonçalves Bohrer (P-0014, nossa linha, n. ~1894); gêmeas Adelaide
  Bohrer e Carolina Bohrer (n. 19 jul. 1899, PAR-0080); Valentim Luciano (n. 14 de maio de
  1902, PAR-0074); Maria Clara (n. 20 de fevereiro de 1908, PAR-0052); Durval Baptista (n. 24
  de junho de 1910, PAR-0053); e Maria Bohrer Teixeira (n. 8 ago. 1919, f. 2003 Niterói,
  CIV-0047) — todos claramente falecidos. Sete PROVEN por registros em mãos que nomeiam
  ambos os pais. [PROVEN]

  - **Óbito:** **17 de abril de 1973, São Gonçalo, RJ** [LEAD — índice do registro de óbito
  do FS personas (ark 3:1:3QS7-899K-F9LB), imagem fora da ferramenta; certidão de óbito não
  obtida]. Foi registrada viva e "natural deste Estado" (Rio de Janeiro) no óbito de 1970 de
  seu filho João Gonçalves (CIV-0014); então já viúva, tendo seu marido Valentim falecido em
  1948 (PAR-0065). Se confirmado, faleceu com cerca de 100 anos — ainda era doméstica em Volta
  Redonda em agosto de 1970.

  ## O que podemos extrapolar

  **Suas duas ocupações registradas são o arco inteiro numa só vida.** Em outubro de 1891, com
  cerca de dezoito anos, ela é lançada com o marido como *lavradora* em São José do Ribeirão —
  "brazileiros, lavradores e moradores desta Parochia" (CIV-0045) [PROVEN]. Em agosto de 1970,
  com cerca de noventa e sete, é lançada como *doméstica* residente em Volta Redonda,
  sobrevivendo ao filho cujo óbito a nomeia (CIV-0014) [PROVEN]. De lavrar um lote de freguesia
  na serra de Nova Friburgo a doméstica na cidade siderúrgica da Companhia Siderúrgica Nacional,
  dentro da vida de uma só mulher. (Nesses registros *doméstica* abrange tanto o trabalho
  doméstico não remunerado quanto o serviço pago, de modo que o lançamento de 1970 marca uma
  posição no domicílio, não necessariamente um emprego [CONTEXTUAL].)

  **Seu casamento lhe custou uma confissão religiosa — o preço mais claro que alguém desta linha
  está documentado a pagar por um enlace.** O ato de casamento de 1890 registra que a nubente,
  de dezessete anos e "licenciada verbalmente por seu pae", havia antes "abjurado o
  protestantismo, fazendo a profissão de fé catholica e recebido o baptismo" (PAR-0064)
  [PROVEN]. Os Klein/Schenkel dela chegaram a Nova Friburgo na **segunda** onda de colonização —
  as famílias alemãs recrutadas em Hessen e na Renânia e desembarcadas em 1824, cinco anos
  depois dos suíços [CONTEXTUAL]. Outro esquema, outra confissão e um resultado de classe
  idêntico: camponeses famintos de terra convertidos em pequenos posseiros de lotes serranos
  pobres, sem capital herdável de nenhum dos lados da união. Seu casamento funde as duas
  colônias sem elevar nenhuma delas.

  **Os padrinhos de seus filhos são o mapa desse mundo fechado.** Nos batismos disponíveis os
  padrinhos são seus próprios pais (Jacob Klein e Maria Luiza Schenkel foram padrinhos da gêmea
  Carolina em 1900, PAR-0080), parentes do marido (João Maria Bohrer e Luiz Bohrer para
  Adelaide; Vicente Borber Junior e Hortencia Heckdorn em 1902, PAR-0074) e vizinhos da colônia
  (os Heisinger em 1908, PAR-0052; em 1910, PAR-0053) [PROVEN]. Nenhum deles traz patente, cargo
  ou título de protetor. O compadrio, nas famílias brasileiras proprietárias, era um canal de
  patronagem; aqui ele circula apenas entre gente do mesmo nível. É um marcador de classe pela
  negativa. [INFERRED]

  **Um domicílio que se mudou constantemente sem nunca ir a lugar algum.** [INFERRED] Os
  registros seguem a família pela comarca de Nova Friburgo — São José do Ribeirão em 1891,
  Lumiar em 1900, a matriz e São Pedro de 1902 a 1910 —, movimento de arrendatários ou pequenos
  posseiros atrás de trabalho e terra dentro de um só município, não de uma família em ascensão.
  Com ao menos onze filhos e nenhuma propriedade em qualquer registro disponível, a sucessão
  partível nada tinha a dividir quando chegou aos filhos dela [CONTEXTUAL]; a geração seguinte,
  por isso, deixou a serra por completo.

  **Ela é o tronco fundador da colônia terminando na cidade siderúrgica.** [INFERRED] Nascida
  por volta de 1873 de colonos alemães luteranos e falecida depois de 1970, sobreviveu ao marido
  por mais de vinte anos e ao filho João Gonçalves por mais de dois, e encerrou a vida em Volta
  Redonda — a cidade que a usina da CSN ergueu a partir dos anos 1940 [CONTEXTUAL]. Que uma
  mulher do tronco colono fundador termine como *doméstica* numa cidade industrial não é uma
  queda: é a trajetória plana ou modestamente ascendente de uma linha que começou sem terra,
  recebeu um lote pedregoso e nunca acumulou. Sua própria ascendência está agora documentada em
  nível primário: o casamento de 1890 confirma que era uma **Klein**, filha de Jacob Klein
  (P-0103) × Maria Luiza Schenkel (P-0104). [PROVEN]

  ## Nota sobre a evidência

  Ela é documentada por seu próprio casamento de 1890 em Nova Friburgo (PAR-0064, que nomeia seu
  sobrenome de solteira e seus pais) e aparece como mãe/avó nomeada no óbito de 1970 de seu filho
  João Gonçalves (CIV-0014) e no nascimento de 1924 do neto Eunir em Nova Friburgo (CIV-0016).

