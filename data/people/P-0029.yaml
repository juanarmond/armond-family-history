  como mãe) · PAR-0080 (batismo de 1899 das gêmeas Adelaide + Carolina em Lumiar — nomeia-a como
  mãe) · PAR-0074 (batismo de 1902 do filho Valentim Luciano) · PAR-0052 (batismo de 1908 da
  filha Maria Clara) · PAR-0053 (batismo de 1910 do filho Durval Baptista) · CIV-0047 (óbito de
  2003 da filha Maria Bohrer Teixeira em Niterói — nomeia-a como mãe) — todos nomeiam-na como mãe.

