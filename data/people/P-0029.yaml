profile: >-
  ## Identity

  **Carolina Bohrer** [PROVEN as named] — mother of João Gonçalves Bohrer (P-0014) and wife
  of Valentim Martinho Bohrer (P-0028).

  - **Maiden surname:** not recorded [OPEN] — "Bohrer" is her married name. A
  secondary/blog lead proposes "Klein" (a German-colony Nova Friburgo family), unverified
  in our sources. [LEAD]

  - **Occupation:** doméstica (homemaker) [PROVEN as stated] (CIV-0014).

  - **Spouse:** Valentim Martinho Bohrer (P-0028).

  - **Child (in our line):** João Gonçalves Bohrer (P-0014).

  - **Origin, birth, death:** not held [OPEN]; recorded as of this Estado (Rio de Janeiro)
  in CIV-0014.

  ## What we can extrapolate

  The one thing the held record fixes about her life — a **doméstica living at Volta Redonda in
  1970, who outlived her son** (CIV-0014) — places her, like the rest of the family, at the
  **working-class urban endpoint** of the migration off the Nova Friburgo / rural interior into
  the Companhia Siderúrgica Nacional steel city [INFERRED]. It is a trajectory consistent with the
  colonist-descended Bohrers, who held no heritable landed capital [CONTEXTUAL]. Her own descent,
  however, is not documented: a secondary lead making her a "Klein" of the Nova Friburgo
  German-colony line (which would supply that colonist ancestry) is unverified and is not adopted
  here. [LEAD]

  ## Note on evidence

  She appears only as a named parent and grandparent: as "Carolina Bohrer, doméstica" in
  her son's 1970 death (CIV-0014) and as Eunir's paternal grandmother in the 1924 Nova
  Friburgo birth (CIV-0016). No record of her own is held.

  ## Sources held (this repository)

  - CIV-0014 (son João Gonçalves's 1970 Volta Redonda death) · CIV-0016 (grandson Eunir's
  1924 Nova Friburgo birth). She appears in no other held record.

  ## Where to go today

  - **Nova Friburgo family parish:** Catedral Diocesana / Igreja Matriz de São João Batista, Centro, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, CEP 28610-390) — the parish of the Bohrer family at Nova Friburgo [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Identidade

  **Carolina Bohrer** [PROVEN quanto ao nome] — mãe de João Gonçalves Bohrer (P-0014) e
  esposa de Valentim Martinho Bohrer (P-0028).

  - **Sobrenome de solteira:** não registrado [OPEN] — "Bohrer" é seu nome de casada. Uma
  pista secundária/de blog propõe "Klein" (uma família alemã da colônia de Nova Friburgo),
  não verificada em nossas fontes. [LEAD]

  - **Ocupação:** doméstica [PROVEN conforme declarado] (CIV-0014).

  - **Cônjuge:** Valentim Martinho Bohrer (P-0028).

  - **Filho (em nossa linha):** João Gonçalves Bohrer (P-0014).

  - **Origem, nascimento, óbito:** não obtidos [OPEN]; registrada como natural deste Estado
  (Rio de Janeiro) em CIV-0014.

  ## O que podemos extrapolar

  A única coisa que o registro disponível fixa sobre sua vida — uma **doméstica residente em Volta
  Redonda em 1970, que sobreviveu ao filho** (CIV-0014) — a situa, como o restante da família, no
  **ponto de chegada urbano de classe trabalhadora** da migração para fora de Nova Friburgo / do
  interior rural rumo à cidade siderúrgica da Companhia Siderúrgica Nacional [INFERRED]. É uma
  trajetória coerente com os Bohrer descendentes de colonos, que não detinham capital fundiário
  herdável [CONTEXTUAL]. Sua própria descendência, contudo, não está documentada: uma pista
  secundária que a faz uma "Klein" da linha da colônia alemã de Nova Friburgo (o que forneceria
  essa ascendência colona) é não verificada e não é adotada aqui. [LEAD]

  ## Nota sobre a evidência

  Ela aparece apenas como mãe e avó nomeada: como "Carolina Bohrer, doméstica" no óbito de
  1970 de seu filho (CIV-0014) e como avó paterna de Eunir no nascimento de 1924 em Nova
  Friburgo (CIV-0016). Nenhum registro próprio dela foi obtido.

  ## Fontes disponíveis (neste repositório)

  - CIV-0014 (óbito de 1970 do filho João Gonçalves em Volta Redonda) · CIV-0016
  (nascimento de 1924 do neto Eunir em Nova Friburgo). Não aparece em nenhum outro registro
  obtido.

