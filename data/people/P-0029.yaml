profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1890 marriage record documents a remarkable religious crossing: born in Nova Friburgo into the Lutheran colonist family of Jacob Klein and Maria Luiza Schenkel, she formally abjured Protestantism and received Catholic baptism ("recebido o baptismo") just before marrying into the Catholic Bohrer family (PAR-0064). No earlier Lutheran baptism of hers has been found (see Open questions).

  - **[CONTEXTUAL]** Her Klein line is reported to belong to the 1824 German immigration wave to Nova Friburgo, which supplemented the original 1819 Swiss colonists (her grandfather Johannes Klein, P-0105, reportedly came as a boy on the *Argus* [LEAD]). Her ancestry was not purely German, though: her mother's maternal grandfather Joseph Stoffel is called "dem Schweizer Colonisten", the Swiss colonist, in the 1847 Lutheran marriage register (PAR-0067) [PROVEN]. By the 1890s both groups had intermixed in the same highland colony, though the Catholic–Lutheran divide persisted across generations.

  - **[INFERRED]** She was recorded as "doméstica" and living at Volta Redonda in 1970, apparently outliving her son João Gonçalves (CIV-0014) — placing her at the final endpoint of the family's migration arc: from a Nova Friburgo Lutheran colonist family to a Volta Redonda worker household, spanning over 90 years of life.

  - **[CONTEXTUAL]** The Klein–Bohrer marriage in 1890 was one of many inter-family alliances within the tight Nova Friburgo colonist community, where Swiss and German colonist families intermarried frequently — the same endogamous pattern visible across the Borer, Klein, Schenkel and related surnames in the colony registers.

  - **[PROVEN]** At least seven children are now individually documented from held records: Maria Felomena (b. 30 Sep 1891, CIV-0045 — [Corrected 2026-10-08 from the image: "a trinta do passado", not ~1 Oct]), João Gonçalves (our line, b. ~1894), twins Adelaide and Carolina (b. 19 Jul 1899, PAR-0080), Valentim Luciano (b. 14 May 1902, PAR-0074), Maria Clara (b. 20 Feb 1908, PAR-0052), Durval Baptista (b. 24 Jun 1910, PAR-0053), and Maria Bohrer Teixeira (b. 8 Aug 1919, d. 2003 Niterói, CIV-0047) — all born in Nova Friburgo or Rio de Janeiro. The move to Minas Gerais and then to Volta Redonda was her son João's generation's, not her own.

  - **[PROVEN]** On 14 September 1908, at the São Pedro chapel of Nova Friburgo, her daughter Maria Clara was baptised on the same day and the same folio as Lucinda Maria, a daughter of Joaquim José Bohrer (P-0030) and Lucinda. That was the household of Celina (P-0015), who would marry Carolina's son João Gonçalves (PAR-0052). The two Bohrer households whose children later married were baptising daughters side by side.

  ## Identity

  **Carolina Klein** (married name **Carolina Bohrer**) — mother of João Gonçalves Bohrer
  (P-0014) and wife of Valentim Martinho Bohrer (P-0028). [PROVEN]

  - **Maiden surname:** KLEIN — primary-confirmed by her own 1890 Nova Friburgo marriage
  (PAR-0064): "Carolina Klein … filha legitima de Jacob Klein e Maria Luiza Schenkel". This
  supersedes the earlier collaborative-blog lead, which is now corroborated by a held record.
  [PROVEN]

  - **Name forms in held records:** "Carolina Klein" (1890, PAR-0064; 1891, CIV-0045; 1902,
  PAR-0074); "Carolina Klein Bohrer" (the twins' 1900 baptism, PAR-0080; her daughter Maria's
  2003 death, CIV-0047); "Carolina Klein Bor[b]er" (1908 and 1910, PAR-0052, PAR-0053); and plain
  "Carolina Bohrer" in the 1923, 1924, 1948 and 1970 acts (CIV-0038, CIV-0016, PAR-0065,
  CIV-0014) [PROVEN]. The FamilySearch tree gives her a middle name "Schuenck", which no held
  record carries [LEAD].

  - **Parents:** Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104), Lutheran colonists of
  Nova Friburgo; family F-0051. [PROVEN — PAR-0064]

  - **Birth:** ~1873 at Nova Friburgo — the 1890 marriage records her as 17 and "nascida,
  baptizada e moradora nesta freguesia de Nova Friburgo". [PROVEN — PAR-0064]

  - **Religion:** raised Lutheran (the Klein colonist family); she abjured Protestantism and
  was baptised Catholic just before her 1890 marriage. [PROVEN — PAR-0064]

  - **Occupation:** doméstica (homemaker) [PROVEN as stated] (CIV-0014).

  - **Spouse:** Valentim Martinho Bohrer (P-0028). They married on 27 November 1890 at the Nova
  Friburgo Matriz (Livro de Casamentos p.79, nº 333), she seventeen and "licenciada verbalmente
  por seu pae", he twenty-two; the witnesses were José Domingos Bor[b]er [uncertain] and Ernesto
  Piller [PROVEN — PAR-0064, event E-0088]. Valentim died 23 September 1948 at Nova Friburgo
  aged 80, "casado com Carolina Bohrer" (PAR-0065); their son in our line is João Gonçalves
  Bohrer (P-0014).

  - **Children (documented):** with Valentim Martinho Bohrer — Maria Felomena Bohrer (b. 30
  Sep 1891, CIV-0045); João Gonçalves Bohrer (P-0014, our line, b. ~1894); twins Adelaide
  Bohrer and Carolina Bohrer (b. 19 Jul 1899, PAR-0080); Valentim Luciano (b. 14 May 1902,
  PAR-0074); Maria Clara (b. 20 Feb 1908, PAR-0052); Durval Baptista (b. 24 June 1910,
  PAR-0053); and Maria Bohrer Teixeira (b. 8 Aug 1919, d. 2003 Niterói, CIV-0047) — all
  clearly deceased. Seven PROVEN by held records naming both parents. [PROVEN] The retrieval
  research's reconciled roster reaches about eleven, adding Laudelina Olívia (1896, a
  baptism-index entry) and Balbina Eufrásia and Dionisio (FamilySearch tree only) [LEAD — no
  record held here].

  - **Death:** **17 April 1973, São Gonçalo, RJ** [LEAD — FS personas death-registration index
  (ark 3:1:3QS7-899K-F9LB), image off-tool; certidão de óbito not held]. She was recorded
  living and "natural deste Estado" (Rio de Janeiro) at her son João Gonçalves's 1970 death
  (CIV-0014); by then she was a widow, her husband Valentim having died in 1948 (PAR-0065). If
  confirmed, she died aged ~100 — she was still a doméstica in Volta Redonda in August 1970.

  ## Standing and profession

  - **Lavradora (farmer), São José do Ribeirão, 1891** — entered with her husband as
  "brazileiros, lavradores e moradores desta Parochia" at her daughter Maria Felomena's civil
  birth (CIV-0045) [PROVEN].

  - **Doméstica, Volta Redonda, 1970** — so named, resident in the city, in her son João
  Gonçalves's death (CIV-0014) [PROVEN].

  - **Property, office, title:** none in any held record. **Literacy:** undocumented; no held
  act carries her signature [OPEN]. Her husband could not write: the 1891 birth was signed for
  him "a rogo do declarante por não saber escrever" (CIV-0045) [PROVEN].

  ## Family and social network

  **Parents.** Jacob Klein (P-0103), born 16 November 1844 at Nova Friburgo and baptised in the
  colony's Lutheran congregation (PAR-0066), and Maria Luiza Schenkel (P-0104, b. ~1851). They
  married in the Nova Friburgo Lutheran church on 29 April 1872, Jacob then living "no Rio
  bonito" (PAR-0068) [PROVEN]. Jacob was alive to license her marriage in 1890 (PAR-0064), and
  both are named as maternal grandparents in October 1891 (CIV-0045). Her mother's death is
  unlocated; the earlier "before 1889" reading has been withdrawn on index evidence placing her
  alive in 1896 [LEAD].

  **Grandparents.** Paternal: Johannes Klein (P-0105) × Anna Margaretha [Neis — uncertain]
  (P-0106). Maternal: Conrad Schenkel (P-0107) × Maria Luiza Stoffel (P-0108). All four are
  named in her parents' 1872 marriage (PAR-0068). One generation further, her mother's
  grandfathers were Heinrich Schenkel, a *Kirchenvorsteher* (elder) of the Lutheran
  congregation, and Joseph Stoffel, "Schweizer Colonist" (PAR-0067) [PROVEN].

  **Siblings [LEAD].** The retrieval research reconciles about nine siblings from the Raibert
  Nova Friburgo baptism index and the FamilySearch tree, born or baptised 1869–1896: Maria
  (Margarida), José Marque, Maria Luiza, Manuel Aleixo, Isabel, Secundina, Leonel, Antônio and
  Palmira Eugênia. No sibling's record is held here, and the São José do Ribeirão Catholic books
  they are indexed from are not digitised. Two of them (1869, 1871) are reported before the 1872
  marriage, which would make Carolina the first child born after it [INFERRED, resting on
  leads]. The same research reports a second Klein family on her maternal Schenkel side and
  warns against conflating the two [LEAD].

  **Compadrio.** She and Valentim exchanged sponsorship with Vicente Borber Junior and Hortencia
  Heckdorn: that couple stood for her son Valentim Luciano in 1902, and on the same folio she
  and Valentim stood for their daughter Maria Yzaura (PAR-0074) [PROVEN]. Her own parents
  sponsored her twin daughter Carolina in 1900 (PAR-0080).

  ## What we can extrapolate

  **Her two recorded occupations are the whole arc in one life.** In October 1891, at about
  eighteen, she is entered with her husband as a *lavradora* at São José do Ribeirão —
  "brazileiros, lavradores e moradores desta Parochia" (CIV-0045) [PROVEN]. In August 1970, at
  about ninety-seven, she is entered as a *doméstica* resident in Volta Redonda, outliving the
  son whose death record names her (CIV-0014) [PROVEN]. From working a parish lot in the Nova
  Friburgo serra to a domestic in the Companhia Siderúrgica Nacional steel city, inside one
  woman's lifetime. (In these registers *doméstica* covers unpaid household work as readily as
  paid service, so the 1970 entry marks a household position, not necessarily an employment
  [CONTEXTUAL].)

  **Her marriage cost her a confession, which is the clearest price anyone in this line is
  documented as paying for a match.** Her 1890 marriage act records that the bride, aged
  seventeen and "licenciada verbalmente por seu pae", had first "abjurado o protestantismo,
  fazendo a profissão de fé catholica e recebido o baptismo" (PAR-0064) [PROVEN]. Her
  Klein/Schenkel people are reported to have come to Nova Friburgo in the **second**
  colonisation wave — the German families recruited out of Hessen and the Rhineland and landed
  in 1824, five years after the Swiss [CONTEXTUAL; the Klein arrival itself is a LEAD] — with a
  Swiss Stoffel strand among them (PAR-0067). A different scheme, a different confession, and an identical class
  outcome: land-hungry peasants converted into smallholders of poor serra lots, with no
  heritable capital on either side of the union. Her marriage fuses the two colonies without
  raising either.

  **Her children's godparents are the map of that closed world.** Across the held baptisms the
  sponsors are her own parents (Jacob Klein and Maria Luiza, her surname written "Schewele"
  [uncertain], stood for the twin Carolina in 1900, PAR-0080), her husband's kin (João Maria
  Bohrer and Luiz Bohrer for Adelaide; Vicente Borber Junior and Hortencia Heckdorn in 1902,
  PAR-0074, a reciprocal sponsorship, since she and Valentim stood for that couple's daughter on
  the same folio) and colony neighbours (the Heisingers
  in 1908, PAR-0052; 1910, PAR-0053) [PROVEN]. Not one carries a rank, an office or a patron's
  title. Godparenthood in propertied Brazilian families was a channel for patronage; here it
  circulates only among people of the same level. That is a class marker in the negative.
  [INFERRED]

  **A household that moved constantly without ever going anywhere.** [INFERRED] The
  registrations trace the family across the Nova Friburgo comarca — São José do Ribeirão in
  1891, Lumiar in 1900, the matriz and São Pedro from 1902 to 1910 — the movement of tenants or
  smallholders following work and land within one município, not of an establishing family. With
  seven children documented in held records (about eleven on the research roster [LEAD]) and no
  property in any held record, partible succession had nothing
  to divide by the time it reached her children [CONTEXTUAL]; the next generation therefore left
  the serra entirely.

  **She is the founding-colony stock ending in the steel city.** [INFERRED] Born about 1873 to
  Lutheran colonists and last attested alive in August 1970, she outlived her husband by more
  than twenty years and, if the 1973 death lead holds, her son João Gonçalves by more than two.
  Her last attested home was Volta Redonda, the city the CSN mill built from the 1940s
  [CONTEXTUAL]; the death lead places her end at São Gonçalo [LEAD]. That a woman of the colonist founding
  stock finishes as a *doméstica* in an industrial city is not a fall: it is the flat-to-modest
  trajectory of a line that began landless, was granted a stony lot, and never accumulated. Her
  own descent is now documented at primary level: the 1890 marriage confirms her a **Klein**,
  daughter of Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104). [PROVEN]

  ## Open questions

  - **Her first baptism (~1873).** The 1890 act has her receive baptism only at her conversion,
  so any infant baptism would have been Lutheran [INFERRED]. The retrieval research reports the
  Nova Friburgo Lutheran register as a bounded negative for this couple's children, while its
  index-based sibling list has them baptised Catholic at São José do Ribeirão from 1870 [LEAD].
  If both reports hold, why Carolina was still Protestant in 1890 is unexplained. Closing
  records: the São José do Ribeirão Catholic baptism books (not digitised) and the Nova Friburgo
  Lutheran Taufregister for 1872–1874. [OPEN]

  - **Her death:** 17 April 1973, São Gonçalo [LEAD — death-registration index only]. Closes
  with the São Gonçalo civil death act. [OPEN]

  - **The "Schuenck" middle name** in the FamilySearch tree: no held record carries it; it may be
  a garbled form of her mother's surname, Schenkel [INFERRED]. [OPEN]

  - **The children and siblings known only from index and tree entries:** the São José do
  Ribeirão and Nova Friburgo baptism books would confirm or retire them. [OPEN]

  ## Sources held (this repository)

  She is documented by her own 1890 Nova Friburgo marriage (PAR-0064, which names her maiden
  surname and parents); every other held record names her as a wife, mother or grandmother.

  - PAR-0064 (her own 1890 Nova Friburgo marriage — names her "Carolina Klein", her parents
  Jacob Klein × Maria Luiza Schenkel, her age/birth ~1873 and her Lutheran-to-Catholic
  conversion) · CIV-0014 (son João Gonçalves's 1970 Volta Redonda death) · CIV-0016 (grandson
  Eunir's 1924 Nova Friburgo birth) · CIV-0038 (granddaughter Senira's 1923 Nova Friburgo
  birth — names her as paternal grandmother).

  - PAR-0065 (her husband Valentim's 1948 Nova Friburgo death — names her as his wife) ·
  CIV-0045 (daughter Maria Felomena's 1891 São José do Ribeirão civil birth — names her as mother) ·
  PAR-0080 (twins Adelaide + Carolina's 1899 Lumiar baptism — names her as mother) ·
  PAR-0074 (son Valentim Luciano's 1902 baptism) · PAR-0052 (daughter Maria Clara's 1908
  baptism) · PAR-0053 (son Durval Baptista's 1910 baptism) · CIV-0047 (daughter Maria Bohrer
  Teixeira's 2003 Niterói death — names her as mother) — all name her as mother.

  - Her ancestry: PAR-0068 (her parents' 1872 Lutheran marriage — names all four grandparents) ·
  PAR-0066 (her father Jacob's 1844/45 Lutheran baptism) · PAR-0067 (her maternal grandparents'
  1847 Lutheran marriage — names the Swiss colonist Joseph Stoffel and the elder Heinrich
  Schenkel).

  ## Regional and migration context

  Her record-stated places trace the family across the Nova Friburgo serra and then out of it.
  Her father was living "no Rio bonito" when he married in 1872 (PAR-0068), probably the Rio
  Bonito valley of Lumiar inside Nova Friburgo rather than the lowland town of that name
  [INFERRED]. She was "nascida, baptizada e moradora" in the Nova Friburgo freguesia in 1890
  (PAR-0064); the couple were lavradores at São José do Ribeirão in 1891 (CIV-0045), then
  baptised children at Lumiar in 1900 (PAR-0080) and at the São Pedro chapel from 1902 to 1910
  (PAR-0074, PAR-0052, PAR-0053) [PROVEN]. By August 1970 she lived in Volta Redonda (CIV-0014)
  [PROVEN], the CSN steel city to which her son's household had moved [CONTEXTUAL]. The 1973
  death lead places her at São Gonçalo [LEAD]; her daughter Maria Bohrer Teixeira was living at
  Alcântara, São Gonçalo, by 2003 (CIV-0047), so a last move to a daughter's household is
  plausible but undocumented [INFERRED]. Her Brazilian nationality follows from the Nova
  Friburgo birth stated in her marriage. Up her line, the Swiss strand is documented (PAR-0067)
  and the German-language Lutheran registers place her family in the colony's German-speaking
  congregation (PAR-0066, PAR-0068); the Klein line's German origin itself rests on leads
  (P-0105) and is not inferred from the surname.

  ## Where to go today

  - **Nova Friburgo family parish:** Catedral Diocesana / Igreja Matriz de São João Batista, Centro, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, CEP 28610-390) — the parish of the Bohrer family at Nova Friburgo [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu registro de casamento de 1890 documenta uma marcante travessia religiosa: nascida em Nova Friburgo na família colona luterana de Jacob Klein e Maria Luiza Schenkel, ela abjurou formalmente o protestantismo e recebeu o batismo católico ("recebido o baptismo") logo antes de se casar na família Bohrer, de tradição católica (PAR-0064). Nenhum batismo luterano anterior dela foi encontrado (ver Questões em aberto).

  - **[CONTEXTUAL]** Sua linha Klein teria pertencido à onda de imigração alemã de 1824 para Nova Friburgo, que complementou os colonos suíços originais de 1819 (seu avô Johannes Klein, P-0105, teria vindo menino no *Argus* [LEAD]). Sua ascendência, porém, não era só alemã: o avô materno de sua mãe, Joseph Stoffel, é chamado "dem Schweizer Colonisten", o colono suíço, no registro luterano de casamento de 1847 (PAR-0067) [PROVEN]. Na década de 1890 os dois grupos já se haviam misturado na mesma colônia serrana, embora a divisão entre católicos e luteranos persistisse por gerações.

  - **[INFERRED]** Foi registrada como "doméstica" e residente em Volta Redonda em 1970, aparentemente sobrevivendo ao filho João Gonçalves (CIV-0014) — situando-a no ponto final do arco migratório da família: de uma família colona luterana de Nova Friburgo a um domicílio de trabalhadores em Volta Redonda, abrangendo mais de 90 anos de vida.

  - **[CONTEXTUAL]** O casamento Klein–Bohrer em 1890 foi uma das muitas alianças interfamiliares dentro da comunidade colona fechada de Nova Friburgo, onde famílias de colonos suíços e alemães contraíam matrimônio entre si com frequência — o mesmo padrão endogâmico visível nos sobrenomes Borer, Klein, Schenkel e afins nos registros da colônia.

  - **[PROVEN]** Pelo menos sete filhos estão agora documentados individualmente por registros em mãos: Maria Felomena (n. 30 set. 1891, CIV-0045 — [Corrigido em 2026-10-08 a partir da imagem: "a trinta do passado", não ~1 out.]), João Gonçalves (nossa linha, n. ~1894), gêmeas Adelaide e Carolina (n. 19 jul. 1899, PAR-0080), Valentim Luciano (n. 14 maio 1902, PAR-0074), Maria Clara (n. 20 fev. 1908, PAR-0052), Durval Baptista (n. 24 jun. 1910, PAR-0053) e Maria Bohrer Teixeira (n. 8 ago. 1919, f. 2003 Niterói, CIV-0047) — todos nascidos em Nova Friburgo ou no Rio de Janeiro. A mudança para Minas Gerais e depois para Volta Redonda foi da geração de seu filho João, e não da sua.

  - **[PROVEN]** Em 14 de setembro de 1908, na capela de São Pedro de Nova Friburgo, sua filha Maria Clara foi batizada no mesmo dia e na mesma folha que Lucinda Maria, filha de Joaquim José Bohrer (P-0030) e Lucinda. Era o domicílio de Celina (P-0015), que viria a casar-se com João Gonçalves, filho de Carolina (PAR-0052). Os dois domicílios Bohrer cujos filhos depois se casariam batizavam filhas lado a lado.

  ## Identidade

  **Carolina Klein** (nome de casada **Carolina Bohrer**) — mãe de João Gonçalves Bohrer
  (P-0014) e esposa de Valentim Martinho Bohrer (P-0028). [PROVEN]

  - **Sobrenome de solteira:** KLEIN — confirmado em fonte primária pelo seu próprio casamento
  de 1890 em Nova Friburgo (PAR-0064): "Carolina Klein … filha legitima de Jacob Klein e Maria
  Luiza Schenkel". Isso supera a antiga pista de blog colaborativo, agora corroborada por um
  registro retido. [PROVEN]

  - **Formas do nome nos registros disponíveis:** "Carolina Klein" (1890, PAR-0064; 1891,
  CIV-0045; 1902, PAR-0074); "Carolina Klein Bohrer" (batismo das gêmeas em 1900, PAR-0080;
  óbito de 2003 da filha Maria, CIV-0047); "Carolina Klein Bor[b]er" (1908 e 1910, PAR-0052,
  PAR-0053); e simplesmente "Carolina Bohrer" nos atos de 1923, 1924, 1948 e 1970 (CIV-0038,
  CIV-0016, PAR-0065, CIV-0014) [PROVEN]. A árvore do FamilySearch lhe dá um nome do meio
  "Schuenck", que nenhum registro disponível traz [LEAD].

  - **Pais:** Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104), colonos luteranos de Nova
  Friburgo; família F-0051. [PROVEN — PAR-0064]

  - **Nascimento:** ~1873 em Nova Friburgo — o casamento de 1890 a registra com 17 anos e
  "nascida, baptizada e moradora nesta freguesia de Nova Friburgo". [PROVEN — PAR-0064]

  - **Religião:** criada luterana (a família colona Klein); abjurou o protestantismo e foi
  batizada católica pouco antes do casamento de 1890. [PROVEN — PAR-0064]

  - **Ocupação:** doméstica [PROVEN conforme declarado] (CIV-0014).

  - **Cônjuge:** Valentim Martinho Bohrer (P-0028). Casaram-se em 27 de novembro de 1890 na
  Matriz de Nova Friburgo (Livro de Casamentos p.79, nº 333), ela com dezessete anos e
  "licenciada verbalmente por seu pae", ele com vinte e dois; as testemunhas foram José Domingos
  Bor[b]er [uncertain] e Ernesto Piller [PROVEN — PAR-0064, evento E-0088]. Valentim faleceu em
  23 de setembro de 1948 em Nova Friburgo, aos 80 anos, "casado com Carolina Bohrer" (PAR-0065);
  o filho em nossa linha é João Gonçalves Bohrer (P-0014).

  - **Filhos (documentados):** com Valentim Martinho Bohrer — Maria Felomena Bohrer (n. 30 set.
  1891, CIV-0045); João Gonçalves Bohrer (P-0014, nossa linha, n. ~1894); gêmeas Adelaide
  Bohrer e Carolina Bohrer (n. 19 jul. 1899, PAR-0080); Valentim Luciano (n. 14 de maio de
  1902, PAR-0074); Maria Clara (n. 20 de fevereiro de 1908, PAR-0052); Durval Baptista (n. 24
  de junho de 1910, PAR-0053); e Maria Bohrer Teixeira (n. 8 ago. 1919, f. 2003 Niterói,
  CIV-0047) — todos claramente falecidos. Sete PROVEN por registros em mãos que nomeiam
  ambos os pais. [PROVEN] O levantamento reconciliado da pesquisa de recuperação chega a cerca de
  onze, acrescentando Laudelina Olívia (1896, entrada de índice de batismos) e Balbina Eufrásia e
  Dionisio (apenas na árvore do FamilySearch) [LEAD — nenhum registro disponível aqui].

  - **Óbito:** **17 de abril de 1973, São Gonçalo, RJ** [LEAD — índice do registro de óbito
  do FS personas (ark 3:1:3QS7-899K-F9LB), imagem fora da ferramenta; certidão de óbito não
  obtida]. Foi registrada viva e "natural deste Estado" (Rio de Janeiro) no óbito de 1970 de
  seu filho João Gonçalves (CIV-0014); então já viúva, tendo seu marido Valentim falecido em
  1948 (PAR-0065). Se confirmado, faleceu com cerca de 100 anos — ainda era doméstica em Volta
  Redonda em agosto de 1970.

  ## Posição social e profissão

  - **Lavradora, São José do Ribeirão, 1891** — lançada com o marido como "brazileiros,
  lavradores e moradores desta Parochia" no nascimento civil da filha Maria Felomena (CIV-0045)
  [PROVEN].

  - **Doméstica, Volta Redonda, 1970** — assim nomeada, residente na cidade, no óbito do filho
  João Gonçalves (CIV-0014) [PROVEN].

  - **Propriedade, cargo, título:** nenhum em qualquer registro disponível. **Alfabetização:**
  não documentada; nenhum ato disponível traz sua assinatura [OPEN]. O marido não sabia
  escrever: o nascimento de 1891 foi assinado por outro "a rogo do declarante por não saber
  escrever" (CIV-0045) [PROVEN].

  ## Família e rede social

  **Pais.** Jacob Klein (P-0103), nascido em 16 de novembro de 1844 em Nova Friburgo e batizado
  na congregação luterana da colônia (PAR-0066), e Maria Luiza Schenkel (P-0104, n. ~1851).
  Casaram-se na igreja luterana de Nova Friburgo em 29 de abril de 1872, quando Jacob morava "no
  Rio bonito" (PAR-0068) [PROVEN]. Jacob estava vivo para autorizar o casamento dela em 1890
  (PAR-0064), e ambos são nomeados como avós maternos em outubro de 1891 (CIV-0045). O óbito da
  mãe não foi localizado; a antiga leitura "antes de 1889" foi retirada com base em índices que
  a mostram viva em 1896 [LEAD].

  **Avós.** Paternos: Johannes Klein (P-0105) × Anna Margaretha [Neis — uncertain] (P-0106).
  Maternos: Conrad Schenkel (P-0107) × Maria Luiza Stoffel (P-0108). Os quatro são nomeados no
  casamento dos pais em 1872 (PAR-0068). Uma geração acima, os avôs de sua mãe eram Heinrich
  Schenkel, *Kirchenvorsteher* (presbítero) da congregação luterana, e Joseph Stoffel,
  "Schweizer Colonist" (PAR-0067) [PROVEN].

  **Irmãos [LEAD].** A pesquisa de recuperação reconcilia cerca de nove irmãos a partir do
  índice de batismos de Nova Friburgo de Raibert e da árvore do FamilySearch, nascidos ou
  batizados entre 1869 e 1896: Maria (Margarida), José Marque, Maria Luiza, Manuel Aleixo,
  Isabel, Secundina, Leonel, Antônio e Palmira Eugênia. Nenhum registro de irmão está disponível
  aqui, e os livros católicos de São José do Ribeirão de onde vêm os índices não estão
  digitalizados. Dois deles (1869, 1871) são dados como anteriores ao casamento de 1872, o que
  faria de Carolina a primeira filha nascida depois dele [INFERRED, apoiado em pistas]. A mesma
  pesquisa aponta uma segunda família Klein do lado materno Schenkel e adverte contra confundir
  as duas [LEAD].

  **Compadrio.** Ela e Valentim trocaram apadrinhamentos com Vicente Borber Junior e Hortencia
  Heckdorn: esse casal foi padrinho do filho Valentim Luciano em 1902 e, na mesma folha, ela e
  Valentim foram padrinhos da filha deles, Maria Yzaura (PAR-0074) [PROVEN]. Seus próprios pais
  apadrinharam a filha gêmea Carolina em 1900 (PAR-0080).

  ## O que podemos extrapolar

  **Suas duas ocupações registradas são o arco inteiro numa só vida.** Em outubro de 1891, com
  cerca de dezoito anos, ela é lançada com o marido como *lavradora* em São José do Ribeirão —
  "brazileiros, lavradores e moradores desta Parochia" (CIV-0045) [PROVEN]. Em agosto de 1970,
  com cerca de noventa e sete, é lançada como *doméstica* residente em Volta Redonda,
  sobrevivendo ao filho cujo óbito a nomeia (CIV-0014) [PROVEN]. De lavrar um lote de freguesia
  na serra de Nova Friburgo a doméstica na cidade siderúrgica da Companhia Siderúrgica Nacional,
  dentro da vida de uma só mulher. (Nesses registros *doméstica* abrange tanto o trabalho
  doméstico não remunerado quanto o serviço pago, de modo que o lançamento de 1970 marca uma
  posição no domicílio, não necessariamente um emprego [CONTEXTUAL].)

  **Seu casamento lhe custou uma confissão religiosa — o preço mais claro que alguém desta linha
  está documentado a pagar por um enlace.** O ato de casamento de 1890 registra que a nubente,
  de dezessete anos e "licenciada verbalmente por seu pae", havia antes "abjurado o
  protestantismo, fazendo a profissão de fé catholica e recebido o baptismo" (PAR-0064)
  [PROVEN]. Os Klein/Schenkel dela teriam chegado a Nova Friburgo na **segunda** onda de
  colonização — as famílias alemãs recrutadas em Hessen e na Renânia e desembarcadas em 1824,
  cinco anos depois dos suíços [CONTEXTUAL; a chegada dos Klein em si é uma LEAD] —, com um ramo
  suíço Stoffel entre eles (PAR-0067). Outro esquema, outra confissão e um resultado de classe
  idêntico: camponeses famintos de terra convertidos em pequenos posseiros de lotes serranos
  pobres, sem capital herdável de nenhum dos lados da união. Seu casamento funde as duas
  colônias sem elevar nenhuma delas.

  **Os padrinhos de seus filhos são o mapa desse mundo fechado.** Nos batismos disponíveis os
  padrinhos são seus próprios pais (Jacob Klein e Maria Luiza, sobrenome escrito "Schewele"
  [uncertain], foram padrinhos da gêmea Carolina em 1900, PAR-0080), parentes do marido (João
  Maria Bohrer e Luiz Bohrer para Adelaide; Vicente Borber Junior e Hortencia Heckdorn em 1902,
  PAR-0074, apadrinhamento recíproco, pois ela e Valentim foram padrinhos da filha desse casal
  na mesma folha) e vizinhos da colônia
  (os Heisinger em 1908, PAR-0052; em 1910, PAR-0053) [PROVEN]. Nenhum deles traz patente, cargo
  ou título de protetor. O compadrio, nas famílias brasileiras proprietárias, era um canal de
  patronagem; aqui ele circula apenas entre gente do mesmo nível. É um marcador de classe pela
  negativa. [INFERRED]

  **Um domicílio que se mudou constantemente sem nunca ir a lugar algum.** [INFERRED] Os
  registros seguem a família pela comarca de Nova Friburgo — São José do Ribeirão em 1891,
  Lumiar em 1900, a matriz e São Pedro de 1902 a 1910 —, movimento de arrendatários ou pequenos
  posseiros atrás de trabalho e terra dentro de um só município, não de uma família em ascensão.
  Com sete filhos documentados em registros disponíveis (cerca de onze no levantamento da
  pesquisa [LEAD]) e nenhuma propriedade em qualquer registro disponível, a sucessão
  partível nada tinha a dividir quando chegou aos filhos dela [CONTEXTUAL]; a geração seguinte,
  por isso, deixou a serra por completo.

  **Ela é o tronco fundador da colônia terminando na cidade siderúrgica.** [INFERRED] Nascida
  por volta de 1873 de colonos luteranos e vista viva pela última vez em agosto de 1970,
  sobreviveu ao marido por mais de vinte anos e, se a pista do óbito de 1973 se confirmar, ao
  filho João Gonçalves por mais de dois. Seu último lar atestado foi Volta Redonda, a cidade que
  a usina da CSN ergueu a partir dos anos 1940 [CONTEXTUAL]; a pista do óbito situa seu fim em
  São Gonçalo [LEAD]. Que uma
  mulher do tronco colono fundador termine como *doméstica* numa cidade industrial não é uma
  queda: é a trajetória plana ou modestamente ascendente de uma linha que começou sem terra,
  recebeu um lote pedregoso e nunca acumulou. Sua própria ascendência está agora documentada em
  nível primário: o casamento de 1890 confirma que era uma **Klein**, filha de Jacob Klein
  (P-0103) × Maria Luiza Schenkel (P-0104). [PROVEN]

  ## Questões em aberto

  - **Seu primeiro batismo (~1873).** O ato de 1890 a faz receber o batismo só na conversão, de
  modo que um batismo de infância teria sido luterano [INFERRED]. A pesquisa de recuperação
  relata o registro luterano de Nova Friburgo como negativo delimitado para os filhos deste
  casal, enquanto sua lista de irmãos baseada em índices os dá batizados católicos em São José
  do Ribeirão desde 1870 [LEAD]. Se os dois relatos se confirmarem, fica sem explicação por que
  Carolina ainda era protestante em 1890. Registros decisivos: os livros católicos de batismo de
  São José do Ribeirão (não digitalizados) e o Taufregister luterano de Nova Friburgo de
  1872–1874. [OPEN]

  - **Seu óbito:** 17 de abril de 1973, São Gonçalo [LEAD — apenas índice de registro de
  óbito]. Fecha-se com o assento civil de óbito de São Gonçalo. [OPEN]

  - **O nome do meio "Schuenck"** na árvore do FamilySearch: nenhum registro disponível o traz;
  pode ser uma forma deturpada do sobrenome da mãe, Schenkel [INFERRED]. [OPEN]

