  - **Maiden surname:** not recorded [OPEN] — "Bohrer" is her married name. A
  secondary/blog lead proposes "Klein" (a German-colony Nova Friburgo family), unverified
  in our sources. [LEAD]

  - **Occupation:** doméstica (homemaker) [PROVEN as stated] (CIV-0014).

  - **Spouse:** Valentim Martinho Bohrer (P-0028).

  - **Child (in our line):** João Gonçalves Bohrer (P-0014).

  - **Origin, birth, death:** not held [OPEN]; recorded as of this Estado (Rio de Janeiro)
  in CIV-0014.

  ## Note on evidence

  She appears only as a named parent and grandparent: as "Carolina Bohrer, doméstica" in
  her son's 1970 death (CIV-0014) and as Eunir's paternal grandmother in the 1924 Nova
  Friburgo birth (CIV-0016). No record of her own is held.

  ## Sources held (this repository)

  - CIV-0014 (son João Gonçalves's 1970 Volta Redonda death) · CIV-0016 (grandson Eunir's
  1924 Nova Friburgo birth). She appears in no other held record.
