  ## Contexto regional e migratório

  Os lugares declarados nos registros seguem a família pela serra de Nova Friburgo e depois para
  fora dela. Seu pai morava "no Rio bonito" quando se casou em 1872 (PAR-0068), provavelmente o
  vale do Rio Bonito de Lumiar, dentro de Nova Friburgo, e não a cidade de baixada com esse nome
  [INFERRED]. Ela era "nascida, baptizada e moradora" na freguesia de Nova Friburgo em 1890
  (PAR-0064); o casal era lavrador em São José do Ribeirão em 1891 (CIV-0045) e depois batizou
  filhos em Lumiar em 1900 (PAR-0080) e na capela de São Pedro de 1902 a 1910 (PAR-0074,
  PAR-0052, PAR-0053) [PROVEN]. Em agosto de 1970 ela morava em Volta Redonda (CIV-0014)
  [PROVEN], a cidade siderúrgica da CSN para onde o domicílio do filho se mudara [CONTEXTUAL]. A
  pista do óbito de 1973 a situa em São Gonçalo [LEAD]; sua filha Maria Bohrer Teixeira morava em
  Alcântara, São Gonçalo, em 2003 (CIV-0047), de modo que uma última mudança para a casa de uma
  filha é plausível, mas não documentada [INFERRED]. Sua nacionalidade brasileira decorre do
  nascimento em Nova Friburgo declarado no casamento. Acima dela, o ramo suíço está documentado
  (PAR-0067) e os registros luteranos em alemão situam a família na congregação germanófona da
  colônia (PAR-0066, PAR-0068); a origem alemã da linha Klein em si apoia-se em pistas (P-0105)
  e não é inferida do sobrenome.

