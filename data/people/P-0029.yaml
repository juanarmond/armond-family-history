notes:
- text: >-
    Ahnentafel position 29 — mother of João Gonçalves Bohrer (P-0014). Named as
    "Carolina Bohrer, doméstica" in his 1970 death (CIV-0014) and as Eunir
    Bohrer's paternal grandmother in the 1924 Nova Friburgo birth (CIV-0016). Her
    maiden surname is not recorded ("Bohrer" is her married name); no record of
    her own has been located.
  text_pt: >-
    Posição 29 no Ahnentafel — mãe de João Gonçalves Bohrer (P-0014). Nomeada como
    "Carolina Bohrer, doméstica" em seu óbito de 1970 (CIV-0014) e como avó paterna
    de Eunir Bohrer no nascimento de 1924 em Nova Friburgo (CIV-0016). Seu sobrenome
    de solteira não está registrado ("Bohrer" é seu nome de casada); nenhum registro
    próprio dela foi localizado.
