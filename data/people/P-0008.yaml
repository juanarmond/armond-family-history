profile: >-
  ## Interesting facts

  - **[PROVEN]** Father-and-son baker dynasty: Aristão was recorded "de profissão padeiro" at his 1957 death (CIV-0005), and his son Geraldo (P-0004) is also recorded "padeiro" at his 1952 marriage (CIV-0002). Two consecutive generations in the same trade — the Armond family's landowning past converted into urban labour in exactly one step.

  - **[PROVEN]** His name is recorded three ways in the archive: "Aristão Ferreira Armond" (CIV-0003, CIV-0005), "Aristac Ferreira Armond" (GOV-0001) and "Aristão Ferreira Amaral, dito Armond" (CIV-0005) — illustrating how the unusual name "Aristão" was mangled by clerks across eighty years and two states.

  - **[PROVEN]** In 1931 — the same year the Great Depression was devastating coffee prices across the Zona da Mata — the Minas Geraes state gazette appointed him "subdelegado de polícia" of the Limeira district, Muriaé (GOV-0004). An unpaid honorary post, but the Armond men still commanded civic trust while working a trade.

  - **[INFERRED]** His family's MG → RJ migration is precisely dateable to 1946–1957: both sons were born in the Zona da Mata (Geraldo at Limeira 1915, José Olavo at Eugenópolis 1926); his wife Liliosa died at Eugenópolis in 1946 (CIV-0002); and he himself died at Volta Redonda in 1957 (CIV-0005). He made the migration in his seventies, after his wife's death.

  - **[CONTEXTUAL]** The 1929 Great Depression crash accelerated the Zona da Mata's long coffee decline; the Vargas government from 1930 implemented coffee valorisation policies that benefited São Paulo's newer lands more than Minas's older ones. Aristão's departure fits the final stage of that regional collapse.

  - **[INFERRED]** He is the middle generation of the arc: his father Simplício held police posts and married into a landed Toledo estate; Aristão held one police post (1931) but also worked a baker's trade; his son Geraldo had only the baker's trade. Each generation retained the name but shed one layer of status.

  ## Identity

  **Aristão Ferreira Armond**, Juan's paternal great-grandfather — the generational
  hinge that carried the Zona-da-Mata Armond/Toledo world into 20th-century Rio de
  Janeiro. Source name forms vary: the 1973 driver index for his son prints **"Aristac
  Ferreira Armond"** (GOV-0001), and his own 1957 death entry is written
  idiosyncratically as "Aristão Ferreira Amaral, dito Armond" (CIV-0005); the branch
  also drifts *Armand ⁓ Armond*. [PROVEN]

  - **Birth:** c.1879, **Minas Gerais** [naturalidade PROVEN via CIV-0005; year
  INFERRED from the age 78 stated at his 1957 death]. The specific origin parish is a
  gap [OPEN]: a long-held **Piacatuba** attribution is now doubtful, and the family's
  locality leads point instead to **Rio Pardo da Leopoldina / Argirita – Bom Jesus do
  Rio Pardo** (CIV-0023 places his sister Aristides's ~1875 birth there). [LEAD]

  - **Parents:** **Simplício José Ferreira Armond** (P-0016) and **Eliza** (P-0017,
  named "Eliza Ferreira Armand" in his death entry). Stated in his own 1957 death
  (CIV-0005) and corroborated by his sister Marfiza's 1962 death (CIV-0013) and his son
  Geraldo's 1991 óbito (CIV-0003). [PROVEN]

  - **Marriage:** married **Liliosa Paz Armond** (P-0009); the marriage act is not held
  [OPEN], but the union is attested downstream — both sons carry the "Paz" surname, and
  CIV-0003, GOV-0001 and NWS-0001 all name the couple as their parents. [PROVEN
  downstream]

  - **Death:** 1 November 1957 at **Volta Redonda, RJ**, aged 78 (registered 2 November
  1957, entry nº 9890, folha 315); cause "arteriosclerose generalizada". [PROVEN]

  - **Children (primary-confirmed):** **Geraldo Paz Armond** (P-0004, b.1915) and
  **José Olavo Armond** (P-0018, b.1926), both carrying "Paz". [PROVEN]

  ## Standing and profession

  - **Padeiro (baker)** — recorded "de profissão padeiro" in his own 1957 civil death
  registration (CIV-0005). [PROVEN]

  - **Muriaé legal and credit world, 1903–1922** [PROVEN — primary images in research
  folder, not yet formally catalogued as sources]: three FAN-role appearances establish
  him as a literate, commercially active Zona-da-Mata townsman across nearly three
  decades before the move to Rio: (a) *testemunha* (witness) to an escritura de
  hipoteca at the 1º Ofício de Muriaé, 21 Oct 1903; (b) creditor in the estate of
  António Marques da Silva, Comarca de Muriaé, 29–30 May 1917 — awarded and paid
  18$584 in the pro-rata creditor rateio; (c) *requerente* (petitioning party) in the
  inventário of Joaquim dos Santos Garcia, Comarca de Muriaé, 20 May 1922. None of
  these names his own kin, but together they bracket his Muriaé presence from 1903 to
  1931. [FAN-role records; not yet catalogued in data/sources/]

  - **Father→son police-authority pattern** [PROVEN]: Simplício (2.º/3.º *suplente* de
  delegado, 1899/1902) → Aristão (*subdelegado*, 1931) — two Armond generations held
  substitute police authority in the Muriaé comarca, both posts unpaid cargos gratuitos.
  The 1931 subdelegado appointment followed Aristão's documented membership in the
  pro-Vargas Legião de Outubro nucleus of the Limeira district (April 1931, *Minas
  Geraes* gazette) alongside a co-member (Leopoldo Camillo de Campos) also named in the
  subdelegado act — reading as post-1930-Revolution political patronage, not a career
  appointment. [PROVEN for the 1931 act (GOV-0004); Legião de Outubro connection from
  research gazette read, not yet formally catalogued]

  - **Downward social arc** [INFERRED]: his father Simplício held court and civic roles
  (documented on P-0016), whereas Aristão and both his sons were urban tradesmen. Yet
  his Muriaé record through 1922 shows him still inside the propertied legal world — the
  transition to padeiro happened at or after the move to Rio, not before.

  ## Family and social network

  Documented sisters (children of Simplício × Eliza): **Marfiza Ferreira Armond**
  (b.~1873, d.1962 Itaperuna, CIV-0013) and **Aristides Ferreira Armand** (b.~1875 at
  Rio Pardo da Leopoldina, married João Rodrigues Braga in 1894, CIV-0023). Through his
  mother Eliza (P-0017), his own children inherit the landed **Toledo** maternal
  ancestry. [PROVEN]

  ## What we can extrapolate

  Aristão is the middle term of the three-generation arc — his father Simplício (P-0016) → Aristão →
  his son Geraldo (P-0004) — and the generation in which the family's class position actually
  changes. His own documented occupation, padeiro (CIV-0005), is already working-class; his father's
  world of offices, court trust and Toledo probate paper is not. The held records let us locate the
  change fairly precisely. [PROVEN occupation; arc INFERRED]

  - **He inherited status, not the capital that had produced it** [INFERRED]. He was born c.1879
  into the family at its most impressive on paper: his father held substitute police office and
  appeared as an heir in Toledo probate, his mother Eliza carried the landed Toledo name. But that
  standing rested on unpaid offices and a married-in land base, neither heritable in his own right
  (see P-0016 and P-0017). The offices ended with the man who held them; the Toledo land was his
  mother's, and entered an estate to be divided rather than passing to him as owned capital.

  - **When the Toledo inheritance finally arrived, it arrived as fractions — and he was already about
  forty** [PROVEN document; INFERRED reading]. The payment folio dated c.1919 allots his father, in
  his mother's right, value shares rather than property: 72$910 in a dwelling house, 9$113 in the
  paiol, 3$645 in the mill, 14$582 in the halves of the engenho and ventilador, 51$037 in 3,388 ares
  of virgin forest, a worn capoeira figure read as 50$546 or 508$546 [uncertain], and at least one
  further tract off-page (PRB-0011). Under partible succession that parcel would then divide again
  among Marfiza, Aristão, Aristides and their siblings. Whatever reached Aristão personally was a
  fraction of a few hundred mil-réis — arriving in middle age, long after the point at which an
  inheritance sets up a life.

  - **His own money moved at a small scale** [research-folder records, not yet catalogued here].
  Three Muriaé FAN appearances bracket him from 1903 to 1922 inside the propertied legal world:
  witness to an escritura de hipoteca in 1903, creditor in the estate of António Marques da Silva in
  1917, and petitioning party in an inventário in 1922. The 1917 entry is the informative one — he
  was paid 18$584 in a pro-rata creditor rateio, that is, a share-out among creditors of an estate
  that could not pay them in full. He was present in the same credit-and-probate world his father
  had operated in, but on the scale of a small local claim rather than a lender's book. [The
  comparison with his father's 1882–83 loans is not like-for-like: those are loan principals and
  themselves a lead, while 18$584 is a partial recovery.]

  - **The marriage strategy that had built the family's position was not repeated** [INFERRED].
  Simplício married a numbered heir of the landed Toledo clan; Aristão married Liliosa Paz (P-0009),
  a woman who appears in no inventário, land record or estate proceeding, only as a named parent on
  her descendants' certificates. That absence is the expected footprint of a family with nothing to
  divide. Nothing in the held records suggests the Paz match brought property; on present evidence it
  reads as a marriage between social equals at a level the Armonds had already reached — a lateral
  match, not the upward one his father made.

  - **His one documented office paid nothing, and came by politics** [PROVEN act; CONTEXTUAL pay]. In
  August 1931 the Minas Geraes gazette records his appointment as subdelegado de polícia of the
  Limeira district, Muriaé (GOV-0004) — an unpaid cargo gratuito under the same 1841 delegado system
  as his father's posts. The appointment followed his documented membership in the pro-Vargas Legião
  de Outubro nucleus of that district in April 1931, alongside a co-member also named in the
  subdelegado act, which reads as post-1930-Revolution patronage rather than a career step [gazette
  read in the research folder, not yet catalogued]. So the family's public standing survived into the
  1930s — and still had no wage underneath it. It is the last documented appearance of Armond
  authority.

  - **The fall completes in his own lifetime, in a window the records almost close** [INFERRED]. In
  1931 he is a district police authority in Muriaé; by 1 November 1957 he is registered "de profissão
  padeiro" at Volta Redonda, dead at 78 (CIV-0005). His wife Liliosa died at Eugenópolis in 1946
  (CIV-0002) and both sons were born in the Mata (Geraldo at Limeira 1915; José Olavo at Eugenópolis
  1926, NWS-0001), so the move to the Rio de Janeiro industrial belt falls after 1946 — later than
  the 1910s–1920s window some secondary syntheses assume. He made it in his late sixties, after his
  wife's death, which is not the profile of a young man chasing industrial wages; more likely he
  followed children who had already gone. [INFERRED — no held record states a motive]

  - **What the move cost, structurally** [move PROVEN; meaning CONTEXTUAL]. Leaving the declining
  countryside for the Rio pole meant arriving without land, in a place where the family had no
  neighbourhood standing of the kind that had made his father's house the venue for a wedding and his
  district the seat of his office. Status of that sort does not travel. The Zona da Mata's coffee
  economy — the base under the whole arrangement — had been eroding across exactly his adult decades
  through the post-1888 labour rupture, soil exhaustion and the price collapses to 1929.

  - **His own literacy is the one thing the held records do not show** [OPEN]. His father's autograph
  survives (PRB-0002) and his son signed his 1952 marriage certificate (CIV-0002); for Aristão we hold
  no signature. The 1903 witness role and the 1917 and 1922 court appearances imply he could sign, but
  those images are not yet catalogued here. This matters because education tracked the money: schooling
  in the rural Mata was bought and had to be re-bought each generation, and his is the generation where
  the money to buy it ran out.

  - **By 1957 the family could no longer say where it came from** [PROVEN]. His death was declared by
  João Malheiros, a comerciário acting "no impedimento ocasional de membros da família do falecido" —
  no relative was on hand — and the naturalidade of both his parents was entered "Ignorado" (CIV-0005).
  Two generations after Simplício hosted a wedding in his own house at Boa Família, the household's
  memory of its Zona-da-Mata origin had gone. That is the same gap our research still faces: it is not
  only an archival silence, it was already a silence in the family.

  - **The Azorean / Barbacena origin remains a LEAD only:** PUB-0001 (a 2018 UFMG dissertation)
  describes a historical "Ferreira Armond" family of Azorean origin rooted in São João del-Rei,
  Barbacena and the Zona da Mata, but it does not name Aristão and does not connect to our documented
  line — it must not be treated as this family's origin. [LEAD]

  ## Open questions

  - His baptism and exact origin parish — redirect from the doubtful Piacatuba toward
  Argirita / Bom Jesus do Rio Pardo. [OPEN]

  - His marriage act to Liliosa, which would name her parents (the Paz family's single
  biggest gap). [OPEN]

  - His full sibling and child set beyond the primary-confirmed names. [OPEN]

  ## Sources held (this repository)

  - CIV-0005 — his own 1957 Volta Redonda civil death registration (padeiro, aged 78;
  parents Simplicio Armand and Eliza Ferreira Armand).

  - CIV-0013 — 1962 death of his sister Marfiza (parents Simplício Ferreira Armond and
  Eliza Ferreira Toledo).

  - CIV-0023 — 1894 marriage of his sister Aristides (parents Simplício José Ferreira
  Armand and Elisa Balbina de Jesus; family at Rio Pardo da Leopoldina / Boa Família).

  - CIV-0003 — his son Geraldo's 1991 óbito (names Aristão as father, deceased).

  - CIV-0002 — Geraldo's 1952 marriage (son's birthplace Limeira; Liliosa's 1946
  death at Eugenópolis).

  - GOV-0004 — 1931 Minas Geraes state gazette naming Aristão subdelegado de polícia of
  the Limeira district, Muriaé (an unpaid honorary office; the latest office documented in his own name).

  - GOV-0001 — 1973 Guanabara driver-dossier index for his son José Olavo (father
  "Aristac Ferreira Armond", mother Liliosa Paz Armond).

  - NWS-0001 — 1975 marriage bann for his son José Olavo (parents Aristão Ferreira
  Armond and Liliosa Paz Armond; José Olavo natural de Eugenópolis).

  - PUB-0001 — 2018 dissertation on a historical Azorean "Ferreira Armond" family of
  Barbacena / São João del-Rei — a LEAD, not linked to this line.

  ## Regional and migration context

  Aristão is the hinge of the family's **Zona da Mata Mineira → Volta Redonda, RJ**
  move, which our records place after 1946. It fits the early-to-mid-20th-century
  decline of the Mata coffee economy and the pull of the industrial Rio pole; no held
  record states his personal motive. [CONTEXTUAL]

  ## Where to go today

  - **Baptism (~1879, redirected):** Matriz do Senhor Bom Jesus, Argirita, MG (hist. Bom Jesus do Rio Pardo) — Rua Catulino Vasconcelos 204, Centro [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.61000,-42.83583)

  - **Muriaé public/notarial life (1903 escritura · 1917 credor · 1922 audiência · 1931 subdelegado):** Matriz de São Paulo Apóstolo + Fórum + 1º Ofício de Notas de Muriaé (Rua Dr. Afonso Canedo 90) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.1308577,-42.3684826)

  - **1931 subdelegado district / son Geraldo's 1915 birthplace:** Rosário da Limeira, MG (Matriz N.S. do Rosário, Praça N.S. do Rosário) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-20.97889,-42.51194)

  - **Death (1 Nov 1957):** Rio de Janeiro / Volta Redonda, RJ [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Rio%20de%20Janeiro%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Dinastia de padeiros de pai para filho: Aristão foi registrado "de profissão padeiro" em seu óbito de 1957 (CIV-0005), e seu filho Geraldo (P-0004) também é registrado "padeiro" em seu casamento de 1952 (CIV-0002). Duas gerações consecutivas no mesmo ofício — o passado fundiário dos Armond convertido em trabalho urbano em exatamente um passo.

  - **[PROVEN]** Seu nome é registrado de três formas no arquivo: "Aristão Ferreira Armond" (CIV-0003, CIV-0005), "Aristac Ferreira Armond" (GOV-0001) e "Aristão Ferreira Amaral, dito Armond" (CIV-0005) — ilustrando como o incomum nome "Aristão" foi deturpado por escrivães ao longo de oitenta anos e dois estados.

  - **[PROVEN]** Em 1931 — o mesmo ano em que a Grande Depressão devastava os preços do café em toda a Zona da Mata — a gazeta oficial Minas Geraes o nomeou "subdelegado de polícia" do distrito de Limeira, Muriaé (GOV-0004). Um cargo honorário não remunerado, mas os homens Armond ainda desfrutavam de confiança cívica enquanto trabalhavam num ofício.

  - **[INFERRED]** A migração MG → RJ da família é datável com precisão para 1946–1957: ambos os filhos nasceram na Zona da Mata (Geraldo em Limeira em 1915, José Olavo em Eugenópolis em 1926); sua esposa Liliosa faleceu em Eugenópolis em 1946 (CIV-0002); e ele próprio faleceu em Volta Redonda em 1957 (CIV-0005). Ele fez a migração já na casa dos setenta anos, depois da morte da esposa.

  - **[CONTEXTUAL]** O crash da Grande Depressão de 1929 acelerou o longo declínio cafeeiro da Zona da Mata; o governo Vargas a partir de 1930 implementou políticas de valorização do café que beneficiaram mais as terras mais novas de São Paulo do que as mais antigas de Minas. A partida de Aristão encaixa-se no estágio final desse colapso regional.

  - **[INFERRED]** Ele é a geração intermediária do arco: seu pai Simplício exerceu cargos policiais e casou-se com a família fundiária Toledo; Aristão exerceu um cargo policial (1931) mas também trabalhou como padeiro; seu filho Geraldo teve apenas o ofício de padeiro. A cada geração retinha o nome, mas perdia uma camada de posição.

  ## Identidade

  **Aristão Ferreira Armond**, bisavô paterno de Juan — a articulação de geração que
  levou o mundo Armond/Toledo da Zona da Mata para o Rio de Janeiro do século XX. As
  formas do nome variam nas fontes: o índice de motorista de 1973 de seu filho imprime
  **"Aristac Ferreira Armond"** (GOV-0001), e seu próprio assento de óbito de 1957 está
  escrito de forma idiossincrática como "Aristão Ferreira Amaral, dito Armond"
  (CIV-0005); o ramo também oscila entre *Armand ⁓ Armond*. [PROVEN]

  - **Nascimento:** c.1879, **Minas Gerais** [naturalidade PROVEN via CIV-0005; ano
  INFERRED a partir da idade de 78 anos declarada em seu óbito de 1957]. A paróquia de
  origem específica é uma lacuna [OPEN]: uma atribuição de longa data a **Piacatuba** é
  agora duvidosa, e as pistas de localidade da família apontam antes para **Rio Pardo
  da Leopoldina / Argirita – Bom Jesus do Rio Pardo** (CIV-0023 situa ali o nascimento
  de sua irmã Aristides, por volta de 1875). [LEAD]

  - **Pais:** **Simplício José Ferreira Armond** (P-0016) e **Eliza** (P-0017, nomeada
  "Eliza Ferreira Armand" em seu assento de óbito). Declarados em seu próprio óbito de
  1957 (CIV-0005) e corroborados pelo óbito de 1962 de sua irmã Marfiza (CIV-0013) e
  pelo óbito de 1991 de seu filho Geraldo (CIV-0003). [PROVEN]

  - **Casamento:** casou-se com **Liliosa Paz Armond** (P-0009); o assento de casamento
  não foi obtido [OPEN], mas a união é atestada por registros posteriores — ambos os
  filhos levam o sobrenome "Paz", e CIV-0003, GOV-0001 e NWS-0001 todos nomeiam o casal
  como seus pais. [PROVEN downstream]

  - **Óbito:** 1 de novembro de 1957, em **Volta Redonda, RJ**, aos 78 anos (registrado
  em 2 de novembro de 1957, assento nº 9890, folha 315); causa "arteriosclerose
  generalizada". [PROVEN]

  - **Filhos (confirmados por documentos primários):** **Geraldo Paz Armond** (P-0004,
  n.1915) e **José Olavo Armond** (P-0018, n.1926), ambos levando "Paz". [PROVEN]

  ## Posição social e profissão

  - **Padeiro** — registrado "de profissão padeiro" em seu próprio registro civil de
  óbito de 1957 (CIV-0005). [PROVEN]

  - **Mundo jurídico e de crédito de Muriaé, 1903–1922** [PROVEN — imagens primárias na
  pasta de pesquisa, ainda não catalogadas formalmente como fontes]: três aparições em
  papel de FAN estabelecem-no como um homem letrado e comercialmente ativo na Zona da
  Mata por quase três décadas antes da mudança para o Rio: (a) *testemunha* em uma
  escritura de hipoteca no 1º Ofício de Muriaé, 21 de outubro de 1903; (b) credor no
  espólio de António Marques da Silva, Comarca de Muriaé, 29–30 de maio de 1917 —
  recebeu e foi pago 18$584 no rateio proporcional entre credores; (c) *requerente*
  (parte peticionante) no inventário de Joaquim dos Santos Garcia, Comarca de Muriaé,
  20 de maio de 1922. Nenhum desses documentos nomeia seus próprios parentes, mas
  juntos delimitam sua presença em Muriaé de 1903 a 1931. [Registros em papel de FAN;
  ainda não catalogados em data/sources/]

  - **Padrão de autoridade policial de pai para filho** [PROVEN]: Simplício (2.º/3.º
  *suplente* de delegado, 1899/1902) → Aristão (*subdelegado*, 1931) — duas gerações de
  Armonds exerceram autoridade policial substituta na comarca de Muriaé, ambos os cargos
  sendo gratuitos. A nomeação de subdelegado em 1931 seguiu a documentada participação de
  Aristão no núcleo da Legião de Outubro pró-Vargas do distrito de Limeira (abril de
  1931, gazeta *Minas Geraes*), ao lado de um comembro (Leopoldo Camillo de Campos)
  também nomeado no ato de subdelegado — lendo-se como patronato político pós-Revolução
  de 1930, não uma nomeação por mérito. [PROVEN para o ato de 1931 (GOV-0004); ligação
  com a Legião de Outubro a partir de leitura da gazeta na pasta de pesquisa, ainda não
  catalogada formalmente]

  - **Arco de mobilidade social descendente** [INFERRED]: seu pai Simplício exerceu
  cargos judiciais e cívicos (documentado em P-0016), ao passo que Aristão e ambos os
  seus filhos foram trabalhadores urbanos de ofício. Contudo, o registro muriaense de
  Aristão até 1922 mostra-o ainda inserido no mundo jurídico proprietário — a transição
  para padeiro aconteceu na mudança para o Rio ou depois dela, não antes.

  ## Família e rede social

  Irmãs documentadas (filhas de Simplício × Eliza): **Marfiza Ferreira Armond**
  (n.~1873, f.1962 em Itaperuna, CIV-0013) e **Aristides Ferreira Armand** (n.~1875 em
  Rio Pardo da Leopoldina, casada com João Rodrigues Braga em 1894, CIV-0023). Por meio
  de sua mãe Eliza (P-0017), seus próprios filhos herdam a ancestralidade materna
  **Toledo**, de família proprietária de terras. [PROVEN]

  ## O que podemos extrapolar

  Aristão é o termo intermediário do arco de três gerações — seu pai Simplício (P-0016) → Aristão →
  seu filho Geraldo (P-0004) — e a geração em que a posição de classe da família de fato muda. Sua
  ocupação documentada, padeiro (CIV-0005), já é de classe trabalhadora; o mundo do pai, feito de
  cargos, confiança judicial e papelada de inventário Toledo, não é. Os registros em mãos permitem
  localizar essa mudança com razoável precisão. [ocupação PROVEN; arco INFERRED]

  - **Ele herdou posição, não o capital que a havia produzido** [INFERRED]. Nasceu por volta de 1879 na
  família em seu momento mais impressionante no papel: o pai exercia cargo policial suplente e
  aparecia como herdeiro em inventário Toledo, a mãe Eliza levava o nome fundiário Toledo. Mas essa
  posição assentava-se em cargos não remunerados e numa base de terra por casamento, nenhuma delas
  transmissível a ele por direito próprio (ver P-0016 e P-0017). Os cargos terminavam com quem os
  exercia; a terra Toledo era da mãe e entrou num espólio a ser dividido, em vez de passar a ele como
  capital próprio.

  - **Quando a herança Toledo enfim chegou, chegou em frações — e ele já tinha uns quarenta anos**
  [documento PROVEN; leitura INFERRED]. A folha de pagamento datada de c.1919 destina ao pai, em
  direito da mãe, quotas de valor e não bens: 72$910 numa casa de morada, 9$113 no paiol, 3$645 no
  moinho, 14$582 nas metades do engenho e do ventilador, 51$037 em 3.388 ares de matta virgem, uma
  cifra gasta de capoeiras lida como 50$546 ou 508$546 [uncertain] e ao menos mais uma gleba fora da
  página (PRB-0011). Pela sucessão partível, esse quinhão se dividiria outra vez entre Marfisa,
  Aristão, Aristides e os irmãos. O que chegou pessoalmente a Aristão foi uma fração de algumas
  centenas de mil-réis — e chegou na meia-idade, muito depois do momento em que uma herança arma uma
  vida.

  - **Seu próprio dinheiro movia-se em pequena escala** [registros da pasta de pesquisa, ainda não
  catalogados aqui]. Três aparições em papel de FAN em Muriaé o delimitam entre 1903 e 1922 dentro do
  mundo jurídico proprietário: testemunha de uma escritura de hipoteca em 1903, credor no espólio de
  António Marques da Silva em 1917 e parte requerente num inventário em 1922. O registro de 1917 é o
  informativo — ele recebeu 18$584 num rateio proporcional entre credores, isto é, numa divisão entre
  credores de um espólio que não podia pagá-los por inteiro. Ele estava presente no mesmo mundo de
  crédito e inventário em que o pai operara, mas na escala de um pequeno crédito local, não de uma
  carteira de emprestador. [A comparação com os empréstimos de 1882–83 do pai não é equivalente:
  aqueles são principais de empréstimo e, em si, uma pista, ao passo que 18$584 é uma recuperação
  parcial.]

  - **A estratégia matrimonial que construíra a posição da família não se repetiu** [INFERRED].
  Simplício casou-se com uma herdeira numerada do clã fundiário Toledo; Aristão casou-se com Liliosa
  Paz (P-0009), mulher que não aparece em nenhum inventário, registro de terra ou processo de espólio,
  apenas como mãe nomeada nas certidões de seus descendentes. Essa ausência é o rastro esperado de uma
  família sem nada a partilhar. Nada nos registros em mãos sugere que o enlace Paz tenha trazido bens;
  pela evidência atual, lê-se como casamento entre iguais no patamar a que os Armond já haviam
  chegado — um casamento lateral, não o ascendente que o pai fizera.

  - **Seu único cargo documentado não pagava nada, e veio pela política** [ato PROVEN; remuneração
  CONTEXTUAL]. Em agosto de 1931 a gazeta Minas Geraes registra sua nomeação como subdelegado de
  polícia do distrito de Limeira, Muriaé (GOV-0004) — um cargo gratuito, no mesmo sistema de delegados
  de 1841 dos postos do pai. A nomeação seguiu-se à sua documentada participação no núcleo pró-Vargas
  da Legião de Outubro daquele distrito, em abril de 1931, ao lado de um comembro também nomeado no ato
  de subdelegado, o que se lê como patronato pós-Revolução de 1930 e não como passo de carreira [gazeta
  lida na pasta de pesquisa, ainda não catalogada]. Assim, a posição pública da família sobreviveu até
  os anos 1930 — e continuava sem salário por baixo. É a última aparição documentada de autoridade
  Armond.

  - **A queda se completa na própria vida dele, numa janela que os registros quase fecham** [INFERRED].
  Em 1931 ele é autoridade policial de distrito em Muriaé; em 1.º de novembro de 1957 está registrado
  "de profissão padeiro" em Volta Redonda, morto aos 78 anos (CIV-0005). Sua mulher Liliosa faleceu em
  Eugenópolis em 1946 (CIV-0002) e ambos os filhos nasceram na Mata (Geraldo em Limeira, 1915; José
  Olavo em Eugenópolis, 1926, NWS-0001), de modo que a mudança para o cinturão industrial do Rio é
  posterior a 1946 — mais tarde do que a janela de 1910–1920 que algumas sínteses secundárias presumem.
  Ele a fez já perto dos setenta anos, depois da morte da esposa, o que não é o perfil de um homem
  jovem atrás de salário industrial; mais provavelmente seguiu filhos que já tinham ido. [INFERRED —
  nenhum registro em mãos declara o motivo]

  - **O que a mudança custou, estruturalmente** [mudança PROVEN; sentido CONTEXTUAL]. Deixar o campo em
  declínio rumo ao polo do Rio significava chegar sem terra, a um lugar onde a família não tinha a
  posição de vizinhança que fizera da casa do pai o palco de um casamento e de seu distrito a sede de
  seu cargo. Posição desse tipo não viaja. A economia cafeeira da Zona da Mata — a base sob todo o
  arranjo — vinha se corroendo exatamente ao longo das décadas adultas dele, pela ruptura do trabalho
  após 1888, pelo esgotamento do solo e pelas quedas de preço até 1929.

  - **Seu próprio letramento é a única coisa que os registros em mãos não mostram** [OPEN]. A assinatura
  autógrafa do pai sobrevive (PRB-0002) e o filho assinou a certidão de casamento de 1952 (CIV-0002);
  de Aristão não temos assinatura. O papel de testemunha em 1903 e as aparições em juízo de 1917 e 1922
  implicam que sabia assinar, mas essas imagens ainda não estão catalogadas aqui. Isso importa porque a
  instrução acompanhava o dinheiro: a escola na Mata rural era comprada e tinha de ser recomprada a cada
  geração, e é na geração dele que o dinheiro para comprá-la acaba.

  - **Em 1957 a família já não sabia dizer de onde vinha** [PROVEN]. Seu óbito foi declarado por João
  Malheiros, comerciário, agindo "no impedimento ocasional de membros da família do falecido" — nenhum
  parente estava à mão —, e a naturalidade de ambos os pais foi lançada como "Ignorado" (CIV-0005). Duas
  gerações depois de Simplício sediar um casamento em sua própria casa em Boa Família, a memória
  doméstica da origem na Zona da Mata havia sumido. É a mesma lacuna que nossa pesquisa ainda enfrenta:
  não é apenas silêncio de arquivo, já era silêncio na família.

  - **A origem açoriana / de Barbacena permanece apenas um LEAD:** PUB-0001 (dissertação da UFMG, 2018)
  descreve uma família histórica "Ferreira Armond" de origem açoriana, estabelecida em São João del-Rei,
  Barbacena e na Zona da Mata, mas não nomeia Aristão e não se conecta à nossa linha documentada — não
  deve ser tratada como a origem desta família. [LEAD]

