profile: >-
  ## Identity

  **Aristão Ferreira Armond**, Juan's paternal great-grandfather — the generational
  hinge that carried the Zona-da-Mata Armond/Toledo world into 20th-century Rio de
  Janeiro. Source name forms vary: the 1973 driver index for his son prints **"Aristac
  Ferreira Armond"** (GOV-0001), and his own 1957 death entry is written
  idiosyncratically as "Aristão Ferreira Amaral, dito Armond" (CIV-0005); the branch
  also drifts *Armand ⁓ Armond*. [PROVEN]

  - **Birth:** c.1879, **Minas Gerais** [naturalidade PROVEN via CIV-0005; year
  INFERRED from the age 78 stated at his 1957 death]. The specific origin parish is a
  gap [OPEN]: a long-held **Piacatuba** attribution is now doubtful, and the family's
  locality leads point instead to **Rio Pardo da Leopoldina / Argirita – Bom Jesus do
  Rio Pardo** (CIV-0023 places his sister Aristides's ~1875 birth there). [LEAD]

  - **Parents:** **Simplício José Ferreira Armond** (P-0016) and **Eliza** (P-0017,
  named "Eliza Ferreira Armand" in his death entry). Stated in his own 1957 death
  (CIV-0005) and corroborated by his sister Marfiza's 1962 death (CIV-0013) and his son
  Geraldo's 1991 óbito (CIV-0003). [PROVEN]

  - **Marriage:** married **Liliosa Paz Armond** (P-0009); the marriage act is not held
  [OPEN], but the union is attested downstream — both sons carry the "Paz" surname, and
  CIV-0003, GOV-0001 and NWS-0001 all name the couple as their parents. [PROVEN
  downstream]

  - **Death:** 1 November 1957 at **Volta Redonda, RJ**, aged 78 (registered 2 November
  1957, entry nº 9890, folha 315); cause "arteriosclerose generalizada". [PROVEN]

  - **Children (primary-confirmed):** **Geraldo Paz Armond** (P-0004, b.1915) and
  **José Olavo Armond** (P-0018, b.1926), both carrying "Paz". [PROVEN]

  ## Standing and profession

  - **Padeiro (baker)** — recorded "de profissão padeiro" in his own 1957 civil death
  registration (CIV-0005). [PROVEN]

  - **Downward social arc** [INFERRED]: his father Simplício held court and civic roles
  (documented on P-0016), whereas Aristão and both his sons were urban tradesmen.

  ## Family and social network

  Documented sisters (children of Simplício × Eliza): **Marfiza Ferreira Armond**
  (b.~1873, d.1962 Itaperuna, CIV-0013) and **Aristides Ferreira Armand** (b.~1875 at
  Rio Pardo da Leopoldina, married João Rodrigues Braga in 1894, CIV-0023). Through his
  mother Eliza (P-0017), his own children inherit the landed **Toledo** maternal
  ancestry. [PROVEN]

  ## What we can extrapolate

  Aristão is the middle term of a three-generation arc (his father Simplício → Aristão → his
  son Geraldo) that runs from an office-holding, married-into-land Zona-da-Mata family down to
  landless urban tradesmen. His own documented occupation — padeiro (CIV-0005) — is where the
  family's standing is already legible as working-class. [PROVEN occupation; arc INFERRED]

  - **He inherited status, not the capital that had produced it** [INFERRED]. He was born
  (c.1879) into the family at its most impressive — his father held court roles (arbitrador,
  curador, substitute police delegate) and his mother Eliza carried the landed Toledo name.
  But that standing rested on office income and a married-in Toledo land base, neither
  heritable in his own right (see P-0016): the offices died with his father, and the Toledo
  land was his mother's, entering an estate to be divided rather than passing to him as owned
  capital. He inherited the name and the respectability, not the fazenda or the court trust.
  [INFERRED]

  - **Partible inheritance split even that** [CONTEXTUAL]. Whatever Simplício and Eliza left
  divided equally among Marfiza, Aristão, Aristides, José Olavo and their siblings, so
  Aristão's share of an already office-and-marriage-based estate was a fraction — then divided
  again among his own sons.

  - **The regional economy that had carried the family collapsed across his adult life**
  [CONTEXTUAL]. The Zona da Mata's wealth was coffee; the post-1888 labour rupture, soil
  exhaustion and price crashes gutted the regional base through exactly Aristão's adult
  decades. A family whose money had been in the coffee credit economy had its footing pulled
  out from under it.

  - **Urbanization meant starting over with no land** [move DOCUMENTED; class meaning
  CONTEXTUAL]. Leaving the declining countryside for the industrial Rio pole means arriving as
  a wage-earner without land — and the family lands there working-class (Aristão a padeiro,
  his son Geraldo a padeiro too). His documented trade is the concrete sign that the fall from
  propertied notable to tradesman had, by his generation, already happened.

  - **MG → RJ migration between 1946 and 1957** [INFERRED]: both of his sons were born
  in the Zona da Mata Mineira (Geraldo at Limeira 1915, CIV-0002; José Olavo at
  Eugenópolis 1926, NWS-0001); his wife Liliosa died at Eugenópolis, MG in 1946
  (CIV-0002); and Aristão himself died at Volta Redonda, RJ in 1957 (CIV-0005). So the
  family relocated from the Mata to the Volta Redonda area after 1946 — later than the
  1910s–1920s window some secondary syntheses assume.

  - **Azorean / Barbacena origin is a LEAD only:** PUB-0001 (a 2018 UFMG dissertation)
  describes a historical "Ferreira Armond" family of Azorean origin rooted in São João
  del-Rei, Barbacena and the Zona da Mata, but it does not name Aristão and does not
  connect to our documented line — it must not be treated as this family's origin.
  [LEAD]

  A research lead not yet catalogued here reports a 1931 Minas Geraes gazette naming Aristão a
  substitute police authority (subdelegado) at Limeira, Muriaé; if confirmed it would be an
  unpaid honorary office like his father's — local authority without a wage — and would show
  the Armond men still inheriting status without a wage-base into the 1930s, even as the
  family's livelihood had become a trade. [LEAD — not promoted]

  ## Open questions

  - His baptism and exact origin parish — redirect from the doubtful Piacatuba toward
  Argirita / Bom Jesus do Rio Pardo. [OPEN]

  - His marriage act to Liliosa, which would name her parents (the Paz family's single
  biggest gap). [OPEN]

  - His full sibling and child set beyond the primary-confirmed names. [OPEN]

  ## Sources held (this repository)

  - CIV-0005 — his own 1957 Volta Redonda civil death registration (padeiro, aged 78;
  parents Simplicio Armand and Eliza Ferreira Armand).

  - CIV-0013 — 1962 death of his sister Marfiza (parents Simplício Ferreira Armond and
  Eliza Ferreira Toledo).

  - CIV-0023 — 1894 marriage of his sister Aristides (parents Simplício José Ferreira
  Armand and Elisa Balbina de Jesus; family at Rio Pardo da Leopoldina / Boa Família).

  - CIV-0003 — his son Geraldo's 1991 óbito (names Aristão as father, deceased).

  - CIV-0002 — Geraldo's 1952 marriage (son's birthplace Limeira; Liliosa's 1946
  death at Eugenópolis).

  - GOV-0001 — 1973 Guanabara driver-dossier index for his son José Olavo (father
  "Aristac Ferreira Armond", mother Liliosa Paz Armond).

  - NWS-0001 — 1975 marriage bann for his son José Olavo (parents Aristão Ferreira
  Armond and Liliosa Paz Armond; José Olavo natural de Eugenópolis).

  - PUB-0001 — 2018 dissertation on a historical Azorean "Ferreira Armond" family of
  Barbacena / São João del-Rei — a LEAD, not linked to this line.

  ## Regional and migration context

  Aristão is the hinge of the family's **Zona da Mata Mineira → Volta Redonda, RJ**
  move, which our records place after 1946. It fits the early-to-mid-20th-century
  decline of the Mata coffee economy and the pull of the industrial Rio pole; no held
  record states his personal motive. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Aristão Ferreira Armond**, bisavô paterno de Juan — a articulação de geração que
  levou o mundo Armond/Toledo da Zona da Mata para o Rio de Janeiro do século XX. As
  formas do nome variam nas fontes: o índice de motorista de 1973 de seu filho imprime
  **"Aristac Ferreira Armond"** (GOV-0001), e seu próprio assento de óbito de 1957 está
  escrito de forma idiossincrática como "Aristão Ferreira Amaral, dito Armond"
  (CIV-0005); o ramo também oscila entre *Armand ⁓ Armond*. [PROVEN]

  - **Nascimento:** c.1879, **Minas Gerais** [naturalidade PROVEN via CIV-0005; ano
  INFERRED a partir da idade de 78 anos declarada em seu óbito de 1957]. A paróquia de
  origem específica é uma lacuna [OPEN]: uma atribuição de longa data a **Piacatuba** é
  agora duvidosa, e as pistas de localidade da família apontam antes para **Rio Pardo
  da Leopoldina / Argirita – Bom Jesus do Rio Pardo** (CIV-0023 situa ali o nascimento
  de sua irmã Aristides, por volta de 1875). [LEAD]

  - **Pais:** **Simplício José Ferreira Armond** (P-0016) e **Eliza** (P-0017, nomeada
  "Eliza Ferreira Armand" em seu assento de óbito). Declarados em seu próprio óbito de
  1957 (CIV-0005) e corroborados pelo óbito de 1962 de sua irmã Marfiza (CIV-0013) e
  pelo óbito de 1991 de seu filho Geraldo (CIV-0003). [PROVEN]

  - **Casamento:** casou-se com **Liliosa Paz Armond** (P-0009); o assento de casamento
  não foi obtido [OPEN], mas a união é atestada por registros posteriores — ambos os
  filhos levam o sobrenome "Paz", e CIV-0003, GOV-0001 e NWS-0001 todos nomeiam o casal
  como seus pais. [PROVEN downstream]

  - **Óbito:** 1 de novembro de 1957, em **Volta Redonda, RJ**, aos 78 anos (registrado
  em 2 de novembro de 1957, assento nº 9890, folha 315); causa "arteriosclerose
  generalizada". [PROVEN]

  - **Filhos (confirmados por documentos primários):** **Geraldo Paz Armond** (P-0004,
  n.1915) e **José Olavo Armond** (P-0018, n.1926), ambos levando "Paz". [PROVEN]

  ## Posição social e profissão

  - **Padeiro** — registrado "de profissão padeiro" em seu próprio registro civil de
  óbito de 1957 (CIV-0005). [PROVEN]

  - **Arco de mobilidade social descendente** [INFERRED]: seu pai Simplício exerceu
  cargos judiciais e cívicos (documentado em P-0016), ao passo que Aristão e ambos os
  seus filhos foram trabalhadores urbanos de ofício.

  ## Família e rede social

  Irmãs documentadas (filhas de Simplício × Eliza): **Marfiza Ferreira Armond**
  (n.~1873, f.1962 em Itaperuna, CIV-0013) e **Aristides Ferreira Armand** (n.~1875 em
  Rio Pardo da Leopoldina, casada com João Rodrigues Braga em 1894, CIV-0023). Por meio
  de sua mãe Eliza (P-0017), seus próprios filhos herdam a ancestralidade materna
  **Toledo**, de família proprietária de terras. [PROVEN]

  ## O que podemos extrapolar

  Aristão é o termo intermediário de um arco de três gerações (seu pai Simplício → Aristão →
  seu filho Geraldo) que vai de uma família da Zona da Mata detentora de cargos e com terra
  por casamento até trabalhadores urbanos de ofício, sem terra. Sua própria ocupação
  documentada — padeiro (CIV-0005) — é onde a posição da família já se lê como trabalhadora.
  [PROVEN quanto à ocupação; arco INFERRED]

  - **Ele herdou posição, não o capital que a havia produzido** [INFERRED]. Nasceu (c.1879) na
  família em seu momento mais impressionante — o pai exercia cargos judiciais (arbitrador,
  curador, suplente de delegado de polícia) e a mãe Eliza levava o nome fundiário Toledo. Mas
  essa posição assentava-se em renda de cargo e numa base de terra Toledo por casamento,
  nenhuma delas transmissível a ele por direito próprio (ver P-0016): os cargos morreram com o
  pai, e a terra Toledo era da mãe, entrando num espólio a ser dividido em vez de passar a ele
  como capital próprio. Herdou o nome e a respeitabilidade, não a fazenda nem a confiança
  judicial. [INFERRED]

  - **A herança partível dividiu até isso** [CONTEXTUAL]. O que quer que Simplício e Eliza
  tenham deixado dividiu-se igualmente entre Marfiza, Aristão, Aristides, José Olavo e os
  irmãos, de modo que a quota de Aristão num espólio já baseado em cargo e casamento era uma
  fração — depois dividida outra vez entre seus próprios filhos.

  - **A economia regional que sustentara a família entrou em colapso ao longo de sua vida
  adulta** [CONTEXTUAL]. A riqueza da Zona da Mata era o café; a ruptura do trabalho após
  1888, o esgotamento do solo e as quedas de preço corroeram a base regional exatamente
  durante as décadas adultas de Aristão. Uma família cujo dinheiro estivera na economia de
  crédito do café teve o chão puxado de sob os pés.

  - **A urbanização significou recomeçar sem terra** [mudança DOCUMENTED; sentido de classe
  CONTEXTUAL]. Deixar o campo em declínio pelo polo industrial do Rio significa chegar como
  assalariado sem terra — e a família ali se estabelece na classe trabalhadora (Aristão
  padeiro, seu filho Geraldo também padeiro). Seu ofício documentado é o sinal concreto de que
  a queda de notável proprietário a trabalhador de ofício já havia, em sua geração,
  acontecido.

  - **Migração MG → RJ entre 1946 e 1957** [INFERRED]: ambos os seus filhos nasceram na
  Zona da Mata Mineira (Geraldo em Limeira em 1915, CIV-0002; José Olavo em Eugenópolis
  em 1926, NWS-0001); sua esposa Liliosa faleceu em Eugenópolis, MG, em 1946 (CIV-0002);
  e o próprio Aristão faleceu em Volta Redonda, RJ, em 1957 (CIV-0005). Assim, a família
  mudou-se da Mata para a região de Volta Redonda depois de 1946 — mais tarde do que a
  janela de 1910–1920 que algumas sínteses secundárias presumem.

  - **A origem açoriana / de Barbacena é apenas um LEAD:** PUB-0001 (dissertação de
  mestrado da UFMG, 2018) descreve uma família histórica "Ferreira Armond" de origem
  açoriana, estabelecida em São João del-Rei, Barbacena e na Zona da Mata, mas não
  nomeia Aristão e não se conecta à nossa linha documentada — não deve ser tratada como
  a origem desta família. [LEAD]

  Uma pista ainda não catalogada aqui relata um edital do Minas Geraes de 1931 nomeando
  Aristão autoridade policial substituta (subdelegado) em Limeira, Muriaé; se confirmada, seria
  um cargo honorário não remunerado como o do pai — autoridade local sem salário — e mostraria
  os Armond ainda herdando posição sem base de renda até a década de 1930, mesmo quando o
  sustento da família já se tornara um ofício. [LEAD — não promovido]

  ## Questões em aberto

  - Seu batismo e a paróquia de origem exata — redirecionar da duvidosa Piacatuba para
  Argirita / Bom Jesus do Rio Pardo. [OPEN]

  - Seu assento de casamento com Liliosa, que nomearia os pais dela (a maior lacuna da
  família Paz). [OPEN]

  - O conjunto completo de irmãos e filhos além dos nomes confirmados por fontes
  primárias. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0005 — seu próprio registro civil de óbito de 1957 em Volta Redonda (padeiro,
  aos 78 anos; pais Simplicio Armand e Eliza Ferreira Armand).

  - CIV-0013 — óbito de 1962 de sua irmã Marfiza (pais Simplício Ferreira Armond e
  Eliza Ferreira Toledo).

  - CIV-0023 — casamento de 1894 de sua irmã Aristides (pais Simplício José Ferreira
  Armand e Elisa Balbina de Jesus; família em Rio Pardo da Leopoldina / Boa Família).

  - CIV-0003 — óbito de 1991 de seu filho Geraldo (nomeia Aristão como pai, falecido).

  - CIV-0002 — casamento de 1952 de Geraldo (local de nascimento do filho, Limeira;
  óbito de Liliosa em 1946 em Eugenópolis).

  - GOV-0001 — índice de prontuário de motorista da Guanabara de 1973 para seu filho
  José Olavo (pai "Aristac Ferreira Armond", mãe Liliosa Paz Armond).

  - NWS-0001 — edital de proclamas de 1975 de seu filho José Olavo (pais Aristão
  Ferreira Armond e Liliosa Paz Armond; José Olavo natural de Eugenópolis).

  - PUB-0001 — dissertação de 2018 sobre uma família histórica açoriana "Ferreira
  Armond" de Barbacena / São João del-Rei — um LEAD, não ligado a esta linha.

  ## Contexto regional e migratório

  Aristão é a articulação da mudança da família da **Zona da Mata Mineira → Volta
  Redonda, RJ**, que nossos registros situam depois de 1946. Encaixa-se no declínio da
  economia cafeeira da Mata no início e em meados do século XX e na atração do polo
  industrial do Rio; nenhum registro em mãos declara seu motivo pessoal. [CONTEXTUAL]
