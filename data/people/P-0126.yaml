- text: >-
    Maria da Costa Leonardes: died 27 December 1654, S. Sebastião, Terceira, with all the
    sacraments of Holy Mother Church, and was buried inside the Igreja Matriz of the vila
    de São Sebastião in her own grave beside the arch of the chancel (PAR-0098, the original
    óbito; the date is also in PUB-0005, p.259). Married Manuel da Ponte Cardoso (P-0125);
    family F-0063. Mother of Belchior da Ponte Cardoso (P-0123). Her own birth date, place
    and parentage are not given in any held source. She died two years and four months after
    her husband (d.19.8.1652, PAR-0097).
