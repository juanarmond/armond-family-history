profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named in an original parish register: her son Belchior's baptism act of ~9 January 1615 reads "Belchior fo[i filho] a Manoell de Ponte e de **sua molher Maria da Cota**" (PAR-0087, São Sebastião B-1611-1687 p.0037). "Cota" is the scribe's contraction of "Costa". That one clause is her entire primary documentation — and it fixes three things at once: that she existed, that she was Manuel's wife, and that Belchior was her son.

  - **[COMPILED]** Mendes Forjaz gives her fuller name, **Maria da Costa Leonardes**, and her death: São Sebastião, 27 December 1654, two years and four months after her husband (19 August 1652). Neither death act is held.

  - **[INFERRED — actionable]** That 1654 death falls inside TER-AH-SAOSEBASTIAO-O-1642-1696, the very São Sebastião burial register from which PAR-0088 and PAR-0089 were already taken. Her burial act is therefore very likely sitting in an already-digitised book and simply has not been pulled.

  - **[LEAD — explicitly not evidence]** "Leonardes" is the name of a documented founding family of her own parish: **João Leonardes, o Velho**, one of Terceira's first settlers in the 1460s, held land at *Contendas* in São Sebastião, was party to a recorded 1480 dispute with João Vaz Côrte-Real, and died between 1503 and 1507. The compiled genealogies cover only that founding generation, and **no document connects her to it**. A surname is not a descent. It is worth testing, and worth refusing to assume.

  ## Identity

  **Maria da Costa Leonardes** — recorded as "Maria da Cota" in the one original act that names her **[PROVEN, PAR-0087]**; died São Sebastião, Terceira, 27 December 1654 **[COMPILED, PUB-0005 p.259]**. Wife of **Manuel da Ponte Valadão** (P-0125), family F-0063; mother of **Belchior da Ponte Cardoso** (P-0123).

  - **Birth date and place:** unknown. **[INFERRED]** Her recorded children were baptised between 1612 and 1619, so she was probably born in the 1580s or early 1590s; nothing narrows it further.
  - **Parents:** not given. Vol. IX names her husband's parents but not hers **[OPEN]**.
  - **Nationality:** Portuguese (Azores, Crown territory)
  - **Occupation:** none recorded — as for virtually every woman in these registers.

  **Position in the tree.** Along the modelled chain P-0126 → P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Maria stands eight generations above Geraldo Paz Armond (P-0004) — his 6th-great-grandmother — and ten generations above the family's present living generation. The step P-0123 → P-0092 is **[COMPILED]** only and turns on the unresolved "two Gaspars" question; if P-0092 is the following generation, every degree here moves back one.

  ## Standing and profession

  Nothing is documented about her own standing, property, literacy or origin. She appears in the record only as a wife and a mother, and the reason is structural rather than personal: seventeenth-century Azorean parish registers identify women through their husbands, which is why her death is a date in a compiler's line and her life is a five-word clause in her son's baptism **[CONTEXTUAL]**.

  The only indirect signals come from the household she was part of, and they belong to it rather than to her: one son became *Alferes de ordenanças* and another *padre vigário* of the parish matriz **[COMPILED]** — placements that imply a household able to fund a clerical *título de património* and to be counted among the parish's principal families **[INFERRED + CONTEXTUAL]**. None of that documents her personally, and no held record grants this family arms, a *foro* or a title.

  ## Family and social network

  - **Husband:** Manuel da Ponte Valadão (P-0125), named with her in the 1615 baptism **[PROVEN]**. No marriage record, date or parish is known **[OPEN]**.
  - **Children [COMPILED, PUB-0005 p.259]:** Baltazar (b. São Sebastião 6 November 1612); **Belchior da Ponte Cardoso** (b.1615, whose baptism act is the record that names her) **[PROVEN]**; Francisco Cardoso da Ponte / Cardoso Souto-Maior (b.12 March 1617, d.28 December 1679, unmarried); António Coelho Souto-Maior (b.13 February 1619, d.17 July 1686), *padre vigário* of the Matriz de São Sebastião.
  - **Grandchildren:** through Belchior, at least nine, seven of whose baptism acts are held (1651–1666).
  - **Her surname in her descendants:** it does not survive. Her children carry Ponte, Cardoso and Souto-Maior combinations; "Leonardes" stops with her in this line — which is itself a small piece of evidence about how surnames were chosen here, from a pool rather than by strict descent.

  ## What we can extrapolate

  **She is the point where the primary record and the compiled record meet [INFERRED].** Her existence, marriage and motherhood are *proven* — an original register states them. Her name in full, her death date, and everything else about her are *compiled*. Keeping those two layers apart matters especially for her, because the fuller name "Maria da Costa Leonardes" comes only from Mendes Forjaz, while the register says just "Maria da Cota".

  **A parish-rooted household [INFERRED + CONTEXTUAL].** Her children were all baptised at São Sebastião and both she and her husband died there, while his father had died at Praia in 1618. Something settled this branch into São Sebastião in her married lifetime. A wife's family land is one of the commonest reasons a Portuguese household sits where it does **[CONTEXTUAL]** — and the Leonardes name is attached to early São Sebastião landholding. That is a hypothesis with a clear test (below), not a finding.

  **Women disappear from this archive faster than men, and it compounds upward [CONTEXTUAL].** Her husband has a compiled parentage; she has none. Her granddaughter-in-law Mariana Fagundes at least has a named father; Maria has no named parent at all. Each generation back, the female half of the pedigree thins faster — not because those women mattered less, but because the registers recorded them less.

  ## Open questions

  - **Her burial act (27 December 1654) should be retrievable.** It falls inside TER-AH-SAOSEBASTIAO-O-1642-1696, already digitised and already used for two other acts in this repository. **Highest-value next action for her** — it would also likely give her full name in a primary hand, settling whether "Leonardes" is contemporary or the compiler's addition.
  - **Her parentage is entirely unknown.** Vol. IX gives none, and the 2026-09-23 full-corpus search of the *Genealogias* found no entry for her.
  - **The Leonardes question [LEAD].** Whether she descends from the founding São Sebastião settler family of João Leonardes, o Velho, is untested. The compiled genealogies cover only the 1460s–1500s generation; the 17th-century Leonardes of São Sebastião would have to be traced through the parish registers themselves. **Do not assume the descent from the surname.**
  - **Her birth and marriage** are undocumented, and her baptism probably predates the surviving São Sebastião baptism book (which begins in 1611).

  ## Sources held (this repository)

  - **PAR-0087** — her son Belchior's baptism, São Sebastião, ~9 January 1615: the only original act naming her, as "sua molher Maria da Cota". *Primary.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, p. 259: her full name, her marriage to Manuel da Ponte Valadão, her death on 27 December 1654 and her four recorded children. *Secondary, compiled — the sole source for everything except the 1615 act.*

  ## Regional and migration context

  **São Sebastião, Terceira [CONTEXTUAL].** A rural *freguesia* in the orbit of Angra — a city since 1534 and the seat of the Azores bishopric, and one of the mid-Atlantic's main ports of call, where the returning India and Brazil fleets watered and refitted. Terceira itself had been settled since about 1450 and lived on wheat exported to mainland Portugal and the African presidios, on the blue dye *pastel* (woad), on wine and on shipbuilding timber. Her parish was an early one: the Leonardes holding at Contendas dates from the first settlement generation.

  **Her lifetime spans the Habsburg period almost exactly [CONTEXTUAL].** Born probably in the 1580s or early 1590s, she lived her whole adult life under the union of the Portuguese and Spanish crowns (1580–1640), on the island that had resisted Philip II longest and was taken by invasion only in 1583. She saw the Restoration of 1640 and the eleven-month blockade that ended with the Castilian garrison of the Castelo de São Filipe capitulating on 4 March 1642, and died twelve years later.

  **Not an emigrant, and not yet in an emigrant generation [CONTEXTUAL].** The Azorean exodus to Brazil became mass movement only with the Minas Gerais gold strike of 1697 — more than forty years after her death. The push conditions she lived with (a finite island, *morgadio* and primogeniture, seismic shock) were the same ones that would move her descendants; the pull had not yet appeared.

  ## Where to go today

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — where her four recorded children were baptised between 1612 and 1619, where one of them served as vicar, and where she died in 1654. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Contendas, São Sebastião, Terceira** — the locality held by the Leonardes founding family from the 1460s. Visit it as an open question, not as her home: no document places her there. [LEAD] · [Maps](https://www.google.com/maps/search/?api=1&query=Contendas%2C%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds TER-AH-SAOSEBASTIAO-O-1642-1696, which should contain her 27 December 1654 burial act, and the São Sebastião registers in which any 17th-century Leonardes connection would have to be traced. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É nomeada num registo paroquial original: o assento de baptismo do filho Belchior, de ~9 de janeiro de 1615, lê "Belchior fo[i filho] a Manoell de Ponte e de **sua molher Maria da Cota**" (PAR-0087, São Sebastião B-1611-1687 p.0037). "Cota" é a contracção do escrivão para "Costa". Essa única cláusula é toda a sua documentação primária — e fixa três coisas de uma vez: que existiu, que era mulher de Manuel e que Belchior era seu filho.

  - **[COMPILED]** Mendes Forjaz dá o nome completo, **Maria da Costa Leonardes**, e o óbito: São Sebastião, 27 de dezembro de 1654, dois anos e quatro meses depois do marido (19 de agosto de 1652). Nenhum dos dois assentos de óbito está disponível.

  - **[INFERRED — accionável]** Esse óbito de 1654 cai dentro do TER-AH-SAOSEBASTIAO-O-1642-1696, o mesmo livro de óbitos de São Sebastião de onde já saíram PAR-0088 e PAR-0089. O assento dela está, portanto, muito provavelmente num livro já digitalizado, apenas por puxar.

  - **[LEAD — explicitamente, não é evidência]** "Leonardes" é o nome de uma família fundadora documentada da sua própria freguesia: **João Leonardes, o Velho**, um dos primeiros povoadores da Terceira, na década de 1460, tinha terra nas *Contendas*, em São Sebastião, foi parte numa disputa registada de 1480 com João Vaz Côrte-Real e morreu entre 1503 e 1507. As genealogias compiladas cobrem apenas essa geração fundadora, e **nenhum documento a liga a ela**. Um apelido não é uma descendência. Vale a pena testar, e vale a pena recusar-se a assumir.

  ## Identidade

  **Maria da Costa Leonardes** — registada como "Maria da Cota" no único assento original que a nomeia **[PROVEN, PAR-0087]**; falecida em São Sebastião, Terceira, a 27 de dezembro de 1654 **[COMPILED, PUB-0005 p.259]**. Mulher de **Manuel da Ponte Valadão** (P-0125), família F-0063; mãe de **Belchior da Ponte Cardoso** (P-0123).

  - **Data e local de nascimento:** desconhecidos. **[INFERRED]** Os filhos registados foram baptizados entre 1612 e 1619, pelo que terá nascido na década de 1580 ou no início da de 1590; nada estreita mais.
  - **Pais:** não indicados. O Vol. IX nomeia os pais do marido, mas não os dela **[OPEN]**.
  - **Nacionalidade:** portuguesa (Açores, território da Coroa)
  - **Ocupação:** nenhuma registada — como para praticamente todas as mulheres nestes livros.

  **Posição na árvore.** Pela cadeia modelada P-0126 → P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Maria está oito gerações acima de Geraldo Paz Armond (P-0004) — sua 6.ª bisavó (*6th-great-grandmother*) — e dez gerações acima da atual geração viva da família. O passo P-0123 → P-0092 é apenas **[COMPILED]** e depende da questão não resolvida dos "dois Gaspares"; se P-0092 for a geração seguinte, todos os graus aqui recuam um.

  ## Posição social e profissão

  Nada está documentado sobre a sua posição, bens, alfabetização ou origem. Aparece no registo apenas como mulher e mãe, e a razão é estrutural, não pessoal: os registos paroquiais açorianos do século XVII identificam as mulheres através dos maridos, e é por isso que a sua morte é uma data numa linha de compilador e a sua vida é uma cláusula de cinco palavras no baptismo do filho **[CONTEXTUAL]**.

  Os únicos sinais indirectos vêm da casa de que fazia parte, e pertencem a ela e não à pessoa: um filho tornou-se *Alferes de ordenanças* e outro *padre vigário* da matriz da freguesia **[COMPILED]** — colocações que implicam uma casa capaz de custear um *título de património* clerical e de se contar entre as principais da paróquia **[INFERRED + CONTEXTUAL]**. Nada disso a documenta pessoalmente, e nenhum registo disponível concede armas, *foro* ou título a esta família.

  ## Família e rede social

  - **Marido:** Manuel da Ponte Valadão (P-0125), nomeado com ela no baptismo de 1615 **[PROVEN]**. Não se conhece registo, data nem freguesia do casamento **[OPEN]**.
  - **Filhos [COMPILED, PUB-0005 p.259]:** Baltazar (n. São Sebastião 6 de novembro de 1612); **Belchior da Ponte Cardoso** (n.1615, cujo assento de baptismo é o registo que a nomeia) **[PROVEN]**; Francisco Cardoso da Ponte / Cardoso Souto-Maior (n.12 de março de 1617, f.28 de dezembro de 1679, solteiro); António Coelho Souto-Maior (n.13 de fevereiro de 1619, f.17 de julho de 1686), *padre vigário* da Matriz de São Sebastião.
  - **Netos:** por Belchior, pelo menos nove, dos quais sete assentos de baptismo estão disponíveis (1651–1666).
  - **O seu apelido nos descendentes:** não sobrevive. Os filhos levam combinações de Ponte, Cardoso e Souto-Maior; "Leonardes" pára nela nesta linha — o que é, em si, um pequeno indício de como os apelidos eram escolhidos aqui, de um repertório e não por descendência estrita.

  ## O que podemos extrapolar

  **É o ponto onde o registo primário e o registo compilado se encontram [INFERRED].** A sua existência, casamento e maternidade estão *provados* — um registo original afirma-os. O nome completo, a data de óbito e tudo o mais são *compilados*. Manter as duas camadas separadas importa sobretudo nela, porque o nome mais completo "Maria da Costa Leonardes" vem apenas de Mendes Forjaz, enquanto o livro diz só "Maria da Cota".

  **Uma casa enraizada na freguesia [INFERRED + CONTEXTUAL].** Os filhos foram todos baptizados em São Sebastião e tanto ela como o marido ali morreram, ao passo que o sogro morrera na Praia em 1618. Alguma coisa fixou este ramo em São Sebastião durante a sua vida de casada. A terra da família da mulher é uma das razões mais comuns para uma casa portuguesa estar onde está **[CONTEXTUAL]** — e o nome Leonardes está ligado à propriedade antiga em São Sebastião. É uma hipótese com teste claro (abaixo), não um achado.

  **As mulheres desaparecem deste arquivo mais depressa do que os homens, e o efeito acumula para cima [CONTEXTUAL].** O marido tem filiação compilada; ela não tem nenhuma. A nora do neto, Mariana Fagundes, tem pelo menos um pai nomeado; Maria não tem nenhum progenitor nomeado. A cada geração para trás, a metade feminina da ascendência afina mais depressa — não porque essas mulheres importassem menos, mas porque os livros as registavam menos.

  ## Questões em aberto

  - **O assento de óbito (27 de dezembro de 1654) deve ser recuperável.** Cai dentro do TER-AH-SAOSEBASTIAO-O-1642-1696, já digitalizado e já usado para dois outros assentos neste repositório. **Acção seguinte de maior valor para ela** — daria também, provavelmente, o nome completo em mão primária, resolvendo se "Leonardes" é contemporâneo ou acrescento do compilador.
  - **A filiação é totalmente desconhecida.** O Vol. IX não a dá, e a busca integral de 2026-09-23 nas *Genealogias* não encontrou entrada para ela.
  - **A questão Leonardes [LEAD].** Se descende ou não da família fundadora de São Sebastião de João Leonardes, o Velho, está por testar. As genealogias compiladas só cobrem a geração de 1460–1500; os Leonardes seiscentistas de São Sebastião teriam de ser traçados nos próprios registos paroquiais. **Não assumir a descendência a partir do apelido.**
  - **O nascimento e o casamento** não estão documentados, e o baptismo é provavelmente anterior ao livro de baptismos de São Sebastião que sobrevive (que começa em 1611).

  ## Fontes disponíveis (neste repositório)

  - **PAR-0087** — o baptismo do filho Belchior, São Sebastião, ~9 de janeiro de 1615: o único assento original que a nomeia, como "sua molher Maria da Cota". *Primária.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, p. 259: o nome completo, o casamento com Manuel da Ponte Valadão, o óbito a 27 de dezembro de 1654 e os quatro filhos registados. *Secundária, compilada — fonte única para tudo o que não seja o assento de 1615.*

  ## Contexto regional e migratório

  **São Sebastião, Terceira [CONTEXTUAL].** Freguesia rural na órbita de Angra — cidade desde 1534 e sede do bispado dos Açores, e um dos principais portos de escala do Atlântico médio, onde as armadas da Índia e do Brasil aguavam e se reparavam no regresso. A própria Terceira estava povoada desde cerca de 1450 e vivia do trigo exportado para o reino e para as praças africanas, do corante azul *pastel*, do vinho e da madeira de construção naval. A freguesia dela era das antigas: a propriedade dos Leonardes nas Contendas data da primeira geração de povoamento.

  **A sua vida cobre quase exactamente o período habsburgo [CONTEXTUAL].** Nascida provavelmente na década de 1580 ou no início da de 1590, viveu toda a vida adulta sob a união das coroas portuguesa e espanhola (1580–1640), na ilha que mais tempo resistiu a Filipe II e só foi tomada por invasão em 1583. Viu a Restauração de 1640 e o cerco de onze meses que terminou com a capitulação da guarnição castelhana do Castelo de São Filipe a 4 de março de 1642, e morreu doze anos depois.

  **Não emigrante, e ainda não de uma geração emigrante [CONTEXTUAL].** O êxodo açoriano para o Brasil só se tornou movimento de massa com o ouro das Minas Gerais, em 1697 — mais de quarenta anos depois da sua morte. As condições de pressão com que viveu (ilha finita, *morgadio* e primogenitura, choque sísmico) foram as mesmas que moveriam os descendentes; o ímã ainda não existia.

  ## Onde ir hoje

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — onde os quatro filhos registados foram baptizados entre 1612 e 1619, onde um deles serviu como vigário e onde ela morreu, em 1654. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Contendas, São Sebastião, Terceira** — a localidade detida pela família fundadora Leonardes desde a década de 1460. Visitar como questão em aberto, não como casa dela: nenhum documento a coloca ali. [LEAD] · [Mapa](https://www.google.com/maps/search/?api=1&query=Contendas%2C%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — guarda o TER-AH-SAOSEBASTIAO-O-1642-1696, que deve conter o assento de óbito de 27 de dezembro de 1654, e os livros de São Sebastião onde qualquer ligação Leonardes seiscentista teria de ser traçada. · [Mapa](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
