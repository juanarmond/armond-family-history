profile: >-
  ## Interesting facts

  - **[PROVEN]** His own 1820 Nova Friburgo marriage register (PAR-0060) names his father
  "Jacobo Borer, natural de Grindel, no cantão de Soleure" — the clause that fixes his
  paternal line and, read beside the 1825 marriage of the other immigrant Jacob (son of João
  Borer of the Beinwil/Erschwil side), proves the two Nova Friburgo Borer trunks were **not**
  brothers.

  - **[PROVEN]** He married into a wedding, not just a family. The same register page records,
  as entry nº 37, the marriage of Anna Maria's sister Salomea Wehrli to Luiz Nicolão Vilette —
  with **Lourenço Borer standing as a witness** — and his own marriage as nº 38. Two Wehrli
  daughters married on one day, and he was both groom at one and witness at the other.

  - **[CONTEXTUAL]** He was recruited out of Grindel, a small Catholic parish in the Solothurn
  Jura where holdings were divided among heirs until the shares could not feed a household —
  and left in the aftermath of the 1816 "Year Without a Summer", when the 1815 Tambora
  eruption had wrecked harvests across Europe.

  - **[CONTEXTUAL]** His settlement package was set by decree, not by bargaining: a lot and a
  house, rations, seed and livestock, and a daily cash subsidy of 0$160 falling to 0$080 over
  two years — roughly 58$000 in the first year against a free rural labourer's ~420$000. A
  floor designed to stop.

  - **[INFERRED]** With about twelve children, he is the arithmetic engine of the branch's
  permanent land-poverty: one poor serra lot divided under Brazilian partible succession among
  twelve heirs, and again among theirs, cannot become an estate.

  - **[CONTEXTUAL]** His line (BORER II, Grindel, Casa 73 / Lote 86) and Jacob Bohrer's (BORER
  I, Casa 70 / Lote 56) were co-passengers on the *Heureux Voyage* and are documented as
  distinct families — a disambiguation that matters because their descendants later married
  each other and the surname converged on the single spelling "Bohrer".

  ## Identity

  **Laurent Borer** (Germanised *Lorenz*; Portuguese *Lourenço*; the surname drifts to
  **Bohrer** in his Brazilian descendants). The immigrant founder of the Grindel Borer trunk
  in Brazil.

  - **Birth:** 27 February 1797, Grindel, Soleure (Solothurn), Switzerland (PUB-0003,
  strong-evidence; E-0060). A competing "27 July 1797" circulates only in blogs this
  repository does not hold [LEAD]. The Nova Friburgo settler register (GOV-0007) lists him as
  "Laurent Bocher, [18]", a roster age implying ~1802 — a ~5-year discrepancy preserved, not
  adopted.

  - **Father:** **Jacob Borer of Grindel** (P-0100; parentage family F-0049), named in his own
  1820 marriage register [PROVEN — PAR-0060]. Distinct from Jacob Bohrer of the
  Beinwil/Erschwil line (P-0050). **His mother is not named in that record** [OPEN]; a
  FamilySearch collaborative tree (node L7BW-11L) gives his parents as Jakob Borer (1752–1817)
  × Maria Anna Heggendorn (1755–1829) — consistent with the sourced father, but a navigation
  lead for the mother, never evidence [LEAD].

  - **Emigration:** arrived at Nova Friburgo in 1819 aboard the *Heureux Voyage*, occupying
  **Casa 73 / Lote 86** — the same house-and-lot as the Wehrli household he married into
  (PUB-0003). GOV-0007, a low-resolution settler register, shows his arrow-marked entry on
  that opening [PROVEN that he is listed; the surrounding names are low-confidence reads].

  - **Marriage:** married Anna Maria Werhly (P-0069) on 3 July 1820 at São João Baptista, Nova
  Friburgo, before the vicar J. Joye, witnesses Francisco Berla [uncertain] and Laurenço
  Frotté, "colonos suiços" [PROVEN — PAR-0060; event E-0061].

  - **Death:** no record held [OPEN]. The compilation and the Casa Suíça database place him in
  the vale do Macaé; a FamilySearch tree (L7BW-11L) gives 15 December 1880 at São José do
  Ribeirão, a district of Bom Jardim immediately north of Nova Friburgo, aged 83 — more
  precise than the "Macaé valley" guess and consistent with it, but a collaborative-tree lead
  only [LEAD].

  ## Standing and profession

  - **A founding colonist of the 1819 Swiss cohort**, Catholic and German-speaking. **No
  profession is recorded** — the Casa Suíça database enters "desconhecida" — and no office,
  title, property beyond the colony lot, or literacy appears in any held record. [PUB-0003]

  - **His material base was the state package, not a wage.** Under the *Decreto de 16 de maio
  de 1818* each recruited family received a lot and a built house, rations, seed and
  livestock, and a daily subsidy of 0$160 in the first year falling to 0$080 across a two-year
  establishment period. The first-year subsidy annualises to about 58$000 — roughly
  one-seventh of a free rural labourer's ~420$000 a year. [CONTEXTUAL — role-based]

  - **He apparently emigrated alone** ("veio aparentemente só para o Brasil") and then married
  into an already-settled family, unlike the Wehrlis who came as a whole clan [PUB-0003]. Note
  a tension worth flagging: the GOV-0007 opening for his own lot also carries several other
  "Bocher" names (Jean, Melchior, Hugh, Joseph), all low-confidence reads at the delivered
  resolution — either other Borers in the colony or misreadings. The "alone" claim is the
  compilation's, not the register's. [LEAD / uncertain]

  ## Family and social network

  - **Wife:** Anna Maria Werhly (P-0069; family F-0033), a daughter of the Wehrli patriarch
  couple Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Because her mother was
  herself a Borer, the compiler flags Anna Maria as a probable cousin — a suggestion, not
  evidence [LEAD].

  - **A double wedding, one page:** entries nº 37 and nº 38 of the 1820 marriage book record
  Salomea Wehrli × Luiz Nicolão Vilette and Laurent × Anna Maria on the same day, with Laurent
  witnessing his sister-in-law's act [PROVEN — PAR-0060].

  - **Children:** twelve per the Casa Suíça database narrative, "at least eleven" per the
  compilation's main text — a discrepancy preserved, not resolved [PUB-0003]. Ten collateral
  children are catalogued on F-0033 (José, two Anna Marias, José Lourenço, Justina, José
  Constantino, Barbara Elisabeth, Regina, Maria, Thereza); the modelled child is **Vicente
  Borer** (P-0070, b. 6 September 1828, baptised 13 October 1828 — PAR-0061), listed as the
  sixth son, through whom the line continues.

  - **A second Borer–Wehrli tie:** a blog this repository does not hold adds that Laurent's
  brother Johann Borer married Anna Maria's sister Catherine Wehrli — a claimed double
  sibling-marriage [LEAD].

  - **Distinct from BORER I:** Laurent (Grindel, Casa 73 / Lote 86) is not Jacob Bohrer
  (P-0050, Beinwil/Erschwil, Casa 70 / Lote 56); the compilation states "não há evidência de
  parentesco próximo entre os dois grupos", and the two marriage registers name different
  fathers from different villages [PROVEN that the fathers differ].

  ## What we can extrapolate

  - **Standing acquired: nothing inherited, nothing earned by office — a grant and a marriage
  [INFERRED].** Laurent brought no land, capital or title out of Grindel, and if his father
  died in 1817 he brought no parents either [LEAD]. Two things gave him a position at Nova
  Friburgo: a lot handed to him by a colonisation decree, and a marriage into an
  already-settled household. That is "married-in" standing, but it is worth being precise
  about what he married into — **not** capital. The Wehrlis held the same state package he
  did; what they supplied was labour, kin and a place in the colony's social order. Set beside
  the family's Armond line, where marrying in meant marrying into Toledo land and enslaved
  labour, the contrast is exact: on this side, marriage bought belonging, not property.

  - **Wealth mechanics: a two-year subsidy and one poor lot — contingent, then exhausted
  [CONTEXTUAL — role-based].** The colonist package was designed as a bridge, not an
  endowment: it expired, and what remained was the land itself. The lots were small, steep and
  stony, the tools and support inadequate, and the documented colony-wide outcome was that
  many settlers abandoned their plots within a few years. So his only durable asset was also
  the weakest one. No office income, no commerce, no credit appears anywhere in his record — a
  household living off what it could clear.

  - **Partible inheritance, on both sides of the ocean, is the structural spine of his life
  [CONTEXTUAL].** It pushed him out of Grindel, where Jura holdings were divided among heirs
  until the shares would not feed a household; and it capped everything after him, because
  Brazilian succession divided estates equally among all children too. With eleven or twelve
  children, one undersized serra lot fragments to nothing in a single step. Laurent is the
  point in this tree where the same legal mechanism appears as both cause of a migration and
  cause of the migration's failure to compound.

  - **Education: the one imported asset, and this is the branch that lost it [CONTEXTUAL /
  INFERRED — the key divergence].** The Solothurn colonists arrived with Catholic
  parish-school literacy in German, which Brazil did not supply: 19th-century schooling there
  was a purchased, class-linked privilege with no free rural alternative, so it had to be
  re-bought every generation. On the parallel Beinwil/Erschwil branch it was: Jacob Bohrer's
  son Francisco José **signed** his own 1888 will and his sons reached commerce, local office
  and a newspaper. On Laurent's branch it was not. His grandson Valentim Martinho Bohrer had
  to have his daughter's 1891 birth registered "a rogo do declarante **por não saber
  escrever**" (CIV-0045) — and the same act calls him and his wife *lavradores*. Three
  generations from a parish-school-literate Swiss cohort to an illiterate Brazilian farm
  household: the clearest documented case in this tree of education behaving as property does,
  held only where there was money to renew it.

  - **Migration's effect on class — and then a second, quieter migration [INFERRED].** The
  1819 crossing was lateral: land-poor Jura peasant to land-poor colonist, with the gain being
  title rather than quality. The consequential move is the one his children made. The branch
  does not stay on Casa 73 / Lote 86: his son Vicente's firstborn is born at **São José do
  Ribeirão**, his grandson José Maria Bocher marries in 1913 at Maravilhas, **Barra Alegre
  (Bom Jardim)**, described as a *lavrador* (CIV-0048), and the FS-tree lead puts Laurent's
  own death at São José do Ribeirão. That is the colony's documented failure pattern working
  itself out in one family: the lot could not carry twelve heirs, so the sons went out as farm
  labour onto the surrounding fluminense highlands.

  - **The arc, named, with its turning points [INFERRED].** Grindel smallholder's son with
  nothing to inherit (pre-1819) → **turning point 1: the 1819 decree**, which converts
  landlessness into a poor colony lot → **turning point 2: the 1820 marriage**, which buys kin
  and standing but no capital → **turning point 3: twelve heirs**, which guarantees the lot
  cannot descend intact → **turning point 4: the drift off the lot** into São José do Ribeirão
  and Bom Jardim as *lavradores*, with literacy lost on the way. Flat, then flat again; no
  fortune was built, so none was lost. His trunk only rises much later, and elsewhere, when a
  descendant leaves the exhausted land for the 20th-century urban wage economy. That his line
  and the Beinwil/Erschwil Borer line — same ship, same year, same surname — produced an
  illiterate *lavrador* and a self-signing testator in the same generation is the sharpest
  internal comparison this tree offers: the variable was not origin but whether a branch
  reached town trade or stayed on fragmenting land.

  ## Open questions

  - His own **Grindel Catholic baptism (~1797)** — FamilySearch-indexed but FHC-restricted —
  would name his **mother** (his father is already held, PAR-0060) and settle the
  February-vs-July 1797 date. [OPEN]

  - His **death**: the FS-tree lead (15 December 1880, São José do Ribeirão, Bom Jardim) gives
  a specific parish and civil registry to test. [OPEN]

  - His **children's baptisms** in the Nova Friburgo parish books (reportedly off
  FamilySearch) would fix the eleven-vs-twelve count and date the household's move off Lote
  86. [OPEN]

  ## Sources held (this repository)

  - PAR-0060 (his own 1820 Nova Friburgo parish marriage to Anna Maria Wehrli — confirms the
  marriage, names his father Jacob Borer of Grindel and her father Johann Jacob Wehrli, and
  records the same-day sister marriage at which he was a witness; sources event E-0061).

  - PAR-0061 (his son Vicente's 1828 Nova Friburgo baptism — "filho legitimo de Lourenço
  Bhorer e da sua mulher Anna Maria Verly, naturaes do cantão de Soleure").

  - PAR-0062 (Vicente's 1864 Nova Friburgo marriage — names him and Anna Maria again as the
  groom's parents).

  - GOV-0007 (Nova Friburgo colonist settler register — his arrow-marked entry "Laurent
  Bocher, [18]" on the Casa/Lote 73/86 opening; roster age preserved as a discrepancy).

  - PUB-0003 (Henrique Bon, *Imigrantes de Nova Friburgo*, BORER II, pp.300–301, and the Casa
  Suíça database) — the secondary compilation behind his birth date, house and lot, arrival,
  children and probable death region.

  ## Regional and migration context

  Grindel lay in the Bezirk Thierstein of Canton Solothurn, the Catholic, German-speaking Jura
  upland called the Schwarzbubenland: poor, small and land-constrained, with holdings divided
  among heirs until emigration was the only outlet. [CONTEXTUAL] The push was the 1815 Tambora
  eruption and the 1816 "Year Without a Summer" famine landing on post-Napoleonic poverty; the
  pull was Dom João VI's *Decreto de 16 de maio de 1818*, which contracted the Fribourg agent
  S.-N. Gachet to settle 100 Swiss **Catholic** families on the Fazenda do Morro Queimado — a
  serra chosen to resemble Switzerland, and the only Brazilian city founded by royal decree.
  Recruitment overshot to some 261–265 families (roughly 1,700–2,000 people) drawn from
  Fribourg, Solothurn, Valais, Bern and neighbouring German areas, and about a quarter died at
  sea of typhus and scurvy; the first ship reached Rio on 4 November 1819 and the Vila de Nova
  Friburgo was raised on 3 January 1820. [CONTEXTUAL] What the survivors received fell short
  of the promise — poor, stony mountain lots, small plots, inadequate tools and support — and
  many colonists left their plots within a few years for better land in the fluminense
  highlands. Laurent's branch followed exactly that pattern, staying on rural Macaé-valley and
  São José do Ribeirão land rather than in the town.

  ## Where to go today

  - **Birth (27 February 1797):** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn,
  Switzerland [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Marriage to Anna Maria Wehrli (3 July 1820):** Catedral Diocesana / Igreja Matriz de São
  João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — the 1820
  marriage predates the present 1869 cathedral and took place in the colony's earlier church
  on the same site [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (15 December 1880, per the FS-tree lead):** Igreja Matriz de São José, São José do
  Ribeirão (Bom Jardim, RJ) [APPROX] · [Maps](https://maps.google.com/?q=-22.205,-42.3981)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu próprio registro de casamento de 1820 em Nova Friburgo (PAR-0060) nomeia
  o pai "Jacobo Borer, natural de Grindel, no cantão de Soleure" — a oração que fixa sua linha
  paterna e que, lida ao lado do casamento de 1825 do outro imigrante Jacob (filho de João
  Borer, do lado Beinwil/Erschwil), prova que os dois troncos Borer de Nova Friburgo **não**
  eram irmãos.

  - **[PROVEN]** Ele casou-se dentro de um casamento duplo, não apenas numa família. A mesma
  página do livro registra, como assento nº 37, o casamento da irmã de Anna Maria, Salomea
  Wehrli, com Luiz Nicolão Vilette — tendo **Lourenço Borer como testemunha** — e o dele
  próprio como nº 38. Duas filhas Wehrli casadas no mesmo dia, e ele foi noivo num ato e
  testemunha no outro.

  - **[CONTEXTUAL]** Foi recrutado em Grindel, pequena paróquia católica do Jura de Solothurn
  onde as posses eram divididas entre herdeiros até os quinhões não alimentarem um domicílio —
  e partiu logo após o "Ano Sem Verão" de 1816, quando a erupção do Tambora, em 1815,
  arruinara as colheitas em toda a Europa.

  - **[CONTEXTUAL]** Seu pacote de assentamento foi fixado por decreto, não por negociação: um
  lote e uma casa, víveres, sementes e gado, e um subsídio diário de 0$160 caindo a 0$080 em
  dois anos — cerca de 58$000 no primeiro ano, contra os ~420$000 de um trabalhador rural
  livre. Um piso projetado para acabar.

  - **[INFERRED]** Com cerca de doze filhos, é o motor aritmético da pobreza fundiária
  permanente do ramo: um lote serrano pobre dividido, sob a sucessão partível brasileira,
  entre doze herdeiros, e outra vez entre os filhos destes, não pode virar patrimônio.

  - **[CONTEXTUAL]** Sua linha (BORER II, Grindel, Casa 73 / Lote 86) e a de Jacob Bohrer
  (BORER I, Casa 70 / Lote 56) foram copassageiras no *Heureux Voyage* e estão documentadas
  como famílias distintas — desambiguação que importa porque os descendentes das duas se
  casaram depois entre si e o sobrenome convergiu na grafia única "Bohrer".

  ## Identidade

  **Laurent Borer** (germanizado *Lorenz*; em português *Lourenço*; o sobrenome desliza para
  **Bohrer** em seus descendentes brasileiros). O fundador imigrante do tronco Borer de
  Grindel no Brasil.

  - **Nascimento:** 27 de fevereiro de 1797, Grindel, Soleure (Solothurn), Suíça (PUB-0003,
  evidência forte; E-0060). Um concorrente "27 de julho de 1797" circula apenas em blogs que
  este repositório não retém [LEAD]. O registro de colonos de Nova Friburgo (GOV-0007) o lista
  como "Laurent Bocher, [18]", idade de rol que implicaria ~1802 — discrepância de ~5 anos
  preservada, não adotada.

  - **Pai:** **Jacob Borer de Grindel** (P-0100; família parental F-0049), nomeado em seu
  próprio registro de casamento de 1820 [PROVEN — PAR-0060]. Distinto de Jacob Bohrer, da
  linha Beinwil/Erschwil (P-0050). **Sua mãe não é nomeada nesse registro** [OPEN]; uma árvore
  colaborativa do FamilySearch (nó L7BW-11L) dá seus pais como Jakob Borer (1752–1817) × Maria
  Anna Heggendorn (1755–1829) — coerente com o pai já documentado, mas pista de navegação
  quanto à mãe, nunca evidência [LEAD].

  - **Emigração:** chegou a Nova Friburgo em 1819 a bordo do *Heureux Voyage*, ocupando a
  **Casa 73 / Lote 86** — a mesma casa-e-lote do domicílio Wehrli em que se casou (PUB-0003).
  GOV-0007, registro de colonos de baixa resolução, traz sua entrada marcada com seta nessa
  abertura [PROVEN que está listado; os nomes ao redor são leituras de baixa confiança].

  - **Casamento:** casou-se com Anna Maria Werhly (P-0069) em 3 de julho de 1820, em São João
  Baptista, Nova Friburgo, perante o vigário J. Joye, testemunhas Francisco Berla [incerto] e
  Laurenço Frotté, "colonos suiços" [PROVEN — PAR-0060; evento E-0061].

  - **Óbito:** nenhum registro disponível [OPEN]. A compilação e o banco de dados da Casa
  Suíça o situam no vale do Macaé; uma árvore do FamilySearch (L7BW-11L) dá 15 de dezembro de
  1880 em São José do Ribeirão, distrito de Bom Jardim logo ao norte de Nova Friburgo, aos 83
  anos — mais preciso do que o palpite do "vale do Macaé" e coerente com ele, mas apenas pista
  de árvore colaborativa [LEAD].

  ## Posição social e profissão

  - **Colono fundador da coorte suíça de 1819**, católico e germanófono. **Nenhuma profissão
  está registrada** — o banco de dados da Casa Suíça lança "desconhecida" — e nenhum cargo,
  título, propriedade além do lote colonial ou alfabetização aparece em qualquer registro
  disponível. [PUB-0003]

  - **Sua base material era o pacote estatal, não um salário.** Pelo *Decreto de 16 de maio de
  1818*, cada família recrutada recebia um lote e uma casa construída, víveres, sementes e
  gado, e um subsídio diário de 0$160 no primeiro ano, caindo a 0$080 ao longo de um período
  de estabelecimento de dois anos. O subsídio do primeiro ano anualiza-se em cerca de 58$000 —
  mais ou menos um sétimo dos ~420$000 anuais de um trabalhador rural livre. [CONTEXTUAL —
  baseado no papel]

  - **Aparentemente emigrou sozinho** ("veio aparentemente só para o Brasil") e depois
  casou-se numa família já assentada, ao contrário dos Wehrli, que vieram como clã inteiro
  [PUB-0003]. Note-se uma tensão a sinalizar: a abertura de GOV-0007 referente ao seu próprio
  lote traz também vários outros nomes "Bocher" (Jean, Melchior, Hugh, Joseph), todos leituras
  de baixa confiança na resolução entregue — ou outros Borer na colônia, ou leituras erradas.
  A alegação de que veio "sozinho" é da compilação, não do registro. [LEAD / incerto]

  ## Família e rede social

  - **Esposa:** Anna Maria Werhly (P-0069; família F-0033), filha do casal patriarcal Wehrli
  Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Como a mãe dela era ela própria
  uma Borer, o compilador assinala Anna Maria como provável prima — sugestão, não evidência
  [LEAD].

  - **Um casamento duplo, uma página:** os assentos nº 37 e nº 38 do livro de casamentos de
  1820 registram Salomea Wehrli × Luiz Nicolão Vilette e Laurent × Anna Maria no mesmo dia,
  com Laurent testemunhando o ato da cunhada [PROVEN — PAR-0060].

  - **Filhos:** doze segundo a narrativa do banco de dados da Casa Suíça, "ao menos onze"
  segundo o texto principal da compilação — discrepância preservada, não resolvida [PUB-0003].
  Dez filhos colaterais estão catalogados em F-0033 (José, duas Anna Marias, José Lourenço,
  Justina, José Constantino, Barbara Elisabeth, Regina, Maria, Thereza); o filho modelado é
  **Vicente Borer** (P-0070, n. 6 de setembro de 1828, batizado em 13 de outubro de 1828 —
  PAR-0061), listado como sexto filho, por quem a linha continua.

  - **Um segundo laço Borer–Wehrli:** um blog que este repositório não retém acrescenta que o
  irmão de Laurent, Johann Borer, casou-se com a irmã de Anna Maria, Catherine Wehrli —
  alegado casamento duplo entre irmãos [LEAD].

  - **Distinto de BORER I:** Laurent (Grindel, Casa 73 / Lote 86) não é Jacob Bohrer (P-0050,
  Beinwil/Erschwil, Casa 70 / Lote 56); a compilação afirma "não há evidência de parentesco
  próximo entre os dois grupos", e os dois registros de casamento nomeiam pais diferentes, de
  aldeias diferentes [PROVEN que os pais diferem].

  ## O que podemos extrapolar

  - **Posição adquirida: nada herdado, nada conquistado por cargo — uma concessão e um
  casamento [INFERRED].** Laurent não trouxe de Grindel terra, capital nem título e, se o pai
  morreu em 1817, tampouco trouxe pais [LEAD]. Duas coisas lhe deram posição em Nova Friburgo:
  um lote entregue por um decreto de colonização e um casamento com um domicílio já assentado.
  Isso é posição "obtida por casamento", mas convém ser preciso quanto ao que ele desposou —
  **não** capital. Os Wehrli detinham o mesmo pacote estatal que ele; o que forneceram foi
  trabalho, parentela e um lugar na ordem social da colônia. Ao lado da linha Armond da
  família, em que casar-se para dentro significou casar-se com terra Toledo e trabalho
  escravizado, o contraste é exato: deste lado, o casamento comprou pertencimento, não
  propriedade.

  - **Mecânica da riqueza: um subsídio de dois anos e um lote pobre — contingente e depois
  esgotado [CONTEXTUAL — baseado no papel].** O pacote colonial foi concebido como ponte, não
  como dotação: expirava, e o que restava era a própria terra. Os lotes eram pequenos,
  íngremes e pedregosos, as ferramentas e o apoio insuficientes, e o desfecho documentado em
  toda a colônia foi que muitos colonos abandonaram as glebas em poucos anos. Logo, seu único
  ativo durável era também o mais fraco. Nenhuma renda de cargo, comércio ou crédito aparece
  em parte alguma de seu registro — um domicílio vivendo do que conseguisse desbravar.

  - **A herança partível, dos dois lados do oceano, é a espinha estrutural de sua vida
  [CONTEXTUAL].** Ela o empurrou para fora de Grindel, onde as posses do Jura eram divididas
  entre herdeiros até os quinhões não alimentarem um domicílio; e limitou tudo depois dele,
  porque a sucessão brasileira também dividia os espólios igualmente entre todos os filhos.
  Com onze ou doze filhos, um lote serrano subdimensionado se fragmenta a nada num único
  passo. Laurent é o ponto desta árvore em que o mesmo mecanismo jurídico aparece a um só
  tempo como causa de uma migração e como causa de o resultado dessa migração não se acumular.

  - **Educação: o único ativo importado — e este é o ramo que o perdeu [CONTEXTUAL / INFERRED
  — a divergência-chave].** Os colonos de Solothurn chegaram com alfabetização de escola
  paroquial católica em alemão, que o Brasil não fornecia: a escolarização oitocentista era
  privilégio comprado e ligado à classe, sem alternativa rural gratuita, e portanto tinha de
  ser recomprada a cada geração. No ramo paralelo de Beinwil/Erschwil ela foi: o filho de
  Jacob Bohrer, Francisco José, **assinou** o próprio testamento de 1888, e os filhos dele
  chegaram ao comércio, a cargo local e a um jornal. No ramo de Laurent, não. Seu neto
  Valentim Martinho Bohrer precisou registrar o nascimento da filha, em 1891, "a rogo do
  declarante **por não saber escrever**" (CIV-0045) — e o mesmo ato o chama, e à esposa, de
  *lavradores*. Três gerações de uma coorte suíça alfabetizada em escola paroquial a um
  domicílio agrícola brasileiro analfabeto: o caso documentado mais claro, nesta árvore, de a
  educação comportar-se como propriedade, mantida apenas onde havia dinheiro para renová-la.

  - **O efeito da migração sobre a classe — e depois uma segunda migração, mais silenciosa
  [INFERRED].** A travessia de 1819 foi lateral: de camponês do Jura pobre em terra a colono
  pobre em terra, com o ganho sendo o título, não a qualidade. A mudança consequente é a que
  seus filhos fizeram. O ramo não permanece na Casa 73 / Lote 86: o primogênito de seu filho
  Vicente nasce em **São José do Ribeirão**, seu neto José Maria Bocher casa-se em 1913 em
  Maravilhas, **Barra Alegre (Bom Jardim)**, descrito como *lavrador* (CIV-0048), e a pista da
  árvore FS põe o próprio óbito de Laurent em São José do Ribeirão. É o padrão documentado de
  fracasso da colônia se desenrolando numa família: o lote não podia sustentar doze herdeiros,
  e os filhos saíram como mão de obra agrícola pelas serras fluminenses vizinhas.

  - **O arco, nomeado, com seus pontos de virada [INFERRED].** Filho de pequeno lavrador de
  Grindel, sem nada a herdar (pré-1819) → **virada 1: o decreto de 1819**, que converte a
  falta de terra num lote colonial pobre → **virada 2: o casamento de 1820**, que compra
  parentela e posição, mas não capital → **virada 3: doze herdeiros**, que garante que o lote
  não possa descer inteiro → **virada 4: a saída do lote** rumo a São José do Ribeirão e Bom
  Jardim como *lavradores*, com a alfabetização perdida no caminho. Plano, e depois plano de
  novo; nenhuma fortuna foi construída, então nenhuma foi perdida. Seu tronco só sobe muito
  depois, e alhures, quando um descendente deixa a terra esgotada pela economia salarial
  urbana do século XX. Que sua linha e a linha Borer de Beinwil/Erschwil — mesmo navio, mesmo
  ano, mesmo sobrenome — tenham produzido, na mesma geração, um *lavrador* analfabeto e um
  testador que assina o próprio testamento é a comparação interna mais aguda que esta árvore
  oferece: a variável não foi a origem, e sim se um ramo alcançou o comércio urbano ou
  permaneceu em terra que se fragmentava.

