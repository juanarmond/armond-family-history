profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** His emigration in 1819 was driven partly by the aftermath of the 1816 "Year Without a Summer" — crop failures across Switzerland following the 1815 Mount Tambora eruption made the Solothurn Jura desperate enough to emigrate, and Dom João VI's Swiss colonisation scheme provided the vehicle.

  - **[PROVEN]** He married Anna Maria Werhly on 3 July 1820 at Nova Friburgo — the held parish register (PAR-0060) names his father "Jacobo Borer, natural de Grindel, no cantão de Soleure," settling his paternal lineage and distinguishing the BORER II line from the BORER I line.

  - **[INFERRED]** He apparently arrived in Brazil without his parents' household, then married into the already-settled Wehrli family — the structural opposite of the Wehrli clan emigration: a single young man attaching himself to a family group that could provide the social network a lone colonist would otherwise lack.

  - **[CONTEXTUAL]** The standard settlement package under the Decreto de 16 de maio de 1818 gave colonists a land lot and house plus a daily subsidy falling to a bare minimum over two years — a deliberately lean subsistence floor that left no margin for investment, and ensured that a large family like his would always farm for survival rather than surplus.

  - **[INFERRED]** With approximately 12 children, Laurent is the arithmetic engine of the family's permanent land-poverty: Brazilian partible succession split the already-poor colony lot approximately 12 ways, and each generation split it further — no Borer branch ever accumulated an estate from this start.

  - **[CONTEXTUAL]** Laurent's BORER II line (Grindel, house 73 / lot 86) and Jacob Borer's BORER I line (Erschwil, house 70/56) were co-passengers on the Heureux Voyage but are documented as distinct families — a critical disambiguation since the two Solothurn Borer lines later converged in the single surname "Bohrer."

  ## Identity

  **Laurent Borer** (Germanised *Lorenz Borer*; the family name later drifts to
  **Bohrer** in his Brazilian descendants) [PUB-0003]. The immigrant founder of the
  Borer/Bohrer trunk in Brazil.

  - **Birth:** 27 February 1797, Grindel, Soleure (Solothurn), Switzerland (PUB-0003,
  strong-evidence; E-0060). A competing "27 July 1797" appears only in blogs our
  repository does not hold; the held compilation reads February. [LEAD for July]

  - **Father:** **Jacob Borer of Grindel** (P-0100; parentage family F-0049), named
  "Jacobo Borer, natural de Grindel, no cantão de Soleure" in Laurent's own 1820 Nova
  Friburgo marriage register [PROVEN — PAR-0060]. He is a distinct person from the other
  immigrant Jacob Bohrer of Erschwil (P-0050) — do not conflate the two Solothurn Borer
  lines. His mother is not named in that record [OPEN]; a FamilySearch collaborative tree
  (node L7BW-11L) gives his parents as Jakob Borer (1752–1817) × Maria Anna Heggendorn
  (1755–1829) — consistent with the sourced father but resting only on the tree for the
  mother, a navigation lead, never evidence [LEAD].

  - **Emigration:** arrived Nova Friburgo, Rio de Janeiro, in 1819 aboard the *Heureux
  Voyage*, occupying Casa 73 / Lote 86 — the same house-and-lot as the Wehrli patriarch
  household he married into (PUB-0003). A Nova Friburgo colonist settler register (GOV-0007,
  a corroborative record image) lists him among the arriving families as "Laurent Bocher,
  [18]" — the roster age (→ ~1802) sits ~5 years off his sourced February 1797 birth and is
  a preserved discrepancy, not adopted.

  - **Marriage:** married Anna Maria Werhly (P-0069) on 3 July 1820 at São João Baptista,
  Nova Friburgo [PROVEN — PAR-0060, event E-0061] — the held parish marriage register, which
  also names both spouses' fathers.

  - **Death:** no death record held [OPEN]; the compilation and Casa Suíça database agree
  he probably lived out his life in the vale do Macaé (Nova Friburgo municipal area),
  while a FamilySearch collaborative tree (node L7BW-11L) places his death on 15 December
  1880 at São José do Ribeirão (a district of Bom Jardim, RJ, immediately north of Nova
  Friburgo), aged 83 — more precise than, and consistent with, the "Macaé valley" guess,
  but a collaborative-tree lead only [LEAD].

  ## Standing and profession

  - A **founding colonist of the 1819 Swiss cohort** at Nova Friburgo; Catholic,
  German-speaking. No profession is recorded ("desconhecida" in the Casa Suíça
  database). [PUB-0003]

  - He **apparently emigrated alone** ("veio aparentemente só para o Brasil"), then
  married into the already-settled Wehrli family — unlike the Wehrlis, who came as a
  whole clan. [PUB-0003]

  ## Family and social network

  - **Wife:** Anna Maria Werhly (P-0069, F-0033), a daughter of the Wehrli patriarch
  couple Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Because her mother
  was herself a Borer, the compiler flags Anna Maria as a probable cousin of Laurent — a
  suggestion, not evidence. [LEAD]

  - **Children:** the couple had **twelve children per the Casa Suíça database narrative
  but "at least eleven" per the compilation's main text** — a one-child discrepancy this
  repository preserves rather than resolves [PUB-0003]. Ten collateral children are
  catalogued on F-0033 (José, two Anna Marias, José Lourenço, Justina, José Constantino,
  Barbara Elisabeth, Regina, Maria, Thereza); the modelled child is Vicente Borer
  (P-0070), listed as the sixth son, through whom the line continues.

  - A blog our repository does not hold adds that Laurent's brother Johann Borer married
  Anna Maria's sister Catherine Wehrli — a claimed double sibling-marriage. [LEAD]

  - **Distinct from BORER I:** Laurent (BORER II, of Grindel, Casa 73/Lote 86) is a
  different immigrant from Jacob Borer (P-0050, BORER I, of Erschwil, Casa 70/56); they
  were co-passengers on the *Heureux Voyage* but the compilation states "não há
  evidência de parentesco próximo entre os dois grupos." Do not conflate the two Borer
  lines. [PUB-0003]

  ## What we can extrapolate

  - **Surname drift [INFERRED]:** his descendants carry the surname as **Bohrer**
  (Valentim Martinho Bohrer, P-0028; Iris Bohrer, P-0007), the orthographic route by
  which the family name reached its modern form. It must not be conflated with the
  unrelated Jura "Bohrer".

  - **Regularised union [INFERRED]:** the 1820 wedding reads as the formalisation of a
  pre-existing colonist union — the same pattern his son Vicente repeated (a firstborn
  preceding the marriage by three weeks).

  - **The founding node of the whole Borer/Bohrer arc — and its fragmentation engine
  [INFERRED / CONTEXTUAL].** Laurent is the immigrant who converted Jura land-hunger into
  a poor Nova Friburgo colony lot (Casa 73 / Lote 86) — the bottom-but-landed rung the
  whole family trajectory begins from. He apparently arrived with no capital and married
  *into* the already-settled Wehrli household. His ~12 children then make him the
  arithmetic engine of the family's permanent land-poverty: Brazilian partible succession
  (equal division among all heirs) splits one poor serra lot ~12 ways, and each share
  again — so no Borer branch ever compounds land into an estate. It is the structural
  inverse of the family's Armond line, which began from an office-and-marriage elite and
  fell: here there was no inherited fortune to lose, because the line began with none.

  - **The colono's economics — a state package, not a wage [CONTEXTUAL — role-based].** As
  a founding colonist he received the colony's standard settlement package under the
  *Decreto de 16 de maio de 1818*: a land lot and built house, a daily cash subsidy of
  0$160/day in year one falling to 0$080/day over a two-year establishment period, plus
  rations, seed and livestock. The first-year subsidy annualises to only about 58$000 —
  roughly one-seventh of a free rural labourer's ~420$000/year wage: a deliberately bare
  subsistence floor on a stony, undersized serra lot, not a wage or heritable capital.

  ## Open questions

  - His own **Grindel Catholic baptism (~1797)** — FamilySearch-indexed but FHC-restricted
  — would name his **mother** (his father Jacob Borer of Grindel is now held, PAR-0060) and
  settle the February-vs-July 1797 date. [OPEN]

  - His **death** (vale do Macaé, undated) and his **children's baptisms** (Nova Friburgo
  parish books, reportedly not on FamilySearch). [OPEN]

  ## Sources held (this repository)

  - PAR-0060 (his own 1820 Nova Friburgo parish marriage to Anna Maria Wehrli — the primary
  record confirming the marriage and naming his father Jacob Borer of Grindel, P-0100).

  - PUB-0003 (Henrique Bon, *Imigrantes de Nova Friburgo* — BORER II section, pp.300–301,
  and the Casa Suíça database) — the record-citing secondary compilation underlying his
  dates, house/lot, marriage and children.

  - GOV-0007 (a Nova Friburgo colonist settler register image, Fundação D. João VI via the
  Raibert blog) — corroborative; lists him among the Heureux Voyage arrivals ("Laurent
  Bocher, [18]"), with a preserved roster-age discrepancy.

  ## Regional and migration context

  Grindel lay in the Catholic, German-speaking Solothurn Jura (Schwarzbubenland), poor,
  land-hungry subsistence-farming country. [CONTEXTUAL] His emigration (~1818–19) fits
  the post-Napoleonic distress and the 1816 "Year Without a Summer" famine that fed Dom
  João VI's 1819 Swiss colonisation of Nova Friburgo; he was allotted a poor, stony serra
  lot, and his branch stayed on rural Macaé-valley land rather than in the town.
  [CONTEXTUAL]

  ## Where to go today

  - **Birth (27 Feb 1797):** Kath. Pfarrkirche St. Stephan, Grindel, Kt. Solothurn, Switzerland (4247 Grindel) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Marriage to Anna Maria Wehrli (3 Jul 1820):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (15 Dec 1880, per FS-tree lead):** Igreja Matriz de São José, São José do Ribeirão (Bom Jardim, RJ) [APPROX] · [Maps](https://maps.google.com/?q=-22.205,-42.3981)
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** A sua emigração em 1819 foi impulsionada em parte pelas consequências do "Ano Sem Verão" de 1816 — as falhas de colheita em toda a Suíça na sequência da erupção do Monte Tambora em 1815 tornaram o Jura de Solothurn suficientemente desesperado para emigrar, e o esquema de colonização suíça de Dom João VI forneceu o veículo.

  - **[PROVEN]** Casou com Anna Maria Werhly em 3 de Julho de 1820 em Nova Friburgo — o registo paroquial comprovado (PAR-0060) nomeia o seu pai "Jacobo Borer, natural de Grindel, no cantão de Soleure", fixando a sua linhagem paterna e distinguindo a linha BORER II da linha BORER I.

  - **[INFERRED]** Aparentemente chegou ao Brasil sem o agregado familiar dos pais e depois casou na família Wehrli já estabelecida — o oposto estrutural da emigração do clã Wehrli: um jovem solteiro que se anexou a um grupo familiar que podia fornecer a rede social que um colono isolado de outra forma não teria.

  - **[CONTEXTUAL]** O pacote de assentamento padrão ao abrigo do Decreto de 16 de Maio de 1818 dava aos colonos um lote de terra e casa mais um subsídio diário que descia ao mínimo ao longo de dois anos — um patamar de subsistência deliberadamente magro que não deixava margem para investimento, e garantia que uma família numerosa como a sua sempre cultivaria para a sobrevivência e não para o excedente.

  - **[INFERRED]** Com aproximadamente 12 filhos, Laurent é o motor aritmético da pobreza fundiária permanente da família: a sucessão partilhável brasileira dividiu o lote colonial já pobre em cerca de 12 partes, e cada geração voltou a dividir — nenhum ramo Borer alguma vez acumulou um espólio a partir deste ponto de partida.

  - **[CONTEXTUAL]** A linha BORER II de Laurent (Grindel, casa 73 / lote 86) e a linha BORER I de Jacob Borer (Erschwil, casa 70/56) eram co-passageiros no Heureux Voyage mas são documentados como famílias distintas — uma disambiguação crítica, uma vez que as duas linhas Borer de Solothurn mais tarde convergiram no único apelido "Bohrer".

  ## Identidade

  **Laurent Borer** (germanizado *Lorenz Borer*; o sobrenome deriva depois para
  **Bohrer** em seus descendentes brasileiros) [PUB-0003]. O fundador imigrante do tronco
  Borer/Bohrer no Brasil.

  - **Nascimento:** 27 de fevereiro de 1797, Grindel, Soleure (Solothurn), Suíça
  (PUB-0003, evidência forte; E-0060). Um concorrente "27 de julho de 1797" aparece
  apenas em blogs que nosso repositório não possui; a compilação em mãos diz fevereiro.
  [LEAD para julho]

  - **Pai:** **Jacob Borer de Grindel** (P-0100; família parental F-0049), nomeado "Jacobo
  Borer, natural de Grindel, no cantão de Soleure" no próprio registro de casamento de 1820
  de Laurent, em Nova Friburgo [PROVEN — PAR-0060]. É pessoa distinta do outro imigrante
  Jacob Bohrer de Erschwil (P-0050) — não confundir as duas linhas Borer de Solothurn. Sua
  mãe não é nomeada nesse registro [OPEN]; uma árvore colaborativa do FamilySearch (nó
  L7BW-11L) dá seus pais como Jakob Borer (1752–1817) × Maria Anna Heggendorn (1755–1829) —
  consistente com o pai fontado, mas baseada apenas na árvore quanto à mãe, uma pista de
  navegação, nunca evidência [LEAD].

  - **Emigração:** chegou a Nova Friburgo, Rio de Janeiro, em 1819 no *Heureux Voyage*,
  ocupando a Casa 73 / Lote 86 — a mesma casa e lote da família patriarcal Wehrli na qual
  se casou (PUB-0003). Um registro de colonos de Nova Friburgo (GOV-0007, imagem de registro
  corroborativa) o lista entre as famílias que chegavam como "Laurent Bocher, [18]" — a idade
  do rol (→ ~1802) fica ~5 anos distante de seu nascimento fontado em fevereiro de 1797 e é
  uma discrepância preservada, não adotada.

  - **Casamento:** casou-se com Anna Maria Werhly (P-0069) em 3 de julho de 1820 em São
  João Baptista, Nova Friburgo [PROVEN — PAR-0060, evento E-0061] — o registro paroquial de
  casamento em mãos, que também nomeia os pais de ambos os cônjuges.

  - **Óbito:** nenhum registro de óbito em mãos [OPEN]; a compilação e o banco de dados da
  Casa Suíça concordam que provavelmente viveu o resto da vida no vale do Macaé (área
  municipal de Nova Friburgo), enquanto uma árvore colaborativa do FamilySearch (nó
  L7BW-11L) situa seu óbito em 15 de dezembro de 1880 em São José do Ribeirão (distrito de
  Bom Jardim, RJ, imediatamente ao norte de Nova Friburgo), aos 83 anos — mais preciso
  que, e consistente com, o palpite do "vale do Macaé", mas apenas uma pista de árvore
  colaborativa [LEAD].

  ## Posição social e profissão

  - Um **colono fundador do contingente suíço de 1819** em Nova Friburgo; católico,
  falante de alemão. Nenhuma profissão registrada ("desconhecida" no banco de dados da
  Casa Suíça). [PUB-0003]

  - **Aparentemente emigrou sozinho** ("veio aparentemente só para o Brasil"), casando-se
  depois com a família Wehrli já estabelecida — ao contrário dos Wehrli, que vieram como
  clã inteiro. [PUB-0003]

  ## Família e rede social

  - **Esposa:** Anna Maria Werhly (P-0069, F-0033), filha do casal patriarcal Wehrli
  Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Como a mãe dela era ela mesma
  uma Borer, o compilador aponta Anna Maria como provável prima de Laurent — uma
  sugestão, não evidência. [LEAD]

  - **Filhos:** o casal teve **doze filhos conforme a narrativa do banco de dados da Casa
  Suíça, mas "ao menos onze" conforme o texto principal da compilação** — uma
  discrepância de um filho que este repositório preserva em vez de resolver [PUB-0003].
  Dez filhos colaterais estão catalogados em F-0033 (José, duas Anna Marias, José
  Lourenço, Justina, José Constantino, Barbara Elisabeth, Regina, Maria, Thereza); o
  filho modelado é Vicente Borer (P-0070), listado como o sexto filho homem, por quem a
  linha continua.

  - Um blog que nosso repositório não possui acrescenta que o irmão de Laurent, Johann
  Borer, casou-se com a irmã de Anna Maria, Catherine Wehrli — um alegado casamento duplo
  de irmãos. [LEAD]

  - **Distinto de BORER I:** Laurent (BORER II, de Grindel, Casa 73/Lote 86) é um
  imigrante diferente de Jacob Borer (P-0050, BORER I, de Erschwil, Casa 70/56); foram
  companheiros de viagem no *Heureux Voyage*, mas a compilação afirma "não há evidência de
  parentesco próximo entre os dois grupos." Não confundir as duas linhas Borer.
  [PUB-0003]

  ## O que podemos extrapolar

  - **Deriva do sobrenome [INFERRED]:** seus descendentes usam o sobrenome como
  **Bohrer** (Valentim Martinho Bohrer, P-0028; Iris Bohrer, P-0007), o caminho
  ortográfico pelo qual o nome de família chegou à sua forma moderna. Não deve ser
  confundido com os "Bohrer" não aparentados do Jura.

  - **União regularizada [INFERRED]:** o casamento de 1820 se lê como a formalização de
  uma união colona pré-existente — o mesmo padrão que seu filho Vicente repetiu (um
  primogênito precedendo o casamento em três semanas).

  - **O nó fundador de todo o arco Borer/Bohrer — e seu motor de fragmentação [INFERRED /
  CONTEXTUAL].** Laurent é o imigrante que converteu a escassez de terra do Jura em um
  pobre lote de colônia em Nova Friburgo (Casa 73 / Lote 86) — o degrau
  "no-fundo-mas-com-terra" de onde toda a trajetória da família parte. Aparentemente
  chegou sem capital e casou-se *dentro* do domicílio Wehrli já estabelecido. Seus ~12
  filhos fazem dele o motor aritmético da pobreza fundiária permanente da família: a
  sucessão partível brasileira (partilha igual entre todos os herdeiros) divide um pobre
  lote de serra ~12 vezes, e cada quinhão novamente — de modo que nenhum ramo Borer jamais
  acumula terra em um patrimônio. É o inverso estrutural da linha Armond da família, que
  partiu de uma elite de ofício e casamento e caiu: aqui não havia fortuna herdada a
  perder, porque a linha começou sem nenhuma.

  - **A economia do colono — um pacote do Estado, não um salário [CONTEXTUAL — baseado no
  papel].** Como colono fundador, recebeu o pacote padrão de assentamento da colônia sob o
  *Decreto de 16 de maio de 1818*: um lote de terra e casa construída, um subsídio diário
  em dinheiro de 0$160/dia no primeiro ano caindo para 0$080/dia ao longo de um período de
  estabelecimento de dois anos, além de rações, sementes e gado. O subsídio do primeiro
  ano anualiza para apenas cerca de 58$000 — cerca de um sétimo do salário de ~420$000/ano
  de um trabalhador rural livre: um piso de subsistência deliberadamente magro em um lote
  de serra pedregoso e subdimensionado, não um salário ou capital hereditário.

  ## Questões em aberto

  - Seu próprio **batismo católico em Grindel (~1797)** — indexado no FamilySearch, mas de
  acesso restrito a FHC — nomearia sua **mãe** (seu pai Jacob Borer de Grindel já está em
  mãos, PAR-0060) e resolveria a data fevereiro-vs-julho de 1797. [OPEN]

  - Seu **óbito** (vale do Macaé, sem data) e os **batismos dos filhos** (livros paroquiais
  de Nova Friburgo, ao que se relata fora do FamilySearch). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0060 (seu próprio casamento paroquial de 1820 em Nova Friburgo com Anna Maria Wehrli
  — o registro primário que confirma o casamento e nomeia seu pai Jacob Borer de Grindel,
  P-0100).

  - PUB-0003 (Henrique Bon, *Imigrantes de Nova Friburgo* — seção BORER II, pp.300–301, e
  o banco de dados da Casa Suíça) — a compilação secundária que cita registros e embasa
  suas datas, casa/lote, casamento e filhos.

  - GOV-0007 (imagem de um registro de colonos de Nova Friburgo, Fundação D. João VI via
  o blog Raibert) — corroborativa; lista-o entre os chegados do Heureux Voyage ("Laurent
  Bocher, [18]"), com uma discrepância de idade do rol preservada.

  ## Contexto regional e migratório

  Grindel ficava no Jura católico e germanófono de Solothurn (Schwarzbubenland), terra
  pobre de agricultura de subsistência e escassez de terra. [CONTEXTUAL] Sua emigração
  (~1818–19) enquadra-se na penúria pós-napoleônica e na fome do "Ano Sem Verão" de 1816
  que alimentou a colonização suíça de Nova Friburgo por Dom João VI em 1819; recebeu um
  lote pobre e pedregoso na serra, e seu ramo permaneceu em terra rural do vale do Macaé,
  não na vila. [CONTEXTUAL]

