  ## Contexto regional e migratório

  Grindel ficava no Bezirk Thierstein, Cantão de Solothurn, no planalto católico e germanófono
  do Jura chamado Schwarzbubenland: pobre, pequeno e limitado em terra, com posses divididas
  entre herdeiros até a emigração ser a única saída. [CONTEXTUAL] O empurrão foi a erupção do
  Tambora em 1815 e a fome do "Ano Sem Verão" de 1816 caindo sobre a pobreza pós-napoleônica;
  a atração foi o *Decreto de 16 de maio de 1818* de Dom João VI, que contratou o agente
  friburguês S.-N. Gachet para assentar 100 famílias suíças **católicas** na Fazenda do Morro
  Queimado — serra escolhida por assemelhar-se à Suíça, e a única cidade brasileira fundada
  por decreto real. O recrutamento excedeu para cerca de 261–265 famílias (aproximadamente
  1.700–2.000 pessoas) vindas de Friburgo, Solothurn, Valais, Berna e áreas germanófonas
  vizinhas, e cerca de um quarto morreu no mar de tifo e escorbuto; o primeiro navio chegou ao
  Rio em 4 de novembro de 1819 e a Vila de Nova Friburgo foi elevada em 3 de janeiro de 1820.
  [CONTEXTUAL] O que os sobreviventes receberam ficou aquém do prometido — lotes de montanha
  pobres e pedregosos, glebas pequenas, ferramentas e apoio insuficientes — e muitos colonos
  deixaram suas glebas em poucos anos em busca de terra melhor nas serras fluminenses. O ramo
  de Laurent seguiu exatamente esse padrão, permanecendo em terra rural do vale do Macaé e de
  São José do Ribeirão, e não na vila.

