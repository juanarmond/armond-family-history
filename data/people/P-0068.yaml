profile: >-
  ## Identity

  **Laurent Borer** (Germanised *Lorenz Borer*; the family name later drifts to
  **Bohrer** in his Brazilian descendants) [PUB-0003]. The immigrant founder of the
  Borer/Bohrer trunk in Brazil.

  - **Birth:** 27 February 1797, Grindel, Soleure (Solothurn), Switzerland (PUB-0003,
  strong-evidence; E-0060). A competing "27 July 1797" appears only in blogs our
  repository does not hold; the held compilation reads February. [LEAD for July]

  - **Father:** named by the compiler as "*certo* Jacob Borer, de Grindel, Soleure" —
  the qualifier "certo" is the compiler's own hedge, and no parent family is modelled
  here. A Grindel register entry for a "Joannes Borer × Ana Maria Werli" (daughter
  baptised 1782) is a strong lead for his parentage but is not confirmed as the same man
  [LEAD]. Mother unnamed in any held source [OPEN].

  - **Emigration:** arrived Nova Friburgo, Rio de Janeiro, in 1819 aboard the *Heureux
  Voyage*, occupying Casa 73 / Lote 86 — the same house-and-lot as the Wehrli patriarch
  household he married into (PUB-0003).

  - **Marriage:** married Anna Maria Werhly (P-0069) on 3 July 1820 at Nova Friburgo
  (PUB-0003, strong-evidence; E-0061).

  - **Death:** unknown; the compilation and Casa Suíça database agree he probably lived
  out his life in the vale do Macaé (Nova Friburgo municipal area). No death record
  held. [OPEN]

  ## Standing and profession

  - A **founding colonist of the 1819 Swiss cohort** at Nova Friburgo; Catholic,
  German-speaking. No profession is recorded ("desconhecida" in the Casa Suíça
  database). [PUB-0003]

  - He **apparently emigrated alone** ("veio aparentemente só para o Brasil"), then
  married into the already-settled Wehrli family — unlike the Wehrlis, who came as a
  whole clan. [PUB-0003]

  ## Family and social network

  - **Wife:** Anna Maria Werhly (P-0069, F-0033), a daughter of the Wehrli patriarch
  couple Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Because her mother
  was herself a Borer, the compiler flags Anna Maria as a probable cousin of Laurent — a
  suggestion, not evidence. [LEAD]

  - **Children:** the couple had **twelve children per the Casa Suíça database narrative
  but "at least eleven" per the compilation's main text** — a one-child discrepancy this
  repository preserves rather than resolves [PUB-0003]. Ten collateral children are
  catalogued on F-0033 (José, two Anna Marias, José Lourenço, Justina, José Constantino,
  Barbara Elisabeth, Regina, Maria, Thereza); the modelled child is Vicente Borer
  (P-0070), listed as the sixth son, through whom the line continues.

  - A blog our repository does not hold adds that Laurent's brother Johann Borer married
  Anna Maria's sister Catherine Wehrli — a claimed double sibling-marriage. [LEAD]

  - **Distinct from BORER I:** Laurent (BORER II, of Grindel, Casa 73/Lote 86) is a
  different immigrant from Jacob Borer (P-0050, BORER I, of Erschwil, Casa 70/56); they
  were co-passengers on the *Heureux Voyage* but the compilation states "não há
  evidência de parentesco próximo entre os dois grupos." Do not conflate the two Borer
  lines. [PUB-0003]

  ## What we can extrapolate

  - **Surname drift [INFERRED]:** his descendants carry the surname as **Bohrer**
  (Valentim Martinho Bohrer, P-0028; Iris Bohrer, P-0007), the orthographic route by
  which the family name reached its modern form. It must not be conflated with the
  unrelated Jura "Bohrer".

  - **Regularised union [INFERRED]:** the 1820 wedding reads as the formalisation of a
  pre-existing colonist union — the same pattern his son Vicente repeated (a firstborn
  preceding the marriage by three weeks).

  ## Open questions

  - His own **Grindel Catholic baptism (~1797)** — FamilySearch-indexed but
  FHC-restricted — would name his parents and settle the February-vs-July 1797 date, and
  test whether he was kin to the other immigrant Jacob Borer. [OPEN]

  - His **death** (vale do Macaé, undated) and his **1820 Nova Friburgo marriage and
  children's baptisms** (Nova Friburgo parish books, reportedly not on FamilySearch).
  [OPEN]

  ## Sources held (this repository)

  - PUB-0003 (Henrique Bon, *Imigrantes de Nova Friburgo* — BORER II section, pp.300–301,
  and the Casa Suíça database) — the record-citing secondary compilation underlying his
  dates, house/lot, marriage and children.

  ## Regional and migration context

  Grindel lay in the Catholic, German-speaking Solothurn Jura (Schwarzbubenland), poor,
  land-hungry subsistence-farming country. [CONTEXTUAL] His emigration (~1818–19) fits
  the post-Napoleonic distress and the 1816 "Year Without a Summer" famine that fed Dom
  João VI's 1819 Swiss colonisation of Nova Friburgo; he was allotted a poor, stony serra
  lot, and his branch stayed on rural Macaé-valley land rather than in the town.
  [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Laurent Borer** (germanizado *Lorenz Borer*; o sobrenome deriva depois para
  **Bohrer** em seus descendentes brasileiros) [PUB-0003]. O fundador imigrante do tronco
  Borer/Bohrer no Brasil.

  - **Nascimento:** 27 de fevereiro de 1797, Grindel, Soleure (Solothurn), Suíça
  (PUB-0003, evidência forte; E-0060). Um concorrente "27 de julho de 1797" aparece
  apenas em blogs que nosso repositório não possui; a compilação em mãos diz fevereiro.
  [LEAD para julho]

  - **Pai:** nomeado pelo compilador como "*certo* Jacob Borer, de Grindel, Soleure" — o
  qualificador "certo" é a própria ressalva do compilador, e nenhuma família de pais está
  modelada aqui. Uma entrada do registro de Grindel de um "Joannes Borer × Ana Maria
  Werli" (filha batizada em 1782) é uma pista forte para sua filiação, mas não está
  confirmada como o mesmo homem [LEAD]. A mãe não é nomeada em nenhuma fonte em mãos
  [OPEN].

  - **Emigração:** chegou a Nova Friburgo, Rio de Janeiro, em 1819 no *Heureux Voyage*,
  ocupando a Casa 73 / Lote 86 — a mesma casa e lote da família patriarcal Wehrli na qual
  se casou (PUB-0003).

  - **Casamento:** casou-se com Anna Maria Werhly (P-0069) em 3 de julho de 1820 em Nova
  Friburgo (PUB-0003, evidência forte; E-0061).

  - **Óbito:** desconhecido; a compilação e o banco de dados da Casa Suíça concordam que
  provavelmente viveu o resto da vida no vale do Macaé (área municipal de Nova Friburgo).
  Nenhum registro de óbito em mãos. [OPEN]

  ## Posição social e profissão

  - Um **colono fundador do contingente suíço de 1819** em Nova Friburgo; católico,
  falante de alemão. Nenhuma profissão registrada ("desconhecida" no banco de dados da
  Casa Suíça). [PUB-0003]

  - **Aparentemente emigrou sozinho** ("veio aparentemente só para o Brasil"), casando-se
  depois com a família Wehrli já estabelecida — ao contrário dos Wehrli, que vieram como
  clã inteiro. [PUB-0003]

  ## Família e rede social

  - **Esposa:** Anna Maria Werhly (P-0069, F-0033), filha do casal patriarcal Wehrli
  Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073). Como a mãe dela era ela mesma
  uma Borer, o compilador aponta Anna Maria como provável prima de Laurent — uma
  sugestão, não evidência. [LEAD]

  - **Filhos:** o casal teve **doze filhos conforme a narrativa do banco de dados da Casa
  Suíça, mas "ao menos onze" conforme o texto principal da compilação** — uma
  discrepância de um filho que este repositório preserva em vez de resolver [PUB-0003].
  Dez filhos colaterais estão catalogados em F-0033 (José, duas Anna Marias, José
  Lourenço, Justina, José Constantino, Barbara Elisabeth, Regina, Maria, Thereza); o
  filho modelado é Vicente Borer (P-0070), listado como o sexto filho homem, por quem a
  linha continua.

  - Um blog que nosso repositório não possui acrescenta que o irmão de Laurent, Johann
  Borer, casou-se com a irmã de Anna Maria, Catherine Wehrli — um alegado casamento duplo
  de irmãos. [LEAD]

  - **Distinto de BORER I:** Laurent (BORER II, de Grindel, Casa 73/Lote 86) é um
  imigrante diferente de Jacob Borer (P-0050, BORER I, de Erschwil, Casa 70/56); foram
  companheiros de viagem no *Heureux Voyage*, mas a compilação afirma "não há evidência de
  parentesco próximo entre os dois grupos." Não confundir as duas linhas Borer.
  [PUB-0003]

  ## O que podemos extrapolar

  - **Deriva do sobrenome [INFERRED]:** seus descendentes usam o sobrenome como
  **Bohrer** (Valentim Martinho Bohrer, P-0028; Iris Bohrer, P-0007), o caminho
  ortográfico pelo qual o nome de família chegou à sua forma moderna. Não deve ser
  confundido com os "Bohrer" não aparentados do Jura.

  - **União regularizada [INFERRED]:** o casamento de 1820 se lê como a formalização de
  uma união colona pré-existente — o mesmo padrão que seu filho Vicente repetiu (um
  primogênito precedendo o casamento em três semanas).

  ## Questões em aberto

  - Seu próprio **batismo católico em Grindel (~1797)** — indexado no FamilySearch, mas
  de acesso restrito a FHC — nomearia seus pais e resolveria a data fevereiro-vs-julho de
  1797, além de testar se era parente do outro imigrante Jacob Borer. [OPEN]

  - Seu **óbito** (vale do Macaé, sem data) e seu **casamento de 1820 em Nova Friburgo e
  os batismos dos filhos** (livros paroquiais de Nova Friburgo, ao que se relata fora do
  FamilySearch). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PUB-0003 (Henrique Bon, *Imigrantes de Nova Friburgo* — seção BORER II, pp.300–301, e
  o banco de dados da Casa Suíça) — a compilação secundária que cita registros e embasa
  suas datas, casa/lote, casamento e filhos.

  ## Contexto regional e migratório

  Grindel ficava no Jura católico e germanófono de Solothurn (Schwarzbubenland), terra
  pobre de agricultura de subsistência e escassez de terra. [CONTEXTUAL] Sua emigração
  (~1818–19) enquadra-se na penúria pós-napoleônica e na fome do "Ano Sem Verão" de 1816
  que alimentou a colonização suíça de Nova Friburgo por Dom João VI em 1819; recebeu um
  lote pobre e pedregoso na serra, e seu ramo permaneceu em terra rural do vale do Macaé,
  não na vila. [CONTEXTUAL]
