notes:
- text: >-
    BORER II in the Imigrantes de Nova Friburgo compilation (Henrique Bon), distinct
    from Jacob Borer (P-0050, BORER I), who originates from Erschwil and held
    Casa/Lote 70/56. Laurent originates from Grindel and held Casa/Lote 73/86.
    The two families shared the Heureux Voyage but were allocated different lots
    and are not proven to be closely related. The compilation states "não há
    evidência de parentesco próximo entre os dois grupos."
  text_pt: >-
    BORER II na compilação Imigrantes de Nova Friburgo (Henrique Bon), distinto
    de Jacob Borer (P-0050, BORER I), que é originário de Erschwil e ocupou a
    Casa/Lote 70/56. Laurent é originário de Grindel e ocupou a Casa/Lote 73/86.
    As duas famílias compartilharam o Heureux Voyage, mas receberam lotes
    diferentes e não há prova de que fossem parentes próximos. A compilação afirma
    "não há evidência de parentesco próximo entre os dois grupos."
- text: >-
    Father named as "certo Jacob Borer, de Grindel, Soleure" in the compilation
    (PUB-0003). The qualifier "certo" reflects the compiler's own hedged confidence
    in this attribution. The Grindel parish register images in the retrieval drop
    show a "Joannes Borer × Ana Maria Werli" baptising a daughter in 1782 — a
    strong lead for Laurent's parentage but not yet confirmed as the same individual.
    No parent family in this repository; the father is noted here only.
  text_pt: >-
    Pai nomeado como "certo Jacob Borer, de Grindel, Soleure" na compilação
    (PUB-0003). O qualificador "certo" reflete a própria confiança comedida do
    compilador nessa atribuição. As imagens do registro paroquial de Grindel no
    drop de recuperação mostram um "Joannes Borer × Ana Maria Werli" batizando uma
    filha em 1782 — uma pista forte para a filiação de Laurent, mas ainda não
    confirmada como sendo o mesmo indivíduo. Nenhuma família de pais neste
    repositório; o pai é apenas registrado aqui.
- text: >-
    Emigrated to Brazil in 1819 on the ship Heureux Voyage. Settled at Nova Friburgo,
    Rio de Janeiro, occupying Casa 73, Lote 86. Married Anna Maria Werhly (P-0069)
    on 03/07/1820 at Nova Friburgo. Probably died in the vale do Macaé area,
    Nova Friburgo; date of death unknown.
  text_pt: >-
    Emigrou para o Brasil em 1819 no navio Heureux Voyage. Estabeleceu-se em Nova
    Friburgo, Rio de Janeiro, ocupando a Casa 73, Lote 86. Casou-se com Anna Maria
    Werhly (P-0069) em 03/07/1820 em Nova Friburgo. Provavelmente morreu na região
    do vale do Macaé, Nova Friburgo; data de óbito desconhecida.
