profile: >-
  ## Interesting facts

  - **[PROVEN]** Named in two Lutheran parish records at Nova Friburgo as the mother of Jacob Klein — her 1844 baptism entry and, 28 years later, her son's 1872 marriage act which records her as "verstorbenen" (deceased). (PAR-0066, PAR-0068)

  - **[CONTEXTUAL]** Her maiden surname appears illegibly and differently in both records — a reflection of the inconsistencies in Nova Friburgo's Lutheran congregation record-keeping over three decades, and of the difficulty clerks faced when reading handwritten German names in an isolated colonial setting.

  - **[INFERRED]** She died sometime in the 28-year window between Jacob's 1844 baptism and his 1872 marriage. The colony suffered serious yellow fever epidemics in the 1850s that killed many settlers; her death may fall in that period, though this cannot be established from held records.

  ## Identity

  **Anna Margaretha [Neis]** — wife of the colonist Johannes Klein (P-0105) at Nova Friburgo,
  named in two Lutheran parish records as the mother of Jacob Klein (P-0103). Her maiden
  surname is illegible in both records and kept uncertain throughout. [PROVEN that she is
  named; maiden surname OPEN/uncertain]

  - **Role:** mother of Jacob Klein (P-0103; family F-0052 with Johannes Klein P-0105);
  Iris Bohrer Muniz's great-great-grandmother on the Klein line. [PROVEN]

  - **Named in two records:** Jacob's 1844 Lutheran baptism (PAR-0066, event E-0090) records
  her as "Anna Margar[etha], née geborene [Neis — uncertain]"; his 1872 marriage (PAR-0068)
  records her as "verstorbenen Anna Margaretha geb. [Neis — uncertain]", confirming she was
  deceased by that date. Her maiden surname is an uncertain single read, recorded the same (uncertainly) in
  both cited records, and is not asserted as fact. [PROVEN she is named; maiden surname OPEN/uncertain]

  ## Open questions

  - Her maiden surname remains illegible; her birth, marriage, and origin are not documented.
  [OPEN]

