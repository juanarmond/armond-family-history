profile: >-
  ## Identity

  **Anna Margaretha [Neis]** — wife of the colonist Johannes Klein (P-0105) at Nova Friburgo,
  named in two Lutheran parish records as the mother of Jacob Klein (P-0103). Her maiden
  surname is illegible in both records and kept uncertain throughout. [PROVEN that she is
  named; maiden surname OPEN/uncertain]

  - **Role:** mother of Jacob Klein (P-0103; family F-0052 with Johannes Klein P-0105);
  Iris Bohrer Muniz's 3×-great-grandmother on the Klein line. [PROVEN]

  - **Named in two records:** Jacob's 1844 Lutheran baptism (PAR-0066, event E-0090) records
  her as "Anna Margar[etha], née geborene [Neis — uncertain]"; his 1872 marriage (PAR-0068)
  records her as "verstorbenen Anna Margaretha geb. [Neis — uncertain]", confirming she was
  deceased by that date. Her maiden surname reads differently between the two records —
  neither reading is asserted as fact. [PROVEN she is named; maiden surname OPEN/uncertain]

  ## Open questions

  - Her maiden surname remains illegible; her birth, marriage, and origin are not documented.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0066 (Jacob Klein's 1844/45 Lutheran baptism — names her as mother).

  - PAR-0068 (Jacob Klein's 1872 Lutheran marriage — names her as the late mother, with
  the "verstorbenen" qualifier).
profile_pt: >-
  ## Identidade

  **Anna Margaretha [Neis]** — esposa do colono Johannes Klein (P-0105) em Nova Friburgo,
  nomeada em dois registros paroquiais luteranos como mãe de Jacob Klein (P-0103). Seu
  sobrenome de solteira é ilegível em ambos os registros e mantido como incerto. [PROVEN
  que é nomeada; sobrenome de solteira OPEN/incerto]

  - **Papel:** mãe de Jacob Klein (P-0103; família F-0052 com Johannes Klein P-0105);
  trisavó de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Nomeada em dois registros:** o batismo luterano de 1844 de Jacob (PAR-0066, evento
  E-0090) registra-a como "Anna Margar[etha], née geborene [Neis — incerto]"; o casamento
  de 1872 de Jacob (PAR-0068) registra-a como "verstorbenen Anna Margaretha geb.
  [Neis — incerto]", confirmando que estava falecida àquela data. Seu sobrenome de solteira
  é lido de forma diferente nos dois registros — nenhuma leitura é afirmada como fato.
  [PROVEN que é nomeada; sobrenome de solteira OPEN/incerto]

  ## Questões em aberto

  - Seu sobrenome de solteira permanece ilegível; seu nascimento, casamento e origem não
  estão documentados. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0066 (batismo luterano de 1844/45 de Jacob Klein — nomeia-a como mãe).

  - PAR-0068 (casamento luterano de 1872 de Jacob Klein — nomeia-a como mãe falecida,
  com o qualificador "verstorbenen").
