profile: >-
  ## Interesting facts

  - **[PROVEN]** Two Lutheran register entries at Nova Friburgo, twenty-eight years apart, are
  the whole of her documented existence. In 1844 she is a living mother — "seiner Ehefrau Anna
  Margar[etha]" — and in 1872 she is "der verstorbenen Anna Margaretha", the late mother of a
  groom. Her death therefore falls somewhere inside that window. (PAR-0066, PAR-0068)

  - **[PROVEN / unresolved]** Her maiden surname was written in both entries and cannot be read
  in either. The catalogued transcriptions render it "[Neis — uncertain]"; the Raibert
  Klein/Schenkel research material reads the same Kurrent hand as "Dürr". Two competent readings
  of one illegible word: neither is adopted here, and the preferred name keeps the surname in
  brackets to say so.

  - **[LEAD]** The secondary material gives her a death — 3 November 1864, at Rio Bonito, RJ —
  which would fit neatly between the two held records and match the family's documented drift
  away from the colony core. It is a blog attribution with no held image behind it.

  - **[INFERRED]** Whatever her surname was, she was a woman of the German-speaking Lutheran
  community: the register that records her is kept in German, in a congregation founded by the
  1824 immigration. That much follows from the document itself and not from the sound of her
  name.

  ## Identity

  **Anna Margaretha [Neis]** — wife of the colonist Johannes Klein (P-0105) at Nova Friburgo,
  named in two Lutheran parish records as the mother of Jacob Klein (P-0103). Iris Bohrer
  Muniz's (P-0007) great-great-grandmother, by the chain Jacob → Carolina Klein (P-0029) → João
  Gonçalves Bohrer (P-0014). [PROVEN that she is named; degree derived from the family links]

  - **Named in two records:** her son Jacob's Lutheran baptism of 1844/45, "Anna Margar[etha],
  née geborene [Neis — uncertain]" (PAR-0066, event E-0090), and his Lutheran marriage of 29
  April 1872, "der verstorbenen Anna Margaretha geb. [Neis — uncertain]" (PAR-0068). [PROVEN]

  - **Maiden surname:** illegible in both. Recorded here in brackets and not asserted; the
  competing "Dürr" reading is preserved as a lead, not merged. [OPEN]

  - **Husband:** Johannes Klein (P-0105); family F-0052. [PROVEN]

  - **Death:** after the 1844 baptism and before the April 1872 marriage. A secondary source
  gives 3 November 1864 at Rio Bonito. [PROVEN for the bracket; LEAD for the date]

  - **Birth, origin, nationality:** entirely undocumented; nationality is left unset in this
  archive for that reason. [OPEN by decision]

  ## Standing and profession

  Nothing at all. She is recorded twice, both times in the possessive — the colonist's wife, the
  groom's late mother. No occupation, property, literacy or signature survives for her, which is
  the ordinary condition of colonist women in these registers rather than anything specific to
  her.

  ## Family and social network

  Her one documented act is bearing and presenting a son. Jacob was born 16 October 1844 and
  baptised on 4 March 1845, with Jacob Schneider and Elisabeth — daughter of a different Jacob
  Klein, the congregation's sexton — standing as godparents. [PROVEN — PAR-0066] The godparent
  choice shows the family embedded in the Lutheran congregation's own circle; it is the only
  social connection any held record gives her.

  By 1872 she was dead and her son was living at Rio Bonito, where the secondary material also
  places her own death and her husband's. [PROVEN for her death before 1872 — PAR-0068; LEAD for
  Rio Bonito]

  ## What we can extrapolate

  - **[CONTEXTUAL]** She belonged to the German Protestant population that reached Nova Friburgo
  in the 1824 second wave under the agent Georg Anton Schäffer — some eighty families, arriving
  3–4 May 1824, five years after the Swiss Catholic founding cohort and driven out of Europe by
  the same post-Napoleonic poverty and land shortage.

  - **[INFERRED]** Her death between 1844 and 1872 is a wide bracket, and it should stay wide.
  It is tempting to fill a 28-year gap with an epidemic or a childbirth; nothing in the held
  evidence supports either, and the only candidate date — 1864 — comes from a blog.

  - **[CONTEXTUAL]** That her surname is unreadable is itself the finding. Nova Friburgo's
  Lutheran books were kept in Kurrentschrift by a small congregation, and a single difficult
  word in a single hand can sever a line: the Klein family's maternal origin stops here, not
  because no one wrote it down, but because no one today can read what was written.

  ## Open questions

  - Her maiden surname — "[Neis]" and "Dürr" are competing readings of the same illegible word
  in the same two documents. A max-zoom re-read of both register images, or a third record
  naming her, would settle it. [OPEN]

  - Her birth, her marriage and her origin — no record held. [OPEN]

  - Her death. The bracket is 1844–1872; the Rio Bonito 1864 attribution would need a Rio Bonito
  death register to confirm. [OPEN]

  - Her nationality, left unset on purpose because no held record states where she was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0066** — her son Jacob's 1844/45 Lutheran baptism at Nova Friburgo; names her as the
  living mother, with an illegible maiden surname.

  - **PAR-0068** — her son Jacob's 1872 Lutheran marriage; names her as "der verstorbenen Anna
  Margaretha", establishing that she had died by that date.

  ## Regional and migration context

  The Nova Friburgo colony was decreed in 1818 for Swiss Catholic families and acquired a German
  Protestant half in 1824. The two communities kept separate churches and separate books: the
  Igreja Luterana, with its German-language registers, is where the Klein records are, and it is
  why they were long invisible to anyone searching only the Catholic Matriz. [CONTEXTUAL] The
  German families had left a Rhineland and Hessen countryside impoverished by the Napoleonic
  wars and short of land, and arrived to the same stony, undersized highland lots that had
  disappointed the Swiss. Many dispersed within a generation, toward Rio Bonito and the
  surrounding fluminense districts — which is where this family's traces lead. [CONTEXTUAL; the
  dispersal of her own household is a LEAD]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation whose two register entries are the only
  record of her. [RESOLVED]

  - **Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ** — Praça Fonseca Portela s/n,
  Centro · [Maps](https://maps.google.com/?q=-22.71229,-42.62456). The town where the secondary
  material places her death in 1864. [RESOLVED as a place; her record there is a LEAD]

  - **Her German origin — unlocated.** No held record names a birthplace, and her maiden surname
  cannot be read, so there is no honest origin parish to name. Resolving the surname is the
  prerequisite to finding one. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Dois assentos do livro luterano de Nova Friburgo, separados por vinte e oito
  anos, são toda a sua existência documentada. Em 1844 é uma mãe viva — "seiner Ehefrau Anna
  Margar[etha]" —, e em 1872 é "der verstorbenen Anna Margaretha", a mãe falecida de um noivo.
  Sua morte cai, portanto, em algum ponto dessa janela. (PAR-0066, PAR-0068)

  - **[PROVEN / não resolvido]** Seu sobrenome de solteira foi escrito nos dois assentos e não
  se lê em nenhum deles. As transcrições catalogadas o grafam "[Neis — incerto]"; o material de
  pesquisa Raibert Klein/Schenkel lê a mesma mão Kurrent como "Dürr". Duas leituras competentes
  de uma única palavra ilegível: nenhuma é adotada aqui, e o nome preferencial mantém o
  sobrenome entre colchetes para dizê-lo.

  - **[LEAD]** O material secundário lhe atribui uma morte — 3 de novembro de 1864, no Rio
  Bonito, RJ — que encaixaria bem entre os dois documentos retidos e coincidiria com a deriva
  documentada da família para fora do núcleo colonial. É atribuição de blog, sem imagem retida
  por trás.

  - **[INFERRED]** Qualquer que fosse seu sobrenome, era mulher da comunidade luterana
  germanófona: o livro que a registra é mantido em alemão, numa congregação fundada pela
  imigração de 1824. Isso decorre do próprio documento, e não da sonoridade de seu nome.

  ## Identidade

  **Anna Margaretha [Neis]** — esposa do colono Johannes Klein (P-0105) em Nova Friburgo,
  nomeada em dois registros paroquiais luteranos como mãe de Jacob Klein (P-0103). Trisavó de
  Iris Bohrer Muniz (P-0007), pela cadeia Jacob → Carolina Klein (P-0029) → João Gonçalves
  Bohrer (P-0014). [PROVEN que é nomeada; grau derivado dos vínculos familiares]

  - **Nomeada em dois registros:** o batismo luterano do filho Jacob, em 1844/45, "Anna
  Margar[etha], née geborene [Neis — incerto]" (PAR-0066, evento E-0090), e o casamento luterano
  dele, em 29 de abril de 1872, "der verstorbenen Anna Margaretha geb. [Neis — incerto]"
  (PAR-0068). [PROVEN]

  - **Sobrenome de solteira:** ilegível em ambos. Registrado aqui entre colchetes e não
  afirmado; a leitura concorrente "Dürr" é preservada como pista, não fundida. [OPEN]

  - **Marido:** Johannes Klein (P-0105); família F-0052. [PROVEN]

  - **Óbito:** depois do batismo de 1844 e antes do casamento de abril de 1872. Uma fonte
  secundária dá 3 de novembro de 1864, no Rio Bonito. [PROVEN quanto ao intervalo; LEAD quanto à
  data]

  - **Nascimento, origem e nacionalidade:** inteiramente não documentados; por isso a
  nacionalidade é deixada em aberto neste arquivo. [OPEN por decisão]

  ## Posição social e profissão

  Absolutamente nada. Ela é registrada duas vezes, ambas no possessivo — a esposa do colono, a
  mãe falecida do noivo. Não sobrevive dela ocupação, propriedade, alfabetização ou assinatura,
  o que é a condição ordinária das mulheres colonas nesses livros, e não algo específico a ela.

  ## Família e rede social

  Seu único ato documentado é gerar e apresentar um filho. Jacob nasceu em 16 de outubro de 1844
  e foi batizado em 4 de março de 1845, com Jacob Schneider e Elisabeth — filha de um outro
  Jacob Klein, sacristão da congregação — como padrinhos. [PROVEN — PAR-0066] A escolha dos
  padrinhos mostra a família inserida no próprio círculo da congregação luterana; é a única
  conexão social que algum documento retido lhe dá.

  Em 1872 ela estava morta e o filho morava no Rio Bonito, onde o material secundário situa
  também a morte dela e a do marido. [PROVEN quanto à morte antes de 1872 — PAR-0068; LEAD
  quanto ao Rio Bonito]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Ela pertencia à população protestante alemã que chegou a Nova Friburgo na
  segunda leva de 1824, sob o agente Georg Anton Schäffer — cerca de oitenta famílias,
  desembarcadas em 3–4 de maio de 1824, cinco anos depois da coorte fundadora católica suíça e
  expulsas da Europa pela mesma pobreza pós-napoleônica e escassez de terra.

  - **[INFERRED]** Sua morte entre 1844 e 1872 é um intervalo largo, e deve continuar largo. É
  tentador preencher uma lacuna de 28 anos com uma epidemia ou um parto; nada nas evidências
  retidas sustenta qualquer das duas, e a única data candidata — 1864 — vem de um blog.

  - **[CONTEXTUAL]** Que seu sobrenome seja ilegível é, em si, o achado. Os livros luteranos de
  Nova Friburgo eram escritos em Kurrentschrift por uma congregação pequena, e uma única palavra
  difícil numa única mão pode cortar uma linhagem: a origem materna da família Klein para aqui —
  não porque ninguém a tenha escrito, mas porque ninguém hoje consegue ler o que foi escrito.

  ## Questões em aberto

  - Seu sobrenome de solteira — "[Neis]" e "Dürr" são leituras concorrentes da mesma palavra
  ilegível nos mesmos dois documentos. Uma releitura em zoom máximo das duas imagens, ou um
  terceiro documento que a nomeie, resolveria a questão. [OPEN]

  - Seu nascimento, seu casamento e sua origem — nenhum registro disponível. [OPEN]

  - Seu óbito. O intervalo é 1844–1872; a atribuição "Rio Bonito, 1864" precisaria de um livro
  de óbitos do Rio Bonito para se confirmar. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0066** — batismo luterano de 1844/45 do filho Jacob, em Nova Friburgo; nomeia-a como
  mãe viva, com sobrenome de solteira ilegível.

  - **PAR-0068** — casamento luterano de 1872 do filho Jacob; nomeia-a como "der verstorbenen
  Anna Margaretha", estabelecendo que já falecera àquela data.

  ## Contexto regional e migratório

  A colônia de Nova Friburgo foi decretada em 1818 para famílias católicas suíças e ganhou uma
  metade protestante alemã em 1824. As duas comunidades mantiveram igrejas e livros separados: a
  Igreja Luterana, com seus registros em alemão, é onde estão os assentos Klein — e é por isso
  que por muito tempo permaneceram invisíveis para quem buscasse apenas na Matriz católica.
  [CONTEXTUAL] As famílias alemãs haviam deixado um campo renano e hessiano empobrecido pelas
  guerras napoleônicas e carente de terra, e chegaram aos mesmos lotes serranos pedregosos e
  exíguos que já haviam decepcionado os suíços. Muitas se dispersaram em uma geração, rumo ao
  Rio Bonito e aos distritos fluminenses vizinhos — que é para onde levam os rastros desta
  família. [CONTEXTUAL; a dispersão do próprio domicílio dela é LEAD]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, cujos dois assentos são o único registro
  dela. [RESOLVED]

  - **Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ** — Praça Fonseca Portela s/n,
  Centro · [Mapa](https://maps.google.com/?q=-22.71229,-42.62456). A cidade em que o material
  secundário situa sua morte, em 1864. [RESOLVED como lugar; o registro dela ali é LEAD]

  - **Sua origem alemã — não localizada.** Nenhum documento retido nomeia um local de
  nascimento, e seu sobrenome de solteira não pode ser lido, de modo que não há freguesia de
  origem honesta a indicar. Resolver o sobrenome é o pré-requisito para encontrá-la. [UNLOCATED]
