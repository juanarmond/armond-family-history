profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada em dois registros paroquiais luteranos de Nova Friburgo como mãe de Jacob Klein — o registro de batismo de 1844 e, 28 anos depois, o assento de casamento do filho de 1872, que a registra como "verstorbenen" (falecida). (PAR-0066, PAR-0068)

  - **[CONTEXTUAL]** Seu sobrenome de solteira aparece de forma ilegível e diferente nos dois registros — um reflexo das inconsistências na escrituração da congregação luterana de Nova Friburgo ao longo de três décadas, e da dificuldade que os escrivães enfrentavam ao ler nomes alemães manuscritos num contexto colonial isolado.

  - **[INFERRED]** Faleceu em algum momento na janela de 28 anos entre o batismo de Jacob em 1844 e seu casamento em 1872. A colônia sofreu graves epidemias de febre amarela na década de 1850 que mataram muitos colonos; sua morte pode ter ocorrido nesse período, embora isso não possa ser estabelecido pelos documentos disponíveis.

  ## Identidade

  **Anna Margaretha [Neis]** — esposa do colono Johannes Klein (P-0105) em Nova Friburgo,
  nomeada em dois registros paroquiais luteranos como mãe de Jacob Klein (P-0103). Seu
  sobrenome de solteira é ilegível em ambos os registros e mantido como incerto. [PROVEN
  que é nomeada; sobrenome de solteira OPEN/incerto]

  - **Papel:** mãe de Jacob Klein (P-0103; família F-0052 com Johannes Klein P-0105);
  trisavó de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Nomeada em dois registros:** o batismo luterano de 1844 de Jacob (PAR-0066, evento
  E-0090) registra-a como "Anna Margar[etha], née geborene [Neis — incerto]"; o casamento
  de 1872 de Jacob (PAR-0068) registra-a como "verstorbenen Anna Margaretha geb.
  [Neis — incerto]", confirmando que estava falecida àquela data. Seu sobrenome de solteira
  é uma leitura única e incerta, registrada da mesma forma (de modo incerto) em ambos os
  registros citados, e não é afirmada como fato.
  [PROVEN que é nomeada; sobrenome de solteira OPEN/incerto]

  ## Questões em aberto

  - Seu sobrenome de solteira permanece ilegível; seu nascimento, casamento e origem não
  estão documentados. [OPEN]

