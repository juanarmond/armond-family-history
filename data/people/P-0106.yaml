notes:
- text: >-
    Mother of Jacob Klein (P-0103); named "Anna Margaretha née [Neis? — uncertain]" in Jacob's 1844
    Lutheran baptism (PAR-0066) and, as "verstorbenen Anna Margaretha geb. [Deir/Beir? — uncertain]"
    (deceased by 1872), in his 1872 marriage (PAR-0068). Her maiden surname is illegibly different
    between the two records — kept [uncertain], both readings preserved, not asserted as fact.
