notes:
- text: >-
    Born 10 January 1615, S. Sebastião, Terceira (Azores); died 26 June 1687, S. Sebastião.
    Alferes de ordenanças (Second Lieutenant of the militia). Married twice: first to Bárbara
    Gato (no surviving children, S.g.); second to Mariana Fagundes at Santa Bárbara on 26
    September 1650 (F-0062). Lived at Belo Jardim, in the termo of the vila da Praia, Terceira.
    Son of Manuel da Ponte Cardoso (P-0125) × Maria da Costa Leonardes (P-0126) (F-0063).
    All facts from Mendes Forjaz Vol. IX (PUB-0005), corroborated by primary parish marriage
    image PAR-0086.
- text: >-
    Nationality Portuguese: born in the Azores (then Portuguese Crown territory). The Azores
    were an integral part of the Portuguese Crown; persons born there are recorded as Portuguese,
    not separately "Azorean" for nationality purposes.
- text: >-
    First marriage (Bárbara Gato): not modelled as a separate family entity since Vol. IX states
    S.g. (sem geração — no surviving children). No primary record held for this first marriage.
- text: >-
    His father's name was corrected on 2026-09-24 from "Manuel da Ponte Valadão" to Manuel da
    Ponte Cardoso (P-0125). "Valadão" is the compiled genealogy's form (PUB-0005, Vol. IX
    p.259, which itself offers "Ou Manuel da Ponte Cardoso"); the original registers write the
    father "Manoell de Ponte" (PAR-0087), "m.el de Ponte Cardozo" (PAR-0097) and "M.el de
    Ponte Cardoso" (PAR-0098) — the same surname Belchior carries.
- text: >-
    The identification of the São Sebastião vicar as Belchior's brother is now [PROVEN], not
    inferred. His parents' own death acts, read 2026-09-24, are written by the officiating
    priest in the first person: a marginal "M.el de Pon / te Cardozo / meu pai" on the 1652
    act (PAR-0097) and "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte
    Cardoso meu pai" in the 1654 act (PAR-0098). The vicar was therefore a son of F-0063 and
    Belchior's brother. He is identified as António Coelho Souto-Maior (b.13.2.1619,
    d.17.7.1686) — the only priest among the couple's children in PUB-0005, and the man who
    signs "Antônio Coelho Sotomayor" when he buries Belchior's wife Mariana in 1684
    (PAR-0089). He is recorded as a documented child on F-0063 and is not modelled as a
    person entity.
profile: >-
  ## Interesting facts

  - **[PROVEN]** His life is bracketed by two held parish images 72 years apart: the São Sebastião baptism act of ~9 January 1615 ("Belchior fo[i filho] a Manoell de Ponte e de sua molher Maria da Cota", PAR-0087, book B-1611-1687 p.0037) and the São Sebastião burial act of 26 June 1687 (PAR-0088, book O-1642-1696 p.0068). Very few ancestors in this archive are documented at both ends of life by an original register.

  - **[PROVEN]** The registers never settle on one name for him. Across the ten held acts he is "Belchior da Ponte Cardogo" (1651, 1652, 1664), "Belchior da Ponte" (1654), "Belchior [da Ponte] Cardoso" (1656), "Balchios de Ponte Cardoso" in his own death entry, and "Balchion de Ponte" in his wife's; Mendes Forjaz adds the alias "Belchior da Ponte Souto-Maior" **[COMPILED]**. The surname was still fluid — the scribe wrote what he heard.

  - **[PROVEN]** He was an **Alferes de ordenanças** (ensign of the local militia) — the rank is entered in his own primary death act, not merely in the compilation.

  - **[PROVEN]** Seven of his children's baptisms are held as original images, running from Maria on 5 September 1651 (PAR-0090) to Isabel de Souto-Maior on 19 September 1666 (PAR-0096) — fifteen years of one household's life in one register.

  - **[COMPILED]** Mendes Forjaz Vol. IX notes that Belchior himself had signed the preceding burial entry in the register, dated 6 June 1687, twenty days before his own — from which the compiler infers a sudden death. **[INFERRED from COMPILED]** If the compiler read that signature correctly, Belchior was literate and still acting in a parish capacity in the month he died. We have not verified the signature against the image ourselves.

  - **[PROVEN + CONTEXTUAL]** The household drew its boys' names from the three Magi: his brother was Baltazar (b.1612), he was Belchior (b.1615), and his own son was Gaspar (b.1657); the godfather at his 1615 baptism was a "Baltezar" (surname not recorded). The Magi name-set was a standing convention in these islands, and it is why Belchior/Baltazar/Gaspar recur so thickly through this line.

  - **[PROVEN, 2026-09-24]** His brother was the vicar of São Sebastião. Their parents' own death acts, read this cycle, are written by the officiating priest in the first person: a three-line margin note on the 1652 act, "M.el de Pon / te Cardozo / **meu pai**" (PAR-0097), and the opening of the 1654 act, "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). What was an inference here is now documented: the long-serving parish priest was Belchior's own brother, identified from PUB-0005 and the neighbouring signatures as **António Coelho Souto-Maior** (b.13 February 1619, d.17 July 1686). Belchior named a son after him in 1654.

  - **[COMPILED]** He married twice: first Bárbara Gato (recorded *S.g.* — no surviving issue, no date, no record), then Mariana Fagundes on 26 September 1650. The couple lived at **Belo Jardim, termo da vila da Praia**.

  ## Identity

  **Belchior da Ponte Cardoso** — baptised ~9 January 1615, São Sebastião, Terceira **[PROVEN, PAR-0087]**; died and buried 26 June 1687, São Sebastião **[PROVEN, PAR-0088]**. Son of **Manuel da Ponte Cardoso** (P-0125) and **Maria da Costa Leonardes** (P-0126), family F-0063 — a parentage named in his own baptism act as "Manoell de Ponte e … sua molher Maria da Cota" **[PROVEN]** and independently stated by Mendes Forjaz Vol. IX **[COMPILED]**. (The compilation heads his father "Manuel da Ponte Valadão"; no register uses that form, and this repository dropped it as his name on 24 September 2026.) Married **Mariana Fagundes** (P-0124) on 26 September 1650 at Santa Bárbara **[PROVEN, PAR-0086]**; family F-0062.

  - **Rank:** Alferes de ordenanças **[PROVEN, PAR-0088; also PUB-0005]**
  - **Residence:** Belo Jardim, termo da vila da Praia **[COMPILED, PUB-0005]** — not verified by any held act
  - **Nationality:** Portuguese (the Azores were Crown territory, not a separate polity)
  - **Baptism date:** the image reads ~9 January; PUB-0005 gives 10 January. The one-day gap is preserved, not smoothed — see Open questions.

  **Position in the tree.** Counted along the modelled chain P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Belchior stands seven generations above Geraldo Paz Armond (P-0004) — his 5th-great-grandfather — and nine generations above the family's present living generation, on the Ferreira de Toledo branch that enters the Armond surname through Eliza Ferreira Armand (P-0017). **That degree is only as firm as its weakest link:** the step P-0123 → P-0092 rests on Mendes Forjaz alone **[COMPILED]** and is entangled with the unresolved "two Gaspars" question below. If P-0092 turns out to be the *next* generation, every degree given here moves back by one.

  ## Standing and profession

  No trade, no landholding and no will is documented for him. What the records do give is rank and parish position.

  - **Alferes de ordenanças [PROVEN].** The *ordenanças* were the third and lowest tier of the Portuguese military organisation — a territorial reserve raised parish by parish, in which the officers were local householders serving without pay **[CONTEXTUAL]**. An ensign's commission was therefore a marker of standing among the parish's principal families rather than a salary or a career. This matters for reading the family's later trajectory: it is *status without a wage base underneath it*, which transmits as precedence, not as capital.
  - **Literacy [INFERRED from COMPILED].** Only the Vol. IX footnote (his signature on the 6 June 1687 burial entry) points to it. Unverified by us.
  - **Wealth [OPEN].** Nothing held documents land, rents, enslaved people, livestock or an inventory. The single property signal is the compiled residence name, Belo Jardim.
  - **One indirect marker [PROVEN, PAR-0089].** His wife was buried *inside* the church, in the "sepultura da fabrica, segunda fiada nona" — a numbered grave belonging to the parish fabric. Burial within the church body was a paid privilege **[CONTEXTUAL]**, so the household could meet that cost. It places them in the parish's upper layer; it does not make them noble, and no held record calls them so.

  ## Family and social network

  - **Parents:** named in his own baptism **[PROVEN]** — the act that makes his parentage primary rather than compiled.
  - **Marriage:** at **Santa Bárbara**, his bride's parish, on 26 September 1650 **[PROVEN, PAR-0086]** — the normal Portuguese pattern of marrying in the bride's parish **[CONTEXTUAL]**, and the reason this one act sits in a different parish's book from everything else about him. The act is water- and ink-damaged; the marginal index reads "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes", while the filiation clause and the witnesses are only partly legible.
  - **Children:** Mendes Forjaz lists nine by Mariana **[COMPILED]**; seven of those baptisms are held as images **[PROVEN]** — Maria (1651, PAR-0090), Manuel (1652, PAR-0091), António Coelho Souto-Maior (1654, PAR-0092), Manuel again (1656, PAR-0093), a child read as "Anto" but compiled as Maria (1662, PAR-0094 — **[PROBABLE]**, name uncertain), Belchior (1664, PAR-0095) and Isabel de Souto-Maior (1666, PAR-0096). **[INFERRED]** The name Manuel is used twice, four years apart, which in this period almost always means the first child had died; no burial act for him is held.
  - **Godparents [PROVEN, with uncertain reads].** The few godparents legible in the acts come from inside the kindred, not outside it: "Asceto André Coelho" at the 1651 baptism (first word an uncertain read), "[?] Cardos da Ponte" in 1654 (given name **[uncertain]**), and a godmother "Isabel de Souto[?]" for Isabel in 1666. A small island parish's godparent network is a standing signal, and this one is endogamous — Coelho, Cardoso da Ponte, Souto.
  - **A priest in the house — now documented [PROVEN].** Vol. IX gives Belchior a brother, **António Coelho Souto-Maior** (b.1619, d.17 July 1686), *padre vigário* of the Matriz de São Sebastião **[COMPILED]**. That the parish vicar was a son of Belchior's parents is now **[PROVEN]** from two first-person statements in the death register: the margin of their father's 1652 act, "M.el de Pon / te Cardozo / meu pai" (PAR-0097), and the body of their mother's 1654 act, "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu pai" (PAR-0098). **[INFERRED — identification]** Which son is not stated in those two acts, which are signed only "o Vig.º So[u]tomaior": the neighbouring 1652 entries are signed "o Vig.º Ant.º Coelho Sotto[ma]yor", the vicar who buried Mariana in July 1684 signs **Antônio Coelho Sotomayor** **[PROVEN, PAR-0089]**, and PUB-0005 names only one priest among the couple's children. So the brother is António. Consistent with it, the vicar who buried Belchior himself in June 1687 is a different man, **Domingos Cardoso Fora** **[PROVEN, PAR-0088]**: the brother had died the previous year. The child baptised in 1654 carries the priest-brother's exact name. **[NOTE]** The retrieval agent's 2026-09-24 handoff called the vicar "Manoel Coelho Souto Maior"; the images do not support that name — "M.el" in the 1652 margin is the *deceased father's* forename.
  - **In-laws:** the Fagundes/Machado household of Santa Bárbara, headed by **Capitão de ordenanças António Martins Fagundes** (P-0127) **[COMPILED]**.

  ## What we can extrapolate

  **A marriage between two militia-officer households [INFERRED].** Belchior held an ensign's commission; his father-in-law is recorded as a captain of *ordenanças* and his wife's grandfather as the captain of a 79-man company **[COMPILED]**. The 1650 match therefore joined two parishes' officer families — São Sebastião in the south-east, Santa Bárbara in the west — rather than two neighbours. In the ordenanças system, where rank tracked local standing, that is the island equivalent of a status-consolidating marriage.

  **Status that could not be inherited as money [INFERRED + CONTEXTUAL].** Everything the records credit this household with — an unpaid commission, a brother in the vicarage, a paid grave inside the church — is *precedence*, not capital. Precedence has to be re-earned each generation; it does not divide and it does not pass. That is the mechanism to watch when this line reappears on the Minas frontier two generations later with no island land behind it.

  **A household larger than the island could seat [INFERRED + CONTEXTUAL].** Nine recorded children on a finite, long-settled island is the crux. Terceira's land regime locked entailed estates (*morgadios*) on eldest sons under primogeniture, while non-entailed property divided; either way, the younger children of a nine-child household had to find the Church, the militia, a marriage or the sea **[CONTEXTUAL]**. Belchior's own documented family shows exactly that dispersal: sons who died *solteiro*, a daughter married off in 1693, an uncle in the vicarage, and — in his wife's sibling set — a brother-in-law recorded simply as "que saiu da Terceira" **[COMPILED]**. The Azorean emigration to Brazil that carries this line to Minas is the same pressure, one turn later.

  **Where "Souto Maior" may have come from [STRONG LEAD — not proven].** With his brother now documented as the parish vicar who signed for decades as Souto Maior, the obvious reading is that Belchior's son **Gaspar de Souto Maior** (b.23 December 1657, P-0092) took the house name from his uncle the priest. It is a lead, not a finding: Gaspar's own baptism act is held only at the CDN's published maximum of 383×527 px, and its filiation and priest-signature lines are illegible, so nothing documents the transmission. Do not state it as fact.

  **What we should not say.** "Souto-Maior" and "Ponte Cardoso" both look armigerous, as does the "Valadão" the compiler attaches to his father. No held record grants this family arms, a *foro*, a *morgadio* or a *Dom*; the compiled genealogy places them in a documented Terceira kindred but does not ennoble them. Nothing here should be read as nobility — and no origin or standing should be read off a surname.

  ## Open questions

  - **Baptism date: ~9 vs 10 January 1615.** PAR-0087 reads ~9 January; PUB-0005 gives 10 January; E-0126 retains 10 January as canonical with the discrepancy recorded. Probably a scribal convention (act entered the day after), but unresolved. Decisive record: a higher-resolution scan of TER-AH-SAOSEBASTIAO-B-1611-1687 p.0037 from BPAR Angra.
  - **PAR-0096 (1666) names the father "Mathias", not Belchior.** Every other identifier — surname "de Ponte Cardogo", mother "marianna Faguedes", parish, date, the godmother's surname — matches, and no Mathias da Ponte Cardoso is known in these registers, so the act is retained as his with the caveat standing. Unresolved; needs the same rescan (p.0379).
  - **PAR-0094 (1662): the child's name is uncertain.** The margin reads "Anto"; PUB-0005 lists a Maria at ~18 May 1662. Held as **[PROBABLE]** at 383×527 px. Rescan of p.0352 required.
  - **The first marriage, to Bárbara Gato.** No date, no parish, no record — only Vol. IX's *S.g.* **[COMPILED]**.
  - **The 1650 marriage act is only partly readable.** Its filiation clause appears to name the bride's father ("[António?]") and its witness list is illegible. A BPAR rescan would convert Mariana's parentage from compiled to proven and recover the witnesses — the single highest-value rescan for this couple.
  - **Did he serve in the 1641–42 siege of the Castelo de São Filipe?** He was 26–27, held (or would hold) an *ordenanças* commission, and the besieging force was drawn from exactly that militia **[CONTEXTUAL]**. No held record names him in it, and his rank is attested only in 1687. Undocumented — do not assume it.
  - **No will, inventory or land record has been located,** so whether Belo Jardim was owned or rented, entailed or partible, is unknown.
  - **The "two Gaspars" question — UNRESOLVED, and the pivot of this whole branch.** Vol. IX lists one Gaspar for this couple: Gaspar de Souto-Maior, baptised São Sebastião 1657, died there 2 December 1727. The Brazilian **Gaspar Ferreira** (P-0092) is documented at Villa Rica with a son marrying in 1783 — impossible for a man who died in Terceira in 1727 unless the compiled date is wrong. Either the compiler lacked his Brazilian life, or P-0092 is the following generation. This awaits the owner's decision and must not be settled here in either direction.

  ## Sources held (this repository)

  - **PAR-0087** — his baptism, São Sebastião, ~9 January 1615 (B-1611-1687 p.0037); names his parents. *Primary.*
  - **PAR-0086** — his marriage to Mariana Fagundes, Santa Bárbara, 26 September 1650 (3 images: context, act, context). *Primary, damaged and partly legible.*
  - **PAR-0088** — his burial, São Sebastião, 26 June 1687 (O-1642-1696 p.0068); records the Alferes de ordenanças rank; officiant Vicar Domingos Cardoso Fora. *Primary.*
  - **PAR-0089** — his wife's burial, 7 July 1684, which names him as "M° Balchion de Ponte". *Primary.*
  - **PAR-0097 / PAR-0098** — his parents' burials, 19 August 1652 and 27 December 1654, from the same register. They do not name Belchior, but they fix his father's surname as Ponte Cardoso and prove that the parish vicar was his brother. *Primary, context.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0094 / 0095 / 0096** — the baptisms of seven of his children, 1651–1666, each naming him as father. *Primary.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: his dates, rank, both marriages, residence and the full child list. *Secondary, compiled.*
  - **PUB-0004** — the same compilation, Vol. IV, FAGUNDES § 6º, pp. 312–313, which records the 1650 marriage from his wife's side. *Secondary, compiled.*

  ## Regional and migration context

  **The island he was born on [CONTEXTUAL].** Terceira had been settled since about 1450, and by 1615 carried a dense population on a finite island. Its economy ran on wheat exported to mainland Portugal and the African presidios, on the blue dye *pastel* (woad) — already losing ground to American indigo — on wine and on shipbuilding timber. **Angra**, a city from 1534 and the seat of the Azores bishopric, was one of the mid-Atlantic's great ports of call, where the returning India and Brazil fleets watered and refitted. **São Sebastião**, Belchior's parish, was a rural *freguesia* in that city's orbit; **Santa Bárbara das Nove Ribeiras**, where he married, lies at the other end of the island.

  **Born under the Habsburgs, buried under the Braganças [CONTEXTUAL].** Belchior was born in 1615, thirty-two years into the Spanish Habsburg union of the crowns (1580–1640). Terceira had been the last part of the Portuguese realm to hold out for D. António, Prior do Crato, and was taken only by the invasion of 1583; the Spanish crown then built the **Castelo de São Filipe** above Angra to garrison the island it had had to conquer. He was 25 at the Restoration of 1640, and 27 when the Castilian garrison finally capitulated on 4 March 1642 after an eleven-month blockade prosecuted by the *ordenanças* of Terceira and the other islands. He lived the rest of his life — forty-five years — in a restored Portuguese Terceira.

  **The emigration that came after him [CONTEXTUAL].** The push that carried Azoreans to Brazil — overpopulation on limited land, entail and primogeniture, periodic seismic disaster — met its pull when Minas Gerais gold was struck from 1697, ten years after Belchior's death. The Crown imposed passport controls in 1720 precisely to slow the drain. That is his descendants' story, not his: Belchior never left the island, and neither, on the compiled record, did his son Gaspar. The **casais açorianos** Crown settlement scheme (1748–1756, directed at southern Brazil) is a different and later programme and is *not* this family's route.

  ## Where to go today

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — where he was baptised in 1615, where seven of his children were baptised, and where he was buried in 1687. The one place that holds his whole life. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — where he married Mariana Fagundes on 26 September 1650. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds the originals of every register cited here: TER-AH-SAOSEBASTIAO-B-1611-1687, TER-AH-SAOSEBASTIAO-O-1642-1696 and the Santa Bárbara *casamentos*. The place to request the higher-resolution scans listed under Open questions. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
  - **Belo Jardim, termo da vila da Praia (Praia da Vitória), Terceira** — the residence named by Mendes Forjaz. The exact site is not fixed by any held record. [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Praia%20da%20Vit%C3%B3ria%2C%20Terceira%2C%20A%C3%A7ores)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** A vida dele é emoldurada por duas imagens paroquiais separadas por 72 anos: o assento de baptismo de São Sebastião, de ~9 de janeiro de 1615 ("Belchior fo[i filho] a Manoell de Ponte e de sua molher Maria da Cota", PAR-0087, livro B-1611-1687 p.0037) e o assento de óbito de São Sebastião, de 26 de junho de 1687 (PAR-0088, livro O-1642-1696 p.0068). Pouquíssimos ancestrais deste arquivo estão documentados nas duas pontas da vida por registo original.

  - **[PROVEN]** Os registos nunca fixam um único nome para ele. Nos dez assentos disponíveis aparece como "Belchior da Ponte Cardogo" (1651, 1652, 1664), "Belchior da Ponte" (1654), "Belchior [da Ponte] Cardoso" (1656), "Balchios de Ponte Cardoso" no próprio óbito e "Balchion de Ponte" no óbito da mulher; Mendes Forjaz acrescenta o alias "Belchior da Ponte Souto-Maior" **[COMPILED]**. O apelido ainda era fluido — o escrivão escrevia o que ouvia.

  - **[PROVEN]** Era **Alferes de ordenanças** — a patente está lançada no próprio assento de óbito primário, e não apenas na compilação.

  - **[PROVEN]** Sete baptismos de filhos estão disponíveis como imagens originais, de Maria em 5 de setembro de 1651 (PAR-0090) a Isabel de Souto-Maior em 19 de setembro de 1666 (PAR-0096) — quinze anos da vida de uma casa num só livro.

  - **[COMPILED]** O Vol. IX de Mendes Forjaz nota que o próprio Belchior assinara o assento de óbito anterior, lavrado a 6 de junho de 1687, vinte dias antes do seu — donde o compilador infere morte repentina. **[INFERRED a partir de COMPILED]** Se o compilador leu bem essa assinatura, Belchior era alfabetizado e ainda actuava em função paroquial no mês em que morreu. Não verificámos a assinatura na imagem.

  - **[PROVEN + CONTEXTUAL]** A casa tirava os nomes dos filhos dos três Reis Magos: o irmão era Baltazar (n.1612), ele era Belchior (n.1615) e o seu próprio filho foi Gaspar (n.1657); o padrinho no baptismo de 1615 foi um "Baltezar" (apelido não registado). O conjunto de nomes dos Magos era convenção corrente nas ilhas, e é por isso que Belchior/Baltazar/Gaspar reaparecem tanto nesta linha.

  - **[PROVEN, 2026-09-24]** O irmão era o vigário de São Sebastião. Os assentos de óbito dos pais, lidos neste ciclo, estão escritos em primeira pessoa pelo sacerdote officiante: uma nota marginal de três linhas no assento de 1652, "M.el de Pon / te Cardozo / **meu pai**" (PAR-0097), e a abertura do assento de 1654, "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). O que aqui era inferência está agora documentado: o pároco de longa duração era o próprio irmão de Belchior, identificado pelo PUB-0005 e pelas assinaturas vizinhas como **António Coelho Souto-Maior** (n.13 de fevereiro de 1619, f.17 de julho de 1686). Belchior deu o nome dele a um filho, em 1654.

  - **[COMPILED]** Casou duas vezes: primeiro com Bárbara Gato (registada *S.g.* — sem geração sobrevivente, sem data e sem registo), depois com Mariana Fagundes a 26 de setembro de 1650. O casal viveu no **Belo Jardim, termo da vila da Praia**.

  ## Identidade

  **Belchior da Ponte Cardoso** — baptizado ~9 de janeiro de 1615, São Sebastião, Terceira **[PROVEN, PAR-0087]**; falecido e sepultado a 26 de junho de 1687, São Sebastião **[PROVEN, PAR-0088]**. Filho de **Manuel da Ponte Cardoso** (P-0125) e **Maria da Costa Leonardes** (P-0126), família F-0063 — filiação nomeada no próprio assento de baptismo como "Manoell de Ponte e … sua molher Maria da Cota" **[PROVEN]** e declarada de forma independente pelo Vol. IX de Mendes Forjaz **[COMPILED]**. (A compilação encabeça o pai como "Manuel da Ponte Valadão"; nenhum registo usa essa forma, e este repositório deixou de a usar como nome dele a 24 de setembro de 2026.) Casou com **Mariana Fagundes** (P-0124) a 26 de setembro de 1650, em Santa Bárbara **[PROVEN, PAR-0086]**; família F-0062.

  - **Patente:** Alferes de ordenanças **[PROVEN, PAR-0088; também PUB-0005]**
  - **Residência:** Belo Jardim, termo da vila da Praia **[COMPILED, PUB-0005]** — não confirmada por nenhum assento disponível
  - **Nacionalidade:** portuguesa (os Açores eram território da Coroa, não uma entidade política à parte)
  - **Data de baptismo:** a imagem lê-se ~9 de janeiro; o PUB-0005 dá 10 de janeiro. A diferença de um dia é preservada, não aplanada — ver Questões em aberto.

  **Posição na árvore.** Pela cadeia modelada P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Belchior está sete gerações acima de Geraldo Paz Armond (P-0004) — seu 5.º bisavô (*5th-great-grandfather*) — e nove gerações acima da atual geração viva da família, no ramo Ferreira de Toledo que entra no sobrenome Armond através de Eliza Ferreira Armand (P-0017). **Esse grau vale apenas o que valer o seu elo mais fraco:** o passo P-0123 → P-0092 assenta só em Mendes Forjaz **[COMPILED]** e está preso à questão não resolvida dos "dois Gaspares", abaixo. Se P-0092 for a geração *seguinte*, todos os graus aqui indicados recuam um.

  ## Posição social e profissão

  Nenhum ofício, propriedade ou testamento está documentado para ele. O que os registos dão é patente e posição paroquial.

  - **Alferes de ordenanças [PROVEN].** As *ordenanças* eram o terceiro e mais baixo escalão da organização militar portuguesa — uma reserva territorial levantada freguesia a freguesia, cujos oficiais eram moradores locais servindo sem soldo **[CONTEXTUAL]**. A patente de alferes era, portanto, marca de posição entre as famílias principais da freguesia, e não um salário ou uma carreira. Isto importa para ler a trajetória posterior da família: é *estatuto sem base salarial por baixo*, que se transmite como precedência, não como capital.
  - **Alfabetização [INFERRED a partir de COMPILED].** Só a nota de rodapé do Vol. IX (a assinatura no assento de 6 de junho de 1687) aponta nesse sentido. Não verificada por nós.
  - **Riqueza [OPEN].** Nada do que temos documenta terras, rendas, pessoas escravizadas, gado ou inventário. O único sinal de propriedade é o nome da residência compilado, Belo Jardim.
  - **Um marcador indirecto [PROVEN, PAR-0089].** A mulher foi sepultada *dentro* da igreja, na "sepultura da fabrica, segunda fiada nona" — cova numerada pertencente à fábrica da paróquia. A sepultura no corpo da igreja era privilégio pago **[CONTEXTUAL]**, logo a casa podia suportar esse custo. Situa-os na camada superior da freguesia; não os torna nobres, e nenhum registo disponível lhes atribui nobreza.

  ## Família e rede social

  - **Pais:** nomeados no próprio baptismo **[PROVEN]** — o assento que torna a sua filiação primária, e não compilada.
  - **Casamento:** em **Santa Bárbara**, freguesia da noiva, a 26 de setembro de 1650 **[PROVEN, PAR-0086]** — o padrão português normal de casar na freguesia da noiva **[CONTEXTUAL]**, e a razão pela qual este assento está num livro de outra paróquia. O assento tem danos de água e tinta; o índice marginal lê "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes", enquanto a cláusula de filiação e as testemunhas só são parcialmente legíveis.
  - **Filhos:** Mendes Forjaz lista nove com Mariana **[COMPILED]**; sete desses baptismos estão disponíveis em imagem **[PROVEN]** — Maria (1651, PAR-0090), Manuel (1652, PAR-0091), António Coelho Souto-Maior (1654, PAR-0092), outro Manuel (1656, PAR-0093), uma criança lida como "Anto" mas compilada como Maria (1662, PAR-0094 — **[PROBABLE]**, nome incerto), Belchior (1664, PAR-0095) e Isabel de Souto-Maior (1666, PAR-0096). **[INFERRED]** O nome Manuel é usado duas vezes, com quatro anos de intervalo, o que neste período quase sempre significa que o primeiro morrera; não há assento de óbito disponível para ele.
  - **Padrinhos [PROVEN, com leituras incertas].** Os poucos padrinhos legíveis vêm de dentro da parentela, não de fora: "Asceto André Coelho" no baptismo de 1651 (primeira palavra de leitura incerta), "[?] Cardos da Ponte" em 1654 (nome próprio **[incerto]**) e a madrinha "Isabel de Souto[?]" para Isabel em 1666. Numa pequena freguesia insular a rede de padrinhos é sinal de posição, e esta é endogâmica — Coelho, Cardoso da Ponte, Souto.
  - **Um padre em casa — agora documentado [PROVEN].** O Vol. IX dá a Belchior um irmão, **António Coelho Souto-Maior** (n.1619, f. 17 de julho de 1686), *padre vigário* da Matriz de São Sebastião **[COMPILED]**. Que o vigário da freguesia era filho dos pais de Belchior está agora **[PROVEN]** por duas declarações em primeira pessoa no livro de óbitos: a margem do assento do pai, em 1652, "M.el de Pon / te Cardozo / meu pai" (PAR-0097), e o corpo do assento da mãe, em 1654, "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu pai" (PAR-0098). **[INFERRED — identificação]** Qual dos filhos não vem dito nesses dois assentos, assinados apenas "o Vig.º So[u]tomaior": os assentos vizinhos de 1652 são assinados "o Vig.º Ant.º Coelho Sotto[ma]yor", o vigário que sepultou Mariana em julho de 1684 assina **Antônio Coelho Sotomayor** **[PROVEN, PAR-0089]**, e o PUB-0005 nomeia um único sacerdote entre os filhos do casal. Logo, o irmão é António. De forma coerente, o vigário que sepultou o próprio Belchior em junho de 1687 é outro, **Domingos Cardoso Fora** **[PROVEN, PAR-0088]**: o irmão morrera no ano anterior. O filho baptizado em 1654 leva exactamente o nome do tio padre. **[NOTA]** O handoff do agente de recolha de 2026-09-24 chamou ao vigário "Manoel Coelho Souto Maior"; as imagens não sustentam esse nome — o "M.el" na margem de 1652 é o nome próprio do *pai defunto*.
  - **Sogros:** a casa Fagundes/Machado de Santa Bárbara, chefiada pelo **Capitão de ordenanças António Martins Fagundes** (P-0127) **[COMPILED]**.

  ## O que podemos extrapolar

  **Um casamento entre duas casas de oficiais de milícia [INFERRED].** Belchior tinha patente de alferes; o sogro está registado como capitão de ordenanças e o avô da mulher como capitão de uma companhia de 79 homens **[COMPILED]**. A união de 1650 juntou, portanto, as famílias de oficiais de duas freguesias — São Sebastião, a sudeste, e Santa Bárbara, a oeste — e não dois vizinhos. No sistema das ordenanças, em que a patente acompanhava a posição local, isso é o equivalente insular de um casamento de consolidação de estatuto.

  **Estatuto que não se herdava como dinheiro [INFERRED + CONTEXTUAL].** Tudo o que os registos creditam a esta casa — uma patente sem soldo, um irmão no vicariato, uma cova paga dentro da igreja — é *precedência*, não capital. A precedência tem de ser reconquistada a cada geração; não se divide e não se transmite. É esse o mecanismo a observar quando esta linha reaparece na fronteira das Minas, duas gerações depois, sem terra insular por trás.

  **Uma casa maior do que a ilha podia acomodar [INFERRED + CONTEXTUAL].** Nove filhos registados numa ilha finita e povoada há dois séculos é o ponto central. O regime fundiário da Terceira prendia os bens vinculados (*morgadios*) aos filhos primogénitos, enquanto a propriedade não vinculada se dividia; de qualquer modo, os filhos mais novos de uma casa de nove tinham de procurar a Igreja, a milícia, um casamento ou o mar **[CONTEXTUAL]**. A própria família documentada de Belchior mostra essa dispersão: filhos falecidos *solteiros*, uma filha casada em 1693, um tio no vicariato e — no conjunto de irmãos da mulher — um cunhado registado apenas como "que saiu da Terceira" **[COMPILED]**. A emigração açoriana que leva esta linha às Minas é a mesma pressão, uma volta depois.

  **De onde pode vir "Souto Maior" [STRONG LEAD — não provado].** Documentado agora o irmão como o vigário da freguesia que assinou durante décadas como Souto Maior, a leitura óbvia é que o filho de Belchior, **Gaspar de Souto Maior** (n.23 de dezembro de 1657, P-0092), tomou o nome de casa ao tio padre. É pista, não achado: o assento de baptismo de Gaspar só existe no máximo publicado pelo CDN, 383×527 px, e as linhas da filiação e da assinatura do sacerdote são ilegíveis, pelo que nada documenta a transmissão. Não afirmar como facto.

  **O que não devemos dizer.** "Souto-Maior" e "Ponte Cardoso" soam a apelidos de armas, tal como o "Valadão" que o compilador atribui ao pai. Nenhum registo disponível concede a esta família armas, *foro*, *morgadio* ou tratamento de *Dom*; a genealogia compilada coloca-os numa parentela terceirense documentada, mas não os enobrece. Nada aqui deve ser lido como nobreza — e nenhuma origem ou posição deve ser lida a partir de um apelido.

  ## Questões em aberto

  - **Data de baptismo: ~9 ou 10 de janeiro de 1615.** O PAR-0087 lê ~9 de janeiro; o PUB-0005 dá 10 de janeiro; o E-0126 mantém 10 de janeiro como canónico, com a discrepância registada. Provavelmente convenção scribal (assento lavrado no dia seguinte), mas não resolvido. Registo decisivo: digitalização em maior resolução de TER-AH-SAOSEBASTIAO-B-1611-1687 p.0037, no BPAR de Angra.
  - **O PAR-0096 (1666) nomeia o pai como "Mathias", não Belchior.** Todos os outros identificadores — apelido "de Ponte Cardogo", mãe "marianna Faguedes", freguesia, data, apelido da madrinha — coincidem, e não se conhece nenhum Mathias da Ponte Cardoso nestes registos, pelo que o assento é mantido como dele, com a ressalva de pé. Não resolvido; exige a mesma digitalização (p.0379).
  - **PAR-0094 (1662): o nome da criança é incerto.** A margem lê "Anto"; o PUB-0005 lista uma Maria a ~18 de maio de 1662. Mantido como **[PROBABLE]** a 383×527 px. É necessária nova digitalização da p.0352.
  - **O primeiro casamento, com Bárbara Gato.** Sem data, sem freguesia, sem registo — apenas o *S.g.* do Vol. IX **[COMPILED]**.
  - **O assento de casamento de 1650 só é parcialmente legível.** A cláusula de filiação parece nomear o pai da noiva ("[António?]") e a lista de testemunhas está ilegível. Uma nova digitalização do BPAR converteria a filiação de Mariana de compilada em provada e recuperaria as testemunhas — é a digitalização de maior valor para este casal.
  - **Terá servido no cerco de 1641–42 ao Castelo de São Filipe?** Tinha 26–27 anos, detinha (ou viria a deter) patente de *ordenanças*, e a força sitiante saiu exactamente dessa milícia **[CONTEXTUAL]**. Nenhum registo disponível o nomeia, e a patente só está atestada em 1687. Não documentado — não assumir.
  - **Não foi localizado testamento, inventário ou registo de terra,** pelo que não se sabe se o Belo Jardim era próprio ou arrendado, vinculado ou partível.
  - **A questão dos "dois Gaspares" — NÃO RESOLVIDA, e o eixo de todo este ramo.** O Vol. IX lista um só Gaspar para este casal: Gaspar de Souto-Maior, baptizado em São Sebastião em 1657 e ali falecido a 2 de dezembro de 1727. O **Gaspar Ferreira** brasileiro (P-0092) está documentado em Villa Rica, com um filho a casar em 1783 — impossível para quem morreu na Terceira em 1727, a menos que a data compilada esteja errada. Ou o compilador desconhecia a vida brasileira dele, ou P-0092 é a geração seguinte. Isto aguarda decisão do proprietário e não deve ser resolvido aqui em nenhum dos sentidos.

  ## Fontes disponíveis (neste repositório)

  - **PAR-0087** — o seu baptismo, São Sebastião, ~9 de janeiro de 1615 (B-1611-1687 p.0037); nomeia os pais. *Primária.*
  - **PAR-0086** — o seu casamento com Mariana Fagundes, Santa Bárbara, 26 de setembro de 1650 (3 imagens: contexto, assento, contexto). *Primária, danificada e parcialmente legível.*
  - **PAR-0088** — o seu óbito, São Sebastião, 26 de junho de 1687 (O-1642-1696 p.0068); regista a patente de Alferes de ordenanças; officiante o Vigário Domingos Cardoso Fora. *Primária.*
  - **PAR-0089** — o óbito da mulher, 7 de julho de 1684, que o nomeia como "M° Balchion de Ponte". *Primária.*
  - **PAR-0097 / PAR-0098** — os óbitos dos pais, 19 de agosto de 1652 e 27 de dezembro de 1654, do mesmo livro. Não nomeiam Belchior, mas fixam o apelido do pai como Ponte Cardoso e provam que o vigário da freguesia era seu irmão. *Primárias, contexto.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0094 / 0095 / 0096** — os baptismos de sete dos seus filhos, 1651–1666, cada um nomeando-o como pai. *Primárias.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: datas, patente, os dois casamentos, residência e a lista completa de filhos. *Secundária, compilada.*
  - **PUB-0004** — a mesma compilação, Vol. IV, FAGUNDES § 6º, pp. 312–313, que regista o casamento de 1650 pelo lado da mulher. *Secundária, compilada.*

  ## Contexto regional e migratório

  **A ilha onde nasceu [CONTEXTUAL].** A Terceira estava povoada desde cerca de 1450 e, em 1615, sustentava população densa em território finito. A economia assentava no trigo exportado para o reino e para as praças africanas, no corante azul *pastel* — já a perder terreno para o índigo americano —, no vinho e na madeira de construção naval. **Angra**, cidade desde 1534 e sede do bispado dos Açores, era um dos grandes portos de escala do Atlântico médio, onde as armadas da Índia e do Brasil aguavam e se reparavam no regresso. **São Sebastião**, a freguesia de Belchior, era rural, na órbita dessa cidade; **Santa Bárbara das Nove Ribeiras**, onde casou, fica no extremo oposto da ilha.

  **Nascido sob os Habsburgos, sepultado sob os Braganças [CONTEXTUAL].** Belchior nasceu em 1615, trinta e dois anos após o início da união dinástica com Espanha (1580–1640). A Terceira fora a última parcela do reino português a resistir por D. António, Prior do Crato, e só foi tomada pela invasão de 1583; a coroa espanhola ergueu então o **Castelo de São Filipe**, sobre Angra, para guarnecer a ilha que tivera de conquistar. Tinha 25 anos na Restauração de 1640 e 27 quando a guarnição castelhana capitulou, a 4 de março de 1642, após onze meses de cerco conduzido pelas *ordenanças* da Terceira e das outras ilhas. Viveu os restantes quarenta e cinco anos numa Terceira portuguesa restaurada.

  **A emigração que veio depois dele [CONTEXTUAL].** A pressão que levou açorianos ao Brasil — excesso de população em terra limitada, vínculo e primogenitura, desastre sísmico periódico — encontrou o seu ímã quando se descobriu ouro nas Minas Gerais, a partir de 1697, dez anos depois da morte de Belchior. A Coroa impôs controlo de passaportes em 1720 justamente para travar a sangria. Essa é a história dos descendentes, não a dele: Belchior nunca deixou a ilha, e, pelo registo compilado, o filho Gaspar também não. O programa dos **casais açorianos** (1748–1756, dirigido ao sul do Brasil) é outro e posterior, e *não* é o caminho desta família.

