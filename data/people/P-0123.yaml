profile: >-
  ## Interesting facts

  - **[PROVEN]** His life is bracketed by two held parish images 72 years apart: the São Sebastião baptism act of ~9 January 1615 ("Belchior fo[i filho] a Manoell de Ponte e de sua molher Maria da Cota", PAR-0087, book B-1611-1687 p.0037) and the São Sebastião burial act of 26 June 1687 (PAR-0088, book O-1642-1696 p.0068). Very few people in this archive are documented at both ends of life by an original register.

  - **[PROVEN]** The registers never settle on one name for him. Across the held acts he is "belchior de Ponte cardozo" (1651, 1652), "belchior de Ponte" (1654), "Belchior [da Ponte] Cardoso" (1656), "Melchior de Ponte" (1664) and "melchior de Ponte Cardozo" (1666), "Belchior de Ponte Cardozo" in the body of his own death entry with "Balchior / de Ponte" in its margin, and "Balchior de Ponte" in his wife's; Mendes Forjaz adds the alias "Belchior da Ponte Souto-Maior" **[COMPILED]**. [Corrected 2026-10-08 on direct image re-reads: earlier versions gave "Cardogo", "Balchios", "Balchion" and, for 1666, "Mathias".] The surname was still fluid — the scribe wrote what he heard.

  - **[PROVEN]** He was an **Alferes de ordenanças** (ensign of the local militia) — the rank is entered in his own primary death act, not merely in the compilation.

  - **[PROVEN]** Six of his children's baptisms are held as original images, running from Maria on 5 September 1651 (PAR-0090) to Isabel on 19 September 1666 (PAR-0096) — fifteen years of one household's life in one register. [Corrected 2026-10-08: earlier "seven"; PAR-0094, once counted, is the baptism of another family's child.] [Added 2026-10-10: a seventh is now held as well — his son Gaspar's own baptism of 23 December 1657 (PAR-0099), which names him "Alferes belchior da ponte cardozo".]

  - **[COMPILED]** Mendes Forjaz Vol. IX notes that Belchior himself had signed the preceding burial entry in the register, dated 6 June 1687, twenty days before his own — from which the compiler infers a sudden death. **[INFERRED from COMPILED]** If the compiler read that signature correctly, Belchior was literate and still acting in a parish capacity in the month he died. We have not verified the signature against the image ourselves.

  - **[PROVEN + CONTEXTUAL]** The household drew its boys' names from the three Magi: his brother was Baltazar (bapt. 1612), he was Belchior (bapt. 1615), and his own son was Gaspar (bapt. 23 December 1657, PAR-0099; P-0131); the godfather at his 1615 baptism was a "Baltezar" (surname not recorded). The Magi name-set was a standing convention in these islands, and it is why Belchior/Baltazar/Gaspar recur so thickly through this line.

  - **[PROVEN, 2026-09-24]** His brother was the vicar of São Sebastião. Their parents' own death acts, read this cycle, are written by the officiating priest in the first person: a three-line margin note on the 1652 act, "M.el de Pon / te Cardozo / **meu pai**" (PAR-0097), and the opening of the 1654 act, "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). What was an inference here is now documented: the long-serving parish priest was Belchior's own brother, identified from PUB-0005 and the neighbouring signatures as **António Coelho Souto-Maior** (bapt. 13 February 1619, d.17 July 1686). Belchior named a son after him in 1654.

  - **[COMPILED]** He married twice: first Bárbara Gato (recorded *S.g.* — no surviving issue, no date, no record), then Mariana Fagundes on 26 September 1650. The couple lived at **Belo Jardim, termo da vila da Praia**.

  ## Identity

  **Belchior da Ponte Cardoso** — baptised ~9 January 1615, São Sebastião, Terceira **[PROVEN, PAR-0087]**; died and buried 26 June 1687, São Sebastião **[PROVEN, PAR-0088]**. Son of **Manuel da Ponte Cardoso** (P-0125) and **Maria da Costa Leonardes** (P-0126), family F-0063 — a parentage named in his own baptism act as "Manoell de Ponte e … sua molher Maria da Cota" **[PROVEN]** and independently stated by Mendes Forjaz Vol. IX **[COMPILED]**. (The compilation heads his father "Manuel da Ponte Valadão"; no register uses that form, and this repository dropped it as his name on 24 September 2026.) Married **Mariana Fagundes** (P-0124) on 26 September 1650 at Santa Bárbara **[PROVEN, PAR-0086]**; family F-0062.

  - **Rank:** Alferes de ordenanças **[PROVEN, PAR-0088; also PUB-0005]**
  - **Residence:** Belo Jardim, termo da vila da Praia **[COMPILED, PUB-0005]** — not verified by any held act
  - **Nationality:** Portuguese (the Azores were Crown territory, not a separate polity)
  - **Baptism date:** the image reads ~9 January; PUB-0005 gives 10 January. The one-day gap is preserved, not smoothed — see Open questions.

  **Place in the archive [corrected 2026-10-10].** Belchior is **not a proven ancestor** of the archive's owner. He belongs to the **Terceira Armond trunk** as the father of Gaspar de Souto Maior (P-0131), whose own baptism of 23 December 1657 names him "Alferes belchior da ponte cardozo" **[PROVEN, PAR-0099]**. Family tradition — Lacerda's 2010 thesis (PUB-0002, ff. 55–56), following a private 2008 typescript by Paulo Ribeiro Luz and the 1751 will it quotes — makes that Gaspar the father of Francisco Ferreira Armonde (d. 1751), patriarch of the Ferreira Armonde of Barbacena, and so Belchior the patriarch's paternal grandfather **[LEAD]**; only the parents' names come from the will as quoted, the grandparents from the typescript. That family would attach to the owner only through the unknown parents of Simplício José Ferreira Armond (P-0016) **[OPEN]**. Neither link is proven. Until 10 October 2026 the tree ran this line instead through Gaspar Ferreira (P-0092) of Vila Rica, on the Toledo side, and counted Belchior as Geraldo Paz Armond's (P-0004) 5th-great-grandfather; that identification is rejected (owner's decision, 2026-10-10) — Gaspar de Souto Maior was baptised at São Sebastião in 1657 and died there on 2 December 1727 aged about seventy (PAR-0100), decades before Gaspar Ferreira's son was born at Vila Rica — and the degree is withdrawn.

  ## Standing and profession

  No trade, no landholding and no will is documented for him. What the records do give is rank and parish position.

  - **Alferes de ordenanças [PROVEN].** The *ordenanças* were the third and lowest tier of the Portuguese military organisation — a territorial reserve raised parish by parish, in which the officers were local householders serving without pay **[CONTEXTUAL]**. An ensign's commission was therefore a marker of standing among the parish's principal families rather than a salary or a career. This matters for reading the family's later trajectory: it is *status without a wage base underneath it*, which transmits as precedence, not as capital.
  - **Literacy [INFERRED from COMPILED].** Only the Vol. IX footnote (his signature on the 6 June 1687 burial entry) points to it. Unverified by us.
  - **Wealth [OPEN].** Nothing held documents land, rents, enslaved people, livestock or an inventory. The single property signal is the compiled residence name, Belo Jardim.
  - **One indirect marker [PROVEN, PAR-0089].** His wife was buried *inside* the church, in the "sepultura da fabrica, segunda fiada nona" — a numbered grave belonging to the parish fabric. Burial within the church body was a paid privilege **[CONTEXTUAL]**, so the household could meet that cost. It places them in the parish's upper layer; it does not make them noble, and no held record calls them so.

  ## Family and social network

  - **Parents:** named in his own baptism **[PROVEN]** — the act that makes his parentage primary rather than compiled.
  - **Marriage:** at **Santa Bárbara**, his bride's parish, on 26 September 1650 **[PROVEN, PAR-0086]** — the normal Portuguese pattern of marrying in the bride's parish **[CONTEXTUAL]**, and the reason this one act sits in a different parish's book from everything else about him. The act is water- and ink-damaged; the marginal index reads "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes", while the filiation clause and the witnesses are only partly legible.
  - **Children:** Mendes Forjaz lists nine by Mariana **[COMPILED]**; six of those baptisms are held as images **[PROVEN]** — Maria (1651, PAR-0090), Manuel (1652, PAR-0091), António Coelho Souto-Maior (1654, PAR-0092; written "Ant.º"), Manuel again (1656, PAR-0093), Belchior (1664, PAR-0095; written "Melchior") and Isabel de Souto-Maior (1666, PAR-0096; written "Izabel"). [Added 2026-10-10: a seventh, Gaspar de Souto Maior's of 23 December 1657, is now held too — PAR-0099; P-0131.] The compiled Maria of ~18 May 1662 has no held baptism image **[COMPILED]** — PAR-0094, once read as hers, is the baptism of António son of Gregório Cardozo (corrected 2026-10-08). **[INFERRED]** The name Manuel is used twice, four years apart, which in this period almost always means the first child had died; no burial act for him is held.
  - **Godparents [PROVEN, with uncertain reads].** Re-read from the images 2026-10-08: the Capitão André Coelho [?] Fagundes and Maria de Ponte (1651); the Padre André Machado and Ignes Machada, daughter of the Capitão António Machado (1652); Francisco ("Fr.co") Cardozo de Ponte (1654); António Cardozo (1664); and the Alferes Pedro Lourenço of the Novas Ribeiras with Izabel de Souto (1666). Several come from inside the kindred — Ponte, Cardozo, Fagundes, Souto — alongside officer-rank and clerical sponsors, a standing signal in a small island parish **[INFERRED]**. [Corrected 2026-10-08: earlier read "Asceto André Coelho" (1651) and "[?] Cardos da Ponte" (1654).]
  - **A priest in the house — now documented [PROVEN].** Vol. IX gives Belchior a brother, **António Coelho Souto-Maior** (bapt. 1619, d.17 July 1686), *padre vigário* of the Matriz de São Sebastião **[COMPILED]**. That the parish vicar was a son of Belchior's parents is now **[PROVEN]** from two first-person statements in the death register: the margin of their father's 1652 act, "M.el de Pon / te Cardozo / meu pai" (PAR-0097), and the body of their mother's 1654 act, "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu pai" (PAR-0098). **[INFERRED — identification]** Which son is not stated in those two acts, which are signed only "o Vig.º So[u]tomaior": the neighbouring 1652 entries are signed "o Vig.º Ant.º Coelho Sotto[ma]yor", the vicar who buried Mariana in July 1684 signs **Antônio Coelho Sotomayor** **[PROVEN, PAR-0089]**, and PUB-0005 names only one priest among the couple's children. So the brother is António. Consistent with it, the vicar who buried Belchior himself in June 1687 is a different man, **Domingos Cardoso Fora** **[PROVEN, PAR-0088]**: the brother had died the previous year. The child baptised in 1654 carries the priest-brother's exact name. **[NOTE]** The retrieval agent's 2026-09-24 handoff called the vicar "Manoel Coelho Souto Maior"; the images do not support that name — "M.el" in the 1652 margin is the *deceased father's* forename.
  - **In-laws:** the Fagundes/Machado household of Santa Bárbara, headed by **Capitão de ordenanças António Martins Fagundes** (P-0127) **[COMPILED]**.

  ## What we can extrapolate

  **A marriage between two militia-officer households [INFERRED].** Belchior held an ensign's commission; his father-in-law is recorded as a captain of *ordenanças* and his wife's grandfather as the captain of a 79-man company **[COMPILED]**. The 1650 match therefore joined two parishes' officer families — São Sebastião in the south-east, Santa Bárbara in the west — rather than two neighbours. In the ordenanças system, where rank tracked local standing, that is the island equivalent of a status-consolidating marriage.

  **Status that could not be inherited as money [INFERRED + CONTEXTUAL].** Everything the records credit this household with — an unpaid commission, a brother in the vicarage, a paid grave inside the church — is *precedence*, not capital. Precedence has to be re-earned each generation; it does not divide and it does not pass. That is the mechanism to watch if, as family tradition holds, this line reappears on the Minas frontier two generations later — as the Ferreira Armonde of Barbacena — with no island land behind it **[LEAD]**.

  **A household larger than the island could seat [INFERRED + CONTEXTUAL].** Nine recorded children on a finite, long-settled island is the crux. Terceira's land regime locked entailed estates (*morgadios*) on eldest sons under primogeniture, while non-entailed property divided; either way, the younger children of a nine-child household had to find the Church, the militia, a marriage or the sea **[CONTEXTUAL]**. Belchior's own documented family shows exactly that dispersal: sons who died *solteiro*, a daughter married off in 1693, an uncle in the vicarage, and — in his wife's sibling set — a brother-in-law recorded simply as "que saiu da Terceira" **[COMPILED]**. If the family tradition holds, the Azorean emigration to Brazil that carried a grandson of his to Minas is the same pressure, one turn later.

  **Where "Souto Maior" may have come from [STRONG LEAD — not proven].** With his brother now documented as the parish vicar who signed for decades as Souto Maior, the obvious reading is that Belchior's son **Gaspar de Souto Maior** (P-0131) took the house name from his uncle the priest. Gaspar's own baptism is now held **[PROVEN, PAR-0099]**: the BPAR 300-dpi scan of the original (São Sebastião B-1611-1687, the leaf the CDN serves as image 0324) dates it 23 December 1657 — Vol. IX prints 23 February 1657 **[COMPILED]**, a slip — names him "filho do Alferes belchior da ponte cardozo e de sua molher mariana Fag.des", and is signed by that uncle, "Vig.ro Ant.o Coelho Soto mayor". But the same act names the godfather as "Gasp.ar de Souto mayor f.o de Ba[?]… Leonardes" — a man already bearing the child's full name — so the name may equally have come from the godfather **[INFERRED]**. The transmission stays a lead, not a finding. Do not state it as fact. [Corrected 2026-10-10: earlier text held that no record of Gaspar's baptism was catalogued here and tied him to P-0092; the baptism is now PAR-0099, Gaspar de Souto Maior is P-0131, and his identification with Gaspar Ferreira (P-0092) is rejected.]

  **What we should not say.** "Souto-Maior" and "Ponte Cardoso" both look armigerous, as does the "Valadão" the compiler attaches to his father. No held record grants this family arms, a *foro*, a *morgadio* or a *Dom*; the compiled genealogy places them in a documented Terceira kindred but does not ennoble them. Nothing here should be read as nobility — and no origin or standing should be read off a surname.

  ## Open questions

  - **Baptism date: ~9 vs 10 January 1615.** PAR-0087 reads ~9 January; PUB-0005 gives 10 January; E-0126 retains 10 January as canonical with the discrepancy recorded. Probably a scribal convention (act entered the day after), but unresolved. Decisive record: a higher-resolution scan of TER-AH-SAOSEBASTIAO-B-1611-1687 p.0037 from BPAR Angra.
  - **PAR-0096 (1666) — the "Mathias" problem is withdrawn.** An earlier reading gave the father's forename as "Mathias"; the image reads "do Alferes melchior de Ponte Cardozo" (and the mother "marianna Fa-gundes"). Melchior is a period variant of Belchior, also used in PAR-0095, so the act is his without caveat. [Corrected 2026-10-08 on a direct image re-read.]
  - **The compiled Maria of ~18 May 1662 has no held baptism.** PAR-0094 was catalogued as hers, but its legible "Ant.º" entry is the baptism of António, son of Gregório Cardozo, on 12 June 1662, and the only other candidate (a "M[?]" entry on the facing page) is illegible at 383×527 px. A higher-resolution rescan of p.0352 and its facing page is the only test. [Corrected 2026-10-08: earlier held as **[PROBABLE]** for Maria.]
  - **The first marriage, to Bárbara Gato.** No date, no parish, no record — only Vol. IX's *S.g.* **[COMPILED]**.
  - **The 1650 marriage act is only partly readable.** Its filiation clause appears to name the bride's father ("[António?]") and its witness list is illegible. A BPAR rescan would convert Mariana's parentage from compiled to proven and recover the witnesses — the single highest-value rescan for this couple.
  - **Did he serve in the 1641–42 siege of the Castelo de São Filipe?** He was 26–27, held (or would hold) an *ordenanças* commission, and the besieging force was drawn from exactly that militia **[CONTEXTUAL]**. No held record names him in it, and his rank as Alferes is attested from 1657 (PAR-0099), then 1664, 1666 and 1687 (PAR-0095, PAR-0096, PAR-0088) [corrected 2026-10-10: earlier said "only in 1687"] — none of which mentions the siege. Undocumented — do not assume it.
  - **No will, inventory or land record has been located,** so whether Belo Jardim was owned or rented, entailed or partible, is unknown.
  - **The "two Gaspars" question — RESOLVED 2026-10-10: two men.** Vol. IX lists one Gaspar for this couple: Gaspar de Souto-Maior, baptised at São Sebastião (it prints 23 February 1657; his own act, PAR-0099, reads 23 December 1657) and died 2 December 1727 — the book prints no place of death. He married D. Margarida Machado at the Convento da Graça, Angra, on 2 October 1690, and secondly Maria Mendes de Borba at São Sebastião on 8 February 1694; three children of the second marriage were baptised at São Sebastião in 1698–1701 **[COMPILED]**. His death act, now held, records that death at São Sebastião, "de idade de setenta annos", "casado com Maria Mendes" **[PROVEN, PAR-0100]**: he lived and died on Terceira. The Brazilian **Gaspar Ferreira** (P-0092), placed at Villa Rica by his son's recorded birth and baptism there, with that son marrying in 1783, is therefore a different man; the owner rejected the identification on 10 October 2026, and Gaspar de Souto Maior is now P-0131. What stays open is the separate family tradition that makes him the father of the Barbacena patriarch Francisco Ferreira Armonde (PUB-0002, ff. 55–56) **[LEAD]**, and whether Simplício José Ferreira Armond (P-0016) descends from that family at all **[OPEN]**.

  ## Sources held (this repository)

  - **PAR-0087** — his baptism, São Sebastião, ~9 January 1615 (B-1611-1687 p.0037); names his parents. *Primary.*
  - **PAR-0086** — his marriage to Mariana Fagundes, Santa Bárbara, 26 September 1650 (3 images: context, act, context). *Primary, damaged and partly legible.*
  - **PAR-0088** — his burial, São Sebastião, 26 June 1687 (O-1642-1696 p.0068); records the Alferes de ordenanças rank; officiant Vicar Domingos Cardoso Fora. *Primary.*
  - **PAR-0089** — his wife's burial, 7 July 1684, which names him as "o Alf.es Balchior de Ponte" (earlier misread "M° Balchion de Ponte"; corrected 2026-10-08). *Primary.*
  - **PAR-0097 / PAR-0098** — his parents' burials, 19 August 1652 and 27 December 1654, from the same register. They do not name Belchior, but they fix his father's surname as Ponte Cardoso and prove that the parish vicar was his brother. *Primary, context.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0095 / 0096** — the baptisms of six of his children, 1651–1666, each naming him as father. *Primary.*
  - **PAR-0099** — the baptism of his son Gaspar de Souto Maior (P-0131), São Sebastião, 23 December 1657 (BPAR 300-dpi scan of B-1611-1687, image 0324), naming him "Alferes belchior da ponte cardozo". *Primary.* [Added 2026-10-10.]
  - **PAR-0094** — the register pages probed for the compiled Maria of 1662; they do not attest her (the legible entry is another family's António, 12 June 1662; a facing-page entry is illegible). *Primary, inconclusive for this family.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: his dates, rank, both marriages, residence and the full child list. *Secondary, compiled.*
  - **PUB-0004** — the same compilation, Vol. IV, FAGUNDES § 6º, pp. 312–313, which records the 1650 marriage from his wife's side. *Secondary, compiled.*

  ## Regional and migration context

  **The island he was born on [CONTEXTUAL].** Terceira had been settled since about 1450, and by 1615 carried a dense population on a finite island. Its economy ran on wheat exported to mainland Portugal and the African presidios, on the blue dye *pastel* (woad) — already losing ground to American indigo — on wine and on shipbuilding timber. **Angra**, a city from 1534 and the seat of the Azores bishopric, was one of the mid-Atlantic's great ports of call, where the returning India and Brazil fleets watered and refitted. **São Sebastião**, Belchior's parish, was a rural *freguesia* in that city's orbit; **Santa Bárbara das Nove Ribeiras**, where he married, lies at the other end of the island.

  **Born under the Habsburgs, buried under the Braganças [CONTEXTUAL].** Belchior was baptised in January 1615, thirty-two years into the Spanish Habsburg union of the crowns (1580–1640). Terceira had been the last part of the Portuguese realm to hold out for D. António, Prior do Crato, and was taken only by the invasion of 1583; the Spanish crown then built the **Castelo de São Filipe** above Angra to garrison the island it had had to conquer. He was 25 at the Restoration of 1640, and 27 when the Castilian garrison finally capitulated on 4 March 1642 after an eleven-month blockade prosecuted by the *ordenanças* of Terceira and the other islands. He lived the rest of his life — forty-five years — in a restored Portuguese Terceira.

  **The emigration that came after him [CONTEXTUAL].** The push that carried Azoreans to Brazil — overpopulation on limited land, entail and primogeniture, periodic seismic disaster — met its pull when Minas Gerais gold was struck from 1697, ten years after Belchior's death. The Crown imposed passport controls in 1720 precisely to slow the drain. That is not his story: Belchior never left the island, and neither did his son Gaspar — the compiled record keeps Gaspar at São Sebastião at least until 1701, when the last of his children was baptised there, and his own death act records his death there in 1727 (PAR-0100). Whether a grandson crossed to Minas is the family tradition of the Barbacena Ferreira Armonde (PUB-0002) **[LEAD]**, not a documented fact. [Corrected 2026-10-10.] The **casais açorianos** Crown settlement scheme (1748–1756, directed at southern Brazil) is a different and later programme and is *not* this family's route.

  ## Where to go today

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — where he was baptised in 1615, where six of his children's held baptisms took place, and where he was buried in 1687. The one place that holds his whole life. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — where he married Mariana Fagundes on 26 September 1650. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds the originals of every register cited here: TER-AH-SAOSEBASTIAO-B-1611-1687, TER-AH-SAOSEBASTIAO-O-1642-1696 and the Santa Bárbara *casamentos*. The place to request the higher-resolution scans listed under Open questions. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
  - **Belo Jardim, termo da vila da Praia (Praia da Vitória), Terceira** — the residence named by Mendes Forjaz. The exact site is not fixed by any held record. [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Praia%20da%20Vit%C3%B3ria%2C%20Terceira%2C%20A%C3%A7ores)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** A vida dele é emoldurada por duas imagens paroquiais separadas por 72 anos: o assento de baptismo de São Sebastião, de ~9 de janeiro de 1615 ("Belchior fo[i filho] a Manoell de Ponte e de sua molher Maria da Cota", PAR-0087, livro B-1611-1687 p.0037) e o assento de óbito de São Sebastião, de 26 de junho de 1687 (PAR-0088, livro O-1642-1696 p.0068). Pouquíssimas pessoas deste arquivo estão documentadas nas duas pontas da vida por registo original.

  - **[PROVEN]** Os registos nunca fixam um único nome para ele. Nos assentos disponíveis aparece como "belchior de Ponte cardozo" (1651, 1652), "belchior de Ponte" (1654), "Belchior [da Ponte] Cardoso" (1656), "Melchior de Ponte" (1664) e "melchior de Ponte Cardozo" (1666), "Belchior de Ponte Cardozo" no corpo do próprio óbito, com "Balchior / de Ponte" na margem, e "Balchior de Ponte" no óbito da mulher; Mendes Forjaz acrescenta o alias "Belchior da Ponte Souto-Maior" **[COMPILED]**. [Corrigido em 2026-10-08 após releitura direta das imagens: versões anteriores davam "Cardogo", "Balchios", "Balchion" e, para 1666, "Mathias".] O apelido ainda era fluido — o escrivão escrevia o que ouvia.

  - **[PROVEN]** Era **Alferes de ordenanças** — a patente está lançada no próprio assento de óbito primário, e não apenas na compilação.

  - **[PROVEN]** Seis baptismos de filhos estão disponíveis como imagens originais, de Maria em 5 de setembro de 1651 (PAR-0090) a Isabel em 19 de setembro de 1666 (PAR-0096) — quinze anos da vida de uma casa num só livro. [Corrigido em 2026-10-08: antes "sete"; o PAR-0094, antes contado, é o baptismo de uma criança de outra família.] [Acrescentado em 2026-10-10: há agora também um sétimo — o próprio baptismo do filho Gaspar, de 23 de dezembro de 1657 (PAR-0099), que o nomeia "Alferes belchior da ponte cardozo".]

  - **[COMPILED]** O Vol. IX de Mendes Forjaz nota que o próprio Belchior assinara o assento de óbito anterior, lavrado a 6 de junho de 1687, vinte dias antes do seu — donde o compilador infere morte repentina. **[INFERRED a partir de COMPILED]** Se o compilador leu bem essa assinatura, Belchior era alfabetizado e ainda actuava em função paroquial no mês em que morreu. Não verificámos a assinatura na imagem.

  - **[PROVEN + CONTEXTUAL]** A casa tirava os nomes dos filhos dos três Reis Magos: o irmão era Baltazar (bapt. 1612), ele era Belchior (bapt. 1615) e o seu próprio filho foi Gaspar (bapt. 23 de dezembro de 1657, PAR-0099; P-0131); o padrinho no baptismo de 1615 foi um "Baltezar" (apelido não registado). O conjunto de nomes dos Magos era convenção corrente nas ilhas, e é por isso que Belchior/Baltazar/Gaspar reaparecem tanto nesta linha.

  - **[PROVEN, 2026-09-24]** O irmão era o vigário de São Sebastião. Os assentos de óbito dos pais, lidos neste ciclo, estão escritos em primeira pessoa pelo sacerdote officiante: uma nota marginal de três linhas no assento de 1652, "M.el de Pon / te Cardozo / **meu pai**" (PAR-0097), e a abertura do assento de 1654, "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). O que aqui era inferência está agora documentado: o pároco de longa duração era o próprio irmão de Belchior, identificado pelo PUB-0005 e pelas assinaturas vizinhas como **António Coelho Souto-Maior** (bapt. 13 de fevereiro de 1619, f.17 de julho de 1686). Belchior deu o nome dele a um filho, em 1654.

  - **[COMPILED]** Casou duas vezes: primeiro com Bárbara Gato (registada *S.g.* — sem geração sobrevivente, sem data e sem registo), depois com Mariana Fagundes a 26 de setembro de 1650. O casal viveu no **Belo Jardim, termo da vila da Praia**.

  ## Identidade

  **Belchior da Ponte Cardoso** — baptizado ~9 de janeiro de 1615, São Sebastião, Terceira **[PROVEN, PAR-0087]**; falecido e sepultado a 26 de junho de 1687, São Sebastião **[PROVEN, PAR-0088]**. Filho de **Manuel da Ponte Cardoso** (P-0125) e **Maria da Costa Leonardes** (P-0126), família F-0063 — filiação nomeada no próprio assento de baptismo como "Manoell de Ponte e … sua molher Maria da Cota" **[PROVEN]** e declarada de forma independente pelo Vol. IX de Mendes Forjaz **[COMPILED]**. (A compilação encabeça o pai como "Manuel da Ponte Valadão"; nenhum registo usa essa forma, e este repositório deixou de a usar como nome dele a 24 de setembro de 2026.) Casou com **Mariana Fagundes** (P-0124) a 26 de setembro de 1650, em Santa Bárbara **[PROVEN, PAR-0086]**; família F-0062.

  - **Patente:** Alferes de ordenanças **[PROVEN, PAR-0088; também PUB-0005]**
  - **Residência:** Belo Jardim, termo da vila da Praia **[COMPILED, PUB-0005]** — não confirmada por nenhum assento disponível
  - **Nacionalidade:** portuguesa (os Açores eram território da Coroa, não uma entidade política à parte)
  - **Data de baptismo:** a imagem lê-se ~9 de janeiro; o PUB-0005 dá 10 de janeiro. A diferença de um dia é preservada, não aplanada — ver Questões em aberto.

  **Lugar no arquivo [corrigido em 2026-10-10].** Belchior **não é ancestral provado** do proprietário do arquivo. Pertence ao **tronco Armond terceirense** como pai de Gaspar de Souto Maior (P-0131), cujo próprio assento de baptismo, de 23 de dezembro de 1657, o nomeia "Alferes belchior da ponte cardozo" **[PROVEN, PAR-0099]**. A tradição familiar — a tese de Lacerda de 2010 (PUB-0002, f. 55–56), seguindo um material genealógico digitado e particular de 2008, de Paulo Ribeiro Luz, e o testamento de 1751 que cita — faz desse Gaspar o pai de Francisco Ferreira Armonde (f. 1751), patriarca dos Ferreira Armonde de Barbacena, e portanto de Belchior o avô paterno do patriarca **[LEAD]**; só os nomes dos pais vêm do testamento citado, os avós vêm do material digitado. Essa família só se ligaria ao proprietário do arquivo pelos pais desconhecidos de Simplício José Ferreira Armond (P-0016) **[OPEN]**. Nenhum dos dois elos está provado. Até 10 de outubro de 2026 a árvore fazia passar esta linha, em vez disso, por Gaspar Ferreira (P-0092), de Vila Rica, do lado Toledo, e contava Belchior como 5.º bisavô (*5th-great-grandfather*) de Geraldo Paz Armond (P-0004); essa identificação foi rejeitada (decisão do proprietário, 2026-10-10) — Gaspar de Souto Maior foi baptizado em São Sebastião em 1657 e ali faleceu a 2 de dezembro de 1727, com cerca de setenta anos (PAR-0100), décadas antes de o filho de Gaspar Ferreira nascer em Vila Rica — e o grau fica retirado.

  ## Posição social e profissão

  Nenhum ofício, propriedade ou testamento está documentado para ele. O que os registos dão é patente e posição paroquial.

  - **Alferes de ordenanças [PROVEN].** As *ordenanças* eram o terceiro e mais baixo escalão da organização militar portuguesa — uma reserva territorial levantada freguesia a freguesia, cujos oficiais eram moradores locais servindo sem soldo **[CONTEXTUAL]**. A patente de alferes era, portanto, marca de posição entre as famílias principais da freguesia, e não um salário ou uma carreira. Isto importa para ler a trajetória posterior da família: é *estatuto sem base salarial por baixo*, que se transmite como precedência, não como capital.
  - **Alfabetização [INFERRED a partir de COMPILED].** Só a nota de rodapé do Vol. IX (a assinatura no assento de 6 de junho de 1687) aponta nesse sentido. Não verificada por nós.
  - **Riqueza [OPEN].** Nada do que temos documenta terras, rendas, pessoas escravizadas, gado ou inventário. O único sinal de propriedade é o nome da residência compilado, Belo Jardim.
  - **Um marcador indirecto [PROVEN, PAR-0089].** A mulher foi sepultada *dentro* da igreja, na "sepultura da fabrica, segunda fiada nona" — cova numerada pertencente à fábrica da paróquia. A sepultura no corpo da igreja era privilégio pago **[CONTEXTUAL]**, logo a casa podia suportar esse custo. Situa-os na camada superior da freguesia; não os torna nobres, e nenhum registo disponível lhes atribui nobreza.

  ## Família e rede social

  - **Pais:** nomeados no próprio baptismo **[PROVEN]** — o assento que torna a sua filiação primária, e não compilada.
  - **Casamento:** em **Santa Bárbara**, freguesia da noiva, a 26 de setembro de 1650 **[PROVEN, PAR-0086]** — o padrão português normal de casar na freguesia da noiva **[CONTEXTUAL]**, e a razão pela qual este assento está num livro de outra paróquia. O assento tem danos de água e tinta; o índice marginal lê "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes", enquanto a cláusula de filiação e as testemunhas só são parcialmente legíveis.
  - **Filhos:** Mendes Forjaz lista nove com Mariana **[COMPILED]**; seis desses baptismos estão disponíveis em imagem **[PROVEN]** — Maria (1651, PAR-0090), Manuel (1652, PAR-0091), António Coelho Souto-Maior (1654, PAR-0092; escrito "Ant.º"), outro Manuel (1656, PAR-0093), Belchior (1664, PAR-0095; escrito "Melchior") e Isabel de Souto-Maior (1666, PAR-0096; escrito "Izabel"). [Acrescentado em 2026-10-10: há agora também um sétimo, o de Gaspar de Souto Maior, de 23 de dezembro de 1657 — PAR-0099; P-0131.] A Maria compilada de ~18 de maio de 1662 não tem imagem de baptismo disponível **[COMPILED]** — o PAR-0094, antes lido como dela, é o baptismo de António, filho de Gregório Cardozo (corrigido em 2026-10-08). **[INFERRED]** O nome Manuel é usado duas vezes, com quatro anos de intervalo, o que neste período quase sempre significa que o primeiro morrera; não há assento de óbito disponível para ele.
  - **Padrinhos [PROVEN, com leituras incertas].** Relidos nas imagens em 2026-10-08: o Capitão André Coelho [?] Fagundes e Maria de Ponte (1651); o Padre André Machado e Ignes Machada, filha do Capitão António Machado (1652); Francisco ("Fr.co") Cardozo de Ponte (1654); António Cardozo (1664); e o Alferes Pedro Lourenço, das Novas Ribeiras, com Izabel de Souto (1666). Vários vêm de dentro da parentela — Ponte, Cardozo, Fagundes, Souto — ao lado de padrinhos de patente e clérigos, sinal de posição numa pequena freguesia insular **[INFERRED]**. [Corrigido em 2026-10-08: antes lidos "Asceto André Coelho" (1651) e "[?] Cardos da Ponte" (1654).]
  - **Um padre em casa — agora documentado [PROVEN].** O Vol. IX dá a Belchior um irmão, **António Coelho Souto-Maior** (bapt. 1619, f. 17 de julho de 1686), *padre vigário* da Matriz de São Sebastião **[COMPILED]**. Que o vigário da freguesia era filho dos pais de Belchior está agora **[PROVEN]** por duas declarações em primeira pessoa no livro de óbitos: a margem do assento do pai, em 1652, "M.el de Pon / te Cardozo / meu pai" (PAR-0097), e o corpo do assento da mãe, em 1654, "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu pai" (PAR-0098). **[INFERRED — identificação]** Qual dos filhos não vem dito nesses dois assentos, assinados apenas "o Vig.º So[u]tomaior": os assentos vizinhos de 1652 são assinados "o Vig.º Ant.º Coelho Sotto[ma]yor", o vigário que sepultou Mariana em julho de 1684 assina **Antônio Coelho Sotomayor** **[PROVEN, PAR-0089]**, e o PUB-0005 nomeia um único sacerdote entre os filhos do casal. Logo, o irmão é António. De forma coerente, o vigário que sepultou o próprio Belchior em junho de 1687 é outro, **Domingos Cardoso Fora** **[PROVEN, PAR-0088]**: o irmão morrera no ano anterior. O filho baptizado em 1654 leva exactamente o nome do tio padre. **[NOTA]** O handoff do agente de recolha de 2026-09-24 chamou ao vigário "Manoel Coelho Souto Maior"; as imagens não sustentam esse nome — o "M.el" na margem de 1652 é o nome próprio do *pai defunto*.
  - **Sogros:** a casa Fagundes/Machado de Santa Bárbara, chefiada pelo **Capitão de ordenanças António Martins Fagundes** (P-0127) **[COMPILED]**.

  ## O que podemos extrapolar

  **Um casamento entre duas casas de oficiais de milícia [INFERRED].** Belchior tinha patente de alferes; o sogro está registado como capitão de ordenanças e o avô da mulher como capitão de uma companhia de 79 homens **[COMPILED]**. A união de 1650 juntou, portanto, as famílias de oficiais de duas freguesias — São Sebastião, a sudeste, e Santa Bárbara, a oeste — e não dois vizinhos. No sistema das ordenanças, em que a patente acompanhava a posição local, isso é o equivalente insular de um casamento de consolidação de estatuto.

  **Estatuto que não se herdava como dinheiro [INFERRED + CONTEXTUAL].** Tudo o que os registos creditam a esta casa — uma patente sem soldo, um irmão no vicariato, uma cova paga dentro da igreja — é *precedência*, não capital. A precedência tem de ser reconquistada a cada geração; não se divide e não se transmite. É esse o mecanismo a observar se, como diz a tradição familiar, esta linha reaparece na fronteira das Minas, duas gerações depois — como os Ferreira Armonde de Barbacena —, sem terra insular por trás **[LEAD]**.

  **Uma casa maior do que a ilha podia acomodar [INFERRED + CONTEXTUAL].** Nove filhos registados numa ilha finita e povoada há dois séculos é o ponto central. O regime fundiário da Terceira prendia os bens vinculados (*morgadios*) aos filhos primogénitos, enquanto a propriedade não vinculada se dividia; de qualquer modo, os filhos mais novos de uma casa de nove tinham de procurar a Igreja, a milícia, um casamento ou o mar **[CONTEXTUAL]**. A própria família documentada de Belchior mostra essa dispersão: filhos falecidos *solteiros*, uma filha casada em 1693, um tio no vicariato e — no conjunto de irmãos da mulher — um cunhado registado apenas como "que saiu da Terceira" **[COMPILED]**. Se a tradição familiar se confirmar, a emigração açoriana que levou um neto seu às Minas é a mesma pressão, uma volta depois.

  **De onde pode vir "Souto Maior" [STRONG LEAD — não provado].** Documentado agora o irmão como o vigário da freguesia que assinou durante décadas como Souto Maior, a leitura óbvia é que o filho de Belchior, **Gaspar de Souto Maior** (P-0131), tomou o nome de casa ao tio padre. O próprio baptismo de Gaspar está agora disponível **[PROVEN, PAR-0099]**: a digitalização a 300 dpi do original, feita pelo BPAR (São Sebastião B-1611-1687, a folha que o CDN serve como imagem 0324), data-o de 23 de dezembro de 1657 — o Vol. IX imprime 23 de fevereiro de 1657 **[COMPILED]**, um lapso —, nomeia-o "filho do Alferes belchior da ponte cardozo e de sua molher mariana Fag.des" e é assinado por esse tio, "Vig.ro Ant.o Coelho Soto mayor". Mas o mesmo assento nomeia como padrinho "Gasp.ar de Souto mayor f.o de Ba[?]… Leonardes" — um homem que já tinha o nome completo da criança —, pelo que o nome pode igualmente ter vindo do padrinho **[INFERRED]**. A transmissão continua pista, não achado. Não afirmar como facto. [Corrigido em 2026-10-10: o texto anterior dizia que nenhum registo do baptismo de Gaspar estava catalogado aqui e ligava-o a P-0092; o baptismo é agora o PAR-0099, Gaspar de Souto Maior é P-0131, e a sua identificação com Gaspar Ferreira (P-0092) foi rejeitada.]

  **O que não devemos dizer.** "Souto-Maior" e "Ponte Cardoso" soam a apelidos de armas, tal como o "Valadão" que o compilador atribui ao pai. Nenhum registo disponível concede a esta família armas, *foro*, *morgadio* ou tratamento de *Dom*; a genealogia compilada coloca-os numa parentela terceirense documentada, mas não os enobrece. Nada aqui deve ser lido como nobreza — e nenhuma origem ou posição deve ser lida a partir de um apelido.

  ## Questões em aberto

  - **Data de baptismo: ~9 ou 10 de janeiro de 1615.** O PAR-0087 lê ~9 de janeiro; o PUB-0005 dá 10 de janeiro; o E-0126 mantém 10 de janeiro como canónico, com a discrepância registada. Provavelmente convenção scribal (assento lavrado no dia seguinte), mas não resolvido. Registo decisivo: digitalização em maior resolução de TER-AH-SAOSEBASTIAO-B-1611-1687 p.0037, no BPAR de Angra.
  - **PAR-0096 (1666) — o problema "Mathias" fica retirado.** Uma leitura anterior dava o prenome do pai como "Mathias"; a imagem lê "do Alferes melchior de Ponte Cardozo" (e a mãe "marianna Fa-gundes"). Melchior é variante de época de Belchior, também usada no PAR-0095, pelo que o assento é dele sem ressalva. [Corrigido em 2026-10-08 após releitura direta da imagem.]
  - **A Maria compilada de ~18 de maio de 1662 não tem baptismo disponível.** O PAR-0094 foi catalogado como dela, mas o seu assento legível "Ant.º" é o baptismo de António, filho de Gregório Cardozo, a 12 de junho de 1662, e o único outro candidato (um assento "M[?]" na página fronteira) é ilegível a 383×527 px. Uma digitalização em maior resolução da p.0352 e da página fronteira é o único teste. [Corrigido em 2026-10-08: antes mantido como **[PROBABLE]** para Maria.]
  - **O primeiro casamento, com Bárbara Gato.** Sem data, sem freguesia, sem registo — apenas o *S.g.* do Vol. IX **[COMPILED]**.
  - **O assento de casamento de 1650 só é parcialmente legível.** A cláusula de filiação parece nomear o pai da noiva ("[António?]") e a lista de testemunhas está ilegível. Uma nova digitalização do BPAR converteria a filiação de Mariana de compilada em provada e recuperaria as testemunhas — é a digitalização de maior valor para este casal.
  - **Terá servido no cerco de 1641–42 ao Castelo de São Filipe?** Tinha 26–27 anos, detinha (ou viria a deter) patente de *ordenanças*, e a força sitiante saiu exactamente dessa milícia **[CONTEXTUAL]**. Nenhum registo disponível o nomeia, e a patente de Alferes está atestada desde 1657 (PAR-0099), depois em 1664, 1666 e 1687 (PAR-0095, PAR-0096, PAR-0088) [corrigido em 2026-10-10: antes dizia "só em 1687"] — nenhum deles menciona o cerco. Não documentado — não assumir.
  - **Não foi localizado testamento, inventário ou registo de terra,** pelo que não se sabe se o Belo Jardim era próprio ou arrendado, vinculado ou partível.
  - **A questão dos "dois Gaspares" — RESOLVIDA em 2026-10-10: dois homens.** O Vol. IX lista um só Gaspar para este casal: Gaspar de Souto-Maior, baptizado em São Sebastião (imprime 23 de fevereiro de 1657; o próprio assento, PAR-0099, lê 23 de dezembro de 1657) e falecido a 2 de dezembro de 1727 — sem local impresso para o óbito. Casou com D. Margarida Machado no Convento da Graça, em Angra, a 2 de outubro de 1690, e em segundas núpcias com Maria Mendes de Borba em São Sebastião a 8 de fevereiro de 1694; três filhos do segundo casamento foram baptizados em São Sebastião em 1698–1701 **[COMPILED]**. O assento de óbito, agora disponível, regista essa morte em São Sebastião, "de idade de setenta annos", "casado com Maria Mendes" **[PROVEN, PAR-0100]**: viveu e morreu na Terceira. O **Gaspar Ferreira** brasileiro (P-0092), situado em Villa Rica pelo nascimento e baptismo ali registados do filho, que casou em 1783, é portanto outro homem; o proprietário rejeitou a identificação a 10 de outubro de 2026, e Gaspar de Souto Maior é agora P-0131. Fica em aberto a tradição familiar, distinta, que o faz pai do patriarca de Barbacena Francisco Ferreira Armonde (PUB-0002, f. 55–56) **[LEAD]**, e se Simplício José Ferreira Armond (P-0016) descende de todo dessa família **[OPEN]**.

  ## Fontes disponíveis (neste repositório)

  - **PAR-0087** — o seu baptismo, São Sebastião, ~9 de janeiro de 1615 (B-1611-1687 p.0037); nomeia os pais. *Primária.*
  - **PAR-0086** — o seu casamento com Mariana Fagundes, Santa Bárbara, 26 de setembro de 1650 (3 imagens: contexto, assento, contexto). *Primária, danificada e parcialmente legível.*
  - **PAR-0088** — o seu óbito, São Sebastião, 26 de junho de 1687 (O-1642-1696 p.0068); regista a patente de Alferes de ordenanças; officiante o Vigário Domingos Cardoso Fora. *Primária.*
  - **PAR-0089** — o óbito da mulher, 7 de julho de 1684, que o nomeia como "o Alf.es Balchior de Ponte" (antes lido "M° Balchion de Ponte"; corrigido em 2026-10-08). *Primária.*
  - **PAR-0097 / PAR-0098** — os óbitos dos pais, 19 de agosto de 1652 e 27 de dezembro de 1654, do mesmo livro. Não nomeiam Belchior, mas fixam o apelido do pai como Ponte Cardoso e provam que o vigário da freguesia era seu irmão. *Primárias, contexto.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0095 / 0096** — os baptismos de seis dos seus filhos, 1651–1666, cada um nomeando-o como pai. *Primárias.*
  - **PAR-0099** — o baptismo do filho Gaspar de Souto Maior (P-0131), São Sebastião, 23 de dezembro de 1657 (digitalização a 300 dpi do BPAR, B-1611-1687, imagem 0324), que o nomeia "Alferes belchior da ponte cardozo". *Primária.* [Acrescentado em 2026-10-10.]
  - **PAR-0094** — as páginas do livro sondadas para a Maria compilada de 1662; não a atestam (o assento legível é o António de outra família, 12 de junho de 1662; um assento da página fronteira é ilegível). *Primária, inconclusiva para esta família.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: datas, patente, os dois casamentos, residência e a lista completa de filhos. *Secundária, compilada.*
  - **PUB-0004** — a mesma compilação, Vol. IV, FAGUNDES § 6º, pp. 312–313, que regista o casamento de 1650 pelo lado da mulher. *Secundária, compilada.*

  ## Contexto regional e migratório

  **A ilha onde nasceu [CONTEXTUAL].** A Terceira estava povoada desde cerca de 1450 e, em 1615, sustentava população densa em território finito. A economia assentava no trigo exportado para o reino e para as praças africanas, no corante azul *pastel* — já a perder terreno para o índigo americano —, no vinho e na madeira de construção naval. **Angra**, cidade desde 1534 e sede do bispado dos Açores, era um dos grandes portos de escala do Atlântico médio, onde as armadas da Índia e do Brasil aguavam e se reparavam no regresso. **São Sebastião**, a freguesia de Belchior, era rural, na órbita dessa cidade; **Santa Bárbara das Nove Ribeiras**, onde casou, fica no extremo oposto da ilha.

  **Nascido sob os Habsburgos, sepultado sob os Braganças [CONTEXTUAL].** Belchior foi baptizado em janeiro de 1615, trinta e dois anos após o início da união dinástica com Espanha (1580–1640). A Terceira fora a última parcela do reino português a resistir por D. António, Prior do Crato, e só foi tomada pela invasão de 1583; a coroa espanhola ergueu então o **Castelo de São Filipe**, sobre Angra, para guarnecer a ilha que tivera de conquistar. Tinha 25 anos na Restauração de 1640 e 27 quando a guarnição castelhana capitulou, a 4 de março de 1642, após onze meses de cerco conduzido pelas *ordenanças* da Terceira e das outras ilhas. Viveu os restantes quarenta e cinco anos numa Terceira portuguesa restaurada.

  **A emigração que veio depois dele [CONTEXTUAL].** A pressão que levou açorianos ao Brasil — excesso de população em terra limitada, vínculo e primogenitura, desastre sísmico periódico — encontrou o seu ímã quando se descobriu ouro nas Minas Gerais, a partir de 1697, dez anos depois da morte de Belchior. A Coroa impôs controlo de passaportes em 1720 justamente para travar a sangria. Essa não é a história dele: Belchior nunca deixou a ilha, e o filho Gaspar também não — o registo compilado mantém Gaspar em São Sebastião pelo menos até 1701, quando o último dos seus filhos ali foi baptizado, e o próprio assento de óbito regista a sua morte ali em 1727 (PAR-0100). Se um neto passou às Minas é a tradição familiar dos Ferreira Armonde de Barbacena (PUB-0002) **[LEAD]**, não um facto documentado. [Corrigido em 2026-10-10.] O programa dos **casais açorianos** (1748–1756, dirigido ao sul do Brasil) é outro e posterior, e *não* é o caminho desta família.

  ## Onde ir hoje

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — onde foi baptizado em 1615, onde foram baptizados seis dos filhos com baptismo disponível e onde foi sepultado em 1687. O único lugar que contém a sua vida inteira. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
