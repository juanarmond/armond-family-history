profile: >-
  ## Interesting facts

  - Belchior da Ponte Cardoso was born approximately 9–10 January 1615 in S. Sebastião, Terceira
  (PAR-0087 — primary baptism register, p.0037), and died 26 June 1687 in S. Sebastião (PAR-0088
  — primary death register, p.0068) — a long life of 72 years on the island where he was born.

  - He held the rank of Alferes de ordenanças (Second Lieutenant of the colonial militia)
  — confirmed in the primary death register (PAR-0088); an officer-level rank attesting to
  family standing in 17th-century Azorean society.

  - **[COMPILED]** He married twice: first to Bárbara Gato (no surviving children), then to
  Mariana Fagundes on 26 September 1650 at the church of Santa Bárbara — the marriage that
  produced his line into Brazil.

  - **[COMPILED]** The couple lived at "Belo Jardim, termo da vila da Praia" — a named place
  in Terceira, distinct from the parish of S. Sebastião where their children were baptised.

  ## Identity

  **Belchior da Ponte Cardoso** — born ~9–10 January 1615, S. Sebastião, Terceira (PAR-0087,
  primary baptism register p.0037); died 26 June 1687, S. Sebastião (PAR-0088, primary death
  register p.0068). Also known as "Belchior da Ponte Souto-Maior." Son of Manuel da Ponte Valadão
  (P-0125) × Maria da Costa Leonardes (P-0126), family F-0063. Married Mariana Fagundes (P-0124)
  on 26 September 1650 at Santa Bárbara (PAR-0086); family F-0062.

  - **Military rank:** Alferes de ordenanças [PAR-0088, primary death register; PUB-0005]
  - **Residence:** Belo Jardim, termo da vila da Praia, Terceira [COMPILED, PUB-0005]
  - **Nationality:** Portuguese (born Azores, integral Portuguese territory)

  ## Standing and family

  Belchior's father Manuel da Ponte Valadão traces back to the Gaspar de Souto Cardoso /
  Catarina Valadão family (Vol. IX gen.3). The "Valadão" element of his father's name came
  from his grandmother. His officer rank and the family's documented multi-generation presence
  in S. Sebastião suggest solid established-colonist standing in Terceira.

  ## Open questions

  - Primary baptism record (10 Jan 1615 S. Sebastião): held as PAR-0087. One-day date
  discrepancy (primary reads ~9 Jan; PUB-0005 gives 10 Jan) — attributed to scribal
  convention; 10 Jan retained as canonical. Higher-resolution rescan would confirm.
  - Primary death record (26 Jun 1687 S. Sebastião): held as PAR-0088. Date confirmed;
  rank Alferes de ordenanças confirmed.
  - First marriage to Bárbara Gato: date and record unknown; the Vol. IX S.g. notation
  establishes no surviving children but no date is given.
  - The exact emigration path of his son Gaspar to Brazil is not established.
profile_pt: >-
  ## Fatos interessantes

  - Belchior da Ponte Cardoso nasceu aproximadamente a 9–10 de janeiro de 1615 em S. Sebastião,
  Terceira (PAR-0087 — registo paroquial primário de baptismos, p.0037), e faleceu a 26 de junho
  de 1687 em S. Sebastião (PAR-0088 — registo paroquial primário de óbitos, p.0068) — uma longa
  vida de 72 anos na ilha onde nasceu.

  - Detinha a patente de Alferes de ordenanças (2º tenente da milícia colonial) — confirmada no
  registo primário de óbitos (PAR-0088); patente de oficial que atesta o status familiar na
  sociedade açoriana do século XVII.

  - **[COMPILED]** Casou duas vezes: primeiro com Bárbara Gato (sem filhos sobreviventes),
  depois com Mariana Fagundes em 26 de setembro de 1650, na Igreja de Santa Bárbara — o
  casamento que originou sua linhagem no Brasil.

  - **[COMPILED]** O casal viveu no "Belo Jardim, termo da vila da Praia" — um lugar nomeado
  na Terceira, distinto da freguesia de S. Sebastião onde os filhos foram baptizados.

  ## Identidade

  **Belchior da Ponte Cardoso** — nascido ~9–10 de janeiro de 1615, S. Sebastião, Terceira
  (PAR-0087, registo primário de baptismos p.0037); falecido a 26 de junho de 1687, S. Sebastião
  (PAR-0088, registo primário de óbitos p.0068). Também conhecido como "Belchior da Ponte
  Souto-Maior." Filho de Manuel da Ponte Valadão (P-0125) × Maria da Costa Leonardes (P-0126),
  família F-0063. Casou com Mariana Fagundes (P-0124) a 26 de setembro de 1650 em Santa Bárbara
  (PAR-0086); família F-0062.

  - **Patente militar:** Alferes de ordenanças [PAR-0088, registo primário de óbitos; PUB-0005]
  - **Residência:** Belo Jardim, termo da vila da Praia, Terceira [COMPILED, PUB-0005]
  - **Nacionalidade:** portuguesa (nascido nos Açores, território português integral)

  ## Questões em aberto

  - Registo primário de baptismo (10 jan. 1615, S. Sebastião): disponível como PAR-0087.
  Discrepância de um dia (primário ~9 jan.; PUB-0005 indica 10 jan.) — atribuída a convenção
  scribal; 10 jan. mantido como data canónica.
  - Registo primário de óbito (26 jun. 1687, S. Sebastião): disponível como PAR-0088.
  Data e patente de Alferes de ordenanças confirmadas.
  - Primeiro casamento com Bárbara Gato: data e registo desconhecidos; a notação S.g. do Vol. IX
  confirma ausência de filhos sobreviventes, mas não fornece data.
  - O caminho exato de emigração do filho Gaspar para o Brasil não está estabelecido.
