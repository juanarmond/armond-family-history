- text: >-
    Antenor Muniz's 3×-great-grandfather: father of Bento José Fernandes (P-0141), of the lugar
    de Quintã, São Romão da Ucha. Named as paternal grandfather in eight baptisms of Bento's children,
    1829–1843 (PAR-0106, PAR-0113–PAR-0120), and as father in Bento's probable baptism of 1807
    (PAR-0109). "Ja defuntos" with his wife by 29 March 1837 (PAR-0116).
  text_pt: >-
    Tetravô de Antenor Muniz: pai de Bento José Fernandes (P-0141), do lugar de Quintã, São Romão
    da Ucha. Nomeado avô paterno em oito batismos dos filhos de Bento, 1829–1843 (PAR-0106, PAR-0113–PAR-0120),
    e pai no provável batismo de Bento em 1807 (PAR-0109). "Ja defuntos", ele e a esposa, em 29
    de março de 1837 (PAR-0116).
- text: >-
    Open conflict on his death: a baptism of 16 March 1839 on the same register opening as PAR-0118
    names a "Manoel Fernandes avo materno", of Quintão, alive and godfather to a grandson by Francisco
    d'Oliveira and Jozefa Maria. That may be a namesake couple of the same lugar (the retrieval
    side reports a Manoel Fernandes × Jozefa de Macedo there); it is recorded, not resolved, and
    no death event is modelled.
  text_pt: >-
    Conflito em aberto sobre o óbito: um batismo de 16 de março de 1839, na mesma abertura do
    livro que PAR-0118, nomeia um "Manoel Fernandes avo materno", de Quintão, vivo e padrinho
    de um neto de Francisco d'Oliveira e Jozefa Maria. Pode ser um casal homônimo do mesmo lugar
    (o lado da recuperação relata ali um Manoel Fernandes × Jozefa de Macedo); fica registrado,
    não resolvido, e nenhum evento de óbito é modelado.
- text: >-
    His own baptism is not modelled: PAR-0112 (13 October 1771, Manoel, son of Constantino Fernandes
    de Oliveira and Roza Maria, of Quintam) is only a hypothesis for him, so it carries no event
    and the grandparents it names are not modelled.
  text_pt: >-
