profile: >-
  ## Interesting facts

  - **[PROVEN]** His Swiss and Solothurn origin is fixed by his own 1825 Nova Friburgo
  marriage record (PAR-0059): the parish register calls both spouses "colonos suiços" of the
  "Cantão de Soleure" and records Jacob as "baptizado na freg.a de Erswill". Origin here is a
  stated fact in a primary record, not an inference from the surname.

  - **[PROVEN / CORRECTION 2026-09-23]** That parish name is a misread. The Staatsarchiv
  Solothurn (archivist Gasche Erich, correspondence C-011) confirmed and exhausted the
  Erschwil Catholic holdings — three binder sets — with **no baptism for this Jacob Borer**: a
  bounded negative on Erschwil. The register's "Erswill" is **Beinwil**, a separate Canton
  Solothurn parish. Every Erschwil search for his baptism is therefore closed as a search of
  the wrong parish.

  - **[LEAD]** The Beinwil baptism itself has **not** been retrieved. The date in circulation
  — 13 December 1801 — comes from a FamilySearch collaborative tree (L85Q-RY2) and is
  navigation only; no held record gives his birth date.

  - **[PROVEN]** He was dead before 1888: his son Francisco José's registered will names him
  "Jacob Bahrer … já fallecido" (PRB-0005). But a gap-free read of the Nova Friburgo óbito
  register 1832–1853 does not contain him, while his son João José was born 10 September 1840
  — so he was alive into ~1840 and died **outside** Nova Friburgo, in the branch's drift
  toward the vale do Macaé / Bom Jardim.

  - **[CONTEXTUAL]** The 1819 scheme assigned each settler household a house-and-lot. Jacob's
  was **Casa 70 / Lote 56** — the marker that keeps him apart from Laurent Borer of Grindel
  (P-0068, Casa 73 / Lote 86), a co-passenger on the same *Heureux Voyage* whose Borer line is
  documented as distinct from his.

  - **[CONTEXTUAL]** "Borer" in Switzerland and in the earliest colony records becomes
  **"Bohrer"** in Brazil — the Portuguese ear writing a Swiss-German name. Borer → Bohrer
  across Jacob, his son Francisco José and his grandson Joaquim José is the family's
  three-generation assimilation written into the spelling of its own name.

  ## Identity

  **Jacob Bohrer** — the family's stabilised spelling; his son's 1888 will writes **"Jacob
  Bahrer"** and the Nova Friburgo compilation "Jacob Borer" [PROVEN for the name forms]. He is
  the Bohrer line's immigrant-boundary ancestor: father of Francisco José Bohrer (P-0034), and
  so paternal grandfather of Joaquim José Bohrer (P-0030), through whom the line reaches
  Celina Bohrer (P-0015) and Iris Bohrer (P-0007).

  - **Parents:** João Borer (P-0096) × Barbara Probst (P-0097), named in his own 1825 marriage
  as the parents of whom he was "filho legitimo" [PROVEN — PAR-0059]. Neither emigrated;
  nothing further about them is held.

  - **Origin:** Swiss, Canton Solothurn (Soleure) — **primary-confirmed** by PAR-0059 (event
  E-0115). The **baptism parish is Beinwil**, not Erschwil: the register's "Erswill" is a
  misread, and Erschwil is now a bounded negative after the Staatsarchiv Solothurn search of
  2026-09-23 (C-011) [PROVEN for the canton; PROVEN for the Erschwil negative; the Beinwil
  reading rests on that correction]. The *Imigrantes de Nova Friburgo* compilation and the
  Casa Suíça database give a birth c.1801 [LEAD], and a Nova Friburgo settler register
  (GOV-0007) lists him on the Casa/Lote 70/56 opening as "Jacques [Jacob] Bocher, [17]" — a
  roster age (→ ~1803) within about two years of that, preserved as a discrepancy, not
  adopted.

  - **Death:** before 1888 [PROVEN — PRB-0005]. Alive into ~1840; absent from the gap-free
  Nova Friburgo óbito read of 1832–1853; therefore died outside Nova Friburgo after ~1840
  [PROVEN for the bounded negative; INFERRED for the place]. The compilation's "died 1843–44
  at Nova Friburgo" is positively excluded. He did sell his Nova Friburgo property on 24 April
  1843 [LEAD] — his last dated act there.

  - **Marriage and children:** married Catharina Mayer / Moser (P-0051) at Nova Friburgo on 8
  August 1825 (PAR-0059; E-0115), before the vicar Jacob Joye, with João Probst and Isabel
  Sch[oser — uncertain] as witnesses. Father of at least Francisco José Bohrer (P-0034, b. 9
  July 1832) [PROVEN — PAR-0054, PRB-0005]. PUB-0003 credits the couple with nine children,
  two dying in infancy [LEAD].

  ## Standing and profession

  - **No rank, office or title appears in any held record.** What the documents give him is an
  allotment and a trade — nothing that carries a title and nothing that could be inherited as
  status.

  - **Trade:** the Casa Suíça database calls him an *açougueiro* (butcher) [LEAD]. Against
  that, the retrieval agent's notes record a July 1838 Nova Friburgo Lutheran baptism in which
  the godfather is written "Jacob Bohrer, **Schuhmacher** … nebst seiner Gattin Catharina geb.
  Moser" — a shoemaker, and a sighting that also places him alive and resident in the town in
  1838. That sighting is **not catalogued in this repository** (no image held), so both
  readings stand as leads and the butcher/shoemaker question is open [LEAD for both].

  - **Property:** one colonist house-and-lot, Casa 70 / Lote 56 (PUB-0003, GOV-0007) [LEAD for
  the allocation], sold 24 April 1843 [LEAD]. His widow is very probably the "Viúva Catharina
  Bohrer" of the 1855 Nova Friburgo land registry [LEAD] — so the household held land, but a
  single poor serra lot's worth of it.

  ## Family and social network

  - **Wife:** Catharina (P-0051), married 1825. Her father José Moser and a Maria Moser stood
  as godparents at their son Francisco José's 1832 baptism (PAR-0054) — the Moser in-laws, who
  emigrated as an intact family, were the household's nearest kin network in the colony.

  - **Witnesses and godparents are all Solothurn colonists:** João Probst at the 1825 wedding
  (a probable kinsman of his mother Barbara Probst), the Mosers at the 1832 baptism. The
  social world the records show is the transplanted Solothurn cohort and no one outside it.

  - **Children:** Francisco José (P-0034) is the only one attested at primary level here.
  PUB-0003 adds Catharina (1830, ⚭ Frederico Chaboudez), Maria (1834, ⚭ Francisco Xavier
  Chaboudez), Augusto (1837) and João José (1840–1859), and counts nine in all [LEAD]. Two
  daughters marrying two Chaboudez brothers is the same sibling-pair endogamy the Borer and
  Wehrli branches show.

  - **Not kin to the other Borer:** Jacob (Beinwil/Erschwil-recorded, Casa 70/56) and Laurent
  Borer (Grindel, Casa 73/86, P-0068) sailed on the same ship, but the two 1820 and 1825
  marriage registers name different fathers from different villages, and the compilation
  states outright "não há evidência de parentesco próximo entre os dois grupos." Do not
  conflate them [PROVEN that the fathers differ; the kinship question stays OPEN].

  ## What we can extrapolate

  - **Standing: self-made from zero, and never more than modest [INFERRED].** No held record
  gives Jacob rank, office, title or literacy. He inherited nothing — the compilation has both
  parents dead in Switzerland before the 1819 departure [LEAD], and even if they lived, a Jura
  smallholding divided among heirs had nothing to send abroad. Whatever he had he was *given*
  by a state scheme or made with his hands. That makes him the cleanest case in this tree of
  status that is neither inherited, nor bought by office, nor married in — and the exact
  structural inverse of the family's Armond line, which started at a married-in,
  office-holding elite and fell. There was no fortune here to lose, because there was never
  one.

  - **Wealth mechanics: a two-year state package, then a trade — neither of them heritable
  capital [CONTEXTUAL — role-based].** The 1819 colonist's material base was fixed by Dom João
  VI's *Decreto de 16 de maio de 1818*: a lot and a built house, rations, seed and livestock,
  and a daily cash subsidy of 0$160 falling to 0$080 over a two-year establishment period. The
  first-year subsidy annualises to roughly 58$000 — about one-seventh of a free rural
  labourer's ~420$000 a year. That is a deliberately bare floor: enough to keep a family alive
  while it cleared a stony hillside, and designed to stop. When it stopped, a colonist had a
  poor lot and whatever trade he carried. A shoemaker's or butcher's bench is income that ends
  with the man; the lot was liquid enough to be sold in a single 1843 transaction. Nothing in
  that structure compounds.

  - **Partible inheritance cut both ends of his life [CONTEXTUAL].** The Solothurn Jura
  practised real division of holdings among heirs; too many heirs for too little arable upland
  is precisely why recruiters found takers there in 1818–19. Jacob left that system only to
  enter a stricter one: Brazilian succession also divided estates equally among all children,
  and the compilation credits him with nine. One poor serra lot ÷ nine, then each ninth ÷
  again in the next generation, forecloses accumulation arithmetically. The push that moved
  him and the ceiling that held his descendants down are the same mechanism on two continents.

  - **Education: the one asset that crossed the Atlantic intact [CONTEXTUAL / INFERRED].** In
  19th-century Brazil schooling was a purchased, class-linked privilege that had to be
  re-bought each generation; there was no free rural school. The Solothurn and Hessen
  colonists arrived carrying something Brazil did not sell — Catholic parish-school literacy
  in German — and on Jacob's branch it held: his son Francisco José dictated but **signed**
  his own 1888 will ("no qual me assigno"), and Francisco José's sons Guilherme Samuel and
  Fernando reached office, commerce and, in Guilherme's case, the proprietorship of a Nova
  Friburgo newspaper. That is a literate branch, not a lettered elite: letters here bought a
  foothold in town trade and local office, not land.

  - **What the 1888 will shows about the scale of it [INFERRED from PRB-0005].** Read for its
  silences, his son's will is the clearest measure of what Jacob's household finally amounted
  to. It names four minor children as sole heirs, a wife as first executor and tutor, twenty
  masses for Jacob and Catharina, and a 50$000 legacy to a chapel being built at the Suspiro —
  and, as transcribed, it names **no** land, no business and no enslaved people. In the year
  of abolition, a propertied Brazilian testator would list both. This is a respectable town
  household with something to leave and nothing to entail.

  - **Migration changed the form of poverty, not the fact of it — and the branch then split
  [INFERRED].** The move converted Jura land-hunger into a poor colonial lot: a lateral step,
  with the gain being title to land rather than the quality of it. The real turning point
  comes one generation later and is a *change of sector*, not of fortune: after the 1843 sale
  the branch leaves the colony lot and reappears in town, and Jacob's son and grandsons live
  by commerce, letters and local office rather than by farming. Compare the parallel Grindel
  Borer line (P-0068), which stayed on the land: there the grandson Valentim Martinho was a
  *lavrador* who in 1891 had his daughter's birth registered "a rogo … por não saber escrever"
  (CIV-0045). Same colony, same starting floor, two outcomes — and the divergence tracks
  town-trade-and-letters against rural land.

  - **The arc, named [INFERRED].** Land-poor Jura peasant (pre-1819) → state-settled colonist
  on Casa 70 / Lote 56 (1819–1843) → the lot sold and the branch drifts out of Nova Friburgo
  (1843 →) → a literate, modestly propertied town household in his son's generation (1888
  will) → a petty-bourgeois wing of office and press in his grandsons' (1890s–1900s).
  Flat-to-slightly-up throughout, never elite. The two Solothurn Borer trunks — his and
  Laurent's — reconverge a century later in the Bohrer × Bohrer marriage of Iris Bohrer's
  parents, which is why the undocumented question of whether he and Laurent were kin still
  matters.

  ## Open questions

  - **His Beinwil baptism** — the next action, and the record that would give his birth date
  and his parents at primary level. Search Beinwil, Canton Solothurn (Kantonsarchiv /
  Staatsarchiv Solothurn or the equivalent microfilm). **Do not re-search Erschwil**: that is
  a closed bounded negative (C-011, 2026-09-23). [OPEN]

  - **His death record and any inventário.** The decisive record: it would fix the death date,
  settle his wife's maiden surname and name his full child set. The Nova Friburgo óbito
  register is a bounded negative for him 1832–1853, so look **outside** Nova Friburgo — the
  Macaé / Bom Jardim parishes and civil registries into which the branch drifted. [OPEN]

  - **His trade.** A held image of the July 1838 Nova Friburgo Lutheran baptism would turn the
  "Schuhmacher" sighting into evidence and decide it against the database's "açougueiro".
  [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (his own 1825 Nova Friburgo marriage — names both spouses "colonos suiços" of the
  Cantão de Soleure, his parents João Borer × Barbara Probst, and his baptism parish as
  written "Erswill"; sources event E-0115).

  - PRB-0005 (his son Francisco José Bohrer's 1888 registered will — names him "Jacob Bahrer …
  já fallecido").

  - PAR-0054 (his son Francisco José's 1832 Nova Friburgo baptism — names him and Catharina
  Moser as the parents; godparents José and Maria Moser).

  - GOV-0007 (Nova Friburgo colonist settler register — lists "Jacques [Jacob] Bocher, [17]"
  on the Casa/Lote 70/56 opening; roster age preserved as a discrepancy).

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER I — secondary compilation: birth c.1801,
  Casa/Lote 70/56, nine children, *açougueiro*, property sold 24 April 1843).

  - Not held: the 1838 Nova Friburgo Lutheran baptism naming "Jacob Bohrer, Schuhmacher"
  (retrieval-agent note, no image), and the 1855 Nova Friburgo land registry entry "Viúva
  Catharina Bohrer" — both leads.

  ## Regional and migration context

  Jacob belongs to the 1819 Swiss colonisation of Nova Friburgo, recruited out of the
  Catholic, German-speaking Solothurn Jura — the Schwarzbubenland of the Thierstein district,
  poor upland farming country where holdings were divided among heirs until there was too
  little land for too many people. [CONTEXTUAL] The push was the 1815 Tambora eruption and the
  1816 "Year Without a Summer" famine landing on a continent already impoverished by the
  Napoleonic wars; the pull was Dom João VI's *Decreto de 16 de maio de 1818*, which
  contracted the Fribourg agent S.-N. Gachet to settle 100 Swiss **Catholic** families on the
  Fazenda do Morro Queimado — a serra chosen for its resemblance to Switzerland, and the only
  Brazilian city founded by royal decree. Recruitment overshot badly: some 261–265 families,
  roughly 1,700–2,000 people, embarked in 1819–20 from Fribourg, Solothurn, Valais, Bern and
  neighbouring German areas, and about a quarter died at sea of typhus and scurvy before
  landing. [CONTEXTUAL] What the survivors received was not what was promised: the lots were
  small, steep and stony, tools and support inadequate, and many colonists abandoned their
  plots within a few years and dispersed across the fluminense highlands — which is exactly
  the shape of Jacob's own record, a lot sold in 1843 and a death somewhere outside the
  colony. His trunk (BORER I) is distinct from the Grindel Borer line, a distinction PUB-0003
  exists partly to preserve.

  ## Where to go today

  - **Baptism (parish corrected to Beinwil; date unretrieved):** the Catholic parish of
  **Beinwil (SO), Canton Solothurn, Switzerland** — the registers are the open next action;
  the Erschwil parish is a closed bounded negative and should not be re-searched. [OPEN] ·
  [Maps](https://maps.google.com/?q=Beinwil+SO+Switzerland)

  - **Marriage (8 August 1825):** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — the 1825 marriage predates
  the present 1869 cathedral and took place in the colony's earlier church on the same site
  [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (after ~1840, outside Nova Friburgo):** not the Nova Friburgo óbito register
  (bounded negative, 1832–1853) — search the **Macaé / Bom Jardim** parishes and civil
  registries into which the branch drifted. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Sua origem suíça e de Solothurn está fixada por seu próprio registro de
  casamento de 1825 em Nova Friburgo (PAR-0059): o livro paroquial chama ambos os cônjuges de
  "colonos suiços" do "Cantão de Soleure" e registra Jacob como "baptizado na freg.a de
  Erswill". A origem aqui é fato declarado em registro primário, não inferência a partir do
  sobrenome.

  - **[PROVEN / CORREÇÃO 2026-09-23]** Esse nome de freguesia é uma leitura errada. O
  Staatsarchiv Solothurn (arquivista Gasche Erich, correspondência C-011) confirmou e esgotou
  o acervo católico de Erschwil — três conjuntos de pastas — **sem nenhum batismo deste Jacob
  Borer**: negativa delimitada sobre Erschwil. O "Erswill" do registro é **Beinwil**, outra
  freguesia do Cantão de Solothurn. Toda busca em Erschwil por seu batismo está, portanto,
  encerrada como busca na freguesia errada.

  - **[LEAD]** O batismo de Beinwil **não** foi recuperado. A data em circulação — 13 de
  dezembro de 1801 — vem de uma árvore colaborativa do FamilySearch (L85Q-RY2) e serve apenas
  como pista; nenhum registro disponível dá sua data de nascimento.

  - **[PROVEN]** Estava morto antes de 1888: o testamento registrado de seu filho Francisco
  José o nomeia "Jacob Bahrer … já fallecido" (PRB-0005). Mas uma leitura sem lacunas do
  registro de óbitos de Nova Friburgo de 1832 a 1853 não o contém, enquanto seu filho João
  José nasceu em 10 de setembro de 1840 — logo, esteve vivo até por volta de 1840 e morreu
  **fora** de Nova Friburgo, no deslocamento do ramo rumo ao vale do Macaé / Bom Jardim.

  - **[CONTEXTUAL]** O esquema de 1819 atribuía a cada domicílio colono uma casa e um lote. O
  de Jacob era **Casa 70 / Lote 56** — o marcador que o mantém distinto de Laurent Borer, de
  Grindel (P-0068, Casa 73 / Lote 86), copassageiro no mesmo *Heureux Voyage*, cuja linha
  Borer está documentada como distinta da dele.

  - **[CONTEXTUAL]** "Borer", na Suíça e nos primeiros registros da colônia, vira **"Bohrer"**
  no Brasil — o ouvido português escrevendo um nome suíço-alemão. Borer → Bohrer, de Jacob a
  seu filho Francisco José e a seu neto Joaquim José, é a assimilação de três gerações
  inscrita na grafia do próprio sobrenome.

  ## Identidade

  **Jacob Bohrer** — a grafia estabilizada da família; o testamento de 1888 de seu filho
  escreve **"Jacob Bahrer"** e a compilação de Nova Friburgo, "Jacob Borer" [PROVEN quanto às
  formas do nome]. É o ancestral que marca a fronteira imigratória da linha Bohrer: pai de
  Francisco José Bohrer (P-0034) e, portanto, avô paterno de Joaquim José Bohrer (P-0030), por
  quem a linha chega a Celina Bohrer (P-0015) e a Iris Bohrer (P-0007).

  - **Pais:** João Borer (P-0096) × Barbara Probst (P-0097), nomeados em seu próprio casamento
  de 1825 como os pais de quem era "filho legitimo" [PROVEN — PAR-0059]. Nenhum dos dois
  emigrou; nada mais sobre eles está documentado.

  - **Origem:** suíça, Cantão de Soleure (Solothurn) — **confirmada por registro primário**
  (PAR-0059, evento E-0115). A **freguesia de batismo é Beinwil**, não Erschwil: o "Erswill"
  do registro é leitura errada, e Erschwil é agora uma negativa delimitada após a busca do
  Staatsarchiv Solothurn em 2026-09-23 (C-011) [PROVEN quanto ao cantão; PROVEN quanto à
  negativa de Erschwil; a leitura Beinwil apoia-se nessa correção]. A compilação *Imigrantes
  de Nova Friburgo* e o banco de dados da Casa Suíça dão nascimento por volta de 1801 [LEAD],
  e um registro de colonos de Nova Friburgo (GOV-0007) o lista na abertura da Casa/Lote 70/56
  como "Jacques [Jacob] Bocher, [17]" — idade de rol (→ ~1803), a cerca de dois anos daquela
  atribuição, preservada como discrepância e não adotada.

  - **Óbito:** antes de 1888 [PROVEN — PRB-0005]. Vivo até por volta de 1840; ausente da
  leitura sem lacunas do registro de óbitos de Nova Friburgo de 1832 a 1853; portanto morreu
  fora de Nova Friburgo depois de ~1840 [PROVEN quanto à negativa delimitada; INFERRED quanto
  ao lugar]. O "morreu em 1843–44 em Nova Friburgo" da compilação está positivamente excluído.
  Ele de fato vendeu sua propriedade em Nova Friburgo em 24 de abril de 1843 [LEAD] — seu
  último ato datado ali.

  - **Casamento e filhos:** casou-se com Catharina Mayer / Moser (P-0051) em Nova Friburgo, em
  8 de agosto de 1825 (PAR-0059; E-0115), perante o vigário Jacob Joye, tendo por testemunhas
  João Probst e Isabel Sch[oser — incerto]. Pai de ao menos Francisco José Bohrer (P-0034, n.
  9 de julho de 1832) [PROVEN — PAR-0054, PRB-0005]. PUB-0003 atribui ao casal nove filhos,
  dois falecidos na infância [LEAD].

  ## Posição social e profissão

  - **Nenhuma patente, cargo ou título aparece em qualquer registro disponível.** O que os
  documentos lhe dão é um lote e um ofício — nada que carregue título e nada que pudesse ser
  herdado como posição.

  - **Ofício:** o banco de dados da Casa Suíça o chama de *açougueiro* [LEAD]. Contra isso, as
  notas do agente de recuperação registram um batismo luterano em Nova Friburgo, em julho de
  1838, em que o padrinho é grafado "Jacob Bohrer, **Schuhmacher** … nebst seiner Gattin
  Catharina geb. Moser" — sapateiro, e um avistamento que também o coloca vivo e residente na
  vila em 1838. Esse avistamento **não está catalogado neste repositório** (nenhuma imagem
  retida), de modo que as duas leituras permanecem como pistas e a questão
  açougueiro/sapateiro segue aberta [LEAD para ambas].

  - **Propriedade:** uma casa-e-lote de colono, Casa 70 / Lote 56 (PUB-0003, GOV-0007) [LEAD
  quanto à atribuição], vendida em 24 de abril de 1843 [LEAD]. Sua viúva é muito provavelmente
  a "Viúva Catharina Bohrer" do registro de terras de Nova Friburgo de 1855 [LEAD] — ou seja,
  o domicílio detinha terra, mas o equivalente a um único lote serrano pobre.

  ## Família e rede social

  - **Esposa:** Catharina (P-0051), casada em 1825. O pai dela, José Moser, e uma Maria Moser
  foram padrinhos do batismo do filho Francisco José, em 1832 (PAR-0054) — os cunhados Moser,
  que emigraram como família intacta, eram a parentela mais próxima do domicílio na colônia.

  - **Testemunhas e padrinhos são todos colonos de Solothurn:** João Probst no casamento de
  1825 (provável parente de sua mãe Barbara Probst), os Moser no batismo de 1832. O mundo
  social que os registros mostram é a coorte transplantada de Solothurn e ninguém fora dela.

  - **Filhos:** Francisco José (P-0034) é o único atestado aqui em nível primário. PUB-0003
  acrescenta Catharina (1830, ⚭ Frederico Chaboudez), Maria (1834, ⚭ Francisco Xavier
  Chaboudez), Augusto (1837) e João José (1840–1859), e conta nove ao todo [LEAD]. Duas filhas
  casando-se com dois irmãos Chaboudez é a mesma endogamia de pares de irmãos que os ramos
  Borer e Wehrli exibem.

  - **Sem parentesco com o outro Borer:** Jacob (de registro Beinwil/Erschwil, Casa 70/56) e
  Laurent Borer (Grindel, Casa 73/86, P-0068) vieram no mesmo navio, mas os registros de
  casamento de 1820 e 1825 nomeiam pais diferentes, de aldeias diferentes, e a compilação
  afirma expressamente "não há evidência de parentesco próximo entre os dois grupos". Não
  confundir [PROVEN que os pais diferem; a questão do parentesco permanece ABERTA].

  ## O que podemos extrapolar

  - **Posição social: feita do zero, e nunca mais do que modesta [INFERRED].** Nenhum registro
  disponível dá a Jacob patente, cargo, título ou alfabetização. Ele não herdou nada — a
  compilação tem os dois pais mortos na Suíça antes da partida de 1819 [LEAD] e, mesmo vivos,
  um minifúndio do Jura dividido entre herdeiros nada teria a mandar para o exterior. O que
  teve, foi-lhe *dado* por um esquema estatal ou feito com as próprias mãos. Isso faz dele o
  caso mais limpo, nesta árvore, de posição que não é herdada, nem comprada por cargo, nem
  obtida por casamento — e o inverso estrutural exato da linha Armond da família, que partiu
  de uma elite de cargo e casamento e caiu. Não havia aqui fortuna a perder, porque nunca
  houve fortuna.

  - **Mecânica da riqueza: um pacote estatal de dois anos e depois um ofício — nenhum dos dois
  capital herdável [CONTEXTUAL — baseado no papel].** A base material do colono de 1819 foi
  fixada pelo *Decreto de 16 de maio de 1818* de Dom João VI: um lote e uma casa construída,
  víveres, sementes e gado, e um subsídio diário em dinheiro de 0$160 caindo a 0$080 ao longo
  de um período de estabelecimento de dois anos. O subsídio do primeiro ano anualiza-se em
  cerca de 58$000 — mais ou menos um sétimo dos ~420$000 anuais de um trabalhador rural livre.
  É um piso deliberadamente magro: o bastante para manter uma família viva enquanto desbrava
  uma encosta pedregosa, e projetado para acabar. Quando acabou, o colono tinha um lote pobre
  e o ofício que trouxesse. A banca de sapateiro ou de açougueiro é renda que termina com o
  homem; o lote era líquido o bastante para ser vendido numa única transação em 1843. Nada
  nessa estrutura se acumula.

  - **A herança partível cortou as duas pontas de sua vida [CONTEXTUAL].** O Jura de Solothurn
  praticava a divisão real das posses entre os herdeiros; herdeiros demais para pouca terra
  arável de planalto é exatamente o motivo pelo qual os recrutadores encontraram gente
  disposta ali em 1818–19. Jacob saiu desse sistema apenas para entrar em outro mais estrito:
  a sucessão brasileira também dividia os espólios igualmente entre todos os filhos, e a
  compilação lhe atribui nove. Um lote serrano pobre ÷ nove, e depois cada nono ÷ de novo na
  geração seguinte, inviabiliza aritmeticamente a acumulação. O empurrão que o moveu e o teto
  que segurou seus descendentes são o mesmo mecanismo em dois continentes.

  - **Educação: o único ativo que atravessou o Atlântico intacto [CONTEXTUAL / INFERRED].** No
  Brasil do século XIX, a escolarização era privilégio comprado e ligado à classe, que
  precisava ser recomprado a cada geração; não havia escola rural gratuita. Os colonos de
  Solothurn e de Hessen chegaram trazendo algo que o Brasil não vendia — alfabetização de
  escola paroquial católica em alemão — e no ramo de Jacob isso se sustentou: seu filho
  Francisco José ditou, mas **assinou** o próprio testamento de 1888 ("no qual me assigno"), e
  os filhos de Francisco José, Guilherme Samuel e Fernando, chegaram a cargo público, ao
  comércio e, no caso de Guilherme, à propriedade de um jornal em Nova Friburgo. Isso é um
  ramo alfabetizado, não uma elite letrada: aqui as letras compraram um pé no comércio urbano
  e no cargo local, não terra.

  - **O que o testamento de 1888 mostra sobre a escala disso [INFERRED a partir de
  PRB-0005].** Lido por seus silêncios, o testamento do filho é a melhor medida do que o
  domicílio de Jacob afinal representou. Nomeia quatro filhos menores como únicos herdeiros, a
  esposa como primeira testamenteira e tutora, vinte missas por Jacob e Catharina e um legado
  de 50$000 a uma capela que se erguia no Suspiro — e, conforme transcrito, **não** nomeia
  terra alguma, negócio algum nem pessoas escravizadas. No ano da abolição, um testador
  brasileiro proprietário listaria ambos. Trata-se de um domicílio urbano respeitável, com
  algo a deixar e nada a vincular.

  - **A migração mudou a forma da pobreza, não o fato dela — e o ramo então se dividiu
  [INFERRED].** A mudança converteu a fome de terra do Jura num lote colonial pobre: passo
  lateral, cujo ganho é o título sobre a terra, não a qualidade dela. A virada real vem uma
  geração depois e é uma *mudança de setor*, não de fortuna: após a venda de 1843, o ramo
  deixa o lote colonial e reaparece na vila, e o filho e os netos de Jacob vivem de comércio,
  letras e cargo local, e não da lavoura. Compare-se a linha Borer paralela, de Grindel
  (P-0068), que permaneceu na terra: ali o neto Valentim Martinho era *lavrador* e, em 1891,
  teve o nascimento da filha registrado "a rogo … por não saber escrever" (CIV-0045). Mesma
  colônia, mesmo piso inicial, dois desfechos — e a divergência acompanha comércio-e-letras na
  vila contra terra no campo.

  - **O arco, nomeado [INFERRED].** Camponês do Jura, pobre em terra (pré-1819) → colono
  assentado pelo Estado na Casa 70 / Lote 56 (1819–1843) → lote vendido e ramo saindo de Nova
  Friburgo (1843 →) → domicílio urbano alfabetizado e modestamente proprietário na geração do
  filho (testamento de 1888) → uma ala pequeno-burguesa de cargo e imprensa na dos netos
  (décadas de 1890–1900). Plano a levemente ascendente o tempo todo, nunca de elite. Os dois
  troncos Borer de Solothurn — o dele e o de Laurent — reconvergem um século depois no
  casamento Bohrer × Bohrer dos pais de Iris Bohrer, e é por isso que a questão não
  documentada de se ele e Laurent eram parentes ainda importa.

  ## Questões em aberto

  - **Seu batismo em Beinwil** — a próxima ação, e o registro que daria sua data de nascimento
  e seus pais em nível primário. Procurar em Beinwil, Cantão de Solothurn (Kantonsarchiv /
  Staatsarchiv Solothurn ou microfilme equivalente). **Não voltar a buscar em Erschwil**: é
  uma negativa delimitada encerrada (C-011, 2026-09-23). [OPEN]

  - **Seu registro de óbito e eventual inventário.** O registro decisivo: fixaria a data do
  óbito, resolveria o sobrenome de solteira da esposa e nomearia o conjunto completo dos
  filhos. O registro de óbitos de Nova Friburgo é negativa delimitada para ele entre 1832 e
  1853, então procurar **fora** de Nova Friburgo — nas paróquias e cartórios de Macaé / Bom
  Jardim para onde o ramo se deslocou. [OPEN]

  - **Seu ofício.** Uma imagem retida do batismo luterano de julho de 1838 em Nova Friburgo
  transformaria o avistamento "Schuhmacher" em evidência e o decidiria contra o "açougueiro"
  do banco de dados. [OPEN]

