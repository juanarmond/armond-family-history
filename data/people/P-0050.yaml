profile: >-
  ## Identity

  **Jacob Bohrer** — the family's stabilised spelling; his son's 1888 will writes
  **"Jacob Bahrer"** and the Nova Friburgo compilation "Jacob Borer" [PROVEN]. He is the
  Bohrer line's immigrant-boundary ancestor: father of Francisco José Bohrer (P-0034),
  and hence paternal grandfather of Joaquim José Bohrer (P-0030).

  - **Parents:** unknown from any record held here [OPEN]. A Nova Friburgo colonist
  compilation names them as Johann Borer and Barbara Probst, both dead in Switzerland
  before the 1819 emigration — a [LEAD], not catalogued.

  - **Origin:** Swiss — born c.1801 at Erschwil, Canton Soleure (Solothurn) [LEAD], from
  the Imigrantes de Nova Friburgo compilation (PUB-0003, section BORER I) and the Casa
  Suíça database, not yet confirmed by any primary record. His nationality is therefore
  deliberately left unset.

  - **Death:** before 1888 [PROVEN] — his son's registered will (PRB-0005) names him
  "já fallecido." A compilation places his death at 1843–44, after he sold his Nova
  Friburgo property on 24 April 1843 [LEAD].

  - **Marriage and children:** husband of Catharina Mayer / Moser (P-0051); father of at
  least Francisco José Bohrer (P-0034, b.1832) [PROVEN, via PRB-0005]. PUB-0003 credits
  the couple with nine children in all (BORER I), two dying in infancy [LEAD].

  ## Standing and social context

  - A Swiss-German colonist of the 1819 Nova Friburgo settlement [LEAD]; PUB-0003 and the
  Casa Suíça database assign him Casa/Lote 70/56 — the marker that distinguishes him from
  the unrelated Laurent Borer of the Grindel line (BORER II, Casa/Lote 73/86, P-0068), a
  co-passenger on the same 1819 crossing but no documented kin.

  - The compilation calls him a butcher (açougueiro) [LEAD]; nothing about his occupation
  or standing is primary-confirmed in this repository.

  ## What we can extrapolate

  The only fact fixed by a primary record held here is his existence and his death before
  1888, from his son Francisco José's will (PRB-0005). Everything about his Swiss birth,
  arrival and household is strong-evidence at best, resting on the Nova Friburgo colonist
  compilation (PUB-0003) and the Casa Suíça database — which is exactly why the
  nationality field is deliberately unset rather than asserted "Swiss." [INFERRED]

  If that Swiss origin holds, his life traces the mirror image of the Armond decline: where
  the Armond line began at a married-in, office-holding elite and fell, Jacob's trunk begins
  at the floor — there was never a fortune to lose. [CONTEXTUAL / INFERRED]

  - **Old-World floor** [CONTEXTUAL] — Erschwil sat in the poor, land-hungry Catholic
  peasantry of the Solothurn Jura (the Schwarzbubenland), an over-populated upland of
  subsistence smallholders where too many heirs competed for too little arable land,
  compounded by the 1816 "Year Without a Summer" famine and post-Napoleonic poverty.
  Emigration there was a survival strategy, not an investment.

  - **Orphan emigration — the barest starting rung** [INFERRED / CONTEXTUAL] — the
  compilation has him leaving parentless (Johann Borer and Barbara Probst dead in
  Switzerland before the 1819 departure), reportedly aboard the *Heureux Voyage*, carrying
  out no Swiss land, capital or inheritance. An unattached teenager shipping out alone is
  the lowest position within the 1819 recruitment. [LEAD for the specifics]

  - **The colony was a lateral move, not a rise** [CONTEXTUAL / INFERRED] — the Nova
  Friburgo lots were poor, stony and small. Jacob is credited with one colonist lot (Casa /
  Lote 70/56) and, per the database, a butcher's trade (açougueiro) — an artisan /
  petty-commerce living, a real gain over Swiss landlessness but the bottom rung of the
  colonial property ladder, not accumulation from land. [LEAD]

  - **Low-value, non-accumulating wealth, then partible fragmentation** [INFERRED /
  CONTEXTUAL] — a poor lot plus a trade yields subsistence and petty surplus, not heritable
  capital; that the database has him selling the property in 1843 (his last dated act)
  suggests a liquid, modest holding, not an entailed estate. Brazilian partible succession
  then split whatever there was equally among all his children (the compilation credits the
  couple with nine), and again among theirs — poor land ÷ many heirs, the engine that keeps
  this trunk flat for generations.

  - **The arc, named** [INFERRED] — landless Jura peasant → orphan colonist → small Nova
  Friburgo butcher-landholder: flat-to-slightly-up, never elite. No fortune was built, so
  none was lost — the structural opposite of the Armond fall — and the line stays flat until
  a much later generation finally leaves the exhausted land for the 20th-century urban
  working class. Whether his Erschwil trunk was kin to the Grindel Borer line (Laurent
  Borer, P-0068) — a co-passenger on the same 1819 crossing — is undocumented and is treated
  here only as an open question, never as fact. [LEAD]

  ## Open questions

  - His Nova Friburgo inventário (c.1843) — the decisive record: it would fix his death
  date, settle his wife's maiden surname (the will's "Mayer" vs the compilation's
  "Moser") and name his full child set. [OPEN]

  - A Swiss (Erschwil) baptism or emigration document to confirm the Swiss origin and his
  parents at primary level. [OPEN]

  ## Sources held (this repository)

  - PRB-0005 (Francisco José Bohrer's 1888 registered will — names Jacob as father, "já
  fallecido"; the one primary record that names him at all).

  - PUB-0003 (Imigrantes de Nova Friburgo, BORER I — secondary compilation: Erschwil
  origin, b. c.1801, Casa/Lote 70/56, nine children, property sold 24 April 1843;
  strong-evidence, not primary).

  ## Regional and migration context

  If the compilation is right, Jacob belongs to the 1819 Swiss-German colonisation of Nova
  Friburgo, drawn from the poor, land-constrained Catholic Jura of Canton Soleure (the
  Erschwil / Thierstein uplands) under King João VI's colonisation scheme after
  post-Napoleonic and "Year Without a Summer" hardship. [CONTEXTUAL] His branch (BORER I,
  Erschwil) is distinct from the Grindel Borer line — a distinction PUB-0003 exists partly
  to preserve.
profile_pt: >-
  ## Identidade

  **Jacob Bohrer** — a grafia estabilizada da família; o testamento de 1888 de seu filho
  escreve **"Jacob Bahrer"** e a compilação de Nova Friburgo, "Jacob Borer" [PROVEN]. Ele
  é o ancestral que marca a fronteira imigratória da linha Bohrer: pai de Francisco José
  Bohrer (P-0034) e, portanto, avô paterno de Joaquim José Bohrer (P-0030).

  - **Pais:** desconhecidos em qualquer registro aqui disponível [OPEN]. Uma compilação de
  colonos de Nova Friburgo os nomeia como Johann Borer e Barbara Probst, ambos falecidos
  na Suíça antes da emigração de 1819 — uma [LEAD], não catalogada.

  - **Origem:** suíça — nascido por volta de 1801 em Erschwil, Cantão de Soleure
  (Solothurn) [LEAD], a partir da compilação Imigrantes de Nova Friburgo (PUB-0003, seção
  BORER I) e do banco de dados da Casa Suíça, ainda não confirmada por nenhum registro
  primário. Sua nacionalidade é, por isso, deliberadamente deixada em aberto.

  - **Óbito:** antes de 1888 [PROVEN] — o testamento registrado de seu filho (PRB-0005) o
  nomeia "já fallecido". Uma compilação situa sua morte em 1843–44, após ter vendido sua
  propriedade em Nova Friburgo em 24 de abril de 1843 [LEAD].

  - **Casamento e filhos:** marido de Catharina Mayer / Moser (P-0051); pai de ao menos
  Francisco José Bohrer (P-0034, n.1832) [PROVEN, via PRB-0005]. PUB-0003 atribui ao casal
  nove filhos no total (BORER I), dois falecidos na infância [LEAD].

  ## Posição social e contexto

  - Um colono suíço-alemão da povoação de Nova Friburgo de 1819 [LEAD]; PUB-0003 e o banco
  de dados da Casa Suíça lhe atribuem a Casa/Lote 70/56 — o marcador que o distingue do
  não aparentado Laurent Borer, da linha de Grindel (BORER II, Casa/Lote 73/86, P-0068),
  copassageiro na mesma travessia de 1819, mas sem parentesco documentado.

  - A compilação o chama de açougueiro [LEAD]; nada sobre sua ocupação ou posição está
  confirmado por registro primário neste repositório.

  ## O que podemos extrapolar

  O único fato fixado por um registro primário aqui disponível é sua existência e sua
  morte antes de 1888, a partir do testamento de seu filho Francisco José (PRB-0005). Tudo
  sobre seu nascimento suíço, sua chegada e sua casa é, na melhor das hipóteses, evidência
  forte, apoiada na compilação de colonos de Nova Friburgo (PUB-0003) e no banco de dados
  da Casa Suíça — razão pela qual o campo de nacionalidade é deliberadamente deixado em
  aberto, em vez de afirmar "suíça". [INFERRED]

  Se essa origem suíça se confirmar, sua vida traça a imagem espelhada do declínio Armond:
  enquanto a linha Armond começou em uma elite conquistada pelo casamento e detentora de
  cargos e caiu, o tronco de Jacob começa no chão — nunca houve uma fortuna a perder.
  [CONTEXTUAL / INFERRED]

  - **Piso do Velho Mundo** [CONTEXTUAL] — Erschwil situava-se no pobre e faminto por terra
  campesinato católico do Jura de Solothurn (o Schwarzbubenland), um planalto superpovoado
  de pequenos lavradores de subsistência onde herdeiros demais competiam por terra arável de
  menos, agravado pela fome do "Ano Sem Verão" de 1816 e pela pobreza pós-napoleônica. Ali,
  emigrar era estratégia de sobrevivência, não investimento.

  - **Emigração órfã — o degrau inicial mais baixo** [INFERRED / CONTEXTUAL] — a compilação
  o tem partindo sem os pais (Johann Borer e Barbara Probst falecidos na Suíça antes da
  partida de 1819), supostamente a bordo do *Heureux Voyage*, sem levar terra, capital ou
  herança suíça. Um jovem desacompanhado embarcando sozinho é a posição mais baixa dentro do
  recrutamento de 1819. [LEAD quanto aos detalhes]

  - **A colônia foi um movimento lateral, não uma ascensão** [CONTEXTUAL / INFERRED] — os
  lotes de Nova Friburgo eram pobres, pedregosos e pequenos. Atribui-se a Jacob um lote de
  colono (Casa / Lote 70/56) e, segundo o banco de dados, o ofício de açougueiro — um
  sustento de artesão / pequeno comércio, um ganho real sobre a ausência de terra na Suíça,
  mas o degrau mais baixo da escada de propriedade colonial, não acumulação a partir da
  terra. [LEAD]

  - **Riqueza de baixo valor, não acumulável, e depois a fragmentação partível** [INFERRED /
  CONTEXTUAL] — um lote pobre somado a um ofício rende subsistência e pequeno excedente, não
  capital herdável; o fato de o banco de dados tê-lo vendendo a propriedade em 1843 (seu
  último ato datado) sugere uma posse líquida e modesta, não um patrimônio vinculado. A
  sucessão partível brasileira dividiu em seguida o que havia igualmente entre todos os seus
  filhos (a compilação atribui nove ao casal), e de novo entre os filhos destes — terra
  pobre ÷ muitos herdeiros, o motor que mantém este tronco plano por gerações.

  - **O arco, nomeado** [INFERRED] — camponês sem terra do Jura → colono órfão → pequeno
  açougueiro-proprietário de Nova Friburgo: plano-a-ligeiramente-ascendente, nunca de elite.
  Nenhuma fortuna foi construída, então nenhuma foi perdida — o oposto estrutural da queda
  Armond — e a linha permanece plana até uma geração muito posterior finalmente deixar a
  terra esgotada rumo à classe trabalhadora urbana do século XX. Se seu tronco de Erschwil
  era aparentado à linha Borer de Grindel (Laurent Borer, P-0068) — copassageiro na mesma
  travessia de 1819 — é algo não documentado, tratado aqui apenas como questão em aberto,
  nunca como fato. [LEAD]

  ## Questões em aberto

  - Seu inventário de Nova Friburgo (c.1843) — o registro decisivo: fixaria sua data de
  óbito, resolveria o sobrenome de solteira de sua esposa (o "Mayer" do testamento vs o
  "Moser" da compilação) e nomearia o conjunto completo de seus filhos. [OPEN]

  - Um batismo suíço (Erschwil) ou documento de emigração que confirme a origem suíça e
  seus pais em nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0005 (testamento registrado de 1888 de Francisco José Bohrer — nomeia Jacob como
  pai, "já fallecido"; o único registro primário que o nomeia).

  - PUB-0003 (Imigrantes de Nova Friburgo, BORER I — compilação secundária: origem em
  Erschwil, n. c.1801, Casa/Lote 70/56, nove filhos, propriedade vendida em 24 de abril de
  1843; evidência forte, não primária).

  ## Contexto regional e migratório

  Se a compilação estiver correta, Jacob pertence à colonização suíço-alemã de Nova
  Friburgo de 1819, oriunda do pobre e limitado em terras Jura católico do Cantão de
  Soleure (as terras altas de Erschwil / Thierstein), sob o esquema de colonização de Dom
  João VI, após as dificuldades pós-napoleônicas e do "Ano Sem Verão". [CONTEXTUAL] Seu
  ramo (BORER I, Erschwil) é distinto da linha Borer de Grindel — distinção que PUB-0003
  existe em parte para preservar.
