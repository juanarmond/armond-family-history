notes:
- text: >-
    Father of Francisco José Bohrer (P-0034); hence Joaquim José Bohrer's (P-0030)
    paternal grandfather and Iris Bohrer's Bohrer-line immigrant-boundary ancestor.
    Named in his son's 1888 registered will (PRB-0005) as "Jacob Bahrer … já
    fallecido" — deceased before 1888. Preferred name given in the family's
    stabilised form "Bohrer"; the will spells it "Bahrer".
  text_pt: >-
    Pai de Francisco José Bohrer (P-0034); portanto, o avô paterno de Joaquim
    José Bohrer (P-0030) e o ancestral que marca a fronteira imigratória da linha
    Bohrer de Iris Bohrer. Nomeado no testamento registrado de 1888 de seu filho
    (PRB-0005) como "Jacob Bahrer … já fallecido" — falecido antes de 1888. O
    nome preferencial é dado na forma estabilizada da família, "Bohrer"; o
    testamento o grafa como "Bahrer".
- text: >-
    Nationality deliberately left unset (Swiss origin is strong-evidence from
    compilation but not yet primary-confirmed). The Imigrantes de Nova Friburgo
    compilation (PUB-0003, p.300, BORER I section) and the Casa Suíça database
    (image read 2026-08-07) identify him as Jacob Borer born c.1801 at Erschwil,
    Soleure, Switzerland — BORER I, distinct from Laurent Borer (BORER II, P-0068)
    who came from Grindel. Jacob's Casa/Lote at Nova Friburgo was 70/56 (Laurent's
    was 73/86 — a useful distinguishing marker). The compilation gives him "9 filhos"
    total (two died in infancy unrecorded). The DB states he sold his property on
    24 April 1843 (likely already infirm; died 1843-44). The Catharina Mayer/Moser
    surname conflict (PRB-0005 gives "Mayer"; compilation gives "Moser") is
    unresolved and preserved as a name variant on P-0051. PRB-0005 evidences
    only his name, his son's parentage and that he was already dead by 1888;
    primary-record confirmation of Jacob's Swiss origin still awaits his
    Nova Friburgo inventário or a Swiss baptism/emigration document.
  text_pt: >-
    Nacionalidade deliberadamente deixada em aberto (a origem suíça é evidência
    forte proveniente da compilação, mas ainda não confirmada por registro
    primário). A compilação Imigrantes de Nova Friburgo (PUB-0003, p.300, seção
    BORER I) e o banco de dados da Casa Suíça (imagem lida em 2026-08-07) o
    identificam como Jacob Borer, nascido por volta de 1801 em Erschwil, Soleure,
    Suíça — BORER I, distinto de Laurent Borer (BORER II, P-0068), que veio de
    Grindel. A Casa/Lote de Jacob em Nova Friburgo era 70/56 (a de Laurent era
    73/86 — um marcador distintivo útil). A compilação lhe atribui "9 filhos" no
    total (dois morreram na infância sem registro). O banco de dados afirma que
    ele vendeu sua propriedade em 24 de abril de 1843 (provavelmente já enfermo;
    morreu em 1843-44). O conflito de sobrenome Catharina Mayer/Moser (PRB-0005
    traz "Mayer"; a compilação traz "Moser") permanece sem resolução e é
    preservado como variante de nome em P-0051. PRB-0005 evidencia apenas seu
    nome, a filiação de seu filho e que ele já estava morto em 1888; a confirmação
    por registro primário da origem suíça de Jacob ainda aguarda seu inventário de
    Nova Friburgo ou um documento suíço de batismo/emigração.
