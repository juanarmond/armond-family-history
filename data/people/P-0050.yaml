    24 April 1843. NOTE the compilation's "died 1843-44" is now positively EXCLUDED
    by a bounded-negative retrieval search: the Nova Friburgo óbito register (Livro 1)
    was read gap-free 1832-1853 and Jacob is ABSENT, while his son João José was born
