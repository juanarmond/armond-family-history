  ## Contexto regional e migratório

  Jacob pertence à colonização suíça de Nova Friburgo de 1819, recrutada no Jura católico e
  germanófono de Solothurn — o Schwarzbubenland do distrito de Thierstein, terra pobre de
  lavoura de planalto onde as posses eram divididas entre herdeiros até sobrar pouca terra
  para gente demais. [CONTEXTUAL] O empurrão foi a erupção do Tambora em 1815 e a fome do "Ano
  Sem Verão" de 1816 caindo sobre um continente já empobrecido pelas guerras napoleônicas; a
  atração foi o *Decreto de 16 de maio de 1818* de Dom João VI, que contratou o agente
  friburguês S.-N. Gachet para assentar 100 famílias suíças **católicas** na Fazenda do Morro
  Queimado — uma serra escolhida por sua semelhança com a Suíça, e a única cidade brasileira
  fundada por decreto real. O recrutamento excedeu muito a meta: cerca de 261–265 famílias,
  aproximadamente 1.700–2.000 pessoas, embarcaram em 1819–20, vindas de Friburgo, Solothurn,
  Valais, Berna e áreas germanófonas vizinhas, e cerca de um quarto morreu no mar de tifo e
  escorbuto antes do desembarque. [CONTEXTUAL] O que os sobreviventes receberam não foi o
  prometido: os lotes eram pequenos, íngremes e pedregosos, as ferramentas e o apoio
  insuficientes, e muitos colonos abandonaram as glebas em poucos anos, dispersando-se pelas
  serras fluminenses — que é exatamente o formato do próprio registro de Jacob, um lote
  vendido em 1843 e uma morte em algum lugar fora da colônia. Seu tronco (BORER I) é distinto
  da linha Borer de Grindel, distinção que PUB-0003 existe em parte para preservar.

