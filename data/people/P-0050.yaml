- text: >-
    Father of Francisco José Bohrer (P-0034); hence Joaquim José Bohrer's (P-0030)
    paternal grandfather and Iris Bohrer's Bohrer-line immigrant-boundary ancestor.
    Named in his son's 1888 registered will (PRB-0005) as "Jacob Bahrer … já
    fallecido" — deceased before 1888. Preferred name given in the family's
    stabilised form "Bohrer"; the will spells it "Bahrer".
  text_pt: >-
    Pai de Francisco José Bohrer (P-0034); portanto, o avô paterno de Joaquim
    José Bohrer (P-0030) e o ancestral que marca a fronteira imigratória da linha
    Bohrer de Iris Bohrer. Nomeado no testamento registrado de 1888 de seu filho
    (PRB-0005) como "Jacob Bahrer … já fallecido" — falecido antes de 1888. O
    nome preferencial é dado na forma estabilizada da família, "Bohrer"; o
    testamento o grafa como "Bahrer".
- text: >-
