notes:
- text: >-
    Father of Francisco José Bohrer (P-0034); hence Joaquim José Bohrer's (P-0030)
    paternal grandfather and Iris Bohrer's Bohrer-line immigrant-boundary ancestor.
    Named in his son's 1888 registered will (PRB-0005) as "Jacob Bahrer … já
    fallecido" — deceased before 1888. Preferred name given in the family's
    stabilised form "Bohrer"; the will spells it "Bahrer".
- text: >-
    Nationality deliberately left unset (Swiss origin is strong-evidence from
    compilation but not yet primary-confirmed). The Imigrantes de Nova Friburgo
    compilation (PUB-0003, p.300, BORER I section) and the Casa Suíça database
    (image read 2026-08-07) identify him as Jacob Borer born c.1801 at Erschwil,
    Soleure, Switzerland — BORER I, distinct from Laurent Borer (BORER II, P-0068)
    who came from Grindel. Jacob's Casa/Lote at Nova Friburgo was 70/56 (Laurent's
    was 73/86 — a useful distinguishing marker). The compilation gives him "9 filhos"
    total (two died in infancy unrecorded). The DB states he sold his property on
    24 April 1843 (likely already infirm; died 1843-44). The Catharina Mayer/Moser
    surname conflict (PRB-0005 gives "Mayer"; compilation gives "Moser") is
    unresolved and preserved as a name variant on P-0051. PRB-0005 evidences
    only his name, his son's parentage and that he was already dead by 1888;
    primary-record confirmation of Jacob's Swiss origin still awaits his
    Nova Friburgo inventário or a Swiss baptism/emigration document.
