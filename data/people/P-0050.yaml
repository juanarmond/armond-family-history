    marriage (PAR-0059, event E-0115): the parish register records the spouses as
    "ambos do Cantão de Soleure, colonos suiços" and Jacob as baptised at Erschwil
    ("baptizado na freg.a de Erswill"), Canton Solothurn (Soleure), Switzerland
    [PROVEN for the canton / Swiss origin]. The Imigrantes de Nova Friburgo
    compilation (PUB-0003, p.300, BORER I section) and the Casa Suíça database
    (image read 2026-08-07) corroborate this, identifying him as Jacob Borer born c.1801 at Erschwil,
    Soleure, Switzerland — BORER I, distinct from Laurent Borer (BORER II, P-0068)
    who came from Grindel. Jacob's Casa/Lote at Nova Friburgo was 70/56 (Laurent's
    was 73/86 — a useful distinguishing marker). The compilation gives him "9 filhos"
    total (two died in infancy unrecorded). The DB states he sold his property on
    24 April 1843. NOTE the compilation's "died 1843-44" is now positively EXCLUDED
    by a bounded-negative retrieval search: the Nova Friburgo óbito register (Livro 1)
    was read gap-free 1832-1853 and Jacob is ABSENT, while his son João José was born
    10 Sep 1840 — so he was alive into ~1840 and died OUTSIDE Nova Friburgo (the
    branch's Macaé / Bom Jardim drift), not in 1843 at Nova Friburgo. The Catharina Mayer/Moser
    surname conflict (PRB-0005 gives "Mayer"; compilation gives "Moser") is
    unresolved and preserved as a name variant on P-0051. PRB-0005 evidences
    only his name, his son's parentage and that he was already dead by 1888;
    with his Swiss origin now primary-confirmed by PAR-0059, what still awaits
    a record is his exact birth date — a Swiss (Erschwil) baptism register —
    and his parents at primary level.
  text_pt: >-
    Nacionalidade suíça, confirmada por registro primário — o próprio casamento de
    Jacob em Nova Friburgo, em 1825 (PAR-0059, evento E-0115): o registro paroquial
