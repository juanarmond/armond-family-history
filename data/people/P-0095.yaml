profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named only "Anna Francisca" — with no surname — in her daughter Isabel Ribeiro's 1751 Borda do Campo marriage act (PAR-0034). That single entry attests her; no independent record has been located.

  - **[CONTEXTUAL]** Her tentative identification in her granddaughter Ritta's ink-damaged 1764 baptism (PAR-0049) as "natural [da freguesia de São Jorge]" would place both her and her husband as Azorean migrants in colonial Minas Gerais — a double-island couple in the Borda do Campo district by about 1720–1730. Her name itself is marked uncertain in that clause, so the reading is a lead and nothing here rests on the surname of her husband.

  - **[INFERRED]** Being recorded with a given name and no surname was routine for women of modest standing in colonial Brazil, where the husband's name was taken to identify the household. The omission is a class signal as much as a scribal habit: elite women in the same registers are styled "Dona" and given a full name.

  - **[PROVEN by contrast]** Her daughter's own act, in the same document, names her as "natural e baptizada nesta freguesia". The generation that mattered for standing was her daughter's, not hers — which is why the daughter's birthplace is recorded and the mother's is not.

  ## Identity

  **Anna Francisca** — a stub ancestor, named only as the mother of Isabel Ribeiro (P-0079) in her 1751 Borda do Campo (Barbacena) marriage act (PAR-0034): "filha legitima de Manoel Nado Pestana e de Anna Francisca". [PROVEN name via PAR-0034] Grandmother of Ritta Angélica Rodrigues (P-0058) and so 3rd-great-grandmother of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Husband:** Manoel Nado Pestana (P-0094), family F-0046.

  - **Origin:** Portuguese (Azorean) — her granddaughter Ritta's 1764 baptism (PAR-0049) reads her "natural [da freguesia de São Jorge]" (Açores), alongside her husband of Nossa Senhora do Rosário, Ilha de São Jorge. That grandparent clause is ink-damaged, her name within it is marked [uncertain], and the couple is recorded as a LEAD — so the Azorean origin, and the Portuguese nationality resting on it, carry that read-uncertainty.

  - **Birth, marriage and death:** no record of her own is located. [OPEN] The parentage of Isabel rests on the informant-reported filiation in her daughter's marriage act, not on a birth or baptism, hence strong-evidence rather than primary.

  ## Standing and profession

  - **Nothing is recorded** — no occupation, no property, no surname, no act in which she is a party. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record exists, and none could.

  - **The absence of a surname and of the honorific "Dona" is the only status information the record carries**, and it points downward rather than up. [INFERRED]

  ## Family and social network

  - **Husband:** Manoel Nado Pestana (P-0094), named in the same clause and equally undescribed.

  - **Daughter:** Isabel Ribeiro (P-0079), born and baptised in the Borda do Campo parish, who married the Portuguese immigrant João Rodrigues Valle (P-0078) there on 22 February 1751 (PAR-0034).

  - **No other child, kinswoman or associate is documented.** [OPEN]

  ## What we can extrapolate

  - **She is the point at which this line becomes, on the record, a Brazilian family** [INFERRED]. Her daughter is the first person in the branch stated to be "natural e baptizada nesta freguesia". Whatever she and her husband were before — and the 1764 lead says islanders — the household's standing from 1751 onward is built on a Brazilian-born daughter. Migration converted into belonging in exactly one generation.

  - **A woman with no surname in the register is a woman with nothing to convey by name** [INFERRED / CONTEXTUAL]. Colonial scribes wrote out the names that carried property, office or honour; a bare "Anna Francisca" indicates a household where neither the woman's lineage nor her family's standing needed recording. Compare her own granddaughter Ritta, styled "D. Rita Angélica Rodrigues" in the 1810 São João del Rei act (PAR-0023) — two generations of accumulation visible purely in how the clerks wrote the names.

  - **What she transmitted was not property but placement** [INFERRED]. There is no dowry, holding or inheritance anywhere in the record for her. Her daughter's value in the 1751 marriage market was local birth and legitimate parentage, and those are the only two things this couple can be shown to have provided. In a partible-inheritance society they are also the two things that cannot be divided among children — every child of hers had them in full.

  - **Education is not a question that the archive allows to be asked** [CONTEXTUAL]. There was no schooling for women of her standing in the colonial interior, and nothing ever required her to write. Her verdict is unclassifiable, and the same silence covers every woman in this branch until Brazilian probate records force the question three generations later.

  ## Open questions

  - Any record of her own — a baptism, a marriage, a death, a surname. None is located. [OPEN]

  - Whether the Ilha de São Jorge origin is real for her. A clearer image of the 1764 grandparent clause in PAR-0049, or an Azorean or Borda do Campo record naming her, would settle it; until then the Azorean origin and the Portuguese nationality resting on it stay a lead. [LEAD]

  - Her surname, which would be the key to her own parentage and is simply absent from the only act that names her. [OPEN]

  ## Sources held (this repository)

  - PAR-0034 (1751 Borda do Campo marriage of her daughter Isabel — names her as the mother; the only record that attests her).

  - PAR-0049 (1764 Barbacena baptism of her granddaughter Ritta — the ink-damaged grandparent clause that proposes her São Jorge origin, with her name itself marked uncertain). [LEAD]

  ## Regional and migration context

  Placed, by the only act that names her, in the orbit of the Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena), in the Campo das Vertentes of Minas Gerais — a colonial district of recent free-colonist settlement on the road between the mining heartland and the coast. [CONTEXTUAL] If the tentative 1764 read holds, she and her husband were both from the Ilha de São Jorge in the Azores, making this couple an Atlantic-island root quite distinct from the Braga-Minho crossing their son-in-law made a generation later. Azorean movement to Brazil in this period ran both as individual migration toward the goldfields and, from 1748, as crown-organised *casal* settlement of the southern coast; the timing places this household in the earlier individual current. [LEAD for the origin; CONTEXTUAL for the currents]

  ## Where to go today

  - **Where her daughter was born, baptised and married:** Catedral N.S. da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Her proposed origin island (a lead, not confirmed):** Ilha de São Jorge, Açores, Portugal [APPROX / LEAD] · [Maps](https://www.google.com/maps/search/?api=1&query=Ilha%20de%20S%C3%A3o%20Jorge%2C%20A%C3%A7ores%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada apenas "Anna Francisca" — sem sobrenome — no ato de casamento de sua filha Isabel Ribeiro, na Borda do Campo, em 1751 (PAR-0034). Essa única entrada a atesta; nenhum registro independente foi localizado.

  - **[CONTEXTUAL]** Sua identificação tentativa no batismo danificado por tinta de sua neta Ritta, em 1764 (PAR-0049), como "natural [da freguesia de São Jorge]", situaria tanto ela quanto o marido como migrantes açorianos nas Minas Gerais coloniais — um casal duplamente insular no distrito da Borda do Campo por volta de 1720–1730. Seu próprio nome está marcado como incerto naquela cláusula, de modo que a leitura é pista, e nada aqui se apoia no sobrenome do marido.

  - **[INFERRED]** Ser registrada com prenome e sem sobrenome era rotineiro para mulheres de posição modesta no Brasil colonial, em que o nome do marido bastava para identificar a casa. A omissão é tanto sinal de classe quanto hábito de escrivão: mulheres de elite, nos mesmos registros, recebem o tratamento "Dona" e nome completo.

  - **[PROVEN por contraste]** O ato da própria filha, no mesmo documento, a declara "natural e baptizada nesta freguesia". A geração que importava para a posição social era a da filha, não a dela — razão pela qual o local de nascimento da filha é registrado e o da mãe não.

  ## Identidade

  **Anna Francisca** — ancestral de registro mínimo, nomeada apenas como mãe de Isabel Ribeiro (P-0079) no ato de casamento dela na Borda do Campo (Barbacena), em 1751 (PAR-0034): "filha legitima de Manoel Nado Pestana e de Anna Francisca". [nome PROVEN via PAR-0034] Avó de Ritta Angélica Rodrigues (P-0058) e, portanto, tetravó de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Marido:** Manoel Nado Pestana (P-0094), família F-0046.

  - **Origem:** portuguesa (açoriana) — o batismo de sua neta Ritta, em 1764 (PAR-0049), a lê "natural [da freguesia de São Jorge]" (Açores), ao lado do marido, de Nossa Senhora do Rosário, Ilha de São Jorge. Essa cláusula de avós está danificada por tinta, o nome dela nela está marcado [uncertain] e o casal é registrado como LEAD — de modo que a origem açoriana, e a nacionalidade portuguesa que nela se apoia, carregam essa incerteza de leitura.

  - **Nascimento, casamento e óbito:** nenhum registro seu foi localizado. [OPEN] A filiação de Isabel apoia-se na declaração de informante no ato de casamento da filha, e não num nascimento ou batismo, sendo portanto evidência forte, e não primária.

  ## Posição social e profissão

  - **Nada está registrado** — nenhuma ocupação, propriedade, sobrenome ou ato em que seja parte. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** não existe registro assinável disponível, nem poderia existir.

  - **A ausência de sobrenome e do tratamento "Dona" é a única informação de condição que o registro carrega**, e aponta para baixo, não para cima. [INFERRED]

  ## Família e rede social

  - **Marido:** Manoel Nado Pestana (P-0094), nomeado na mesma cláusula e igualmente sem descrição.

  - **Filha:** Isabel Ribeiro (P-0079), nascida e batizada na freguesia da Borda do Campo, que ali se casou com o imigrante português João Rodrigues Valle (P-0078) em 22 de fevereiro de 1751 (PAR-0034).

  - **Nenhum outro filho, parente ou associado está documentado.** [OPEN]

  ## O que podemos extrapolar

  - **Ela é o ponto em que esta linha se torna, no registro, uma família brasileira** [INFERRED]. Sua filha é a primeira pessoa do ramo declarada "natural e baptizada nesta freguesia". Fosse o que fossem ela e o marido antes — e a pista de 1764 diz insulares —, a posição da casa a partir de 1751 se constrói sobre uma filha nascida no Brasil. Migração convertida em pertencimento em exatamente uma geração.

  - **Uma mulher sem sobrenome no registro é uma mulher sem nada a transmitir pelo nome** [INFERRED / CONTEXTUAL]. Os escrivães coloniais escreviam por extenso os nomes que carregavam propriedade, ofício ou honra; uma "Anna Francisca" seca indica uma casa em que nem a linhagem da mulher nem a posição de sua família precisavam ser registradas. Compare-se com sua própria neta Ritta, tratada por "D. Rita Angélica Rodrigues" no ato de 1810 em São João del Rei (PAR-0023) — duas gerações de acumulação visíveis apenas no modo como os escrivães escreveram os nomes.

  - **O que ela transmitiu não foi propriedade, mas colocação** [INFERRED]. Não há dote, posse ou herança em nenhum ponto do registro em seu nome. O valor de sua filha no mercado matrimonial de 1751 era nascimento local e filiação legítima, e essas são as duas únicas coisas que este casal comprovadamente forneceu. Numa sociedade de herança partível, são também as duas coisas que não se dividem entre filhos — cada filho seu as tinha por inteiro.

  - **A educação é pergunta que o arquivo não permite fazer** [CONTEXTUAL]. Não havia escolarização para mulheres de sua condição no interior colonial, e nada jamais exigiu que escrevesse. Seu veredito é inclassificável, e o mesmo silêncio cobre todas as mulheres deste ramo até que os inventários brasileiros imponham a pergunta três gerações depois.

  ## Questões em aberto

  - Qualquer registro próprio — batismo, casamento, óbito, sobrenome. Nenhum foi localizado. [OPEN]

  - Se a origem na Ilha de São Jorge vale para ela. Uma imagem mais nítida da cláusula de avós de 1764 em PAR-0049, ou um registro açoriano ou da Borda do Campo que a nomeie, resolveria; até lá, a origem açoriana e a nacionalidade portuguesa que nela se apoia permanecem pista. [LEAD]

  - Seu sobrenome, que seria a chave de sua própria filiação e está simplesmente ausente do único ato que a nomeia. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0034 (casamento de 1751 na Borda do Campo de sua filha Isabel — nomeia-a como mãe; o único registro que a atesta).

  - PAR-0049 (batismo de 1764 em Barbacena de sua neta Ritta — a cláusula de avós, danificada por tinta, que propõe sua origem em São Jorge, com o próprio nome dela marcado como incerto). [LEAD]

  ## Contexto regional e migratório

  Situada, pelo único ato que a nomeia, na órbita da Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena), no Campo das Vertentes de Minas Gerais — distrito colonial de povoamento recente por colonos livres, na estrada entre o coração minerador e o litoral. [CONTEXTUAL] Se a leitura tentativa de 1764 se sustentar, ela e o marido eram ambos da Ilha de São Jorge, nos Açores, fazendo deste casal uma raiz atlântica insular bem distinta da travessia Braga-Minho feita por seu genro uma geração depois. O movimento açoriano para o Brasil nesse período correu tanto como migração individual rumo às lavras quanto, a partir de 1748, como povoamento régio de *casais* no litoral sul; a cronologia situa esta casa na corrente individual anterior. [LEAD quanto à origem; CONTEXTUAL quanto às correntes]

  ## Onde ir hoje

  - **Onde sua filha nasceu, foi batizada e se casou:** Catedral N.S. da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Sua ilha de origem proposta (pista, não confirmada):** Ilha de São Jorge, Açores, Portugal [APPROX / LEAD] · [Maps](https://www.google.com/maps/search/?api=1&query=Ilha%20de%20S%C3%A3o%20Jorge%2C%20A%C3%A7ores%2C%20Portugal)
