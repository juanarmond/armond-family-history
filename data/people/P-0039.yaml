profile: >-
  ## Interesting facts

  - **[PROVEN]** She is the only member of the Azevedo parents' generation whose *presence* is documented, not merely her name. The full-content act of her daughter Luiza's 1916 marriage places her alive and "residente neste districto" of Carangola while recording her husband as already dead (CIV-0006) — a widow who had moved into her daughter's district.

  - **[PROVEN]** Her name is spelled identically across every attestation, forty years apart: "Theresa Fernandes de Azevedo" in 1916 (CIV-0001), "Thereza Fernandes de Azevedo" in 1922 (PAR-0003) and again, exactly, in her daughter Alcida's 1975 death at Mesquita (CIV-0051). Her husband's given name garbles in three of the four; hers never does.

  - **[INFERRED]** That stability is what makes her the identifying thread of the whole family. It was the exact match on her name in the 1975 act — against a mangled "Ascendino" for the father — that let Alcida be recognised as Luiza's sister sixty years after the fact (CIV-0051). In a family with no property, the mother's surname does the work a title deed does elsewhere.

  - **[PROVEN]** She was still alive and named in October 1916 and was deceased by May 1975 (CIV-0006; CIV-0051). Between those two dates no record of her has been found — not a death certificate, not a property record, not a newspaper line.

  - **[CONTEXTUAL]** Born most likely in the 1860s or 1870s in the Zona da Mata Mineira, she would have lived through abolition (1888), the fall of the Empire (1889) and the coffee price collapses that followed — the shocks that pushed families without land off the countryside and toward wage work.

  ## Identity

  **Thereza Fernandes de Azevedo** (also *Theresa*) — the form is consistent across her daughter's 1916 marriage (CIV-0001, PAR-0012), her grandson's 1922 baptism (PAR-0003) and her daughter Alcida's 1975 death (CIV-0051). [PROVEN]

  - **Relationship:** maternal grandmother of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs Thereza → Luiza Fernandes de Azevedo (P-0013) → Antenor. Wife of José Secundino de Azevedo (P-0038); family F-0018. [derived from families F-0018 and F-0001]

  - **Her surname is the line's identifier.** Luiza's "Fernandes" descends from her, and so does Alcida's; the compound "Fernandes de Azevedo" is what holds the sisters together in the record. [PROVEN]

  - **Attestations:** named as Luiza's mother in the 1916 civil and parish marriage (CIV-0001, PAR-0012); recorded living and "residente neste districto" of Carangola in the full-content civil act, her husband already deceased — hence a widow by 21 October 1916 (CIV-0006) [PROVEN]; named maternal grandmother in Aristides's 1922 baptism (PAR-0003), which attests the relationship but does not state that she was then living (the same act names her already-dead husband as grandfather); named, as "falecida", in her daughter Alcida's 1975 death (CIV-0051).

  - **Daughters:** Luiza (P-0013), Alcida Fernandes de Azevedo (d. 1975 Mesquita, RJ — CIV-0051) and Gloria Lacerda de Azevedo (d. 1960 Niterói, RJ — óbito nº 26.483, read in the retrieval drop, **not yet catalogued as a source here**). The total number of her children is unknown; no parental death certificate or inventário exists to give one. [OPEN]

  - **Birth, death and origin:** undocumented; nationality deliberately left unset because no birthplace or stated *nacionalidade* is evidenced. A birth in the 1860s–1870s is implied by a daughter born about 1898. [OPEN]

  ## Standing and profession

  Nothing occupational is recorded for her. [OPEN] Read indirectly, she was a poor rural woman of the Zona da Mata: her daughter Luiza is recorded *doméstica* and explicitly illiterate (CIV-0006), her daughters Alcida and Gloria were both *domésticas* at their deaths, and the household leaves no probate, land register or press trace. [INFERRED] Her own literacy is undocumented; she never appears signing. [OPEN] Her one recorded attribute is a residence — the Carangola district, 1916 — and that residence is itself the most informative thing the archive says about her.

  ## Family and social network

  Mother of Luiza, mother-in-law of Deocleciano Muniz Bittencourt (P-0012) and grandmother of their children. Widowed before October 1916, she was by then living in the same Carangola district as her married daughter, so the surviving Azevedo household had attached itself to the Muniz Bittencourt network. Alcida is recorded as the widow of a **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; the reading that this Manoel was Deocleciano's brother — two of her daughters marrying two brothers — is a research-profile inference and remains a **[LEAD]**. A wider "Fernandes de Azevedo" cluster appears in the Leopoldina / Muriaé / Carangola records of the same period; no kinship to it is proven. [LEAD]

  ## What we can extrapolate

  **1. She is the female face of the Azevedo floor, and her one documented act is a survival strategy. [INFERRED / CONTEXTUAL]** Her husband left no estate; her daughter could not write her own name. Widowed and landless, she did the only thing available to a woman in that position: she moved into her married daughter's district. The 1916 act catches her there — "residente neste districto" — and that single clause is the whole mechanism. **Kinship is being used as the asset the family does not own.** It is the same substitution the immigrant Muniz made after losing an island landholding, but performed from a starting point with no land ever to lose.

  **2. Nothing she held could fragment, because nothing she held was property. [INFERRED / CONTEXTUAL]** Brazilian partible succession divided estates equally among all children and could reduce a comfortable holding to unworkable fractions within two generations. The mechanism simply does not engage here. What she transmitted was a name and a set of relatives — and unlike land, neither of those divides. Three daughters each carried the full "Fernandes de Azevedo" compound; none carried a plot.

  **3. Her longevity, not her property, is the research lever. [INFERRED]** Precisely because the line generates no estate records, the usual route upward — an inventário naming heirs and parents — does not exist. But she outlived her husband by at least six years and was still being named in 1922. A later civil act of hers, above all a death certificate giving her filiation, would name her own parents and is therefore the single most tractable door into the generation above. That is an unusual situation worth stating plainly: in this family the widow, not the patriarch, is the way back.

  **4. Education never entered this household. [CONTEXTUAL]** Literacy in the late-nineteenth-century Zona da Mata was a purchased, class-linked good with no public provision in the countryside, and it had to be re-bought every generation. Her daughter's 1916 marriage act records the purchase not made. There is no decline to explain here; the household began below the line and stayed there.

  **5. The arc is flat, then it urbanises. [INFERRED / CONTEXTUAL]** Her husband's generation worked land they did not own in the Muriaé district; she followed a daughter to Carangola; two other daughters ended in the Rio de Janeiro metropolitan area (Niterói 1960, the Baixada Fluminense 1975); her grandson Antenor died an urban tradesman at Volta Redonda (CIV-0028, 2014). That is the Brazilian rural exodus in four steps, and the family's propertylessness is what made each step cheap. She stands at the first of them.

  ## Open questions

  - **Her own death record** (Carangola or the wider Zona da Mata, after 1922) — as a widow it would name her parents. This is the single most reachable document for opening the Azevedo generation above, and it is off-tool: a cartório request rather than an online index. [OPEN]

  - Her parents, and her own birth and marriage records — none located; a spouse-constrained FamilySearch sweep returned no persona that is her, so the generation above is not indexed online. [OPEN]

  - Whether the Leopoldina / Muriaé "Fernandes de Azevedo" cluster is kin. [OPEN — LEAD]

  ## Sources held (this repository)

  - CIV-0001 and PAR-0012 (the 1916 civil and parish marriage of Luiza × Deocleciano — name her as Luiza's mother) · CIV-0006 (the 1916 full-content civil marriage — records her as a living widow "residente neste districto" of Carangola).

  - PAR-0003 (her grandson Aristides's 1922 baptism — maternal grandmother) · CIV-0051 (the 1975 Mesquita death of her daughter Alcida — an exact match on her name, which is what identifies Alcida as Luiza's sister, and records her as by then deceased).

  ## Regional and migration context

  Part of the Azevedo household of the **São Paulo do Muriaé / Carangola axis** of the Zona da Mata Mineira, and documented in that region only. [CONTEXTUAL] Her origin before it is unrecorded; no island or Portuguese origin is asserted, and none is inferred from the surname. The economy she lived in ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de Queirós), abolition under the Lei Áurea (1888), and land placed on a purchase basis by the Lei de Terras (nº 601, 1850). Her one documented movement is internal and short: from the Muriaé district to Carangola, following a married daughter rather than an opportunity. [INFERRED — the motive; the residence is PROVEN]

  ## Where to go today

  - **Family home (Azevedo seat):** Paróquia São Paulo de Muriaé, Muriaé, MG (Rua Dr Afonso Canedo 47; Bom Jesus de Cachoeira Alegre district) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Par%C3%B3quia%20S%C3%A3o%20Paulo%2C%20Rua%20Dr%20Afonso%20Canedo%2047%2C%20Muria%C3%A9%20-%20MG)

  - **Where she was living as a widow in 1916 — and where her death record should be sought:** Carangola, MG (1º Ofício do Registro Civil, Rua Silva Jardim 27-B, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Carangola%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é a única integrante da geração dos pais Azevedo cuja *presença* está documentada, e não apenas o nome. O inteiro teor do casamento de sua filha Luiza, em 1916, situa-a viva e "residente neste districto" de Carangola, ao mesmo tempo que registra o marido como já falecido (CIV-0006) — uma viúva que se mudara para o distrito da filha.

  - **[PROVEN]** Seu nome é grafado de modo idêntico em todas as atestações, com quarenta anos de intervalo: "Theresa Fernandes de Azevedo" em 1916 (CIV-0001), "Thereza Fernandes de Azevedo" em 1922 (PAR-0003) e, de novo exatamente assim, no óbito de sua filha Alcida em Mesquita, em 1975 (CIV-0051). O prenome do marido se deturpa em três dos quatro; o dela, nunca.

  - **[INFERRED]** Essa estabilidade é o que a torna o fio identificador de toda a família. Foi a correspondência exata de seu nome no ato de 1975 — contra um "Ascendino" deturpado para o pai — que permitiu reconhecer Alcida como irmã de Luiza sessenta anos depois (CIV-0051). Numa família sem propriedade, o sobrenome da mãe faz o trabalho que uma escritura faz em outra parte.

  - **[PROVEN]** Estava viva e nomeada em outubro de 1916 e já era falecida em maio de 1975 (CIV-0006; CIV-0051). Entre essas duas datas nenhum registro dela foi encontrado — nem certidão de óbito, nem registro de propriedade, nem linha de jornal.

  - **[CONTEXTUAL]** Nascida muito provavelmente nos anos 1860 ou 1870 na Zona da Mata Mineira, teria vivido a abolição (1888), a queda do Império (1889) e os colapsos do preço do café que se seguiram — os choques que empurraram as famílias sem terra para fora do campo e em direção ao trabalho assalariado.

  ## Identidade

  **Thereza Fernandes de Azevedo** (também *Theresa*) — a forma é constante no casamento de 1916 de sua filha (CIV-0001, PAR-0012), no batismo de 1922 de seu neto (PAR-0003) e no óbito de 1975 de sua filha Alcida (CIV-0051). [PROVEN]

  - **Parentesco:** avó materna de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre Thereza → Luiza Fernandes de Azevedo (P-0013) → Antenor. Esposa de José Secundino de Azevedo (P-0038); família F-0018. [derivado das famílias F-0018 e F-0001]

  - **Seu sobrenome é o identificador da linha.** O "Fernandes" de Luiza descende dela, e o de Alcida também; o composto "Fernandes de Azevedo" é o que mantém as irmãs juntas no registro. [PROVEN]

  - **Atestações:** nomeada como mãe de Luiza no casamento civil e paroquial de 1916 (CIV-0001, PAR-0012); registrada viva e "residente neste districto" de Carangola no inteiro teor civil, com o marido já falecido — portanto viúva em 21 de outubro de 1916 (CIV-0006) [PROVEN]; nomeada avó materna no batismo de 1922 de Aristides (PAR-0003), que atesta a relação mas não declara que ela estivesse então viva (o mesmo ato nomeia o marido já morto como avô); nomeada, como "falecida", no óbito de 1975 de sua filha Alcida (CIV-0051).

  - **Filhas:** Luiza (P-0013), Alcida Fernandes de Azevedo (f. 1975 em Mesquita, RJ — CIV-0051) e Gloria Lacerda de Azevedo (f. 1960 em Niterói, RJ — óbito nº 26.483, lido no lote de recuperação, **ainda não catalogado como fonte aqui**). O número total de seus filhos é desconhecido; não há certidão de óbito nem inventário dos pais que o forneça. [OPEN]

  - **Nascimento, óbito e origem:** não documentados; nacionalidade deliberadamente não definida, porque nenhum local de nascimento ou *nacionalidade* declarada está evidenciado. Um nascimento nos anos 1860–1870 é implicado por uma filha nascida por volta de 1898. [OPEN]

  ## Posição social e profissão

  Nada ocupacional lhe é registrado. [OPEN] Lida indiretamente, era uma mulher rural pobre da Zona da Mata: sua filha Luiza é registrada *doméstica* e explicitamente analfabeta (CIV-0006), suas filhas Alcida e Gloria eram ambas *domésticas* ao falecer, e o lar não deixa inventário, registro de terras ou rastro de imprensa. [INFERRED] Sua própria alfabetização não está documentada; nunca aparece assinando. [OPEN] Seu único atributo registrado é uma residência — o distrito de Carangola, 1916 — e essa residência é, ela mesma, o que o arquivo diz de mais informativo a seu respeito.

  ## Família e rede social

  Mãe de Luiza, sogra de Deocleciano Muniz Bittencourt (P-0012) e avó dos filhos deles. Viúva antes de outubro de 1916, morava então no mesmo distrito de Carangola de sua filha casada, de modo que o lar Azevedo sobrevivente se havia atado à rede Muniz Bittencourt. Alcida é registrada como viúva de um **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; a leitura de que esse Manoel fosse irmão de Deocleciano — duas de suas filhas casando com dois irmãos — é inferência do perfil de pesquisa e permanece **[LEAD]**. Um aglomerado mais amplo de "Fernandes de Azevedo" aparece nos registros de Leopoldina / Muriaé / Carangola do mesmo período; nenhum parentesco com ele está provado. [LEAD]

  ## O que podemos extrapolar

  **1. Ela é a face feminina do piso Azevedo, e seu único ato documentado é uma estratégia de sobrevivência. [INFERRED / CONTEXTUAL]** O marido não deixou espólio; a filha não sabia escrever o próprio nome. Viúva e sem terra, fez a única coisa disponível a uma mulher nessa posição: mudou-se para o distrito da filha casada. O ato de 1916 a apanha ali — "residente neste districto" — e essa única oração é todo o mecanismo. **O parentesco está sendo usado como o ativo que a família não possui.** É a mesma substituição que os Muniz imigrantes fizeram após perder uma posse insular, mas executada a partir de um ponto de partida em que nunca houve terra a perder.

  **2. Nada do que ela detinha podia fragmentar-se, porque nada do que detinha era propriedade. [INFERRED / CONTEXTUAL]** A sucessão partível brasileira dividia os espólios igualmente entre todos os filhos e podia reduzir uma posse confortável a frações inviáveis em duas gerações. O mecanismo simplesmente não engata aqui. O que ela transmitiu foi um nome e um conjunto de parentes — e, ao contrário da terra, nenhum dos dois se divide. Três filhas carregaram cada uma o composto "Fernandes de Azevedo" inteiro; nenhuma carregou uma gleba.

  **3. Sua longevidade, e não sua propriedade, é a alavanca da pesquisa. [INFERRED]** Justamente porque a linha não gera registros de espólio, a rota usual para cima — um inventário nomeando herdeiros e pais — não existe. Mas ela sobreviveu ao marido por ao menos seis anos e ainda era nomeada em 1922. Um ato civil posterior dela, sobretudo uma certidão de óbito com sua filiação, nomearia seus próprios pais e é, portanto, a porta mais tratável para a geração acima. Vale dizê-lo com todas as letras: nesta família a viúva, não o patriarca, é o caminho de volta.

  **4. A educação nunca entrou neste lar. [CONTEXTUAL]** A alfabetização na Zona da Mata do fim do século XIX era um bem comprado, ligado à classe, sem oferta pública no campo, e tinha de ser recomprada a cada geração. O ato de casamento de sua filha, em 1916, registra a compra não feita. Não há declínio a explicar aqui; o lar começou abaixo da linha e ali permaneceu.

  **5. O arco é plano, e depois se urbaniza. [INFERRED / CONTEXTUAL]** A geração de seu marido lavrava terra que não possuía no distrito de Muriaé; ela seguiu uma filha até Carangola; outras duas filhas terminaram na região metropolitana do Rio de Janeiro (Niterói, 1960; Baixada Fluminense, 1975); seu neto Antenor morreu artífice urbano em Volta Redonda (CIV-0028, 2014). É o êxodo rural brasileiro em quatro passos, e a ausência de propriedade da família é o que tornou cada passo barato. Ela está no primeiro deles.

  ## Questões em aberto

  - **Seu próprio registro de óbito** (Carangola ou a Zona da Mata mais ampla, após 1922) — como viúva, nomearia seus pais. É o documento isolado mais alcançável para abrir a geração Azevedo acima, e está fora do alcance das ferramentas: um pedido a cartório, não um índice on-line. [OPEN]

  - Seus pais e seus próprios registros de nascimento e casamento — nenhum localizado; uma varredura no FamilySearch constrangida pelo cônjuge não retornou persona alguma que seja ela, de modo que a geração acima não está indexada on-line. [OPEN]

  - Se o aglomerado "Fernandes de Azevedo" de Leopoldina / Muriaé é parentela. [OPEN — LEAD]

  ## Fontes disponíveis (neste repositório)

  - CIV-0001 e PAR-0012 (o casamento civil e paroquial de 1916 de Luiza × Deocleciano — nomeiam-na como mãe de Luiza) · CIV-0006 (o casamento civil de 1916 em inteiro teor — registra-a como viúva viva, "residente neste districto" de Carangola).

  - PAR-0003 (batismo de 1922 de seu neto Aristides — avó materna) · CIV-0051 (o óbito de 1975 em Mesquita de sua filha Alcida — correspondência exata de seu nome, que é o que identifica Alcida como irmã de Luiza, e a registra como então já falecida).

  ## Contexto regional e migratório

  Parte do lar Azevedo do **eixo São Paulo do Muriaé / Carangola** da Zona da Mata Mineira, e documentada apenas nessa região. [CONTEXTUAL] Sua origem anterior não está registrada; nenhuma origem insular ou portuguesa é afirmada, e nenhuma é inferida do sobrenome. A economia em que viveu funcionava sobre a transição para o trabalho livre pós-1850 — a Lei nº 581 de 1850 (Lei Eusébio de Queirós), a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850). Seu único deslocamento documentado é interno e curto: do distrito de Muriaé para Carangola, seguindo uma filha casada e não uma oportunidade. [INFERRED — o motivo; a residência é PROVEN]

