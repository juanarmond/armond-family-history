profile: >-
  ## Identity

  **Thereza Fernandes de Azevedo** (also *Theresa*) — consistent across her daughter's 1916
  marriage (CIV-0001) and grandson's 1922 baptism (PAR-0003, PAR-0012). [PROVEN]

  - **Role:** mother of Luiza (Fernandes/Secundina) de Azevedo (P-0013) and wife of José
  Secundino de Azevedo (P-0038; family F-0018); hence maternal grandmother of Antenor
  Muniz's siblings. Luiza's "Fernandes" surname descends from her — the thread that
  identifies the whole line. [PROVEN]

  - **Attestations:** named Luiza's mother in the 1916 civil and parish marriage (CIV-0001,
  PAR-0012) and maternal grandmother in Aristides's 1922 baptism (PAR-0003). Her own vital
  records have not been located. [PROVEN]

  - **Birth, death and origin:** undocumented; nationality deliberately left unset. A birth
  in the 1860s–1870s is implied by a daughter born about 1898. [OPEN]

  ## Standing and profession

  Nothing occupational is documented. Read indirectly, she was almost certainly a poor
  rural woman of the Zona da Mata: her daughter Luiza was an illiterate doméstica, and the
  family leaves no probate, land or press trace. [INFERRED]

  ## Family and social network

  Mother of Luiza, mother-in-law of Deocleciano Muniz Bittencourt (P-0012) and grandmother
  of their children. Her "Fernandes" surname is shared with a wider Fernandes de Azevedo
  cluster of the Leopoldina/Muriaé axis, but any kinship there is unproven. [LEAD]

  ## What we can extrapolate

  Because she and her husband leave the same near-total documentary silence, and her own
  origin is unrecorded, the Azevedo parents' generation stays out of reach; a later record
  naming her filiation would be the most tractable route to it. [INFERRED]

  On the socioeconomic read she is the female face of the Azevedo class floor: a propertyless
  rural widow whose only capital was her married daughter's household. [INFERRED / CONTEXTUAL]
  With her husband (P-0038) leaving no estate and her daughter Luiza (P-0013) an illiterate
  doméstica, she does the one thing such a woman can — she moves into her married daughter's
  district (Carangola, "residente neste districto", 1916), anchoring into the more-established
  Muniz/Brandão network. This is kinship-as-survival-capital: the same substitution the immigrant
  Muniz made for lost land, but from a starting point with no land to have lost.

  Her survival is itself the research lever. [INFERRED] Because the line held no property it
  generates no estate record; but she outlived her husband into the 1920s, so a later civil act
  of hers — a death record naming her parents, or an appearance as a party in a probate — is the
  more tractable route to the generation above. The rare "Fernandes de Azevedo" compound she
  passed to Luiza is the one thread of identity a family with no property still carries — a name
  doing the work an estate would in a wealthier line.

  ## Open questions

  - Her parents — the open gap on this line. [OPEN]

  - Her own birth, marriage and death records — none located. [OPEN]

  ## Sources held (this repository)

  - CIV-0001 and PAR-0012 (the 1916 civil and parish marriage of Luiza × Deocleciano —
  name her as Luiza's mother) · PAR-0003 (grandson Aristides's 1922 baptism — maternal
  grandmother).

  ## Regional and migration context

  Part of the Azevedo family of the São Paulo do Muriaé / Carangola axis of the Zona da
  Mata Mineira. [CONTEXTUAL] Her origin before that region is undocumented; no island or
  Portuguese origin is asserted from the surname. The free-labour coffee economy the family moved
  within ran on the Lei nº 581 de 1850 (Lei Eusébio de Queirós), through abolition in the Lei
  Áurea (1888), with land under the Lei de Terras (nº 601, 1850) — a Brazilian-side history, with
  no Atlantic crossing proven for this line. [CONTEXTUAL]

  ## Where to go today

  - **Family home (Azevedo seat):** Paróquia São Paulo de Muriaé, Muriaé, MG (Rua Dr Afonso
  Canedo 47; Bom Jesus de Cachoeira Alegre district) [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Par%C3%B3quia%20S%C3%A3o%20Paulo%2C%20Rua%20Dr%20Afonso%20Canedo%2047%2C%20Muria%C3%A9%20-%20MG)

  - **Household by 1900:** Niterói, RJ [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Niter%C3%B3i%2C%20RJ)
profile_pt: >-
  ## Identidade

  **Thereza Fernandes de Azevedo** (também *Theresa*) — coerente entre o casamento de sua
  filha em 1916 (CIV-0001) e o batismo do neto em 1922 (PAR-0003, PAR-0012). [PROVEN]

  - **Papel:** mãe de Luiza (Fernandes/Secundina) de Azevedo (P-0013) e esposa de José
  Secundino de Azevedo (P-0038; família F-0018); portanto, avó materna dos irmãos de Antenor
  Muniz. O sobrenome "Fernandes" de Luiza descende dela — o fio que identifica toda a linha.
  [PROVEN]

  - **Atestações:** nomeada mãe de Luiza no casamento civil e paroquial de 1916 (CIV-0001,
  PAR-0012) e avó materna no batismo de 1922 de Aristides (PAR-0003). Seus próprios registros
  vitais não foram localizados. [PROVEN]

  - **Nascimento, óbito e origem:** não documentados; nacionalidade deliberadamente deixada
  em branco. Um nascimento na década de 1860–1870 é sugerido por uma filha nascida por volta
  de 1898. [OPEN]

  ## Posição social e profissão

  Nada de ocupacional está documentado. Lida indiretamente, ela foi quase certamente uma
  mulher rural pobre da Zona da Mata: sua filha Luiza era doméstica e analfabeta, e a família
  não deixa rastro em inventários, terras ou imprensa. [INFERRED]

  ## Família e rede social

  Mãe de Luiza, sogra de Deocleciano Muniz Bittencourt (P-0012) e avó dos filhos deles. Seu
  sobrenome "Fernandes" é compartilhado com um conjunto mais amplo de Fernandes de Azevedo do
  eixo Leopoldina/Muriaé, mas qualquer parentesco ali é não comprovado. [LEAD]

  ## O que podemos extrapolar

  Como ela e o marido deixam o mesmo silêncio documental quase total, e sua própria origem é
  não registrada, a geração dos pais Azevedo permanece fora de alcance; um registro posterior
  que nomeie sua filiação seria a rota mais viável até ela. [INFERRED]

  Na leitura socioeconômica, ela é a face feminina do piso de classe Azevedo: uma viúva rural sem
  propriedade cujo único capital era o lar de sua filha casada. [INFERRED / CONTEXTUAL] Com o
  marido (P-0038) não deixando espólio e a filha Luiza (P-0013) sendo uma doméstica analfabeta,
  ela faz a única coisa que tal mulher pode — muda-se para o distrito de sua filha casada
  (Carangola, "residente neste districto", 1916), ancorando-se na mais estabelecida rede
  Muniz/Brandão. Isto é o parentesco-como-capital-de-sobrevivência: a mesma substituição que os
  imigrantes Muniz fizeram pela terra perdida, mas a partir de um ponto de partida sem terra
  alguma a ter perdido.

  Sua sobrevivência é, ela mesma, a alavanca da pesquisa. [INFERRED] Como a linha não detinha
  propriedade, ela não gera registro de espólio; mas ela sobreviveu ao marido até os anos 1920,
  de modo que um ato civil posterior dela — um óbito que nomeie seus pais, ou uma aparição como
  parte num inventário — é a rota mais viável para a geração acima. O raro composto "Fernandes de
  Azevedo" que ela transmitiu a Luiza é o único fio de identidade que uma família sem propriedade
  ainda carrega — um nome fazendo o trabalho que um espólio faria numa linha mais abastada.

  ## Questões em aberto

  - Seus pais — a lacuna em aberto desta linha. [OPEN]

  - Seus próprios registros de nascimento, casamento e óbito — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0001 e PAR-0012 (o casamento civil e paroquial de 1916 de Luiza × Deocleciano —
  nomeiam-na mãe de Luiza) · PAR-0003 (batismo de 1922 do neto Aristides — avó materna).

  ## Contexto regional e migratório

  Parte da família Azevedo do eixo São Paulo do Muriaé / Carangola da Zona da Mata Mineira.
  [CONTEXTUAL] Sua origem anterior a essa região é não documentada; nenhuma origem insular ou
  portuguesa é afirmada a partir do sobrenome. A economia cafeeira de trabalho livre dentro da
  qual a família se moveu funcionava sobre a Lei nº 581 de 1850 (Lei Eusébio de Queirós), até a
  abolição na Lei Áurea (1888), com a terra sob a Lei de Terras (nº 601, 1850) — uma história do
  lado brasileiro, sem travessia atlântica comprovada para esta linha. [CONTEXTUAL]

  ## Onde ir hoje

  - **Casa da família (sede Azevedo):** Paróquia São Paulo de Muriaé, Muriaé, MG (Rua Dr Afonso
  Canedo 47; distrito de Bom Jesus de Cachoeira Alegre) [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Par%C3%B3quia%20S%C3%A3o%20Paulo%2C%20Rua%20Dr%20Afonso%20Canedo%2047%2C%20Muria%C3%A9%20-%20MG)

  - **Domicílio por volta de 1900:** Niterói, RJ [APPROX] ·
