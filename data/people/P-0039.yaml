  ## Contexto regional e migratório


  [CONTEXTUAL] Ela nasceu no Minho, no concelho de Barcelos, distrito de Braga — uma região de
  pequenas propriedades muito divididas, cujos filhos excedentes vinham partindo para o Brasil
  desde o século XVIII. O percurso de sua própria família está documentado passo a passo: Souto,
  Pousa, até pelo menos outubro de 1871 (PAR-0135); São João do Laranjal, na Zona da Mata de Minas
  Gerais, em junho de 1885 (PRB-0016); São Paulo do Muriaé em março de 1890, onde o testamento
  do pai foi lavrado e aprovado (PRB-0013); e o distrito do Bom Jesus da Cachoeira Alegre em 1898
  (PRB-0014). [PROVEN — os lugares; a data da travessia INFERRED] A afirmação anterior de que
  "nenhuma origem insular ou portuguesa é afirmada" fica superada para ela: um nascimento português
  está documentado por seu batismo, não inferido de um sobrenome. Sua origem é o Minho, não a
  Madeira; o fio madeirense nos registros Azevedo ao redor pertence a uma colateral de Carangola
  sem parentesco provado e nunca disse respeito a ela. A economia em que a família entrou funcionava
  sobre a transição para o trabalho livre pós-1850 — a Lei nº 581 de 1850 (Lei Eusébio de Queirós),
  a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601,
  1850) —, e sua demanda por trabalho livre é o cenário da chegada da família. [CONTEXTUAL] Sua
  nacionalidade legal depois de 1889 não fica resolvida pelo nascimento: pela "grande naturalização"
  da República (Decreto nº 58-A, de 14 de dezembro de 1889), os estrangeiros residentes no Brasil
  em 15 de novembro de 1889 tornaram-se cidadãos brasileiros salvo declaração em contrário no
  prazo de seis meses, e nenhum registro mostra se ela ou o pai fizeram essa declaração. [CONTEXTUAL
  / OPEN] Seu último deslocamento documentado é interno e curto: do distrito do Bom Jesus para
  Carangola, seguindo uma filha casada. [INFERRED — o motivo; a residência é PROVEN]


