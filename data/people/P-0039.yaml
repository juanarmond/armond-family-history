notes:
- text: >-
    Mother of Luiza (Fernandes/Secundina) de Azevedo (P-0013), hence Antenor Muniz's
    maternal grandmother. Named as Luiza's mother in the 1916 marriage (CIV-0001, as
    "Theresa Fernandes de Azevedo") and as Aristides Muniz Bittencourt's maternal
    grandmother in the 1922 baptism (PAR-0003, as "Thereza Fernandes de Azevedo").
    Luiza's "Fernandes" surname descends from her. Her own vital records are not
    located.
  text_pt: >-
    Mãe de Luiza (Fernandes/Secundina) de Azevedo (P-0013), portanto avó materna de
    Antenor Muniz. Nomeada como mãe de Luiza no casamento de 1916 (CIV-0001, como
    "Theresa Fernandes de Azevedo") e como avó materna de Aristides Muniz Bittencourt
    no batismo de 1922 (PAR-0003, como "Thereza Fernandes de Azevedo"). O sobrenome
    "Fernandes" de Luiza descende dela. Seus próprios registros vitais não foram
    localizados.
