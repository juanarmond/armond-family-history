profile: >-
  ## Interesting facts

  - **[PROVEN]** Named as father in three documents spanning three decades — his son's 1819 marriage (PAR-0037), his daughter's 1818 marriage (PAR-0048), and his grandson's 1843 baptism (PAR-0044) — with no record of his own located: he survives entirely through his children's and grandchildren's acts.

  - **[CONTEXTUAL]** He lived on Ilha de São Miguel during the island's orange-export boom (peak c.1820s–1850s), before the citrus blight of the 1850s–1860s collapsed that economy and set off the emigration wave that eventually carried his great-grandsons to Brazil — he died without seeing the crisis that shaped his descendants' futures.

  - **[INFERRED]** His son João Francisco was a proprietário at Mãe de Deus — suggesting the family held a modest documented landholding. On São Miguel's morgadio-entailed island, where patrimony passed largely intact, that holding most plausibly descended from this man's estate; it was the smallest heritable kind, not office or commerce, but enough to mark the family as landed.

  - **[INFERRED]** A "Manoel Moniz de Bitancourt" signed his own name as a witness at a Mãe de Deus marriage in 1809 — if this is the same man, he was literate, a modest status marker above most parishioners who signed only with a cross; but the identification is unproven, as the surname was not unique in the parish.

  ## Identity

  **Manoel Muniz Bitancourt** ("the elder") — father of João Francisco Muniz Bitancourt
  (P-0048) and husband of Tereza do Amaral (P-0083), family F-0040. [PROVEN as named]

  - **Name and variants:** named in his son's 7 October 1819 Mãe de Deus marriage (PAR-0037)
  as "Manoel Muniz Bitancourt"; the same parish marriage book also records him as "Manoel
  Muniz" in his daughter's 1818 marriage (PAR-0048). His own vital records are not located.
  [PROVEN as named]

  - **"The elder":** distinguished from his grandson Manoel Muniz Bytancourt (P-0042,
  b.1821), who carries the same given name and surname — the Azorean same-name-across-generations
  pattern. [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores); Portuguese (Açorean) — his children are recorded as native to the parish. [INFERRED]

  - **Literacy (lead):** a "Manoel Moniz de Bitancourt" witnessed and signed his own name at a
  Mãe de Deus marriage in 1809; plausibly this man, which would make him literate — a modest
  status marker above the many parishioners who signed with a cross. The surname is not unique
  in the parish, so the identification is not proven. [LEAD]

  ## Standing and profession

  - **Nothing documented** [PROVEN absence]. He appears in the held records only as a named
  parent (PAR-0037, PAR-0048) and as a named grandparent (PAR-0044); none of those acts
  states an occupation, office, title or property for him, and none carries a signature of
  his. The Mãe de Deus formularies of the 1810s–40s name parents and grandparents without
  describing them.

  - **[INFERRED]** His son João is recorded a *proprietário* at Mãe de Deus (PAR-0015),
  which makes a landholding household the most plausible setting for him; but that is an
  inference from the next generation, not a statement any record makes about this man. The
  field is left unset deliberately.

  ## Family and social network

  Husband of Tereza do Amaral (P-0083) and father of the Mãe de Deus landowner João Francisco
  Muniz Bitancourt (P-0048), through whom the line reaches the emigrant João Muniz Bittencourt
  (P-0019). Two further relatives are now documented: a daughter, Maria Jacintha de Medeiros,
  who married Manoel Cabral on 30 December 1818 (PAR-0048), and a grandson, Agostinho Muniz,
  whose 1843 baptism (PAR-0044) names this couple as his paternal grandparents ("Manoel Munis
  de Betencourt" and the devotional variant "Tereza d'Assumpção"). His daughters took the
  maternal "de Medeiros" surname, his son the paternal "Muniz Bitancourt". A further daughter,
  Roza Jacinta de Medeiros (⚭ João Jacinto, 1819), was read in the same register but is not yet
  promoted here. [PROVEN for the son, the 1818 daughter and the grandson; Roza a LEAD]

  Namesake caution: this documented daughter Maria Jacintha de Medeiros is a *different* woman
  from her same-named niece-by-marriage, the spine ancestor Maria Jacintha de Medeiros (P-0049,
  daughter of João de Medeiros Brandão × Maria Eugenia); the two must never be merged (PAR-0048).

  ## What we can extrapolate

  *Proportionate to the top of the documented patriline — a man named only as a parent and a
  grandparent.*

  **1. His standing is entirely inferential, and should stay that way [PROVEN absence /
  INFERRED].** Not one of the three acts that name him states an occupation, property,
  office or title (PAR-0037, PAR-0048, PAR-0044). His son João is recorded a *proprietário*
  at Mãe de Deus in 1866 (PAR-0015), which makes a landholding household the plausible
  setting; but no record says so of this man, and on a *morgadio*-entailed island where
  patrimony passed largely intact to a firstborn, the direction of transmission cannot be
  assumed from the son's status alone.

  **2. What his records do establish is depth in one parish [PROVEN / INFERRED].** His
  children are "naturaes e freguezes desta dita Igreja onde forão baptizados" (PAR-0037,
  PAR-0048), and his grandchildren are recorded the same way a generation later (PAR-0038 to
  PAR-0044). **[INFERRED]** Three consecutive generations born, married and buried inside
  the freguesia of Nossa Senhora Mãe de Deus is the whole of what he transmitted: local
  belonging, which cost nothing, was real, and proved entirely non-portable when his
  great-grandsons crossed the Atlantic.

  **3. He settled two children in ten months, newly widowed [PROVEN / INFERRED].** His wife
  Tereza do Amaral is recorded "já defunta" by October 1819 (PAR-0037), and is named without
  that marker at his daughter's marriage the previous December (PAR-0048). In those ten
  months he married off a daughter and a son in the same church. **[INFERRED]** A widower
  settling two adult children in quick succession is a household reorganising after the loss
  of the mother; it is also the moment at which whatever he held first became a question of
  who would inherit it.

  **4. No status display anywhere in his record [PROVEN absence / INFERRED].** Neither he
  nor his wife is ever given an honorific, in registers that style a witness at his own
  daughter's wedding *Capitão* (Luis Antonio de Almeida, PAR-0048). **[INFERRED]** "Muniz
  Bitancourt" recurs across the Povoação books in collateral cousin-couples, consistent with
  an endogamous small-proprietor kin network rather than a titled or office-holding house.
  He sits at the documented top of the line and it is already, visibly, a modest one — which
  is the point: the Muniz arc has no lost golden age above it.

  ## Open questions

  - His marriage to Tereza do Amaral is a bounded negative across the 1801–1822 Mãe de Deus
  marriage book (all 196 pages read; the couple appear only as parents) → the marriage is
  pre-1801, consistent with children already marrying in 1818–1819. The pre-1818 Mãe de Deus
  books are not online (BPARPD, Ponta Delgada). [OPEN]

  - His own baptism, death and parents lie in the same pre-1801 books; off-tool. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of his son João Francisco — names him as the groom's father) ·
  PAR-0048 (1818 marriage of his daughter Maria Jacintha de Medeiros to Manoel Cabral — names
  him as the bride's father) · PAR-0044 (1843 baptism of his grandson Agostinho — names him a
  paternal grandparent, "Manoel Munis de Betencourt").

  ## Regional and migration context

  The deepest São Miguel root of the Muniz Byttancourt patriline yet reached — a resident of
  N.S. Mãe de Deus / Povoação, with no move documented. [INFERRED] The Atlantic crossing is
  three generations below him (his great-grandsons, between 1866 and 1882 (most plausibly
  near 1880; see P-0019)), driven by the island's *morgadio* land-lock, overpopulation and
  the 1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil pull ran through
  the mid-century legal shift — the Lei nº 581 de 4 de setembro de 1850 (Eusébio de
  Queirós), ending the Atlantic slave trade, and the Lei de Terras (nº 601/1850) — while the
  São Miguel push eased as the Carta de Lei de 19 de maio de 1863 abolished the Portuguese
  *morgadios* in the very years they crossed. [CONTEXTUAL]

  ## Where to go today

  - **Family parish — witness (1809), children's marriages (1818/1819):** Igreja Matriz de
  Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coords
  37.74891, -25.24372) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeado como pai em três documentos ao longo de três décadas — o casamento de seu filho em 1819 (PAR-0037), o casamento de sua filha em 1818 (PAR-0048) e o batismo de seu neto em 1843 (PAR-0044) — sem que nenhum registro próprio tenha sido localizado: sobrevive inteiramente pelos atos de seus filhos e netos.

  - **[CONTEXTUAL]** Viveu na Ilha de São Miguel durante o auge das exportações de laranja da ilha (c.1820–1850), antes de a praga dos citros das décadas de 1850–1860 colapsar essa economia e desencadear a onda de emigração que levou seus bisnetos ao Brasil — morreu sem ver a crise que moldou o futuro da família.

  - **[INFERRED]** Seu filho João Francisco era proprietário em Mãe de Deus — indicando que a família detinha uma modesta posse fundiária documentada. Na ilha de São Miguel, vinculada pelo morgadio, onde o patrimônio passava em grande parte intacto, essa posse muito provavelmente desceu deste homem; era o menor tipo herdável, não ofício nem comércio, mas suficiente para marcar a família como proprietária.

  - **[INFERRED]** Um "Manoel Moniz de Bitancourt" assinou o próprio nome como testemunha num casamento em Mãe de Deus em 1809 — se for este homem, era alfabetizado, um modesto marcador de posição acima dos paroquianos que assinavam apenas com uma cruz; mas a identificação não está provada, pois o sobrenome não era único na freguesia.

  ## Identidade

  **Manoel Muniz Bitancourt** ("o velho") — pai de João Francisco Muniz Bitancourt (P-0048) e
  marido de Tereza do Amaral (P-0083), família F-0040. [PROVEN quanto ao nome]

  - **Nome e variantes:** nomeado no casamento de seu filho em 7 de outubro de 1819, em Mãe de
  Deus (PAR-0037), como "Manoel Muniz Bitancourt"; o mesmo livro de casamentos da freguesia
  também o registra como "Manoel Muniz" no casamento de 1818 de sua filha (PAR-0048). Seus
  próprios registros vitais não foram localizados. [PROVEN quanto ao nome]

  - **"O velho":** distinto de seu neto Manoel Muniz Bytancourt (P-0042, n.1821), que
  carrega o mesmo prenome e sobrenome — o padrão açoriano de nomes repetidos entre gerações. [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores); português (açoriano) — seus filhos são registrados como naturais da freguesia. [INFERRED]

  - **Alfabetização (pista):** um "Manoel Moniz de Bitancourt" foi testemunha e assinou o próprio
  nome num casamento em Mãe de Deus em 1809; plausivelmente este homem, o que o tornaria
  alfabetizado — um modesto marcador de posição acima dos muitos paroquianos que assinavam com
  uma cruz. O sobrenome não é único na freguesia, portanto a identificação não está provada. [LEAD]

  ## Posição social e profissão

  - **Nada documentado** [PROVEN na ausência]. Nos registros que temos, ele aparece apenas
  como pai nomeado (PAR-0037, PAR-0048) e como avô nomeado (PAR-0044); nenhum desses atos
  lhe declara ocupação, cargo, título ou bens, e nenhum traz assinatura sua. Os formulários
  de Mãe de Deus das décadas de 1810 a 1840 nomeiam pais e avós sem descrevê-los.

  - **[INFERRED]** Seu filho João é registrado como *proprietário* em Mãe de Deus
  (PAR-0015), o que torna uma casa com terras o cenário mais plausível para ele; mas isso é
  inferência a partir da geração seguinte, e não afirmação que registro algum faça sobre
  este homem. O campo fica deliberadamente sem preencher.

  ## Família e rede social

  Marido de Tereza do Amaral (P-0083) e pai do proprietário de Mãe de Deus João Francisco Muniz
  Bitancourt (P-0048), por meio de quem a linha alcança o emigrante João Muniz Bittencourt
  (P-0019). Dois outros parentes estão agora documentados: uma filha, Maria Jacintha de Medeiros,
  que se casou com Manoel Cabral em 30 de dezembro de 1818 (PAR-0048), e um neto, Agostinho
  Muniz, cujo batismo de 1843 (PAR-0044) nomeia este casal como seus avós paternos ("Manoel
  Munis de Betencourt" e a variante devocional "Tereza d'Assumpção"). Suas filhas adotaram o
  sobrenome materno "de Medeiros", e o filho o paterno "Muniz Bitancourt". Uma outra filha, Roza
  Jacinta de Medeiros (⚭ João Jacinto, 1819), foi lida no mesmo registro, mas ainda não está
  promovida aqui. [PROVEN quanto ao filho, à filha de 1818 e ao neto; Roza uma LEAD]

  Cautela de homonímia: esta filha documentada, Maria Jacintha de Medeiros, é uma mulher
  *diferente* de sua sobrinha por afinidade homônima, a ancestral da linha principal Maria
  Jacintha de Medeiros (P-0049, filha de João de Medeiros Brandão × Maria Eugenia); as duas
  nunca devem ser fundidas (PAR-0048).

  ## O que podemos extrapolar

  *Proporcional ao topo da patrilinha documentada — um homem nomeado apenas como pai e como
  avô.*

  **1. Sua posição é inteiramente inferencial, e assim deve permanecer [PROVEN na ausência /
  INFERRED].** Nenhum dos três atos que o nomeiam declara ocupação, bens, cargo ou título
  (PAR-0037, PAR-0048, PAR-0044). Seu filho João é registrado *proprietário* em Mãe de Deus
  em 1866 (PAR-0015), o que torna plausível uma casa com terras; mas registro algum o diz
  deste homem, e numa ilha travada pelo *morgadio*, em que o patrimônio passava quase
  íntegro a um primogênito, a direção da transmissão não pode ser presumida só pela condição
  do filho.

  **2. O que seus registros estabelecem é profundidade numa só freguesia [PROVEN /
  INFERRED].** Seus filhos são "naturaes e freguezes desta dita Igreja onde forão
  baptizados" (PAR-0037, PAR-0048), e seus netos são registrados do mesmo modo uma geração
  depois (PAR-0038 a PAR-0044). **[INFERRED]** Três gerações consecutivas nascidas, casadas
  e sepultadas dentro da freguesia de Nossa Senhora Mãe de Deus é tudo o que ele transmitiu:
  pertencimento local, que nada custava, era real e se provou inteiramente intransportável
  quando seus bisnetos atravessaram o Atlântico.

  **3. Estabeleceu dois filhos em dez meses, recém-enviuvado [PROVEN / INFERRED].** Sua
  mulher Tereza do Amaral está registrada "já defunta" em outubro de 1819 (PAR-0037), e é
  nomeada sem esse indicativo no casamento da filha, em dezembro anterior (PAR-0048). Nesses
  dez meses casou uma filha e um filho na mesma igreja. **[INFERRED]** Um viúvo
  estabelecendo dois filhos adultos em rápida sucessão é uma casa que se reorganiza depois
  da perda da mãe; é também o momento em que o que quer que ele tivesse passou, pela
  primeira vez, a ser uma questão de quem herdaria.

  **4. Nenhuma exibição de posição em todo o seu registro [PROVEN na ausência / INFERRED].**
  Nem ele nem a mulher recebem jamais tratamento honorífico, em registros que chamam de
  *Capitão* uma testemunha do casamento da própria filha (Luis Antonio de Almeida,
  PAR-0048). **[INFERRED]** "Muniz Bitancourt" recorre nos livros da Povoação em casais de
  primos colaterais, coerente com uma rede endogâmica de pequenos proprietários, e não com
  uma casa titulada ou de cargos. Ele ocupa o topo documentado da linhagem, e este já é,
  visivelmente, modesto — que é justamente o ponto: o arco Muniz não tem, acima de si,
  nenhuma idade de ouro perdida.

  ## Questões em aberto

  - Seu casamento com Tereza do Amaral é um negativo delimitado em todo o livro de casamentos de
  Mãe de Deus de 1801–1822 (todas as 196 páginas lidas; o casal aparece apenas como pais) → o
  casamento é anterior a 1801, coerente com filhos já se casando em 1818–1819. Os livros de Mãe de
  Deus anteriores a 1818 não estão online (BPARPD, Ponta Delgada). [OPEN]

  - Seu próprio batismo, óbito e pais estão nos mesmos livros anteriores a 1801; fora de alcance. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de seu filho João Francisco — o nomeia como pai do noivo) ·
  PAR-0048 (casamento de 1818 de sua filha Maria Jacintha de Medeiros com Manoel Cabral — o
  nomeia como pai da noiva) · PAR-0044 (batismo de 1843 de seu neto Agostinho — o nomeia como avô
  paterno, "Manoel Munis de Betencourt").

  ## Contexto regional e migratório

  A raiz mais profunda em São Miguel da patrilinha Muniz Byttancourt até agora alcançada —
  um residente de N.S. Mãe de Deus / Povoação, sem mudança documentada. [INFERRED] A
  travessia atlântica está três gerações abaixo dele (seus bisnetos, entre 1866 e 1882 (mais
  plausivelmente por volta de 1880; ver P-0019)), impulsionada pelo bloqueio fundiário do
  *morgadio* da ilha, pela superpopulação e pelo colapso, na década de 1860, da economia de
  exportação da laranja. [CONTEXTUAL] A atração para o Brasil passou pela mudança legal de
  meados do século — a Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós), que
  encerrou o tráfico atlântico de escravizados, e a Lei de Terras (nº 601/1850) —, enquanto
  o empurrão em São Miguel afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os
  *morgadios* portugueses nos próprios anos em que eles cruzaram. [CONTEXTUAL]

