notes:
- text: >-
    Father of João Francisco Muniz Bitancourt (P-0048); hence the paternal
    great-grandfather of the emigrant João Muniz Bittencourt (P-0019). Named in his
    son's 7 October 1819 Mãe de Deus marriage (PAR-0037) as "Manoel Muniz
    Bitancourt", husband of Tereza do Amaral (P-0083). "Manoel Muniz Bitancourt the
    elder", distinct from his grandson Manoel Muniz Bytancourt (P-0042). His own
    baptism, marriage and death records are not located; the family is native to
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores).
  text_pt: >-
    Pai de João Francisco Muniz Bitancourt (P-0048); portanto, o trisavô paterno do
    emigrante João Muniz Bittencourt (P-0019). Nomeado no casamento de seu filho em
    7 de outubro de 1819, em Mãe de Deus (PAR-0037), como "Manoel Muniz Bitancourt",
    marido de Tereza do Amaral (P-0083). "Manoel Muniz Bitancourt, o velho",
    distinto de seu neto Manoel Muniz Bytancourt (P-0042). Seus próprios registros
    de batismo, casamento e óbito não foram localizados; a família é natural de
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores).
