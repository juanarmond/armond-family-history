profile: >-
  ## Identity

  **Ladisláo Egydio Ferreira de Toledo** (register spelling *Ladislau*; "Ladislau Egídio
  Ferreira" without "de Toledo" in his 1821 daughter's baptism, PAR-0017) [PROVEN]. He is
  Eliza Balbina de Toledo's paternal grandfather and, through her father José Cezário
  (P-0054), a direct-line ancestor — the apical Toledo of the direct line until his own
  parents were reached.

  - Distinct from his namesake grandson "Ladisláo Egydio Ferreira de Toledo, solteiro, de
  23 annos" (heir #4's son in PRB-0006) — the two same-name men were a documented trap,
  resolved by the 1879 inventário.

  - **Baptism:** 9 September 1787, Capela de N.S. da Piedade, Borda do Campo (Barbacena)
  [PROVEN — PAR-0019, event E-0050], son of [Joaquim/João] José Ferreira de Toledo (P-0057)
  × Ritta Angélica Rodrigues (P-0058), family F-0028. The base scan was ink-bled; the
  filiation was recovered by image processing and corroborated by the 1810 marriage.

  - **Marriage:** ⚭ Mathilde Maria de Jesus (P-0027), 8 May 1810, Matriz de N.S. do Pilar,
  São João del Rei [PROVEN — PAR-0023, event E-0052]; both spouses "naturaes e batizados da
  Freguesia de Barbacena", family F-0027.

  - **Death:** before 2 August 1862 [PROVEN] — the 1862 Concórdia purchase deed (PRB-0007)
  names Matilde "viúva de Ladisláo Egídio Ferreira de Toledo." A retrieval transcript reads
  "c.27 April 1855" from his 1867 inventário — [LEAD], not image-verified. His own estate
  was settled as a contested partition in the Leopoldina Juízo de Órfãos (citation
  audiences 13 Nov 1880 and 6 Aug 1881; 1881–82 embargos) — those are process dates, not
  his death.

  ## Standing and profession

  - **Landholder / fazendeiro** [PROVEN] — the Fazenda da Concórdia (Rio Pardo / Thebes,
  Leopoldina), which his widow Matilde bought in 1862 (PRB-0007); a slaveholding household
  [PROVEN — inventário context].

  - A retrieval draft adds that the 1839 Bonfim population register marks him literate
  ("Sabe Ler") and that he served as court louvado/appraiser in the Rio Pomba area
  (1834–43) — [LEAD], not catalogued here.

  ## Family and social network

  - Parents: João/Joaquim José Ferreira de Toledo (P-0057) × Ritta Angélica Rodrigues
  (P-0058), family F-0028. His paternal grandparents Gaspar Ferreira × Gertrudes Maria [de
  Toledo] of Vila Rica, and maternal grandparents João Rodrigues do Valle × Izabel Ribeira,
  are named in PAR-0018 as leads.

  - Wife: Mathilde Maria de Jesus (P-0027, d.1879).

  - **Children (eight per PRB-0009):** José Cesário de Toledo Lima (P-0054, our line);
  Francisco Leocádio de Toledo (P-0061); António Ladislão de Toledo (P-0063, deaf-mute
  carpenter, d.1909, CIV-0024); Maria Perpétua (⚭ Antonio Zeferino de Toledo); Ignez
  Mettelina (⚭ José Pedro da Silva); Carolina Leopoldina Marques (⚭ Narciso Marques Braz);
  Aureliano de Sales Toledo; and Cezário José de Toledo (⚭ Maria José de Jesus, the 1879
  inventariante). Also documented: a daughter Carolina, baptised 1821 at Barbacena
  (PAR-0017).

  - His own sisters Anna Belizaria (m.1812, PAR-0020) and Carolina Francelina (m.1816,
  PAR-0021) anchor his birth family.

  ## What we can extrapolate

  He is the pivotal generation that carried the Toledo line down from the Barbacena / São
  João del Rei gold highlands into the eastern zona da mata: baptised and married in the
  highlands (1787, 1810), his widow bought the Fazenda da Concórdia in the coffee-frontier
  forest, from which the next generation (Eliza) married into the Armonds. [INFERRED]

  - **Inherited, land-backed standing — the structural contrast with the Armonds** [INFERRED].
  As child #1 of a Capitão and husband of Matilde (whose family held the Fazenda da Concórdia),
  his standing rested on heritable **land** worked by enslaved labour, not on office income.
  The court-appraiser / *louvado* role attributed to him by a retrieval lead (1834–43) is the
  same trusted-notable function his grandson-in-law Simplício Armond would later hold — but
  Ladisláo held it *from a land base*, where Simplício held it married-in and office-contingent.
  Land-backed status transmits; office-contingent status does not. [INFERRED; the louvado role a LEAD]

  - **Wealth in land + enslaved persons, then the land→cash pivot** [PROVEN base; benchmarks
  family-documented / CONTEXTUAL]. His household's capital was the Concórdia land and the
  enslaved people carried through the inventários — heritable productive capital, the basis of
  the region's coffee economy. Partitioned among his many children and sold (~1879–80), that
  capital converts to one-time cash shares: his granddaughter **Eliza's** quota in Matilde's
  1879 estate (PRB-0006) reads ≈1:539$781 — on regional benchmarks about the price of one
  enslaved person (~1 conto) or ~3.7 rural-wage-years. It funded, rather than arrested, the
  family's later slide.

  - **Endogamy as a counter to partible fragmentation** [INFERRED]. His brother Antônio
  Zeferino married his daughter Maria Perpétua (an uncle-niece match), and further Toledo ×
  Toledo/Silva marriages recur — the classic elite strategy of a landed family reconsolidating
  property against the partible succession that otherwise splits an estate among all children
  every generation.

  - **Literacy as a class marker** [CONTEXTUAL; the underlying fact a retrieval LEAD]. If the
  retrieval reading of the 1839 Bonfim census ("Sabe Ler") holds, his literacy is not
  incidental: in a largely illiterate population a literate fazendeiro marks the propertied
  gentry, and literacy in this era was a purchased, class-linked competence re-bought each
  generation — the lettered maternal line into which the Armonds later married up.

  ## Open questions

  - His exact death date — the repo bound is before 2 August 1862; the "1855" transcript
  reading is unverified. [OPEN]

  - Whether the child-vs-son-in-law structure of Francisco Leocádio (P-0061) survives the
  1881–82 embargos (see that conflict). [OPEN]

  ## Sources held (this repository)

  - PAR-0019 (1787 Barbacena baptism — parents) · PAR-0023 (1810 SJdRei marriage — parents
  and wife) · PAR-0017 (1821 Barbacena baptism of his daughter Carolina) · PAR-0018 /
  PAR-0020 / PAR-0021 (his parents' marriage and two sisters' marriages).

  - PRB-0007 (1862 Concórdia deed — Matilde his widow, the death bound) · PRB-0009 (1867
  inventário — eight children) · PRB-0006 (1879 Matilde inventário — resolves the two
  Ladisláos) · PRB-0004 (Concórdia / São Bento deed) · CIV-0024 (1909 death of his son
  António Ladislão — names him as father).

  ## Regional and migration context

  Barbacena (baptism 1787) → São João del Rei (marriage 1810) → the Rio Pardo / Leopoldina
  zona da mata (Fazenda da Concórdia). His is the generation that moved the family from the
  Campo das Vertentes highland — the gold-era supply zone that turned to farming after
  ~1760 — east onto the 19th-century coffee frontier near the Rio market. That eastern forest
  had been Crown-forbidden through the 18th century (the "Sertões do Leste", a fiscal barrier
  against gold smuggling); the Carta Régia de 13 de maio de 1808 lifted the prohibition and
  opened the Pomba, Muriaé and Carangola valleys where the Concórdia lay. The coffee economy
  that followed ran on enslaved labour until abolition (1888) — Leopoldina held the
  second-largest enslaved population in Minas Gerais by 1883. [CONTEXTUAL]

  ## Where to go today

  - **Baptism (9 Sep 1787):** Santuário-Matriz de N.S. da Piedade, Barbacena, MG (Rua Vigário Brito 26; the old N.S. da Piedade parish) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Vigario%20Brito%2026%2C%20Barbacena%2C%20MG)

  - **Marriage (8 May 1810):** Catedral Basílica de N.S. do Pilar, São João del-Rei (Rua Monsenhor Gustavo 61) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Monsenhor%20Gustavo%2061%2C%20Sao%20Joao%20del%20Rei%2C%20MG)

  - **Fazendeiro seat:** Fazenda da Concórdia, distrito de Tebas (Leopoldina), MG [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **Louvado work (1834–43):** Rio Pomba, MG [RESOLVED — município] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.27500,-43.17889)
profile_pt: >-
  ## Identidade

  **Ladisláo Egydio Ferreira de Toledo** (grafia de registro *Ladislau*; "Ladislau Egídio
  Ferreira", sem o "de Toledo", no batismo de sua filha em 1821, PAR-0017) [PROVEN]. É o
  avô paterno de Eliza Balbina de Toledo e, por meio do pai dela José Cezário (P-0054), um
  ancestral da linha direta — o Toledo apical da linha direta até que seus próprios pais
  fossem alcançados.

  - Distinto de seu neto homônimo "Ladisláo Egydio Ferreira de Toledo, solteiro, de 23
  annos" (filho do herdeiro nº 4 em PRB-0006) — os dois homônimos foram uma armadilha
  documentada, resolvida pelo inventário de 1879.

  - **Batismo:** 9 de setembro de 1787, Capela de N.S. da Piedade, Borda do Campo
  (Barbacena) [PROVEN — PAR-0019, evento E-0050], filho de [Joaquim/João] José Ferreira de
  Toledo (P-0057) × Ritta Angélica Rodrigues (P-0058), família F-0028. O scan-base estava
  borrado de tinta; a filiação foi recuperada por processamento de imagem e corroborada
  pelo casamento de 1810.

  - **Casamento:** ⚭ Mathilde Maria de Jesus (P-0027), 8 de maio de 1810, Matriz de N.S. do
  Pilar, São João del Rei [PROVEN — PAR-0023, evento E-0052]; ambos os cônjuges "naturaes e
  batizados da Freguesia de Barbacena", família F-0027.

  - **Óbito:** antes de 2 de agosto de 1862 [PROVEN] — a escritura de compra da Concórdia
  de 1862 (PRB-0007) nomeia Matilde "viúva de Ladisláo Egídio Ferreira de Toledo". Uma
  transcrição de recuperação lê "c.27 de abril de 1855" a partir de seu inventário de 1867
  — [LEAD], não verificado por imagem. Seu próprio espólio foi liquidado como partilha
  contestada no Juízo de Órfãos de Leopoldina (audiências de citação em 13 nov. 1880 e 6
  ago. 1881; embargos de 1881–82) — essas são datas processuais, não de seu óbito.

  ## Posição social e profissão

  - **Proprietário de terras / fazendeiro** [PROVEN] — a Fazenda da Concórdia (Rio Pardo /
  Thebes, Leopoldina), que sua viúva Matilde comprou em 1862 (PRB-0007); uma casa
  escravista [PROVEN — contexto de inventário].

  - Um rascunho de recuperação acrescenta que o registro populacional de Bonfim de 1839 o
  marca letrado ("Sabe Ler") e que atuou como louvado/avaliador judicial na região do Rio
  Pomba (1834–43) — [LEAD], não catalogado aqui.

  ## Família e rede social

  - Pais: João/Joaquim José Ferreira de Toledo (P-0057) × Ritta Angélica Rodrigues
  (P-0058), família F-0028. Seus avós paternos Gaspar Ferreira × Gertrudes Maria [de
  Toledo], de Vila Rica, e avós maternos João Rodrigues do Valle × Izabel Ribeira, são
  nomeados em PAR-0018 como pistas.

  - Esposa: Mathilde Maria de Jesus (P-0027, f.1879).

  - **Filhos (oito conforme PRB-0009):** José Cesário de Toledo Lima (P-0054, nossa linha);
  Francisco Leocádio de Toledo (P-0061); António Ladislão de Toledo (P-0063, carpinteiro
  surdo-mudo, f.1909, CIV-0024); Maria Perpétua (⚭ Antonio Zeferino de Toledo); Ignez
  Mettelina (⚭ José Pedro da Silva); Carolina Leopoldina Marques (⚭ Narciso Marques Braz);
  Aureliano de Sales Toledo; e Cezário José de Toledo (⚭ Maria José de Jesus, o
  inventariante de 1879). Também documentada: uma filha Carolina, batizada em 1821 em
  Barbacena (PAR-0017).

  - Suas próprias irmãs Anna Belizaria (c.1812, PAR-0020) e Carolina Francelina (c.1816,
  PAR-0021) ancoram sua família de nascimento.

  ## O que podemos extrapolar

  É a geração pivô que levou a linha Toledo das terras altas auríferas de Barbacena / São
  João del Rei para a zona da mata a leste: batizado e casado nas terras altas (1787,
  1810), sua viúva comprou a Fazenda da Concórdia na floresta da fronteira cafeeira, de
  onde a geração seguinte (Eliza) casou-se com os Armond. [INFERRED]

  - **Posição herdada e ancorada em terra — o contraste estrutural com os Armond** [INFERRED].
  Como filho nº 1 de um Capitão e marido de Matilde (cuja família detinha a Fazenda da
  Concórdia), sua posição assentava-se em **terra** hereditável trabalhada por mão de obra
  escravizada, não em renda de ofício. O papel de louvado/avaliador judicial que uma pista de
  recuperação lhe atribui (1834–43) é a mesma função de notável de confiança que seu neto por
  afinidade Simplício Armond exerceria mais tarde — mas Ladisláo a exercia *a partir de uma
  base de terra*, enquanto Simplício a exercia como genro e dependente do ofício. Status
  ancorado em terra se transmite; status dependente de ofício, não. [INFERRED; o papel de louvado é LEAD]

  - **Riqueza em terra + pessoas escravizadas, e depois a conversão terra→dinheiro** [PROVEN
  quanto à base; parâmetros documentados pela família / CONTEXTUAL]. O capital de sua casa era
  a terra da Concórdia e as pessoas escravizadas arroladas nos inventários — capital produtivo
  hereditável, a base da economia cafeeira da região. Partilhado entre seus muitos filhos e
  vendido (~1879–80), esse capital converte-se em quotas únicas em dinheiro: a quota de sua
  neta **Eliza** no espólio de Matilde de 1879 (PRB-0006) lê ≈1:539$781 — pelos parâmetros
  regionais, cerca do preço de uma pessoa escravizada (~1 conto) ou ~3,7 anos de salário rural.
  Financiou, em vez de deter, o posterior deslize da família.

  - **A endogamia como contrapeso à fragmentação partível** [INFERRED]. Seu irmão Antônio
  Zeferino casou-se com sua filha Maria Perpétua (um enlace tio-sobrinha), e outros casamentos
  Toledo × Toledo/Silva recorrem — a estratégia clássica de uma família proprietária para
  reconsolidar bens contra a sucessão partível que, de outro modo, divide o espólio entre todos
  os filhos a cada geração.

  - **A alfabetização como marcador de classe** [CONTEXTUAL; o fato subjacente é um LEAD de
  recuperação]. Se a leitura de recuperação do censo de Bonfim de 1839 ("Sabe Ler") se
  confirmar, sua alfabetização não é incidental: numa população em larga medida analfabeta, um
  fazendeiro letrado marca a fidalguia proprietária, e a alfabetização nessa época era uma
  competência comprada, ligada à classe, readquirida a cada geração — a linha materna letrada
  na qual os Armond, mais tarde, casaram-se para cima.

  ## Questões em aberto

  - Sua data exata de óbito — o limite do repositório é antes de 2 de agosto de 1862; a
  leitura "1855" da transcrição não está verificada. [OPEN]

  - Se a estrutura filho-vs-genro de Francisco Leocádio (P-0061) sobrevive aos embargos de
