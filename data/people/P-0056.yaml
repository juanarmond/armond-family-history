notes:
- text: >-
    Husband of Mathilde Maria de Jesus (P-0027) and father of José Cezário de Toledo
    Lima (P-0054); hence Simplício José Ferreira Armond's (P-0016) grandfather and
    the apical Toledo ancestor so far reached. CORRECTION (7 August 2026): Simplício
    is the direct-line child via JC; Eliza's relationship to this line is unresolved.
    PRB-0009 (1867 Ladisláo inventário) confirms JC as Ladisláo's child directly.
    Named as Mathilde's late husband — "seus
    finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de Toledo" —
    in the 1877 Concórdia/São Bento deed (PRB-0004). Family F-0027; both he and
    Mathilde were already deceased by the 1879 inventory (PRB-0006).
