  ## Contexto regional e migratório

  Barbacena (batismo de 1787) → São João del Rei (casamento de 1810) → a zona da mata do
  Rio Pardo / Leopoldina (Fazenda da Concórdia). É a geração que moveu a família das terras
  altas do Campo das Vertentes — a zona de abastecimento da era do ouro que passou à
  agricultura depois de ~1760 — rumo ao leste, para a fronteira cafeeira do século XIX,
  próxima do mercado do Rio. Essa floresta a leste fora proibida pela Coroa durante o século
  XVIII (os "Sertões do Leste", uma barreira fiscal contra o contrabando de ouro); a Carta
  Régia de 13 de maio de 1808 suspendeu a proibição e abriu os vales do Pomba, Muriaé e
  Carangola onde ficava a Concórdia. A economia cafeeira que se seguiu funcionava com mão de
  obra escravizada até a abolição (1888) — Leopoldina tinha a segunda maior população
  escravizada de Minas Gerais em 1883. [CONTEXTUAL]

