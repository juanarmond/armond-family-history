    esmaecido é corroborado pelo índice e pelo batismo de Carolina de 1821
    (PAR-0017). Seus avós paternos (Gaspar Ferreira × Gertrudes Maria de Toledo,
    de Vila Rica) e avós maternos (João Rodrigues do Valle × Izabel Ribeira) são
    nomeados em PAR-0018 como pistas, ainda não modelados. Seu casamento com
