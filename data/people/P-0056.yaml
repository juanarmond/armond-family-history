  ## Contexto regional e migratório

  Barbacena (batismo de 1787) → São João del Rei (casamento de 1810) → Bonfim (1839) → a
  zona da mata do Rio Pardo / Leopoldina (Fazenda da Concórdia). A sua é a geração que
  moveu a família do planalto do Campo das Vertentes — zona de abastecimento da era do
  ouro, convertida à lavoura depois de ~1760 — para leste, rumo à fronteira cafeeira do
  século XIX, próxima ao mercado do Rio. Essa mata oriental estivera vedada pela Coroa ao
  longo do século XVIII (os "Sertões do Leste", barreira fiscal contra o descaminho do
  ouro); a Carta Régia de 13 de maio de 1808 levantou a proibição e abriu os vales do
  Pomba, Muriaé e Carangola, onde ficava a Concórdia. A economia cafeeira que se seguiu
  funcionou com trabalho escravizado até a abolição (1888) — Leopoldina tinha, em 1883, a
  segunda maior população escravizada de Minas Gerais. [CONTEXTUAL]

