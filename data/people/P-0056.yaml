notes:
- text: >-
    Husband of Mathilde Maria de Jesus (P-0027) and father of José Cezário de Toledo
    Lima (P-0054); hence Simplício José Ferreira Armond's (P-0016) grandfather and
    the apical Toledo ancestor so far reached. CORRECTION (7 August 2026): Simplício
    is the direct-line child via JC; Eliza's relationship to this line is unresolved.
    PRB-0009 (1867 Ladisláo inventário) confirms JC as Ladisláo's child directly.
    Named as Mathilde's late husband — "seus
    finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de Toledo" —
    in the 1877 Concórdia/São Bento deed (PRB-0004). Family F-0027; both he and
    Mathilde were already deceased by the 1879 inventory (PRB-0006).
  text_pt: >-
    Marido de Mathilde Maria de Jesus (P-0027) e pai de José Cezário de Toledo
    Lima (P-0054); portanto, o avô de Simplício José Ferreira Armond (P-0016) e o
    ancestral apical Toledo até agora alcançado. CORREÇÃO (7 de agosto de 2026):
    Simplício é o filho da linha direta via JC; a relação de Eliza com esta linha
    permanece sem resolução. PRB-0009 (inventário de Ladisláo de 1867) confirma JC
    como filho de Ladisláo diretamente. Nomeado como o falecido marido de Mathilde
    — "seus finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira
    de Toledo" — na escritura de 1877 da Concórdia/São Bento (PRB-0004). Família
    F-0027; tanto ele quanto Mathilde já estavam falecidos por ocasião do
    inventário de 1879 (PRB-0006).
- text: >-
    Distinct from the namesake grandson "Ladisláo Egydio Ferreira de Toledo,
    solteiro, de 23 annos" listed as heir #4's son (Eliza's brother) on folio 9 of
    PRB-0006. This entry is the ELDER Ladisláo (Mathilde's husband); the two same-name
    people caused an earlier flagged conflict, now resolved by the inventory.
    Nationality Brazilian, consistent with this Minas Gerais Toledo family.
  text_pt: >-
    Distinto do neto homônimo "Ladisláo Egydio Ferreira de Toledo, solteiro, de
    23 annos" listado como filho do herdeiro nº 4 (irmão de Eliza) no fólio 9 de
    PRB-0006. Esta entrada é o Ladisláo MAIS VELHO (o marido de Mathilde); as duas
    pessoas de mesmo nome causaram um conflito antes sinalizado, agora resolvido
    pelo inventário. Nacionalidade brasileira, consistente com esta família Toledo
    de Minas Gerais.
- text: >-
    Barbacena roots (1 August 2026): baptised 9 September 1787 at the Capela de N.S.
    da Piedade, Borda do Campo (Barbacena), son of [Joaquim] José Ferreira de Toledo
    (P-0057) × Ritta Angélica Rodrigues (P-0058), family F-0028 — his own baptism
    (PAR-0019 → event E-0050). This is now CONFIRMED (upgraded from strong-evidence):
    the base scan was ink-bled and illegible, but the filiation was recovered by image
    processing (the …-alt scan) and the parents + 9-Sep-1787 date read clearly; the
    faded forename is corroborated by the index and the 1821 Carolina baptism
    (PAR-0017). His paternal grandparents (Gaspar Ferreira × Gertrudes Maria de
    Toledo, of Vila Rica) and maternal grandparents (João Rodrigues do Valle × Izabel
    Ribeira) are named in PAR-0018 as leads, not yet modelled. His marriage to
    Mathilde Maria de Jesus (P-0027) is now confirmed by the 1810 São João del Rei
    marriage record (PAR-0023 → event E-0052): both spouses are stated to be born
    and baptised in the Freguesia de Barbacena; the marriage supplies a second
    primary attestation of his parentage (Cap. Joaquim José × D. Ritta Angélica).
  text_pt: >-
    Raízes em Barbacena (1 de agosto de 2026): batizado em 9 de setembro de 1787
    na Capela de N.S. da Piedade, Borda do Campo (Barbacena), filho de [Joaquim]
    José Ferreira de Toledo (P-0057) × Ritta Angélica Rodrigues (P-0058), família
    F-0028 — seu próprio batismo (PAR-0019 → evento E-0050). Isso está agora
    CONFIRMADO (elevado de evidência forte): o scan-base estava borrado de tinta e
    ilegível, mas a filiação foi recuperada por processamento de imagem (o scan
    …-alt) e os pais + a data de 9-set-1787 leem-se com clareza; o prenome
    esmaecido é corroborado pelo índice e pelo batismo de Carolina de 1821
    (PAR-0017). Seus avós paternos (Gaspar Ferreira × Gertrudes Maria de Toledo,
    de Vila Rica) e avós maternos (João Rodrigues do Valle × Izabel Ribeira) são
    nomeados em PAR-0018 como pistas, ainda não modelados. Seu casamento com
    Mathilde Maria de Jesus (P-0027) está agora confirmado pelo registro de
    casamento de 1810 de São João del Rei (PAR-0023 → evento E-0052): ambos os
    cônjuges são declarados nascidos e batizados na Freguesia de Barbacena; o
    casamento fornece uma segunda atestação primária de sua filiação (Cap. Joaquim
    José × D. Ritta Angélica).
- text: >-
    Death bound tightened (5 August 2026): the 1862 Fazenda da Concórdia purchase
    deed (PRB-0007) identifies Matilde as "viúva de Ladisláo Egídio Ferreira de
    Toledo", placing his death before 2 August 1862. The previous bound ("before
    1877", from PRB-0004 naming him as "finado") is superseded. His own estate was
    then settled in the Leopoldina Juízo de Órfãos (citation audiences 13 Nov 1880
    and 6 Aug 1881 — those are process dates, not his death). His OWN estate was then settled as a contested partition
    in the Leopoldina Juízo de Órfãos (Juiz Dr. Fernando Pinheiro de Souza Tavares),
    with citation audiences on 13 Nov 1880 and 6 Aug 1881 ("inventario de Ladisláo
    Egydio Ferreira de Toledo … os bens do dicto finado Ladisláo"; requerente D.
    Umbelina Ignez de Toledo). Those 1880/81 dates are process dates, not his death;
    the heirs summoned are Matilde's descendants (Francisco Leocadio, Cesário José,
    Marianna Claudina, Simplício ⚭ Eliza, the namesake grandson, etc.). The audience
    images are held in the retrieval drop; not catalogued as a source (corroborative
    only).
  text_pt: >-
    Limite de óbito estreitado (5 de agosto de 2026): a escritura de compra de
    1862 da Fazenda da Concórdia (PRB-0007) identifica Matilde como "viúva de
    Ladisláo Egídio Ferreira de Toledo", situando seu falecimento antes de 2 de
    agosto de 1862. O limite anterior ("antes de 1877", a partir de PRB-0004 que
    o nomeia como "finado") fica superado. Seu próprio espólio foi então liquidado
    no Juízo de Órfãos de Leopoldina (audiências de citação em 13 de novembro de
    1880 e 6 de agosto de 1881 — essas são datas processuais, não de seu óbito).
    Seu PRÓPRIO espólio foi então liquidado como partilha contestada no Juízo de
    Órfãos de Leopoldina (Juiz Dr. Fernando Pinheiro de Souza Tavares), com
    audiências de citação em 13 de novembro de 1880 e 6 de agosto de 1881
    ("inventario de Ladisláo Egydio Ferreira de Toledo … os bens do dicto finado
    Ladisláo"; requerente D. Umbelina Ignez de Toledo). Essas datas de 1880/81 são
    datas processuais, não de seu óbito; os herdeiros convocados são os
    descendentes de Matilde (Francisco Leocadio, Cesário José, Marianna Claudina,
    Simplício ⚭ Eliza, o neto homônimo, etc.). As imagens das audiências estão no
    drop de recuperação; não catalogadas como fonte (apenas corroborativas).