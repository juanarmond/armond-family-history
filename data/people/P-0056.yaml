profile: >-
  ## Interesting facts

  - **[PROVEN]** His estate and his son José Cezário's were opened in the same week of
  March 1867 at the Fazenda da Concórdia, before the same judge (Dr. Mortimário de Sousa
  Lintz), the same escrivão, the same two sworn appraisers and the same curador of minors
  — two generations of Toledo property placed into the courts at a single sitting
  (PRB-0008, PRB-0009).

  - **[CONTEXTUAL]** He is the pivotal generation that carried the Toledo line from the
  gold-era highlands — baptised at Barbacena 1787, married at São João del Rei 1810 — east
  into the coffee-era Zona da Mata at the Fazenda da Concórdia, Leopoldina: the single
  generation that made the family's structural switch from highland farming to lowland
  coffee.

  - **[PROVEN]** His baptism was recovered from an ink-bled scan by image processing; his
  parents and the date of 9 September 1787 were confirmed only by combining the damaged
  primary image with his 1810 marriage record — a case where the primary source survived
  but required technical recovery (PAR-0019, PAR-0023).

  - **[CONTEXTUAL]** The eastern Minas forest where the Concórdia lay had been
  Crown-forbidden through the 18th century (the "Sertões do Leste"), a fiscal barrier
  against gold smuggling. The Carta Régia of 13 May 1808 lifted the prohibition — his
  generation moved into territory that was legally inaccessible to his parents.

  - **[INFERRED]** His brother Antonio Zeferino married his own niece Maria Perpétua —
  Ladisláo and Mathilde's daughter. An uncle-niece match of that kind was a calculated
  counter to Brazilian partible succession, which would otherwise split the family holding
  among all children in every generation.

  - **[PROVEN]** He never saw the Fazenda da Concórdia bought: the purchase deed of 2
  August 1862 names Mathilde already as "viúva de Ladisláo Egídio Ferreira de Toledo",
  buying for six contos "por si como meeira, e também como inventariante e cabeça do
  casal, em nome de todos seus filhos" (PRB-0007). The family's famous seat was acquired
  by a widow acting for her children.

  ## Identity

  **Ladisláo Egydio Ferreira de Toledo** (register spelling *Ladislau*; "Ladislau Egídio
  Ferreira" without "de Toledo" in his daughter's 1821 baptism, PAR-0017, and in his son's
  1813 baptism, PAR-0050) [PROVEN]. He is Eliza Balbina de Toledo's paternal grandfather
  and, through her father José Cezário (P-0054), a direct-line ancestor — Aristão Ferreira
  Armond's (P-0008) maternal great-grandfather.

  - Distinct from his namesake grandson "Ladisláo Egydio Ferreira de Toledo, solteiro, de
  23 annos" (heir #4's son in PRB-0006) — the two same-name men were a documented trap,
  resolved by the 1879 inventário.

  - **Baptism:** 9 September 1787, Capela de N.S. da Piedade, Borda do Campo (Barbacena)
  [PROVEN — PAR-0019, event E-0050], son of [Joaquim] José Ferreira de Toledo (P-0057) ×
  Ritta Angélica Rodrigues (P-0058), family F-0028. The base scan was ink-bled; the
  filiation was recovered by image processing and corroborated by the 1810 marriage. He is
  child #1 in his mother's 1833 estate inventory (PRB-0010) — the eldest of thirteen.

  - **Marriage:** ⚭ Mathilde Maria de Jesus (P-0027), 8 May 1810, Matriz de N.S. do Pilar,
  São João del Rei [PROVEN — PAR-0023, event E-0052]; both spouses "naturaes e batizados
  da Freguesia de Barbacena", family F-0027. Her parents were Alferes Amaro da Silva
  Xavier (P-0059) and Ignez Francisca de Lima (P-0060) — so both sides of the match were
  militia-officer households.

  - **Death:** before 2 August 1862 [PROVEN] — the Concórdia purchase deed (PRB-0007)
  names Mathilde "viúva de Ladisláo Egídio Ferreira de Toledo". A retrieval transcript
  reads "c.27 April 1855" from his 1867 inventário — [LEAD], not image-verified. His own
  estate was settled as a contested partition in the Leopoldina Juízo de Órfãos (citation
  audiences November 1880 and 6 August 1881; the 1881–82 embargos; a partilha audiência
  for his son's sub-heirs still being held in 1889) — those are process dates, not his
  death.

  ## Standing and profession

  - **Landholder / fazendeiro** [PROVEN] — the household seat was the Fazenda da Concórdia
  (Rio Pardo / Thebes, Leopoldina), a holding registered under the 1850 Lei de Terras by
  his son in 1856 (GOV-0003) and bought outright by his widow in 1862 (PRB-0007). A
  slaveholding household [PROVEN — estate context].

  - No rank or office of his own appears in any held source. A retrieval draft adds that
  the 1839 Bonfim population register marks him literate ("Sabe Ler"), that he signed a
  Rio Pomba land demarcation in 1839, and that he served as court *louvado* (sworn
  appraiser) in the 1843 Bonfim probate of Padre Vidal José Nalle — all [LEAD], from
  uncatalogued images.

  - **Enslaved people in his estate** — a retrieval reading of the avaliação folios of his
  1867 inventário lists seven: **José** (de nação, 52), **Domingos** (de nação, 25;
  deceased by the estate opening), **Raymundo** (pardo, ~22), **Pulcina** (de nação, 30),
  **Antónia** (crioula, 28) and her children **Martinha** (~10) and **João** (5). ⚠️ Those
  avaliação folios are NOT among the twenty pages catalogued here under PRB-0009 (which
  hold the título de herdeiros, the citations, the louvação and the 1880–89 audiências),
  so this list is a [LEAD] from the drop, not a held transcription — it should be promoted
  only when the avaliação images are catalogued.

  ## Family and social network

  - Parents: Joaquim José Ferreira de Toledo (P-0057) × Ritta Angélica Rodrigues (P-0058),
  family F-0028 — he is the eldest of their thirteen children (PRB-0010). His paternal
  grandparents Gaspar Ferreira (P-0092) × Gertrudes Maria de Toledo (P-0093) of Vila Rica,
  and maternal grandparents João Rodrigues do Valle (P-0078) × Izabel Ribeira (P-0079),
  are named in PAR-0018.

  - Wife: Mathilde Maria de Jesus (P-0027, d.1879), who signed the 1867 louvação folio in
  her own hand (PRB-0009 p5).

  - **Children (eight per PRB-0009 gen1):** José Cesário de Toledo Lima (P-0054, our
  line); Francisco Leocádio de Toledo (P-0061); António Ladislão de Toledo (P-0063, "surdo
  e mudo", carpenter, d.1909, CIV-0024); Maria Perpétua da Silva (⚭ his own brother
  Antonio Zeferino de Toledo); Ignez Umbelina (⚭ José Pedro da Silva — the same woman
  later cited as "Umbelina Ignez de Toledo", requerente of the 1881 embargos); Carolina
  Leopoldina Marques (⚭ Narciso Marques Braz); Aureliano de Sales Toledo (curador of José
  Cezário's orphans in both 1867 estates); and Cezário José de Toledo (⚭ Maria José de
  Jesus, the 1879 inventariante). Also documented: a daughter Carolina, baptised 1821 at
  Barbacena (PAR-0017).

  - His own sisters Anna Belizaria (m.1812, PAR-0020) and Carolina Francelina (m.1816,
  PAR-0021) anchor his birth family.

  ## What we can extrapolate

  He is the pivotal generation: baptised and married in the gold-era highlands (1787,
  1810), he ends his life on the eastern coffee frontier, and it is from the estate he
  left that the next generation married into the Armonds. [INFERRED]

  - **How his standing was acquired — inherited rank, matched rank, and trust earned by
  use** [INFERRED]. Three mechanisms stack in him and they behave differently. He
  *inherited* position as child #1 of a Capitão of ordenanças. He *matched* it in
  marriage: Mathilde was a daughter of an Alferes, so the 1810 union joined two
  militia-officer households of the same Barbacena parish rather than reaching up or down.
  And he *earned* a third kind of standing by use — if the Rio Pomba louvado and
  demarcation readings hold [LEAD], the courts of a second comarca chose him to value
  other families' estates, which is standing that has to be conferred repeatedly and
  confers no property. Of the three, only the first two travel forward; the third dies
  with the man. That is precisely the shape of his grandson-in-law Simplício Armond's
  whole position — except that Ladisláo held it *from* a land base, and Simplício held it
  *instead of* one.

  - **The Concórdia was not ancestral land — it was one generation deep** [PROVEN
  chronology / INFERRED reading]. The family's seat is routinely described as the Toledo
  patrimony, but the documents do not support that reading. His son declared possession of
  the 200-alqueire Concórdia under the Lei de Terras in April 1856; his widow bought the
  fazenda outright from Felippe Barbosa Castro of Espírito Santo, a third party from
  another province, on 2 August 1862 for six contos; and the property was sold out of the
  family around 1879–80 in her probate. On the documented record the Toledo hold on the
  Concórdia lasted under a quarter of a century, from a claimed *posse* perfected by
  purchase to a forced sale in probate. A landed clan whose land is a single-generation
  acquisition has far less protection than the phrase "landed clan" implies.

  - **Wealth in land plus enslaved labour — and the fragility of that mix** [PROVEN base /
  CONTEXTUAL consequence]. His household's capital was the Concórdia land and the people
  enslaved on it. In his son's concurrently-appraised estate the enslaved people accounted
  for roughly three-fifths of the total value while the bare soil was appraised at 75$000
  (PRB-0008) — a proportion there is no reason to think differed greatly in his own. That
  mix was heritable in law and doomed in fact: the larger part of it was abolished without
  compensation by 1888, and the rest was divided among eight children and then their
  children.

  - **Endogamy as a counter-strategy, and its cost** [PROVEN facts / INFERRED reading].
  His brother Antonio Zeferino married his daughter Maria Perpétua, and Toledo × Toledo
  matches recur across the line — the classic elite answer to partible succession, keeping
  quotas inside the surname. It worked in the sense that the land stayed nominally Toledo.
  It failed in a way nobody plans for: when the heirs are also each other's in-laws, a
  partition dispute becomes a family war. By 1881 his own daughter **Umbelina Ignez de
  Toledo** was suing, through counsel, to have citations served on **Marianna Claudina de
  Toledo** over the *artigos d'embargos á partilha* of his estate.

  - **The estate consumed itself in court — twenty-two years of it** [PROVEN dates /
  INFERRED cost]. He died by 1862 at the latest (perhaps 1855); his inventário opened 6
  March 1867; the partition was carried out in 1876, annulled by the 1882 judgment on the
  embargos and ordered redone; and a partilha audiência for his son's sub-heirs was still
  being held in 1889. That is twenty-two years of escrivães, curadores, appraisers, stamp
  duty and attorneys — all paid out of the same monte the heirs were dividing. The
  mechanism that ANALYTICAL-DEPTH names as partible fragmentation is visible here in its
  most expensive form: not merely division, but two decades of frozen, litigated,
  fee-bearing capital.

  - **Literacy is where the sharpest class signal sits — and it is not male-only** [LEAD
  for him / PROVEN for his wife / CONTEXTUAL for the meaning]. If the 1839 census reading
  "Sabe Ler" holds, he was a literate fazendeiro in a largely illiterate population. What
  the held record proves is narrower and more interesting: his wife Mathilde signed the
  1867 louvação folio herself (PRB-0009 p5), and his daughter-in-law Claudina signed her
  own sworn declarations (PRB-0008 fl.8r). Schooling in this era was a purchased,
  class-linked competence, re-bought in each generation and for each child — and in this
  household it was being bought for women as well as men, which is the clearest single
  measure of how far above the regional average the family sat.

  - **Migration as three deliberate steps, each answering an economic collapse**
  [INFERRED]. Barbacena (1787) → São João del Rei (1810, children baptised 1811 and 1813)
  → Bonfim (1839 census) → the Rio Pardo / Leopoldina Zona da Mata. Read against the
  family's earlier Villa Rica origin, this is a continuous eastward retreat from exhausted
  gold toward new agricultural rent: the gold placers failed after ~1760 and the family
  went to the farming highlands; the highlands were crowded and the Carta Régia of 1808
  had opened the eastern forest, so his generation went to coffee. Each step converted a
  declining base into a better one, and each was up. His is the last clean upward step the
  line takes.

  ## Open questions

  - His exact death date — the repository bound is before 2 August 1862; the "1855"
  transcript reading is unverified. [OPEN]

  - Whether the child-versus-son-in-law structure of Francisco Leocádio (P-0061) survives
  the 1881–82 embargos (material conflict #15). [OPEN]

  - The avaliação folios of his own 1867 inventário — the monte-mór, the land and the
  enslaved people — which would replace the [LEAD] list above with held evidence. [OPEN]

  ## Sources held (this repository)

  - PAR-0019 (1787 Barbacena baptism — parents) · PAR-0023 (1810 SJdRei marriage — parents
  and wife) · PAR-0017 (1821 Barbacena baptism of his daughter Carolina) · PAR-0050 (1813
  SJdRei baptism of his son José Cezário) · PAR-0018 / PAR-0020 / PAR-0021 (his parents'
  marriage and two sisters' marriages) · PRB-0010 (1833 Barbacena inventory of his
  mother's estate — he is child #1 of thirteen).

  - PRB-0007 (1862 Concórdia purchase deed — Mathilde his widow; the death bound) ·
  PRB-0009 (his 1867 inventário — eight children; the 1880–81 audiences, the 1881 certidão
  and the 1889 partilha audiência) · PRB-0006 (1879 Mathilde inventário — resolves the two
  Ladisláos) · PRB-0004 (Concórdia / São Bento deed) · NWS-0004 (1881 O Leopoldinense
  lottery-consortium notice — a namesake Ladisláo Egydio Ferreira de Toledo holds the
  tickets as depositário; on the dates this is the grandson, and the elder Ladisláo is
  linked only as the household's name-bearer) · CIV-0024 (1909 death of his son António
  Ladislão — names him as father).

  ## Regional and migration context

  Barbacena (baptism 1787) → São João del Rei (marriage 1810) → Bonfim (1839) → the Rio
  Pardo / Leopoldina zona da mata (Fazenda da Concórdia). His is the generation that moved
  the family from the Campo das Vertentes highland — the gold-era supply zone that turned
  to farming after ~1760 — east onto the 19th-century coffee frontier near the Rio market.
  That eastern forest had been Crown-forbidden through the 18th century (the "Sertões do
  Leste", a fiscal barrier against gold smuggling); the Carta Régia de 13 de maio de 1808
  lifted the prohibition and opened the Pomba, Muriaé and Carangola valleys where the
  Concórdia lay. The coffee economy that followed ran on enslaved labour until abolition
  (1888) — Leopoldina held the second-largest enslaved population in Minas Gerais by 1883.
  [CONTEXTUAL]

  ## Where to go today

  - **Baptism (9 Sep 1787):** Santuário-Matriz de N.S. da Piedade, Barbacena, MG (Rua
  Vigário Brito 26; the old N.S. da Piedade parish) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Vigario%20Brito%2026%2C%20Barbacena%2C%20MG)

  - **Marriage (8 May 1810):** Catedral Basílica de N.S. do Pilar, São João del-Rei (Rua
  Monsenhor Gustavo 61) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Monsenhor%20Gustavo%2061%2C%20Sao%20Joao%20del%20Rei%2C%20MG)

  - **Fazendeiro seat:** Fazenda da Concórdia, distrito de Tebas (Leopoldina), MG [APPROX]
  · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **Louvado work (1834–43) [LEAD]:** Rio Pomba, MG [RESOLVED — município] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=-21.27500,-43.17889)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu espólio e o de seu filho José Cezário foram abertos na mesma semana
  de março de 1867, na Fazenda da Concórdia, perante o mesmo juiz (Dr. Mortimário de Sousa
  Lintz), o mesmo escrivão, os mesmos dois avaliadores juramentados e o mesmo curador de
  menores — duas gerações de propriedade Toledo postas em juízo numa única sessão
  (PRB-0008, PRB-0009).

  - **[CONTEXTUAL]** É a geração-charneira que levou a linha Toledo dos planaltos da era
  do ouro — batizado em Barbacena em 1787, casado em São João del Rei em 1810 — para o
  leste, na Zona da Mata cafeeira, na Fazenda da Concórdia, Leopoldina: a única geração
  que fez a troca estrutural da lavoura de planalto para o café das terras baixas.

  - **[PROVEN]** Seu batismo foi recuperado de um scan borrado de tinta por processamento
  de imagem; os pais e a data de 9 de setembro de 1787 só foram confirmados combinando a
  imagem primária danificada com seu assento de casamento de 1810 — um caso em que a fonte
  primária sobreviveu, mas exigiu recuperação técnica (PAR-0019, PAR-0023).

  - **[CONTEXTUAL]** A mata oriental de Minas onde ficava a Concórdia estivera vedada pela
  Coroa ao longo do século XVIII (os "Sertões do Leste"), barreira fiscal contra o
  descaminho do ouro. A Carta Régia de 13 de maio de 1808 levantou a proibição — sua
  geração entrou em território que era legalmente inacessível a seus pais.

  - **[INFERRED]** Seu irmão Antonio Zeferino casou-se com a própria sobrinha Maria
  Perpétua — filha de Ladisláo e Mathilde. Um enlace tio-sobrinha desse tipo era
  contramedida calculada à sucessão partível brasileira, que de outro modo dividiria o
  patrimônio familiar entre todos os filhos a cada geração.

  - **[PROVEN]** Ele nunca viu a compra da Fazenda da Concórdia: a escritura de 2 de
  agosto de 1862 já nomeia Mathilde como "viúva de Ladisláo Egídio Ferreira de Toledo",
  comprando por seis contos "por si como meeira, e também como inventariante e cabeça do
  casal, em nome de todos seus filhos" (PRB-0007). A célebre sede da família foi adquirida
  por uma viúva agindo em nome dos filhos.

