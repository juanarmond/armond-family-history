notes:
- text: >-
    Husband of Mathilde Maria de Jesus (P-0027) and father of José Cezário de Toledo
    Lima (P-0054, "JC"). The direct line descends through JC's daughter Eliza Balbina
    de Toledo (P-0017): Ladisláo is thus Eliza's paternal grandfather and Aristão
    Ferreira Armond's (P-0008) maternal great-grandfather. (A 7 August 2026 note briefly
    made Simplício Armond, P-0016, the direct-line child via JC; SUPERSEDED — Eliza is
    JC's daughter and Simplício is her husband/son-in-law, his own parents unknown; see
    P-0054 and P-0016.) PRB-0009 (1867 Ladisláo inventário) confirms JC as Ladisláo's
    child directly; and Rita Angélica's 1833 Barbacena inventory (PRB-0010) lists
    Ladisláo as child #1 of Joaquim José × Rita, directly confirming his own parentage
    (family F-0028). Named as Mathilde's late husband — "seus finados avós Dona Mathilde
    Maria de Jesus e Ladisláo Egydio Ferreira de Toledo" — in the 1877 Concórdia/São
    Bento deed (PRB-0004). Family F-0027; both he and Mathilde were already deceased by
    the 1879 inventory (PRB-0006).
  text_pt: >-
    Marido de Mathilde Maria de Jesus (P-0027) e pai de José Cezário de Toledo
    Lima (P-0054, "JC"). A linha direta desce por meio da filha de JC, Eliza Balbina
    de Toledo (P-0017): Ladisláo é, portanto, o avô paterno de Eliza e o bisavô materno
    de Aristão Ferreira Armond (P-0008). (Uma nota de 7 de agosto de 2026 fez brevemente
    de Simplício Armond, P-0016, o filho da linha direta via JC; SUPERADO — Eliza é
    filha de JC e Simplício é seu marido/genro, com pais próprios desconhecidos; ver
    P-0054 e P-0016.) PRB-0009 (inventário de Ladisláo de 1867) confirma JC como filho
    de Ladisláo diretamente; e o inventário de 1833 de Rita Angélica em Barbacena
    (PRB-0010) lista Ladisláo como filho nº 1 de Joaquim José × Rita, confirmando
    diretamente sua própria filiação (família F-0028). Nomeado como o falecido marido de
    Mathilde — "seus finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira
    de Toledo" — na escritura de 1877 da Concórdia/São Bento (PRB-0004). Família F-0027;
    tanto ele quanto Mathilde já estavam falecidos por ocasião do inventário de 1879
