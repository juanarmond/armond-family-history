    de Toledo (P-0017): Ladisláo é, portanto, o avô paterno de Eliza e o bisavô materno
    de Aristão Ferreira Armond (P-0008). (Uma nota de 7 de agosto de 2026 fez brevemente
    de Simplício Armond, P-0016, o filho da linha direta via JC; SUPERADO — Eliza é
    filha de JC e Simplício é seu marido/genro, com pais próprios desconhecidos; ver
    P-0054 e P-0016.) PRB-0009 (inventário de Ladisláo de 1867) confirma JC como filho
    de Ladisláo diretamente; e o inventário de 1833 de Rita Angélica em Barbacena
    (PRB-0010) lista Ladisláo como filho nº 1 de Joaquim José × Rita, confirmando
