  Toledo (P-0057) × Ritta Angélica Rodrigues (P-0058), família F-0028. O scan-base estava
  borrado de tinta; a filiação foi recuperada por processamento de imagem e corroborada
  pelo casamento de 1810. É o filho nº 1 no inventário de 1833 do espólio de sua mãe
