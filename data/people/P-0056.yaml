notes:
- text: >-
    Husband of Mathilde Maria de Jesus (P-0027) and father of José Cezário de Toledo
    Lima (P-0054); hence Eliza Balbina de Toledo's (P-0017) great-grandfather and the
    apical Toledo ancestor so far reached. Named as Mathilde's late husband — "seus
    finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de Toledo" —
    in the 1877 Concórdia/São Bento deed (PRB-0004). Family F-0027; both he and
    Mathilde were already deceased by the 1879 inventory (PRB-0006).
- text: >-
    Distinct from the namesake grandson "Ladisláo Egydio Ferreira de Toledo,
    solteiro, de 23 annos" listed as heir #4's son (Eliza's brother) on folio 9 of
    PRB-0006. This entry is the ELDER Ladisláo (Mathilde's husband); the two same-name
    people caused an earlier flagged conflict, now resolved by the inventory.
    Nationality Brazilian, consistent with this Minas Gerais Toledo family.
- text: >-
    Barbacena roots (1 August 2026): baptised 9 September 1787 at the Capela de N.S.
    da Piedade, Borda do Campo (Barbacena), son of [Joaquim] José Ferreira de Toledo
    (P-0057) × Ritta Angélica Rodrigues (P-0058), family F-0028 — his own baptism
    (PAR-0019 → event E-0050). This is now CONFIRMED (upgraded from strong-evidence):
    the base scan was ink-bled and illegible, but the filiation was recovered by image
    processing (the …-alt scan) and the parents + 9-Sep-1787 date read clearly; the
    faded forename is corroborated by the index and the 1821 Carolina baptism
    (PAR-0017). His paternal grandparents (Gaspar Ferreira × Gertrudes Maria de
    Toledo, of Vila Rica) and maternal grandparents (João Rodrigues do Valle × Izabel
    Ribeira) are named in PAR-0018 as leads, not yet modelled. His marriage to
    Mathilde Maria de Jesus (P-0027) is now confirmed by the 1810 São João del Rei
    marriage record (PAR-0023 → event E-0052): both spouses are stated to be born
    and baptised in the Freguesia de Barbacena; the marriage supplies a second
    primary attestation of his parentage (Cap. Joaquim José × D. Ritta Angélica).
- text: >-
    Death bound tightened (5 August 2026): the 1862 Fazenda da Concórdia purchase
    deed (PRB-0007) identifies Matilde as "viúva de Ladisláo Egídio Ferreira de
    Toledo", placing his death before 2 August 1862. The previous bound ("before
    1877", from PRB-0004 naming him as "finado") is superseded. His own estate was
    then settled in the Leopoldina Juízo de Órfãos (citation audiences 13 Nov 1880
    and 6 Aug 1881 — those are process dates, not his death). His OWN estate was then settled as a contested partition
    in the Leopoldina Juízo de Órfãos (Juiz Dr. Fernando Pinheiro de Souza Tavares),
    with citation audiences on 13 Nov 1880 and 6 Aug 1881 ("inventario de Ladisláo
    Egydio Ferreira de Toledo … os bens do dicto finado Ladisláo"; requerente D.
    Umbelina Ignez de Toledo). Those 1880/81 dates are process dates, not his death;
    the heirs summoned are Matilde's descendants (Francisco Leocadio, Cesário José,
    Marianna Claudina, Simplício ⚭ Eliza, the namesake grandson, etc.). The audience
    images are held in the retrieval drop; not catalogued as a source (corroborative
    only).