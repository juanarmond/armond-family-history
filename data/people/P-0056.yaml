  filho em 1813, PAR-0050) [PROVEN]. É o avô paterno de Eliza Balbina de Toledo e, por
  meio do pai dela, José Cezário (P-0054), um ancestral da linha direta — bisavô materno
  de Aristão Ferreira Armond (P-0008).

  - Distinto do neto homônimo "Ladisláo Egydio Ferreira de Toledo, solteiro, de 23 annos"
  (filho do herdeiro nº 4 em PRB-0006) — os dois homônimos foram uma armadilha
  documentada, resolvida pelo inventário de 1879.

  - **Batismo:** 9 de setembro de 1787, Capela de N.S. da Piedade, Borda do Campo
