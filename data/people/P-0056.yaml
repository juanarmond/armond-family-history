  ## O que podemos extrapolar

  É a geração-charneira: batizado e casado nos planaltos da era do ouro (1787, 1810),
  termina a vida na fronteira cafeeira do leste, e é do espólio que deixou que a geração
  seguinte se casou com os Armond. [INFERRED]

  - **Como sua posição foi adquirida — posto herdado, posto igualado e confiança
  conquistada pelo uso** [INFERRED]. Três mecanismos se empilham nele, e comportam-se de
  modo diferente. Ele *herdou* posição como filho nº 1 de um Capitão de ordenanças.
  *Igualou-a* no casamento: Mathilde era filha de um Alferes, de modo que a união de 1810
  juntou duas casas de oficiais de milícia da mesma freguesia de Barbacena, sem subir nem
  descer. E *conquistou* um terceiro tipo de posição pelo uso — se as leituras do louvado
  e da demarcação no Rio Pomba se sustentarem [LEAD], os juízos de uma segunda comarca o
  escolheram para avaliar espólios alheios, posição que precisa ser conferida
  repetidamente e não confere propriedade alguma. Dos três, apenas os dois primeiros
  seguem adiante; o terceiro morre com o homem. É exatamente a forma de toda a posição de
  seu neto por afinidade, Simplício Armond — exceto que Ladisláo a detinha *a partir de*
  uma base fundiária, e Simplício a detinha *em lugar de* uma.

  - **A Concórdia não era terra ancestral — tinha uma geração de profundidade** [PROVEN a
  cronologia / INFERRED a leitura]. A sede da família é rotineiramente descrita como o
  patrimônio Toledo, mas os documentos não sustentam essa leitura. Seu filho declarou
  posse dos 200 alqueires da Concórdia sob a Lei de Terras em abril de 1856; sua viúva
  comprou a fazenda em definitivo de Felippe Barbosa Castro, do Espírito Santo, um
  terceiro de outra província, em 2 de agosto de 1862, por seis contos; e a propriedade
  foi vendida para fora da família por volta de 1879–80, no inventário dela. No registro
  documentado, a posse Toledo da Concórdia durou menos de um quarto de século, de uma
  posse reivindicada e aperfeiçoada por compra até uma venda forçada em inventário. Um clã
  fundiário cuja terra é aquisição de uma só geração tem muito menos proteção do que a
  expressão "clã fundiário" sugere.

  - **Riqueza em terra mais trabalho escravizado — e a fragilidade dessa mistura** [PROVEN
  a base / CONTEXTUAL a consequência]. O capital de sua casa era a terra da Concórdia e as
  pessoas nela escravizadas. No espólio do filho, avaliado simultaneamente, as pessoas
  escravizadas responderam por cerca de três quintos do valor total, enquanto o solo nu
  foi avaliado em 75$000 (PRB-0008) — proporção que não há razão para supor muito
  diferente no dele. Essa mistura era hereditária em direito e condenada de fato: a maior
  parte dela foi abolida sem indenização até 1888, e o restante dividido entre oito filhos
  e depois entre os filhos deles.

  - **A endogamia como contramedida, e seu custo** [PROVEN os fatos / INFERRED a leitura].
  Seu irmão Antonio Zeferino casou-se com sua filha Maria Perpétua, e enlaces Toledo ×
  Toledo repetem-se ao longo da linha — a resposta clássica das elites à sucessão
  partível, mantendo as quotas dentro do sobrenome. Funcionou no sentido de que a terra
  continuou nominalmente Toledo. Falhou de um modo que ninguém planeja: quando os
  herdeiros são também parentes por afinidade uns dos outros, uma disputa de partilha vira
  guerra de família. Em 1881, sua própria filha **Umbelina Ignez de Toledo** litigava, por
  advogado, para que se citasse **Marianna Claudina de Toledo** sobre os *artigos
  d'embargos á partilha* de seu espólio.

  - **O espólio consumiu-se em juízo — vinte e dois anos disso** [PROVEN as datas /
  INFERRED o custo]. Morreu até 1862, no mais tardar (talvez em 1855); seu inventário
  abriu em 6 de março de 1867; a partilha foi feita em 1876, anulada pela sentença de 1882
  sobre os embargos e mandada refazer; e uma audiência de partilha para os sub-herdeiros
  de seu filho ainda se realizava em 1889. São vinte e dois anos de escrivães, curadores,
  avaliadores, selos e advogados — todos pagos do mesmo monte que os herdeiros dividiam. O
  mecanismo que o ANALYTICAL-DEPTH chama de fragmentação partível aparece aqui em sua
  forma mais cara: não apenas divisão, mas duas décadas de capital congelado, litigado e
  onerado por custas.

  - **O letramento é onde está o sinal de classe mais nítido — e não é só masculino**
  [LEAD para ele / PROVEN para a esposa / CONTEXTUAL para o sentido]. Se a leitura
  censitária de 1839 "Sabe Ler" se sustentar, ele era um fazendeiro letrado numa população
  majoritariamente analfabeta. O que o registro disponível prova é mais estreito e mais
  interessante: sua esposa Mathilde assinou por si o fólio da louvação de 1867 (PRB-0009
  p5), e sua nora Claudina assinou as próprias declarações juramentadas (PRB-0008 fl.8r).
  A escolarização nesta época era competência comprada e ligada à classe, recomprada a
  cada geração e para cada filho — e nesta casa estava sendo comprada também para as
  mulheres, o que é a medida isolada mais clara de quanto a família estava acima da média
  regional.

  - **Migração como três passos deliberados, cada um respondendo a um colapso econômico**
  [INFERRED]. Barbacena (1787) → São João del Rei (1810, filhos batizados em 1811 e 1813)
  → Bonfim (censo de 1839) → a Zona da Mata do Rio Pardo / Leopoldina. Lida contra a
  origem anterior da família em Villa Rica, é uma retirada contínua para leste, do ouro
  exaurido rumo a nova renda agrícola: as lavras falharam após ~1760 e a família foi para
  os planaltos agrícolas; os planaltos estavam cheios e a Carta Régia de 1808 abrira a
  mata oriental, e então sua geração foi para o café. Cada passo converteu uma base em
  declínio numa melhor, e cada um foi ascendente. O dele é o último passo claramente
  ascendente que a linha dá.

