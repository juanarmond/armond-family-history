  - **Casamento:** ⚭ Mathilde Maria de Jesus (P-0027), 8 de maio de 1810, Matriz de N.S.
  do Pilar, São João del Rei [PROVEN — PAR-0023, evento E-0052]; ambos "naturaes e
  batizados da Freguesia de Barbacena", família F-0027. Os pais dela eram o Alferes Amaro
  da Silva Xavier (P-0059) e Ignez Francisca de Lima (P-0060) — de modo que os dois lados
  do enlace eram casas de oficiais de milícia.

  - **Óbito:** antes de 2 de agosto de 1862 [PROVEN] — a escritura de compra da Concórdia
  (PRB-0007) nomeia Mathilde "viúva de Ladisláo Egídio Ferreira de Toledo". Uma
  transcrição da recuperação lê "c.27 de abril de 1855" em seu inventário de 1867 —
  [LEAD], sem verificação de imagem. Seu próprio espólio foi liquidado como partilha
