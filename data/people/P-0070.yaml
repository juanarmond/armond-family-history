  - *(Reject: FS "Maria José Borer" GXM1-VJY = a bad São Paulo-namesake tree attachment,
  not a real child.)*

  The wife's parents — named at primary level in the 1864 marriage as "José Eggendorn e
  Maria Freese" — give Vicente's marriage a primary-level Heggendorn connection. Vicente's
  brother José Borer also married Maria's sister Bibiana: two Borer brothers married two
  Heggendorn sisters, repeating the Borer-Wehrli sibling-pair pattern one generation up.

  ## What we can extrapolate

  - **The pre-marital firstborn is a real signal [INFERRED]:** José Domingos was born 19
  March 1864 and the wedding followed on 11 April 1864 — the marriage regularised an
  existing union, exactly mirroring his own parents' 1820 marriage. A recurring
  union-then-formalisation pattern runs through this immigrant family.

  - **The "first cousin of Francisco José Borer" claim is DISPROVEN:** the two NF
  immigrant marriage registers (1820 and 1825) name different fathers from different
  villages — Laurent = son of Jacob Borer of Grindel, the other Jacob = son of João Borer
  of Erschwil. Laurent and Jacob were NOT brothers; Vicente and Francisco José are NOT
  first cousins (cousins at most, undocumented). [PROVEN via bohrer.md BATCH 1 + BATCH 2]

  - **Near the bottom of the arc — a subsistence floor entrenched by partible
  fragmentation [CONTEXTUAL / INFERRED]:** Vicente's recorded profession is "desconhecida",
  and his branch lived on the poor rural Nova Friburgo land toward the vale do Macaé. As
  one of Laurent's ~12 children, his share of an already-poor serra lot was a fragment —
  Brazilian partible succession over a huge sibling set guarantees no accumulation. The
  relentless colony endogamy (Borer×Wehrli, then Borer×Heggendorn sibling-pair marriages)
  is the social face of the same poverty: a tight pool of transplanted Grindel/Solothurn
  families consolidating thin means among themselves rather than marrying up. There was no
  estate here to lose; the story is survival on marginal land, two generations before the
  family's exit to the 20th-century Volta Redonda wage economy.

