  ## Regional and migration context

  Born in the rural Nova Friburgo hinterland toward the vale do Macaé — his firstborn was
  born in the NF district of São José do Ribeirão, where his father Laurent had settled.
  The branch worked the colony's poor serra lots across two generations. [CONTEXTUAL] His
  1864 marriage to Maria Heggendorn is another match inside the tight, endogamous pool of
  transplanted Grindel/Solothurn colonist families at Nova Friburgo.

  The Borer family's NF home base descends from the 1819 Swiss colonists planted under
  King João VI's Decreto de 16 de maio de 1818 — agent Gachet's contract for 100 Swiss
  Catholic families on the Fazenda do Morro Queimado, the only Brazilian city founded by
  royal decree. The colony's failure on those poor, stony serra lots is the backdrop that
  later dispersed the wider family toward the Zona-da-Mata coffee frontier. [CONTEXTUAL]

