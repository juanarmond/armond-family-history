  ## Contexto regional e migratório

  Nascido no interior rural de Nova Friburgo rumo ao vale do Macaé — o seu primogénito
  nasceu no distrito NF de São José do Ribeirão, onde o seu pai Laurent se estabelecera.
  O ramo trabalhou os pobres lotes de serra da colônia por duas gerações. [CONTEXTUAL] O
  casamento de 1864 com Maria Heggendorn é mais um enlace dentro do conjunto restrito e
  endogâmico de famílias colonas transplantadas de Grindel/Solothurn em Nova Friburgo.

  A base de Nova Friburgo da família Borer descende dos colonos suíços de 1819 instalados
  ao abrigo do Decreto de 16 de maio de 1818 do Rei João VI — contrato do agente Gachet
  para 100 famílias suíças católicas na Fazenda do Morro Queimado, a única cidade brasileira
  fundada por decreto régio. O fracasso da colônia naqueles pobres e pedregosos lotes de
  serra é o pano de fundo que dispersou a família mais alargada em direcção à fronteira
  cafeeira da Zona da Mata. [CONTEXTUAL]

