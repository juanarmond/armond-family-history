profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Vicente was born in Brazil in 1828, making him the first generation of the Borer/Bohrer line with no direct memory of Switzerland — a marker of full cultural assimilation into the Nova Friburgo Brazilian-Swiss world, growing up in the colony rather than arriving as an emigrant.

  - **[INFERRED]** His firstborn José Domingos was born on 19 March 1864, three weeks before his marriage to Maria Heggendorn on 11 April 1864 — the same pre-marital firstborn pattern that characterised his own parents' 1820 marriage, suggesting a recurring cultural norm within this colonist community rather than an anomaly.

  - **[CONTEXTUAL]** His brother José Borer married Maria Heggendorn's sister Bibiana — two Borer brothers marrying two Heggendorn sisters — repeating a sibling-pair marriage pattern one generation after the Borer-Wehrli double wedding of 1820, confirming the tight intra-community endogamy as a multi-generational structural feature.

  - **[PROVEN]** He is confirmed as Valentim Martinho Bohrer's father in two independent primary records: his son's 1868 Nova Friburgo baptism (naming "Vicente Bohrer") and his son's 1890 marriage (naming "Vicente Bor[b]er") — a double attestation that distinguishes him from any same-name relative (PAR-0063, PAR-0064).

  - **[INFERRED]** His occupation is recorded as unknown and his branch lived on the marginal Nova Friburgo serra land toward the vale do Macaé — subsistence farming on poor colonial-era lots, two generations before the family's exit to Volta Redonda and the CSN wage economy.

  ## Identity

  **Vicente Borer** — recorded with no middle name in both the compilation and the Casa
  Suíça database; the fuller "Vicente Lourenço Borer" is blog-only and not adopted here.
  [LEAD for "Lourenço"]

  - **Birth:** 6 September 1828, in the Nova Friburgo area (Brazil-born; the sixth son
  of Laurent Borer) (PUB-0003, strong-evidence; E-0062). His Brazilian birth marks the
  immigration boundary at his father Laurent (P-0068). An earlier "~1829" was a blog
  value; the two record-citing sources agree on 1828. [LEAD for 1829]

  - **Parents:** Laurent Borer (P-0068) × Anna Maria Werhly (P-0069), family F-0033
  (PUB-0003).

  - **Marriage:** married Maria Heggendorn (P-0071) on 11 April 1864 (PUB-0003,
  strong-evidence; E-0063).

  - **Death:** unknown ("desconhecido" in the database); no record held. [OPEN]

  ## Family and social network

  - **Children (with Maria Heggendorn), per F-0034:** José Domingos (b. 19 March 1864,
  at São José do Ribeirão — born about three weeks before his parents' marriage), Maria
  Elisabeth (1866), the modelled Valentim Martinho Bohrer (P-0028, 1868), and Vicente
  the younger (1871). [PUB-0003] Vicente is independently named as Valentim's father —
  "Vicente Bohrer / Bor[b]er" — in Valentim's own 1868 Nova Friburgo baptism (PAR-0063) and
  1890 marriage (PAR-0064), which attest the Vicente × Maria (Regina) Eggendorn couple at
  primary level, beyond the PUB-0003 compilation. [PROVEN — PAR-0063, PAR-0064]

  - **A Borer–Heggendorn double marriage:** Vicente's brother José Borer married Maria's
  sister Bibiana Heggendorn (PUB-0003) — two Borer brothers married two Heggendorn
  sisters, repeating the Borer–Wehrli sibling-pair pattern one generation up.

  ## What we can extrapolate

  - **The pre-marital firstborn is a real signal [INFERRED]:** José Domingos was born 19
  March 1864 and the wedding followed on 11 April 1864 — the marriage regularised an
  existing union, exactly mirroring his own parents' 1820 marriage. A recurring
  union-then-formalisation pattern runs through this immigrant family.

  - **The "first cousin of Francisco José Borer" claim is NOT proven [LEAD].** It holds
  only if Laurent (BORER II) and Jacob Borer (BORER I, P-0050) were themselves kin —
  which no document establishes. Present any such cousinship as a lead, never fact.

  - **Near the bottom of the arc — a subsistence floor entrenched by partible
  fragmentation [CONTEXTUAL / INFERRED].** Vicente's recorded profession is literally
  "desconhecida", and his branch lived on the poor rural Nova Friburgo land toward the
  vale do Macaé (his firstborn born at São José do Ribeirão, where his father Laurent had
  settled). As one of Laurent's ~12 children, his share of an already-poor serra lot was a
  fragment — Brazilian partible succession over a huge sibling set guarantees no
  accumulation. The relentless colony endogamy (Borer×Wehrli, then Borer×Heggendorn
  sibling-pair marriages) is the social face of the same poverty: a tight pool of
  transplanted Grindel/Solothurn families consolidating thin means among themselves rather
  than marrying up. There was no estate here to lose; the story is survival on marginal
  land, two generations before the family's exit to the 20th-century Volta Redonda wage
  economy.

  ## Open questions

  - His **baptism (~September 1828)**, **marriage (1864)** and **death** sit in the Nova
  Friburgo parish/civil registers (reportedly not on FamilySearch); the baptism would
  also settle the 1828-vs-1829 date and any middle name. [OPEN]

  ## Sources held (this repository)

  - PAR-0063 (his son Valentim's 1868 Nova Friburgo baptism — names him as father "Vicente
  Bohrer") · PAR-0064 (Valentim's 1890 Nova Friburgo marriage — names him as father "Vicente
  Bor[b]er"): primary corroboration of his fatherhood of Valentim.

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER II tree entry 1.1.7, and the Casa
  Suíça database) — the source for his birth, marriage and children.

  ## Regional and migration context

  Born in the rural Nova Friburgo hinterland toward the vale do Macaé — his firstborn was
  born in the district of São José do Ribeirão, where his father Laurent had settled —
  the branch worked the colony's poor serra lots across two generations. [CONTEXTUAL] His
  1864 marriage to Maria Heggendorn is another match inside the tight, endogamous pool of
  transplanted Grindel/Solothurn colonist families at Nova Friburgo.

  ## Where to go today

  - **Birth (6 Sep 1828) and 1864 marriage to Maria Heggendorn:** Catedral Diocesana /
  Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio
  Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** Vicente nasceu no Brasil em 1828, tornando-se a primeira geração da linha Borer/Bohrer sem memória directa da Suíça — um marcador de plena assimilação cultural no mundo brasileira-suíço de Nova Friburgo, crescendo na colónia em vez de chegar como emigrante.

  - **[INFERRED]** O seu primogénito José Domingos nasceu em 19 de Março de 1864, três semanas antes do casamento com Maria Heggendorn em 11 de Abril de 1864 — o mesmo padrão de primogénito pré-matrimonial que caracterizou o casamento dos seus próprios pais em 1820, sugerindo uma norma cultural recorrente nesta comunidade de colonos em vez de uma anomalia.

  - **[CONTEXTUAL]** O irmão José Borer casou com a irmã de Maria Heggendorn, Bibiana — dois irmãos Borer a casar com duas irmãs Heggendorn — repetindo um padrão de casamento em pares de irmãos uma geração depois do casamento duplo Borer-Wehrli de 1820, confirmando a endogamia intra-comunitária apertada como uma característica estrutural multi-geracional.

  - **[PROVEN]** É confirmado como pai de Valentim Martinho Bohrer em dois registos primários independentes: o baptizado do filho em Nova Friburgo em 1868 (nomeando "Vicente Bohrer") e o casamento do filho em 1890 (nomeando "Vicente Bor[b]er") — uma dupla atestação que o distingue de qualquer parente com o mesmo nome (PAR-0063, PAR-0064).

  - **[INFERRED]** A sua ocupação está registada como desconhecida e o seu ramo vivia nos marginais lotes serraninos de Nova Friburgo em direcção ao vale do Macaé — agricultura de subsistência em lotes pobres da era colonial, duas gerações antes da saída da família para Volta Redonda e a economia de salários da CSN.

  ## Identidade

  **Vicente Borer** — registrado sem nome do meio tanto na compilação quanto no banco de
  dados da Casa Suíça; a forma mais completa "Vicente Lourenço Borer" é apenas de blog e
  não é adotada aqui. [LEAD para "Lourenço"]

  - **Nascimento:** 6 de setembro de 1828, na área de Nova Friburgo (nascido no Brasil; o
  sexto filho homem de Laurent Borer) (PUB-0003, evidência forte; E-0062). Seu nascimento
  brasileiro marca a fronteira imigratória em seu pai Laurent (P-0068). Um anterior
  "~1829" era valor de blog; as duas fontes que citam registros concordam com 1828.
  [LEAD para 1829]

  - **Pais:** Laurent Borer (P-0068) × Anna Maria Werhly (P-0069), família F-0033
  (PUB-0003).

  - **Casamento:** casou-se com Maria Heggendorn (P-0071) em 11 de abril de 1864
  (PUB-0003, evidência forte; E-0063).

  - **Óbito:** desconhecido ("desconhecido" no banco de dados); nenhum registro em mãos.
  [OPEN]

  ## Família e rede social

  - **Filhos (com Maria Heggendorn), conforme F-0034:** José Domingos (n. 19 de março de
  1864, em São José do Ribeirão — nascido cerca de três semanas antes do casamento dos
  pais), Maria Elisabeth (1866), o modelado Valentim Martinho Bohrer (P-0028, 1868) e
  Vicente, o mais novo (1871). [PUB-0003] Vicente é nomeado de forma independente como pai de
  Valentim — "Vicente Bohrer / Bor[b]er" — no próprio batismo de 1868 (PAR-0063) e no
  casamento de 1890 (PAR-0064) de Valentim, em Nova Friburgo, que atestam o casal Vicente ×
  Maria (Regina) Eggendorn em nível primário, além da compilação PUB-0003. [PROVEN — PAR-0063,
  PAR-0064]

  - **Um casamento duplo Borer–Heggendorn:** o irmão de Vicente, José Borer, casou-se com
  a irmã de Maria, Bibiana Heggendorn (PUB-0003) — dois irmãos Borer casaram-se com duas
  irmãs Heggendorn, repetindo o padrão de pares de irmãos Borer–Wehrli uma geração acima.

  ## O que podemos extrapolar

  - **O primogênito pré-marital é um sinal real [INFERRED]:** José Domingos nasceu em 19
  de março de 1864 e o casamento seguiu em 11 de abril de 1864 — o casamento regularizou
  uma união existente, espelhando exatamente o casamento de 1820 de seus próprios pais. Um
  padrão recorrente de união-e-depois-formalização atravessa esta família imigrante.

  - **A alegação de "primo em primeiro grau de Francisco José Borer" NÃO está comprovada
  [LEAD].** Ela só se sustenta se Laurent (BORER II) e Jacob Borer (BORER I, P-0050) fossem
  eles próprios parentes — o que nenhum documento estabelece. Apresente qualquer tal
  parentesco como pista, nunca como fato.

  - **Perto do fundo do arco — um piso de subsistência entrincheirado pela fragmentação
  partível [CONTEXTUAL / INFERRED].** A profissão registrada de Vicente é literalmente
  "desconhecida", e seu ramo vivia na pobre terra rural de Nova Friburgo rumo ao vale do
  Macaé (seu primogênito nasceu em São José do Ribeirão, onde seu pai Laurent se
  estabelecera). Como um dos ~12 filhos de Laurent, seu quinhão de um lote de serra já
  pobre era um fragmento — a sucessão partível brasileira sobre um conjunto enorme de
  irmãos garante nenhuma acumulação. A incessante endogamia da colônia (casamentos de
  pares de irmãos Borer×Wehrli e depois Borer×Heggendorn) é a face social da mesma
  pobreza: um conjunto restrito de famílias transplantadas de Grindel/Solothurn
  consolidando meios escassos entre si em vez de casar para cima. Não havia aqui
  patrimônio a perder; a história é de sobrevivência em terra marginal, duas gerações
  antes da saída da família para a economia salarial de Volta Redonda no século XX.

  ## Questões em aberto

  - Seu **batismo (~setembro de 1828)**, **casamento (1864)** e **óbito** estão nos
  registros paroquiais/civis de Nova Friburgo (ao que se relata fora do FamilySearch); o
  batismo também resolveria a data 1828-vs-1829 e qualquer nome do meio. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0063 (batismo de 1868 de seu filho Valentim em Nova Friburgo — o nomeia como pai
  "Vicente Bohrer") · PAR-0064 (casamento de 1890 de Valentim em Nova Friburgo — o nomeia como
  pai "Vicente Bor[b]er"): corroboração primária de sua paternidade de Valentim.

  - PUB-0003 (*Imigrantes de Nova Friburgo*, entrada 1.1.7 da árvore BORER II, e o banco
  de dados da Casa Suíça) — a fonte de seu nascimento, casamento e filhos.

  ## Contexto regional e migratório

  Nascido no interior rural de Nova Friburgo rumo ao vale do Macaé — seu primogênito
  nasceu no distrito de São José do Ribeirão, onde seu pai Laurent se estabelecera —, o
  ramo trabalhou os pobres lotes de serra da colônia por duas gerações. [CONTEXTUAL] Seu
  casamento de 1864 com Maria Heggendorn é mais um enlace dentro do conjunto restrito e
  endogâmico de famílias colonas transplantadas de Grindel/Solothurn em Nova Friburgo.

  ## Onde ir hoje

  - **Nascimento (6 de setembro de 1828) e casamento de 1864 com Maria Heggendorn:**
  Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua
  Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
