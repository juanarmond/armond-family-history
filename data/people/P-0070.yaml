profile: >-
  ## Interesting facts

  - **[PROVEN]** His 1828 Nova Friburgo baptism is now held: born 6 September 1828,
  baptized 13 October 1828, "filho legitimo de Lourenço Bhorer e de sua mulher Anna Maria
  Verly" — settling the 1828-vs-1829 date and his parentage at primary level.
  (rec-bohrer-vicente-baptism-1828-novafriburgo-djoaovi.jpg)

  - **[PROVEN]** His 1864 Nova Friburgo marriage register is now held: "Vicente Bohrer
  (35 annos), filho legitimo de Lourenço Bohrer e Anna Maria Verly" marrying "Maria
  Eggendorn (20 annos), filha legitima de José Eggendorn e Maria Freese" on 11 April
  1864 — making both spouses' parentage primary-level.
  (rec-bohrer-vicente-heggendorn-marriage-1864-novafriburgo-djoaovi.jpg)

  - **[PROVEN]** The claim that Vicente and Francisco José Borer were "first cousins" is
  disproven: the two NF immigrant marriage registers name different fathers from different
  villages — Laurent = son of Jacob Borer of Grindel (1820), the other immigrant Jacob =
  son of João Borer of Erschwil (1825) — so Laurent and Jacob were NOT brothers.

  - **[INFERRED]** His firstborn José Domingos was born on 19 March 1864, three weeks
  before the marriage on 11 April 1864 — the same pre-marital firstborn pattern that
  characterised his own parents' 1820 marriage, suggesting a recurring cultural norm
  within this colonist community.

  - **[CONTEXTUAL]** His brother José Borer married Maria Heggendorn's sister Bibiana —
  two Borer brothers marrying two Heggendorn sisters — repeating a sibling-pair marriage
  pattern one generation after the Borer-Wehrli double wedding of 1820, confirming the
  tight intra-community endogamy as a multi-generational structural feature.

  - **[INFERRED]** His occupation is recorded as unknown and his branch lived on the
  marginal Nova Friburgo serra land toward the vale do Macaé — subsistence farming on
  poor colonial-era lots, two generations before the family's exit to Volta Redonda and
  the CSN wage economy.

