profile: >-
  ## Interesting facts

  - **[PROVEN]** His 1828 Nova Friburgo baptism is held: born 6 September 1828, baptised 13
  October 1828, "filho legitimo de Lourenço Bhorer e da sua mulher Anna Maria Verly, naturaes
  do cantão de Soleure" (PAR-0061) — which settles the 1828-vs-1829 question and his parentage
  at primary level, and marks him as the first Brazilian-born generation of this trunk.

  - **[PROVEN]** His 1864 marriage register is held too: "Vicente Bohrer, de trinta e cinco
  annos, filho legitimo de Lourenço Bohrer e de Anna Maria Verly" marrying "Maria Eggendorn,
  de vinte annos, filha legitima de José Eggendorn e de Maria Freese", both born, baptised and
  resident in the parish (PAR-0062) — making both spouses' parentage primary-level in a single
  act.

  - **[PROVEN]** The long-repeated claim that Vicente and Francisco José Borer were **first
  cousins is disproven**. The two immigrant marriage registers name different fathers from
  different villages: Laurent is son of Jacob Borer of Grindel (1820, PAR-0060), the other
  immigrant Jacob is son of João Borer of the Beinwil/Erschwil side (1825, PAR-0059). Laurent
  and Jacob were not brothers.

  - **[INFERRED]** He married at 35 to a bride of 20, and his firstborn José Domingos was born
  on 19 March 1864, three weeks before the wedding on 11 April — the same pattern as his own
  parents' 1820 marriage. Late marriage and a regularised union are both what land scarcity
  looks like in a register.

  - **[CONTEXTUAL]** His brother José Borer married Maria Heggendorn's sister Bibiana: two
  Borer brothers to two Heggendorn sisters, one generation after the two Wehrli sisters
  married on a single day in 1820. The sibling-pair marriage is a structural feature of this
  colony, not a coincidence.

  - **[PROVEN]** No occupation is recorded for him anywhere, but his sons' records give the
  household's class directly: his son José Maria Bocher married in 1913 at Barra Alegre (Bom
  Jardim) as a *lavrador* (CIV-0048), and his son Valentim and Valentim's wife are entered as
  *lavradores* in 1891 (CIV-0045) — a farming household that had moved off the original colony
  lot.

  ## Identity

  **Vicente Borer** — recorded with no middle name in both the primary records and the Casa
  Suíça database; "Vicente Lourenço Borer" is blog-only and not adopted here [LEAD for
  "Lourenço"]. Surname written Borer, Bohrer, Bhorer, Bor[b]er and Bocher across the acts that
  name him.

  - **Birth:** 6 September 1828 at Nova Friburgo, baptised 13 October 1828 — [PROVEN] from the
  held baptism (PAR-0061; event E-0062); godparents Vicente Jacond [uncertain] and Catharina
  Eggendorn. An earlier blog value of "~1829" is retired.

  - **Parents:** Laurent Borer (P-0068) × Anna Maria Wehrli (P-0069), family F-0033 — named in
  both his 1828 baptism and his 1864 marriage [PROVEN]. Nationality **Brazilian**: he is the
  first generation of this trunk born in the colony, which places the immigration boundary at
  his father.

  - **Marriage:** married Maria (Thecla Regina) Heggendorn (P-0071) on 11 April 1864 at Nova
  Friburgo, aged 35 to her 20, before the vicar João José Viviand; witnesses José Eggendorn
  (the bride's own father) and Anna Maria Bohrer [PROVEN — PAR-0062; event E-0063].

  - **Death:** unknown — "desconhecido" in the Casa Suíça database; no record held. [OPEN]

  ## Standing and profession

  - **No occupation, office, title, property or literacy is recorded for him personally.** The
  Casa Suíça database enters "profissão desconhecida", and none of the four held acts that
  name him states a trade. [PUB-0003; PAR-0061, PAR-0062, PAR-0081, CIV-0045, CIV-0048]

  - **His household's class is nonetheless documented, through his sons.** The 1891 civil
  birth of his granddaughter describes his son Valentim Martinho and Valentim's wife as
  "brazileiros, **lavradores** e moradores desta Parochia" of São José do Ribeirão (CIV-0045),
  and the 1913 civil marriage of his son José Maria Bocher, at Maravilhas in Barra Alegre (Bom
  Jardim), likewise records the groom as a *lavrador* (CIV-0048). The family worked land;
  there is no sign it owned much of it.

  - **Literacy:** nothing is recorded for Vicente. The nearest documented signal in his
  household is negative and one generation down — the 1891 act was signed *a rogo* because his
  son Valentim "não sabe escrever" (CIV-0045).

  ## Family and social network

  - **Wife:** Maria (Thecla Regina) Heggendorn (P-0071), born 23 September 1844, baptised 2
  June 1845 at Nova Friburgo (PAR-0072); family F-0034. Her parents José Eggendorn (P-0101) ×
  Maria (Anna Maria) Freese (P-0102) are named at primary level in the 1864 marriage, and her
  father stood as a witness at it.

  - **Children** — reconciled to six (a FamilySearch tree carried seven, including one
  duplicate and one bad attachment; the Lorenz compilation lists four):

  - **José Domingos Borer**, b. 19 March 1864 at São José do Ribeirão, about three weeks
  before his parents' marriage [LEAD — compilation entry 1.1.7.1 plus tree; the Nova Friburgo
  cathedral baptism register is a bounded negative for 1864].

  - **Maria Elisabeth Borer**, b. 15 December 1866, baptised 10 February 1867 at Nova
  Friburgo, "filha legítima de Vicente Bohrer e de Maria Eggendorn"; godparents João and
  Elisabeth Eggendorn, her mother's kin [PROVEN — PAR-0081].

  - **Valentim Martinho Bohrer** (P-0028, b. 1868) — the modelled child, through whom the line
  continues [PROVEN — his own baptism PAR-0063, marriage PAR-0064 and later civil records].

  - **Vicente Borer the younger**, b. 16 April 1871 [LEAD — compilation entry 1.1.7.4 plus
  tree; cathedral baptism a bounded negative].

  - **José Maria Bocher**, b. ~1886 by his stated age; married 2 May 1913 at Maravilhas, Barra
  Alegre, Bom Jardim, RJ, a *lavrador*, "filho legitimo de Vicente Bocher e Maria [Regina]
  Haggendorn", with his brother Valentim Martinho among the signatories [PROVEN — CIV-0048].

  - *(Rejected: the FamilySearch "Maria José Borer" GXM1-VJY, a São Paulo namesake wrongly
  attached.)*

  - **A second Borer–Heggendorn tie:** his brother José Borer married Maria's sister Bibiana
  [PUB-0003] — two brothers, two sisters, repeating the Borer–Wehrli sibling pattern of the
  previous generation.

  ## What we can extrapolate

  - **The first Brazilian-born generation inherited a position, not an estate [INFERRED].**
  Vicente was one of eleven or twelve children of a colonist whose only asset was one poor
  serra lot. Under Brazilian partible succession his share of it was a fragment, and nothing
  in his record suggests he ever held land in his own name: no occupation, no property, no
  office, no title, across four held acts spanning thirty-six years. What he inherited was a
  place in the colony's social order — a surname the neighbours recognised, and a marriage
  market of transplanted Solothurn families — and that is genuinely all the documents give
  him.

  - **Late marriage and a pre-marital firstborn are economic facts, not moral ones [INFERRED /
  CONTEXTUAL].** He married at 35, sixteen or so years past the age at which a man with a farm
  to inherit would have married, and the union was already producing children before it was
  formalised. Both are the standard signature of a household that could not endow a new
  couple: the wedding waits until there is something to wed on, and in the meantime the union
  exists anyway. His own parents' 1820 marriage shows the same shape, so this is a pattern in
  the family, not an incident.

  - **The colony endogamy is the social face of the same scarcity [CONTEXTUAL / INFERRED].**
  Borer × Wehrli in 1820, then Borer × Heggendorn twice in the next generation — two brothers
  marrying two sisters — is a marriage pool that consolidates thin means among a handful of
  transplanted Grindel and Solothurn households rather than marrying outward or upward. There
  is no in-marriage to Brazilian landed families anywhere in this branch. A closed pool is
  cheap and safe; it also caps mobility.

  - **Education: this is the generation that did not buy it, and the evidence is direct
  [CONTEXTUAL / INFERRED].** Nineteenth-century Brazilian schooling was a purchased,
  class-linked privilege with no free rural alternative, so literacy had to be re-bought each
  generation. The Solothurn colonists had arrived with German parish-school literacy; by
  Vicente's children it is gone — his son Valentim had to have his own daughter's 1891 birth
  declared *a rogo*, "por não saber escrever" (CIV-0045). Vicente's household is where that
  loss happened: a *lavrador* family on fragmented serra land had neither the money nor the
  school.

  - **The second migration is the one that mattered, and it is documented [PROVEN for the
  places; INFERRED for the cause].** This branch does not stay on the 1819 lot. His firstborn
  is born at São José do Ribeirão; his granddaughter is born there in 1891; his son marries at
  Barra Alegre, Bom Jardim, in 1913. That is the colony's documented failure pattern — poor,
  stony, undersized plots that many settlers abandoned within a few years — working through
  one family across two generations: not an ascent to a frontier, but farm labour spreading
  out over the surrounding fluminense highlands because the original lot could not carry the
  heirs.

  - **The arc, named [INFERRED].** Colonist's son with a twelfth of a poor lot (1828) → a
  union formalised only at 35, on no visible property (1864) → children who leave the lot and
  appear as *lavradores* at São José do Ribeirão and Bom Jardim (1891, 1913) → literacy lost
  in the same step. Flat, and slightly sinking on the one measurable axis. There was never an
  estate here to lose, which is exactly the inverse of the family's Armond line; the recovery
  on this side comes later and elsewhere, when a descendant leaves the land for the
  20th-century urban wage economy. That his contemporaries on the other Solothurn Borer branch
  — Francisco José Borer, a self-signing testator whose sons reached commerce, local office
  and a newspaper — ended so differently from the same 1819 floor is the sharpest comparison
  available: the variable was town trade against fragmenting land, not origin.

  ## Open questions

  - ✅ RESOLVED (2026-09-09) — his 1828 Nova Friburgo baptism is held: b. 6 September 1828,
  baptised 13 October, parents Lourenço Borer × Anna Maria Verly, no middle name.

  - ✅ RESOLVED (2026-09-09) — his 1864 Nova Friburgo marriage is held, with both spouses'
  parents named.

  - ✅ RESOLVED (2026-09-09) — the Laurent ≈ Jacob question: they were not brothers, so Vicente
  is not a first cousin of Francisco José Borer.

  - **His death** — "desconhecido" in the database, no record held. Given the branch's
  documented move, search the Nova Friburgo registers **and** those of São José do Ribeirão
  and Bom Jardim. [OPEN]

  - **His occupation** — an inventário, a land registry entry or a civil act naming him with a
  trade would settle whether the household owned or only worked its land. [OPEN]

  ## Sources held (this repository)

  - PAR-0061 (his own 1828 Nova Friburgo baptism — b. 6 September 1828, parents Lourenço Borer
  × Anna Maria Verly; sources event E-0062).

  - PAR-0062 (his own 1864 Nova Friburgo marriage — Vicente 35 × Maria Eggendorn 20; names
  both couples of parents; sources event E-0063).

  - PAR-0081 (his daughter Maria Elizabeth's 1867 Nova Friburgo baptism — names him as father
  "Vicente Bohrer").

  - PAR-0063 (his son Valentim's 1868 Nova Friburgo baptism — names him "Vicente Bohrer") ·
  PAR-0064 (Valentim's 1890 Nova Friburgo marriage — names him "Vicente Bor[b]er").

  - CIV-0045 (his granddaughter Maria Felomena's 1891 civil birth at São José do Ribeirão —
  names him and Maria as the paternal grandparents, and his son and daughter-in-law as
  *lavradores*, the son unable to write).

  - CIV-0048 (his son José Maria Bocher's 1913 civil marriage at Barra Alegre, Bom Jardim —
  names him as father, the son a *lavrador*, with Valentim Martinho among the signatories).

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER II entry 1.1.7, and the Casa Suíça
  database) — secondary source for his position as sixth son, his marriage and his children;
  profession "desconhecida".

  ## Regional and migration context

  Born in the rural Nova Friburgo hinterland toward the vale do Macaé, on the poor serra lots
  his father had been allotted in the 1819 Swiss colonisation. [CONTEXTUAL] His 1864 marriage
  to Maria Heggendorn is another match inside the tight, endogamous pool of transplanted
  Grindel and Solothurn colonist families. His firstborn was born at São José do Ribeirão and
  his later children's records place the household there and at Barra Alegre in Bom Jardim —
  the branch moving out over the surrounding highlands rather than into the town.

  The colony he was born into was created by Dom João VI's *Decreto de 16 de maio de 1818*,
  agent Gachet's contract for 100 Swiss **Catholic** families on the Fazenda do Morro
  Queimado, the only Brazilian city founded by royal decree. Its plots were poor, stony and
  undersized, its support inadequate, and many colonists abandoned them within a few years;
  that failure is the backdrop both to his own family's drift toward Bom Jardim and to the
  wider family's later dispersal toward the Zona da Mata coffee frontier. [CONTEXTUAL]

  ## Where to go today

  - **Birth (6 September 1828) and marriage (11 April 1864):** Catedral Diocesana / Igreja
  Matriz de São João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo,
  RJ, CEP 28610-390 [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **The household's later ground (his children's records, 1864–1913):** São José do Ribeirão
  and Barra Alegre / Maravilhas, Bom Jardim, RJ — the parishes and civil registries to search
  for his death [OPEN] · [Maps](https://maps.google.com/?q=-22.205,-42.3981)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu batismo de 1828 em Nova Friburgo está disponível: nascido em 6 de
  setembro de 1828, batizado em 13 de outubro de 1828, "filho legitimo de Lourenço Bhorer e da
  sua mulher Anna Maria Verly, naturaes do cantão de Soleure" (PAR-0061) — o que resolve a
  questão 1828 contra 1829 e sua filiação em nível primário, e o marca como a primeira geração
  nascida no Brasil deste tronco.

  - **[PROVEN]** Seu registro de casamento de 1864 também está disponível: "Vicente Bohrer, de
  trinta e cinco annos, filho legitimo de Lourenço Bohrer e de Anna Maria Verly", casando-se
  com "Maria Eggendorn, de vinte annos, filha legitima de José Eggendorn e de Maria Freese",
  ambos nascidos, batizados e moradores da freguesia (PAR-0062) — tornando primária, num único
  ato, a filiação dos dois cônjuges.

  - **[PROVEN]** A alegação muito repetida de que Vicente e Francisco José Borer eram **primos
  em primeiro grau está refutada**. Os dois registros de casamento dos imigrantes nomeiam pais
  diferentes, de aldeias diferentes: Laurent é filho de Jacob Borer, de Grindel (1820,
  PAR-0060), e o outro imigrante Jacob é filho de João Borer, do lado Beinwil/Erschwil (1825,
  PAR-0059). Laurent e Jacob não eram irmãos.

  - **[INFERRED]** Casou-se aos 35 anos com uma noiva de 20, e seu primogênito José Domingos
  nasceu em 19 de março de 1864, três semanas antes do casamento, em 11 de abril — o mesmo
  padrão do casamento de 1820 de seus próprios pais. Casamento tardio e união regularizada
  são, ambos, o que a escassez de terra parece dentro de um livro de registros.

  - **[CONTEXTUAL]** Seu irmão José Borer casou-se com Bibiana, irmã de Maria Heggendorn: dois
  irmãos Borer para duas irmãs Heggendorn, uma geração depois de as duas irmãs Wehrli se
  casarem no mesmo dia, em 1820. O casamento em pares de irmãos é traço estrutural desta
  colônia, não coincidência.

  - **[PROVEN]** Nenhuma ocupação lhe é registrada em parte alguma, mas os registros de seus
  filhos dão diretamente a classe do domicílio: seu filho José Maria Bocher casou-se em 1913
  em Barra Alegre (Bom Jardim) como *lavrador* (CIV-0048), e seu filho Valentim e a esposa
  dele figuram como *lavradores* em 1891 (CIV-0045) — um domicílio agrícola que já havia saído
  do lote colonial original.

  ## Identidade

  **Vicente Borer** — registrado sem nome do meio tanto nos registros primários quanto no
  banco de dados da Casa Suíça; "Vicente Lourenço Borer" aparece apenas em blogs e não é
  adotado aqui [LEAD quanto a "Lourenço"]. Sobrenome grafado Borer, Bohrer, Bhorer, Bor[b]er e
  Bocher nos atos que o nomeiam.

  - **Nascimento:** 6 de setembro de 1828 em Nova Friburgo, batizado em 13 de outubro de 1828
  — [PROVEN] pelo batismo retido (PAR-0061; evento E-0062); padrinhos Vicente Jacond [incerto]
  e Catharina Eggendorn. Um valor anterior de blog, "~1829", está aposentado.

  - **Pais:** Laurent Borer (P-0068) × Anna Maria Wehrli (P-0069), família F-0033 — nomeados
  tanto em seu batismo de 1828 quanto em seu casamento de 1864 [PROVEN]. Nacionalidade
  **brasileira**: é a primeira geração deste tronco nascida na colônia, o que situa a
  fronteira imigratória em seu pai.

  - **Casamento:** casou-se com Maria (Thecla Regina) Heggendorn (P-0071) em 11 de abril de
  1864, em Nova Friburgo, aos 35 anos contra os 20 dela, perante o vigário João José Viviand;
  testemunhas José Eggendorn (o próprio pai da noiva) e Anna Maria Bohrer [PROVEN — PAR-0062;
  evento E-0063].

  - **Óbito:** desconhecido — "desconhecido" no banco de dados da Casa Suíça; nenhum registro
  disponível. [OPEN]

  ## Posição social e profissão

  - **Nenhuma ocupação, cargo, título, propriedade ou alfabetização lhe é registrada
  pessoalmente.** O banco de dados da Casa Suíça lança "profissão desconhecida", e nenhum dos
  quatro atos disponíveis que o nomeiam declara ofício. [PUB-0003; PAR-0061, PAR-0062,
  PAR-0081, CIV-0045, CIV-0048]

  - **A classe de seu domicílio, ainda assim, está documentada pelos filhos.** O nascimento
  civil de sua neta, em 1891, descreve seu filho Valentim Martinho e a esposa como
  "brazileiros, **lavradores** e moradores desta Parochia", em São José do Ribeirão
  (CIV-0045), e o casamento civil de 1913 de seu filho José Maria Bocher, em Maravilhas, Barra
  Alegre (Bom Jardim), igualmente registra o noivo como *lavrador* (CIV-0048). A família
  trabalhava a terra; não há sinal de que possuísse muita dela.

  - **Alfabetização:** nada está registrado para Vicente. O sinal documentado mais próximo em
  seu domicílio é negativo e está uma geração abaixo — o ato de 1891 foi assinado *a rogo*
  porque seu filho Valentim "não sabe escrever" (CIV-0045).

  ## Família e rede social

  - **Esposa:** Maria (Thecla Regina) Heggendorn (P-0071), nascida em 23 de setembro de 1844 e
  batizada em 2 de junho de 1845, em Nova Friburgo (PAR-0072); família F-0034. Seus pais José
  Eggendorn (P-0101) × Maria (Anna Maria) Freese (P-0102) são nomeados em nível primário no
  casamento de 1864, e o pai dela foi testemunha do ato.

  - **Filhos** — reconciliados em seis (uma árvore do FamilySearch trazia sete, incluindo uma
  duplicata e uma vinculação equivocada; a compilação Lorenz lista quatro):

  - **José Domingos Borer**, n. 19 de março de 1864, em São José do Ribeirão, cerca de três
  semanas antes do casamento dos pais [LEAD — entrada 1.1.7.1 da compilação e árvore; o livro
  de batismos da catedral de Nova Friburgo é negativa delimitada para 1864].

  - **Maria Elisabeth Borer**, n. 15 de dezembro de 1866, batizada em 10 de fevereiro de 1867,
  em Nova Friburgo, "filha legítima de Vicente Bohrer e de Maria Eggendorn"; padrinhos João e
  Elisabeth Eggendorn, parentes maternos [PROVEN — PAR-0081].

  - **Valentim Martinho Bohrer** (P-0028, n. 1868) — o filho modelado, por quem a linha
  continua [PROVEN — seu próprio batismo PAR-0063, casamento PAR-0064 e registros civis
  posteriores].

  - **Vicente Borer, o moço**, n. 16 de abril de 1871 [LEAD — entrada 1.1.7.4 da compilação e
  árvore; batismo na catedral é negativa delimitada].

  - **José Maria Bocher**, n. ~1886 pela idade declarada; casou-se em 2 de maio de 1913, em
  Maravilhas, Barra Alegre, Bom Jardim, RJ, *lavrador*, "filho legitimo de Vicente Bocher e
  Maria [Regina] Haggendorn", com o irmão Valentim Martinho entre os signatários [PROVEN —
  CIV-0048].

  - *(Rejeitada: a "Maria José Borer" GXM1-VJY do FamilySearch, homônima paulista
  indevidamente vinculada.)*

  - **Um segundo laço Borer–Heggendorn:** seu irmão José Borer casou-se com Bibiana, irmã de
  Maria [PUB-0003] — dois irmãos, duas irmãs, repetindo o padrão Borer–Wehrli da geração
  anterior.

  ## O que podemos extrapolar

  - **A primeira geração nascida no Brasil herdou uma posição, não um patrimônio [INFERRED].**
  Vicente era um de onze ou doze filhos de um colono cujo único ativo era um lote serrano
  pobre. Sob a sucessão partível brasileira, seu quinhão era um fragmento, e nada em seu
  registro sugere que algum dia tenha detido terra em nome próprio: nenhuma ocupação,
  propriedade, cargo ou título, em quatro atos disponíveis que cobrem trinta e seis anos. O
  que herdou foi um lugar na ordem social da colônia — um sobrenome que os vizinhos
  reconheciam e um mercado matrimonial de famílias de Solothurn transplantadas — e isso é, de
  fato, tudo o que os documentos lhe dão.

  - **Casamento tardio e primogênito pré-nupcial são fatos econômicos, não morais [INFERRED /
  CONTEXTUAL].** Casou-se aos 35, uns dezesseis anos depois da idade em que teria casado um
  homem com uma lavoura a herdar, e a união já gerava filhos antes de ser formalizada. Ambos
  são a assinatura padrão de um domicílio incapaz de dotar um casal novo: o casamento espera
  até haver algo com que casar e, enquanto isso, a união existe de qualquer modo. O casamento
  de 1820 de seus próprios pais mostra a mesma forma — é padrão de família, não incidente.

  - **A endogamia colonial é a face social da mesma escassez [CONTEXTUAL / INFERRED].** Borer
  × Wehrli em 1820 e depois Borer × Heggendorn duas vezes na geração seguinte — dois irmãos
  casando-se com duas irmãs — é um repertório matrimonial que consolida meios escassos entre
  um punhado de domicílios transplantados de Grindel e de Solothurn, em vez de casar para fora
  ou para cima. Não há, em nenhum ponto deste ramo, casamento com famílias brasileiras
  proprietárias. Um repertório fechado é barato e seguro; também limita a mobilidade.

  - **Educação: esta é a geração que não a comprou, e a evidência é direta [CONTEXTUAL /
  INFERRED].** A escolarização brasileira do século XIX era privilégio comprado e ligado à
  classe, sem alternativa rural gratuita, de modo que a alfabetização tinha de ser recomprada
  a cada geração. Os colonos de Solothurn haviam chegado com alfabetização de escola paroquial
  em alemão; nos filhos de Vicente ela sumiu — seu filho Valentim precisou declarar o
  nascimento da própria filha, em 1891, *a rogo*, "por não saber escrever" (CIV-0045). O
  domicílio de Vicente é onde essa perda ocorreu: uma família de *lavradores* em terra serrana
  fragmentada não tinha nem o dinheiro nem a escola.

  - **A segunda migração é a que importou, e está documentada [PROVEN quanto aos lugares;
  INFERRED quanto à causa].** Este ramo não permanece no lote de 1819. Seu primogênito nasce
  em São José do Ribeirão; sua neta nasce ali em 1891; seu filho casa-se em Barra Alegre, Bom
  Jardim, em 1913. É o padrão documentado de fracasso da colônia — glebas pobres, pedregosas e
  subdimensionadas, que muitos colonos abandonaram em poucos anos — se desdobrando numa
  família ao longo de duas gerações: não uma ascensão rumo a uma fronteira, e sim mão de obra
  agrícola espalhando-se pelas serras fluminenses vizinhas porque o lote original não podia
  sustentar os herdeiros.

  - **O arco, nomeado [INFERRED].** Filho de colono com um doze avos de um lote pobre (1828) →
  uma união formalizada só aos 35, sobre nenhuma propriedade visível (1864) → filhos que
  deixam o lote e aparecem como *lavradores* em São José do Ribeirão e Bom Jardim (1891, 1913)
  → alfabetização perdida no mesmo passo. Plano, e levemente descendente no único eixo
  mensurável. Nunca houve aqui um patrimônio a perder, o que é exatamente o inverso da linha
  Armond da família; a recuperação deste lado vem depois e alhures, quando um descendente
  deixa a terra pela economia salarial urbana do século XX. Que seus contemporâneos do outro
  ramo Borer de Solothurn — Francisco José Borer, testador que assina o próprio testamento e
  cujos filhos chegaram ao comércio, a cargo local e a um jornal — tenham terminado tão
  diferentes a partir do mesmo piso de 1819 é a comparação mais aguda disponível: a variável
  foi comércio urbano contra terra que se fragmentava, não origem.

