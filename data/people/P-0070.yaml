  ## Contexto regional e migratório

  Nascido no interior rural de Nova Friburgo, rumo ao vale do Macaé, nos pobres lotes serranos
  que seu pai recebera na colonização suíça de 1819. [CONTEXTUAL] Seu casamento de 1864 com
  Maria Heggendorn é mais uma união dentro do estreito repertório endogâmico das famílias
  colonas transplantadas de Grindel e de Solothurn. Seu primogênito nasceu em São José do
  Ribeirão, e os registros de seus filhos posteriores situam o domicílio ali e em Barra
  Alegre, no Bom Jardim — o ramo espalhando-se pelas serras vizinhas, e não para dentro da
  vila.

  A colônia em que nasceu foi criada pelo *Decreto de 16 de maio de 1818* de Dom João VI, o
  contrato do agente Gachet para 100 famílias suíças **católicas** na Fazenda do Morro
  Queimado, a única cidade brasileira fundada por decreto real. Suas glebas eram pobres,
  pedregosas e subdimensionadas, seu apoio insuficiente, e muitos colonos as abandonaram em
  poucos anos; esse fracasso é o pano de fundo tanto do deslocamento de sua própria família
  rumo ao Bom Jardim quanto da dispersão posterior da família ampliada rumo à fronteira
  cafeeira da Zona da Mata. [CONTEXTUAL]

