  Os pais da esposa — nomeados em nível primário no casamento de 1864 como "José Eggendorn
  e Maria Freese" — conferem uma ligação Heggendorn de nível primário ao casamento de
  Vicente. O irmão José Borer tinha também casado com a irmã de Maria, Bibiana: dois
  irmãos Borer casaram com duas irmãs Heggendorn, repetindo o padrão de pares de irmãos
  Borer-Wehrli uma geração acima.

  ## O que podemos extrapolar

  - **O primogênito pré-marital é um sinal real [INFERRED]:** José Domingos nasceu em 19
  de março de 1864 e o casamento seguiu em 11 de abril de 1864 — o casamento regularizou
  uma união existente, espelhando exatamente o casamento de 1820 dos seus próprios pais.
  Um padrão recorrente de união-e-depois-formalização atravessa esta família imigrante.

  - **A alegação de "primo em primeiro grau de Francisco José Borer" está REFUTADA:** os
  registos de casamento NF dos dois imigrantes (1820 e 1825) nomeiam pais diferentes de
  aldeias diferentes — Laurent = filho de Jacob Borer de Grindel, o outro Jacob = filho de
  João Borer de Erschwil. Laurent e Jacob NÃO eram irmãos; Vicente e Francisco José NÃO
  são primos em primeiro grau (primos eventualmente, não documentado). [PROVEN via
  bohrer.md BATCH 1 + BATCH 2]

  - **Perto do fundo do arco — um piso de subsistência entrincheirado pela fragmentação
  partível [CONTEXTUAL / INFERRED]:** A profissão registada de Vicente é "desconhecida",
  e o seu ramo vivia na pobre terra rural de Nova Friburgo rumo ao vale do Macaé. Como um
  dos ~12 filhos de Laurent, o seu quinhão de um lote de serra já pobre era um fragmento —
  a sucessão partível brasileira sobre um enorme conjunto de irmãos garante nenhuma
  acumulação. A incessante endogamia da colônia (casamentos de pares de irmãos Borer×Wehrli
  e depois Borer×Heggendorn) é a face social da mesma pobreza: um conjunto restrito de
  famílias transplantadas de Grindel/Solothurn consolidando meios escassos entre si em vez
  de casar para cima. Não havia aqui patrimônio a perder; a história é de sobrevivência em
  terra marginal, duas gerações antes da saída da família para a economia salarial de Volta
  Redonda no século XX.

