profile: >-
  ## Interesting facts

  - **[PROVEN]** He was a widower when his daughter married. The 1829 Nova Friburgo marriage act
  names the bride "filha legitima de **Jacob Frees** e de sua mulher Anna Maria, **já
  falecida**" — his wife dead, himself named without any such qualifier, so apparently still
  living on 20 July 1829. (PAR-0073)

  - **[PROVEN / uncertain]** The same clause records where his daughter was born — "natural e
  baptizada na Freguezia de [Senen? — uncertain], Cantão de [Pottein? — uncertain]" — and both
  readings failed. A Swiss canton is written down for his household and cannot be read. That is
  the exact shape of the gap: not missing information, unreadable information.

  - **[PROVEN]** The Frees surname was present at Nova Friburgo beyond his own household.
  Sixteen years later, the godparents at his granddaughter's baptism were Pedro Freese and
  Regina Freese — his family, or people of it, still in the parish in 1845. (PAR-0072)

  - **[LEAD]** A published colonist compilation identifies a Jacob Freese as the father of
  Valentim and Christian Freese, both of whom married into the Borer line. If that is this man,
  he would be a hub connecting several Freese marriages to the same family — plausible in a
  colony this small, and entirely unproven.

  ## Identity

  **Jacob Frees** — father of the bride in the 1829 Nova Friburgo marriage of Anna Maria Frees
  (P-0102) to José Eggendorn. Iris Bohrer Muniz's (P-0007) 3×-great-grandfather, by the chain
  Anna Maria Frees → Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer (P-0028)
  → João Gonçalves Bohrer (P-0014). [PROVEN that he is named; degree derived from the family
  links]

  - **Named in one record:** PAR-0073, 20 July 1829, as the father of the bride and husband of
  the late Anna Maria; family F-0059. He is modelled as the head of a parent couple, with no
  record of his own beyond this mention. [PROVEN]

  - **Apparently living:** 20 July 1829, on the omission of a death qualifier that his wife does
  receive. Clearly deceased now. [INFERRED from PAR-0073]

  - **Origin and nationality:** his own origin is not stated. The act gives a Swiss parish and
  canton for his daughter, but both readings failed, so nationality is left unset. [OPEN by
  decision]

  - **Birth, marriage, death:** none documented. [OPEN]

  ## Standing and profession

  Nothing. He is named as a father and as a husband, and the act attaches no occupation,
  colonist status, property or signature to him. Unlike Joseph Stoffel in the 1847 Lutheran
  register, he is not even called a colonist — the word simply is not there.

  ## Family and social network

  The 1829 act is the whole of it: Jacob Frees, widower, father of Anna Maria Frees, who married
  José Eggendorn at the Matriz de São João Baptista before the Vigário Jacob Joye, with José
  Maria Dubra and Anna Maria Geggendorn as witnesses. [PROVEN — PAR-0073]

  The Frees surname recurs around his descendants. Pedro and Regina Freese stood as godparents
  to his granddaughter Maria Thecla Regina in 1845, which shows a Frees kin group present in the
  parish a generation later. [PROVEN — PAR-0072] Whether they were his children is not stated.

  ## What we can extrapolate

  - **[CONTEXTUAL]** A Swiss canton was written for his daughter's birthplace, which places the
  household in the 1819–20 emigration that Dom João VI's decree of 16 May 1818 set in motion — a
  scheme nominally for 100 Fribourg families that carried some 261–265 families from Fribourg,
  Solothurn, Valais and Bern. The push was the 1816–17 harvest failures after the Tambora
  eruption, post-Napoleonic poverty, and land too fragmented for the next generation.

  - **[INFERRED]** His wife's death before July 1829 is consistent with what that migration cost
  — roughly a quarter of the emigrants died at sea of typhus and scurvy, and the colony's first
  years were hard — but the record fixes only that she was dead, not when or where. The
  inference should not harden into a story.

  - **[CONTEXTUAL]** The marriage he gave his daughter to is a textbook colony match: Frees to
  Eggendorn, two Swiss households of the transplanted pool, at level. That repeated pattern
  across the Borer, Wehrli, Frees and Eggendorn families is what a community with no land worth
  consolidating does instead — it consolidates people.

  ## Open questions

  - His parish and canton of origin. Both are recorded in the 1829 act, for his daughter, and
  both readings failed; a maximum-zoom re-read of the register image is the cheapest possible
  next step. [OPEN]

  - His own birth, marriage and death — nothing held. [OPEN]

  - Whether he is the Jacob Freese of the Lorenz/Bon colonist compilation, said to have fathered
  Valentim and Christian Freese. [LEAD]

  - Whether Pedro and Regina Freese, godparents in 1845, were his children. [OPEN]

  - His nationality, left unset on purpose because the record's statement of origin cannot be
  read. [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0073** — his daughter Anna Maria's 1829 Nova Friburgo marriage to José Eggendorn; the
  sole held record naming him, as the father of the bride and widower of Anna Maria.

  ## Regional and migration context

  The colony his family reached was an instrument of state policy: Dom João VI contracted the
  Fribourg agent Sébastien-Nicolas Gachet on 16 May 1818 to settle Swiss Catholic families on
  the Fazenda do Morro Queimado, in mountains picked for their resemblance to Switzerland.
  [CONTEXTUAL] The emigrants left Estavayer-le-Lac on 4 July 1819, travelled by Basel and
  Rotterdam to the North Sea ports, and sailed for Rio; roughly a quarter died on the way. The
  settlement became Vila de Nova Friburgo on 3 January 1820, and the lots handed out were stony
  and small. [CONTEXTUAL] Of all that, what a held record says about Jacob Frees is only this:
  his daughter was born and baptised in a Swiss canton, and by 1829 she was living in the parish
  of São João Baptista and married there. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where his
  daughter married in July 1829 and where his granddaughter was baptised in 1845 with Freese
  godparents. The present cathedral dates from 1869; both acts belong to the earlier church on
  the same site. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colonist lots lay. No Frees lot has been identified. [APPROX]

  - **Switzerland — canton and parish unreadable.** The 1829 act names both for his household
  and neither can be read. Until the reading is recovered there is no origin place, and
  inferring one from the surname Frees would be precisely the error this archive refuses.
  [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Era viúvo quando a filha se casou. O assento de casamento de 1829, em Nova
  Friburgo, nomeia a noiva "filha legitima de **Jacob Frees** e de sua mulher Anna Maria, **já
  falecida**" — a esposa morta, ele próprio nomeado sem qualquer qualificador desse tipo,
  portanto aparentemente ainda vivo em 20 de julho de 1829. (PAR-0073)

  - **[PROVEN / incerto]** A mesma cláusula registra onde nasceu a filha — "natural e baptizada
  na Freguezia de [Senen? — incerto], Cantão de [Pottein? — incerto]" — e ambas as leituras
  falharam. Um cantão suíço está escrito para o seu domicílio e não pode ser lido. É exatamente
  esse o formato da lacuna: não é informação ausente, é informação ilegível.

  - **[PROVEN]** O sobrenome Frees estava presente em Nova Friburgo além de seu próprio
  domicílio. Dezesseis anos depois, os padrinhos do batismo de sua neta foram Pedro Freese e
  Regina Freese — sua família, ou gente dela, ainda na freguesia em 1845. (PAR-0072)

  - **[LEAD]** Uma compilação publicada de colonos identifica um Jacob Freese como pai de
  Valentim e Christian Freese, ambos casados na linha Borer. Se for este homem, seria um nó
  conectando vários casamentos Freese à mesma família — plausível numa colônia tão pequena e
  inteiramente não comprovado.

  ## Identidade

  **Jacob Frees** — pai da noiva no casamento de 1829, em Nova Friburgo, de Anna Maria Frees
  (P-0102) com José Eggendorn. Tetravô de Iris Bohrer Muniz (P-0007), pela cadeia Anna Maria
  Frees → Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer (P-0028) → João
  Gonçalves Bohrer (P-0014). [PROVEN que é nomeado; grau derivado dos vínculos familiares]

  - **Nomeado em um registro:** PAR-0073, 20 de julho de 1829, como pai da noiva e marido da
  falecida Anna Maria; família F-0059. É modelado como chefe de um casal de pais, sem registro
  próprio além desta menção. [PROVEN]

  - **Aparentemente vivo:** em 20 de julho de 1829, pela omissão do qualificador de falecimento
  que a esposa recebe. Claramente falecido hoje. [INFERRED a partir de PAR-0073]

  - **Origem e nacionalidade:** sua própria origem não é declarada. O ato dá uma freguesia e um
  cantão suíços para a filha, mas ambas as leituras falharam, de modo que a nacionalidade fica
  em aberto. [OPEN por decisão]

  - **Nascimento, casamento e óbito:** nada documentado. [OPEN]

  ## Posição social e profissão

  Nada. Ele é nomeado como pai e como marido, e o ato não lhe atribui ocupação, estatuto de
  colono, propriedade ou assinatura. Ao contrário de Joseph Stoffel no livro luterano de 1847,
  ele nem sequer é chamado de colono — a palavra simplesmente não está lá.

  ## Família e rede social

  O assento de 1829 é tudo: Jacob Frees, viúvo, pai de Anna Maria Frees, que se casou com José
  Eggendorn na Matriz de São João Baptista perante o Vigário Jacob Joye, tendo José Maria Dubra
  e Anna Maria Geggendorn como testemunhas. [PROVEN — PAR-0073]

  O sobrenome Frees recorre em torno de seus descendentes. Pedro e Regina Freese foram padrinhos
  de sua neta Maria Thecla Regina em 1845, o que mostra um grupo de parentes Frees presente na
  freguesia uma geração depois. [PROVEN — PAR-0072] Se eram filhos dele, não se declara.

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Um cantão suíço foi escrito como local de nascimento da filha, o que situa
  o domicílio na emigração de 1819–20 posta em marcha pelo decreto de Dom João VI de 16 de maio
  de 1818 — programa nominalmente para 100 famílias friburguesas que levou cerca de 261–265
  famílias de Friburgo, Solothurn, Valais e Berna. O empurrão foram as quebras de safra de
  1816–17 após a erupção do Tambora, a pobreza pós-napoleônica e a terra fragmentada demais para
  a geração seguinte.

  - **[INFERRED]** A morte da esposa antes de julho de 1829 é compatível com o custo dessa
  migração — cerca de um quarto dos emigrantes morreu no mar, de tifo e escorbuto, e os
  primeiros anos da colônia foram duros —, mas o registro fixa apenas que ela estava morta, não
  quando nem onde. A inferência não deve endurecer em narrativa.

  - **[CONTEXTUAL]** O casamento a que entregou a filha é uma união colonial de manual: Frees
  com Eggendorn, dois domicílios suíços do conjunto transplantado, no mesmo nível. Esse padrão
  repetido entre as famílias Borer, Wehrli, Frees e Eggendorn é o que faz uma comunidade sem
  terra que valha consolidar — consolida pessoas.

  ## Questões em aberto

  - Sua freguesia e cantão de origem. Ambos estão registrados no ato de 1829, para a filha, e
  ambas as leituras falharam; uma releitura em zoom máximo da imagem do registro é o próximo
  passo mais barato possível. [OPEN]

  - Seu próprio nascimento, casamento e óbito — nada disponível. [OPEN]

  - Se ele é o Jacob Freese da compilação de colonos Lorenz/Bon, tido como pai de Valentim e
  Christian Freese. [LEAD]

  - Se Pedro e Regina Freese, padrinhos em 1845, eram filhos dele. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque a declaração de origem do registro
  não pode ser lida. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — casamento de 1829, em Nova Friburgo, da filha Anna Maria com José Eggendorn;
  o único documento retido que o nomeia, como pai da noiva e viúvo de Anna Maria.

  ## Contexto regional e migratório

  A colônia a que sua família chegou era instrumento de política de Estado: Dom João VI
  contratou o agente friburguês Sébastien-Nicolas Gachet em 16 de maio de 1818 para assentar
  famílias católicas suíças na Fazenda do Morro Queimado, em montanhas escolhidas por lembrarem
  a Suíça. [CONTEXTUAL] Os emigrantes partiram de Estavayer-le-Lac em 4 de julho de 1819,
  seguiram por Basileia e Roterdã até os portos do Mar do Norte e navegaram para o Rio; cerca de
  um quarto morreu no caminho. O povoado tornou-se Vila de Nova Friburgo em 3 de janeiro de
  1820, e os lotes distribuídos eram pedregosos e pequenos. [CONTEXTUAL] De tudo isso, o que um
  documento retido diz sobre Jacob Frees é apenas: sua filha nasceu e foi batizada num cantão
  suíço e, em 1829, morava na freguesia de São João Baptista e ali se casou. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em julho de 1829 e onde a neta foi batizada em 1845 com padrinhos Freese. A
  catedral atual é de 1869; os dois atos pertencem à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde ficavam os lotes de colono. Nenhum lote Frees foi
  identificado. [APPROX]

  - **Suíça — cantão e freguesia ilegíveis.** O ato de 1829 nomeia os dois para o seu domicílio
  e nenhum pode ser lido. Enquanto a leitura não for recuperada, não há lugar de origem — e
  inferir um a partir do sobrenome Frees seria precisamente o erro que este arquivo recusa.
  [UNLOCATED]
