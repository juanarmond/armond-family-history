profile: >-
  ## Identity

  **Jacob Frees** — known only as the father of the bride in his daughter's 1829 Nova Friburgo
  marriage act. Named as the husband of the (already deceased) Anna Maria, father of "Anna Maria
  Frees, filha legitima de Jacob Frees"; he is not described as deceased in that record (PAR-0073,
  family F-0059). [STRONG-EVIDENCE] His daughter's stated origin parish and canton are uncertain
  reads in the register; his own origin is not stated, so nationality is left unset. Clearly
  deceased (father of a woman marrying in 1829).

  ## Open questions

  - His own origin, birth, marriage, and death records (no held primary — only his daughter's
  1829 marriage act names him). [OPEN]

  - Whether he is the same Jacob Freese named in the Lorenz/Bon colonist compilation as father of
  Valentim and Christian Freese (both of whom married into the Borer line) — plausible within the
  Nova Friburgo colony context, but unproven by any held record. [LEAD/OPEN]

  ## Sources held (this repository)

  - PAR-0073 (his daughter's 1829 Nova Friburgo marriage — the sole held record naming him, as
  the father of the bride).
profile_pt: >-
  ## Identidade

  **Jacob Frees** — conhecido apenas como pai da noiva no assento de casamento de 1829 de Nova
  Friburgo. Nomeado como marido da (já falecida) Anna Maria, pai de "Anna Maria Frees, filha
  legitima de Jacob Frees"; não é descrito como falecido nesse registo (PAR-0073, família F-0059).
  [STRONG-EVIDENCE] A freguesia e o cantão de origem declarados da filha apresentam leitura incerta
  no registo; a própria origem de Jacob não é declarada, pelo que a nacionalidade não é atribuída.
  Claramente falecido (pai de uma mulher que se casou em 1829).

  ## Questões em aberto

  - Seus registros de origem, nascimento, casamento e óbito (nenhuma fonte primária retida —
  apenas o assento de casamento da filha de 1829 o nomeia). [OPEN]

  - Se é o mesmo Jacob Freese nomeado na compilação Lorenz/Bon como pai de Valentim e Christian
  Freese (ambos casados na linhagem Borer) — plausível no contexto colonial de Nova Friburgo, mas
  não comprovado por nenhum documento retido. [LEAD/OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0073 (casamento de 1829 da sua filha em Nova Friburgo — o único documento retido que
  o nomeia, como pai da noiva).
