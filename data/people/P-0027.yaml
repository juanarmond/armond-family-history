notes:
- text: >-
    Barbacena locus (1 August 2026): her daughter Carolina's 1821 baptism (PAR-0017,
    Capela dos Remédios, Piedade da Borda do Campo) places her and her husband
    Ladisláo at Barbacena in 1821 — the family's origin before the move to the
    Leopoldina / Fazenda da Concórdia region.
  text_pt: >-
    Localização em Barbacena (1 de agosto de 2026): o batismo de 1821 de sua filha
    Carolina (PAR-0017, Capela dos Remédios, Piedade da Borda do Campo) situa ela e
    seu marido Ladisláo em Barbacena em 1821 — a origem da família antes da mudança
    para a região de Leopoldina / Fazenda da Concórdia.
- text: >-
    Her parents are now CONFIRMED (5 August 2026) by the 1810 São João del Rei
    marriage record (PAR-0023, event E-0052): she is the daughter of Alferes Amaro
    da Silva Xavier (P-0059) and Ignez Francisca de Lima (P-0060), family F-0029.
    Both parents are described as "naturais e batizados da Freguesia de Barbacena"
    — born and baptised in Barbacena, consistent with Ladisláo's own Barbacena
    origin. This resolves the "single open item" flagged after the bounded-negative
    Barbacena Piedade marriage-book sweep (1793–1822): the couple married at São João
    del Rei, not Barbacena, explaining the prior negative result. Her own baptism
    was at Barbacena, 22 March 1795 (Bertioga section), per the secondary Themudo
    citation — the baptism image has not yet been retrieved. Her parents' own
    vital records have not been located.
  text_pt: >-
    Seus pais estão agora CONFIRMADOS (5 de agosto de 2026) pelo registro de casamento
    de 1810 em São João del Rei (PAR-0023, evento E-0052): ela é filha do Alferes Amaro
    da Silva Xavier (P-0059) e de Ignez Francisca de Lima (P-0060), família F-0029.
    Ambos os pais são descritos como "naturais e batizados da Freguesia de Barbacena" —
    nascidos e batizados em Barbacena, coerente com a própria origem barbacenense de
    Ladisláo. Isso resolve o "único item em aberto" sinalizado após a varredura de
    resultado negativo delimitado nos livros de casamento de Barbacena Piedade
    (1793–1822): o casal casou-se em São João del Rei, não em Barbacena, o que explica
    o resultado negativo anterior. Seu próprio batismo ocorreu em Barbacena, em 22 de
    março de 1795 (seção de Bertioga), conforme a citação secundária de Themudo — a
    imagem do batismo ainda não foi obtida. Os registros vitais de seus próprios pais
    não foram localizados.
- text: >-
    Death date: 12 March 1879. Confirmed from the opening juramento of her own 1879
    Leopoldina estate inventory (PRB-0006, folio 6 — already catalogued as PRB-0006):
    the inventariante Cezário José de Toledo swore on 28 April 1879 that she "faleceu
    em o dia doze de Março proximo passado." Death event E-0059 created. Her estate
    was opened six weeks after her death. Grandmother (avó) of the Toledo grandchildren
    who inherited the Fazenda da Concórdia estate, per the 1877 deed (PRB-0003), the
    1881 partilha (PRB-0001), and the 1884 petition (PRB-0002). Eliza Balbina de Toledo
    (P-0017) is one of those grandchildren. Confirmed alive March 1867: PRB-0009-p5
    records her signing the Termo de Louvaçao in person at the Concórdia proceedings.
    ALSO: the retrieval agent's transcript of the Matilde 1879 inventário (pp.154–155,
    2026-08-08) contains a certidão: Capitão Manoel Rodrigues de Lima (São José d'El Rei)
    donated the enslaved woman Martinha to "minha sobrinha Mathilde Maria de Jesus" —
    Mathilde is therefore the Capitão's niece. The Capitão bought Martinha from "minha
    [irmã?] Dona Francisca de Lima" — if "irmã" (sister) is the correct read, Francisca
    de Lima is the Capitão's sister AND Mathilde's mother, corroborating that Mathilde's
    mother was Ignez Francisca de Lima (P-0060). The "[maã?/irmã?]" word is uncertain
    in the transcript and requires image verification.
  text_pt: >-
    Data de óbito: 12 de março de 1879. Confirmada pelo juramento de abertura de seu
    próprio inventário de 1879 em Leopoldina (PRB-0006, fólio 6 — já catalogado como
    PRB-0006): o inventariante Cezário José de Toledo jurou em 28 de abril de 1879 que
    ela "faleceu em o dia doze de Março proximo passado." Evento de óbito E-0059 criado.
    Seu inventário foi aberto seis semanas após sua morte. Avó dos netos Toledo que
    herdaram a Fazenda da Concórdia, conforme a escritura de 1877 (PRB-0003), a partilha
    de 1881 (PRB-0001) e a petição de 1884 (PRB-0002). Eliza Balbina de Toledo (P-0017)
    é uma desses netos. Confirmada viva em março de 1867: PRB-0009-p5 registra que ela
    assinou o Termo de Louvaçao pessoalmente nos autos da Concórdia. ALÉM DISSO: a
    transcrição do agente de recuperação do inventário de Matilde de 1879 (pp.154–155,
    2026-08-08) contém uma certidão: o Capitão Manoel Rodrigues de Lima (São José
    d'El Rei) doou a mulher escravizada Martinha à "minha sobrinha Mathilde Maria de
    Jesus" — Mathilde é, portanto, sobrinha do Capitão. O Capitão comprou Martinha de
    "minha [irmã?] Dona Francisca de Lima" — se "irmã" for a leitura correta, Francisca
    de Lima é irmã do Capitão E mãe de Mathilde, corroborando que a mãe de Mathilde era
    Ignez Francisca de Lima (P-0060). A palavra "[maã?/irmã?]" é incerta na transcrição
    e requer verificação na imagem.
- text: >-
    Intervening generation NAMED (1 August 2026) by her own 1879 Leopoldina estate
    inventory (PRB-0006): Eliza's parent is Mathilde's son José Cezário de Toledo
    Lima (P-0054, heir #4, ⚭ D. Claudina), so Mathilde is now linked to Eliza (P-0017)
    through the structured edge F-0027 (Mathilde ⚭ Ladisláo Egydio Ferreira de Toledo,
    P-0056) → F-0026 (José Cezário ⚭ Claudina). This supersedes the earlier
    prose-only grandmother link and resolves her deliberate orphan status. Her husband
    (Eliza's great-grandfather) is Ladisláo Egydio Ferreira de Toledo (P-0056).
  text_pt: >-
    Geração intermediária NOMEADA (1 de agosto de 2026) por seu próprio inventário de
    1879 em Leopoldina (PRB-0006): o genitor de Eliza é o filho de Mathilde, José
    Cezário de Toledo Lima (P-0054, herdeiro nº 4, ⚭ D. Claudina), de modo que Mathilde
    está agora ligada a Eliza (P-0017) pela aresta estruturada F-0027 (Mathilde ⚭
    Ladisláo Egydio Ferreira de Toledo, P-0056) → F-0026 (José Cezário ⚭ Claudina).
    Isso supera o anterior vínculo de avó apenas em prosa e resolve seu status
    deliberado de órfã. Seu marido (bisavô de Eliza) é Ladisláo Egydio Ferreira de
    Toledo (P-0056).
- text: >-
    30 July 2026 (Full-Text via research/from-retrieval/, ARK 3:1:3QHJ-1QWB-7BYX,
    catalogued as PRB-0004): a second Concórdia / Ribeirão de São Bento Toledo
    deed names Mathilde's husband, Ladisláo Egydio Ferreira de Toledo, and a
    parent couple below them, Antonio Zeferino de Toledo and Dona Maria Perpétua
    ("seus finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de
    Toledo e seus paes e sogros Antonio Zeferino de Toledo e Dona Maria Perpétua").
    Antonio Zeferino is thus a son of Mathilde × Ladisláo. RESOLVED (1 August 2026)
    by the full inventory (PRB-0006): Antonio Zeferino de Toledo × Maria Perpétua are
    heir #3 (Eliza's UNCLE and aunt), NOT Eliza's parents — corroborated on folio 8
    ("de M.a Perpetua nº 3"). Antonio Zeferino is recorded as a documented sibling of
    José Cezário on F-0027. The two same-named "Ladisláo Egydio Ferreira de Toledo"
    are also resolved: the elder is Mathilde's husband (P-0056); the "solteiro de 23
    annos" grantor grandchild is heir #4's son (Eliza's brother, documented on F-0026).
  text_pt: >-
    30 de julho de 2026 (Full-Text via research/from-retrieval/, ARK 3:1:3QHJ-1QWB-7BYX,
    catalogado como PRB-0004): uma segunda escritura Toledo da Concórdia / Ribeirão de
    São Bento nomeia o marido de Mathilde, Ladisláo Egydio Ferreira de Toledo, e, abaixo
    deles, um casal de genitores, Antonio Zeferino de Toledo e Dona Maria Perpétua
    ("seus finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de
    Toledo e seus paes e sogros Antonio Zeferino de Toledo e Dona Maria Perpétua").
    Antonio Zeferino é, assim, um filho de Mathilde × Ladisláo. RESOLVIDO (1 de agosto
    de 2026) pelo inventário completo (PRB-0006): Antonio Zeferino de Toledo × Maria
    Perpétua são o herdeiro nº 3 (TIO e tia de Eliza), NÃO os pais de Eliza — corroborado
    no fólio 8 ("de M.a Perpetua nº 3"). Antonio Zeferino é registrado como irmão
    documentado de José Cezário em F-0027. Os dois "Ladisláo Egydio Ferreira de Toledo"
    de mesmo nome também são esclarecidos: o mais velho é o marido de Mathilde (P-0056);
    o neto outorgante "solteiro de 23 annos" é filho do herdeiro nº 4 (irmão de Eliza,
    documentado em F-0026).
- text: >-
    Namesake caution (do NOT conflate): a different "Mathilde Maria de Jesus" —
    widow of Generoso Fernandes de Moura, with children surnamed de Moura — appears
    in a Republic-era Moura inventory (ARK 3:1:3QHK-QQ2X-VS4Y) in the same retrieval
    drop. She is unrelated to this P-0027 (wife of Ladisláo Egydio de Toledo).
  text_pt: >-
    Cuidado com homônima (NÃO confundir): uma "Mathilde Maria de Jesus" diferente —
    viúva de Generoso Fernandes de Moura, com filhos de sobrenome de Moura — aparece em
    um inventário Moura da era republicana (ARK 3:1:3QHK-QQ2X-VS4Y) na mesma remessa de
    recuperação. Ela não tem relação com esta P-0027 (esposa de Ladisláo Egydio de
    Toledo).
