profile: >-
  ## Interesting facts

  - **[PROVEN]** In 1862, as a widow, she bought the Fazenda da Concórdia outright, acting "por si como meeira, e também como inventariante e cabeça do casal, em nome de todos seus filhos" — a woman contracting for a large estate in her own right, which was exceptional legal visibility for a woman of her generation (PRB-0007).

  - **[PROVEN]** Her 1879 estate inventory names her as the owner of an enslaved woman, Martinha, donated to her by her uncle Capitão Manoel Rodrigues de Lima of São José d'El Rei — direct evidence that enslaved labour formed part of her estate's wealth (PRB-0006).

  - **[CONTEXTUAL]** She lived through the entire arc of the Brazilian slave-owning economy: born in 1795 under the colonial system, she bought her fazenda in 1862 using enslaved labour, and died in March 1879 — nine years before abolition would have ended that system for her successors.

  - **[INFERRED]** Her 1879 estate, divided among grandchild-heirs under Brazilian partible inheritance, is the mechanism by which Toledo land wealth became a one-time cash windfall rather than an ongoing asset for the Armond line — the fazenda sold, the proceeds split, and no land base survived into the next generation.

  - **[CONTEXTUAL]** She married at São João del Rei in 1810, not in either spouse's home parish of Barbacena, which explains why a sweep of Barbacena marriage registers found nothing. Marrying in a neutral third city was consistent with 19th-century ecclesiastical practice when both parties came from elsewhere.

  - **[INFERRED]** Her documented lifespan of roughly 84 years (~1795–1879) spans Brazilian independence, two emperors, the coming of the railways to the Zona da Mata and the coffee boom — an unusually long and historically dense life traceable through multiple primary records.

  ## Identity

  **Mathilde Maria de Jesus** (register *Mathilde / Mathildes*; also **Mathilde Luiza de
  Toledo** in her son's 1909 death, a married-surname form, CIV-0024). The landowning
  widow-matriarch of the Fazenda da Concórdia and grandmother of Eliza Balbina
  de Toledo (P-0017). [PROVEN]

  - **Born:** Barbacena, baptized 22 March 1795 [LEAD] — from a secondary (Themudo)
  citation; the baptism image is not yet held. Both her 1810 marriage (PAR-0023) and her
  daughter Carolina's 1821 Barbacena baptism (PAR-0017) confirm her Barbacena origin.

  - **Parents:** Alferes Amaro da Silva Xavier (P-0059) and Ignez Francisca de Lima
  (P-0060), both born and baptized in Barbacena [PROVEN] — named in her 1810 marriage act
  (PAR-0023).

  - **Marriage:** to Ladisláo Egídio Ferreira de Toledo (P-0056), 8 May 1810, at the matriz
  de São João del Rei [PROVEN] (PAR-0023) — they married there, not in either home parish,
  which explains the earlier negative result in the Barbacena marriage books.

  - **Children:** eight, per her husband's 1867 inventário (PRB-0009): Maria Perpétua,
  Ignez Umbelina, Carolina Leopoldina, Francisco Leocádio (P-0061), Aureliano de Sales,
  Cezário José, António Ladislão (P-0063, "surdo e mudo"), and José Cezário de Toledo Lima
  (P-0054) — the ancestor of our line. A further daughter, Carolina (bapt. 1821, PAR-0017),
  is also documented.

  - **Death:** 12 March 1879, at the Fazenda da Concórdia (Leopoldina, MG) [PROVEN] — the
  opening juramento of her own 1879 estate inventory swears she "faleceu em o dia doze de
  Março proximo passado" (PRB-0006). Her estate ran a six-year partition.

  ## Standing and profession

  - **Widowed matriarch and purchaser of the Fazenda da Concórdia** [PROVEN] — by a deed of
  2 August 1862 she bought the fazenda from Felippe Barbosa Castro, acting "por si como
  meeira, e também como inventariante e cabeça do casal, em nome de todos seus filhos"
  (PRB-0007). She headed the conjugal estate as a widow, her husband Ladisláo having died
  before that date.

  - **Slaveholder** [PROVEN] — a certidão in her 1879 inventário records that her uncle
  Capitão Manoel Rodrigues de Lima had donated the enslaved woman Martinha to "minha
  sobrinha Mathilde Maria de Jesus" (PRB-0006); Martinha is among the estate's assets.

  - **Niece of Capitão Manoel Rodrigues de Lima** of São José d'El Rei [PROVEN of the
  kinship] — the same certidão calls her his niece; he had bought Martinha from a "Dona
  Francisca de Lima" who, if the "irmã" reading holds, is his sister and Mathilde's own
  mother Ignez Francisca de Lima (an uncertain read requiring image verification). [LEAD]

  - She and her husband were at Barbacena in 1821 (PAR-0017), before the family's move east
  to the Rio Pardo / Leopoldina region; her son José Cezário registered the Concórdia land
  in 1856 "por minha Mãe" (i.e. on her behalf, she then living, GOV-0003).

  ## Family and social network

  She married into the Ferreira de Toledo family — her husband was a son of Capitão Joaquim
  José Ferreira de Toledo (P-0057) and D. Ritta Angélica Rodrigues (P-0058). Her 1879
  estate is the linchpin document of the Toledo line: it enumerates her grandchildren by
  heir-group and names item 5, "Simplicio José Ferreira Armond, cazado com D. Eliza Balbina
  de Tolledo" — fixing Eliza (P-0017) as her granddaughter through José Cezário (PRB-0006).
  Her grandchildren later sold their inherited Concórdia land, citing "sua finada avó Dona
  Mathilde Maria de Jesus" (PRB-0003, PRB-0004).

  ## What we can extrapolate

  *Mathilde is the high-water mark of the owner's whole tree — the only ancestor documented
  acquiring substantial heritable capital in her own name — and simultaneously the point at
  which that capital begins to dissolve. Her line runs to the repository owner as his
  4×-great-grandmother, through José Cezário de Toledo Lima (P-0054) → Eliza Balbina de
  Toledo (P-0017) → Aristão Ferreira Armond (P-0008) → Geraldo Paz Armond (P-0004).*

  **1. Her standing came by three different routes, and only one of them produced capital
  [PROVEN base / INFERRED reading].** She was born to an **Alferes** (Amaro da Silva Xavier,
  P-0059) and married the son of a **Capitão** (Joaquim José Ferreira de Toledo, P-0057) in
  1810 (PAR-0023) — a lateral match inside the militia-officer stratum of Minas, not a
  climb. **[CONTEXTUAL]** Colonial and imperial militia rank conferred precedence, local
  authority and the right to be addressed by title; it did not generally carry a salary. Her
  natal and marital capital was therefore **status with no wage underneath it** —
  structurally the same weakness that later undid the Armond side of the family. The land
  came from neither inheritance: it came from a purchase she made herself, as a widow, in
  1862 (PRB-0007).

  **2. The registers price her rank as precisely as they price the other end of the tree
  [PROVEN / INFERRED].** She is **Dona Mathilde** in every instrument that names her — the
  1810 marriage, the 1862 deed, the 1867 and 1879 inventories, the grandchildren's 1877
  sale. Her father is *Alferes*, her father-in-law *Capitão*, her uncle *Capitão*.
  **[INFERRED]** Compare the Povoação registers on the owner's maternal side, where over
  roughly ten held acts no Muniz Bytancourt ever receives an honorific and no wife is
  written *Dona*, in books that style a witness *Capitão* freely (P-0042, PAR-0048). The two
  lines that meet in this tree sit at opposite ends of the same notation.

  **3. She was literate, and literacy in this family tracks money exactly [PROVEN /
  INFERRED].** She signed her own name at the Termo de Louvação of her husband's estate in
  March 1867 (PRB-0009). **[CONTEXTUAL]** Female literacy in mid-century interior Minas was
  rare and purchased — the daughters of officers and proprietors got it, nobody else did.
  **[INFERRED]** Set that against Luiza Fernandes de Azevedo, who married into the owner's
  maternal line in 1916 and had to be signed for by proxy "por não saber ler nem escrever"
  (CIV-0006): a propertied woman signing in 1867 and a landless woman unable to sign fifty
  years later is the sharpest single class measurement this repository holds.

  **4. Her wealth was land plus enslaved people — heritable, divisible, and one of the two
  destructible by law [PROVEN / CONTEXTUAL].** A certidão in her 1879 inventário records her
  uncle **Capitão Manoel Rodrigues de Lima** donating the enslaved woman **Martinha** to
  "minha sobrinha Mathilde Maria de Jesus"; Martinha and her daughter **Conquesta** are
  tracked as estate assets (PRB-0006). **[INFERRED]** Labour arriving as a gift inside the
  kin network is how this stratum capitalised itself — the exact opposite of the Muniz
  compadrio, which circulated only godparenthood because it had nothing else to circulate.
  **[CONTEXTUAL]** It is also the most fragile asset class she held: the 1888 abolition
  wrote enslaved property to zero, and her estates were still generating court hearings in
  1889.

  **5. Sized in period money, the purchase was real but middling [PROVEN sum / CONTEXTUAL
  benchmark].** She bought the Fazenda da Concórdia for **six contos de réis** in August
  1862 (PRB-0007). Against the period benchmarks used elsewhere in this repository — roughly
  one conto for a prime enslaved adult, roughly 420$000 a year for a free rural labourer —
  that is about six enslaved persons, or some fourteen years of a free labourer's wage.
  **[INFERRED]** A working coffee-forest fazenda bought by a widow for her children, then;
  not a magnate's estate. The Toledo ceiling is a long way above the Muniz floor, and still
  a long way below a true provincial fortune.

  **6. She was already buying into a fragmented title [PROVEN / INFERRED].** The 1856 Lei de
  Terras entries for the Curato do Rio Pardo show Concórdia held **"em commum"**: her son
  José Cesário declares a 200-alqueire fazenda "por minha Mãe, irmãos, e cunhados", while
  Francisco Leocádio separately declares a couple of alqueires of his own **within the same
  fazenda** (GOV-0003). **[INFERRED]** Undivided co-ownership among mothers, siblings and
  brothers-in-law is what partible inheritance looks like on the ground before anyone goes
  to court: nobody owns a farm, everybody owns a fraction of one. Her 1862 purchase
  consolidated a share into a structure that was already splitting.

  **7. The fragmentation arithmetic is documented, not hypothesised, and it is brutal
  [PROVEN].** Her husband's 1867 título de herdeiros lists **eight children** (PRB-0009). By
  her own 1879 título, several of those eight were dead and represented by their own
  children: heir #3 by six *representantes*, heir #4 by eight, heir #5 by six (PRB-0006).
  **[INFERRED]** One estate therefore resolves into roughly thirty claimants in a single
  step, turning a one-eighth share into something nearer a fiftieth. No fazenda survives
  that, and none did.

  **8. The process of dividing consumed value as fast as the division did [PROVEN /
  INFERRED].** Her husband's 1867 inventory was reopened by *embargos á partilha* in 1881,
  the 1876 partition was declared null in 1882 and ordered redone, and audiências in the
  same autos were still being held in **1889** — twenty-two years of litigation (PRB-0009).
  Her own 1879 estate was still unpartitioned in February 1884 and ran to a final
  adjudication around 1886 (PRB-0002, PRB-0006). **[CONTEXTUAL]** Curators, appraisers,
  escrivães, seals and court fees are all charged to the estate. **[INFERRED]** Partible
  succession in this family did not merely divide the wealth; the machinery of dividing it
  ate a share of its own.

  **9. And the destitution is stated in the family's own words, in court [PROVEN].** On 12
  February 1884, in his own hand, **Simplício José Ferreira Armond** petitioned the orphans'
  judge to force the long-delayed partition — explicitly not for his own benefit, but
  because he had **"parentes colateraes em estado de indigencia"** whose suffering receiving
  their shares would greatly relieve (PRB-0002). **[INFERRED]** Five years after the death
  of a fazenda-owning matriarch, some of her collateral descendants were destitute, and a
  family member said so on a stamped sheet before a judge. It is the plainest evidence in
  this repository that partible inheritance did not merely thin an estate — it dropped
  people out of the class it had supported.

  **10. The family was already converting off the land while the estate was still in court
  [PROVEN / INFERRED].** Her 1879 título records a fifteen-year-old grandson, **Geraldo
  Augusto de Toledo Lima**, "residente na côrte, empregado em uma caza de negocio" in Rio de
  Janeiro (PRB-0006). **[CONTEXTUAL]** Placing a teenage boy in a commercial house was the
  standard apprenticeship route for a propertied family that could no longer settle its sons
  on land. **[INFERRED]** It is structurally the same move Antenor Muniz would make four
  generations later on the other side of the tree, and for the same reason — except that he
  was moving up into a trade and this boy was moving sideways out of a disintegrating
  inheritance.

  **11. Her land was coffee-frontier land, and that dated it [CONTEXTUAL].** Born at
  Barbacena about 1795 and married at São João del Rei in 1810, she began in the depleted
  gold-economy highlands of the Campo das Vertentes; by 1856 the family was at Rio Pardo, in
  the Leopoldina coffee zone (GOV-0003). That eastward move onto the Zona da Mata frontier
  is the standard Minas trajectory of the first half of the century, and it worked — but it
  tied the estate's value to coffee. **[CONTEXTUAL]** The labour disruption of 1888, soil
  exhaustion and the long price decline gutted that regional base in the decades immediately
  after her grandchildren sold out.

  **12. One material conflict must not be smoothed over [OPEN].** The 25 May 1877 Concórdia
  sale deed describes the grandchildren as selling land inherited from **"sua finada avó
  Dona Mathildes Maria de Jezus"** (PRB-0003) — that is, it calls her already deceased —
  while her own inventory places her death on 12 March 1879 (PRB-0006) and Simplício's 1884
  petition recalls her dying "a cerca de 4 annos" (PRB-0002). The two cannot both be right
  as read. Candidate explanations are a misread year on the 1877 traslado (the cataloguer's
  marginal note itself reads "18[7]7" with the third digit uncertain) or a misidentified
  grandmother, but the heir-set in the 1877 deed matches her own 1879 representantes
  exactly. **[OPEN]** The conflict is recorded here rather than resolved; it needs the deed
  image re-read against the inventory.

  **Synthesis — the peak and the mechanism.** Mathilde acquired what nobody else in this
  tree acquired: a working fazenda, in her own name, as a widow, against the grain of what
  women of her generation were normally able to do. Everything after that is the machinery
  of dispersal — an already-common title, eight children, thirty-odd grandchild-claimants,
  twenty-two years of litigation on one estate and seven on the other, enslaved assets that
  abolition would void, a coffee economy about to turn, and the land itself sold off to a
  neighbouring Capitão. **[INFERRED]** What reached her granddaughter Eliza, and through
  Eliza the Armond conjugal line, was therefore a **one-time cash quota rather than a
  base**: real money once, no ground underneath it afterwards. That is precisely why Eliza's
  grandson Geraldo Paz Armond was a *padeiro* in Volta Redonda. And it is why the owner's
  two grandfathers — Geraldo the baker, descending from this fazenda, and Antenor Muniz the
  plumber, ascending from an Azorean smallholding (P-0006) — ended as tradesmen in the same
  steel city, having travelled there from opposite ends of the social scale.

  ## Open questions

  - Her own 1795 Barbacena baptism image — would primary-confirm the date and her parents.
  [OPEN]

  - The "irmã" reading of the Martinha certidão (Francisca de Lima as her mother and the
  Capitão's sister) — needs image verification. [OPEN]

  - The "Luiza" element in the 1909 death-record variant (CIV-0024) — clerical, or a
  genuine middle name. [OPEN]

  ## Sources held (this repository)

  - PAR-0023 (1810 São João del Rei marriage — her parents) · PAR-0017 (daughter Carolina's
  1821 Barbacena baptism) · PRB-0007 (1862 Concórdia purchase deed — she as widow / cabeça
  do casal).

  - PRB-0009 (her husband's 1867 inventário — her eight children) · PRB-0006 (her own 1879
  inventário — death date, the Eliza heir line, the Martinha certidão) · PRB-0003 /
  PRB-0004 (1870s–80s deeds citing her as the grandchildren's avó).

  - CIV-0024 (son António Ladislão's 1909 death — the "Mathilde Luiza de Toledo" variant) ·
  GOV-0003 (1856 Rio Pardo land registry — Concórdia held "por minha Mãe").

  - Namesake caution: a different "Mathilde Maria de Jesus", widow of Generoso Fernandes de
  Moura, appears in an unrelated Republic-era Moura inventory — not this person.

  ## Regional and migration context

  Her life traces the standard eastward march of a Minas Gerais propertied family in the
  first half of the nineteenth century. She was born and baptised in the **Freguesia de
  Barbacena** about 1795 [LEAD on the date; PROVEN on the parish, PAR-0023], married at the
  **Matriz de Nossa Senhora do Pilar, São João del Rei**, on 8 May 1810 (PAR-0023), baptised
  a son there in 1813 (PAR-0050) and a daughter back at the Capela dos Remédios in Barbacena
  in 1821 (PAR-0017). [CONTEXTUAL] That is the old **Campo das Vertentes** — the highland
  gold-economy core, by then long past its peak, with its capital seeking new employment.

  By 1856 the family is on the coffee frontier: her son declares the Fazenda da Concórdia in
  the **Curato do Rio Pardo, Município de Villa Leopoldina** "por minha Mãe, irmãos, e
  cunhados" (GOV-0003), and in 1862 she buys the fazenda outright (PRB-0007). [CONTEXTUAL]
  The move from the depleted mining highlands east into the **Zona da Mata Mineira** was the
  dominant Minas family migration of the period, driven by fertile virgin forest, the
  expanding coffee economy and, from mid-century, the railway. She died at the Concórdia on
  12 March 1879 (PRB-0006) — the family's move east was hers, and it was the last one it
  made with land under it.

  ## Where to go today

  - **Baptism (1795):** Catedral Basílica Nossa Senhora da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Marriage (1810):** Catedral Basílica Nossa Senhora do Pilar, São João del-Rei, MG (colonial
  matriz; coords -21.135278, -44.261944) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.135278,-44.261944)

  - **Where she lived and died (1879):** Fazenda da Concórdia (Rio Pardo/Thebes), Leopoldina/Argirita,
  MG (rural; municipality anchor) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Leopoldina%2C%20Minas%20Gerais)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Em 1862, como viúva, ela comprou a Fazenda da Concórdia integralmente, agindo "por si como meeira, e também como inventariante e cabeça do casal, em nome de todos seus filhos" — uma mulher contratando por um grande espólio em nome próprio, visibilidade jurídica excepcional para uma mulher de sua geração (PRB-0007).

  - **[PROVEN]** Seu inventário de 1879 a nomeia como proprietária da mulher escravizada Martinha, doada a ela por seu tio Capitão Manoel Rodrigues de Lima, de São José d'El Rei — evidência direta de que o trabalho escravizado integrava a riqueza do seu espólio (PRB-0006).

  - **[CONTEXTUAL]** Ela viveu todo o arco da economia escravista brasileira: nascida em 1795 sob o sistema colonial, comprou sua fazenda em 1862 valendo-se do trabalho escravizado, e faleceu em março de 1879 — nove anos antes de a abolição encerrar esse sistema para seus sucessores.

  - **[INFERRED]** Seu espólio de 1879, dividido entre os netos-herdeiros pela herança partível brasileira, é o mecanismo pelo qual a riqueza fundiária dos Toledo se converteu em ganho único em dinheiro — a fazenda vendida, os recursos divididos, e nenhuma base fundiária sobreviveu para a geração seguinte.

  - **[CONTEXTUAL]** Ela se casou em São João del Rei em 1810, e não na freguesia de origem de nenhum dos cônjuges, Barbacena — o que explica por que uma varredura dos registros de casamento de Barbacena não encontrou nada. Casar numa terceira cidade neutra era coerente com a prática eclesiástica oitocentista quando ambos os cônjuges vinham de fora.

  - **[INFERRED]** Sua expectativa de vida documentada de aproximadamente 84 anos (~1795–1879) abrange a independência do Brasil, dois imperadores, a chegada das ferrovias à Zona da Mata e o boom do café — uma vida invulgarmente longa e historicamente densa, rastreável por múltiplos registros primários.

  ## Identidade

  **Mathilde Maria de Jesus** (no registro *Mathilde / Mathildes*; também **Mathilde Luiza
  de Toledo** no óbito de 1909 de seu filho, uma forma de sobrenome de casada, CIV-0024). A
  matriarca viúva e proprietária da Fazenda da Concórdia e avó de Eliza Balbina de
  Toledo (P-0017). [PROVEN]

  - **Nascimento:** Barbacena, batizada em 22 de março de 1795 [LEAD] — de uma citação
  secundária (Themudo); a imagem do batismo ainda não foi obtida. Tanto seu casamento de
  1810 (PAR-0023) quanto o batismo de 1821 de sua filha Carolina em Barbacena (PAR-0017)
  confirmam sua origem barbacenense.

  - **Pais:** Alferes Amaro da Silva Xavier (P-0059) e Ignez Francisca de Lima (P-0060),
  ambos nascidos e batizados em Barbacena [PROVEN] — nomeados em seu assento de casamento
  de 1810 (PAR-0023).

  - **Casamento:** com Ladisláo Egídio Ferreira de Toledo (P-0056), 8 de maio de 1810, na
  matriz de São João del Rei [PROVEN] (PAR-0023) — casaram-se ali, não na freguesia de
  origem de nenhum dos dois, o que explica o resultado negativo anterior nos livros de
  casamentos de Barbacena.

  - **Filhos:** oito, conforme o inventário de 1867 de seu marido (PRB-0009): Maria
  Perpétua, Ignez Umbelina, Carolina Leopoldina, Francisco Leocádio (P-0061), Aureliano de
  Sales, Cezário José, António Ladislão (P-0063, "surdo e mudo") e José Cezário de Toledo
  Lima (P-0054) — o ancestral de nossa linha. Uma outra filha, Carolina (bat. 1821,
  PAR-0017), também está documentada.

  - **Óbito:** 12 de março de 1879, na Fazenda da Concórdia (Leopoldina, MG) [PROVEN] — o
  juramento de abertura de seu próprio inventário de 1879 jura que ela "faleceu em o dia
  doze de Março proximo passado" (PRB-0006). Seu espólio correu uma partilha de seis anos.

  ## Posição social e profissão

  - **Matriarca viúva e compradora da Fazenda da Concórdia** [PROVEN] — por escritura de 2
  de agosto de 1862 comprou a fazenda de Felippe Barbosa Castro, agindo "por si como
  meeira, e também como inventariante e cabeça do casal, em nome de todos seus filhos"
  (PRB-0007). Chefiou o casal como viúva, tendo o marido Ladisláo falecido antes dessa
  data.

  - **Senhora de escravos** [PROVEN] — uma certidão em seu inventário de 1879 registra que
  seu tio Capitão Manoel Rodrigues de Lima havia doado a mulher escravizada Martinha à
  "minha sobrinha Mathilde Maria de Jesus" (PRB-0006); Martinha figura entre os bens do
  espólio.

  - **Sobrinha do Capitão Manoel Rodrigues de Lima** de São José d'El Rei [PROVEN quanto ao
  parentesco] — a mesma certidão a chama de sua sobrinha; ele havia comprado Martinha de
  uma "Dona Francisca de Lima" que, se a leitura "irmã" se confirmar, é sua irmã e a
  própria mãe de Mathilde, Ignez Francisca de Lima (leitura incerta, que requer verificação
  na imagem). [LEAD]

  - Ela e o marido estavam em Barbacena em 1821 (PAR-0017), antes da mudança da família
  para leste, à região do Rio Pardo / Leopoldina; seu filho José Cezário registrou a terra
  da Concórdia em 1856 "por minha Mãe" (isto é, em seu nome, ela então viva, GOV-0003).

  ## Família e rede social

  Casou-se com a família Ferreira de Toledo — o marido era filho do Capitão Joaquim José
  Ferreira de Toledo (P-0057) e de D. Ritta Angélica Rodrigues (P-0058). Seu inventário de
  1879 é o documento-chave da linhagem Toledo: enumera seus netos por grupo de herdeiros e
  nomeia o item 5, "Simplicio José Ferreira Armond, cazado com D. Eliza Balbina de Tolledo"
  — fixando Eliza (P-0017) como sua neta por José Cezário (PRB-0006). Seus netos venderam
  depois as terras herdadas da Concórdia, citando "sua finada avó Dona Mathilde Maria de
  Jesus" (PRB-0003, PRB-0004).

  ## O que podemos extrapolar

  *Mathilde é o ponto mais alto de toda a árvore do proprietário do repositório — a única
  ancestral documentada adquirindo capital herdável substancial em seu próprio nome — e, ao
  mesmo tempo, o ponto em que esse capital começa a dissolver-se. Sua linha chega ao
  proprietário do repositório como sua tetravó, por José Cezário de Toledo Lima (P-0054) →
  Eliza Balbina de Toledo (P-0017) → Aristão Ferreira Armond (P-0008) → Geraldo Paz Armond
  (P-0004).*

  **1. Sua posição veio por três vias diferentes, e apenas uma delas produziu capital
  [PROVEN na base / INFERRED na leitura].** Nasceu filha de um **Alferes** (Amaro da Silva
  Xavier, P-0059) e casou-se em 1810 com o filho de um **Capitão** (Joaquim José Ferreira de
  Toledo, P-0057) (PAR-0023) — um enlace lateral dentro do estrato de oficiais milicianos de
  Minas, não uma escalada. **[CONTEXTUAL]** A patente miliciana colonial e imperial conferia
  precedência, autoridade local e o direito ao tratamento por título; em geral não trazia
  ordenado. Seu capital de origem e de casamento era, portanto, **posição sem salário por
  baixo** — estruturalmente a mesma fragilidade que mais tarde desfez o lado Armond da
  família. A terra não veio de nenhuma das duas heranças: veio de uma compra que ela mesma
  fez, como viúva, em 1862 (PRB-0007).

  **2. Os registros precificam sua posição com a mesma exatidão com que precificam a outra
  ponta da árvore [PROVEN / INFERRED].** Ela é **Dona Mathilde** em todo instrumento que a
  nomeia — o casamento de 1810, a escritura de 1862, os inventários de 1867 e 1879, a venda
  dos netos em 1877. Seu pai é *Alferes*, seu sogro *Capitão*, seu tio *Capitão*.
  **[INFERRED]** Compare-se os registros da Povoação, do lado materno do proprietário do
  repositório, em que, ao longo de cerca de dez atos que temos, nenhum Muniz Bytancourt
  recebe tratamento honorífico algum e nenhuma esposa é escrita *Dona*, em livros que chamam
  uma testemunha de *Capitão* com toda a liberalidade (P-0042, PAR-0048). As duas linhagens
  que se encontram nesta árvore ocupam extremos opostos da mesma notação.

  **3. Ela era alfabetizada, e nesta família a alfabetização acompanha o dinheiro com
  exatidão [PROVEN / INFERRED].** Assinou o próprio nome no Termo de Louvação do inventário
  do marido, em março de 1867 (PRB-0009). **[CONTEXTUAL]** A alfabetização feminina no
  interior mineiro de meados do século era rara e comprada — as filhas de oficiais e de
  proprietários a tinham, ninguém mais. **[INFERRED]** Ponha-se isso ao lado de Luiza
  Fernandes de Azevedo, que entrou na linha materna do proprietário do repositório pelo
  casamento em 1916 e teve de ser assinada a rogo "por não saber ler nem escrever"
  (CIV-0006): uma mulher proprietária assinando em 1867 e uma mulher sem terra incapaz de
  assinar cinquenta anos depois é a medição de classe mais nítida que este repositório
  contém.

  **4. Sua riqueza era terra mais pessoas escravizadas — herdável, divisível, e uma das duas
  destrutível por lei [PROVEN / CONTEXTUAL].** Uma certidão em seu inventário de 1879
  registra seu tio **Capitão Manoel Rodrigues de Lima** doando a mulher escravizada
  **Martinha** a "minha sobrinha Mathilde Maria de Jesus"; Martinha e sua filha
  **Conquesta** são acompanhadas como bens do espólio (PRB-0006). **[INFERRED]** Trabalho
  chegando como doação dentro da rede de parentesco é o modo como este estrato se
  capitalizava — o oposto exato do compadrio Muniz, que circulava apenas apadrinhamento
  porque não tinha outra coisa a circular. **[CONTEXTUAL]** É também a classe de ativo mais
  frágil que ela detinha: a abolição de 1888 reduziu a zero a propriedade escrava, e seus
  espólios ainda geravam audiências em 1889.

  **5. Medida em moeda da época, a compra foi real, porém intermediária [PROVEN na quantia /
  CONTEXTUAL na referência].** Comprou a Fazenda da Concórdia por **seis contos de réis** em
  agosto de 1862 (PRB-0007). Contra as referências do período usadas em outros pontos deste
  repositório — cerca de um conto por um adulto escravizado em plena força, cerca de 420$000
  ao ano para um trabalhador rural livre — isso equivale a umas seis pessoas escravizadas,
  ou a uns catorze anos de salário de um trabalhador livre. **[INFERRED]** Uma fazenda de
  mata cafeeira em funcionamento, comprada por uma viúva para os filhos, portanto; não a
  propriedade de um magnata. O teto Toledo está muito acima do piso Muniz, e ainda muito
  abaixo de uma verdadeira fortuna provinciana.

  **6. Ela já comprava para dentro de um título fragmentado [PROVEN / INFERRED].** Os
  assentos de 1856 da Lei de Terras para o Curato do Rio Pardo mostram a Concórdia possuída
  **"em commum"**: seu filho José Cesário declara uma fazenda de 200 alqueires "por minha
  Mãe, irmãos, e cunhados", enquanto Francisco Leocádio declara à parte alguns alqueires
  próprios **dentro da mesma fazenda** (GOV-0003). **[INFERRED]** Condomínio indiviso entre
  mães, irmãos e cunhados é a cara da sucessão partilhável no terreno, antes que alguém vá a
  juízo: ninguém possui uma fazenda, todos possuem uma fração de uma. Sua compra de 1862
  consolidou um quinhão dentro de uma estrutura que já se partia.

  **7. A aritmética da fragmentação está documentada, não conjecturada, e é brutal
  [PROVEN].** O título de herdeiros de 1867 do marido lista **oito filhos** (PRB-0009). Já
  no título dela, de 1879, vários desses oito estavam mortos e representados pelos próprios
  filhos: o herdeiro nº 3 por seis *representantes*, o nº 4 por oito, o nº 5 por seis
  (PRB-0006). **[INFERRED]** Um único espólio, portanto, resolve-se em cerca de trinta
  pretendentes num só passo, convertendo um oitavo em algo mais próximo de um cinquenta
  avos. Nenhuma fazenda sobrevive a isso, e nenhuma sobreviveu.

  **8. O processo de dividir consumiu valor tão depressa quanto a própria divisão [PROVEN /
  INFERRED].** O inventário de 1867 do marido foi reaberto por *embargos á partilha* em
  1881, a partilha de 1876 foi declarada nula em 1882 e mandada refazer, e audiências nos
  mesmos autos ainda se realizavam em **1889** — vinte e dois anos de litígio (PRB-0009).
  Seu próprio espólio, de 1879, ainda estava por partilhar em fevereiro de 1884 e correu até
  uma adjudicação final por volta de 1886 (PRB-0002, PRB-0006). **[CONTEXTUAL]** Curadores,
  avaliadores, escrivães, selos e custas judiciais são todos debitados ao espólio.
  **[INFERRED]** Nesta família, a sucessão partilhável não apenas dividiu a riqueza; a
  maquinaria de dividi-la comeu um quinhão próprio.

  **9. E a indigência está declarada nas palavras da própria família, em juízo [PROVEN].**
  Em 12 de fevereiro de 1884, de próprio punho, **Simplício José Ferreira Armond**
  peticionou ao juiz de órfãos para forçar a partilha longamente adiada — explicitamente não
  em benefício próprio, mas porque tinha **"parentes colateraes em estado de indigencia"**
  cujo sofrimento o recebimento dos quinhões muito minoraria (PRB-0002). **[INFERRED]**
  Cinco anos depois da morte de uma matriarca proprietária de fazenda, alguns de seus
  descendentes colaterais estavam na indigência, e um membro da família o disse em folha
  selada diante de um juiz. É a prova mais direta neste repositório de que a sucessão
  partilhável não apenas afinou um patrimônio — derrubou pessoas para fora da classe que ele
  sustentava.

  **10. A família já se convertia para fora da terra enquanto o espólio ainda estava em
  juízo [PROVEN / INFERRED].** Seu título de 1879 registra um neto de quinze anos, **Geraldo
  Augusto de Toledo Lima**, "residente na côrte, empregado em uma caza de negocio" no Rio de
  Janeiro (PRB-0006). **[CONTEXTUAL]** Colocar um rapaz numa casa de negócio era a rota de
  aprendizado padrão para uma família proprietária que já não conseguia estabelecer os
  filhos na terra. **[INFERRED]** É estruturalmente o mesmo movimento que Antenor Muniz
  faria quatro gerações depois, do outro lado da árvore, e pelo mesmo motivo — exceto que
  ele subia para um ofício e este rapaz deslizava de lado, para fora de uma herança em
  desintegração.

  **11. Sua terra era terra de fronteira cafeeira, e isso lhe pôs prazo [CONTEXTUAL].**
  Nascida em Barbacena por volta de 1795 e casada em São João del Rei em 1810, começou nas
  serras exauridas da economia do ouro, no Campo das Vertentes; em 1856 a família estava no
  Rio Pardo, na zona cafeeira de Leopoldina (GOV-0003). Essa marcha para leste, rumo à
  fronteira da Zona da Mata, é a trajetória mineira padrão da primeira metade do século, e
  funcionou — mas atou o valor do patrimônio ao café. **[CONTEXTUAL]** A desorganização do
  trabalho em 1888, o esgotamento do solo e a longa queda de preços destruíram essa base
  regional nas décadas imediatamente posteriores à venda feita por seus netos.

  **12. Um conflito material não deve ser alisado [OPEN].** A escritura de venda da
  Concórdia de 25 de maio de 1877 descreve os netos vendendo terras herdadas de **"sua
  finada avó Dona Mathildes Maria de Jezus"** (PRB-0003) — isto é, já a dá por falecida —,
  ao passo que seu próprio inventário situa a morte em 12 de março de 1879 (PRB-0006) e a
  petição de Simplício, de 1884, recorda que ela faleceu "a cerca de 4 annos" (PRB-0002). Os
  dois não podem estar certos tais como lidos. Explicações candidatas são um erro de leitura
  do ano no traslado de 1877 (a própria nota marginal do catalogador lê "18[7]7", com o
  terceiro dígito incerto) ou uma avó mal identificada, mas o conjunto de herdeiros da
  escritura de 1877 coincide exatamente com seus representantes de 1879. **[OPEN]** O
  conflito fica aqui registrado, e não resolvido; exige nova leitura da imagem da escritura
  contra o inventário.

  **Síntese — o pico e o mecanismo.** Mathilde adquiriu o que ninguém mais nesta árvore
  adquiriu: uma fazenda em funcionamento, em nome próprio, como viúva, contra a corrente do
  que as mulheres de sua geração normalmente conseguiam fazer. Tudo o que vem depois é a
  maquinaria da dispersão — um título já comum, oito filhos, cerca de trinta netos
  pretendentes, vinte e dois anos de litígio num espólio e sete no outro, bens escravizados
  que a abolição anularia, uma economia cafeeira prestes a virar, e a própria terra vendida
  a um Capitão vizinho. **[INFERRED]** O que chegou à sua neta Eliza, e por Eliza à linha
  conjugal Armond, foi, portanto, **um quinhão em dinheiro de uma só vez, e não uma base**:
  dinheiro real uma vez, nenhum chão por baixo depois. É exatamente por isso que o neto de
  Eliza, Geraldo Paz Armond, era *padeiro* em Volta Redonda. E é por isso que os dois avôs
  do proprietário do repositório — Geraldo, o padeiro, descendente desta fazenda, e Antenor
  Muniz, o bombeiro hidráulico, ascendente de uma pequena propriedade açoriana (P-0006) —
  terminaram como homens de ofício na mesma cidade siderúrgica, tendo chegado ali de
  extremos opostos da escala social.

  ## Questões em aberto

  - A imagem de seu próprio batismo de 1795 em Barbacena — confirmaria por fonte primária a
  data e seus pais. [OPEN]

  - A leitura "irmã" da certidão de Martinha (Francisca de Lima como sua mãe e irmã do
  Capitão) — requer verificação na imagem. [OPEN]

  - O elemento "Luiza" na variante do registro de óbito de 1909 (CIV-0024) — erro de
  escrivão, ou um nome do meio genuíno. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0023 (casamento de 1810 em São João del Rei — seus pais) · PAR-0017 (batismo de
  1821 da filha Carolina em Barbacena) · PRB-0007 (escritura de compra da Concórdia de 1862
  — ela como viúva / cabeça do casal).

  - PRB-0009 (inventário de 1867 do marido — seus oito filhos) · PRB-0006 (seu próprio
  inventário de 1879 — data de óbito, a linha de herdeira de Eliza, a certidão de Martinha)
  · PRB-0003 / PRB-0004 (escrituras das décadas de 1870–80 que a citam como avó dos netos).

  - CIV-0024 (óbito de 1909 do filho António Ladislão — a variante "Mathilde Luiza de
  Toledo") · GOV-0003 (registro de terras de 1856 em Rio Pardo — Concórdia detida "por
  minha Mãe").

  - Cuidado com homônima: uma "Mathilde Maria de Jesus" diferente, viúva de Generoso
  Fernandes de Moura, aparece em um inventário Moura, não relacionado, da era republicana —
  não é esta pessoa.

  ## Contexto regional e migratório

  Sua vida traça a marcha padrão para leste de uma família proprietária mineira na primeira
  metade do século XIX. Nasceu e foi batizada na **Freguesia de Barbacena** por volta de
  1795 [LEAD quanto à data; PROVEN quanto à freguesia, PAR-0023], casou-se na **Matriz de
  Nossa Senhora do Pilar, São João del Rei**, em 8 de maio de 1810 (PAR-0023), batizou ali
  um filho em 1813 (PAR-0050) e uma filha de volta na Capela dos Remédios, em Barbacena, em
  1821 (PAR-0017). [CONTEXTUAL] É o velho **Campo das Vertentes** — o núcleo serrano da
  economia do ouro, então havia muito passado o auge, com seu capital em busca de novo
  emprego.

  Em 1856 a família já está na fronteira cafeeira: seu filho declara a Fazenda da Concórdia
  no **Curato do Rio Pardo, Município de Villa Leopoldina**, "por minha Mãe, irmãos, e
  cunhados" (GOV-0003), e em 1862 ela compra a fazenda por inteiro (PRB-0007). [CONTEXTUAL]
  A mudança das serras mineradoras exauridas para leste, rumo à **Zona da Mata Mineira**,
  foi a migração familiar dominante em Minas no período, movida pela mata virgem fértil,
  pela economia cafeeira em expansão e, a partir de meados do século, pela ferrovia. Morreu
  na Concórdia em 12 de março de 1879 (PRB-0006) — a marcha da família para leste foi a
  dela, e foi a última que a família fez tendo terra por baixo.

