notes:
- text: >-
    Grandmother (avó) of the Toledo grandchildren who inherited the Fazenda da
    Concórdia estate, per the 1877 deed (PRB-0003: "sua finada avó Dona Mathildes
    Maria de Jesus"), the 1881 partilha (PRB-0001, the "Primeiros Nettos" heir
    list) and the 1884 petition (PRB-0002, in which Simplício petitions as heir
    of the late D. Mathilde Maria de Jezus). Eliza Balbina de Toledo (P-0017) is
    one of those grandchildren, so Mathilde is Eliza's grandmother — resolving the
    mother-vs-grandmother question flagged on PRB-0001. She had died by the 1881
    inventory (d. ~1880).
- text: >-
    The intervening generation — Mathilde's child, who is Eliza's parent — is not
    yet named in the located records, so her link to P-0017 is recorded here in
    prose rather than as a structured parent-child edge, and no Ahnentafel
    position is assigned. Reported Toledo co-grandchildren (Eliza's siblings/kin):
    Maria Bulandina de Toledo (m. Manoel Marques Jorge), Ladisláo Egydio Ferreira
    de Toledo, Geraldo Augusto de Toledo, Josepha Olímpia and Maria
    [Perpétua/Porcelina] de Toledo — not yet modelled as entities.
- text: >-
    30 July 2026 (Full-Text via research/from-retrieval/, ARK 3:1:3QHJ-1QWB-7BYX,
    catalogued as PRB-0004): a second Concórdia / Ribeirão de São Bento Toledo
    deed names Mathilde's husband, Ladisláo Egydio Ferreira de Toledo, and a
    parent couple below them, Antonio Zeferino de Toledo and Dona Maria Perpétua
    ("seus finados avós Dona Mathilde Maria de Jesus e Ladisláo Egydio Ferreira de
    Toledo e seus paes e sogros Antonio Zeferino de Toledo e Dona Maria Perpétua").
    Antonio Zeferino is thus a son of Mathilde × Ladisláo and, with Maria Perpétua,
    a parent of that deed's grantor grandchildren. Not yet modelled as entities: a
    conflict must first be resolved — in PRB-0003 (1877) a LIVING "Ladisláo Egydio
    Ferreira de Toledo" is a grantor grandchild, while here the same name is a
    deceased grandfather (most likely an elder/grandson pair). Retrieve the full
    Concórdia inventory to place the couples before creating any edges.
- text: >-
    Namesake caution (do NOT conflate): a different "Mathilde Maria de Jesus" —
    widow of Generoso Fernandes de Moura, with children surnamed de Moura — appears
    in a Republic-era Moura inventory (ARK 3:1:3QHK-QQ2X-VS4Y) in the same retrieval
    drop. She is unrelated to this P-0027 (wife of Ladisláo Egydio de Toledo).
