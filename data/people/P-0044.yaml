profile: >-
  ## Identity

  **Maria de Mendonça** — a stub ancestor known from a single derivative mention. [PROVEN
  name]

  - **Role:** mother of the Sapucaia patriarch José do Rego Brandão (P-0040) and, through
  him and granddaughter Susanna (P-0020), a great-great-grandparent of the Muniz line
  (family F-0021). [PROVEN]

  - **Spouse:** José do Rego Brandão [the elder] (P-0043). [PROVEN]

  - **Only attestation:** named, with her husband, as the parents of the deceased in her
  son's 1912 Carangola death (PAR-0008). No record of her own has been located. [PROVEN via
  PAR-0008]

  - **Birth, death and origin:** unknown; nationality left unset. The Mendonça surname does
  not recur in the documented Sapucaia Brandão records — a thread to trace. [OPEN]

  ## What we can extrapolate

  A named-only ancestress at the branch's origin edge. [INFERRED — OPEN] Documented solely as
  the mother named in her son's 1912 óbito, she carries no evidence of standing, wealth or
  origin of her own. That her surname Mendonça does not recur in the Sapucaia Brandão records
  is a small thread: it could mark her as married-in from outside the local network, bearing on
  the same open question as her husband (P-0043) — whether the Brandão line's rooted-local
  standing predates the Sapucaia patriarch or begins with him. This is inference from a single
  derivative mention, not a documented conclusion.

  ## Open questions

  - Any record naming her beyond the 1912 derivative filiation — her son's baptism (about
  1833) or her marriage to José do Rego Brandão Sr. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (her son José's 1912 Carangola death — the sole record naming her, as the
  deceased's mother).
profile_pt: >-
  ## Identidade

  **Maria de Mendonça** — uma ancestral esboço, conhecida por uma única menção derivada.
  [PROVEN, o nome]

  - **Papel:** mãe do patriarca de Sapucaia José do Rego Brandão (P-0040) e, por meio dele e
  da neta Susanna (P-0020), uma trisavó da linha Muniz (família F-0021). [PROVEN]

  - **Cônjuge:** José do Rego Brandão [o velho] (P-0043). [PROVEN]

  - **Única atestação:** nomeada, junto com seu marido, como os pais do falecido no óbito de
  1912 de seu filho, em Carangola (PAR-0008). Nenhum registro próprio dela foi localizado.
  [PROVEN via PAR-0008]

  - **Nascimento, óbito e origem:** desconhecidos; nacionalidade deixada em branco. O
  sobrenome Mendonça não reaparece nos registros Brandão documentados de Sapucaia — um fio a
  rastrear. [OPEN]

  ## O que podemos extrapolar

  Uma ancestral conhecida apenas pelo nome, na borda de origem do ramo. [INFERRED — OPEN]
  Documentada unicamente como a mãe nomeada no óbito de 1912 de seu filho, ela não carrega
  nenhuma evidência de posição, riqueza ou origem própria. Que seu sobrenome Mendonça não
  reapareça nos registros Brandão de Sapucaia é um pequeno fio: poderia marcá-la como vinda de
  fora da rede local pelo casamento, incidindo sobre a mesma questão em aberto do marido
  (P-0043) — se a posição nativo-enraizada da linha Brandão antecede o patriarca de Sapucaia ou
  começa com ele. Trata-se de inferência a partir de uma única menção derivada, não de uma
  conclusão documentada.

  ## Questões em aberto

  - Qualquer registro que a nomeie além da filiação derivada de 1912 — o batismo de seu filho
  (por volta de 1833) ou seu casamento com José do Rego Brandão pai. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (o óbito de 1912 de seu filho José, em Carangola — o único registro que a
  nomeia, como mãe do falecido).
