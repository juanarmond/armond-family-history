profile: >-
  ## Interesting facts

  - **[PROVEN]** She is known from a single derivative mention: named as the mother of the deceased in her son's 1912 Carangola death record — "filho de José do Rego Brandão e de Maria de Mendonça" (PAR-0008). No record of her own has been located.

  - **[INFERRED]** The Mendonça surname does not recur anywhere in the documented Sapucaia Brandão records — unlike the Rego Brandão name, which was deliberately perpetuated across generations. This suggests she married into the Brandão household from outside the tight local network, or simply that her surname line did not propagate.

  - **[CONTEXTUAL]** A woman born perhaps around 1800–1815 in the Paraíba do Sul valley would have lived through Brazilian independence (1822), the early coffee economy's rise, and the first decades of the Second Empire — all before her son José do Rego Brandão (P-0040) was born about 1833 and established himself as a community godfather at Sapucaia.

  - **[INFERRED]** She and her husband are the oldest generation on the Brandão side for whom any record exists, even if only a derivative one. Whether the Rego Brandão family's established local standing predates their generation or begins with them is the most important open question on this branch.

  - **[CONTEXTUAL]** The Paraíba do Sul valley in the early 19th century was experiencing the expansion of coffee cultivation that would transform the entire region. Families established in Sapucaia before the coffee era would have watched their community transform from a farming backwater into one of Brazil's most economically significant corridors.

  ## Identity

  **Maria de Mendonça** — a stub ancestor known from a single derivative mention. [PROVEN
  name]

  - **Role:** mother of the Sapucaia patriarch José do Rego Brandão (P-0040) and, through
  him and granddaughter Susanna (P-0020), a great-great-grandparent of the Muniz line
  (family F-0021). [PROVEN]

  - **Spouse:** José do Rego Brandão [the elder] (P-0043). [PROVEN]

  - **Only attestation:** named, with her husband, as the parents of the deceased in her
  son's 1912 Carangola death (PAR-0008). No record of her own has been located. [PROVEN via
  PAR-0008]

  - **Birth, death and origin:** unknown; nationality left unset. The Mendonça surname does
  not recur in the documented Sapucaia Brandão records — a thread to trace. [OPEN]

  ## What we can extrapolate

  A named-only ancestress at the branch's origin edge. [INFERRED — OPEN] Documented solely as
  the mother named in her son's 1912 óbito, she carries no evidence of standing, wealth or
  origin of her own. That her surname Mendonça does not recur in the Sapucaia Brandão records
  is a small thread: it could mark her as married-in from outside the local network, bearing on
  the same open question as her husband (P-0043) — whether the Brandão line's rooted-local
  standing predates the Sapucaia patriarch or begins with him. This is inference from a single
  derivative mention, not a documented conclusion.

  ## Open questions

  - Any record naming her beyond the 1912 derivative filiation — her son's baptism (about
  1833) or her marriage to José do Rego Brandão Sr. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (her son José's 1912 Carangola death — the sole record naming her, as the
  deceased's mother).

