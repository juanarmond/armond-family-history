profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é conhecida por uma única menção derivada: nomeada como mãe do falecido no registro de óbito de 1912 de seu filho em Carangola — "filho de José do Rego Brandão e de Maria de Mendonça" (PAR-0008). Nenhum registro próprio dela foi localizado.

  - **[INFERRED]** O sobrenome Mendonça não reaparece em nenhum lugar nos registros Brandão documentados de Sapucaia — ao contrário do nome Rego Brandão, que foi deliberadamente perpetuado por gerações. Isso sugere que ela se casou no lar Brandão vindo de fora da rede local fechada, ou simplesmente que sua linha de sobrenome não se propagou.

  - **[CONTEXTUAL]** Uma mulher nascida talvez por volta de 1800–1815 no vale do Paraíba do Sul teria vivido a independência do Brasil (1822), a ascensão da economia cafeeira inicial e as primeiras décadas do Segundo Reinado — tudo antes de seu filho José do Rego Brandão (P-0040) nascer por volta de 1833 e se estabelecer como padrinho comunitário em Sapucaia.

  - **[INFERRED]** Ela e seu marido são a geração mais antiga do lado Brandão para a qual existe algum registro, ainda que apenas derivado. Se a posição nativo-estabelecida da família Rego Brandão antecede a geração deles ou começa com ela é a questão em aberto mais importante neste ramo.

  - **[CONTEXTUAL]** O vale do Paraíba do Sul no início do século XIX passava pela expansão do cultivo do café que transformaria toda a região. Famílias estabelecidas em Sapucaia antes da era cafeeira teriam assistido sua comunidade transformar-se de um burgo agrário em um dos corredores economicamente mais significativos do Brasil.

  ## Identidade

  **Maria de Mendonça** — uma ancestral esboço, conhecida por uma única menção derivada.
  [PROVEN, o nome]

  - **Papel:** mãe do patriarca de Sapucaia José do Rego Brandão (P-0040) e, por meio dele e
  da neta Susanna (P-0020), uma trisavó da linha Muniz (família F-0021). [PROVEN]

  - **Cônjuge:** José do Rego Brandão [o velho] (P-0043). [PROVEN]

  - **Única atestação:** nomeada, junto com seu marido, como os pais do falecido no óbito de
  1912 de seu filho, em Carangola (PAR-0008). Nenhum registro próprio dela foi localizado.
  [PROVEN via PAR-0008]

  - **Nascimento, óbito e origem:** desconhecidos; nacionalidade deixada em branco. O
  sobrenome Mendonça não reaparece nos registros Brandão documentados de Sapucaia — um fio a
  rastrear. [OPEN]

  ## O que podemos extrapolar

  Uma ancestral conhecida apenas pelo nome, na borda de origem do ramo. [INFERRED — OPEN]
  Documentada unicamente como a mãe nomeada no óbito de 1912 de seu filho, ela não carrega
  nenhuma evidência de posição, riqueza ou origem própria. Que seu sobrenome Mendonça não
  reapareça nos registros Brandão de Sapucaia é um pequeno fio: poderia marcá-la como vinda de
  fora da rede local pelo casamento, incidindo sobre a mesma questão em aberto do marido
  (P-0043) — se a posição nativo-enraizada da linha Brandão antecede o patriarca de Sapucaia ou
  começa com ele. Trata-se de inferência a partir de uma única menção derivada, não de uma
  conclusão documentada.

  ## Questões em aberto

  - Qualquer registro que a nomeie além da filiação derivada de 1912 — o batismo de seu filho
  (por volta de 1833) ou seu casamento com José do Rego Brandão pai. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (o óbito de 1912 de seu filho José, em Carangola — o único registro que a
  nomeia, como mãe do falecido).

  ## Onde ir hoje

  - **Origem (presumida):** Igreja Matriz de Santo Antônio, Sapucaia, RJ — nenhum registro fixa um lugar além da origem da família em Sapucaia [UNLOCATED] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
