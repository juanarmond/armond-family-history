profile: >-
  ## Interesting facts

  - **[PROVEN]** She is known from one derivative mention: her son's 1912 Carangola death act names his parents as "José do Rego Brandão e … Maria de Mendonça" (PAR-0008). No record of her own has been located.

  - **[PROVEN]** Unlike her husband and her son, who share an identical full name, her surname appears exactly once in this archive and is never repeated. "Mendonça" recurs nowhere in the documented Sapucaia Brandão records, and no descendant carries it.

  - **[INFERRED]** That asymmetry is the one thing her single line of evidence supports. Her husband's name was perpetuated deliberately across two generations; hers stopped with her. Whether she married in from outside the local kin network or simply had no name worth carrying forward cannot be decided from one act — but the contrast is real, and it is how female surnames usually behave in families without property to name.

  - **[INFERRED]** Her son was born about 1833, so her household was formed by the early 1830s. Nothing establishes where.

  - **[CONTEXTUAL]** A woman of that generation in south-eastern Brazil lived through independence (1822) as a child or young woman, the Regency, and the opening of the Paraíba do Sul coffee economy. Her descendants pass through all of it without acquiring land, which is the only long-range statement the evidence will bear.

  ## Identity

  **Maria de Mendonça** — a stub ancestress known from a single derivative mention. [PROVEN as named]

  - **Relationship:** 2×-great-grandmother of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs Maria → José do Rego Brandão (P-0040) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. Family F-0021. [derived from families F-0021, F-0019, F-0007 and F-0001]

  - **Spouse:** José do Rego Brandão [the elder] (P-0043). [PROVEN as named]

  - **Only attestation:** named, with her husband, as the parents of the deceased in her son's 1912 Carangola death (PAR-0008) — reported by an informant about eighty years after her household was formed, not a contemporary act. [PROVEN as an attestation; derivative in quality]

  - **Birth, death and origin:** unknown. Nationality is deliberately left unset: no birthplace and no stated *nacionalidade* is evidenced, and none is inferred from the surname. [OPEN]

  ## Standing and profession

  Nothing is documented — no occupation, property, literacy or title. A single filiation line will support no reading of her standing. [OPEN]

  ## Family and social network

  Mother of José do Rego Brandão (P-0040), the Santo Antônio de Sapucaia householder whom Azorean immigrants asked to godparent their children, and grandmother of Susanna Rita Brondão (P-0020), who married one of them. She is attached to that network only through her son; nothing places her in it personally. Whether she had other children is unknown — no inventário or "N filhos" statement exists at her level or her son's. [OPEN]

  ## What we can extrapolate

  A named-only ancestress at the edge of the branch, and the evidence will carry exactly one observation. [INFERRED — OPEN]

  The observation is about her surname. **Mendonça** appears once, in a record made long after her death, and then disappears: it recurs in none of the documented Sapucaia Brandão material and no descendant bears it. Her husband's name, by contrast, was given whole to their son and so survived two generations. In a family that left no probate, no title and no land register, a name was very nearly the only thing that *could* be transmitted, and the records show it transmitted patrilineally and not otherwise. Her disappearance from the naming is therefore not an accident of documentation; it is the ordinary working of a household with nothing but a name to pass on.

  Two readings of the surname's isolation remain open and should not be collapsed. She may have married in from outside the local kin network — which would bear on the same question her husband's profile raises, whether the Brandão family's rooted-local standing predates the Sapucaia householder or begins with him. Or the Mendonça line may simply have been as propertyless and undocumented as the Brandão, in which case its absence means nothing at all. One derivative filiation cannot choose between these, and inflating it into a conclusion would be inventing a history for a woman about whom the archive says eight words. [INFERRED]

  ## Open questions

  - Any record naming her beyond the 1912 derivative filiation — her son's baptism (about 1833) or her marriage to José do Rego Brandão the elder. Santo Antônio de Sapucaia was erected as a freguesia only in 1871, so both would lie in a predecessor parish whose pre-1885 books are undigitised. [OPEN]

  - Whether the Mendonça surname connects her to any documented Paraíba do Sul family. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (her son José's 1912 Carangola death — the sole record naming her, as the deceased's mother).

  ## Regional and migration context

  No place is documented for her. [OPEN] Her son is recorded at Santo Antônio de Sapucaia in the Paraíba do Sul valley (RJ) and later at Carangola in the Zona da Mata Mineira, so a Paraíba valley household is a working assumption only. [INFERRED] The regional history that shaped her descendants — the post-1850 free-labour transition under the Lei nº 581 de 1850 (Lei Eusébio de Queirós), abolition under the Lei Áurea (1888) and land placed on a purchase basis by the Lei de Terras (nº 601, 1850) — falls largely after her lifetime. [CONTEXTUAL]

  ## Where to go today

  - **Presumed residence:** Santo Antônio de Sapucaia, RJ — named only as her son's mother; no record fixes a place [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é conhecida por uma menção derivada: o ato de óbito de seu filho, em 1912, em Carangola, nomeia os pais dele como "José do Rego Brandão e … Maria de Mendonça" (PAR-0008). Nenhum registro próprio foi localizado.

  - **[PROVEN]** Ao contrário do marido e do filho, que compartilham um nome completo idêntico, seu sobrenome aparece exatamente uma vez neste arquivo e nunca se repete. "Mendonça" não reaparece em nenhum dos registros documentados dos Brandão de Sapucaia, e nenhum descendente o carrega.

  - **[INFERRED]** Essa assimetria é a única coisa que sua linha isolada de evidência sustenta. O nome do marido foi perpetuado deliberadamente por duas gerações; o dela parou nela. Se ela veio de fora da rede local de parentesco pelo casamento, ou se simplesmente não tinha nome que valesse levar adiante, não se decide por um único ato — mas o contraste é real, e é assim que sobrenomes femininos costumam se comportar em famílias sem propriedade a nomear.

  - **[INFERRED]** Seu filho nasceu por volta de 1833, de modo que seu lar estava formado no início dos anos 1830. Nada estabelece onde.

  - **[CONTEXTUAL]** Uma mulher dessa geração no sudeste do Brasil viveu a independência (1822) ainda criança ou moça, a Regência e a abertura da economia cafeeira do Paraíba do Sul. Seus descendentes atravessam tudo isso sem adquirir terra, que é a única afirmação de longo alcance que a evidência suporta.

  ## Identidade

  **Maria de Mendonça** — ancestral em esboço, conhecida por uma única menção derivada. [PROVEN quanto ao nome]

  - **Parentesco:** trisavó de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre Maria → José do Rego Brandão (P-0040) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. Família F-0021. [derivado das famílias F-0021, F-0019, F-0007 e F-0001]

  - **Marido:** José do Rego Brandão [o velho] (P-0043). [PROVEN quanto ao nome]

  - **Única atestação:** nomeada, com o marido, como os pais do falecido no óbito de 1912 de seu filho em Carangola (PAR-0008) — informado por um declarante cerca de oitenta anos depois de formado o lar dela, não um ato contemporâneo. [PROVEN como atestação; derivado em qualidade]

  - **Nascimento, óbito e origem:** desconhecidos. A nacionalidade é deliberadamente não definida: nenhum local de nascimento e nenhuma *nacionalidade* declarada estão evidenciados, e nenhuma é inferida do sobrenome. [OPEN]

  ## Posição social e profissão

  Nada está documentado — nenhuma ocupação, propriedade, alfabetização ou título. Uma única linha de filiação não sustentará leitura alguma de sua posição. [OPEN]

  ## Família e rede social

  Mãe de José do Rego Brandão (P-0040), o chefe de casa de Santo Antônio de Sapucaia a quem os imigrantes açorianos pediam para apadrinhar seus filhos, e avó de Susanna Rita Brondão (P-0020), que se casou com um deles. Ela se liga a essa rede apenas por meio do filho; nada a situa nela pessoalmente. Se teve outros filhos, não se sabe — não existe inventário nem declaração de "N filhos" no nível dela ou do filho. [OPEN]

  ## O que podemos extrapolar

  Uma ancestral apenas nomeada, na borda do ramo, e a evidência sustentará exatamente uma observação. [INFERRED — OPEN]

  A observação é sobre seu sobrenome. **Mendonça** aparece uma vez, num registro feito muito depois de sua morte, e depois desaparece: não reaparece em nenhum material documentado dos Brandão de Sapucaia, e nenhum descendente o traz. O nome do marido, por contraste, foi dado inteiro ao filho e assim sobreviveu por duas gerações. Numa família que não deixou inventário, título nem registro de terras, um nome era quase a única coisa que *podia* ser transmitida, e os registros mostram que ele se transmitiu por via paterna e não de outro modo. Seu desaparecimento da nomeação não é, portanto, acidente de documentação; é o funcionamento comum de um lar que só tinha um nome a legar.

  Duas leituras do isolamento desse sobrenome permanecem abertas e não devem ser fundidas. Ela pode ter vindo de fora da rede local de parentesco pelo casamento — o que tocaria a mesma questão levantada no perfil do marido, se a posição local consolidada da família Brandão precede o chefe de casa de Sapucaia ou começa com ele. Ou a linha Mendonça pode simplesmente ter sido tão sem propriedade e tão sem documentos quanto a Brandão, caso em que sua ausência nada significa. Uma filiação derivada não decide entre as duas, e inflá-la numa conclusão seria inventar uma história para uma mulher sobre quem o arquivo diz oito palavras. [INFERRED]

  ## Questões em aberto

  - Qualquer registro que a nomeie além da filiação derivada de 1912 — o batismo de seu filho (por volta de 1833) ou seu casamento com José do Rego Brandão, o velho. Santo Antônio de Sapucaia só foi erigida em freguesia em 1871, de modo que ambos estariam numa paróquia antecessora cujos livros anteriores a 1885 não estão digitalizados. [OPEN]

  - Se o sobrenome Mendonça a liga a alguma família documentada do Paraíba do Sul. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (o óbito de 1912 de seu filho José em Carangola — o único registro que a nomeia, como mãe do falecido).

  ## Contexto regional e migratório

  Nenhum lugar lhe é documentado. [OPEN] Seu filho está registrado em Santo Antônio de Sapucaia, no vale do Paraíba do Sul (RJ), e depois em Carangola, na Zona da Mata Mineira, de modo que um lar no vale do Paraíba é apenas hipótese de trabalho. [INFERRED] A história regional que moldou seus descendentes — a transição para o trabalho livre pós-1850 sob a Lei nº 581 de 1850 (Lei Eusébio de Queirós), a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850) — cai em grande parte depois de sua vida. [CONTEXTUAL]

  ## Onde ir hoje

  - **Residência presumida:** Santo Antônio de Sapucaia, RJ — nomeada apenas como mãe de seu filho; nenhum registro fixa um lugar [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Sapucaia%2C%20RJ)
