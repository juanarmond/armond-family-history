profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named once, in her son's 1829 Nova Friburgo marriage — "filho legitimo
  do defunto Joze Geggendorn e de sua mulher **Maria Lutz**" — and, unlike her husband, without
  a death qualifier. The clerk marked him dead and did not mark her, which is the strongest
  available indication that she was still living on 20 July 1829. (PAR-0073)

  - **[PROVEN]** Her surname is recorded plainly as **Lutz**, with none of the spelling trouble
  that afflicts the Eggendorn name in the same document. One clean word in a register that
  otherwise gave the family four different surname forms.

  - **[LEAD]** The same Nova Friburgo genealogy blog that dates her husband gives her as Anna
  Maria Lutz, born 14 April 1767 and died 27 May 1836 at Cabeceiras do Macaé. If accurate, she
  would have outlived her husband by seven years and died in her late sixties — a long life for
  a first-generation colonist woman. None of it is confirmed by a held record.

  - **[INFERRED]** Everything about her origin comes through her son. The 1829 act locates *him*
  in the parish of São Lucas [uncertain], Canton Solothurn; it says nothing about where she was
  born, which is why her nationality is deliberately left unset here rather than assumed to be
  Swiss.

  ## Identity

  **Maria Lutz** — wife of the late José Eggendorn Sr (P-0115) and mother of the groom in the
  1829 Nova Friburgo marriage of José Eggendorn (P-0101). Iris Bohrer Muniz's (P-0007)
  3×-great-grandmother, by the chain José Eggendorn → Maria Thecla Regina Eggendorn (P-0071) →
  Valentim Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN that she is named;
  degree derived from the family links]

  - **Named in one record:** PAR-0073, 20 July 1829, as the wife of "defunto Joze Geggendorn"
  and mother of the groom; family F-0058. She is not described as deceased. [PROVEN]

  - **Apparently living:** 20 July 1829, on the omission of a death qualifier. Clearly deceased
  now. [INFERRED from PAR-0073]

  - **Birth, death, origin, nationality:** none documented. Nationality is left unset for that
  reason. [OPEN by decision]

  - **Reported life [LEAD]:** Anna Maria Lutz, b. 14 April 1767; d. 27 May 1836, Cabeceiras do
  Macaé (Nova Friburgo). Raibert Nova Friburgo blog; no held primary.

  ## Standing and profession

  Nothing is recorded. She is a name and a marital relationship in a single clause of a single
  act. No occupation, property, residence, literacy or signature survives for her — and in a
  register of this period nothing else would be expected of a widow named in her son's marriage
  entry.

  ## Family and social network

  Her documented world is one household: she and José Eggendorn Sr had at least the son who
  married at Nova Friburgo in July 1829, taking Anna Maria Frees as his wife. [PROVEN —
  PAR-0073] The witnesses at that wedding were José Maria Dubra and **Anna Maria Geggendorn** —
  a woman of her own married surname, whose exact relationship to her is not stated but who is
  plainly kin or close connection. It is the only social trace of her family in the act. [PROVEN
  for the name; the relationship is OPEN]

  ## What we can extrapolate

  - **[CONTEXTUAL]** The household is placed in Canton Solothurn by her son's stated birth
  parish. That was a small, land-constrained, mostly Catholic agricultural canton whose families
  joined the 1819–20 Nova Friburgo emigration under Dom João VI's 1818 decree, driven by the
  1816–17 harvest failures, post-Napoleonic poverty and the fragmentation of smallholdings among
  too many heirs.

  - **[INFERRED]** If she was alive in 1829 she had survived what killed roughly a quarter of
  the 1819 emigrants — typhus and scurvy on the crossing — and then the colony's hard early
  years on stony serra lots. Widowhood in a settlement like that, with a grown son marrying, is
  the visible outline of her situation; the record supports the outline and not a single detail
  inside it.

  - **[CONTEXTUAL]** The Eggendorns married repeatedly into the same small transplanted pool —
  Frees, Borer, Wehrli — and the presence of an Anna Maria Geggendorn as a witness at her son's
  wedding is that endogamy in miniature. It is how a colonist family with no land to consolidate
  kept its social world intact.

  ## Open questions

  - Her birth, her marriage, her death and her origin — nothing held beyond the single 1829
  mention. [OPEN]

  - Whether the blog's Anna Maria Lutz (1767–1836, Cabeceiras do Macaé) is this woman. A Nova
  Friburgo burial register of 1836 would settle it. [LEAD]

  - Who Anna Maria Geggendorn, the witness at her son's 1829 wedding, was in relation to this
  family. [OPEN]

  - Her nationality, left unset on purpose because no held record states where she was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0073** — her son José Eggendorn's 1829 Nova Friburgo marriage to Anna Maria Frees; the
  sole held record naming her, as the wife of the late José Eggendorn Sr and mother of the
  groom.

  ## Regional and migration context

  Nova Friburgo was created by royal decree on 16 May 1818 to settle Swiss Catholic families on
  the Fazenda do Morro Queimado, and the recruitment that followed drew far more people than the
  hundred families contracted — some 261–265 families, from Solothurn as well as Fribourg,
  Valais and Bern. [CONTEXTUAL] They sailed from the North Sea ports in late 1819, lost about a
  quarter of their number to disease at sea, and were settled on highland lots too poor and too
  small to deliver what had been promised; many families abandoned them within a few years.
  [CONTEXTUAL] What a held record establishes about this family is narrow and firm: her son was
  living in the parish of São João Baptista and married there in July 1829, with his mother
  named and his father dead. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  son married in July 1829, the one event that names her. The present cathedral was inaugurated
  in 1869; the act belongs to the earlier church on the same site. [RESOLVED]

  - **Canton Solothurn — parish unresolved.** The family's parish is given as "São Lucas" and
  has not been matched to any Solothurn parish; the competing blog lead names Grindel, whose
  Kath. Pfarrkirche St. Stephan stands at 4247 Grindel ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042). Neither is a documented site for her.
  [UNLOCATED]

  - **Cabeceiras do Macaé, Nova Friburgo district, RJ** — the reported place of her death in
  1836, on a blog attribution only. No held record places her there. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada uma única vez, no casamento do filho em 1829, em Nova Friburgo —
  "filho legitimo do defunto Joze Geggendorn e de sua mulher **Maria Lutz**" — e, ao contrário
  do marido, sem qualificador de falecimento. O escrivão marcou-o como morto e não a marcou, o
  que é a indicação mais forte disponível de que ela ainda vivia em 20 de julho de 1829.
  (PAR-0073)

  - **[PROVEN]** Seu sobrenome está registrado de forma limpa como **Lutz**, sem nenhum dos
  problemas de grafia que afligem o nome Eggendorn no mesmo documento. Uma palavra nítida num
  livro que, quanto ao resto, deu à família quatro formas diferentes de sobrenome.

  - **[LEAD]** O mesmo blog genealógico de Nova Friburgo que data o marido a apresenta como Anna
  Maria Lutz, nascida em 14 de abril de 1767 e falecida em 27 de maio de 1836 em Cabeceiras do
  Macaé. Se correto, teria sobrevivido ao marido por sete anos e morrido perto dos setenta —
  vida longa para uma colona de primeira geração. Nada disso é confirmado por documento retido.

  - **[INFERRED]** Tudo o que se sabe de sua origem vem pelo filho. O assento de 1829 localiza
  *ele* na freguesia de São Lucas [incerto], Cantão de Solothurn; nada diz sobre onde ela nasceu
  — razão pela qual sua nacionalidade é deliberadamente deixada em aberto, em vez de presumida
  suíça.

  ## Identidade

  **Maria Lutz** — esposa do falecido José Eggendorn Sr (P-0115) e mãe do noivo no casamento de
  1829, em Nova Friburgo, de José Eggendorn (P-0101). Tetravó de Iris Bohrer Muniz (P-0007),
  pela cadeia José Eggendorn → Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer
  (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN que é nomeada; grau derivado dos vínculos
  familiares]

  - **Nomeada em um registro:** PAR-0073, 20 de julho de 1829, como esposa do "defunto Joze
  Geggendorn" e mãe do noivo; família F-0058. Não é descrita como falecida. [PROVEN]

  - **Aparentemente viva:** em 20 de julho de 1829, pela omissão do qualificador de falecimento.
  Claramente falecida hoje. [INFERRED a partir de PAR-0073]

  - **Nascimento, óbito, origem e nacionalidade:** nada documentado. Por isso a nacionalidade
  fica em aberto. [OPEN por decisão]

  - **Vida relatada [LEAD]:** Anna Maria Lutz, n. 14 de abril de 1767; f. 27 de maio de 1836,
  Cabeceiras do Macaé (Nova Friburgo). Blog Raibert de Nova Friburgo; nenhuma fonte primária
  retida.

  ## Posição social e profissão

  Nada está registrado. Ela é um nome e uma relação conjugal numa única cláusula de um único
  ato. Não sobrevive dela ocupação, propriedade, residência, alfabetização ou assinatura — e,
  num livro desse período, nada mais se esperaria de uma viúva nomeada no assento de casamento
  do filho.

  ## Família e rede social

  Seu mundo documentado é um domicílio: ela e José Eggendorn Sr tiveram ao menos o filho que se
  casou em Nova Friburgo em julho de 1829, tomando por esposa Anna Maria Frees. [PROVEN —
  PAR-0073] As testemunhas desse casamento foram José Maria Dubra e **Anna Maria Geggendorn** —
  uma mulher com o sobrenome de casada dela própria, cujo parentesco exato não é declarado, mas
  que é evidentemente parenta ou relação próxima. É o único traço social de sua família no ato.
  [PROVEN quanto ao nome; o parentesco está OPEN]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** O domicílio é situado no Cantão de Solothurn pela freguesia de nascimento
  declarada do filho. Era um cantão agrícola pequeno, de terra escassa e majoritariamente
  católico, cujas famílias aderiram à emigração para Nova Friburgo de 1819–20 sob o decreto de
  1818 de Dom João VI, impelidas pelas quebras de safra de 1816–17, pela pobreza pós-napoleônica
  e pela fragmentação das pequenas propriedades entre herdeiros demais.

  - **[INFERRED]** Se estava viva em 1829, havia sobrevivido ao que matou cerca de um quarto dos
  emigrantes de 1819 — tifo e escorbuto na travessia — e, em seguida, aos duros primeiros anos
  da colônia em lotes serranos pedregosos. A viuvez num povoamento assim, com um filho adulto
  casando-se, é o contorno visível de sua situação; o registro sustenta o contorno, e nenhum
  detalhe dentro dele.

  - **[CONTEXTUAL]** Os Eggendorn casaram-se repetidamente dentro do mesmo pequeno conjunto
  transplantado — Frees, Borer, Wehrli —, e a presença de uma Anna Maria Geggendorn como
  testemunha no casamento do filho é essa endogamia em miniatura. É como uma família colona sem
  terra a consolidar mantinha intacto o seu mundo social.

  ## Questões em aberto

  - Seu nascimento, seu casamento, seu óbito e sua origem — nada disponível além da única menção
  de 1829. [OPEN]

  - Se a Anna Maria Lutz do blog (1767–1836, Cabeceiras do Macaé) é esta mulher. Um livro de
  óbitos de Nova Friburgo de 1836 resolveria a questão. [LEAD]

  - Quem era Anna Maria Geggendorn, testemunha do casamento do filho em 1829, em relação a esta
  família. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — casamento de 1829, em Nova Friburgo, do filho José Eggendorn com Anna Maria
  Frees; o único documento retido que a nomeia, como esposa do falecido José Eggendorn Sr e mãe
  do noivo.

  ## Contexto regional e migratório

  Nova Friburgo foi criada por decreto real em 16 de maio de 1818 para assentar famílias
  católicas suíças na Fazenda do Morro Queimado, e o recrutamento que se seguiu atraiu muito
  mais gente do que as cem famílias contratadas — cerca de 261–265 famílias, de Solothurn tanto
  quanto de Friburgo, Valais e Berna. [CONTEXTUAL] Partiram dos portos do Mar do Norte no fim de
  1819, perderam cerca de um quarto de seu número para doenças no mar e foram assentadas em
  lotes serranos pobres e pequenos demais para entregar o que se prometera; muitas famílias os
  abandonaram em poucos anos. [CONTEXTUAL] O que um documento retido estabelece sobre esta
  família é estreito e firme: o filho morava na freguesia de São João Baptista e ali se casou em
  julho de 1829, com a mãe nomeada e o pai morto. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde o
  filho se casou em julho de 1829, o único evento que a nomeia. A catedral atual foi inaugurada
  em 1869; o ato pertence à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Cantão de Solothurn — freguesia não resolvida.** A freguesia da família é dada como "São
  Lucas" e não foi identificada com nenhuma paróquia de Solothurn; a pista concorrente nomeia
  Grindel, cuja Kath. Pfarrkirche St. Stephan fica em 4247 Grindel ·
  [Mapa](https://maps.google.com/?q=47.3833,7.5042). Nenhuma das duas é sítio documentado para
  ela. [UNLOCATED]

  - **Cabeceiras do Macaé, distrito de Nova Friburgo, RJ** — o lugar relatado de sua morte, em
  1836, apenas por atribuição de blog. Nenhum documento retido a situa ali. [UNLOCATED]
