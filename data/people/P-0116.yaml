notes:
- text: >-
    Mother of José Eggendorn (P-0101); named as the wife of the deceased José Geggendorn in her
    son's 1829 Nova Friburgo marriage (PAR-0073). She is not marked deceased in that record. The
    family's parish was São Lucas, Cantão de Soleure (Solothurn); her own origin is not separately
    stated, so nationality is left unset. Clearly deceased (mother of a man marrying in 1829).
- text: >-
    [LEAD — collaborative blog, not evidence] The same Nova Friburgo genealogy blog (Raibert,
    Blogspot 2012) gives her as Anna Maria Lutz, b. 14 Apr 1767, d. 27 May 1836 at Cabeceiras do
    Macaé (Nova Friburgo). Not promoted; unconfirmed by a held record.
