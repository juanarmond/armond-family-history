  mother of the groom).
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Nomeada ao lado do "defunto Joze Geggendorn" no casamento de seu filho em 1829 em Nova Friburgo — ela própria não é descrita como falecida —, o que indica que aparentemente ainda estava viva quando o filho casou na Matriz de São João Baptista. Se chegou viva a 1829, já havia sobrevivido aos anos mais difíceis do assentamento fundador.

  - **[INFERRED]** A origem suíça da família está estabelecida pelo local de nascimento declarado do filho na Freguesia de São Lucas, Cantão de Soleure; ela integra o grupo coeso de colonos de Solothurn (Borer, Wehrli, Freese, Heggendorn) que se estabeleceu junto em Nova Friburgo e se intercruzou por gerações.

  - **[CONTEXTUAL]** Uma pista de fonte secundária (blog genealógico de Nova Friburgo) a identifica como Anna Maria Lutz, nascida em 1767, falecida em 1836 em Cabeceiras do Macaé. Se correto, sobreviveu na colônia até quase os setenta anos — uma longevidade notável para uma colona de primeira geração nas décadas iniciais e desafiantes de Nova Friburgo.

  ## Identidade

  **Maria Lutz** — conhecida apenas como esposa do falecido José Eggendorn no assento de
  casamento de 1829 de Nova Friburgo. Nomeada ao lado do "defunto Joze Geggendorn" como mãe do
  noivo; não é descrita como falecida nesse registo (PAR-0073, família F-0058).
  [STRONG-EVIDENCE] A freguesia da família era São Lucas, Cantão de Soleure (Solothurn, Suíça),
  estabelecida pelo local de nascimento declarado do filho; a própria origem de Maria não é
  declarada separadamente, pelo que a nacionalidade não é atribuída. Claramente falecida (mãe de
  um homem que se casou em 1829).

  Um blog genealógico de Nova Friburgo (Raibert, Blogspot 2012) identifica-a como Anna Maria
  Lutz, nascida a 14 de abril de 1767, falecida a 27 de maio de 1836, em Cabeceiras do Macaé
  (Nova Friburgo). [LEAD — não promovido; datas não confirmadas por nenhum documento retido]

