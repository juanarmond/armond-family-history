profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Named alongside "defunto Joze Geggendorn" in her son's 1829 Nova Friburgo marriage — not described as deceased herself — meaning she was apparently still alive when her son married at the Matriz de São João Baptista. If she reached 1829 alive, she had already outlived the hardest years of the founding settlement.

  - **[INFERRED]** The family's Swiss origin is established by her son's stated birthplace in São Lucas, Canton Solothurn; she is part of the tight Solothurn colonist cluster (Borer, Wehrli, Freese, Heggendorn) who settled together in Nova Friburgo and intermarried across generations.

  - **[CONTEXTUAL]** A secondary-source lead (a Nova Friburgo genealogy blog) gives her as Anna Maria Lutz, born 1767, died 1836 at Cabeceiras do Macaé. If accurate, she survived in the colony into her late sixties — a remarkable lifespan for a first-generation settler in the challenging early decades of Nova Friburgo.

  ## Identity

  **Maria Lutz** — known only as the wife of the deceased José Eggendorn in her son's 1829 Nova
  Friburgo marriage act. Named alongside "defunto Joze Geggendorn" as the mother of the groom;
  she is not described as deceased in that record (PAR-0073, family F-0058). [STRONG-EVIDENCE]
  The family's parish was São Lucas, Cantão de Soleure (Solothurn, Switzerland), established by
  her son's stated birthplace; her own origin is not separately stated, so nationality is left
  unset. Clearly deceased (mother of a man marrying in 1829).

  A Nova Friburgo genealogy blog (Raibert, Blogspot 2012) gives her as Anna Maria Lutz, born
  14 April 1767, died 27 May 1836, at Cabeceiras do Macaé (Nova Friburgo). [LEAD — not
  promoted; dates unconfirmed by any held record]

  ## Open questions

  - Her own birth, marriage, death, and origin records (no held primary). [OPEN]

  ## Sources held (this repository)

