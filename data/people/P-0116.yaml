profile: >-
  ## Identity

  **Maria Lutz** — known only as the wife of the deceased José Eggendorn in her son's 1829 Nova
  Friburgo marriage act. Named alongside "defunto Joze Geggendorn" as the mother of the groom;
  she is not described as deceased in that record (PAR-0073, family F-0058). [STRONG-EVIDENCE]
  The family's parish was São Lucas, Cantão de Soleure (Solothurn, Switzerland), established by
  her son's stated birthplace; her own origin is not separately stated, so nationality is left
  unset. Clearly deceased (mother of a man marrying in 1829).

  A Nova Friburgo genealogy blog (Raibert, Blogspot 2012) gives her as Anna Maria Lutz, born
  14 April 1767, died 27 May 1836, at Cabeceiras do Macaé (Nova Friburgo). [LEAD — not
  promoted; dates unconfirmed by any held record]

  ## Open questions

  - Her own birth, marriage, death, and origin records (no held primary). [OPEN]

  ## Sources held (this repository)

  - PAR-0073 (her son's 1829 Nova Friburgo marriage — the sole held record naming her, as the
  mother of the groom).
profile_pt: >-
  ## Identidade

  **Maria Lutz** — conhecida apenas como esposa do falecido José Eggendorn no assento de
  casamento de 1829 de Nova Friburgo. Nomeada ao lado do "defunto Joze Geggendorn" como mãe do
  noivo; não é descrita como falecida nesse registo (PAR-0073, família F-0058).
  [STRONG-EVIDENCE] A freguesia da família era São Lucas, Cantão de Soleure (Solothurn, Suíça),
  estabelecida pelo local de nascimento declarado do filho; a própria origem de Maria não é
  declarada separadamente, pelo que a nacionalidade não é atribuída. Claramente falecida (mãe de
  um homem que se casou em 1829).

  Um blog genealógico de Nova Friburgo (Raibert, Blogspot 2012) identifica-a como Anna Maria
  Lutz, nascida a 14 de abril de 1767, falecida a 27 de maio de 1836, em Cabeceiras do Macaé
  (Nova Friburgo). [LEAD — não promovido; datas não confirmadas por nenhum documento retido]

  ## Questões em aberto

  - Seus registros de nascimento, casamento, óbito e origem (nenhuma fonte primária retida).
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0073 (casamento de 1829 do seu filho em Nova Friburgo — o único documento retido que
  a nomeia, como mãe do noivo).
