profile: >-
  ## Identity

  **Anna Joaquina da Conceição** — so named in the 21 October 1821 Itaboraí baptism of
  her grandson Antonio (PAR-0101), and "Anna Maria da Conceição" in the 4 March 1841
  baptisms of her grandchildren João and Maria (PAR-0102), where the scribe began
  "Maria", wrote "digo" and corrected it [PROVEN as written]. Both records pair her
  with José Henriques de Mattos (P-0132) as the paternal grandparents of children of
  Manoel de Lemos Pereira and Maria Thereza de Jesus. She is the mother of Manoel de
  Lemos Pereira (P-0052) [STRONG], hence Rosa Eugenia de Lemos's (P-0035) paternal
  grandmother.

  - **Nationality:** Brazilian — "todos naturaes desta Freguezia" (Itaboraí) [PROVEN as
  written; the generic formula is read as covering her].

  - **Birth, marriage, death:** none located; born no later than about 1785
  [INFERRED].

  ## Evidence standing

  The two entries are original parish records, read from the images [PROVEN]. Two
  links are inferred rather than stated. That "Anna Joaquina" (1821) and "Anna Maria"
  (1841) are one woman rests on the same husband and the same son's household
  [INFERRED, strong]. That the Manoel de Lemos Pereira of these records is Rosa's
  father rests on identical names in the same parish register series and on the two
  records agreeing on all four grandparents [STRONG].

  ## Open questions

  - Her usual name — Anna Joaquina or Anna Maria — and her own baptism, marriage and
  death (Itaboraí, off the filmed books before 1821, per the retrieval side) [OPEN].

  - In the family of a probable daughter, Maria Luiza de Jezus (wife of Laureano
  Antonio da Costa), she is reportedly "Anna Joaquina" (1821) and "Anna Joaquina de
  Jezus" (1833, 1840) [LEAD — images not held].

  ## Sources held (this repository)

  - PAR-0101 (Antonio's 1821 Itaboraí baptism — "Anna Joaquina da Conceição").

  - PAR-0102 (João's and Maria's 1841 Itaboraí baptisms — "Ma-ria digo, de Anna Maria
  da Conceição" / "Anna Maria da Conceição").
profile_pt: >-
  ## Identidade

  **Anna Joaquina da Conceição** — assim nomeada no batismo de seu neto Antonio, em
  Itaboraí, de 21 de outubro de 1821 (PAR-0101), e "Anna Maria da Conceição" nos
  batismos de seus netos João e Maria, de 4 de março de 1841 (PAR-0102), onde o
  escrivão começou "Maria", escreveu "digo" e corrigiu [PROVEN como escrito]. Os dois
  registros a emparelham com José Henriques de Mattos (P-0132) como avós paternos de
  filhos de Manoel de Lemos Pereira e Maria Thereza de Jesus. É a mãe de Manoel de
  Lemos Pereira (P-0052) [STRONG], portanto avó paterna de Rosa Eugenia de Lemos
  (P-0035).

  - **Nacionalidade:** brasileira — "todos naturaes desta Freguezia" (Itaboraí)
  [PROVEN como escrito; a fórmula genérica é lida como abrangendo-a].

  - **Nascimento, casamento, óbito:** nenhum localizado; nascida no máximo por volta
  de 1785 [INFERRED].

  ## Situação da evidência

  Os dois assentos são registros paroquiais originais, lidos nas imagens [PROVEN].
  Dois vínculos são inferidos, não declarados. Que "Anna Joaquina" (1821) e "Anna
  Maria" (1841) sejam uma só mulher apoia-se no mesmo marido e no mesmo domicílio do
  filho [INFERRED, forte]. Que o Manoel de Lemos Pereira desses registros seja o pai
  de Rosa apoia-se em nomes idênticos na mesma série de livros da freguesia e na
  concordância dos dois registros quanto aos quatro avós [STRONG].

  ## Questões em aberto

  - Seu nome habitual — Anna Joaquina ou Anna Maria — e seu próprio batismo, casamento
  e óbito (Itaboraí, fora dos livros filmados antes de 1821, segundo a pesquisa de
  recuperação) [OPEN].

  - Na família de uma provável filha, Maria Luiza de Jezus (mulher de Laureano Antonio
  da Costa), ela seria "Anna Joaquina" (1821) e "Anna Joaquina de Jezus" (1833, 1840)
  [LEAD — imagens não disponíveis].

  ## Fontes disponíveis (neste repositório)

  - PAR-0101 (batismo de Antonio em Itaboraí, 1821 — "Anna Joaquina da Conceição").

  - PAR-0102 (batismos de João e Maria em Itaboraí, 1841 — "Ma-ria digo, de Anna Maria
  da Conceição" / "Anna Maria da Conceição").
