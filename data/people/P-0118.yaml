profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Recorded only as "de sua mulher Anna Maria, já falecida" — wife of Jacob Frees, already dead by July 1829. The omission of her maiden surname was common in early Nova Friburgo marriage acts when the mother was deceased and her maiden name was unknown to the priest or the family present.

  - **[INFERRED]** She died before July 1829, likely in the early years of the colony's founding settlement — when the 1819–1820 arrivals faced high mortality from disease, the unfamiliar climate, and the hardships of establishing a new community in the Serra Fluminense highlands.

  - **[CONTEXTUAL]** A secondary-source lead (a Nova Friburgo genealogy blog) suggests her possible full name as "Anna Maria Hartmann Storck" — which, if accurate, would mean she shared the Storck surname with Elisabeth Storck (P-0110), pointing to the dense endogamous web of colonist families in early Nova Friburgo.

  ## Identity

  **Anna Maria** — known only as the deceased wife of Jacob Frees in her daughter's 1829 Nova
  Friburgo marriage act. Named as "de sua mulher Anna Maria, já falecida" — wife of Jacob Frees
  — in the act recording her daughter Anna Maria Frees's marriage to José Eggendorn; already
  deceased by July 1829 (PAR-0073, family F-0059). [STRONG-EVIDENCE] Her maiden surname is
  unrecorded; no further detail is stated in the held source.

  A Nova Friburgo genealogy blog (Raibert, Blogspot 2012) names Jacob Freese's wife as "Anna
  Maria Hartmann Storck," providing a possible maiden surname. [LEAD — recorded only as a lead
  for her maiden name; not promoted; the 1829 marriage act names her only as "Anna Maria"]

  ## Open questions

  - Her maiden surname (unrecorded in the 1829 act). [OPEN]

  - Her own birth, death, and origin records (no held primary). [OPEN]

  ## Sources held (this repository)

  - PAR-0073 (her daughter's 1829 Nova Friburgo marriage — the sole held record naming her,
  only as "Anna Maria, já falecida," wife of Jacob Frees).
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Registrada apenas como "de sua mulher Anna Maria, já falecida" — esposa de Jacob Frees, já morta em julho de 1829. A omissão de seu sobrenome de solteira era comum nos primeiros assentos de casamento de Nova Friburgo quando a mãe havia falecido e seu nome de solteira era desconhecido do padre ou da família presente.

  - **[INFERRED]** Faleceu antes de julho de 1829, provavelmente nos primeiros anos do assentamento fundador da colônia — quando os chegados de 1819–1820 enfrentavam alta mortalidade por doenças, clima desconhecido e as privações de estabelecer uma nova comunidade nas serras fluminenses.

  - **[CONTEXTUAL]** Uma pista de fonte secundária (blog genealógico de Nova Friburgo) sugere que seu nome completo possível seria "Anna Maria Hartmann Storck" — o que, se correto, significaria que partilhava o sobrenome Storck com Elisabeth Storck (P-0110), apontando para a densa rede endogâmica de famílias colonas no início de Nova Friburgo.

  ## Identidade

  **Anna Maria** — conhecida apenas como esposa falecida de Jacob Frees no assento de casamento
  de 1829 de Nova Friburgo. Nomeada como "de sua mulher Anna Maria, já falecida" — esposa de
  Jacob Frees — no assento que regista o casamento da sua filha Anna Maria Frees com José
  Eggendorn; já falecida em julho de 1829 (PAR-0073, família F-0059). [STRONG-EVIDENCE] O
  apelido de solteira não está registado; nenhum outro detalhe é declarado na fonte retida.

  Um blog genealógico de Nova Friburgo (Raibert, Blogspot 2012) identifica a esposa de Jacob
  Freese como "Anna Maria Hartmann Storck," sugerindo um possível apelido de solteira. [LEAD —
  registado apenas como pista para o apelido de solteira; não promovido; o assento de 1829
  nomeia-a apenas como "Anna Maria"]

