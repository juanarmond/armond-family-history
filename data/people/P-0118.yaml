notes:
- text: >-
    Mother of Anna Maria Frees (P-0102); named only as "de sua mulher Anna Maria, já falecida"
    (already deceased) — the wife of Jacob Frees — in her daughter's 1829 Nova Friburgo marriage
    (PAR-0073). Her maiden surname is not recorded, so no surname is asserted; nationality unset.
    Deceased by 1829.
- text: >-
    [LEAD — collaborative blog, not evidence] A Nova Friburgo genealogy blog (Raibert, Blogspot
    2012) gives Jacob Freese's wife — and this Anna Maria's likely full name — as "Anna Maria
    Hartmann Storck". Recorded only as a lead for her maiden surname; the primary 1829 marriage act
    names her just "Anna Maria", so no surname is asserted here.
