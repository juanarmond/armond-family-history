profile: >-
  ## Interesting facts

  - **[PROVEN]** She has no surname in this archive because the record gave her none. Her
  daughter's 1829 Nova Friburgo marriage names her only "de sua mulher **Anna Maria, já
  falecida**" — his wife Anna Maria, already dead. Two given names, a marital relationship and a
  death, and that is the complete documentary record of her life. (PAR-0073)

  - **[PROVEN]** She was dead before 20 July 1829, and her husband Jacob Frees was not: the
  clerk qualified her and not him. Her daughter married without a living mother.

  - **[CONTEXTUAL]** Leaving out a deceased mother's maiden surname was ordinary practice in
  Nova Friburgo marriage acts of this period, especially when nobody at the ceremony could
  supply it. The omission is a habit of the register, not evidence that she was unknown to her
  family.

  - **[LEAD]** A Nova Friburgo genealogy blog proposes "Anna Maria Hartmann Storck" as the full
  name of Jacob Frees's wife. If that were ever confirmed it would put a Storck in this branch
  as well as in the Rutschmann one — which is a reason to be careful with it, not a reason to
  adopt it. The 1829 act says only "Anna Maria", and so does this profile.

  ## Identity

  **Anna Maria** — the deceased wife of Jacob Frees (P-0117) and mother of Anna Maria Frees
  (P-0102), named in her daughter's 1829 Nova Friburgo marriage act. Iris Bohrer Muniz's
  (P-0007) 3×-great-grandmother, by the chain Anna Maria Frees → Maria Thecla Regina Eggendorn
  (P-0071) → Valentim Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN that
  she is named; degree derived from the family links]

  - **Named in one record:** PAR-0073, 20 July 1829, as "de sua mulher Anna Maria, já falecida";
  family F-0059. [PROVEN]

  - **Maiden surname:** not recorded. None is asserted here, and the collaborative form
  "Hartmann Storck" is held as a lead only. [OPEN]

  - **Death:** before 20 July 1829. No date, place or cause is given. [PROVEN for the bracket
  only]

  - **Birth, origin, nationality:** entirely undocumented. The Swiss parish and canton written
  in the act belong to her daughter's birthplace and cannot be read; nothing is stated about her
  own. Nationality is left unset for that reason. [OPEN by decision]

  ## Standing and profession

  Nothing at all — and in her case the blank is close to total. She is one clause in one
  register entry: a wife, dead. No occupation, residence, property, literacy or signature exists
  for her anywhere in this archive.

  ## Family and social network

  Her only documented relationships are to her husband and her daughter. Jacob Frees survived
  her; their daughter Anna Maria Frees married José Eggendorn at the Matriz de São João
  Baptista, Nova Friburgo, on 20 July 1829, with José Maria Dubra and Anna Maria Geggendorn as
  witnesses. [PROVEN — PAR-0073] Sixteen years later the same daughter's own child was baptised
  with Pedro and Regina Freese as godparents, which shows a Frees kin group still in the parish
  — but no held record connects any of them to her personally. [PROVEN for the godparents; the
  kin link is OPEN]

  ## What we can extrapolate

  - **[CONTEXTUAL]** Her family was Swiss, on the strength of the canton recorded (illegibly)
  for her daughter, and therefore part of the 1819–20 Nova Friburgo emigration set in motion by
  Dom João VI's decree of 16 May 1818. That cohort left a countryside ruined by the 1816–17
  harvest failures and post-Napoleonic poverty, and lost roughly a quarter of its people to
  typhus and scurvy on the crossing.

  - **[INFERRED]** A mother dead before her daughter's 1829 marriage is exactly what that
  cohort's mortality produces, whether on the voyage or in the colony's first difficult years.
  But the record fixes only the fact of death, and the honest position is to leave the cause,
  place and date blank rather than supply a plausible one.

  - **[CONTEXTUAL]** The absence of her surname is the substantive finding, not a cosmetic gap.
  It is where the Frees maternal line ends in this archive, and it ends because of a scribal
  convention — the register simply did not require a dead woman's maiden name.

  ## Open questions

  - Her maiden surname, omitted from the 1829 act. A Swiss marriage record for Jacob Frees, or a
  baptism entry for one of their children, would supply it. [OPEN]

  - Her birth, origin and death — no record held. [OPEN]

  - Whether "Anna Maria Hartmann Storck" is her, as one genealogy blog suggests. Not adopted.
  [LEAD]

  - Her nationality, left unset on purpose because no held record states where she was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0073** — her daughter Anna Maria's 1829 Nova Friburgo marriage to José Eggendorn; the
  sole held record naming her, and then only as "Anna Maria, já falecida", wife of Jacob Frees.

  ## Regional and migration context

  Nova Friburgo was decreed on 16 May 1818 and settled from late 1819 by Swiss families
  recruited well beyond the hundred contracted — some 261–265 households from Fribourg,
  Solothurn, Valais and Bern, who travelled from Estavayer-le-Lac by way of Basel and Rotterdam
  and sailed from the North Sea ports. [CONTEXTUAL] About a quarter did not survive the journey,
  and those who did received small, stony highland lots; many abandoned them within a few years.
  [CONTEXTUAL] The only fact a held record supplies about this woman's connection to any of it
  is indirect: her daughter was born and baptised in a Swiss canton and was living in the parish
  of São João Baptista by 1829. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  daughter married in July 1829, in the act that names her. The present cathedral was
  inaugurated in 1869; the act belongs to the earlier church on the same site. [RESOLVED]

  - **Switzerland — origin unreadable.** The canton written for her daughter's birth cannot be
  read, and nothing at all is recorded about her own origin, so there is no place to name.
  Recovering that reading is the prerequisite. [UNLOCATED]

  - **No burial place is known.** She died before July 1829, in an unrecorded place; there is no
  cemetery, parish or site that any evidence connects to her death. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela não tem sobrenome neste arquivo porque o registro não lhe deu nenhum. O
  casamento de sua filha, em 1829, em Nova Friburgo, nomeia-a apenas "de sua mulher **Anna
  Maria, já falecida**". Dois prenomes, uma relação conjugal e uma morte: esse é o registro
  documental completo de sua vida. (PAR-0073)

  - **[PROVEN]** Estava morta antes de 20 de julho de 1829, e seu marido Jacob Frees não: o
  escrivão a qualificou e não o qualificou. A filha casou-se sem mãe viva.

  - **[CONTEXTUAL]** Omitir o sobrenome de solteira de uma mãe falecida era prática corrente nos
  assentos de casamento de Nova Friburgo naquele período, sobretudo quando ninguém presente à
  cerimônia podia informá-lo. A omissão é hábito do livro, não prova de que ela fosse
  desconhecida da própria família.

  - **[LEAD]** Um blog genealógico de Nova Friburgo propõe "Anna Maria Hartmann Storck" como
  nome completo da esposa de Jacob Frees. Se algum dia se confirmasse, colocaria uma Storck
  também neste ramo, além do ramo Rutschmann — o que é motivo para cautela, não para adoção. O
  ato de 1829 diz apenas "Anna Maria", e este perfil também.

  ## Identidade

  **Anna Maria** — a esposa falecida de Jacob Frees (P-0117) e mãe de Anna Maria Frees (P-0102),
  nomeada no assento de casamento da filha, em 1829, em Nova Friburgo. Tetravó de Iris Bohrer
  Muniz (P-0007), pela cadeia Anna Maria Frees → Maria Thecla Regina Eggendorn (P-0071) →
  Valentim Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN que é nomeada;
  grau derivado dos vínculos familiares]

  - **Nomeada em um registro:** PAR-0073, 20 de julho de 1829, como "de sua mulher Anna Maria,
  já falecida"; família F-0059. [PROVEN]

  - **Sobrenome de solteira:** não registrado. Nenhum é afirmado aqui, e a forma colaborativa
  "Hartmann Storck" é mantida apenas como pista. [OPEN]

  - **Óbito:** antes de 20 de julho de 1829. Nenhuma data, lugar ou causa é indicada. [PROVEN
  apenas quanto ao intervalo]

  - **Nascimento, origem e nacionalidade:** inteiramente não documentados. A freguesia e o
  cantão suíços escritos no ato referem-se ao local de nascimento da filha e não podem ser
  lidos; nada se declara sobre os dela. Por isso a nacionalidade fica em aberto. [OPEN por
  decisão]

  ## Posição social e profissão

  Absolutamente nada — e, no caso dela, a lacuna é quase total. É uma cláusula num assento: uma
  esposa, morta. Não existe para ela, em parte alguma deste arquivo, ocupação, residência,
  propriedade, alfabetização ou assinatura.

  ## Família e rede social

  Suas únicas relações documentadas são com o marido e com a filha. Jacob Frees sobreviveu-lhe;
  a filha, Anna Maria Frees, casou-se com José Eggendorn na Matriz de São João Baptista, em Nova
  Friburgo, em 20 de julho de 1829, tendo José Maria Dubra e Anna Maria Geggendorn como
  testemunhas. [PROVEN — PAR-0073] Dezesseis anos depois, a filha dessa filha foi batizada com
  Pedro e Regina Freese como padrinhos, o que mostra um grupo de parentes Frees ainda na
  freguesia — mas nenhum documento retido liga qualquer deles a ela pessoalmente. [PROVEN quanto
  aos padrinhos; o vínculo de parentesco está OPEN]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Sua família era suíça, com base no cantão registrado (ilegivelmente) para a
  filha, e portanto parte da emigração de 1819–20 para Nova Friburgo, posta em marcha pelo
  decreto de Dom João VI de 16 de maio de 1818. Essa coorte deixou um campo arruinado pelas
  quebras de safra de 1816–17 e pela pobreza pós-napoleônica, e perdeu cerca de um quarto de sua
  gente para tifo e escorbuto na travessia.

  - **[INFERRED]** Uma mãe morta antes do casamento da filha em 1829 é exatamente o que a
  mortalidade dessa coorte produz, seja na viagem, seja nos difíceis primeiros anos da colônia.
  Mas o registro fixa apenas o fato da morte, e a posição honesta é deixar causa, lugar e data
  em branco, em vez de fornecer uma versão plausível.

  - **[CONTEXTUAL]** A ausência de seu sobrenome é o achado substantivo, não uma lacuna
  cosmética. É onde a linha materna Frees termina neste arquivo, e termina por uma convenção de
  escrita: o livro simplesmente não exigia o nome de solteira de uma mulher morta.

  ## Questões em aberto

  - Seu sobrenome de solteira, omitido no ato de 1829. Um registro de casamento suíço de Jacob
  Frees, ou um assento de batismo de algum filho do casal, o forneceria. [OPEN]

  - Seu nascimento, sua origem e seu óbito — nenhum registro disponível. [OPEN]

  - Se "Anna Maria Hartmann Storck" é ela, como sugere um blog genealógico. Não adotado. [LEAD]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — casamento de 1829, em Nova Friburgo, da filha Anna Maria com José Eggendorn;
  o único documento retido que a nomeia, e ainda assim apenas como "Anna Maria, já falecida",
  esposa de Jacob Frees.

  ## Contexto regional e migratório

  Nova Friburgo foi decretada em 16 de maio de 1818 e povoada a partir do fim de 1819 por
  famílias suíças recrutadas muito além das cem contratadas — cerca de 261–265 domicílios de
  Friburgo, Solothurn, Valais e Berna, que viajaram de Estavayer-le-Lac por Basileia e Roterdã e
  embarcaram nos portos do Mar do Norte. [CONTEXTUAL] Cerca de um quarto não sobreviveu à
  viagem, e os que sobreviveram receberam lotes serranos pequenos e pedregosos; muitos os
  abandonaram em poucos anos. [CONTEXTUAL] O único fato que um documento retido fornece sobre a
  ligação desta mulher com tudo isso é indireto: sua filha nasceu e foi batizada num cantão
  suíço e morava na freguesia de São João Baptista em 1829. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em julho de 1829, no ato que a nomeia. A catedral atual foi inaugurada em 1869;
  o ato pertence à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Suíça — origem ilegível.** O cantão escrito para o nascimento da filha não pode ser lido,
  e nada se registra sobre a origem dela própria, de modo que não há lugar a nomear. Recuperar
  essa leitura é o pré-requisito. [UNLOCATED]

  - **Nenhum lugar de sepultamento é conhecido.** Morreu antes de julho de 1829, em lugar não
  registrado; não há cemitério, freguesia ou sítio que alguma evidência conecte à sua morte.
  [UNLOCATED]
