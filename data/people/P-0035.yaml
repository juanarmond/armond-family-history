  ## Contexto regional e migratório

  Nascida e batizada em Itaboraí (RJ), um município rural a leste da Baía de Guanabara, era
  uma fluminense das terras baixas, não uma colona. [CONTEXTUAL] Mudou-se para a serra de
  Nova Friburgo ao se casar com o colono Francisco José Bohrer — uma migração em cadeia por
  casamento, das terras baixas para a colônia suíça, e o único fio não colono deste ramo.
  Parte dos Lemos a seguiu serra acima: seu irmão Candido aparece em Nova Friburgo em 1884 e
  1888 (PAR-0056, PRB-0005).

  - **Na serra.** Seu domicílio de casada ficava no Alto da Serra de Nova Friburgo, onde o marido
  morava ao falecer em 1888 (PAR-0055) [PROVEN]; ela faleceu em 1919 "moradora nesta da Nova
  Friburgo" (PAR-0058) [PROVEN]. Seu irmão Candido testemunhou ali o casamento de 1884 do filho
  dela e foi nomeado testamenteiro do marido em 1888 (PAR-0056, PRB-0005) [PROVEN]. A nota de
  falecimento de 1898 de seu irmão Manoel, no jornal de Nova Friburgo, chama-o "o conhecido
  industrial da Venda das Pedras" (NWS-0002) sem dizer onde morreu; uma localidade desse nome fica
  em Itaboraí [identificação incerta], de modo que a nota, por si só, não mostra que ele se mudou
  para a serra.

