- text: >-
    Ahnentafel position 61 — mother of Joaquim José Bohrer (P-0030), hence Celina's
    (P-0015) paternal grandmother. Wife of Francisco José Bohrer (P-0034); their
    marriage was justified at the Nova Friburgo Matriz in 1879 (PAR-0002) and she
    is named as "Roza Eugenia de Lemos Bohrer" in Alberto Bohrer's 1890 birth
    (CIV-0019). "de Lemos" is her own surname, "Bohrer" her married name; both
    forms are preserved.
  text_pt: >-
    Posição 61 no Ahnentafel — mãe de Joaquim José Bohrer (P-0030), portanto avó
    paterna de Celina (P-0015). Esposa de Francisco José Bohrer (P-0034); o casamento
    deles foi justificado na Matriz de Nova Friburgo em 1879 (PAR-0002) e ela é
    nomeada como "Roza Eugenia de Lemos Bohrer" no nascimento de 1890 de Alberto
    Bohrer (CIV-0019). "de Lemos" é seu sobrenome próprio, "Bohrer" seu nome de
    casada; ambas as formas são preservadas.
- text: >-
    Parentage established (1 August 2026) from her own 1835 Itaboraí baptism
    (PAR-0016 → event E-0049): daughter of Manoel de Lemos [Pereira] (P-0052) and
    Maria Thereza de Jesus (P-0053), the Lemos family of Itaboraí, RJ (family
    F-0025). The register records only the forename "Roza", so the identity is
    strong-evidence, not direct — she is the couple's only Roza across the browsed
    1832-1838 Itaboraí baptisms, in the parish where her 1879 marriage justification
    was held (PAR-0002, "em casa do pai de José Antunes de Lemos"), and her brother
    Candido Pereira de Lemos is named in her husband's 1888 will (PRB-0005). This
    supersedes the earlier "weakened" doubt (the apparent childbearing gap was an
    indexing artifact). Born about late 1834 ("nascida a dez mezes").
  text_pt: >-
    Filiação estabelecida (1 de agosto de 2026) a partir de seu próprio batismo de 1835
    em Itaboraí (PAR-0016 → evento E-0049): filha de Manoel de Lemos [Pereira] (P-0052)
    e Maria Thereza de Jesus (P-0053), a família Lemos de Itaboraí, RJ (família F-0025).
    O assento registra apenas o prenome "Roza", de modo que a identidade é de forte
    evidência, não direta — ela é a única Roza do casal entre os batismos consultados de
    Itaboraí de 1832-1838, na freguesia onde se realizou a justificação de seu casamento
    de 1879 (PAR-0002, "em casa do pai de José Antunes de Lemos"), e seu irmão Candido
    Pereira de Lemos é nomeado no testamento de 1888 de seu marido (PRB-0005). Isso
    supera a dúvida anterior "enfraquecida" (o aparente intervalo entre partos era um
    artefato de indexação). Nascida por volta do final de 1834 ("nascida a dez mezes").
- text: >-
    Nationality now Brazilian: her parents are "naturaes desta freguezia" of
    Itaboraí (PAR-0016), so an Itaboraí (Brazilian) birth is secure — a documented
    origin, not a surname inference.
  text_pt: >-
    Nacionalidade agora brasileira: seus pais são "naturaes desta freguezia" de
    Itaboraí (PAR-0016), de modo que um nascimento em Itaboraí (Brasil) é seguro — uma
    origem documentada, não uma inferência a partir do sobrenome.
- text: >-
    Alive in early 1898 as "D. Roza Bohrer": the A Sentinella death notice of her
    brother Manoel Pereira de Lemos (30 Jan 1898, NWS-0002) calls the deceased "irmão
    da Exma. Sra. D. Roza Bohrer". This both documents a new brother of hers (Manoel
    Pereira de Lemos, d. 20 Jan 1898 aged 72 — added as a documented_child on F-0025)
    and confirms Rosa living in January 1898 (aged ~63).
  text_pt: >-
    Viva no início de 1898 como "D. Roza Bohrer": a nota de falecimento de seu irmão
    Manoel Pereira de Lemos em A Sentinella (30 jan. 1898, NWS-0002) chama o falecido de
    "irmão da Exma. Sra. D. Roza Bohrer". Isso documenta um novo irmão dela (Manoel
    Pereira de Lemos, falecido em 20 jan. 1898 aos 72 anos — acrescentado como filho
    documentado em F-0025) e confirma Rosa viva em janeiro de 1898 (com ~63 anos).
- text: >-
    Death now held (supersedes the earlier "death not documented" working note): she died 2
    November 1919 at Nova Friburgo, aged 86, "viúva de Francisco José Bohrer" and "natural de
    Itaboraí" (PAR-0058, event E-0086). Her husband Francisco José predeceased her on 6 July
    1888 (PAR-0055), so she was a widow for 31 years. The 1919 death names her parents in a
    divergent "Pereira" form ("Manoel Pereira Lemos × Maria Tereza Pereira de Lemos"); the 1835
    baptism's "Manoel de Lemos × Maria Thereza de Jesus" (P-0052 × P-0053) is nearer the events
    and governs, with the "Pereira" form preserved as a variant.
  text_pt: >-
    Óbito agora obtido (supera a antiga nota de trabalho "óbito não documentado"): faleceu em 2
    de novembro de 1919 em Nova Friburgo, aos 86 anos, "viúva de Francisco José Bohrer" e
    "natural de Itaboraí" (PAR-0058, evento E-0086). Seu marido Francisco José faleceu antes
    dela, em 6 de julho de 1888 (PAR-0055), de modo que foi viúva por 31 anos. O óbito de 1919
    nomeia seus pais numa forma divergente com "Pereira" ("Manoel Pereira Lemos × Maria Tereza
    Pereira de Lemos"); a forma do batismo de 1835, "Manoel de Lemos × Maria Thereza de Jesus"
    (P-0052 × P-0053), é mais próxima do evento e prevalece, preservando-se a forma "Pereira"
    como variante.
profile: >-
  ## Interesting facts

  - **[PROVEN]** She was born in Itaboraí (RJ) about 1834 — her October 1835 baptism records her "nascida a dez mezes" (born ten months prior, PAR-0016) — and died in Nova Friburgo on 2 November 1919, aged 86 (PAR-0058). Her life spanned 85 years across two provinces, two political regimes and the end of slavery.

  - **[PROVEN]** She was widowed in 1888 when her husband Francisco José died of cardiac failure (PAR-0055), and lived as a widow for 31 years — dying in 1919 having outlived her husband by more than three decades.

  - **[PROVEN]** In January 1898, *A Sentinella* newspaper referred to her as "Exma. Sra. D. Roza Bohrer" in reporting the death of her brother Manoel Pereira de Lemos (NWS-0002) — the honorifics "Excelentíssima Senhora Dona" marking her as a woman of local social standing in Nova Friburgo.

  - **[INFERRED]** Her marriage to Francisco José Bohrer was celebrated in Itaboraí before the coadjutor, and only formally registered at the Nova Friburgo Matriz in 1879 — meaning the couple likely lived as a married couple for over 20 years before their marriage was officially in the Nova Friburgo parish records. This was common for couples whose marriage was celebrated outside their home parish.

  - **[CONTEXTUAL]** She moved from Itaboraí (a lowland Rio de Janeiro municipality) to the Nova Friburgo highlands on marriage — a migration from the coast into the Swiss colony — and part of the Lemos family followed her: her brother Manoel Pereira de Lemos died at Nova Friburgo in 1898, showing how marriage into the colony could pull a wider family network into the highlands.

  ## Identity

  **Rosa Eugenia de Lemos** — recorded only as the forename "Roza" in her 1835 baptism,
  and in later records under her married form "Roza Eugenia de Lemos Bohrer" / "D. Roza
  Bohrer". [PROVEN] The Bohrer birth record (CIV-0019) confirms "de Lemos" is her own
  surname and "Bohrer" her married name.

  - **Born:** about late 1834, Itaboraí (RJ) [INFERRED] — her October 1835 baptism records
  her "nascida a dez mezes" (PAR-0016). Brazilian origin: her parents are "naturaes desta
  freguezia" of Itaboraí (PAR-0016). [PROVEN]

  - **Baptism:** October 1835, Matriz de São João Batista de Itaboraí, "filha legitima de
  Manoel de Lemos [Pereira] (P-0052) e Maria Thereza de Jesus (P-0053)"; godparents Manoel
  José da Silva and Flor de Maria da Conceição (PAR-0016). [PROVEN] The register wrote only
  "Roza"; the identification as Rosa Eugenia rests on the unique couple/parish match and
  the Itaboraí-Lemos links in PAR-0002 and PRB-0005, so it is strong but indirect.

  - **Marriage:** Francisco José Bohrer (P-0034), celebrated at Itaboraí before the
  coadjutor and only judicially justified/registered at the Nova Friburgo Matriz on
  1 August 1879 (PAR-0002) [PROVEN it predates 1879]; an uncertain "more than twenty years"
  clause would place the wedding about 1858. [LEAD]

  - **Children** (with Francisco José): Joaquim José Bohrer (P-0030, firstborn), Laura,
  Guilherme (Samuel) and Fernando, the four heirs of her husband's 1888 will (PRB-0005).
  [PROVEN — will] A daughter **Ludovina Borer** (b. ~21 Jul 1862; d. 27 Dec 1862, NF) died
  in infancy. The held NF-Catedral óbito (Óbito L1 f.147) names **only her father** —
  "filha do Sr. Francisco José Bohrer, morador d'esta Villa"; Rosa is NOT named in that act.
  Rosa's maternity of Ludovina therefore rests on the reconciled registry roster and the
  Lorenz/Bon compilation, not on the held primary. [BORDERLINE — held image names father
  only; LEAD for Rosa's maternity via roster + compilation]

  - **Death:** 2 November 1919 at Nova Friburgo, aged 86 [PROVEN — PAR-0058, event E-0086],
  recorded "viúva de Francisco José Bohrer" and "natural de Itaboraí" (buried the same day by
  the Irmandade do Sacramento). She had been widowed since 6 July 1888 (her husband Francisco
  José's death, PAR-0055) and was still living in January 1898, when the newspaper óbito of her
  brother calls the deceased "irmão da Exma. Sra. D. Roza Bohrer" (NWS-0002). The stated age 86
  implies a birth ~1833 — close to, and superseded by, the ~late-1834 birth from her 1835
  baptism ("nascida a dez mezes").

  ## Standing and profession

  No occupation is recorded for her, as expected for a married woman of her era in these
  records. Her standing is legible through her household and kin: wife of a Nova Friburgo
  landowner, and mother of Guilherme Samuel Bohrer (proprietor of the newspaper A
  Sentinella) and of the merchants Fernando and Joaquim. In the 1898 notice she is styled
  "Exma. Sra. D. Roza Bohrer" — honorifics marking a family of local social standing.
  [PROVEN via NWS-0002 and CIV-0019]

  ## Family and social network

  - **Parents:** Manoel de Lemos [Pereira] (P-0052) and Maria Thereza de Jesus (P-0053),
  an Itaboraí family (family F-0025). [PROVEN via her baptism] Her 1835 baptism writes only
  "Manoel de Lemos" (no "Pereira"); her own 1919 death (PAR-0058) instead names the couple in
  a divergent "Pereira" form — "Manoel Pereira Lemos × Maria Tereza Pereira de Lemos" —
  preserved as a variant, with the nearer-the-event baptism form governing. The "Pereira"
  element also recurs in her brother Candido Pereira de Lemos (PRB-0005).

  - **Siblings:** an Itaboraí register sweep documents Maria (bapt. 14 July 1832,
  PAR-0030), Anna (bapt. 12 February 1834, PAR-0031), Thomaz (bapt. c. June 1836,
  PAR-0032) and Polidoro (bapt. c. November 1838, PAR-0033) as children of the same
  couple. [PROVEN] Two further brothers are documented indirectly: Candido Pereira de
  Lemos, named her husband's brother-in-law and executor in the 1888 will (PRB-0005), and
  Manoel Pereira de Lemos, whose 1898 óbito calls him her brother (NWS-0002). A ⚠ mother-
  name discrepancy runs through the sibling set — "Maria Thereza de Jesus" (PAR-0016,
  PAR-0032) versus "Maria Nunes de Jesus" (PAR-0030, PAR-0031) — preserved as a scribal
  inconsistency for the same woman.

  - **Marriage kin:** she married into the Swiss-immigrant Bohrer family; her husband was
  the Brazil-born son of the Soleure colonists Jacob Borer and Catharina (P-0050, P-0051).

  ## What we can extrapolate

  **The 1879 justificação is best read as an estate act, not a wedding.** [INFERRED] Her
  marriage to Francisco José Bohrer was celebrated at Itaboraí, in a private house, before a
  parish coadjutor, and was never entered in any parish book; a judicial sentence of 30 June
  1879 declared it justified and ordered the Nova Friburgo vicar to open the entry (PAR-0002)
  [PROVEN]. The witnesses deposed that it had stood "a mais de vinte annos" [uncertain reading —
  LEAD], which would put the wedding around 1858 or earlier, and their firstborn Joaquim was
  born about 1861/62 (PAR-0056). So the couple lived some two decades in a union that was
  socially complete and documentarily invisible, and regularised it nine years before the will
  that names their four children "meus unicos e legitimos herdeiros" (PRB-0005). The economical
  reading is that the paperwork was done when there were heirs and an estate to secure — not
  when there was a wedding. The motive is nowhere stated in the act. [INFERRED]

  **Her documented standing is real, and it is entirely of position rather than property.** Her
  husband named her *first* testamenteira and tutora of the children, ahead of her own brother
  Candido Pereira de Lemos and ahead of a family friend (PRB-0005) [PROVEN] — a woman trusted
  with both the estate and the guardianship. In 1898 the town weekly styles her "Exma. Sra. D.
  Roza Bohrer" (NWS-0002) [PROVEN]. In 1919 she is accompanied to burial by the Irmandade do
  Sacramento and buried in the brotherhood's own cemetery, having confessed and received the
  viaticum and unction (PAR-0058) [PROVEN]. Lay-brotherhood burial was a subscribed, dues-paying
  respectability [CONTEXTUAL]: in a household with little capital, standing was expressed
  through church affiliation and honorifics, which cost a subscription, rather than through
  land, which costs a fortune.

  **Thirty-one years a widow is an economic fact, not only a biographical one.**
  [CONTEXTUAL/INFERRED] Francisco José died in July 1888 and she died in November 1919
  (PAR-0055, PAR-0058) [PROVEN]. Under Brazilian succession the widow held her meação — half the
  marital property — for life, so half of the family's only landed holding stayed out of the
  heirs' hands for three decades while the children aged into their fifties and sixties. Nothing
  in the held record shows her buying, selling or trading, and her own death act names no
  property. A widow's half-share, frozen and then divided four ways among heirs who were
  themselves elderly or already dead, is the precise mechanism by which a modest estate becomes
  nothing per head.

  **The Lemos climbed in her own generation, and they climbed by moving.** [INFERRED,
  well-supported] Her parents' Itaboraí records name no land, office or title (PAR-0016,
  PAR-0030–PAR-0033), and not one godparent in that sibling set carries a rank or honorific
  [PROVEN as far as those acts go]. Her generation left: she married into the Nova Friburgo
  colony; her brother Candido Pereira de Lemos appears at Nova Friburgo as a marriage witness in
  1884 (PAR-0056) and as her husband's executor in 1888 (PRB-0005) [PROVEN]; her brother Manoel
  Pereira de Lemos died there in January 1898 as "o conhecido industrial da Venda das Pedras",
  aged 72, a man who "gosava de geral estima de seus conterraneos" (NWS-0002) [PROVEN]. A
  lowland fluminense family with nothing recorded in the 1830s produced, within one generation
  and one migration, an established *industrial* and a *Dona* of the serra. The climb is real —
  and it is a climb into trade and respectability, not into land.

  **The marriage itself was lateral, not a match up or down.** [INFERRED] She brought no
  documented property into the colonist household, and the colonist household had no elite
  fortune to guard; the union grafted a Portuguese-descended lowland family onto a
  Swiss-immigrant serra one at the same modest level. What follows in her children is the
  family's petty-bourgeois plateau — Guilherme's newspaper, Fernando's and Joaquim's trade —
  reached in a single generation and transmitted to none: her granddaughter Celina (P-0015) died
  a working widow who "não deixou bens nem testamento" (CIV-0015) [PROVEN]. Her household is the
  modest local peak of a non-elite arc, not a fall from one.

  ## Open questions

  - Her own death record — now held (PAR-0058: 2 November 1919, Nova Friburgo, aged 86,
  widow of Francisco José, natural de Itaboraí). [RESOLVED]

  - The Itaboraí marriage of her parents, which would settle the "Pereira/Ferreira" and
  "Thereza/Nunes" variants and Manoel de Lemos's own parentage. (Her 1919 death now attests
  the "Pereira" form for both parents, diverging from her baptism.) [OPEN]

  - The exact marriage date behind the 1879 justification. [OPEN]

  ## Sources held (this repository)

  - PAR-0016 (her 1835 Itaboraí baptism — parents, godparents) · PAR-0002 (her 1879
  marriage justification) · PRB-0005 (her husband's 1888 will — names her, the four
  children, and her brother Candido).

  - PAR-0030 / PAR-0031 / PAR-0032 / PAR-0033 (Itaboraí baptisms of her siblings Maria,
  Anna, Thomaz and Polidoro).

  - CIV-0019 (grandson Alberto's 1890 birth — "Roza Eugenia de Lemos Bohrer") · NWS-0002
  (A Sentinella, 1898 — confirms her living and names a brother).

  - PAR-0055 (her husband Francisco José's 1888 Nova Friburgo death — names her as his wife,
  fixing her widowhood from 6 July 1888) · PAR-0058 (her own 1919 Nova Friburgo death — 2
  November 1919, aged 86, widow of Francisco José, natural de Itaboraí; names her parents in a
  divergent "Pereira" form).

  ## Regional and migration context

  Born and baptised at Itaboraí (RJ), a rural municipality east of Guanabara Bay, she was
  a lowland fluminense, not a colonist. [CONTEXTUAL] She moved to the Nova Friburgo
  highlands on marrying the colonist Francisco José Bohrer — a marriage-chain migration
  from the lowland into the Swiss colony, and the one non-colonist thread in this branch.
  Part of the Lemos followed her up: her brother settled and died at Nova Friburgo.

  ## Where to go today

  - **Baptism (12 October 1835) and marriage (~1858):** Igreja Matriz de São João Batista de Itaboraí,
  RJ (Praça Marechal Floriano Peixoto 15, Centro; CEP 24800-165; GPS -22.74472, -42.85833) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)

  - **Married life, widowhood and death (2 Nov 1919):** Catedral Diocesana / Igreja Matriz de São João
  Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro; CEP 28610-390; GPS -22.28159, -42.53085) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela nasceu em Itaboraí (RJ) por volta de 1834 — seu batismo de outubro de 1835 a registra "nascida a dez mezes" (PAR-0016) — e faleceu em Nova Friburgo em 2 de novembro de 1919, aos 86 anos (PAR-0058). Sua vida abrangeu 85 anos por duas províncias, dois regimes políticos e o fim da escravidão.

  - **[PROVEN]** Ficou viúva em 1888 quando seu marido Francisco José faleceu de insuficiência cardíaca (PAR-0055), e viveu como viúva por 31 anos — falecendo em 1919 após sobreviver ao marido por mais de três décadas.

  - **[PROVEN]** Em janeiro de 1898, o jornal *A Sentinella* referiu-se a ela como "Exma. Sra. D. Roza Bohrer" ao noticiar o falecimento de seu irmão Manoel Pereira de Lemos (NWS-0002) — os honoríficos "Excelentíssima Senhora Dona" marcando-a como mulher de prestígio social local em Nova Friburgo.

  - **[INFERRED]** Seu casamento com Francisco José Bohrer foi celebrado em Itaboraí perante o coadjutor, e só foi formalmente registrado na Matriz de Nova Friburgo em 1879 — o que significa que o casal provavelmente viveu como casado por mais de 20 anos antes de o casamento constar oficialmente nos registros da freguesia de Nova Friburgo. Isso era comum para casais cujo matrimônio foi celebrado fora de sua freguesia de domicílio.

  - **[CONTEXTUAL]** Ela se mudou de Itaboraí (um município fluminense das terras baixas) para a serra de Nova Friburgo ao se casar — uma migração do litoral para a colônia suíça — e parte da família Lemos a seguiu: seu irmão Manoel Pereira de Lemos faleceu em Nova Friburgo em 1898, mostrando como o casamento dentro da colônia podia atrair uma rede familiar mais ampla para a serra.

  ## Identidade

  **Rosa Eugenia de Lemos** — registrada apenas pelo prenome "Roza" em seu batismo de
  1835, e em registros posteriores sob a forma de casada "Roza Eugenia de Lemos Bohrer" /
  "D. Roza Bohrer". [PROVEN] O registro de nascimento Bohrer (CIV-0019) confirma que "de
  Lemos" é seu sobrenome próprio e "Bohrer" seu nome de casada.

  - **Nascimento:** por volta do final de 1834, Itaboraí (RJ) [INFERRED] — seu batismo de
  outubro de 1835 a registra "nascida a dez mezes" (PAR-0016). Origem brasileira: seus pais
  são "naturaes desta freguezia" de Itaboraí (PAR-0016). [PROVEN]

  - **Batismo:** outubro de 1835, Matriz de São João Batista de Itaboraí, "filha legitima
  de Manoel de Lemos [Pereira] (P-0052) e Maria Thereza de Jesus (P-0053)"; padrinhos Manoel
  José da Silva e Flor de Maria da Conceição (PAR-0016). [PROVEN] O assento registrou apenas
  "Roza"; a identificação como Rosa Eugenia apoia-se na correspondência única de
  casal/freguesia e nas ligações Lemos-Itaboraí de PAR-0002 e PRB-0005, sendo, portanto,
  forte, porém indireta.

  - **Casamento:** Francisco José Bohrer (P-0034), celebrado em Itaboraí perante o coadjutor
  e apenas judicialmente justificado/registrado na Matriz de Nova Friburgo em 1º de agosto
  de 1879 (PAR-0002) [PROVEN, é anterior a 1879]; uma cláusula incerta de "mais de vinte
  anos" situaria o casamento por volta de 1858. [LEAD]

  - **Filhos** (com Francisco José): Joaquim José Bohrer (P-0030, primogênito), Laura,
  Guilherme (Samuel) e Fernando, os quatro herdeiros do testamento de 1888 de seu marido
  (PRB-0005). [PROVEN — testamento] Uma filha, **Ludovina Borer** (n. ~21 jul. 1862; f. 27 dez.
  1862, NF) faleceu ainda bebê. O óbito retido da NF-Catedral (Óbito L1 f.147) nomeia **apenas o
  pai** — "filha do Sr. Francisco José Bohrer, morador d'esta Villa"; Rosa NÃO é nomeada nesse
  assento. A maternidade de Rosa em relação a Ludovina apoia-se, portanto, no registro reconciliado
  e na compilação Lorenz/Bon, não no primário retido. [BORDERLINE — imagem retida nomeia apenas o
  pai; LEAD para a maternidade de Rosa via registro + compilação]

  - **Óbito:** 2 de novembro de 1919 em Nova Friburgo, aos 86 anos [PROVEN — PAR-0058, evento
  E-0086], registrada como "viúva de Francisco José Bohrer" e "natural de Itaboraí" (sepultada
  no mesmo dia pela Irmandade do Sacramento). Estava viúva desde 6 de julho de 1888 (óbito do
  marido Francisco José, PAR-0055) e ainda viva em janeiro de 1898, quando o óbito jornalístico
  de seu irmão chama o falecido de "irmão da Exma. Sra. D. Roza Bohrer" (NWS-0002). A idade
  declarada 86 implica nascimento ~1833 — próximo, e superado por, o nascimento em ~final de
  1834 de seu batismo ("nascida a dez mezes").

  ## Posição social e profissão

  Nenhuma ocupação lhe é registrada, como esperado para uma mulher casada de sua época
  nesses registros. Sua posição é legível por meio de sua casa e de seus parentes: esposa de
  um proprietário de Nova Friburgo, e mãe de Guilherme Samuel Bohrer (proprietário do jornal
  A Sentinella) e dos comerciantes Fernando e Joaquim. Na nota de 1898 é tratada por "Exma.
  Sra. D. Roza Bohrer" — honoríficos que marcam uma família de prestígio social local.
  [PROVEN via NWS-0002 e CIV-0019]

  ## Família e rede social

  - **Pais:** Manoel de Lemos [Pereira] (P-0052) e Maria Thereza de Jesus (P-0053), uma
  família de Itaboraí (família F-0025). [PROVEN por seu batismo] Seu batismo de 1835 traz apenas
  "Manoel de Lemos" (sem "Pereira"); seu próprio óbito de 1919 (PAR-0058), porém, nomeia o casal
  numa forma divergente com "Pereira" — "Manoel Pereira Lemos × Maria Tereza Pereira de Lemos" —
  preservada como variante, prevalecendo a forma do batismo, mais próxima do evento. O elemento
  "Pereira" também reaparece em seu irmão Candido Pereira de Lemos (PRB-0005).

  - **Irmãos:** uma varredura do registro de Itaboraí documenta Maria (bat. 14 de julho de
  1832, PAR-0030), Anna (bat. 12 de fevereiro de 1834, PAR-0031), Thomaz (bat. por volta de
  junho de 1836, PAR-0032) e Polidoro (bat. por volta de novembro de 1838, PAR-0033) como
  filhos do mesmo casal. [PROVEN] Dois outros irmãos são documentados indiretamente: Candido
  Pereira de Lemos, nomeado cunhado e testamenteiro de seu marido no testamento de 1888
  (PRB-0005), e Manoel Pereira de Lemos, cujo óbito de 1898 o chama de irmão dela (NWS-0002).
  Uma ⚠ divergência no nome da mãe percorre o conjunto de irmãos — "Maria Thereza de Jesus"
  (PAR-0016, PAR-0032) versus "Maria Nunes de Jesus" (PAR-0030, PAR-0031) — preservada como
  inconsistência de escrivão para a mesma mulher.

  - **Parentes por casamento:** casou-se com a família imigrante suíça Bohrer; seu marido era
  o filho nascido no Brasil dos colonos de Soleure Jacob Borer e Catharina (P-0050, P-0051).

  ## O que podemos extrapolar

  **A justificação de 1879 lê-se melhor como um ato patrimonial do que como um casamento.**
  [INFERRED] Seu matrimônio com Francisco José Bohrer foi celebrado em Itaboraí, em casa
  particular, perante um coadjutor da freguesia, e nunca foi lançado em livro paroquial; uma
  sentença judicial de 30 de junho de 1879 deu-o por justificado e mandou o vigário de Nova
  Friburgo abrir o assento (PAR-0002) [PROVEN]. As testemunhas depuseram que ele durava "a mais
  de vinte annos" [leitura incerta — LEAD], o que situaria o casamento por volta de 1858 ou
  antes, e o primogênito Joaquim nasceu cerca de 1861/62 (PAR-0056). O casal viveu, portanto,
  cerca de duas décadas numa união socialmente completa e documentalmente invisível, e a
  regularizou nove anos antes do testamento que nomeia os quatro filhos "meus unicos e legitimos
  herdeiros" (PRB-0005). A leitura mais econômica é que o papel foi feito quando havia herdeiros
  e patrimônio a resguardar — não quando houve casamento. O motivo não está declarado em parte
  alguma do ato. [INFERRED]

  **A posição documentada dela é real e é inteiramente de posição, não de propriedade.** O
  marido a nomeou *primeira* testamenteira e tutora dos filhos, à frente do próprio irmão dela,
  Candido Pereira de Lemos, e de um amigo da família (PRB-0005) [PROVEN] — uma mulher a quem se
  confiaram o espólio e a tutela. Em 1898 o semanário da cidade a trata por "Exma. Sra. D. Roza
  Bohrer" (NWS-0002) [PROVEN]. Em 1919 é acompanhada ao sepultamento pela Irmandade do
  Sacramento e sepultada no cemitério da própria irmandade, tendo-se confessado e recebido o
  viático e a unção (PAR-0058) [PROVEN]. O sepultamento por irmandade leiga era uma
  respeitabilidade de assinatura, paga por anuidade [CONTEXTUAL]: num domicílio com pouco
  capital, a posição exprimia-se por filiação religiosa e honoríficos, que custam uma
  contribuição, e não por terra, que custa uma fortuna.

  **Trinta e um anos de viuvez são um fato econômico, não apenas biográfico.**
  [CONTEXTUAL/INFERRED] Francisco José morreu em julho de 1888 e ela em novembro de 1919
  (PAR-0055, PAR-0058) [PROVEN]. Na sucessão brasileira a viúva conservava sua meação — metade
  do patrimônio do casal — em vida, de modo que metade da única propriedade fundiária da família
  ficou fora do alcance dos herdeiros por três décadas, enquanto os filhos envelheciam até os
  cinquenta e sessenta anos. Nada no registro disponível a mostra comprando, vendendo ou
  negociando, e seu próprio assento de óbito não nomeia propriedade alguma. Uma meação de viúva,
  congelada e depois dividida em quatro entre herdeiros já idosos ou já falecidos, é exatamente
  o mecanismo pelo qual um espólio modesto se torna nada por cabeça.

  **Os Lemos subiram na geração dela, e subiram mudando-se.** [INFERRED, bem sustentado] Os
  registros de Itaboraí de seus pais não nomeiam terra, ofício ou título (PAR-0016,
  PAR-0030–PAR-0033), e nenhum padrinho daquele conjunto de irmãos traz patente ou honorífico
  [PROVEN até onde esses atos alcançam]. A geração dela partiu: ela casou-se com a colônia de
  Nova Friburgo; seu irmão Candido Pereira de Lemos aparece em Nova Friburgo como testemunha de
  casamento em 1884 (PAR-0056) e como testamenteiro do marido dela em 1888 (PRB-0005) [PROVEN];
  seu irmão Manoel Pereira de Lemos ali morreu em janeiro de 1898 como "o conhecido industrial
  da Venda das Pedras", aos 72 anos, homem que "gosava de geral estima de seus conterraneos"
  (NWS-0002) [PROVEN]. Uma família fluminense das terras baixas, sem nada registrado nos anos
  1830, produziu, em uma geração e uma migração, um *industrial* estabelecido e uma *Dona* da
  serra. A subida é real — e é uma subida para o comércio e a respeitabilidade, não para a
  terra.

  **O casamento em si foi lateral, nem para cima nem para baixo.** [INFERRED] Ela não levou
  propriedade documentada para o domicílio colono, e o domicílio colono não tinha fortuna de
  elite a guardar; a união enxertou uma família portuguesa das terras baixas num tronco serrano
  de imigrantes suíços, no mesmo nível modesto. O que se segue nos filhos dela é o platô
  pequeno-burguês da família — o jornal de Guilherme, o comércio de Fernando e de Joaquim —
  alcançado numa única geração e transmitido a nenhuma: sua neta Celina (P-0015) morreu viúva e
  trabalhadora, tendo "não deixado bens nem testamento" (CIV-0015) [PROVEN]. Sua casa é o
  modesto pico local de um arco não elitista, não uma queda a partir de um.

