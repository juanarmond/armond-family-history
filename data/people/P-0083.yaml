profile: >-
  ## Identity

  **Tereza do Amaral** (also *Thereza do Amaral*; devotional variant *Tereza d'Assumpção*) —
  mother of João Francisco Muniz Bitancourt (P-0048), wife of Manoel Muniz Bitancourt (P-0082),
  family F-0040. [PROVEN as named]

  - **Death:** before 7 October 1819 — recorded "já defunta" (already deceased) at her son's
  marriage (PAR-0037). [PROVEN as bound]

  - **Born:** about the 1750s–1770 — mother of a son who married in 1819. [INFERRED, soft]

  - **Name variant:** her grandson Agostinho's 1843 baptism (PAR-0044) records her as "Tereza
  d'Assumpção" — a devotional variant of "do Amaral" — a second document naming her. [PROVEN as named]

  - **Attestation:** named as a parent in her son's 1819 marriage (PAR-0037), her daughter's
  1818 marriage (PAR-0048) and her grandson's 1843 baptism (PAR-0044); no record of her own is
  held. Portuguese (Açorean). [OPEN on her own record]

  ## Family and social network

  Wife of Manoel Muniz Bitancourt (P-0082) and mother of the Mãe de Deus landowner João Francisco
  Muniz Bitancourt (P-0048), through whom the line reaches the emigrant João Muniz Bittencourt
  (P-0019). A daughter, Maria Jacintha de Medeiros (⚭ Manoel Cabral, 1818, PAR-0048), and a
  grandson, Agostinho (1843 baptism, PAR-0044), name her a second and third time. Her daughters
  carried her "de Medeiros" surname. A further daughter, Roza Jacinta de Medeiros (⚭ João
  Jacinto, 1819), was read in the same register but is not yet promoted here. [PROVEN for the
  son, the 1818 daughter and the grandson; Roza a LEAD]

  ## What we can extrapolate

  *Proportionate to an ancestress recorded only as a parent, and only as deceased.*

  - **The female half of a small-proprietor Mãe de Deus household [INFERRED / CONTEXTUAL].**
  Recorded only through her husband, son and grandson, Tereza represents the propertyless-by-record
  wife of the land-holding peasant-proprietor line — her position defined by the marriage, with no
  independent standing documented. Her surname "do Amaral" is one of the recurring Mãe de Deus
  parish names, consistent with the endogamous, land-conserving kin network the whole line married
  within (see P-0042).

  - **What she transmitted was belonging, not capital [INFERRED].** Like the other Azorean women
  of this line, the "capital" she carried was membership in a rooted home parish — not land or a
  heritable surname-status — precisely the intangible her emigrant great-great-grandsons had to
  rebuild in Brazil.

  ## Open questions

  - Her marriage to Manoel Muniz Bitancourt is a bounded negative across the 1801–1822 Mãe de
  Deus marriage book (196 pages read; she appears only as a parent, and was already deceased by
  1819) → the marriage is pre-1801. Off-tool (BPARPD, Ponta Delgada). [OPEN]

  - Her baptism, death (before 1819) and parents lie in the same pre-1801 books; off-tool. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of her son João Francisco — names her, deceased, as his mother) ·
  PAR-0048 (1818 marriage of her daughter Maria Jacintha de Medeiros — names her as the bride's
  mother) · PAR-0044 (1843 baptism of her grandson Agostinho — names her a paternal grandparent,
  "Tereza d'Assumpção").

  ## Regional and migration context

  Lived and died at N.S. Mãe de Deus / Povoação, São Miguel (Açores) — a São Miguel root of the
  Muniz patriline, deceased before 1819, with no move documented. [INFERRED] The emigration is
  three generations below her (about 1866–1870), driven by the island's *morgadio* land-lock,
  overpopulation and the 1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil
  pull ran through the Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de
  Terras (nº 601/1850), while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863
  abolished the Portuguese *morgadios*. [CONTEXTUAL]

  ## Where to go today

  - **Family parish (her children's marriages; she was already deceased by 1819):** Igreja Matriz de
  Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coords 37.74891, -25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Identidade

  **Tereza do Amaral** (também *Thereza do Amaral*; variante devocional *Tereza d'Assumpção*) —
  mãe de João Francisco Muniz Bitancourt (P-0048), esposa de Manoel Muniz Bitancourt (P-0082),
  família F-0040. [PROVEN quanto ao nome]

  - **Óbito:** antes de 7 de outubro de 1819 — registrada "já defunta" no casamento de seu filho
  (PAR-0037). [PROVEN quanto ao limite]

  - **Nascimento:** por volta de 1750–1770 — mãe de um filho que se casou em 1819. [INFERRED, soft]

  - **Variante de nome:** o batismo de 1843 de seu neto Agostinho (PAR-0044) a registra como
  "Tereza d'Assumpção" — variante devocional de "do Amaral" — um segundo documento que a nomeia.
  [PROVEN quanto ao nome]

  - **Atestação:** nomeada como progenitora no casamento de 1819 de seu filho (PAR-0037), no
  casamento de 1818 de sua filha (PAR-0048) e no batismo de 1843 de seu neto (PAR-0044); nenhum
  registro próprio é obtido. Portuguesa (açoriana). [OPEN quanto ao registro próprio]

  ## Família e rede social

  Esposa de Manoel Muniz Bitancourt (P-0082) e mãe do proprietário de Mãe de Deus João Francisco
  Muniz Bitancourt (P-0048), por meio de quem a linha alcança o emigrante João Muniz Bittencourt
  (P-0019). Uma filha, Maria Jacintha de Medeiros (⚭ Manoel Cabral, 1818, PAR-0048), e um neto,
  Agostinho (batismo de 1843, PAR-0044), a nomeiam uma segunda e terceira vez. Suas filhas
  carregaram seu sobrenome "de Medeiros". Uma outra filha, Roza Jacinta de Medeiros (⚭ João
  Jacinto, 1819), foi lida no mesmo registro, mas ainda não está promovida aqui. [PROVEN quanto
  ao filho, à filha de 1818 e ao neto; Roza uma LEAD]

  ## O que podemos extrapolar

  *Proporcional a uma ancestral registrada apenas como progenitora, e apenas como falecida.*

  - **A metade feminina de um domicílio de pequenos proprietários de Mãe de Deus [INFERRED /
  CONTEXTUAL].** Registrada apenas por meio de seu marido, filho e neto, Tereza representa a esposa
  sem propriedade nos registros da linha de camponeses-proprietários — sua posição definida pelo
  casamento, sem posição independente documentada. Seu sobrenome "do Amaral" é um dos nomes
  recorrentes da freguesia de Mãe de Deus, consistente com a rede de parentesco endogâmica e
  conservadora de terra dentro da qual toda a linha se casou (ver P-0042).

  - **O que ela transmitiu foi pertencimento, não capital [INFERRED].** Como as demais mulheres
  açorianas desta linha, o "capital" que ela carregava era o pertencimento a uma freguesia natal
  enraizada — não terra nem um status de sobrenome herdável — precisamente o intangível que seus
  trinetos emigrantes tiveram de reconstruir no Brasil.

  ## Questões em aberto

  - Seu casamento com Manoel Muniz Bitancourt é um negativo delimitado em todo o livro de
  casamentos de Mãe de Deus de 1801–1822 (196 páginas lidas; ela aparece apenas como progenitora
  e já estava falecida em 1819) → o casamento é anterior a 1801. Fora de alcance (BPARPD, Ponta
  Delgada). [OPEN]

  - Seu batismo, óbito (antes de 1819) e pais estão nos mesmos livros anteriores a 1801; fora de
  alcance. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de seu filho João Francisco — a nomeia, falecida, como mãe) ·
  PAR-0048 (casamento de 1818 de sua filha Maria Jacintha de Medeiros — a nomeia como mãe da
  noiva) · PAR-0044 (batismo de 1843 de seu neto Agostinho — a nomeia como avó paterna, "Tereza
  d'Assumpção").

  ## Contexto regional e migratório

  Viveu e faleceu em N.S. Mãe de Deus / Povoação, São Miguel (Açores) — uma raiz em São Miguel da
  patrilinha Muniz, falecida antes de 1819, sem mudança documentada. [INFERRED] A emigração está
  três gerações abaixo dela (por volta de 1866–1870), impulsionada pelo bloqueio fundiário do
  *morgadio* da ilha, pela superpopulação e pelo colapso, na década de 1860, da economia de
  exportação da laranja. [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de
  setembro de 1850 (Eusébio de Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em
  São Miguel afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia da família (casamentos de seus filhos; ela já falecida em 1819):** Igreja Matriz de
  Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coordenadas 37.74891, -25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
