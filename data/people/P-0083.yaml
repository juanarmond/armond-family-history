profile: >-
  ## Interesting facts

  - **[PROVEN]** Recorded "já defunta" (already deceased) in her son's 1819 Mãe de Deus marriage act (PAR-0037) — giving a firm upper bound on her death before 7 October 1819, the only fixed date in her existence.

  - **[CONTEXTUAL]** She died on São Miguel before the island's orange-export crisis of the 1850s–1860s that drove her great-grandsons to emigrate to Brazil — she never experienced the economic collapse that reshaped the family's future, though the morgadio land-lock that constrained the whole line was already in place throughout her lifetime.

  - **[INFERRED]** Her daughters took the maternal "de Medeiros" surname rather than her own "do Amaral" while her son kept the paternal "Muniz Bitancourt" — the Azorean surname divergence pattern, where daughters sometimes acquired a different family name, making surname alone an unreliable guide to kinship in these registers.

  - **[INFERRED]** Her grandson's 1843 baptism (PAR-0044) records her as "Tereza d'Assumpção" rather than "do Amaral" — a devotional variant used by family members remembering her 24+ years after her death, showing how oral tradition softened or replaced surnames in the tight parish communities of São Miguel.

  ## Identity

  **Tereza do Amaral** (also *Thereza do Amaral*; devotional variant *Tereza d'Assumpção*) —
  mother of João Francisco Muniz Bitancourt (P-0048), wife of Manoel Muniz Bitancourt (P-0082),
  family F-0040. [PROVEN as named]

  - **Death:** before 7 October 1819 — recorded "já defunta" (already deceased) at her son's
  marriage (PAR-0037). [PROVEN as bound]

  - **Born:** about the 1750s–1770 — mother of a son who married in 1819. [INFERRED, soft]

  - **Name variant:** her grandson Agostinho's 1843 baptism (PAR-0044) records her as "Tereza
  d'Assumpção" — a devotional variant of "do Amaral" — a second document naming her. [PROVEN as named]

  - **Attestation:** named as a parent in her son's 1819 marriage (PAR-0037), her daughter's
  1818 marriage (PAR-0048) and her grandson's 1843 baptism (PAR-0044); no record of her own is
  held. Portuguese (Açorean). [OPEN on her own record]

  ## Standing and profession

  - **Nothing documented** [PROVEN absence]. She survives in the record only as a name:
  "Tereza do Amaral já defunta" in her son's 1819 marriage (PAR-0037), "Tereza d'Assumpção"
  as a named grandmother in 1843 (PAR-0044), and as the bride's mother in 1818 (PAR-0048).
  No act states an occupation, property or standing for her, and she is never written
  *Dona*. The field is left unset deliberately, not for want of searching.

  ## Family and social network

  Wife of Manoel Muniz Bitancourt (P-0082) and mother of the Mãe de Deus landowner João Francisco
  Muniz Bitancourt (P-0048), through whom the line reaches the emigrant João Muniz Bittencourt
  (P-0019). A daughter, Maria Jacintha de Medeiros (⚭ Manoel Cabral, 1818, PAR-0048), and a
  grandson, Agostinho (1843 baptism, PAR-0044), name her a second and third time. Her daughters
  carried her "de Medeiros" surname. A further daughter, Roza Jacinta de Medeiros (⚭ João
  Jacinto, 1819), was read in the same register but is not yet promoted here. [PROVEN for the
  son, the 1818 daughter and the grandson; Roza a LEAD]

  ## What we can extrapolate

  *Proportionate to an ancestress recorded only as a name, and only as deceased.*

  **1. She is the propertyless-by-record wife of a small-proprietor household [PROVEN
  absence / INFERRED].** Nothing states an occupation, property or standing for her, and she
  is never written *Dona*. **[INFERRED]** Her position was defined by the marriage; what the
  record preserves of her is a name and a death.

  **2. Her surname could not be fixed even by her own family [PROVEN / INFERRED].** She is
  *Tereza do Amaral* in her son's 1819 marriage (PAR-0037) and *Tereza d'Assumpção* as a
  named grandmother in 1843 (PAR-0044) — two devotional-style forms, recorded twenty-four
  years apart from what relatives told the clerk. **[INFERRED]** A surname is heritable
  social capital only where there is something riding on it. The family's own inability to
  give a consistent one is the plainest evidence that hers carried nothing, and it is why
  her line above this point cannot be traced by name.

  **3. Her death has a narrow documented window [INFERRED].** She is named without any
  deceased marker at her daughter's marriage on 30 December 1818 (PAR-0048) and is expressly
  "já defunta" at her son's marriage on 7 October 1819 (PAR-0037). **[INFERRED]** That
  brackets her death to those ten months — though the inference rests partly on the
  *absence* of the marker in 1818, which is weaker evidence than its presence in 1819, so
  the bound should be treated as probable rather than proven.

  **4. What she transmitted was belonging, not capital [INFERRED].** Like the other women of
  this Azorean line, the asset she carried was membership in a rooted home parish rather
  than land or a name worth keeping. **[INFERRED]** It was the one thing that could not
  cross the Atlantic with her great-grandsons, and its loss is what the Brazilian
  generations spent a marriage and a generation rebuilding (P-0019).

  ## Open questions

  - Her marriage to Manoel Muniz Bitancourt is a bounded negative across the 1801–1822 Mãe de
  Deus marriage book (196 pages read; she appears only as a parent, and was already deceased by
  1819) → the marriage is pre-1801. Off-tool (BPARPD, Ponta Delgada). [OPEN]

  - Her baptism, death (before 1819) and parents lie in the same pre-1801 books; off-tool. [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of her son João Francisco — names her, deceased, as his mother) ·
  PAR-0048 (1818 marriage of her daughter Maria Jacintha de Medeiros — names her as the bride's
  mother) · PAR-0044 (1843 baptism of her grandson Agostinho — names her a paternal grandparent,
  "Tereza d'Assumpção").

  ## Regional and migration context

  Lived and died at N.S. Mãe de Deus / Povoação, São Miguel (Açores) — a São Miguel root of
  the Muniz patriline, deceased before 1819, with no move documented. [INFERRED] The
  emigration is three generations below her (between 1866 and 1882 (most plausibly near
  1880; see P-0019)), driven by the island's *morgadio* land-lock, overpopulation and the
  1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil pull ran through the
  Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras (nº
  601/1850), while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863
  abolished the Portuguese *morgadios*. [CONTEXTUAL]

  ## Where to go today

  - **Family parish (her children's marriages; she was already deceased by 1819):** Igreja Matriz de
  Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coords 37.74891, -25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Registrada "já defunta" (já falecida) no assento de casamento do filho em Mãe de Deus, em 1819 (PAR-0037) — estabelecendo um limite superior firme para sua morte antes de 7 de outubro de 1819, a única data fixa em sua existência.

  - **[CONTEXTUAL]** Morreu em São Miguel antes da crise de exportação de laranja das décadas de 1850–1860 que levou seus bisnetos a emigrar para o Brasil — nunca experimentou o colapso econômico que moldou o futuro da família, embora o bloqueio fundiário do morgadio que constrangia toda a linha já estivesse em vigor durante sua vida.

  - **[INFERRED]** Suas filhas tomaram o sobrenome materno "de Medeiros" (não "do Amaral"), enquanto seu filho manteve o paterno "Muniz Bitancourt" — o padrão açoriano de divergência de sobrenomes, em que filhas às vezes adquiriam o nome da linhagem materna, tornando o sobrenome isolado um guia pouco confiável para o parentesco nesses registros.

  - **[INFERRED]** O batismo de seu neto em 1843 (PAR-0044) a registra como "Tereza d'Assumpção" em vez de "do Amaral" — uma variante devocional usada por membros da família que a recordavam mais de 24 anos após sua morte, mostrando como a tradição oral suavizava ou substituía sobrenomes nas comunidades paroquiais fechadas de São Miguel.

  ## Identidade

  **Tereza do Amaral** (também *Thereza do Amaral*; variante devocional *Tereza d'Assumpção*) —
  mãe de João Francisco Muniz Bitancourt (P-0048), esposa de Manoel Muniz Bitancourt (P-0082),
  família F-0040. [PROVEN quanto ao nome]

  - **Óbito:** antes de 7 de outubro de 1819 — registrada "já defunta" no casamento de seu filho
  (PAR-0037). [PROVEN quanto ao limite]

  - **Nascimento:** por volta de 1750–1770 — mãe de um filho que se casou em 1819. [INFERRED, soft]

  - **Variante de nome:** o batismo de 1843 de seu neto Agostinho (PAR-0044) a registra como
  "Tereza d'Assumpção" — variante devocional de "do Amaral" — um segundo documento que a nomeia.
  [PROVEN quanto ao nome]

  - **Atestação:** nomeada como progenitora no casamento de 1819 de seu filho (PAR-0037), no
  casamento de 1818 de sua filha (PAR-0048) e no batismo de 1843 de seu neto (PAR-0044); nenhum
  registro próprio é obtido. Portuguesa (açoriana). [OPEN quanto ao registro próprio]

  ## Posição social e profissão

  - **Nada documentado** [PROVEN na ausência]. Ela sobrevive no registro apenas como nome:
  "Tereza do Amaral já defunta" no casamento de 1819 de seu filho (PAR-0037), "Tereza
  d'Assumpção" como avó nomeada em 1843 (PAR-0044) e como mãe da noiva em 1818 (PAR-0048).
  Nenhum ato lhe declara ocupação, bens ou posição, e nunca é escrita *Dona*. O campo fica
  deliberadamente sem preencher, e não por falta de busca.

  ## Família e rede social

  Esposa de Manoel Muniz Bitancourt (P-0082) e mãe do proprietário de Mãe de Deus João Francisco
  Muniz Bitancourt (P-0048), por meio de quem a linha alcança o emigrante João Muniz Bittencourt
  (P-0019). Uma filha, Maria Jacintha de Medeiros (⚭ Manoel Cabral, 1818, PAR-0048), e um neto,
  Agostinho (batismo de 1843, PAR-0044), a nomeiam uma segunda e terceira vez. Suas filhas
  carregaram seu sobrenome "de Medeiros". Uma outra filha, Roza Jacinta de Medeiros (⚭ João
  Jacinto, 1819), foi lida no mesmo registro, mas ainda não está promovida aqui. [PROVEN quanto
  ao filho, à filha de 1818 e ao neto; Roza uma LEAD]

  ## O que podemos extrapolar

  *Proporcional a uma ancestral registrada apenas como nome, e apenas como falecida.*

  **1. É a esposa sem bens, segundo o registro, de uma casa de pequenos proprietários
  [PROVEN na ausência / INFERRED].** Nada lhe declara ocupação, bens ou posição, e nunca é
  escrita *Dona*. **[INFERRED]** Sua posição era definida pelo casamento; o que o registro
  dela preserva é um nome e uma morte.

  **2. Seu sobrenome não pôde ser fixado nem pela própria família [PROVEN / INFERRED].** É
  *Tereza do Amaral* no casamento de 1819 do filho (PAR-0037) e *Tereza d'Assumpção* como
  avó nomeada em 1843 (PAR-0044) — duas formas de feitio devocional, anotadas com vinte e
  quatro anos de intervalo a partir do que os parentes disseram ao escrivão. **[INFERRED]**
  Um sobrenome só é capital social herdável onde há algo apostado nele. A própria
  incapacidade da família de dar um nome coerente é a prova mais direta de que o dela nada
  carregava, e é por isso que sua linhagem acima deste ponto não pode ser rastreada pelo
  nome.

  **3. Sua morte tem uma janela documental estreita [INFERRED].** É nomeada sem qualquer
  indicativo de falecimento no casamento da filha, em 30 de dezembro de 1818 (PAR-0048), e é
  expressamente "já defunta" no casamento do filho, em 7 de outubro de 1819 (PAR-0037).
  **[INFERRED]** Isso delimita sua morte a esses dez meses — ainda que a inferência se apoie
  em parte na *ausência* do indicativo em 1818, prova mais fraca do que sua presença em
  1819, de modo que o limite deve ser tratado como provável, e não como comprovado.

  **4. O que ela transmitiu foi pertencimento, não capital [INFERRED].** Como as demais
  mulheres desta linhagem açoriana, o bem que carregava era o pertencimento a uma freguesia
  de origem enraizada, e não terra ou um nome que valesse guardar. **[INFERRED]** Foi a
  única coisa que não pôde atravessar o Atlântico com seus bisnetos, e é essa perda que as
  gerações brasileiras levaram um casamento e uma geração para reconstruir (P-0019).

  ## Questões em aberto

  - Seu casamento com Manoel Muniz Bitancourt é um negativo delimitado em todo o livro de
  casamentos de Mãe de Deus de 1801–1822 (196 páginas lidas; ela aparece apenas como progenitora
  e já estava falecida em 1819) → o casamento é anterior a 1801. Fora de alcance (BPARPD, Ponta
  Delgada). [OPEN]

  - Seu batismo, óbito (antes de 1819) e pais estão nos mesmos livros anteriores a 1801; fora de
  alcance. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de seu filho João Francisco — a nomeia, falecida, como mãe) ·
  PAR-0048 (casamento de 1818 de sua filha Maria Jacintha de Medeiros — a nomeia como mãe da
  noiva) · PAR-0044 (batismo de 1843 de seu neto Agostinho — a nomeia como avó paterna, "Tereza
  d'Assumpção").

  ## Contexto regional e migratório

  Viveu e faleceu em N.S. Mãe de Deus / Povoação, São Miguel (Açores) — uma raiz em São
  Miguel da patrilinha Muniz, falecida antes de 1819, sem mudança documentada. [INFERRED] A
  emigração está três gerações abaixo dela (entre 1866 e 1882 (mais plausivelmente por volta
  de 1880; ver P-0019)), impulsionada pelo bloqueio fundiário do *morgadio* da ilha, pela
  superpopulação e pelo colapso, na década de 1860, da economia de exportação da laranja.
  [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850
  (Eusébio de Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel
  afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia da família (casamentos de seus filhos; ela já falecida em 1819):** Igreja Matriz de
  Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (coordenadas 37.74891, -25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
