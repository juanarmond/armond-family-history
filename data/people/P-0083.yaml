notes:
- text: >-
    Mother of João Francisco Muniz Bitancourt (P-0048); wife of Manoel Muniz
    Bitancourt (P-0082), family F-0040. Named in her son's 7 October 1819 Mãe de
    Deus marriage (PAR-0037), where she is recorded "já defunta" — so she died
    before 7 October 1819. No record of her own is located; native to Nossa Senhora
    Mãe de Deus, Povoação, Ilha de São Miguel (Açores).
  text_pt: >-
    Mãe de João Francisco Muniz Bitancourt (P-0048); esposa de Manoel Muniz
    Bitancourt (P-0082), família F-0040. Nomeada no casamento de seu filho em 7 de
    outubro de 1819, em Mãe de Deus (PAR-0037), onde é registrada "já defunta" —
    portanto faleceu antes de 7 de outubro de 1819. Nenhum registro próprio dela foi
    localizado; natural de Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel
    (Açores).
