notes:
- text: >-
    António Martins Fagundes (also called "Machado Fagundes"): died 17 April 1664, Santa Bárbara,
    Terceira (PUB-0004, p.312). Capitão de ordenanças. Married Catarina Machado de Faria
    (P-0128); family F-0064. Father of Mariana Fagundes (P-0124). Son of Pedro Lourenço
    Machado (P-0129) × Maria Fernandes da Costa (P-0130); family F-0065.
- text: >-
    The name variant "Machado Fagundes" in the compilation reflects the Machado element taken
    from his mother's family (Maria Fernandes da Costa). His wife Catarina Machado de Faria
    belongs to the LEMOS family line (Mendes Forjaz Vol. IV, LEMOS § 3º, nº 5), not yet read
    in this repository.
