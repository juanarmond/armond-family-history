profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Itaboraí, his home parish, was a rural sugar-and-agriculture municipality east of Guanabara Bay — distinct from both the Swiss Nova Friburgo colony and the Zona da Mata coffee economy, making his family a third cultural strand in the tree: Portuguese-descended fluminense stock with no colonial immigrant or highland-coffee background.

  - **[INFERRED]** Five children baptised at Itaboraí between 1832 and 1838 indicate a settled, church-integrated household; a married householder with children before 1832 implies he was born no later than c.1805–1810, placing his birth in the final decade of the Portuguese colonial period.

  - **[CONTEXTUAL]** The scribal alternation between "Pereira" and "Ferreira" for his surname across his children's baptisms reflects the common 19th-century Brazilian practice of recording surnames inconsistently — what the clerk heard, or thought he heard, determined the written form, and the two surnames are auditorily similar.

  - **[INFERRED]** His entire documented life is in Itaboraí; the relocation from Itaboraí to Nova Friburgo belongs to the next generation, when his daughter Rosa married into the Swiss-German colonist household — he never moved, and only his descendants crossed the cultural divide.

  - **[PROVEN]** Five of his children's baptisms at the Itaboraí matriz (1832–1838) establish him as a continuous, stable parishioner across at least six years rather than an itinerant household (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033).

  - **[CONTEXTUAL]** By 1835, when his daughter Rosa was baptised at Itaboraí, Brazil had been an independent empire for thirteen years — his adult life was entirely lived under Brazilian independence, not under the Portuguese colonial regime his parents would have known.

  ## Identity

  **Manoel de Lemos Pereira** — the fuller family form; the register writes him variously
  "Manoel de Lemos" (1835 Rosa baptism, PAR-0016), "Manoel de Lemos Ferreira" (1832, 1834,
  1838 baptisms, PAR-0030 / PAR-0031 / PAR-0033) and simply "Manoel de Lemos" (1836,
  PAR-0032) — the Pereira/Ferreira alternation is scribal, one man [PROVEN]. He heads the
  Lemos line of Itaboraí (RJ): father of Rosa Eugenia de Lemos (P-0035), hence maternal
  grandfather of Joaquim José Bohrer (P-0030).

  - **Nationality:** Brazilian [PROVEN] — he and his wife are "naturaes desta freguezia"
  (Itaboraí) in the 1835 baptism (PAR-0016); a documented birthplace, not a surname
  inference.

  - **Parents:** unknown from any held record [OPEN].

  - **Marriage:** husband of Maria Thereza de Jesus (P-0053), family F-0025; the marriage
  act (which would name his father and settle Pereira vs Ferreira) is not held. An
  established married householder by the early 1830s implies a birth no later than
  c.1805–1810 [INFERRED].

  - **Children:** attested across the 1832–1838 Itaboraí baptism sweep — Maria (1832,
  PAR-0030), Anna (1834, PAR-0031), Rosa Eugenia (1835, PAR-0016), Thomaz (1836, PAR-0032)
  and Polídoro (1838, PAR-0033) [PROVEN]. His son Candido Pereira de Lemos is named as
  Rosa's brother in her husband's 1888 will (PRB-0005); a further son Manoel Antunes de
  Lemos is reported by the retrieval synthesis [LEAD, not catalogued].

  ## Standing and profession

  Nothing occupational, propertied or civic is documented — the held records name him only
  as a parent. What they do fix is a settled, church-integrated local family baptising
  legitimate children continuously at the Itaboraí matriz across at least 1832–1838, not
  an itinerant household. [INFERRED]

  ## Family and social network

  His social circle is legible only through his children's godparents: Manoel José da
  Silva and Flor de Maria da Conceição (Rosa, 1835); José Custódio Vieira (Maria, 1832);
  José Antonio and Anna Roza de Guimarães (Anna, 1834). The Guimarães godmother is a
  Lemos–Guimarães link worth noting but with no established connection to the family's
  other Guimarães line. [PROVEN]

  ## What we can extrapolate

  **The earliest Lemos node sits on a modest, Portuguese-descended fluminense floor.**
  [CONTEXTUAL/INFERRED] A settled, church-integrated Itaboraí family baptising legitimate
  children continuously across at least 1832–1838 (PAR-0030, PAR-0031, PAR-0016, PAR-0032,
  PAR-0033) [PROVEN], with no land, office, rank or fortune named in any held act, and with no
  part in the Swiss-German Nova Friburgo colony. Itaboraí in the 1830s was a sugar municipality
  of many engenhos worked by enslaved labour [CONTEXTUAL]; nothing in these records places the
  Lemos on the owning side of it — no enslaved person appears in any held Lemos act, and no
  honorific attaches to Manoel himself.

  **The godparent set is the sharpest class evidence available, and it works by absence.**
  Across the legible baptisms the sponsors are Manoel José da Silva and Flor de Maria da
  Conceição (1835), José Custódio Vieira (1832), and José Loz Antonio with Anna Roza de
  Guimarães (1834) (PAR-0016, PAR-0030, PAR-0031) [PROVEN]. Not one carries a military rank, a
  clerical office or a *Capitão* / *Alferes* style — the markers that saturate the godparent
  lists of propertied Brazilian households in the same decades. Godparenthood was the standard
  channel for attaching a child to a patron; a family whose sponsors are all untitled neighbours
  had no patron to attach to. [INFERRED]

  **The Lemos climb begins in the next generation, and its mechanism is migration, not
  accumulation.** [INFERRED, well-supported] Nothing in his own record changes. But his daughter
  Rosa Eugenia married into the Nova Friburgo colonist household and was styled "Exma. Sra. D.
  Roza Bohrer" by 1898 (NWS-0002); his son Candido Pereira de Lemos appears at Nova Friburgo as
  a marriage witness in 1884 (PAR-0056) and as executor of his brother-in-law's will in 1888
  (PRB-0005); and Manoel Pereira de Lemos, named as Rosa's brother, died there in January 1898
  as "o conhecido industrial da Venda das Pedras", aged 72 (NWS-0002) [PROVEN]. A family with
  nothing recorded at Itaboraí produced, within one generation and one move to the serra, an
  established *industrial* and a *Dona*. Since there is no inheritance in the record to explain
  it, whatever capital made that possible was made in the serra, in trade. [INFERRED]

  **Whatever he did hold divided at least seven ways.** [CONTEXTUAL/INFERRED] The held records
  evidence Manoel (bapt. 1831), Maria (1832), Anna (1834), Rosa Eugenia (1835), Thomaz (1836)
  and Polidoro (1838) from the Itaboraí register, plus Candido Pereira de Lemos and Manoel
  Pereira de Lemos (d. 1898, aged 72) from the Nova Friburgo material — the last of whom may or
  may not be the Manoel baptised in 1831 [uncertain]. Under Brazilian equal partition, seven or
  eight heirs is the arithmetic that stops a small holding ever becoming an estate. In his case
  there is nothing in the record to divide at all, which is the point: he is this family's
  documented floor, and the Lemos enter the Borer/Bohrer arc only laterally, through a
  daughter's marriage.

  No literacy signal survives for him, and none would be expected: nothing in his recorded life
  required a signature. [CONTEXTUAL]

  ## Open questions

  - His own parents and the Pereira-vs-Ferreira surname — decisive record: the Itaboraí
  marriage of Manoel de Lemos × Maria Thereza de Jesus, or an Itaboraí Lemos inventário.
  [OPEN]

  - His birth, death and any move to Nova Friburgo — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0016 (Rosa's 1835 baptism — "Manoel de Lemos", father) · PAR-0030 (Maria's 1832
  baptism) · PAR-0031 (Anna's 1834 baptism) · PAR-0032 (Thomaz's 1836 baptism) · PAR-0033
  (Polídoro's 1838 baptism) — all Itaboraí, naming him as father.

  - PRB-0005 (his son-in-law Francisco José Bohrer's 1888 will names his son Candido
  Pereira de Lemos as executor / Rosa's brother — the family form "de Lemos Pereira").

  ## Regional and migration context

  His whole documented life sits in Itaboraí, a rural sugar-and-agriculture municipality
  east of Guanabara Bay (a vila from 1833) — a Portuguese-descended fluminense community,
  not part of the Swiss-German Nova Friburgo colony. No move of his own is documented; the
  Itaboraí-to-Nova Friburgo relocation belongs to his daughter Rosa's marriage generation.
  [CONTEXTUAL]

  ## Where to go today

  - **Children's baptisms (1831–1841):** Igreja Matriz de São João Batista de Itaboraí, Itaboraí, RJ (Praça Marechal Floriano Peixoto 15, Centro) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** Itaboraí, a sua freguesia natal, era um município rural de cana-de-açúcar e agricultura a leste da Baía de Guanabara — distinto tanto da colónia suíça de Nova Friburgo como da economia cafeeira da Zona da Mata, tornando a sua família uma terceira vertente cultural na árvore: descendentes de portugueses fluminenses sem qualquer ligação a imigrantes coloniais ou ao café das terras altas.

  - **[INFERRED]** Cinco filhos baptizados em Itaboraí entre 1832 e 1838 indicam um agregado familiar estável e integrado na vida paroquial; um chefe de família casado com filhos antes de 1832 implica que terá nascido no máximo por volta de 1805–1810, colocando o seu nascimento na última década do período colonial português.

  - **[CONTEXTUAL]** A alternância de escrivão entre "Pereira" e "Ferreira" no seu apelido nos baptizados dos filhos reflecte a prática brasileira do século XIX de registar apelidos de forma inconsistente — o que o escrivão ouvia, ou julgava ouvir, determinava a forma escrita; e os dois apelidos são auditivamente semelhantes.

  - **[INFERRED]** Toda a sua vida documentada decorre em Itaboraí; a mudança de Itaboraí para Nova Friburgo pertence à geração seguinte, quando a filha Rosa casou com a família de colonos suíço-alemães — ele nunca se mudou, e só os seus descendentes cruzaram a fronteira cultural.

  - **[PROVEN]** Cinco baptizados dos seus filhos na matriz de Itaboraí (1832–1838) estabelecem-no como paroquiano contínuo e estável ao longo de pelo menos seis anos, não como um agregado itinerante (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033).

  - **[CONTEXTUAL]** Em 1835, quando a filha Rosa foi baptizada em Itaboraí, o Brasil era um império independente há treze anos — toda a sua vida adulta decorreu sob a independência brasileira, e não sob o regime colonial português que os seus pais ainda haviam conhecido.

  ## Identidade

  **Manoel de Lemos Pereira** — a forma mais completa da família; o registro o escreve de
  formas variadas: "Manoel de Lemos" (batismo de Rosa em 1835, PAR-0016), "Manoel de Lemos
  Ferreira" (batismos de 1832, 1834 e 1838, PAR-0030 / PAR-0031 / PAR-0033) e apenas
  "Manoel de Lemos" (1836, PAR-0032) — a alternância Pereira/Ferreira é de escrivão, um só
  homem [PROVEN]. Ele encabeça a linha Lemos de Itaboraí (RJ): pai de Rosa Eugenia de
  Lemos (P-0035) e, portanto, avô materno de Joaquim José Bohrer (P-0030).

  - **Nacionalidade:** brasileira [PROVEN] — ele e sua esposa são "naturaes desta
  freguezia" (Itaboraí) no batismo de 1835 (PAR-0016); um local de nascimento documentado,
  não uma inferência a partir do sobrenome.

  - **Pais:** desconhecidos em qualquer registro disponível [OPEN].

  - **Casamento:** marido de Maria Thereza de Jesus (P-0053), família F-0025; o assento de
  casamento (que nomearia seu pai e resolveria Pereira vs Ferreira) não está disponível.
  Um chefe de família já casado no início da década de 1830 implica um nascimento não
  posterior a c.1805–1810 [INFERRED].

  - **Filhos:** atestados na varredura dos batismos de Itaboraí de 1832–1838 — Maria
  (1832, PAR-0030), Anna (1834, PAR-0031), Rosa Eugenia (1835, PAR-0016), Thomaz (1836,
  PAR-0032) e Polídoro (1838, PAR-0033) [PROVEN]. Seu filho Candido Pereira de Lemos é
  nomeado como irmão de Rosa no testamento de 1888 de seu marido (PRB-0005); um outro
  filho, Manoel Antunes de Lemos, é relatado pela síntese de recuperação [LEAD, não
  catalogado].

  ## Posição social e profissão

  Nada de ocupacional, patrimonial ou cívico é documentado — os registros disponíveis o
  nomeiam apenas como pai. O que fixam é uma família local estabelecida e integrada à
  igreja, batizando filhos legítimos de forma contínua na matriz de Itaboraí ao longo de
  ao menos 1832–1838, não uma casa itinerante. [INFERRED]

  ## Família e rede social

  Seu círculo social só é legível pelos padrinhos de seus filhos: Manoel José da Silva e
  Flor de Maria da Conceição (Rosa, 1835); José Custódio Vieira (Maria, 1832); José
  Antonio e Anna Roza de Guimarães (Anna, 1834). A madrinha Guimarães é um vínculo
  Lemos–Guimarães digno de nota, mas sem conexão estabelecida com a outra linha Guimarães
  da família. [PROVEN]

  ## O que podemos extrapolar

  **O nó Lemos mais antigo situa-se sobre um piso modesto, *fluminense* de descendência
  portuguesa.** [CONTEXTUAL/INFERRED] Uma família de Itaboraí estabelecida e integrada à igreja,
  batizando filhos legítimos de forma contínua ao longo de ao menos 1832–1838 (PAR-0030,
  PAR-0031, PAR-0016, PAR-0032, PAR-0033) [PROVEN], sem terra, ofício, patente ou fortuna
  nomeados em qualquer ato disponível, e sem parte na colônia suíço-alemã de Nova Friburgo.
  Itaboraí nos anos 1830 era um município açucareiro de muitos engenhos movidos por trabalho
  escravizado [CONTEXTUAL]; nada nesses registros situa os Lemos do lado proprietário disso —
  nenhuma pessoa escravizada aparece em qualquer ato Lemos disponível, e nenhum honorífico se
  liga ao próprio Manoel.

  **O conjunto de padrinhos é a evidência de classe mais nítida disponível, e funciona pela
  ausência.** Nos batismos legíveis os padrinhos são Manoel José da Silva e Flor de Maria da
  Conceição (1835), José Custódio Vieira (1832) e José Loz Antonio com Anna Roza de Guimarães
  (1834) (PAR-0016, PAR-0030, PAR-0031) [PROVEN]. Nenhum deles traz patente militar, ofício
  clerical ou tratamento de *Capitão* / *Alferes* — os marcadores que saturam as listas de
  padrinhos dos domicílios brasileiros proprietários nas mesmas décadas. O compadrio era o canal
  padrão para ligar uma criança a um protetor; uma família cujos padrinhos são todos vizinhos
  sem título não tinha protetor a quem se ligar. [INFERRED]

  **A subida dos Lemos começa na geração seguinte, e seu mecanismo é a migração, não a
  acumulação.** [INFERRED, bem sustentado] Nada no registro dele muda. Mas sua filha Rosa
  Eugenia casou-se com o domicílio colono de Nova Friburgo e era tratada por "Exma. Sra. D. Roza
  Bohrer" em 1898 (NWS-0002); seu filho Candido Pereira de Lemos aparece em Nova Friburgo como
  testemunha de casamento em 1884 (PAR-0056) e como testamenteiro do cunhado em 1888 (PRB-0005);
  e Manoel Pereira de Lemos, nomeado irmão de Rosa, ali morreu em janeiro de 1898 como "o
  conhecido industrial da Venda das Pedras", aos 72 anos (NWS-0002) [PROVEN]. Uma família sem
  nada registrado em Itaboraí produziu, em uma geração e uma mudança para a serra, um
  *industrial* estabelecido e uma *Dona*. Como não há herança no registro que o explique, o
  capital que tornou isso possível foi feito na serra, no comércio. [INFERRED]

  **O que quer que ele possuísse dividiu-se ao menos por sete.** [CONTEXTUAL/INFERRED] Os
  registros disponíveis evidenciam Manoel (bat. 1831), Maria (1832), Anna (1834), Rosa Eugenia
  (1835), Thomaz (1836) e Polidoro (1838) no livro de Itaboraí, além de Candido Pereira de Lemos
  e Manoel Pereira de Lemos (f. 1898, aos 72 anos) no material de Nova Friburgo — sendo que este
  último pode ou não ser o Manoel batizado em 1831 [incerto]. Na partilha igualitária
  brasileira, sete ou oito herdeiros são a aritmética que impede uma pequena posse de se tornar
  patrimônio. No caso dele não há nada no registro a dividir, e esse é justamente o ponto: ele é
  o piso documentado desta família, e os Lemos entram no arco Borer/Bohrer apenas lateralmente,
  pelo casamento de uma filha.

  Nenhum sinal de letramento sobrevive para ele, e nenhum seria esperado: nada em sua vida
  registrada exigia uma assinatura. [CONTEXTUAL]

  ## Questões em aberto

  - Seus próprios pais e o sobrenome Pereira vs Ferreira — registro decisivo: o casamento
  em Itaboraí de Manoel de Lemos × Maria Thereza de Jesus, ou um inventário Lemos de
  Itaboraí. [OPEN]

  - Seu nascimento, óbito e qualquer mudança para Nova Friburgo — nenhum localizado.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0016 (batismo de Rosa em 1835 — "Manoel de Lemos", pai) · PAR-0030 (batismo de
  Maria em 1832) · PAR-0031 (batismo de Anna em 1834) · PAR-0032 (batismo de Thomaz em
  1836) · PAR-0033 (batismo de Polídoro em 1838) — todos em Itaboraí, nomeando-o como pai.

  - PRB-0005 (o testamento de 1888 de seu genro Francisco José Bohrer nomeia seu filho
  Candido Pereira de Lemos como testamenteiro / irmão de Rosa — a forma da família "de
  Lemos Pereira").

  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se em Itaboraí, um município rural de açúcar e
  agricultura a leste da Baía de Guanabara (vila a partir de 1833) — uma comunidade
  fluminense de descendência portuguesa, não parte da colônia suíço-alemã de Nova
  Friburgo. Nenhuma mudança de sua parte está documentada; a relocação de Itaboraí para
  Nova Friburgo pertence à geração do casamento de sua filha Rosa. [CONTEXTUAL]

