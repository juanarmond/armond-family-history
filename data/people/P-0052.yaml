profile: >-
  ## Identity

  **Manoel de Lemos Pereira** — the fuller family form; the register writes him variously
  "Manoel de Lemos" (1835 Rosa baptism, PAR-0016), "Manoel de Lemos Ferreira" (1832, 1834,
  1838 baptisms, PAR-0030 / PAR-0031 / PAR-0033) and simply "Manoel de Lemos" (1836,
  PAR-0032) — the Pereira/Ferreira alternation is scribal, one man [PROVEN]. He heads the
  Lemos line of Itaboraí (RJ): father of Rosa Eugenia de Lemos (P-0035), hence maternal
  grandfather of Joaquim José Bohrer (P-0030).

  - **Nationality:** Brazilian [PROVEN] — he and his wife are "naturaes desta freguezia"
  (Itaboraí) in the 1835 baptism (PAR-0016); a documented birthplace, not a surname
  inference.

  - **Parents:** unknown from any held record [OPEN].

  - **Marriage:** husband of Maria Thereza de Jesus (P-0053), family F-0025; the marriage
  act (which would name his father and settle Pereira vs Ferreira) is not held. An
  established married householder by the early 1830s implies a birth no later than
  c.1805–1810 [INFERRED].

  - **Children:** attested across the 1832–1838 Itaboraí baptism sweep — Maria (1832,
  PAR-0030), Anna (1834, PAR-0031), Rosa Eugenia (1835, PAR-0016), Thomaz (1836, PAR-0032)
  and Polídoro (1838, PAR-0033) [PROVEN]. His son Candido Pereira de Lemos is named as
  Rosa's brother in her husband's 1888 will (PRB-0005); a further son Manoel Antunes de
  Lemos is reported by the retrieval synthesis [LEAD, not catalogued].

  ## Standing and profession

  Nothing occupational, propertied or civic is documented — the held records name him only
  as a parent. What they do fix is a settled, church-integrated local family baptising
  legitimate children continuously at the Itaboraí matriz across at least 1832–1838, not
  an itinerant household. [INFERRED]

  ## Family and social network

  His social circle is legible only through his children's godparents: Manoel José da
  Silva and Flor de Maria da Conceição (Rosa, 1835); José Custódio Vieira (Maria, 1832);
  José Antonio and Anna Roza de Guimarães (Anna, 1834). The Guimarães godmother is a
  Lemos–Guimarães link worth noting but with no established connection to the family's
  other Guimarães line. [PROVEN]

  ## Open questions

  - His own parents and the Pereira-vs-Ferreira surname — decisive record: the Itaboraí
  marriage of Manoel de Lemos × Maria Thereza de Jesus, or an Itaboraí Lemos inventário.
  [OPEN]

  - His birth, death and any move to Nova Friburgo — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0016 (Rosa's 1835 baptism — "Manoel de Lemos", father) · PAR-0030 (Maria's 1832
  baptism) · PAR-0031 (Anna's 1834 baptism) · PAR-0032 (Thomaz's 1836 baptism) · PAR-0033
  (Polídoro's 1838 baptism) — all Itaboraí, naming him as father.

  - PRB-0005 (his son-in-law Francisco José Bohrer's 1888 will names his son Candido
  Pereira de Lemos as executor / Rosa's brother — the family form "de Lemos Pereira").

  ## Regional and migration context

  His whole documented life sits in Itaboraí, a rural sugar-and-agriculture municipality
  east of Guanabara Bay (a vila from 1833) — a Portuguese-descended fluminense community,
  not part of the Swiss-German Nova Friburgo colony. No move of his own is documented; the
  Itaboraí-to-Nova Friburgo relocation belongs to his daughter Rosa's marriage generation.
  [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Manoel de Lemos Pereira** — a forma mais completa da família; o registro o escreve de
  formas variadas: "Manoel de Lemos" (batismo de Rosa em 1835, PAR-0016), "Manoel de Lemos
  Ferreira" (batismos de 1832, 1834 e 1838, PAR-0030 / PAR-0031 / PAR-0033) e apenas
  "Manoel de Lemos" (1836, PAR-0032) — a alternância Pereira/Ferreira é de escrivão, um só
  homem [PROVEN]. Ele encabeça a linha Lemos de Itaboraí (RJ): pai de Rosa Eugenia de
  Lemos (P-0035) e, portanto, avô materno de Joaquim José Bohrer (P-0030).

  - **Nacionalidade:** brasileira [PROVEN] — ele e sua esposa são "naturaes desta
  freguezia" (Itaboraí) no batismo de 1835 (PAR-0016); um local de nascimento documentado,
  não uma inferência a partir do sobrenome.

  - **Pais:** desconhecidos em qualquer registro disponível [OPEN].

  - **Casamento:** marido de Maria Thereza de Jesus (P-0053), família F-0025; o assento de
  casamento (que nomearia seu pai e resolveria Pereira vs Ferreira) não está disponível.
  Um chefe de família já casado no início da década de 1830 implica um nascimento não
  posterior a c.1805–1810 [INFERRED].

  - **Filhos:** atestados na varredura dos batismos de Itaboraí de 1832–1838 — Maria
  (1832, PAR-0030), Anna (1834, PAR-0031), Rosa Eugenia (1835, PAR-0016), Thomaz (1836,
  PAR-0032) e Polídoro (1838, PAR-0033) [PROVEN]. Seu filho Candido Pereira de Lemos é
  nomeado como irmão de Rosa no testamento de 1888 de seu marido (PRB-0005); um outro
  filho, Manoel Antunes de Lemos, é relatado pela síntese de recuperação [LEAD, não
  catalogado].

  ## Posição social e profissão

  Nada de ocupacional, patrimonial ou cívico é documentado — os registros disponíveis o
  nomeiam apenas como pai. O que fixam é uma família local estabelecida e integrada à
  igreja, batizando filhos legítimos de forma contínua na matriz de Itaboraí ao longo de
  ao menos 1832–1838, não uma casa itinerante. [INFERRED]

  ## Família e rede social

  Seu círculo social só é legível pelos padrinhos de seus filhos: Manoel José da Silva e
  Flor de Maria da Conceição (Rosa, 1835); José Custódio Vieira (Maria, 1832); José
  Antonio e Anna Roza de Guimarães (Anna, 1834). A madrinha Guimarães é um vínculo
  Lemos–Guimarães digno de nota, mas sem conexão estabelecida com a outra linha Guimarães
  da família. [PROVEN]

  ## Questões em aberto

  - Seus próprios pais e o sobrenome Pereira vs Ferreira — registro decisivo: o casamento
  em Itaboraí de Manoel de Lemos × Maria Thereza de Jesus, ou um inventário Lemos de
  Itaboraí. [OPEN]

  - Seu nascimento, óbito e qualquer mudança para Nova Friburgo — nenhum localizado.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0016 (batismo de Rosa em 1835 — "Manoel de Lemos", pai) · PAR-0030 (batismo de
  Maria em 1832) · PAR-0031 (batismo de Anna em 1834) · PAR-0032 (batismo de Thomaz em
  1836) · PAR-0033 (batismo de Polídoro em 1838) — todos em Itaboraí, nomeando-o como pai.

  - PRB-0005 (o testamento de 1888 de seu genro Francisco José Bohrer nomeia seu filho
  Candido Pereira de Lemos como testamenteiro / irmão de Rosa — a forma da família "de
  Lemos Pereira").

  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se em Itaboraí, um município rural de açúcar e
  agricultura a leste da Baía de Guanabara (vila a partir de 1833) — uma comunidade
  fluminense de descendência portuguesa, não parte da colônia suíço-alemã de Nova
  Friburgo. Nenhuma mudança de sua parte está documentada; a relocação de Itaboraí para
  Nova Friburgo pertence à geração do casamento de sua filha Rosa. [CONTEXTUAL]
