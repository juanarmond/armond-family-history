    maternal grandfather and the head of the Lemos line of Itaboraí, RJ. Named in
    his daughter's 1835 Itaboraí baptism (PAR-0016) as "Manoel de Lemos … natural
    desta freguezia", married to Maria Thereza de Jesus (P-0053, family F-0025). The
    fuller surname "de Lemos Pereira" is the family form (his son "Thomaz de Lemos
    Pereira" is so indexed, and his son Candido Pereira de Lemos is named in Rosa's
    husband's 1888 will, PRB-0005). [corrected 2026-10-10: the will is dated 27 June 1879;
    it was opened and registered in 1888. Candido is named in it as Rosa's brother and
    second testamenteiro.]
