notes:
- text: >-
    Father of Rosa Eugenia de Lemos (P-0035); hence Joaquim José Bohrer's (P-0030)
    maternal grandfather and the head of the Lemos line of Itaboraí, RJ. Named in
    his daughter's 1835 Itaboraí baptism (PAR-0016) as "Manoel de Lemos … natural
    desta freguezia", married to Maria Thereza de Jesus (P-0053, family F-0025). The
    fuller surname "de Lemos Pereira" is the family form (his son "Thomaz de Lemos
    Pereira" is so indexed, and his son Candido Pereira de Lemos is named in Rosa's
    husband's 1888 will, PRB-0005).
  text_pt: >-
    Pai de Rosa Eugenia de Lemos (P-0035); portanto, o avô materno de Joaquim
    José Bohrer (P-0030) e o chefe da linha Lemos de Itaboraí, RJ. Nomeado no
    batismo de 1835 de sua filha em Itaboraí (PAR-0016) como "Manoel de Lemos …
    natural desta freguezia", casado com Maria Thereza de Jesus (P-0053, família
    F-0025). O sobrenome mais completo "de Lemos Pereira" é a forma da família
    (seu filho "Thomaz de Lemos Pereira" está assim indexado, e seu filho Candido
    Pereira de Lemos é nomeado no testamento de 1888 do marido de Rosa, PRB-0005).
- text: >-
    Nationality Brazilian: he and his wife are "naturaes desta freguezia" (Itaboraí,
    RJ) in the 1835 baptism — a documented birthplace, not a surname inference. His
    own parents are not evidenced by the located records.
  text_pt: >-
    Nacionalidade brasileira: ele e sua esposa são "naturaes desta freguezia"
    (Itaboraí, RJ) no batismo de 1835 — um local de nascimento documentado, não
    uma inferência a partir do sobrenome. Seus próprios pais não são evidenciados
    pelos registros localizados.
