profile: >-
  ## Interesting facts

  - **[PROVEN]** He is documented by one line in a Brazilian book: his son Laurent's 1820 Nova
  Friburgo marriage names the groom son of "Jacobo Borer natural de Grindel no cantão de
  Soleure" (PAR-0060). That single clause is what separates the Grindel Borer line from the
  other Solothurn Borer family in this tree.

  - **[PROVEN]** The same record is silent about his wife. Laurent's mother is not named, and
  no held document supplies her — a deliberate gap, not an oversight.

  - **[CONTEXTUAL]** "Jacobo Borer" is the Portuguese-speaking vicar writing a Swiss-German
  name as he heard it, the routine adaptation across the Nova Friburgo registers, where the
  same family appears as Borer, Bohrer, Bhorer, Bocher and Bor[b]er within three generations.

  - **[CONTEXTUAL]** The Borer surname was common across Canton Solothurn. This Grindel
  household is documented as distinct from the Borer family of the Beinwil/Erschwil side
  (P-0050) and from Elisabetha Borer's father Joseph Borer of Erschwil (P-0076) — three
  separate Solothurn households sharing one surname. Do not conflate them.

  - **[LEAD]** A FamilySearch collaborative tree (node K82M-9K6, resting on FHC-restricted
  Swiss registers) gives him **5 April 1752 – 3 November 1817, Grindel**, a wife **Maria Anna
  Heggendorn** (1755–1829) who would then be Laurent's mother, and parents **Jakob Borer
  (~1720–1790) × Maria Anna Wehrli (~1720–1791)** — another Borer×Wehrli union in the same
  village. None of it is confirmed by a held image; all of it is navigation only. If the 1817
  death is right, he died two years before his son emigrated.

  - **[LEAD]** A published Brazilian-roots genealogy and WikiTree (Borer-110/109) document
  Grindel Borers back to the 1670s — Maria Borer b. 1677 and Jakob Borer b. 1695, both
  Grindel. A parallel stock, not proven to join his, but it shows the surname was continuously
  rooted in the village.

  ## Identity

  **Jacob Borer (of Grindel)** — a Swiss man of Grindel, Canton Solothurn, known as the father
  of the Nova Friburgo immigrant Laurent (Lourenço) Borer (P-0068). [PROVEN]

  - **Identification:** named "Jacobo Borer, natural de Grindel, no cantão de Soleure" in
  Laurent's 1820 Nova Friburgo marriage register [PROVEN — PAR-0060]. This supersedes the
  compilation's hedged "certo Jacob Borer, de Grindel" and the earlier, unconfirmed "Joannes
  Borer × Ana Maria Werli" Grindel-register lead.

  - **Wife (Laurent's mother):** **not named in the record** [OPEN]. The FamilySearch tree
  assigns Maria Anna Heggendorn (b. 27 Jun 1755 – d. 11 Jan 1829) [LEAD — node KH6W-FSR]. She
  is not the same person as Vicente Borer's wife Thecla Regina Heggendorn (b. 1844) or any
  other Heggendorn in this archive; the Thierstein cluster has several Heggendorn × Borer
  unions.

  - **Birth and death:** 5 April 1752 – 3 November 1817, Grindel [LEAD only — FS tree node
  K82M-9K6, 2026-08-12]. Nothing at primary level.

  - **His own parents:** Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791) [LEAD — FS
  tree GC9T-M3K / L1L1-LVB].

  - **Distinct persons:** not Jacob Bohrer of Beinwil/Erschwil (P-0050, who married Catharina
  Moser in 1825), and not Joseph Borer of Erschwil (P-0076, father of Elisabetha Borer).

  ## Standing and profession

  Nothing is documented. No occupation, property, office, title or literacy appears in the one
  record that names him; the compilation gives his son's profession as "desconhecida" and says
  nothing about the father's. What the 1820 act does establish is that he was a Grindel man —
  so the family belonged to the parish that kept the registers in which the Wehrli and
  Heggendorn households also appear. [PROVEN for Grindel; everything else OPEN]

  ## Family and social network

  - **Son:** Laurent (Lourenço) Borer (P-0068), who emigrated to Nova Friburgo in the 1819
  Swiss wave, took Casa 73 / Lote 86 and married Anna Maria Wehrli there in 1820. He is the
  sole named parent of parentage family F-0049. [PROVEN — PAR-0060]

  - **A village of intermarried surnames:** if the FamilySearch ascent is right, his own
  mother was a Wehrli and his wife a Heggendorn [LEAD] — the same three surnames (Borer,
  Wehrli, Heggendorn) that recombine in Grindel's registers in the 1750s and again at Nova
  Friburgo in the 1820s–60s. Suggestive of a very small marriage pool; not evidence of any
  specific link.

  - **He did not emigrate.** If the 1817 death date holds, he was dead before the *Heureux
  Voyage* sailed — consistent with his son travelling without him. [LEAD]

  ## What we can extrapolate

  - **The record gives him a village, and the village is the analysis [CONTEXTUAL /
  INFERRED].** Grindel is a small parish in the Thierstein district of the Solothurn Jura —
  the Schwarzbubenland — Catholic, German-speaking, and poor: upland farming country whose
  holdings were divided among heirs generation after generation until the shares were too
  small to support a household. Nothing in the record raises his family above that; nothing in
  the region's history makes it likely. He is a Jura smallholder by default, and the honest
  label is that no document says otherwise.

  - **What he did not transmit is the point [INFERRED].** His son emigrated in 1819 carrying
  no land, no capital and no office — the colony gave Laurent a lot; the father gave him
  nothing that shows. In a partible-inheritance region, that is not a failure but the normal
  arithmetic: a Grindel holding split among several heirs yields shares that are worth less
  than a free passage and a Brazilian land grant. The emigration is best read as the son
  cashing out of a system that had nothing left to divide, and if the FS tree's 1817 death is
  right, he did it in the first year he was free to.

  - **Status here is neither inherited nor married-in nor earned by office — it simply does
  not exist in the record [INFERRED].** That is itself informative when set against the
  family's Armond line, where the documents are full of titles, appointments and court roles.
  The Borer trunk enters this tree at a level where the only documents that name a man are his
  children's sacramental acts. The whole Bohrer arc is measured upward from this floor.

  - **He is the branch point between two Borer trunks that later reconverge [INFERRED].** His
  Grindel line and the separate Beinwil/Erschwil line of Jacob Bohrer (P-0050) sailed in the
  same 1819 cohort, settled on different lots, and stayed documentarily distinct — yet a
  century later their descendants married each other (the Bohrer × Bohrer union of Iris
  Bohrer's parents). Whether the two Solothurn households shared blood is undocumented, and it
  should stay an open question rather than a convenient assumption.

  ## Open questions

  - **Laurent's mother** — not named in PAR-0060. Laurent's own Grindel baptism (~1797;
  FamilySearch collection 4138674, FHC-restricted) or the Grindel Catholic parish registers
  would name her and test the FS tree's "Maria Anna Heggendorn". [OPEN]

  - **His own birth, marriage and death** — the Grindel registers (Staatsarchiv Solothurn /
  Bistum Basel-Solothurn, or FHC microfilm) would move the 1752–1817 dates from tree lead to
  evidence. [OPEN]

  - **His parentage** — the same Grindel books; the FS tree's "Jakob Borer × Maria Anna
  Wehrli" remains unverified and must not be minted as entities on tree authority alone.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0060 (1820 Nova Friburgo marriage of his son Laurent Borer — names "Jacobo Borer
  natural de Grindel, no cantão de Soleure" as Laurent's father; Laurent's mother unnamed).

  - Not held: the FamilySearch collaborative tree nodes (K82M-9K6, KH6W-FSR, GC9T-M3K,
  L1L1-LVB) and the WikiTree/published Grindel Borer ascent — leads only, never evidence.

  ## Regional and migration context

  Grindel lies in the Bezirk Thierstein of Canton Solothurn, in the Catholic, German-speaking
  Jura upland known as the Schwarzbubenland: small parishes, poor soil, and smallholdings
  repeatedly divided among heirs. [CONTEXTUAL] Through the 19th century agriculture was the
  canton's main activity, and these Jura villages were its poorest part. The 1815 Tambora
  eruption and the resulting 1816 "Year Without a Summer" famine, landing on post-Napoleonic
  poverty, turned chronic land hunger into emigration; Dom João VI's *Decreto de 16 de maio de
  1818* offered a passage and a land grant at Nova Friburgo to Swiss **Catholic** families,
  and Grindel households — Borer, Wehrli, Heggendorn — took it. Jacob stayed in Grindel; his
  son sailed on the *Heureux Voyage* in 1819. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (birth, marriage and death all unsearched at primary level):** Kath.
  Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn, Switzerland — the parish that holds
  the registers for his whole life [OPEN] · [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Where he is named:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — the parish whose 1820
  marriage book records him [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Está documentado por uma linha num livro brasileiro: o casamento de 1820 de
  seu filho Laurent, em Nova Friburgo, nomeia o noivo filho de "Jacobo Borer natural de
  Grindel no cantão de Soleure" (PAR-0060). Essa única oração é o que separa a linha Borer de
  Grindel da outra família Borer de Solothurn presente nesta árvore.

  - **[PROVEN]** O mesmo registro silencia sobre a esposa. A mãe de Laurent não é nomeada, e
  nenhum documento disponível a fornece — lacuna deliberada, não descuido.

  - **[CONTEXTUAL]** "Jacobo Borer" é o vigário lusófono grafando um nome suíço-alemão como o
  ouviu, adaptação corriqueira nos registros de Nova Friburgo, onde a mesma família aparece
  como Borer, Bohrer, Bhorer, Bocher e Bor[b]er em três gerações.

  - **[CONTEXTUAL]** O sobrenome Borer era comum em todo o Cantão de Solothurn. Este domicílio
  de Grindel está documentado como distinto da família Borer do lado Beinwil/Erschwil (P-0050)
  e de Joseph Borer, de Erschwil, pai de Elisabetha Borer (P-0076) — três domicílios de
  Solothurn separados a partilhar um sobrenome. Não confundir.

  - **[LEAD]** Uma árvore colaborativa do FamilySearch (nó K82M-9K6, apoiada em registros
  suíços restritos ao FHC) dá-lhe **5 de abril de 1752 – 3 de novembro de 1817, Grindel**, uma
  esposa **Maria Anna Heggendorn** (1755–1829), que seria então a mãe de Laurent, e pais
  **Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791)** — outra união Borer×Wehrli na
  mesma aldeia. Nada disso está confirmado por imagem retida; tudo serve apenas de pista. Se a
  morte em 1817 estiver certa, morreu dois anos antes de o filho emigrar.

  - **[LEAD]** Uma genealogia brasileira publicada e o WikiTree (Borer-110/109) documentam
  Borer de Grindel desde a década de 1670 — Maria Borer n. 1677 e Jakob Borer n. 1695, ambos
  de Grindel. Tronco paralelo, sem ligação provada ao dele, mas que mostra o sobrenome
  continuamente enraizado na aldeia.

  ## Identidade

  **Jacob Borer (de Grindel)** — homem suíço de Grindel, Cantão de Soleure (Solothurn),
  conhecido como pai do imigrante de Nova Friburgo Laurent (Lourenço) Borer (P-0068). [PROVEN]

  - **Identificação:** nomeado "Jacobo Borer, natural de Grindel, no cantão de Soleure" no
  registro de casamento de 1820 de Laurent, em Nova Friburgo [PROVEN — PAR-0060]. Isso supera
  o "certo Jacob Borer, de Grindel" hedge da compilação e a anterior pista não confirmada do
  registro de Grindel "Joannes Borer × Ana Maria Werli".

  - **Esposa (mãe de Laurent):** **não nomeada no registro** [OPEN]. A árvore do FamilySearch
  atribui Maria Anna Heggendorn (n. 27 jun. 1755 – f. 11 jan. 1829) [LEAD — nó KH6W-FSR]. Não
  é a mesma pessoa que a esposa de Vicente Borer, Thecla Regina Heggendorn (n. 1844), nem
  nenhuma outra Heggendorn deste arquivo; o conjunto de Thierstein tem várias uniões
  Heggendorn × Borer.

  - **Nascimento e óbito:** 5 de abril de 1752 – 3 de novembro de 1817, Grindel [apenas LEAD —
  nó FS K82M-9K6, 2026-08-12]. Nada em nível primário.

  - **Seus próprios pais:** Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791) [LEAD —
  FS GC9T-M3K / L1L1-LVB].

  - **Pessoas distintas:** não é Jacob Bohrer de Beinwil/Erschwil (P-0050, que se casou com
  Catharina Moser em 1825), nem Joseph Borer de Erschwil (P-0076, pai de Elisabetha Borer).

  ## Posição social e profissão

  Nada está documentado. Nenhuma ocupação, propriedade, cargo, título ou alfabetização aparece
  no único registro que o nomeia; a compilação dá a profissão do filho como "desconhecida" e
  nada diz sobre a do pai. O que o ato de 1820 de fato estabelece é que era homem de Grindel —
  logo, a família pertencia à paróquia cujos livros também registram os domicílios Wehrli e
  Heggendorn. [PROVEN quanto a Grindel; todo o resto OPEN]

  ## Família e rede social

  - **Filho:** Laurent (Lourenço) Borer (P-0068), que emigrou para Nova Friburgo na leva suíça
  de 1819, tomou a Casa 73 / Lote 86 e ali se casou com Anna Maria Wehrli em 1820. É o único
  pai nomeado da família parental F-0049. [PROVEN — PAR-0060]

  - **Uma aldeia de sobrenomes entrecasados:** se a ascendência do FamilySearch estiver certa,
  sua própria mãe era Wehrli e sua esposa, Heggendorn [LEAD] — os mesmos três sobrenomes
  (Borer, Wehrli, Heggendorn) que se recombinam nos livros de Grindel na década de 1750 e
  outra vez em Nova Friburgo entre as décadas de 1820 e 1860. Sugestivo de um repertório
  matrimonial muito estreito; não é evidência de nenhum vínculo específico.

  - **Ele não emigrou.** Se a data de morte de 1817 se sustentar, estava morto antes de o
  *Heureux Voyage* zarpar — coerente com o filho viajando sem ele. [LEAD]

  ## O que podemos extrapolar

  - **O registro lhe dá uma aldeia, e a aldeia é a análise [CONTEXTUAL / INFERRED].** Grindel
  é uma pequena paróquia do distrito de Thierstein, no Jura de Solothurn — o Schwarzbubenland
  —, católica, germanófona e pobre: terra de lavoura de planalto cujas posses eram divididas
  entre herdeiros geração após geração, até os quinhões não sustentarem um domicílio. Nada no
  registro eleva sua família acima disso; nada na história da região torna isso provável. É,
  por padrão, um pequeno lavrador do Jura, e o rótulo honesto é que nenhum documento diz o
  contrário.

  - **O que ele não transmitiu é o ponto [INFERRED].** O filho emigrou em 1819 sem levar
  terra, capital ou cargo — a colônia deu a Laurent um lote; o pai não lhe deu nada que
  apareça. Numa região de herança partível, isso não é fracasso, e sim a aritmética normal:
  uma posse de Grindel repartida entre vários herdeiros rende quinhões que valem menos do que
  uma passagem gratuita e uma concessão de terra no Brasil. A emigração se lê melhor como o
  filho liquidando a participação num sistema que já não tinha o que dividir — e, se o óbito
  de 1817 da árvore FS estiver certo, ele o fez no primeiro ano em que esteve livre para
  tanto.

  - **Aqui a posição social não é herdada, nem obtida por casamento, nem conquistada por cargo
  — ela simplesmente não existe no registro [INFERRED].** Isso é por si informativo quando
  posto ao lado da linha Armond da família, cujos documentos estão cheios de títulos,
  nomeações e funções judiciais. O tronco Borer entra nesta árvore num nível em que os únicos
  documentos que nomeiam um homem são os atos sacramentais de seus filhos. Todo o arco Bohrer
  é medido para cima a partir desse piso.

  - **Ele é o ponto de ramificação entre dois troncos Borer que depois reconvergem
  [INFERRED].** Sua linha de Grindel e a linha separada de Beinwil/Erschwil de Jacob Bohrer
  (P-0050) vieram na mesma coorte de 1819, assentaram-se em lotes diferentes e permaneceram
  documentalmente distintas — e, no entanto, um século depois os descendentes das duas se
  casaram entre si (a união Bohrer × Bohrer dos pais de Iris Bohrer). Se os dois domicílios de
  Solothurn partilhavam sangue é algo não documentado, e deve continuar como questão em
  aberto, não como suposição conveniente.

  ## Questões em aberto

  - **A mãe de Laurent** — não nomeada em PAR-0060. O próprio batismo de Laurent em Grindel
  (~1797; coleção FamilySearch 4138674, restrita ao FHC) ou os livros paroquiais católicos de
  Grindel a nomeariam e testariam a "Maria Anna Heggendorn" da árvore FS. [OPEN]

  - **Seu próprio nascimento, casamento e óbito** — os livros de Grindel (Staatsarchiv
  Solothurn / Bistum Basel-Solothurn, ou microfilme do FHC) moveriam as datas 1752–1817 de
  pista de árvore para evidência. [OPEN]

  - **Sua filiação** — os mesmos livros de Grindel; o "Jakob Borer × Maria Anna Wehrli" da
  árvore FS segue não verificado e não deve ser criado como entidade apenas por autoridade de
  árvore. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0060 (casamento de 1820, em Nova Friburgo, do filho Laurent Borer — nomeia "Jacobo
  Borer natural de Grindel, no cantão de Soleure" como pai de Laurent; mãe de Laurent não
  nomeada).

  - Não disponíveis: os nós da árvore colaborativa do FamilySearch (K82M-9K6, KH6W-FSR,
  GC9T-M3K, L1L1-LVB) e a ascendência Borer de Grindel do WikiTree / da genealogia publicada —
  apenas pistas, nunca evidência.

  ## Contexto regional e migratório

  Grindel fica no Bezirk Thierstein, Cantão de Solothurn, no planalto católico e germanófono
  do Jura conhecido como Schwarzbubenland: paróquias pequenas, solo pobre e minifúndios
  repetidamente divididos entre herdeiros. [CONTEXTUAL] Ao longo do século XIX a agricultura
  foi a principal atividade do cantão, e essas aldeias do Jura eram sua parte mais pobre. A
  erupção do Tambora em 1815 e a fome do "Ano Sem Verão" de 1816 dela resultante, caindo sobre
  a pobreza pós-napoleônica, converteram a fome crônica de terra em emigração; o *Decreto de
  16 de maio de 1818* de Dom João VI ofereceu passagem e concessão de terra em Nova Friburgo a
  famílias suíças **católicas**, e domicílios de Grindel — Borer, Wehrli, Heggendorn —
  aceitaram. Jacob ficou em Grindel; o filho embarcou no *Heureux Voyage* em 1819.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de origem (nascimento, casamento e óbito todos por buscar em nível
  primário):** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn, Suíça — a paróquia
  que guarda os livros de toda a sua vida [OPEN] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Onde ele é nomeado:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — a paróquia cujo livro de
  casamentos de 1820 o registra [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
