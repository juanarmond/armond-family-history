profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Jacob Borer was from Grindel, Canton Solothurn, Switzerland — one of the smaller cantons that contributed settlers to the Nova Friburgo recruitment of 1818–1820 under Dom João VI's decree. His son Laurent emigrated while Jacob himself remained in Grindel (and predeceased the 1819 colonization scheme — see Identity below).

  - **[INFERRED]** He is known to us entirely through a Brazilian parish record: the 1820 Nova Friburgo marriage of his son Laurent. He never appears in any colony document himself, establishing that he stayed in Switzerland when his son emigrated.

  - **[CONTEXTUAL]** The record spelling "Jacobo Borer" reflects the Portuguese-speaking priest's phonetic rendering of the Swiss-German surname — a routine adaptation in Nova Friburgo's Catholic parish registers, where German and Swiss names were recorded as heard rather than as written.

  - **[CONTEXTUAL]** The Borer surname was widespread in Canton Solothurn: this Grindel-line Borer family is entirely distinct from the Erschwil-line Borer family (P-0050 / P-0073) also represented in this archive — two separate Solothurn households sharing a common surname, not the same lineage. ⚠️ Do not conflate with either the Erschwil Jacob Borer (P-0050) or with Elisabetha Borer's father Joseph Borer (P-0076).

  - **[LEAD]** A FS collaborative Family Tree (node K82M-9K6, FHC-restricted Swiss registers) assigns him **birth 5 April 1752 – death 3 November 1817**, both in Grindel, which would mean he died before his son Laurent emigrated in 1819 — consistent with Laurent emigrating without his father. He is also assigned a wife **Maria Anna Heggendorn** (b. 27 Jun 1755 – d. 11 Jan 1829) who would then be Laurent's mother. His own parents are listed as **Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791)** — another Borer×Wehrli union. All [LEAD, FHC-gated; verify at a Family History Center]. None of this has been confirmed by a held primary image.

  - **[LEAD]** An independent published Brazilian-roots genealogy (Miami PDF) and WikiTree (Borer-110/109) document a Grindel Borer stock reaching back to the 1670s — **Maria Borer b. 4 Apr 1677 Grindel** and **Jakob Borer b. 4 Apr 1695 Grindel** — showing continuous Borer presence in the village. This is a parallel / cousin Grindel Borer line not proven to connect to this Jacob, but it makes the deep ascent plausible.

  ## Identity

  **Jacob Borer (of Grindel)** — a Swiss man of Grindel, Canton Solothurn, known as the father of
  the Nova Friburgo immigrant Laurent (Lourenço) Borer (P-0068). [PROVEN]

  - **Identification:** named "Jacobo Borer, natural de Grindel, no cantão de Soleure [Solothurn]"
  in Laurent's 1820 Nova Friburgo marriage register (PAR-0060). [PROVEN] Laurent's mother is not
  named in that record. [OPEN — FS tree assigns Maria Anna Heggendorn as wife/Laurent's mother;
  LEAD only]
  - **Birth / Death:** **5 April 1752 – 3 November 1817, Grindel** [LEAD — FS Tree node K82M-9K6,
  FHC-restricted Swiss registers, 2026-08-12]. He would have died before the 1819 *Heureux
  Voyage*, consistent with Laurent emigrating without his father.
  - **Wife (Laurent's mother):** **Maria Anna Heggendorn** (b. 27 Jun 1755 – d. 11 Jan 1829) [LEAD
  — FS Tree node KH6W-FSR]. ⚠️ Not the same as Vicente Borer's wife Thecla Regina Heggendorn
  (b.1844) or any other Heggendorn in the archive; the Thierstein cluster has multiple
  Heggendorn×Borer unions.
  - **His parents:** **Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791)** [LEAD — FS Tree
  GC9T-M3K/L1L1-LVB]. Another Borer×Wehrli union in Grindel.
  - **Distinct persons:** not to be confused with Jacob Bohrer of Erschwil (P-0050, who married
  Catharina Moser in 1825) or with Elisabetha Borer's father Joseph Borer (P-0076, Erschwil) —
  all separate Solothurn Borer families sharing the surname.

  ## Family

  He is the sole named parent in the Grindel-line parentage family F-0049, linked to Laurent Borer
  (P-0068) by the 1820 marriage record alone. [PROVEN — PAR-0060] A FS collaborative tree assigns
  him birth and death dates (5 Apr 1752 – 3 Nov 1817, Grindel), a wife (Maria Anna Heggendorn,
  1755–1829), and parents (Jakob Borer ~1720–1790 × Maria Anna Wehrli ~1720–1791); all rest on
  FHC-restricted Swiss registers not confirmed by a held primary source [LEAD]. His predeceasing
  the 1819 emigration (d. 1817) is consistent with Laurent emigrating without him.

  ## Open questions

  - Laurent's mother — not named in PAR-0060; requires Laurent's FHC-gated Grindel baptism record
  (FS collection 4138674) or the Grindel Catholic parish registers. [OPEN]
  - Jacob's birth, marriage and death dates; his own parentage — all unreached at primary level.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0060 (1820 Nova Friburgo marriage of son Laurent Borer — names "Jacobo Borer natural de
  Grindel, Cantão de Soleure" as Laurent's father; Laurent's mother unnamed).
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Jacob Borer era de Grindel, Cantão de Soleure (Solothurn), Suíça — um dos cantões menores que contribuíram com colonos para o recrutamento de Nova Friburgo de 1818–1820 sob decreto de Dom João VI. Seu filho Laurent emigrou enquanto Jacob permaneceu em Grindel (e já havia falecido antes do esquema de colonização de 1819 — ver Identidade abaixo).

  - **[INFERRED]** Chegamos a conhecê-lo inteiramente por meio de um registro paroquial brasileiro: o casamento de 1820 de seu filho Laurent em Nova Friburgo. Ele nunca aparece em nenhum documento da colônia, o que estabelece que ficou na Suíça quando o filho emigrou.

  - **[CONTEXTUAL]** A grafia "Jacobo Borer" no registro reflete a transcrição fonética do pároco lusófono do sobrenome suíço-alemão — uma adaptação corriqueira nos registros paroquiais católicos de Nova Friburgo, onde nomes alemães e suíços eram registrados como ouvidos, e não como escritos.

  - **[CONTEXTUAL]** O sobrenome Borer era comum no Cantão de Solothurn: esta família Borer da linha de Grindel é inteiramente distinta da família Borer da linha de Erschwil (P-0050 / P-0073) também representada neste arquivo — dois domicílios separados de Solothurn que partilham o mesmo sobrenome, e não uma única linhagem. ⚠️ Não confundir com o Jacob Borer de Erschwil (P-0050) nem com o pai de Elisabetha Borer, Joseph Borer (P-0076).

  - **[LEAD]** Uma árvore colaborativa do FamilySearch (nó K82M-9K6, registros suíços restritos ao FHC) lhe atribui **nascimento em 5 de abril de 1752 – falecimento em 3 de novembro de 1817**, ambos em Grindel, o que significaria que faleceu antes de seu filho Laurent emigrar em 1819 — coerente com Laurent emigrando sem o pai. Também lhe é atribuída uma esposa **Maria Anna Heggendorn** (n. 27 jun. 1755 – f. 11 jan. 1829), que seria então a mãe de Laurent. Seus próprios pais são listados como **Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791)** — outra união Borer×Wehrli. Tudo [LEAD, registros FHC-restritos; verificar num Centro de História Familiar]. Nenhum destes dados foi confirmado por imagem primária retida.

  - **[LEAD]** Uma genealogia brasileira publicada independente (PDF Miami) e WikiTree (Borer-110/109) documentam um tronco Borer de Grindel remontando à década de 1670 — **Maria Borer n. 4 abr. 1677 Grindel** e **Jakob Borer n. 4 abr. 1695 Grindel** — mostrando presença contínua do sobrenome na aldeia. Esta é uma linha Borer paralela/colateral não provadamente ligada a este Jacob, mas torna plausível a ascendência profunda.

  ## Identidade

  **Jacob Borer (de Grindel)** — homem suíço de Grindel, Cantão de Soleure (Solothurn), conhecido
  como pai do imigrante de Nova Friburgo Laurent (Lourenço) Borer (P-0068). [PROVEN]

  - **Identificação:** nomeado "Jacobo Borer, natural de Grindel, no cantão de Soleure [Solothurn]"
  no registro de casamento de 1820 de Laurent, em Nova Friburgo (PAR-0060). [PROVEN] A mãe de
  Laurent não é nomeada nesse registro. [OPEN — árvore FS atribui Maria Anna Heggendorn como
  esposa/mãe de Laurent; apenas LEAD]
  - **Nascimento / Óbito:** **5 de abril de 1752 – 3 de novembro de 1817, Grindel** [LEAD — nó FS
  K82M-9K6, registros suíços restritos ao FHC, 2026-08-12]. Teria falecido antes do *Heureux
  Voyage* de 1819, coerente com Laurent emigrando sem o pai.
  - **Esposa (mãe de Laurent):** **Maria Anna Heggendorn** (n. 27 jun. 1755 – f. 11 jan. 1829)
  [LEAD — nó FS KH6W-FSR]. ⚠️ Não é a mesma que a esposa de Vicente Borer, Thecla Regina
  Heggendorn (n. 1844), nem nenhuma outra Heggendorn do arquivo.
  - **Seus pais:** **Jakob Borer (~1720–1790) × Maria Anna Wehrli (~1720–1791)** [LEAD — FS
  GC9T-M3K/L1L1-LVB]. Outra união Borer×Wehrli em Grindel.
  - **Pessoas distintas:** não confundir com Jacob Bohrer de Erschwil (P-0050, que se casou com
  Catharina Moser em 1825) nem com o pai de Elisabetha Borer, Joseph Borer (P-0076, Erschwil)
  — todas famílias Borer separadas do Cantão de Solothurn que partilham o sobrenome.

  ## Família

  Ele é o único pai nomeado na família parental da linha de Grindel F-0049, vinculado a Laurent
  Borer (P-0068) apenas pelo registro de casamento de 1820. [PROVEN — PAR-0060] Uma árvore
  colaborativa do FamilySearch lhe atribui datas de nascimento e falecimento (5 abr. 1752 – 3 nov.
  1817, Grindel), uma esposa (Maria Anna Heggendorn, 1755–1829) e pais (Jakob Borer ~1720–1790 ×
  Maria Anna Wehrli ~1720–1791); todos baseiam-se em registros suíços restritos ao FHC não
  confirmados por imagem primária retida [LEAD]. Seu pré-falecimento à emigração de 1819 (f. 1817)
  é coerente com Laurent emigrando sem ele.

  ## Questões em aberto

  - A mãe de Laurent — não nomeada em PAR-0060; requer o registro de batismo de Laurent em
  Grindel, restrito ao FHC (coleção FS 4138674), ou os registros paroquiais católicos de Grindel.
  [OPEN]
  - Datas de nascimento, casamento e falecimento de Jacob; própria filiação — não alcançadas no
  nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0060 (casamento de 1820, em Nova Friburgo, do filho Laurent Borer — nomeia "Jacobo Borer
  natural de Grindel, Cantão de Soleure" como pai de Laurent; mãe de Laurent não nomeada).
