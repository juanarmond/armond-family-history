profile: >-
  ## Identity

  **Emmerenciana Maria de Jesus** (also *Emerenciana*) [PROVEN]. Wife of Francisco José de
  Carvalho Guimarães (P-0021) and mother of Maria Aurora Guimarães (P-0011).

  - **Born:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007); date not recorded.

  - **Parents:** Antonio Francisco da Silva (P-0025) and Maria Paula de Jesus (P-0026)
  [PROVEN as reported] — named as the maternal grandparents in her children's 1915 birth
  registration (CIV-0007).

  - **Children:** the six Carvalho Guimarães children registered in 1915 (see P-0021),
  including Maria Aurora (P-0011). [PROVEN]

  - **Death:** before 1991 (CIV-0018); date and place not held. [INFERRED]

  ## Standing and profession

  - **Lavradora (farmer)** at São Francisco do Glória in 1915 [PROVEN] — CIV-0007 describes
  the couple collectively as "lavradores".

  ## What we can extrapolate

  Her documented standing is derived from her marriage, not from property or lineage of her
  own. [INFERRED / CONTEXTUAL] As the wife of Francisco José de Carvalho Guimarães — of a
  locally-prominent Carangola family, possibly holding Guarda Nacional Alferes rank (a
  [LEAD]) — her adult position was that of that family, but she carried it as his wife. Her
  devotional surname "Maria de Jesus" carries no patronymic capital of its own, and her
  parents (Antonio Francisco da Silva and Maria Paula de Jesus, named in CIV-0007) appear
  only as names, with no recorded standing of their own; whatever her natal class, the
  position visible in the record is the one the marriage conferred.

  ## Note on identity

  Not to be confused with her mother-in-law Maria Tertuliana da Conceição (P-0024,
  Vicente's wife): an earlier misread of CIV-0007 paired Vicente with "Emmerenciana"; the
  record in fact makes Emmerenciana the wife of Francisco (Maria Aurora's mother),
  corroborated by Cidália's 1930 birth (CIV-0022) and Maria Aurora's 1991 death (CIV-0018).

  ## Open questions

  - Her marriage, birth and death records — not held; would independently confirm her
  parents, currently known only from informant statements at a 1915 retrospective
  registration. [OPEN]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her, her husband and her parents)
  · CIV-0018 (daughter Maria Aurora's 1991 death) · CIV-0022 (granddaughter Cidália's 1930
  birth) — the latter two name her as mother / maternal grandmother.

  ## Where to go today

  - **Adult life (approx.):** Igreja Matriz de Santa Luzia, Carangola area, MG
  [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Identidade

  **Emmerenciana Maria de Jesus** (também *Emerenciana*) [PROVEN]. Esposa de Francisco José
  de Carvalho Guimarães (P-0021) e mãe de Maria Aurora Guimarães (P-0011).

  - **Nascimento:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007); data não registrada.

  - **Pais:** Antonio Francisco da Silva (P-0025) e Maria Paula de Jesus (P-0026) [PROVEN
  conforme declarado] — nomeados como avós maternos no registro de nascimento de 1915 de
  seus filhos (CIV-0007).

  - **Filhos:** os seis filhos Carvalho Guimarães registrados em 1915 (ver P-0021),
  incluindo Maria Aurora (P-0011). [PROVEN]

  - **Óbito:** antes de 1991 (CIV-0018); data e local não obtidos. [INFERRED]

  ## Posição social e profissão

  - **Lavradora** em São Francisco do Glória em 1915 [PROVEN] — CIV-0007 descreve o casal
  coletivamente como "lavradores".

  ## O que podemos extrapolar

  Sua posição documentada deriva do casamento, e não de propriedade ou linhagem próprias.
  [INFERRED / CONTEXTUAL] Como esposa de Francisco José de Carvalho Guimarães — de uma família
  localmente proeminente de Carangola, possivelmente detentora da patente de Alferes da Guarda
  Nacional (uma [LEAD]) —, sua posição adulta era a dessa família, mas ela a portava como
  esposa dele. Seu sobrenome devocional "Maria de Jesus" não carrega capital patronímico
  próprio, e seus pais (Antonio Francisco da Silva e Maria Paula de Jesus, nomeados em
  CIV-0007) aparecem apenas como nomes, sem posição registrada própria; qualquer que fosse
  sua classe de origem, a posição visível no registro é a que o casamento conferiu.

  ## Nota de identidade

  Não confundir com sua sogra Maria Tertuliana da Conceição (P-0024, esposa de Vicente):
  uma leitura anterior de CIV-0007 emparelhou Vicente com "Emmerenciana"; o registro, de
  fato, faz de Emmerenciana a esposa de Francisco (mãe de Maria Aurora), corroborado pelo
  nascimento de 1930 de Cidália (CIV-0022) e pelo óbito de 1991 de Maria Aurora (CIV-0018).

  ## Questões em aberto

  - Seus registros de casamento, nascimento e óbito — não obtidos; confirmariam de forma
  independente seus pais, hoje conhecidos apenas por declarações de informante em um
  registro retroativo de 1915. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — nomeia ela, o marido e os pais
  dela) · CIV-0018 (óbito de 1991 da filha Maria Aurora) · CIV-0022 (nascimento de 1930 da
  neta Cidália) — os dois últimos a nomeiam como mãe / avó materna.

  ## Onde ir hoje

  - **Vida adulta (aprox.):** Igreja Matriz de Santa Luzia, região de Carangola, MG
  [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
