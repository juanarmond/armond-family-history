profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É natural do distrito de São Francisco do Glória, o mesmo distrito onde todos os seis filhos nasceram e onde ainda lavrava em 1915 (CIV-0007). Toda a sua vida documentada nunca saiu de um único distrito da região de Carangola — uma vida ancorada no lugar de forma que contrasta com a migração posterior da geração de seus filhos.

  - **[CONTEXTUAL]** Seus filhos foram registrados em 1915 ao amparo do decreto de anistia governamental — nenhum havia sido registrado ao nascer. Este é o padrão de registro tardio de uma família de lavradores da Zona da Mata com acesso limitado à infraestrutura do registro civil, condizente com sua vida na Fazenda do Barroso, uma propriedade rural distante dos centros administrativos.

  - **[INFERRED]** Seus pais — Antonio Francisco da Silva (P-0025) e Maria Paula de Jesus (P-0026) — são conhecidos apenas porque seu marido Francisco os nomeou como avós maternos no registro de 1915 (CIV-0007). Sem esse único ato, quatro avós seriam inteiramente invisíveis. O registro retroativo preservou duas gerações de dados familiares que de outro modo teriam se perdido.

  - **[INFERRED]** Seu sobrenome devocional "Maria de Jesus" não carrega sinal patronímico ou social; os sobrenomes de seus pais, "da Silva" e "de Jesus", estão entre os mais comuns no Brasil. Ela e sua família são provavelmente nativos do interior de Carangola há gerações — nascidos no Brasil, de classe de pequenos proprietários ou meeiros, sem uma origem imigrante ou de elite rastreável.

  ## Identidade

  **Emmerenciana Maria de Jesus** (também *Emerenciana*) [PROVEN]. Esposa de Francisco José
  de Carvalho Guimarães (P-0021) e mãe de Maria Aurora Guimarães (P-0011).

  - **Nascimento:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007); data não registrada.

  - **Pais:** Antonio Francisco da Silva (P-0025) e Maria Paula de Jesus (P-0026) [PROVEN
  conforme declarado] — nomeados como avós maternos no registro de nascimento de 1915 de
  seus filhos (CIV-0007).

  - **Filhos:** os seis filhos Carvalho Guimarães registrados em 1915 (ver P-0021),
  incluindo Maria Aurora (P-0011). [PROVEN] Três desses filhos são individualmente
  confirmados por registros de óbito disponíveis que a nomeiam como mãe: seu filho José de
  Carvalho Guimarães Sobrinho faleceu em 21 de dezembro de 1964, em Califórnia, Paraná
  [PROVEN] (CIV-0049); seu filho Sebastião José de Carvalho Guimarães faleceu em 13 de
  abril de 1982, em Jacarezinho, Paraná [PROVEN] (CIV-0050); e seu filho João José de
  Carvalho Guimarães (n. 1912) faleceu em 4 de maio de 1992, em Volta Redonda, RJ, aos 79
  anos, viúvo e aposentado, deixando cerca de quatorze filhos maiores [PROVEN; a contagem
  de filhos é leitura incerta] (CIV-0033).

  - **Óbito:** antes de 1991 (CIV-0018); data e local não obtidos. [INFERRED]

  ## Posição social e profissão

  - **Lavradora** em São Francisco do Glória em 1915 [PROVEN] — CIV-0007 descreve o casal
  coletivamente como "lavradores".

  ## O que podemos extrapolar

  Sua posição documentada deriva do casamento, e não de propriedade ou linhagem próprias.
  [INFERRED / CONTEXTUAL] Como esposa de Francisco José de Carvalho Guimarães — de uma família
  localmente proeminente de Carangola, possivelmente detentora da patente de Alferes da Guarda
  Nacional (uma [LEAD]) —, sua posição adulta era a dessa família, mas ela a portava como
  esposa dele. Seu sobrenome devocional "Maria de Jesus" não carrega capital patronímico
  próprio, e seus pais (Antonio Francisco da Silva e Maria Paula de Jesus, nomeados em
  CIV-0007) aparecem apenas como nomes, sem posição registrada própria; qualquer que fosse
  sua classe de origem, a posição visível no registro é a que o casamento conferiu.

  ## Nota de identidade

  Não confundir com sua sogra Maria Tertuliana da Conceição (P-0024, esposa de Vicente):
  uma leitura anterior de CIV-0007 emparelhou Vicente com "Emmerenciana"; o registro, de
  fato, faz de Emmerenciana a esposa de Francisco (mãe de Maria Aurora), corroborado pelo
  nascimento de 1930 de Cidália (CIV-0022) e pelo óbito de 1991 de Maria Aurora (CIV-0018).

  ## Questões em aberto

  - Seus registros de casamento, nascimento e óbito — não obtidos; confirmariam de forma
  independente seus pais, hoje conhecidos apenas por declarações de informante em um
  registro retroativo de 1915. [OPEN]

