profile: >-
  ## Interesting facts

  - **[PROVEN]** She is native of the São Francisco do Glória district, the very same district where all six of her children were born and where she was still farming in 1915 (CIV-0007). Her entire documented life never moved beyond a single Carangola-area district — a life anchored in place in a way that contrasts with the later migration of her children's generation.

  - **[CONTEXTUAL]** Her children were registered in 1915 under the government amnesty decree — none had been registered at birth. This is the late-registration pattern of a Zona da Mata farming family with limited access to civil registry infrastructure, consistent with her life at the Fazenda do Barroso, a rural property far from administrative centres.

  - **[INFERRED]** Her parents — Antonio Francisco da Silva (P-0025) and Maria Paula de Jesus (P-0026) — are known only because her husband Francisco named them as maternal grandparents in the 1915 registration (CIV-0007). Without that single act, four grandparents would be entirely invisible. The retrospective registration preserved two generations of family data that would otherwise be lost.

  - **[INFERRED]** Her devotional surname "Maria de Jesus" carries no patronymic or social signal; her parents' surnames "da Silva" and "de Jesus" are among the most common in Brazil. She and her family are likely indigenous to the Carangola interior for generations — native-born, smallholder or tenant class, without a traceable immigrant or elite origin.

  ## Identity

  **Emmerenciana Maria de Jesus** (also *Emerenciana*) [PROVEN]. Wife of Francisco José de
  Carvalho Guimarães (P-0021) and mother of Maria Aurora Guimarães (P-0011).

  - **Born:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007); date not recorded.

  - **Parents:** Antonio Francisco da Silva (P-0025) and Maria Paula de Jesus (P-0026)
  [PROVEN as reported] — named as the maternal grandparents in her children's 1915 birth
  registration (CIV-0007).

  - **Children:** the six Carvalho Guimarães children registered in 1915 (see P-0021),
  including Maria Aurora (P-0011). [PROVEN] Three of these children are individually confirmed
  by held death records that name her as mother: her son José de Carvalho Guimarães Sobrinho
  died on 21 December 1964 at Califórnia, Paraná [PROVEN] (CIV-0049); her son Sebastião José
  de Carvalho Guimarães died on 13 April 1982 at Jacarezinho, Paraná [PROVEN] (CIV-0050);
  and her son João José de Carvalho Guimarães (b. 1912) died on 4 May 1992 at Volta Redonda
  (RJ), aged 79, a widower and retired, leaving some fourteen adult children [PROVEN; the
  child count is an uncertain read] (CIV-0033).

  - **Death:** before 1991 (CIV-0018); date and place not held. [INFERRED]

  ## Standing and profession

  - **Lavradora (farmer)** at São Francisco do Glória in 1915 [PROVEN] — CIV-0007 describes
  the couple collectively as "lavradores".

  ## What we can extrapolate

  Her documented standing is derived from her marriage, not from property or lineage of her
  own. [INFERRED / CONTEXTUAL] Her devotional surname "Maria de Jesus" carries no
  patronymic capital, and her parents (Antonio Francisco da Silva and Maria Paula de Jesus,
  named in CIV-0007) appear only as names, with no recorded standing of their own; whatever
  her natal rung, the position visible in the record is the one the marriage conferred. But
  that position should not be overstated. The household's only PROVEN occupation is the
  collective "lavradores" of CIV-0007 — she and Francisco were both on the land — and the
  Guarda Nacional Alferes rank sometimes attributed to her husband is a [LEAD], not a held
  record. On the evidence actually held she was a farm wife in a farming household, and,
  notably, she is recorded as an economic worker rather than as "do lar".

  She stayed put while everything around her moved. [PROVEN / CONTEXTUAL] Native to the São
  Francisco do Glória district, still resident there in 1915, and mother of six children all
  born at the Fazenda do Barroso in that same district — her whole documented life sits
  inside one parish, at the moment the Zona da Mata's coffee economy was passing its peak.
  The dispersal belongs entirely to the next generation.

  Six children is the arithmetic that decided the branch's future. [INFERRED / CONTEXTUAL]
  Brazilian partible succession divides an estate equally among all the children, so the
  number of heirs is the variable that determines whether anything survives a generation.
  This household produced six between 1901 and 1915 (CIV-0007), and those children in turn
  produced very large families — José Sobrinho left eleven adult children (CIV-0049), João
  José some fourteen (CIV-0033). No modest holding survives that denominator twice, and a
  modest one barely survives it once. Nothing in the held record suggests there was a
  holding at all: two of her three documented sons died with explicitly no goods, and only
  João José left an estate to be inventoried — among those fourteen heirs.

  The sons' death records show where the family actually landed, and it is not comfortable.
  [PROVEN — the records; INFERRED — the reading] Sebastião, born 1909, died in 1982 aged 72,
  unmarried, still a *lavrador*, resident in the Asilo São Vicente de Paula and found dead at
  the cathedral door, "não deixa bens" (CIV-0050). José Sobrinho, born 1901, died in 1964 at
  Califórnia (Paraná), a *lavrador* with "não tem bens a inventariar" (CIV-0049). Only her
  daughter Maria Aurora's household reached the modest urban middle in Rio, and only João
  José left property to divide. Of the four documented outcomes among her children, three
  are subsistence farming or destitution.

  Education was not transmitted here, and one record says so almost explicitly. [INFERRED /
  CONTEXTUAL] Sebastião's 1982 death act records "não era eleitor" — and Brazilian law
  barred illiterates from the franchise until Emenda Constitucional nº 25 of 1985, so a
  72-year-old recorded as a non-voter in 1982 was very probably never schooled to literacy
  [INFERRED — strong, not conclusive: non-registration has other causes]. That is the
  expected outcome. Rural schooling in the Zona da Mata was a purchased, class-linked
  privilege that had to be re-bought each generation, with no free village school behind it,
  and a household that could not get six children registered at birth until a 1914 amnesty
  decree made it possible was not buying schooling either. Her husband could sign the 1915
  act, so literacy existed in the household at his level; it did not reproduce downward on
  its own. Nothing records her own literacy. [OPEN]

  Read across the three generations she stands between, the line is flat, not falling.
  [INFERRED / CONTEXTUAL] Her parents were a landless native couple of one district; she was
  a farm wife in that same district; her children scattered to the Paraná coffee frontier, to
  Rio and to Volta Redonda as *lavradores*, a merchant's wife and pensioners, mostly without
  property. This is not the fragmentation of an estate — there is no estate in the record —
  but the persistence of a working-farm family that converted its one asset, mobile labour,
  into urban and frontier footholds. The single unambiguous gain appears two steps down, in
  her granddaughter Cidalia, a pensioned seamstress in an industrial city (CIV-0027).

  ## Note on identity

  Not to be confused with her mother-in-law Maria Tertuliana da Conceição (P-0024,
  Vicente's wife): an earlier misread of CIV-0007 paired Vicente with "Emmerenciana"; the
  record in fact makes Emmerenciana the wife of Francisco (Maria Aurora's mother),
  corroborated by Cidália's 1930 birth (CIV-0022) and Maria Aurora's 1991 death (CIV-0018).

  ## Open questions

  - Her marriage, birth and death records — not held; would independently confirm her
  parents, currently known only from informant statements at a 1915 retrospective
  registration. [OPEN]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her, her husband and her parents)
  · CIV-0018 (daughter Maria Aurora's 1991 death — names her as mother) · CIV-0022
  (granddaughter Cidália's 1930 birth — names her as maternal grandmother) · CIV-0033 (son
  João José's 1992 Volta Redonda death — names her as mother) · CIV-0049 (son José
  Sobrinho's 1964 death at Califórnia, Paraná — names her as mother) · CIV-0050 (son
  Sebastião José's 1982 death at Jacarezinho, Paraná — names her as mother).

  ## Where to go today

  - **Adult life (approx.):** Igreja Matriz de Santa Luzia, Carangola area, MG
  [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É natural do distrito de São Francisco do Glória, o mesmo distrito onde todos os seis filhos nasceram e onde ainda lavrava em 1915 (CIV-0007). Toda a sua vida documentada nunca saiu de um único distrito da região de Carangola — uma vida ancorada no lugar de forma que contrasta com a migração posterior da geração de seus filhos.

  - **[CONTEXTUAL]** Seus filhos foram registrados em 1915 ao amparo do decreto de anistia governamental — nenhum havia sido registrado ao nascer. Este é o padrão de registro tardio de uma família de lavradores da Zona da Mata com acesso limitado à infraestrutura do registro civil, condizente com sua vida na Fazenda do Barroso, uma propriedade rural distante dos centros administrativos.

  - **[INFERRED]** Seus pais — Antonio Francisco da Silva (P-0025) e Maria Paula de Jesus (P-0026) — são conhecidos apenas porque seu marido Francisco os nomeou como avós maternos no registro de 1915 (CIV-0007). Sem esse único ato, quatro avós seriam inteiramente invisíveis. O registro retroativo preservou duas gerações de dados familiares que de outro modo teriam se perdido.

  - **[INFERRED]** Seu sobrenome devocional "Maria de Jesus" não carrega sinal patronímico ou social; os sobrenomes de seus pais, "da Silva" e "de Jesus", estão entre os mais comuns no Brasil. Ela e sua família são provavelmente nativos do interior de Carangola há gerações — nascidos no Brasil, de classe de pequenos proprietários ou meeiros, sem uma origem imigrante ou de elite rastreável.

  ## Identidade

  **Emmerenciana Maria de Jesus** (também *Emerenciana*) [PROVEN]. Esposa de Francisco José
  de Carvalho Guimarães (P-0021) e mãe de Maria Aurora Guimarães (P-0011).

  - **Nascimento:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007); data não registrada.

  - **Pais:** Antonio Francisco da Silva (P-0025) e Maria Paula de Jesus (P-0026) [PROVEN
  conforme declarado] — nomeados como avós maternos no registro de nascimento de 1915 de
  seus filhos (CIV-0007).

  - **Filhos:** os seis filhos Carvalho Guimarães registrados em 1915 (ver P-0021),
  incluindo Maria Aurora (P-0011). [PROVEN] Três desses filhos são individualmente
  confirmados por registros de óbito disponíveis que a nomeiam como mãe: seu filho José de
  Carvalho Guimarães Sobrinho faleceu em 21 de dezembro de 1964, em Califórnia, Paraná
  [PROVEN] (CIV-0049); seu filho Sebastião José de Carvalho Guimarães faleceu em 13 de
  abril de 1982, em Jacarezinho, Paraná [PROVEN] (CIV-0050); e seu filho João José de
  Carvalho Guimarães (n. 1912) faleceu em 4 de maio de 1992, em Volta Redonda, RJ, aos 79
  anos, viúvo e aposentado, deixando cerca de quatorze filhos maiores [PROVEN; a contagem
  de filhos é leitura incerta] (CIV-0033).

  - **Óbito:** antes de 1991 (CIV-0018); data e local não obtidos. [INFERRED]

  ## Posição social e profissão

  - **Lavradora** em São Francisco do Glória em 1915 [PROVEN] — CIV-0007 descreve o casal
  coletivamente como "lavradores".

  ## O que podemos extrapolar

  Sua posição documentada deriva do casamento, e não de propriedade ou linhagem próprias.
  [INFERRED / CONTEXTUAL] Seu sobrenome devocional "Maria de Jesus" não carrega capital
  patronímico, e seus pais (Antonio Francisco da Silva e Maria Paula de Jesus, nomeados em
  CIV-0007) aparecem apenas como nomes, sem posição registrada própria; qualquer que fosse
  seu degrau de origem, a posição visível no registro é a que o casamento conferiu. Mas essa
  posição não deve ser superestimada. A única ocupação PROVEN da casa é o coletivo
  "lavradores" de CIV-0007 — ela e Francisco estavam ambos na lavoura — e a patente de
  Alferes da Guarda Nacional por vezes atribuída ao marido é uma [LEAD], não um registro
  disponível. Pelas evidências efetivamente disponíveis, ela era esposa de lavrador numa casa
  de lavradores e, notavelmente, está registrada como trabalhadora econômica, e não como "do
  lar".

  Ela ficou parada enquanto tudo à sua volta se movia. [PROVEN / CONTEXTUAL] Natural do
  distrito de São Francisco do Glória, ali ainda residente em 1915 e mãe de seis filhos todos
  nascidos na Fazenda do Barroso, no mesmo distrito — toda a sua vida documentada cabe dentro
  de uma freguesia, justamente quando a economia cafeeira da Zona da Mata passava do auge. A
  dispersão pertence inteiramente à geração seguinte.

  Seis filhos é a aritmética que decidiu o futuro do ramo. [INFERRED / CONTEXTUAL] A sucessão
  partível brasileira divide o espólio igualmente entre todos os filhos, de modo que o número
  de herdeiros é a variável que determina se algo sobrevive a uma geração. Esta casa produziu
  seis entre 1901 e 1915 (CIV-0007), e esses filhos, por sua vez, produziram famílias muito
  grandes — José Sobrinho deixou onze filhos maiores (CIV-0049), João José cerca de quatorze
  (CIV-0033). Nenhuma propriedade modesta sobrevive a esse denominador duas vezes, e mal
  sobrevive a ele uma vez. Nada no registro disponível sugere que houvesse propriedade
  alguma: dois de seus três filhos documentados morreram explicitamente sem bens, e apenas
  João José deixou bens a inventariar — entre aqueles quatorze herdeiros.

  Os registros de óbito dos filhos mostram onde a família de fato aterrissou, e não é
  confortável. [PROVEN — os registros; INFERRED — a leitura] Sebastião, nascido em 1909,
  faleceu em 1982 aos 72 anos, solteiro, ainda *lavrador*, residente no Asilo São Vicente de
  Paula e encontrado morto à porta da Catedral, "não deixa bens" (CIV-0050). José Sobrinho,
  nascido em 1901, faleceu em 1964 em Califórnia (Paraná), *lavrador*, "não tem bens a
  inventariar" (CIV-0049). Apenas a casa de sua filha Maria Aurora alcançou a modesta classe
  média urbana no Rio, e apenas João José deixou bens a partilhar. Dos quatro desfechos
  documentados entre seus filhos, três são agricultura de subsistência ou indigência.

  A educação não foi transmitida aqui, e um registro quase o diz de forma explícita.
  [INFERRED / CONTEXTUAL] O ato de óbito de Sebastião, em 1982, registra "não era eleitor" —
  e a lei brasileira barrou os analfabetos do voto até a Emenda Constitucional nº 25, de
  1985, de modo que um homem de 72 anos registrado como não eleitor em 1982 muito
  provavelmente nunca foi escolarizado até a alfabetização [INFERRED — forte, não conclusivo:
  a não inscrição tem outras causas]. É o desfecho esperado. A escolarização rural na Zona da
  Mata era um privilégio comprado e ligado à classe, que precisava ser recomprado a cada
  geração, sem escola pública de aldeia por trás; e uma casa que só conseguiu registrar seis
  filhos ao amparo de um decreto de anistia de 1914 também não estava comprando escola. Seu
  marido sabia assinar o ato de 1915, de modo que havia alfabetização na casa no nível dele;
  ela não se reproduziu para baixo por conta própria. Nada registra a alfabetização dela
  própria. [OPEN]

  Lida através das três gerações entre as quais ela se situa, a linha é plana, não
  descendente. [INFERRED / CONTEXTUAL] Seus pais eram um casal nativo sem terra de um único
  distrito; ela foi esposa de lavrador nesse mesmo distrito; seus filhos se espalharam pela
  fronteira cafeeira do Paraná, pelo Rio e por Volta Redonda como *lavradores*, esposa de
  comerciante e aposentados, em geral sem propriedade. Isto não é a fragmentação de um
  espólio — não há espólio no registro —, mas a persistência de uma família de lavoura que
  converteu seu único ativo, o trabalho móvel, em pontos de apoio urbanos e de fronteira. O
  único ganho inequívoco aparece dois degraus abaixo, em sua neta Cidalia, costureira
  aposentada numa cidade industrial (CIV-0027).

  ## Nota de identidade

  Não confundir com sua sogra Maria Tertuliana da Conceição (P-0024, esposa de Vicente):
  uma leitura anterior de CIV-0007 emparelhou Vicente com "Emmerenciana"; o registro, de
  fato, faz de Emmerenciana a esposa de Francisco (mãe de Maria Aurora), corroborado pelo
  nascimento de 1930 de Cidália (CIV-0022) e pelo óbito de 1991 de Maria Aurora (CIV-0018).

  ## Questões em aberto

  - Seus registros de casamento, nascimento e óbito — não obtidos; confirmariam de forma
  independente seus pais, hoje conhecidos apenas por declarações de informante em um
  registro retroativo de 1915. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — nomeia ela, o marido e os pais
  dela) · CIV-0018 (óbito de 1991 da filha Maria Aurora — a nomeia como mãe) · CIV-0022
  (nascimento de 1930 da neta Cidália — a nomeia como avó materna) · CIV-0033 (óbito de 1992
  do filho João José, em Volta Redonda — a nomeia como mãe) · CIV-0049 (óbito de 1964 do
  filho José Sobrinho, em Califórnia, Paraná — a nomeia como mãe) · CIV-0050 (óbito de 1982
  do filho Sebastião José, em Jacarezinho, Paraná — a nomeia como mãe).

