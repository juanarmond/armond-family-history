profile: >-
  ## Interesting facts

  - **[PROVEN]** She is native of the São Francisco do Glória district, the very same district where all six of her children were born and where she was still farming in 1915 (CIV-0007). Her entire documented life never moved beyond a single Carangola-area district — a life anchored in place in a way that contrasts with the later migration of her children's generation.

  - **[CONTEXTUAL]** Her children were registered in 1915 under the government amnesty decree — none had been registered at birth. This is the late-registration pattern of a Zona da Mata farming family with limited access to civil registry infrastructure, consistent with her life at the Fazenda do Barroso, a rural property far from administrative centres.

  - **[INFERRED]** Her parents — Antonio Francisco da Silva (P-0025) and Maria Paula de Jesus (P-0026) — are known only because her husband Francisco named them as maternal grandparents in the 1915 registration (CIV-0007). Without that single act, four grandparents would be entirely invisible. The retrospective registration preserved two generations of family data that would otherwise be lost.

  - **[INFERRED]** Her devotional surname "Maria de Jesus" carries no patronymic or social signal; her parents' surnames "da Silva" and "de Jesus" are among the most common in Brazil. She and her family are likely indigenous to the Carangola interior for generations — native-born, smallholder or tenant class, without a traceable immigrant or elite origin.

  ## Identity

  **Emmerenciana Maria de Jesus** (also *Emerenciana*) [PROVEN]. Wife of Francisco José de
  Carvalho Guimarães (P-0021) and mother of Maria Aurora Guimarães (P-0011).

  - **Born:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007); date not recorded.

  - **Parents:** Antonio Francisco da Silva (P-0025) and Maria Paula de Jesus (P-0026)
  [PROVEN as reported] — named as the maternal grandparents in her children's 1915 birth
  registration (CIV-0007).

  - **Children:** the six Carvalho Guimarães children registered in 1915 (see P-0021),
  including Maria Aurora (P-0011). [PROVEN] Three of these children are individually confirmed
  by held death records that name her as mother: her son José de Carvalho Guimarães Sobrinho
  died on 21 December 1964 at Califórnia, Paraná [PROVEN] (CIV-0049); her son Sebastião José
  de Carvalho Guimarães died on 13 April 1982 at Jacarezinho, Paraná [PROVEN] (CIV-0050);
  and her son João José de Carvalho Guimarães (b. 1912) died on 4 May 1992 at Volta Redonda
  (RJ), aged 79, a widower and retired, leaving some fourteen adult children [PROVEN; the
  child count is an uncertain read] (CIV-0033).

  - **Death:** before 1991 (CIV-0018); date and place not held. [INFERRED]

  ## Standing and profession

  - **Lavradora (farmer)** at São Francisco do Glória in 1915 [PROVEN] — CIV-0007 describes
  the couple collectively as "lavradores".

  ## What we can extrapolate

  Her documented standing is derived from her marriage, not from property or lineage of her
  own. [INFERRED / CONTEXTUAL] As the wife of Francisco José de Carvalho Guimarães — of a
  locally-prominent Carangola family, possibly holding Guarda Nacional Alferes rank (a
  [LEAD]) — her adult position was that of that family, but she carried it as his wife. Her
  devotional surname "Maria de Jesus" carries no patronymic capital of its own, and her
  parents (Antonio Francisco da Silva and Maria Paula de Jesus, named in CIV-0007) appear
  only as names, with no recorded standing of their own; whatever her natal class, the
  position visible in the record is the one the marriage conferred.

  ## Note on identity

  Not to be confused with her mother-in-law Maria Tertuliana da Conceição (P-0024,
  Vicente's wife): an earlier misread of CIV-0007 paired Vicente with "Emmerenciana"; the
  record in fact makes Emmerenciana the wife of Francisco (Maria Aurora's mother),
  corroborated by Cidália's 1930 birth (CIV-0022) and Maria Aurora's 1991 death (CIV-0018).

  ## Open questions

  - Her marriage, birth and death records — not held; would independently confirm her
  parents, currently known only from informant statements at a 1915 retrospective
  registration. [OPEN]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names her, her husband and her parents)
  · CIV-0018 (daughter Maria Aurora's 1991 death — names her as mother) · CIV-0022
  (granddaughter Cidália's 1930 birth — names her as maternal grandmother) · CIV-0033 (son
  João José's 1992 Volta Redonda death — names her as mother) · CIV-0049 (son José
  Sobrinho's 1964 death at Califórnia, Paraná — names her as mother) · CIV-0050 (son
  Sebastião José's 1982 death at Jacarezinho, Paraná — names her as mother).

  ## Where to go today

  - **Adult life (approx.):** Igreja Matriz de Santa Luzia, Carangola area, MG
