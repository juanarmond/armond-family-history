  - text: Ahnentafel position 14.
  - text: >-
      Died 3 August 1970 at Volta Redonda, RJ, aged 76 (so born c.1894), a
      comerciante married to Celina Bohrer, per his civil death (CIV-0014). His
      parents were Valentim Martinho Bohrer (P-0028) and Carolina Bohrer
      (P-0029) — family F-0013 — named in that death and in Eunir Bohrer's 1924
      Nova Friburgo birth (CIV-0016).
