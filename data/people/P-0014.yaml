  Livro 4 f.66v (fora de ferramenta: Diocese de Nova Friburgo / Paróquia São José do Ribeirão;
  os livros paroquiais não estão no FamilySearch), que daria sua data exata e confirmaria seus
  pais em nível primário. [OPEN — o localizador é uma PISTA do índice Raibert]

  - Seu **casamento com Celina** — nenhum registro em mãos; o local é conflitante (Carangola, MG, segundo CIV-0014; casamento civil no segundo distrito de Nova Friburgo segundo CIV-0038 e CIV-0016). Pesquisar primeiro os registros civis de casamento de Nova Friburgo anteriores a março de 1923 e depois Carangola; qualquer um dataria a união e confirmaria ambas as filiações. [OPEN]

  - **Dois nascimentos em 1924 da mesma mãe:** Eunir nasceu em 17 de maio de 1924 em Nova Friburgo (CIV-0016, o assento de nascimento), enquanto o óbito de Alício em 2005 dá seu nascimento como 26 de julho de 1924 em Divino, MG (CIV-0039, declaração de informante). Dois partos a termo com cerca de dez semanas de intervalo são impossíveis; o assento de nascimento prevalece sobre o informante do óbito, de modo que a data ou o ano declarados para Alício provavelmente estão errados. [OPEN]

  - **Origem dos pais num registro tardio:** o óbito de Ivanyr em 1992 diz que João e Celina eram "naturais do Estado de Minas Gerais" (CIV-0040), contra o óbito do próprio João ("natural dêste Estado", Rio de Janeiro; CIV-0014) e o batismo de Celina em Nova Friburgo (PAR-0057). O informante de 1992 é a testemunha mais fraca; preservado como conflito, não adotado. [OPEN — peso baixo]

