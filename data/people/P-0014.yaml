profile: >-
  ## Identity

  **João Gonçalves Bohrer** [PROVEN] — the spelling is consistent across his own 1970
  death record (CIV-0014), his daughter Iris's 1949 marriage (CIV-0004), his daughter
  Eunir's 1924 birth (CIV-0016) and his son João's 2001 death (CIV-0025).

  - **Birth:** c.1894 [INFERRED] — his 1970 death record gives his age as **76**
  (CIV-0014), back-calculating to c.1894. He is recorded there as **"natural dêste
  Estado"** (born in Rio de Janeiro state); no birth register is held.

  - **Marriage:** married **Celina Bohrer** (P-0015), reportedly at **Carangola, Minas
  Gerais** [uncertain reading, CIV-0014] — a **Bohrer × Bohrer** union (both spouses
  carried the Bohrer surname). The marriage is independently attested by Eunir's 1924
  birth (CIV-0016) and by CIV-0004 and CIV-0025.

  - **Parents:** **Valentim Martinho Bohrer** (P-0028), already deceased by 1970, and
  **Carolina Bohrer** (P-0029), a *doméstica* recorded as living at Volta Redonda in
  1970 — she outlived her son [PROVEN] (CIV-0014; the couple is corroborated as
  paternal grandparents on CIV-0016).

  - **Children:** **fifteen** — his 1970 death record states he "deixou quinze filhos"
  [PROVEN] (CIV-0014). Documented children include **Iris Bohrer Muniz** (P-0007),
  **Eunir Bohrer** (b. 1924, Nova Friburgo; CIV-0016) and **João Bohrer** (b. c.1940
  Carangola; d. 2001 Volta Redonda; CIV-0025).

  - **Death:** **3 August 1970**, at 02:30, in the **Hospital da C.S.N. (Companhia
  Siderúrgica Nacional), Volta Redonda, RJ**; *causa mortis* **infarto do miocárdio**
  [PROVEN] (CIV-0014). He left goods to inventory and no will; the declarant was a
  son-in-law.

  ## Standing and profession

  - **Lavrador (farmer), Nova Friburgo, 1924** [PROVEN] — when he declared Eunir's
  birth he is recorded as a *lavrador* resident in the district of São João Baptista,
  Nova Friburgo, and acts as declarant himself (CIV-0016).

  - **Comerciante (merchant), Volta Redonda, 1970** [PROVEN] — his profession at death
  (CIV-0014). Between 1924 and 1970 he moved from Nova Friburgo farming to Volta Redonda
  commerce. (The *industriário* named in CIV-0014 is the declarant, his son-in-law, not
  him.)

  ## Family and social network

  His wife Celina Bohrer (P-0015) was herself a Bohrer, daughter of Joaquim José Bohrer
  (P-0030) × Lucinda Ferreira da Silva (P-0031) of Nova Friburgo (CIV-0015, CIV-0016).
  His son João Bohrer (b. c.1940 Carangola, MG; d. 2001 Volta Redonda) is fixed as his
  son by that son's own 2001 death record, which names both parents (CIV-0025) — an
  independent confirmation of the couple across a second generation.

  ## What we can extrapolate

  His documented life traces the family's 20th-century migration [INFERRED]: a farmer in
  the Nova Friburgo hinterland in 1924, a son born at Carangola (MG) around 1940
  (CIV-0025), and a merchant dying in the CSN steel-company hospital at Volta Redonda in
  1970 (CIV-0014). The couple had thus moved from the Rio de Janeiro serra, through the
  Zona da Mata Mineira, into the Volta Redonda steel city by mid-century.

  He is the Bohrer line's **pivot generation, and the mirror image of the Armond decline**
  [INFERRED]. Where Juan's paternal Armond line fell into the 20th-century urban working class
  *from* an office-and-marriage elite, the Bohrers reached it *from below*. Their Nova Friburgo
  colonist forebears were settled on poor highland lots [CONTEXTUAL] and never held heritable
  landed capital; Brazilian partible succession split what little there was across the line's
  characteristically large families [CONTEXTUAL], so there was no estate to inherit or to lose.
  His own shift from **lavrador (1924) to comerciante (1970)** is therefore best read as a
  modest, lateral-to-slightly-upward urban *stabilization* — from working the land to living on
  a merchant's margin (income that rises and falls with the regional economy, not a fixed wage
  and not heritable property) — within the same working / petty-bourgeois band, not the
  collapse-from-elite that marks the Armond arc. [INFERRED]

  Schooling followed the thin money [CONTEXTUAL]. In the 19th–early-20th century education was a
  purchased, class-linked privilege, not free or heritable; in a household of some fifteen
  children a working family of the interior could not re-buy it each generation, and universal
  Brazilian schooling is a late-20th-century achievement. A colonist-peasant line turned
  smallholder-then-tradesman transmitted no schooling as inherited advantage — literacy appeared
  where a specific role demanded it rather than reproducing down the line. [CONTEXTUAL/INFERRED]

  ## Open questions

  - His **birth/baptism** (c.1894, Rio de Janeiro state — likely Nova Friburgo) — not
  held; would give his exact date and confirm his parents at primary level. [OPEN]

  - His **marriage to Celina** — the Carangola (MG) civil marriage register would date
  the union and confirm both filiations; the Carangola place is only an uncertain
  reading of CIV-0014. [OPEN]

  ## Sources held (this repository)

  - CIV-0014 (his 1970 Volta Redonda death — age, profession, wife, parents, fifteen
  children) · CIV-0016 (daughter Eunir's 1924 Nova Friburgo birth — "lavrador", paternal
  grandparents) · CIV-0004 (daughter Iris's 1949 marriage — names him as her father) ·
  CIV-0025 (son João Bohrer's 2001 death — names him and Celina as parents) · REC-0001
  (owner family roster).

  - PUB-0003 (published Nova Friburgo genealogy — the immigrant Borer/Bohrer line, as a
  lead).

  ## Regional and migration context

  His parents were **natural** of Rio de Janeiro state, and in 1924 he farmed in the
  district of São João Baptista, **Nova Friburgo** (CIV-0016) — the Serra-fluminense town
  built by the 1819–1824 Swiss / German Catholic colony. The family's descent from the
  Nova Friburgo Borer/Bohrer immigrants (his line through Valentim Martinho Bohrer,
  P-0028) is documented in the published Nova Friburgo genealogy (PUB-0003) [LEAD] and is
  not inferred from the surname alone. He ended his life a *comerciante* at **Volta
  Redonda**, the city built around the CSN steelworks (producing from the mid-1940s),
  where he died in the company hospital in 1970. [CONTEXTUAL]

  ## Where to go today

  - **Birth (c.1897):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova
  Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390)
  [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Marriage to Celina:** Igreja Matriz de Santa Luzia, Carangola, MG (Praça
  Coronel Maximiano 138, Centro, CEP 36800-000) [DOCUMENTED-addr] · [Maps](https://maps.google.com/?q=-20.73337,-42.02975)

  - **Death (3 Aug 1970):** Igreja Matriz de Santa Cecília, Volta Redonda, RJ (Rua
  31-A, Vila Santa Cecília, CEP 27260-110) — civic anchor of the CSN steel city where
  he died [RESOLVED] · [Maps](https://maps.google.com/?q=-22.52408,-44.10435)
profile_pt: >-
  ## Identidade

  **João Gonçalves Bohrer** [PROVEN] — a grafia é consistente em seu próprio óbito de
  1970 (CIV-0014), no casamento de 1949 da filha Iris (CIV-0004), no nascimento de 1924
  da filha Eunir (CIV-0016) e no óbito de 2001 do filho João (CIV-0025).

  - **Nascimento:** c.1894 [INFERRED] — seu óbito de 1970 dá sua idade como **76 anos**
  (CIV-0014), retrocalculando para c.1894. Ali é registrado como **"natural dêste
  Estado"** (nascido no estado do Rio de Janeiro); não há registro de nascimento em
  mãos.

  - **Casamento:** casou-se com **Celina Bohrer** (P-0015), ao que consta em
  **Carangola, Minas Gerais** [uncertain — leitura, CIV-0014] — uma união **Bohrer ×
  Bohrer** (ambos os cônjuges levavam o sobrenome Bohrer). O casamento é atestado de
  forma independente pelo nascimento de Eunir em 1924 (CIV-0016) e por CIV-0004 e
  CIV-0025.

  - **Pais:** **Valentim Martinho Bohrer** (P-0028), já falecido em 1970, e **Carolina
  Bohrer** (P-0029), *doméstica* registrada como residente em Volta Redonda em 1970 —
  ela sobreviveu ao filho [PROVEN] (CIV-0014; o casal é corroborado como avós paternos
  em CIV-0016).

  - **Filhos:** **quinze** — seu óbito de 1970 afirma que "deixou quinze filhos" [PROVEN]
  (CIV-0014). Entre os filhos documentados estão **Iris Bohrer Muniz** (P-0007), **Eunir
  Bohrer** (n. 1924, Nova Friburgo; CIV-0016) e **João Bohrer** (n. c.1940 Carangola; f.
  2001 Volta Redonda; CIV-0025).

  - **Óbito:** **3 de agosto de 1970**, às 02h30, no **Hospital da C.S.N. (Companhia
  Siderúrgica Nacional), Volta Redonda, RJ**; *causa mortis* **infarto do miocárdio**
  [PROVEN] (CIV-0014). Deixou bens a inventariar e nenhum testamento; o declarante foi
  um genro.

  ## Posição social e profissão

  - **Lavrador em Nova Friburgo, 1924** [PROVEN] — ao declarar o nascimento de Eunir, é
  registrado como *lavrador* residente no distrito de São João Baptista, Nova Friburgo,
  e atua como declarante ele mesmo (CIV-0016).

  - **Comerciante em Volta Redonda, 1970** [PROVEN] — sua profissão ao falecer
  (CIV-0014). Entre 1924 e 1970 passou da lavoura em Nova Friburgo ao comércio em Volta
  Redonda. (O *industriário* nomeado em CIV-0014 é o declarante, seu genro, não ele.)

  ## Família e rede social

  Sua esposa Celina Bohrer (P-0015) era ela própria uma Bohrer, filha de Joaquim José
  Bohrer (P-0030) × Lucinda Ferreira da Silva (P-0031), de Nova Friburgo (CIV-0015,
  CIV-0016). Seu filho João Bohrer (n. c.1940 Carangola, MG; f. 2001 Volta Redonda) é
  fixado como seu filho pelo próprio óbito de 2001 desse filho, que nomeia ambos os pais
  (CIV-0025) — uma confirmação independente do casal ao longo de uma segunda geração.

  ## O que podemos extrapolar

  Sua vida documentada traça a migração do século XX da família [INFERRED]: lavrador no
  interior de Nova Friburgo em 1924, um filho nascido em Carangola (MG) por volta de 1940
  (CIV-0025) e comerciante falecido no hospital da siderúrgica CSN em Volta Redonda em
  1970 (CIV-0014). O casal, portanto, mudou-se da serra fluminense, através da Zona da
  Mata Mineira, para a cidade siderúrgica de Volta Redonda em meados do século.

  Ele é a **geração-charneira da linha Bohrer e o espelho invertido do declínio Armond**
  [INFERRED]. Onde a linha paterna Armond de Juan caiu na classe trabalhadora urbana do século
  XX *a partir de* uma elite de cargos e de casamento, os Bohrer a alcançaram *de baixo*. Seus
  antepassados colonos de Nova Friburgo foram assentados em lotes serranos pobres [CONTEXTUAL] e
  nunca detiveram capital fundiário herdável; a sucessão partível brasileira dividiu o pouco que
  havia entre as famílias caracteristicamente grandes desta linha [CONTEXTUAL], de modo que não
  houve patrimônio a herdar nem a perder. Sua própria passagem de **lavrador (1924) a comerciante
  (1970)** deve, portanto, ser lida como uma modesta *estabilização* urbana, lateral a
  ligeiramente ascendente — de trabalhar a terra a viver de uma margem de comerciante (renda que
  sobe e desce com a economia regional, não um salário fixo nem propriedade herdável) — dentro da
  mesma faixa trabalhadora / pequeno-burguesa, e não o colapso-a-partir-da-elite que marca o arco
  Armond. [INFERRED]

  A escolaridade acompanhou o dinheiro escasso [CONTEXTUAL]. No século XIX e início do XX, a
  educação era um privilégio comprado e ligado à classe, não gratuito nem herdável; num lar de
  cerca de quinze filhos, uma família trabalhadora do interior não podia recomprá-la a cada
  geração, e a escolaridade universal brasileira é uma conquista tardia do século XX. Uma linha
  de camponeses-colonos tornada de pequenos proprietários e depois comerciantes não transmitiu
  escolaridade como vantagem herdada — o letramento surgia onde um papel específico o exigia, em
  vez de se reproduzir ao longo da linha. [CONTEXTUAL/INFERRED]

  ## Questões em aberto

  - Seu **nascimento/batismo** (c.1894, estado do Rio de Janeiro — provavelmente Nova
  Friburgo) — não está em mãos; daria sua data exata e confirmaria seus pais em nível
  primário. [OPEN]

  - Seu **casamento com Celina** — o registro civil de casamento de Carangola (MG)
  dataria a união e confirmaria ambas as filiações; o local Carangola é apenas uma
  leitura incerta de CIV-0014. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0014 (seu óbito de 1970 em Volta Redonda — idade, profissão, esposa, pais, quinze
  filhos) · CIV-0016 (nascimento da filha Eunir em 1924, Nova Friburgo — "lavrador", avós
  paternos) · CIV-0004 (casamento da filha Iris em 1949 — nomeia-o como pai dela) ·
  CIV-0025 (óbito do filho João Bohrer em 2001 — nomeia-o e a Celina como pais) ·
  REC-0001 (lista familiar do proprietário).

  - PUB-0003 (genealogia publicada de Nova Friburgo — a linha Borer/Bohrer imigrante,
  como pista).

  ## Contexto regional e migratório

  Seus pais eram **naturais** do estado do Rio de Janeiro e, em 1924, ele lavrava no
  distrito de São João Baptista, **Nova Friburgo** (CIV-0016) — a cidade
  serrano-fluminense construída pela colônia católica suíço-alemã de 1819–1824. A
  descendência da família a partir dos imigrantes Borer/Bohrer de Nova Friburgo (sua
  linha através de Valentim Martinho Bohrer, P-0028) está documentada na genealogia
  publicada de Nova Friburgo (PUB-0003) [LEAD] e não é inferida apenas a partir do
  sobrenome. Encerrou a vida como *comerciante* em **Volta Redonda**, a cidade erguida em
  torno da siderúrgica CSN (com produção a partir de meados da década de 1940), onde
  faleceu no hospital da companhia em 1970. [CONTEXTUAL]

