profile: >-
  ## Interesting facts

  - **[PROVEN]** He married a Bohrer (Celina Bohrer, P-0015) and was himself a Bohrer — a Bohrer × Bohrer union that is the clearest documented case of endogamy in the Nova Friburgo Swiss/German colonist community, where marrying within the same immigrant network was both common and expected through the late 19th century. The shared surname does not prove kinship: his line descends from the 1819 immigrant Laurent Borer and hers from Jacob Borer (PAR-0061, PAR-0060; PAR-0056, PAR-0054, PAR-0059), and no kinship between those two immigrants is documented, so the marriage is not proven to be consanguineous. [INFERRED]

  - **[PROVEN]** His life traces the family's full 20th-century migration arc in documented steps: a lavrador in the district of São João Baptista, Nova Friburgo (1924, CIV-0016); his son João born in Carangola, MG (~1940, CIV-0025); and a comerciante dying in the Hospital da CSN, Volta Redonda (1970, CIV-0014). Nova Friburgo → Zona da Mata Mineira → CSN steel city in one documented life.

  - **[PROVEN]** He had fifteen children — stated in his own 1970 death record (CIV-0014). In a household of fifteen children on a working-class income, education could not be purchased generation by generation; the family's capital was labour, kinship and the shift from farm to commerce, not schooling.

  - **[CONTEXTUAL]** He died on 3 August 1970 in the Hospital da CSN — the Companhia Siderúrgica Nacional's own company hospital, built as part of its integrated worker-welfare infrastructure. The company town's company hospital recording a family patriarch's death is a precise marker of how completely the CSN structured life in Volta Redonda.

  - **[INFERRED]** His shift from lavrador (1924) to comerciante (1970) is best read as modest stabilisation within the working/petty-bourgeois band — not the decline-from-elite that marks the Armond arc, but a lateral-to-upward move from farming the land to living on a merchant's margin, within the same economic range as his colonist forebears.

  - **[CONTEXTUAL]** The Nova Friburgo Bohrer line's Swiss/German colonist ancestors received land grants (sesmarias) from the Crown in exchange for settling the Serra Fluminense highlands from 1819–1820. By João's generation, those grants had been fragmented across large families under partible inheritance; there was no heritable landed capital left — only a surname and a trade.

  ## Identity

  **João Gonçalves Bohrer** [PROVEN] — the spelling is consistent across his own 1970
  death record (CIV-0014), his daughter Iris's 1949 marriage (CIV-0004), his daughter
  Eunir's 1924 birth (CIV-0016) and his son João's 2001 death (CIV-0025).

  - **Birth:** c.1894 [INFERRED] — his 1970 death record gives his age as **76**
  (CIV-0014), back-calculating to c.1894. He is recorded there as **"natural dêste
  Estado"** (born in Rio de Janeiro state); no birth register is held.

  - **Marriage:** married **Celina Bohrer** (P-0015) — a **Bohrer × Bohrer** union (both spouses carried the Bohrer surname), attested by Senira's 1923 and Eunir's 1924 births (CIV-0038, CIV-0016) and by CIV-0004 and CIV-0025. **Place in conflict** [PROVEN, conflicting]: his 1970 death plainly states "casado com Celina Bohrer em Carangola, Minas Gerais" (CIV-0014), but that is a son-in-law's report some forty years after the event; in 1923 and 1924 João himself declared the couple "casados civilmente" in Nova Friburgo — "no segundo Districto desta [cidade]" (CIV-0038) and "neste Município" (CIV-0016). The groom's own near-contemporary statements carry more weight [INFERRED]. No marriage record is held, so the date is unknown and both places are preserved.

  - **Parents:** **Valentim Martinho Bohrer** (P-0028), already deceased by 1970, and
  **Carolina Bohrer** (P-0029), a *doméstica* recorded as living at Volta Redonda in
  1970 — she outlived her son [PROVEN] (CIV-0014; the couple is corroborated as
  paternal grandparents on CIV-0016).

  - **Children:** **fifteen** — his 1970 death record states he "deixou quinze filhos"
  [PROVEN] (CIV-0014). Seven are individually documented: **Iris Bohrer Muniz** (P-0007),
  **Eunir Bohrer** (1924, Nova Friburgo; CIV-0016), **João Bohrer** (c.1940 Carangola–2001
  Volta Redonda; CIV-0025), **Ercy Bohrer** (c.1932–1972; CIV-0031), **Senira Bohrer** (1923,
  Nova Friburgo; CIV-0038), **Alício Borher** (1924–2005; CIV-0039) and **Ivanyr Borher**
  (c.1930–1992; CIV-0040). Three further names — Cinésio (1926–2015), Ivan (1930; probably a duplicate of Ivanyr) and Maria Adyr (1936–2020) — come from the FamilySearch tree as reported by the retrieval research [LEAD — no record held here]. Ercy's birth is c.1932 from his stated age of 40 (CIV-0031), consistent with the tree's 1932 [LEAD]. [Corrected 2026-10-08 from the image: "com quarenta anos", not 30 / c.1942.]

  - **Death:** **3 August 1970**, at 02:30, in the **Hospital da C.S.N. (Companhia
  Siderúrgica Nacional), Volta Redonda, RJ**; *causa mortis* **infarto do miocárdio**
  [PROVEN] (CIV-0014). He left goods to inventory and no will; the declarant was a
  son-in-law.

  ## Standing and profession

  - **Lavrador (farmer), Nova Friburgo, 1924** [PROVEN] — when he declared Eunir's
  birth he is recorded as a *lavrador* resident in the district of São João Baptista,
  Nova Friburgo, and acts as declarant himself (CIV-0016).

  - **Comerciante (merchant), Volta Redonda, 1970** [PROVEN] — his profession at death
  (CIV-0014). Between 1924 and 1970 he moved from Nova Friburgo farming to Volta Redonda
  commerce. (The *industriário* named in CIV-0014 is the declarant, his son-in-law, not
  him.)

  ## Family and social network

  His wife Celina Bohrer (P-0015) was herself a Bohrer, daughter of Joaquim José Bohrer
  (P-0030) × Lucinda Ferreira da Silva (P-0031) of Nova Friburgo (CIV-0015, CIV-0016).
  His son João Bohrer (b. c.1940 Carangola, MG; d. 2001 Volta Redonda) is fixed as his
  son by that son's own 2001 death record, which names both parents (CIV-0025) — an
  independent confirmation of the couple across a second generation.

  His own siblings (children of Valentim Martinho Bohrer × Carolina Klein): **seven are documented by records held here that name both parents** — **Maria Felomena** (b. 30 Sep 1891, São José do Ribeirão; CIV-0045, which also names all four grandparents) [Corrected 2026-10-08 from the image: "a trinta do passado" in an act of 2 October — born 30 September, not 1 October], the twins **Adelaide and Carolina** (b. 19 Jul 1899, baptised at Lumiar 1900; PAR-0080), **Valentim Luciano** (b. 14 May 1902; PAR-0074), **Maria Clara** (b. 20 Feb 1908; PAR-0052), **Durval Baptista** (b. 24 Jun 1910; PAR-0053) and **Maria Bohrer Teixeira** (b. 8 Aug 1919; d. 2003 Niterói; CIV-0047). Three more are leads only: **Laudelina Olívia** (1896, São José do Ribeirão Livro 4 f.137v — César Raibert index, no image), and **Balbina Eufrásia** (m. Manoel Americo Bohrer) and **Dionisio**, both FamilySearch-tree entries with no parent-naming record [LEAD]. The retrieval research also reports that in October 1910 "João Gonçalves Borber" and "Laudelina Borber" stood together as godparents in the São Pedro entry that follows Durval's baptism [LEAD — that entry is not catalogued here]. The household registered its 1891 child at rural São José do Ribeirão (CIV-0045) and had its later children baptised at Lumiar and São Pedro (1899–1910) — which is why the Nova Friburgo Catedral sweep did not find João's own baptism, reported as entered at São José do Ribeirão (see Open questions).

  **Literacy:** he declared his children's births himself in 1923 and 1924, and his name stands among the signatures at the foot of the 1924 act (CIV-0016, see also CIV-0038) [PROVEN]. His father had the 1891 act signed "a rogo" because he could not write (CIV-0045).

  ## What we can extrapolate

  **The single clearest piece of upward movement in this line is a signature.** His father could
  not write in 1891 — the escrivão signed that act "a rogo do declarante por não saber escrever"
  (CIV-0045) [PROVEN]. In May 1924 João Gonçalves walks into the cartório of São João Baptista
  himself, declares his son Eunir's birth, and signs the entry; his name stands among the four
  signatures at its foot (CIV-0016) [PROVEN]. He had done the same for his daughter Senira the
  year before (CIV-0038) [PROVEN]. One generation, and the household can transact on paper
  without a third party. That is an acquired competence rather than an inherited asset — and it
  is precisely the kind of gain a family with no capital can actually make. [INFERRED]

  **From a farm at kilometre 102 to a merchant's margin.** In 1923 and 1924 he is a *lavrador*
  living at "kilometro cento e dois" and at a "Morro" in the Nova Friburgo district (CIV-0038,
  CIV-0016) [PROVEN] — addresses given as a distance along a road, which is what an unnamed
  rural smallholding looks like in a register. By August 1970 he is a *comerciante* at Rua Paulo
  Mendes 205, Volta Redonda (CIV-0014) [PROVEN]. A merchant earns a margin on stock and credit:
  income that rises and falls with the local economy, is not a fixed wage, and is not heritable
  property [CONTEXTUAL]. (His recorded age at death, 76, is the only evidence for a birth about
  1894; no birth or baptism record is held, so the year is an approximation — see Open
  questions.)

  **The two death records run the experiment for us.** His 1970 óbito states that he "deixou
  bens a inventariar" — there was something to inventory (CIV-0014) [PROVEN]. His widow's 1977
  óbito states that she "não deixou bens nem testamento" (CIV-0015) [PROVEN]. Whatever the
  merchant's estate amounted to, seven years and a household of fourteen or fifteen children
  later there was nothing left to record. That is the clearest documented demonstration anywhere
  in this family of the difference between contingent commercial wealth and heritable property.
  [INFERRED from two held acts]

  **Fifteen children is the other half of the arithmetic.** His death record says the couple
  "deixou quinze filhos"; hers says "quatorze" — both figures are held and both are preserved
  (CIV-0014, CIV-0015) [PROVEN, conflicting]. Under Brazilian equal partition, a small estate
  divided fifteen ways is about seven per cent a head, and in practice nothing. In a family
  whose wealth was already non-heritable, the birth rate removes even the theoretical
  possibility of accumulation. [CONTEXTUAL/INFERRED]

  **The move to Volta Redonda changed the family's employment relation, not merely its
  address.** [INFERRED] He himself stayed self-employed — a *comerciante* to the end — but the
  generation around him entered wage work inside the steel economy: the son-in-law who declared
  his death in 1970 is an *industriário* (CIV-0014), and his son Alício died in 2005 an
  "aposentado industriário" (CIV-0039) [PROVEN]. He died in the Hospital da C.S.N., the
  company's own hospital (CIV-0014) [PROVEN]. Volta Redonda was built around the Companhia
  Siderúrgica Nacional mill from 1941 and grew from under 3,000 people to some 36,000 by 1950
  [CONTEXTUAL]. A family that had worked land and kept a store arrived in a city with one
  employer and, within a generation, was working for it — trading independence at the bottom of
  a rural economy for a wage in an industrial one, which on this line's arithmetic was an
  improvement.

  **He is the Bohrer line's pivot, and the mirror of the Armond fall.** [INFERRED] The paternal
  Armond line of this same family reached the mid-20th-century urban working class *from* an
  office-and-marriage elite; the Bohrers reached it *from below* — from a colony subsidy of 160
  réis a day on a stony lot [CONTEXTUAL], through smallholding and petty trade, to a steel-city
  livelihood. His shift from *lavrador* to *comerciante* is lateral-to-slightly-upward inside
  the band his Nova Friburgo forebears already occupied. There was no estate to lose, so there
  was no fall — and no inherited schooling either: in a household of fifteen on interior
  working-class income, education was a purchased, class-linked privilege that could not be
  re-bought each generation, and universal Brazilian schooling is a late-20th-century
  achievement [CONTEXTUAL]. What he transmitted was a trade, a city, and the ability to sign his
  own name.

  ## Open questions

  - His **birth/baptism** (c.1894) — the record image is not held, but a name-index of the
  RJ church registers compiled by César Raibert **locates the entry** [LEAD]: "João Gonçalves,
  filho de Valentim Bohrer e Carolina Bohrer, 1894, **Livro 4, folha 66v, parish of São José
  do Ribeirão**" (Bom Jardim, RJ) — NOT the Nova Friburgo Catedral, which is why the Catedral
  sweep did not find him (Valentim × Carolina baptised their early children at São José do
  Ribeirão before moving to the NF Catedral/Lumiar parishes). Next action: retrieve the São
  José do Ribeirão baptism book Livro 4 f.66v (off-tool: Diocese de Nova Friburgo / Paróquia
  São José do Ribeirão; the parish books are not on FamilySearch), which would give his exact
  date and confirm his parents at primary level. [OPEN — locator is a Raibert-index LEAD]

  - His **marriage to Celina** — no record held; the place conflicts (Carangola, MG, per CIV-0014; a civil marriage in Nova Friburgo's second district per CIV-0038 and CIV-0016). Search the Nova Friburgo civil marriage registers before March 1923 first, then Carangola; either would date the union and confirm both filiations. [OPEN]

  - **Two 1924 births to the same mother:** Eunir was born on 17 May 1924 at Nova Friburgo (CIV-0016, the birth act), while Alício's 2005 death gives his birth as 26 July 1924 at Divino, MG (CIV-0039, an informant's statement). Two full-term births about ten weeks apart are impossible; the birth act outranks the death informant, so Alício's stated date or year is probably wrong. [OPEN]

  - **Parents' origin in a late record:** Ivanyr's 1992 death calls João and Celina "naturais do Estado de Minas Gerais" (CIV-0040), against João's own death ("natural dêste Estado", Rio de Janeiro; CIV-0014) and Celina's Nova Friburgo baptism (PAR-0057). The 1992 informant is the weakest witness; preserved as a conflict, not adopted. [OPEN — low weight]

  ## Sources held (this repository)

  - CIV-0014 (his 1970 Volta Redonda death — age, profession, wife, parents, fifteen
  children) · CIV-0016 (son Eunir's 1924 Nova Friburgo birth — "lavrador", paternal
  grandparents) · CIV-0004 (daughter Iris's 1949 marriage — names him as her father) ·
  CIV-0025 (son João Bohrer's 2001 death — names him and Celina as parents) · REC-0001
  (owner family roster).

  - Children's records naming him as father: CIV-0038 (Senira's 1923 Nova Friburgo birth — lavrador, "casados civilmente" in Nova Friburgo, both grandparent couples) · CIV-0031 (Ercy's 1972 Volta Redonda death) · CIV-0039 (Alício's 2005 Volta Redonda death) · CIV-0040 (Ivanyr's 1992 Barra Mansa death). CIV-0015 (wife Celina's 1977 death — "não deixou bens").

  - His parents, siblings and line: CIV-0045 (sister Maria Felomena's 1891 birth — father a lavrador who could not write) · PAR-0080 · PAR-0074 · PAR-0052 · PAR-0053 (siblings' baptisms, 1900–1910) · CIV-0047 (sister Maria Bohrer Teixeira's 2003 death) · PAR-0063 (father's 1868 baptism) · PAR-0061 (grandfather Vicente's 1828 baptism) · PAR-0060 (immigrant Laurent Borer's 1820 marriage).

  - PUB-0003 (published Nova Friburgo genealogy — the immigrant Borer/Bohrer line, as a
  lead).

  ## Regional and migration context

  He and his mother are recorded as natural of Rio de Janeiro state (CIV-0014), and in 1923–1924 he farmed in the district of São João Baptista, **Nova Friburgo** (CIV-0038, CIV-0016) — the Serra-fluminense town built by the 1819–1824 Swiss / German colony. The family's descent from the Nova Friburgo Borer immigrants is documented generation by generation in parish records held here, not inferred from the surname: his father Valentim's 1868 baptism names Vicente Bohrer × Maria Eggendorn (PAR-0063); Vicente's 1828 baptism names Lourenço [Laurent] Bhorer × Anna Maria Verly [Wehrli], "naturaes do cantão de Soleure" (PAR-0061); and Laurent and Anna Maria married at Nova Friburgo in 1820, both "natural de Grindel" (PAR-0060). The published genealogy (PUB-0003) agrees. **Timing of the move to Minas** [INFERRED]: he declared two children at Nova Friburgo in March 1923 and May 1924 (CIV-0038, CIV-0016), but Iris was born at Presidente Soares, MG, in February 1929 (CIV-0004), and Ivanyr (c.1930), Ercy (c.1932) and João (c.1940, Carangola) are all recorded as natives of Minas Gerais (CIV-0040, CIV-0031, CIV-0025) — so the household left Nova Friburgo for the Zona da Mata Mineira between mid-1924 and early 1929. He ended his life a *comerciante* at **Volta
  Redonda**, the city built around the CSN steelworks (producing from the mid-1940s),
  where he died in the company hospital in 1970. [CONTEXTUAL]

  ## Where to go today

  - **Baptism (1894, Livro 4 f.66v — Raibert-index LEAD):** Paróquia de São José do
  Ribeirão, Bom Jardim, RJ — the parish where Valentim × Carolina baptised their early
  children (NOT the NF Catedral). Off-tool: the parish books are held locally and are not
  on FamilySearch. [LEAD] · [Maps](https://maps.google.com/?q=-22.1522,-42.4239)

  - **Marriage to Celina (place in conflict):** Igreja Matriz de Santa Luzia, Carangola, MG (Praça
  Coronel Maximiano 138, Centro, CEP 36800-000) — Carangola rests on CIV-0014 alone; João's own 1923–1924 declarations place the civil marriage in Nova Friburgo (CIV-0038, CIV-0016), so the Nova Friburgo civil registry is the first stop [DOCUMENTED-addr] · [Maps](https://maps.google.com/?q=-20.73337,-42.02975)

  - **Death (3 Aug 1970):** Igreja Matriz de Santa Cecília, Volta Redonda, RJ (Rua
  31-A, Vila Santa Cecília, CEP 27260-110) — civic anchor of the CSN steel city where
  he died [RESOLVED] · [Maps](https://maps.google.com/?q=-22.52408,-44.10435)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Casou-se com uma Bohrer (Celina Bohrer, P-0015) e era ele próprio um Bohrer — uma união Bohrer × Bohrer que é o caso mais claro de endogamia documentada na comunidade de colonos suíços/alemães de Nova Friburgo, onde casar dentro da mesma rede imigrante era tanto comum quanto esperado ao longo do final do século XIX. O sobrenome comum não prova parentesco: a linha dele descende do imigrante de 1819 Laurent Borer e a dela de Jacob Borer (PAR-0061, PAR-0060; PAR-0056, PAR-0054, PAR-0059), e nenhum parentesco entre esses dois imigrantes está documentado, de modo que o casamento não está comprovado como consanguíneo. [INFERRED]

  - **[PROVEN]** Sua vida traça o arco migratório completo do século XX da família em etapas documentadas: lavrador no distrito de São João Baptista, Nova Friburgo (1924, CIV-0016); seu filho João nascido em Carangola, MG (~1940, CIV-0025); e comerciante falecendo no Hospital da CSN, Volta Redonda (1970, CIV-0014). Nova Friburgo → Zona da Mata Mineira → cidade siderúrgica da CSN em uma vida documentada.

  - **[PROVEN]** Teve quinze filhos — declarado em seu próprio óbito de 1970 (CIV-0014). Num lar de quinze filhos com renda de classe trabalhadora, a instrução não podia ser comprada geração por geração; o capital da família era trabalho, parentesco e a passagem da lavoura ao comércio, não a escolaridade.

  - **[CONTEXTUAL]** Faleceu em 3 de agosto de 1970 no Hospital da CSN — o hospital próprio da Companhia Siderúrgica Nacional, erguido como parte de sua infraestrutura integrada de bem-estar dos trabalhadores. O hospital da empresa na cidade da empresa registrando a morte de um patriarca familiar é um marcador preciso de como a CSN estruturava completamente a vida em Volta Redonda.

  - **[INFERRED]** Sua passagem de lavrador (1924) para comerciante (1970) é mais bem lida como uma modesta estabilização dentro da faixa trabalhadora/pequeno-burguesa — não o declínio a partir da elite que marca o arco Armond, mas um movimento lateral a ligeiramente ascendente, da lavoura à margem do comerciante, dentro da mesma faixa econômica de seus antepassados colonos.

  - **[CONTEXTUAL]** Os ancestrais colonos suíços/alemães da linha Bohrer de Nova Friburgo receberam concessões de terra (sesmarias) da Coroa em troca do assentamento nas serras fluminenses a partir de 1819–1820. Na geração de João, essas concessões tinham sido fragmentadas entre famílias numerosas sob a herança partível; não havia mais capital fundiário herdável — apenas um sobrenome e um ofício.

  ## Identidade

  **João Gonçalves Bohrer** [PROVEN] — a grafia é consistente em seu próprio óbito de
  1970 (CIV-0014), no casamento de 1949 da filha Iris (CIV-0004), no nascimento de 1924
  do filho Eunir (CIV-0016) e no óbito de 2001 do filho João (CIV-0025).

  - **Nascimento:** c.1894 [INFERRED] — seu óbito de 1970 dá sua idade como **76 anos**
  (CIV-0014), retrocalculando para c.1894. Ali é registrado como **"natural dêste
  Estado"** (nascido no estado do Rio de Janeiro); não há registro de nascimento em
  mãos.

  - **Casamento:** casou-se com **Celina Bohrer** (P-0015) — uma união **Bohrer × Bohrer** (ambos os cônjuges levavam o sobrenome Bohrer), atestada pelos nascimentos de Senira em 1923 e de Eunir em 1924 (CIV-0038, CIV-0016) e por CIV-0004 e CIV-0025. **Local em conflito** [PROVEN, conflitante]: seu óbito de 1970 declara claramente "casado com Celina Bohrer em Carangola, Minas Gerais" (CIV-0014), mas trata-se do relato de um genro, uns quarenta anos depois do fato; em 1923 e 1924 o próprio João declarou o casal "casados civilmente" em Nova Friburgo — "no segundo Districto desta [cidade]" (CIV-0038) e "neste Município" (CIV-0016). As declarações quase contemporâneas do próprio noivo pesam mais [INFERRED]. Nenhum registro do casamento está em mãos, de modo que a data é desconhecida e ambos os locais são preservados.

  - **Pais:** **Valentim Martinho Bohrer** (P-0028), já falecido em 1970, e **Carolina
  Bohrer** (P-0029), *doméstica* registrada como residente em Volta Redonda em 1970 —
  ela sobreviveu ao filho [PROVEN] (CIV-0014; o casal é corroborado como avós paternos
  em CIV-0016).

  - **Filhos:** **quinze** — seu óbito de 1970 afirma que "deixou quinze filhos" [PROVEN]
  (CIV-0014). Sete estão documentados individualmente: **Iris Bohrer Muniz** (P-0007), **Eunir
  Bohrer** (1924, Nova Friburgo; CIV-0016), **João Bohrer** (c.1940 Carangola–2001 Volta
  Redonda; CIV-0025), **Ercy Bohrer** (c.1932–1972; CIV-0031), **Senira Bohrer** (1923, Nova
  Friburgo; CIV-0038), **Alício Borher** (1924–2005; CIV-0039) e **Ivanyr Borher** (c.1930–1992;
  CIV-0040). Outros três nomes — Cinésio (1926–2015), Ivan (1930; provavelmente duplicata de Ivanyr) e Maria Adyr (1936–2020) — vêm da árvore do FamilySearch, segundo a pesquisa de recuperação [LEAD — nenhum registro em mãos aqui]. O nascimento de Ercy é c.1932, pela idade declarada de 40 anos (CIV-0031), coerente com o 1932 da árvore [LEAD]. [Corrigido em 2026-10-08 a partir da imagem: "com quarenta anos", não 30 / c.1942.]

  - **Óbito:** **3 de agosto de 1970**, às 02h30, no **Hospital da C.S.N. (Companhia
  Siderúrgica Nacional), Volta Redonda, RJ**; *causa mortis* **infarto do miocárdio**
  [PROVEN] (CIV-0014). Deixou bens a inventariar e nenhum testamento; o declarante foi
  um genro.

  ## Posição social e profissão

  - **Lavrador em Nova Friburgo, 1924** [PROVEN] — ao declarar o nascimento de Eunir, é
  registrado como *lavrador* residente no distrito de São João Baptista, Nova Friburgo,
  e atua como declarante ele mesmo (CIV-0016).

  - **Comerciante em Volta Redonda, 1970** [PROVEN] — sua profissão ao falecer
  (CIV-0014). Entre 1924 e 1970 passou da lavoura em Nova Friburgo ao comércio em Volta
  Redonda. (O *industriário* nomeado em CIV-0014 é o declarante, seu genro, não ele.)

  ## Família e rede social

  Sua esposa Celina Bohrer (P-0015) era ela própria uma Bohrer, filha de Joaquim José
  Bohrer (P-0030) × Lucinda Ferreira da Silva (P-0031), de Nova Friburgo (CIV-0015,
  CIV-0016). Seu filho João Bohrer (n. c.1940 Carangola, MG; f. 2001 Volta Redonda) é
  fixado como seu filho pelo próprio óbito de 2001 desse filho, que nomeia ambos os pais
  (CIV-0025) — uma confirmação independente do casal ao longo de uma segunda geração.

  Seus próprios irmãos (filhos de Valentim Martinho Bohrer × Carolina Klein): **sete estão documentados por registros em mãos neste repositório que nomeiam ambos os pais** — **Maria Felomena** (n. 30 set. 1891, São José do Ribeirão; CIV-0045, que também nomeia os quatro avós) [Corrigido em 2026-10-08 a partir da imagem: "a trinta do passado" num ato de 2 de outubro — nascida em 30 de setembro, não 1.º de outubro], as gêmeas **Adelaide e Carolina** (n. 19 jul. 1899, batizadas em Lumiar em 1900; PAR-0080), **Valentim Luciano** (n. 14 mai. 1902; PAR-0074), **Maria Clara** (n. 20 fev. 1908; PAR-0052), **Durval Baptista** (n. 24 jun. 1910; PAR-0053) e **Maria Bohrer Teixeira** (n. 8 ago. 1919; f. 2003 em Niterói; CIV-0047). Outros três são apenas pistas: **Laudelina Olívia** (1896, São José do Ribeirão, Livro 4 f.137v — índice César Raibert, sem imagem), e **Balbina Eufrásia** (c.c. Manoel Americo Bohrer) e **Dionísio**, ambos entradas da árvore do FamilySearch sem registro que nomeie os pais [LEAD]. A pesquisa de recuperação relata ainda que, em outubro de 1910, "João Gonçalves Borber" e "Laudelina Borber" foram juntos padrinhos no assento de São Pedro que se segue ao batismo de Durval [LEAD — esse assento não está catalogado aqui]. O domicílio registrou a filha de 1891 na rural São José do Ribeirão (CIV-0045) e batizou os filhos posteriores em Lumiar e São Pedro (1899–1910) — razão pela qual a varredura da Catedral de Nova Friburgo não encontrou o batismo do próprio João, que consta ter sido lançado em São José do Ribeirão (ver Questões em aberto).

  **Letramento:** ele próprio declarou os nascimentos dos filhos em 1923 e 1924, e seu nome está entre as assinaturas ao pé do assento de 1924 (CIV-0016; ver também CIV-0038) [PROVEN]. Seu pai tivera o ato de 1891 assinado "a rogo" por não saber escrever (CIV-0045).

  ## O que podemos extrapolar

  **O sinal mais nítido de ascensão nesta linha é uma assinatura.** Seu pai não sabia escrever
  em 1891 — o escrivão assinou aquele ato "a rogo do declarante por não saber escrever"
  (CIV-0045) [PROVEN]. Em maio de 1924, João Gonçalves entra ele próprio no cartório de São João
  Baptista, declara o nascimento do filho Eunir e assina o assento; seu nome está entre as
  quatro assinaturas ao pé da entrada (CIV-0016) [PROVEN]. Fizera o mesmo pela filha Senira no
  ano anterior (CIV-0038) [PROVEN]. Uma geração, e o domicílio passa a poder transacionar no
  papel sem terceiros. Trata-se de uma competência adquirida, não de um bem herdado — e é
  exatamente o tipo de ganho que uma família sem capital consegue de fato realizar. [INFERRED]

  **De uma lavoura no quilômetro 102 à margem de um comerciante.** Em 1923 e 1924 ele é
  *lavrador* morador no "kilometro cento e dois" e num "Morro" do distrito de Nova Friburgo
  (CIV-0038, CIV-0016) [PROVEN] — endereços dados como distância ao longo de uma estrada, que é
  o aspecto de um sítio rural sem nome num registro. Em agosto de 1970 é *comerciante* na Rua
  Paulo Mendes 205, Volta Redonda (CIV-0014) [PROVEN]. Um comerciante ganha uma margem sobre
  estoque e crédito: renda que sobe e desce com a economia local, que não é salário fixo e que
  não é propriedade herdável [CONTEXTUAL]. (Sua idade registrada ao morrer, 76 anos, é a única
  evidência de um nascimento por volta de 1894; nenhum registro de nascimento ou batismo está
  disponível, de modo que o ano é aproximado — ver Questões em aberto.)

  **Os dois assentos de óbito fazem o experimento por nós.** O óbito dele, de 1970, declara que
  "deixou bens a inventariar" — havia algo a inventariar (CIV-0014) [PROVEN]. O óbito da viúva,
  de 1977, declara que ela "não deixou bens nem testamento" (CIV-0015) [PROVEN]. Fosse qual
  fosse o espólio do comerciante, sete anos e um domicílio de catorze ou quinze filhos depois
  nada restava a registrar. É a demonstração documentada mais clara em toda esta família da
  diferença entre riqueza comercial contingente e propriedade herdável. [INFERRED a partir de
  dois atos disponíveis]

  **Quinze filhos são a outra metade da aritmética.** O óbito dele diz que o casal "deixou
  quinze filhos"; o dela diz "quatorze" — ambas as cifras estão disponíveis e ambas são
  preservadas (CIV-0014, CIV-0015) [PROVEN, conflitantes]. Na partilha igualitária brasileira,
  um espólio pequeno dividido por quinze dá cerca de sete por cento por cabeça e, na prática,
  nada. Numa família cuja riqueza já era não herdável, a taxa de natalidade elimina até a
  possibilidade teórica de acumulação. [CONTEXTUAL/INFERRED]

  **A mudança para Volta Redonda alterou a relação de emprego da família, não apenas seu
  endereço.** [INFERRED] Ele mesmo permaneceu autônomo — *comerciante* até o fim —, mas a
  geração ao seu redor entrou no trabalho assalariado dentro da economia do aço: o genro que
  declarou seu óbito em 1970 é *industriário* (CIV-0014), e seu filho Alício morreu em 2005
  "aposentado industriário" (CIV-0039) [PROVEN]. Ele faleceu no Hospital da C.S.N., o hospital
  da própria empresa (CIV-0014) [PROVEN]. Volta Redonda foi erguida em torno da usina da
  Companhia Siderúrgica Nacional a partir de 1941 e passou de menos de 3.000 habitantes a cerca
  de 36.000 em 1950 [CONTEXTUAL]. Uma família que lavrava terra e mantinha uma venda chegou a
  uma cidade de um só empregador e, em uma geração, trabalhava para ele — trocando a
  independência no fundo de uma economia rural por um salário numa economia industrial, o que,
  pela aritmética desta linha, foi uma melhora.

  **Ele é o eixo da linha Bohrer e o espelho da queda Armond.** [INFERRED] A linha paterna
  Armond desta mesma família chegou à classe trabalhadora urbana de meados do século XX *a
  partir de* uma elite de cargos e casamentos; os Bohrer chegaram a ela *de baixo* — de um
  subsídio colonial de 160 réis por dia sobre um lote pedregoso [CONTEXTUAL], passando pela
  pequena lavoura e pelo pequeno comércio, até um sustento na cidade siderúrgica. Sua passagem
  de *lavrador* a *comerciante* é lateral ou ligeiramente ascendente dentro da faixa que seus
  antepassados friburguenses já ocupavam. Não havia patrimônio a perder, logo não houve queda —
  nem escolaridade herdada: num lar de quinze filhos com renda trabalhadora do interior, a
  instrução era um privilégio comprado e ligado à classe, que não podia ser recomprado a cada
  geração, e a escolaridade universal brasileira é uma conquista tardia do século XX
  [CONTEXTUAL]. O que ele transmitiu foi um ofício, uma cidade e a capacidade de assinar o
  próprio nome.

