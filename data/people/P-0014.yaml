  - text: >-
      Died 3 August 1970 at Volta Redonda, RJ, aged 76 (so born c.1894), a
      comerciante married to Celina Bohrer, per his civil death (CIV-0014). His
      parents were Valentim Martinho Bohrer (P-0028) and Carolina Bohrer
      (P-0029) — family F-0013 — named in that death and in Eunir Bohrer's 1924
      Nova Friburgo birth (CIV-0016).

      Falecido em 3 de agosto de 1970 em Volta Redonda, RJ, com 76 anos (portanto
      nascido c.1894), comerciante, casado com Celina Bohrer, conforme seu óbito
      civil (CIV-0014). Seus pais foram Valentim Martinho Bohrer (P-0028) e Carolina
      Bohrer (P-0029) — família F-0013 — nomeados nesse óbito e no nascimento de
      Eunir Bohrer em 1924 em Nova Friburgo (CIV-0016).
