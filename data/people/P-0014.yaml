  ## Contexto regional e migratório

  Ele e sua mãe são registrados como naturais do estado do Rio de Janeiro (CIV-0014) e, em 1923–1924, ele lavrava no distrito de São João Baptista, **Nova Friburgo** (CIV-0038, CIV-0016) — a cidade serrano-fluminense construída pela colônia suíço-alemã de 1819–1824. A descendência da família a partir dos imigrantes Borer de Nova Friburgo está documentada geração a geração em registros paroquiais em mãos neste repositório, e não inferida do sobrenome: o batismo de seu pai Valentim, em 1868, nomeia Vicente Bohrer × Maria Eggendorn (PAR-0063); o batismo de Vicente, em 1828, nomeia Lourenço [Laurent] Bhorer × Anna Maria Verly [Wehrli], "naturaes do cantão de Soleure" (PAR-0061); e Laurent e Anna Maria casaram-se em Nova Friburgo em 1820, ambos "natural de Grindel" (PAR-0060). A genealogia publicada (PUB-0003) concorda. **Data da mudança para Minas** [INFERRED]: ele declarou dois filhos em Nova Friburgo em março de 1923 e maio de 1924 (CIV-0038, CIV-0016), mas Iris nasceu em Presidente Soares, MG, em fevereiro de 1929 (CIV-0004), e Ivanyr (c.1930), Ercy (c.1932) e João (c.1940, Carangola) são todos registrados como naturais de Minas Gerais (CIV-0040, CIV-0031, CIV-0025) — portanto o domicílio deixou Nova Friburgo pela Zona da Mata Mineira entre meados de 1924 e o início de 1929. Encerrou a vida como *comerciante* em **Volta Redonda**, a cidade erguida em
  torno da siderúrgica CSN (com produção a partir de meados da década de 1940), onde
  faleceu no hospital da companhia em 1970. [CONTEXTUAL]

