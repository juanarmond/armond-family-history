  ## Contexto regional e migratório

  Seus pais eram **naturais** do estado do Rio de Janeiro e, em 1924, ele lavrava no
  distrito de São João Baptista, **Nova Friburgo** (CIV-0016) — a cidade
  serrano-fluminense construída pela colônia católica suíço-alemã de 1819–1824. A
  descendência da família a partir dos imigrantes Borer/Bohrer de Nova Friburgo (sua
  linha através de Valentim Martinho Bohrer, P-0028) está documentada na genealogia
  publicada de Nova Friburgo (PUB-0003) [LEAD] e não é inferida apenas a partir do
  sobrenome. Encerrou a vida como *comerciante* em **Volta Redonda**, a cidade erguida em
  torno da siderúrgica CSN (com produção a partir de meados da década de 1940), onde
  faleceu no hospital da companhia em 1970. [CONTEXTUAL]

