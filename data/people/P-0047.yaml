- text: >-
    Wife of Manoel Muniz Bytancourt (P-0042) and mother of his children; hence the
    mother of João Muniz Bittencourt (P-0019) and Antenor Muniz's Azorean
    great-grandmother. Her Azorean origin rests directly on the couple's own
    1842 marriage act (PAR-0024, folio 32r), which records the spouses as "ambos
    naturaes e freguezes desta [Parochial onde forão baptizados]" — a native and
    parishioner of Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores,
    Portugal), baptised there; corroborated by her husband's 1866 death (PAR-0015),
    which names her "natural desta freguesia".
