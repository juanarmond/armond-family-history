notes:
- text: >-
    Wife of Manoel Muniz Bytancourt (P-0042) and mother of his children; hence the
    mother of João Muniz Bittencourt (P-0019) and Antenor Muniz's Azorean
    great-great-grandmother. Named in her husband's 1866 death (PAR-0015) as "cazado
    com Francisca Roza do Espirito Santo, natural desta freguesia" — natural of
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal).
- text: >-
    Her link to João as mother is now directly confirmed by João's own 1845 baptism
    (PAR-0022), which names her as his mother. The earlier note (strong-evidence only)
    is superseded: PAR-0022 is a direct primary attestation; PAR-0015 and PAR-0007
    remain corroborating.
