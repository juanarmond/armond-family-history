profile: >-
  ## Interesting facts

  - **[PROVEN]** Her surname "do Espirito Santo" is devotional, not a family patronym — a common Azorean female naming pattern where women took saints' names rather than their father's family surname. Her own parents were named Manoel de Motta (var. Mello) and Anna de Souza (PAR-0024), neither of which corresponds to "do Espirito Santo."

  - **[PROVEN]** Her 1842 marriage to Manoel Muniz Bytancourt was dispensed from a 4th-degree consanguinity impediment (PAR-0024) — they were blood relatives, consistent with the endogamous, land-conserving marriage strategy of the Mãe de Deus peasant-proprietor community of Povoação, São Miguel.

  - **[CONTEXTUAL]** She bore eight children for a proprietário on a small Azorean smallholding — the exact combination that made emigration structurally inevitable under partible inheritance. Both Portuguese and Brazilian law required equal division of estates among all heirs; eight children on one smallholding meant each child's share was too small to sustain a family.

  - **[INFERRED]** After her husband drowned in July 1866 leaving her a widow with eight
  children, at least one son (João, P-0019) emigrated to Brazil between 1866 and 1882 (most
  plausibly near 1880; see P-0019). She herself has no documented move — her death is not
  located — so she may have remained in Povoação while her sons built new lives across the
  Atlantic.

  - **[CONTEXTUAL]** The Azorean parish of Nossa Senhora Mãe de Deus (Povoação) sits on São Miguel's southeastern coast, exposed to Atlantic weather and dependent on a mix of farming and coastal fishing — the same coastal fishing that claimed her husband's life in the sea off the Garajau in 1866.

  ## Identity

  **Francisca Roza do Espirito Santo** (variant "Francisca Roza de Pimentel" [uncertain reading], PAR-0046) —
  named in her husband's 1866 death and in her son João's 1845 baptism. [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); Portuguese (Açorean). [PROVEN]

  - **Marriage:** Manoel Muniz Bitancourt (P-0042), 17 February 1842 at N.S. Mãe de Deus,
  Povoação (PAR-0024, folio 32r; family F-0020), dispensed from a 4th-degree consanguinity
  impediment. [PROVEN]

  - **Children:** of the eight children her husband left at his 1866 death (PAR-0015),
  **all 8 surviving children are now individually PROVEN** [roster completed 2026-09-13].
  Through held records naming her as mother: the immigrant João Muniz Bittencourt (P-0019),
  directly confirmed by his 1845 baptism (PAR-0022); three daughters, Maria (b. 26 December
  1842; PAR-0045), Francisca (b. 31 August 1849; PAR-0046) and Maria (b. 29 November 1851;
  PAR-0047); and three further children proved through their later records — **Anna Maria
  Byttancourt** (b. ~1855; proved by her 1878 Mãe de Deus marriage, PAR-0083, naming her
  "filha legitima de Manoel Muniz Byttancourt e de Francisca Roza do Espirito Santo"),
  **Claudina Muniz Bettencourt** (b. ~1856; proved by her 1872 Mãe de Deus marriage,
  PAR-0084), and **Maria José Bittencourt** (b. ~1858 São Miguel, d. 8 November 1943 Rio de
  Janeiro; proved by her civil death register, CIV-0034). A ninth birth — infant **Claudina**
  (b. ~May 1854, d. 24 September 1854, PAR-0085) — predeceased her father and is not counted
  in the "8 filhos." [PROVEN eight surviving children, all individually attested; + 1 infant
  death PROVEN]

  - **Parents:** Manoel de Motta [var. Mello] mancebo (P-0086) × Anna de Souza (P-0087),
  family F-0042 — legibly named in her 1842 marriage act (PAR-0024, folio 32r). This
  supersedes the earlier "parents undocumented / [LEAD]" position, which rested on an
  illegible, mis-identified folio-73r image. [PROVEN]

  - **Death:** undocumented. [OPEN]

  ## Standing and profession

  Wife of a Povoação landowner and a native Azorean of the parish; no occupation of her own
  is recorded. Widowed by her husband's drowning in July 1866, she was left with eight
  children. [PROVEN]

  ## Family and social network

  Daughter of **Manoel de Motta Junior** (P-0086) and **Anna de Souza** (P-0087) of the same
  Mãe de Deus parish (PAR-0024) — her parents are named in her 1842 marriage act and again
  as the maternal grandparents in her children's baptisms (PAR-0046, PAR-0047). She married
  **Manoel Muniz Bytancourt** (P-0042) as a fourth-degree blood relative, under apostolic
  dispensation.

  The two households then interlocked through compadrio: her parents stood godparents to her
  husband's infant brother **Agostinho** in April 1843 (PAR-0044), her sister **Claudina**
  godmothered her daughters Maria (1843) and Francisca (1849), and her husband's brother
  **José** stood godfather at the same acts (PAR-0045, PAR-0046). Every godparent in her
  children's baptisms comes from inside the two families.

  Her documented children include João (P-0019, the emigrant), Maria (b. 1842), Francisca
  (b. 1849), Maria (b. 1851), the infant Claudina (d. 1854), Claudina (b. ~1856, m. 1872),
  Anna Maria (b. ~1855, m. 1878) and probably Maria José (d. 1943, Rio de Janeiro). Her
  husband's 1866 óbito states eight surviving children (PAR-0015).

  ## What we can extrapolate

  *Francisca is the widow at the hinge: the household head who held the fragmenting Povoação
  estate together for at least twelve years after her husband drowned, and out of whose
  house the emigration went.*

  **1. A devotional surname is itself a faint class signal [PROVEN / INFERRED].** "do
  Espírito Santo" is a saint's name, not a patronymic, and it is why her own baptism cannot
  be found by surname and her parents surface only through her 1842 marriage act (PAR-0024).
  Her name is unstable across the records — *do Espírito Santo* (PAR-0024, PAR-0047), *de
  Pimentel* (PAR-0046), plain *Francisca Roza* (PAR-0085), and *Francisca Rosa Bittencourt*
  under her married name in Brazil (CIV-0034). **[INFERRED]** A surname is heritable social
  capital only to families with something to signal; a peasant-proprietor's daughter
  carrying a devotional name that clerks then rewrote at will belonged to a family with none
  to transmit.

  **2. She married inside the kin group, and that was the strategy, not an accident [PROVEN
  / CONTEXTUAL].** Her 1842 marriage to Manoel Muniz Bytancourt (P-0042) needed an apostolic
  dispensation from a **fourth-degree consanguinity** impediment (PAR-0024): they were blood
  relatives. **[CONTEXTUAL]** On a land-scarce island, cousin-marriage was how
  peasant-proprietor families kept fragmenting plots inside the kin group, and the Mãe de
  Deus registers turn on the same handful of surnames. **[INFERRED]** She brought no new
  land into the match — she brought membership in the same closed parish network. The two
  families then bound themselves further: her parents Manoel da Motta Junior and Anna de
  Souza stood godparents to her husband's infant brother Agostinho in April 1843 (PAR-0044),
  and her sister Claudina godmothered two of her own children (PAR-0045, PAR-0046).

  **3. She was widowed young and ran the household for at least twelve years [PROVEN /
  INFERRED].** Manoel drowned in July 1866, intestate, leaving eight surviving children
  (PAR-0015). She is recorded still living — not "já defunta" — when her daughter Claudina
  married in 1872 and her daughter Anna Maria in 1878, in both of which the father is
  expressly "já defunto" (PAR-0084, PAR-0083). **[INFERRED]** For more than a decade she was
  the head of a landholding household that the law had already committed to dividing eight
  ways. What that looked like in practice is visible in the marriages she made for her
  daughters: a **shoemaker** in 1872 and a **mason** in 1878. A proprietor's daughters
  married artisans; the estate could no longer match them to landholders.

  **4. She buried children and reused their names [PROVEN / CONTEXTUAL].** She lost an
  infant Claudina at four months in September 1854 (PAR-0085) and gave the name again to a
  daughter born about 1856 (PAR-0084). She also had two surviving daughters called **Maria**
  — one born December 1842 (PAR-0045, with a marginal note of death in 1931) and one born
  November 1851 (PAR-0047). **[CONTEXTUAL]** Reusing a dead child's name was ordinary
  Catholic practice; carrying two living daughters of the same name is less so, and both
  facts together describe a large household in which names were a scarce resource managed by
  devotion rather than by individuation.

  **5. The emigration out of her house was not only male [PROVEN].** Her son João crossed to
  Brazil (P-0019), and her daughter **Maria José Bittencourt** died at Rio de Janeiro in
  November 1943, aged 85, a widow and *doméstica*, recorded "natural de Portugal" and named
  as a daughter of Manoel Muniz Bittencourt and Francisca Rosa (CIV-0034). **[INFERRED]** At
  least two of her children therefore ended their lives in Brazil, one of them a daughter —
  so the dispersal of her household across the Atlantic was general, not the classic
  surplus-sons pattern alone. She herself is nowhere documented as leaving São Miguel.

  **Synthesis.** Francisca is the female, propertyless half of a peasant-proprietor line,
  and the person on whom the fragmentation actually landed. A devotional name over an
  obscured patronymic; a blood-kin marriage that conserved rather than expanded; eight
  surviving children on a holding that could not carry them; twelve years of widowed
  headship during which the daughters married down into trades and the sons and at least one
  daughter left the island altogether. **[INFERRED]** Nothing in her record reaches for
  status. It is the ordinary texture of a closed Azorean smallholder parish — and it is the
  household from which the entire Brazilian Muniz line departs.

  ## Open questions

  - Her own baptism (about the 1820s, Mãe de Deus) and true patronymic — pre-1818 books are
  not digitised online. [OPEN]

  - Her death record (place and date unknown). [OPEN]

  ## Sources held (this repository)

  - PAR-0022 (her son João's 1845 baptism — names her his mother, the direct attestation) ·
  PAR-0015 (her husband's 1866 death — names her his wife, "natural desta freguesia") ·
  PAR-0024 (her 1842 marriage to Manoel Muniz Bitancourt — names both her and her parents) ·
  PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851 baptisms of three daughters — Maria,
  Francisca and Maria — each naming her as mother) · PAR-0083 (1878 marriage of daughter
  Anna Maria Byttancourt — names her as mother) · PAR-0084 (1872 marriage of daughter
  Claudina Muniz Bettencourt) · PAR-0085 (1854 Mãe de Deus death of infant daughter
  Claudina) · CIV-0034 (1943 civil death of daughter Maria José Bittencourt, Rio de
  Janeiro).

  ## Regional and migration context

  A native Azorean of Nossa Senhora Mãe de Deus, Povoação, São Miguel, of the last
  Açores-rooted generation of the Muniz line. [CONTEXTUAL] No move is documented for her;
  the emigration to Brazil is her sons' generation, after her husband drowned in 1866.

  ## Where to go today

  - **Marriage (1842):** Igreja Matriz de N.S. da Mãe de Deus, Vila da Povoação, São Miguel,
  Açores, Portugal [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Baptism (likely her mother's home parish):** Nordeste (Igreja de N.S. da Luz / Matriz de
  São Jorge), São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu sobrenome "do Espírito Santo" é devocional, não um patronímico de família — um padrão comum de nomeação feminina açoriana em que as mulheres adotavam nomes de santos em vez do sobrenome familiar do pai. Seus próprios pais chamavam-se Manoel de Motta (var. Mello) e Anna de Souza (PAR-0024), nenhum dos quais corresponde a "do Espírito Santo."

  - **[PROVEN]** Seu casamento de 1842 com Manoel Muniz Bytancourt foi dispensado de um impedimento de consanguinidade de 4º grau (PAR-0024) — eram parentes de sangue, coerente com a estratégia matrimonial endogâmica e conservadora de terra da comunidade de pequenos proprietários camponeses de Mãe de Deus, em Povoação, São Miguel.

  - **[CONTEXTUAL]** Ela teve oito filhos de um proprietário num pequeno minifúndio açoriano — a combinação exata que tornava a emigração estruturalmente inevitável sob a herança partível. Tanto a lei portuguesa quanto a brasileira exigiam a divisão igualitária dos espólios entre todos os herdeiros; oito filhos num único minifúndio significavam que a parte de cada filho era pequena demais para sustentar uma família.

  - **[INFERRED]** Após o afogamento do marido em julho de 1866, que a deixou viúva com oito
  filhos, ao menos um filho (João, P-0019) emigrou para o Brasil entre 1866 e 1882 (mais
  plausivelmente por volta de 1880; ver P-0019). Ela mesma não tem mudança documentada — seu
  óbito não foi localizado —, de modo que pode ter permanecido em Povoação enquanto os
  filhos construíam novas vidas do outro lado do Atlântico.

  - **[CONTEXTUAL]** A freguesia açoriana de Nossa Senhora Mãe de Deus (Povoação) situa-se na costa sudeste de São Miguel, exposta ao tempo atlântico e dependente de uma mistura de agricultura e pesca costeira — a mesma pesca costeira que ceifou a vida do marido no mar ao largo do Garajau em 1866.

  ## Identidade

  **Francisca Roza do Espirito Santo** (variante "Francisca Roza de Pimentel" [leitura incerta], PAR-0046) —
  nomeada no óbito de 1866 de seu marido e no batismo de 1845 de seu filho João. [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); portuguesa (açoriana). [PROVEN]

  - **Casamento:** Manoel Muniz Bitancourt (P-0042), 17 de fevereiro de 1842, em N.S. Mãe de
  Deus, Povoação (PAR-0024, fólio 32r; família F-0020), dispensados de um impedimento de
  4º grau de consanguinidade. [PROVEN]

  - **Filhos:** dos oito filhos que seu marido deixou em seu óbito de 1866 (PAR-0015),
  **todos os 8 filhos sobreviventes estão agora individualmente PROVADOS** [rol concluído em
  2026-09-13]. Pelos registros em mãos que a nomeiam como mãe: o imigrante João Muniz
  Bittencourt (P-0019), confirmado diretamente por seu batismo de 1845 (PAR-0022); três
  filhas, Maria (n. 26 de dezembro de 1842; PAR-0045), Francisca (n. 31 de agosto de 1849;
  PAR-0046) e Maria (n. 29 de novembro de 1851; PAR-0047); e três filhos adicionais provados
  por registros posteriores — **Anna Maria Byttancourt** (n. ~1855; provada por seu casamento
  de 1878 em Mãe de Deus, PAR-0083, nomeando-a "filha legitima de Manoel Muniz Byttancourt e
  de Francisca Roza do Espirito Santo"), **Claudina Muniz Bettencourt** (n. ~1856; provada por
  seu casamento de 1872 em Mãe de Deus, PAR-0084) e **Maria José Bittencourt** (n. ~1858 São
  Miguel, f. 8 de novembro de 1943 Rio de Janeiro; provada por seu registro de óbito civil,
  CIV-0034). Um nono nascimento — a infante **Claudina** (n. ~maio de 1854, f. 24 de setembro
  de 1854, PAR-0085) — premorreu ao pai e não é contada nos "8 filhos." [PROVEN oito filhos
  sobreviventes, todos atestados individualmente; + 1 óbito de infante PROVEN]

  - **Pais:** Manoel de Motta [var. Mello] mancebo (P-0086) × Anna de Souza (P-0087), família
  F-0042 — nomeados legivelmente em seu ato de casamento de 1842 (PAR-0024, fólio 32r). Isto
  supera a posição anterior de "pais não documentados / [LEAD]", que se apoiava numa imagem
  ilegível e mal identificada do fólio 73r. [PROVEN]

  - **Óbito:** não documentado. [OPEN]

  ## Posição social e profissão

  Esposa de um proprietário de Povoação e nativa açoriana da freguesia; nenhuma ocupação
  própria lhe é registrada. Viúva pelo afogamento do marido em julho de 1866, ficou com oito
  filhos. [PROVEN]

  ## Família e rede social

  Filha de **Manoel de Motta Junior** (P-0086) e **Anna de Souza** (P-0087), da mesma
  freguesia de Mãe de Deus (PAR-0024) — seus pais são nomeados em seu ato de casamento de
  1842 e de novo como avós maternos nos batismos de seus filhos (PAR-0046, PAR-0047).
  Casou-se com **Manoel Muniz Bytancourt** (P-0042) na condição de parente de sangue em
  quarto grau, sob dispensa apostólica.

  As duas casas então se entrelaçaram pelo compadrio: seus pais foram padrinhos do irmão
  recém-nascido do marido, **Agostinho**, em abril de 1843 (PAR-0044); sua irmã **Claudina**
  foi madrinha das filhas Maria (1843) e Francisca (1849); e o irmão do marido, **José**,
  foi padrinho nos mesmos atos (PAR-0045, PAR-0046). Todos os padrinhos dos batismos de seus
  filhos vêm de dentro das duas famílias.

  Entre seus filhos documentados estão João (P-0019, o emigrante), Maria (n. 1842),
  Francisca (n. 1849), Maria (n. 1851), a infante Claudina (f. 1854), Claudina (n. ~1856,
  casada em 1872), Anna Maria (n. ~1855, casada em 1878) e provavelmente Maria José (f.
  1943, Rio de Janeiro). O óbito de 1866 do marido declara oito filhos vivos (PAR-0015).

  ## O que podemos extrapolar

  *Francisca é a viúva na dobradiça: a chefe de casa que manteve unida, por pelo menos doze
  anos depois do afogamento do marido, a propriedade da Povoação em fragmentação — e de cuja
  casa partiu a emigração.*

  **1. Um sobrenome devocional é, ele próprio, um leve sinal de classe [PROVEN /
  INFERRED].** "do Espírito Santo" é nome de santo, não patronímico, e é por isso que seu
  próprio batismo não pode ser achado pelo sobrenome e seus pais só afloram por seu ato de
  casamento de 1842 (PAR-0024). Seu nome é instável nos registros — *do Espírito Santo*
  (PAR-0024, PAR-0047), *de Pimentel* (PAR-0046), simplesmente *Francisca Roza* (PAR-0085) e
  *Francisca Rosa Bittencourt*, sob o nome de casada, no Brasil (CIV-0034). **[INFERRED]**
  Um sobrenome só é capital social herdável para famílias que têm algo a sinalizar; uma
  filha de camponeses-proprietários carregando um nome devocional que os escrivães depois
  reescreviam à vontade pertencia a uma família que nada tinha a transmitir.

  **2. Casou-se dentro da parentela, e isso era a estratégia, não um acaso [PROVEN /
  CONTEXTUAL].** Seu casamento de 1842 com Manoel Muniz Bytancourt (P-0042) exigiu dispensa
  apostólica de impedimento de **quarto grau de consanguinidade** (PAR-0024): eram parentes
  de sangue. **[CONTEXTUAL]** Numa ilha com pouca terra, o casamento entre primos era o modo
  como famílias de camponeses-proprietários mantinham dentro da parentela os lotes que se
  fragmentavam, e os registros de Mãe de Deus giram em torno dos mesmos poucos sobrenomes.
  **[INFERRED]** Ela não trouxe terra nova ao enlace — trouxe pertencimento à mesma rede
  paroquial fechada. As duas famílias então se ataram ainda mais: seus pais, Manoel da Motta
  Junior e Anna de Souza, foram padrinhos do irmão recém-nascido do marido, Agostinho, em
  abril de 1843 (PAR-0044), e sua irmã Claudina foi madrinha de dois de seus próprios filhos
  (PAR-0045, PAR-0046).

  **3. Enviuvou cedo e chefiou a casa por pelo menos doze anos [PROVEN / INFERRED].** Manoel
  afogou-se em julho de 1866, intestado, deixando oito filhos vivos (PAR-0015). Ela é
  registrada ainda viva — e não "já defunta" — quando a filha Claudina se casou em 1872 e a
  filha Anna Maria em 1878, atos em que o pai é expressamente "já defunto" (PAR-0084,
  PAR-0083). **[INFERRED]** Por mais de uma década foi a chefe de uma casa com terras que a
  lei já havia destinado a dividir-se em oito. Como isso ficou na prática, vê-se nos
  casamentos que arranjou para as filhas: um **sapateiro** em 1872 e um **pedreiro** em
  1878. Filhas de proprietário casaram-se com artesãos; a propriedade já não conseguia
  emparelhá-las a lavradores com terra.

  **4. Enterrou filhos e reutilizou seus nomes [PROVEN / CONTEXTUAL].** Perdeu uma Claudina
  de quatro meses em setembro de 1854 (PAR-0085) e voltou a dar o nome a uma filha nascida
  por volta de 1856 (PAR-0084). Teve também duas filhas vivas chamadas **Maria** — uma
  nascida em dezembro de 1842 (PAR-0045, com nota marginal de falecimento em 1931) e outra
  em novembro de 1851 (PAR-0047). **[CONTEXTUAL]** Reutilizar o nome de um filho morto era
  prática católica corrente; ter duas filhas vivas com o mesmo nome é menos comum, e os dois
  fatos juntos descrevem uma casa numerosa em que os nomes eram recurso escasso,
  administrado pela devoção e não pela individuação.

  **5. A emigração saída de sua casa não foi só masculina [PROVEN].** Seu filho João
  atravessou para o Brasil (P-0019), e sua filha **Maria José Bittencourt** morreu no Rio de
  Janeiro em novembro de 1943, aos 85 anos, viúva e *doméstica*, registrada como "natural de
  Portugal" e nomeada filha de Manoel Muniz Bittencourt e Francisca Rosa (CIV-0034).
  **[INFERRED]** Pelo menos dois de seus filhos, portanto, terminaram a vida no Brasil, um
  deles uma filha — de modo que a dispersão de sua casa pelo Atlântico foi geral, e não
  apenas o clássico padrão dos filhos excedentes. Dela própria não há documento algum de
  saída de São Miguel.

  **Síntese.** Francisca é a metade feminina e sem bens de uma linhagem de
  camponeses-proprietários, e a pessoa sobre quem a fragmentação de fato caiu. Um nome
  devocional sobre um patronímico obscurecido; um casamento entre parentes de sangue que
  conservou em vez de expandir; oito filhos vivos numa propriedade que não podia
  sustentá-los; doze anos de chefia viúva em que as filhas casaram para baixo, em ofícios, e
  os filhos — e ao menos uma filha — deixaram de todo a ilha. **[INFERRED]** Nada em seu
  registro busca posição social. É a textura ordinária de uma freguesia açoriana fechada de
  pequenos proprietários — e é a casa da qual parte toda a linhagem Muniz brasileira.

