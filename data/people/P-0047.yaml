profile: >-
  ## Identity

  **Francisca Roza do Espirito Santo** — named in her husband's 1866 death and in her son
  João's 1845 baptism. [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); Portuguese (Açorean). [PROVEN]

  - **Marriage:** Manoel Muniz Bitancourt (P-0042), 17 February 1842 at N.S. Mãe de Deus,
  Povoação (PAR-0024, folio 32r; family F-0020), dispensed from a 4th-degree consanguinity
  impediment. [PROVEN]

  - **Children:** mother of João Muniz Bittencourt (P-0019), directly confirmed by João's
  1845 baptism (PAR-0022); one of the eight children her husband left at his 1866 death
  (PAR-0015). [PROVEN]

  - **Parents:** Manoel de Motta [var. Mello] mancebo (P-0086) × Anna de Souza (P-0087),
  family F-0042 — legibly named in her 1842 marriage act (PAR-0024, folio 32r). This
  supersedes the earlier "parents undocumented / [LEAD]" position, which rested on an
  illegible, mis-identified folio-73r image. [PROVEN]

  - **Death:** undocumented. [OPEN]

  ## Standing and profession

  Wife of a Povoação landowner and a native Azorean of the parish; no occupation of her own
  is recorded. Widowed by her husband's drowning in July 1866, she was left with eight
  children. [PROVEN]

  ## What we can extrapolate

  Her surname "do Espírito Santo" is very likely a devotional name rather than a family
  patronymic — a common Azorean female naming pattern of the period — which is why her own
  baptism cannot be located by surname and her parents surface only through her marriage
  act (PAR-0024) and her children's records. [INFERRED] The Atlantic crossing belongs to
  her sons' generation, about 1866–1870, following their father's death.

  [INFERRED / CONTEXTUAL] That devotional surname is itself a faint class signal: surname
  as heritable social capital mattered to families with standing to signal, and a
  peasant-proprietor daughter carrying a saint's name rather than her father's lineage
  surname (Motta, var. Mello) reflects a family with no surname-capital to transmit —
  exactly why her baptism is unfindable under "do Espírito Santo".

  [INFERRED / CONTEXTUAL] She is the maternal half of an endogamous, land-conserving
  match: her marriage to Manoel Muniz Bytancourt (P-0042) was dispensed for 4th-degree
  consanguinity (PAR-0024) — they were blood kin — and her own line, of the same Mãe de
  Deus parish, was the same small-proprietor peasant world as his. The cousin-marriage
  kept two fragmenting local holdings inside one kin group; she brought not a dowry of new
  land but membership in the same closed parish network, the social form of a land-scarce
  society.

  [CONTEXTUAL] The emigration is her sons' generation, driven by the arithmetic she helped
  set: bearing eight children (PAR-0015) into a small holding is the partible-inheritance
  pressure that later expelled her surplus sons — P-0019 among them — after her husband's
  July-1866 drowning.

  [INFERRED] Francisca thus embodies the female, propertyless side of a peasant-proprietor
  line: a devotional name over an obscured patronymic, a blood-kin marriage that conserved
  rather than expanded, and a large family that guaranteed the next generation would have
  to leave. Nothing here reaches for status; it is the ordinary texture of a closed
  Azorean smallholder parish, the base from which the whole Muniz emigration flows.

  ## Open questions

  - Her own baptism (about the 1820s, Mãe de Deus) and true patronymic — pre-1818 books are
  not digitised online. [OPEN]

  - Her death record (place and date unknown). [OPEN]

  ## Sources held (this repository)

  - PAR-0022 (her son João's 1845 baptism — names her his mother, the direct attestation) ·
  PAR-0015 (her husband's 1866 death — names her his wife, "natural desta freguesia") ·
  PAR-0024 (her 1842 marriage to Manoel Muniz Bitancourt — names both her and her parents).

  ## Regional and migration context

  A native Azorean of Nossa Senhora Mãe de Deus, Povoação, São Miguel, of the last
  Açores-rooted generation of the Muniz line. [CONTEXTUAL] No move is documented for her;
  the emigration to Brazil is her sons' generation, after her husband drowned in 1866.
profile_pt: >-
  ## Identidade

  **Francisca Roza do Espirito Santo** — nomeada no óbito de 1866 de seu marido e no batismo
  de 1845 de seu filho João. [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); portuguesa (açoriana). [PROVEN]

  - **Casamento:** Manoel Muniz Bitancourt (P-0042), 17 de fevereiro de 1842, em N.S. Mãe de
  Deus, Povoação (PAR-0024, fólio 32r; família F-0020), dispensados de um impedimento de
  4º grau de consanguinidade. [PROVEN]

  - **Filhos:** mãe de João Muniz Bittencourt (P-0019), confirmada diretamente pelo batismo
  de 1845 de João (PAR-0022); uma dos oito filhos que seu marido deixou em seu óbito de 1866
  (PAR-0015). [PROVEN]

  - **Pais:** Manoel de Motta [var. Mello] mancebo (P-0086) × Anna de Souza (P-0087), família
  F-0042 — nomeados legivelmente em seu ato de casamento de 1842 (PAR-0024, fólio 32r). Isto
  supera a posição anterior de "pais não documentados / [LEAD]", que se apoiava numa imagem
  ilegível e mal identificada do fólio 73r. [PROVEN]

  - **Óbito:** não documentado. [OPEN]

  ## Posição social e profissão

  Esposa de um proprietário de Povoação e nativa açoriana da freguesia; nenhuma ocupação
  própria lhe é registrada. Viúva pelo afogamento do marido em julho de 1866, ficou com oito
  filhos. [PROVEN]

  ## O que podemos extrapolar

  Seu sobrenome "do Espírito Santo" é muito provavelmente um nome devocional, e não um
  patronímico de família — um padrão comum de nomeação feminina açoriana da época — razão
  pela qual seu próprio batismo não pode ser localizado pelo sobrenome e seus pais surgem
  apenas por meio de seu ato de casamento (PAR-0024) e dos registros dos filhos. [INFERRED]
  A travessia atlântica pertence à geração de seus filhos, por volta de 1866–1870, na
  sequência da morte do pai.

  [INFERRED / CONTEXTUAL] Esse sobrenome devocional é, em si, um tênue sinal de classe: o
  sobrenome como capital social herdável importava às famílias com posição a sinalizar, e
  uma filha de pequeno proprietário-camponês carregando o nome de um santo em vez do
  sobrenome de linhagem do pai (Motta, var. Mello) reflete uma família sem capital-de-
  sobrenome a transmitir — exatamente por isso seu batismo é inlocalizável sob "do Espírito
  Santo".

  [INFERRED / CONTEXTUAL] Ela é a metade materna de um casamento endogâmico e conservador
  de terra: seu casamento com Manoel Muniz Bytancourt (P-0042) foi dispensado de
  consanguinidade de 4º grau (PAR-0024) — eram parentes de sangue — e sua própria linha, da
  mesma freguesia de Mãe de Deus, era o mesmo mundo camponês de pequenos proprietários que a
  dele. O casamento entre primos manteve dois lotes locais em fragmentação dentro de um
  grupo de parentesco; ela trouxe não um dote de terra nova, mas a pertença à mesma rede
  paroquial fechada, a forma social de uma sociedade escassa em terra.

  [CONTEXTUAL] A emigração é a geração de seus filhos, movida pela aritmética que ela ajudou
  a fixar: parir oito filhos (PAR-0015) numa pequena propriedade é a pressão de herança
  partível que depois expulsou seus filhos excedentes — P-0019 entre eles — após o
  afogamento do marido em julho de 1866.

  [INFERRED] Francisca encarna, assim, o lado feminino e sem bens de uma linhagem de
  pequenos proprietários-camponeses: um nome devocional sobre um patronímico obscurecido, um
  casamento entre parentes de sangue que conservava em vez de expandir, e uma família
  numerosa que garantiu que a geração seguinte teria de partir. Nada aqui almeja status; é a
  textura ordinária de uma freguesia açoriana fechada de pequenos agricultores, a base de
  onde flui toda a emigração Muniz.

  ## Questões em aberto

  - Seu próprio batismo (por volta da década de 1820, Mãe de Deus) e verdadeiro patronímico —
  os livros anteriores a 1818 não estão digitalizados online. [OPEN]

  - Seu registro de óbito (local e data desconhecidos). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0022 (o batismo de 1845 de seu filho João — nomeia-a mãe dele, a atestação direta) ·
  PAR-0015 (o óbito de 1866 de seu marido — nomeia-a esposa dele, "natural desta freguesia") ·
  PAR-0024 (seu casamento de 1842 com Manoel Muniz Bitancourt — nomeia a ela e a seus pais).

  ## Contexto regional e migratório

  Uma nativa açoriana de Nossa Senhora Mãe de Deus, Povoação, São Miguel, da última geração
  enraizada nos Açores da linha Muniz. [CONTEXTUAL] Nenhuma mudança está documentada para
  ela; a emigração para o Brasil é a geração de seus filhos, após o afogamento do marido em
  1866.
