notes:
- text: >-
    Wife of Manoel Muniz Bytancourt (P-0042) and mother of his children; hence the
    mother of João Muniz Bittencourt (P-0019) and Antenor Muniz's Azorean
    great-great-grandmother. Named in her husband's 1866 death (PAR-0015) as "cazado
    com Francisca Roza do Espirito Santo, natural desta freguesia" — natural of
    Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal).
  text_pt: >-
    Esposa de Manoel Muniz Bytancourt (P-0042) e mãe de seus filhos; portanto, a
    mãe de João Muniz Bittencourt (P-0019) e a trisavó açoriana de Antenor Muniz.
    Nomeada no óbito de 1866 do marido (PAR-0015) como "cazado com Francisca Roza
    do Espirito Santo, natural desta freguesia" — natural de Nossa Senhora Mãe de
    Deus, Povoação, Ilha de São Miguel (Açores, Portugal).
- text: >-
    Her link to João as mother is now directly confirmed by João's own 1845 baptism
    (PAR-0022), which names her as his mother. The earlier note (strong-evidence only)
    is superseded: PAR-0022 is a direct primary attestation; PAR-0015 and PAR-0007
    remain corroborating.
  text_pt: >-
    Sua ligação com João como mãe está agora diretamente confirmada pelo próprio
    batismo de João em 1845 (PAR-0022), que a nomeia como sua mãe. A nota
    anterior (apenas evidência forte) fica superada: PAR-0022 é uma atestação
    primária direta; PAR-0015 e PAR-0007 permanecem como corroboração.
