profile: >-
  ## Identity

  **Barbara Alleman** (recorded *Barbara Allman*; "Allman/Allmann" is a common cursive
  variant of "Alleman"). Of Grindel, Soleure (Solothurn), Switzerland. Swiss.

  - **Couple:** wife of Johannes Wehrli (P-0074) — [PROVEN] as a couple from the Grindel
  Catholic baptism register (PAR-0027, p.571), naming them as parents at two baptisms
  (1751, 1752). No marriage record located. [OPEN]

  - **Birth, death, own parents:** no vital record held [OPEN]. A FamilySearch
  collaborative tree gives her birth ~1719 at Kleinlützel — the westernmost Solothurn Jura
  commune, from which she married into Grindel — and her death on 1 February 1799 at
  Grindel [LEAD]. FamilySearch attaches no parents to her (terminal on the tree); her own
  parentage would lie in the Kleinlützel parish registers [OPEN].

  ## Family and social network

  - **Child (our line):** Johann Jacob Wehrli (P-0072, b. 17 January 1751), the Nova
  Friburgo emigrant patriarch; she is thus a grandmother of the immigrant matriarch Anna
  Maria Werhly (P-0069). [PROVEN] (PAR-0027)

  - She is **not on the 1819 *Heureux Voyage* manifest**; her son emigrated, and she
  presumably remained in Switzerland or had already died. [INFERRED]

  ## What we can extrapolate

  - **[INFERRED]** The Alleman/Allemann surname is another Grindel-area family; a Grindel
  parish study would likely place her within the same tight Solothurn Catholic community
  as the Wehrli, Borer and Heggendorn families.

  - **The Wehrli branch's Old-World floor [CONTEXTUAL / INFERRED].** The Alleman/Wehrli
  household is poor, land-constrained Grindel Jura peasantry — the bottom rung of the
  Borer/Bohrer arc, nothing elite and no fortune to lose (the structural mirror image of
  the family's Armond line). The emigration and any modest colony gain belong to her son
  Johann Jacob's generation, not hers.

  ## Open questions

  - Her vital records and her own parents would come from the Grindel parish registers;
  her son's baptism would confirm her maternity at primary level. [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel baptism register, p.571 — the 1751 and 1752 baptisms naming her as
  mother).

  ## Regional and migration context

  An Alleman of the Grindel/Solothurn Jura — a Catholic, land-constrained farming parish
  — she stayed at the origin end of the branch while her son's family emigrated to Nova
  Friburgo in 1819. [CONTEXTUAL]

  ## Where to go today

  - **Birth (~1719, per FamilySearch tree lead):** Kath. Pfarrkirche St. Mauritius, Kleinlützel,
  Solothurn, Switzerland (Frohmattrain 257, 4245 Kleinlützel; GPS 47.4278, 7.4167) [RESOLVED] · [Maps](https://maps.google.com/?q=47.4278,7.4167)

  - **Marriage, family and death:** Kath. Pfarrkirche St. Stephan, Grindel, Solothurn, Switzerland
  (4247 Grindel; GPS 47.3833, 7.5042) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Identidade

  **Barbara Alleman** (registrada *Barbara Allman*; "Allman/Allmann" é uma variante
  cursiva comum de "Alleman"). De Grindel, Soleure (Solothurn), Suíça. Suíça.

  - **Casal:** esposa de Johannes Wehrli (P-0074) — [PROVEN] como casal pelo registro de
  batismo da paróquia católica de Grindel (PAR-0027, p.571), que os nomeia como pais em
  dois batismos (1751, 1752). Nenhum registro de casamento localizado. [OPEN]

  - **Nascimento, óbito, próprios pais:** nenhum registro vital em mãos [OPEN]. Uma árvore
  colaborativa do FamilySearch dá seu nascimento ~1719 em Kleinlützel — a aldeia mais
  ocidental do Jura de Solothurn, de onde se casou entrando em Grindel — e seu óbito em 1º
  de fevereiro de 1799 em Grindel [LEAD]. O FamilySearch não lhe atribui pais (terminal na
  árvore); sua própria filiação estaria nos registros paroquiais de Kleinlützel [OPEN].

  ## Família e rede social

  - **Filho (nossa linha):** Johann Jacob Wehrli (P-0072, n. 17 de janeiro de 1751), o
  patriarca emigrante de Nova Friburgo; ela é, portanto, avó da matriarca imigrante Anna
  Maria Werhly (P-0069). [PROVEN] (PAR-0027)

  - Ela **não consta no manifesto do *Heureux Voyage* de 1819**; seu filho emigrou, e ela
  presumivelmente permaneceu na Suíça ou já havia falecido. [INFERRED]

  ## O que podemos extrapolar

  - **[INFERRED]** O sobrenome Alleman/Allemann é outra família da região de Grindel; um
  estudo paroquial de Grindel provavelmente a situaria dentro da mesma comunidade católica
  restrita de Solothurn das famílias Wehrli, Borer e Heggendorn.

  - **O piso do Velho Mundo do ramo Wehrli [CONTEXTUAL / INFERRED].** O domicílio
  Alleman/Wehrli é uma família camponesa do Jura de Grindel, pobre e com escassez de terra
  — o degrau mais baixo do arco Borer/Bohrer, nada de elite e nenhuma fortuna a perder (o
  inverso estrutural da linha Armond da família). A emigração e qualquer modesto ganho de
  colônia pertencem à geração de seu filho Johann Jacob, não à dela.

  ## Questões em aberto

  - Seus registros vitais e seus próprios pais viriam dos registros paroquiais de
  Grindel; o batismo de seu filho confirmaria sua maternidade em nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (registro de batismo de Grindel, p.571 — os batismos de 1751 e 1752 que a
  nomeiam como mãe).

  ## Contexto regional e migratório

  Uma Alleman do Jura de Grindel/Solothurn — uma paróquia agrícola católica e com escassez
  de terra — ela permaneceu na ponta de origem do ramo, enquanto a família de seu filho
  emigrou para Nova Friburgo em 1819. [CONTEXTUAL]

  ## Onde ir hoje

  - **Nascimento (~1719, conforme pista da árvore do FamilySearch):** Kath. Pfarrkirche St. Mauritius,
  Kleinlützel, Solothurn, Suíça (Frohmattrain 257, 4245 Kleinlützel; GPS 47.4278, 7.4167) [RESOLVED] · [Maps](https://maps.google.com/?q=47.4278,7.4167)

  - **Casamento, família e óbito:** Kath. Pfarrkirche St. Stephan, Grindel, Solothurn, Suíça (4247
  Grindel; GPS 47.3833, 7.5042) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
