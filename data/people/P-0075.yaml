profile: >-
  ## Interesting facts

  - **[PROVEN]** She is documented only in her children's baptisms at Grindel — named "Barbara
  Allman" in the 1751 entry that records Johann Jacob Wehrli's baptism, and again in the 1752
  entry for Johann Joseph (PAR-0027). That single page is the whole of her documentary
  existence in this repository.

  - **[CONTEXTUAL]** The "Allman/Allmann" spelling is a feature of the clerk's hand:
  18th-century German Kurrent cursive in Catholic registers routinely renders "Alleman" in
  forms that read as "Allman" or "Allam". The same page writes the Wehrli surname two
  different ways in two entries.

  - **[LEAD]** A FamilySearch collaborative tree places her birth ~1719 at **Kleinlützel** —
  the westernmost commune of the Solothurn Jura, on the French border — and her death on 1
  February 1799 at Grindel. If that is right she married into Grindel from the far edge of the
  same tight Catholic Schwarzbubenland world. No held record confirms any of it.

  - **[INFERRED]** She is not on the 1819 *Heureux Voyage* manifest alongside her son. On the
  tree dates she had been dead for twenty years by then — consistent, in any case, with a
  woman born around 1719 being long gone before the famine and the colonisation decree that
  moved her descendants.

  ## Identity

  **Barbara Alleman** (recorded *Barbara Allman*; "Allman/Allmann" is a common cursive variant
  of "Alleman"). Of Grindel, Soleure (Solothurn), Switzerland. Swiss.

  - **Couple:** wife of Johannes Wehrli (P-0074) — [PROVEN] as a couple from the Grindel
  Catholic baptism register (PAR-0027, p.571), which names them as parents at two baptisms,
  1751 and 1752. No marriage record located. [OPEN]

  - **Birth, death, own parents:** no vital record held [OPEN]. A FamilySearch collaborative
  tree gives her birth ~1719 at Kleinlützel and her death on 1 February 1799 at Grindel
  [LEAD]. FamilySearch attaches no parents to her — she is terminal on the tree — and her own
  parentage would lie in the Kleinlützel parish registers [OPEN].

  ## Standing and profession

  Nothing is documented — no occupation, property, office, title or literacy. The single
  register page that names her attests only that she was the wife of Johannes Wehrli and the
  mother of their children; her Catholic confession is established by the register's own
  Tridentine sacramental form rather than by any statement about her. [PROVEN for the marriage
  and the children; everything else OPEN]

  ## Family and social network

  - **Child (our line):** Johann Jacob Wehrli (P-0072, b. 17 January 1751), the Nova Friburgo
  emigrant patriarch — so she is the grandmother of the immigrant matriarch Anna Maria Werhly
  (P-0069). A second son, Johann Joseph, was baptised 23 June 1752. [PROVEN — PAR-0027]

  - **Her children's godparents** were Hans Jacob Heggendorn (1751) and a Joseph Wehrli
  (1752), with the godmothers' surnames illegible in both entries — the Wehrli and Heggendorn
  families already standing together around her household. [PROVEN — PAR-0027]

  - She is **not on the 1819 *Heureux Voyage* manifest**; her son emigrated, and she had
  presumably died long before. [INFERRED]

  ## What we can extrapolate

  - **She sits at the Old-World floor, and the evidence supports nothing more [CONTEXTUAL /
  INFERRED].** An Alleman/Wehrli household in the Grindel Jura is poor, land-constrained
  Catholic peasantry — the bottom rung of the Borer/Bohrer arc, with nothing elite and no
  fortune to lose. That is the structural mirror image of the family's Armond line, which
  began at an office-and-marriage elite and fell; here the emigration and every subsequent
  modest gain belong to her son's generation, not hers.

  - **If the Kleinlützel lead holds, her marriage shows how far the pool actually stretched
  [CONTEXTUAL / INFERRED].** Kleinlützel to Grindel is a short move within one Catholic Jura
  district, but it is a move across communes — the same short-range marriage geography visible
  in her daughter-in-law's generation, when Elisabetha Borer of Erschwil married into Grindel.
  The Schwarzbubenland functioned as one marriage market of a few villages, which is precisely
  why the same handful of surnames recurs, and why the colony at Nova Friburgo later looked so
  endogamous: it had been endogamous at home.

  - **The Alleman surname does not reappear in Brazil, and that is informative [INFERRED].**
  Wehrli, Borer and Heggendorn all cross and recombine at Nova Friburgo; Alleman does not. Her
  line contributed a mother to the emigrating household and nothing else that the colony
  records preserve — the ordinary fate of a surname carried only by a woman in a system that
  recorded men.

  - **Her invisibility is the class fact, not an archival accident [INFERRED].** Two entries,
  both as somebody's mother, no birth, no death, no act of her own: that is what the record
  does with a peasant woman of the 18th-century Jura. A Grindel parish study would almost
  certainly place her inside the same Wehrli–Borer–Heggendorn network, but no held document
  does, and the profile should stop there.

  ## Open questions

  - Her own **baptism, marriage and burial** — the Grindel registers for the marriage and
  death, and the **Kleinlützel** registers for the birth and her parents, if the tree lead is
  right. [OPEN]

  - Her **parentage** — terminal on FamilySearch; only the Kleinlützel parish books would
  extend it. [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel Catholic baptism register, p.571 — the 1751 and 1752 baptisms naming her
  as mother; sources event E-0068).

  - Not held: the FamilySearch collaborative tree giving her ~1719 Kleinlützel birth and 1
  February 1799 Grindel death — a lead only.

  ## Regional and migration context

  An Alleman of the Grindel/Solothurn Jura — a Catholic, German-speaking, land-constrained
  farming district — she stayed at the origin end of the branch while her son's family
  emigrated to Nova Friburgo in 1819. [CONTEXTUAL] If the tree lead is correct she was born at
  Kleinlützel, the westernmost commune of the same Schwarzbubenland, and married the few
  kilometres east into Grindel: a single small Catholic Jura world, whose surnames and
  households were later transplanted whole into the Brazilian colony. [CONTEXTUAL]

  ## Where to go today

  - **Birth (~1719, per the FamilySearch tree lead):** Kath. Pfarrkirche St. Mauritius,
  Kleinlützel, Kt. Solothurn, Switzerland (Frohmattrain 257, 4245 Kleinlützel; GPS 47.4278,
  7.4167) [LEAD — verify before searching] · [Maps](https://maps.google.com/?q=47.4278,7.4167)

  - **Marriage, family and death:** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt.
  Solothurn, Switzerland (GPS 47.3833, 7.5042) — where her children were baptised [RESOLVED as
  a place; the records OPEN] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Está documentada apenas nos batismos de seus filhos em Grindel — nomeada
  "Barbara Allman" no assento de 1751 que registra o batismo de Johann Jacob Wehrli, e outra
  vez no assento de 1752, de Johann Joseph (PAR-0027). Essa única página é toda a sua
  existência documental neste repositório.

  - **[CONTEXTUAL]** A grafia "Allman/Allmann" é traço da mão do escrivão: a cursiva alemã
  Kurrent do século XVIII, nos livros católicos, grafa rotineiramente "Alleman" em formas que
  se leem como "Allman" ou "Allam". A mesma página escreve o sobrenome Wehrli de duas maneiras
  diferentes em dois assentos.

  - **[LEAD]** Uma árvore colaborativa do FamilySearch situa seu nascimento por volta de 1719
  em **Kleinlützel** — a comuna mais ocidental do Jura de Solothurn, na fronteira francesa — e
  seu óbito em 1º de fevereiro de 1799, em Grindel. Se estiver certo, ela casou-se para dentro
  de Grindel vinda da borda extrema do mesmo mundo católico apertado do Schwarzbubenland.
  Nenhum registro disponível confirma qualquer parte disso.

  - **[INFERRED]** Não consta do manifesto do *Heureux Voyage* de 1819 ao lado do filho. Pelas
  datas da árvore, já estaria morta havia vinte anos — coerente, de todo modo, com uma mulher
  nascida por volta de 1719 ter partido muito antes da fome e do decreto de colonização que
  moveram seus descendentes.

  ## Identidade

  **Barbara Alleman** (registrada *Barbara Allman*; "Allman/Allmann" é variante cursiva comum
  de "Alleman"). De Grindel, Soleure (Solothurn), Suíça. Suíça.

  - **Casal:** esposa de Johannes Wehrli (P-0074) — [PROVEN] como casal pelo livro de batismos
  católico de Grindel (PAR-0027, p.571), que os nomeia como pais em dois batismos, 1751 e
  1752. Nenhum registro de casamento localizado. [OPEN]

  - **Nascimento, óbito, próprios pais:** nenhum registro vital disponível [OPEN]. Uma árvore
  colaborativa do FamilySearch dá seu nascimento por volta de 1719, em Kleinlützel, e seu
  óbito em 1º de fevereiro de 1799, em Grindel [LEAD]. O FamilySearch não lhe atribui pais — é
  terminal na árvore — e sua própria filiação estaria nos livros paroquiais de Kleinlützel
  [OPEN].

  ## Posição social e profissão

  Nada está documentado — nenhuma ocupação, propriedade, cargo, título ou alfabetização. A
  única página de registro que a nomeia atesta apenas que era esposa de Johannes Wehrli e mãe
  dos filhos do casal; sua confissão católica se estabelece pela própria forma sacramental
  tridentina do livro, e não por qualquer declaração a seu respeito. [PROVEN quanto ao
  casamento e aos filhos; todo o resto OPEN]

  ## Família e rede social

  - **Filho (nossa linha):** Johann Jacob Wehrli (P-0072, n. 17 de janeiro de 1751), o
  patriarca emigrante de Nova Friburgo — logo, ela é avó da matriarca imigrante Anna Maria
  Werhly (P-0069). Um segundo filho, Johann Joseph, foi batizado em 23 de junho de 1752.
  [PROVEN — PAR-0027]

  - **Os padrinhos de seus filhos** foram Hans Jacob Heggendorn (1751) e um Joseph Wehrli
  (1752), com os sobrenomes das madrinhas ilegíveis nos dois assentos — as famílias Wehrli e
  Heggendorn já lado a lado em torno de seu domicílio. [PROVEN — PAR-0027]

  - **Não consta do manifesto do *Heureux Voyage* de 1819**; o filho emigrou, e ela
  presumivelmente já havia morrido muito antes. [INFERRED]

  ## O que podemos extrapolar

  - **Ela está no piso do Velho Mundo, e a evidência não sustenta mais do que isso [CONTEXTUAL
  / INFERRED].** Um domicílio Alleman/Wehrli no Jura de Grindel é campesinato católico pobre e
  limitado em terra — o degrau de base do arco Borer/Bohrer, sem nada de elite e sem fortuna a
  perder. É a imagem espelhada estrutural da linha Armond da família, que partiu de uma elite
  de cargo e casamento e caiu; aqui a emigração e todo ganho modesto posterior pertencem à
  geração do filho, não à dela.

  - **Se a pista de Kleinlützel se sustentar, seu casamento mostra até onde o repertório de
  fato se estendia [CONTEXTUAL / INFERRED].** De Kleinlützel a Grindel é um deslocamento curto
  dentro de um mesmo distrito católico do Jura, mas é um deslocamento entre comunas — a mesma
  geografia matrimonial de curto alcance visível na geração de sua nora, quando Elisabetha
  Borer, de Erschwil, casou-se para dentro de Grindel. O Schwarzbubenland funcionava como um
  único mercado matrimonial de poucas aldeias, razão exata pela qual o mesmo punhado de
  sobrenomes se repete — e pela qual a colônia de Nova Friburgo pareceu depois tão endogâmica:
  já era endogâmica em casa.

  - **O sobrenome Alleman não reaparece no Brasil, e isso é informativo [INFERRED].** Wehrli,
  Borer e Heggendorn todos atravessam e se recombinam em Nova Friburgo; Alleman, não. Sua
  linha contribuiu com uma mãe para o domicílio emigrante e com mais nada que os registros
  coloniais preservem — o destino corriqueiro de um sobrenome carregado apenas por uma mulher,
  num sistema que registrava homens.

  - **Sua invisibilidade é o fato de classe, não um acidente de arquivo [INFERRED].** Dois
  assentos, ambos como mãe de alguém, nenhum nascimento, nenhum óbito, nenhum ato próprio: é o
  que o registro faz com uma camponesa do Jura do século XVIII. Um estudo paroquial de Grindel
  quase certamente a situaria dentro da mesma rede Wehrli–Borer–Heggendorn, mas nenhum
  documento disponível o faz, e o perfil deve parar aí.

  ## Questões em aberto

  - Seu próprio **batismo, casamento e sepultamento** — os livros de Grindel para o casamento
  e o óbito, e os de **Kleinlützel** para o nascimento e seus pais, se a pista da árvore
  estiver certa. [OPEN]

  - Sua **filiação** — terminal no FamilySearch; só os livros paroquiais de Kleinlützel a
  estenderiam. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (livro de batismos católico de Grindel, p.571 — os batismos de 1751 e 1752 que a
  nomeiam como mãe; fundamenta o evento E-0068).

  - Não disponível: a árvore colaborativa do FamilySearch que dá seu nascimento por volta de
  1719 em Kleinlützel e óbito em 1º de fevereiro de 1799 em Grindel — apenas pista.

  ## Contexto regional e migratório

  Uma Alleman do Jura de Grindel/Solothurn — distrito agrícola católico, germanófono e
  limitado em terra —, permaneceu na ponta de origem do ramo enquanto a família do filho
  emigrava para Nova Friburgo em 1819. [CONTEXTUAL] Se a pista da árvore estiver correta,
  nasceu em Kleinlützel, a comuna mais ocidental do mesmo Schwarzbubenland, e casou-se poucos
  quilômetros a leste, em Grindel: um único e pequeno mundo católico do Jura, cujos sobrenomes
  e domicílios foram depois transplantados inteiros para a colônia brasileira. [CONTEXTUAL]

  ## Onde ir hoje

  - **Nascimento (~1719, conforme a pista da árvore do FamilySearch):** Kath. Pfarrkirche St.
  Mauritius, Kleinlützel, Kt. Solothurn, Suíça (Frohmattrain 257, 4245 Kleinlützel; GPS
  47.4278, 7.4167) [LEAD — verificar antes de buscar] ·
  [Maps](https://maps.google.com/?q=47.4278,7.4167)

  - **Casamento, família e óbito:** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt.
  Solothurn, Suíça (GPS 47.3833, 7.5042) — onde seus filhos foram batizados [RESOLVED quanto
  ao lugar; os registros OPEN] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
