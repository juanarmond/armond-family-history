notes:
- text: >-
    Mother of Johann Jacob Wehrli (P-0072). Confirmed as wife of Johannes Wehrli
    (P-0074) in the Grindel Catholic parish baptism register (PAR-0027, page 571):
    the surname "Allman/Allmann" is a common variant of "Alleman" in Swiss German
    cursive script. No further biographical data is known; she is not listed on the
    1819 Heureux Voyage manifest (her son emigrated to Brazil; she presumably
    remained in Switzerland or was already deceased).
  text_pt: >-
    Mãe de Johann Jacob Wehrli (P-0072). Confirmada como esposa de Johannes
    Wehrli (P-0074) no registro de batismo da paróquia católica de Grindel
    (PAR-0027, página 571): o sobrenome "Allman/Allmann" é uma variante comum de
    "Alleman" na escrita cursiva do alemão suíço. Nenhum outro dado biográfico é
    conhecido; ela não consta no manifesto do Heureux Voyage de 1819 (seu filho
    emigrou para o Brasil; ela presumivelmente permaneceu na Suíça ou já havia
    falecido).
