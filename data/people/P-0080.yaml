profile: >-
  ## Identity

  **João Rodrigues** (named as father *Joam Rodrigues [Valle]* in his son's 1728
  baptism; the "Valle" is the family's *lugar*-name in Ruivais). Of the Freguesia de São
  Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese.

  - **Marriage:** married Joanna Gonçalves (P-0081) on 13 May 1716 at Ruivais —
  [strong-evidence]: the Ruivais register (PAR-0036; E-0072; family F-0039) is primary, but
  identifying its spouses with our P-0080/P-0081 rests on the same name/parish/timeline match
  as the parentage below.

  - **Parents:** legitimate son of Gonçalo Rodrigues (P-0088), of the lugar de Frades, and
  Elebia Francisca (P-0089), moradores na villa de Ruivais, named in PAR-0036 — modelled
  2026-08-13 as family F-0043. [strong-evidence]

  - **Birth, baptism, death:** not located; a resident and married communicant of
  Ruivais. [OPEN]

  ## Family and social network

  - **Father of João Rodrigues Valle (P-0078)**, baptised at Ruivais in 1728 (PAR-0035)
  — the son who emigrated to Minas Gerais. Through that son he extends the maternal
  Toledo line one generation into early-18th-century Portugal. [strong-evidence for the
  child link]

  - **Wife:** Joanna Gonçalves (P-0081), of the lugar da Quintã in Ruivais, daughter of Domingos
  Gonçalves × Maria Fernandes as named in the 1716 marriage act (PAR-0036).

  - **A probable further child:** a daughter baptised at Ruivais about June 1727 (parish book
  0005), documenting the same parents; given the 1716 marriage, more children between 1717 and
  1726 are to be expected. [LEAD — an agent register-read, not primary-verified in this
  repository]

  ## What we can extrapolate

  - **The generation a published genealogy had dropped** [INFERRED]. The *imigracaoegenealogia*
  blog genealogy skipped straight from the emigrant João Rodrigues Valle (b. 1728) to "Gonçalo
  Rodrigues (de Santos) × Estêbia/Elebia Francisca" — but those are *this* man's parents (the
  emigrant's grandparents), so João-pai is the missing intervening generation. His 1716 marriage
  is what reconciles the blog, which had placed "Gonçalo × Elebia" one generation too low.

  ## Open questions

  - His own baptism (Ruivais, ~1690–1696, parish book PVRM14/001/0003 or 0004), his death, and
  whether the household disappears from Ruivais after the 1740s (which would corroborate the son's
  emigration), would come from the São Martinho de Ruivais registers (Arquivo Distrital de Braga).
  His full child set (Ruivais baptisms 1717–1728) is likewise open. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage — his marriage and his parents) · PAR-0035 (1728
  Ruivais baptism of his son João Rodrigues Valle, naming him as father).

  ## Regional and migration context

  A married communicant of São Martinho de Ruivais in the Minho highlands of the
  Arcebispado de Braga, north-west Portugal — the origin parish of this branch, from
  which his son emigrated to Minas Gerais. He himself is not documented as leaving
  Portugal. [CONTEXTUAL] He is the non-emigrating Minho generation: the Minho was Portugal's most
  densely populated and most fragmented region — a smallholding minifúndio at ~96 inhabitants/km²
  by 1801, among Europe's highest rural densities — whose surplus non-inheriting sons made it the
  single greatest source of 18th-century Portuguese emigration to Brazil; his son's crossing fell
  under the Provisão de 20 de março de 1720 (D. João V) passport regime. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **João Rodrigues** (nomeado como pai *Joam Rodrigues [Valle]* no batismo de 1728 de seu
  filho; o "Valle" é o nome do *lugar* da família em Ruivais). Da Freguesia de São
  Martinho de Ruivais, Arcebispado de Braga, Portugal. Português.

  - **Casamento:** casou-se com Joanna Gonçalves (P-0081) em 13 de maio de 1716 em
  Ruivais — [strong-evidence]: o registro de Ruivais (PAR-0036; E-0072; família F-0039) é
  primário, mas identificar seus cônjuges com os nossos P-0080/P-0081 apoia-se na mesma
  correspondência de nome/paróquia/cronologia da filiação (abaixo).

  - **Pais:** filho legítimo de Gonçalo Rodrigues (P-0088), do lugar de Frades, e Elebia
  Francisca (P-0089), moradores na villa de Ruivais, nomeados em PAR-0036 — modelados em
  2026-08-13 como família F-0043. [strong-evidence]

  - **Nascimento, batismo, óbito:** não localizados; residente e comungante casado de
  Ruivais. [OPEN]

  ## Família e rede social

  - **Pai de João Rodrigues Valle (P-0078)**, batizado em Ruivais em 1728 (PAR-0035) — o
  filho que emigrou para Minas Gerais. Por meio desse filho, estende a linha materna
  Toledo uma geração para o início do século XVIII em Portugal. [evidência forte para a
  ligação filial]

  - **Esposa:** Joanna Gonçalves (P-0081), do lugar da Quintã em Ruivais, filha de Domingos
  Gonçalves × Maria Fernandes conforme nomeados no assento de casamento de 1716 (PAR-0036).

  - **Um provável outro filho:** uma filha batizada em Ruivais por volta de junho de 1727 (livro
  paroquial 0005), documentando os mesmos pais; dado o casamento de 1716, é de esperar mais filhos
  entre 1717 e 1726. [LEAD — leitura de registro por agente, não verificada por primário neste
  repositório]

  ## O que podemos extrapolar

  - **A geração que uma genealogia publicada havia omitido** [INFERRED]. A genealogia do blog
  *imigracaoegenealogia* saltou direto do emigrante João Rodrigues Valle (n. 1728) para "Gonçalo
  Rodrigues (de Santos) × Estêbia/Elebia Francisca" — mas esses são os pais *deste* homem (os avós
  do emigrante), de modo que João-pai é a geração intermediária que faltava. Seu casamento de 1716
  é o que reconcilia o blog, que havia posicionado "Gonçalo × Elebia" uma geração abaixo demais.

  ## Questões em aberto

  - Seu próprio batismo (Ruivais, ~1690–1696, livro paroquial PVRM14/001/0003 ou 0004), seu óbito,
  e se o domicílio desaparece de Ruivais após a década de 1740 (o que corroboraria a emigração do
  filho), viriam dos registros de São Martinho de Ruivais (Arquivo Distrital de Braga). Seu
  conjunto completo de filhos (batismos de Ruivais, 1717–1728) também está em aberto. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais — seu casamento e seus pais) · PAR-0035
  (batismo de 1728 em Ruivais de seu filho João Rodrigues Valle, que o nomeia como pai).

  ## Contexto regional e migratório

  Comungante casado de São Martinho de Ruivais, nas terras altas do Minho do Arcebispado
  de Braga, noroeste de Portugal — a paróquia de origem deste ramo, de onde seu filho
  emigrou para Minas Gerais. Ele próprio não está documentado como tendo deixado Portugal.
  [CONTEXTUAL] Ele é a geração do Minho que não emigrou: o Minho era a região mais densamente
  povoada e mais fragmentada de Portugal — um minifúndio de pequenas posses, a ~96 habitantes/km²
  por volta de 1801, entre as maiores densidades rurais da Europa — cujos filhos excedentes e sem
  herança fizeram dele a maior fonte isolada de emigração portuguesa para o Brasil no século XVIII;
  a travessia de seu filho ocorreu sob o regime de passaportes da Provisão de 20 de março de 1720
  (D. João V). [CONTEXTUAL]
