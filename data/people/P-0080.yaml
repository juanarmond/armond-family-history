profile: >-
  ## Interesting facts

  - **[PROVEN]** He is named in three acts across two continents: his own 1716 Ruivais marriage (PAR-0036), his son's 1728 Ruivais baptism (PAR-0035), and the 1751 Borda do Campo marriage certidão of that emigrant son (PAR-0034) — a Portuguese father fixed in a Brazilian record because a clerk in Minas Gerais wrote his name down.

  - **[PROVEN]** Both he and his bride married as fatherless children: the 1716 act names his father "Gonçallo Roiz **já defunto**" and hers "Domingos Gonçalves **já defunto**". Two Ruivais households in which the estate had already passed to a widow and been divided among the children, joining at the altar.

  - **[CONTEXTUAL]** He married in 1716, a generation before the D. João V passport wave, and he himself did not emigrate — his son did. The driver was structural, not personal: the Minho's ~96 inhabitants/km² rural density left surplus non-inheriting sons with no holding to wait for.

  - **[INFERRED]** He is the generation a published genealogy had skipped. The *imigracaoegenealogia* blog jumped straight from the emigrant João Rodrigues Valle (b. 1728) to "Gonçalo × Elebia" — who are in fact *this* man's parents. His 1716 marriage act is what reconciles the tree and puts the missing generation back.

  - **[INFERRED]** His wife's family were of the *lugar da quinta* in Ruivais and his own father possibly of the *lugar de Frades* — named sub-localities within one small parish. A family identified by a lugar held a defined smallholding rather than being landless labourers; the holding was simply too small to divide among all the children.

  ## Identity

  **João Rodrigues** (named as father *Joam Rodrigues [Valle]* in his son's 1728 baptism; the "Valle" is the family's *lugar*-name in Ruivais). Of the Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese. Father of the emigrant João Rodrigues Valle (P-0078) and so 3rd-great-grandfather of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Marriage:** married Joanna Gonçalves (P-0081) on 13 May 1716 at Ruivais — [strong-evidence]: the Ruivais register (PAR-0036; E-0072; family F-0039) is primary, but identifying its spouses with our P-0080/P-0081 rests on the same name/parish/timeline match as the parentage below.

  - **Parents:** legitimate son of Gonçalo Rodrigues (P-0088), already deceased in 1716, and Elebia Francisca (P-0089), moradores na villa de Ruivais, named in PAR-0036 — modelled 2026-08-13 as family F-0043. [strong-evidence]

  - **Birth, baptism, death:** not located; a resident and married communicant of Ruivais. [OPEN]

  ## Standing and profession

  - **No occupation, rank or title is recorded for him** in any of the three acts that name him. He is "Joam Rodrigues", morador in the villa de Ruivais — the plainest possible entry. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** the 1716 marriage act closes with the witnesses "asignaram comigo", but the surviving rubrics are the celebrant's and the witnesses', not the groom's. Nothing decides it.

  - **What the record gives instead of standing is location:** a household identified by its *lugar* within a single mountain parish, which places the family among smallholders rather than labourers, and no higher. [INFERRED]

  ## Family and social network

  - **Wife:** Joanna Gonçalves (P-0081), of the lugar da quinta in Ruivais, daughter of Domingos Gonçalves (deceased) × Maria Fernandes, as named in the 1716 act (PAR-0036).

  - **Son:** João Rodrigues Valle (P-0078), baptised at Ruivais in 1728 (PAR-0035) — the son who emigrated to Minas Gerais and married Isabel Ribeiro at the Borda do Campo (Barbacena) matriz on 22 February 1751, whose certidão names "João Rodrigues" as the groom's father and, in the vigário's marginal correction, fixes the family's origin as "de Ruvans [Ruivais] do Arcebispado de Braga". Through that son he extends the maternal Toledo line one generation into early-18th-century Portugal. [strong-evidence for the child link]

  - **Wedding witnesses (1716):** Duarte Dias, Domingos Afonso and Gregorio do Rego Macedo, "e muitas mais testemunhas … todos desta dita freguezia" — an entirely local circle, with no officer, cleric or outsider among them. [PROVEN] The contrast with his son's 1751 Brazilian wedding, witnessed by a Coronel, is the measure of what the crossing changed.

  - **A probable further child:** a daughter baptised at Ruivais about June 1727 (parish book 0005), documenting the same parents; given the 1716 marriage, more children between 1717 and 1726 are to be expected. [LEAD — an agent register-read, not primary-verified in this repository]

  ## What we can extrapolate

  - **He is the man the system worked on, not the man who escaped it** [CONTEXTUAL / INFERRED]. The Minho was the most fragmented rural region in Portugal, and in its highland parishes a smallholding *casa* was in practice kept whole for one heir — the freely disposable third let a family concentrate the land on a single child — precisely so that the holding would not be subdivided into nothing. The arithmetic that keeps a casa intact is the same arithmetic that produces emigrants: the children who are not the heir must leave. He stayed and held the casa; his son crossed the Atlantic. Both outcomes are the same rule seen from opposite ends.

  - **Two dead fathers at one wedding is an inheritance datum, not a sad detail** [PROVEN / CONTEXTUAL]. In 1716 both he and his bride were already fatherless. Each household's land had therefore already been settled on widows and children before this marriage began — which means the couple started with whatever fractions two prior divisions had left them, and had nothing further to wait for. A family in that position marries within the parish, farms the lugar, and exports its surplus sons.

  - **His standing was fixed at birth and could not be improved in place** [INFERRED]. No office, no trade, no rank appears anywhere for him. In a Minho highland parish there was essentially nothing to acquire: no militia commission worth having, no commerce, no land coming onto the market. The only variable available to this family was *where* its children lived — which is why the branch's entire rise happens overseas and none of it happens to him.

  - **Education was not on offer and would not have paid** [CONTEXTUAL]. Rural Portugal had no public schooling in 1716; letters were a purchased, class-linked good bought by families who needed them for office or commerce. This household needed neither. That his grandchildren's descendants in Brazil eventually acquired literacy through militia rank shows how the competence had to be bought fresh, in a different country, for a different purpose.

  - **The arc departs from him, and he never saw it** [INFERRED]. A generation after his wedding, his son married in Minas Gerais with the district's Coronel as witness; two generations after, his granddaughter married a Capitão's son. Nothing in his own life predicts that. The turning point is not anything he did; it is the crossing his son made, which converted a non-inheriting son into a founder.

  ## Open questions

  - His own baptism (Ruivais, c.1690–1696, parish book PVRM14/001/0003 or 0004), his death, and whether the household disappears from Ruivais after the 1740s — which would corroborate his son's emigration — would come from the São Martinho de Ruivais registers (Arquivo Distrital de Braga). His full child set (Ruivais baptisms 1717–1728) is likewise open. [OPEN]

  - Any record of what the family held: a will, a foral entry, a tombo. None is in hand, so the "smallholder" reading rests on the lugar-names alone. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage — his marriage, his parents and the witnesses) · PAR-0035 (1728 Ruivais baptism of his son João Rodrigues Valle, naming him as father) · PAR-0034 (1751 Borda do Campo / Barbacena marriage certidão of that emigrant son, naming "João Rodrigues" as the groom's father and fixing the family's origin as Ruivais, Arcebispado de Braga).

  ## Regional and migration context

  A married communicant of São Martinho de Ruivais in the Minho highlands of the Arcebispado de Braga, north-west Portugal — the origin parish of this branch, from which his son emigrated to Minas Gerais. He himself is not documented as leaving Portugal. [CONTEXTUAL] He is the non-emigrating Minho generation: the Minho was Portugal's most densely populated and most fragmented region — a smallholding minifúndio at ~96 inhabitants/km² by 1801, among Europe's highest rural densities — whose surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese emigration to Brazil; his son's crossing fell under the Provisão de 20 de março de 1720 (D. João V) passport regime. [CONTEXTUAL]

  ## Where to go today

  - **Marriage (13 May 1716) and his son João's baptism (1728):** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga PT [DOCUMENTED-addr / RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é nomeado em três atos, em dois continentes: seu próprio casamento em Ruivais, em 1716 (PAR-0036), o batismo de seu filho em Ruivais, em 1728 (PAR-0035), e a certidão de casamento desse filho emigrante na Borda do Campo, em 1751 (PAR-0034) — um pai português fixado num registro brasileiro porque um escrivão em Minas Gerais escreveu seu nome.

  - **[PROVEN]** Tanto ele quanto a noiva casaram-se órfãos de pai: o ato de 1716 nomeia o pai dele "Gonçallo Roiz **já defunto**" e o dela "Domingos Gonçalves **já defunto**". Duas casas de Ruivais em que o patrimônio já havia passado a uma viúva e sido dividido entre os filhos, unindo-se no altar.

  - **[CONTEXTUAL]** Casou-se em 1716, uma geração antes da onda de passaportes de D. João V, e ele próprio não emigrou — o filho, sim. O motor era estrutural, não pessoal: a densidade rural minhota de ~96 habitantes/km² deixava os filhos excedentes não herdeiros sem posse a esperar.

  - **[INFERRED]** Ele é a geração que uma genealogia publicada havia pulado. O blog *imigracaoegenealogia* saltou do emigrante João Rodrigues Valle (n. 1728) direto para "Gonçalo × Elebia" — que são, na verdade, os pais *deste* homem. Seu ato de casamento de 1716 é o que reconcilia a árvore e recoloca a geração que faltava.

  - **[INFERRED]** A família da esposa era do *lugar da quinta*, em Ruivais, e seu próprio pai possivelmente do *lugar de Frades* — sub-localidades nomeadas dentro de uma só freguesia pequena. Uma família identificada por um lugar detinha uma pequena propriedade definida, em vez de ser de jornaleiros sem terra; a posse é que era pequena demais para se dividir entre todos os filhos.

  ## Identidade

  **João Rodrigues** (nomeado como pai *Joam Rodrigues [Valle]* no batismo de seu filho em 1728; o "Valle" é o nome do *lugar* da família em Ruivais). Da Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Português. Pai do emigrante João Rodrigues Valle (P-0078) e, portanto, tetravô de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Casamento:** casou-se com Joanna Gonçalves (P-0081) em 13 de maio de 1716 em Ruivais — [evidência forte]: o registro de Ruivais (PAR-0036; E-0072; família F-0039) é primário, mas identificar seus cônjuges com os nossos P-0080/P-0081 apoia-se na mesma correspondência de nome, freguesia e cronologia da filiação abaixo.

  - **Pais:** filho legítimo de Gonçalo Rodrigues (P-0088), já falecido em 1716, e de Elebia Francisca (P-0089), moradores na villa de Ruivais, nomeados em PAR-0036 — modelados em 2026-08-13 como família F-0043. [evidência forte]

  - **Nascimento, batismo, óbito:** não localizados; morador e comungante casado de Ruivais. [OPEN]

  ## Posição social e profissão

  - **Nenhuma ocupação, patente ou título lhe é registrado** em nenhum dos três atos que o nomeiam. É "Joam Rodrigues", morador na villa de Ruivais — a entrada mais simples possível. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** o ato de casamento de 1716 se encerra com as testemunhas que "asignaram comigo", mas as rubricas sobreviventes são as do celebrante e das testemunhas, não a do noivo. Nada decide a questão.

  - **O que o registro dá, em lugar de posição social, é localização:** uma casa identificada por seu *lugar* dentro de uma única freguesia serrana, o que situa a família entre pequenos proprietários, e não entre jornaleiros, e não mais alto que isso. [INFERRED]

  ## Família e rede social

  - **Esposa:** Joanna Gonçalves (P-0081), do lugar da quinta em Ruivais, filha de Domingos Gonçalves (falecido) × Maria Fernandes, conforme nomeados no ato de 1716 (PAR-0036).

  - **Filho:** João Rodrigues Valle (P-0078), batizado em Ruivais em 1728 (PAR-0035) — o filho que emigrou para Minas Gerais e se casou com Isabel Ribeiro na matriz da Borda do Campo (Barbacena) em 22 de fevereiro de 1751, cuja certidão nomeia "João Rodrigues" como pai do noivo e, na correção marginal do vigário, fixa a origem da família como "de Ruvans [Ruivais] do Arcebispado de Braga". Por esse filho, ele estende a linha materna Toledo uma geração para dentro do Portugal do início do século XVIII. [evidência forte quanto ao vínculo filial]

  - **Testemunhas do casamento (1716):** Duarte Dias, Domingos Afonso e Gregorio do Rego Macedo, "e muitas mais testemunhas … todos desta dita freguezia" — um círculo inteiramente local, sem nenhum oficial, clérigo ou forasteiro. [PROVEN] O contraste com o casamento brasileiro de seu filho em 1751, testemunhado por um Coronel, é a medida do que a travessia mudou.

  - **Um provável outro filho:** uma filha batizada em Ruivais por volta de junho de 1727 (livro paroquial 0005), documentando os mesmos pais; dado o casamento de 1716, esperam-se mais filhos entre 1717 e 1726. [LEAD — leitura de registro feita pelo agente, não verificada por fonte primária neste repositório]

  ## O que podemos extrapolar

  - **Ele é o homem sobre quem o sistema operou, não o que dele escapou** [CONTEXTUAL / INFERRED]. O Minho era a região rural mais fragmentada de Portugal e, em suas freguesias serranas, a *casa* de pequena propriedade era, na prática, mantida inteira para um único herdeiro — o terço de livre disposição permitia concentrar a terra num só filho — justamente para que a posse não fosse subdividida até o nada. A aritmética que mantém uma casa íntegra é a mesma que produz emigrantes: os filhos que não são o herdeiro têm de partir. Ele ficou e segurou a casa; o filho atravessou o Atlântico. Os dois desfechos são a mesma regra vista de pontas opostas.

  - **Dois pais mortos num só casamento é dado de herança, não detalhe triste** [PROVEN / CONTEXTUAL]. Em 1716 tanto ele quanto a noiva já eram órfãos de pai. A terra de cada casa, portanto, já havia sido acertada com viúvas e filhos antes que este casamento começasse — o que significa que o casal partiu das frações deixadas por duas divisões anteriores e nada mais tinha a esperar. Uma família nessa posição casa dentro da freguesia, lavra o lugar e exporta os filhos excedentes.

  - **Sua posição social ficou fixada no nascimento e não podia ser melhorada onde ele estava** [INFERRED]. Nenhum ofício, ocupação ou patente aparece para ele em lugar algum. Numa freguesia serrana do Minho não havia essencialmente nada a adquirir: nenhuma provisão miliciana que valesse, nenhum comércio, nenhuma terra chegando ao mercado. A única variável disponível a esta família era *onde* seus filhos viveriam — razão pela qual toda a ascensão do ramo acontece do outro lado do oceano e nada dela acontece com ele.

  - **A educação não era oferecida e não compensaria** [CONTEXTUAL]. O Portugal rural não tinha escolarização pública em 1716; as letras eram bem comprado e ligado à classe, adquirido por famílias que delas precisavam para ofício ou comércio. Esta casa não precisava de nenhum dos dois. Que os descendentes de seus netos, no Brasil, tenham acabado por adquirir alfabetização via patente miliciana mostra como a competência teve de ser comprada de novo, em outro país e para outro fim.

  - **O arco parte dele, e ele nunca o viu** [INFERRED]. Uma geração depois de seu casamento, seu filho casou-se em Minas Gerais com o Coronel do distrito por testemunha; duas gerações depois, sua neta casou-se com o filho de um Capitão. Nada em sua própria vida prevê isso. O ponto de virada não é algo que ele tenha feito; é a travessia do filho, que converteu um filho não herdeiro em fundador.

  ## Questões em aberto

  - Seu próprio batismo (Ruivais, c.1690–1696, livro paroquial PVRM14/001/0003 ou 0004), seu óbito e se a casa desaparece de Ruivais depois dos anos 1740 — o que corroboraria a emigração do filho — viriam dos registros de São Martinho de Ruivais (Arquivo Distrital de Braga). Seu conjunto completo de filhos (batismos de Ruivais, 1717–1728) também está em aberto. [OPEN]

  - Qualquer registro do que a família possuía: testamento, entrada de foral, tombo. Nada há em mãos, de modo que a leitura de "pequeno proprietário" se apoia apenas nos nomes de lugar. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento em Ruivais, 1716 — seu casamento, seus pais e as testemunhas) · PAR-0035 (batismo em Ruivais, 1728, de seu filho João Rodrigues Valle, nomeando-o pai) · PAR-0034 (certidão de casamento na Borda do Campo / Barbacena, 1751, desse filho emigrante, nomeando "João Rodrigues" como pai do noivo e fixando a origem da família em Ruivais, Arcebispado de Braga).

  ## Contexto regional e migratório

  Morador e comungante casado de São Martinho de Ruivais, nas terras altas do Minho, no Arcebispado de Braga, noroeste de Portugal — a paróquia de origem deste ramo, de onde seu filho emigrou para Minas Gerais. Ele próprio não está documentado como tendo deixado Portugal. [CONTEXTUAL] É a geração minhota não emigrante: o Minho era a região mais densamente povoada e mais fragmentada de Portugal — minifúndio de pequenas propriedades a ~96 habitantes/km² em 1801, entre as maiores densidades rurais da Europa —, cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada da emigração portuguesa setecentista para o Brasil; a travessia de seu filho caiu sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V). [CONTEXTUAL]

  ## Onde ir hoje

