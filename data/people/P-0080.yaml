profile: >-
  ## Identity

  **João Rodrigues** (named as father *Joam Rodrigues [Valle]* in his son's 1728
  baptism; the "Valle" is the family's *lugar*-name in Ruivais). Of the Freguesia de São
  Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese.

  - **Marriage:** married Joanna Gonçalves (P-0081) on 13 May 1716 at Ruivais — [PROVEN]
  from the original Ruivais marriage register (PAR-0036; E-0072; family F-0039).

  - **Parents:** legitimate son of Gonçalo Rodrigues (already deceased in 1716) and
  Elebia Francisca — named in PAR-0036 but recorded only as a lead, not modelled. [LEAD]

  - **Birth, baptism, death:** not located; a resident and married communicant of
  Ruivais. [OPEN]

  ## Family and social network

  - **Father of João Rodrigues Valle (P-0078)**, baptised at Ruivais in 1728 (PAR-0035)
  — the son who emigrated to Minas Gerais. Through that son he extends the maternal
  Toledo line one generation into early-18th-century Portugal. [strong-evidence for the
  child link]

  ## Open questions

  - His own baptism and death, and the further identity of his parents (Gonçalo Rodrigues
  † × Elebia Francisca), would come from the São Martinho de Ruivais registers (Arquivo
  Distrital de Braga). [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage — his marriage and his parents) · PAR-0035 (1728
  Ruivais baptism of his son João Rodrigues Valle, naming him as father).

  ## Regional and migration context

  A married communicant of São Martinho de Ruivais in the Minho highlands of the
  Arcebispado de Braga, north-west Portugal — the origin parish of this branch, from
  which his son emigrated to Minas Gerais. He himself is not documented as leaving
  Portugal. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **João Rodrigues** (nomeado como pai *Joam Rodrigues [Valle]* no batismo de 1728 de seu
  filho; o "Valle" é o nome do *lugar* da família em Ruivais). Da Freguesia de São
  Martinho de Ruivais, Arcebispado de Braga, Portugal. Português.

  - **Casamento:** casou-se com Joanna Gonçalves (P-0081) em 13 de maio de 1716 em
  Ruivais — [PROVEN] pelo registro original de casamento de Ruivais (PAR-0036; E-0072;
  família F-0039).

  - **Pais:** filho legítimo de Gonçalo Rodrigues (já falecido em 1716) e Elebia
  Francisca — nomeados em PAR-0036, mas registrados apenas como pista, não modelados.
  [LEAD]

  - **Nascimento, batismo, óbito:** não localizados; residente e comungante casado de
  Ruivais. [OPEN]

  ## Família e rede social

  - **Pai de João Rodrigues Valle (P-0078)**, batizado em Ruivais em 1728 (PAR-0035) — o
  filho que emigrou para Minas Gerais. Por meio desse filho, estende a linha materna
  Toledo uma geração para o início do século XVIII em Portugal. [evidência forte para a
  ligação filial]

  ## Questões em aberto

  - Seu próprio batismo e óbito, e a identidade adicional de seus pais (Gonçalo Rodrigues
  † × Elebia Francisca), viriam dos registros de São Martinho de Ruivais (Arquivo
  Distrital de Braga). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais — seu casamento e seus pais) · PAR-0035
  (batismo de 1728 em Ruivais de seu filho João Rodrigues Valle, que o nomeia como pai).

  ## Contexto regional e migratório

  Comungante casado de São Martinho de Ruivais, nas terras altas do Minho do Arcebispado
  de Braga, noroeste de Portugal — a paróquia de origem deste ramo, de onde seu filho
  emigrou para Minas Gerais. Ele próprio não está documentado como tendo deixado Portugal.
  [CONTEXTUAL]
