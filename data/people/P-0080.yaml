notes:
- text: >-
    Of the Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
    Married Joanna Gonçalves (P-0081) on 13 May 1716 at Ruivais, family F-0039
    (PAR-0036); legitimate son of Gonçalo Rodrigues (already deceased in 1716) and
    Elebia Francisca (named in PAR-0036; recorded as a lead, not modelled). Father
    of João Rodrigues Valle (P-0078), baptized at Ruivais in 1728 (PAR-0035).
  text_pt: >-
    Da Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
    Casou-se com Joanna Gonçalves (P-0081) em 13 de maio de 1716 em Ruivais,
    família F-0039 (PAR-0036); filho legítimo de Gonçalo Rodrigues (já falecido em
    1716) e Elebia Francisca (nomeados em PAR-0036; registrados como pista, não
    modelados). Pai de João Rodrigues Valle (P-0078), batizado em Ruivais em 1728
    (PAR-0035).
- text: >-
    Nationality Portuguese: a resident and married communicant of São Martinho de
    Ruivais, Braga (PAR-0036). No birth, baptism or death record located.
  text_pt: >-
    Nacionalidade portuguesa: residente e comungante casado de São Martinho de
    Ruivais, Braga (PAR-0036). Nenhum registro de nascimento, batismo ou óbito
    localizado.
