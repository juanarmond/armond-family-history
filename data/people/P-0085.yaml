profile: >-
  ## Identity

  **Maria Eugenia** — mother of Maria Jacintha de Medeiros (P-0049), wife of João de Medeiros
  Brandão (P-0084), family F-0041. No independent surname was captured on the record. [PROVEN as named]

  - **Attestation:** named as the bride's mother in her daughter's 1819 Mãe de Deus marriage
  (PAR-0037), and again — with her husband, as maternal grandparents — in her grandson
  Agostinho's 1843 baptism (PAR-0044). [PROVEN as named]

  - **The Jacintha-vs-Eugenia key:** her given name is the source of the "Eugenia" that a scribe
  later mis-applied to her own daughter — Maria Jacintha appears as "Maria Jacintha de Medeiros"
  in most acts but as "Maria Eugenia de Medeiros" in the 1841/1842 marriage record. Because the
  1819 act documents that Maria Jacintha's mother was Maria Eugenia, the later outlier is
  explained as a scribal conflation with the grandmother's name — the two "Marias" are one woman
  (see F-0023 / PAR-0024). [PROVEN]

  - **Origin:** São Miguel (Açores); Portuguese (Açorean). Her own records are not held.
  [INFERRED / OPEN]

  ## What we can extrapolate

  *Proportionate to an ancestress named by given names only, and only as a parent.*

  - **The female half of a Mãe de Deus land-holding-peasant household [INFERRED / CONTEXTUAL].**
  Recorded only through husband and daughter, with no surname or standing of her own captured,
  Maria Eugenia sits in the same closed, endogamous small-proprietor parish world as the rest of
  the line (see P-0042) — a woman defined by her marriage, transmitting parish belonging rather
  than land or a heritable surname-status.

  - **Her name outlived her by accident [INFERRED].** That a scribe two decades later wrote *her*
  name onto her own daughter's marriage record is a small window into how these registers were
  kept — from memory and family knowledge, with grandmothers' and mothers' names easily
  conflated. It is the reason "Maria Eugenia" survives in the record at all, and the reason the
  Jacintha / Eugenia identity can now be proven.

  ## Open questions

  - Her marriage to João de Medeiros Brandão is a bounded negative across the 1801–1822 Mãe de
  Deus marriage book (196 pages read; she appears only as a parent) → the marriage is pre-1801.
  Off-tool (BPARPD, Ponta Delgada); this marriage act would capture her missing surname and her
  parentage. [OPEN]

  - Her baptism, death and parents lie in the same pre-1801 books; off-tool. [OPEN]

  - **Namesake caution:** her daughter Maria Jacintha de Medeiros (P-0049) shares her name with
  an unrelated Maria Jacintha de Medeiros (daughter of Manoel Muniz × Tereza do Amaral, PAR-0048);
  the registers reuse a small stock of names, so treat every "Maria … de Medeiros" with care. [note]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of her daughter Maria Jacintha — names her as the bride's mother) ·
  PAR-0044 (1843 baptism of her grandson Agostinho — names her and João de Medeiros Brandão as
  maternal grandparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores) — a São Miguel root of the Muniz
  maternal line, with no move documented. [INFERRED] The emigration is her great-grandsons'
  generation (about 1866–1870), driven by the island's *morgadio* land-lock, overpopulation and
  the 1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil pull ran through the
  Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras (nº 601/1850),
  while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863 abolished the
  Portuguese *morgadios*. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Maria Eugenia** — mãe de Maria Jacintha de Medeiros (P-0049), esposa de João de Medeiros
  Brandão (P-0084), família F-0041. Nenhum sobrenome próprio foi captado no registro. [PROVEN
  quanto ao nome]

  - **Atestação:** nomeada como mãe da noiva no casamento de 1819 de sua filha em Mãe de Deus
  (PAR-0037), e novamente — com seu marido, como avós maternos — no batismo de 1843 de seu neto
  Agostinho (PAR-0044). [PROVEN quanto ao nome]

  - **A chave Jacintha-vs-Eugenia:** seu prenome é a origem da "Eugenia" que um escrivão depois
  aplicou erroneamente à própria filha — Maria Jacintha aparece como "Maria Jacintha de Medeiros"
  na maioria dos atos, mas como "Maria Eugenia de Medeiros" no ato de casamento de 1841/1842.
  Porque o ato de 1819 documenta que a mãe de Maria Jacintha era Maria Eugenia, o desvio posterior
  é explicado como uma confusão de escrivão com o nome da avó — as duas "Marias" são uma só mulher
  (ver F-0023 / PAR-0024). [PROVEN]

  - **Origem:** São Miguel (Açores); portuguesa (açoriana). Seus próprios registros não são
  obtidos. [INFERRED / OPEN]

  ## O que podemos extrapolar

  *Proporcional a uma ancestral nomeada apenas pelos prenomes, e apenas como progenitora.*

  - **A metade feminina de um domicílio camponês-proprietário de Mãe de Deus [INFERRED /
  CONTEXTUAL].** Registrada apenas por meio do marido e da filha, sem sobrenome ou posição
  próprios captados, Maria Eugenia situa-se no mesmo mundo de freguesia fechado e endogâmico de
  pequenos proprietários do restante da linha (ver P-0042) — uma mulher definida pelo casamento,
  transmitindo pertencimento de freguesia em vez de terra ou status de sobrenome herdável.

  - **Seu nome a sobreviveu por acaso [INFERRED].** Que um escrivão, duas décadas depois, tenha
  escrito *o nome dela* no registro de casamento de sua própria filha é uma pequena janela para
  como esses registros eram mantidos — de memória e de conhecimento familiar, com nomes de avós e
  mães facilmente confundidos. É a razão de "Maria Eugenia" sobreviver no registro e a razão pela
  qual a identidade Jacintha / Eugenia pode agora ser provada.

  ## Questões em aberto

  - Seu casamento com João de Medeiros Brandão é um negativo delimitado em todo o livro de
  casamentos de Mãe de Deus de 1801–1822 (196 páginas lidas; ela aparece apenas como progenitora)
  → o casamento é anterior a 1801. Fora de alcance (BPARPD, Ponta Delgada); este ato de casamento
  captaria seu sobrenome ausente e sua filiação. [OPEN]

  - Seu batismo, óbito e pais estão nos mesmos livros anteriores a 1801; fora de alcance. [OPEN]

  - **Cautela de homonímia:** sua filha Maria Jacintha de Medeiros (P-0049) compartilha o nome com
  uma Maria Jacintha de Medeiros sem parentesco (filha de Manoel Muniz × Tereza do Amaral,
  PAR-0048); os registros reutilizam um pequeno repertório de nomes, portanto trate cada "Maria …
  de Medeiros" com cuidado. [nota]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de sua filha Maria Jacintha — a nomeia como mãe da noiva) ·
  PAR-0044 (batismo de 1843 de seu neto Agostinho — a nomeia, e a João de Medeiros Brandão, como
  avós maternos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores) — uma raiz em São Miguel da linha
  materna Muniz, sem mudança documentada. [INFERRED] A emigração é da geração de seus bisnetos
  (por volta de 1866–1870), impulsionada pelo bloqueio fundiário do *morgadio* da ilha, pela
  superpopulação e pelo colapso, na década de 1860, da economia de exportação da laranja.
  [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850 (Eusébio de
  Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel afrouxou quando a
  Carta de Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses. [CONTEXTUAL]
