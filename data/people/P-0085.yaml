profile: >-
  ## Interesting facts

  - **[PROVEN]** Her given name outlived her through a scribal accident: a clerk recording her daughter Maria Jacintha's 1841/1842 marriage wrote "Maria Eugenia de Medeiros" — the grandmother's name — instead of "Maria Jacintha," an error explained by the 1819 act (PAR-0037) that names her as the mother; it is the reason the Jacintha/Eugenia identity can be proven today.

  - **[CONTEXTUAL]** Recorded only by given name — no surname captured in any held document — she exemplifies the asymmetry in Azorean registers where women of the small-proprietor class survive only as named mothers in their children's acts, with no independent documentary footprint.

  - **[INFERRED]** The absence of her surname in the records is not evidence of low status: the 4th-degree consanguinity dispensation obtained for her daughter's 1842 marriage proves that the Medeiros-Brandão household was kinship-connected to the Muniz proprietors — both households were at the same small-proprietor rung of São Miguel society.

  - **[INFERRED]** Her name's accidental preservation in her daughter's marriage record is a small window into how these Azorean registers were compiled — from family memory, orally supplied, with grandmothers' names easily conflated with daughters' by clerks recording a generation later.

  ## Identity

  **Maria Eugenia** — mother of Maria Jacintha de Medeiros (P-0049), wife of João de Medeiros
  Brandão (P-0084), family F-0041. No independent surname was captured on the record. [PROVEN as named]

  - **Attestation:** named as the bride's mother in her daughter's 1819 Mãe de Deus marriage
  (PAR-0037), and again — with her husband, as maternal grandparents — in her grandson
  Agostinho's 1843 baptism (PAR-0044). [PROVEN as named]

  - **The Jacintha-vs-Eugenia key:** her given name is the source of the "Eugenia" that a scribe
  later mis-applied to her own daughter — Maria Jacintha appears as "Maria Jacintha de Medeiros"
  in most acts but as "Maria Eugenia de Medeiros" in the 1841/1842 marriage record. Because the
  1819 act documents that Maria Jacintha's mother was Maria Eugenia, the later outlier is
  explained as a scribal conflation with the grandmother's name — the two "Marias" are one woman
  (see F-0023 / PAR-0024). [PROVEN]

  - **Origin:** São Miguel (Açores); Portuguese (Açorean). Her own records are not held.
  [INFERRED / OPEN]

  ## Standing and profession

  - **Nothing documented** [PROVEN absence]. She is named by given names only, and only as a
  parent and grandparent (PAR-0037, PAR-0044). No occupation, property, standing or
  honorific is recorded for her in any held act, and no surname either. The field is left
  unset deliberately.

  ## Family and social network

  Wife of **João de Medeiros Brandão** (P-0084) and mother of **Maria Jacintha de Medeiros**
  (P-0049), through whom the line runs to the emigrant João Muniz Bittencourt (P-0019).
  [PROVEN] Both parents are named in their daughter's 1819 marriage act at Nossa Senhora Mãe
  de Deus (PAR-0037) and again as the maternal grandparents in their grandson Agostinho's
  1843 baptism, which uniquely records both grandparent couples (PAR-0044).

  Her surname is nowhere recorded — she is "Maria Eugenia" in both acts. The name then
  migrated: the 1842 marriage of her grandson Manoel writes his mother as "Maria Euginia
  [Eugenia] de Medeiros" (PAR-0024), attaching this grandmother's given name to her
  daughter. [PROVEN] That substitution is how the identity of the two women was eventually
  distinguished.

  ## What we can extrapolate

  *Proportionate to an ancestress named by given names only, and only as a parent.*

  **1. A woman with no recorded surname is the clearest measure of how little these women
  carried [PROVEN / INFERRED].** In a parish where the men bear compound surnames — Muniz
  Bitancourt, de Medeiros Brandão, Botelho de Bulhões — she is written simply "Maria
  Eugenia", in both acts that name her (PAR-0037, PAR-0044). **[INFERRED]** That is not a
  gap in the transcription; it is what the clerk wrote. A surname was heritable social
  capital for families with something to signal, and hers had nothing to attach to her.

  **2. Her name survived by an accident of scribal memory [PROVEN / INFERRED].** In 1842 the
  clerk drawing up her grandson Manoel's marriage act wrote the groom's mother as "Maria
  Euginia [Eugenia] de Medeiros" — putting *her* given name where her daughter Maria
  Jacintha's belonged (PAR-0024). **[INFERRED]** These registers were filled from what the
  family said in the room, and grandmothers' and mothers' names were easily conflated. The
  slip is the reason "Maria Eugenia" is recoverable at all, and the reason the Jacintha /
  Eugenia identity could eventually be separated rather than merged.

  **3. She sits in the same closed parish world as the rest of the line [PROVEN /
  CONTEXTUAL].** Her husband João de Medeiros Brandão carries the two surnames that saturate
  the Mãe de Deus registers, and an Antonio de Medeiros Brandão witnessed both her
  daughter's 1819 marriage and a Muniz baptism in 1833 — signing the latter with a cross
  (PAR-0037, PAR-0039). **[CONTEXTUAL]** A handful of surnames, recurring as witnesses,
  godparents and spouses, is the demographic signature of an endogamous smallholder parish,
  and it is the same closure that produced the fourth-degree dispensation her
  great-grandson's parents needed in 1842 (PAR-0024).

  **4. What she transmitted was belonging [INFERRED].** No land, no name, no office — a
  woman defined by her marriage, passing on membership in a rooted home parish.
  **[INFERRED]** That was worth something on São Miguel and worth nothing in Brazil, which
  is the whole economics of this family's emigration in one line.

  ## Open questions

  - Her marriage to João de Medeiros Brandão is a bounded negative across the 1801–1822 Mãe de
  Deus marriage book (196 pages read; she appears only as a parent) → the marriage is pre-1801.
  Off-tool (BPARPD, Ponta Delgada); this marriage act would capture her missing surname and her
  parentage. [OPEN]

  - Her baptism, death and parents lie in the same pre-1801 books; off-tool. [OPEN]

  - **Namesake caution:** her daughter Maria Jacintha de Medeiros (P-0049) shares her name with
  an unrelated Maria Jacintha de Medeiros (daughter of Manoel Muniz × Tereza do Amaral, PAR-0048);
  the registers reuse a small stock of names, so treat every "Maria … de Medeiros" with care. [note]

  ## Sources held (this repository)

  - PAR-0037 (1819 marriage of her daughter Maria Jacintha — names her as the bride's mother) ·
  PAR-0044 (1843 baptism of her grandson Agostinho — names her and João de Medeiros Brandão as
  maternal grandparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores) — a São Miguel root of the Muniz
  maternal line, with no move documented. [INFERRED] The emigration is her great-grandsons'
  generation (between 1866 and 1882 (most plausibly near 1880; see P-0019)), driven by the
  island's *morgadio* land-lock, overpopulation and the 1860s collapse of the orange-export
  economy. [CONTEXTUAL] The Brazil pull ran through the Lei nº 581 de 4 de setembro de 1850
  (Eusébio de Queirós) and the Lei de Terras (nº 601/1850), while the São Miguel push eased
  as the Carta de Lei de 19 de maio de 1863 abolished the Portuguese *morgadios*.
  [CONTEXTUAL]

  ## Where to go today

  - **Family parish (her grandchildren's baptisms):** Igreja Matriz de N.S. da Mãe de Deus, Vila da Povoação, São Miguel, Açores, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu prenome sobreviveu a ela por um acidente de escrivão: um escrivão que registrava o casamento de 1841/1842 de sua filha Maria Jacintha escreveu "Maria Eugenia de Medeiros" — o nome da avó — em vez de "Maria Jacintha"; o erro é explicado pelo ato de 1819 (PAR-0037), que a nomeia como mãe, e é a razão pela qual a identidade Jacintha/Eugenia pode ser provada hoje.

  - **[CONTEXTUAL]** Registrada apenas pelo prenome — nenhum sobrenome captado em nenhum documento em mãos — ela exemplifica a assimetria nos registros açorianos, em que as mulheres da classe de pequenos proprietários sobrevivem apenas como mães nomeadas nos atos de seus filhos, sem rastro documental próprio.

  - **[INFERRED]** A ausência de seu sobrenome nos registros não é evidência de baixo status: a dispensa de consanguinidade de 4º grau obtida para o casamento de sua filha em 1842 prova que o domicílio Medeiros-Brandão era consanguíneo dos proprietários Muniz — ambos no mesmo degrau de pequenos proprietários da sociedade de São Miguel.

  - **[INFERRED]** A preservação acidental de seu nome no registro de casamento da filha é uma pequena janela para como esses registros açorianos eram elaborados — a partir da memória familiar, fornecida oralmente, com os nomes das avós facilmente confundidos com os das filhas por escrivãos que registravam uma geração depois.

  ## Identidade

  **Maria Eugenia** — mãe de Maria Jacintha de Medeiros (P-0049), esposa de João de Medeiros
  Brandão (P-0084), família F-0041. Nenhum sobrenome próprio foi captado no registro. [PROVEN
  quanto ao nome]

  - **Atestação:** nomeada como mãe da noiva no casamento de 1819 de sua filha em Mãe de Deus
  (PAR-0037), e novamente — com seu marido, como avós maternos — no batismo de 1843 de seu neto
  Agostinho (PAR-0044). [PROVEN quanto ao nome]

  - **A chave Jacintha-vs-Eugenia:** seu prenome é a origem da "Eugenia" que um escrivão depois
  aplicou erroneamente à própria filha — Maria Jacintha aparece como "Maria Jacintha de Medeiros"
  na maioria dos atos, mas como "Maria Eugenia de Medeiros" no ato de casamento de 1841/1842.
  Porque o ato de 1819 documenta que a mãe de Maria Jacintha era Maria Eugenia, o desvio posterior
  é explicado como uma confusão de escrivão com o nome da avó — as duas "Marias" são uma só mulher
  (ver F-0023 / PAR-0024). [PROVEN]

  - **Origem:** São Miguel (Açores); portuguesa (açoriana). Seus próprios registros não são
  obtidos. [INFERRED / OPEN]

  ## Posição social e profissão

  - **Nada documentado** [PROVEN na ausência]. É nomeada apenas por prenomes, e apenas como
  mãe e avó (PAR-0037, PAR-0044). Nenhuma ocupação, bem, posição ou tratamento honorífico
  lhe é registrado em qualquer ato que tenhamos, e tampouco um sobrenome. O campo fica
  deliberadamente sem preencher.

  ## Família e rede social

  Mulher de **João de Medeiros Brandão** (P-0084) e mãe de **Maria Jacintha de Medeiros**
  (P-0049), por quem a linhagem chega ao emigrante João Muniz Bittencourt (P-0019). [PROVEN]
  Ambos os pais são nomeados no ato de casamento de 1819 da filha, em Nossa Senhora Mãe de
  Deus (PAR-0037), e outra vez como avós maternos no batismo de 1843 do neto Agostinho, que
  de modo único registra os dois casais de avós (PAR-0044).

  Seu sobrenome não é registrado em lugar algum — é "Maria Eugenia" nos dois atos. O nome
  então migrou: o casamento de 1842 de seu neto Manoel escreve a mãe dele como "Maria
  Euginia [Eugenia] de Medeiros" (PAR-0024), atribuindo o prenome desta avó à filha.
  [PROVEN] Foi essa substituição que acabou permitindo distinguir a identidade das duas
  mulheres.

  ## O que podemos extrapolar

  *Proporcional a uma ancestral nomeada apenas por prenomes, e apenas como mãe.*

  **1. Uma mulher sem sobrenome registrado é a medida mais clara do pouco que estas mulheres
  carregavam [PROVEN / INFERRED].** Numa freguesia em que os homens levam sobrenomes
  compostos — Muniz Bitancourt, de Medeiros Brandão, Botelho de Bulhões —, ela é escrita
  simplesmente "Maria Eugenia", nos dois atos que a nomeiam (PAR-0037, PAR-0044).
  **[INFERRED]** Não é lacuna de transcrição; é o que o escrivão escreveu. Sobrenome era
  capital social herdável para famílias com algo a sinalizar, e a dela nada tinha a lhe
  atribuir.

  **2. Seu nome sobreviveu por acidente da memória do escrivão [PROVEN / INFERRED].** Em
  1842, o escrivão que lavrava o ato de casamento de seu neto Manoel escreveu a mãe do noivo
  como "Maria Euginia [Eugenia] de Medeiros" — pondo o prenome *dela* onde cabia o da filha,
  Maria Jacintha (PAR-0024). **[INFERRED]** Esses registros eram preenchidos com o que a
  família dizia ali, e nomes de avós e de mães confundiam-se com facilidade. O deslize é a
  razão de "Maria Eugenia" ser recuperável, e a razão de a identidade Jacintha / Eugenia
  poder afinal ser separada em vez de fundida.

  **3. Ela ocupa o mesmo mundo paroquial fechado que o resto da linhagem [PROVEN /
  CONTEXTUAL].** Seu marido, João de Medeiros Brandão, leva os dois sobrenomes que saturam
  os registros de Mãe de Deus, e um Antonio de Medeiros Brandão testemunhou tanto o
  casamento de 1819 da filha dela quanto um batismo Muniz em 1833 — assinando este último de
  cruz (PAR-0037, PAR-0039). **[CONTEXTUAL]** Um punhado de sobrenomes, recorrendo como
  testemunhas, padrinhos e cônjuges, é a assinatura demográfica de uma freguesia endogâmica
  de pequenos proprietários, e é o mesmo fechamento que produziu a dispensa de quarto grau
  de que os pais de seu bisneto precisaram em 1842 (PAR-0024).

  **4. O que ela transmitiu foi pertencimento [INFERRED].** Nenhuma terra, nenhum nome,
  nenhum cargo — uma mulher definida pelo casamento, passando adiante o pertencimento a uma
  freguesia de origem enraizada. **[INFERRED]** Isso valia algo em São Miguel e não valia
  nada no Brasil, o que é toda a economia da emigração desta família numa só linha.

  ## Questões em aberto

  - Seu casamento com João de Medeiros Brandão é um negativo delimitado em todo o livro de
  casamentos de Mãe de Deus de 1801–1822 (196 páginas lidas; ela aparece apenas como progenitora)
  → o casamento é anterior a 1801. Fora de alcance (BPARPD, Ponta Delgada); este ato de casamento
  captaria seu sobrenome ausente e sua filiação. [OPEN]

  - Seu batismo, óbito e pais estão nos mesmos livros anteriores a 1801; fora de alcance. [OPEN]

  - **Cautela de homonímia:** sua filha Maria Jacintha de Medeiros (P-0049) compartilha o nome com
  uma Maria Jacintha de Medeiros sem parentesco (filha de Manoel Muniz × Tereza do Amaral,
  PAR-0048); os registros reutilizam um pequeno repertório de nomes, portanto trate cada "Maria …
  de Medeiros" com cuidado. [nota]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (casamento de 1819 de sua filha Maria Jacintha — a nomeia como mãe da noiva) ·
  PAR-0044 (batismo de 1843 de seu neto Agostinho — a nomeia, e a João de Medeiros Brandão, como
  avós maternos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores) — uma raiz em São Miguel da
  linha materna Muniz, sem mudança documentada. [INFERRED] A emigração é da geração de seus
  bisnetos (entre 1866 e 1882 (mais plausivelmente por volta de 1880; ver P-0019)),
  impulsionada pelo bloqueio fundiário do *morgadio* da ilha, pela superpopulação e pelo
  colapso, na década de 1860, da economia de exportação da laranja. [CONTEXTUAL] A atração
  para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) e pela
  Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel afrouxou quando a Carta de
  Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia da família (batismos de seus netos):** Igreja Matriz de N.S. da Mãe de Deus, Vila da Povoação, São Miguel, Açores, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
