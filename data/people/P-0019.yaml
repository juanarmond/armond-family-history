- text: Ahnentafel position 24.
- text: >-
    His son Deocleciano's 1892 Sapucaia baptism (PAR-0004) records the father as
    "João Muniz Bitencourt", settling the José-vs-João question (the 1882
    provisão PAR-0001 had recorded "José"). Both spellings are preserved.
- text: >-
    The FamilySearch collaborative profile GLMF-KCR gives an unproved 1864
    birth in São Miguel, Azores, and attaches an 1871 naturalisation link.
    Neither claim is accepted here until the underlying record identifies the
    same person.
- text: >-
    Nationality is deliberately left unset: his origin is unresolved (the
    Azorean birth lead above is unproved, and no located record states a
    nacionalidade), so neither a Brazilian jus-soli nor a Portuguese
    nationality can be asserted. See material conflict 6 in STATUS.md.
