profile: >-
  ## Interesting facts

  - **[PROVEN]** He was born in 1845 at the freguesia de Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel, Açores (PAR-0022) — the western Portuguese islands that were a major source of emigration to Brazil in the 19th century, driven by overpopulation, land scarcity and the decline of the orange export trade.

  - **[PROVEN]** Both his parents died in 1866 in Povoação: his father Manoel drowned at sea off the Garajau (PAR-0015), leaving eight children. João emigrated to Brazil almost certainly following that family catastrophe — the deaths removed the household head and forced the partition of a holding already too small for its heirs.

  - **[CONTEXTUAL]** His emigration coincided with a peak moment of Brazilian coffee labour demand: the Lei Eusébio de Queirós (1850) had ended the slave trade, creating pressure for free immigrant labour on the coffee plantations; the post-1850 Paraíba do Sul valley (Sapucaia, where João settled) was the most productive coffee region of the era.

  - **[PROVEN]** His 1915 death at Carangola, MG records him "natural da Ilha de São Miguel" (PAR-0007) — he died in Brazil 70 years after leaving the Açores, still identified by his island origin. He never ceased being Azorean in the civil record even as his children were born and raised entirely in Brazil.

  - **[INFERRED]** He replaced lost island land with kin-capital: his future father-in-law José do Rego Brandão stood godparent to his daughter Anna in 1885 (PAR-0006) — sponsoring the immigrant family before absorbing them by marriage. The godparent-then-marriage sequence is the textbook mechanism of immigrant social integration in 19th-century Brazil.

  - **[PROVEN]** He and Susanna had eleven children (PAR-0007). Eleven children in a smallholder household on the Brazilian coffee frontier exactly reset the partible-inheritance fragmentation that had expelled him from São Miguel: the same dynamic that left him without a viable Azorean plot would leave his Brazilian-born children without one too.

  ## Identity

  **João Monis / Muniz Bittencourt** (also *Byttancourt, Betencourt, Bittencourt,
  Bitencourt*) — the Azorean immigrant who carried this line from São Miguel to Brazil.
  [PROVEN]

  - **Born:** 1845, freguesia de Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel
  (Açores, Portugal) [PROVEN] — his own baptism (entry Nº 5, fol. 59; PAR-0022) reads
  "nasceu em vinte [e] quatro do [?] mez oito[centos] quarenta e cinco": day 24, year
  1845 legible; the month is illegible (PAR-0022 marks it "[?]"; a later read suggests
  Março [uncertain]). It is a joint baptism ("foram baptizados em o mesmo dia"): a
  sibling was baptised with him the same day, but that sibling is not legibly named in
  the held record — the retrieval agent identifies him as a brother named Manoel and
  reads the two as twins [LEAD]; "gêmeos" is not written in the act. This corrects both
  the c.1847
  estimate from his death-age and the collaborative profile's unproven 1864 date.

  - **Parents:** Manoel Muniz Bytancourt (P-0042) and Francisca Roza do Espirito Santo
  (P-0047) of Povoação [PROVEN] — from Manoel's own 1866 Povoação death (PAR-0015),
  corroborated on the baptism (PAR-0022). His 1915 óbito's "Manoel Luiz Bittencourt"
  (PAR-0007) is a garbled form; the true name is Manoel MUNIZ Bytancourt.

  - **Azorean grandparents:** João Muniz Bytancourt (P-0048) and Maria Jacintha de
  Medeiros (P-0049), also of Povoação (PAR-0015) — the line's furthest documented
  Azorean generation.

  - **Marriage:** to Susanna Rita Brondão (P-0020), by episcopal provisão of 23 December
  1882 for the matriz de Santo Antônio de Sapucaia (RJ) [PROVEN] (PAR-0001). The provisão
  writes the groom's given name closer to "José", a clerk slip settled to "João" by their
  son's 1892 baptism (PAR-0004); the ceremony act is not yet held.

  - **Children:** eleven at his death (PAR-0007). Documented: Deocleciano (P-0012, bapt.
  1892, PAR-0004); Anna (b. 1884, PAR-0006); Joventina (~1899, PAR-0013); Mercedes Maria
  (~1898, PAR-0014). [PROVEN]

  - **Death:** 12 September 1915, at Carrego do Boa Vista, Santa Luzia de Carangola (MG),
  aged 68, of a cardiac cause [PROVEN] (PAR-0007), leaving his widow Suzana and eleven
  children.

  ## Standing and profession

  - No occupation, office or property of his own is recorded; he appears as an
  established farmer-householder. His son Deocleciano was born at Sapucaia (1892) and his
  younger children at Carangola (~1898–99), so the family moved from Sapucaia (RJ) to
  Carangola (MG) between 1892 and ~1899 (PAR-0004, PAR-0013, PAR-0014). [INFERRED]

  - His father Manoel was a *proprietário* (landowner) at Lomba do Botão, Povoação
  (PAR-0015) — so João emigrated from a propertied island family, not from destitution.
  [PROVEN of the father; INFERRED for João]

  ## Family and social network

  Both his parents died in 1866 at Povoação — his father drowned at sea off the Garajau
  (PAR-0015) — leaving eight children; his emigration to Sapucaia most plausibly followed
  that family catastrophe [INFERRED]. In Sapucaia he married into the settled Rego Brandão
  family: Susanna's parents José do Rego Brandão and Rita Ignacia de Jesus stood as
  godparents to his daughter Anna in 1885 (PAR-0006), the social bond tying the immigrant
  to a native household.

  ## What we can extrapolate

  *João is the Atlantic hinge: the generation in which the line's small island land base is
  lost and rebuilt in Brazil as kin-capital and, eventually, a household of its own.*

  **1. He inherited a fraction, not a farm [PROVEN base / INFERRED reading].** His father
  Manoel was a *proprietário* (PAR-0015), but João was one of **eight children** of one
  Povoação smallholding, and his father died **intestate** in July 1866, when João was
  twenty-one. Portuguese forced-heirship split that ground eight ways with no discretion to
  keep it whole (see P-0042). **[INFERRED]** His departure is therefore not a fall from
  wealth; it is the land-poor surplus son leaving because the arithmetic left nothing to
  stay for. The household's downward pressure is visible on the island before anyone sails:
  within twelve years of the father's death his sisters Claudina and Anna Maria married a
  *sapateiro* and a *pedreiro* (PAR-0084, PAR-0083) — the proprietor's daughters marrying
  artisans.

  **2. The crossing is later than the family story suggests, and the correction matters
  [PROVEN bounds / INFERRED].** The held records bound him to São Miguel in 1845 (his own
  baptism, PAR-0022) and to Brazil by 23 December 1882 (the Sapucaia marriage provision,
  PAR-0001) — thirty-seven years wide. The earlier working reading placed the crossing about
  1866–1870, immediately on his father's death; nothing we hold supports that. **[LEAD]**
  The uncatalogued Ponta Delgada passport register records two 1880 passports for men named
  as sons of João Moniz Bettencourt and Maria Jacinta of Povoação — probably his brothers —
  which would put the family's departures around 1880, not 1866. **[INFERRED]** His own
  life-course points the same way: he married at about **thirty-seven** and fathered his
  first documented child at thirty-nine. A peasant son who marries that late has usually
  spent his twenties and early thirties without the means to form a household — which is
  what a fourteen-year delay between his father's death and his emigration would look like.
  Treat the crossing as **1866 × 1882, most plausibly late in that window**, not as a flight
  in the immediate aftermath of 1866.

  **3. He replaced land with a household — the propertyless immigrant's only available
  capital [PROVEN pattern / INFERRED reading].** Landless in a new country, he attached
  himself to a settled local family rather than to property: he married Susanna Rita Brandão
  (P-0020) at Sapucaia, and her parents **José do Rego Brandão and Rita Ignacia de Jesus**
  stood godparents to his daughter Anna in 1885 (PAR-0006). **[INFERRED]** The compadrio
  habit is unchanged from the Azores — godparents drawn from inside the kin-group, never a
  patron reached for above it (compare P-0042). What changed is that in Brazil the kin-group
  had to be **acquired by marriage** rather than inherited: the Brandões supplied the local
  rootedness the Muniz had left behind in the Açores. That is what the crossing actually
  cost, and how it was paid for.

  **4. He was not alone in Sapucaia, and that is evidence of chain migration [PROVEN /
  LEAD].** On the same folio of the Sapucaia baptism book that carries his daughter Anna's
  1885 act, the parish baptised *Porcina, filha de José Muniz Bettencourt e Anna Barbara de
  Jesus* — a second Muniz Bettencourt household in the same small parish (PAR-0006). His
  grandparents did baptise a son named **José** at Povoação in 1841 (PAR-0043), but the
  identity of the two is unproven and must stay a **[LEAD]**. **[INFERRED]** The presence of
  a namesake household in the same freguesia is nonetheless the ordinary signature of
  Azorean chain migration: men did not emigrate into a void, they emigrated toward a brother
  or a cousin who had gone first.

  **5. He was literate, or at least a signer — and the earlier reading was wrong [PROVEN].**
  The 1890 civil birth registration of his daughter Ritta states that the clerk drew the
  term "que commigo **assigna o declarante**" — João signed it himself, alongside the
  witnesses (CIV-0041). He had also walked in from Conceição, **two leagues from the town**,
  to register a birth eight days after it happened, under civil registration made compulsory
  only the previous year. **[INFERRED]** That is not a passive peasant in the record: it is
  a man who could use the state's paperwork and chose to. The earlier profile reading —
  "nothing marks him as literate" — is superseded by this act. His signature also makes his
  son Deocleciano's 1916 signature (CIV-0006) continuity rather than a leap.

  **6. The class move is lateral, and the fragmentation simply resets [PROVEN / INFERRED].**
  He is recorded a *lavrador* with his wife at Conceição, Sapucaia, in 1890 (CIV-0041), and
  in 1915 he died **"em casa de sua residencia"** at Carrego do Boa Vista, Carangola, his
  funeral rites paid **"ás expensas de sua Familia"** (PAR-0007). **[INFERRED]** Dying in
  his own house, buried at his family's cost rather than the parish's, is the modest
  solvency marker of a householder — not a proprietor, not a pauper. He neither climbed nor
  fell: he rebuilt his father's agrarian rung on Brazilian soil. What he could not rebuild
  was scale. He left **eleven children** where his father had left eight (PAR-0007), so the
  partible arithmetic that expelled him from São Miguel came back larger for the next
  generation, on land he is nowhere documented as owning.

  **7. The break with the Açores was total within one generation [PROVEN / INFERRED].** His
  1915 Carangola death act names his father as **"Manoel Luiz Bittencourt"** — the wrong
  middle name, corrected only by the Povoação óbito of 1866 (PAR-0015) — and does not name
  his mother at all. **[INFERRED]** Roughly thirty-five years after the crossing, the family
  informing the priest could no longer state the emigrant's own parents correctly. Nothing
  of São Miguel came across but the island's name and the surname, and the surname itself
  went on drifting (Bytancourt → Bittencourt → dropped entirely by his grandson, P-0006).
  Emigration here erases the past as efficiently as it erases property.

  **8. No education lever, and none purchasable [CONTEXTUAL].** Whatever letters he had,
  they were practical and self-carried; nothing suggests schooling, and none was on offer to
  a rural immigrant household in 1880s Sapucaia. **[CONTEXTUAL]** Brazilian schooling in
  this period was a purchased, class-linked privilege that had to be re-bought every
  generation; a lavrador with eleven children did not buy it. His grandson Antenor (P-0006)
  would leave the land not through education but through a **trade**, which is the only exit
  this class had.

  **Synthesis.** João is the point where the family's capital changes *form* but not
  *class*: heritable island land → a propertyless Atlantic crossing → an agrarian
  householder's position rebuilt on a marriage into the Brandões. The 1866 drowning is a
  trigger; the mechanism underneath is an eight-way intestate split on an island with no
  spare ground. **[INFERRED]** He arrives with nothing, acquires a household, works land he
  does not appear to own, signs his own name, and dies solvent enough to be buried at his
  family's expense — and then divides that by eleven. It is agrarian persistence across an
  ocean, not upward reach and not ruin; the line's first genuine gain in property would wait
  three more generations, and would come from a wage (P-0006).

  ## Open questions

  - His 1882 Sapucaia marriage ceremony act (in the undigitized Sapucaia marriage book) —
  would give his filiation as stated at marriage. [OPEN]

  - His emigration/departure record and arrival date (~1866–1874) — not held. [OPEN]

  ## Sources held (this repository)

  - PAR-0022 (his own 1845 Povoação baptism) · PAR-0015 (his father Manoel's 1866
  Povoação death — names parents and grandparents) · PAR-0007 (his 1915 Carangola death —
  São Miguel origin, father, eleven children).

  - PAR-0001 (1882 marriage provisão) · PAR-0004 (son Deocleciano's 1892 Sapucaia baptism,
  settles "João") · PAR-0006 (daughter Anna's 1885 baptism) · PAR-0013 / PAR-0014
  (daughters Joventina and Mercedes' 1916–17 Carangola marriages).

  - PAR-0003 (grandson Aristides' 1922 baptism) · PAR-0012 and CIV-0001 (son Deocleciano's
  1916 religious and civil marriage) — all name him as father / grandfather.

  ## Regional and migration context

  His nationality is Portuguese from a documented birthplace (São Miguel, Açores), not a
  surname inference [PROVEN]. His life spans the classic Azorean-emigration arc — the
  mid-century push of the overpopulated, orange-export-dependent islands, sharpened by his
  parents' 1866 deaths, against the pull of post-1850 Brazilian coffee-labour demand, with
  Rio de Janeiro a leading destination. [CONTEXTUAL]

  ## Where to go today

  - **Birth (1845):** Igreja Matriz de Nossa Senhora da Mãe de Deus, Vila da Povoação, São Miguel,
  Açores, Portugal (coords 37.74891, -25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Marriage to Suzana (1882):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto
  Filho, Centro; CEP 25880-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Death (1915):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138; CEP
  36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nasceu em 1845 na freguesia de Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel, Açores (PAR-0022) — as ilhas portuguesas ocidentais que foram uma das principais fontes de emigração para o Brasil no século XIX, impulsionada pela superpopulação, pela escassez de terra e pelo declínio da exportação de laranja.

  - **[PROVEN]** Ambos os pais faleceram em 1866 em Povoação: seu pai Manoel se afogou no mar ao largo do Garajau (PAR-0015), deixando oito filhos. João emigrou para o Brasil quase certamente na sequência dessa catástrofe familiar — as mortes removeram o chefe da casa e forçaram a partilha de uma propriedade já pequena demais para seus herdeiros.

  - **[CONTEXTUAL]** Sua emigração coincidiu com um pico da demanda brasileira por mão de obra cafeeira: a Lei Eusébio de Queirós (1850) havia encerrado o tráfico de escravizados, criando pressão por trabalho imigrante livre nas fazendas de café; o vale do Paraíba do Sul do pós-1850 (Sapucaia, onde João se instalou) era a região cafeeira mais produtiva da época.

  - **[PROVEN]** Seu óbito de 1915 em Carangola, MG o registra "natural da Ilha de São Miguel" (PAR-0007) — faleceu no Brasil 70 anos após deixar os Açores, ainda identificado pela origem insular. Nunca deixou de ser açoriano no registro civil, mesmo com os filhos nascidos e criados inteiramente no Brasil.

  - **[INFERRED]** Substituiu a terra insular perdida por capital de parentesco: seu futuro sogro José do Rego Brandão foi padrinho de sua filha Anna em 1885 (PAR-0006) — patrocinando a família imigrante antes de absorvê-la pelo casamento. A sequência padrinho-depois-casamento é o mecanismo clássico de integração social do imigrante no Brasil do século XIX.

  - **[PROVEN]** Ele e Susanna tiveram onze filhos (PAR-0007). Onze filhos num lar de pequeno agricultor na fronteira cafeeira brasileira replicou exatamente a fragmentação pela herança partível que o havia expulsado de São Miguel: a mesma dinâmica que o havia deixado sem um lote açoriano viável deixaria os filhos nascidos no Brasil igualmente sem um.

  ## Identidade

  **João Monis / Muniz Bittencourt** (também *Byttancourt, Betencourt, Bittencourt,
  Bitencourt*) — o imigrante açoriano que trouxe esta linhagem de São Miguel para o
  Brasil. [PROVEN]

  - **Nascimento:** 1845, freguesia de Nossa Senhora Mãe de Deus, Povoação, Ilha de São
  Miguel (Açores, Portugal) [PROVEN] — seu próprio batismo (assento Nº 5, fol. 59;
  PAR-0022) diz "nasceu em vinte [e] quatro do [?] mez oito[centos] quarenta e cinco":
  dia 24 e ano de 1845 legíveis; o mês está ilegível (PAR-0022 o marca "[?]"; uma leitura
  posterior sugere Março [incerto]). É um batismo conjunto ("foram baptizados em o mesmo
  dia"): uma criança foi batizada com ele no mesmo dia, mas esse irmão não está nomeado de
  forma legível no registro obtido — o agente de recuperação o identifica como um irmão de
  nome Manoel e lê os dois como gêmeos [LEAD]; "gêmeos" não consta no ato. Isso corrige tanto
  a estimativa de c.1847 (da idade no óbito) quanto a data de 1864, não comprovada, do
  perfil colaborativo.

  - **Pais:** Manoel Muniz Bytancourt (P-0042) e Francisca Roza do Espirito Santo (P-0047),
  de Povoação [PROVEN] — a partir do próprio óbito de 1866 de Manoel em Povoação
  (PAR-0015), corroborado no batismo (PAR-0022). O "Manoel Luiz Bittencourt" de seu óbito
  de 1915 (PAR-0007) é uma forma corrompida; o nome verdadeiro é Manoel MUNIZ Bytancourt.

  - **Avós açorianos:** João Muniz Bytancourt (P-0048) e Maria Jacintha de Medeiros
  (P-0049), também de Povoação (PAR-0015) — a geração açoriana documentada mais antiga da
  linhagem.

  - **Casamento:** com Susanna Rita Brondão (P-0020), por provisão episcopal de 23 de
  dezembro de 1882 para a matriz de Santo Antônio de Sapucaia (RJ) [PROVEN] (PAR-0001). A
  provisão escreve o prenome do noivo mais próximo de "José", um lapso de escrivão
  resolvido para "João" pelo batismo do filho em 1892 (PAR-0004); o assento da cerimônia
  ainda não foi obtido.

  - **Filhos:** onze ao seu falecimento (PAR-0007). Documentados: Deocleciano (P-0012,
  bat. 1892, PAR-0004); Anna (n. 1884, PAR-0006); Joventina (~1899, PAR-0013); Mercedes
  Maria (~1898, PAR-0014). [PROVEN]

  - **Óbito:** 12 de setembro de 1915, no Carrego do Boa Vista, Santa Luzia de Carangola
  (MG), aos 68 anos, de causa cardíaca [PROVEN] (PAR-0007), deixando a viúva Suzana e onze
  filhos.

  ## Posição social e profissão

  - Nenhuma ocupação, cargo ou propriedade própria está registrada; ele aparece como um
  lavrador-chefe de casa estabelecido. Seu filho Deocleciano nasceu em Sapucaia (1892) e
  seus filhos mais novos em Carangola (~1898–99), de modo que a família mudou-se de
  Sapucaia (RJ) para Carangola (MG) entre 1892 e cerca de 1899 (PAR-0004, PAR-0013,
  PAR-0014). [INFERRED]

  - Seu pai Manoel era *proprietário* na Lomba do Botão, Povoação (PAR-0015) — de modo que
  João emigrou de uma família ilhoa proprietária, não da miséria. [PROVEN quanto ao pai;
  INFERRED quanto a João]

  ## Família e rede social

  Ambos os pais faleceram em 1866 em Povoação — o pai afogado no mar, ao largo do Garajau
  (PAR-0015) — deixando oito filhos; sua emigração para Sapucaia seguiu, muito
  provavelmente, essa catástrofe familiar [INFERRED]. Em Sapucaia casou-se com a
  estabelecida família Rego Brandão: os pais de Susanna, José do Rego Brandão e Rita
  Ignacia de Jesus, foram padrinhos de sua filha Anna em 1885 (PAR-0006), o vínculo social
  que ligou o imigrante a um lar nativo.

  ## O que podemos extrapolar

  *João é a dobradiça atlântica: a geração em que a pequena base fundiária insular da
  linhagem se perde e é reconstruída no Brasil como capital de parentesco e, por fim, como
  casa própria.*

  **1. Ele herdou uma fração, não uma lavoura [PROVEN na base / INFERRED na leitura].** Seu
  pai Manoel era *proprietário* (PAR-0015), mas João era um de **oito filhos** de uma única
  pequena propriedade da Povoação, e o pai morreu **intestado** em julho de 1866, quando
  João tinha vinte e um anos. A legítima portuguesa partia aquele chão em oito, sem margem
  alguma para mantê-lo íntegro (ver P-0042). **[INFERRED]** Sua partida, portanto, não é
  queda de riqueza; é o filho excedente e pobre de terra indo embora porque a aritmética
  nada lhe deixou para ficar. A pressão de baixa da casa é visível na ilha antes que alguém
  embarque: em doze anos a contar da morte do pai, suas irmãs Claudina e Anna Maria
  casaram-se com um *sapateiro* e um *pedreiro* (PAR-0084, PAR-0083) — as filhas do
  proprietário casando-se com artesãos.

  **2. A travessia é mais tardia do que sugere a história de família, e a correção importa
  [PROVEN nos limites / INFERRED].** Os registros que temos o prendem a São Miguel em 1845
  (seu próprio batismo, PAR-0022) e ao Brasil até 23 de dezembro de 1882 (a provisão de
  casamento de Sapucaia, PAR-0001) — trinta e sete anos de amplitude. A leitura de trabalho
  anterior situava a travessia por volta de 1866–1870, logo após a morte do pai; nada do que
  temos sustenta isso. **[LEAD]** O registro de passaportes de Ponta Delgada, não
  catalogado, traz dois passaportes de 1880 de homens nomeados como filhos de João Moniz
  Bettencourt e Maria Jacinta, da Povoação — provavelmente seus irmãos —, o que situaria as
  partidas da família por volta de 1880, e não de 1866. **[INFERRED]** Seu próprio curso de
  vida aponta no mesmo sentido: casou-se com cerca de **trinta e sete anos** e teve o
  primeiro filho documentado aos trinta e nove. Um filho de camponeses que casa tão tarde
  costuma ter passado os vinte e os primeiros trinta anos sem meios de formar casa — que é
  exatamente a aparência de um intervalo de catorze anos entre a morte do pai e a emigração.
  Trate-se a travessia como **1866 × 1882, mais plausivelmente no fim dessa janela**, e não
  como fuga no rescaldo imediato de 1866.

  **3. Ele trocou terra por uma casa — o único capital ao alcance do imigrante sem bens
  [PROVEN no padrão / INFERRED na leitura].** Sem terra em país novo, prendeu-se a uma
  família local estabelecida em vez de a uma propriedade: casou-se com Susanna Rita Brandão
  (P-0020) em Sapucaia, e os pais dela, **José do Rego Brandão e Rita Ignacia de Jesus**,
  foram padrinhos de sua filha Anna em 1885 (PAR-0006). **[INFERRED]** O hábito de compadrio
  não mudou em nada desde os Açores — padrinhos tirados de dentro da parentela, jamais um
  patrono buscado acima dela (compare-se P-0042). O que mudou é que no Brasil a parentela
  teve de ser **adquirida pelo casamento** em vez de herdada: os Brandão forneceram o
  enraizamento local que os Muniz haviam deixado nos Açores. Foi isso que a travessia de
  fato custou, e foi assim que se pagou.

  **4. Ele não estava sozinho em Sapucaia, e isso é indício de migração em cadeia [PROVEN /
  LEAD].** No mesmo fólio do livro de batismos de Sapucaia que traz o ato de 1885 de sua
  filha Anna, a paróquia batizou *Porcina, filha de José Muniz Bettencourt e Anna Barbara de
  Jesus* — uma segunda casa Muniz Bettencourt na mesma pequena freguesia (PAR-0006). Seus
  avós de fato batizaram um filho chamado **José** na Povoação em 1841 (PAR-0043), mas a
  identidade entre os dois não está provada e deve permanecer **[LEAD]**. **[INFERRED]** A
  presença de uma casa homônima na mesma freguesia é, ainda assim, a assinatura corriqueira
  da migração açoriana em cadeia: os homens não emigravam para o vazio, emigravam na direção
  de um irmão ou de um primo que tinha ido antes.

  **5. Ele era alfabetizado, ou ao menos assinava — e a leitura anterior estava errada
  [PROVEN].** O registro civil de nascimento de sua filha Ritta, em 1890, declara que o
  escrivão lavrou o termo "que commigo **assigna o declarante**" — João o assinou ele
  próprio, ao lado das testemunhas (CIV-0041). Ele também havia vindo da Conceição, **a duas
  léguas da sede da cidade**, para registrar um nascimento oito dias depois de ocorrido, sob
  um registro civil tornado obrigatório apenas no ano anterior. **[INFERRED]** Não é um
  camponês passivo no registro: é um homem que sabia usar a papelada do Estado e escolheu
  usá-la. A leitura anterior do perfil — "nada o marca como alfabetizado" — fica superada
  por este ato. Sua assinatura também torna a assinatura de 1916 de seu filho Deocleciano
  (CIV-0006) uma continuidade, e não um salto.

  **6. O movimento de classe é lateral, e a fragmentação simplesmente se reinicia [PROVEN /
  INFERRED].** Ele é registrado como *lavrador*, junto com a mulher, na Conceição, Sapucaia,
  em 1890 (CIV-0041), e em 1915 morreu **"em casa de sua residencia"** no Carrego do Boa
  Vista, Carangola, com as exéquias pagas **"ás expensas de sua Familia"** (PAR-0007).
  **[INFERRED]** Morrer em casa própria e ser sepultado à custa da família, e não da
  paróquia, é o modesto marcador de solvência de um chefe de casa — não de um proprietário,
  não de um indigente. Ele nem subiu nem caiu: reconstruiu em solo brasileiro o degrau
  agrário do pai. O que não pôde reconstruir foi a escala. Deixou **onze filhos**, onde o
  pai deixara oito (PAR-0007), de modo que a aritmética da partilha que o expulsou de São
  Miguel voltou maior para a geração seguinte, sobre terra que em parte alguma se documenta
  como sua.

  **7. A ruptura com os Açores foi total em uma só geração [PROVEN / INFERRED].** Seu
  assento de óbito de 1915 em Carangola nomeia o pai como **"Manoel Luiz Bittencourt"** — o
  nome do meio errado, corrigido apenas pelo óbito da Povoação de 1866 (PAR-0015) — e não
  nomeia a mãe de modo algum. **[INFERRED]** Cerca de trinta e cinco anos depois da
  travessia, a família que informava o pároco já não sabia declarar corretamente os pais do
  próprio emigrante. De São Miguel nada atravessou senão o nome da ilha e o sobrenome, e o
  próprio sobrenome seguiu à deriva (Bytancourt → Bittencourt → abandonado de todo por seu
  neto, P-0006). Aqui a emigração apaga o passado com a mesma eficiência com que apaga o
  patrimônio.

  **8. Nenhuma alavanca de instrução, e nenhuma comprável [CONTEXTUAL].** Quaisquer letras
  que tivesse eram práticas e de aquisição própria; nada sugere escolarização, e nenhuma se
  oferecia a uma casa rural de imigrantes na Sapucaia da década de 1880. **[CONTEXTUAL]** A
  escolarização brasileira do período era um privilégio comprado e ligado à classe, que
  precisava ser recomprado a cada geração; um lavrador com onze filhos não a comprava. Seu
  neto Antenor (P-0006) deixaria a terra não pela instrução, mas por um **ofício**, que é a
  única saída de que esta classe dispunha.

  **Síntese.** João é o ponto em que o capital da família muda de *forma*, mas não de
  *classe*: terra insular herdável → uma travessia atlântica sem bens → a posição de chefe
  de casa agrário reconstruída sobre um casamento com os Brandão. O afogamento de 1866 é um
  gatilho; o mecanismo por baixo é uma partilha intestada em oito numa ilha sem chão
  sobrando. **[INFERRED]** Ele chega sem nada, adquire uma casa, trabalha terra que não
  parece possuir, assina o próprio nome e morre solvente o bastante para ser sepultado às
  expensas da família — e então divide isso por onze. É persistência agrária através de um
  oceano, não alcance para cima nem ruína; o primeiro ganho patrimonial genuíno da linhagem
  esperaria mais três gerações, e viria de um salário (P-0006).

