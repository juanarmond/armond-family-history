- text: >-
    Birth year confirmed as 1845 by his own baptism (PAR-0022): entry Nº 5, fol.
    59, N.S. Mãe de Deus, Povoação (DGS 5228858 img 63). The act reads "nasceu
    em vinte [e] quatro do [?] mez oito[centos] quarenta e cinco" — day 24, year
    1845; the month is illegible. This corrects the c.1847 estimate derived from
    his death record's stated age (PAR-0007) and the FS profile's unsubstantiated
    1864 date.
  text_pt: >-
    Ano de nascimento confirmado como 1845 por seu próprio batismo (PAR-0022): assento
    nº 5, fol. 59, N.S. Mãe de Deus, Povoação (DGS 5228858 img 63). O assento diz
    "nasceu em vinte [e] quatro do [?] mez oito[centos] quarenta e cinco" — dia 24, ano
    de 1845; o mês está ilegível. Isso corrige a estimativa de c.1847 derivada da idade
    declarada em seu registro de óbito (PAR-0007) e a data de 1864, sem comprovação, do
    perfil do FS.
- text: >-
    His son Deocleciano's 1892 Sapucaia baptism (PAR-0004) records the father as
    "João Muniz Bitencourt", settling the José-vs-João question (the 1882
    provisão PAR-0001 had recorded "José"). Both spellings are preserved.
  text_pt: >-
    O batismo de 1892 em Sapucaia de seu filho Deocleciano (PAR-0004) registra o pai
    como "João Muniz Bitencourt", resolvendo a questão José vs. João (a provisão de
    1882, PAR-0001, havia registrado "José"). Ambas as grafias são preservadas.
- text: >-
    Origin RESOLVED (31 July 2026): his own 1915 Carangola death register (PAR-0007 →
    event E-0036) records him "natural da Ilha de São Miguel" (Açores, Portugal), died
    12 September 1915 aged 68 (born c.1847), married to Suzana Rita Brandão, leaving
    eleven children. He was himself the Azorean immigrant — which is why the Sapucaia
    baptism books (1856-1877) held no baptism for his generation. Nationality is
    therefore Portuguese (a documented birthplace, not a surname inference). This
    supersedes the earlier "unset origin" and resolves material conflict 6; note the
    óbito's c.1847 birth corrects the FamilySearch profile's unproved 1864 date.
  text_pt: >-
    Origem RESOLVIDA (31 de julho de 2026): seu próprio registro de óbito de 1915 em
    Carangola (PAR-0007 → evento E-0036) o registra "natural da Ilha de São Miguel"
    (Açores, Portugal), falecido em 12 de setembro de 1915 com 68 anos (nascido
    c.1847), casado com Suzana Rita Brandão, deixando onze filhos. Ele próprio era o
    imigrante açoriano — razão pela qual os livros de batismo de Sapucaia (1856-1877)
    não continham batismo para sua geração. A nacionalidade é, portanto, portuguesa (um
    local de nascimento documentado, não uma inferência a partir do sobrenome). Isso
    supera a anterior "origem indefinida" e resolve o conflito material 6; observe que o
    nascimento c.1847 do óbito corrige a data de 1864, não comprovada, do perfil do
    FamilySearch.
- text: >-
    Parents identified (1 August 2026) from his father's own 1866 Povoação death
    (PAR-0015): father Manoel Muniz Bytancourt (P-0042) — correcting the "Manoel
    Luiz Bittencourt" of the 1915 óbito (PAR-0007) — and, indirectly, mother
