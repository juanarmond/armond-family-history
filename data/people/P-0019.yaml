  ## Contexto regional e migratório

  Sua nacionalidade é portuguesa por um local de nascimento documentado (São Miguel,
  Açores), não por inferência a partir do sobrenome [PROVEN]. Sua vida percorre o arco
  clássico da emigração açoriana — o empurrão de meados do século das ilhas superpovoadas
  e dependentes da exportação de laranja, agravado pelas mortes dos pais em 1866, contra a
  atração da demanda por mão de obra cafeeira no Brasil pós-1850, tendo o Rio de Janeiro
  como destino de destaque. [CONTEXTUAL]

