profile: >-
  ## Identity

  **José do Rego Brandão** — the Sapucaia Rego Brandão patriarch, who carries his own
  father's identical name and is distinguished only by generation. [PROVEN]

  - **Born:** about 1833 (aged 79 at death, PAR-0008); Brazilian ("brasileiro" in that
  óbito). [PROVEN]

  - **Parents:** José do Rego Brandão [the elder] (P-0043) and Maria de Mendonça (P-0044;
  family F-0021), named in his own 1912 death (PAR-0008). [PROVEN]

  - **Marriage:** Rita Ignacia de Jesus (P-0041), who appears in her married form "Rita do
  Rego Brandão"; he was already a widower of her by his 1912 death (she died 4 January
  1898, PAR-0009 / PAR-0008). [PROVEN]

  - **Children:** Susanna (Suzana) Rita Brandão (P-0020), born 20 August 1865, baptised
  22 March 1866 (PAR-0005). [PROVEN] Other Brandão women of Carangola are floated as
  possible daughters but are not confirmed; the 1906 death of a different "Ana Rita
  Brandão" (wife of João de Souza Freitas) is expressly NOT of this family. [LEAD]

  - **Death:** 3 October 1912 at Santa Luzia de Carangola (MG), a Catholic, without the
  sacraments, cause "ataque" (PAR-0008). [PROVEN]

  ## Standing and profession

  The settled Rego Brandão household of Santo Antônio de Sapucaia (RJ). He and his wife
  Rita stood as godparents to the Açorean Muniz immigrants' children — recorded as the
  godparents of his granddaughter Anna Muniz Bittencourt's 1885 baptism (PAR-0006) — a
  role of trust that predates João Muniz's marriage into the family. [PROVEN] A retrieval
  lead also has him witnessing a wedding alongside João Muniz Betencourt in July 1885
  [LEAD]. No occupation, title or property is directly attested.

  ## Family and social network

  Father of Susanna (P-0020), who married the Azorean immigrant João Muniz Bittencourt
  (P-0019); father-in-law thereby of the Muniz line, and Deocleciano Muniz Bittencourt's
  maternal grandfather. His parents (P-0043 × P-0044) push the Brandão line up one further
  generation. The repeated godparent bond with the newly-arrived Muniz brothers marks his
  household as the established native anchor that received and integrated them.

  ## What we can extrapolate

  His standing was social, not material — and that is the point. [INFERRED / CONTEXTUAL] He
  leaves no inventário, land record or title, so no documented wealth; yet he was repeatedly
  chosen as godfather by newly-arrived Açorean immigrants and stood as a wedding witness in the
  parish. In a frontier community, being the man newcomers ask to sponsor their children is a
  precise index of local standing, trust and settled respectability. His capital, on this
  reading, was belonging — the intangible asset of the established host family, which is exactly
  what the propertyless immigrant Muniz lacked and married into.

  On the same reading he functioned as the receiving anchor of the whole Sapucaia settlement of
  this line: he sponsored the Muniz brothers' children, then gave his daughter Susanna (P-0020)
  in marriage to João Muniz Bittencourt (P-0019). [INFERRED] This host-family role is a distinct
  social position — neither immigrant nor elite, but the middling established native whose
  function is to integrate incomers — and it transmits as standing in a community, not as
  heritable property.

  His line's only documented movement is the same RJ→MG coffee-frontier shift as the Muniz
  (Sapucaia → Carangola); it reads as moving with the frontier rather than being pushed off the
  land — the pattern of a settled small-farmer family following the coffee economy, not one
  losing its base. [CONTEXTUAL] Taken together, José reads as the established-local counterweight
  to the immigrant Muniz and the propertyless Azevedo: a family whose "wealth" cannot be found
  in an archive because it was social rootedness rather than land or money — which is why his
  branch looks respectable and stable while leaving so little material trace, and why his
  daughter's marriage was so valuable to an immigrant line with people but no place. [INFERRED]

  ## Open questions

  - His baptism (about 1833) — would name his parents at primary level and fix the family's
  origin before Sapucaia. [OPEN]

  - His marriage to Rita Ignacia de Jesus (Sapucaia, before 1865) — would confirm Rita's
  maiden name against her married form and possibly her parents. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (his 1912 Carangola death — age, nationality, widower status, parents) ·
  PAR-0009 (his wife Rita's 1898 death, as "Rita do Rego Brandão").

  - PAR-0005 (daughter Susanna's 1866 baptism — names him her father) · PAR-0006
  (granddaughter Anna's 1885 baptism — names him and Rita as godparents).

  ## Regional and migration context

  A settled Rego Brandão patriarch of Santo Antônio de Sapucaia in the Paraíba do Sul
  valley (RJ) who, like the Muniz family he married into, relocated to Carangola in the
  Zona da Mata Mineira, where he died in 1912. [CONTEXTUAL] His is Brazilian-side internal
  migration — the same RJ-to-MG coffee-frontier shift as the Muniz — not an Atlantic
  crossing; his origin before Sapucaia remains open. The coffee economy this line lived in and
  followed ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de
  Queirós), which by choking the slave trade drew in the Açorean immigrants the family hosted,
  through to abolition in the Lei Áurea (1888), with land governed by the Lei de Terras (nº 601,
  1850) — but this is its Brazilian, receiving side, with no Atlantic crossing. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **José do Rego Brandão** — o patriarca Rego Brandão de Sapucaia, que carrega o nome
  idêntico ao de seu próprio pai e é distinguido apenas pela geração. [PROVEN]

  - **Nascimento:** por volta de 1833 (79 anos ao falecer, PAR-0008); brasileiro
  ("brasileiro" nesse óbito). [PROVEN]

  - **Pais:** José do Rego Brandão [o velho] (P-0043) e Maria de Mendonça (P-0044; família
  F-0021), nomeados em seu próprio óbito de 1912 (PAR-0008). [PROVEN]

  - **Casamento:** Rita Ignacia de Jesus (P-0041), que aparece na forma de casada "Rita do
  Rego Brandão"; ele já era viúvo dela em seu óbito de 1912 (ela faleceu em 4 de janeiro de
  1898, PAR-0009 / PAR-0008). [PROVEN]

  - **Filhos:** Susanna (Suzana) Rita Brandão (P-0020), nascida em 20 de agosto de 1865,
  batizada em 22 de março de 1866 (PAR-0005). [PROVEN] Outras Brandão de Carangola são
  levantadas como possíveis filhas, mas não confirmadas; o óbito de 1906 de uma "Ana Rita
  Brandão" diferente (esposa de João de Souza Freitas) NÃO é desta família. [LEAD]

  - **Óbito:** 3 de outubro de 1912 em Santa Luzia de Carangola (MG), católico, sem os
  sacramentos, causa "ataque" (PAR-0008). [PROVEN]

  ## Posição social e profissão

  A casa estabelecida dos Rego Brandão de Santo Antônio de Sapucaia (RJ). Ele e sua esposa
  Rita foram padrinhos dos filhos dos imigrantes açorianos Muniz — registrados como padrinhos
  no batismo de 1885 de sua neta Anna Muniz Bittencourt (PAR-0006) — papel de confiança que
  antecede o casamento de João Muniz com a família. [PROVEN] Uma pista de recuperação também
  o coloca como testemunha de um casamento ao lado de João Muniz Betencourt em julho de 1885
  [LEAD]. Nenhuma ocupação, título ou propriedade lhe é atestada diretamente.

  ## Família e rede social

  Pai de Susanna (P-0020), que se casou com o imigrante açoriano João Muniz Bittencourt
  (P-0019); sogro, assim, da linha Muniz, e avô materno de Deocleciano Muniz Bittencourt.
  Seus pais (P-0043 × P-0044) elevam a linhagem Brandão uma geração acima. O repetido vínculo
  de compadrio com os recém-chegados irmãos Muniz marca sua casa como a âncora nativa
  estabelecida que os recebeu e integrou.

  ## O que podemos extrapolar

  Sua posição era social, não material — e é esse o ponto. [INFERRED / CONTEXTUAL] Ele não deixa
  inventário, registro de terras ou título, portanto nenhuma riqueza documentada; ainda assim,
  foi repetidamente escolhido como padrinho pelos recém-chegados imigrantes açorianos e foi
  testemunha de casamento na freguesia. Em uma comunidade de fronteira, ser o homem a quem os
  recém-chegados pedem para apadrinhar seus filhos é um índice preciso de posição local,
  confiança e respeitabilidade estabelecida. Seu capital, nesta leitura, era o pertencimento —
  o ativo intangível da família anfitriã estabelecida, exatamente o que faltava aos imigrantes
  Muniz sem propriedade e no qual eles se casaram.

  Na mesma leitura, ele funcionava como a âncora receptora de todo o assentamento de Sapucaia
  desta linha: apadrinhou os filhos dos irmãos Muniz e depois deu sua filha Susanna (P-0020) em
  casamento a João Muniz Bittencourt (P-0019). [INFERRED] Esse papel de família anfitriã é uma
  posição social distinta — nem imigrante nem elite, mas o nativo estabelecido de posição média
  cuja função é integrar os recém-chegados — e transmite-se como posição numa comunidade, não
  como propriedade herdável.

  O único movimento documentado de sua linha é o mesmo deslocamento pela fronteira cafeeira do
  RJ para MG dos Muniz (Sapucaia → Carangola); lê-se como um mover-se com a fronteira, e não um
  ser empurrado para fora da terra — o padrão de uma família de pequenos lavradores estabelecida
  que segue a economia do café, não de uma que perde sua base. [CONTEXTUAL] No conjunto, José
  lê-se como o contrapeso nativo-estabelecido aos imigrantes Muniz e aos Azevedo sem propriedade:
  uma família cuja "riqueza" não se encontra num arquivo porque era enraizamento social, e não
  terra ou dinheiro — razão pela qual seu ramo parece respeitável e estável embora deixe tão
  pouco rastro material, e pela qual o casamento de sua filha era tão valioso para uma linha
  imigrante com gente, mas sem lugar. [INFERRED]

  ## Questões em aberto

  - Seu batismo (por volta de 1833) — nomearia seus pais em nível primário e fixaria a origem
  da família antes de Sapucaia. [OPEN]

  - Seu casamento com Rita Ignacia de Jesus (Sapucaia, antes de 1865) — confirmaria o nome de
  solteira de Rita frente à sua forma de casada e possivelmente seus pais. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (seu óbito de 1912 em Carangola — idade, nacionalidade, condição de viúvo, pais)
  · PAR-0009 (o óbito de 1898 de sua esposa Rita, como "Rita do Rego Brandão").

  - PAR-0005 (batismo de 1866 da filha Susanna — nomeia-o pai dela) · PAR-0006 (batismo de
  1885 da neta Anna — nomeia-o, junto de Rita, como padrinhos).

  ## Contexto regional e migratório

  Um patriarca Rego Brandão estabelecido em Santo Antônio de Sapucaia, no vale do Paraíba do
  Sul (RJ), que, como a família Muniz na qual se casou, mudou-se para Carangola, na Zona da
  Mata Mineira, onde faleceu em 1912. [CONTEXTUAL] A sua é uma migração interna do lado
  brasileiro — o mesmo deslocamento pela fronteira cafeeira do RJ para MG dos Muniz — não uma
  travessia atlântica; sua origem anterior a Sapucaia permanece em aberto. A economia cafeeira
  na qual esta linha viveu e que seguiu funcionava sobre a transição para o trabalho livre do
  pós-1850 — a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que, ao estrangular o tráfico de
  escravizados, atraiu os imigrantes açorianos que a família hospedou, até a abolição na Lei
  Áurea (1888), com a terra regida pela Lei de Terras (nº 601, 1850) — mas este é o seu lado
  brasileiro, receptor, sem travessia atlântica. [CONTEXTUAL]
