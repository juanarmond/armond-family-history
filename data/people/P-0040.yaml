notes:
- text: >-
    Father of Susanna (Suzana) Rita Brandão (P-0020); hence Deocleciano Muniz
    Bittencourt's maternal grandfather and Antenor Muniz's maternal
    great-grandfather. Named in his daughter's 1866 baptism (PAR-0005) as her
    legitimate father, and again as a godparent of his granddaughter Anna's 1885
    baptism (PAR-0006). A Brandão family of the Santo Antônio de Sapucaia (RJ)
    parish, later resident at Santa Luzia de Carangola (MG).
  text_pt: >-
    Pai de Susanna (Suzana) Rita Brandão (P-0020); portanto avô materno de
    Deocleciano Muniz Bittencourt e bisavô materno de Antenor Muniz. Nomeado no
    batismo de 1866 de sua filha (PAR-0005) como seu pai legítimo, e novamente como
    padrinho no batismo de 1885 de sua neta Anna (PAR-0006). Uma família Brandão da
    freguesia de Santo Antônio de Sapucaia (RJ), depois residente em Santa Luzia de
    Carangola (MG).
- text: >-
    Died 3 October 1912 at Carangola, aged 79 (born c.1833), a widower of Rita
    (P-0041), per his own death register (PAR-0008 → event E-0037). His parents were
    José do Rego Brandão [o velho] (P-0043) and Maria de Mendonça (P-0044) — family
    F-0021. Nationality recorded as "brasileiro" in that óbito.
  text_pt: >-
    Falecido em 3 de outubro de 1912 em Carangola, com 79 anos (nascido c.1833), viúvo
    de Rita (P-0041), conforme seu próprio registro de óbito (PAR-0008 → evento
    E-0037). Seus pais foram José do Rego Brandão [o velho] (P-0043) e Maria de Mendonça
    (P-0044) — família F-0021. Nacionalidade registrada como "brasileiro" nesse óbito.
