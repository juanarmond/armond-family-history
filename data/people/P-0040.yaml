profile: >-
  ## Interesting facts

  - **[PROVEN]** He and his wife were the godparents newly arrived Azorean immigrants asked for. They stood as *padrinhos* at the 1885 baptism of Anna, daughter of João Muniz Bittencourt (PAR-0006) — by then their own son-in-law — and the family research records the same couple sponsoring other Muniz children. Being the household newcomers ask to sponsor their children is a precise index of settled local standing.

  - **[PROVEN]** His death act reaches back a further generation: it names his parents **José do Rego Brandão** (P-0043) and **Maria de Mendonça** (P-0044), so father and son carried the identical full name (PAR-0008). The repetition is deliberate naming, and it is the only thing this branch is documented transmitting.

  - **[PROVEN]** He died at Carangola on 3 October 1912, aged 79, of "ataque", **"sem sacramentos"** — without the last rites (PAR-0008). His wife Rita had died there in 1898 with "Não procuraram Confissão" noted against her name (PAR-0009). Their own elders at Sapucaia had died inside the church: her father Antonio Caetano Machado was buried in 1868 "sacramentado com os Sacramentos" (PAR-0010). The family's relationship with the parish visibly changes after the move.

  - **[PROVEN]** He is still being named as a grandparent at Sapucaia in January 1890 (CIV-0041) and is dead at Carangola in 1912; his wife died at Carangola in January 1898. He therefore made the Rio de Janeiro to Minas Gerais move somewhere between 1890 and 1898, in his late fifties or early sixties — following married children, not opportunity.

  - **[INFERRED]** His surname coincides with an entirely unrelated Azorean **Medeiros Brandão** family in the same descendant line: his son-in-law's own great-grandfather was João de Medeiros Brandão of Povoação, São Miguel (P-0084, PAR-0037). No record connects the two families, and they must never be merged.

  ## Identity

  **José do Rego Brandão** — the Rego Brandão householder of Santo Antônio de Sapucaia, distinguished from his identically named father only by generation. [PROVEN]

  - **Relationship:** great-grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs José → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derived from families F-0019, F-0007 and F-0001]

  - **Born:** about **1833** (aged 79 at death, PAR-0008); recorded "brasileiro" and Catholic in that act. [PROVEN]

  - **Parents:** José do Rego Brandão [the elder] (P-0043) and Maria de Mendonça (P-0044), family F-0021, named in his own 1912 death (PAR-0008). [PROVEN]

  - **Marriage:** Rita Ignacia de Jesus (P-0041), who appears in her married form "Rita do Rego Brandão"; he was already her widower at his death, she having died on 4 January 1898 (PAR-0009, PAR-0008). [PROVEN]

  - **Children:** Susanna (Suzana) Rita Brandão (P-0020), born 20 August 1865 and baptised 22 March 1866 (PAR-0005). Other Carangola Brandão women are floated as possible daughters and remain unconfirmed; the 1906 Carangola death of a different "Lina Rita Brandão", wife of João de Souza Freitas, who died in childbirth at 32, is expressly **not** of this couple's established set and is a **[LEAD]** only. [PROVEN for Susanna]

  - **Death:** 3 October 1912 at Santa Luzia de Carangola (MG), commended and buried the following day; cause "ataque"; without the sacraments; officiant Pe. Antonio Affonso [Laurson — uncertain read] (PAR-0008). [PROVEN]

  ## Standing and profession

  No occupation, title, office or property is stated for him in any held record — no inventário, no land register, no title, no press mention. [PROVEN as a negative across the held set] What *is* documented is a social role: godparent to immigrant Muniz children (PAR-0006), maternal grandparent named in a civil birth act (CIV-0041), and, per the family research, a wedding witness alongside João Muniz Bittencourt in July 1885 [LEAD]. His literacy is undocumented; no held act carries his signature. [OPEN]

  ## Family and social network

  Father of Susanna (P-0020), who married the Azorean immigrant João Monis Bittencourt (P-0019); thereby father-in-law to the Muniz line and Deocleciano's maternal grandfather. His parents (P-0043 × P-0044) push the Brandão line up one further generation, and his wife's father Antonio Caetano Machado (P-0045, born about 1798) reaches deeper still on the maternal side. The repeated godparent bond with the newly arrived Muniz brothers marks his household as the established native anchor that received and integrated them; his daughter's marriage converted that bond into kinship.

  ## What we can extrapolate

  **1. His standing was earned and held socially, not owned. [INFERRED / CONTEXTUAL]** He leaves no estate, no title and no land record, yet immigrants asked him to sponsor their children and a registrar wrote his name into a civil birth act as a grandparent of record. In a frontier community that is a measurable thing: *belonging*. It is also precisely the asset the propertyless newcomer João Muniz Bittencourt could not import and therefore married into. Classify the standing honestly, though — it was neither inherited wealth nor an office with an income. It was a settled reputation, which is to say a form of capital with no cash value and no legal existence.

  **2. Rootedness is the only capital partible inheritance cannot touch — and the only one a move can destroy outright. [INFERRED]** Brazilian law divided estates equally among all children, fragmenting a holding within about two generations; his household was exempt from that arithmetic because there was nothing to divide. But the exemption came at a price the records make visible. Social standing is specific to a place. Between 1890 and 1898 he left Sapucaia, where three generations of his and his wife's families were embedded in the parish, and arrived at Carangola in his sixties as a stranger. **The land he did not own could not be lost; the standing he did have could not be moved.** Nothing from the Sapucaia reputation reappears in the Carangola record.

  **3. The sacraments are the evidence for that loss, and they are documented. [INFERRED]** At Sapucaia in 1868 his father-in-law was buried "sacramentado", the priest named, the entry unhurried (PAR-0010); his mother-in-law was buried in 1878 with a physician's diagnosis recorded (PAR-0011). At Carangola his wife died in 1898 with "Não procuraram Confissão" (PAR-0009) and he died in 1912 "sem sacramentos" (PAR-0008). Two deaths inside the church, two outside it, the difference being one migration. Read carefully this is not evidence of lost faith but of lost proximity and lost standing: a household that had been at the centre of its parish was, in the new one, simply another rural family the priest reached too late.

  **4. Following the children is the same strategy the Azevedo widow used. [INFERRED / CONTEXTUAL]** He moved in his late fifties, after his daughter's family had gone — the identical move that Thereza Fernandes de Azevedo (P-0039) made in the other branch a generation later. It is what households without property do: they relocate toward their kin, because kin are the only security they have. The mechanism repeats twice in this small tree, which is a stronger signal than either instance alone.

  **5. Education does not appear at all, in any generation of his household. [CONTEXTUAL]** No autograph of his survives, and none of his wife's. Schooling was a purchased, class-linked privilege in nineteenth-century rural Brazil with no public provision to fall back on, and it had to be re-bought each generation. The first documented signature anywhere in this descent is his grandson Deocleciano's, on his 1916 marriage act (CIV-0006) — one generation after the family reached Carangola and two after José himself.

  **6. The arc is not a fall. [INFERRED]** It is worth saying what this branch is not: there is no lost fortune, no office that stopped paying, no estate divided away. Across four documented generations — Antonio Caetano Machado (born about 1798), Rita, José, Susanna — the family works land it is not recorded as owning, holds no office and accumulates nothing, while maintaining a reputation good enough to sponsor other people's children. The line moves twice, each time with the coffee frontier, and ends with descendants selling labour in cities. His branch looks respectable and leaves almost no material trace because respectability was the whole of it.

  ## Open questions

  - His baptism, about 1833 — would name his parents at primary level and fix the family's location before Sapucaia (which was erected as a freguesia only in 1871, so his own baptism lies in a predecessor parish). [OPEN]

  - His marriage to Rita Ignacia de Jesus, before 1865 — would confirm her maiden name against her married form and name her mother. The Sapucaia marriage books begin in 1885, so this act sits in the undigitised pre-1885 volumes of the predecessor parish. [OPEN]

  - The full set of his children — no inventário and no "N filhos" statement exists for him or his wife, so there is no record-based denominator. [OPEN]

  ## Sources held (this repository)

  - PAR-0008 (his 1912 Carangola death — age, nationality, widower status, cause, absence of sacraments, and his own parents) · PAR-0009 (his wife Rita's 1898 Carangola death, as "Rita do Rego Brandão").

  - PAR-0005 (his daughter Susanna's 1866 baptism transcript — names him her father) · PAR-0006 (his granddaughter Anna's 1885 baptism — names him and Rita as godparents) · CIV-0041 (his granddaughter Ritta's 1890 civil birth — names him and Rita as the maternal grandparents).

  ## Regional and migration context

  A settled Rego Brandão householder of **Santo Antônio de Sapucaia**, in the Paraíba do Sul valley (RJ) — the older Brazilian coffee zone, whose labour system was rebuilt twice in his lifetime, first by the Lei nº 581 de 1850 (Lei Eusébio de Queirós) ending the Atlantic slave trade and then by abolition under the Lei Áurea (1888). It was the first of those that drew the Azorean immigrants his family sponsored. [CONTEXTUAL] Between 1890 and 1898 he relocated west to **Carangola**, in the Zona da Mata Mineira, the same move the Muniz household made as the coffee frontier shifted off the exhausted Paraíba soils; he died there in 1912. No held record states a reason for the move, so the driver is inferred from the regional history and from the fact that his married daughter had gone first. [CONTEXTUAL / INFERRED] This is Brazilian internal migration, not an Atlantic crossing; his origin before Sapucaia is open, and nothing is inferred from the surname.

  ## Where to go today

  - **Family life & godparent record:** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Death (3 October 1912):** Carangola, MG — Paróquia de Santa Luzia (Praça Cel. Maximiano 138) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele e a esposa eram os padrinhos que os açorianos recém-chegados pediam. Foram *padrinhos* no batismo, em 1885, de Anna, filha de João Muniz Bittencourt (PAR-0006) — já então seu genro — e a pesquisa da família registra o mesmo casal apadrinhando outros filhos Muniz. Ser o lar a quem os recém-chegados pedem que apadrinhe seus filhos é um índice preciso de posição local consolidada.

  - **[PROVEN]** Seu ato de óbito alcança mais uma geração acima: nomeia seus pais **José do Rego Brandão** (P-0043) e **Maria de Mendonça** (P-0044), de modo que pai e filho levavam o nome completo idêntico (PAR-0008). A repetição é nomeação deliberada, e é a única coisa que este ramo está documentado transmitindo.

  - **[PROVEN]** Morreu em Carangola em 3 de outubro de 1912, aos 79 anos, de "ataque", **"sem sacramentos"** (PAR-0008). Sua esposa Rita havia morrido ali em 1898 com "Não procuraram Confissão" anotado contra seu nome (PAR-0009). Os mais velhos deles, em Sapucaia, tinham morrido dentro da igreja: o pai dela, Antonio Caetano Machado, foi sepultado em 1868 "sacramentado com os Sacramentos" (PAR-0010). A relação da família com a paróquia muda visivelmente depois da mudança.

  - **[PROVEN]** Ele ainda é nomeado como avô em Sapucaia em janeiro de 1890 (CIV-0041) e está morto em Carangola em 1912; sua esposa faleceu em Carangola em janeiro de 1898. Fez, portanto, a mudança do Rio de Janeiro para Minas Gerais entre 1890 e 1898, perto dos sessenta anos — seguindo filhos casados, não uma oportunidade.

  - **[INFERRED]** Seu sobrenome coincide com o de uma família açoriana **Medeiros Brandão** inteiramente sem parentesco na mesma linha descendente: o próprio bisavô de seu genro era João de Medeiros Brandão, da Povoação, São Miguel (P-0084, PAR-0037). Nenhum registro liga as duas famílias, e elas jamais devem ser fundidas.

  ## Identidade

  **José do Rego Brandão** — o chefe de casa Rego Brandão de Santo Antônio de Sapucaia, distinguido de seu pai homônimo apenas pela geração. [PROVEN]

  - **Parentesco:** bisavô de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre José → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derivado das famílias F-0019, F-0007 e F-0001]

  - **Nascimento:** por volta de **1833** (79 anos ao falecer, PAR-0008); registrado "brasileiro" e católico nesse ato. [PROVEN]

  - **Pais:** José do Rego Brandão [o velho] (P-0043) e Maria de Mendonça (P-0044), família F-0021, nomeados em seu próprio óbito de 1912 (PAR-0008). [PROVEN]

  - **Casamento:** Rita Ignacia de Jesus (P-0041), que aparece na forma de casada "Rita do Rego Brandão"; ele já era viúvo dela ao morrer, tendo ela falecido em 4 de janeiro de 1898 (PAR-0009, PAR-0008). [PROVEN]

  - **Filhos:** Susanna (Suzana) Rita Brandão (P-0020), nascida em 20 de agosto de 1865 e batizada em 22 de março de 1866 (PAR-0005). Outras mulheres Brandão de Carangola são aventadas como possíveis filhas e permanecem não confirmadas; o óbito de 1906, em Carangola, de uma "Lina Rita Brandão" diferente, esposa de João de Souza Freitas, falecida de parto aos 32 anos, expressamente **não** pertence ao conjunto estabelecido deste casal e é apenas **[LEAD]**. [PROVEN quanto a Susanna]

  - **Óbito:** 3 de outubro de 1912, em Santa Luzia de Carangola (MG), encomendado e sepultado no dia seguinte; causa "ataque"; sem os sacramentos; celebrante Pe. Antonio Affonso [Laurson — leitura incerta] (PAR-0008). [PROVEN]

  ## Posição social e profissão

  Nenhuma ocupação, título, cargo ou propriedade lhe é declarada em qualquer registro conservado — nenhum inventário, registro de terras, título ou menção de imprensa. [PROVEN como negativa no conjunto disponível] O que *está* documentado é um papel social: padrinho de filhos de imigrantes Muniz (PAR-0006), avô materno nomeado num assento civil de nascimento (CIV-0041) e, conforme a pesquisa da família, testemunha de casamento ao lado de João Muniz Bittencourt em julho de 1885 [LEAD]. Sua alfabetização não está documentada; nenhum ato conservado traz sua assinatura. [OPEN]

  ## Família e rede social

  Pai de Susanna (P-0020), que se casou com o imigrante açoriano João Monis Bittencourt (P-0019); por isso sogro da linha Muniz e avô materno de Deocleciano. Seus pais (P-0043 × P-0044) elevam a linha Brandão mais uma geração, e o pai de sua esposa, Antonio Caetano Machado (P-0045, nascido por volta de 1798), alcança ainda mais fundo pelo lado materno. O vínculo repetido de apadrinhamento com os irmãos Muniz recém-chegados marca seu lar como a âncora nativa estabelecida que os recebeu e integrou; o casamento da filha converteu esse vínculo em parentesco.

  ## O que podemos extrapolar

  **1. Sua posição foi conquistada e mantida socialmente, não possuída. [INFERRED / CONTEXTUAL]** Ele não deixa espólio, título nem registro de terras, e ainda assim imigrantes lhe pediam para apadrinhar seus filhos e um escrivão escreveu seu nome num assento civil de nascimento como avô de registro. Numa comunidade de fronteira isso é algo mensurável: *pertencimento*. É também exatamente o ativo que o recém-chegado sem bens João Muniz Bittencourt não podia importar e por isso obteve pelo casamento. Classifique-se a posição com honestidade, porém — não era riqueza herdada nem cargo com renda. Era uma reputação estabelecida, ou seja, uma forma de capital sem valor em caixa e sem existência jurídica.

  **2. O enraizamento é o único capital que a herança partível não toca — e o único que uma mudança pode destruir de vez. [INFERRED]** A lei brasileira dividia os espólios igualmente entre todos os filhos, fragmentando uma posse em cerca de duas gerações; seu lar estava isento dessa aritmética porque não havia o que dividir. Mas a isenção teve um preço que os registros tornam visível. A posição social é específica de um lugar. Entre 1890 e 1898 ele deixou Sapucaia, onde três gerações de sua família e da família da esposa estavam entranhadas na paróquia, e chegou a Carangola, aos sessenta e poucos, como um estranho. **A terra que não possuía não podia ser perdida; a posição que de fato tinha não podia ser transportada.** Nada da reputação de Sapucaia reaparece no registro de Carangola.

  **3. Os sacramentos são a evidência dessa perda, e estão documentados. [INFERRED]** Em Sapucaia, em 1868, seu sogro foi sepultado "sacramentado", com o padre nomeado e o assento sem pressa (PAR-0010); sua sogra foi sepultada em 1878 com um diagnóstico médico registrado (PAR-0011). Em Carangola, sua esposa morreu em 1898 com "Não procuraram Confissão" (PAR-0009) e ele morreu em 1912 "sem sacramentos" (PAR-0008). Duas mortes dentro da igreja, duas fora dela, e a diferença é uma migração. Lido com cuidado, isso não é evidência de fé perdida, mas de proximidade e posição perdidas: um lar que estivera no centro de sua paróquia era, na nova, apenas mais uma família rural que o padre alcançou tarde demais.

  **4. Seguir os filhos é a mesma estratégia usada pela viúva Azevedo. [INFERRED / CONTEXTUAL]** Ele se mudou perto dos sessenta anos, depois que a família da filha havia partido — a mudança idêntica que Thereza Fernandes de Azevedo (P-0039) fez no outro ramo, uma geração depois. É o que fazem os lares sem propriedade: deslocam-se em direção à parentela, porque a parentela é a única segurança que têm. O mecanismo se repete duas vezes nesta pequena árvore, o que é um sinal mais forte do que qualquer uma das ocorrências isoladas.

  **5. A educação não aparece em geração alguma de seu lar. [CONTEXTUAL]** Nenhum autógrafo seu sobrevive, nem da esposa. A escolarização era privilégio comprado e ligado à classe no Brasil rural oitocentista, sem oferta pública a que recorrer, e tinha de ser recomprada a cada geração. A primeira assinatura documentada em toda esta descendência é a de seu neto Deocleciano, no ato de casamento de 1916 (CIV-0006) — uma geração depois de a família chegar a Carangola e duas depois do próprio José.

  **6. O arco não é uma queda. [INFERRED]** Vale dizer o que este ramo não é: não há fortuna perdida, cargo que deixou de pagar, espólio dividido. Ao longo de quatro gerações documentadas — Antonio Caetano Machado (nascido por volta de 1798), Rita, José, Susanna — a família lavra terra que não consta como sua, não ocupa cargo algum e nada acumula, mantendo ao mesmo tempo uma reputação boa o bastante para apadrinhar os filhos alheios. A linha se move duas vezes, ambas com a fronteira cafeeira, e termina com descendentes vendendo trabalho nas cidades. Seu ramo parece respeitável e quase não deixa rastro material porque a respeitabilidade era tudo o que havia.

  ## Questões em aberto

  - Seu batismo, por volta de 1833 — nomearia seus pais em nível primário e fixaria a localização da família antes de Sapucaia (erigida em freguesia apenas em 1871, de modo que seu batismo está numa paróquia antecessora). [OPEN]

  - Seu casamento com Rita Ignacia de Jesus, antes de 1865 — confirmaria o nome de solteira dela frente à forma de casada e nomearia a mãe dela. Os livros de casamento de Sapucaia começam em 1885, de modo que esse ato está nos volumes não digitalizados anteriores a 1885 da paróquia antecessora. [OPEN]

  - O conjunto completo de seus filhos — não existe inventário nem declaração de "N filhos" para ele ou para a esposa, de modo que não há denominador documental. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0008 (seu óbito de 1912 em Carangola — idade, nacionalidade, condição de viúvo, causa, ausência de sacramentos e seus próprios pais) · PAR-0009 (o óbito de 1898 de sua esposa Rita em Carangola, como "Rita do Rego Brandão").

  - PAR-0005 (a transcrição do batismo de 1866 de sua filha Susanna — nomeia-o como pai dela) · PAR-0006 (o batismo de 1885 de sua neta Anna — nomeia-o, com Rita, como padrinhos) · CIV-0041 (o nascimento civil de 1890 de sua neta Ritta — nomeia-o, com Rita, como o casal de avós maternos).

  ## Contexto regional e migratório

  Um chefe de casa Rego Brandão estabelecido em **Santo Antônio de Sapucaia**, no vale do Paraíba do Sul (RJ) — a zona cafeeira brasileira mais antiga, cujo sistema de trabalho foi refeito duas vezes em sua vida, primeiro pela Lei nº 581 de 1850 (Lei Eusébio de Queirós), que encerrou o tráfico atlântico, e depois pela abolição sob a Lei Áurea (1888). Foi a primeira delas que atraiu os imigrantes açorianos apadrinhados por sua família. [CONTEXTUAL] Entre 1890 e 1898 ele se deslocou para oeste, até **Carangola**, na Zona da Mata Mineira, a mesma mudança feita pelo lar Muniz quando a fronteira cafeeira saiu dos solos exauridos do Paraíba; ali morreu em 1912. Nenhum registro conservado declara um motivo para a mudança, de modo que o fator é inferido da história regional e do fato de que a filha casada havia partido antes. [CONTEXTUAL / INFERRED] É migração interna brasileira, não travessia atlântica; sua origem anterior a Sapucaia está em aberto, e nada é inferido do sobrenome.

  ## Onde ir hoje

