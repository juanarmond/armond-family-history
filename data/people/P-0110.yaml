profile: >-
  ## Identity

  **Elisabeth Storck** (recorded at Nova Friburgo as **Isabel Stork**, and as **Isabella Storck**
  in her 1840 marriage act) — a German-born colonist of the Nova Friburgo settlement, wife of the
  Swiss immigrant João José Rutschmann (P-0109) and mother of Maria Joanna Rutschmann (P-0037).
  Her 1840 marriage act records her as born and baptised in Germany ("nascida e baptizada na
  Allemanha"). [PROVEN (identity, family role, German birth) — PAR-0076]

  - **Role:** mother of Maria Joanna Rutschmann (P-0037); wife of João José Rutschmann
  (P-0109); family F-0054. [PROVEN]

  - **Name variants:** "Elisabeth Storck" in her daughter's 1841 baptism (PAR-0069);
  "Isabel Stork" in her daughter's 1859 marriage (PAR-0070) and in her husband's 1860 death
  entry (PAR-0071). [PROVEN]

  - **Birth and death:** her German birth is established at country level by her 1840 marriage
  act ("nascida e baptizada na Allemanha", PAR-0076); the exact date and the specific locality
  are not established from held records. A secondary source gives birth c. 1812 at Blödesheim
  (Osthofen), Hessen-Darmstadt, and death 5 July 1889 at Nova Friburgo. [PROVEN (Germany,
  country) — PAR-0076; LEAD (c. 1812, Blödesheim/Hessen, death 1889) — Raibert Storck ship
  transcription and FS Tree]

  ## Immigration and settlement

  A secondary transcription of Nova Friburgo colony records places her in her father's
  household aboard the ship *Caroline*, reaching Nova Friburgo on 3 May 1824 and assigned
  Casa 72 / Lote 78 — origin noted as Blödesheim, Osthofen, Hessen-Darmstadt. She would
  have arrived as a child of approximately 12. The parents it names, Jacob Storck × Anna
  Clara, agree with her 1840 marriage act (PAR-0076); the maiden surname "Reheis" appears
  only in this transcription, not in the record. [LEAD — Raibert Storck ship transcription;
  no held primary names her on this passage]

  ## Family and social network

  She married João José Rutschmann (P-0109) at Nova Friburgo on 23 June 1840; the marriage act
  is held (PAR-0076, event E-0121). He later names her in his 1860 death entry ("cazado com
  Isabel Stork"), and that he is recorded as married rather than a widower ("viúvo") implies she
  was still alive at the date of his death (July 1860). [PROVEN (marriage 23 Jun 1840) —
  PAR-0076; INFERRED (alive 1860) — PAR-0071 records him married, not widowed] Their daughter
  Maria Joanna married Antonio da Silva Ferreira in 1859, linking this Nova Friburgo colonist
  line to a Portuguese immigrant trunk (F-0017). [PROVEN (couple identity)]

  ## Open questions

  - Her exact birth date and specific German locality (reportedly Blödesheim/Osthofen, Hessen,
  ~1812) — her country of birth and her parents are now primary-established (PAR-0076), but the
  local register would confirm the precise date and place. [OPEN (exact date and locality)]

  - Her mother Anna Clara's maiden surname ("Reheis" is a collaborative-tree lead, not in the
  record) and any fuller form of her father's name (recorded only as "Tiago"/Jacob Storck).
  [OPEN]

  - Her death record (NF, reportedly 1889) — still not located; would confirm the date. [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (her own 1840 Nova Friburgo marriage act to João José Rutschmann — primary record
  for the marriage date, her German birth ("nascida e baptizada na Allemanha"), and her parents:
  "filha legitima de Tiago Storck e de Anna Clara já fallecida").

  - PAR-0069 (her daughter's 1841/42 Nova Friburgo baptism — names her as "Elisabeth Storck").

  - PAR-0070 (her daughter's 1859 Nova Friburgo marriage — names her as "Isabel Stork").

  - PAR-0071 (her husband's 1860 Nova Friburgo death entry — names her as his wife "Isabel
  Stork"; he is recorded married rather than widowed, which indicates she was then living).
profile_pt: >-
  ## Identidade

  **Elisabeth Storck** (registada em Nova Friburgo como **Isabel Stork** e como **Isabella
  Storck** em seu assento matrimonial de 1840) — colonista de Nova Friburgo nascida na Alemanha,
  esposa do imigrante suíço João José Rutschmann (P-0109) e mãe de Maria Joanna Rutschmann
  (P-0037). Seu assento matrimonial de 1840 registra-a como nascida e baptizada na Alemanha
  ("nascida e baptizada na Allemanha"). [PROVEN (identidade, papel familiar e nascimento na
  Alemanha) — PAR-0076]

  - **Papel:** mãe de Maria Joanna Rutschmann (P-0037); esposa de João José Rutschmann
  (P-0109); família F-0054. [PROVEN]

  - **Variantes do nome:** "Elisabeth Storck" no batismo de sua filha em 1841 (PAR-0069);
  "Isabel Stork" no casamento de sua filha em 1859 (PAR-0070) e no registro de óbito de
  seu marido em 1860 (PAR-0071). [PROVEN]

  - **Nascimento e óbito:** seu nascimento na Alemanha está estabelecido em nível de país pelo
  assento matrimonial de 1840 ("nascida e baptizada na Allemanha", PAR-0076); a data exata e a
  localidade específica não estão estabelecidas por registros primários. Fonte secundária indica
  nascimento c. 1812 em Blödesheim (Osthofen), Hessen-Darmstadt, e óbito em 5 de julho de 1889
  em Nova Friburgo. [PROVEN (Alemanha, país) — PAR-0076; LEAD (c. 1812, Blödesheim/Hessen, óbito
  1889) — transcrição Raibert Storck e FS Tree]

  ## Imigração e estabelecimento

  Uma transcrição secundária dos registros de colonização de Nova Friburgo situa-a no grupo
  familiar de seu pai a bordo do navio *Caroline*, que chegou a Nova Friburgo em 3 de maio
  de 1824 com a Casa 72 / Lote 78 atribuída — origem registrada como Blödesheim, Osthofen,
  Hessen-Darmstadt. Ela teria chegado com cerca de 12 anos de idade. Os pais que ela indica,
  Jacob Storck × Anna Clara, concordam com o assento matrimonial de 1840 (PAR-0076); o sobrenome
  de solteira "Reheis" aparece apenas nessa transcrição, não no registro. [LEAD — transcrição
  Raibert Storck; nenhum documento primário a nomeia nessa passagem]

  ## Família e rede social

  Casou-se com João José Rutschmann (P-0109) em Nova Friburgo em 23 de junho de 1840; o assento
  matrimonial está disponível (PAR-0076, evento E-0121). Ele mais tarde nomeia-a em seu registro
  de óbito de 1860 ("cazado com Isabel Stork"), e o fato de constar como casado, e não como
  viúvo, implica que ela ainda estava viva na data da morte do marido (julho de 1860). [PROVEN
  (casamento 23 jun. 1840) — PAR-0076; INFERRED (viva em 1860) — PAR-0071 registra-o casado, não
  viúvo] Sua filha Maria Joanna casou-se com Antonio da Silva Ferreira em 1859, unindo esta
  linhagem de colonistas de Nova Friburgo a um tronco de imigrantes portugueses (F-0017). [PROVEN
  (identidade do casal)]

  ## Questões em aberto

  - Sua data exata de nascimento e a localidade alemã específica (supostamente Blödesheim/
  Osthofen, Hessen, ~1812) — seu país de nascimento e sua filiação já estão estabelecidos como
  primários (PAR-0076), mas o registro local confirmaria a data e o lugar precisos. [OPEN (data
  exata e localidade)]

  - O sobrenome de solteira de sua mãe Anna Clara ("Reheis" é um lead de árvore colaborativa,
  não consta no registro) e uma forma mais completa do nome do pai (registrado apenas como
  "Tiago"/Jacob Storck). [OPEN]

  - Seu registro de óbito (NF, supostamente 1889) — ainda não localizado; confirmaria a data.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0076 (seu próprio assento matrimonial de 1840 em Nova Friburgo com João José Rutschmann
  — fonte primária para a data do casamento, seu nascimento na Alemanha ("nascida e baptizada na
  Allemanha") e sua filiação: "filha legitima de Tiago Storck e de Anna Clara já fallecida").

  - PAR-0069 (batismo de 1841/42 de sua filha em Nova Friburgo — nomeia-a como "Elisabeth
  Storck").

  - PAR-0070 (casamento de 1859 de sua filha em Nova Friburgo — nomeia-a como "Isabel Stork").

  - PAR-0071 (registro de óbito de 1860 de seu marido em Nova Friburgo — nomeia-a como esposa
  "Isabel Stork"; ele é registrado casado e não viúvo, o que indica que ela estava então viva).
