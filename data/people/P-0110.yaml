    Mother of Maria Joanna Rutschmann (P-0037); named "Elisabeth Storck" / "Isabel Stork" (variants)
    with her husband João José Rutschmann in their daughter's 1841 baptism (PAR-0069) and 1859
    marriage (PAR-0070), and as his wife in his 1860 death (PAR-0071); recorded "Isabella Storck" in
    their own 1840 marriage act (PAR-0076, event E-0121). German by birth — PAR-0076 states her
    "nascida e baptizada na Allemanha" (country level; the specific Blödesheim/Hessen locality remains
    a lead). Her parents are primary-named in that act as Jacob (Tiago) Storck (P-0121) × Anna Clara
    (P-0122), the latter "já fallecida" (deceased) by 1840; family F-0061. Anna Clara's maiden surname
    ("Reheis") is a collaborative-tree lead only, not in the record.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1840 marriage act states her origin in three words — "nascida e baptizada
  na **Allemanha**" — and no more. Germany at country level, with no state, district or parish.
  It is a real, record-stated origin and it is also the limit of what the document will give.
  (PAR-0076)

  - **[PROVEN]** She married without a living mother: the same act names her "filha legitima de
  Tiago Storck e de **Anna Clara já fallecida**". Her father is named without that qualifier, so
  he was apparently still alive in June 1840. (PAR-0076)

  - **[PROVEN]** She outlived her husband. When João José Rutschmann was buried in July 1860 the
  register described him as "cazado com Isabel Stork" — married, not widowed — which places her
  alive at that date after twenty years of marriage. (PAR-0071)

  - **[PROVEN]** Four held records give her name four ways: **Isabella Storck** (1840),
  **Elisabeth Storck** (1841/42), **Isabel Stork** (1859) and **Isabel Stork** again (1860). The
  German form survives only in the baptism entry; by the end she is fully Portuguesified in the
  parish books.

  - **[PROVEN / boundary crossed]** Her marriage joined the colony's two intakes: a German-born
  woman to a Swiss-born man from Bulle, at the Catholic Matriz, in 1840. Nineteen years later
  their daughter married a Portuguese immigrant. The "Swiss colony" label does not survive
  contact with this family's actual marriages.

  ## Identity

  **Elisabeth Storck**, recorded as **Isabella Storck** in her marriage act and as **Isabel
  Stork** in later entries — a German-born woman of the Nova Friburgo colony, wife of João José
  Rutschmann (P-0109) and mother of Maria Joanna Rutschmann (P-0037). Iris Bohrer Muniz's
  (P-0007) great-great-grandmother, by the chain Maria Joanna → Lucinda Ferreira da Silva
  (P-0031) → Celina Bohrer (P-0015). [PROVEN; degree derived from the family links]

  - **Birth:** in Germany, stated at country level only. No date, state or parish is given by
  any held record. [PROVEN for the country — PAR-0076; everything finer is OPEN]

  - **Parents:** legitimate daughter of Jacob Storck, written "Tiago Storck" (P-0121), and Anna
  Clara (P-0122), already deceased by June 1840; family F-0061. Her mother's maiden surname is
  not in the record. [PROVEN — PAR-0076]

  - **Marriage:** to João José Rutschmann on 23 June 1840 at the Matriz de São João Baptista,
  Nova Friburgo, before the coadjutor João José Vivianno, with João Balmat and Maria Fabre as
  witnesses. (PAR-0076, event E-0121) [PROVEN]

  - **Death:** unlocated. She was alive in July 1860. A secondary source gives 5 July 1889 at
  Nova Friburgo. [PROVEN for the lower bound; the 1889 date is a LEAD]

  - **Nationality:** German, on the strength of the 1840 act's "nascida e baptizada na
  Allemanha". [PROVEN at country level]

  ## Standing and profession

  Nothing is recorded — no occupation, property, literacy or signature in any of the four acts
  that name her. She appears as a bride, twice as a mother, and once as a living wife in her
  husband's burial entry. That is the full extent of her documented public life, and it is the
  normal shape of the evidence for colonist women in these registers.

  ## Family and social network

  Her wedding in 1840 and her daughter's baptism in 1842 share the same two people: João Balmat
  / Balineat and Maria Fabre stood as witnesses at the first and godparents at the second.
  [PROVEN — PAR-0076, PAR-0069] That repeated pairing is the only durable social relationship
  the records preserve for this household.

  Her daughter Maria Joanna (P-0037) was born 2 May 1841, baptised 20 February 1842, and married
  Antonio da Silva Ferreira — a Portuguese immigrant — on 3 March 1859, aged eighteen. [PROVEN —
  PAR-0069, PAR-0070] Her husband died the following year; she survived him. Her own father is
  named once, in 1840, and never again. [PROVEN — PAR-0076, PAR-0071]

  ## What we can extrapolate

  - **[CONTEXTUAL]** German settlers reached Nova Friburgo in a distinct second scheme. After
  Brazilian independence the agent Georg Anton Schäffer recruited in the German states, and
  around eighty families arrived on 3–4 May 1824, five years after the Swiss founding cohort,
  out of the same post-Napoleonic poverty and land shortage. A woman recorded as born in Germany
  and present at Nova Friburgo by 1840 most plausibly belongs to that intake — which is an
  inference from the colony's history, not a statement in her record.

  - **[LEAD]** Secondary transcriptions of the colony records place her in her father's
  household aboard the ship *Caroline*, arriving 3 May 1824 with Casa 72 / Lote 78, from
  Blödesheim (Osthofen) in Hessen-Darmstadt, and give her birth as about 1812 and her death as 5
  July 1889 at Nova Friburgo. The parents that transcription names agree with the 1840 act; the
  maiden surname "Reheis" it gives her mother does not appear in any record. If the ship lead
  holds she arrived a child of about twelve and spent essentially her whole life in the colony.

  - **[INFERRED]** Marrying a Swiss Catholic immigrant at the Catholic Matriz, rather than
  within the German Lutheran congregation that the 1824 wave founded, is worth noticing. It
  suggests either a Catholic German family or a straightforwardly practical choice of church in
  a small town — the record does not say which, and neither should be asserted.

  - **[CONTEXTUAL]** Her household stayed. The colony's characteristic movement was outward —
  poor lots abandoned within a few years, families dispersing across the fluminense highlands —
  but every held record places this one in the parish of São João Baptista from 1840 to 1860,
  and their daughter's line continued there.

  ## Open questions

  - Her exact birth date and German locality. The 1840 act gives only "na Allemanha"; the
  Blödesheim / Osthofen attribution and the date of about 1812 are secondary. The Evangelical
  register of Blödesheim (today Hochborn) would carry an 1812 baptism naming both parents.
  [OPEN]

  - Her death. She was alive in July 1860; the reported 5 July 1889 at Nova Friburgo is
  unconfirmed and the death record is not located. [OPEN]

  - Her mother's maiden surname. "Reheis" is a collaborative-tree form only, not in the 1840
  act, and is not adopted here. [LEAD / OPEN]

  - Whether the *Caroline* passage and Casa 72 / Lote 78 are her family's at primary level.
  [LEAD]

  ## Sources held (this repository)

  - **PAR-0076** — her own 1840 Nova Friburgo marriage act to João José Rutschmann; primary for
  the marriage, for her German birth at country level, and for her parents, with her mother
  already dead.

  - **PAR-0069** — her daughter Maria Joanna's 1841/42 baptism; names her "Elisabeth Storck".

  - **PAR-0070** — her daughter's 1859 marriage to Antonio da Silva Ferreira; names her "Isabel
  Stork".

  - **PAR-0071** — her husband's 1860 burial entry; names her as his wife and, by recording him
  married rather than widowed, indicates she was then living.

  ## Regional and migration context

  Nova Friburgo was decreed a Swiss Catholic colony in May 1818 and settled from 1819–20, but
  its population was mixed within six years: the German families recruited by Schäffer arrived
  in May 1824 and founded the town's Lutheran congregation. [CONTEXTUAL] Both intakes left a
  Europe of failed harvests, post-Napoleonic poverty and fragmented land, and both received the
  same stony highland lots. [CONTEXTUAL] Elisabeth Storck's documented life sits squarely at the
  seam between them: German-born, married to a Swiss-born naturalised Brazilian, in the Catholic
  parish church, with a daughter who married a Portuguese. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where she
  married in 1840, where her daughter was baptised in 1842 and married in 1859, and where her
  husband's burial was recorded in 1860. The present cathedral dates from 1869; her acts belong
  to the earlier church on the same site. [RESOLVED]

  - **Evangelische Laurentiuskirche, Hochborn (historic Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Rheinhessen, Germany · [Maps](https://maps.google.com/?q=49.7239,8.2008). The
  reported Storck origin parish; the village was renamed Hochborn in 1971 and the church still
  stands. An 1812 baptism here would confirm both her birth and her parents. [APPROX — the
  Blödesheim origin is a LEAD]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colony lots — including the reported Casa 72 / Lote 78 of her
  father's household — were laid out. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu assento de casamento de 1840 declara sua origem em três palavras — "nascida
  e baptizada na **Allemanha**" — e nada mais. Alemanha em nível de país, sem estado, distrito
  ou freguesia. É uma origem real, declarada pelo documento, e é também o limite do que ele
  fornece. (PAR-0076)

  - **[PROVEN]** Casou-se sem mãe viva: o mesmo assento a nomeia "filha legitima de Tiago Storck
  e de **Anna Clara já fallecida**". O pai é nomeado sem esse qualificador, de modo que
  aparentemente ainda vivia em junho de 1840. (PAR-0076)

  - **[PROVEN]** Sobreviveu ao marido. Quando João José Rutschmann foi sepultado em julho de
  1860, o assento o descreveu como "cazado com Isabel Stork" — casado, não viúvo —, o que a
  situa viva naquela data, após vinte anos de casamento. (PAR-0071)

  - **[PROVEN]** Quatro documentos retidos grafam seu nome de quatro maneiras: **Isabella
  Storck** (1840), **Elisabeth Storck** (1841/42), **Isabel Stork** (1859) e novamente **Isabel
  Stork** (1860). A forma alemã sobrevive apenas no assento de batismo; ao fim, ela está
  plenamente lusitanizada nos livros paroquiais.

  - **[PROVEN / fronteira cruzada]** Seu casamento uniu as duas entradas da colônia: uma mulher
  nascida na Alemanha e um homem nascido em Bulle, na Matriz católica, em 1840. Dezenove anos
  depois, a filha dos dois casou-se com um imigrante português. O rótulo de "colônia suíça" não
  sobrevive ao contato com os casamentos reais desta família.

  ## Identidade

  **Elisabeth Storck**, registrada como **Isabella Storck** em seu assento de casamento e como
  **Isabel Stork** nos posteriores — mulher nascida na Alemanha, da colônia de Nova Friburgo,
  esposa de João José Rutschmann (P-0109) e mãe de Maria Joanna Rutschmann (P-0037). Trisavó de
  Iris Bohrer Muniz (P-0007), pela cadeia Maria Joanna → Lucinda Ferreira da Silva (P-0031) →
  Celina Bohrer (P-0015). [PROVEN; grau derivado dos vínculos familiares]

  - **Nascimento:** na Alemanha, declarado apenas em nível de país. Nenhum documento retido dá
  data, estado ou freguesia. [PROVEN quanto ao país — PAR-0076; tudo mais fino está OPEN]

  - **Pais:** filha legítima de Jacob Storck, grafado "Tiago Storck" (P-0121), e de Anna Clara
  (P-0122), já falecida em junho de 1840; família F-0061. O sobrenome de solteira da mãe não
  consta do registro. [PROVEN — PAR-0076]

  - **Casamento:** com João José Rutschmann em 23 de junho de 1840, na Matriz de São João
  Baptista, Nova Friburgo, perante o coadjutor João José Vivianno, tendo João Balmat e Maria
  Fabre como testemunhas. (PAR-0076, evento E-0121) [PROVEN]

  - **Óbito:** não localizado. Estava viva em julho de 1860. Uma fonte secundária dá 5 de julho
  de 1889, em Nova Friburgo. [PROVEN quanto ao limite inferior; a data de 1889 é LEAD]

  - **Nacionalidade:** alemã, com base no "nascida e baptizada na Allemanha" do assento de 1840.
  [PROVEN em nível de país]

  ## Posição social e profissão

  Nada está registrado — nenhuma ocupação, propriedade, alfabetização ou assinatura em qualquer
  dos quatro atos que a nomeiam. Ela aparece como noiva, duas vezes como mãe e uma vez como
  esposa viva no assento de óbito do marido. É toda a extensão de sua vida pública documentada,
  e é o formato normal das evidências sobre mulheres colonas nesses livros.

  ## Família e rede social

  Seu casamento, em 1840, e o batismo da filha, em 1842, compartilham as mesmas duas pessoas:
  João Balmat / Balineat e Maria Fabre foram testemunhas no primeiro e padrinhos no segundo.
  [PROVEN — PAR-0076, PAR-0069] Esse par recorrente é a única relação social duradoura que os
  documentos preservam deste domicílio.

  A filha Maria Joanna (P-0037) nasceu em 2 de maio de 1841, foi batizada em 20 de fevereiro de
  1842 e casou-se com Antonio da Silva Ferreira — imigrante português — em 3 de março de 1859,
  aos dezoito anos. [PROVEN — PAR-0069, PAR-0070] O marido morreu no ano seguinte; ela o
  sobreviveu. Seu próprio pai é nomeado uma única vez, em 1840, e nunca mais. [PROVEN —
  PAR-0076, PAR-0071]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Os colonos alemães chegaram a Nova Friburgo por um segundo programa,
  distinto. Depois da independência do Brasil, o agente Georg Anton Schäffer recrutou nos
  estados alemães, e cerca de oitenta famílias chegaram em 3–4 de maio de 1824, cinco anos após
  a coorte fundadora suíça, saídas da mesma pobreza pós-napoleônica e escassez de terra. Uma
  mulher registrada como nascida na Alemanha e presente em Nova Friburgo já em 1840 pertence,
  com mais plausibilidade, a essa entrada — o que é inferência da história da colônia, não
  afirmação de seu registro.

  - **[LEAD]** Transcrições secundárias dos registros coloniais a situam no domicílio do pai, a
  bordo do navio *Caroline*, chegado em 3 de maio de 1824 com a Casa 72 / Lote 78, vindo de
  Blödesheim (Osthofen), em Hessen-Darmstadt, e dão seu nascimento por volta de 1812 e sua morte
  em 5 de julho de 1889, em Nova Friburgo. Os pais que essa transcrição nomeia coincidem com o
  assento de 1840; o sobrenome de solteira "Reheis" que ela atribui à mãe não aparece em nenhum
  registro. Se a pista do navio se sustentar, ela chegou criança, com cerca de doze anos, e
  passou praticamente toda a vida na colônia.

  - **[INFERRED]** Casar-se com um imigrante católico suíço na Matriz católica, e não na
  congregação luterana alemã fundada pela leva de 1824, merece atenção. Sugere uma família alemã
  católica ou, simplesmente, uma escolha prática de igreja numa vila pequena — o registro não
  diz qual, e nenhuma das duas deve ser afirmada.

  - **[CONTEXTUAL]** Seu domicílio permaneceu. O movimento característico da colônia era para
  fora — lotes pobres abandonados em poucos anos, famílias dispersando-se pela serra fluminense
  —, mas todos os documentos retidos situam este na freguesia de São João Baptista entre 1840 e
  1860, e a linha da filha ali continuou.

  ## Questões em aberto

  - Sua data exata de nascimento e a localidade alemã. O assento de 1840 dá apenas "na
  Allemanha"; a atribuição Blödesheim / Osthofen e a data de cerca de 1812 são secundárias. O
  livro evangélico de Blödesheim (hoje Hochborn) traria um batismo de 1812 nomeando ambos os
  pais. [OPEN]

  - Seu óbito. Estava viva em julho de 1860; a data relatada de 5 de julho de 1889, em Nova
  Friburgo, não está confirmada e o registro não foi localizado. [OPEN]

  - O sobrenome de solteira da mãe. "Reheis" é apenas forma de árvore colaborativa, não consta
  do assento de 1840 e não é adotada aqui. [LEAD / OPEN]

  - Se a travessia do *Caroline* e a Casa 72 / Lote 78 são de sua família, em nível primário.
  [LEAD]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — seu próprio assento matrimonial de 1840, em Nova Friburgo, com João José
  Rutschmann; primário para o casamento, para seu nascimento alemão em nível de país e para sua
  filiação, com a mãe já falecida.

  - **PAR-0069** — batismo de 1841/42 da filha Maria Joanna; nomeia-a "Elisabeth Storck".

  - **PAR-0070** — casamento de 1859 da filha com Antonio da Silva Ferreira; nomeia-a "Isabel
  Stork".

  - **PAR-0071** — assento de óbito de 1860 do marido; nomeia-a como esposa dele e, ao
  registrá-lo casado e não viúvo, indica que então estava viva.

  ## Contexto regional e migratório

  Nova Friburgo foi decretada colônia católica suíça em maio de 1818 e povoada a partir de
  1819–20, mas sua população já era mista em seis anos: as famílias alemãs recrutadas por
  Schäffer chegaram em maio de 1824 e fundaram a congregação luterana da vila. [CONTEXTUAL] As
  duas entradas deixaram uma Europa de colheitas perdidas, pobreza pós-napoleônica e terra
  fragmentada, e ambas receberam os mesmos lotes serranos pedregosos. [CONTEXTUAL] A vida
  documentada de Elisabeth Storck situa-se exatamente na costura entre elas: nascida alemã,
  casada com um suíço naturalizado brasileiro, na igreja paroquial católica, com uma filha que
  se casou com um português. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde se
  casou em 1840, onde a filha foi batizada em 1842 e casada em 1859, e onde foi lavrado o óbito
  do marido em 1860. A catedral atual é de 1869; seus atos pertencem à igreja anterior, no mesmo
  sítio. [RESOLVED]

  - **Evangelische Laurentiuskirche, Hochborn (a histórica Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Renânia-Hessiana, Alemanha · [Mapa](https://maps.google.com/?q=49.7239,8.2008). A
  freguesia de origem relatada dos Storck; a aldeia foi rebatizada Hochborn em 1971 e a igreja
  continua de pé. Um batismo de 1812 ali confirmaria tanto seu nascimento quanto sua filiação.
  [APPROX — a origem em Blödesheim é LEAD]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde foram demarcados os lotes da colônia — inclusive a relatada
  Casa 72 / Lote 78 do domicílio de seu pai. [APPROX]
