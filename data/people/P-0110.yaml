profile: >-
  ## Identity

  **Elisabeth Storck** (recorded at Nova Friburgo as **Isabel Stork**) — a colonist
  woman of the Nova Friburgo settlement, wife of the Swiss immigrant João José Rutschmann
  (P-0109) and mother of Maria Joanna Rutschmann (P-0037). Her nationality is left unset in
  this repository pending a record of her own origin. [PROVEN (identity and family role)]

  - **Role:** mother of Maria Joanna Rutschmann (P-0037); wife of João José Rutschmann
  (P-0109); family F-0054. [PROVEN]

  - **Name variants:** "Elisabeth Storck" in her daughter's 1841 baptism (PAR-0069);
  "Isabel Stork" in her daughter's 1859 marriage (PAR-0070) and in her husband's 1860 death
  entry (PAR-0071). [PROVEN]

  - **Birth and death:** not established from held records. A secondary source gives birth
  c. 1812 at Blödesheim (Osthofen), Hessen-Darmstadt, Germany, and death 5 July 1889 at
  Nova Friburgo. [LEAD — Raibert Storck ship transcription and FS Tree]

  ## Immigration and settlement

  A secondary transcription of Nova Friburgo colony records places her in her father's
  household aboard the ship *Caroline*, reaching Nova Friburgo on 3 May 1824 and assigned
  Casa 72 / Lote 78 — origin noted as Blödesheim, Osthofen, Hessen-Darmstadt. She would
  have arrived as a child of approximately 12. Her parents are given as Jacob Storck ×
  Anna Clara Reheis. [LEAD — Raibert Storck ship transcription; no held primary names her
  on this passage]

  ## Family and social network

  She is known as the wife of João José Rutschmann (P-0109), named in his 1860 death entry
  ("cazado com Isabel Stork"). That he is recorded as married rather than a widower ("viúvo")
  implies she was still alive at the date of his death (July 1860). [INFERRED (alive 1860) —
  PAR-0071 records him married, not widowed] Their daughter Maria Joanna married Antonio da
  Silva Ferreira in 1859, linking this Nova Friburgo colonist line to a Portuguese immigrant
  trunk (F-0017). [PROVEN (couple identity)]

  ## Open questions

  - Her birth record (Blödesheim/Osthofen, Hessen, ~1812) — the local register would confirm
  her date and parents; the identity of her father (Jacob vs Joannes Jacobus Storck) is an
  open naming question. [OPEN]

  - The Nova Friburgo marriage act for the Rutschmann × Storck union — date and filiation
  unresolved. [OPEN]

  - Her death record (NF, reportedly 1889) — would confirm the date and settle the father-name
  question. [OPEN]

  ## Sources held (this repository)

  - PAR-0069 (her daughter's 1841/42 Nova Friburgo baptism — names her as "Elisabeth Storck").

  - PAR-0070 (her daughter's 1859 Nova Friburgo marriage — names her as "Isabel Stork").

  - PAR-0071 (her husband's 1860 Nova Friburgo death entry — names her as his wife "Isabel
  Stork"; he is recorded married rather than widowed, which indicates she was then living).
profile_pt: >-
  ## Identidade

  **Elisabeth Storck** (registada em Nova Friburgo como **Isabel Stork**) — colonista
  da colônia de Nova Friburgo, esposa do imigrante suíço João José Rutschmann (P-0109) e
  mãe de Maria Joanna Rutschmann (P-0037). Sua nacionalidade permanece indefinida neste
  repositório até que um registro próprio confirme sua origem. [PROVEN (identidade e papel
  familiar)]

  - **Papel:** mãe de Maria Joanna Rutschmann (P-0037); esposa de João José Rutschmann
  (P-0109); família F-0054. [PROVEN]

  - **Variantes do nome:** "Elisabeth Storck" no batismo de sua filha em 1841 (PAR-0069);
  "Isabel Stork" no casamento de sua filha em 1859 (PAR-0070) e no registro de óbito de
  seu marido em 1860 (PAR-0071). [PROVEN]

  - **Nascimento e óbito:** não estabelecidos por registros primários disponíveis. Fonte
  secundária indica nascimento c. 1812 em Blödesheim (Osthofen), Hessen-Darmstadt, Alemanha,
  e óbito em 5 de julho de 1889 em Nova Friburgo. [LEAD — transcrição Raibert Storck e FS
  Tree]

  ## Imigração e estabelecimento

  Uma transcrição secundária dos registros de colonização de Nova Friburgo situa-a no grupo
  familiar de seu pai a bordo do navio *Caroline*, que chegou a Nova Friburgo em 3 de maio
  de 1824 com a Casa 72 / Lote 78 atribuída — origem registrada como Blödesheim, Osthofen,
  Hessen-Darmstadt. Ela teria chegado com cerca de 12 anos de idade. Seus pais são indicados
  como Jacob Storck × Anna Clara Reheis. [LEAD — transcrição Raibert Storck; nenhum
  documento primário a nomeia nessa passagem]

  ## Família e rede social

  É conhecida como esposa de João José Rutschmann (P-0109), nomeada em seu registro de óbito
  de 1860 ("cazado com Isabel Stork"). O fato de ele constar como casado, e não como viúvo,
  implica que ela ainda estava viva na data da morte do marido (julho de 1860). [INFERRED
  (viva em 1860) — PAR-0071 registra-o casado, não viúvo] Sua filha Maria Joanna casou-se com
  Antonio da Silva Ferreira em 1859, unindo esta linhagem de colonistas de Nova Friburgo a um
  tronco de imigrantes portugueses (F-0017). [PROVEN (identidade do casal)]

  ## Questões em aberto

  - Seu registro de nascimento (Blödesheim/Osthofen, Hessen, ~1812) — o registro local
  confirmaria a data e seus pais; a identidade do pai (Jacob vs Joannes Jacobus Storck) é
  uma questão onomástica em aberto. [OPEN]

  - O assento matrimonial Rutschmann × Storck em Nova Friburgo — data e filiação não
  resolvidas. [OPEN]

  - Seu registro de óbito (NF, supostamente 1889) — confirmaria a data e resolveria a questão
  do nome do pai. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0069 (batismo de 1841/42 de sua filha em Nova Friburgo — nomeia-a como "Elisabeth
  Storck").

  - PAR-0070 (casamento de 1859 de sua filha em Nova Friburgo — nomeia-a como "Isabel Stork").

  - PAR-0071 (registro de óbito de 1860 de seu marido em Nova Friburgo — nomeia-a como esposa
  "Isabel Stork"; ele é registrado casado e não viúvo, o que indica que ela estava então viva).
