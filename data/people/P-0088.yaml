profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Gonçallo Roiz já defunto" (already deceased) in his son's 1716 Ruivais marriage (PAR-0036) — the only document attesting him, placing him in São Martinho de Ruivais and confirming death before May 1716.

  - **[CONTEXTUAL]** His son João married in 1716 at Ruivais, and his grandson João Rodrigues Valle emigrated to Minas Gerais around 1748–1751 — two generations separating the Minho smallholder from the colonial Brazil settler, both shaped by the same land-pressure dynamic of Portugal's densest rural region (~96 inhabitants/km² by 1801).

  - **[INFERRED]** He may have been of the lugar de Frades in Ruivais (one reading of PAR-0036) — a named sub-locality implying a minimal but recognised landed position in the parish; a family at Frades had a defined holding, yet one too small to sustain all non-inheriting sons, which is precisely the structural driver that sent his grandson across the Atlantic.

  - **[INFERRED]** A thorough search of the Ruivais marriage register 1664–1706 failed to find his marriage to Elebia Francisca — a bounded negative suggesting the couple married in her home parish, meaning the generation above him cannot be reached through the Ruivais registers.

  ## Identity

  **Gonçalo Rodrigues** (recorded *Gonçallo Roiz* in the 1716 Ruivais marriage). Of the
  Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese.

  - **Role:** father of João Rodrigues (P-0080), named with his wife Elebia Francisca
  (P-0089) in their son's 13 May 1716 Ruivais marriage (PAR-0036; family F-0043).
  [strong-evidence — identifying that 1716 groom with P-0080 rests on the name-pair,
  parish and timeline match to P-0078's 1728 Ruivais baptism]

  - **Birth, death, own parents:** unrecorded. PAR-0036 reads him "já defunto"
  (preferred); the retrieval synthesis alternatively read "de Frades". [OPEN] A page-by-page
  read of the Ruivães marriage register 1664–1706 (retrieval) did not find his own marriage to
  Estêbia Francisca, so the couple most likely married in the bride's out-of-parish freguesia —
  the generation above him is therefore not reachable from the Ruivães registers. A further
  retrieval sweep (September 2026) of the Ruivães baptisms (1650–1674) and of the neighbouring
  Vieira do Minho parishes' marriages (Campos, Salamonde/São Gens, Ventosa, Cantelães) was also
  bounded-negative, so both Ruivães paths are exhausted; the highest-value unread lever is now
  the Montalegre/Barroso parishes across the Rabagão (Vila Real district, at the ADVR). A
  same-period "João, son of Gonçalo Rodrigues × Angela Pereira" in that register is flagged
  only to avoid conflation (a possible remarriage or a namesake), not our line. [LEAD]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of his son — names him as the groom's father).

  ## Regional and migration context

  Of São Martinho de Ruivais in the Minho highlands (Arcebispado de Braga), the origin
  parish of this branch; his grandson João Rodrigues Valle (P-0078) emigrated to Minas
  Gerais. He himself is not documented as leaving Portugal. [CONTEXTUAL] He is the
  non-emigrating Ruivães generation at the origin-end of that move: the Minho was Portugal's
  densest, most land-fragmented region — a smallholding minifúndio at ~96 inhabitants per km²
  by 1801 — whose surplus non-inheriting sons made it the single greatest source of
  18th-century Portuguese emigration to Brazil, his grandson's crossing falling under the
  Provisão de 20 de março de 1720 passport regime. [CONTEXTUAL]

  ## Where to go today

  - **His parish (of lugar de Frades; named in his son's 1716 marriage):** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga PT [DOCUMENTED-addr / RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeado "Gonçallo Roiz já defunto" (já falecido) no casamento de seu filho em Ruivais de 1716 (PAR-0036) — o único documento que o atesta, situando-o em São Martinho de Ruivais e confirmando morte antes de maio de 1716.

  - **[CONTEXTUAL]** Seu filho João casou-se em Ruivais em 1716, e seu neto João Rodrigues Valle emigrou para Minas Gerais por volta de 1748–1751 — duas gerações separando o pequeno proprietário minhoto do colono no Brasil colonial, ambas moldadas pela mesma dinâmica de pressão fundiária da região mais densa de Portugal (~96 habitantes/km² em 1801).

  - **[INFERRED]** Pode ter sido do lugar de Frades em Ruivais (uma leitura de PAR-0036) — uma sub-localidade nomeada que implica uma posição fundiária mínima mas reconhecida na paróquia; uma família em Frades tinha uma posse definida, porém pequena demais para sustentar todos os filhos não herdeiros, exatamente o motor estrutural que enviou seu neto para o outro lado do Atlântico.

  - **[INFERRED]** Uma pesquisa exaustiva no registro de casamentos de Ruivais de 1664–1706 não localizou seu casamento com Elebia Francisca — um negativo delimitado que sugere que o casal se casou na paróquia natal dela, significando que a geração acima dele não pode ser alcançada pelos registros de Ruivais.

  ## Identidade

  **Gonçalo Rodrigues** (registrado *Gonçallo Roiz* no casamento de 1716 em Ruivais). Da
  Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Português.

  - **Papel:** pai de João Rodrigues (P-0080), nomeado com sua mulher Elebia Francisca
  (P-0089) no casamento de 13 de maio de 1716 em Ruivais de seu filho (PAR-0036; família
  F-0043). [evidência forte — identificar aquele noivo de 1716 com P-0080 apoia-se na
  correspondência de nomes, paróquia e cronologia com o batismo de 1728 de P-0078 em
  Ruivais]

  - **Nascimento, óbito, pais próprios:** sem registro. PAR-0036 o lê "já defunto"
  (preferido); a síntese de recuperação leu alternativamente "de Frades". [OPEN] Uma leitura
  página a página do registro de casamentos de Ruivães de 1664–1706 (recuperação) não encontrou
  seu próprio casamento com Estêbia Francisca, de modo que o casal provavelmente se casou na
  freguesia de origem da noiva, fora da paróquia — a geração acima dele não é, portanto,
  alcançável pelos registros de Ruivães. Uma nova varredura de recuperação (setembro de 2026)
  dos batismos de Ruivães (1650–1674) e dos casamentos das freguesias vizinhas de Vieira do
  Minho (Campos, Salamonde/São Gens, Ventosa, Cantelães) também foi negativa e delimitada, de
  modo que ambos os caminhos por Ruivães estão esgotados; o lead de maior valor ainda não lido
  são as freguesias de Montalegre/Barroso do outro lado do Rabagão (distrito de Vila Real, no
  ADVR). Um "João, filho de Gonçalo Rodrigues × Angela Pereira" do mesmo período nesse registro
  é sinalizado apenas para evitar confusão (um possível segundo casamento ou um homônimo), não
  sendo nossa linha. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de seu filho — nomeia-o como pai do noivo).

  ## Contexto regional e migratório

  De São Martinho de Ruivais, nas terras altas do Minho (Arcebispado de Braga), a paróquia
  de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou para Minas Gerais.
  Ele próprio não está documentado como tendo deixado Portugal. [CONTEXTUAL] Ele é a geração
  não-emigrante de Ruivães na origem desse movimento: o Minho era a região mais densa e mais
  fragmentada em terra de Portugal — um minifúndio de pequenas propriedades, ~96 habitantes por
  km² em 1801 — cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada de
  emigração portuguesa setecentista para o Brasil, com a travessia de seu neto caindo sob o
  regime de passaportes da Provisão de 20 de março de 1720. [CONTEXTUAL]

  ## Onde ir hoje

  - **Sua paróquia (do lugar de Frades; nomeada no casamento de 1716 do filho):** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga PT [DOCUMENTED-addr / RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
