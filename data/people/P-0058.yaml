profile: >-
  ## Interesting facts

  - **[PROVEN]** Born 3 March 1764 at the Capela de São José do Ribeirão and baptised six
  days later (PAR-0049); died 9 February 1832, triggering the estate inventory that named
  all thirteen children (PRB-0010) — a primary-confirmed lifespan of 68 years, the most
  precisely documented on this branch of the tree.

  - **[PROVEN]** The same Lopes de Oliveira family appears twice around her: Coronel
  Joseph Lopes de Oliveira witnessed her parents' marriage in 1751, and thirteen years
  later a daughter of José Lopes de Oliveira stood godmother at her baptism. A colonel's
  household sponsoring an immigrant's marriage and then his child is a patronage
  relationship visible across two records.

  - **[CONTEXTUAL]** Her father João Rodrigues Valle was from São Martinho de Ruivães
  (Braga, Portugal) — making her the point where the Toledo line acquires its Portuguese
  Minho depth. The Minho was Portugal's most land-fragmented region and the single
  greatest source of 18th-century Portuguese emigration to Brazil, its surplus
  non-inheriting sons moving under the Provisão de 20 de março de 1720 passport regime.

  - **[PROVEN]** Her parents' 1751 marriage register carries a scribal correction in the
  margin: the vicar had wrongly written that João Rodrigues Valle was of that parish, and
  the entry is amended to record that he was "de Ruvans do Arceb.o de Braga" (PAR-0034).
  The origin of the line survives only because a priest corrected himself.

  - **[INFERRED]** Her intestate death in 1832 triggered the 1833 accounting that named
  all thirteen children together on the widower's sworn declaration; without that single
  event, the entire sibling set would probably never have been recorded as a complete unit
  in one document.

  - **[CONTEXTUAL]** Thirteen surviving children is a high-fertility outcome for the
  period; she and Claudina Brandina de Jesus (P-0055) are the two high-fertility
  matriarchs whose offspring most directly drove the fragmentation of the Toledo holdings
  — each adding another tier of equal division to the partible-succession cascade.

  ## Identity

  **Ritta Angélica Rodrigues** (also "Rita Aquilina Rodrigues" in her son's 1810 marriage
  — a scribal variant) [PROVEN]. Mother of Ladisláo Egídio Ferreira de Toledo (P-0056) —
  named as child #1 among her thirteen children in the 1833 inventory of her estate
  (PRB-0010), and in his 1787 baptism (PAR-0019); wife of Joaquim José Ferreira de Toledo
  (P-0057), family F-0028. Through Ladisláo she is Eliza Balbina de Toledo's
  great-grandmother and Aristão Ferreira Armond's maternal 2×-great-grandmother.

  - **Birth:** born 3 March 1764, baptised 9 March 1764 at the Capela de São José do
  Ribeirão (filial of the Matriz de N.S. da Piedade da Borda do Campo, Barbacena), per her
  own baptism (PAR-0049, events E-0075/E-0076). Godparents Silvestre de Lima, solteiro,
  and Maria, daughter of José Lopes de Oliveira; vigário Feliciano Pitta de Castro.
  [PROVEN]

  - **Marriage:** ⚭ Joaquim José Ferreira de Toledo, 15 January 1783, Capela de N.S. da
  Glória, Barbacena (PAR-0018) — the act naming her "filha legitima de João Rodrigues [do
  Valle] e de Izabel Ribeira, natural da Freguesia da Borda do Campo". She was eighteen.

  - **Death:** 9 February 1832, intestate — declared on oath by her widower in the 1833
  inventory (PRB-0010). [PROVEN]

  - Nationality Brazilian, natural of the Borda do Campo (Barbacena).

  ## Standing and profession

  - No occupation or office is recorded for her, as expected for a married woman of her
  time and class. Her documented position is that of the wife of a Capitão of ordenanças
  and the mistress of the **Fazenda Cascalhaes**, Termo de Barbacena — the seat at which,
  a year after her death, the Juiz dos Órfãos came in person to take the estate oath.
  [PROVEN — PRB-0010]

  - **Literacy [UNCLASSIFIABLE].** No signable record of hers is held. The 1833 inventory
  carries her widower's autograph, not hers — she was already dead when it was drawn.
  Nothing in the evidence decides whether she could write, and the absence is a limit of
  the record, not a fact about her.

  ## Family and social network

  - Husband: Joaquim José Ferreira de Toledo (P-0057). Thirteen children in all (the 1833
  inventory, PRB-0010), including Ladisláo (P-0056), Anna Belizaria (m.1812, PAR-0020),
  Carolina Francelina (m.1816, PAR-0021), and the brothers José Anastácio and Antonio
  Zeferino. Her deceased daughter Cândida left seven minor children aged 3 to 13, named as
  her representantes in the 1833 division.

  - **Parents (PRIMARY):** João Rodrigues (Roiz) Valle (P-0078) × Isabel Ribeira / Ribeiro
  de Lima (P-0079), family F-0038 — named in her own 1764 baptism (PAR-0049), which gives
  the father "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga" and
  the mother "natural desta freguesia". This upgrades the earlier strong-evidence
  name-match (her 1783 marriage PAR-0018 plus the couple's 1751 Borda do Campo marriage
  PAR-0034) and resolves the low-legibility "José vs João" doubt in favour of João.

  - **The Lima cluster** [INFERRED]. Her godfather at the 1764 font was a Silvestre **de
  Lima**; her son Ladisláo married Mathilde, daughter of Ignez Francisca **de Lima**
  (PAR-0023); her grandson was styled "José Cezário de Toledo **Lima**" and had a Dona
  Anna Francisca **de Lima** as godmother at his 1813 baptism (PAR-0050); and her own
  mother is carried in this repository as Isabel Ribeira / Ribeiro **de Lima** (the 1751
  and 1764 acts write only "Ribeyro"/"Ribeira"). The Lima name recurs around this family
  in Barbacena and São João del Rei across three generations as godparent, spouse and
  surname element — a kin-and-sponsorship cluster, not a single documented lineage.

  ## What we can extrapolate

  She is where this branch of the tree gains its documentable Portuguese depth: her
  husband's patriline tops out at a name in Villa Rica, but her Rodrigues Valle line
  reaches, through her 1764 baptism and her parents' 1751 marriage (PAR-0049, PAR-0034), a
  named Portuguese immigrant father from Ruivães in the Archbishopric of Braga. [PROVEN
  parentage / INFERRED significance]

  - **Her marriage is the mechanism by which an immigrant family became established**
  [INFERRED / CONTEXTUAL]. Her father crossed from the Minho, a region of minifúndio
  smallholding whose non-inheriting sons were the largest single source of 18th-century
  Portuguese emigration to Brazil. He married a local woman in 1751 under the sponsorship
  of a Coronel; his daughter, born in the parish, married a militia Capitão in 1783 and
  became mistress of a named fazenda. That is one generation from immigrant to landed
  officer household — and the instrument of the rise is her marriage, not any documented
  advance of her father's own. In colonial Minas, an immigrant's daughter was frequently
  the family's fastest route into the propertied class.

  - **Her standing was married-in and entirely reflected** [INFERRED]. She is recorded as
  a bride, as a mother in her children's acts, and as a deceased estate. Nothing documents
  her acting in her own name. Yet she is the person around whom the 1833 accounting is
  organised: her death, her *meação*, her thirteen stirpes. The estate is hers, and she is
  the only party to it who never speaks.

  - **She starts the partible cascade, and the arithmetic is unforgiving** [PROVEN counts
  / CONTEXTUAL law]. Her death put her half of the couple's property into division among
  thirteen stirpes — one twenty-sixth of the household per child — and the seven children
  of her predeceased daughter Cândida each took a seventh of that thirteenth, roughly one
  part in 182. Nineteen claimants stood in a single division. Her son Ladisláo then had at
  least eight children of his own, and his son nine. Two generations reduce the apex
  holding to scores of fractions; this is the mechanism that, three generations on, left
  her great-granddaughter Eliza with a cash quota rather than land.

  - **Her mother's possible Azorean origin would double the line's transatlantic reach**
  [LEAD — not promoted]. The ink-damaged grandparent clause of her 1764 baptism reads a
  maternal couple "[Man]uel Pestana × Anna Francisca", of Nossa Senhora do Rosário, Ilha
  de São Jorge, Açores. If a São Jorge parish record ever confirms it, she would be the
  child of a Minho immigrant father and an Azorean-descended mother — two separate
  Portuguese migration streams meeting in one Barbacena household. The clause is damaged
  and must not be treated as more than a lead.

  - **Education: an absence that should not be read as a fact** [CONTEXTUAL]. Her husband
  signed his own name in 1833; her granddaughter-in-law Claudina signed hers in 1867; her
  daughter-in-law Mathilde signed hers. Schooling in colonial and imperial Brazil was a
  purchased, class-linked privilege, bought child by child and generally for sons first.
  Whether it was bought for her, in a Barbacena household of the 1770s, the records simply
  do not say — and the temptation to assume she was illiterate because she is a woman is
  exactly the inference the later evidence from this same family contradicts.

  - **She does not move, and that is the point** [INFERRED]. Every man of this line is
  defined by a migration: Villa Rica to Barbacena, Barbacena to the coffee frontier, the
  Concórdia to Rio. She is born, married, mothers thirteen children and dies inside a
  single Barbacena parish. The line's continuity through six decades of relocation is held
  at her end by someone who stayed put.

  ## Open questions

  - Her maternal grandparents: the 1764 baptism names, ink-damaged, a Pestana couple of
  Nossa Senhora do Rosário, Ilha de São Jorge (Açores) — "[Man]uel Pestana × Anna
  Francisca"; a São Jorge parish record is needed before promoting this past a lead.
  [LEAD]

  - The reconciliation of the first-name-only daughters of the 1833 list (Maria, Lauriana,
  Anna, Cândida, Rita) with the fully-named daughters of the 1812 and 1816 marriage acts.
  [OPEN]

  - The full 1833 monte-mór — the land, any enslaved people and the partition itself, on
  folios beyond the six-page digitised set. [OPEN]

  ## Sources held (this repository)

  - PAR-0049 (her own 1764 Barbacena baptism — birth, parentage, her father's Ruivães
  origin — the primary anchor) · PAR-0018 (1783 marriage — her parents, Borda do Campo
  origin) · PAR-0019 (1787 baptism of her son Ladisláo) · PAR-0020, PAR-0021 (two
  daughters' marriages naming her) · PAR-0023 (1810 son's marriage — "Rita
  Aquilina/Angélica") · PAR-0034 (1751 Borda do Campo marriage of her parents — extends
  the line to Portugal, with the marginal correction fixing her father's Braga origin) ·
  PRB-0010 (1833 inventory of her estate — her death, intestacy, and all thirteen
  children).

  ## Regional and migration context

  Rooted in the Borda do Campo (Barbacena) parish — born, married and, per the 1833
  inventário, died there. Her father's Rodrigues Valle line came from Ruivães (Braga),
  Portugal; she anchors the family in the Campo das Vertentes highland before her
  descendants moved east into the zona da mata. Her paternal line entered Brazil through
  the great 18th-century Minho (north-west Portugal) → Minas Gerais emigration: the Minho
  was Portugal's densest, most land-fragmented region (a smallholding minifúndio, about 96
  inhabitants per km² by 1801), whose surplus non-inheriting sons made it the single
  greatest source of 18th-century Portuguese emigration to Brazil — the crossing governed
  by the Provisão de 20 de março de 1720 passport regime. [CONTEXTUAL]

  ## Where to go today

  - **Baptism (9 March 1764):** Capela de São José do Ribeirão, filial of the Borda do
  Campo matriz — parish anchor Catedral Basílica de Nossa Senhora da Piedade, Barbacena,
  MG [RESOLVED — parish] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Marriage (15 Jan 1783):** Capela de N.S. da Glória, Barbacena, MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Capela%20Nossa%20Senhora%20da%20Gloria%2C%20Barbacena%2C%20MG)

  - **Died, and her estate appraised (1832–33):** Fazenda Cascalhaes, Termo de Barbacena —
  rural, unlocated; municipality anchor Barbacena, MG [UNLOCATED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Barbacena%2C%20Minas%20Gerais)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nascida em 3 de março de 1764 na Capela de São José do Ribeirão e
  batizada seis dias depois (PAR-0049); falecida em 9 de fevereiro de 1832, o que
  desencadeou o inventário que nomeou todos os treze filhos (PRB-0010) — uma duração de
  vida confirmada por fontes primárias de 68 anos, a mais precisamente documentada neste
  ramo da árvore.

  - **[PROVEN]** A mesma família Lopes de Oliveira aparece duas vezes ao seu redor: o
  Coronel Joseph Lopes de Oliveira testemunhou o casamento de seus pais em 1751 e, treze
  anos depois, uma filha de José Lopes de Oliveira foi sua madrinha de batismo. Uma casa
  de coronel apadrinhando o casamento de um imigrante e depois sua filha é uma relação de
  patronato visível em dois registros.

  - **[CONTEXTUAL]** Seu pai, João Rodrigues Valle, era de São Martinho de Ruivães (Braga,
  Portugal) — o que faz dela o ponto em que a linha Toledo adquire sua profundidade
  portuguesa minhota. O Minho era a região mais fragmentada em terras de Portugal e a
  maior fonte isolada da emigração portuguesa para o Brasil no século XVIII, com seus
  filhos não herdeiros excedentes partindo sob o regime de passaportes da Provisão de 20
  de março de 1720.

  - **[PROVEN]** O assento de casamento de 1751 de seus pais traz uma correção escribal à
  margem: o vigário escrevera erradamente que João Rodrigues Valle era daquela freguesia,
  e a entrada é emendada para registrar que era "de Ruvans do Arceb.o de Braga"
  (PAR-0034). A origem da linha sobrevive apenas porque um padre se corrigiu.

  - **[INFERRED]** Sua morte intestada em 1832 desencadeou a prestação de contas de 1833
  que nomeou os treze filhos juntos, na declaração juramentada do viúvo; sem esse único
  evento, todo o conjunto de irmãos provavelmente nunca teria sido registrado como unidade
  completa em um só documento.

  - **[CONTEXTUAL]** Treze filhos sobreviventes é um resultado de alta fecundidade para o
  período; ela e Claudina Brandina de Jesus (P-0055) são as duas matriarcas de alta
  fecundidade cuja prole mais diretamente impulsionou a fragmentação do patrimônio Toledo
  — cada uma acrescentando mais um patamar de divisão igual à cascata da sucessão
  partível.

  ## Identidade

  **Ritta Angélica Rodrigues** (também "Rita Aquilina Rodrigues" no casamento de 1810 de
  seu filho — variante escribal) [PROVEN]. Mãe de Ladisláo Egídio Ferreira de Toledo
  (P-0056) — nomeado como filho nº 1 entre seus treze filhos no inventário de 1833 de seu
  espólio (PRB-0010), e em seu batismo de 1787 (PAR-0019); esposa de Joaquim José Ferreira
  de Toledo (P-0057), família F-0028. Por meio de Ladisláo, é bisavó de Eliza Balbina de
  Toledo e trisavó materna de Aristão Ferreira Armond.

  - **Nascimento:** nasceu em 3 de março de 1764 e foi batizada em 9 de março de 1764 na
  Capela de São José do Ribeirão (filial da Matriz de N.S. da Piedade da Borda do Campo,
  Barbacena), por seu próprio batismo (PAR-0049, eventos E-0075/E-0076). Padrinhos:
  Silvestre de Lima, solteiro, e Maria, filha de José Lopes de Oliveira; vigário Feliciano
  Pitta de Castro. [PROVEN]

  - **Casamento:** ⚭ Joaquim José Ferreira de Toledo, 15 de janeiro de 1783, Capela de
  N.S. da Glória, Barbacena (PAR-0018) — o assento nomeia-a "filha legitima de João
  Rodrigues [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do Campo". Tinha
  dezoito anos.

  - **Óbito:** 9 de fevereiro de 1832, intestada — declarado sob juramento por seu viúvo
  no inventário de 1833 (PRB-0010). [PROVEN]

  - Nacionalidade brasileira, natural da Borda do Campo (Barbacena).

  ## Posição social e profissão

  - Nenhuma ocupação ou cargo lhe é registrado, como seria de esperar para uma mulher
  casada de seu tempo e classe. Sua posição documentada é a de esposa de um Capitão de
  ordenanças e senhora da **Fazenda Cascalhaes**, Termo de Barbacena — a sede à qual, um
  ano após sua morte, o Juiz dos Órfãos veio pessoalmente tomar o juramento do espólio.
  [PROVEN — PRB-0010]

  - **Letramento [UNCLASSIFIABLE].** Nenhum registro assinável dela está disponível. O
  inventário de 1833 traz o autógrafo de seu viúvo, não o dela — já estava morta quando
  foi lavrado. Nada na evidência decide se sabia escrever, e a ausência é um limite do
  registro, não um fato sobre ela.

  ## Família e rede social

  - Marido: Joaquim José Ferreira de Toledo (P-0057). Treze filhos ao todo (o inventário
  de 1833, PRB-0010), entre eles Ladisláo (P-0056), Anna Belizaria (c.1812, PAR-0020),
  Carolina Francelina (c.1816, PAR-0021) e os irmãos José Anastácio e Antonio Zeferino.
  Sua filha falecida Cândida deixou sete filhos menores, de 3 a 13 anos, nomeados como
  seus representantes na divisão de 1833.

  - **Pais (PRIMÁRIO):** João Rodrigues (Roiz) Valle (P-0078) × Isabel Ribeira / Ribeiro
  de Lima (P-0079), família F-0038 — nomeados em seu próprio batismo de 1764 (PAR-0049),
  que dá o pai "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga" e a
  mãe "natural desta freguesia". Isso eleva a anterior correspondência de nomes de
  evidência forte (seu casamento de 1783, PAR-0018, mais o casamento de 1751 do casal na
  Borda do Campo, PAR-0034) e resolve a dúvida de baixa legibilidade "José vs João" em
  favor de João.

  - **O agrupamento Lima** [INFERRED]. Seu padrinho na pia de 1764 foi um Silvestre **de
  Lima**; seu filho Ladisláo casou-se com Mathilde, filha de Ignez Francisca **de Lima**
  (PAR-0023); seu neto foi tratado por "José Cezário de Toledo **Lima**" e teve uma Dona
  Anna Francisca **de Lima** como madrinha em seu batismo de 1813 (PAR-0050); e sua
  própria mãe consta neste repositório como Isabel Ribeira / Ribeiro **de Lima** (os
  assentos de 1751 e 1764 escrevem apenas "Ribeyro"/"Ribeira"). O nome Lima reaparece em
  torno desta família em Barbacena e São João del Rei por três gerações, como padrinho,
  cônjuge e elemento de sobrenome — um agrupamento de parentela e apadrinhamento, não uma
  linhagem documentada.

  ## O que podemos extrapolar

  É nela que este ramo da árvore ganha sua profundidade portuguesa documentável: a linha
  paterna de seu marido termina num nome em Villa Rica, mas sua linha Rodrigues Valle
  alcança, por seu batismo de 1764 e pelo casamento de 1751 de seus pais (PAR-0049,
  PAR-0034), um pai imigrante português nomeado, de Ruivães, no Arcebispado de Braga.
  [PROVEN a filiação / INFERRED o significado]

  - **Seu casamento é o mecanismo pelo qual uma família imigrante se estabeleceu**
  [INFERRED / CONTEXTUAL]. Seu pai atravessou o Atlântico vindo do Minho, região de
  minifúndio cujos filhos não herdeiros foram a maior fonte isolada da emigração
  portuguesa para o Brasil no século XVIII. Casou-se com uma mulher local em 1751 sob o
  apadrinhamento de um Coronel; sua filha, nascida na freguesia, casou-se com um Capitão
  de milícia em 1783 e tornou-se senhora de uma fazenda nomeada. É uma geração do
  imigrante à casa de oficial proprietário — e o instrumento da ascensão é o casamento
  dela, não qualquer avanço documentado do próprio pai. Nas Minas coloniais, a filha de um
  imigrante era com frequência a via mais rápida de uma família para a classe
  proprietária.

  - **Sua posição veio pelo casamento e era inteiramente refletida** [INFERRED]. É
  registrada como noiva, como mãe nos assentos dos filhos e como espólio de falecida. Nada
  documenta uma ação sua em nome próprio. Ainda assim, é em torno dela que a prestação de
  contas de 1833 se organiza: sua morte, sua meação, suas treze estirpes. O espólio é
  dela, e ela é a única parte do processo que nunca fala.

  - **Ela inicia a cascata partível, e a aritmética é implacável** [PROVEN as contagens /
  CONTEXTUAL a lei]. Sua morte pôs metade da propriedade do casal em divisão entre treze
  estirpes — um vinte e seis avos da casa por filho — e os sete filhos de sua filha
  pré-falecida Cândida tomaram cada um um sétimo desse treze avos, cerca de uma parte em
  182. Dezenove pretendentes estavam numa única divisão. Seu filho Ladisláo teve depois
  pelo menos oito filhos, e o filho dele, nove. Duas gerações reduzem o patrimônio do
  ápice a dezenas de frações; é esse o mecanismo que, três gerações adiante, deixou sua
  bisneta Eliza com uma quota em dinheiro em vez de terra.

  - **A possível origem açoriana de sua mãe duplicaria o alcance transatlântico da linha**
  [LEAD — não promovido]. A cláusula de avós, danificada por tinta, de seu batismo de 1764
  lê um casal materno "[Man]uel Pestana × Anna Francisca", de Nossa Senhora do Rosário,
  Ilha de São Jorge, Açores. Se algum registro paroquial de São Jorge o confirmar, ela
  seria filha de pai imigrante minhoto e mãe de ascendência açoriana — duas correntes
  migratórias portuguesas distintas encontrando-se numa só casa de Barbacena. A cláusula
  está danificada e não deve ser tratada como mais do que pista.

  - **Educação: uma ausência que não deve ser lida como fato** [CONTEXTUAL]. Seu marido
  assinou o próprio nome em 1833; a esposa de seu neto, Claudina, assinou o dela em 1867;
  sua nora Mathilde assinou o dela. A escolarização no Brasil colonial e imperial era
  privilégio comprado e ligado à classe, adquirido criança a criança e em geral primeiro
  para os filhos homens. Se foi comprado para ela, numa casa de Barbacena dos anos 1770,
  os registros simplesmente não dizem — e a tentação de supô-la analfabeta por ser mulher
  é exatamente a inferência que a evidência posterior desta mesma família contradiz.

  - **Ela não se desloca, e é esse o ponto** [INFERRED]. Cada homem desta linha é definido
  por uma migração: Villa Rica para Barbacena, Barbacena para a fronteira cafeeira, a
  Concórdia para o Rio. Ela nasce, casa-se, tem treze filhos e morre dentro de uma única
  freguesia de Barbacena. A continuidade da linha através de seis décadas de deslocamentos
  é sustentada, na ponta dela, por alguém que ficou.

  ## Questões em aberto

