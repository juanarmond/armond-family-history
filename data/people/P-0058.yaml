profile: >-
  ## Identity

  **Ritta Angélica Rodrigues** (also "Rita Aquilina Rodrigues" in her son's 1810 marriage
  — a scribal variant) [PROVEN]. Mother of Ladisláo Egídio Ferreira de Toledo (P-0056) —
  named as child #1 among her thirteen children in the 1833 inventory of her estate
  (PRB-0010), and in his 1787 baptism (PAR-0019); wife of João/Joaquim José Ferreira de
  Toledo (P-0057), family F-0028. Through Ladisláo she is Eliza Balbina de Toledo's
  great-grandmother.

  - **Birth:** born 3 March 1764, baptized 9 March 1764 at the Capela de São José do
  Ribeirão (Borda do Campo, Barbacena), per her own baptism (PAR-0049). [PROVEN]

  - Named in her 1783 Barbacena marriage (PAR-0018) as "filha legitima de João Rodrigues
  [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do Campo."

  - Nationality Brazilian, natural of the Borda do Campo (Barbacena).

  ## Family and social network

  - Husband: João/Joaquim José Ferreira de Toledo (P-0057). Thirteen children in all (the
  1833 inventory, PRB-0010), including Ladisláo (P-0056), Anna Belizaria (m.1812, PAR-0020),
  Carolina Francelina (m.1816, PAR-0021), and the brothers José Anastácio and Antonio Zeferino.

  - **Parents (PRIMARY):** João Rodrigues (Roiz) Valle (P-0078) × Isabel Ribeira / Ribeiro
  de Lima (P-0079), family F-0038 — named in her own 1764 baptism (PAR-0049), which gives
  the father "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga". This
  upgrades the earlier strong-evidence (a name-match from her 1786 marriage PAR-0018, tied to
  the couple's 1751 Borda do Campo marriage PAR-0034) and resolves the low-legibility "José
  vs João" doubt in favour of João. Her paternal Rodrigues/Valle line reaches Ruivães
  (Braga), Portugal.

  ## What we can extrapolate

  She is where this branch of the Toledo tree gains its documentable Portuguese depth: her
  husband's patriline tops out at Vila Rica, but her Rodrigues/Valle line reaches, through
  the 1751 marriage (PAR-0034), a Portuguese immigrant father from Ruivais (Braga).
  [INFERRED] Her birth (3 March 1764) and death (9 February 1832, intestate) are both now
  fixed by primary records — her 1764 baptism (PAR-0049) and her 1833 estate inventory
  (PRB-0010, event E-0075) — giving a documented lifespan of about 68 years. [PROVEN]

  - **A high-fertility matriarch, and the estate that recorded the sibling set** [PROVEN
  death/estate; the fragmentation reasoning CONTEXTUAL]. Mother of thirteen — a large surviving
  family for the period — she is, with Claudina Brandina, one of two high-fertility matriarchs
  on the maternal line whose offspring divide the estate into many small shares (the
  partible-succession clock). Her intestate death in 1832 triggered the 1833 accounting
  (PRB-0010) that named all thirteen children together — without it, the sibling set might
  never have been recorded as one.

  ## Open questions

  - Her maternal grandparents: the 1764 baptism names, ink-damaged, a Pestana couple of
  Nossa Senhora do Rosário, Ilha de São Jorge (Açores) — "[Man]uel Pestana × Anna Francisca";
  a São Jorge parish record is needed before promoting this past a lead. [LEAD]

  ## Sources held (this repository)

  - PAR-0049 (her own 1764 Barbacena baptism — birth, parentage, father's Ruivães origin —
  the primary anchor) · PAR-0018 (1783 marriage — her parents, Borda do Campo origin) ·
  PAR-0019 (1787 baptism of her son Ladisláo) · PAR-0020, PAR-0021 (two daughters' marriages
  naming her) · PAR-0023 (1810 son's marriage — "Rita Aquilina/Angélica") · PAR-0034 (1751
  Borda do Campo marriage of her parents — extends the line to Portugal) · PRB-0010 (1833
  inventory of her estate — her death and all thirteen children).

  ## Regional and migration context

  Rooted in the Borda do Campo (Barbacena) parish — born, married and (per the 1833 inventário,
  PRB-0010) died there. Her father's Rodrigues/Valle line came from Ruivais (Braga), Portugal;
  she anchors the family in the Campo das Vertentes highland before her descendants moved east
  into the zona da mata. Her paternal Rodrigues/Valle line entered Brazil through the great
  18th-century Minho (north-west Portugal) → Minas Gerais emigration: the Minho was Portugal's
  densest, most land-fragmented region (a smallholding minifúndio, ~96 inhabitants per km² by
  1801), whose surplus non-inheriting sons made it the single greatest source of 18th-century
  Portuguese emigration to Brazil — the crossing governed by the Provisão de 20 de março de
  1720 passport regime. [CONTEXTUAL]

  ## Where to go today

  - **Baptism, marriage and death (c.1764, 1783, 1832):** Catedral Basílica de Nossa Senhora
  da Piedade, Barbacena, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Estate (Fazenda Cascalhães, Termo de Barbacena):** rural, unlocated; municipality
  anchor Barbacena, MG [UNLOCATED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Barbacena%2C%20Minas%20Gerais)
profile_pt: >-
  ## Identidade

  **Ritta Angélica Rodrigues** (também "Rita Aquilina Rodrigues" no casamento de 1810 de
  seu filho — uma variante de escrivão) [PROVEN]. Mãe de Ladisláo Egídio Ferreira de Toledo
  (P-0056) — nomeada como filho nº 1 entre seus treze filhos no inventário de 1833 de seu
  espólio (PRB-0010), e no batismo de 1787 dele (PAR-0019); esposa de João/Joaquim José
  Ferreira de Toledo (P-0057), família F-0028. Por Ladisláo, é a bisavó de Eliza Balbina de
  Toledo.

  - **Nascimento:** nascida em 3 de março de 1764, batizada em 9 de março de 1764 na Capela
  de São José do Ribeirão (Borda do Campo, Barbacena), conforme seu próprio batismo
  (PAR-0049). [PROVEN]

  - Nomeada em seu casamento em Barbacena por volta de 1786 (PAR-0018) como "filha legitima
  de João Rodrigues [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do
  Campo."

  - Nacionalidade brasileira, natural da Borda do Campo (Barbacena).

  ## Família e rede social

  - Marido: João/Joaquim José Ferreira de Toledo (P-0057). Treze filhos ao todo (o inventário
  de 1833, PRB-0010), incluindo Ladisláo (P-0056), Anna Belizaria (c.1812, PAR-0020),
  Carolina Francelina (c.1816, PAR-0021) e os irmãos José Anastácio e Antonio Zeferino.

  - **Pais (PRIMÁRIO):** João Rodrigues (Roiz) Valle (P-0078) × Isabel Ribeira / Ribeiro de
  Lima (P-0079), família F-0038 — nomeados em seu próprio batismo de 1764 (PAR-0049), que dá
  o pai "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga". Isso supera
  a anterior evidência forte (correspondência de nomes de seu casamento de 1786, PAR-0018,
  ligada ao casamento de 1751 do casal, PAR-0034) e resolve a dúvida de baixa legibilidade
  "José vs João" em favor de João. Sua linha paterna Rodrigues/Valle alcança Ruivães (Braga),
  Portugal.

  ## O que podemos extrapolar

  É onde este ramo da árvore Toledo ganha sua profundidade portuguesa documentável: a
  patrilinha do marido dela topa em Vila Rica, mas sua linha Rodrigues/Valle alcança, por
  meio do casamento de 1751 (PAR-0034), um pai imigrante português de Ruivais (Braga).
  [INFERRED] Seu nascimento (3 de março de 1764) e seu óbito (9 de fevereiro de 1832, sem
  testamento) estão agora fixados por registros primários — seu batismo de 1764 (PAR-0049) e
  o inventário de seu espólio de 1833 (PRB-0010, evento E-0075) — dando uma vida documentada
  de cerca de 68 anos. [PROVEN]

  - **Uma matriarca de alta fecundidade, e o espólio que registrou o conjunto de irmãos**
  [PROVEN quanto ao óbito/espólio; o raciocínio sobre a fragmentação é CONTEXTUAL]. Mãe de treze
  — uma grande família sobrevivente para a época — ela é, com Claudina Brandina, uma das duas
  matriarcas de alta fecundidade da linha materna cuja prole divide o espólio em muitas pequenas
  quotas (o relógio da sucessão partível). Sua morte sem testamento em 1832 desencadeou o acerto
  de 1833 (PRB-0010) que nomeou os treze filhos juntos — sem ele, o conjunto de irmãos talvez
  nunca tivesse sido registrado como um todo.

  ## Questões em aberto

  - Seus avós maternos: o batismo de 1764 nomeia, danificado por tinta, um casal Pestana de
  Nossa Senhora do Rosário, Ilha de São Jorge (Açores) — "[Man]uel Pestana × Anna Francisca";
  é preciso um registro paroquial de São Jorge antes de promover isto além de uma pista. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0049 (seu próprio batismo de 1764 em Barbacena — nascimento, filiação, origem do pai
  em Ruivães — a âncora primária) · PAR-0018 (casamento de 1783 — seus pais, origem na
  Borda do Campo) · PAR-0019 (batismo de 1787 de seu filho Ladisláo) · PAR-0020, PAR-0021
  (casamentos de duas filhas que a nomeiam) · PAR-0023 (casamento de 1810 do filho — "Rita
  Aquilina/Angélica") · PAR-0034 (casamento de 1751 na Borda do Campo de seus pais — estende
  a linha até Portugal) · PRB-0010 (inventário de 1833 de seu espólio — seu óbito e os treze
  filhos).

  ## Contexto regional e migratório

  Enraizada na freguesia da Borda do Campo (Barbacena) — nascida, casada e (conforme o
  inventário de 1833, PRB-0010) falecida ali. A linha Rodrigues/Valle de seu pai veio de
  Ruivais (Braga), Portugal; ela ancora a família nas terras altas do Campo das Vertentes antes
  de seus descendentes migrarem para leste, para a zona da mata. Sua linha paterna
  Rodrigues/Valle entrou no Brasil por meio da grande emigração setecentista do Minho (noroeste
  de Portugal) → Minas Gerais: o Minho era a região mais densa e mais fragmentada em terra de
  Portugal (um minifúndio de pequenas propriedades, ~96 habitantes por km² em 1801), cujos
  filhos excedentes não herdeiros fizeram dele a maior fonte isolada de emigração portuguesa
  setecentista para o Brasil — a travessia regida pelo regime de passaportes da Provisão de 20
  de março de 1720. [CONTEXTUAL]

