notes:
- text: >-
    Taken to be the mother of Ladisláo Egídio Ferreira de Toledo (P-0056); wife of
    Joaquim José Ferreira de Toledo (P-0057), family F-0028. Named in her c.1786
    Barbacena marriage (PAR-0018) as "Ritta Angelica Rodrigues, filha legitima de
    João Rodrigues [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do
    Campo". Her link down to Ladisláo is strong-evidence, not direct (see F-0028).
  text_pt: >-
    Tida como mãe de Ladisláo Egídio Ferreira de Toledo (P-0056); esposa de
    Joaquim José Ferreira de Toledo (P-0057), família F-0028. Nomeada em seu
    casamento em Barbacena por volta de 1786 (PAR-0018) como "Ritta Angelica
    Rodrigues, filha legitima de João Rodrigues [do Valle] e de Izabel Ribeira,
    natural da Freguesia da Borda do Campo". Sua ligação descendente até Ladisláo
    é evidência forte, não direta (ver F-0028).
- text: >-
    Her parents are now modelled: João Rodrigues Valle (P-0078) and Isabel Ribeiro
    (P-0079), family F-0038 — established by their 22 February 1751 Borda do Campo
    marriage (PAR-0034), identified with the "João Rodrigues [do Valle] e Izabel
    Ribeira" of PAR-0018 (same names, same parish, consistent timeline;
    strong-evidence). This extends her paternal Rodrigues/Valle line to Ruivais
    (Braga), Portugal (PAR-0035, PAR-0036). Nationality Brazilian (natural of the
    Borda do Campo / Barbacena, MG).
  text_pt: >-
    Seus pais estão agora modelados: João Rodrigues Valle (P-0078) e Isabel
    Ribeiro (P-0079), família F-0038 — estabelecidos por seu casamento de 22 de
    fevereiro de 1751 na Borda do Campo (PAR-0034), identificado com o "João
    Rodrigues [do Valle] e Izabel Ribeira" de PAR-0018 (mesmos nomes, mesma
    freguesia, cronologia consistente; evidência forte). Isso estende sua linha
    paterna Rodrigues/Valle até Ruivais (Braga), Portugal (PAR-0035, PAR-0036).
    Nacionalidade brasileira (natural da Borda do Campo / Barbacena, MG).
