  ## Contexto regional e migratório

  Enraizada na freguesia da Borda do Campo (Barbacena) — ali nasceu, casou-se e, conforme
  o inventário de 1833, morreu. A linha Rodrigues Valle de seu pai veio de Ruivães
  (Braga), Portugal; ela ancora a família no planalto do Campo das Vertentes antes de seus
  descendentes migrarem para leste, rumo à zona da mata. Sua linha paterna entrou no
  Brasil pela grande emigração setecentista do Minho (noroeste de Portugal) para Minas
  Gerais: o Minho era a região mais densa e mais fragmentada em terras de Portugal
  (minifúndio de pequena propriedade, cerca de 96 habitantes por km² em 1801), cujos
  filhos não herdeiros excedentes fizeram dela a maior fonte isolada da emigração
  portuguesa para o Brasil no século XVIII — travessia regida pelo regime de passaportes
  da Provisão de 20 de março de 1720. [CONTEXTUAL]

