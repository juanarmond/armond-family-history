profile: >-
  ## Identity

  **Ritta Angélica Rodrigues** (also "Rita Aquilina Rodrigues" in her son's 1810 marriage
  — a scribal variant) [PROVEN]. Taken to be the mother of Ladisláo Egídio Ferreira de
  Toledo (P-0056), whose 1787 baptism (PAR-0019) names the couple; wife of João/Joaquim
  José Ferreira de Toledo (P-0057), family F-0028. Through Ladisláo she is Eliza Balbina de
  Toledo's great-great-grandmother.

  - Named in her c.1786 Barbacena marriage (PAR-0018) as "filha legitima de João Rodrigues
  [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do Campo."

  - Nationality Brazilian, natural of the Borda do Campo (Barbacena).

  ## Family and social network

  - Husband: João/Joaquim José Ferreira de Toledo (P-0057). Children include Ladisláo
  (P-0056), Anna Belizaria (m.1812, PAR-0020) and Carolina Francelina (m.1816, PAR-0021).

  - **Parents now modelled:** João Rodrigues Valle (P-0078) × Isabel Ribeiro (P-0079),
  family F-0038 — established by their 22 February 1751 Borda do Campo marriage (PAR-0034),
  identified with the "João Rodrigues [do Valle] e Izabel Ribeira" of PAR-0018 (same names,
  same parish, consistent timeline; strong-evidence). This extends her paternal
  Rodrigues/Valle line to Ruivais (São Martinho de Ruivais), Archbishopric of Braga,
  Portugal.

  ## What we can extrapolate

  She is where this branch of the Toledo tree gains its documentable Portuguese depth: her
  husband's patriline tops out at Vila Rica, but her Rodrigues/Valle line reaches, through
  the 1751 marriage (PAR-0034), a Portuguese immigrant father from Ruivais (Braga).
  [INFERRED] A retrieval draft adds a birth ~1764 and a death on 9 February 1832
  (intestate) from a c.1833 Barbacena inventário — [LEAD], not catalogued.

  ## Open questions

  - Her own baptism (Barbacena, ~1764) to fix her birth and primary-confirm the Valle
  parentage. [OPEN]

  ## Sources held (this repository)

  - PAR-0018 (c.1786 marriage — her parents, Borda do Campo origin) · PAR-0019 (1787 baptism
  of her son Ladisláo) · PAR-0020, PAR-0021 (two daughters' marriages naming her) · PAR-0023
  (1810 son's marriage — "Rita Aquilina/Angélica") · PAR-0034 (1751 Borda do Campo marriage
  of her parents — extends the line to Portugal).

  ## Regional and migration context

  Rooted in the Borda do Campo (Barbacena) parish — born, married and (per the uncatalogued
  1833 inventário) died there. Her father's Rodrigues/Valle line came from Ruivais (Braga),
  Portugal; she anchors the family in the Campo das Vertentes highland before her
  descendants moved east into the zona da mata. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Ritta Angélica Rodrigues** (também "Rita Aquilina Rodrigues" no casamento de 1810 de
  seu filho — uma variante de escrivão) [PROVEN]. Tida como mãe de Ladisláo Egídio Ferreira
  de Toledo (P-0056), cujo batismo de 1787 (PAR-0019) nomeia o casal; esposa de João/Joaquim
  José Ferreira de Toledo (P-0057), família F-0028. Por Ladisláo, é a trisavó de Eliza
  Balbina de Toledo.

  - Nomeada em seu casamento em Barbacena por volta de 1786 (PAR-0018) como "filha legitima
  de João Rodrigues [do Valle] e de Izabel Ribeira, natural da Freguesia da Borda do
  Campo."

  - Nacionalidade brasileira, natural da Borda do Campo (Barbacena).

  ## Família e rede social

  - Marido: João/Joaquim José Ferreira de Toledo (P-0057). Os filhos incluem Ladisláo
  (P-0056), Anna Belizaria (c.1812, PAR-0020) e Carolina Francelina (c.1816, PAR-0021).

  - **Pais agora modelados:** João Rodrigues Valle (P-0078) × Isabel Ribeiro (P-0079),
  família F-0038 — estabelecidos por seu casamento de 22 de fevereiro de 1751 na Borda do
  Campo (PAR-0034), identificado com o "João Rodrigues [do Valle] e Izabel Ribeira" de
  PAR-0018 (mesmos nomes, mesma freguesia, cronologia consistente; evidência forte). Isso
  estende sua linha paterna Rodrigues/Valle até Ruivais (São Martinho de Ruivais),
  Arcebispado de Braga, Portugal.

  ## O que podemos extrapolar

  É onde este ramo da árvore Toledo ganha sua profundidade portuguesa documentável: a
  patrilinha do marido dela topa em Vila Rica, mas sua linha Rodrigues/Valle alcança, por
  meio do casamento de 1751 (PAR-0034), um pai imigrante português de Ruivais (Braga).
  [INFERRED] Um rascunho de recuperação acrescenta um nascimento ~1764 e um óbito em 9 de
  fevereiro de 1832 (intestado) a partir de um inventário de Barbacena por volta de 1833 —
  [LEAD], não catalogado.

  ## Questões em aberto

  - Seu próprio batismo (Barbacena, ~1764) para fixar seu nascimento e confirmar por
  registro primário a filiação Valle. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0018 (casamento de c.1786 — seus pais, origem na Borda do Campo) · PAR-0019 (batismo
  de 1787 de seu filho Ladisláo) · PAR-0020, PAR-0021 (casamentos de duas filhas que a
  nomeiam) · PAR-0023 (casamento de 1810 do filho — "Rita Aquilina/Angélica") · PAR-0034
  (casamento de 1751 na Borda do Campo de seus pais — estende a linha até Portugal).

  ## Contexto regional e migratório

  Enraizada na freguesia da Borda do Campo (Barbacena) — nascida, casada e (conforme o
  inventário de 1833 não catalogado) falecida ali. A linha Rodrigues/Valle de seu pai veio
  de Ruivais (Braga), Portugal; ela ancora a família nas terras altas do Campo das
  Vertentes antes de seus descendentes migrarem para leste, para a zona da mata.
  [CONTEXTUAL]
