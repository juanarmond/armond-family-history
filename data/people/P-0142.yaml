  freguesia de nascimento, o marido e o filho João. *Primária para o óbito; secundária para o
  nascimento e os pais.*

  - **PRB-0016** — a partilha dos bens de Domingos (1885–86), com a procuração dela (Braga, 9
  de junho de 1885) e sua legalização consular. *Original; ela é a primeira suplicante.*

  - **PRB-0015** — o testamento de Domingos (1884) e sua anulação (1885) por preteri-la como herdeira
  forçada. *Original.*

  - **PAR-0106, PAR-0113, PAR-0114, PAR-0115, PAR-0116, PAR-0118, PAR-0119, PAR-0120** — os batismos
  de oito de seus filhos, Ucha, 1829–1843, que nomeiam seus pais. *Primárias.*

  - **PAR-0107, PAR-0121, PAR-0122, PAR-0123** — os casamentos de cinco de seus filhos, Ucha,
  1855–1869; PAR-0121 declara sua naturalidade. *Primárias.*

  - **PAR-0110, PAR-0117** — o provável óbito do marido (1860) e o óbito do filho Francisco (1859),
  ambos chamando-a "Joaquina Maria". *Primárias; a identificação é forte.*

  - **PAR-0124, PAR-0125, PAR-0126, PAR-0127, PAR-0108, PAR-0130, PAR-0131, PAR-0133, PAR-0135**
  — os batismos de seus netos na Pousa, 1855–1871, que a nomeiam como avó paterna. *Primárias
  para os batismos; secundárias para ela.*

  - **PRB-0013, PRB-0014** — o testamento (1890) e o inventário (1898) de Manoel João, que nomeiam
  o marido de sua filha Maria, André Teixeira Crespo. *Originais.*


  ## Contexto regional e migratório


  Nasceu em Santa Cristina da Pousa, freguesia do concelho de Barcelos, e viveu a vida de casada
  em São Romão da Ucha, também em Barcelos (PAR-0111, PAR-0121). [PROVEN] Pelo que os registros
  mostram, nunca deixou o Minho. Sua única viagem documentada é a um tabelião de Braga, em 1885
  (PRB-0016). [PROVEN]


  Ainda assim, em 1885 os negócios da família já se tinham tornado atlânticos. Dois de seus filhos
  estavam na Zona da Mata de Minas Gerais — em São João do Laranjal, termo de Cataguases —, e
  os bens que ela herdou ficavam lá, em terra e café (PRB-0015, PRB-0016). [PROVEN] As casas minhotas
  da época costumavam manter um herdeiro em casa e mandar os outros filhos para o Brasil [CONTEXTUAL].
  O caso dela mostra a viagem de volta desse sistema: uma reclamação jurídica que vai de Braga,
  pelo Porto e pelo Rio de Janeiro, até um tribunal de província em Minas Gerais.


