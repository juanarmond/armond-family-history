notes:
- text: >-
    Antenor Muniz's 2×-great-grandmother: mother of Manoel João Fernandes da Cruz (P-0139). Born
    at Pousa c.1810 (PAR-0111); wife of Bento José Fernandes, of Quintã, Ucha; a widow by 1884;
    on 9 June 1885, at Braga, she gave a power of attorney to "seu filho Manoel João Fernandes
    da Cruz" to collect her share of her son Domingos's estate in Minas Gerais, and took half
    of it as his forced heir (PRB-0016, PRB-0015); died at Quintão on 25 May 1890 (PAR-0111).
    She could not write (PRB-0016).
  text_pt: >-
    Trisavó de Antenor Muniz: mãe de Manoel João Fernandes da Cruz (P-0139). Nascida em Pousa
    c.1810 (PAR-0111); esposa de Bento José Fernandes, de Quintã, Ucha; viúva já em 1884; em 9
    de junho de 1885, em Braga, passou procuração a "seu filho Manoel João Fernandes da Cruz"
    para receber sua parte da herança do filho Domingos em Minas Gerais, e recebeu metade dela
    como herdeira forçada (PRB-0016, PRB-0015); faleceu em Quintão em 25 de maio de 1890 (PAR-0111).
    Não sabia escrever (PRB-0016).
