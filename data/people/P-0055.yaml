profile: >-
  ## Interesting facts

  - **[PROVEN]** She personally signed the inventariante's oath and her own sworn
  declarations before the Juiz Municipal e de Órfãos in March 1867 — her autograph
  "Claudina B[r]a[n]dina de Jezus" closes the *Termo de declaração da Inventariante*
  (PRB-0008 fl.8r), and she signs again on fl.4v and p6, self-spelling her name variously
  (Bulandina / Brandina).

  - **[CONTEXTUAL]** Widowed in late 1866, she served as cabeça-de-casal and administered
  a coffee fazenda of some 32,000 trees with livestock, ten enslaved people and an active
  mortgage — in a legal world where widows were the default estate administrators and very
  often the only women with direct legal agency.

  - **[INFERRED]** The "Brandina" element of her name is almost certainly a saint's name
  (Santa Blandina of Lyon, martyred 177 AD) rather than a paternal surname, which explains
  why it appears in so many variants — Blandina, Bulandina, Balandina, Balbina — across
  her daughters, while her actual surname "de Jesus" is consistently devotional.

  - **[PROVEN]** The estate she administered enslaved ten people, five of them children
  aged 9 to 14, and explicitly listed iron stocks and shackles among the household goods.
  Abolition came in 1888, at least a decade after her own death; the children she left as
  wards lived to see it.

  - **[PROVEN]** She is the person who had to state, on oath and in her own hand, what the
  family was worth and what it owed: it is her declaration, not any male relative's, that
  records the 3:885$000 mortgage running at one per cent a month since 1859.

  - **[PROVEN]** She was not the only Toledo woman of her generation who could write: the
  same estate's signature folio (PRB-0008 fl.4v) carries the autographs of Mathildes
  Olimpia, Maria Dulcelina and Jozephina Christina de Azevedo Lima, while one daughter,
  Maria Bulandina, signed only "a rogo" — by another's hand. Literacy in this household
  was common among the women but not universal.

  ## Identity

  **Claudina Brandina de Jesus** — the full name is PRIMARY-CONFIRMED by two independent
  1867 records: the cover of her joint inventário with her husband (PRB-0008) and
  Ladisláo's inventário (PRB-0009 p2, "a mae destes Dona Claudina Brandina de Jesus é
  viúva") [PROVEN]. The short form "Claudina" (PRB-0006) is a source variant. She is the
  mother of Eliza Balbina de Toledo (P-0017), hence Aristão Ferreira Armond's (P-0008)
  maternal grandmother.

  - **Marriage:** ⚭ José Cezário de Toledo Lima (P-0054), family F-0026; the marriage act
  is not held. Their eldest documented child was about 24 in 1867, so the couple married
  by roughly 1842 [INFERRED].

  - **Life span:** born ~1831 [LEAD — collaborative-tree estimate; no baptism held]. Alive
  on 7 March 1867 — PRB-0008 p5 records her physically present, taking the inventariante
  oath for her late husband's estate before the judge ("jurou aos Santos Evangelhos")
  [PROVEN]. She died after 7 March 1867 and before 1879 (PRB-0006 names her "tambem
  fallecida", wife of heir #4).

  - **Parents:** unknown [OPEN]. Nationality Brazilian; no birthplace stated.

  ## Standing and profession

  No occupation or office is recorded for her, as is expected for a married woman of her
  time and class; her documented standing is entirely that of the estate she headed after
  her husband's death.

  - **Literacy [PROVEN — signed].** She signed her own declarations in her own hand across
  three folios of the 1867 inventário. In imperial Brazil, where schooling was a
  purchased, class-linked privilege bought for sons before daughters, a woman signing her
  own sworn estate declaration is a direct index of the household's position. [PROVEN —
  PRB-0008]

  - **The estate she managed:** a coffee fazenda at Concórdia (Districto do Rio Pardo) — a
  dwelling house, paiol, coffee-house, an engenho, a roadside *casa de negócio* (300$000)
  and roughly 32,000 coffee trees, plus livestock, a shod cart, canoes and household goods
  (a gold watch, silver, tools). [PROVEN — PRB-0008 avaliação, fl.5r–7r]

  - **The estate's principal debt, which she declared [PROVEN].** In the *Termo de
  declaração da Inventariante* (fl.8r) she declared the estate's chief liability — a
  hypothecary debt of **3:885$000** already due, at one per cent a month since 12
  September 1859 [uncertain year], owed to (the house of) Francisco Leocádio de Toledo, a
  Toledo-family creditor. The José-Cezário sub-estate was thus debt-encumbered at the
  1866–67 death and inventory — part of why the Toledo land converted into the modest cash
  shares of the next generation. [PROVEN — PRB-0008 fl.8r; the within-family character of
  the credit line is CONTEXTUAL]

  ## Family and social network

  Wife of José Cezário; matriarch of a large Fazenda da Concórdia household. Her
  structured direct-line child is Eliza (P-0017); her other children are documented on
  family F-0026 (see her husband's profile), including a son "Simplício José Ferreira de
  Toledo" (14 in 1867) — a DIFFERENT person from her son-in-law Simplício José Ferreira
  Armond (P-0016), Eliza's husband, not her son. The recurring "Brandina / Bulandina /
  Balbina" name element across her daughters (Eliza *Balbina*, Maria
  *Bulandina/Balandina*) tracks her own name — a maternal naming signature. [INFERRED]

  ## Inventariante of the Fazenda da Concórdia estate (1867)

  Widowed in September 1866, Claudina was the **cabeça-de-casal / inventariante** of her
  late husband's estate: on 7 March 1867 at the Fazenda da Concórdia she was sworn before
  the Juiz Municipal e de Órfãos, presented the whole estate for appraisal, and personally
  made the inventariante's sworn declarations — including the number of heirs, the date of
  her husband's death and the estate's debts. Aureliano de Sales Toledo, her husband's
  brother, was sworn as curador of the minor children the same week. She died herself
  while the estate was still in process. [PROVEN — PRB-0008]

  ## The enslaved people held in the estate

  As cabeça-de-casal / inventariante she was the enslaver of record. The 1867 avaliação
  registers **ten enslaved people** held in the Concórdia estate, appraised as property
  (origin recorded as *de nação* = African-born, or *crioulo/a* = born in Brazil):

  - Lucas, *de nação*, 32 — 1:700$000 · Pedro, *de nação*, 33 — 1:100$000 · Miguel,
  *crioulo*, 14 — 800$000 · Thobias, *crioulo*, 12 — 1:400$000 · Benedicto, *crioulo*, 9 —
  800$000 · Faustina, *crioula*, 9 — 1:100$000 · Virgiliana, *crioula*, 17 — 1:400$000 ·
  Luiza, *de nação*, 36 [uncertain] — 800$000 · Joana, *crioula*, 40 — 800$000 · Eugenio,
  *crioulo*, 14 — 1:400$000.

  Five of the ten were children aged 9 to 14. The estate's appraised goods also included
  "um tronco para prisão, de ferro e algemas" — iron stocks and shackles — listed plainly
  among the chattels. The 14-year-old Eugenio had earlier been handed over as part of the
  dowry (*dote*) when the couple's daughter Maria Blandina de Toledo married Manoel
  Marques Jorge; in this estate he was collated (*colação*) at half his appraised value,
  and Manoel renounced (*desistência*) his heir's share as satisfied by that dowry — a
  child transferred as marriage property within the family. [PROVEN — PRB-0008 fl.6r–6v,
  fl.7v, fl.10r]

  ## What we can extrapolate

  - **Her standing was married-in, and her authority was conditional on widowhood**
  [INFERRED]. Nothing is documented of her own origins: no baptism, no parents, no
  property brought to the marriage. Everything recorded about her position comes from the
  household she married into — and the only moment at which she appears as a legal actor
  in her own name is the eleven-or-more years between her husband's death and her own. In
  imperial Brazil widowhood was the single reliable route by which a woman acquired direct
  legal agency: as *cabeça-de-casal* she swore, declared, appraised and signed. That
  agency was borrowed from a dead man and extinguished with her; it transmitted nothing to
  her daughters, who reappear in the 1879 proceedings named through their husbands.

  - **She is the point where the estate's true condition was put on the record** [PROVEN
  act / INFERRED significance]. The mortgage, the number of heirs, the date of death — the
  facts that determined what each child would receive — enter the archive through her
  sworn word. In practical terms the family's whole accounting for its transition
  generation rests on the testimony of a woman about whom nothing else is known.

  - **A high-fertility matriarch feeding partible dilution** [CONTEXTUAL]. As mother of
  nine documented children she is, with her husband's grandmother Ritta Angélica Rodrigues
  (thirteen children), one of two high-fertility matriarchs whose offspring divide the
  Toledo holdings into many small shares. Her husband's death and her own within the
  following decade left minors under curatela, compounding the fragmentation of the
  José-Cezário sub-estate of which Eliza was an heir and helping convert land into the
  modest cash shares of Eliza's generation.

  - **Literacy in this house was broad but unevenly bought** [PROVEN base / CONTEXTUAL
  reading]. She signed; so did her mother-in-law Mathilde Maria de Jesus (PRB-0009 p5) and
  three of the Toledo women on the 1867 signature folio; one daughter signed only *a
  rogo*. Schooling was a purchase, not a birthright, and it had to be re-made in every
  generation and for every child. That a propertied Zona da Mata household of the 1860s
  could write its own name is a class marker; that one daughter within the same house
  could not is the reminder that the purchase was made child by child, and could lapse.

  - **Her marriage sits outside the family's consolidation strategy** [INFERRED —
  flagged]. The Toledo clan of this generation practised visible endogamy: her husband's
  uncle Antonio Zeferino married his own niece, and Toledo × Toledo matches recur — a
  standard elite counter to partible inheritance, which otherwise divides an estate every
  generation. Claudina, by contrast, brings only a devotional surname and no traceable
  family. Either she brought something the records do not show, or this marriage was
  simply not made for property. Nothing in the held evidence decides it.

  - **Her unknown parentage remains a live but unevidenced lead for the Armond puzzle**
  [LEAD — explicitly not a finding]. Repository research has listed her own ancestry as
  one possible explanation for how her son-in-law Simplício came by the "Ferreira Armond"
  surname. There is no evidence for this; it is a hypothesis to test, and it should not be
  repeated as anything more.

  - **The "Brandina" element is almost certainly NOT a Brandão-family surname** [labeled
  inference]. In every primary her surname slot is the devotional "de Jesus"; "Brandina"
  sits in the middle-name position and recurs across her daughters spelled every which way
  — Eliza *Balbina*, Maria *Bulandina/Balandina*, Claudina *Brandina/Blandina*. That drift
  is the signature of a reused saint's given name (Santa Blandina of Lyon), not a fixed
  paternal surname — feminising "Brandão → Brandina" is not a Portuguese pattern. There is
  therefore no evidentiary basis to hunt a "Brandão family" for her; her paternal surname
  is genuinely unknown. (Not to be confused with the distinct Azorean Brandão of the Muniz
  line.)

  ## Open questions

  - Her parents — the decisive gap. [OPEN]

  - Her exact death date (after 7 March 1867, before 1879). [OPEN] A collaborative
  FamilySearch tree and her appearances as a named party in husband's-side estate actions
  of 1869, 1870 and an 1876 Fazenda do Retiro division point toward a death nearer ~1876;
  but estates litigate in a deceased's name for years, so these may name her posthumously
  and do not firmly fix the year. [LEAD]

  - Her marriage act, which would name her parents and date the union now only inferred to
  ~1842. [OPEN]

  ## Sources held (this repository)

  - PRB-0008 (1867 joint inventário — cover states her full name; she takes the
  inventariante oath, signs her own declarations, declares the 3:885$000 hypothecary debt,
  and the avaliação registers the estate's ten enslaved people) · PRB-0009 (1867 Ladisláo
  inventário, p2 — declares her a living widow) · PRB-0006 (1879 Mathilde inventário — "D.
  Claudina, tambem fallecida", wife of heir #4) · PRB-0004 (Concórdia / São Bento deed —
  Toledo succession context).

  ## Regional and migration context

  She lived and died at the Fazenda da Concórdia, the Toledo family seat in the Leopoldina
  zona da mata coffee frontier — a district that by 1883 held the second-largest enslaved
  population in Minas Gerais. No move of her own is documented, and no origin is recorded:
  unlike the men of the line, whose migrations from Villa Rica to Barbacena to the Zona da
  Mata are traceable step by step, she enters the record already inside the household she
  would eventually head. [CONTEXTUAL]

  ## Where to go today

  - **Lived and died (1867×1876):** Fazenda da Concórdia, distrito de Tebas (Leopoldina),
  MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **1867 inventário she signed:** Fórum da Comarca de Leopoldina, MG (Rua Geraldo
  Campana 200) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Assinou pessoalmente o juramento de inventariante e suas próprias
  declarações juramentadas perante o Juiz Municipal e de Órfãos em março de 1867 — seu
  autógrafo "Claudina B[r]a[n]dina de Jezus" encerra o *Termo de declaração da
  Inventariante* (PRB-0008 fl.8r), e ela assina novamente nos fólios 4v e p6, grafando o
  próprio nome de modos variados (Bulandina / Brandina).

  - **[CONTEXTUAL]** Viúva no fim de 1866, atuou como cabeça-de-casal e administrou uma
  fazenda de café de cerca de 32.000 pés, com gado, dez pessoas escravizadas e uma
  hipoteca em curso — num mundo jurídico em que as viúvas eram as administradoras naturais
  dos espólios e, muitas vezes, as únicas mulheres com capacidade jurídica direta.

  - **[INFERRED]** O elemento "Brandina" de seu nome é quase certamente um nome de santa
  (Santa Blandina de Lyon, martirizada em 177 d.C.) e não um sobrenome paterno, o que
  explica por que aparece em tantas variantes — Blandina, Bulandina, Balandina, Balbina —
  entre suas filhas, enquanto seu sobrenome de fato, "de Jesus", é consistentemente
  devocional.

  - **[PROVEN]** O espólio que administrou escravizava dez pessoas, cinco delas crianças
  de 9 a 14 anos, e arrolava explicitamente um tronco de ferro e algemas entre os bens da
  casa. A abolição veio em 1888, ao menos uma década após sua própria morte; as crianças
  que deixou sob tutela chegaram a vê-la.

  - **[PROVEN]** Foi ela quem teve de declarar, sob juramento e de próprio punho, quanto a
  família valia e quanto devia: é a declaração dela, e não a de qualquer parente homem,
  que registra a hipoteca de 3:885$000 correndo a um por cento ao mês desde 1859.

  - **[PROVEN]** Não era a única mulher Toledo de sua geração que sabia escrever: o fólio
  de assinaturas do mesmo espólio (PRB-0008 fl.4v) traz os autógrafos de Mathildes
  Olimpia, Maria Dulcelina e Jozephina Christina de Azevedo Lima, enquanto uma filha,
  Maria Bulandina, assinou apenas "a rogo" — pela mão de outrem. O letramento nesta casa
  era comum entre as mulheres, mas não universal.

  ## Identidade

  **Claudina Brandina de Jesus** — o nome completo é CONFIRMADO POR REGISTRO PRIMÁRIO por
  dois registros independentes de 1867: a capa de seu inventário conjunto com o marido
  (PRB-0008) e o inventário de Ladisláo (PRB-0009 p2, "a mae destes Dona Claudina Brandina
  de Jesus é viúva") [PROVEN]. A forma curta "Claudina" (PRB-0006) é uma variante de
  fonte. É mãe de Eliza Balbina de Toledo (P-0017), portanto avó materna de Aristão
  Ferreira Armond (P-0008).

  - **Casamento:** ⚭ José Cezário de Toledo Lima (P-0054), família F-0026; o assento de
  casamento não está disponível. O filho mais velho documentado tinha cerca de 24 anos em
  1867, de modo que o casal se casou por volta de 1842 [INFERRED].

  - **Período de vida:** nascida por volta de 1831 [LEAD — estimativa de árvore
  colaborativa; nenhum batismo disponível]. Viva em 7 de março de 1867 — PRB-0008 p5
  registra sua presença física, prestando o juramento de inventariante do espólio do
  falecido marido perante o juiz ("jurou aos Santos Evangelhos") [PROVEN]. Morreu depois
  de 7 de março de 1867 e antes de 1879 (PRB-0006 a nomeia "D. Claudina, tambem
  fallecida", esposa do herdeiro nº 4).

  - **Pais:** desconhecidos [OPEN]. Nacionalidade brasileira; nenhum local de nascimento
  declarado.

  ## Posição social e profissão

  Nenhuma ocupação ou cargo lhe é registrado, como seria de esperar para uma mulher casada
  de seu tempo e classe; sua posição documentada é inteiramente a do espólio que chefiou
  após a morte do marido.

  - **Letramento [PROVEN — assinou].** Assinou as próprias declarações de próprio punho em
  três fólios do inventário de 1867. No Brasil imperial, onde a escolarização era um
  privilégio comprado e ligado à classe, adquirido para os filhos antes das filhas, uma
  mulher assinando sua própria declaração juramentada de espólio é índice direto da
  posição da casa. [PROVEN — PRB-0008]

  - **O espólio que administrou:** uma fazenda de café na Concórdia (Districto do Rio
  Pardo) — casa de morada, paiol, casa de café, um engenho, uma casa de negócio na estrada
  (300$000) e cerca de 32.000 pés de café, além de gado, um carro ferrado, canoas e bens
  domésticos (relógio de ouro, prata, ferramentas). [PROVEN — PRB-0008 avaliação,
  fl.5r–7r]

  - **A principal dívida do espólio, que ela declarou [PROVEN].** No *Termo de declaração
  da Inventariante* (fl.8r) declarou o principal passivo do espólio — uma dívida
  hipotecária de **3:885$000** já vencida, a um por cento ao mês desde 12 de setembro de
  1859 [ano incerto], devida a (a casa de) Francisco Leocádio de Toledo, credor da própria
  família Toledo. O sub-espólio de José Cezário estava, portanto, onerado por dívida na
  morte e no inventário de 1866–67 — parte da razão pela qual a terra Toledo se converteu
  nas modestas quotas em dinheiro da geração seguinte. [PROVEN — PRB-0008 fl.8r; o caráter
  intrafamiliar da linha de crédito é CONTEXTUAL]

  ## Família e rede social

  Esposa de José Cezário; matriarca de uma grande casa na Fazenda da Concórdia. Sua filha
  estruturada da linha direta é Eliza (P-0017); os demais filhos estão documentados na
  família F-0026 (ver o perfil do marido), incluindo um filho "Simplício José Ferreira de
  Toledo" (14 anos em 1867) — pessoa DIFERENTE de seu genro Simplício José Ferreira Armond
  (P-0016), marido de Eliza, não filho dela. O elemento recorrente "Brandina / Bulandina /
  Balbina" entre suas filhas (Eliza *Balbina*, Maria *Bulandina/Balandina*) acompanha o
  próprio nome dela — uma assinatura onomástica materna. [INFERRED]

  ## Inventariante do espólio da Fazenda da Concórdia (1867)

  Viúva desde setembro de 1866, Claudina foi a **cabeça-de-casal / inventariante** do
  espólio do falecido marido: em 7 de março de 1867, na Fazenda da Concórdia, foi
  juramentada perante o Juiz Municipal e de Órfãos, apresentou todo o espólio à avaliação
  e prestou pessoalmente as declarações juramentadas de inventariante — incluindo o número
  de herdeiros, a data da morte do marido e as dívidas do espólio. Aureliano de Sales
  Toledo, irmão do marido, foi juramentado curador dos filhos menores na mesma semana. Ela
  própria morreu enquanto o espólio ainda corria. [PROVEN — PRB-0008]

  ## As pessoas escravizadas no espólio

  Como cabeça-de-casal / inventariante, era a escravizadora de registro. A avaliação de
  1867 registra **dez pessoas escravizadas** no espólio da Concórdia, avaliadas como
  propriedade (origem registrada como *de nação* = nascida na África, ou *crioulo/a* =
  nascido no Brasil):

  - Lucas, *de nação*, 32 — 1:700$000 · Pedro, *de nação*, 33 — 1:100$000 · Miguel,
  *crioulo*, 14 — 800$000 · Thobias, *crioulo*, 12 — 1:400$000 · Benedicto, *crioulo*, 9 —
  800$000 · Faustina, *crioula*, 9 — 1:100$000 · Virgiliana, *crioula*, 17 — 1:400$000 ·
  Luiza, *de nação*, 36 [incerto] — 800$000 · Joana, *crioula*, 40 — 800$000 · Eugenio,
  *crioulo*, 14 — 1:400$000.

  Cinco das dez eram crianças de 9 a 14 anos. Entre os bens avaliados constava também "um
  tronco para prisão, de ferro e algemas" — arrolado sem rodeios entre os móveis. O menino
  Eugenio, de 14 anos, fora antes entregue como parte do dote quando a filha do casal,
  Maria Blandina de Toledo, casou-se com Manoel Marques Jorge; neste espólio foi trazido à
  colação por metade do valor avaliado, e Manoel desistiu de sua parte de herdeiro por
  estar satisfeito com aquele dote — uma criança transferida como bem matrimonial dentro
  da família. [PROVEN — PRB-0008 fl.6r–6v, fl.7v, fl.10r]

  ## O que podemos extrapolar

  - **Sua posição veio pelo casamento, e sua autoridade era condicionada à viuvez**
  [INFERRED]. Nada está documentado sobre suas origens: nenhum batismo, nenhum pai, nenhum
  bem levado ao casamento. Tudo o que se registra sobre sua posição vem da casa em que
  entrou pelo matrimônio — e o único momento em que aparece como sujeito de direito em
  nome próprio são os onze ou mais anos entre a morte do marido e a sua. No Brasil
  imperial, a viuvez era a única via segura pela qual uma mulher adquiria capacidade
  jurídica direta: como *cabeça-de-casal* ela jurou, declarou, fez avaliar e assinou. Essa
  capacidade era emprestada de um morto e extinguiu-se com ela; não transmitiu nada às
  filhas, que reaparecem nos autos de 1879 nomeadas através dos maridos.

  - **É o ponto em que a real condição do espólio entrou para o registro** [PROVEN o ato /
  INFERRED o significado]. A hipoteca, o número de herdeiros, a data da morte — os fatos
  que determinariam o que cada filho receberia — entram no arquivo pela palavra
  juramentada dela. Na prática, toda a contabilidade familiar da geração de transição
  repousa no testemunho de uma mulher sobre a qual nada mais se sabe.

  - **Matriarca de alta fecundidade alimentando a diluição partível** [CONTEXTUAL]. Como
  mãe de nove filhos documentados, ela é, com a avó de seu marido, Ritta Angélica
  Rodrigues (treze filhos), uma das duas matriarcas de alta fecundidade cuja prole divide
  o patrimônio Toledo em muitas quotas pequenas. A morte do marido e a sua, na década
  seguinte, deixaram menores sob curatela, agravando a fragmentação do sub-espólio de José
  Cezário de que Eliza era herdeira e ajudando a converter terra nas modestas quotas em
  dinheiro da geração de Eliza.

  - **O letramento nesta casa era amplo, mas comprado de modo desigual** [PROVEN a base /
  CONTEXTUAL a leitura]. Ela assinou; também assinaram sua sogra Mathilde Maria de Jesus
  (PRB-0009 p5) e três das mulheres Toledo no fólio de assinaturas de 1867; uma filha
  assinou apenas *a rogo*. A escolarização era compra, não direito de nascença, e
  precisava ser refeita a cada geração e para cada criança. Que uma casa proprietária da
  Zona da Mata dos anos 1860 soubesse escrever o próprio nome é um marcador de classe; que
  uma filha da mesma casa não soubesse é o lembrete de que a compra se fazia criança a
  criança, e podia falhar.

  - **Seu casamento fica fora da estratégia de consolidação da família** [INFERRED —
  sinalizado]. O clã Toledo desta geração praticava endogamia visível: o tio de seu
  marido, Antonio Zeferino, casou-se com a própria sobrinha, e casamentos Toledo × Toledo
  se repetem — contramedida clássica das elites à herança partível, que de outro modo
  divide o espólio a cada geração. Claudina, ao contrário, traz apenas um sobrenome
  devocional e nenhuma família rastreável. Ou trouxe algo que os registros não mostram, ou
  este casamento simplesmente não foi feito por propriedade. Nada na evidência disponível
  decide a questão.

  - **Sua filiação desconhecida permanece uma pista viva, mas sem evidência, para o enigma
  Armond** [LEAD — explicitamente não é um achado]. A pesquisa do repositório arrolou a
  ascendência dela como uma explicação possível para o modo como seu genro Simplício veio
  a carregar o sobrenome "Ferreira Armond". Não há evidência disso; é uma hipótese a
  testar, e não deve ser repetida como mais do que isso.

  - **O elemento "Brandina" quase certamente NÃO é um sobrenome da família Brandão**
  [inferência assinalada]. Em todas as fontes primárias, seu campo de sobrenome é o
  devocional "de Jesus"; "Brandina" ocupa a posição de nome do meio e reaparece entre as
  filhas grafado de todos os modos — Eliza *Balbina*, Maria *Bulandina/Balandina*,
  Claudina *Brandina/Blandina*. Essa deriva é a assinatura de um nome de santa reutilizado
  (Santa Blandina de Lyon), não de um sobrenome paterno fixo — feminizar "Brandão →
  Brandina" não é padrão português. Não há, portanto, base probatória para caçar uma
  "família Brandão" para ela; seu sobrenome paterno é genuinamente desconhecido. (Não
  confundir com o Brandão açoriano, distinto, da linha Muniz.)

  ## Questões em aberto

  - Seus pais — a lacuna decisiva. [OPEN]

  - Sua data exata de óbito (depois de 7 de março de 1867, antes de 1879). [OPEN] Uma
  árvore colaborativa do FamilySearch e suas aparições como parte nomeada em ações do
  espólio do marido em 1869, 1870 e numa divisão da Fazenda do Retiro em 1876 apontam para
  uma morte mais próxima de ~1876; mas os espólios litigam em nome do falecido por anos,
  de modo que essas menções podem ser póstumas e não fixam o ano com segurança. [LEAD]

  - Seu assento de casamento, que nomearia seus pais e dataria a união hoje apenas
  inferida para ~1842. [OPEN]

