profile: >-
  ## Identity

  **Claudina Brandina de Jesus** — the full name is PRIMARY-CONFIRMED by two independent
  1867 records: the cover of her joint inventário with her husband (PRB-0008) and
  Ladisláo's inventário (PRB-0009 p2, "a mae destes Dona Claudina Brandina de Jesus é
  viúva") [PROVEN]. The short form "Claudina" (PRB-0006) is a source variant. She is the
  mother of Eliza Balbina de Toledo (P-0017), our direct ancestor.

  - **Marriage:** ⚭ José Cezário de Toledo Lima (P-0054), family F-0026.

  - **Life span:** alive on 7 March 1867 — PRB-0008 p5 records her physically present,
  taking the inventariante oath for her late husband's estate before the judge ("jurou aos
  Santos Evangelhos") [PROVEN]. She died after 7 March 1867 and before 1879 (PRB-0006
  names her "tambem fallecida", wife of heir #4).

  - **Parents:** unknown [OPEN]. Nationality Brazilian; no birthplace stated.

  ## Family and social network

  Wife of José Cezário; matriarch of a large Fazenda da Concórdia household. Her structured
  direct-line child is Eliza (P-0017); her other children are documented on family F-0026
  (see her husband's profile), including a son "Simplício José Ferreira de Toledo" (14 in
  1867) — a DIFFERENT person from her son-in-law Simplício José Ferreira Armond (P-0016),
  Eliza's husband, not her son. The recurring "Brandina / Bulandina / Balbina" name element
  across her daughters (Eliza *Balbina*, Maria *Bulandina/Claudina*) tracks her own name —
  a maternal naming signature. [INFERRED]

  ## What we can extrapolate

  She was an active legal actor at the end of her life: widowed in 1866, she personally
  swore the inventariante oath for her late husband's estate in March 1867, only to die
  herself while the estate was still in process — which is why so many of her children
  appear as wards under a curador. [INFERRED; her March 1867 presence PROVEN]

  - **A high-fertility matriarch feeding partible dilution** [CONTEXTUAL]. As mother of a
  dozen-plus children she is, with Rita Angélica Rodrigues, one of two high-fertility
  matriarchs whose offspring divide the Toledo estate into many small shares; her husband's
  death and her own within the following decade left minors under curatela, compounding the
  fragmentation of the José-Cezário sub-estate that Eliza was an heir to and helping convert
  land into the modest cash shares of Eliza's generation.

  - **The "Brandina" element is almost certainly NOT a Brandão-family surname** [labeled
  inference]. In every primary her surname slot is the devotional "de Jesus"; "Brandina" sits
  in the middle-name position and recurs across her daughters spelled every which way — Eliza
  *Balbina*, Maria *Bulandina/Balandina*, Claudina *Brandina/Blandina*. That drift is the
  signature of a reused saint's given name (Santa Blandina de Lyon), not a fixed paternal
  surname — feminising "Brandão → Brandina" is not a Portuguese pattern. So there is no
  evidentiary basis to hunt a "Brandão family" for her; her paternal surname is genuinely
  unknown. (Not to be confused with the distinct Azorean Brandão of the Muniz line.)

  ## Open questions

  - Her parents — the decisive gap. [OPEN]

  - Her exact death date (after 7 March 1867, before 1879). [OPEN] A collaborative
  FamilySearch tree and her appearances as a named party in husband's-side estate actions of
  1869, 1870 and an 1876 Fazenda do Retiro division point toward a death nearer ~1876; but
  estates litigate in a deceased's name for years, so these may name her posthumously and do
  not firmly fix the year. [LEAD]

  ## Sources held (this repository)

  - PRB-0008 (1867 joint inventário — cover states her full name; p5 records her
  inventariante oath) · PRB-0009 (1867 Ladisláo inventário, p2 — declares her a living
  widow) · PRB-0006 (1879 Matilde inventário — "D. Claudina, tambem fallecida", wife of
  heir #4) · PRB-0004 (Concórdia / São Bento deed — Toledo succession context).

  ## Regional and migration context

  She lived and died at the Fazenda da Concórdia, the Toledo family seat in the Leopoldina
  zona da mata coffee frontier. No move of her own is documented. [CONTEXTUAL]

  ## Where to go today

  - **Lived and died (1867×1876):** Fazenda da Concórdia, distrito de Tebas (Leopoldina), MG
  [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **1867 inventário she signed:** Fórum da Comarca de Leopoldina, MG (Rua Geraldo Campana
  200) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Identidade

  **Claudina Brandina de Jesus** — o nome completo é CONFIRMADO POR REGISTRO PRIMÁRIO por
  dois registros independentes de 1867: a capa de seu inventário conjunto com o marido
  (PRB-0008) e o inventário de Ladisláo (PRB-0009 p2, "a mae destes Dona Claudina Brandina
  de Jesus é viúva") [PROVEN]. A forma curta "Claudina" (PRB-0006) é uma variante de fonte.
  Ela é a mãe de Eliza Balbina de Toledo (P-0017), nossa ancestral direta.

  - **Casamento:** ⚭ José Cezário de Toledo Lima (P-0054), família F-0026.

  - **Período de vida:** viva em 7 de março de 1867 — PRB-0008 p5 registra sua presença
  física, prestando o juramento de inventariante do espólio do falecido marido perante o
  juiz ("jurou aos Santos Evangelhos") [PROVEN]. Morreu depois de 7 de março de 1867 e
  antes de 1879 (PRB-0006 a nomeia "tambem fallecida", esposa do herdeiro nº 4).

  - **Pais:** desconhecidos [OPEN]. Nacionalidade brasileira; nenhum local de nascimento
  declarado.

  ## Família e rede social

  Esposa de José Cezário; matriarca de uma grande casa na Fazenda da Concórdia. Seu filho
  estruturado da linha direta é Eliza (P-0017); seus outros filhos estão documentados na
  família F-0026 (ver o perfil do marido), incluindo um filho "Simplício José Ferreira de
  Toledo" (14 anos em 1867) — pessoa DIFERENTE de seu genro Simplício José Ferreira Armond
  (P-0016), marido de Eliza, não seu filho. O recorrente elemento de nome "Brandina /
  Bulandina / Balbina" entre suas filhas (Eliza *Balbina*, Maria *Bulandina/Claudina*)
  acompanha o próprio nome dela — uma assinatura de nomeação materna. [INFERRED]

  ## O que podemos extrapolar

  Foi uma atuante legal ao fim da vida: viúva em 1866, prestou pessoalmente o juramento de
  inventariante do espólio do falecido marido em março de 1867, para morrer ela mesma
  enquanto o inventário ainda corria — razão pela qual tantos de seus filhos figuram como
  tutelados sob um curador. [INFERRED; sua presença em março de 1867 é PROVEN]

  - **Uma matriarca de alta fecundidade que alimenta a diluição partível** [CONTEXTUAL]. Como
  mãe de mais de uma dúzia de filhos, ela é, com Rita Angélica Rodrigues, uma das duas
  matriarcas de alta fecundidade cuja prole divide o espólio Toledo em muitas pequenas quotas;
  a morte do marido e a sua própria na década seguinte deixaram os menores sob curatela,
  agravando a fragmentação do sub-espólio de José-Cezário do qual Eliza era herdeira e
  ajudando a converter terra nas modestas quotas em dinheiro da geração de Eliza.

  - **O elemento "Brandina" quase certamente NÃO é um sobrenome da família Brandão**
  [inferência rotulada]. Em todo registro primário, seu campo de sobrenome é o devocional "de
  Jesus"; "Brandina" ocupa a posição de nome do meio e recorre entre suas filhas grafado de
  todas as formas — Eliza *Balbina*, Maria *Bulandina/Balandina*, Claudina *Brandina/Blandina*.
  Essa oscilação é a assinatura de um nome de santa reutilizado (Santa Blandina de Lyon), não
  de um sobrenome paterno fixo — feminizar "Brandão → Brandina" não é um padrão português.
  Assim, não há base probatória para procurar uma "família Brandão" para ela; seu sobrenome
  paterno é genuinamente desconhecido. (Não confundir com o distinto Brandão açoriano da linha
  Muniz.)

  ## Questões em aberto

  - Seus pais — a lacuna decisiva. [OPEN]

  - Sua data exata de óbito (depois de 7 de março de 1867, antes de 1879). [OPEN] Uma árvore
  colaborativa do FamilySearch e suas aparições como parte nomeada em ações do lado do marido
  de 1869, 1870 e numa divisão da Fazenda do Retiro de 1876 apontam para um óbito mais próximo
  de ~1876; mas espólios litigam em nome do falecido por anos, de modo que essas menções podem
  ser póstumas e não fixam o ano com firmeza. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PRB-0008 (inventário conjunto de 1867 — a capa declara seu nome completo; a p5 registra
  seu juramento de inventariante) · PRB-0009 (inventário de Ladisláo de 1867, p2 — a
  declara viúva viva) · PRB-0006 (inventário de Mathilde de 1879 — "D. Claudina, tambem
  fallecida", esposa do herdeiro nº 4) · PRB-0004 (escritura da Concórdia / São Bento —
  contexto da sucessão Toledo).

  ## Contexto regional e migratório

  Viveu e morreu na Fazenda da Concórdia, a sede da família Toledo na fronteira cafeeira da
  zona da mata de Leopoldina. Nenhuma mudança de sua parte está documentada. [CONTEXTUAL]

