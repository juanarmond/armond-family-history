notes:
- text: >-
    Mother of Simplício José Ferreira Armond (P-0016); wife of José Cezário de Toledo
    Lima (P-0054), family F-0026. CORRECTION (7 August 2026): Simplício (not Eliza)
    is their confirmed child; see F-0026 and P-0017 for the correction. Named in
    PRB-0006 (1879 Matilde inventário) as "D. Claudina, tambem fallecida" — the wife
    of heir #4, deceased by 1879.
  text_pt: >-
    Mãe de Simplício José Ferreira Armond (P-0016); esposa de José Cezário de
    Toledo Lima (P-0054), família F-0026. CORREÇÃO (7 de agosto de 2026):
    Simplício (e não Eliza) é o filho confirmado deles; ver F-0026 e P-0017 para
    a correção. Nomeada em PRB-0006 (inventário de Matilde de 1879) como "D.
    Claudina, tambem fallecida" — a esposa do herdeiro nº 4, falecida até 1879.
- text: >-
    Full name "Claudina Brandina de Jesus" is PRIMARY-CONFIRMED by two independent
    1867 primary records: (1) PRB-0008 cover (the inventário she shares with JC):
    "Claudina Brandina de Jesus"; (2) PRB-0009-p2 (Ladisláo's inventário, explicit
    declaration): "a mae destes Dona Claudina Brandina de Jesus é viúva." Prior to
    this, the full name was inferred from the daughter's name "Maria Bulandina
    (Brandina) de Toledo" in PRB-0006. The record form "Claudina" (PRB-0006) is
    preserved as a source variant. She was alive on 7 March 1867 — PRB-0008 p5
    records her physically present and taking the inventariante oath for JC's estate:
    "Dona Claudina Brandini de Jesus" appears as inventariante before the judge
    and swears to the estate facts on oath ("jurou aos Santos Evangelhos"). She died
    after 7 March 1867 and before 1879 (PRB-0006 refers to her as "tambem fallecida").
    Nationality Brazilian; no explicit birthplace is stated.
  text_pt: >-
    O nome completo "Claudina Brandina de Jesus" é CONFIRMADO POR REGISTRO
    PRIMÁRIO por dois registros primários independentes de 1867: (1) a capa de
    PRB-0008 (o inventário que ela compartilha com JC): "Claudina Brandina de
    Jesus"; (2) PRB-0009-p2 (o inventário de Ladisláo, declaração explícita): "a
    mae destes Dona Claudina Brandina de Jesus é viúva." Antes disso, o nome
    completo era inferido a partir do nome da filha "Maria Bulandina (Brandina)
    de Toledo" em PRB-0006. A forma de registro "Claudina" (PRB-0006) é preservada
    como variante de fonte. Ela estava viva em 7 de março de 1867 — PRB-0008 p5
    registra sua presença física e a tomada do juramento de inventariante para o
    espólio de JC: "Dona Claudina Brandini de Jesus" aparece como inventariante
    perante o juiz e jura sobre os fatos do espólio sob juramento ("jurou aos
    Santos Evangelhos"). Ela morreu depois de 7 de março de 1867 e antes de 1879
    (PRB-0006 refere-se a ela como "tambem fallecida"). Nacionalidade brasileira;
    nenhum local de nascimento explícito é declarado.