profile: >-
  ## Identity

  **Claudina Brandina de Jesus** — the full name is PRIMARY-CONFIRMED by two independent
  1867 records: the cover of her joint inventário with her husband (PRB-0008) and
  Ladisláo's inventário (PRB-0009 p2, "a mae destes Dona Claudina Brandina de Jesus é
  viúva") [PROVEN]. The short form "Claudina" (PRB-0006) is a source variant. She is the
  mother of Eliza Balbina de Toledo (P-0017), our direct ancestor.

  - **Marriage:** ⚭ José Cezário de Toledo Lima (P-0054), family F-0026.

  - **Life span:** born ~1831 [LEAD — collaborative-tree estimate; no baptism held]. Alive
  on 7 March 1867 — PRB-0008 records her physically present, taking the inventariante oath
  for her late husband's estate before the judge ("jurou aos Santos Evangelhos") [PROVEN].
  She died after 7 March 1867 and before 1879 (PRB-0006 names her "tambem fallecida", wife
  of heir #4).

  - **Parents:** unknown [OPEN]. Nationality Brazilian; no birthplace stated.

  ## Family and social network

  Wife of José Cezário; matriarch of a large Fazenda da Concórdia household. Her structured
  direct-line child is Eliza (P-0017); her other children are documented on family F-0026
  (see her husband's profile), including a son "Simplício José Ferreira de Toledo" (14 in
  1867) — a DIFFERENT person from her son-in-law Simplício José Ferreira Armond (P-0016),
  Eliza's husband, not her son. The recurring "Brandina / Bulandina / Balbina" name element
  across her daughters (Eliza *Balbina*, Maria *Bulandina/Claudina*) tracks her own name —
  a maternal naming signature. [INFERRED]

  ## Inventariante of the Fazenda da Concórdia estate (1867)

  Widowed in September 1866, Claudina was the **cabeça-de-casal / inventariante** of her late
  husband's estate: on 7 March 1867 at the Fazenda da Concórdia she was sworn before the Juiz
  Municipal e de Órfãos, presented the whole estate for appraisal, and personally made the
  inventariante's sworn declarations. She died herself while the estate was still in process
  — which is why so many of her children appear as wards under the curador Aureliano de Sales
  Toledo. [PROVEN — PRB-0008]

  - **Literacy [PROVEN — signed].** She signed her own declarations in her own hand — her
  autograph "Claudina B[r]a[n]dina de Jezus" closes the *Termo de declaração da Inventariante*
  (fl.8r), and she signs again on the fl.4v and p6 folios, self-spelling her name variously
  (Bulandina / Brandina). She is the one woman in the direct Toledo line with a held autograph,
  in contrast with the several *a-rogo* (signed-for) women of the same estate cluster. [PROVEN
  — PRB-0008]

  - **The estate she managed:** a coffee fazenda at Concórdia (Districto do Rio Pardo) — a
  dwelling house, paiol, coffee-house, an engenho, a roadside *casa de negócio* (300$000) and
  roughly 32,000 coffee trees, plus livestock and household goods (a gold watch, silver,
  tools). [PROVEN — PRB-0008 avaliação, fl.5r–7r]

  - **The estate's principal debt she declared [PROVEN].** In the *Termo de declaração da
  Inventariante* (fl.8r) she declared the estate's chief liability — a hypothecary debt (dívida
  hipotecária) of **3:885$000** (≈3.9 contos), at 1% per month, owed since 12 September 1859
  [uncertain] to (Casa) Francisco Leocádio de Toledo, a Toledo-family creditor. The
  José-Cezário sub-estate was thus debt-encumbered at the 1866–67 death and inventory — part of
  why the Toledo land converted into the modest cash shares of the next generation. [PROVEN —
  PRB-0008 fl.8r; the within-family character of the credit line is CONTEXTUAL]

  ## The enslaved people held in the estate

  As cabeça-de-casal / inventariante she was the enslaver of record. The 1867 avaliação
  registers **ten enslaved people** held in the Concórdia estate, appraised as property (origin
  recorded as *de nação* = African-born, or *crioulo/a* = born in Brazil):

  - Lucas, *de nação*, 32 — 1:700$000 · Pedro, *de nação*, 33 — 1:100$000 · Miguel, *crioulo*,
  14 — 800$000 · Thobias, *crioulo*, 12 — 1:400$000 · Benedicto, *crioulo*, 9 — 800$000 ·
  Faustina, *crioula*, 9 — 1:100$000 · Virgiliana, *crioula*, 17 — 1:400$000 · Luiza, *de
  nação*, 36 [uncertain] — 800$000 · Joana, *crioula*, 40 — 800$000 · Eugenio, *crioulo*, 14 —
  1:400$000.

  Five of the ten were children aged 9–14. The estate's appraised goods also included "um tronco
  para prisão, de ferro e algemas" — iron stocks and shackles — listed plainly among the
  chattels. The 14-year-old Eugenio had earlier been handed over as part of the dowry (*dote*)
  when the couple's daughter Maria Blandina de Toledo married Manoel Marques Jorge; in this
  estate he was collated (*colação*) at half his appraised value, and Manoel renounced
  (*desistência*) his heir's share as satisfied by that dowry — a child transferred as marriage
  property within the family. [PROVEN — PRB-0008 fl.6r–6v, fl.7v, fl.10r]

  ## What we can extrapolate

  - **A high-fertility matriarch feeding partible dilution** [CONTEXTUAL]. As mother of a
  dozen-plus children she is, with Rita Angélica Rodrigues, one of two high-fertility
  matriarchs whose offspring divide the Toledo estate into many small shares; her husband's
  death and her own within the following decade left minors under curatela, compounding the
  fragmentation of the José-Cezário sub-estate that Eliza was an heir to and helping convert
  land into the modest cash shares of Eliza's generation.

  - **The "Brandina" element is almost certainly NOT a Brandão-family surname** [labeled
  inference]. In every primary her surname slot is the devotional "de Jesus"; "Brandina" sits
  in the middle-name position and recurs across her daughters spelled every which way — Eliza
  *Balbina*, Maria *Bulandina/Balandina*, Claudina *Brandina/Blandina*. That drift is the
  signature of a reused saint's given name (Santa Blandina de Lyon), not a fixed paternal
  surname — feminising "Brandão → Brandina" is not a Portuguese pattern. So there is no
  evidentiary basis to hunt a "Brandão family" for her; her paternal surname is genuinely
  unknown. (Not to be confused with the distinct Azorean Brandão of the Muniz line.)

  ## Open questions

  - Her parents — the decisive gap. [OPEN]

  - Her exact death date (after 7 March 1867, before 1879). [OPEN] A collaborative
  FamilySearch tree and her appearances as a named party in husband's-side estate actions of
  1869, 1870 and an 1876 Fazenda do Retiro division point toward a death nearer ~1876; but
  estates litigate in a deceased's name for years, so these may name her posthumously and do
  not firmly fix the year. [LEAD]

  ## Sources held (this repository)

  - PRB-0008 (1867 joint inventário — cover states her full name; she takes the inventariante
  oath, signs her own declarations, declares the 3:885$000 hypothecary debt, and the avaliação
  registers the estate's ten enslaved people) · PRB-0009 (1867 Ladisláo inventário, p2 —
  declares her a living widow) · PRB-0006 (1879 Matilde inventário — "D. Claudina, tambem
  fallecida", wife of heir #4) · PRB-0004 (Concórdia / São Bento deed — Toledo succession
  context).

  ## Regional and migration context

  She lived and died at the Fazenda da Concórdia, the Toledo family seat in the Leopoldina
  zona da mata coffee frontier. No move of her own is documented. [CONTEXTUAL]

  ## Where to go today

  - **Lived and died (1867×1876):** Fazenda da Concórdia, distrito de Tebas (Leopoldina), MG
  [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **1867 inventário she signed:** Fórum da Comarca de Leopoldina, MG (Rua Geraldo Campana
  200) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Identidade

  **Claudina Brandina de Jesus** — o nome completo é CONFIRMADO POR REGISTRO PRIMÁRIO por
  dois registros independentes de 1867: a capa de seu inventário conjunto com o marido
  (PRB-0008) e o inventário de Ladisláo (PRB-0009 p2, "a mae destes Dona Claudina Brandina
  de Jesus é viúva") [PROVEN]. A forma curta "Claudina" (PRB-0006) é uma variante de fonte.
  Ela é a mãe de Eliza Balbina de Toledo (P-0017), nossa ancestral direta.

  - **Casamento:** ⚭ José Cezário de Toledo Lima (P-0054), família F-0026.

  - **Período de vida:** nascida por volta de 1831 [LEAD — estimativa de árvore colaborativa;
  nenhum batismo disponível]. Viva em 7 de março de 1867 — PRB-0008 registra sua presença
  física, prestando o juramento de inventariante do espólio do falecido marido perante o juiz
  ("jurou aos Santos Evangelhos") [PROVEN]. Morreu depois de 7 de março de 1867 e antes de
  1879 (PRB-0006 a nomeia "tambem fallecida", esposa do herdeiro nº 4).

  - **Pais:** desconhecidos [OPEN]. Nacionalidade brasileira; nenhum local de nascimento
  declarado.

  ## Família e rede social

  Esposa de José Cezário; matriarca de uma grande casa na Fazenda da Concórdia. Seu filho
  estruturado da linha direta é Eliza (P-0017); seus outros filhos estão documentados na
  família F-0026 (ver o perfil do marido), incluindo um filho "Simplício José Ferreira de
  Toledo" (14 anos em 1867) — pessoa DIFERENTE de seu genro Simplício José Ferreira Armond
  (P-0016), marido de Eliza, não seu filho. O recorrente elemento de nome "Brandina /
  Bulandina / Balbina" entre suas filhas (Eliza *Balbina*, Maria *Bulandina/Claudina*)
  acompanha o próprio nome dela — uma assinatura de nomeação materna. [INFERRED]

  ## Inventariante do espólio da Fazenda da Concórdia (1867)

  Viúva em setembro de 1866, Claudina foi a **cabeça-de-casal / inventariante** do espólio do
  falecido marido: em 7 de março de 1867, na Fazenda da Concórdia, prestou juramento perante o
  Juiz Municipal e de Órfãos, apresentou todo o espólio para avaliação e fez pessoalmente as
  declarações juradas de inventariante. Morreu ela mesma enquanto o inventário ainda corria —
  razão pela qual tantos de seus filhos figuram como tutelados sob o curador Aureliano de
  Sales Toledo. [PROVEN — PRB-0008]

  - **Alfabetização [PROVEN — assinou].** Assinou suas próprias declarações de próprio punho —
  seu autógrafo "Claudina B[r]a[n]dina de Jezus" encerra o *Termo de declaração da
  Inventariante* (fl.8r), e ela assina novamente nas fls. 4v e p6, grafando o próprio nome de
  formas variadas (Bulandina / Brandina). É a única mulher da linha direta Toledo com um
  autógrafo disponível, em contraste com as várias mulheres *a rogo* (que assinaram por
  procuração) do mesmo conjunto de inventários. [PROVEN — PRB-0008]

  - **O espólio que administrou:** uma fazenda de café em Concórdia (Districto do Rio Pardo) —
  casa de morada, paiol, casa de café, um engenho, uma *casa de negócio* à beira da estrada
  (300$000) e cerca de 32 mil pés de café, além de animais e bens domésticos (um relógio de
  ouro, prata, ferramentas). [PROVEN — PRB-0008 avaliação, fls. 5r–7r]

  - **A principal dívida do espólio que ela declarou [PROVEN].** No *Termo de declaração da
  Inventariante* (fl.8r) declarou a principal obrigação do espólio — uma dívida hipotecária de
  **3:885$000** (≈3,9 contos), a prêmio de 1% ao mês, vencida desde 12 de setembro de 1859
  [uncertain], devida à (Casa) Francisco Leocádio de Toledo, um credor da família Toledo. O
  sub-espólio de José-Cezário estava, assim, onerado por dívida à morte/inventário de 1866–67 —
  parte da razão pela qual as terras Toledo se converteram nas modestas quotas em dinheiro da
  geração seguinte. [PROVEN — PRB-0008 fl.8r; o caráter intrafamiliar da linha de crédito é
  CONTEXTUAL]

  ## As pessoas escravizadas mantidas no espólio

  Como cabeça-de-casal / inventariante, ela era a escravizadora de registro. A avaliação de 1867
  arrola **dez pessoas escravizadas** mantidas no espólio da Concórdia, avaliadas como
  propriedade (origem registrada como *de nação* = nascida na África, ou *crioulo/a* = nascida
  no Brasil):

  - Lucas, *de nação*, 32 — 1:700$000 · Pedro, *de nação*, 33 — 1:100$000 · Miguel, *crioulo*,
  14 — 800$000 · Thobias, *crioulo*, 12 — 1:400$000 · Benedicto, *crioulo*, 9 — 800$000 ·
  Faustina, *crioula*, 9 — 1:100$000 · Virgiliana, *crioula*, 17 — 1:400$000 · Luiza, *de
  nação*, 36 [uncertain] — 800$000 · Joana, *crioula*, 40 — 800$000 · Eugenio, *crioulo*, 14 —
  1:400$000.

  Cinco das dez eram crianças de 9 a 14 anos. Entre os bens avaliados do espólio constava ainda
  "um tronco para prisão, de ferro e algemas" — um tronco de ferro e algemas — listado
  simplesmente entre os móveis. O menino Eugenio, de 14 anos, fora antes entregue como parte do
  dote quando a filha do casal, Maria Blandina de Toledo, casou-se com Manoel Marques Jorge;
  neste inventário ele foi levado à colação por metade do valor avaliado, e Manoel renunciou
  (*desistência*) à sua quota de herdeiro por estar satisfeito com aquele dote — uma criança
  transferida como propriedade matrimonial dentro da família. [PROVEN — PRB-0008 fls. 6r–6v,
  7v, 10r]

  ## O que podemos extrapolar

  - **Uma matriarca de alta fecundidade que alimenta a diluição partível** [CONTEXTUAL]. Como
  mãe de mais de uma dúzia de filhos, ela é, com Rita Angélica Rodrigues, uma das duas
  matriarcas de alta fecundidade cuja prole divide o espólio Toledo em muitas pequenas quotas;
  a morte do marido e a sua própria na década seguinte deixaram os menores sob curatela,
  agravando a fragmentação do sub-espólio de José-Cezário do qual Eliza era herdeira e
  ajudando a converter terra nas modestas quotas em dinheiro da geração de Eliza.

  - **O elemento "Brandina" quase certamente NÃO é um sobrenome da família Brandão**
  [inferência rotulada]. Em todo registro primário, seu campo de sobrenome é o devocional "de
  Jesus"; "Brandina" ocupa a posição de nome do meio e recorre entre suas filhas grafado de
  todas as formas — Eliza *Balbina*, Maria *Bulandina/Balandina*, Claudina *Brandina/Blandina*.
  Essa oscilação é a assinatura de um nome de santa reutilizado (Santa Blandina de Lyon), não
  de um sobrenome paterno fixo — feminizar "Brandão → Brandina" não é um padrão português.
  Assim, não há base probatória para procurar uma "família Brandão" para ela; seu sobrenome
  paterno é genuinamente desconhecido. (Não confundir com o distinto Brandão açoriano da linha
  Muniz.)

  ## Questões em aberto

  - Seus pais — a lacuna decisiva. [OPEN]

  - Sua data exata de óbito (depois de 7 de março de 1867, antes de 1879). [OPEN] Uma árvore
  colaborativa do FamilySearch e suas aparições como parte nomeada em ações do lado do marido
  de 1869, 1870 e numa divisão da Fazenda do Retiro de 1876 apontam para um óbito mais próximo
  de ~1876; mas espólios litigam em nome do falecido por anos, de modo que essas menções podem
  ser póstumas e não fixam o ano com firmeza. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PRB-0008 (inventário conjunto de 1867 — a capa declara seu nome completo; ela presta o
  juramento de inventariante, assina suas próprias declarações, declara a dívida hipotecária de
  3:885$000 e a avaliação arrola as dez pessoas escravizadas do espólio) · PRB-0009 (inventário
  de Ladisláo de 1867, p2 — a declara viúva viva) · PRB-0006 (inventário de Mathilde de 1879 —
  "D. Claudina, tambem fallecida", esposa do herdeiro nº 4) · PRB-0004 (escritura da Concórdia /
  São Bento — contexto da sucessão Toledo).

  ## Contexto regional e migratório

  Viveu e morreu na Fazenda da Concórdia, a sede da família Toledo na fronteira cafeeira da
  zona da mata de Leopoldina. Nenhuma mudança de sua parte está documentada. [CONTEXTUAL]

  ## Onde ir hoje

  - **Onde viveu e morreu (1867×1876):** Fazenda da Concórdia, distrito de Tebas (Leopoldina),
  MG [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **Inventário de 1867 que ela assinou:** Fórum da Comarca de Leopoldina, MG (Rua Geraldo
  Campana 200) [RESOLVED] ·
