  (escritura da Concórdia / São Bento — contexto da sucessão Toledo).

  ## Contexto regional e migratório

  Viveu e morreu na Fazenda da Concórdia, a sede da família Toledo na fronteira cafeeira
  da zona da mata de Leopoldina — distrito que em 1883 tinha a segunda maior população
  escravizada de Minas Gerais. Nenhum deslocamento próprio está documentado e nenhuma
  origem é registrada: ao contrário dos homens da linha, cujas migrações de Villa Rica a
  Barbacena e à Zona da Mata são rastreáveis passo a passo, ela entra no registro já
  dentro da casa que viria a chefiar. [CONTEXTUAL]

