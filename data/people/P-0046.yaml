profile: >-
  ## Interesting facts

  - **[PROVEN]** Her death act carries a clinical diagnosis, not a folk one. She died on 22 April 1878 of "Degeneração adiposa do coração" — fatty degeneration of the heart — where the other four deaths held for this family give only "morte natural", "ataque" or nothing at all (PAR-0011; compare PAR-0010, PAR-0009, PAR-0008). Someone with medical vocabulary saw her or was consulted about her.

  - **[PROVEN]** She is styled **"D. Ignacia Maria de Jesus"** in both the margin and the body of the act (PAR-0011). Her husband's own 1868 burial entry carries no honorific at all (PAR-0010). The asymmetry is small and may be nothing more than one curate's habit, but it is on the page. [INFERRED — the reading]

  - **[PROVEN]** She was buried in the "Cemiterio publico desta Villa de Santo Antonio da Sapucaia". Ten years earlier her husband had been buried in the "Cemiterio deste Curato" (PAR-0010). Between the two acts the place had become a *villa* and the burial ground had become public — the local trace of the nineteenth-century secularisation of Brazilian cemeteries. [CONTEXTUAL]

  - **[PROVEN]** She outlived her husband by a decade, from March 1868 to April 1878, and died at 65. She therefore saw her granddaughter Susanna baptised in 1866 but **not** Susanna's marriage, which came in December 1882, four and a half years after her own death.

  - **[INFERRED]** Her name is the one thing she is documented transmitting: **Ignacia** Maria de Jesus → her presumed daughter **Rita Ignacia** de Jesus → her great-granddaughter Susanna **Rita** Brandão. That chain is also, by itself, the reason she is believed to be Rita's mother.

  ## Identity

  **Ignacia Maria de Jesus** — known from a single held record, her own death. [PROVEN]

  - **Relationship:** 2×-great-grandmother of **Antenor Muniz** (P-0006, 1923–2014) on the reading that she is Rita's mother — the chain runs Ignacia → Rita Ignacia de Jesus (P-0041) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. The first link in that chain is an inference, not a documented statement; the rest are proven. [derived from families F-0022, F-0019, F-0007 and F-0001]

  - **Spouse:** Antonio Caetano Machado (P-0045), named as her late husband in her 1878 death (PAR-0011; family F-0022). [PROVEN]

  - **Born:** about **1813**, on the age of 65 given in the 1878 act. [INFERRED from the stated age]

  - **Death:** buried 22 April 1878 in the public cemetery of the Villa de Santo Antônio de Sapucaia (RJ), a widow, aged 65, cause "degeneração adiposa do coração"; commended and accompanied to the cemetery; officiant the Cura Francisco Rodrigues Lageira (PAR-0011). [PROVEN]

  - **Her link to Rita Ignacia de Jesus (P-0041) is an inference and is kept as one.** The act proves she was Antonio Caetano Machado's wife; it does not say she was Rita's mother. The reading rests on that marriage plus the shared given name, and it is not upgraded here. Her husband's own 1868 óbito names no wife (both pages read — a bounded negative), so no second record corroborates the link. [INFERRED]

  - **Parents and origin:** unknown; nationality left unset, since no birthplace or stated *nacionalidade* is evidenced. [OPEN]

  ## Standing and profession

  Nothing occupational, proprietary or titular is recorded for her. [PROVEN as a negative across the one held act] Her literacy is undocumented; an óbito carries the officiant's signature, not the deceased's. [OPEN] The only status markers in her record are the "Dona" and the medical cause of death, and both should be read lightly: the honorific was common courtesy for a married or widowed woman, and a recorded diagnosis says a physician's opinion reached the priest, not that the household could afford one as a matter of course. [INFERRED]

  ## Family and social network

  Wife, then widow, of Antonio Caetano Machado (P-0045), the long-settled Sapucaia householder who stood godfather at Susanna's 1866 baptism. On the inferred reading she is the mother of Rita Ignacia de Jesus (P-0041), hence Susanna's maternal grandmother, placing her inside the Sapucaia household network that a few years later would sponsor and then absorb the Azorean Muniz immigrants. She is not herself named in any of those baptisms — her husband is. A weak alternative candidate for Rita's mother exists: Luiza Maria da Conceição, the co-godparent at Susanna's 1866 baptism, who is **not** labelled "avó materna" while Antonio Caetano is labelled "avô materno" — an asymmetry that argues against her and, indirectly, leaves Ignacia the better reading. [LEAD, weak]

  ## What we can extrapolate

  **1. One act, read closely, still says something. [INFERRED]** The proportionate conclusion about a woman documented once is that almost nothing can be concluded. But her act is unusually detailed for this family: a named cause of death in clinical language, a "Dona", a solemn commendation and a procession to the cemetery. Set against her husband's terse 1868 entry and her daughter's 1898 one at Carangola, where no confession had even been sought, the 1878 act reads as the funeral of a woman whose household was known and attended to by its parish. That is the same asset the whole Sapucaia branch traded in — local standing — visible here on the day it was spent.

  **2. She is where the naming does the work of a lineage. [INFERRED / CONTEXTUAL]** "Maria de Jesus" is a devotional surname, not a family one: it names no kin, carries no property and asserts no claim, and it is what Brazilian women of non-propertied households were routinely given. What she passes down is the given name **Ignacia**, which reappears in her presumed daughter and, transmuted, in her great-granddaughter Susanna Rita. In lines with estates, surnames and property descend together and the archive records both. Here there is no estate, the surname is generic, and the only heritable marker is a first name — which is precisely why that name is now carrying the weight of a parentage claim.

  **3. Nothing she held could fragment. [INFERRED / CONTEXTUAL]** Brazilian partible succession divided estates equally among all children and could reduce a holding to unworkable fractions within two generations. Her death in 1878 opened no inventário, and neither did her husband's in 1868, her presumed daughter's in 1898 or her son-in-law's in 1912 — four consecutive deaths in one household line with no estate between them. The mechanism that explains the descent of propertied branches of this tree simply never runs here, and the consistency of that absence across fifty years is itself the strongest statement available about the family's standing.

  **4. Her decade of widowhood is a small, real datum about survival without property. [INFERRED / CONTEXTUAL]** Widowed at about 55 and dying at 65, she lived ten years after her husband in a household with no estate to administer and no probate to support her. How she lived is undocumented; that she remained in the same parish, and was buried from it with a procession, is what the record says. It is worth setting beside the same pattern two generations later, when Thereza Fernandes de Azevedo (P-0039) was widowed and moved into her married daughter's district. In families with nothing to inherit, widowhood is managed by kin and parish rather than by property, and both women's records show it.

  ## Open questions

  - A record directly naming her as Rita Ignacia de Jesus's mother — her husband's marriage act, or Rita's own baptism of about 1847 — which would promote that link from inference to proven. Both lie in the undigitised pre-1885 books of the Sapucaia predecessor parish. [OPEN]

  - Her own parents, birth and origin — none located. [OPEN]

  - Her other children, if any — no inventário and no "N filhos" statement exists. [OPEN]

  ## Sources held (this repository)

  - PAR-0011 (her 1878 Sapucaia death and burial — widow of Antonio Caetano Machado, aged 65, the cause of death, the public cemetery of the villa; the sole record for her).

  - PAR-0005 (her presumed granddaughter Susanna's 1866 baptism transcript — names her husband as the "avô materno"; the context in which her own motherhood of Rita is inferred) · PAR-0010 (her husband's 1868 death, which names no wife).

  ## Regional and migration context

  A woman of **Santo Antônio de Sapucaia**, in the Paraíba do Sul valley (RJ), with no movement documented: she is recorded once, in the place where her husband had lived and died ten years earlier. [CONTEXTUAL] Her lifetime, about 1813 to 1878, spans Brazilian independence, the Regency and the height of the valley's coffee economy, none of which her family is recorded as profiting from. Her burial in the *public* cemetery of the villa, against her husband's in the *curato* ground a decade earlier, marks the local arrival of the century's secularisation of burial. [CONTEXTUAL] The migrations that define this line come later and on other sides — the Azorean crossing of the Muniz in the 1860s, and her descendants' move to Minas Gerais in the 1890s. No origin is inferred from her surname, which is devotional rather than familial.

  ## Where to go today

  - **Burial (22 April 1878):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — the act names the "Cemiterio publico desta Villa de Santo Antonio da Sapucaia"; whether the modern municipal ground is the same is unconfirmed [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Her parish (and where the records that would confirm her motherhood should be sought):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu ato de óbito traz um diagnóstico clínico, não um diagnóstico popular. Faleceu em 22 de abril de 1878 de "Degeneração adiposa do coração" — onde as outras quatro mortes conservadas desta família dão apenas "morte natural", "ataque" ou nada (PAR-0011; compare-se PAR-0010, PAR-0009, PAR-0008). Alguém com vocabulário médico a viu ou foi consultado a seu respeito.

  - **[PROVEN]** É tratada por **"D. Ignacia Maria de Jesus"** tanto na margem quanto no corpo do ato (PAR-0011). O assento de sepultamento de seu marido, em 1868, não traz tratamento algum (PAR-0010). A assimetria é pequena e pode não ser mais que o hábito de um cura, mas está na página. [INFERRED — a leitura]

  - **[PROVEN]** Foi sepultada no "Cemiterio publico desta Villa de Santo Antonio da Sapucaia". Dez anos antes, seu marido fora sepultado no "Cemiterio deste Curato" (PAR-0010). Entre os dois atos o lugar tornara-se *villa* e o terreno de sepultamento tornara-se público — o rastro local da secularização oitocentista dos cemitérios brasileiros. [CONTEXTUAL]

  - **[PROVEN]** Sobreviveu ao marido por uma década, de março de 1868 a abril de 1878, e morreu aos 65 anos. Viu, portanto, o batismo de sua neta Susanna em 1866, mas **não** o casamento de Susanna, que veio em dezembro de 1882, quatro anos e meio depois de sua própria morte.

  - **[INFERRED]** Seu nome é a única coisa que ela está documentada transmitindo: **Ignacia** Maria de Jesus → sua presumida filha **Rita Ignacia** de Jesus → sua bisneta Susanna **Rita** Brandão. Essa cadeia é também, por si só, a razão de se acreditar que ela seja a mãe de Rita.

  ## Identidade

  **Ignacia Maria de Jesus** — conhecida por um único registro conservado, seu próprio óbito. [PROVEN]

  - **Parentesco:** trisavó de **Antenor Muniz** (P-0006, 1923–2014) pela leitura de que ela seja a mãe de Rita — a cadeia corre Ignacia → Rita Ignacia de Jesus (P-0041) → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. O primeiro elo dessa cadeia é inferência, não declaração documentada; os demais estão provados. [derivado das famílias F-0022, F-0019, F-0007 e F-0001]

  - **Marido:** Antonio Caetano Machado (P-0045), nomeado como seu falecido marido em seu óbito de 1878 (PAR-0011; família F-0022). [PROVEN]

  - **Nascimento:** por volta de **1813**, pela idade de 65 anos dada no ato de 1878. [INFERRED a partir da idade declarada]

  - **Óbito:** sepultada em 22 de abril de 1878 no cemitério público da Villa de Santo Antônio de Sapucaia (RJ), viúva, aos 65 anos, causa "degeneração adiposa do coração"; encomendada e acompanhada ao cemitério; celebrante o Cura Francisco Rodrigues Lageira (PAR-0011). [PROVEN]

  - **Seu vínculo com Rita Ignacia de Jesus (P-0041) é inferência e assim é mantido.** O ato prova que era esposa de Antonio Caetano Machado; não diz que era mãe de Rita. A leitura repousa nesse casamento somado ao prenome compartilhado, e não é promovida aqui. O próprio óbito de 1868 do marido não nomeia esposa (ambas as páginas lidas — negativa delimitada), de modo que nenhum segundo registro corrobora o vínculo. [INFERRED]

  - **Pais e origem:** desconhecidos; nacionalidade não definida, pois nenhum local de nascimento ou *nacionalidade* declarada está evidenciado. [OPEN]

  ## Posição social e profissão

  Nada ocupacional, patrimonial ou titular lhe é registrado. [PROVEN como negativa no único ato conservado] Sua alfabetização não está documentada; um óbito traz a assinatura do celebrante, não a do falecido. [OPEN] Os únicos marcadores de posição em seu registro são o "Dona" e a causa médica da morte, e ambos devem ser lidos com leveza: o tratamento era cortesia comum para mulher casada ou viúva, e uma causa registrada diz que a opinião de um médico chegou ao padre, não que o lar pudesse pagá-la de rotina. [INFERRED]

  ## Família e rede social

  Esposa, depois viúva, de Antonio Caetano Machado (P-0045), o chefe de casa havia muito estabelecido em Sapucaia, que foi padrinho no batismo de Susanna em 1866. Pela leitura inferida, ela é a mãe de Rita Ignacia de Jesus (P-0041), portanto avó materna de Susanna, o que a situa dentro da rede de lares de Sapucaia que poucos anos depois apadrinharia e então absorveria os imigrantes açorianos Muniz. Ela própria não é nomeada em nenhum desses batismos — o marido é. Existe uma candidata alternativa fraca à maternidade de Rita: Luiza Maria da Conceição, comadrinha no batismo de 1866 de Susanna, que **não** é rotulada "avó materna" enquanto Antonio Caetano é rotulado "avô materno" — assimetria que argumenta contra ela e, indiretamente, deixa Ignacia como a leitura melhor. [LEAD, fraca]

  ## O que podemos extrapolar

  **1. Um único ato, lido de perto, ainda diz algo. [INFERRED]** A conclusão proporcional sobre uma mulher documentada uma vez é que quase nada pode ser concluído. Mas seu ato é incomumente detalhado para esta família: uma causa de morte nomeada em linguagem clínica, um "Dona", uma encomendação solene e um cortejo ao cemitério. Posto contra o assento lacônico de 1868 do marido e contra o da filha, em 1898, em Carangola, onde nem confissão se buscara, o ato de 1878 lê-se como o funeral de uma mulher cujo lar era conhecido e atendido por sua paróquia. É o mesmo ativo em que todo o ramo de Sapucaia negociava — posição local — visível aqui no dia em que foi gasto.

  **2. É nela que a nomeação faz o trabalho de uma linhagem. [INFERRED / CONTEXTUAL]** "Maria de Jesus" é sobrenome devocional, não familiar: não nomeia parentela, não carrega propriedade e não afirma pretensão alguma, e é o que se dava rotineiramente às brasileiras de lares sem propriedade. O que ela lega é o prenome **Ignacia**, que reaparece em sua presumida filha e, transmutado, em sua bisneta Susanna Rita. Em linhas com espólios, sobrenomes e propriedade descem juntos e o arquivo registra ambos. Aqui não há espólio, o sobrenome é genérico, e o único marcador herdável é um prenome — e é precisamente por isso que esse nome carrega hoje o peso de uma alegação de filiação.

  **3. Nada do que ela detinha podia fragmentar-se. [INFERRED / CONTEXTUAL]** A sucessão partível brasileira dividia os espólios igualmente entre todos os filhos e podia reduzir uma posse a frações inviáveis em duas gerações. Sua morte em 1878 não abriu inventário, e tampouco a do marido em 1868, a de sua presumida filha em 1898 ou a do genro em 1912 — quatro mortes consecutivas numa mesma linha de lar, sem espólio algum entre elas. O mecanismo que explica a descida dos ramos com propriedade desta árvore simplesmente nunca corre aqui, e a consistência dessa ausência ao longo de cinquenta anos é, ela própria, a declaração mais forte disponível sobre a posição da família.

  **4. Sua década de viuvez é um dado pequeno e real sobre sobreviver sem propriedade. [INFERRED / CONTEXTUAL]** Viúva por volta dos 55 anos e falecida aos 65, viveu dez anos após o marido num lar sem espólio a administrar e sem inventário que a amparasse. Como viveu não está documentado; que permaneceu na mesma paróquia, e dela foi sepultada com cortejo, é o que o registro diz. Vale pôr isso ao lado do mesmo padrão duas gerações depois, quando Thereza Fernandes de Azevedo (P-0039) enviuvou e se mudou para o distrito da filha casada. Em famílias sem nada a herdar, a viuvez é administrada por parentela e paróquia, não por propriedade, e os registros das duas mulheres o mostram.

  ## Questões em aberto

  - Um registro que a nomeie diretamente como mãe de Rita Ignacia de Jesus — o ato de casamento de seu marido, ou o batismo da própria Rita, por volta de 1847 —, o que promoveria esse vínculo de inferência a fato provado. Ambos estão nos livros não digitalizados anteriores a 1885 da paróquia antecessora de Sapucaia. [OPEN]

  - Seus próprios pais, nascimento e origem — nenhum localizado. [OPEN]

  - Seus demais filhos, se houve — não existe inventário nem declaração de "N filhos". [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0011 (seu óbito e sepultamento de 1878 em Sapucaia — viúva de Antonio Caetano Machado, 65 anos, a causa da morte, o cemitério público da vila; o único registro dela).

  - PAR-0005 (a transcrição do batismo de 1866 de sua presumida neta Susanna — nomeia seu marido como "avô materno"; o contexto em que se infere sua maternidade sobre Rita) · PAR-0010 (o óbito de 1868 de seu marido, que não nomeia esposa).

  ## Contexto regional e migratório

  Uma mulher de **Santo Antônio de Sapucaia**, no vale do Paraíba do Sul (RJ), sem deslocamento documentado: é registrada uma vez, no lugar onde o marido vivera e morrera dez anos antes. [CONTEXTUAL] Sua vida, de cerca de 1813 a 1878, atravessa a independência do Brasil, a Regência e o auge da economia cafeeira do vale, de nada do que sua família conste ter lucrado. Seu sepultamento no cemitério *público* da vila, contra o do marido no terreno do *curato* uma década antes, marca a chegada local da secularização do sepultamento no século. [CONTEXTUAL] As migrações que definem esta linha vêm depois e por outros lados — a travessia açoriana dos Muniz nos anos 1860 e a mudança de seus descendentes para Minas Gerais nos anos 1890. Nenhuma origem é inferida de seu sobrenome, que é devocional e não familiar.

  ## Onde ir hoje

  - **Sepultamento (22 de abril de 1878):** Cemitério Municipal de Sapucaia, RJ (R. Augusta Marquês da Silva, São João, CEP 25880-000) — o ato nomeia o "Cemiterio publico desta Villa de Santo Antonio da Sapucaia"; se o terreno municipal moderno é o mesmo não está confirmado [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio%20Municipal%20de%20Sapucaia%2C%20RJ)

  - **Sua paróquia (e onde devem ser buscados os registros que confirmariam sua maternidade):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)
