profile: >-
  ## Interesting facts

  - **[PROVEN]** She died on 22 April 1878 at Santo Antônio de Sapucaia, aged 65, of "degeneração adiposa do coração" (fatty heart degeneration) — a descriptive 19th-century cardiac diagnosis (PAR-0011). With 65 years at death, her birth dates to about 1813 in the Sapucaia area.

  - **[INFERRED]** She outlived her husband Antonio Caetano Machado (P-0045) by 10 years — he died March 1868, she died April 1878 — so she was likely still alive to witness her granddaughter Susanna's marriage to the Açorean immigrant João Muniz Bittencourt, and possibly the births of some great-grandchildren.

  - **[CONTEXTUAL]** A woman born about 1813 in the Paraíba do Sul valley would have been a child when Brazilian independence was declared (1822), a young adult through the Regency and early Second Empire, and a mature woman when the Lei Eusébio de Queirós ended the slave trade (1850).

  - **[INFERRED]** The link between her and Rita Ignacia de Jesus (P-0041) — the "Ignacia" shared name — is the genealogical inference that makes her probable mother. The naming pattern (a daughter bearing her mother's first name) was common in 19th-century Brazil, especially in families without strong patronyms to carry as surname capital.

  - **[CONTEXTUAL]** The Sapucaia parish in the Paraíba do Sul valley was part of the coffee frontier that expanded through the 1830s–1850s; by the time of her death in 1878, the parish was well established, and the coffee economy had already made and broken fortunes across the valley. Her family appears in none of those fortunes — a settled, modest household leaving only vital records.

  ## Identity

  **Ignacia Maria de Jesus** — known from a single held record, her own death. [PROVEN]

  - **Spouse:** Antonio Caetano Machado (P-0045), named as her late husband in her 1878
  death (PAR-0011; family F-0022). [PROVEN]

  - **Death:** buried 22 April 1878 at Santo Antônio de Sapucaia (RJ), a widow, aged 65 (so
  born about 1813), cause "degeneração adiposa do coração" (PAR-0011). [PROVEN]

  - **Role:** a strong candidate for the mother of Rita Ignacia de Jesus (P-0041) — from her
  marriage to Antonio Caetano Machado plus the shared name (Rita Ignacia after Ignacia Maria
  de Jesus); the record proves the marriage but does not state she is Rita's mother, so that
  link is an inference. [INFERRED]

  - **Origin:** nationality left unset; no birthplace is evidenced. [OPEN]

  ## Open questions

  - A record directly naming her as Rita Ignacia de Jesus's mother — to promote that link
  from inference to proven. [OPEN]

  - Her own parents and origin — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0011 (her 1878 Sapucaia death — widow of Antonio Caetano Machado, age, cause; the
  sole record for her) · PAR-0005 (her presumed grandson-line context — Susanna's 1876
  baptism naming the maternal grandfather, her husband).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela faleceu em 22 de abril de 1878 em Santo Antônio de Sapucaia, aos 65 anos, de "degeneração adiposa do coração" — um diagnóstico cardíaco descritivo do século XIX (PAR-0011). Com 65 anos ao falecer, seu nascimento data de por volta de 1813 na região de Sapucaia.

  - **[INFERRED]** Ela sobreviveu ao marido Antonio Caetano Machado (P-0045) por 10 anos — ele faleceu em março de 1868, ela em abril de 1878 — portanto provavelmente ainda estava viva para testemunhar o casamento de sua neta Susanna com o imigrante açoriano João Muniz Bittencourt, e possivelmente o nascimento de alguns bisnetos.

  - **[CONTEXTUAL]** Uma mulher nascida por volta de 1813 no vale do Paraíba do Sul teria sido criança quando a independência do Brasil foi declarada (1822), jovem adulta durante a Regência e o início do Segundo Reinado, e mulher madura quando a Lei Eusébio de Queirós encerrou o tráfico de escravizados (1850).

  - **[INFERRED]** O vínculo entre ela e Rita Ignacia de Jesus (P-0041) — o nome "Ignacia" compartilhado — é a inferência genealógica que a torna provável mãe. O padrão de nomeação (uma filha com o nome da mãe) era comum no Brasil do século XIX, especialmente em famílias sem patronímicos fortes a carregar como capital de sobrenome.

  - **[CONTEXTUAL]** A freguesia de Sapucaia, no vale do Paraíba do Sul, fazia parte da fronteira cafeeira que se expandiu ao longo das décadas de 1830–1850; ao tempo de sua morte em 1878, a freguesia estava bem estabelecida, e a economia cafeeira já havia feito e desfeito fortunas em todo o vale. Sua família não aparece em nenhuma dessas fortunas — um domicílio modesto e estabelecido que deixou apenas registros vitais.

  ## Identidade

  **Ignacia Maria de Jesus** — conhecida por um único registro disponível, seu próprio óbito.
  [PROVEN]

  - **Cônjuge:** Antonio Caetano Machado (P-0045), nomeado seu falecido marido em seu óbito
  de 1878 (PAR-0011; família F-0022). [PROVEN]

  - **Óbito:** sepultada em 22 de abril de 1878 em Santo Antônio de Sapucaia (RJ), viúva, aos
  65 anos (portanto nascida por volta de 1813), causa "degeneração adiposa do coração"
  (PAR-0011). [PROVEN]

  - **Papel:** forte candidata a mãe de Rita Ignacia de Jesus (P-0041) — a partir de seu
  casamento com Antonio Caetano Machado somado ao nome compartilhado (Rita Ignacia a partir
  de Ignacia Maria de Jesus); o registro comprova o casamento, mas não afirma que ela seja
  mãe de Rita, de modo que essa ligação é uma inferência. [INFERRED]

  - **Origem:** nacionalidade deixada em branco; nenhum local de nascimento está evidenciado.
  [OPEN]

  ## Questões em aberto

  - Um registro que a nomeie diretamente como mãe de Rita Ignacia de Jesus — para promover
  essa ligação de inferência a comprovada. [OPEN]

  - Seus próprios pais e origem — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0011 (seu óbito de 1878 em Sapucaia — viúva de Antonio Caetano Machado, idade, causa;
  o único registro sobre ela) · PAR-0005 (o contexto de sua presumida linha de netos — o
  batismo de 1876 de Susanna que nomeia o avô materno, seu marido).
