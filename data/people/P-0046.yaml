notes:
- text: >-
    Wife (widow) of Antonio Caetano Machado (P-0045), named as such in her 1878
    Sapucaia death (PAR-0011, aged 65, so born c.1813). A strong candidate for the
    mother of Rita Ignacia de Jesus (P-0041) — Susanna's maternal grandmother — from
    the marriage plus the name pattern (Rita **Ignacia** de Jesus after **Ignacia**
    Maria de Jesus); the record proves her marriage to Antonio Caetano Machado but does
    not state she is Rita's mother, so that link is an inference (see F-0022).
  text_pt: >-
    Esposa (viúva) de Antonio Caetano Machado (P-0045), assim nomeada em seu
    óbito de 1878 em Sapucaia (PAR-0011, aos 65 anos, portanto nascida por volta
    de 1813). Forte candidata a mãe de Rita Ignacia de Jesus (P-0041) — a avó
    materna de Susanna — a partir do casamento somado ao padrão de nomes (Rita
    **Ignacia** de Jesus a partir de **Ignacia** Maria de Jesus); o registro
    comprova seu casamento com Antonio Caetano Machado, mas não afirma que ela
    seja mãe de Rita, de modo que essa ligação é uma inferência (ver F-0022).
