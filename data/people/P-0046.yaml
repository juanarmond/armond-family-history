profile: >-
  ## Identity

  **Ignacia Maria de Jesus** — known from a single held record, her own death. [PROVEN]

  - **Spouse:** Antonio Caetano Machado (P-0045), named as her late husband in her 1878
  death (PAR-0011; family F-0022). [PROVEN]

  - **Death:** buried 22 April 1878 at Santo Antônio de Sapucaia (RJ), a widow, aged 65 (so
  born about 1813), cause "degeneração adiposa do coração" (PAR-0011). [PROVEN]

  - **Role:** a strong candidate for the mother of Rita Ignacia de Jesus (P-0041) — from her
  marriage to Antonio Caetano Machado plus the shared name (Rita Ignacia after Ignacia Maria
  de Jesus); the record proves the marriage but does not state she is Rita's mother, so that
  link is an inference. [INFERRED]

  - **Origin:** nationality left unset; no birthplace is evidenced. [OPEN]

  ## Open questions

  - A record directly naming her as Rita Ignacia de Jesus's mother — to promote that link
  from inference to proven. [OPEN]

  - Her own parents and origin — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0011 (her 1878 Sapucaia death — widow of Antonio Caetano Machado, age, cause; the
  sole record for her) · PAR-0005 (her presumed grandson-line context — Susanna's 1876
  baptism naming the maternal grandfather, her husband).
