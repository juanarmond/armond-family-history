  - **Óbito:** sepultada em 22 de abril de 1878 em Santo Antônio de Sapucaia (RJ), viúva, aos
  65 anos (portanto nascida por volta de 1813), causa "degeneração adiposa do coração"
  (PAR-0011). [PROVEN]

  - **Papel:** forte candidata a mãe de Rita Ignacia de Jesus (P-0041) — a partir de seu
  casamento com Antonio Caetano Machado somado ao nome compartilhado (Rita Ignacia a partir
  de Ignacia Maria de Jesus); o registro comprova o casamento, mas não afirma que ela seja
  mãe de Rita, de modo que essa ligação é uma inferência. [INFERRED]

  - **Origem:** nacionalidade deixada em branco; nenhum local de nascimento está evidenciado.
  [OPEN]

  ## Questões em aberto

