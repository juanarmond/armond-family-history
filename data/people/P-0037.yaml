  - Óbito L1 da NF-Catedral (óbito paroquial de 1860 da filha bebê Isabel — nomeia-a como "Maria
  Joanna Rocheman", situando o casal em NF em 1860, antes do interlúdio no Rio).

  - CIV-0019 (nascimento de 1890 de Alberto Bohrer, em Nova Friburgo — nomeia-a como avó materna).

  - PAR-0077 (batismo de 1863 da filha Lucinda, no Rio de Janeiro — nomeia-a como mãe) · PAR-0056
  (casamento de 1884 da filha Lucinda, em Nova Friburgo — nomeia-a como mãe).

  - CIV-0036 (casamento de 1895 do filho Octávio — está viva e residente em Nova Friburgo) ·
  CIV-0037 (casamento de 1899 da filha Maria da Gloria — está "aqui fallecida", falecida em NF
  até out. 1899).
