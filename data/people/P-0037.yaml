profile: >-
  ## Interesting facts

  - **[PROVEN]** She was born on 2 May 1841 in Nova Friburgo as "Maria Joanna Rocheman" — the daughter of João José Rocheman (Rutschmann), a Swiss immigrant from Bulle, canton Fribourg (PAR-0069; Bulle per PAR-0071 and PAR-0076). Her birth surname Rocheman was already the Portuguese phonetic rendering of the Swiss "Rutschmann."

  - **[CONTEXTUAL]** Her father's surname Rutschmann/Rocheman is specifically noted as a Swiss-German Nova Friburgo colonist surname that was "often mangled in records": her birth record's "Rocheman" is one such mangling, and by her marriage she became "Maria Joanna da Silva Ferreira," with the Swiss surname fully shed within one generation.

  - **[INFERRED]** She married a Portuguese immigrant (Antonio da Silva Ferreira, P-0036) in 1859 at age 18 — a Nova Friburgo-born daughter of a Swiss colonist marrying an individual immigrant from Portugal. This made her children (including Lucinda, P-0031) the product of three national streams: Swiss (paternal grandfather), Portuguese (father), and Brazilian (herself and her mother).

  - **[CONTEXTUAL]** She died between 1895 and 1899 at Nova Friburgo — alive in December 1895, recorded "aqui fallecida" by October 1899 (CIV-0036, CIV-0037). She died during Brazil's first republican decade, when the old imperial social structures were being reorganised and the civil registration system was still new. **[LEAD]** The retrieval research reports her own parish burial entry, which would narrow this to 30 November 1896, aged 55, of chronic nephritis; that record is not yet catalogued here.

  - **[PROVEN]** The summer of 1860 took both her first child and her father. Her six-week-old daughter Isabel died on 9 June 1860 (PAR-0082) and her father João José Rocheman on 22 July 1860 (PAR-0071) — six weeks apart, both entered by the same vicar, Jacob Joye, on the same page (fl. 139) of the Nova Friburgo death register.

  - **[PROVEN]** Her daughter Lucinda (born 10 Aug 1862 in Rio de Janeiro, PAR-0077) and her own Nova Friburgo birth (1841) both reflect a family that moved between Rio de Janeiro and the highland colony — consistent with the Ferreira da Silva / Rocheman household returning to Nova Friburgo after a period in the capital (PAR-0069, PAR-0077).

  - **[PROVEN]** The couple was in Nova Friburgo in 1860: their infant daughter Isabel (b. 23 Apr / d. 9 Jun 1860) was buried there, recorded in the parish death register as a legitimate daughter of Antonio da Silva Ferreira and Maria Joanna (PAR-0082). The surname written after "Maria Joanna" in that entry is uncertain — this repository's transcription reads it "Bock[e]man[?]"; the retrieval research reads it "Rocheman", which would be her maiden form a year after the wedding [uncertain]. The family then moved to Rio (Lucinda b. 10 Aug 1862 at freg. de S. João Baptista da Lagoa, PAR-0077; Octávio b. ~1868 at freg. de N.S. da Conceição da Aparecida, RJ, CIV-0036) before returning to Nova Friburgo by ~1876 (daughter Maria da Gloria b. NF, CIV-0037).

  ## Identity

  **Maria Joanna da Silva Ferreira** (née **Rocheman/Rutschmann**) — the Nova-Friburgo-born
  daughter of a Swiss colonist, who married a Portuguese immigrant. [PROVEN]

  - **Role:** mother of Lucinda Ferreira da Silva (P-0031) and wife of Antonio da Silva Ferreira
  (P-0036; family F-0017); hence Celina Bohrer's (P-0015) maternal grandmother. [PROVEN]

  - **Birth:** born 2 May 1841 at Nova Friburgo and baptised 20 February 1842 at the Matriz de
  São João Baptista (PAR-0069, event E-0093), legitimate daughter of João José Rocheman
  (Rutschmann, P-0109) — a Swiss immigrant from Bulle, canton Fribourg — and Elisabeth (Isabel)
  Storck (P-0110); family F-0054. [PROVEN]

  - **Marriage:** married Antonio da Silva Ferreira on 3 March 1859 at the same church, aged 18
  (PAR-0070, event E-0094). [PROVEN]

  - **Death:** at Nova Friburgo, ~1896-1899 [STRONG-EVIDENCE — CIV-0036/CIV-0037] (event E-0125).
  She was alive and resident there in December 1895 (named a living parent in son Octávio's
  marriage, CIV-0036) and had died at Nova Friburgo by 28 October 1899 ("aqui fallecida" in
  daughter Maria da Gloria's marriage, CIV-0037). **[LEAD]** The retrieval research reports her own
  burial entry in the Nova Friburgo parish death register (book 3, fl. 5, no. 36): buried 1
  December 1896, having died on 30 November of chronic nephritis, aged 55, "nascida e moradora
  n'esta freguezia", "casada com Antonio da Silva Ferreira", her parents named and "já fallecidos".
  That entry is not catalogued here, so event E-0125 keeps the 1895–1899 bracket until it is; the
  reported age 55 agrees with her 1841 birth.

  ## Standing and profession

  - No occupation, property or literacy is recorded for her in any held act (PAR-0069, PAR-0070,
  CIV-0036, CIV-0037) [PROVEN of the gap]. She is documented only as daughter, bride, wife and
  mother, and as a maternal grandmother in 1890 (CIV-0019).

  ## Family and social network

  She sits at the junction of two immigrant strands of the Nova Friburgo colony: her father's
  Swiss line (Rutschmann of Bulle) and her husband's Portuguese in-migration. Her daughter Lucinda
  married into the *negociante* Bohrer household at the Alto da Serra (CIV-0019) — the documented
  petty-merchant band of the colony [INFERRED/CONTEXTUAL]. The documented sibling set includes:
  **Isabel da Silva Ferreira** (b. 23 Apr / d. 9 Jun 1860, NF — infant; the parish death entry
  names both parents, the mother's surname read uncertainly; PAR-0082 [PROVEN]); **Octávio Ferreira
  da Silva** (m. Octavia Froidevaux, 28 Dec 1895 NF; CIV-0036 names both parents alive in NF;
  [PROVEN]); **Maria da Gloria da Silva Ferreira** (m. Ezequiel Mathias Dias, 28 Oct 1899 NF;
  CIV-0037 names her and records Maria Joanna "aqui fallecida"; [PROVEN]); and **Antonio da Silva
  Ferreira Junior** (operário, declarant of his father Antonio Sr's 1914 NF civil death; the 1914
  act names only the father — Maria Joanna was already dead — so parentage is [BORDERLINE — one-
  parent naming only]). A José da Silva Ferreira stood godfather, with her daughter Maria da
  Gloria as godmother, at her granddaughter Celina's 1899 baptism (PAR-0057) [PROVEN]; that he was
  a further son is a [LEAD] only — no record names his parents, and the Raibert 1896 NF marriage
  for a "José Ferreira da Silva" was pulled by the retrieval research and eliminated as a different
  family.

  - **Her baptismal godparents** were João Balineat and Maria Fabre (PAR-0069) — the same couple
  who, as "João Balmat and Maria Fabre", had witnessed her parents' marriage in 1840 (PAR-0076)
  [PROVEN]: neighbours who stood by the household twice.

  - **A probable sister.** [LEAD] The retrieval research reports, from César Raibert's index of
  Rio de Janeiro church marriages (not held here), an 1858 Nova Friburgo marriage of **Leocádia
  Cristina Rocheman** to Luís Martins Pinheiro, on a folio just before Maria Joanna's own, and reads
  a "Luiz Martins Pinheiro" among her 1859 marriage witnesses. This repository's transcription of
  that witness reads "Luiz Mathias Pinheiro" (PAR-0070), so the brother-in-law link is unconfirmed;
  Leocádia's own marriage act or baptism naming João José Rocheman and Elisabeth Storck would
  settle it.

  ## What we can extrapolate

  **She is the first Brazil-born generation of a colonist household, and she inherited into its
  floor rather than out of it.** Born at Nova Friburgo on 2 May 1841 and baptised there on 20
  February 1842, legitimate daughter of the colonist couple João José Rocheman (Rutschmann) and
  Elisabeth Storck (PAR-0069) [PROVEN], she married at eighteen in March 1859 (PAR-0070)
  [PROVEN]. The colony's package — a lot, a house, rations, seed, livestock and a daily subsidy
  of 160 réis falling to 80, for a two-year establishment period (Decreto de 16 May 1818) — was
  subsistence support on poor, steep serra ground, worth roughly a seventh of a free rural
  labourer's annual wage, not a fortune [CONTEXTUAL]. Divided by partible succession across the
  large households of that generation, a daughter's share of it was negligible [CONTEXTUAL]. No
  property, occupation or literacy is recorded for her in any held act.

  **Forty years after the landing she married out of the colony.** Her husband Antonio da Silva
  Ferreira was a Portuguese in-migrant with no colony grant (PAR-0070) [PROVEN]. That is a small
  but firm data point: Nova Friburgo's transplanted Swiss and German pool was already
  intermarrying with the surrounding Luso-Brazilian population by its second generation, and the
  marriage market was sorting by economic level rather than by origin. [INFERRED]

  **Her married life was itinerant, and it was hard.** She buried a six-week-old daughter,
  Isabel, at Nova Friburgo in June 1860, fifteen months after the wedding (PAR-0082) [PROVEN];
  her daughter Lucinda was born in the imperial capital in 1862 (PAR-0077); her son Octávio in
  the freguesia of Aparecida about 1868 (CIV-0036); her daughter Maria da Gloria back at Nova
  Friburgo about 1876 (CIV-0037) [PROVEN]. Four children, four places, and no property recorded
  at any of them — the pattern of a household moving for work. [INFERRED]

  **She is the vanishing point of the Rutschmann surname and of her own record.** Taking "da
  Silva Ferreira" at marriage, she leaves the colonist name surviving in this family only as the
  fossil "Roschemant / Rochemont" inside her daughter's full name (PAR-0056) [PROVEN]. Her own
  death is datable only through other people's marriages: alive and resident at Nova Friburgo in
  December 1895 (CIV-0036), "aqui fallecida" by October 1899 (CIV-0037) [STRONG-EVIDENCE]. Her
  husband outlived her by at least fifteen years. A woman of this band is locatable in time only
  by the documents her children generate. [INFERRED]

  **Her marriage points the line toward trade and wages rather than land.** [INFERRED] Her
  daughter Lucinda married a *negociante* at the Alto da Serra (PAR-0056) and her sons appear as
  *operários* (CIV-0035, CIV-0036) [PROVEN]. She is therefore the hinge from the
  colonist-smallholder floor into the town's petty-commerce and wage band — a lateral drift at
  the same modest level, never a rise into an elite, and the mirror image of the paternal Armond
  arc of this family, which arrived at that same level by falling from above.

  ## Open questions

  - Her exact death record — her death is bracketed to Nova Friburgo, ~1896-1899
  (CIV-0036/CIV-0037). The retrieval research reports the parish burial entry (Nova Friburgo
  death register book 3, fl. 5, no. 36: died 30 November 1896) [LEAD]; cataloguing that image
  would fix the date. [OPEN]

  - Whether Leocádia Cristina Rocheman (m. 1858) was her sister [LEAD], and the surname written for
  her in Isabel's 1860 death entry (PAR-0082, read uncertainly). [OPEN]

  ## Sources held (this repository)

  - PAR-0069 (her 1841/42 Nova Friburgo baptism — names her parents).

  - PAR-0070 (her 1859 Nova Friburgo marriage to Antonio da Silva Ferreira).

  - PAR-0082 (infant daughter Isabel's 1860 Nova Friburgo parish death — names her as mother,
  placing the couple in NF in 1860 before the Rio interlude).

  - CIV-0019 (Alberto Bohrer's 1890 Nova Friburgo birth — names her as maternal grandmother).

  - PAR-0077 (daughter Lucinda's 1863 Rio de Janeiro baptism — names her as mother) · PAR-0056
  (daughter Lucinda's 1884 Nova Friburgo marriage — names her as mother).

  - CIV-0036 (son Octávio's 1895 marriage — she is alive and resident at Nova Friburgo) ·
  CIV-0037 (daughter Maria da Gloria's 1899 marriage — she is "aqui fallecida", died at NF by
  Oct 1899).

  ## Regional and migration context

  - **Born into the colony, not an immigrant.** Born at Nova Friburgo on 2 May 1841 (PAR-0069) to
  a Swiss-born father from Bulle, canton Fribourg, and a German-born mother (PAR-0076, PAR-0071)
  [PROVEN] — so the first Brazil-born generation of a household from both of the colony's intakes.
  The colony itself had been founded under King João VI's Decreto de 16 May 1818, which settled
  Swiss Catholic families on the Fazenda do Morro Queimado; German families joined it from 1824.
  [CONTEXTUAL]

  - **A married life on the move.** Nova Friburgo 1859–60 (PAR-0070, PAR-0082) → Rio de Janeiro,
  freguesia of the Lagoa, 1862–63 (PAR-0077) → the freguesia of Nossa Senhora da Conceição de
  Aparecida (RJ) about 1868 (CIV-0036) → Nova Friburgo again by about 1876 (CIV-0037), resident
  there in 1895 and dead there by 1899 (CIV-0036, CIV-0037) [PROVEN, leg by leg]. The moves follow
  her husband's, not her family's: her parents stayed in the colony. [INFERRED]

  ## Where to go today

  - **Baptism (1842), marriage (3 Mar 1859) and death:** Catedral Diocesana / Igreja Matriz de São
  João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) —
  her baptism (PAR-0069) and marriage (PAR-0070) are held; her 1896 burial entry is reported in
  the same parish's death register [LEAD]. The standing cathedral dates from 1869, so her
  baptism and wedding predate the present building. [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Daughter Lucinda's baptism (1863):** Matriz de São João Baptista da Lagoa, Rio de Janeiro
  (PAR-0077). [RESOLVED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela nasceu em 2 de maio de 1841 em Nova Friburgo como "Maria Joanna Rocheman" — filha de João José Rocheman (Rutschmann), imigrante suíço de Bulle, cantão de Fribourg (PAR-0069; Bulle conforme PAR-0071 e PAR-0076). Seu sobrenome de nascimento Rocheman já era a forma fonética portuguesa de "Rutschmann" em suíço-alemão.

  - **[CONTEXTUAL]** O sobrenome do pai, Rutschmann/Rocheman, é especificamente notado como um sobrenome de colono suíço-alemão de Nova Friburgo que era "frequentemente deformado nos registros": o "Rocheman" do registro de nascimento dela é um desses deformados, e ao se casar ela tornou-se "Maria Joanna da Silva Ferreira", com o sobrenome suíço totalmente abandonado dentro de uma geração.

  - **[INFERRED]** Ela se casou com um imigrante português (Antonio da Silva Ferreira, P-0036) em 1859, aos 18 anos — uma filha de colonos suíços nascida em Nova Friburgo, casando-se com um imigrante individual de Portugal. Isso fez com que seus filhos (incluindo Lucinda, P-0031) fossem produto de três correntes nacionais: suíça (avô paterno), portuguesa (pai) e brasileira (ela mesma e sua mãe).

  - **[CONTEXTUAL]** Ela faleceu entre 1895 e 1899 em Nova Friburgo — viva em dezembro de 1895, registrada "aqui fallecida" até outubro de 1899 (CIV-0036, CIV-0037). Morreu durante a primeira década republicana do Brasil, quando as antigas estruturas sociais imperiais estavam sendo reorganizadas e o sistema de registro civil ainda era novo. **[LEAD]** A pesquisa de recuperação relata seu próprio assento paroquial de sepultamento, que estreitaria isso para 30 de novembro de 1896, aos 55 anos, de nefrite crônica; esse registro ainda não está catalogado aqui.

  - **[PROVEN]** O verão de 1860 levou sua primeira filha e seu pai. Sua filha Isabel, de seis semanas, faleceu em 9 de junho de 1860 (PAR-0082) e seu pai, João José Rocheman, em 22 de julho de 1860 (PAR-0071) — com seis semanas de intervalo, ambos lançados pelo mesmo vigário, Jacob Joye, na mesma página (fl. 139) do livro de óbitos de Nova Friburgo.

  - **[PROVEN]** Sua filha Lucinda (nascida em 10 de agosto de 1862 no Rio de Janeiro, PAR-0077) e seu próprio nascimento em Nova Friburgo (1841) refletem uma família que se deslocava entre o Rio de Janeiro e a colônia serrana — coerente com a família Ferreira da Silva / Rocheman retornando a Nova Friburgo após um período na capital (PAR-0069, PAR-0077).

  - **[PROVEN]** O casal estava em Nova Friburgo em 1860: sua filha bebê Isabel (n. 23 abr. / f. 9 jun. 1860) foi sepultada ali, registrada no livro de óbitos da paróquia como filha legítima de Antonio da Silva Ferreira e Maria Joanna (PAR-0082). O sobrenome escrito após "Maria Joanna" nesse assento é incerto — a transcrição deste repositório o lê "Bock[e]man[?]"; a pesquisa de recuperação o lê "Rocheman", que seria sua forma de solteira um ano após o casamento [incerto]. A família mudou-se então para o Rio (Lucinda n. 10 ago. 1862 na freg. de S. João Baptista da Lagoa, PAR-0077; Octávio n. ~1868 na freg. de N.S. da Conceição da Aparecida, RJ, CIV-0036) antes de retornar a Nova Friburgo por volta de 1876 (filha Maria da Gloria n. NF, CIV-0037).

  ## Identidade

  **Maria Joanna da Silva Ferreira** (nascida **Rocheman/Rutschmann**) — filha, nascida em Nova
  Friburgo, de um colono suíço, que se casou com um imigrante português. [PROVEN]

  - **Papel:** mãe de Lucinda Ferreira da Silva (P-0031) e esposa de Antonio da Silva Ferreira
  (P-0036; família F-0017); portanto, avó materna de Celina Bohrer (P-0015). [PROVEN]

  - **Nascimento:** nascida em 2 de maio de 1841 em Nova Friburgo e baptizada em 20 de fevereiro
  de 1842 na Matriz de São João Baptista (PAR-0069, evento E-0093), filha legítima de João José
  Rocheman (Rutschmann, P-0109) — imigrante suíço de Bulle, cantão de Fribourg — e de Elisabeth
  (Isabel) Storck (P-0110); família F-0054. [PROVEN]

  - **Casamento:** casou-se com Antonio da Silva Ferreira em 3 de março de 1859 na mesma igreja,
  aos 18 anos (PAR-0070, evento E-0094). [PROVEN]

  - **Óbito:** em Nova Friburgo, ~1896-1899 [STRONG-EVIDENCE — CIV-0036/CIV-0037] (evento E-0125).
  Estava viva e residente ali em dezembro de 1895 (nomeada como mãe viva no casamento do filho
  Octávio, CIV-0036) e já falecera em Nova Friburgo até 28 de outubro de 1899 ("aqui fallecida" no
  casamento da filha Maria da Gloria, CIV-0037). **[LEAD]** A pesquisa de recuperação relata seu
  próprio assento de sepultamento no livro de óbitos da paróquia de Nova Friburgo (livro 3, fl. 5,
  nº 36): sepultada em 1º de dezembro de 1896, falecida em 30 de novembro de nefrite crônica, aos
  55 anos, "nascida e moradora n'esta freguezia", "casada com Antonio da Silva Ferreira", com os
  pais nomeados e "já fallecidos". Esse assento não está catalogado aqui, de modo que o evento
  E-0125 mantém a delimitação de 1895–1899 até que o seja; a idade relatada de 55 anos concorda com
  seu nascimento em 1841.

  ## Posição social e profissão

  - Nenhuma ocupação, propriedade ou letramento consta dela em qualquer ato disponível (PAR-0069,
  PAR-0070, CIV-0036, CIV-0037) [PROVEN quanto à lacuna]. Está documentada apenas como filha,
  noiva, esposa e mãe, e como avó materna em 1890 (CIV-0019).

  ## Família e rede social

  Ela está na junção de duas correntes imigrantes da colônia de Nova Friburgo: a linha suíça do pai
  (Rutschmann, de Bulle) e a imigração portuguesa do marido. Sua filha Lucinda casou-se com o lar
  *negociante* dos Bohrer, no Alto da Serra (CIV-0019) — a faixa documentada de pequenos
  comerciantes da colônia [INFERRED/CONTEXTUAL]. O conjunto de irmãos documentados inclui:
  **Isabel da Silva Ferreira** (n. 23 abr. / f. 9 jun. 1860, NF — bebê; o assento paroquial de
  óbito nomeia ambos os pais, com o sobrenome da mãe de leitura incerta; PAR-0082 [PROVEN]);
  **Octávio Ferreira da Silva** (c. Octavia Froidevaux, 28 dez. 1895 NF; CIV-0036 nomeia ambos os
  pais vivos em NF; [PROVEN]); **Maria da Gloria da Silva Ferreira** (c. Ezequiel Mathias Dias, 28
  out. 1899 NF; CIV-0037 nomeia-a e registra Maria Joanna "aqui fallecida"; [PROVEN]); e **Antonio
  da Silva Ferreira Junior** (operário, declarante do óbito civil de 1914 do pai Antonio Sr em NF;
  o assento de 1914 nomeia apenas o pai — Maria Joanna já havia falecido — portanto a filiação
  materna é [BORDERLINE — nomeação de um único pai]). Um José da Silva Ferreira foi padrinho, tendo
  sua filha Maria da Gloria como madrinha, no batismo de 1899 de sua neta Celina (PAR-0057)
  [PROVEN]; que ele fosse mais um filho é apenas [LEAD] — nenhum registro nomeia seus pais, e o
  casamento de 1896 em NF de um "José Ferreira da Silva", do índice Raibert, foi obtido pela
  pesquisa de recuperação e eliminado como outra família.

  - **Seus padrinhos de batismo** foram João Balineat e Maria Fabre (PAR-0069) — o mesmo casal que,
  como "João Balmat e Maria Fabre", testemunhara o casamento de seus pais em 1840 (PAR-0076)
  [PROVEN]: vizinhos que estiveram ao lado da família duas vezes.

  - **Uma provável irmã.** [LEAD] A pesquisa de recuperação relata, a partir do índice de
  casamentos eclesiásticos do Rio de Janeiro de César Raibert (não disponível aqui), um casamento
  de 1858 em Nova Friburgo de **Leocádia Cristina Rocheman** com Luís Martins Pinheiro, num fólio
  logo anterior ao do próprio casamento de Maria Joanna, e lê um "Luiz Martins Pinheiro" entre as
  testemunhas de seu casamento de 1859. A transcrição deste repositório lê essa testemunha como
  "Luiz Mathias Pinheiro" (PAR-0070), de modo que o vínculo de cunhado não está confirmado; o
  próprio ato de casamento de Leocádia, ou um batismo que nomeie João José Rocheman e Elisabeth
  Storck como seus pais, resolveria a questão.

  ## O que podemos extrapolar

  **Ela é a primeira geração nascida no Brasil de um domicílio colono, e herdou para dentro
  desse piso, não para fora dele.** Nascida em Nova Friburgo em 2 de maio de 1841 e ali
  baptizada em 20 de fevereiro de 1842, filha legítima do casal colono João José Rocheman
  (Rutschmann) e Elisabeth Storck (PAR-0069) [PROVEN], casou-se aos dezoito anos em março de
  1859 (PAR-0070) [PROVEN]. O pacote da colônia — lote, casa, rações, sementes, gado e um
  subsídio diário de 160 réis caindo para 80, por um período de estabelecimento de dois anos
  (Decreto de 16 de maio de 1818) — era sustento de subsistência em terreno serrano pobre e
  íngreme, valendo cerca de um sétimo do salário anual de um trabalhador rural livre, e não uma
  fortuna [CONTEXTUAL]. Dividido pela sucessão partível entre os domicílios numerosos daquela
  geração, o quinhão de uma filha era desprezível [CONTEXTUAL]. Nenhuma propriedade, ocupação ou
  letramento consta dela em qualquer ato disponível.

  **Quarenta anos após o desembarque, ela casou-se para fora da colônia.** Seu marido, Antonio
  da Silva Ferreira, era um imigrante português sem concessão colonial (PAR-0070) [PROVEN]. É um
  dado pequeno mas firme: o conjunto suíço e alemão transplantado para Nova Friburgo já se
  casava com a população luso-brasileira do entorno na segunda geração, e o mercado matrimonial
  ordenava-se por nível econômico, não por origem. [INFERRED]

  **Sua vida de casada foi itinerante e foi dura.** Sepultou uma filha de seis semanas, Isabel,
  em Nova Friburgo, em junho de 1860, quinze meses depois do casamento (PAR-0082) [PROVEN]; sua
  filha Lucinda nasceu na capital imperial em 1862 (PAR-0077); seu filho Octávio na freguesia de
  Aparecida por volta de 1868 (CIV-0036); sua filha Maria da Gloria de volta em Nova Friburgo
  por volta de 1876 (CIV-0037) [PROVEN]. Quatro filhos, quatro lugares e nenhuma propriedade
  registrada em nenhum deles — o padrão de um domicílio que se muda atrás de trabalho.
  [INFERRED]

  **Ela é o ponto de desaparecimento do sobrenome Rutschmann e do próprio registro.** Ao adotar
  "da Silva Ferreira" no casamento, deixa o nome colono sobrevivendo nesta família apenas como o
  fóssil "Roschemant / Rochemont" dentro do nome completo de sua filha (PAR-0056) [PROVEN]. Sua
  própria morte só é datável por casamentos alheios: viva e residente em Nova Friburgo em
  dezembro de 1895 (CIV-0036), "aqui fallecida" até outubro de 1899 (CIV-0037)
  [STRONG-EVIDENCE]. O marido sobreviveu-lhe ao menos quinze anos. Uma mulher desta faixa só é
  localizável no tempo pelos documentos que seus filhos geram. [INFERRED]

  **Seu casamento aponta a linha para o comércio e o salário, não para a terra.** [INFERRED] Sua
  filha Lucinda casou-se com um *negociante* do Alto da Serra (PAR-0056) e seus filhos aparecem
  como *operários* (CIV-0035, CIV-0036) [PROVEN]. Ela é, portanto, a dobradiça entre o piso do
  pequeno colono e a faixa de pequeno comércio e salário da cidade — uma deriva lateral no mesmo
  nível modesto, jamais uma ascensão à elite, e a imagem espelhada do arco paterno Armond desta
  família, que chegou a esse mesmo nível caindo de cima.

  ## Questões em aberto

  - Seu registro de óbito exato — seu óbito está delimitado a Nova Friburgo, ~1896-1899
  (CIV-0036/CIV-0037). A pesquisa de recuperação relata o assento paroquial de sepultamento (livro
  de óbitos de Nova Friburgo, livro 3, fl. 5, nº 36: falecida em 30 de novembro de 1896) [LEAD];
  catalogar essa imagem fixaria a data. [OPEN]

  - Se Leocádia Cristina Rocheman (c. 1858) era sua irmã [LEAD], e o sobrenome escrito para ela no
  assento de óbito de Isabel, de 1860 (PAR-0082, de leitura incerta). [OPEN]

