  ## Contexto regional e migratório

  - **Nascida na colônia, não imigrante.** Nascida em Nova Friburgo em 2 de maio de 1841 (PAR-0069),
  de pai suíço de Bulle, cantão de Fribourg, e mãe nascida na Alemanha (PAR-0076, PAR-0071)
  [PROVEN] — portanto, a primeira geração nascida no Brasil de um lar formado pelas duas levas da
  colônia. A própria colônia fora fundada sob o Decreto de 16 de maio de 1818 de D. João VI, que
  assentou famílias suíças católicas na Fazenda do Morro Queimado; famílias alemãs juntaram-se a
  ela a partir de 1824. [CONTEXTUAL]

  - **Uma vida de casada em movimento.** Nova Friburgo 1859–60 (PAR-0070, PAR-0082) → Rio de
  Janeiro, freguesia da Lagoa, 1862–63 (PAR-0077) → a freguesia de Nossa Senhora da Conceição de
  Aparecida (RJ) por volta de 1868 (CIV-0036) → Nova Friburgo de novo por volta de 1876 (CIV-0037),
  residente ali em 1895 e ali falecida até 1899 (CIV-0036, CIV-0037) [PROVEN, etapa por etapa]. As
  mudanças seguem as do marido, não as da família dela: seus pais permaneceram na colônia.
  [INFERRED]

