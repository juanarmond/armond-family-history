profile: >-
  ## Interesting facts

  - **[PROVEN]** She was a Bohrer on both sides — her father João Gonçalves Bohrer and her mother Celina Bohrer both carried the same surname (CIV-0004). This Bohrer × Bohrer marriage is the clearest documented case of endogamy within the Nova Friburgo Swiss/German colonist community, where marrying within the same immigrant network was common. The shared surname is not proof of kinship: her father's line descends from the immigrant Laurent Borer and her mother's from Jacob Borer, and no kinship between the two is documented (see P-0014, P-0015). [INFERRED]

  - **[CONTEXTUAL]** The Bohrer surname traces to Swiss-German colonists settled in Nova Friburgo from 1819–1824 under Dom João VI's recruitment programme; Iris was born to a Brazilian-born Bohrer family already two to three generations removed from that immigration, with the German/Swiss first names long replaced by Portuguese ones like Iris herself.

  - **[PROVEN]** Her father's 1970 death states the couple "deixou quinze filhos" (fifteen children); she was one of fifteen (CIV-0014). Her own 1949 marriage (CIV-0004) names her birthplace as Presidente Soares, MG — already in the Zona da Mata, not Nova Friburgo — showing the family had moved from the Rio de Janeiro highlands to Minas Gerais by 1929.

  - **[INFERRED]** Born in 1929 in the Zona da Mata and married at Alvorada in 1949, she began her adult life in Minas Gerais but, like her parents and several siblings, died in Volta Redonda (CIV-0029). She sits at the hinge between the family's rural-Minas phase and its move to the Rio de Janeiro industrial city — the last generation to marry before the CSN migration was complete.

  - **[CONTEXTUAL]** Her father João died in the Hospital da CSN (the company hospital at Volta Redonda) in 1970; her mother Celina died in Volta Redonda in 1977; Iris herself died there in 2021. The CSN hospital's appearance in a family death record is a marker of how completely the steel company's infrastructure structured the city's social life.

  - **[INFERRED]** Her union with Antenor Muniz (P-0006) is the Bohrer-Muniz convergence: the Swiss/German Nova Friburgo colonist line meets the Azorean Muniz line — two families with no common origin except a shared smallholder-agrarian immigrant background, ending up in the same Minas Gerais farming district and eventually the same Rio de Janeiro steel city.

  ## Identity

  **Iris Bohrer Muniz** (also *Iris Bohrer*; the married form *Iris Bohrer Muniz* is
  the one she adopted at marriage). She was a **Bohrer on both sides** — her father
  and her mother both carried the Bohrer surname [PROVEN] (CIV-0004 names her parents
  as **João Gonçalves Bohrer** and **Dona Selina Bohrer**).

  - **Birth:** 27 February 1929 at **Presidente Soares, Minas Gerais** [PROVEN as
  reported] — stated in her 1949 marriage certificate (CIV-0004); no birth register is
  held, so the date is a marriage-record declaration, not a primary birth record.

  - **Parents:** João Gonçalves Bohrer (P-0014) and Celina Bohrer (P-0015) [PROVEN]
  (CIV-0004; the couple is independently fixed by CIV-0014 and CIV-0016). Her mother's
  name is spelled **Selina** in the 1949 marriage (CIV-0004) and **Celina** in the
  civil-death and 1924 birth records (see P-0015).

  - **Marriage:** married **Antenor Muniz** (P-0006) on **7 December 1949** at
  **Alvorada, Minas Gerais** [PROVEN] (CIV-0004), before the Juiz de Paz [uncertain:
  Francisco Guizotti Gobbi]; she thereafter signed **Iris Bohrer Muniz**. The certificate held is a certified copy issued at Vila de Alvorada on 11 August 1955 from livro 5, fls. 66-v of the marriage register (CIV-0004).

  - **Death:** 13 July 2021, at 09:00, at her residence in **Volta Redonda, Rio de
  Janeiro**, aged 92, a widow [PROVEN] — her civil death certificate (CIV-0029, event
  E-0082). Cause: acute myocardial infarction with Alzheimer's disease. She left five
  adult children.

  ## Standing and profession

  Her only firmly documented occupation is **pensionista** (pensioner), recorded in her
  2021 death certificate (CIV-0029). Her 1949 marriage certificate records her *profissão* as **doméstica**, against her husband's "da lavoura" (CIV-0004) — a reading confirmed against the image, replacing an earlier uncertain "agricultora". No property or
  literacy record is held.

  ## Family and social network

  - **One of fifteen children** of João Gonçalves Bohrer × Celina Bohrer [PROVEN] —
  her father's 1970 death record states the couple "deixou quinze filhos" (CIV-0014).

  - **Siblings — nine named (six proven, three leads) of fifteen:** **Senira Bohrer** (b.
  1923, Nova Friburgo; CIV-0038), **Eunir Bohrer** (b. 1924, Nova Friburgo; a brother,
  resolved — CIV-0016), **Alício Borher** (1924–2005, Volta Redonda; CIV-0039), **Cinésio
  Bohrer** (c.1926–2015) [LEAD — FS tree; death post-2013 collection boundary, no own
  record indexed], **Ivanyr Borher** (c.1930–1992, Barra Mansa; CIV-0040), **Ivan Borher**
  (c.1930) [LEAD — probable tree duplicate of Ivanyr; no indexed record independent of
  Ivanyr; not twins], **Ercy Bohrer** (c.1932–1972, Volta Redonda; CIV-0031 — aged 40 at death, consistent with the FamilySearch tree's 1932 [LEAD]; [Corrected 2026-10-08 from the image: "com quarenta anos", not 30 / c.1942]), **Maria Adyr
  Bohrer** (c.1936–2020) [LEAD — FS tree; death post-2013, no own record indexed], and
  **João Bohrer** (c.1940 Carangola, MG; d. 2001, Volta Redonda; CIV-0025) [all
  PROVEN-listed sources name both parents; the three LEADs are FS-tree entries without
  independent records in the collection]. The remaining ~5 of the fifteen are unnamed —
  a 2026-09-11 check of the Nova Friburgo church name-indexes (César Raibert, Batismos /
  Óbitos / Matrimonios) is a bounded negative: no João-Gonçalves × Celina parent-pair
  appears, and the Bohrer baptism entries have a gap exactly spanning the couple's
  child-bearing window. Alício's informant-given birth (26 Jul 1924, Divino, MG; CIV-0039) cannot be reconciled with Eunir's birth act (17 May 1924, Nova Friburgo; CIV-0016) for the same mother; the birth act outranks the death informant.

  - **Marriage and descendants:** her union with Antenor Muniz is the point where the
  Bohrer line joins the Muniz line. It descends to living family; a 1982 family birth
  certificate names **Iris Bohrer Muniz** as a maternal grandmother [PROVEN]
  (CIV-0008), corroborating her married-name form. The couple had **five daughters** (all
  living; owner ground-truth, corroborated by both parents' óbitos "5 filhos"). Living-person
  detail is withheld.

  ## What we can extrapolate

  **She is the arrival point of a descent that rose from below, and the arrival is documented in
  three consecutive death records.** Her father's 1970 óbito states that he "deixou bens a
  inventariar"; her mother's 1977 óbito states that she "não deixou bens nem testamento"; her
  own 2021 certificate states that she "não deixou bens a inventariar" (CIV-0014, CIV-0015,
  CIV-0029) [PROVEN]. Three generations in a row whose estates were nothing, or next to nothing.
  That is not a lost fortune — it is the documented proof that no heritable capital was ever in
  this line to lose. [INFERRED]

  **What closes the arc is not property but a pension.** Her recorded profession at death is
  *pensionista* (CIV-0029) [PROVEN]: she was living on a transfer, not on an inheritance or a
  trade. For a Brazilian working family of the 20th century the state pension is the institution
  that took the place inheritance occupies in a propertied one [CONTEXTUAL]. Her father lived on a merchant's margin, her mother kept the house (recorded as *doméstica*, CIV-0015), and she lived on a benefit; only the last is an income guaranteed by something outside the household. On this line's
  own terms, that is the most secure material position any of its documented generations
  reached. [INFERRED]

  **Her life spans the last two legs of the migration.** Born 27 February 1929 at Presidente
  Soares in the Zona da Mata Mineira, married 7 December 1949 at Alvorada (Carangola district),
  Minas Gerais, and dead 13 July 2021 at Volta Redonda (CIV-0004, CIV-0029) [PROVEN], while her
  birth family concentrated in the steel city (CIV-0014, CIV-0015, CIV-0025, CIV-0031, CIV-0039)
  [PROVEN]. She was born on a coffee frontier and died in an industrial city, and between those
  two dates the family's economic base changed from land worked to wages and benefits. Her 1949
  marriage in a farming district is the last event in this line that happens in the countryside.
  [INFERRED]

  **Nothing documents her schooling either way, and the context explains why that is
  unremarkable.** [CONTEXTUAL] She was one of fourteen or fifteen children of an interior
  working household (CIV-0014, CIV-0015) [PROVEN]. Education in Brazil was a purchased,
  class-linked privilege throughout her childhood, re-bought for each child rather than
  inherited, and universal schooling is a late-20th-century achievement. A family that could not
  buy it at that scale left no school record to find.

  **She is where two Borer trunks meet and where the Bohrer surname stops.** Her father descends
  from the immigrant Laurent Borer, her mother from the immigrant Jacob Borer — two Solothurn
  men on the same 1819 *Heureux Voyage*, allocated adjacent Nova Friburgo lots, with no evidence
  of close kinship between them (PUB-0003) [COMPILED]. Both descents are documented by parish records held here (father's side PAR-0063, PAR-0061, PAR-0060; mother's side PAR-0057, PAR-0056, PAR-0054, PAR-0059). Her parents' marriage, by early 1923 (CIV-0038), rejoined the two lines about a century after the landing, at the bottom of both trajectories; her own marriage
  to Antenor Muniz (P-0006) then carried the descent out of the Bohrer name altogether. What
  reached her from the colony was descent and memory — not land, not office, not schooling.
  [INFERRED]

  **This is the analytical mirror of the paternal Armond line of the same family.** [INFERRED]
  That line arrived in the 20th-century urban working world by *falling* out of an
  office-and-marriage elite; the Bohrers arrived by *rising* into it from a colony subsidy of
  160 réis a day on a stony serra lot [CONTEXTUAL]. Two families, opposite vectors, the same
  destination — and Iris's generation is where the two vectors meet.

  ## Open questions

  - Her **birth certificate** (Presidente Soares, MG, 1929) — not held; would fix her
  exact birth facts at primary level and name both parents. [OPEN]

  - Her **death record** — **held** (CIV-0029): died 13 July 2021, Volta Redonda, RJ.
  [RESOLVED]

  - **Naturalidade discrepancy:** her 1949 marriage certificate (CIV-0004) gives her birthplace as
  **"Presidente Soares, E. de Minas"** (Minas Gerais); her 2021 death certificate (CIV-0029) gives
  it as **"Alvorada de Minas-MG"**. The marriage certificate, closer in time to her birth and
  self-declared, is the stronger reading; the death certificate informant may have confused Alvorada
  (the municipality where she married in 1949) with her actual birth locality. [OPEN — to be resolved
  by her birth certificate]

  - **Family recollection of Muriaé:** Iris herself is reported to have named Presidente Soares as her birthplace, while a second family recollection names Muriaé [LEAD — oral, owner-reported to the retrieval research, 2026-09-25]. The records support Presidente Soares (CIV-0004). Muriaé is, however, a documented place in her husband's family: his mother, Luiza Fernandes de Azevedo (P-0013), was born at Bom Jesus de Cachoeira Alegre, São Paulo do Muriaé (PAR-0012) — a plausible source of the conflation, since the family moved within the Carangola–Muriaé corridor of the Zona da Mata. [INFERRED]

  ## Sources held (this repository)

  - CIV-0004 (1949 Antenor Muniz × Iris Bohrer marriage — her birth date/place, parents
  and married name) · CIV-0029 (2021 Volta Redonda death certificate — death date/place,
  cause, "pensionista", her parents, five adult children) · CIV-0008 (1982 family birth
  certificate — names Iris Bohrer Muniz as maternal grandmother; living detail withheld).

  - CIV-0014 (father João Gonçalves Bohrer's 1970 death — "quinze filhos") · CIV-0015 (mother Celina's 1977 death — "quatorze filhos", "doméstica") · CIV-0016
  (sibling Eunir Bohrer's 1924 Nova Friburgo birth) · CIV-0025 (brother João Bohrer's
  2001 death) · CIV-0031 (sibling Ercy Bohrer's 1972 Volta Redonda death — names both parents) ·
  CIV-0038 (sibling Senira Bohrer's 1923 Nova Friburgo birth — names both parents) · CIV-0039
  (sibling Alício Borher's birth/death record — names both parents) · CIV-0040 (sibling Ivanyr
  Borher's death — names both parents) · REC-0001 (owner family roster) · PUB-0003 (published
  Nova Friburgo genealogy).

  - Her two Borer lines: PAR-0063 · PAR-0061 · PAR-0060 (father's side, to Laurent Borer) · PAR-0057 · PAR-0056 · PAR-0054 · PAR-0059 (mother's side, to Jacob Bohrer).

  ## Regional and migration context

  Her 1929 birth at Presidente Soares and 1949 marriage at Alvorada place her in the
  **Zona da Mata Mineira**, while her parents were **natural** of Rio de Janeiro state
  and her mother was born at **Nova Friburgo** (CIV-0016) — the Serra-fluminense town
  settled by the 1819–1824 Swiss / German Catholic colony. The family's descent from
  the Nova Friburgo Borer/Bohrer immigrants is documented generation by generation by parish records held here — her father's line through PAR-0063, PAR-0061 and PAR-0060 to Laurent Borer of Grindel, her mother's through PAR-0057, PAR-0056, PAR-0054 and PAR-0059 to Jacob Bohrer of Beinwil (Canton Solothurn) — with the published genealogy (PUB-0003) in agreement, and is not asserted from the surname alone;
  whether her Bohrer father and Bohrer mother shared immigrant ancestry is unresolved.
  [CONTEXTUAL]

  ## Where to go today

  - **Birth (27 Feb 1929):** Igreja Matriz Nossa Senhora da Conceição, Alto Jequitibá, MG
  (birthplace Presidente Soares is an unconfirmed rural locality within the municipality;
  municipality-level point only) [APPROX] ·
  [Maps](https://maps.google.com/?q=-20.42389,-41.96583)

  - **Marriage to Antenor Muniz (1949):** Alvorada (district of Carangola), MG [APPROX] ·
  [Maps](https://maps.google.com/?q=-20.745,-42.1721)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Era Bohrer pelos dois lados — tanto o pai João Gonçalves Bohrer quanto a mãe Celina Bohrer levavam o mesmo sobrenome (CIV-0004). Esse casamento Bohrer × Bohrer é o caso mais claro de endogamia documentada na comunidade de colonos suíços/alemães de Nova Friburgo, onde casar dentro da mesma rede imigrante era prática comum. O sobrenome comum não prova parentesco: a linha do pai descende do imigrante Laurent Borer e a da mãe de Jacob Borer, e nenhum parentesco entre os dois está documentado (ver P-0014, P-0015). [INFERRED]

  - **[CONTEXTUAL]** O sobrenome Bohrer remonta a colonos suíço-alemães instalados em Nova Friburgo a partir de 1819–1824, pelo programa de recrutamento de Dom João VI; Iris nasceu numa família Bohrer já nascida no Brasil, duas ou três gerações afastada dessa imigração, com os prenomes alemães/suíços já substituídos por nomes portugueses como o dela própria.

  - **[PROVEN]** O óbito de seu pai em 1970 afirma que o casal "deixou quinze filhos" (CIV-0014). Seu casamento de 1949 (CIV-0004) registra seu local de nascimento como Presidente Soares, MG — já na Zona da Mata, não em Nova Friburgo —, mostrando que a família havia se mudado das serras fluminenses para Minas Gerais antes de 1929.

  - **[INFERRED]** Nascida em 1929 na Zona da Mata e casada em Alvorada em 1949, ela começou a vida adulta em Minas Gerais, mas, como seus pais e vários irmãos, faleceu em Volta Redonda (CIV-0029). Ela está na dobradiça entre a fase rural-mineira da família e sua mudança para a cidade industrial fluminense — a última geração a se casar antes de a migração da CSN estar completa.

  - **[CONTEXTUAL]** Seu pai João faleceu no Hospital da CSN (o hospital da empresa em Volta Redonda) em 1970; sua mãe Celina faleceu em Volta Redonda em 1977; a própria Iris faleceu lá em 2021. A presença do hospital da CSN num registro de óbito familiar é um marcador de como a infraestrutura da siderúrgica estruturava completamente a vida social da cidade.

  - **[INFERRED]** Sua união com Antenor Muniz (P-0006) é a convergência Bohrer-Muniz: a linha de colonos suíços/alemães de Nova Friburgo encontra a linha açoriana dos Muniz — duas famílias sem origem comum além de um passado imigrante de pequenos agricultores, que acabaram no mesmo distrito rural de Minas Gerais e, por fim, na mesma cidade siderúrgica do Rio de Janeiro.

  ## Identidade

  **Iris Bohrer Muniz** (também *Iris Bohrer*; a forma de casada *Iris Bohrer Muniz* é
  a que ela adotou ao se casar). Era **Bohrer pelos dois lados** — tanto o pai quanto a
  mãe levavam o sobrenome Bohrer [PROVEN] (CIV-0004 nomeia seus pais como **João
  Gonçalves Bohrer** e **Dona Selina Bohrer**).

  - **Nascimento:** 27 de fevereiro de 1929, em **Presidente Soares, Minas Gerais**
  [PROVEN como declarado] — consta em sua certidão de casamento de 1949 (CIV-0004); não
  há registro de nascimento em mãos, portanto a data é uma declaração feita no
  casamento, não um registro primário de nascimento.

  - **Pais:** João Gonçalves Bohrer (P-0014) e Celina Bohrer (P-0015) [PROVEN]
  (CIV-0004; o casal é fixado de forma independente por CIV-0014 e CIV-0016). O nome da
  mãe é grafado **Selina** no casamento de 1949 (CIV-0004) e **Celina** nos registros
  de óbito e no nascimento de 1924 (ver P-0015).

  - **Casamento:** casou-se com **Antenor Muniz** (P-0006) em **7 de dezembro de 1949**
  em **Alvorada, Minas Gerais** [PROVEN] (CIV-0004), perante o Juiz de Paz [uncertain:
  Francisco Guizotti Gobbi]; passou então a assinar **Iris Bohrer Muniz**. A certidão em mãos é uma cópia certificada emitida na Vila de Alvorada em 11 de agosto de 1955, extraída do livro 5, fls. 66-v do registro de casamentos (CIV-0004).

  - **Óbito:** 13 de julho de 2021, às 09:00, em sua residência em **Volta Redonda, Rio
  de Janeiro**, aos 92 anos, viúva [PROVEN] — sua certidão de óbito (CIV-0029, evento
  E-0082). Causa: infarto agudo do miocárdio com doença de Alzheimer. Deixou cinco filhos
  maiores.

  ## Posição social e profissão

  Sua única ocupação firmemente documentada é **pensionista**, registrada em sua certidão
  de óbito de 2021 (CIV-0029). Sua certidão de casamento de 1949 registra sua *profissão* como **doméstica**, contra o "da lavoura" do marido (CIV-0004) — leitura conferida na imagem, que substitui uma leitura anterior incerta, "agricultora". Não há registro de
  bens ou de letramento em mãos.

  ## Família e rede social

  - **Uma de quinze filhos** de João Gonçalves Bohrer × Celina Bohrer [PROVEN] — o
  óbito de seu pai, em 1970, afirma que o casal "deixou quinze filhos" (CIV-0014).

  - **Irmãos — nove nomeados (seis comprovados, três pistas) dos quinze:** **Senira
  Bohrer** (n. 1923, Nova Friburgo; CIV-0038), **Eunir Bohrer** (n. 1924, Nova Friburgo;
  irmão — resolvido — CIV-0016), **Alício Borher** (1924–2005, Volta Redonda; CIV-0039),
  **Cinésio Bohrer** (c.1926–2015) [LEAD — árvore FS; óbito pós-2013 fora da coleção, sem
  registro próprio indexado], **Ivanyr Borher** (c.1930–1992, Barra Mansa; CIV-0040), **Ivan
  Borher** (c.1930) [LEAD — provável duplicata na árvore de Ivanyr; sem registro indexado
  independente; não são gêmeos], **Ercy Bohrer** (c.1932–1972, Volta Redonda; CIV-0031 — 40 anos ao falecer, coerente com o 1932 da árvore do FamilySearch [LEAD]; [Corrigido em 2026-10-08 a partir da imagem: "com quarenta anos", não 30 / c.1942]),
  **Maria Adyr Bohrer** (c.1936–2020) [LEAD — árvore FS; óbito pós-2013, sem registro
  próprio indexado], e **João Bohrer** (c.1940 em Carangola, MG; f. 2001, Volta Redonda;
  CIV-0025) [todas as fontes listadas como PROVEN nomeiam ambos os pais; as três LEADs são
  entradas da árvore FS sem registros independentes na coleção]. Os ~5 restantes dos quinze
  são desconhecidos — uma verificação de 2026-09-11 nos índices onomásticos das igrejas de
  Nova Friburgo (Raibert, Batismos / Óbitos / Matrimonios) é um negativo delimitado: nenhum
  par de pais João Gonçalves × Celina aparece, e os registros de batismo Bohrer têm uma
  lacuna exatamente no período em que esse casal teve filhos. O nascimento de Alício dado pelo informante (26 jul. 1924, Divino, MG; CIV-0039) não se concilia com o assento de nascimento de Eunir (17 mai. 1924, Nova Friburgo; CIV-0016) para a mesma mãe; o assento de nascimento prevalece sobre o informante do óbito.

  - **Casamento e descendência:** sua união com Antenor Muniz é o ponto em que a linha
  Bohrer se junta à linha Muniz. Ela desce até a família viva; uma certidão de
  nascimento familiar de 1982 nomeia **Iris Bohrer Muniz** como avó materna [PROVEN]
  (CIV-0008), corroborando sua forma de nome de casada. O casal teve **cinco filhas**
  (todas vivas; confirmação do proprietário, corroborada pelos óbitos de ambos os pais
  "5 filhos"). Detalhes de pessoas vivas são omitidos.

  ## O que podemos extrapolar

  **Ela é o ponto de chegada de uma descendência que subiu de baixo, e a chegada está
  documentada em três assentos de óbito consecutivos.** O óbito de seu pai, de 1970, declara que
  ele "deixou bens a inventariar"; o de sua mãe, de 1977, que ela "não deixou bens nem
  testamento"; sua própria certidão, de 2021, que ela "não deixou bens a inventariar" (CIV-0014,
  CIV-0015, CIV-0029) [PROVEN]. Três gerações seguidas cujos espólios foram nada, ou quase nada.
  Não é uma fortuna perdida — é a prova documentada de que nunca houve capital herdável nesta
  linha para se perder. [INFERRED]

  **O que encerra o arco não é propriedade, e sim uma pensão.** Sua profissão registrada ao
  morrer é *pensionista* (CIV-0029) [PROVEN]: vivia de uma transferência, não de herança nem de
  comércio. Para uma família trabalhadora brasileira do século XX, a previdência pública é a
  instituição que ocupa o lugar que a herança ocupa numa família proprietária [CONTEXTUAL]. Seu pai viveu de margem de comerciante, sua mãe cuidou da casa (registrada como *doméstica*, CIV-0015) e ela viveu de um benefício; só a última é uma renda garantida por algo fora do domicílio. Nos termos desta
  própria linha, essa é a posição material mais segura que qualquer de suas gerações
  documentadas alcançou. [INFERRED]

  **Sua vida cobre as duas últimas etapas da migração.** Nascida em 27 de fevereiro de 1929 em
  Presidente Soares, na Zona da Mata Mineira, casada em 7 de dezembro de 1949 em Alvorada
  (distrito de Carangola), Minas Gerais, e falecida em 13 de julho de 2021 em Volta Redonda
  (CIV-0004, CIV-0029) [PROVEN], enquanto sua família de origem se concentrava na cidade
  siderúrgica (CIV-0014, CIV-0015, CIV-0025, CIV-0031, CIV-0039) [PROVEN]. Nasceu numa fronteira
  cafeeira e morreu numa cidade industrial, e entre essas duas datas a base econômica da família
  passou da terra trabalhada para salários e benefícios. Seu casamento de 1949 num distrito
  agrícola é o último evento desta linha a ocorrer no campo. [INFERRED]

  **Nada documenta sua escolaridade, num sentido ou noutro, e o contexto explica por que isso
  não surpreende.** [CONTEXTUAL] Ela foi uma de catorze ou quinze filhos de um domicílio
  trabalhador do interior (CIV-0014, CIV-0015) [PROVEN]. A educação no Brasil foi, durante toda
  a sua infância, um privilégio comprado e ligado à classe, recomprado para cada filho em vez de
  herdado, e a escolaridade universal é uma conquista tardia do século XX. Uma família que não
  podia comprá-la nessa escala não deixou registro escolar a encontrar.

  **Ela é onde os dois troncos Borer se encontram e onde o sobrenome Bohrer termina.** Seu pai
  descende do imigrante Laurent Borer; sua mãe, do imigrante Jacob Borer — dois homens de
  Soleure no mesmo *Heureux Voyage* de 1819, com lotes vizinhos em Nova Friburgo e sem evidência
  de parentesco próximo entre si (PUB-0003) [COMPILED]. Ambas as descendências estão documentadas por registros paroquiais em mãos neste repositório (lado paterno PAR-0063, PAR-0061, PAR-0060; lado materno PAR-0057, PAR-0056, PAR-0054, PAR-0059). O casamento de seus pais, até o início de 1923 (CIV-0038), reuniu as duas linhas cerca de um século após o desembarque, no ponto mais baixo de ambas as trajetórias; seu
  próprio casamento com Antenor Muniz (P-0006) levou depois a descendência para fora do nome
  Bohrer. O que chegou até ela da colônia foi descendência e memória — não terra, não cargo, não
  escolaridade. [INFERRED]

  **Este é o espelho analítico da linha paterna Armond da mesma família.** [INFERRED] Aquela
  linha chegou ao mundo trabalhador urbano do século XX *caindo* de uma elite de cargos e
  casamentos; os Bohrer chegaram *subindo* a partir de um subsídio colonial de 160 réis por dia
  sobre um lote serrano pedregoso [CONTEXTUAL]. Duas famílias, vetores opostos, o mesmo destino
  — e a geração de Iris é onde os dois vetores se encontram.

