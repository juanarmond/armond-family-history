profile: >-
  ## Identity

  **Iris Bohrer Muniz** (also *Iris Bohrer*; the married form *Iris Bohrer Muniz* is
  the one she adopted at marriage). She was a **Bohrer on both sides** — her father
  and her mother both carried the Bohrer surname [PROVEN] (CIV-0004 names her parents
  as **João Gonçalves Bohrer** and **Dona Selina Bohrer**).

  - **Birth:** 27 February 1929 at **Presidente Soares, Minas Gerais** [PROVEN as
  reported] — stated in her 1949 marriage certificate (CIV-0004); no birth register is
  held, so the date is a marriage-record declaration, not a primary birth record.

  - **Parents:** João Gonçalves Bohrer (P-0014) and Celina Bohrer (P-0015) [PROVEN]
  (CIV-0004; the couple is independently fixed by CIV-0014 and CIV-0016). Her mother's
  name is spelled **Selina** in the 1949 marriage (CIV-0004) and **Celina** in the
  civil-death and 1924 birth records (see P-0015).

  - **Marriage:** married **Antenor Muniz** (P-0006) on **7 December 1949** at
  **Alvorada, Minas Gerais** [PROVEN] (CIV-0004), before the Juiz de Paz [uncertain:
  Francisco Guizotti Gobbi]; she thereafter signed **Iris Bohrer Muniz**.

  - **Death:** deceased; no death record is held [OPEN]. A family / collaborative-tree
  lead places her death c.2021 [LEAD] — not verified by any held record.

  ## Standing and profession

  Nothing occupational is firmly documented. Her 1949 marriage certificate records her
  *profissão* as [uncertain: agricultora] (CIV-0004); the reading is not secure, so no
  occupation is asserted. No property, literacy or life record is held.

  ## Family and social network

  - **One of fifteen children** of João Gonçalves Bohrer × Celina Bohrer [PROVEN] —
  her father's 1970 death record states the couple "deixou quinze filhos" (CIV-0014).

  - **Documented siblings:** **Eunir Bohrer** (b. 17 May 1924, Nova Friburgo; CIV-0016)
  and **João Bohrer** (b. c.1940 Carangola, MG; d. 12 January 2001, Volta Redonda;
  CIV-0025) [PROVEN]. The remaining siblings are not individually documented here.

  - **Marriage and descendants:** her union with Antenor Muniz is the point where the
  Bohrer line joins the Muniz line. It descends to living family; a 1982 family birth
  certificate names **Iris Bohrer Muniz** as a maternal grandmother [PROVEN]
  (CIV-0008), corroborating her married-name form. Living-person detail is withheld.

  ## What we can extrapolate

  Her recorded life runs from a **1929 birth in the Zona da Mata Mineira** (Presidente
  Soares) to a **1949 marriage at Alvorada, MG**, while her birth family later
  concentrated at **Volta Redonda, RJ** (parents and at least one sibling died there;
  CIV-0014, CIV-0015, CIV-0025). She therefore sits at the hinge between the family's
  Minas Gerais rural phase and its move into the Rio de Janeiro industrial city.
  [INFERRED]

  She is also the **arrival point of a long descent that rose from below** [INFERRED]. The
  Bohrer line reaching her carried the Nova Friburgo Swiss/German colony descent and memory,
  not landed capital or inherited office — its forebears were colonists settled on poor
  highland lots [CONTEXTUAL], and its standing was always self-made and contingent (farm
  smallholding, then petty commerce, then an industrial-city livelihood) [INFERRED]. Her 1949
  marriage into the Muniz line and the birth family's mid-century move to the Volta Redonda
  steel city therefore mark a **stable urban working / lower-middle-class endpoint the family
  rose into**, not a decline. This is the analytical mirror image of Juan's paternal Armond
  line, which fell into the same 20th-century urban working world *from* an office-and-marriage
  elite — two families reaching the same class from opposite directions. [INFERRED]

  ## Open questions

  - Her **birth certificate** (Presidente Soares, MG, 1929) — not held; would fix her
  exact birth facts at primary level and name both parents. [OPEN]

  - Her **death record** (place and date) — not held; the c.2021 date is an unverified
  lead. [OPEN]

  ## Sources held (this repository)

  - CIV-0004 (1949 Antenor Muniz × Iris Bohrer marriage — her birth date/place, parents
  and married name) · CIV-0008 (1982 family birth certificate — names Iris Bohrer Muniz
  as maternal grandmother; living detail withheld).

  - CIV-0014 (father João Gonçalves Bohrer's 1970 death — "quinze filhos") · CIV-0016
  (sibling Eunir Bohrer's 1924 Nova Friburgo birth) · CIV-0025 (brother João Bohrer's
  2001 death) · REC-0001 (owner family roster) · PUB-0003 (published Nova Friburgo
  genealogy).

  ## Regional and migration context

  Her 1929 birth at Presidente Soares and 1949 marriage at Alvorada place her in the
  **Zona da Mata Mineira**, while her parents were **natural** of Rio de Janeiro state
  and her mother was born at **Nova Friburgo** (CIV-0016) — the Serra-fluminense town
  settled by the 1819–1824 Swiss / German Catholic colony. The family's descent from
  the Nova Friburgo Borer/Bohrer immigrants is documented in the published Nova
  Friburgo genealogy (PUB-0003) [LEAD] and is not asserted from the surname alone;
  whether her Bohrer father and Bohrer mother shared immigrant ancestry is unresolved.
  [CONTEXTUAL]

  ## Where to go today

  - **Birth (27 Feb 1929):** Igreja Matriz Nossa Senhora da Conceição, Alto Jequitibá, MG
  (birthplace Presidente Soares is an unconfirmed rural locality within the municipality;
  municipality-level point only) [APPROX] ·
  [Maps](https://maps.google.com/?q=-20.42389,-41.96583)

  - **Marriage to Antenor Muniz (1949):** Alvorada (district of Carangola), MG [APPROX] ·
  [Maps](https://maps.google.com/?q=-20.745,-42.1721)
profile_pt: >-
  ## Identidade

  **Iris Bohrer Muniz** (também *Iris Bohrer*; a forma de casada *Iris Bohrer Muniz* é
  a que ela adotou ao se casar). Era **Bohrer pelos dois lados** — tanto o pai quanto a
  mãe levavam o sobrenome Bohrer [PROVEN] (CIV-0004 nomeia seus pais como **João
  Gonçalves Bohrer** e **Dona Selina Bohrer**).

  - **Nascimento:** 27 de fevereiro de 1929, em **Presidente Soares, Minas Gerais**
  [PROVEN como declarado] — consta em sua certidão de casamento de 1949 (CIV-0004); não
  há registro de nascimento em mãos, portanto a data é uma declaração feita no
  casamento, não um registro primário de nascimento.

  - **Pais:** João Gonçalves Bohrer (P-0014) e Celina Bohrer (P-0015) [PROVEN]
  (CIV-0004; o casal é fixado de forma independente por CIV-0014 e CIV-0016). O nome da
  mãe é grafado **Selina** no casamento de 1949 (CIV-0004) e **Celina** nos registros
  de óbito e no nascimento de 1924 (ver P-0015).

  - **Casamento:** casou-se com **Antenor Muniz** (P-0006) em **7 de dezembro de 1949**
  em **Alvorada, Minas Gerais** [PROVEN] (CIV-0004), perante o Juiz de Paz [uncertain:
  Francisco Guizotti Gobbi]; passou então a assinar **Iris Bohrer Muniz**.

  - **Óbito:** falecida; nenhum registro de óbito em mãos [OPEN]. Uma pista de família /
  árvore colaborativa situa seu falecimento por volta de 2021 [LEAD] — não verificada
  por nenhum registro em mãos.

  ## Posição social e profissão

  Nada de ocupacional está firmemente documentado. Sua certidão de casamento de 1949
  registra sua *profissão* como [uncertain: agricultora] (CIV-0004); a leitura não é
  segura, portanto nenhuma ocupação é afirmada. Não há registro de bens, letramento ou
  de vida em mãos.

  ## Família e rede social

  - **Uma de quinze filhos** de João Gonçalves Bohrer × Celina Bohrer [PROVEN] — o
  óbito de seu pai, em 1970, afirma que o casal "deixou quinze filhos" (CIV-0014).

  - **Irmãos documentados:** **Eunir Bohrer** (n. 17 de maio de 1924, Nova Friburgo;
  CIV-0016) e **João Bohrer** (n. c.1940 em Carangola, MG; f. 12 de janeiro de 2001,
  Volta Redonda; CIV-0025) [PROVEN]. Os demais irmãos não estão documentados
  individualmente aqui.

  - **Casamento e descendência:** sua união com Antenor Muniz é o ponto em que a linha
  Bohrer se junta à linha Muniz. Ela desce até a família viva; uma certidão de
  nascimento familiar de 1982 nomeia **Iris Bohrer Muniz** como avó materna [PROVEN]
  (CIV-0008), corroborando sua forma de nome de casada. Detalhes de pessoas vivas são
  omitidos.

  ## O que podemos extrapolar

  Sua vida registrada vai de um **nascimento em 1929 na Zona da Mata Mineira**
  (Presidente Soares) a um **casamento em 1949 em Alvorada, MG**, ao passo que sua
  família de origem depois se concentrou em **Volta Redonda, RJ** (pais e ao menos um
  irmão faleceram ali; CIV-0014, CIV-0015, CIV-0025). Ela está, portanto, na dobradiça
  entre a fase rural mineira da família e sua mudança para a cidade industrial
  fluminense. [INFERRED]

  Ela é também o **ponto de chegada de uma longa descendência que subiu de baixo** [INFERRED].
  A linha Bohrer que chega até ela carregava a descendência e a memória da colônia
  suíço-alemã de Nova Friburgo, não capital fundiário nem cargo herdado — seus antepassados
  eram colonos assentados em lotes serranos pobres [CONTEXTUAL], e sua posição foi sempre
  autoconstruída e contingente (pequena lavoura, depois pequeno comércio, depois um sustento
  na cidade industrial) [INFERRED]. Seu casamento de 1949 com a linha Muniz e a mudança da
  família de origem para a cidade siderúrgica de Volta Redonda em meados do século marcam,
  portanto, um **ponto de chegada urbano estável, de classe trabalhadora / média-baixa, ao
  qual a família subiu**, e não um declínio. Esse é o espelho analítico da linha paterna
  Armond de Juan, que caiu no mesmo mundo urbano trabalhador do século XX *a partir de* uma
  elite de cargos e de casamento — duas famílias alcançando a mesma classe por direções
  opostas. [INFERRED]

  ## Questões em aberto

  - Sua **certidão de nascimento** (Presidente Soares, MG, 1929) — não está em mãos;
  fixaria seus dados de nascimento em nível primário e nomearia ambos os pais. [OPEN]

  - Seu **registro de óbito** (lugar e data) — não está em mãos; a data de c.2021 é uma
  pista não verificada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0004 (casamento Antenor Muniz × Iris Bohrer de 1949 — sua data/local de
  nascimento, pais e nome de casada) · CIV-0008 (certidão de nascimento familiar de
  1982 — nomeia Iris Bohrer Muniz como avó materna; detalhes de vivos omitidos).

  - CIV-0014 (óbito do pai João Gonçalves Bohrer em 1970 — "quinze filhos") · CIV-0016
  (nascimento da irmã Eunir Bohrer em 1924, Nova Friburgo) · CIV-0025 (óbito do irmão
  João Bohrer em 2001) · REC-0001 (lista familiar do proprietário) · PUB-0003
  (genealogia publicada de Nova Friburgo).

  ## Contexto regional e migratório

  Seu nascimento em 1929 em Presidente Soares e o casamento em 1949 em Alvorada a situam
  na **Zona da Mata Mineira**, enquanto seus pais eram **naturais** do estado do Rio de
  Janeiro e sua mãe nasceu em **Nova Friburgo** (CIV-0016) — a cidade serrano-fluminense
  fundada pela colônia católica suíço-alemã de 1819–1824. A descendência da família a
  partir dos imigrantes Borer/Bohrer de Nova Friburgo está documentada na genealogia
  publicada de Nova Friburgo (PUB-0003) [LEAD] e não é afirmada apenas a partir do
  sobrenome; se o pai Bohrer e a mãe Bohrer compartilhavam ascendência imigrante
  permanece indefinido. [CONTEXTUAL]

  ## Onde ir hoje

