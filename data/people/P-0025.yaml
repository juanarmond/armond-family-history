profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nasceu e faleceu no distrito de São Francisco do Glória, Carangola, Minas Gerais (CIV-0007) — ambos os fatos provenientes do registro de nascimento de 1915 de seus netos, o único documento que o registra. Nunca saiu do mesmo distrito rural, e o arquivo o registra apenas porque os filhos de sua filha Emmerenciana foram registrados ali.

  - **[CONTEXTUAL]** O distrito de São Francisco do Glória, em Carangola, situa-se na Zona da Mata Mineira, a zona de fronteira cafeeira aberta ao longo do século XIX. Uma família nativa daquele distrito ao longo de várias gerações teria vivido o auge da economia cafeeira, o pivô pós-1850 de mão de obra livre (Lei nº 581 de 4 set 1850 — Lei Eusébio de Queirós — encerrando o tráfico; Lei Áurea, nº 3.353, 13 maio 1888, abolindo a escravidão) e a transição para a meação no pós-abolição — tudo isso sem deixar rastro documental.

  - **[INFERRED]** Seu sobrenome "da Silva" — o mais comum em Portugal e no Brasil — e o "de Jesus" de sua esposa não carregam sinal patronímico ou social. Combinados com a ausência total de registros de terra, inventário ou imprensa para essa família, os Silvas leem-se como lavradores nativos pequenos proprietários ou meeiros, a base sem bens da economia cafeeira da Zona da Mata.

  - **[INFERRED]** Está visível no arquivo apenas porque os filhos de sua filha Emmerenciana foram registrados em 1915 ao amparo do decreto de anistia. Sem esse único ato, quatro avós (incluindo ele mesmo) não teriam deixado rastro documental algum — sua vida, como a da maioria de sua classe nesse período, é preservada apenas pela descendência.

  ## Identidade

  **Antonio Francisco da Silva** [PROVEN conforme declarado] — pai de Emmerenciana Maria
  de Jesus (P-0022).

  - **Origem:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007).

  - **Cônjuge:** Maria Paula de Jesus (P-0026).

  - **Filha (em nossa linha):** Emmerenciana Maria de Jesus (P-0022).

  - **Óbito:** no distrito de São Francisco do Glória, antes de 1915 [PROVEN conforme
  declarado] (CIV-0007, "onde aquelle falleceu").

  - **Data de nascimento e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ele é o piso do arquivo: um homem sem posição a adquirir, herdar ou perder.
  [INFERRED / CONTEXTUAL] Todas as vias de posição social que o resto desta árvore utiliza
  faltam em seu registro — nenhum cargo, nenhuma patente de milícia, nenhum ofício, nenhuma
  fazenda, nenhum inventário, nenhum papel de credor, nenhuma assinatura. CIV-0007 declara
  três coisas sobre ele e nada mais: era natural do distrito de São Francisco do Glória,
  viveu ali e ali havia falecido antes de outubro de 1915. Um homem com bens naquele
  distrito deixava papel — um contemporâneo da mesma freguesia, Antonio Engracio de Souza
  (P-0032), aparece numa ata eleitoral de 1898 e assina o próprio nome como testemunha numa
  procuração de 1917 — e Antonio Francisco da Silva não aparece em lugar nenhum. O silêncio
  é, ele próprio, o sinal de classe, ainda que seja um negativo delimitado: nenhuma busca em
  inventários, registros de terras ou notas foi feita especificamente sobre seu nome. [OPEN]

  Nada herdável significa nada a fragmentar. [INFERRED / CONTEXTUAL] A sucessão partível
  brasileira divide o espólio igualmente entre todos os filhos, e é esse o mecanismo que
  reduz uma propriedade a nada em duas gerações em outros pontos desta árvore. Aqui ele
  nunca operou, porque não havia propriedade a dividir. A prova está a jusante: de seus três
  netos documentados, dois morreram explicitamente sem nada — José de Carvalho Guimarães
  Sobrinho, lavrador com onze filhos, "não tem bens a inventariar" (CIV-0049), e Sebastião,
  lavrador solteiro residente no Asilo São Vicente de Paula, "não deixa bens" (CIV-0050) —
  enquanto apenas João José deixou bens a inventariar, e entre cerca de quatorze filhos
  (CIV-0033). Uma linha que começa do nada não decai; persiste no piso, com uma exceção
  tardia e imediatamente fragmentada.

  Seu único ato documentado de mobilidade é o casamento da filha. [INFERRED] Emmerenciana
  (P-0022) casou-se com Francisco José de Carvalho Guimarães (P-0021), filho nascido no
  Brasil de um imigrante português. Se isso foi um passo para cima depende de qual era, de
  fato, a posição de Francisco — e isso não está resolvido: sua única ocupação PROVEN é
  *lavrador*, a patente de Alferes da Guarda Nacional de 1897 que lhe é atribuída é uma
  [LEAD], e uma casa de real peso local não deixa seis filhos sem registro por até quatorze
  anos. Pelas evidências disponíveis, lê-se como um casamento entre duas casas de lavradores
  do mesmo distrito, não como uma ascensão.

  Ele nunca se mudou; as migrações da família começam todas depois dele. [CONTEXTUAL]
  Nascido, residente e falecido dentro de um único distrito, é a base estática a partir da
  qual as duas gerações seguintes se dispersaram para o Rio de Janeiro, para Volta Redonda e
  para a fronteira cafeeira do norte do Paraná. Sua vida adulta atravessa exatamente a
  reorganização da Zona da Mata em torno do trabalho livre (Lei Eusébio de Queirós, 1850;
  Lei Áurea, 1888); uma casa nativa sem terra daquele distrito teria vivido isso como
  arrendamento, meação ou trabalho a jornal — nada disso gera documentos. Nenhum registro
  disponível declara sua ocupação, de modo que isto é padrão regional, não biografia.

  Sobre educação, nada pode ser afirmado em nenhuma direção. [OPEN] Nenhum registro o mostra
  assinando ou apondo cruz. O que o registro mostra é distância institucional, e não
  analfabetismo comprovado: em 1915 seus seis netos seguiam todos sem registro de
  nascimento, e a casa só entrou no registro civil quando um decreto de anistia ("decreto
  número dois mil oitocentos e oitenta e sete, de vinte e cinco de novembro" — 1914) o
  tornou possível. A escolarização na Zona da Mata rural de sua época era um privilégio
  comprado e ligado à classe, sem escola pública de aldeia por trás, de modo que a ausência
  de qualquer sinal de alfabetização nesta casa é o padrão esperado, não uma descoberta.
  [CONTEXTUAL]

  ## Nota sobre a evidência

  Ele é nomeado apenas como avô materno no registro de nascimento de 1915 de seus netos
  (CIV-0007), uma declaração de informante em registro retroativo; nenhum registro próprio
  dele foi obtido. O rascunho de recuperação tratou essa filiação como apenas de árvore
  colaborativa, mas CIV-0007 a sustenta diretamente.

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — o nomeia, com a esposa, como os
  avós maternos). Não aparece em nenhum outro registro obtido.

  ## Onde ir hoje

  - **Origem e óbito (distrito de São Francisco do Glória, Carangola, MG):** CIV-0007 o
  registra natural deste distrito ("naturaes deste districto") e ali falecido ("onde
  aquelle falleceu") antes de 1915 — o lugar localizado ligado a ele; nenhuma origem
  anterior (nem origem portuguesa) é declarada em qualquer registro disponível
  [RESOLVED — distrito] ·
