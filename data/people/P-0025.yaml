profile: >-
  ## Interesting facts

  - **[PROVEN]** He was born and died in the São Francisco do Glória district, Carangola, Minas Gerais (CIV-0007) — both facts from his grandchildren's 1915 birth registration, the only document that records him. He never left the same rural district, and the archive records him only because his daughter Emmerenciana's children were registered there.

  - **[CONTEXTUAL]** The São Francisco do Glória district of Carangola sits in the Zona da Mata Mineira, the coffee-frontier zone that was opened up during the 19th century. A family native to that district across multiple generations would have lived through the peak coffee economy, the post-1850 free-labour pivot (Lei nº 581 de 4 set 1850 — Lei Eusébio de Queirós — ending the slave trade; Lei Áurea, nº 3.353, 13 maio 1888, abolishing slavery), and the post-abolition sharecropping transition — all without leaving a documentary trace.

  - **[INFERRED]** His surname "da Silva" — the most common Portuguese surname in Brazil — and his wife's "de Jesus" carry no patronymic or social signal. Combined with the complete absence of land, probate or press records for this family, the Silvas read as native smallholder or tenant-farming stock, the unpropertied base of the Zona da Mata coffee economy.

  - **[INFERRED]** He is visible in the archive only because his daughter Emmerenciana's children were registered in 1915 under the amnesty decree. Without that single act, four grandparents (including himself) would have left no documentary footprint at all — his life, like those of most of his class in this period, is preserved only by descent.

  ## Identity

  **Antonio Francisco da Silva** [PROVEN as reported] — father of Emmerenciana Maria de
  Jesus (P-0022).

  - **Origin:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007).

  - **Spouse:** Maria Paula de Jesus (P-0026).

  - **Child (in our line):** Emmerenciana Maria de Jesus (P-0022).

  - **Death:** in the São Francisco do Glória district, before 1915 [PROVEN as stated]
  (CIV-0007, "onde aquelle falleceu").

  - **Birth date and parents:** not held. [OPEN]

  ## Note on evidence

  He is named only as a maternal grandparent in his grandchildren's 1915 birth
  registration (CIV-0007), an informant statement at a retrospective registration; no
  record of his own is held. The retrieval draft treated this parentage as tree-only, but
  CIV-0007 supports it directly.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names him and his wife as the maternal
  grandparents). He appears in no other held record.

  ## Where to go today

  - **Origin and death (São Francisco do Glória district, Carangola, MG):** CIV-0007 records
  him a native of this district ("naturaes deste districto") who died there ("onde aquelle
  falleceu") before 1915 — the located place tied to him; no earlier origin (and no
  Portuguese origin) is stated in any held record [RESOLVED — district] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=S%C3%A3o+Francisco+do+Gl%C3%B3ria%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nasceu e faleceu no distrito de São Francisco do Glória, Carangola, Minas Gerais (CIV-0007) — ambos os fatos provenientes do registro de nascimento de 1915 de seus netos, o único documento que o registra. Nunca saiu do mesmo distrito rural, e o arquivo o registra apenas porque os filhos de sua filha Emmerenciana foram registrados ali.

  - **[CONTEXTUAL]** O distrito de São Francisco do Glória, em Carangola, situa-se na Zona da Mata Mineira, a zona de fronteira cafeeira aberta ao longo do século XIX. Uma família nativa daquele distrito ao longo de várias gerações teria vivido o auge da economia cafeeira, o pivô pós-1850 de mão de obra livre (Lei nº 581 de 4 set 1850 — Lei Eusébio de Queirós — encerrando o tráfico; Lei Áurea, nº 3.353, 13 maio 1888, abolindo a escravidão) e a transição para a meação no pós-abolição — tudo isso sem deixar rastro documental.

  - **[INFERRED]** Seu sobrenome "da Silva" — o mais comum em Portugal e no Brasil — e o "de Jesus" de sua esposa não carregam sinal patronímico ou social. Combinados com a ausência total de registros de terra, inventário ou imprensa para essa família, os Silvas leem-se como lavradores nativos pequenos proprietários ou meeiros, a base sem bens da economia cafeeira da Zona da Mata.

  - **[INFERRED]** Está visível no arquivo apenas porque os filhos de sua filha Emmerenciana foram registrados em 1915 ao amparo do decreto de anistia. Sem esse único ato, quatro avós (incluindo ele mesmo) não teriam deixado rastro documental algum — sua vida, como a da maioria de sua classe nesse período, é preservada apenas pela descendência.

  ## Identidade

  **Antonio Francisco da Silva** [PROVEN conforme declarado] — pai de Emmerenciana Maria
  de Jesus (P-0022).

  - **Origem:** natural do distrito de São Francisco do Glória (Carangola, MG) [PROVEN
  conforme declarado] (CIV-0007).

  - **Cônjuge:** Maria Paula de Jesus (P-0026).

  - **Filha (em nossa linha):** Emmerenciana Maria de Jesus (P-0022).

  - **Óbito:** no distrito de São Francisco do Glória, antes de 1915 [PROVEN conforme
  declarado] (CIV-0007, "onde aquelle falleceu").

  - **Data de nascimento e pais:** não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ele é nomeado apenas como avô materno no registro de nascimento de 1915 de seus netos
  (CIV-0007), uma declaração de informante em registro retroativo; nenhum registro próprio
  dele foi obtido. O rascunho de recuperação tratou essa filiação como apenas de árvore
  colaborativa, mas CIV-0007 a sustenta diretamente.

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 — o nomeia, com a esposa, como os
  avós maternos). Não aparece em nenhum outro registro obtido.

  ## Onde ir hoje

  - **Origem e óbito (distrito de São Francisco do Glória, Carangola, MG):** CIV-0007 o
  registra natural deste distrito ("naturaes deste districto") e ali falecido ("onde
  aquelle falleceu") antes de 1915 — o lugar localizado ligado a ele; nenhuma origem
  anterior (nem origem portuguesa) é declarada em qualquer registro disponível
  [RESOLVED — distrito] ·
