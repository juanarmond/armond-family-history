profile: >-
  ## Interesting facts

  - **[PROVEN]** He was born and died in the São Francisco do Glória district, Carangola, Minas Gerais (CIV-0007) — both facts from his grandchildren's 1915 birth registration, the only document that records him. He never left the same rural district, and the archive records him only because his daughter Emmerenciana's children were registered there.

  - **[CONTEXTUAL]** The São Francisco do Glória district of Carangola sits in the Zona da Mata Mineira, the coffee-frontier zone that was opened up during the 19th century. A family native to that district across multiple generations would have lived through the peak coffee economy, the post-1850 free-labour pivot (Lei nº 581 de 4 set 1850 — Lei Eusébio de Queirós — ending the slave trade; Lei Áurea, nº 3.353, 13 maio 1888, abolishing slavery), and the post-abolition sharecropping transition — all without leaving a documentary trace.

  - **[INFERRED]** His surname "da Silva" — the most common Portuguese surname in Brazil — and his wife's "de Jesus" carry no patronymic or social signal. Combined with the complete absence of land, probate or press records for this family, the Silvas read as native smallholder or tenant-farming stock, the unpropertied base of the Zona da Mata coffee economy.

  - **[INFERRED]** He is visible in the archive only because his daughter Emmerenciana's children were registered in 1915 under the amnesty decree. Without that single act, four grandparents (including himself) would have left no documentary footprint at all — his life, like those of most of his class in this period, is preserved only by descent.

  ## Identity

  **Antonio Francisco da Silva** [PROVEN as reported] — father of Emmerenciana Maria de
  Jesus (P-0022).

  - **Origin:** native of the São Francisco do Glória district (Carangola, MG) [PROVEN as
  stated] (CIV-0007).

  - **Spouse:** Maria Paula de Jesus (P-0026).

  - **Child (in our line):** Emmerenciana Maria de Jesus (P-0022).

  - **Death:** in the São Francisco do Glória district, before 1915 [PROVEN as stated]
  (CIV-0007, "onde aquelle falleceu").

  - **Birth date and parents:** not held. [OPEN]

  ## What we can extrapolate

  He is the archive's floor: a man with no standing to acquire, inherit or lose.
  [INFERRED / CONTEXTUAL] Every route to position that the rest of this tree uses is
  missing from his record — no office, no militia rank, no trade, no fazenda, no probate,
  no creditor role, no signature. CIV-0007 states three things about him and no more: he
  was native to the São Francisco do Glória district, he lived there, and he had died
  there before October 1915. A man of property in that district did leave paper — a
  contemporary of the same parish, Antonio Engracio de Souza (P-0032), surfaces in an 1898
  electoral act and signs his own name as a witness in a 1917 procuração — and Antonio
  Francisco da Silva surfaces nowhere. The silence is itself the class signal, though it
  is a bounded negative: no probate, land or notarial search has yet been run specifically
  on his name. [OPEN]

  Nothing heritable means nothing to fragment. [INFERRED / CONTEXTUAL] Brazilian partible
  succession divides an estate equally among all the children, and that is the mechanism
  that thins a holding to nothing within two generations elsewhere in this tree. It never
  engaged here, because there was no holding to divide. The proof is downstream: of his
  three documented grandsons, two died with explicitly nothing — José de Carvalho Guimarães
  Sobrinho, a lavrador with eleven children, "não tem bens a inventariar" (CIV-0049), and
  Sebastião, an unmarried lavrador living in the São Vicente de Paula poorhouse, "não deixa
  bens" (CIV-0050) — while only João José left an estate to inventory, and that among some
  fourteen children (CIV-0033). A line that starts with nothing does not decline; it
  persists at the floor, with one late and immediately-fragmented exception.

  His one documented act of mobility is his daughter's marriage. [INFERRED] Emmerenciana
  (P-0022) married Francisco José de Carvalho Guimarães (P-0021), the Brazilian-born son of
  a Portuguese immigrant. Whether that was a step upward depends on what Francisco's
  standing actually was, and that is unsettled: his only PROVEN occupation is *lavrador*,
  the 1897 Guarda Nacional Alferes rank attributed to him is a [LEAD], and a household of
  real local weight does not leave six children unregistered for up to fourteen years. On
  the evidence held this reads as a marriage between two farming households of the same
  district, not as a climb.

  He never moved; the family's migrations all begin after him. [CONTEXTUAL] Born, resident
  and dead inside one district, he is the static base from which the next two generations
  dispersed to Rio de Janeiro, to Volta Redonda and to the northern-Paraná coffee frontier.
  His adult lifetime spans exactly the Zona da Mata's reorganisation around free labour
  (Lei Eusébio de Queirós, 1850; Lei Áurea, 1888); a landless native household of that
  district would have lived that through tenancy, sharecropping or day-wage work, none of
  which generates documents. No held record states his occupation, so this is regional
  pattern, not biography.

  On education nothing can be asserted in either direction. [OPEN] No record shows him
  signing or marking. What the record does show is institutional distance rather than
  proven illiteracy: in 1915 all six of his grandchildren were still unregistered at birth,
  and the household entered the civil register only when an amnesty decree ("decreto número
  dois mil oitocentos e oitenta e sete, de vinte e cinco de novembro" — 1914) made it
  possible. Schooling in the rural Zona da Mata of his lifetime was a purchased,
  class-linked privilege with no free village school behind it, so the absence of any
  literacy signal in this household is the expected default, not a finding. [CONTEXTUAL]

  ## Note on evidence

  He is named only as a maternal grandparent in his grandchildren's 1915 birth
  registration (CIV-0007), an informant statement at a retrospective registration; no
  record of his own is held. The retrieval draft treated this parentage as tree-only, but
  CIV-0007 supports it directly.

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration — names him and his wife as the maternal
  grandparents). He appears in no other held record.

  ## Where to go today

  - **Origin and death (São Francisco do Glória district, Carangola, MG):** CIV-0007 records
  him a native of this district ("naturaes deste districto") who died there ("onde aquelle
  falleceu") before 1915 — the located place tied to him; no earlier origin (and no
  Portuguese origin) is stated in any held record [RESOLVED — district] ·
