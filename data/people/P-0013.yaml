profile: >-
  ## Identity

  **Luiza Fernandes de Azevedo** [PROVEN] — the form in her 1916 civil marriage
  (CIV-0001), the same 1916 parish marriage (PAR-0012) and her son Antenor's 1949
  marriage (CIV-0004). She also appears as **Luiza Secundina de Azevedo** in her son
  Aristides's 1922 baptism (PAR-0003). Both forms come from her parents: **Fernandes**
  from her mother, **Secundina / Secundino** from her father.

  - **Birth:** about **1898** (recorded aged 18 in October 1916), at **Bom Jesus de
  Cachoeira Alegre, district of São Paulo do Muriaé, Minas Gerais** [birth year
  INFERRED from age; birthplace PROVEN] — "nascida e baptizada em Bom Jesus de
  Cachoeira Alegre" (PAR-0012; age 18 in CIV-0001). No birth or baptism record is held.

  - **Parents:** **José Secundino de Azevedo** (P-0038) and **Thereza Fernandes de
  Azevedo** (P-0039) [PROVEN] — named in her 1916 civil marriage (CIV-0001, as
  "Secundino Maria de Azevedo" and "Theresa Fernandes de Azevedo"), her 1916 parish
  marriage (PAR-0012) and her son Aristides's 1922 baptism (PAR-0003, giving the
  fuller "José Secundino"). Her father was already deceased and her mother living at
  Carangola by 1916 (CIV-0006, PAR-0012). The parish act (PAR-0012) resolves a
  civil-copy misread of the father's name ("Sebastião", CIV-0006) to Secundino.

  - **Marriage:** married **Deocleciano Muniz Bittencourt** (P-0012) at **Carangola,
  Minas Gerais, on 21 October 1916** [PROVEN] — civil (CIV-0001 / CIV-0006) and
  religious (PAR-0012, Igreja de Santa Luzia de Carangola).

  - **Children:** her son **Antenor Muniz** (P-0006, b. 1923) and the documented child
  **Aristides** (bapt. 1922, PAR-0003). Further children circulate on collaborative
  trees [LEAD].

  - **Death:** not documented in this repository [OPEN].

  ## Standing and profession

  - **Doméstica** [PROVEN] (CIV-0006).

  - **Illiterate** [PROVEN] — at her 1916 marriage she could not read or write and was
  signed for by proxy (José Augusto Pinheiro, surname an uncertain read) (CIV-0006),
  whereas her husband signed his own name.

  ## Family and social network

  Daughter of the **Azevedo** family of the São Paulo do Muriaé / Carangola region
  (P-0038 × P-0039). Her widowed mother Thereza was resident at Carangola by 1916
  (CIV-0006, PAR-0012), so the Azevedo women had moved into the same district as the
  Muniz Bittencourt household she married into.

  ## What we can extrapolate

  [INFERRED] The record contrast is real: an illiterate doméstica marrying a literate,
  landholding-class lavrador — she signed by proxy while he signed his own name
  (CIV-0006) — which points to a modest Azevedo household. Her mother's presence at
  Carangola as a widow suggests the marriage also anchored a widow-headed family into
  the more established Muniz Bittencourt / Brandão network.

  On the socioeconomic read, the Azevedos are the class floor of this line — labour, and nothing
  heritable. [INFERRED / CONTEXTUAL] Her father (P-0038) leaves no probate, land or press
  footprint at all; where the Muniz at least held a small proprietário landholding, the Azevedos
  hold no documented capital of any kind — no land, office, title or commerce — their only asset
  being labour. This is the poorest of Juan's ancestral couples, poor in the specific sense that
  there was nothing to transmit: no property to fragment, no literacy to re-buy, no standing to
  inherit.

  Her marriage reads as modest hypergamy, anchoring a widow-headed family upward one rung.
  [INFERRED] She signs by proxy while her husband signs his own name and belongs to the
  landholding-lavrador, kin-networked Muniz/Brandão world; a propertyless Azevedo family marrying
  its daughter into the more-established immigrant-descended Muniz is the classic move of a family
  with no capital but its people — it converts a marriage into security. Her widowed mother
  Thereza (P-0039) following her into the Carangola district is the same logic: kinship
  substituting for the property the Azevedos never had.

  Education is the visible class line between the spouses. [CONTEXTUAL] Literacy in this era was
  a purchased, class-linked privilege, and the marriage act captures the exact boundary — the
  husband literate, the wife not. Luiza's illiteracy is not personal but structural: a landless
  rural girl of the 1890s Zona da Mata had no access to the schooling a smallholder's son might
  scrape. She carries the Azevedo line's defining feature — propertylessness so complete it
  leaves almost no archive — into the Muniz family, where it meets a smallholder base one rung
  up; her children inherit both, the Muniz land-and-kin base and the Azevedo floor with no
  cushion beneath it. [INFERRED]

  ## Open questions

  - Her own baptism (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé, c.1898) —
  would give an exact birth date and independently name her parents. [OPEN]

  - Her death record — undocumented. [OPEN]

  ## Sources held (this repository)

  - CIV-0001 (1916 civil marriage — age 18, birthplace, parents) · CIV-0006
  (full-content 1916 marriage — doméstica, illiteracy and proxy signature, father-name
  misread "Sebastião") · PAR-0012 (1916 parish marriage — resolves the father to
  Secundino, birthplace Bom Jesus de Cachoeira Alegre).

  - PAR-0003 (1922 baptism of her son Aristides — the "Luiza Secundina de Azevedo"
  variant; names her parents) · CIV-0004 (1949 — names her "Luiza Fernandes de
  Azevedo" as Antenor's mother).

  - REC-0001 (owner's direct-ancestor roster).

  ## Regional and migration context

  [CONTEXTUAL] Her documented origin is entirely the **Zona da Mata Mineira** — born
  at Bom Jesus de Cachoeira Alegre (São Paulo do Muriaé) and married at neighbouring
  Carangola, an internal move within one contiguous coffee micro-region. [OPEN] No
  Madeiran or other Portuguese-island origin is documented for the Azevedo line; a
  surname-based island origin is not evidenced and remains an open lead only. The free-labour
  coffee economy the family moved within ran on the Lei nº 581 de 1850 (Lei Eusébio de Queirós),
  through abolition in the Lei Áurea (1888), with land under the Lei de Terras (nº 601, 1850) — a
  Brazilian-side history, with no Atlantic crossing proven for this line. [CONTEXTUAL]

  ## Where to go today

  - **Birth (~1898):** Bom Jesus de Cachoeira Alegre, distrito de Muriaé, MG; sede parish Paróquia São Paulo de Muriaé (Rua Dr Afonso Canedo 47) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Bom%20Jesus%20da%20Cachoeira%2C%20Muria%C3%A9%2C%20MG)

  - **Marriage (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Identidade

  **Luiza Fernandes de Azevedo** [PROVEN] — a forma em seu casamento civil de 1916
  (CIV-0001), no mesmo casamento paroquial de 1916 (PAR-0012) e no casamento de 1949
  de seu filho Antenor (CIV-0004). Ela também aparece como **Luiza Secundina de
  Azevedo** no batismo de 1922 de seu filho Aristides (PAR-0003). Ambas as formas vêm
  de seus pais: **Fernandes** da mãe, **Secundina / Secundino** do pai.

  - **Nascimento:** por volta de **1898** (registrada com 18 anos em outubro de 1916),
  em **Bom Jesus de Cachoeira Alegre, distrito de São Paulo do Muriaé, Minas Gerais**
  [birth year INFERRED from age; birthplace PROVEN] — "nascida e baptizada em Bom Jesus
  de Cachoeira Alegre" (PAR-0012; 18 anos em CIV-0001). Nenhum registro de nascimento
  ou batismo é conservado.

  - **Pais:** **José Secundino de Azevedo** (P-0038) e **Thereza Fernandes de Azevedo**
  (P-0039) [PROVEN] — nomeados em seu casamento civil de 1916 (CIV-0001, como
  "Secundino Maria de Azevedo" e "Theresa Fernandes de Azevedo"), em seu casamento
  paroquial de 1916 (PAR-0012) e no batismo de 1922 de seu filho Aristides (PAR-0003,
  que traz a forma mais completa "José Secundino"). Seu pai já era falecido e sua mãe
  residia em Carangola em 1916 (CIV-0006, PAR-0012). O ato paroquial (PAR-0012)
  resolve uma leitura equivocada do nome do pai na cópia civil ("Sebastião", CIV-0006)
  para Secundino.

  - **Casamento:** casou-se com **Deocleciano Muniz Bittencourt** (P-0012) em
  **Carangola, Minas Gerais, em 21 de outubro de 1916** [PROVEN] — civil (CIV-0001 /
  CIV-0006) e religioso (PAR-0012, Igreja de Santa Luzia de Carangola).

  - **Filhos:** seu filho **Antenor Muniz** (P-0006, n. 1923) e o filho documentado
  **Aristides** (bat. 1922, PAR-0003). Outros filhos circulam em árvores colaborativas
  [LEAD].

  - **Óbito:** não documentado neste repositório [OPEN].

  ## Posição social e profissão

  - **Doméstica** [PROVEN] (CIV-0006).

  - **Analfabeta** [PROVEN] — em seu casamento de 1916 não sabia ler nem escrever e
  assinou por procuração (José Augusto Pinheiro, sobrenome de leitura incerta)
  (CIV-0006), enquanto o marido assinou o próprio nome.

  ## Família e rede social

  Filha da família **Azevedo** da região de São Paulo do Muriaé / Carangola (P-0038 ×
  P-0039). Sua mãe viúva Thereza residia em Carangola em 1916 (CIV-0006, PAR-0012),
  de modo que as mulheres Azevedo haviam se mudado para o mesmo distrito da família
  Muniz Bittencourt com a qual ela se casou.

  ## O que podemos extrapolar

  [INFERRED] O contraste nos registros é real: uma doméstica analfabeta casando-se com
  um lavrador letrado da classe proprietária — ela assinou por procuração enquanto ele
  assinou o próprio nome (CIV-0006) — o que aponta para um lar Azevedo modesto. A
  presença de sua mãe em Carangola como viúva sugere que o casamento também ancorou uma
  família chefiada por viúva na rede Muniz Bittencourt / Brandão, mais estabelecida.

  Na leitura socioeconômica, os Azevedo são o piso de classe desta linha — trabalho, e nada
  herdável. [INFERRED / CONTEXTUAL] Seu pai (P-0038) não deixa qualquer rastro em inventário,
  terra ou imprensa; onde os Muniz ao menos detinham uma pequena propriedade de proprietário, os
  Azevedo não detêm capital documentado de espécie alguma — nem terra, ofício, título ou comércio
  —, sendo seu único ativo o trabalho. Este é o mais pobre dos casais ancestrais de Juan, pobre
  no sentido específico de que não havia nada a transmitir: nenhuma propriedade a fragmentar,
  nenhuma alfabetização a recomprar, nenhuma posição a herdar.

  Seu casamento lê-se como uma hipergamia modesta, ancorando para cima, em um degrau, uma família
  chefiada por viúva. [INFERRED] Ela assina por procuração enquanto o marido assina o próprio
  nome e pertence ao mundo Muniz/Brandão de lavradores proprietários com rede de parentesco; uma
  família Azevedo sem propriedade que casa a filha na mais estabelecida linha Muniz, descendente
  de imigrantes, é o movimento clássico de uma família sem capital além de sua gente — converte um
  casamento em segurança. Sua mãe viúva Thereza (P-0039) seguindo-a para o distrito de Carangola
  é a mesma lógica: o parentesco substituindo a propriedade que os Azevedo nunca tiveram.

  A educação é a linha de classe visível entre os cônjuges. [CONTEXTUAL] A alfabetização nesta
  época era um privilégio comprado e ligado à classe, e o ato de casamento capta a fronteira
  exata — o marido letrado, a esposa não. O analfabetismo de Luiza não é pessoal, mas estrutural:
  uma menina rural sem terra da Zona da Mata dos anos 1890 não tinha acesso à escolaridade que o
  filho de um pequeno proprietário poderia arranhar. Ela carrega a característica definidora da
  linha Azevedo — uma ausência de propriedade tão completa que quase não deixa arquivo — para
  dentro da família Muniz, onde encontra uma base de pequenos proprietários um degrau acima; seus
  filhos herdam ambas, a base Muniz de terra-e-parentesco e o piso Azevedo sem colchão por baixo.
  [INFERRED]

  ## Questões em aberto

  - Seu próprio batismo (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé, c.1898)
  — daria uma data de nascimento exata e nomearia seus pais de forma independente.
  [OPEN]

  - Seu registro de óbito — não documentado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0001 (casamento civil de 1916 — 18 anos, local de nascimento, pais) · CIV-0006
  (casamento de 1916 em inteiro teor — doméstica, analfabetismo e assinatura por
  procuração, nome do pai lido erroneamente "Sebastião") · PAR-0012 (casamento
  paroquial de 1916 — resolve o pai para Secundino, local de nascimento Bom Jesus de
  Cachoeira Alegre).

  - PAR-0003 (batismo de 1922 de seu filho Aristides — a variante "Luiza Secundina de
  Azevedo"; nomeia seus pais) · CIV-0004 (1949 — nomeia-a "Luiza Fernandes de Azevedo"
  como mãe de Antenor).

  - REC-0001 (lista de ancestrais diretos do proprietário).

  ## Contexto regional e migratório

  [CONTEXTUAL] Sua origem documentada é inteiramente a **Zona da Mata Mineira** —
  nascida em Bom Jesus de Cachoeira Alegre (São Paulo do Muriaé) e casada na vizinha
  Carangola, uma mudança interna dentro de uma mesma micro-região cafeeira contígua.
  [OPEN] Nenhuma origem madeirense ou de outra ilha portuguesa está documentada para a
  linha Azevedo; uma origem insular baseada no sobrenome não tem evidência e permanece
  apenas como pista em aberto. A economia cafeeira de trabalho livre dentro da qual a família se
  moveu funcionava sobre a Lei nº 581 de 1850 (Lei Eusébio de Queirós), até a abolição na Lei
  Áurea (1888), com a terra sob a Lei de Terras (nº 601, 1850) — uma história do lado brasileiro,
  sem travessia atlântica comprovada para esta linha. [CONTEXTUAL]

  ## Onde ir hoje

  - **Nascimento (~1898):** Bom Jesus de Cachoeira Alegre, distrito de Muriaé, MG; paróquia da sede Paróquia São Paulo de Muriaé (Rua Dr Afonso Canedo 47) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Bom%20Jesus%20da%20Cachoeira%2C%20Muria%C3%A9%2C%20MG)

  - **Casamento (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
