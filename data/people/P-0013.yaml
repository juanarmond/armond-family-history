  ## Posição social e profissão


  - **Doméstica** [PROVEN] (CIV-0006) — o termo padrão de registro para uma mulher que trabalha
  no próprio lar ou no de outrem, sem implicação de salário ou propriedade.

  - **Analfabeta** [PROVEN] — "por aquella não saber ler nem escrever" (CIV-0006); assinou por
  procuração enquanto o marido assinou de próprio punho.

  - **Nenhuma propriedade, cargo, título ou ofício lhe é atestado** em qualquer registro conservado.
  [PROVEN como negativa no conjunto disponível] Fica retirada a extensão anterior dessa negativa
  "ao lar de seus pais": seu pai é nomeado em 1908 como detentor de terra confrontante com uma
  propriedade no Bom Jesus (FAN-0018, contexto, não evidência), e sua mãe era uma de cinco herdeiras
  necessárias de um espólio que foi a inventário e partilha em 1898 (PRB-0013, PRB-0014). Quanto
  dele chegou a seus pais não está registrado na parte conservada do processo. [OPEN]


  ## Família e rede social


  Filha do lar **Azevedo** do eixo São Paulo do Muriaé / Carangola (P-0038 × P-0039, família F-0018)
  e neta, pelo lado materno, de uma família portuguesa estabelecida no mesmo distrito: em 1898
  sua avó, seu tio Joaquim José Fernandes e suas tias Maria José da Conceição, Maria Fernandes
  de Souza e Maria de Jesus da Conceição, com os maridos, moravam todos no distrito do Bom Jesus
  da Cachoeira Alegre (PRB-0014). [PROVEN] Ela nasceu, portanto, num aglomerado da parentela de
  sua mãe. [INFERRED]


  Duas irmãs estão documentadas por seus próprios óbitos civis: **Alcida Fernandes de Azevedo**
  (f. 20 de maio de 1975, Mesquita, RJ — CIV-0051, que nomeia a mesma mãe e uma variante do mesmo
  pai) e **Gloria Lacerda de Azevedo** (f. 9 de maio de 1960, Niterói, RJ — óbito nº 26.483, lido
  no lote de recuperação, mas **ainda não catalogado como fonte neste repositório**). Alcida é
  registrada como viúva de um **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; que esse Manoel
  fosse irmão de Deocleciano — fazendo de duas irmãs Azevedo as esposas de dois irmãos Muniz Bittencourt
  — é leitura do perfil de pesquisa e permanece **[LEAD]**.


  Ao casar-se, seu pai já era falecido e sua mãe viúva residia no mesmo distrito de Carangola
  (CIV-0006, PAR-0012), de modo que as mulheres Azevedo haviam se mudado para o distrito da família
  Muniz Bittencourt com a qual ela se casou. O ato de 1916 não nomeia bem algum, mas já não se
  lê como prova de uma família sem nenhum. [INFERRED]


  ## O que podemos extrapolar


  **1. A família de sua mãe era de emigrantes minhotos de recursos modestos, não um piso sem propriedade.
  [INFERRED]** A versão anterior deste perfil lia os Azevedo como sem capital em forma transmissível
  alguma, de modo que a sucessão partível brasileira seria "um não-evento para esta família".
  Os registros encontrados depois derrubam isso. Seu avô fez testamento e seus bens foram a "inventario
  e partilha" entre cinco herdeiros, um deles sua mãe (PRB-0013, PRB-0014); o espólio de seu tio-avô
  Domingos, partilhado em 1885–86, valia 5:691$000 (PRB-0016); e seu pai detinha ou lavrava terra
  no Bom Jesus em 1908 (FAN-0018, contexto). A sucessão partível operou, portanto, em sua família,
  poucos meses depois de seu nascimento. O que ela rendeu é desconhecido: a parte conservada do
  inventário de 1898 interrompe-se antes da descrição dos bens (PRB-0014). [OPEN — a escala] O
  contraste que o perfil anterior traçava com o lado açoriano da árvore do marido — empobrecido
  *pela* divisão da posse de Lomba do Botão (P-0084) — lê-se agora como diferença de grau, não
  de natureza. [INFERRED]


  **2. Seu casamento uniu duas famílias de pequenos lavradores. [INFERRED]** Ela assina por procuração;
  Deocleciano assina o próprio nome, é registrado *lavrador* e pertence ao mundo Muniz/Brandão
  de Carangola, tecido por parentesco (CIV-0006). A leitura anterior disso como "hipergamia modesta"
  de um lar sem bens e chefiado por viúva fica enfraquecida: seu próprio pai detinha terra e a
  família de sua mãe tinha espólio. A distância entre as duas famílias parece menor do que parecia.
  A mãe seguindo-a para o distrito de Carangola (CIV-0006) ainda se lê como uma viúva indo em
  direção à parentela, e, se a leitura do casamento de Alcida se sustentar [LEAD], a família enviou
  duas filhas ao mesmo lar.


  **3. A alfabetização dividia sua família mais por sexo que por classe. [INFERRED]** O ato de
  1916 põe um marido alfabetizado e uma esposa analfabeta na mesma página (CIV-0006), e o perfil
  anterior o lia como uma linha de classe: "o filho do pequeno proprietário escreve, a filha sem
  terra não". A procuração de 1898 mostra que essa leitura estava errada. Seu próprio pai a assinou,
  e também todos os demais homens que a outorgaram — o tio Joaquim e dois cunhados de sua mãe
  —, enquanto todas as mulheres entre os outorgantes — a avó, a mãe e duas tias — não sabiam assinar
  (PRB-0014). Seu avô, o emigrante, não sabia escrever de todo (PRB-0013, PRB-0016). As letras
  entraram em sua família pelos homens da geração de sua mãe e passaram ao largo das mulheres;
  seu analfabetismo é esse padrão, não marca de penúria. Tampouco a alfabetização do marido seguiu
  adiante de forma confiável: nenhum autógrafo é conservado do filho Antenor, cuja escolarização
  não está documentada. [OPEN]


  **4. A ida de seus filhos para a cidade está bem documentada. [INFERRED / CONTEXTUAL]** Dentro
  de uma geração após seu casamento, seus filhos estavam na região metropolitana do Rio de Janeiro:
  Aristides casou-se em São João de Meriti em 1953 (CIV-0058) e morreu em Itaguaí em 1981 (CIV-0059);
  Rozalina morreu em Duque de Caxias em 1983 (CIV-0057); suas irmãs morreram em Niterói (1960)
  e em Mesquita (1975, CIV-0051); e seu filho Antenor morreu em Volta Redonda (2014, CIV-0028),
  então bombeiro hidráulico e não mais lavrador. É o êxodo rural brasileiro numa única família.
  A explicação anterior — de que um lar sem terra "nada perde ao partir" — perdeu a premissa;
  os registros mostram o movimento, não sua causa.


  **5. O arco são duas migrações, não uma queda. [INFERRED]** Não há fortuna perdida atrás de
  Luiza, nem ascensão. Seu avô atravessou de uma freguesia minhota para a fronteira cafeeira da
  Zona da Mata como artesão tornado lavrador (PAR-0108, PRB-0016); seu pai detinha ou lavrava
  terra no Bom Jesus (FAN-0018, contexto); seus filhos foram para a Baixada Fluminense e para
  a cidade siderúrgica de Volta Redonda (CIV-0057, CIV-0058, CIV-0028). Ela está entre as duas
  migrações, a atlântica da família de sua mãe e o êxodo rural de seus filhos, e os recursos da
  família parecem modestos em cada passo.


