notes:
  - text: >-
      Her parents are José Secundino de Azevedo (P-0038) and Thereza Fernandes de
      Azevedo (P-0039) — family F-0018 — named in her 1916 marriage (CIV-0001) and
      in her son Aristides's 1922 baptism (PAR-0003). "Fernandes" is her mother's
      surname and "Secundina/Secundino" her father's; both variants of her own name
      are preserved. The Azevedo family origin is the Muriaé/Carangola region (MG).
