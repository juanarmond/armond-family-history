profile: >-
  ## Interesting facts


  - **[PROVEN]** Her marriage act states her illiteracy: she "não sabe ler nem escrever" and was
  signed for *a rogo* by José Augusto [uncertain: Soares / Tavares] Pinheiro, while her husband
  Deocleciano signed his own name on the same page (CIV-0006). It is now one point in a pattern
  across three generations of the women of her mother's line: in 1898 her grandmother Anna Maria
  signed by proxy and her mother Thereza could not sign, while her father Secundino and her mother's
  brothers-in-law signed the same instrument "por si e suas mulheres por não saberem escrever"
  (PRB-0014). The earlier statement that hers was "the only literacy datum in this whole branch
  of the tree", with no signature from any ancestor behind her, is superseded.

  - **[PROVEN]** Her mother was born in Portugal: Thereza de Jesus, born on 3 May 1864 at the
  lugar do Souto, Pousa, Barcelos, daughter of a tailor, Manoel João Fernandes, and of a foundling
  seamstress, "Anna Exposta" (PAR-0108). On her mother's side, then, Luiza was the Brazilian-born
  child of a Minho emigrant family. [PROVEN — her mother's identification with the Thereza of
  the 1890 will and 1898 inventário is confirmed (PRB-0013, PRB-0014, PAR-0012; see P-0039)]

  - **[INFERRED]** She was born about the year her grandfather died, in the same district. She
  was 18 in October 1916 (CIV-0001), so born about 1898, "nascida e baptizada em Bom Jesus de
  Cachoeira Alegre" (PAR-0012); her grandfather Manoel João Fernandes da Cruz died on 30 May 1898
  in the district of Bom Jesus, and in November 1898 her parents were living there among his heirs
  (PRB-0014).

  - **[PROVEN]** She appears under two true names and one false one. "Luiza Fernandes de Azevedo"
  is the form at her 1916 civil and parish marriage and at her son Antenor's 1949 marriage (CIV-0001,
  PAR-0012, CIV-0004); "Luiza Secundina de Azevedo" at her son Aristides's 1922 baptism (PAR-0003)
  and her daughter Rozalina's 1983 death (CIV-0057). Aristides's 1953 civil marriage miswrites
  her as "Luiza Secundina de Oliveira" (CIV-0058) — a clerical slip for *de Azevedo*, not a third
  surname, and not to be propagated. Both true forms are parental: *Fernandes* is her mother's
  birth surname, from her Portuguese grandfather, and *Secundina* echoes her father José Secundino.

  - **[PROVEN]** Both 1916 acts style her "Dona Luiza Fernandes de Azevedo" — on the same page
  that records she could not write her own name (CIV-0006, PAR-0012) — and her daughter's 1983
  death calls her "dona Luiza Secundina de Azevedo" (CIV-0057). The 1898 inventário likewise gives
  "D." to every woman of her mother's family, none of whom could sign (PRB-0014). The honorific
  was scribal courtesy, not a claim of standing; read it as registry formula, not status. [INFERRED
  — the reading]

  - **[CONTEXTUAL]** She was born at Bom Jesus de Cachoeira Alegre, a rural locality of the São
  Paulo do Muriaé district in the Zona da Mata Mineira coffee belt — a hamlet-level birthplace,
  not a town. Her childhood fell in the decade after abolition (1888), when the region's labour
  system had been remade around sharecropping and casual wage work, and a family of small cultivators
  had little reserve against a bad harvest or a fall in coffee prices.


  ## Identity


  **Luiza Fernandes de Azevedo** [PROVEN] — the form in her 1916 civil marriage (CIV-0001), the
  1916 parish marriage (PAR-0012) and her son Antenor's 1949 marriage (CIV-0004). She also appears
  as **Luiza Secundina de Azevedo** in her son Aristides's 1922 baptism (PAR-0003) and her daughter
  Rozalina's 1983 death (CIV-0057). The "Luiza Secundina de Oliveira" of Aristides's 1953 marriage
  (CIV-0058) is an error. [PROVEN — the readings; the error is INFERRED from every other record]


  - **Relationship:** mother of **Antenor Muniz** (P-0006, 1923–2014), through whom this line
  descends; wife of Deocleciano Muniz Bittencourt (P-0012). [derived from families F-0001, F-0018
  and F-0070]

  - **Birth:** about **1898** (recorded aged 18 in October 1916), at **Bom Jesus de Cachoeira
  Alegre, district of São Paulo do Muriaé, Minas Gerais** [birth year INFERRED from the stated
  age; birthplace PROVEN] — "nascida e baptizada em Bom Jesus de Cachoeira Alegre" (PAR-0012;
  age 18 in CIV-0001). No birth or baptism record is held.

  - **Parents:** **José Secundino de Azevedo** (P-0038) and **Thereza Fernandes de Azevedo** (P-0039)
  [PROVEN] — named in her 1916 civil marriage (CIV-0001, as "Secundino Maria de Azevedo" and "Theresa
  Fernandes de Azevedo"), her 1916 parish marriage (PAR-0012) and her son Aristides's 1922 baptism
  (PAR-0003, giving the fuller "José Secundino"). Her father was already deceased and her mother
  living at Carangola by 1916 (CIV-0006, PAR-0012). The parish act (PAR-0012) resolves the civil
  copy's low-contrast misread of the father's name ("Sebastião", CIV-0006) to Secundino; that
  resolution stands and is not reopened here. In November 1898, about the time of her birth, the
  couple were living in the district of Bom Jesus da Cachoeira Alegre, where her mother was an
  heir of her own father as "D. Thereza de Jesus casada com Secundino de Azevedo" (PRB-0014).
  [PROVEN — the identification set out in P-0039's profile]

  - **Maternal ancestry:** her mother was born on 3 May 1864 at Pousa, Barcelos, Portugal (PAR-0108).
  Her maternal grandparents were **Manoel João Fernandes da Cruz** (P-0139) — baptised at São
  Romão da Ucha in 1833 (PAR-0106), a tailor at Pousa (PAR-0108), later a *lavrador* in Minas
  Gerais (PRB-0016), d. 30 May 1898 in the district of Bom Jesus (PRB-0014) — and **Anna Maria**
  (P-0140), a foundling (PAR-0108, PAR-0107). Her great-grandparents on that side were Bento José
  Fernandes (P-0141) and Joaquina Roza Lopes (P-0142), of Quintã / Quintão, Ucha (PAR-0106). For
  Antenor these are his great-grandparents and 2×-great-grandparents. [PROVEN]

  - **Paternal ancestry:** her father's parents are undocumented. [OPEN]

  - **Marriage:** to **Deocleciano Muniz Bittencourt** (P-0012) at **Carangola, Minas Gerais,
  on 21 October 1916** [PROVEN] — civil (CIV-0001 / CIV-0006) and religious (PAR-0012, Igreja
  de Santa Luzia de Carangola), both spouses single and resident in the district, under the *regime
  de comunhão de bens*. Witnesses at both acts: Justino Ribeiro Rodrigues (44, lavrador) and Antonio
  Theodoro de Souza (30), the same two men who witnessed her sister-in-law Joventina's marriage
  in the same church on the same day (PAR-0013).

  - **Children:** **Antenor Muniz** (P-0006, b. 2 November 1923); **Aristides** (b. 22 July 1922,
  bapt. 20 September 1922, PAR-0003), who married at São João de Meriti, RJ, in 1953 (CIV-0058)
  and died at Itaguaí, RJ, in 1981 (CIV-0059 — a record whose filiation reads "Ignorado", so it
  does not name her); and **Rozalina Bittencourt Alves**, who died at Duque de Caxias, RJ, in
  1983, recorded as the daughter of Deocleciano Muniz Bittencourt and "Luiza Secundina de Azevedo"
  (CIV-0057). [PROVEN] Further children circulate on collaborative trees. [LEAD]

  - **Death:** not documented in this repository; a collaborative-tree lifespan of about 1986
  is a lead only. [OPEN]


  ## Standing and profession


  - **Doméstica** [PROVEN] (CIV-0006) — the standard registry term for a woman working in her
  own or another's household, carrying no wage or property implication.

  - **Illiterate** [PROVEN] — "por aquella não saber ler nem escrever" (CIV-0006); she signed
  by proxy while her husband signed in his own hand.

  - **No property, office, title or trade is attested for her** in any held record. [PROVEN as
  a negative across the held set] The earlier extension of that negative to "her parents' household"
  is withdrawn: her father is named in 1908 as the holder of land bordering a property at Bom
  Jesus (FAN-0018, context, not evidence), and her mother was one of five forced heirs to an estate
  that went to inventário and partilha in 1898 (PRB-0013, PRB-0014). How much of it reached her
  parents is not recorded in the held part of the process. [OPEN]


  ## Family and social network


  Daughter of the **Azevedo** household of the São Paulo do Muriaé / Carangola axis (P-0038 ×
  P-0039, family F-0018), and granddaughter, on her mother's side, of a Portuguese family that
  had settled in the same district: in 1898 her grandmother, her uncle Joaquim José Fernandes
  and her aunts Maria José da Conceição, Maria Fernandes de Souza and Maria de Jesus da Conceição,
  with their husbands, all lived in the district of Bom Jesus da Cachoeira Alegre (PRB-0014).
  [PROVEN] She was born, then, into a cluster of her mother's kin. [INFERRED]


  Two sisters are documented by their own civil deaths: **Alcida Fernandes de Azevedo** (d. 20
  May 1975, Mesquita, RJ — CIV-0051, naming the same mother and a variant of the same father)
  and **Gloria Lacerda de Azevedo** (d. 9 May 1960, Niterói, RJ — óbito nº 26.483, read in the
  retrieval drop but **not yet catalogued as a source in this repository**). Alcida is recorded
  as the widow of a **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; that this Manoel was Deocleciano's
  brother — making two Azevedo sisters the wives of two Muniz Bittencourt brothers — is a research-profile
  reading and remains a **[LEAD]**.


  At her marriage her father was already dead and her widowed mother was living in the same Carangola
  district (CIV-0006, PAR-0012), so the Azevedo women had moved into the district of the Muniz
  Bittencourt household she married into. The 1916 act names no property, but it is no longer
  read as showing a family without any. [INFERRED]


  ## What we can extrapolate


  **1. Her mother's family were Minho emigrants of modest means, not a propertyless floor. [INFERRED]**
  The earlier version of this profile read the Azevedo as holding no capital in any transmissible
  form, so that Brazilian partible succession was "a non-event for this family". The records found
  since overturn that. Her grandfather made a will and his goods went to "inventario e partilha"
  among five heirs, her mother one of them (PRB-0013, PRB-0014); her great-uncle Domingos's estate,
  divided in 1885–86, was worth 5:691$000 (PRB-0016); and her father held or worked land at Bom
  Jesus in 1908 (FAN-0018, context). Partible succession therefore did operate in her family,
  a few months after her birth. What it yielded is unknown: the held part of the 1898 inventário
  breaks off before the goods are described (PRB-0014). [OPEN — the scale] The contrast the earlier
  profile drew with the Azorean side of her husband's tree — impoverished *by* division of the
  Lomba do Botão holding (P-0084) — now reads as a difference of degree rather than of kind. [INFERRED]


  **2. Her marriage joined two families of small cultivators. [INFERRED]** She signs by proxy;
  Deocleciano signs his own name, is recorded *lavrador*, and belongs to the kin-networked Muniz/Brandão
  world of Carangola (CIV-0006). The earlier reading of this as "modest hypergamy" by a propertyless,
  widow-headed household is weakened: her own father held land and her mother's family had an
  estate. The gap between the two families looks smaller than it did. Her mother following her
  into the Carangola district (CIV-0006) still reads as a widow moving towards kin, and if the
  Alcida marriage reading holds [LEAD], the family sent two daughters into the same household.


  **3. Literacy divided her family by sex more than by class. [INFERRED]** The 1916 act puts a
  literate husband and an illiterate wife on one page (CIV-0006), and the earlier profile read
  it as a class line: "the smallholder's son can write, the landless daughter cannot". The 1898
  procuração shows that this reading was wrong. Her own father signed it, and so did every other
  man who granted it — her uncle Joaquim and two of her mother's brothers-in-law — while every
  woman among the grantors — her grandmother, her mother and two of her aunts — could not (PRB-0014).
  Her grandfather, the emigrant, could not write at all (PRB-0013, PRB-0016). Letters entered
  her family through the men of her mother's generation and passed over its women; her illiteracy
  is that pattern, not a mark of destitution. Nor did her husband's literacy reliably carry forward:
  no autograph is held for their son Antenor, whose schooling is undocumented. [OPEN]


  **4. Her children's move to the city is well documented. [INFERRED / CONTEXTUAL]** Within a
  generation of her marriage her children were in the Rio de Janeiro metropolitan area: Aristides
  married at São João de Meriti in 1953 (CIV-0058) and died at Itaguaí in 1981 (CIV-0059); Rozalina
  died at Duque de Caxias in 1983 (CIV-0057); her sisters died at Niterói (1960) and Mesquita
  (1975, CIV-0051); and her son Antenor died at Volta Redonda (2014, CIV-0028), by then a *bombeiro
  hidráulico* rather than a farmer. That is the Brazilian *êxodo rural* in one family. The earlier
  explanation — that a household with no land "loses nothing by leaving" — has lost its premise;
  the records show the move, not its cause.


  **5. The arc is two migrations, not a fall. [INFERRED]** There is no lost fortune behind Luiza,
  and no rise either. Her grandfather crossed from a Minho parish to the Zona da Mata coffee frontier
  as an artisan turned *lavrador* (PAR-0108, PRB-0016); her father held or worked land at Bom
  Jesus (FAN-0018, context); her children moved to the Baixada Fluminense and the steel city of
  Volta Redonda (CIV-0057, CIV-0058, CIV-0028). She stands between the two migrations, the Atlantic
  one of her mother's family and the rural exodus of her children, and the family's means look
  modest at every step.


  ## Open questions


  - **Her own baptism** (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé, about 1898) — would
  give an exact birth date and independently name her parents. If, like her son's 1922 baptism
  (PAR-0003), it names the grandparents, it would also prove her mother's descent from Manoel
  João Fernandes and Anna Maria and name her father's parents, the open gap on the Azevedo side.
  No Muriaé-area church book is on FamilySearch, according to the retrieval research. [OPEN]

  - **Her death record** — undocumented; the collaborative-tree date of about 1986 is a lead only,
  and a death certificate or inventário would also give a record-based count of her children.
  [OPEN]

  - **Her parents' marriage** (before 8 March 1890, probably at São João Batista do Laranjal)
  — see P-0038 and P-0039. [LEAD]


  ## Sources held (this repository)


  - CIV-0001 (1916 civil marriage — age 18, birthplace, parents) · CIV-0006 (full-content 1916
  marriage — doméstica, the stated illiteracy and proxy signature, the witnesses, the father-name
  misread "Sebastião") · PAR-0012 (1916 parish marriage — resolves the father to Secundino; birthplace
  Bom Jesus de Cachoeira Alegre).

  - PAR-0003 (1922 baptism of her son Aristides — the "Luiza Secundina de Azevedo" variant; names
  her parents) · CIV-0004 (1949 marriage of her son Antenor — names her as his mother) · CIV-0028
  (2014 death of her son Antenor — names her again, and documents his move to Volta Redonda).

  - CIV-0057 (1983 death of her daughter Rozalina at Duque de Caxias — names her "Luiza Secundina
  de Azevedo") · CIV-0058 (1953 civil marriage of her son Aristides at São João de Meriti — names
  her, miswritten "Luiza Secundina de Oliveira") · CIV-0059 (1981 death of Aristides at Itaguaí
  — filiation "Ignorado"; it does not name her).

  - CIV-0051 (1975 death of her sister Alcida — a documented collateral child of her parents)
  · REC-0001 (owner's direct-ancestor roster).

  - PAR-0108 (her mother's 1864 baptism at Pousa) · PAR-0106 (her grandfather's 1833 baptism at
  Ucha) · PRB-0013 and PRB-0014 (her grandfather's will, 1890, and inventário, 1898 — her mother
  an heir, her parents resident at Bom Jesus) · FAN-0018 (a 1908 inventário naming her father
  as a land neighbour at Bom Jesus — context, not evidence).

  - CIV-0053 — a granddaughter's civil birth registration (held privately: it concerns a living
  person) names her as the paternal grandmother, "dona Luiza Fernandes de Azevedo", with Deocleciano
  Muniz. Informant-reported; it corroborates Antenor's parentage alongside CIV-0004.


  ## Regional and migration context


  [CONTEXTUAL] Her own documented life is entirely the **Zona da Mata Mineira** — born at Bom
  Jesus de Cachoeira Alegre in the São Paulo do Muriaé district and married at neighbouring Carangola,
  an internal move inside one contiguous coffee micro-region. Her mother's family had reached
  that region from Portugal: from Pousa, Barcelos, where her mother was baptised in 1864 (PAR-0108),
  to São João do Laranjal by 1885 (PRB-0016) and the district of Bom Jesus by 1898 (PRB-0014).
  [PROVEN — the places] Her maternal line is therefore documented in the Minho by baptism, not
  inferred from a surname; her father's Azevedo origin remains undocumented, and no Madeiran,
  Azorean or other Portuguese-island origin is documented for either side — the island thread
  in this line belongs to a Carangola collateral of unproven kinship, not to her ancestors. [OPEN]
  The economy she was born into ran on the post-1850 free-labour transition: the Lei nº 581 de
  1850 (Lei Eusébio de Queirós) ending the Atlantic slave trade, abolition under the Lei Áurea
  (1888), and land placed on a purchase basis by the Lei de Terras (nº 601, 1850). The earlier
  statement that land was "a commodity her family never entered" is superseded: her father held
  or worked land at Bom Jesus by 1908 (FAN-0018). [CONTEXTUAL]


  ## Where to go today


  - **Birth (~1898):** Bom Jesus da Cachoeira, a district of Muriaé, MG — the "Bom Jesus de Cachoeira
  Alegre" of her marriage act, made a district of São Paulo do Muriaé in 1887 and renamed in 1943;
  not the Muriaé town parish, and not the Cachoeira Alegre district of Barão de Monte Alto [APPROX]
  · [Maps](https://www.google.com/maps/search/?api=1&query=Bom%20Jesus%20da%20Cachoeira%2C%20Muria%C3%A9%2C%20MG)

  - **Marriage (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138,
  CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes


  - **[PROVEN]** Seu ato de casamento declara o analfabetismo: ela "não sabe ler nem escrever"
  e foi assinada *a rogo* por José Augusto [incerto: Soares / Tavares] Pinheiro, enquanto o marido
  Deocleciano assinou o próprio nome na mesma página (CIV-0006). Isso é agora um ponto num padrão
  de três gerações das mulheres da linha de sua mãe: em 1898 a avó Anna Maria assinou por procuração
  e a mãe Thereza não sabia assinar, enquanto o pai Secundino e os cunhados de sua mãe assinaram
  o mesmo instrumento "por si e suas mulheres por não saberem escrever" (PRB-0014). Fica superada
  a afirmação anterior de que o dela era "o único dado de alfabetização em todo este ramo da árvore",
  sem assinatura de nenhum ancestral atrás dela.

  - **[PROVEN]** Sua mãe nasceu em Portugal: Thereza de Jesus, nascida em 3 de maio de 1864 no
  lugar do Souto, Pousa, Barcelos, filha de um alfaiate, Manoel João Fernandes, e de uma costureira
  exposta, "Anna Exposta" (PAR-0108). Pelo lado materno, portanto, Luiza era a filha, nascida
  no Brasil, de uma família emigrante minhota. [PROVEN — a identificação de sua mãe com a Thereza
  do testamento de 1890 e do inventário de 1898 está confirmada (PRB-0013, PRB-0014, PAR-0012;
  ver P-0039)]

  - **[INFERRED]** Ela nasceu por volta do ano em que o avô morreu, no mesmo distrito. Tinha 18
  anos em outubro de 1916 (CIV-0001), portanto nasceu por volta de 1898, "nascida e baptizada
  em Bom Jesus de Cachoeira Alegre" (PAR-0012); seu avô Manoel João Fernandes da Cruz morreu em
  30 de maio de 1898 no distrito do Bom Jesus, e em novembro de 1898 seus pais moravam ali entre
  os herdeiros dele (PRB-0014).

  - **[PROVEN]** Ela aparece sob dois nomes verdadeiros e um falso. "Luiza Fernandes de Azevedo"
  é a forma em seu casamento civil e paroquial de 1916 e no casamento de 1949 de seu filho Antenor
  (CIV-0001, PAR-0012, CIV-0004); "Luiza Secundina de Azevedo", no batismo de 1922 de seu filho
  Aristides (PAR-0003) e no óbito de 1983 de sua filha Rozalina (CIV-0057). O casamento civil
  de Aristides, em 1953, grafa-a erroneamente "Luiza Secundina de Oliveira" (CIV-0058) — um lapso
  de escrivão por *de Azevedo*, não um terceiro sobrenome, e que não deve ser propagado. Ambas
  as formas verdadeiras são parentais: *Fernandes* é o sobrenome de nascimento da mãe, vindo do
  avô português, e *Secundina* ecoa o pai José Secundino.

  - **[PROVEN]** Os dois atos de 1916 a tratam por "Dona Luiza Fernandes de Azevedo" — na mesma
  página que registra não saber escrever o próprio nome (CIV-0006, PAR-0012) —, e o óbito de sua
  filha em 1983 a chama "dona Luiza Secundina de Azevedo" (CIV-0057). O inventário de 1898 dá
  igualmente "D." a todas as mulheres da família de sua mãe, nenhuma das quais sabia assinar (PRB-0014).
  O tratamento era cortesia de escrivão, não afirmação de posição; leia-se como fórmula de registro,
  não como status. [INFERRED — a leitura]

  - **[CONTEXTUAL]** Nasceu em Bom Jesus de Cachoeira Alegre, localidade rural do distrito de
  São Paulo do Muriaé, no cinturão cafeeiro da Zona da Mata Mineira — um local de nascimento em
  nível de povoado, não de vila. Sua infância caiu na década seguinte à abolição (1888), quando
  o sistema de trabalho da região havia sido refeito em torno da meação e do trabalho eventual,
  e uma família de pequenos lavradores tinha pouca reserva contra uma colheita ruim ou uma queda
  no preço do café.


  ## Identidade


  **Luiza Fernandes de Azevedo** [PROVEN] — a forma em seu casamento civil de 1916 (CIV-0001),
  no casamento paroquial de 1916 (PAR-0012) e no casamento de 1949 de seu filho Antenor (CIV-0004).
  Também aparece como **Luiza Secundina de Azevedo** no batismo de 1922 de seu filho Aristides
  (PAR-0003) e no óbito de 1983 de sua filha Rozalina (CIV-0057). O "Luiza Secundina de Oliveira"
