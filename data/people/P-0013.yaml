notes:
  - text: >-
      Her parents are José Secundino de Azevedo (P-0038) and Thereza Fernandes de
      Azevedo (P-0039) — family F-0018 — named in her 1916 civil marriage (CIV-0001),
      her 1916 parish marriage (PAR-0012) and her son Aristides's 1922 baptism
      (PAR-0003). "Fernandes" is her mother's surname and "Secundina/Secundino" her
      father's; both variants of her own name are preserved. Her 1916 parish marriage
      records her "nascida e baptizada em Bom Jesus de Cachoeira Alegre" (a district of
      São Paulo do Muriaé, MG — her birthplace, event E-0033). The Azevedo family origin
      is the Muriaé/Carangola region (MG).
    text_pt: >-
      Seus pais são José Secundino de Azevedo (P-0038) e Thereza Fernandes de Azevedo
      (P-0039) — família F-0018 — nomeados em seu casamento civil de 1916 (CIV-0001),
      seu casamento paroquial de 1916 (PAR-0012) e no batismo de 1922 de seu filho
      Aristides (PAR-0003). "Fernandes" é o sobrenome de sua mãe e
      "Secundina/Secundino" o de seu pai; ambas as variantes de seu próprio nome são
      preservadas. Seu casamento paroquial de 1916 a registra como "nascida e baptizada
      em Bom Jesus de Cachoeira Alegre" (um distrito de São Paulo do Muriaé, MG — seu
      local de nascimento, evento E-0033). A origem da família Azevedo é a região de
      Muriaé/Carangola (MG).
