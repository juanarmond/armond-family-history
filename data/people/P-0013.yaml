profile: >-
  ## Interesting facts

  - **[PROVEN]** Hers is the only literacy datum in this whole branch of the tree, and it is a negative one: her 1916 marriage act records that she "não sabe ler nem escrever" and was signed for *a rogo* by José Augusto [uncertain: Soares / Tavares] Pinheiro, while her husband Deocleciano signed his own name on the same page (CIV-0006). Eleven Azevedo, Brandão and Machado ancestors stand behind her and not one of them leaves a signature; Luiza's act is where the silence finally becomes a stated fact.

  - **[PROVEN]** She appears under two names: "Luiza Fernandes de Azevedo" at her 1916 civil and parish marriage and at her son Antenor's 1949 marriage (CIV-0001, PAR-0012, CIV-0004), and "Luiza Secundina de Azevedo" at her son Aristides's 1922 baptism (PAR-0003). Both forms are parental — *Fernandes* from her mother Thereza, *Secundina* from her father José Secundino.

  - **[PROVEN]** Both 1916 acts style her "Dona Luiza Fernandes de Azevedo" — on the same page that records she could not write her own name (CIV-0006, PAR-0012). By 1916 the honorific was scribal courtesy for any bride, not a claim of standing; read it as registry formula, not status. [INFERRED — the reading]

  - **[PROVEN]** At her marriage her father was already dead and her widowed mother was living in the same Carangola district (CIV-0006, PAR-0012). This is the only moment the whole Azevedo household is visible in one document, and what it shows is a widow-and-daughters family with no male head and no property named.

  - **[CONTEXTUAL]** She was born at Bom Jesus de Cachoeira Alegre, a rural locality of the São Paulo do Muriaé district in the Zona da Mata Mineira coffee belt — a hamlet-level birthplace, not a town. Her childhood fell in the decade after abolition (1888), when the region's labour system had been remade around sharecropping and casual wage work and families without land had no buffer at all.

  ## Identity

  **Luiza Fernandes de Azevedo** [PROVEN] — the form in her 1916 civil marriage (CIV-0001), the 1916 parish marriage (PAR-0012) and her son Antenor's 1949 marriage (CIV-0004). She also appears as **Luiza Secundina de Azevedo** in her son Aristides's 1922 baptism (PAR-0003).

  - **Relationship:** mother of **Antenor Muniz** (P-0006, 1923–2014), through whom this line descends; wife of Deocleciano Muniz Bittencourt (P-0012). [derived from families F-0001 and F-0018]

  - **Birth:** about **1898** (recorded aged 18 in October 1916), at **Bom Jesus de Cachoeira Alegre, district of São Paulo do Muriaé, Minas Gerais** [birth year INFERRED from the stated age; birthplace PROVEN] — "nascida e baptizada em Bom Jesus de Cachoeira Alegre" (PAR-0012; age 18 in CIV-0001). No birth or baptism record is held.

  - **Parents:** **José Secundino de Azevedo** (P-0038) and **Thereza Fernandes de Azevedo** (P-0039) [PROVEN] — named in her 1916 civil marriage (CIV-0001, as "Secundino Maria de Azevedo" and "Theresa Fernandes de Azevedo"), her 1916 parish marriage (PAR-0012) and her son Aristides's 1922 baptism (PAR-0003, giving the fuller "José Secundino"). Her father was already deceased and her mother living at Carangola by 1916 (CIV-0006, PAR-0012). The parish act (PAR-0012) resolves the civil copy's low-contrast misread of the father's name ("Sebastião", CIV-0006) to Secundino; that resolution stands and is not reopened here.

  - **Marriage:** to **Deocleciano Muniz Bittencourt** (P-0012) at **Carangola, Minas Gerais, on 21 October 1916** [PROVEN] — civil (CIV-0001 / CIV-0006) and religious (PAR-0012, Igreja de Santa Luzia de Carangola), both spouses single and resident in the district, under the *regime de comunhão de bens*. Witnesses at both acts: Justino Ribeiro Rodrigues (44, lavrador) and Antonio Theodoro de Souza (30), the same two men who witnessed her sister-in-law Joventina's marriage in the same church on the same day (PAR-0013).

  - **Children:** **Antenor Muniz** (P-0006, b. 2 November 1923) and the documented child **Aristides** (b. 22 July 1922, bapt. 20 September 1922, PAR-0003). Further children circulate on collaborative trees [LEAD].

  - **Death:** not documented in this repository; a collaborative-tree lifespan of about 1986 is a lead only. [OPEN]

  ## Standing and profession

  - **Doméstica** [PROVEN] (CIV-0006) — the standard registry term for a woman working in her own or another's household, carrying no wage or property implication.

  - **Illiterate** [PROVEN] — "por aquella não saber ler nem escrever" (CIV-0006); she signed by proxy while her husband signed in his own hand.

  - **No property, office, title or trade is attested for her or for her parents' household** in any held record. [PROVEN as a negative across the held set]

  ## Family and social network

  Daughter of the **Azevedo** family of the São Paulo do Muriaé / Carangola axis (P-0038 × P-0039, family F-0018). Two sisters are documented by their own civil deaths: **Alcida Fernandes de Azevedo** (d. 20 May 1975, Mesquita, RJ — CIV-0051, naming the same mother and a variant of the same father) and **Gloria Lacerda de Azevedo** (d. 9 May 1960, Niterói, RJ — óbito nº 26.483, read in the retrieval drop but **not yet catalogued as a source in this repository**). Alcida is recorded as the widow of a **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; that this Manoel was Deocleciano's brother — making two Azevedo sisters the wives of two Muniz Bittencourt brothers — is a research-profile reading and remains a **[LEAD]**.

  Her widowed mother Thereza was resident at Carangola by 1916 (CIV-0006, PAR-0012), so the Azevedo women had moved into the same district as the Muniz Bittencourt household she married into.

  ## What we can extrapolate

  **1. The Azevedo hold no capital in any transmissible form — and that changes what inheritance means here. [INFERRED / CONTEXTUAL]** Nineteenth-century Brazilian capital came in three shapes: land (heritable), office (contingent on the appointment) and credit or commerce (contingent on the regional economy). Her father's record shows none of the three; his only asset was labour, which transmits nothing but itself. The consequence is easy to miss: **Brazilian partible succession — the rule that split every estate equally among all children and fragmented a holding within two generations — is a non-event for this family.** There was no estate to divide, no quota to spend, no plot to subdivide among siblings. Where the Azorean side of her husband's tree was impoverished *by* division (P-0084's Lomba do Botão holding, split until the great-grandsons had to emigrate), the Azevedo were poor in a different and more absolute way: nothing was diluted because nothing existed to dilute.

  **2. Her marriage is modest hypergamy, and kinship is the substitute for the property the family never had. [INFERRED]** She signs by proxy; Deocleciano signs his own name, is recorded *lavrador*, and belongs to the kin-networked Muniz/Brandão world of Carangola. A widow-headed, propertyless household marrying its daughter into a more-established family is the classic move of people whose only capital is their people — it converts a marriage into security. Her mother following her into the Carangola district is the same logic running a second time, and if the Alcida marriage reading holds [LEAD], the family did it twice in one generation, sending two daughters into the same household.

  **3. Education was purchased, not inherited, and the marriage act photographs the exact price line. [CONTEXTUAL / PROVEN]** There was no free rural schooling to fall back on; literacy in the 1890s Zona da Mata was bought, household by household, and re-bought every generation. The 1916 act puts the two sides of that boundary on one page: the smallholder's son can write, the landless daughter cannot. Her illiteracy is therefore structural rather than personal. Nor did her husband's literacy reliably carry forward — no autograph is held for their son Antenor, whose schooling is undocumented [OPEN]; competence bought for one man's needs is not an inheritance.

  **4. Landlessness made the family mobile, and the mobility is documented. [INFERRED / CONTEXTUAL]** Within a single generation of her marriage the Azevedo daughters are in the Rio de Janeiro metropolitan area — Gloria at Niterói (1960), Alcida in the Baixada Fluminense (1975) — and her own son Antenor died at Volta Redonda (2014, CIV-0028), by then a *bombeiro hidráulico* rather than a farmer. That is the Brazilian *êxodo rural* in one family, and its enabling condition is precisely the poverty: a household with no land loses nothing by leaving. The same propertylessness that makes the Azevedo almost invisible in the archive is what let their descendants move to wage work without a rupture.

  **5. The arc is flat, then urban — not a fall. [INFERRED]** It is worth naming what this line is *not*. There is no lost fortune behind Luiza, no office that stopped paying, no estate fragmented away. From her grandparents' generation to her son's the family sells labour throughout; what changes is only where the labour is sold — a Muriaé roça, then a Carangola district, then a steel city. She is the point where the propertyless Azevedo floor joins a smallholding, kin-anchored Muniz base one rung above it, and her children inherit both: a little land and a lot of relatives on one side, and on the other no cushion at all.

  ## Open questions

  - Her own baptism (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé, about 1898) — would give an exact birth date and independently name her parents. [OPEN]

  - Her death record — undocumented; the collaborative-tree date of about 1986 is a lead only, and a death certificate or inventário would also give a record-based count of her children. [OPEN]

  ## Sources held (this repository)

  - CIV-0001 (1916 civil marriage — age 18, birthplace, parents) · CIV-0006 (full-content 1916 marriage — doméstica, the stated illiteracy and proxy signature, the witnesses, the father-name misread "Sebastião") · PAR-0012 (1916 parish marriage — resolves the father to Secundino; birthplace Bom Jesus de Cachoeira Alegre).

  - PAR-0003 (1922 baptism of her son Aristides — the "Luiza Secundina de Azevedo" variant; names her parents) · CIV-0004 (1949 marriage of her son Antenor — names her as his mother) · CIV-0028 (2014 death of her son Antenor — names her again, and documents his move to Volta Redonda).

  - CIV-0051 (1975 death of her sister Alcida — a documented collateral child of her parents) · REC-0001 (owner's direct-ancestor roster).

  ## Regional and migration context

  [CONTEXTUAL] Her documented world is entirely the **Zona da Mata Mineira** — born at Bom Jesus de Cachoeira Alegre in the São Paulo do Muriaé district and married at neighbouring Carangola, an internal move inside one contiguous coffee micro-region. The economy she was born into ran on the post-1850 free-labour transition: the Lei nº 581 de 1850 (Lei Eusébio de Queirós) ending the Atlantic slave trade, abolition under the Lei Áurea (1888), and land placed on a purchase basis by the Lei de Terras (nº 601, 1850) — a framework that made land a commodity her family never entered. [OPEN] No Madeiran, Azorean or other Portuguese-island origin is documented for the Azevedo; the island thread in this line belongs to a Carangola collateral, not to her ancestors, and no origin is inferred from the surname.

  ## Where to go today

  - **Birth (~1898):** Bom Jesus de Cachoeira Alegre, distrito de Muriaé, MG; sede parish Paróquia São Paulo de Muriaé (Rua Dr Afonso Canedo 47) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Bom%20Jesus%20da%20Cachoeira%2C%20Muria%C3%A9%2C%20MG)

  - **Marriage (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** O dela é o único dado de alfabetização em todo este ramo da árvore, e é negativo: seu ato de casamento de 1916 registra que "não sabe ler nem escrever" e que assinou-se *a rogo* por José Augusto [incerto: Soares / Tavares] Pinheiro, enquanto o marido Deocleciano assinou o próprio nome na mesma página (CIV-0006). Onze ancestrais Azevedo, Brandão e Machado estão atrás dela e nenhum deixa uma assinatura; o ato de Luiza é onde esse silêncio enfim vira fato declarado.

  - **[PROVEN]** Ela aparece sob dois nomes: "Luiza Fernandes de Azevedo" em seu casamento civil e paroquial de 1916 e no casamento de 1949 de seu filho Antenor (CIV-0001, PAR-0012, CIV-0004), e "Luiza Secundina de Azevedo" no batismo de 1922 de seu filho Aristides (PAR-0003). Ambas as formas são parentais — *Fernandes* de sua mãe Thereza, *Secundina* de seu pai José Secundino.

  - **[PROVEN]** Os dois atos de 1916 a tratam por "Dona Luiza Fernandes de Azevedo" — na mesma página que registra não saber escrever o próprio nome (CIV-0006, PAR-0012). Em 1916 o tratamento era cortesia de escrivão para qualquer noiva, não afirmação de posição; leia-se como fórmula de registro, não como status. [INFERRED — a leitura]

  - **[PROVEN]** Ao casar-se, seu pai já era falecido e sua mãe viúva residia no mesmo distrito de Carangola (CIV-0006, PAR-0012). É o único momento em que todo o lar Azevedo aparece num só documento, e o que ele mostra é uma família de viúva e filhas, sem chefe masculino e sem bem algum nomeado.

  - **[CONTEXTUAL]** Nasceu em Bom Jesus de Cachoeira Alegre, localidade rural do distrito de São Paulo do Muriaé, no cinturão cafeeiro da Zona da Mata Mineira — um local de nascimento em nível de povoado, não de vila. Sua infância caiu na década seguinte à abolição (1888), quando o sistema de trabalho da região havia sido refeito em torno da meação e do trabalho eventual, e famílias sem terra não tinham amortecedor algum.

  ## Identidade

  **Luiza Fernandes de Azevedo** [PROVEN] — a forma em seu casamento civil de 1916 (CIV-0001), no casamento paroquial de 1916 (PAR-0012) e no casamento de 1949 de seu filho Antenor (CIV-0004). Também aparece como **Luiza Secundina de Azevedo** no batismo de 1922 de seu filho Aristides (PAR-0003).

  - **Parentesco:** mãe de **Antenor Muniz** (P-0006, 1923–2014), por quem esta linha desce; esposa de Deocleciano Muniz Bittencourt (P-0012). [derivado das famílias F-0001 e F-0018]

  - **Nascimento:** por volta de **1898** (registrada com 18 anos em outubro de 1916), em **Bom Jesus de Cachoeira Alegre, distrito de São Paulo do Muriaé, Minas Gerais** [ano de nascimento INFERRED da idade declarada; local de nascimento PROVEN] — "nascida e baptizada em Bom Jesus de Cachoeira Alegre" (PAR-0012; 18 anos em CIV-0001). Nenhum registro de nascimento ou batismo é conservado.

  - **Pais:** **José Secundino de Azevedo** (P-0038) e **Thereza Fernandes de Azevedo** (P-0039) [PROVEN] — nomeados em seu casamento civil de 1916 (CIV-0001, como "Secundino Maria de Azevedo" e "Theresa Fernandes de Azevedo"), em seu casamento paroquial de 1916 (PAR-0012) e no batismo de 1922 de seu filho Aristides (PAR-0003, com a forma mais completa "José Secundino"). Seu pai já era falecido e sua mãe residia em Carangola em 1916 (CIV-0006, PAR-0012). O ato paroquial (PAR-0012) resolve a leitura equivocada e de baixo contraste do nome do pai na cópia civil ("Sebastião", CIV-0006) para Secundino; essa resolução permanece e não é reaberta aqui.

  - **Casamento:** com **Deocleciano Muniz Bittencourt** (P-0012) em **Carangola, Minas Gerais, em 21 de outubro de 1916** [PROVEN] — civil (CIV-0001 / CIV-0006) e religioso (PAR-0012, Igreja de Santa Luzia de Carangola), ambos solteiros e residentes no distrito, sob o regime de comunhão de bens. Testemunhas nos dois atos: Justino Ribeiro Rodrigues (44 anos, lavrador) e Antonio Theodoro de Souza (30 anos), os mesmos dois homens que testemunharam o casamento de sua cunhada Joventina, na mesma igreja e no mesmo dia (PAR-0013).

  - **Filhos:** **Antenor Muniz** (P-0006, n. 2 de novembro de 1923) e o filho documentado **Aristides** (n. 22 de julho de 1922, bat. 20 de setembro de 1922, PAR-0003). Outros filhos circulam em árvores colaborativas [LEAD].

  - **Óbito:** não documentado neste repositório; uma expectativa de vida de cerca de 1986 em árvore colaborativa é apenas pista. [OPEN]

  ## Posição social e profissão

  - **Doméstica** [PROVEN] (CIV-0006) — o termo padrão de registro para uma mulher que trabalha no próprio lar ou no de outrem, sem implicação de salário ou propriedade.

  - **Analfabeta** [PROVEN] — "por aquella não saber ler nem escrever" (CIV-0006); assinou por procuração enquanto o marido assinou de próprio punho.

  - **Nenhuma propriedade, cargo, título ou ofício lhe é atestado**, nem ao lar de seus pais, em qualquer registro conservado. [PROVEN como negativa no conjunto disponível]

  ## Família e rede social

  Filha da família **Azevedo** do eixo São Paulo do Muriaé / Carangola (P-0038 × P-0039, família F-0018). Duas irmãs estão documentadas por seus próprios óbitos civis: **Alcida Fernandes de Azevedo** (f. 20 de maio de 1975, Mesquita, RJ — CIV-0051, que nomeia a mesma mãe e uma variante do mesmo pai) e **Gloria Lacerda de Azevedo** (f. 9 de maio de 1960, Niterói, RJ — óbito nº 26.483, lido no lote de recuperação, mas **ainda não catalogado como fonte neste repositório**). Alcida é registrada como viúva de um **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; que esse Manoel fosse irmão de Deocleciano — fazendo de duas irmãs Azevedo as esposas de dois irmãos Muniz Bittencourt — é leitura do perfil de pesquisa e permanece **[LEAD]**.

  Sua mãe viúva Thereza residia em Carangola em 1916 (CIV-0006, PAR-0012), de modo que as mulheres Azevedo haviam se mudado para o mesmo distrito da família Muniz Bittencourt com a qual ela se casou.

  ## O que podemos extrapolar

  **1. Os Azevedo não detêm capital em forma transmissível alguma — e isso muda o que a herança significa aqui. [INFERRED / CONTEXTUAL]** O capital brasileiro do século XIX vinha em três formas: terra (herdável), cargo (contingente à nomeação) e crédito ou comércio (contingente à economia regional). O registro de seu pai não mostra nenhuma das três; seu único ativo era o trabalho, que nada transmite além de si. A consequência passa despercebida com facilidade: **a sucessão partível brasileira — a regra que dividia todo espólio igualmente entre todos os filhos e fragmentava uma posse em duas gerações — é um não-evento para esta família.** Não havia espólio a dividir, quota a gastar, gleba a repartir entre irmãos. Onde o lado açoriano da árvore do marido empobreceu *por* divisão (a posse de Lomba do Botão de P-0084, repartida até que os bisnetos tivessem de emigrar), os Azevedo eram pobres de outro modo, mais absoluto: nada foi diluído porque nada existia para diluir.

  **2. Seu casamento é hipergamia modesta, e o parentesco é o substituto da propriedade que a família nunca teve. [INFERRED]** Ela assina por procuração; Deocleciano assina o próprio nome, é registrado *lavrador* e pertence ao mundo Muniz/Brandão de Carangola, tecido por parentesco. Uma casa chefiada por viúva e sem bens que casa a filha em família mais estabelecida é o movimento clássico de quem só tem gente por capital — converte um casamento em segurança. A mãe seguindo-a para o distrito de Carangola é a mesma lógica rodando pela segunda vez, e, se a leitura do casamento de Alcida se sustentar [LEAD], a família o fez duas vezes numa só geração, enviando duas filhas ao mesmo lar.

  **3. A educação era comprada, não herdada, e o ato de casamento fotografa a linha exata desse preço. [CONTEXTUAL / PROVEN]** Não havia escola rural pública a que recorrer; a alfabetização na Zona da Mata dos anos 1890 era comprada, lar por lar, e recomprada a cada geração. O ato de 1916 põe os dois lados dessa fronteira na mesma página: o filho do pequeno proprietário escreve, a filha sem terra não. Seu analfabetismo é, portanto, estrutural, não pessoal. Tampouco a alfabetização do marido seguiu adiante de forma confiável — nenhum autógrafo é conservado do filho Antenor, e sua escolarização não está documentada [OPEN]; a competência comprada para a necessidade de um homem não é herança.

  **4. A ausência de terra tornou a família móvel, e a mobilidade está documentada. [INFERRED / CONTEXTUAL]** Dentro de uma só geração após seu casamento as filhas Azevedo estão na região metropolitana do Rio de Janeiro — Gloria em Niterói (1960), Alcida na Baixada Fluminense (1975) — e seu próprio filho Antenor morreu em Volta Redonda (2014, CIV-0028), então bombeiro hidráulico e não mais lavrador. É o êxodo rural brasileiro numa única família, e sua condição de possibilidade é justamente a pobreza: um lar sem terra nada perde ao partir. A mesma ausência de propriedade que torna os Azevedo quase invisíveis no arquivo é o que permitiu a seus descendentes migrar para o trabalho assalariado sem ruptura.

  **5. O arco é plano e depois urbano — não é uma queda. [INFERRED]** Vale nomear o que esta linha *não* é. Não há fortuna perdida atrás de Luiza, nem cargo que deixou de pagar, nem espólio fragmentado. Da geração de seus avós à de seu filho, a família vende trabalho o tempo todo; o que muda é apenas onde o trabalho é vendido — uma roça de Muriaé, depois um distrito de Carangola, depois uma cidade siderúrgica. Ela é o ponto em que o piso Azevedo sem propriedade se junta a uma base Muniz de pequenos proprietários e parentela, um degrau acima, e seus filhos herdam as duas coisas: um pouco de terra e muitos parentes de um lado, e do outro nenhum colchão.

  ## Questões em aberto

  - Seu próprio batismo (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé, c.1898) — daria data exata de nascimento e nomearia seus pais de forma independente. [OPEN]

  - Seu registro de óbito — não documentado; a data de cerca de 1986 em árvore colaborativa é apenas pista, e uma certidão de óbito ou inventário daria também uma contagem documental de seus filhos. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0001 (casamento civil de 1916 — 18 anos, local de nascimento, pais) · CIV-0006 (casamento de 1916 em inteiro teor — doméstica, o analfabetismo declarado e a assinatura por procuração, as testemunhas, o nome do pai lido erroneamente como "Sebastião") · PAR-0012 (casamento paroquial de 1916 — resolve o pai para Secundino; local de nascimento Bom Jesus de Cachoeira Alegre).

  - PAR-0003 (batismo de 1922 de seu filho Aristides — a variante "Luiza Secundina de Azevedo"; nomeia seus pais) · CIV-0004 (casamento de 1949 de seu filho Antenor — nomeia-a como mãe) · CIV-0028 (óbito de 2014 de seu filho Antenor — nomeia-a novamente e documenta a mudança dele para Volta Redonda).

  - CIV-0051 (óbito de 1975 de sua irmã Alcida — filha colateral documentada de seus pais) · REC-0001 (lista de ancestrais diretos do proprietário).

  ## Contexto regional e migratório

  [CONTEXTUAL] Seu mundo documentado é inteiramente a **Zona da Mata Mineira** — nascida em Bom Jesus de Cachoeira Alegre, no distrito de São Paulo do Muriaé, e casada na vizinha Carangola, uma mudança interna dentro de uma mesma micro-região cafeeira contígua. A economia em que nasceu funcionava sobre a transição para o trabalho livre pós-1850: a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que encerrou o tráfico atlântico, a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850) — um arcabouço que fez da terra uma mercadoria na qual sua família nunca entrou. [OPEN] Nenhuma origem madeirense, açoriana ou de outra ilha portuguesa está documentada para os Azevedo; o fio insular desta linha pertence a uma colateral de Carangola, não a seus ancestrais, e nenhuma origem é inferida do sobrenome.

  ## Onde ir hoje

  - **Nascimento (~1898):** Bom Jesus de Cachoeira Alegre, distrito de Muriaé, MG; paróquia da sede Paróquia São Paulo de Muriaé (Rua Dr Afonso Canedo 47) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Bom%20Jesus%20da%20Cachoeira%2C%20Muria%C3%A9%2C%20MG)

