  ## Contexto regional e migratório


  [CONTEXTUAL] Sua própria vida documentada é inteiramente a **Zona da Mata Mineira** — nascida
  em Bom Jesus de Cachoeira Alegre, no distrito de São Paulo do Muriaé, e casada na vizinha Carangola,
  uma mudança interna dentro de uma mesma micro-região cafeeira contígua. A família de sua mãe
  chegara a essa região vinda de Portugal: de Pousa, Barcelos, onde a mãe foi batizada em 1864
  (PAR-0108), a São João do Laranjal em 1885 (PRB-0016) e ao distrito do Bom Jesus em 1898 (PRB-0014).
  [PROVEN — os lugares] Sua linha materna está, portanto, documentada no Minho por batismo, não
  inferida de um sobrenome; a origem Azevedo de seu pai permanece não documentada, e nenhuma origem
  madeirense, açoriana ou de outra ilha portuguesa está documentada para nenhum dos dois lados
  — o fio insular desta linha pertence a uma colateral de Carangola sem parentesco provado, não
  a seus ancestrais. [OPEN] A economia em que nasceu funcionava sobre a transição para o trabalho
  livre pós-1850: a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que encerrou o tráfico atlântico,
  a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601,
  1850). Fica superada a afirmação anterior de que a terra era "uma mercadoria na qual sua família
  nunca entrou": seu pai detinha ou lavrava terra no Bom Jesus em 1908 (FAN-0018). [CONTEXTUAL]


