notes:
- text: >-
    Mother of Mathilde Maria de Jesus (P-0027); hence great-great-grandmother of
    Eliza Balbina de Toledo (P-0017) on her maternal-paternal line. Named in her
    daughter's 1810 São João del Rei marriage record (PAR-0023) as "Ignez Francisca
    de Lima" and in the 1777 Piracatu baptism of her daughter Maria (PAR-0025) as
    "Ignez Francisca de Lima, natural [d]ora frequesias" — birthplace not clearly
    resolved. Her parents are confirmed by PAR-0025 as João Rodrigues de Mello
    (P-0066, from Viana, Portugal) × Maria Francisca Cordeira (P-0067, from Villa de
    Ouro, Bispado de São Paulo). PAR-0023 states both she and Amaro as "naturais e
    batizados da Freguesia de Barbacena" — see material conflict note in P-0059. Her
    own baptism and death records have not been located.
  text_pt: >-
    Mãe de Mathilde Maria de Jesus (P-0027); portanto, trisavó de Eliza Balbina
    de Toledo (P-0017) em sua linha materna-paterna. Nomeada no registro de
    casamento de 1810 de sua filha em São João del Rei (PAR-0023) como "Ignez
    Francisca de Lima" e no batismo de 1777 de sua filha Maria em Piracatu
    (PAR-0025) como "Ignez Francisca de Lima, natural [d]ora frequesias" — local
    de nascimento não claramente resolvido. Seus pais são confirmados por PAR-0025
    como João Rodrigues de Mello (P-0066, de Viana, Portugal) × Maria Francisca
    Cordeira (P-0067, de Villa de Ouro, Bispado de São Paulo). PAR-0023 declara
    tanto ela quanto Amaro como "naturais e batizados da Freguesia de Barbacena" —
    ver a nota de conflito material em P-0059. Seus próprios registros de batismo
    e óbito não foram localizados.
