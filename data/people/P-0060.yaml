notes:
- text: >-
    Mother of Mathilde Maria de Jesus (P-0027); hence great-great-grandmother of
    Eliza Balbina de Toledo (P-0017) on her maternal-paternal line. Named in her
    daughter's 1810 São João del Rei marriage record (PAR-0023) as "Ignez Francisca
    de Lima" and in the 1777 Piracatu baptism of her daughter Maria (PAR-0025) as
    "Ignez Francisca de Lima, natural [d]ora frequesias" — birthplace not clearly
    resolved. Her parents are confirmed by PAR-0025 as João Rodrigues de Mello
    (P-0066, from Viana, Portugal) × Maria Francisca Cordeira (P-0067, from Villa de
    Ouro, Bispado de São Paulo). PAR-0023 states both she and Amaro as "naturais e
    batizados da Freguesia de Barbacena" — see material conflict note in P-0059. Her
    own baptism and death records have not been located.
