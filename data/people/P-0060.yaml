notes:
- text: >-
    Mother of Mathilde Maria de Jesus (P-0027); hence great-great-grandmother of
    Eliza Balbina de Toledo (P-0017) on her maternal-paternal line. Named in her
    daughter's 1810 São João del Rei marriage record (PAR-0023) as "Ignez Francisca
    de Lima", with both she and her husband Amaro da Silva Xavier (P-0059) identified
    as "naturais e batizados da Freguesia de Barbacena" (born and baptised in
    Barbacena). Her own birth, baptism and death records have not been located.
