profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named as a maternal grandmother in her granddaughter's 1777 Piracatu baptism (PAR-0025) — an unusually informative entry that names all four grandparents at once, fixing her parents, her husband and her stated birth origin in a single document.

  - **[CONTEXTUAL]** Her probable brother, Capitão Manoel Rodrigues de Lima of São João del Rei, called her daughter Mathilde "minha sobrinha" in a certidão preserved inside the 1879 inventário (PRB-0006) and donated the enslaved woman Martinha "para ajuda de seu dote" — a maternal uncle's voice surviving in a probate file a century later.

  - **[INFERRED]** Her father came from Viana and her husband's father from Guimarães — both in the Arcebispado de Braga. Two grandfathers of the same generation, from the single densest Portuguese emigration zone to Brazil, each marrying a colonial-born woman on the frontier.

  - **[INFERRED]** Her origin conflict mirrors her husband's exactly: "natural desta freguezia" of the Paracatú / Manga parish in 1777 (PAR-0025) against "naturais e batizados da Freguesia de Barbacena" in 1810 (PAR-0023). The parallel is itself the argument — two people described identically in both records were most probably frontier-born and only later described as Barbacena natives.

  - **[PROVEN]** Her daughter Mathilde, whose marriage she is named in, ended her life a fazenda owner (PRB-0007, 1862) and signed *a rogo* — unable to write. Property in this house passed to women; letters did not.

  ## Identity

  **Ignez Francisca de Lima** (also Inês) [PROVEN] — mother of Mathilde Maria de Jesus (P-0027), hence great-grandmother of Eliza Balbina de Toledo (P-0017) on her father's maternal line (chain: Eliza < José Cezário de Toledo Lima < Mathilde < Ignez). Wife of Alferes Amaro da Silva Xavier (P-0059), family F-0029; the marriage act is not held.

  - **Origin:** PAR-0025 (1777) reads her "natural desta freguezia" — a native of the Paracatú / Manga parish where the baptism was recorded (the earlier ambiguous "[d]ora frequesias" read is superseded by the 2026-09-10 transcription) [PROVEN reading]; PAR-0023 (1810) instead describes both her and Amaro as "naturais e batizados da Freguesia de Barbacena" — most likely a long-term domicile (see the material conflict on P-0059). [conflict flagged, not resolved]

  - **Parents:** João Rodrigues de Mello (P-0066, of Viana, Arcebispado de Braga, Portugal) × Maria Francisca Cordeira (P-0067, of the Villa de Itu, Bispado de São Paulo — origin re-read "Ytù" on 2026-09-10, superseding the earlier "Ouru [Ouro?]"), confirmed by PAR-0025 (family F-0032). Nationality Brazilian.

  - **Death:** after 1795, her daughter Mathilde's baptism year [INFERRED]; her own baptism and death are not located.

  ## Standing and profession

  - **No occupation is recorded, and none would be expected** for a married woman of her class and century; she appears in every held record as a wife and a mother, never as a party in her own right. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** she is named only in her children's baptisms and her daughter's marriage act. No held record required her to sign, so nothing decides it either way. The comparison is nevertheless pointed: her daughter Mathilde, richer than she ever demonstrably was, is attested illiterate.

  - **Her standing is her family's, and it is real:** wife of an Alferes who became Capitão, sister (probably) of a Capitão, mother of a Capitão, mother of a bride married at the São João del Rei matriz with a Tenente Coronel as witness. [PROVEN for the ranks; the sibling link INFERRED]

  ## Family and social network

  - **Husband:** Alferes Amaro da Silva Xavier (P-0059). **Children:** Maria (baptised 1777, Piracatu), Cezário José da Silva Lima (Furriel 1810, Capitão by 1838), and Mathilde Maria de Jesus (P-0027, our line).

  - **The Lima kin-cluster.** A "Dona Francisca de Lima" appears in the Martinha-donation certidão embedded in Mathilde's 1879 inventário (PRB-0006), where Capitão Manoel Rodrigues de Lima of São João del Rei calls Mathilde "minha sobrinha" and names his sister "Dona Francisca de Lima" — plausibly this Ignez, which would make Manoel her brother. [the certidão PROVEN; the Ignez = "Francisca de Lima" identification INFERRED] A "Dona Anna Francisca de Lima", *solteira*, is godmother at her grandson's 1813 baptism (PAR-0050) — another *de Lima* woman in the same circle. [LEAD]

  - **Her surname is the family's handle, not her father's.** Her father is recorded "Rodrigues de Mello" and her mother "Cordeira", yet she and her probable brother both carry "de Lima" — an adopted or inherited element that became the family's identifying label in the São João del Rei registers, and reappears in her grandson's style "de Toledo **Lima**". [INFERRED]

  ## What we can extrapolate

  - **Her standing was married-in and born-in at once, and neither half was cheap** [INFERRED]. She married an officer on a rising ladder; she came from a family that could style a son Capitão and hand an enslaved person across as a dowry gift. Colonial standing of this kind was assembled from three things at once — rank, kin and transferable property — and her marriage is where two such assemblies joined.

  - **The Lima connection was material, not merely onomastic** [the donation PROVEN; the identification INFERRED]. The same kin-cluster that gives her the surname *endowed the next generation*: her probable brother donated the enslaved woman Martinha into Mathilde's dowry "para ajuda de seu dote" (PRB-0006). That is the mechanism by which her family's standing became her daughter's capital — and it is transferable, heritable capital (people and land), the opposite of the unpaid office-status that the Armond paternal side would later have nothing but.

  - **And then partible inheritance dispersed it** [PROVEN arithmetic / CONTEXTUAL law]. Everything that flowed through this marriage ended in Mathilde's 1879 inventário, which splits the estate among **eight heirs**, one of whose shares was split again among **eight representantes** — roughly one sixty-fourth each at the great-grandchild level. Two generations of equal division is all it took to make a fazenda-scale estate unrecognisable.

  - **Education was never bought for the women of this house** [PROVEN downstream / CONTEXTUAL]. Schooling in the 18th and 19th centuries was a purchased, class-linked privilege, re-bought each generation, and in this family it was bought for the men who needed letters to hold a commission. Her own literacy is unclassifiable; her daughter's illiteracy is explicitly attested in 1870. The wealth rose and the women's letters did not follow it — a stratification by sex, not by class.

  - **Migration, for her, meant the frontier was the starting point rather than the escape** [INFERRED]. Born on the Paracatú / Goiás mining edge (as the 1777 act reads her), she ended a Barbacena matron whose daughter married at the São João del Rei matriz. The family's movement was inward, from the frontier toward settled society, converting frontier-won rank into a marriage among the established.

  - **Her line's arc is upward and she sits at its junction** [INFERRED]. A Minho-born father and an Itu-born mother; a mining-frontier childhood; a militia-officer husband; a daughter who died a landowner. The descent that follows — fragmentation, then urbanisation — is documented on the Toledo and Armond profiles, not hers.

  ## Open questions

  - Her own baptism and marriage, which would resolve the Paracatú-vs-Barbacena origin and primary-confirm her parents. [OPEN] The Paracatú parish books are not on FamilySearch, so the acts are off-tool (Arquivo da Diocese / Arquivo Público de Paracatu). [bounded-negative, 2026-08-13]

  - Primary confirmation that Capitão Manoel Rodrigues de Lima was her brother — the single document that would turn the Lima kin-cluster from an inference into a fact. [OPEN]

  - Where the "de Lima" element came from, given that neither parent carried it. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of her daughter Maria — names her, her stated origin and her parents) · PAR-0023 (1810 marriage of her daughter Mathilde — names her as the bride's mother) · PAR-0026 (1838 baptism of her granddaughter Carolina — "Dona Ignez Francisca de Lima" as paternal grandmother) · PRB-0006 (1879 Mathilde inventário — the Martinha-donation certidão naming "Dona Francisca de Lima" [LEAD], and the heir list that documents the fragmentation).

  - Context, not records about her: PAR-0050 (1813 baptism of her grandson José Cezário) · PRB-0007 (her daughter's 1862 Fazenda da Concórdia purchase).

  ## Regional and migration context

  Frontier-born, most probably in the Paracatú / Manga parish, her family moving on to Barbacena by the 1790s; her parents were a Minho (Viana) immigrant father and a São Paulo / Itu-born mother — the same Goiás / Paracatú-to-Barbacena stream as her husband. [CONTEXTUAL] This branch belongs to the broader 18th-century Minho → colonial São Paulo → Minas/Goiás-frontier current: the Minho was Europe's densest rural minifúndio (~96 inhabitants/km² by 1801) and the single greatest source of Portuguese emigration to Brazil; movement to the goldfields ran under the Provisão de 20 de março de 1720 passport regime, and frontier land under the sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Native parish (per the 1777 act):** Igreja Matriz de Santo Antônio de Paracatu, MG — leading candidate; confirm the exact parish with the arquivo eclesiástico [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Family seat by 1795:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada avó materna no batismo de sua neta no Piracatu em 1777 (PAR-0025) — um assento excepcionalmente informativo, que nomeia os quatro avós de uma só vez e fixa, num único documento, seus pais, seu marido e sua origem declarada.

  - **[CONTEXTUAL]** Seu provável irmão, o Capitão Manoel Rodrigues de Lima, de São João del Rei, chamou a filha dela, Mathilde, de "minha sobrinha" numa certidão preservada dentro do inventário de 1879 (PRB-0006) e doou a mulher escravizada Martinha "para ajuda de seu dote" — a voz de um tio materno sobrevivendo num processo de inventário um século depois.

  - **[INFERRED]** Seu pai veio de Viana e o pai de seu marido, de Guimarães — ambos no Arcebispado de Braga. Dois avôs da mesma geração, vindos da zona de emigração portuguesa mais densa rumo ao Brasil, cada um casado com uma mulher nascida na colônia, na fronteira.

  - **[INFERRED]** Seu conflito de origem espelha exatamente o do marido: "natural desta freguezia", da freguesia de Paracatú / Manga, em 1777 (PAR-0025), contra "naturais e batizados da Freguesia de Barbacena" em 1810 (PAR-0023). O paralelo é o próprio argumento — duas pessoas descritas de modo idêntico nos dois registros provavelmente nasceram na fronteira e só depois foram descritas como naturais de Barbacena.

  - **[PROVEN]** Sua filha Mathilde, em cujo casamento ela é nomeada, terminou a vida proprietária de fazenda (PRB-0007, 1862) e assinou *a rogo* — não sabia escrever. Nesta casa a propriedade passava às mulheres; as letras, não.

  ## Identidade

  **Ignez Francisca de Lima** (também Inês) [PROVEN] — mãe de Mathilde Maria de Jesus (P-0027) e, portanto, bisavó de Eliza Balbina de Toledo (P-0017) na linha materna do pai dela (cadeia: Eliza < José Cezário de Toledo Lima < Mathilde < Ignez). Esposa do Alferes Amaro da Silva Xavier (P-0059), família F-0029; o assento de casamento não está disponível.

  - **Origem:** PAR-0025 (1777) a lê "natural desta freguezia" — natural da freguesia de Paracatú / Manga, onde o batismo foi lavrado (a leitura ambígua anterior, "[d]ora frequesias", está superada pela transcrição de 2026-09-10) [leitura PROVEN]; PAR-0023 (1810), em vez disso, descreve tanto ela quanto Amaro como "naturais e batizados da Freguesia de Barbacena" — mais provavelmente um domicílio de longa data (ver o conflito material em P-0059). [conflito sinalizado, não resolvido]

  - **Pais:** João Rodrigues de Mello (P-0066, de Viana, Arcebispado de Braga, Portugal) × Maria Francisca Cordeira (P-0067, da Villa de Itu, Bispado de São Paulo — origem relida como "Ytù" em 2026-09-10, superando a leitura anterior "Ouru [Ouro?]"), confirmados por PAR-0025 (família F-0032). Nacionalidade brasileira.

  - **Óbito:** depois de 1795, ano do batismo de sua filha Mathilde [INFERRED]; seu batismo e seu óbito não foram localizados.

  ## Posição social e profissão

  - **Nenhuma ocupação é registrada, e nenhuma seria esperada** para uma mulher casada de sua classe e de seu século; ela aparece em todos os registros disponíveis como esposa e mãe, nunca como parte em nome próprio. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** ela é nomeada apenas nos batismos dos filhos e no casamento da filha. Nenhum registro disponível exigiu sua assinatura, de modo que nada decide a questão. A comparação, ainda assim, é eloquente: sua filha Mathilde, comprovadamente mais rica do que ela jamais se demonstrou, está atestada como analfabeta.

  - **Sua posição social é a da família, e é real:** esposa de um Alferes que chegou a Capitão, irmã (provavelmente) de um Capitão, mãe de um Capitão, mãe de uma noiva casada na matriz de São João del Rei com um Tenente Coronel por testemunha. [PROVEN quanto às patentes; o vínculo fraterno INFERRED]

  ## Família e rede social

  - **Marido:** Alferes Amaro da Silva Xavier (P-0059). **Filhos:** Maria (batizada em 1777, Piracatu), Cezário José da Silva Lima (Furriel em 1810, Capitão em 1838) e Mathilde Maria de Jesus (P-0027, nossa linha).

  - **O agrupamento familiar Lima.** Uma "Dona Francisca de Lima" aparece na certidão da doação de Martinha embutida no inventário de Mathilde de 1879 (PRB-0006), em que o Capitão Manoel Rodrigues de Lima, de São João del Rei, chama Mathilde de "minha sobrinha" e nomeia sua irmã "Dona Francisca de Lima" — plausivelmente esta Ignez, o que faria de Manoel seu irmão. [certidão PROVEN; a identificação Ignez = "Francisca de Lima" INFERRED] Uma "Dona Anna Francisca de Lima", *solteira*, é madrinha no batismo de seu neto em 1813 (PAR-0050) — outra mulher *de Lima* no mesmo círculo. [LEAD]

  - **Seu sobrenome é o rótulo da família, não o do pai.** O pai está registrado como "Rodrigues de Mello" e a mãe como "Cordeira"; ainda assim, ela e seu provável irmão carregam "de Lima" — elemento adotado ou herdado que se tornou a marca identificadora da família nos registros de São João del Rei e reaparece no estilo de seu neto, "de Toledo **Lima**". [INFERRED]

  ## O que podemos extrapolar

  - **Sua posição social foi ao mesmo tempo trazida pelo casamento e de nascimento, e nenhuma das metades era barata** [INFERRED]. Casou-se com um oficial em ascensão; veio de uma família capaz de intitular um filho de Capitão e de entregar uma pessoa escravizada como presente de dote. A posição colonial desse tipo se montava com três coisas simultâneas — patente, parentela e propriedade transferível — e seu casamento é onde duas dessas montagens se uniram.

  - **A ligação com os Lima foi material, não apenas onomástica** [doação PROVEN; identificação INFERRED]. O mesmo agrupamento familiar que lhe dá o sobrenome *dotou a geração seguinte*: seu provável irmão doou a mulher escravizada Martinha ao dote de Mathilde, "para ajuda de seu dote" (PRB-0006). É esse o mecanismo pelo qual a posição da família dela virou capital da filha — e é capital transferível e herdável (pessoas e terra), o oposto do status de ofício não remunerado que seria, mais tarde, tudo o que restaria ao lado paterno Armond.

  - **E então a sucessão partível o dispersou** [aritmética PROVEN / lei CONTEXTUAL]. Tudo o que passou por este casamento terminou no inventário de Mathilde de 1879, que divide o espólio entre **oito herdeiros**, tendo a cota de um deles sido novamente repartida entre **oito representantes** — cerca de um sessenta e quatro avos cada, no nível dos bisnetos. Duas gerações de divisão igualitária bastaram para tornar irreconhecível um patrimônio de escala de fazenda.

  - **A educação nunca foi comprada para as mulheres desta casa** [PROVEN a jusante / CONTEXTUAL]. A escolarização, nos séculos XVIII e XIX, era privilégio comprado e ligado à classe, recomprado a cada geração, e nesta família foi comprada para os homens que precisavam de letras para exercer uma patente. Sua própria alfabetização é inclassificável; o analfabetismo da filha está explicitamente atestado em 1870. A riqueza subiu e as letras das mulheres não a acompanharam — estratificação por sexo, não por classe.

  - **Para ela, a migração foi o ponto de partida, não a fuga** [INFERRED]. Nascida na borda mineradora de Paracatú / Goiás (como a lê o ato de 1777), terminou matrona em Barbacena, com uma filha casada na matriz de São João del Rei. O movimento da família foi para dentro, da fronteira rumo à sociedade estabelecida, convertendo patente ganha na fronteira em casamento entre os já estabelecidos.

  - **O arco de sua linha é ascendente e ela está na junção** [INFERRED]. Um pai nascido no Minho e uma mãe nascida em Itu; uma infância na fronteira mineradora; um marido oficial de milícia; uma filha que morreu proprietária. A descida que se segue — fragmentação e depois urbanização — está documentada nos perfis Toledo e Armond, não no dela.

  ## Questões em aberto

  - Seu próprio batismo e casamento, que resolveriam a origem Paracatú vs Barbacena e confirmariam seus pais por fonte primária. [OPEN] Os livros paroquiais de Paracatú não estão no FamilySearch, de modo que os atos ficam fora do alcance da ferramenta (Arquivo da Diocese / Arquivo Público de Paracatu). [negativo delimitado, 2026-08-13]

  - Confirmação primária de que o Capitão Manoel Rodrigues de Lima era seu irmão — o único documento capaz de converter o agrupamento Lima de inferência em fato. [OPEN]

  - De onde veio o elemento "de Lima", já que nenhum dos pais o carregava. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de sua filha Maria no Piracatu, 1777 — nomeia-a, dá sua origem declarada e seus pais) · PAR-0023 (casamento de sua filha Mathilde, 1810 — nomeia-a como mãe da noiva) · PAR-0026 (batismo de sua neta Carolina, 1838 — "Dona Ignez Francisca de Lima" como avó paterna) · PRB-0006 (inventário de Mathilde, 1879 — a certidão da doação de Martinha nomeando "Dona Francisca de Lima" [LEAD] e a lista de herdeiros que documenta a fragmentação).

  - Contexto, não registros sobre ela: PAR-0050 (batismo de seu neto José Cezário, 1813) · PRB-0007 (a compra da Fazenda da Concórdia pela filha, em 1862).

  ## Contexto regional e migratório

  Nascida na fronteira, muito provavelmente na freguesia de Paracatú / Manga, com a família seguindo para Barbacena nos anos 1790; seus pais eram um pai imigrante do Minho (Viana) e uma mãe nascida em São Paulo / Itu — a mesma corrente Goiás / Paracatú rumo a Barbacena do marido. [CONTEXTUAL] Este ramo pertence à corrente maior do século XVIII, Minho → São Paulo colonial → fronteira de Minas/Goiás: o Minho era o minifúndio rural mais denso da Europa (~96 habitantes/km² em 1801) e a maior fonte isolada da emigração portuguesa para o Brasil; o deslocamento para as minas corria sob o regime de passaportes da Provisão de 20 de março de 1720, e a terra de fronteira sob o sistema de sesmarias. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia natal (conforme o ato de 1777):** Igreja Matriz de Santo Antônio de Paracatu, MG — candidata principal; confirmar a freguesia exata junto ao arquivo eclesiástico [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Sede da família em 1795:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
