profile: >-
  ## Identity

  **Ignez Francisca de Lima** (also Inês) [PROVEN] — mother of Mathilde Maria de Jesus
  (P-0027), hence a direct-line ancestor (Eliza Balbina de Toledo's great-grandmother
  on her father's maternal line). Wife of Alferes Amaro da Silva Xavier (P-0059), family F-0029;
  the marriage act is not held.

  - **Origin — unclear:** PAR-0025 (1777) reads her "natural [d]ora frequesias" (not
  cleanly resolved; a retrieval re-read argues "natural desta freguezia", i.e. the Paracatú
  / Manga parish); PAR-0023 (1810) describes both her and Amaro as "naturais e batizados da
  Freguesia de Barbacena" (see the material conflict on P-0059). [conflict flagged]

  - **Parents:** João Rodrigues de Mello (P-0066, of Viana, Arcebispado de Braga, Portugal)
  × Maria Francisca Cordeira (P-0067, of Villa de Ouru [Ouro?], Bispado de São Paulo),
  confirmed by PAR-0025 (family F-0032). Nationality Brazilian.

  - **Death:** after 1795 (Mathilde baptised 1795) [INFERRED]; own records not located.

  - **Literacy — [UNCLASSIFIABLE]:** named only in her children's baptisms and her daughter's
  marriage act, with no signable held record, so her literacy cannot be classified.

  ## Family and social network

  - Husband: Alferes Amaro da Silva Xavier (P-0059). Children: Maria (1777), Cezário José
  da Silva Lima (Capitão), and Mathilde Maria de Jesus (P-0027, our line).

  - A "Dona Francisca de Lima" appears in the Martinha-donation certidão embedded in
  Mathilde's 1879 inventário (PRB-0006), where Capitão Manoel Rodrigues de Lima of São João
  del Rei calls Mathilde "minha sobrinha" and names his sister "Dona Francisca de Lima" —
  plausibly this Ignez, which would make Manoel her brother. [LEAD / INFERRED]

  ## What we can extrapolate

  The "Lima" element tracks a coherent São João del Rei kin-cluster (Ignez Francisca de
  Lima; the probable brother Capitão Manoel Rodrigues de Lima; the "de Toledo Lima" surname
  her grandson José Cezário carried) that intermarried with and endowed the Toledos. Her
  father from Viana pairs with Amaro's father from Guimarães — both of the Braga archdiocese
  — marking this branch as NW-Portuguese immigrant stock settled via São Paulo. [INFERRED]

  - **The Lima connection was material, not merely onomastic** [the donation PROVEN; the Ignez =
  "Francisca de Lima" identification INFERRED]: the same kin-cluster that gives her the surname
  also *endowed the next generation* — her probable brother Capitão Manoel Rodrigues de Lima
  donated the enslaved woman Martinha to Mathilde's dowry, "para ajuda de seu dote" (PRB-0006).
  So Ignez's family standing translated into transferable capital (an enslaved person) flowing
  into the Toledo estate — a concrete instance of the maternal line's wealth being
  heritable/transferable (people and land), in contrast to the Armond side's non-transmissible
  office status.

  ## Open questions

  - Her own baptism/marriage, to resolve the Paracatú-vs-Barbacena origin and
  primary-confirm her parents. [OPEN]

  - Primary confirmation that Capitão Manoel Rodrigues de Lima was her brother. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of daughter Maria — names her and her parents) ·
  PAR-0023 (1810 marriage of daughter Mathilde — names her as the bride's mother) · PAR-0026
  (1838 baptism of granddaughter Carolina — "Dona Ignez Francisca de Lima" as paternal
  grandmother) · PRB-0006 (1879 Matilde inventário — the Martinha-donation certidão naming
  "Dona Francisca de Lima" [LEAD]).

  ## Regional and migration context

  Frontier-born (probably the Paracatú / Manga parish), her family moving on to Barbacena
  by 1795; her parents were a Minho (Viana) immigrant father and a São Paulo / Itu-born
  mother — the same Goiás / Paracatú-to-Barbacena stream as her husband. [CONTEXTUAL] This
  branch belongs to the broader 18th-century Minho → colonial São Paulo → Minas/Goiás-frontier
  stream: the Minho was Europe's densest rural minifúndio (~96 inhabitants/km² by 1801) and the
  single greatest source of Portuguese emigration to Brazil; movement to the goldfields ran under
  the Provisão de 20 de março de 1720 passport regime, and frontier land under the sesmaria
  system. [CONTEXTUAL]

  ## Where to go today

  - **Native parish (1777 baptism):** Igreja Matriz de Santo Antônio de Paracatu, MG — leading candidate; confirm the exact parish with the arquivo eclesiástico [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Family seat by 1795:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Identidade

  **Ignez Francisca de Lima** (também Inês) [PROVEN] — mãe de Mathilde Maria de Jesus
  (P-0027) e, portanto, uma ancestral da linha direta (bisavó de Eliza Balbina de
  Toledo na linha materna de seu pai). Esposa de Alferes Amaro da Silva Xavier (P-0059), família F-0029; o assento de
  casamento não está disponível.

  - **Origem — incerta:** PAR-0025 (1777) a lê "natural [d]ora frequesias" (não claramente
  resolvido; uma nova leitura de recuperação defende "natural desta freguezia", isto é, a
  freguesia de Paracatú / Manga); PAR-0023 (1810) descreve tanto ela quanto Amaro como
  "naturais e batizados da Freguesia de Barbacena" (ver o conflito material em P-0059).
  [conflito sinalizado]

  - **Pais:** João Rodrigues de Mello (P-0066, de Viana, Arcebispado de Braga, Portugal) ×
  Maria Francisca Cordeira (P-0067, de Villa de Ouru [Ouro?], Bispado de São Paulo),
  confirmados por PAR-0025 (família F-0032). Nacionalidade brasileira.

  - **Óbito:** depois de 1795 (Mathilde batizada em 1795) [INFERRED]; registros próprios
  não localizados.

  - **Alfabetização — [UNCLASSIFIABLE]:** nomeada apenas nos batismos de seus filhos e no
  assento de casamento de sua filha, sem nenhum registro assinável disponível, de modo que sua
  alfabetização não pode ser classificada.

  ## Família e rede social

  - Marido: Alferes Amaro da Silva Xavier (P-0059). Filhos: Maria (1777), Cezário José da
  Silva Lima (Capitão) e Mathilde Maria de Jesus (P-0027, nossa linha).

  - Uma "Dona Francisca de Lima" aparece na certidão de doação de Martinha embutida no
  inventário de Mathilde de 1879 (PRB-0006), na qual o Capitão Manoel Rodrigues de Lima, de
  São João del Rei, chama Mathilde de "minha sobrinha" e nomeia sua irmã "Dona Francisca de
  Lima" — plausivelmente esta Ignez, o que faria de Manoel seu irmão. [LEAD / INFERRED]

  ## O que podemos extrapolar

  O elemento "Lima" acompanha um coeso agrupamento de parentes de São João del Rei (Ignez
  Francisca de Lima; o provável irmão Capitão Manoel Rodrigues de Lima; o sobrenome "de
  Toledo Lima" que seu neto José Cezário carregou), que se entrelaçou e dotou os Toledo. Seu
  pai de Viana forma par com o pai de Amaro, de Guimarães — ambos do Arcebispado de Braga —
  marcando este ramo como estirpe imigrante do noroeste de Portugal, estabelecida via São
  Paulo. [INFERRED]

  - **A ligação Lima foi material, não apenas onomástica** [a doação PROVEN; a identificação de
  Ignez = "Francisca de Lima" INFERRED]: o mesmo agrupamento de parentes que lhe dá o sobrenome
  também *dotou a geração seguinte* — seu provável irmão Capitão Manoel Rodrigues de Lima doou a
  mulher escravizada Martinha ao dote de Mathilde, "para ajuda de seu dote" (PRB-0006). Assim, o
  prestígio da família de Ignez se converteu em capital transferível (uma pessoa escravizada) que
  fluiu para o patrimônio Toledo — um exemplo concreto de que a riqueza da linha materna era
  herdável/transferível (pessoas e terra), em contraste com o status de cargo não transmissível
  do lado Armond.

  ## Questões em aberto

  - Seu próprio batismo/casamento, para resolver a origem Paracatú vs Barbacena e confirmar
  por registro primário seus pais. [OPEN]

  - Confirmação primária de que o Capitão Manoel Rodrigues de Lima era seu irmão. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu da filha Maria — a nomeia e a seus pais) ·
  PAR-0023 (casamento de 1810 da filha Mathilde — a nomeia como mãe da noiva) · PAR-0026
  (batismo de 1838 da neta Carolina — "Dona Ignez Francisca de Lima" como avó paterna) ·
  PRB-0006 (inventário de Mathilde de 1879 — a certidão de doação de Martinha nomeando "Dona
  Francisca de Lima" [LEAD]).

  ## Contexto regional e migratório

  Nascida na fronteira (provavelmente a freguesia de Paracatú / Manga), sua família
  seguindo para Barbacena por volta de 1795; seus pais eram um pai imigrante do Minho
  (Viana) e uma mãe nascida em São Paulo / Itu — a mesma corrente de Goiás /
  Paracatú-para-Barbacena de seu marido. [CONTEXTUAL] Este ramo pertence à corrente mais ampla
  do século XVIII, do Minho → São Paulo colonial → fronteira de Minas/Goiás: o Minho era o
  minifúndio rural mais denso da Europa (~96 habitantes/km² por volta de 1801) e a maior fonte
  isolada de emigração portuguesa para o Brasil; o deslocamento para as minas de ouro corria sob
  o regime de passaportes da Provisão de 20 de março de 1720, e a terra de fronteira sob o
  sistema de sesmarias. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia de origem (batismo de 1777):** Igreja Matriz de Santo Antônio de Paracatu, MG — candidata principal; confirmar a paróquia exata no arquivo eclesiástico [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Sede da família por volta de 1795:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
