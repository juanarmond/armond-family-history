- text: Ahnentafel position 17.
  text_pt: Posição 17 no Ahnentafel.
- text: >-
    PARENTAGE CONFIRMED (7 August 2026, PRB-0006 Film 2 triage): Eliza is a daughter
    of José Cezário de Toledo Lima (P-0054) and Claudina Brandina de Jesus (P-0055),
    family F-0026. Evidence: the 1879 Matilde inventário (PRB-0006), Film 2 triage,
    lists her as representante #5 under heir #4 (JC × Claudina). Per 19th-century
    Brazilian inheritance law, a married woman appeared through her husband as legal
    representative; item 5 reads "5º Simplicio José Ferreira Armond, cazado com D.
    Eliza Balbina de Tolledo" — Simplício is named first as her legal actor, Eliza is
    the heir. A prior session (7 August 2026) misread this as Simplício being JC's son
    and removed Eliza from F-0026; that correction was itself erroneous and is reversed.
    The "Simplício José Ferreira de Toledo, solteiro, 14 anos" in the 1867 inventários
    (PRB-0008 item 6; PRB-0009 item 6) is JC's OWN SON with the Toledo surname — a
    DIFFERENT person from our Simplício Armond who has the Armond surname.
  text_pt: >-
    FILIAÇÃO CONFIRMADA (7 de agosto de 2026, triagem do Filme 2 do PRB-0006): Eliza
    é filha de José Cezário de Toledo Lima (P-0054) e Claudina Brandina de Jesus
    (P-0055), família F-0026. Evidência: o inventário de Matilde de 1879 (PRB-0006),
    triagem do Filme 2, a lista como representante nº 5 sob o herdeiro nº 4 (JC ×
    Claudina). Pela lei de herança brasileira do século XIX, uma mulher casada
    comparecia por meio de seu marido como representante legal; o item 5 diz "5º
    Simplicio José Ferreira Armond, cazado com D. Eliza Balbina de Tolledo" —
    Simplício é nomeado primeiro como seu representante legal, Eliza é a herdeira. Uma
    sessão anterior (7 de agosto de 2026) interpretou isso erroneamente como se
    Simplício fosse filho de JC e removeu Eliza de F-0026; essa correção era ela
    própria equivocada e foi revertida. O "Simplício José Ferreira de Toledo, solteiro,
    14 anos" dos inventários de 1867 (PRB-0008 item 6; PRB-0009 item 6) é o PRÓPRIO
    FILHO de JC, com o sobrenome Toledo — uma pessoa DIFERENTE do nosso Simplício
    Armond, que tem o sobrenome Armond.
- text: >-
    Recorded three ways: "Eliza Ferreira Armand" (Aristão's 1957 death, CIV-0005),
    "Eliza Ferreira Toledo" (Marfiza's 1962 death, CIV-0013) and "Eliza Balbina de
    Toledo" (the 1881 Toledo heir list PRB-0001, as Simplício's wife). All give her
    the Toledo maiden surname and the owner confirms they are the same woman; the
    married and maiden forms are both preserved.
  text_pt: >-
    Registrada de três formas: "Eliza Ferreira Armand" (óbito de 1957 de Aristão,
    CIV-0005), "Eliza Ferreira Toledo" (óbito de 1962 de Marfiza, CIV-0013) e "Eliza
    Balbina de Toledo" (a lista de herdeiros Toledo de 1881, PRB-0001, como esposa de
    Simplício). Todas lhe atribuem o sobrenome de solteira Toledo e o proprietário
    confirma que se trata da mesma mulher; tanto a forma de casada quanto a de solteira
    são preservadas.
- text: >-
    Namesake caution (do NOT treat as a variant of Eliza): the 13 November 1880
    citation audience in the Ladisláo Toledo estate names "Simplicio José Ferreira
    Armond e sua mulher Maria Dulcelina de Toledo" — a scribe's slip substituting the
    name of Eliza's sister Maria Dulcelina de Toledo (a documented child on F-0026)
    for Eliza. It does not indicate a second wife of Simplício.
  text_pt: >-
    Cuidado com homônimo (NÃO tratar como variante de Eliza): a audiência de citação de
    13 de novembro de 1880 no inventário de Ladisláo Toledo nomeia "Simplicio José
    Ferreira Armond e sua mulher Maria Dulcelina de Toledo" — um lapso do escrivão que
    substituiu Eliza pelo nome de sua irmã Maria Dulcelina de Toledo (uma filha
    documentada em F-0026). Isso não indica uma segunda esposa de Simplício.
