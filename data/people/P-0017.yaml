- text: >-
    Aristão's 1957 death (CIV-0005) records "Eliza Ferreira Armand"; her daughter
    Marfiza's 1962 death (CIV-0013) records "Eliza Ferreira Toledo", giving her
    Toledo maiden surname. The owner confirms these refer to the same woman, so
    both forms are preserved. "Eliza Balbina de Toledo" remains a fuller,
    still-uncatalogued lead.
