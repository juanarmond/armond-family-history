profile: >-
  ## Interesting facts

  - **[PROVEN]** Her father José Cezário's 1867 fazenda (PRB-0008) included ten enslaved people — Lucas, Pedro and Luiza ("de nação", African-born) and seven crioulo/a individuals — appraised at roughly 800$000 to 1:700$000 each, alongside ~32,000 coffee plants. She was born into a working slaveholding coffee estate; the Lei Áurea abolishing slavery came more than a decade after her birth.

  - **[PROVEN]** She was a named heir in her grandmother Mathilde's 1879 Leopoldina estate (PRB-0006), inheriting in her own right — appearing as representante #5 under José Cezário × Claudina. Under 19th-century Brazilian inheritance law, her husband Simplício appeared as her legal representative, not the heir; Eliza was the actual heir.

  - **[INFERRED]** She is the reason this family has any documented ancestry beyond Simplício: the Armond side dead-ends at Simplício's unknown parents; every documented ancestor before him enters through Eliza's Toledo line, running back through probate records to the 1850s Concórdia land grants.

  - **[PROVEN]** Part of the Concórdia was sold out of the Toledo family in 1877 (PRB-0003): a set of her co-heirs sold their shares held "em commum" to Capitão Antonio Belizandro dos Reis Meirelles, several of them signing from São João del-Rei and Rio de Janeiro. Eliza is not named among those sellers, and her own share was still being paid out through her husband on a folio dated c.1919 (PRB-0011) — her portion stayed locked in an undivided estate for another forty years.

  - **[CONTEXTUAL]** The Zona da Mata coffee boom that made her family's wealth was already passing its peak at the time of her 1879 inheritance: the Lei Áurea (1888) would end the enslaved-labour system on which the fazendas depended, and global overproduction was beginning to erode coffee prices. The landed wealth she inherited was real but fragile.

  - **[INFERRED]** She is recorded under four different name forms across six documents — Eliza Balbina de Toledo, Eliza Balbina de Tolledo, Elisa Balbina de Jesus, Eliza Ferreira Armand, Eliza Ferreira Toledo — reflecting both the married/maiden name conventions of 19th-century Brazil and clerks' varying interpretations of the same woman across sixty years of records.

  ## Identity

  Recorded under both her Toledo maiden name and her Armond married name. In her
  father's estate she is **Eliza Balbina de Toledo / Tolledo** (the 1879 Matilde
  inventário, PRB-0006; the 1881 heir list, PRB-0001) [PROVEN]; on her daughter
  Aristides's 1894 marriage she carries her mother's surname as **Elisa Balbina de
  Jesus** (CIV-0023) [PROVEN]; and on her children's mid-20th-century civil deaths as
  **Eliza Ferreira Armand** (Aristão's 1957 death, CIV-0005) and **Eliza Ferreira
  Toledo** (Marfiza's 1962 death, CIV-0013). All are the same woman; the married and
  maiden forms are both preserved.

  - **Parents:** José Cezário de Toledo Lima (P-0054) × Claudina Brandina de Jesus
  (P-0055), family F-0026 [PROVEN] — the 1879 Matilde inventário (PRB-0006) places her
  as representante #5 under heir #4 (JC × Claudina): "5º Simplicio José Ferreira Armond,
  cazado com D. Eliza Balbina de Tolledo." Under 19th-century Brazilian inheritance law
  a married woman appeared through her husband, so Simplício is named first as her legal
  representative; Eliza is the heir.

  - **Not to be confused with her brother:** the two 1867 inventários (PRB-0008 item 6;
  PRB-0009 item 6) list a "Simplício José Ferreira de Toledo, solteiro, 14 annos" — this
  is Eliza's OWN BROTHER, José Cezário's son with the Toledo surname (d. before 1879), a
  DIFFERENT man from her husband Simplício José Ferreira Armond (P-0016), who carries the
  Armond surname [PROVEN].

  - **Birth:** c.1850–1855 [INFERRED] — no baptism located; she was already bearing
  children by the early 1870s (Marfiza b.~1873, CIV-0013; Aristides b.~1875, CIV-0023).

  - **Marriage:** married Simplício José Ferreira Armond (P-0016), family F-0006,
  c.1868–1872, at Bom Jesus do Rio Pardo (Argirita) [LEAD] — the marriage act, which
  would also name Simplício's parents, is not held; the union itself is proven by every
  downstream record that names her as his wife.

  - **Children:** Aristão Ferreira Armond (P-0008, b.~1879, d.1957, CIV-0005); Marfiza
  Ferreira Armond (b.~1873, d.1962, CIV-0013); and Aristides Ferreira Armand (a daughter,
  b.~1875 at Rio Pardo da Leopoldina, m. João Rodrigues Braga 1894, CIV-0023) [PROVEN].
  FamilySearch-tree profiles add further children (e.g. Júlia) as unverified leads [LEAD].

  - **Death:** exact date and place not found, but she was already deceased by 1 November
  1957 — Aristão's death register (CIV-0005) records both his parents as "falecido /
  falecida" [PROVEN]. Her being named as a parent on Marfiza's 1962 death (CIV-0013) is
  standard practice and does not imply she was then living.

  ## Standing and profession

  - **A numbered heir in a substantial landed Toledo estate** [PROVEN] — in her
  grandmother D. Mathilde Maria de Jesus's 1879 Leopoldina inventário (PRB-0006) Eliza is
  representante #5, inheriting in her own right; her husband Simplício appears only as her
  legal representative. The companion 1881 heir list (PRB-0001) and Simplício's 1884
  petition to complete the partition (PRB-0002, in his own hand, "herdeiro da finada D.
  Mathilde Maria de Jezus") document the same estate.

  - **Born into the landed Toledo clan of the Fazenda da Concórdia** (Rio Pardo, Villa
  Leopoldina) [PROVEN] — her father José Cezário de Toledo Lima registered Concórdia land
  in 1856 (GOV-0003) and the Toledo grandchildren sold their inherited Concórdia shares in
  1877 (PRB-0003); a further undated Concórdia / Ribeirão de São Bento deed (PRB-0004)
  traces the same holding through her grandparents.

  - **Her father's now fully-catalogued 1867 estate shows the slaveholding coffee
  household she was born into** [PROVEN] — José Cezário's Concórdia inventário (PRB-0008),
  whose avaliação folios were catalogued on 2 September 2026, appraises a working coffee
  fazenda: coffee groves totalling roughly 32,000 pés, a casa de morada, paiol, engenho
  and a roadside casa de negócio, livestock, and **ten enslaved people** held as the
  estate's largest single asset — Lucas, Pedro and Luiza (recorded "de nação",
  African-born) and Miguel, Thobias, Benedicto, Faustina, Virgiliana, Joana and Eugênio
  ("crioulo/a", Brazil-born), named here as the record names them and appraised at roughly
  800$000 to 1:700$000 each — against a hypothecary debt of 3:885$000 owed since 1859 to
  Leocádio de Toledo. The held folios carry the appraisal but **no partilha / monte-mór
  folio**, so her legítima paterna is not adjudicated in this record; her documented heir's
  quota falls in the later 1879 Matilde partition (PRB-0006).

  - **No occupation or office of her own is documented** [CONTEXTUAL] — expected for a
  woman of her time and class; her standing is expressed through inheritance and through
  her husband's public roles (court arbitrador / curador and, in 1902, 3rd substitute
  police delegate of São Paulo do Muriaé, NWS-0003).

  ## Family and social network

  She is the **Toledo → Armond hinge**: by marrying the Armond Simplício she carried into
  the Armond line the primary-documented Toledo ancestry. Her parents were José Cezário ×
  Claudina (F-0026); her paternal grandparents were **Ladisláo Egídio Ferreira de Toledo
  (P-0056) × Mathilde Maria de Jesus (P-0027)**, whose 1879 estate she inherited (PRB-0006)
  and whose Concórdia land the family had held since at least 1856 (GOV-0003, PRB-0003,
  PRB-0004) [PROVEN].

  Her **maternal surname "de Jesus"** (from Claudina Brandina de Jesus) explains why she is
  recorded as "Elisa Balbina de Jesus" on her daughter's 1894 marriage (CIV-0023) [PROVEN].

  Her **siblings** (children of José Cezário × Claudina, F-0026) named in the 1879
  inventário (PRB-0006) include Maria Dulcelina de Toledo, Mathildes Olympia da Paixão,
  Josephina Christina da Silva Lima, Maria Bulandina de Toledo (m. Manoel Marques Jorge),
  Ladisláo Egydio Ferreira de Toledo, Geraldo Augusto de Toledo Lima and Josepha Olympia
  da Paixão; the 1867 inventários (PRB-0008, PRB-0009) add her brother Simplício José
  Ferreira de Toledo (the namesake above) and place her father's death at ~2 September 1866
  [PROVEN].

  - **Namesake caution:** a citation audience of 13 November 1880 in the Ladisláo Toledo
  estate proceedings names "Simplicio José Ferreira Armond e sua mulher Maria Dulcelina de
  Toledo" — a scribe's slip substituting the name of Eliza's sister Maria Dulcelina for
  Eliza. It does NOT indicate a second wife of Simplício [PROVEN — flagged in this
  repository].

  ## What we can extrapolate

  Eliza is the hinge on which this family's documented depth and its landed past both turn. She
  carried into the Armond line the only heritable capital it ever touched — and the held records
  show that capital arriving encumbered, undivided, slow and, in the end, small. [INFERRED]

  - **She is why this line has any deep tree at all** [INFERRED]. The Armond side dead-ends at
  Simplício, whose parents are unknown (P-0016); every documented ancestor before him enters
  through Eliza's Toledo line and runs back through the probate and land records to the 1850s
  Concórdia. The family's paper ancestry is maternal.

  - **The landed base she was born into was real, but shared and leveraged from the start**
  [PROVEN records; INFERRED reading]. The Fazenda da Concórdia is declared in 1856 by her father
  José Cesário de Toledo Lima as a 200-alqueire holding "por minha Mãe, irmãos e cunhados" —
  registered for his mother, siblings and brothers-in-law together (GOV-0003), an undivided family
  commons rather than one man's estate. His own 1867 inventário (PRB-0008) shows what that commons
  produced: coffee groves of roughly 32,000 pés, a casa de morada, paiol and engenho, a roadside
  casa de negócio, livestock — and, as its single largest asset, ten enslaved people, Lucas, Pedro
  and Luiza (recorded "de nação") and Miguel, Thobias, Benedicto, Faustina, Virgiliana, Joana and
  Eugênio ("crioulo/a"), appraised at roughly 800$000 to 1:700$000 each. Against that stood a
  hypothecary debt of 3:885$000, running since 1859 and owed to Francisco Leocádio de Toledo,
  himself a declared co-possessor of the same fazenda (GOV-0003). Her class position was genuinely
  proprietary; it was also held in common with cousins and mortgaged inside the family.

  - **Her inheritance was heritable in kind but contingent in practice** [PROVEN documents;
  INFERRED reading]. Unlike her husband's offices, land and enslaved labour were capital that
  could in principle pass to children — that is the structural difference between the two lines
  that met in her marriage. But three things emptied it before it reached hers. Partible
  succession divided it: her grandmother Mathilde's estate is an heir list of "Primeiros Nettos"
  (PRB-0001), each entitled to an equal slice of the same commons. Liquidation began early: in 1877
  a set of Toledo grandchildren sold "duas sortes de terras de cultura em commum na Fazenda da
  Concordia" to Capitão Antonio Belizandro dos Reis Meirelles, several signing from São João
  del-Rei and Rio de Janeiro (PRB-0003) — Eliza is not named among those sellers, so her share
  appears to have stayed in the undivided estate. And abolition removed the rest: the estates were
  still unpartitioned in 1888, so whatever enslaved people they counted as assets — the woman
  Martinha in Mathilde's (PRB-0006), ten in her father's (PRB-0008) — ceased to be property while
  the heirs waited.

  - **What finally reached her household, in figures** [PROVEN]. The payment folio dated c.1919 by
  the retrieval agent (PRB-0011) allots her share, through her husband and expressly "casado com
  Dona Eliza Balbina de Tollêdo", as value fractions rather than property: 72$910 in the casa de
  morada, 9$113 in the paiol, 3$645 in the moinho, 14$582 in the halves of the engenho and
  ventilador, 51$037 in 3,388 ares of matta virgem, and a worn capoeira figure read as either
  50$546 or 508$546 [uncertain], with at least one further tract off-page. On the family's own
  benchmark — an enslaved person in her father's estate appraised at 800$000 to 1:700$000
  (PRB-0008) — her documented inheritance, even read at its highest, comes to less than the
  cheapest single person that estate had held, and the comparison is nominal, so the real gap is
  wider still. [PROVEN figures; the benchmark comparison INFERRED and nominal]

  - **And it arrived roughly forty years late** [PROVEN]. Her grandmother died about 1880; her
  husband was still petitioning in 1884 to force the partition, recording in his own hand that
  co-heirs of this propertied family were "em estado de indigencia" while they waited (PRB-0002);
  the payment folio is c.1919. Capital locked in probate for four decades funds no schooling, no
  land purchase and no start in life for the children who needed it. The generation that should
  have been endowed by it — Marfiza, Aristão, Aristides — had already made their own marriages and
  livings by the time it was paid. [PROVEN documents; consequence INFERRED]

  - **The fragmentation was visible in the heir list itself** [PROVEN; reading INFERRED]. The same
  1881 folio that names Eliza records her 15-year-old co-heir Geraldo Augusto de Toledo Lima as
  "rezidente na côrte, empregado em uma caza de negocio" on the Rua do Visconde de Inhaúma
  (PRB-0001). A landed family that places a boy heir behind a Rio shop counter is a family whose
  land can no longer absorb its own children — the urban move the Armonds made two generations
  later had already begun among her Toledo cousins.

  - **Her marriage was a match between peers, but not between fortunes** [INFERRED]. An Armond
  marrying a numbered Toledo heir of the Concórdia is not a marginal alliance, and it supports
  reading the Armonds as established locally. What crossed in that marriage, though, was status on
  both sides: his offices paid nothing (see P-0016) and her land arrived late, shared and reduced.
  Both lines fed cash and standing, not a working estate, into their children's generation.

  - **Her property produced a paper trail in her husband's name** [PROVEN; reading CONTEXTUAL].
  Nineteenth-century practice made the husband the legal actor for a married woman's inheritance,
  so Eliza — the actual heir — appears as an entry beneath Simplício's name in 1879 (PRB-0006), in
  1881 (PRB-0001), in his 1884 petition (PRB-0002) and in the c.1919 payment folio (PRB-0011). No
  held record carries her signature; at her daughter's 1894 wedding, celebrated in her own house,
  the signatories are her husband, the bride, the officials and the witnesses, and she is named only
  as a resident parent (CIV-0023). Her literacy is therefore untestable from what we hold — the
  expected footprint of a married woman whose legal acts were performed for her, not evidence that
  she could not write. It is also why her name is unstable across the archive: the clerks recorded
  whichever surname the occasion called for.

  - **She is the junction of two opposite trajectories** [INFERRED / CONTEXTUAL]. The landed,
  slaveholding maternal Toledo line — heritable capital, but common, mortgaged, fragmented and
  finally overtaken by abolition — meets the office-and-status paternal Armond line, which was
  self-made, married-in, and carried no heritable capital at all. One generation on, her son
  Aristão was a padeiro in Rio de Janeiro state (CIV-0005) and her grandson Geraldo a padeiro in
  Volta Redonda (CIV-0002). Eliza is the point where the maternal land wealth is spent funding that
  transition rather than arresting it.

  ## Open questions

  - **Her death date and place** [OPEN] — proven deceased by 1957 (CIV-0005), but her
  óbito is unlocated.

  - **Her own baptism / birth record** [OPEN] — not found; would pin her exact birth year.
  With the 1867 inventário now read in full (PRB-0008), she is not named among the visible
  children (pp. 6–9), so she is likely the uncatalogued item 5 on p7.

  - **Her marriage to Simplício** (c.1868–72, Argirita) [OPEN] — the same off-tool record
  that would finally name Simplício's parents.

  - **Additional children** attributed on collaborative trees (Júlia and others) [LEAD] —
  unverified against a held record.

  ## Sources held (this repository)

  - PRB-0006 (1879 Matilde inventário — Eliza as representante #5 under heir #4 José
  Cezário × Claudina; the parentage proof) · PRB-0001 (1881 Toledo heir list — "cazado
  com D. Eliza Balbina de Tolledo") · PRB-0002 (1884 petition of Simplício as heir of D.
  Mathilde Maria de Jezus) · PRB-0011 (c.1919 Leopoldina Toledo partilha — a fazenda share
  paid to her heir Simplício as her husband).

  - PRB-0008 / PRB-0009 (1867 Concórdia inventários of her father José Cezário and her
  grandfather Ladisláo — her siblings, her father's ~1866 death, the brother Simplício de
  Toledo namesake, and, from the avaliação folios catalogued 2026-09-02, her father's
  slaveholding coffee fazenda: ten enslaved people, the coffee groves and buildings, and a
  3:885$000 debt) · PRB-0003 / PRB-0004 (1877 and undated Concórdia deeds — the
  family's landholding through her grandmother Mathilde).

  - GOV-0003 (1856 Rio Pardo land registry — her father's Concórdia holding) · CIV-0023
  (1894 marriage of her daughter Aristides — "Elisa Balbina de Jesus") · CIV-0005
  (Aristão's 1957 death — "Eliza Ferreira Armand", both parents deceased) · CIV-0013
  (Marfiza's 1962 death — "Eliza Ferreira Toledo").

  - NWS-0003 (1902 O Pharol — her husband Simplício as 3rd substitute delegate of Muriaé;
  context for the couple's later years).

  ## Regional and migration context

  Her whole recorded life sits in the **Zona da Mata Mineira** — born and raised in the
  Rio Pardo / Leopoldina district, into the landed Toledo clan of the **Fazenda da
  Concórdia**, and married at **Bom Jesus do Rio Pardo (Argirita)** [LEAD for the exact
  place]; her children were born at Rio Pardo da Leopoldina (CIV-0023). No move out of the
  Mata is documented for her [CONTEXTUAL]. Her Toledo forebears had come down from the
  Barbacena / São João del-Rei highlands into the once Crown-forbidden eastern forest as
  the 19th-century coffee frontier opened — a highland origin that the held records touch
  only at the edges (PRB-0003 places some Toledo relatives resident at São João del-Rei)
  and that remains, above her grandparents, a [LEAD]. The deep "Toledo / Barbacena /
  Sephardic" ancestry asserted on collaborative trees is not supported by any source held
  here [LEAD].

  ## Where to go today

  - **Marriage (~1868–72):** Matriz do Senhor Bom Jesus, Argirita, MG (historically Bom
  Jesus do Rio Pardo) — Rua Catulino Vasconcelos 204, Centro [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=-21.61000,-42.83583)

  - **Born and raised:** the Toledo Fazenda da Concórdia, distrito de Tebas (Leopoldina),
  MG [APPROX] — still remembered locally; go to Tebas and ask ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **1879 inventário heir (in her own right):** Catedral de São Sebastião and Fórum da
  Comarca de Leopoldina, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20de%20Sao%20Sebastiao%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** A fazenda de 1867 de seu pai José Cezário (PRB-0008) incluía dez pessoas escravizadas — Lucas, Pedro e Luiza ("de nação", nascidos na África) e sete crioulos/crioulas — avaliadas em cerca de 800$000 a 1:700$000 cada uma, ao lado de aproximadamente 32.000 pés de café. Ela nasceu numa fazenda de café escravista em plena atividade; a Lei Áurea, que aboliu a escravidão, viria mais de uma década após seu nascimento.

  - **[PROVEN]** Era herdeira nomeada no inventário de sua avó Mathilde de 1879 em Leopoldina (PRB-0006), herdando por direito próprio — aparecendo como representante nº 5 sob José Cezário × Claudina. Pela lei de herança brasileira do século XIX, seu marido Simplício comparecia como seu representante legal, não como o herdeiro; Eliza era a herdeira real.

  - **[INFERRED]** Ela é a razão de esta família ter qualquer ascendência documentada além de Simplício: o lado Armond termina nos pais desconhecidos de Simplício; todo ancestral documentado antes dele entra pela linha Toledo de Eliza, recuando por registros de inventário até as concessões de terra da Concórdia na década de 1850.

  - **[PROVEN]** Parte da Concórdia foi vendida para fora da família Toledo em 1877 (PRB-0003): um conjunto de seus coerdeiros vendeu as quotas que detinham "em commum" ao Capitão Antonio Belizandro dos Reis Meirelles, vários deles assinando de São João del-Rei e do Rio de Janeiro. Eliza não é nomeada entre esses vendedores, e sua própria quota ainda estava sendo paga por meio do marido em folha datada de c.1919 (PRB-0011) — sua parte permaneceu travada num espólio indiviso por mais quarenta anos.

  - **[CONTEXTUAL]** O boom cafeeiro da Zona da Mata que gerou a riqueza de sua família já estava passando do auge no momento de sua herança de 1879: a Lei Áurea (1888) encerraria o sistema de trabalho escravizado do qual as fazendas dependiam, e a superprodução global começava a corroer os preços do café. A riqueza fundiária que ela herdou era real, mas frágil.

  - **[INFERRED]** Está registrada sob quatro formas de nome diferentes em seis documentos — Eliza Balbina de Toledo, Eliza Balbina de Tolledo, Elisa Balbina de Jesus, Eliza Ferreira Armand, Eliza Ferreira Toledo — refletindo tanto as convenções de nome de casada/solteira do Brasil oitocentista quanto as interpretações variadas de escrivães sobre a mesma mulher ao longo de sessenta anos de registros.

  ## Identidade

  Registrada tanto com seu nome de solteira Toledo quanto com o nome de casada Armond. No
  inventário de seu pai ela é **Eliza Balbina de Toledo / Tolledo** (o inventário de
  Matilde de 1879, PRB-0006; a lista de herdeiros de 1881, PRB-0001) [PROVEN]; no
  casamento de 1894 de sua filha Aristides leva o sobrenome de sua mãe, como **Elisa
  Balbina de Jesus** (CIV-0023) [PROVEN]; e nos óbitos civis de meados do século XX de
  seus filhos como **Eliza Ferreira Armand** (óbito de 1957 de Aristão, CIV-0005) e
  **Eliza Ferreira Toledo** (óbito de 1962 de Marfiza, CIV-0013). Todas são a mesma
  mulher; tanto a forma de casada quanto a de solteira são preservadas.

  - **Pais:** José Cezário de Toledo Lima (P-0054) × Claudina Brandina de Jesus (P-0055),
  família F-0026 [PROVEN] — o inventário de Matilde de 1879 (PRB-0006) a coloca como
  representante nº 5 sob o herdeiro nº 4 (JC × Claudina): "5º Simplicio José Ferreira
  Armond, cazado com D. Eliza Balbina de Tolledo". Pela lei de herança brasileira do
  século XIX, uma mulher casada comparecia por meio do marido, de modo que Simplício é
  nomeado primeiro como seu representante legal; Eliza é a herdeira.

  - **Não confundir com seu irmão:** os dois inventários de 1867 (PRB-0008 item 6;
  PRB-0009 item 6) listam um "Simplício José Ferreira de Toledo, solteiro, 14 annos" —
  este é o PRÓPRIO IRMÃO de Eliza, filho de José Cezário com o sobrenome Toledo (f. antes
  de 1879), pessoa DIFERENTE de seu marido Simplício José Ferreira Armond (P-0016), que
  leva o sobrenome Armond [PROVEN].

  - **Nascimento:** c.1850–1855 [INFERRED] — nenhum batismo localizado; já tinha filhos no
  início da década de 1870 (Marfiza n.~1873, CIV-0013; Aristides n.~1875, CIV-0023).

  - **Casamento:** casou-se com Simplício José Ferreira Armond (P-0016), família F-0006,
  c.1868–1872, em Bom Jesus do Rio Pardo (Argirita) [LEAD] — o assento de casamento, que
  também nomearia os pais de Simplício, não está disponível; a união em si é provada por
  todos os registros posteriores que a nomeiam como esposa dele.

  - **Filhos:** Aristão Ferreira Armond (P-0008, n.~1879, f.1957, CIV-0005); Marfiza
  Ferreira Armond (n.~1873, f.1962, CIV-0013); e Aristides Ferreira Armand (uma filha,
  n.~1875 no Rio Pardo da Leopoldina, casou-se com João Rodrigues Braga em 1894, CIV-0023)
  [PROVEN]. Perfis da árvore do FamilySearch acrescentam outros filhos (p.ex. Júlia) como
  pistas não verificadas [LEAD].

  - **Óbito:** data e lugar exatos não localizados, mas ela já estava falecida em 1º de
  novembro de 1957 — o assento de óbito de Aristão (CIV-0005) registra ambos os pais como
  "falecido / falecida" [PROVEN]. Ser nomeada como mãe no óbito de 1962 de Marfiza
  (CIV-0013) é prática padrão e não implica que estivesse então viva.

  ## Posição social e profissão

  - **Uma herdeira nominal em um substancial espólio fundiário Toledo** [PROVEN] — no
  inventário de 1879, em Leopoldina, de sua avó D. Mathilde Maria de Jesus (PRB-0006),
  Eliza é a representante nº 5, herdando por direito próprio; seu marido Simplício figura
  apenas como seu representante legal. A lista de herdeiros complementar de 1881 (PRB-0001)
  e a petição de 1884 de Simplício para concluir a partilha (PRB-0002, de próprio punho,
  "herdeiro da finada D. Mathilde Maria de Jezus") documentam o mesmo espólio.

  - **Nascida na família Toledo, proprietária da Fazenda da Concórdia** (Rio Pardo, Villa
  Leopoldina) [PROVEN] — seu pai José Cezário de Toledo Lima registrou terras da Concórdia
  em 1856 (GOV-0003) e os netos Toledo venderam suas partes herdadas na Concórdia em 1877
  (PRB-0003); uma escritura adicional, sem data, da Concórdia / Ribeirão de São Bento
  (PRB-0004) traça a mesma posse através de seus avós.

  - **O inventário de 1867 de seu pai, agora integralmente catalogado, mostra o lar
  cafeeiro e escravista em que ela nasceu** [PROVEN] — o inventário da Concórdia de José
  Cezário (PRB-0008), cujos fólios de avaliação foram catalogados em 2 de setembro de 2026,
  avalia uma fazenda de café em atividade: cafezais que somam cerca de 32.000 pés, uma casa
  de morada, paiol, engenho e uma casa de negócio à beira da estrada, animais, e **dez
  pessoas escravizadas** como o maior bem isolado do espólio — Lucas, Pedro e Luiza
  (registrados "de nação", nascidos na África) e Miguel, Thobias, Benedicto, Faustina,
  Virgiliana, Joana e Eugênio ("crioulo/a", nascidos no Brasil), aqui nomeados como o
  registro os nomeia e avaliados em cerca de 800$000 a 1:700$000 cada — contra uma dívida
  hipotecária de 3:885$000 devida desde 1859 a Leocádio de Toledo. Os fólios disponíveis
  trazem a avaliação, mas **nenhum fólio de partilha / monte-mór**, de modo que sua legítima
  paterna não é adjudicada neste registro; sua quota documentada de herdeira recai na
  partilha posterior de Matilde, de 1879 (PRB-0006).

  - **Nenhuma ocupação ou cargo próprio está documentado** [CONTEXTUAL] — esperado para
  uma mulher de sua época e classe; sua posição se expressa pela herança e pelos papéis
  públicos do marido (arbitrador / curador nomeado pela justiça e, em 1902, 3.º suplente
  do delegado de polícia de São Paulo do Muriaé, NWS-0003).

  ## Família e rede social

  Ela é o **elo Toledo → Armond**: ao casar-se com o Armond Simplício, levou para a
  linhagem Armond a ascendência Toledo documentada em fontes primárias. Seus pais foram
  José Cezário × Claudina (F-0026); seus avós paternos foram **Ladisláo Egídio Ferreira de
  Toledo (P-0056) × Mathilde Maria de Jesus (P-0027)**, cujo espólio de 1879 ela herdou
  (PRB-0006) e cuja terra na Concórdia a família detinha desde pelo menos 1856 (GOV-0003,
  PRB-0003, PRB-0004) [PROVEN].

  Seu **sobrenome materno "de Jesus"** (de Claudina Brandina de Jesus) explica por que ela
  é registrada como "Elisa Balbina de Jesus" no casamento de 1894 de sua filha (CIV-0023)
  [PROVEN].

  Seus **irmãos** (filhos de José Cezário × Claudina, F-0026) nomeados no inventário de
  1879 (PRB-0006) incluem Maria Dulcelina de Toledo, Mathildes Olympia da Paixão,
  Josephina Christina da Silva Lima, Maria Bulandina de Toledo (casada com Manoel Marques
  Jorge), Ladisláo Egydio Ferreira de Toledo, Geraldo Augusto de Toledo Lima e Josepha
  Olympia da Paixão; os inventários de 1867 (PRB-0008, PRB-0009) acrescentam seu irmão
  Simplício José Ferreira de Toledo (o homônimo acima) e situam a morte de seu pai em ~2
  de setembro de 1866 [PROVEN].

  - **Cuidado com homônimo:** uma audiência de citação de 13 de novembro de 1880 nos autos
  do espólio de Ladisláo Toledo nomeia "Simplicio José Ferreira Armond e sua mulher Maria
  Dulcelina de Toledo" — um lapso do escrivão que substituiu Eliza pelo nome de sua irmã
  Maria Dulcelina. NÃO indica uma segunda esposa de Simplício [PROVEN — sinalizado neste
  repositório].

  ## O que podemos extrapolar

  Eliza é a articulação sobre a qual giram tanto a profundidade documentada desta família quanto seu
  passado fundiário. Foi ela quem levou para a linha Armond o único capital transmissível que esta
  chegou a tocar — e os registros em mãos mostram esse capital chegando onerado, indiviso, lento e,
  ao final, pequeno. [INFERRED]

  - **É por causa dela que esta linha tem alguma árvore profunda** [INFERRED]. O lado Armond termina
  em Simplício, cujos pais são desconhecidos (P-0016); todo ancestral documentado anterior a ele
  entra pela linha Toledo de Eliza e recua, pelos registros de inventário e de terras, até a
  Concórdia da década de 1850. A ancestralidade documental da família é materna.

  - **A base fundiária em que nasceu era real, mas compartilhada e alavancada desde o início**
  [registros PROVEN; leitura INFERRED]. A Fazenda da Concórdia é declarada em 1856 por seu pai José
  Cesário de Toledo Lima como uma posse de 200 alqueires "por minha Mãe, irmãos e cunhados" —
  registrada em conjunto para a mãe, os irmãos e os cunhados (GOV-0003), uma posse familiar indivisa,
  e não o espólio de um só homem. O inventário dele, de 1867 (PRB-0008), mostra o que essa posse
  produzia: cafezais de cerca de 32.000 pés, casa de morada, paiol e engenho, uma casa de negócio à
  beira da estrada, animais — e, como seu maior bem isolado, dez pessoas escravizadas: Lucas, Pedro e
  Luiza (registrados "de nação") e Miguel, Thobias, Benedicto, Faustina, Virgiliana, Joana e Eugênio
  ("crioulo/a"), avaliadas entre cerca de 800$000 e 1:700$000 cada uma. Contra isso pesava uma dívida
  hipotecária de 3:885$000, vencida desde 1859 e devida a Francisco Leocádio de Toledo, ele próprio
  copossuidor declarado da mesma fazenda (GOV-0003). Sua posição de classe era genuinamente
  proprietária; também era comum com primos e hipotecada dentro da própria família.

  - **Sua herança era transmissível na espécie, mas contingente na prática** [documentos PROVEN;
  leitura INFERRED]. Diferentemente dos cargos do marido, terra e trabalho escravizado eram capital
  que, em princípio, podia passar aos filhos — é essa a diferença estrutural entre as duas linhas que
  se encontraram nesse casamento. Mas três coisas o esvaziaram antes que chegasse aos dela. A sucessão
  partível o dividiu: o espólio de sua avó Mathilde é uma lista de herdeiros, os "Primeiros Nettos"
  (PRB-0001), cada um com direito a uma fatia igual do mesmo bem comum. A liquidação começou cedo: em
  1877 um conjunto de netos Toledo vendeu "duas sortes de terras de cultura em commum na Fazenda da
  Concordia" ao Capitão Antonio Belizandro dos Reis Meirelles, vários assinando de São João del-Rei e
  do Rio de Janeiro (PRB-0003) — Eliza não é nomeada entre esses vendedores, de modo que sua quota
  parece ter permanecido no espólio indiviso. E a abolição levou o resto: os espólios ainda estavam
  indivisos em 1888, de modo que quaisquer pessoas escravizadas que contabilizassem como bens — a
  mulher Martinha no de Mathilde (PRB-0006), dez no de seu pai (PRB-0008) — deixaram de ser
  propriedade enquanto os herdeiros esperavam.

  - **O que enfim chegou à sua casa, em números** [PROVEN]. A folha de pagamento datada de c.1919 pelo
  agente de recuperação (PRB-0011) destina sua quota, por meio do marido e expressamente "casado com
  Dona Eliza Balbina de Tollêdo", como frações de valor e não como bens: 72$910 na casa de morada,
  9$113 no paiol, 3$645 no moinho, 14$582 nas metades do engenho e do ventilador, 51$037 em 3.388 ares
  de matta virgem e uma cifra gasta de capoeiras, lida como 50$546 ou 508$546 [uncertain], com ao
  menos mais uma gleba fora da página. Pelo parâmetro dos próprios papéis da família — uma pessoa
  escravizada no espólio de seu pai, avaliada entre 800$000 e 1:700$000 (PRB-0008) —, sua herança
  documentada, mesmo na leitura mais alta, soma menos do que a mais barata das pessoas que aquele
  espólio detinha; e a comparação é nominal, de modo que a distância real é ainda maior. [cifras
  PROVEN; a comparação é INFERRED e nominal]

  - **E chegou com cerca de quarenta anos de atraso** [PROVEN]. Sua avó faleceu por volta de 1880; o
  marido ainda peticionava em 1884 para forçar a partilha, registrando de próprio punho que coerdeiros
  desta família proprietária estavam "em estado de indigencia" enquanto esperavam (PRB-0002); a folha
  de pagamento é de c.1919. Capital travado em inventário por quatro décadas não paga escola, não
  compra terra e não dá começo de vida aos filhos que dele precisavam. A geração que deveria ter sido
  dotada por ele — Marfiza, Aristão, Aristides — já havia feito seus próprios casamentos e seus
  próprios sustentos quando o pagamento saiu. [documentos PROVEN; consequência INFERRED]

  - **A fragmentação estava visível na própria lista de herdeiros** [PROVEN; leitura INFERRED]. A mesma
  folha de 1881 que nomeia Eliza registra seu coerdeiro Geraldo Augusto de Toledo Lima, de 15 anos,
  como "rezidente na côrte, empregado em uma caza de negocio" na Rua do Visconde de Inhaúma (PRB-0001).
  Uma família proprietária que coloca um menino herdeiro atrás de um balcão no Rio é uma família cuja
  terra já não absorve os próprios filhos — a mudança urbana que os Armond fariam duas gerações depois
  já havia começado entre seus primos Toledo.

  - **Seu casamento foi entre iguais, mas não entre fortunas** [INFERRED]. Um Armond casar-se com uma
  herdeira numerada dos Toledo da Concórdia não é aliança marginal, e reforça a leitura dos Armond como
  gente estabelecida localmente. O que se cruzou nesse casamento, porém, foi posição dos dois lados: os
  cargos dele não pagavam nada (ver P-0016) e a terra dela chegou tarde, dividida e reduzida. Ambas as
  linhas entregaram dinheiro e posição — não uma fazenda em operação — à geração dos filhos.

  - **Seu patrimônio produziu rastro de papel em nome do marido** [PROVEN; leitura CONTEXTUAL]. A
  prática oitocentista fazia do marido o ator jurídico da herança da mulher casada, de modo que Eliza —
  a herdeira de fato — aparece como verbete sob o nome de Simplício em 1879 (PRB-0006), em 1881
  (PRB-0001), na petição dele de 1884 (PRB-0002) e na folha de pagamento de c.1919 (PRB-0011). Nenhum
  registro em mãos traz a assinatura dela; no casamento de sua filha, em 1894, celebrado em sua própria
  casa, quem assina são o marido, a noiva, os oficiais e as testemunhas, e ela é nomeada apenas como
  mãe residente no distrito (CIV-0023). Seu letramento é, portanto, intestável com o que temos — o
  rastro esperado de uma mulher casada cujos atos jurídicos eram praticados por outrem, e não prova de
  que não soubesse escrever. É também por isso que seu nome é instável no arquivo: os escrivães
  registravam o sobrenome que a ocasião pedia.

  - **Ela é o entroncamento de duas trajetórias opostas** [INFERRED / CONTEXTUAL]. A linha materna
  Toledo, proprietária de terra e de pessoas escravizadas — capital transmissível, mas comum,
  hipotecado, fragmentado e por fim ultrapassado pela abolição —, encontra a linha paterna Armond, de
  cargo e posição, que se fez sozinha, casou-se para dentro e não trazia capital transmissível algum.
  Uma geração depois, seu filho Aristão era padeiro no estado do Rio de Janeiro (CIV-0005) e seu neto
  Geraldo, padeiro em Volta Redonda (CIV-0002). Eliza é o ponto em que a riqueza fundiária materna é
  gasta para financiar essa transição, em vez de detê-la.

