- text: >-
    PARENTAGE CONFIRMED (7 August 2026, PRB-0006 Film 2 triage): Eliza is a daughter
    of José Cezário de Toledo Lima (P-0054) and Claudina Brandina de Jesus (P-0055),
    family F-0026. Evidence: the 1879 Matilde inventário (PRB-0006), Film 2 triage,
    lists her as representante #5 under heir #4 (JC × Claudina). Per 19th-century
    Brazilian inheritance law, a married woman appeared through her husband as legal
    representative; item 5 reads "5º Simplicio José Ferreira Armond, cazado com D.
    Eliza Balbina de Tolledo" — Simplício is named first as her legal actor, Eliza is
    the heir. A prior session (7 August 2026) misread this as Simplício being JC's son
    and removed Eliza from F-0026; that correction was itself erroneous and is reversed.
    The "Simplício José Ferreira de Toledo, solteiro, 14 anos" in the 1867 inventários
    (PRB-0008 item 6; PRB-0009 item 6) is JC's OWN SON with the Toledo surname — a
    DIFFERENT person from our Simplício Armond who has the Armond surname.
  text_pt: >-
