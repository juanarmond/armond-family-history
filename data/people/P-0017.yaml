notes:
- text: Ahnentafel position 17.
- text: >-
    Parents established (1 August 2026) from her grandmother Mathilde Maria de
    Jesus's 1879 Leopoldina estate inventory (PRB-0006): daughter of José Cezário de
    Toledo Lima (P-0054) and D. Claudina [Brandina de Jesus] (P-0055), family F-0026,
    where she is heir #4's fifth representante ("5º Simplicio José Ferreira Armond,
    cazado com D. Eliza Balbina de Tolledo"). Her grandmother Mathilde (P-0027) is
    thus linked through a structured edge, and the earlier hypothesis that her
    parents were Antonio Zeferino de Toledo × Maria Perpétua is corrected — that
    couple is heir #3, her uncle and aunt.
- text: >-
    Recorded three ways: "Eliza Ferreira Armand" (Aristão's 1957 death, CIV-0005),
    "Eliza Ferreira Toledo" (Marfiza's 1962 death, CIV-0013) and "Eliza Balbina de
    Toledo" (the 1881 Toledo heir list PRB-0001, as Simplício's wife). All give her
    the Toledo maiden surname and the owner confirms they are the same woman; the
    married and maiden forms are both preserved.
