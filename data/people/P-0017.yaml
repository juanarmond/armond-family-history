notes:
- text: Ahnentafel position 17.
- text: >-
    PARENTAGE CORRECTION (7 August 2026): Eliza is NOT a daughter of José Cezário
    de Toledo Lima (P-0054) and Claudina Brandina de Jesus (P-0055). The previous
    reading (1 August 2026, PRB-0006) was a misinterpretation: PRB-0006 folio 9 reads
    "5º Simplicio José Ferreira Armond, cazado com D. Eliza Balbina de Tolledo" —
    naming Simplício as heir #5 and Eliza as his WIFE, not as JC's daughter. PRB-0008
    (JC's own 1867 inventário) and PRB-0009 (Ladisláo's 1867 inventário) both confirm
    Simplício is JC's child; neither lists Eliza among JC's children. F-0026 has been
    corrected accordingly. Eliza's parentage is currently unresolved. She bears the
    Toledo surname and is connected to the Toledo family through her marriage to
    Simplício; she could be a daughter of any of Ladisláo's other children not yet
    fully researched (siblings of JC).
- text: >-
    Recorded three ways: "Eliza Ferreira Armand" (Aristão's 1957 death, CIV-0005),
    "Eliza Ferreira Toledo" (Marfiza's 1962 death, CIV-0013) and "Eliza Balbina de
    Toledo" (the 1881 Toledo heir list PRB-0001, as Simplício's wife). All give her
    the Toledo maiden surname and the owner confirms they are the same woman; the
    married and maiden forms are both preserved.
- text: >-
    Namesake caution (do NOT treat as a variant of Eliza): the 13 November 1880
    citation audience in the Ladisláo Toledo estate names "Simplicio José Ferreira
    Armond e sua mulher Maria Dulcelina de Toledo" — a scribe's slip substituting the
    name of Eliza's sister Maria Dulcelina de Toledo (a documented child on F-0026)
    for Eliza. It does not indicate a second wife of Simplício.
