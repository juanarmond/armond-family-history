profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu nome foi impresso erroneamente como "JOSÉ CLAVO ARMOND" no edital de proclamas de 1975 publicado em O Processo, Conselheiro Lafaiete (NWS-0001) — "CLAVO" sendo um evidente erro tipográfico de "OLAVO". O surgimento inusitado do sobrenome na imprensa é ele próprio um pequeno documento da contínua deriva de transcrição do nome Armond, visível desde a assinatura autógrafa de Simplício nos anos 1880 até um jornal de 1975.

  - **[PROVEN]** Possuía carteira de habilitação (categoria amador) no registro da Guanabara até março de 1973 (GOV-0001) — um fato administrativo trivial que o situa na classe trabalhadora/média urbanizada do antigo estado da Guanabara (Rio de Janeiro). O acesso a automóvel era um marcador de classe significativo no Brasil do início dos anos 1970.

  - **[CONTEXTUAL]** Nasceu em 1926 em Eugenópolis, Minas Gerais — a mesma cidade da Zona da Mata onde sua mãe Liliosa viria a falecer em 1946 e onde seu irmão Geraldo se casaria em 1952 — sendo o último Armond a nascer na região de origem da família antes da mudança para o Rio de Janeiro.

  - **[INFERRED]** Registrado como "representante comercial" residente no Rio de Janeiro em 1975 (NWS-0001), seguiu a mesma trajetória Zona da Mata → Rio de Janeiro que o ramo de seu irmão Geraldo, mas por um ofício diferente: representação comercial em vez de panificação.

  - **[PROVEN]** Um edital de proclamas de 1975 em Conselheiro Lafaiete, MG (NWS-0001) anunciou seu pretendido casamento com uma professora daquela cidade, cujo nome é aqui omitido — ela era *maior* em 1975 e presume-se viva. Um edital é uma publicação de intenção de casar, não uma certidão de casamento. Se o casamento se realizou é uma questão em aberto.

  ## Identidade

  **José Olavo Armond**, um tio-avô — o irmão documentado de Geraldo Paz Armond
  (P-0004, avô paterno de Juan). Duas formas de nome das fontes são preservadas: o
  índice governamental de 1973 imprime "JOSE OLAVO ARMOND" (GOV-0001) e o edital de
  proclamas de 1975 imprime "JOSÉ CLAVO ARMOND" (NWS-0001), onde "CLAVO" é um evidente
  erro de impressão de "OLAVO". [PROVEN]

  - **Nascimento:** 25 de setembro de 1926 (GOV-0001), em **Eugenópolis, MG** (NWS-0001,
  "natural de Eugenópolis"). Nenhum registro de nascimento ou batismo foi localizado, de
  modo que a data é administrativa/autodeclarada. [PROVEN as recorded; o registro em si é
  OPEN]

  - **Pais:** **Aristão Ferreira Armond** (P-0008) e **Liliosa Paz Armond** (P-0009) —
  nomeados em ambos os registros (GOV-0001 imprime o pai como "Aristac"; NWS-0001
  "Aristão"). [PROVEN]

  - **Óbito:** falecido (confirmado pelo proprietário); nenhum registro de óbito foi
  localizado e a data/o local são desconhecidos. [OPEN]

  ## Posição social e profissão

  - **Representante comercial**, residente no Rio de Janeiro em 1975 (NWS-0001). [PROVEN]

  - Possuía carteira de habilitação (categoria amador) no registro da Guanabara,
  conforme o índice de prontuário de motorista de 1973 (GOV-0001). [PROVEN]

  ## Família e rede social

  Filho de Aristão × Liliosa e irmão de Geraldo (P-0004). O edital de proclamas de
  casamento de 1975 publicado em O Processo anunciou seu pretendido casamento com
  uma noiva registrada como *natural de Conselheiro Lafaiete, maior, professora*, em
  Conselheiro Lafaiete, MG. Seu nome, seu endereço e os nomes de seus pais são aqui
  omitidos, como o são na transcrição de NWS-0001: ela era *maior* em 1975 e
  presume-se viva, sendo portanto tratada como terceiro vivo.
  Um edital evidencia a intenção de casar, não um casamento realizado;
  à época das proclamas ele residia na Av. Ministro Edgard Romero 351, Bloco 18,
  apt° 102, Rio de Janeiro (zona de Madureira/Marechal Hermes). [PROVEN quanto ao
  edital (NWS-0001); o casamento em si é OPEN]

  ## O que podemos extrapolar

  José Olavo pertence à geração urbanizada da família, e seus dois documentos mostram uma chegada
  diferente da de seu irmão dentro da mesma faixa de classe. Esta leitura é mantida breve,
  proporcional a uma vida pouco documentada. [INFERRED]

  - **A mesma migração, outro ofício** [fatos PROVEN; leitura INFERRED]. Nascido em Eugenópolis, na
  Zona da Mata, em 1926 (GOV-0001, NWS-0001), residia no Rio de Janeiro em 1975 como representante
  comercial — uma ocupação urbana de serviços, remunerada por comissão, e não o ofício manual que seu
  irmão Geraldo exercia (padeiro, CIV-0002). Ambos são sustentos por salário ou comissão, sem terra,
  capital ou cargo associados; a mudança Minas → Rio é a mesma, o caminho de entrada na cidade não é.

  - **Uma casa carioca de classe média baixa, já assentada** [PROVEN; leitura de classe CONTEXTUAL]. O
  registro da Guanabara de 1973 o traz com carteira de habilitação na *categoria amador* — a classe
  particular, não profissional, de modo que o carro era de uso próprio e não de trabalho (GOV-0001) —
  e o edital de 1975 o situa num apartamento de um bloco numerado na Avenida Ministro Edgard Romero,
  no cinturão de Marechal Hermes / Madureira, na Zona Norte (NWS-0001). Dirigir automóvel particular
  no Brasil do início dos anos 1970 era um marcador de classe efetivo. É um homem com pé urbano
  estável, não precário.

  - **Também à geração dele nada de transmissível chegou** [INFERRED]. Os cargos Armond haviam
  terminado com o posto não remunerado de subdelegado do pai, em 1931 (GOV-0004, P-0008), e a terra
  Toledo, vinda por casamento, fora paga em frações duas gerações antes (PRB-0011, P-0016). O que ele
  tinha era uma ocupação, uma habilitação e um apartamento — bens de uma vida de trabalho, nenhum
  deles herdado.

  - **A instrução reentra na família por casamento, não por herança** [fatos PROVEN; leitura
  INFERRED]. O edital de 1975 registra sua pretendida, em Conselheiro Lafaiete, como *professora* —
  ocupação que, no Brasil daquele período, exigia formação paga em escola normal. Ele tinha então
  cerca de 48 anos. Há uma rima estrutural com a própria história da família: três gerações antes,
  fora a *terra* que entrara nesta linha por casamento, e não por descendência, e não se transmitiu;
  aqui é a *escolaridade* que entra na casa pela mesma via. Se o casamento se realizou não é
  estabelecido por um edital, de modo que esta é uma leitura da intenção que o registro documenta, e
  não de uma casa constituída. [o casamento em si é OPEN]

