notes:
- text: >-
    A March 1973 government driver-dossier index (GOV-0001) reports a birth date
    of 25 September 1926 and names Aristac Ferreira Armond and Liliosa Paz Armond
    as parents. The 1975 marriage bann (NWS-0001) independently confirms the same
    parents (rendered Aristão Ferreira Armond and Liliosa Paz Armond) and
    additionally records him as natural de Eugenópolis. His birth is modelled as
    event E-0027 (date 25 September 1926 per GOV-0001, place Eugenópolis per
    NWS-0001, strong-evidence); no birth or baptism register has yet been located.
  text_pt: >-
    Um índice de dossiê de motorista do governo de março de 1973 (GOV-0001) informa
    uma data de nascimento de 25 de setembro de 1926 e nomeia Aristac Ferreira Armond
    e Liliosa Paz Armond como pais. O edital de casamento de 1975 (NWS-0001) confirma
    de forma independente os mesmos pais (grafados Aristão Ferreira Armond e Liliosa
    Paz Armond) e, além disso, o registra como natural de Eugenópolis. Seu nascimento
    é modelado como o evento E-0027 (data de 25 de setembro de 1926 conforme GOV-0001,
    local Eugenópolis conforme NWS-0001, forte evidência); nenhum registro de
    nascimento ou batismo foi localizado até o momento.
- text: >-
    Deceased: the repository owner confirms that everyone from his grandparents'
    generation back — including this granduncle (b. 1926, brother of the owner's
    grandfather Geraldo Paz Armond) — is deceased. The retained government index
    remains private because the full page contains identity and dossier data for
    multiple people.
  text_pt: >-
    Falecido: o proprietário do repositório confirma que todos da geração de seus avós
    para trás — incluindo este tio-avô (n. 1926, irmão do avô do proprietário, Geraldo
    Paz Armond) — são falecidos. O índice governamental retido permanece privado porque
    a página completa contém dados de identidade e de dossiê de várias pessoas.
- text: >-
    The preferred spelling "José Olavo Armond" normalises the two source forms,
    both preserved as variants: the government index (GOV-0001) prints
    "JOSE OLAVO ARMOND" (no accent) and the marriage bann (NWS-0001) prints
    "JOSÉ CLAVO ARMOND", where "CLAVO" is an evident misprint for "OLAVO". Both
    sources are strong originals, so the preferred name is well-founded.
  text_pt: >-
    A grafia preferida "José Olavo Armond" normaliza as duas formas das fontes, ambas
    preservadas como variantes: o índice governamental (GOV-0001) imprime "JOSE OLAVO
    ARMOND" (sem acento) e o edital de casamento (NWS-0001) imprime "JOSÉ CLAVO
    ARMOND", onde "CLAVO" é um evidente erro de impressão de "OLAVO". Ambas as fontes
    são originais fortes, de modo que o nome preferido é bem fundamentado.
profile: >-
  ## Identity

  **José Olavo Armond**, a granduncle — the documented brother of Geraldo Paz Armond
  (P-0004, Juan's paternal grandfather). Two source name forms are preserved: the 1973
  government index prints "JOSE OLAVO ARMOND" (GOV-0001) and the 1975 marriage bann
  prints "JOSÉ CLAVO ARMOND" (NWS-0001), where "CLAVO" is an evident misprint for
  "OLAVO". [PROVEN]

  - **Birth:** 25 September 1926 (GOV-0001), at **Eugenópolis, MG** (NWS-0001, "natural
  de Eugenópolis"). No birth or baptism register has been located, so the date is
  administrative/self-reported. [PROVEN as recorded; the register itself is OPEN]

  - **Parents:** **Aristão Ferreira Armond** (P-0008) and **Liliosa Paz Armond**
  (P-0009) — named in both records (GOV-0001 prints the father "Aristac"; NWS-0001
  "Aristão"). [PROVEN]

  - **Death:** deceased (owner-confirmed); no death record has been located and the
  date/place are unknown. [OPEN]

  ## Standing and profession

  - **Representante comercial** (commercial representative), resident in Rio de Janeiro
  by 1975 (NWS-0001). [PROVEN]

  - Held a driver's licence (categoria amador) in the Guanabara register, per the 1973
  driver-dossier index (GOV-0001). [PROVEN]

  ## Family and social network

  Son of Aristão × Liliosa and brother of Geraldo (P-0004). The 1975 marriage bann
  (edital de proclamas) published in O Processo announced his intended marriage to Maria
  de Fátima Gomes Beato at Conselheiro Lafaiete, MG; a bann evidences the intent to
  marry, not a completed marriage. [PROVEN bann; the marriage itself is OPEN]

  ## Open questions

  - His birth/baptism register (Eugenópolis, ~1926) — not held. [OPEN]

  - Whether the 1975 marriage was completed, and its exact date and place. [OPEN]

  - His death date and place. [OPEN]

  ## Sources held (this repository)

  - GOV-0001 — 1973 Guanabara driver-dossier alphabetical index (born 25 September 1926;
  father "Aristac Ferreira Armond", mother Liliosa Paz Armond; categoria amador). The
  page is a multi-person dossier; other people's data are withheld.

  - NWS-0001 — 1975 marriage bann in O Processo, Conselheiro Lafaiete (natural de
  Eugenópolis; representante comercial resident in Rio de Janeiro; parents Aristão
  Ferreira Armond and Liliosa Paz Armond).

  ## Regional and migration context

  Born at Eugenópolis, in the **Zona da Mata Mineira**, in 1926; by 1975 he was resident
  in **Rio de Janeiro** — the same Minas → Rio trajectory that his brother Geraldo's
  branch followed. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **José Olavo Armond**, um tio-avô — o irmão documentado de Geraldo Paz Armond
  (P-0004, avô paterno de Juan). Duas formas de nome das fontes são preservadas: o
  índice governamental de 1973 imprime "JOSE OLAVO ARMOND" (GOV-0001) e o edital de
  proclamas de 1975 imprime "JOSÉ CLAVO ARMOND" (NWS-0001), onde "CLAVO" é um evidente
  erro de impressão de "OLAVO". [PROVEN]

  - **Nascimento:** 25 de setembro de 1926 (GOV-0001), em **Eugenópolis, MG** (NWS-0001,
  "natural de Eugenópolis"). Nenhum registro de nascimento ou batismo foi localizado, de
  modo que a data é administrativa/autodeclarada. [PROVEN as recorded; o registro em si é
  OPEN]

  - **Pais:** **Aristão Ferreira Armond** (P-0008) e **Liliosa Paz Armond** (P-0009) —
  nomeados em ambos os registros (GOV-0001 imprime o pai como "Aristac"; NWS-0001
  "Aristão"). [PROVEN]

  - **Óbito:** falecido (confirmado pelo proprietário); nenhum registro de óbito foi
  localizado e a data/o local são desconhecidos. [OPEN]

  ## Posição social e profissão

  - **Representante comercial**, residente no Rio de Janeiro em 1975 (NWS-0001). [PROVEN]

  - Possuía carteira de habilitação (categoria amador) no registro da Guanabara,
  conforme o índice de prontuário de motorista de 1973 (GOV-0001). [PROVEN]

  ## Família e rede social

  Filho de Aristão × Liliosa e irmão de Geraldo (P-0004). O edital de proclamas de
  casamento de 1975 publicado em O Processo anunciou seu pretendido casamento com Maria
  de Fátima Gomes Beato em Conselheiro Lafaiete, MG; um edital evidencia a intenção de
  casar, não um casamento realizado. [PROVEN quanto ao edital; o casamento em si é OPEN]

  ## Questões em aberto

  - Seu registro de nascimento/batismo (Eugenópolis, ~1926) — não obtido. [OPEN]

  - Se o casamento de 1975 se realizou, e sua data e local exatos. [OPEN]

  - A data e o local de seu óbito. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - GOV-0001 — índice alfabético de prontuário de motorista da Guanabara de 1973
  (nascido em 25 de setembro de 1926; pai "Aristac Ferreira Armond", mãe Liliosa Paz
  Armond; categoria amador). A página é um dossiê de várias pessoas; os dados de
  terceiros são omitidos.

  - NWS-0001 — edital de proclamas de 1975 em O Processo, Conselheiro Lafaiete (natural
  de Eugenópolis; representante comercial residente no Rio de Janeiro; pais Aristão
  Ferreira Armond e Liliosa Paz Armond).

  ## Contexto regional e migratório

  Nascido em Eugenópolis, na **Zona da Mata Mineira**, em 1926; em 1975 já residia no
  **Rio de Janeiro** — a mesma trajetória Minas → Rio que o ramo de seu irmão Geraldo
  seguiu. [CONTEXTUAL]
