profile: >-
  ## Interesting facts

  - **[PROVEN]** His name was misprinted "JOSÉ CLAVO ARMOND" in the 1975 marriage bann published in O Processo, Conselheiro Lafaiete (NWS-0001) — "CLAVO" being an evident compositor's error for "OLAVO". The surname's unusual appearance in print is its own small document of the Armond name's ongoing transcription drift, visible from Simplício's 1880s autograph down to a 1975 newspaper.

  - **[PROVEN]** He held a driver's licence (categoria amador) in the Guanabara register as of March 1973 (GOV-0001) — a mundane administrative fact that places him in the urbanised working/middle class of the former Guanabara state (Rio de Janeiro). Car ownership or access was a meaningful class marker in early-1970s Brazil.

  - **[CONTEXTUAL]** Born in 1926 in Eugenópolis, Minas Gerais — the same Zona da Mata town where his mother Liliosa would die in 1946 and where his brother Geraldo had married in 1952 — he was the last Armond to be born in the family's home region before the move to Rio de Janeiro.

  - **[INFERRED]** Recorded as a "representante comercial" (commercial representative) resident in Rio de Janeiro in 1975 (NWS-0001), he followed the same Zona da Mata → Rio de Janeiro trajectory as his brother Geraldo's household, but via a different trade: sales representation rather than baking.

  - **[PROVEN]** A 1975 marriage bann in Conselheiro Lafaiete, MG (NWS-0001) announced his intended marriage to a schoolteacher of that town, whose name is withheld here — she was *maior* in 1975 and is presumed living. A bann is a publication of intention to marry, not a marriage certificate. Whether the marriage was completed is an open question.

  ## Identity

  **José Olavo Armond**, a granduncle — the documented brother of Geraldo Paz Armond
  (P-0004, Juan's paternal grandfather). Two source name forms are preserved: the 1973
  government index prints "JOSE OLAVO ARMOND" (GOV-0001) and the 1975 marriage bann
  prints "JOSÉ CLAVO ARMOND" (NWS-0001), where "CLAVO" is an evident misprint for
  "OLAVO". [PROVEN]

  - **Birth:** 25 September 1926 (GOV-0001), at **Eugenópolis, MG** (NWS-0001, "natural
  de Eugenópolis"). No birth or baptism register has been located, so the date is
  administrative/self-reported. [PROVEN as recorded; the register itself is OPEN]

  - **Parents:** **Aristão Ferreira Armond** (P-0008) and **Liliosa Paz Armond**
  (P-0009) — named in both records (GOV-0001 prints the father "Aristac"; NWS-0001
  "Aristão"). [PROVEN]

  - **Death:** deceased (owner-confirmed); no death record has been located and the
  date/place are unknown. [OPEN]

  ## Standing and profession

  - **Representante comercial** (commercial representative), resident in Rio de Janeiro
  by 1975 (NWS-0001). [PROVEN]

  - Held a driver's licence (categoria amador) in the Guanabara register, per the 1973
  driver-dossier index (GOV-0001). [PROVEN]

  ## Family and social network

  Son of Aristão × Liliosa and brother of Geraldo (P-0004). The 1975 marriage bann
  (edital de proclamas) published in O Processo announced his intended marriage to
  a bride recorded as *natural de Conselheiro Lafaiete, maior, professora* at
  Conselheiro Lafaiete, MG. Her name, her address and her parents' names are withheld
  here, as they are in the NWS-0001 transcription: she was *maior* in 1975 and is
  presumed living, so she is treated as a living third party.
  A bann evidences the intent to marry, not a completed marriage; at the
  time of the banns he was resident at Av. Ministro Edgard Romero 351, Bloco 18, apto
  102, Rio de Janeiro (Madureira/Marechal Hermes area). [PROVEN bann (NWS-0001); the
  marriage itself is OPEN]

  ## What we can extrapolate

  José Olavo belongs to the family's urbanized generation, and his two documents show a different
  landing from his brother's within the same class band. This reading is kept short, in proportion
  to a lightly documented life. [INFERRED]

  - **Same migration, different trade** [PROVEN facts; INFERRED reading]. Born at Eugenópolis in the
  Zona da Mata in 1926 (GOV-0001, NWS-0001), he was resident in Rio de Janeiro by 1975 as a
  representante comercial — a commission-based urban service occupation, not the manual trade his
  brother Geraldo worked (padeiro, CIV-0002). Both are wage or commission livelihoods with no land,
  capital or office attached; the Minas → Rio move is the same, the route into the city is not.

  - **A settled lower-middle-class Rio household** [PROVEN; class reading CONTEXTUAL]. The 1973
  Guanabara register records him holding a driver's licence in the *categoria amador* — the private,
  non-professional class, so the car was for his own use rather than his work (GOV-0001) — and the
  1975 bann places him in an apartment in a numbered bloco on Avenida Ministro Edgard Romero, in the
  Marechal Hermes / Madureira belt of the Zona Norte (NWS-0001). Private motoring in early-1970s
  Brazil was a real class marker. This is a man with a stable urban footing, not a precarious one.

  - **Nothing heritable reached his generation either** [INFERRED]. The Armond offices had ended with
  his father's unpaid 1931 subdelegado post (GOV-0004, P-0008), and the married-in Toledo land had
  been paid out in fractions two generations earlier (PRB-0011, P-0016). What he had was an
  occupation, a licence and a flat — assets of a working life, none of them inherited.

  - **Education re-enters the family by marriage, not by inheritance** [PROVEN facts; INFERRED
  reading]. The 1975 bann records his intended, at Conselheiro Lafaiete, as a *professora* — a
  schoolteacher, an occupation that in Brazil of that period required paid normal-school training.
  He was then about 48. There is a structural rhyme with the family's own history: three generations
  earlier it had been *land* that entered this line by marriage rather than by descent, and it did
  not transmit; here it is *schooling* that enters the household the same way. Whether the marriage
  took place is not established by a bann, so this is a reading of the intention the record
  documents, not of a completed household. [the marriage itself is OPEN]

  ## Open questions

  - His birth/baptism register (Eugenópolis, ~1926) — not held. [OPEN]

  - Whether the 1975 marriage was completed, and its exact date and place. [OPEN]

  - His death date and place. [OPEN]

