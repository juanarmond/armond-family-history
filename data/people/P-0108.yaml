- text: >-
    Mother of Maria Luiza Schenkel (P-0104); the bride "Louisa Stoffel, eheliche ledige Tochter von
    dem Schweizer Colonisten Joseph Stoffel" in her 1847 Lutheran marriage to Conrad Schenkel
    (PAR-0067), and named "verstorbenen Maria Luisa geb. Stoffel" (deceased by 1872) in her
    daughter's 1872 marriage (PAR-0068). Her father Joseph Stoffel, expressly a "Schweizer Colonist"
    (Swiss colonist), is modelled as P-0114 (father-only family F-0057) with a record-stated Swiss
    origin. Her own nationality is left unset (her mother is unrecorded), though the Swiss-colonist
    father points to the Stoffel line being Swiss.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1847 marriage act contains the single most valuable word in this whole
  cluster of profiles: her father is "dem **Schweizer** Colonisten Joseph [St]offel". A record
  states his Swiss origin outright. Everywhere else in this group, Swiss or German origin has to
  be argued from a parish name or left open — here it is written down. (PAR-0067)

  - **[PROVEN]** She married inside the German-language Lutheran congregation while being the
  daughter of a Swiss colonist. The colony's confessional line and its national line did not run
  in the same place, and her marriage is the clearest demonstration of that in the held
  evidence.

  - **[PROVEN]** She was dead by April 1872: her daughter's marriage act calls her "der
  verstorbenen Maria Luisa geb. Stoffel", while her husband is named without that qualifier. She
  died somewhere in the twenty-five years between her own wedding and her daughter's. (PAR-0068)

  - **[PROVEN]** She is recorded under two forms of the same name — "Louisa Stoffel" as a bride
  in 1847, "Maria Luisa geb. Stoffel" as a dead mother in 1872 — and her daughter was given the
  same name again. Three generations of Maria Luizas run through this line.

  ## Identity

  **Maria Luiza Stoffel**, recorded at her marriage as **Louisa Stoffel** — daughter of a Swiss
  colonist, wife of Conrad Schenkel, mother of Maria Luiza Schenkel (P-0104). Iris Bohrer
  Muniz's (P-0007) great-great-grandmother, by the chain Maria Luiza Schenkel → Carolina Klein
  (P-0029) → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the family links]

  - **Marriage:** to Conrad Schenkel (P-0107) on 3 February 1847 at the Nova Friburgo Lutheran
  church, recorded as "Louisa [St]offel, ehel[iche] ledige Tochter von dem Schweizer Colonisten
  Joseph [St]offel"; witnesses Gustav and Paul Lenenroth, both merchants. (PAR-0067, event
  E-0091) [PROVEN]

  - **Father:** Joseph Stoffel (P-0114), expressly a Swiss colonist; family F-0057. Her mother
  is not named in any held record. [PROVEN for the father; the mother is OPEN]

  - **Death:** before 29 April 1872, when her daughter's marriage act records her as deceased.
  [PROVEN for the bracket; the date is OPEN]

  - **Birth and baptism:** undocumented. [OPEN]

  - **Nationality:** left unset in this archive. Her father's Swiss origin is stated, but hers
  is not, and her mother is unrecorded — so the field is deliberately blank rather than assumed.
  [OPEN by decision]

  ## Standing and profession

  Nothing is recorded for her personally: no occupation, property, literacy or signature. The
  one descriptive word in her record attaches to her father — *Colonist* — and describes his
  legal status in the colonization scheme, not her life. What the act does establish is that she
  married as a *ledige Tochter*, an unmarried daughter, in her father's lifetime.

  ## Family and social network

  Her marriage connected the Stoffel strand to the Schenkel family, and through them to the
  Kleins and then the Bohrers. [PROVEN] Her husband Conrad Schenkel was the son of the
  congregation's *Kirchenvorsteher*, Heinrich Schenkel, so the match put a Swiss colonist's
  daughter into the household of a Lutheran church warden — the nearest thing to a step up that
  the held evidence records for anyone in this group, and still a marriage inside the same small
  congregation. [PROVEN — PAR-0067]

  Her daughter Maria Luiza Schenkel, born about 1851, married Jacob Klein in 1872; by then her
  mother was dead and her father was not. [PROVEN — PAR-0068]

  ## What we can extrapolate

  - **[CONTEXTUAL]** "Schweizer Colonist" in an 1847 Nova Friburgo register most naturally
  points to the 1819–20 Swiss intake — the cohort recruited under Dom João VI's 1818 decree, of
  whom roughly a quarter died on the voyage and the survivors received stony highland lots. That
  places her father, and by extension her childhood, in the colony's founding generation rather
  than the 1824 German one. It is a reading of the word, not a documented arrival.

  - **[INFERRED]** Because her father's origin is Swiss and her husband's family German, the
  "German colony family" label that fits the Schenkels does not simply extend to her. This
  archive's earlier working assumption that the whole Klein/Schenkel/Stoffel trunk was
  German-Hessen is wrong at the Stoffel branch, and correcting it is the main analytical value
  she carries.

  - **[CONTEXTUAL / INFERRED]** She died young enough to miss her daughter's wedding, in a
  colony where the founding generation's mortality was high and the second generation's lots
  were already subdivided. Nothing in the record explains the death, and nothing should be
  invented to explain it; the bracket 1847–1872 is what the evidence gives.

  ## Open questions

  - Her birth and baptism, and her exact death date — none held. The Nova Friburgo Lutheran
  register is the first place to look for all three. [OPEN]

  - Her mother, entirely unnamed in the 1847 act. [OPEN]

  - Her father's Swiss canton and his arrival, which would fix whether the Stoffels came in
  1819–20 or later. [OPEN]

  - Her nationality, left unset on purpose pending a record that states her birthplace. [OPEN by
  decision]

  ## Sources held (this repository)

  - **PAR-0067** — her own 1847 Lutheran marriage to Conrad Schenkel at Nova Friburgo; names
  her, describes her as an unmarried daughter, and names her father expressly as a Swiss
  colonist.

  - **PAR-0068** — her daughter Maria Luiza's 1872 Lutheran marriage to Jacob Klein; names her
  as the late mother, "der verstorbenen Maria Luisa geb. Stoffel".

  ## Regional and migration context

  Nova Friburgo began as a Swiss Catholic settlement decreed by Dom João VI on 16 May 1818 and
  became, after the German intake of May 1824, a town with two churches and two registers. The
  Stoffel case shows that the split was not clean: a family recorded as Swiss appears in the
  German Lutheran books, married to a German colonist's son. [CONTEXTUAL / PROVEN] Both
  migrations were driven out of Europe by the same conditions — the 1816–17 harvest failures,
  post-Napoleonic impoverishment, and land too fragmented to support the next generation — and
  both were settled on the same poor serra lots, which many colonists abandoned within a few
  years. [CONTEXTUAL]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation, where she married Conrad Schenkel on 3
  February 1847 — the one fixed event of her life, and the place where her birth and death
  entries would also be, if they exist. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colonist lots — including whichever one her Swiss father held —
  were laid out. [APPROX]

  - **Switzerland — canton unlocated.** Her father is called a Swiss colonist but no canton or
  parish is given, so there is no origin place to name. Identifying Joseph Stoffel on a colonist
  lot or ship list is the prerequisite. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu assento de casamento de 1847 contém a palavra mais valiosa de todo este
  conjunto de perfis: o pai dela é "dem **Schweizer** Colonisten Joseph [St]offel". Um documento
  declara abertamente a origem suíça dele. Em todo o resto deste grupo, a origem suíça ou alemã
  precisa ser argumentada a partir de um nome de freguesia, ou fica em aberto — aqui está
  escrita. (PAR-0067)

  - **[PROVEN]** Ela casou-se dentro da congregação luterana de língua alemã sendo filha de um
  colono suíço. A linha confessional e a linha nacional da colônia não passavam pelo mesmo
  lugar, e seu casamento é a demonstração mais clara disso nas evidências retidas.

  - **[PROVEN]** Estava morta em abril de 1872: o assento de casamento da filha a chama "der
  verstorbenen Maria Luisa geb. Stoffel", enquanto o marido é nomeado sem esse qualificador.
  Morreu em algum ponto dos vinte e cinco anos entre o próprio casamento e o da filha.
  (PAR-0068)

  - **[PROVEN]** Ela é registrada sob duas formas do mesmo nome — "Louisa Stoffel" como noiva em
  1847, "Maria Luisa geb. Stoffel" como mãe falecida em 1872 —, e a filha recebeu novamente o
  mesmo nome. Três gerações de Marias Luizas atravessam esta linha.

  ## Identidade

  **Maria Luiza Stoffel**, registrada em seu casamento como **Louisa Stoffel** — filha de um
  colono suíço, esposa de Conrad Schenkel, mãe de Maria Luiza Schenkel (P-0104). Trisavó de Iris
  Bohrer Muniz (P-0007), pela cadeia Maria Luiza Schenkel → Carolina Klein (P-0029) → João
  Gonçalves Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Casamento:** com Conrad Schenkel (P-0107) em 3 de fevereiro de 1847, na igreja luterana de
  Nova Friburgo, registrada como "Louisa [St]offel, ehel[iche] ledige Tochter von dem Schweizer
  Colonisten Joseph [St]offel"; testemunhas Gustav e Paul Lenenroth, ambos comerciantes.
  (PAR-0067, evento E-0091) [PROVEN]

  - **Pai:** Joseph Stoffel (P-0114), expressamente colono suíço; família F-0057. Sua mãe não é
  nomeada em nenhum documento retido. [PROVEN quanto ao pai; a mãe está OPEN]

  - **Óbito:** antes de 29 de abril de 1872, quando o assento de casamento da filha a registra
  como falecida. [PROVEN quanto ao intervalo; a data está OPEN]

  - **Nascimento e batismo:** não documentados. [OPEN]

  - **Nacionalidade:** deixada em aberto neste arquivo. A origem suíça do pai é declarada, a
  dela não, e a mãe não está registrada — de modo que o campo fica deliberadamente vazio, e não
  presumido. [OPEN por decisão]

  ## Posição social e profissão

  Nada está registrado a seu respeito: nenhuma ocupação, propriedade, alfabetização ou
  assinatura. A única palavra descritiva de seu assento pertence ao pai — *Colonist* — e
  descreve o estatuto jurídico dele no programa de colonização, não a vida dela. O que o ato
  estabelece é que ela se casou como *ledige Tochter*, filha solteira, ainda em vida do pai.

  ## Família e rede social

  Seu casamento ligou a vertente Stoffel à família Schenkel e, por meio dela, aos Klein e depois
  aos Bohrer. [PROVEN] O marido, Conrad Schenkel, era filho do *Kirchenvorsteher* da
  congregação, Heinrich Schenkel, de modo que a união colocou a filha de um colono suíço no
  domicílio de um presbítero luterano — o mais próximo de uma ascensão que as evidências retidas
  registram para alguém deste grupo, e ainda assim um casamento dentro da mesma pequena
  congregação. [PROVEN — PAR-0067]

  A filha, Maria Luiza Schenkel, nascida por volta de 1851, casou-se com Jacob Klein em 1872; a
  essa altura a mãe estava morta e o pai não. [PROVEN — PAR-0068]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** "Schweizer Colonist", num livro de Nova Friburgo de 1847, aponta com mais
  naturalidade para a entrada suíça de 1819–20 — a coorte recrutada sob o decreto de 1818 de Dom
  João VI, da qual cerca de um quarto morreu na viagem e cujos sobreviventes receberam lotes
  serranos pedregosos. Isso situa o pai dela, e por extensão sua infância, na geração fundadora
  da colônia, e não na alemã de 1824. É leitura da palavra, não chegada documentada.

  - **[INFERRED]** Como a origem do pai é suíça e a família do marido é alemã, o rótulo de
  "família alemã da colônia", que serve aos Schenkel, não se estende sem mais à vertente dela. A
  hipótese de trabalho anterior deste arquivo, de que todo o tronco Klein/Schenkel/Stoffel seria
  alemão-hessiano, está errada no ramo Stoffel, e corrigi-la é o principal valor analítico que
  ela carrega.

  - **[CONTEXTUAL / INFERRED]** Ela morreu cedo o bastante para não ver o casamento da filha,
  numa colônia em que a mortalidade da geração fundadora era alta e os lotes da segunda geração
  já estavam subdivididos. Nada no registro explica a morte, e nada deve ser inventado para
  explicá-la; o intervalo 1847–1872 é o que as evidências oferecem.

  ## Questões em aberto

  - Seu nascimento e batismo, e sua data exata de óbito — nada retido. O livro luterano de Nova
  Friburgo é o primeiro lugar a procurar pelos três. [OPEN]

  - Sua mãe, inteiramente sem nome no assento de 1847. [OPEN]

  - O cantão suíço do pai e sua chegada, o que fixaria se os Stoffel vieram em 1819–20 ou
  depois. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito, à espera de um documento que declare seu
  local de nascimento. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0067** — seu próprio casamento luterano de 1847 com Conrad Schenkel, em Nova Friburgo;
  nomeia-a, descreve-a como filha solteira e nomeia seu pai expressamente como colono suíço.

  - **PAR-0068** — casamento luterano de 1872 da filha Maria Luiza com Jacob Klein; nomeia-a
  como mãe falecida, "der verstorbenen Maria Luisa geb. Stoffel".

  ## Contexto regional e migratório

  Nova Friburgo começou como povoamento católico suíço, decretado por Dom João VI em 16 de maio
  de 1818, e tornou-se, depois da entrada alemã de maio de 1824, uma vila com duas igrejas e
  dois conjuntos de livros. O caso Stoffel mostra que a divisão não era limpa: uma família
  registrada como suíça aparece nos livros luteranos alemães, casada com o filho de um colono
  alemão. [CONTEXTUAL / PROVEN] As duas migrações foram empurradas para fora da Europa pelas
  mesmas condições — as quebras de safra de 1816–17, o empobrecimento pós-napoleônico e a terra
  fragmentada demais para sustentar a geração seguinte — e ambas foram assentadas nos mesmos
  lotes serranos pobres, que muitos colonos abandonaram em poucos anos. [CONTEXTUAL]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, onde ela se casou com Conrad Schenkel em
  3 de fevereiro de 1847 — o único evento fixo de sua vida, e onde também estariam seus assentos
  de nascimento e óbito, se existirem. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde foram demarcados os lotes de colono — inclusive aquele que seu
  pai suíço tenha detido. [APPROX]

  - **Suíça — cantão não localizado.** O pai é chamado de colono suíço, mas nenhum cantão ou
  freguesia é indicado, de modo que não há lugar de origem a nomear. Identificar Joseph Stoffel
  numa lista de lotes ou de navio é o pré-requisito. [UNLOCATED]
