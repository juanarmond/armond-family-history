profile: >-
  ## Identity

  **Maria Luiza Stoffel** (also recorded as **Louisa Stoffel**) — daughter of the Swiss colonist
  Joseph Stoffel (P-0114), who married Conrad Schenkel at the Nova Friburgo Lutheran church
  in 1847. [PROVEN]

  - **Role:** mother of Maria Luiza Schenkel (P-0104) and wife of Conrad Schenkel (P-0107;
  family F-0053); daughter of Joseph Stoffel (P-0114; family F-0057). Iris Bohrer Muniz's
  4×-great-grandmother on the Schenkel/Stoffel line. [PROVEN]

  - **Marriage:** married Conrad Schenkel on 3 February 1847 at the Nova Friburgo Lutheran
  church (PAR-0067, event E-0091), recorded as "Louisa [St]offel, eheliche ledige Tochter
  von dem Schweizer Colonisten Joseph [St]offel". [PROVEN]

  - **Deceased by 1872:** her daughter's 1872 Lutheran marriage (PAR-0068) names her as
  "verstorbenen Maria Luisa geb. Stoffel", confirming she had died before that date. [PROVEN]

  ## Family

  Her father Joseph Stoffel is expressly recorded as "dem Schweizer Colonisten" — a Swiss
  colonist — in the 1847 marriage (PAR-0067). Her mother is not named in any held record. Her
  own nationality is unset (her mother is unrecorded), though the stated Swiss origin of her
  father points toward a Swiss strand in the Stoffel line. [PROVEN for father's Swiss origin;
  mother and nationality OPEN/INFERRED-CONTEXTUAL]

  ## Open questions

  - Her birth date, baptism, death date, and mother are not documented. [OPEN]

  ## Sources held (this repository)

  - PAR-0067 (her 1847 Lutheran marriage to Conrad Schenkel — names her and her father
  Joseph Stoffel as a Swiss colonist).

  - PAR-0068 (her daughter's 1872 Lutheran marriage — names her as the late mother).
profile_pt: >-
  ## Identidade

  **Maria Luiza Stoffel** (também registrada como **Louisa Stoffel**) — filha do colono suíço
  Joseph Stoffel (P-0114), que se casou com Conrad Schenkel na igreja luterana de Nova Friburgo
  em 1847. [PROVEN]

  - **Papel:** mãe de Maria Luiza Schenkel (P-0104) e esposa de Conrad Schenkel (P-0107;
  família F-0053); filha de Joseph Stoffel (P-0114; família F-0057). Tetravó de Iris Bohrer
  Muniz nas linhas Schenkel/Stoffel. [PROVEN]

  - **Casamento:** casou-se com Conrad Schenkel em 3 de fevereiro de 1847 na igreja luterana
  de Nova Friburgo (PAR-0067, evento E-0091), registrada como "Louisa [St]offel, eheliche
  ledige Tochter von dem Schweizer Colonisten Joseph [St]offel". [PROVEN]

  - **Falecida antes de 1872:** o casamento luterano de 1872 de sua filha (PAR-0068) nomeia-a
  como "verstorbenen Maria Luisa geb. Stoffel", confirmando que havia falecido antes daquela
  data. [PROVEN]

  ## Família

  Seu pai Joseph Stoffel é expressamente registrado como "dem Schweizer Colonisten" — colono
  suíço — no casamento de 1847 (PAR-0067). Sua mãe não é nomeada em nenhum registro. Sua
  própria nacionalidade não está definida (a mãe não está documentada), embora a origem suíça
  declarada do pai aponte para uma vertente suíça na linha Stoffel. [PROVEN para a origem suíça
  do pai; mãe e nacionalidade OPEN/INFERRED-CONTEXTUAL]

  ## Questões em aberto

  - Sua data de nascimento, batismo, data de óbito e mãe não estão documentados. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0067 (seu casamento luterano de 1847 com Conrad Schenkel — nomeia-a e a seu pai
  Joseph Stoffel como colono suíço).

  - PAR-0068 (casamento luterano de 1872 de sua filha — nomeia-a como mãe falecida).
