  ## Contexto regional e migratório


  Um lar Azevedo do **eixo São Paulo do Muriaé / Carangola** da Zona da Mata Mineira. [CONTEXTUAL]
  Ele está documentado no Bom Jesus da Cachoeira Alegre em 1898 (PRB-0014) e, por identificação
  forte, em 1908 (FAN-0018); sua viúva estava em Carangola em 1916 (CIV-0006). Nada anterior a
  1890 está documentado para ele. A família da esposa veio do Minho (PAR-0108, PRB-0013), mas
  isso nada diz sobre a origem dele: nenhuma origem madeirense, açoriana, minhota ou outra portuguesa
  está documentada para ele; o fio insular nos registros ao redor pertence a uma colateral de
  Carangola sem parentesco provado (a Francisca d'Azevedo nascida na Madeira) e permanece pista;
  o nascimento português da testemunha do testamento Domingos Affonso de Azevedo [ou Azeredo]
  Maia (PRB-0013) é daquele homem, não dele; e nenhuma origem é inferida do sobrenome. [OPEN]
  A economia em que viveu funcionava sobre a transição para o trabalho livre pós-1850 — a Lei
  nº 581 de 1850 (Lei Eusébio de Queirós), que encerrou o tráfico atlântico, a abolição pela Lei
  Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850). Fica superada
  a afirmação anterior de que esse era "um mercado em que sua família nunca entrou": em 1908 ele
  detinha ou lavrava terra no Bom Jesus, em termos que o registro não declara (FAN-0018). [CONTEXTUAL]


