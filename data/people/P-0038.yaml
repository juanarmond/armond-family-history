profile: >-
  ## Interesting facts

  - **[PROVEN]** He exists in this archive only as somebody else's father. Three held records name him — his daughter Luiza's 1916 civil and parish marriage (CIV-0001, PAR-0012) and his grandson Aristides's 1922 baptism (PAR-0003) — and in each he is a filiation line, never a party, a declarant or a signatory.

  - **[PROVEN]** His given name was settled by the parish copy against the civil one. The handwritten 1916 civil inteiro teor reads "Sebastião [uncertain: Manoel] de Azevedo" (CIV-0006); the parish act of the *same wedding* reads "Secundino Maria de Azevedo" (PAR-0012), matching the 2004 civil certificate (CIV-0001) and the fuller "José Secundino" of the 1922 baptism (PAR-0003). A clean parish register corrected a low-contrast civil photocopy.

  - **[PROVEN]** A fourth attestation, fifty-nine years later, garbles him again: his daughter Alcida's 1975 Mesquita death gives "Ascendino Maria de Azevedo" (CIV-0051), reported by a non-relative declarant. The variant is preserved and does not override the three near-contemporary readings.

  - **[INFERRED]** He is absent from every property, court and press index searched. A full-text sweep of a 144-comarca Minas court index returns zero hits for "Secundino"; the Arquivo Público Mineiro *Registro Paroquial de Terras* for Leopoldina and São Paulo do Muriaé carries no Fernandes de Azevedo. The land negative is only partly probative — those registers captured landholders of about 1854–58, and he was active twenty years later — but the court and press negatives are not, and together they are the strongest evidence available that he held no property worth litigating over.

  - **[CONTEXTUAL]** He died before October 1916, having lived his adult life through the Zona da Mata's two hardest transitions: the end of enslaved labour (Lei Áurea, 1888) and the coffee price collapses of the 1890s. A tenant or day-labouring household had no reserve against either.

  ## Identity

  Two documented forms of the same man: **José Secundino de Azevedo** (Aristides's 1922 baptism, PAR-0003) and **Secundino Maria de Azevedo** (the 1916 civil and parish marriage, CIV-0001 and PAR-0012). [PROVEN] A third, **Ascendino Maria de Azevedo**, is a 1975 informant variant (CIV-0051) and is preserved as such.

  - **Relationship:** maternal grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs José Secundino → Luiza Fernandes de Azevedo (P-0013) → Antenor. Head of the Azevedo trunk (family F-0018) that married into the Muniz line. [derived from families F-0018 and F-0001]

  - **Spouse:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Daughters:** **Luiza** (P-0013), born at Bom Jesus de Cachoeira Alegre, district of São Paulo do Muriaé, about 1898, who married Deocleciano Muniz Bittencourt in 1916 (CIV-0001, PAR-0012) [PROVEN]; **Alcida Fernandes de Azevedo**, born about 1895 in Minas Gerais, who died a widow at Mesquita, RJ, on 20 May 1975 (CIV-0051) [PROVEN]; and **Gloria Lacerda de Azevedo**, who died at Niterói, RJ, on 9 May 1960 (óbito nº 26.483 — read from the retrieval drop, **not yet catalogued as a source in this repository**).

  - **Death:** before 21 October 1916 [PROVEN] — the full-content act of Luiza's marriage records her father "já fallecido" while her mother Thereza was "residente neste districto" (CIV-0006), and the parish act identifies that father as Secundino (PAR-0012). His own death record, with the exact date and place, is not held. [OPEN]

  - **Birth and parents:** undocumented. [OPEN — the single hardest gap on this side of the tree]

  ## Standing and profession

  No occupation, title, office or property is attested for him in any held record — a negative that holds across three independent acts spanning 1916 to 1975. [PROVEN as a negative across the held set] The indirect read is consistent: his daughter Luiza is recorded *doméstica* and explicitly illiterate in 1916 (CIV-0006), and the household leaves no probate, land register or press trace. That pattern fits a small tenant, sharecropper or day-labourer of the Muriaé district rather than a proprietário. [INFERRED] His own literacy is undocumented; he is never recorded signing anything. [OPEN]

  ## Family and social network

  Father-in-law of Deocleciano Muniz Bittencourt (P-0012) through Luiza, and named maternal grandfather in his grandchildren's records (Aristides, 1922, PAR-0003). Three daughters are documented (Luiza, Alcida, Gloria); the count is otherwise open, since no parental death certificate or inventário exists to give a total. Alcida is recorded as the widow of a **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; that this Manoel was Deocleciano's brother — which would make two of his daughters the wives of two Muniz Bittencourt brothers — is a research-profile reading and remains a **[LEAD]**. A 1913 Santa Luzia de Carangola parish death of an infant "Maria, filha legitima de José [uncertain: Secundino] d'Azevedo", recorded "em casa de seu pae", places a man of that name at Carangola in 1913 and would imply a late-born daughter; the mother is unnamed and the middle name is a cursive read, so it stays a **[LEAD]**.

  ## What we can extrapolate

  **1. His invisibility is the class evidence, and it is a finding rather than a failure. [INFERRED / CONTEXTUAL]** Propertied men of the Zona da Mata generate paper: inventários, land registers, credit suits, tax rolls, newspaper notices. He generates none, across every index searched, and surfaces only where a priest or a registrar had to write down whose child somebody was. That is close to a definition of the non-proprietário. The corroborating detail is his daughter's illiteracy, stated in her own marriage act — a household that could not buy a daughter's letters was not a household with a plot to leave her.

  **2. No capital in any transmissible form. [INFERRED]** Nineteenth-century wealth took three shapes — land, which is heritable; office, which ends with the appointment; and credit or commerce, which lives and dies with the regional economy. He shows none of the three. His only asset was labour, and labour transmits nothing but itself. This puts the Azevedo one clear rung below the Muniz smallholders his daughter married into, and it is a different kind of poverty from theirs: the Muniz emigrated because too many sons were dividing too little land, whereas the Azevedo story begins with no land to divide.

  **3. Partible inheritance never touched this family, which is exactly the point. [INFERRED / CONTEXTUAL]** Brazilian law split estates equally among all children and could pulverise a decent holding in two generations. That mechanism — the one that explains the descent of better-off branches of this tree — has no purchase here, because the precondition is missing. Nothing was fragmented; nothing was there. What the Azevedo actually transmitted was the compound surname **Fernandes de Azevedo**, which is doing the work a title deed does in a wealthier line: it is the one marker that lets three daughters in three different cartórios be recognised as siblings sixty years apart.

  **4. Education was purchased, and this household never bought it. [CONTEXTUAL]** There was no free rural schooling; literacy was a class-linked good re-bought each generation. His daughter's 1916 act records that she could not read or write while her husband signed his own name — the price line drawn on a single page. Read carefully, that is not a decline in his family but a floor it never rose above.

  **5. Landlessness made the daughters mobile, and the mobility is documented. [INFERRED / CONTEXTUAL]** Within a generation of his death his daughters had reached the Rio de Janeiro metropolitan area — Gloria at Niterói (1960), Alcida in the Baixada Fluminense (1975) — and his grandson Antenor died at Volta Redonda in 2014 as an urban tradesman (CIV-0028). This is the Brazilian rural exodus, and the family's poverty is what made it frictionless: a household with no land loses nothing by leaving. Note the honest correction inside this reading: an earlier version of the Azevedo story had a daughter dying at Niterói in 1900, which would have put the family in Rio a generation before the Muniz; the 1900 date was an index misparse of Gloria's 1960 death, and no pre-1950 Rio presence is documented.

  **6. What his case actually implies for the research. [INFERRED]** He will never be found in an inventário of his own, because he had no estate to inventory. If he is found at all it will be as a named party in someone else's civil act — an heir list, a tutela, a justificação — or through his widow, who outlived him. That inversion, treating the absence of records as a class fact and then hunting him in other people's paperwork, is the only realistic route to the generation above.

  ## Open questions

  - His parents — the primary gap. A FamilySearch sweep constrained by spouse returned no persona that is him, and his tree node carries no parents and no sources, so the generation above is off-tool; the realistic levers are Minas court-archive processes in the Leopoldina axis (an 1870 arrolamento and a 1924 tutela among them) whose heir lists could name him. [OPEN]

  - His own birth, marriage and death records — none located; a São Paulo do Muriaé / Cachoeira Alegre parish or civil register, roughly 1855–1900, is the target. [OPEN]

  - Whether the Carangola "Fernandes de Azevedo" cluster of the same years is kin. [OPEN — LEAD]

  ## Sources held (this repository)

  - PAR-0012 (1916 parish marriage of Luiza × Deocleciano — "Secundino Maria de Azevedo"; resolves his given name) · CIV-0001 (the 1916 civil marriage, same union) · CIV-0006 (the 1916 full-content civil marriage — records him already deceased; its "Sebastião" reading is the misread resolved by PAR-0012).

  - PAR-0003 (his grandson Aristides's 1922 baptism — "José Secundino de Azevedo", maternal grandfather) · CIV-0051 (1975 Mesquita death of his daughter Alcida — the "Ascendino" variant, and a documented second daughter).

  ## Regional and migration context

  An Azevedo household of the **São Paulo do Muriaé / Carangola axis** of the Zona da Mata Mineira. [CONTEXTUAL] His daughter's hamlet-level birthplace at Bom Jesus de Cachoeira Alegre and the family's presence at Carangola by the 1910s place him in that micro-region; anything before it is undocumented. The economy he lived in ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de Queirós) ending the Atlantic slave trade, abolition under the Lei Áurea (1888), and land put on a purchase basis by the Lei de Terras (nº 601, 1850) — a market his family never entered. [CONTEXTUAL] No Madeiran, Azorean or other Portuguese-island origin is documented for this line; the island thread in the surrounding records belongs to an unrelated Carangola collateral, and no origin is inferred from the surname. [OPEN]

  ## Where to go today

  - **Azevedo home / daughter Luiza's birthplace (1890s):** Paróquia São Paulo de Muriaé (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé), MG (Rua Dr Afonso Canedo 47, CEP 36880-000) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Par%C3%B3quia%20S%C3%A3o%20Paulo%2C%20Rua%20Dr%20Afonso%20Canedo%2047%2C%20Muria%C3%A9%20-%20MG)

  - **The family's later reach (daughter Gloria's death, 9 May 1960):** Niterói, RJ [APPROX — record read in the drop, not yet catalogued here] · [Maps](https://www.google.com/maps/search/?api=1&query=Niter%C3%B3i%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele existe neste arquivo apenas como pai de outrem. Três registros conservados o nomeiam — o casamento civil e paroquial de sua filha Luiza, em 1916 (CIV-0001, PAR-0012), e o batismo de seu neto Aristides, em 1922 (PAR-0003) — e em cada um ele é uma linha de filiação, nunca parte, declarante ou signatário.

  - **[PROVEN]** Seu prenome foi fixado pela cópia paroquial contra a civil. O inteiro teor civil manuscrito de 1916 lê "Sebastião [incerto: Manoel] de Azevedo" (CIV-0006); o ato paroquial do *mesmo casamento* lê "Secundino Maria de Azevedo" (PAR-0012), coincidindo com a certidão civil de 2004 (CIV-0001) e com o mais completo "José Secundino" do batismo de 1922 (PAR-0003). Um livro paroquial limpo corrigiu uma fotocópia civil de baixo contraste.

  - **[PROVEN]** Uma quarta atestação, cinquenta e nove anos depois, o deturpa outra vez: o óbito de sua filha Alcida, em 1975, em Mesquita, traz "Ascendino Maria de Azevedo" (CIV-0051), informado por declarante não parente. A variante é preservada e não sobrepõe as três leituras quase contemporâneas.

  - **[INFERRED]** Ele está ausente de todo índice de propriedade, judicial e de imprensa pesquisado. Uma varredura em texto integral de um índice judicial mineiro de 144 comarcas retorna zero ocorrências de "Secundino"; o *Registro Paroquial de Terras* do Arquivo Público Mineiro para Leopoldina e São Paulo do Muriaé não traz nenhum Fernandes de Azevedo. A negativa fundiária é só parcialmente probante — aqueles registros captaram proprietários de cerca de 1854–58, e ele esteve ativo vinte anos depois —, mas as negativas judicial e de imprensa não o são, e juntas constituem a evidência mais forte disponível de que ele não detinha propriedade que valesse litigar.

  - **[CONTEXTUAL]** Morreu antes de outubro de 1916, tendo vivido a vida adulta atravessando as duas transições mais duras da Zona da Mata: o fim do trabalho escravizado (Lei Áurea, 1888) e os colapsos do preço do café nos anos 1890. Um lar de arrendatário ou de diarista não tinha reserva alguma contra nenhuma das duas.

  ## Identidade

  Duas formas documentadas do mesmo homem: **José Secundino de Azevedo** (batismo de Aristides, 1922, PAR-0003) e **Secundino Maria de Azevedo** (casamento civil e paroquial de 1916, CIV-0001 e PAR-0012). [PROVEN] Uma terceira, **Ascendino Maria de Azevedo**, é variante de declarante em 1975 (CIV-0051) e é preservada como tal.

  - **Parentesco:** avô materno de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre José Secundino → Luiza Fernandes de Azevedo (P-0013) → Antenor. Cabeça do tronco Azevedo (família F-0018) que se casou na linha Muniz. [derivado das famílias F-0018 e F-0001]

  - **Esposa:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Filhas:** **Luiza** (P-0013), nascida em Bom Jesus de Cachoeira Alegre, distrito de São Paulo do Muriaé, por volta de 1898, que se casou com Deocleciano Muniz Bittencourt em 1916 (CIV-0001, PAR-0012) [PROVEN]; **Alcida Fernandes de Azevedo**, nascida por volta de 1895 em Minas Gerais, falecida viúva em Mesquita, RJ, em 20 de maio de 1975 (CIV-0051) [PROVEN]; e **Gloria Lacerda de Azevedo**, falecida em Niterói, RJ, em 9 de maio de 1960 (óbito nº 26.483 — lido no lote de recuperação, **ainda não catalogado como fonte neste repositório**).

  - **Óbito:** antes de 21 de outubro de 1916 [PROVEN] — o inteiro teor do casamento de Luiza registra o pai "já fallecido" enquanto a mãe Thereza estava "residente neste districto" (CIV-0006), e o ato paroquial identifica esse pai como Secundino (PAR-0012). Seu próprio registro de óbito, com data e local exatos, não é conservado. [OPEN]

  - **Nascimento e pais:** não documentados. [OPEN — a lacuna isolada mais difícil deste lado da árvore]

  ## Posição social e profissão

  Nenhuma ocupação, título, cargo ou propriedade lhe é atestada em qualquer registro conservado — uma negativa que se mantém em três atos independentes entre 1916 e 1975. [PROVEN como negativa no conjunto disponível] A leitura indireta é coerente: sua filha Luiza é registrada *doméstica* e explicitamente analfabeta em 1916 (CIV-0006), e o lar não deixa inventário, registro de terras ou rastro de imprensa. Esse padrão condiz com um pequeno arrendatário, meeiro ou diarista do distrito de Muriaé, não com um proprietário. [INFERRED] Sua própria alfabetização não está documentada; ele jamais aparece assinando coisa alguma. [OPEN]

  ## Família e rede social

  Sogro de Deocleciano Muniz Bittencourt (P-0012) por Luiza, e nomeado avô materno nos registros de seus netos (Aristides, 1922, PAR-0003). Três filhas estão documentadas (Luiza, Alcida, Gloria); a contagem permanece aberta, pois não há certidão de óbito nem inventário dos pais que dê um total. Alcida é registrada como viúva de um **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; que esse Manoel fosse irmão de Deocleciano — o que faria de duas de suas filhas as esposas de dois irmãos Muniz Bittencourt — é leitura do perfil de pesquisa e permanece **[LEAD]**. Um óbito paroquial de 1913, em Santa Luzia de Carangola, de uma criança "Maria, filha legitima de José [incerto: Secundino] d'Azevedo", registrado "em casa de seu pae", situa um homem desse nome em Carangola em 1913 e implicaria uma filha nascida tardiamente; a mãe não é nomeada e o nome do meio é leitura cursiva, de modo que permanece **[LEAD]**.

  ## O que podemos extrapolar

  **1. Sua invisibilidade é a evidência de classe, e é um achado, não um fracasso. [INFERRED / CONTEXTUAL]** Homens com propriedade na Zona da Mata geram papel: inventários, registros de terras, ações de crédito, rol de contribuintes, notas de jornal. Ele não gera nenhum, em todos os índices pesquisados, e só aparece onde um padre ou um escrivão teve de anotar de quem alguém era filho. Isso é quase a definição do não-proprietário. O detalhe corroborante é o analfabetismo da filha, declarado no próprio ato de casamento dela — um lar que não pôde comprar as letras de uma filha não era um lar com uma gleba a lhe deixar.

  **2. Nenhum capital em forma transmissível. [INFERRED]** A riqueza oitocentista tinha três formas — terra, que é herdável; cargo, que acaba com a nomeação; e crédito ou comércio, que vive e morre com a economia regional. Ele não apresenta nenhuma das três. Seu único ativo era o trabalho, e o trabalho nada transmite além de si. Isso coloca os Azevedo um degrau claro abaixo dos pequenos proprietários Muniz nos quais a filha se casou, e é uma pobreza de outra natureza que a deles: os Muniz emigraram porque filhos demais dividiam terra de menos, ao passo que a história Azevedo começa sem terra a dividir.

  **3. A herança partível nunca tocou esta família, e é exatamente esse o ponto. [INFERRED / CONTEXTUAL]** A lei brasileira dividia os espólios igualmente entre todos os filhos e podia pulverizar uma posse razoável em duas gerações. Esse mecanismo — o que explica a descida de ramos mais abastados desta árvore — não tem onde pegar aqui, porque falta a precondição. Nada foi fragmentado; nada havia. O que os Azevedo de fato transmitiram foi o sobrenome composto **Fernandes de Azevedo**, que faz o trabalho de uma escritura numa linha mais rica: é o único marcador que permite reconhecer três filhas, em três cartórios distintos, como irmãs com sessenta anos de intervalo.

  **4. A educação era comprada, e este lar nunca a comprou. [CONTEXTUAL]** Não havia escola rural pública; a alfabetização era um bem ligado à classe, recomprado a cada geração. O ato de 1916 de sua filha registra que ela não sabia ler nem escrever enquanto o marido assinava o próprio nome — a linha de preço traçada numa só página. Lida com cuidado, não é um declínio em sua família, mas um piso do qual ela nunca subiu.

  **5. A falta de terra tornou as filhas móveis, e a mobilidade está documentada. [INFERRED / CONTEXTUAL]** Numa geração após sua morte, as filhas haviam alcançado a região metropolitana do Rio de Janeiro — Gloria em Niterói (1960), Alcida na Baixada Fluminense (1975) — e seu neto Antenor morreu em Volta Redonda em 2014 como artífice urbano (CIV-0028). É o êxodo rural brasileiro, e a pobreza da família é o que o tornou sem atrito: um lar sem terra nada perde ao partir. Registre-se a correção honesta dentro desta leitura: uma versão anterior da história Azevedo tinha uma filha falecendo em Niterói em 1900, o que poria a família no Rio uma geração antes dos Muniz; a data de 1900 era um erro de leitura de índice do óbito de Gloria em 1960, e nenhuma presença no Rio anterior a 1950 está documentada.

  **6. O que seu caso de fato implica para a pesquisa. [INFERRED]** Ele jamais será encontrado num inventário próprio, porque não tinha espólio a inventariar. Se for encontrado, será como parte nomeada no ato civil de outra pessoa — uma lista de herdeiros, uma tutela, uma justificação — ou por sua viúva, que o sobreviveu. Essa inversão, tratar a ausência de registros como fato de classe e então caçá-lo na papelada alheia, é a única rota realista para a geração acima.

  ## Questões em aberto

  - Seus pais — a lacuna principal. Uma varredura no FamilySearch constrangida pela esposa não retornou persona alguma que seja ele, e seu nó na árvore não traz pais nem fontes, de modo que a geração acima está fora de alcance das ferramentas; as alavancas realistas são processos do arquivo judiciário mineiro no eixo de Leopoldina (um arrolamento de 1870 e uma tutela de 1924, entre outros) cujas listas de herdeiros poderiam nomeá-lo. [OPEN]

  - Seus próprios registros de nascimento, casamento e óbito — nenhum localizado; o alvo é um registro paroquial ou civil de São Paulo do Muriaé / Cachoeira Alegre, entre cerca de 1855 e 1900. [OPEN]

  - Se o aglomerado "Fernandes de Azevedo" de Carangola dos mesmos anos é parentela. [OPEN — LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0012 (casamento paroquial de 1916 de Luiza × Deocleciano — "Secundino Maria de Azevedo"; resolve seu prenome) · CIV-0001 (o casamento civil de 1916, mesma união) · CIV-0006 (o casamento civil de 1916 em inteiro teor — registra-o já falecido; sua leitura "Sebastião" é o erro resolvido por PAR-0012).

