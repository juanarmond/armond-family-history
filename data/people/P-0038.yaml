  ## Contexto regional e migratório

  Um lar Azevedo do **eixo São Paulo do Muriaé / Carangola** da Zona da Mata Mineira. [CONTEXTUAL] O local de nascimento de sua filha, em nível de povoado, em Bom Jesus de Cachoeira Alegre, e a presença da família em Carangola já nos anos 1910 o situam nessa micro-região; qualquer coisa anterior não está documentada. A economia em que viveu funcionava sobre a transição para o trabalho livre pós-1850 — a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que encerrou o tráfico atlântico, a abolição pela Lei Áurea (1888) e a terra posta em base de compra pela Lei de Terras (nº 601, 1850) — um mercado em que sua família nunca entrou. [CONTEXTUAL] Nenhuma origem madeirense, açoriana ou de outra ilha portuguesa está documentada para esta linha; o fio insular nos registros ao redor pertence a uma colateral de Carangola sem parentesco provado, e nenhuma origem é inferida do sobrenome. [OPEN]

