profile: >-
  ## Interesting facts

  - **[INFERRED]** He is invisible in every probate, land-registry and press record searched — surfacing only in his children's baptisms and his daughter's marriage registration. In the Zona da Mata, the propertied left inventários and land records; a man who leaves none was almost certainly a tenant, sharecropper or day-labourer.

  - **[CONTEXTUAL]** The Zona da Mata Mineira in the 1880s–1910s was going through the traumatic transition from enslaved to free labour (Lei Áurea 1888), then the crash of global coffee prices in the 1890s. Small tenant families like the Azevedo had no economic buffer against these shocks — they were the ones who moved when the land couldn't support them.

  - **[PROVEN]** His given name was resolved through the 1916 parish marriage record (PAR-0012): confirmed as "Secundino Maria de Azevedo," which corrects a misread "Sebastião" from the handwritten civil inteiro-teor (CIV-0006) — a case where a cleaner parish copy corrects a smudged civil copy.

  - **[INFERRED]** His daughter Luiza was born at "Bom Jesus da Cachoeira Alegre, distrito de São Paulo do Muriaé" (about 1898) — a hamlet-level birthplace that indicates the family was living in the rural interior of the Muriaé district, not in any town or market centre, pinpointing his probable location in the 1890s.

  - **[CONTEXTUAL]** The Carangola region that this family later reached was itself going through the same coffee-economy decline: the abolition of slavery (1888) had disrupted the labour supply and global overproduction was eroding prices, sending landless families like the Azevedo toward industrial employment.

  ## Identity

  Two documented forms of the same man: **José Secundino de Azevedo** (Aristides's 1922
  baptism, PAR-0003) and **Secundino Maria de Azevedo** (the 1916 civil and parish
  marriage, CIV-0001 and PAR-0012). [PROVEN] The parish marriage act (PAR-0012) settled his
  given name and confirmed that the "Sebastião [Manoel]" of the 2019 civil inteiro-teor
  (CIV-0006) was a misread.

  - **Role:** father of Luiza (Fernandes/Secundina) de Azevedo (P-0013), hence Antenor Muniz's maternal
  grandfather; head of the Azevedo trunk (family F-0018) that
  married into the Muniz line. [PROVEN]

  - **Spouse:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Daughter:** Luiza, born at Bom Jesus da Cachoeira Alegre, district of São Paulo do
  Muriaé (MG), about 1898 (aged 18 in 1916), who married Deocleciano Muniz Bittencourt in
  1916 (CIV-0001, PAR-0012). [PROVEN]

  - **Death:** before 21 October 1916 [PROVEN] — the full-content act of his daughter
  Luiza's 1916 marriage records her father "já fallecido" while her mother Thereza was
  "residente neste districto" (CIV-0006), and the parish act identifies that father as
  Secundino (PAR-0012). His own death record — with the exact date and place — is not held.
  [OPEN]

  - **Birth:** undocumented; his own vital records have not been located. [OPEN]

  - **Parents:** unknown — the single biggest gap on this side. [OPEN]

  ## Standing and profession

  Almost nothing is documented directly. His daughter Luiza is recorded as a doméstica and
  illiterate in 1916, consistent with a modest, non-landed rural family — the kind of
  household that surfaces only in the church and civil registrations of its children, not
  in probate or land registers. No occupation, title or property is attested for him.
  [INFERRED]

  ## Family and social network

  Father-in-law of Deocleciano Muniz Bittencourt (P-0012) through Luiza, and named maternal
  grandfather in the records of their children (e.g. Aristides, 1922, PAR-0003). Two further
  daughters beyond Luiza are now individually PROVEN: **Alcida Fernandes de Azevedo** (Luiza's
  sister), documented by her 1975 Mesquita death (CIV-0051), which renders his name as
  "Ascendino Maria de Azevedo" — a 1975 non-relative-informant variant, not overriding the
  1916/1922 attestations; and **Gloria Lacerda de Azevedo**, documented by her civil death
  (óbito Nº 26.483, 9 May 1960, Niterói, RJ — public image; the record names her father
  "Secundino de Azevedo"). [PROVEN] The earlier "d. 1900" date for Gloria was an index
  misparse, corrected 2026-09-14 after the death image was read. A 1913 Santa Luzia de
  Carangola infant death of a "Maria, filha legitima de José [Secundino] d'Azevedo" remains
  a lead. [LEAD]

  ## What we can extrapolate

  His invisibility is itself the class evidence. [INFERRED / CONTEXTUAL] He is absent from every
  court, land-registry and press index searched, and surfaces only in his children's baptisms
  and civil registrations. The propertied leave inventários, land registers, credit disputes and
  newspaper mentions; a man who leaves none of these is, almost by definition, not a
  proprietário — most likely a small tenant, sharecropper or day-labourer of the Zona da Mata
  (Muriaé / Cachoeira Alegre) from the 1870s to about 1900. His daughter Luiza's illiteracy and
  doméstica status (P-0013) corroborate the reading.

  He shows no capital in any transmissible form — the Azevedo floor. [INFERRED] The three forms
  of 19th-century capital were land (heritable), office (contingent) and commerce (tied to the
  economy); Secundino shows none of them, and his only asset — labour — transmits nothing but
  itself. That places the Azevedos a rung below the small-proprietor Muniz his daughter married
  into: where the Muniz emigration was surplus sons leaving too little land, the Azevedo story
  starts with no land at all.

  Gloria Lacerda de Azevedo's proven death in Niterói (9 May 1960) shows the family already
  reaching toward the Rio de Janeiro urban area — the landless-mobility pattern of a family
  with no property tethering it to any place. [INFERRED / CONTEXTUAL] In sum he reads as the
  archetype of the undocumented rural poor: no land, office, trade or schooling attested,
  visible only as a name in his children's records — which is exactly why his own parentage
  is the hardest gap on this side.

  ## Open questions

  - His parents — decisive record: an Azevedo probate or a Muriaé/Cachoeira Alegre parish
  or civil register naming him. [OPEN]

  - His own birth, marriage and death records — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0012 (1916 parish marriage of Luiza × Deocleciano — "Secundino Maria de Azevedo",
  resolves his given name) · CIV-0001 (the 1916 civil marriage, same union) · CIV-0006 (the
  1916 full-content civil marriage — records Luiza's father already deceased; its
  "Sebastião" given-name read is a low-contrast misread resolved to Secundino by PAR-0012) ·
  PAR-0003 (grandson Aristides's 1922 baptism — "José Secundino de Azevedo", maternal
  grandfather) · CIV-0051 (1975 Mesquita death of daughter Alcida Fernandes de Azevedo —
  names him "Ascendino Maria de Azevedo", a non-relative-informant variant).

  ## Regional and migration context

  An Azevedo family of the São Paulo do Muriaé / Carangola axis of the Zona da Mata Mineira
  coffee country. [CONTEXTUAL] His daughter's Cachoeira Alegre birthplace and the family's
  presence at Carangola by the 1910s place him in that micro-region; his origin before it
  is undocumented, and no island or Portuguese origin is asserted from the surname. The
  free-labour coffee economy the family moved within ran on the Lei nº 581 de 1850 (Lei Eusébio
  de Queirós), through abolition in the Lei Áurea (1888), with land under the Lei de Terras
  (nº 601, 1850); the direct line is documented only in the Zona da Mata MG, so no Atlantic
  crossing is asserted (the Madeira thread remains an open collateral lead only). [CONTEXTUAL]

  ## Where to go today

  - **Azevedo home / daughter Luiza's birthplace (1890s):** Paróquia São Paulo de
  Muriaé (Bom Jesus de Cachoeira Alegre / São Paulo do Muriaé), MG (Rua Dr Afonso
  Canedo 47, CEP 36880-000) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Par%C3%B3quia%20S%C3%A3o%20Paulo%2C%20Rua%20Dr%20Afonso%20Canedo%2047%2C%20Muria%C3%A9%20-%20MG)

  - **Family's connection to the Rio area (daughter Gloria's death, 9 May 1960):** Niterói,
  RJ [PROVEN] · [Maps](https://www.google.com/maps/search/?api=1&query=Niter%C3%B3i%2C%20RJ)
profile_pt: >-
  ## Fatos interessantes

  - **[INFERRED]** Ele é invisível em todos os registros de inventários, terras e imprensa pesquisados — aparecendo apenas nos batismos dos filhos e no registro de casamento da filha. Na Zona da Mata, os proprietários deixavam inventários e registros de terras; um homem que não deixa nenhum era quase certamente arrendatário, meeiro ou jornaleiro.

  - **[CONTEXTUAL]** A Zona da Mata Mineira nas décadas de 1880–1910 passava pela transição traumática do trabalho escravizado para o livre (Lei Áurea 1888), seguida do colapso dos preços globais do café na década de 1890. Famílias de pequenos arrendatários como os Azevedo não tinham reserva econômica contra esses choques — eram elas que se moviam quando a terra não podia mais sustentá-las.

  - **[PROVEN]** Seu prenome foi resolvido pelo registro paroquial de casamento de 1916 (PAR-0012): confirmado como "Secundino Maria de Azevedo", corrigindo um "Sebastião" mal lido no inteiro teor civil manuscrito (CIV-0006) — um caso em que uma cópia paroquial mais legível corrige uma cópia civil manchada.

  - **[INFERRED]** Sua filha Luiza nasceu em "Bom Jesus da Cachoeira Alegre, distrito de São Paulo do Muriaé" (por volta de 1898) — um local de nascimento a nível de aldeia que indica que a família vivia no interior rural do distrito de Muriaé, e não em nenhuma cidade ou centro comercial, localizando sua provável posição na década de 1890.

  - **[CONTEXTUAL]** A região de Carangola para a qual a família posteriormente se deslocou passava pelo mesmo declínio da economia cafeeira: a abolição da escravidão (1888) havia perturbado a oferta de mão de obra e a superprodução global corroía os preços, enviando famílias sem terra como os Azevedo em direção ao emprego industrial.

  ## Identidade

  Duas formas documentadas do mesmo homem: **José Secundino de Azevedo** (batismo de 1922 de
  Aristides, PAR-0003) e **Secundino Maria de Azevedo** (o casamento civil e paroquial de
  1916, CIV-0001 e PAR-0012). [PROVEN] O assento paroquial de casamento (PAR-0012) fixou seu
  prenome e confirmou que o "Sebastião [Manoel]" do inteiro teor civil de 2019 (CIV-0006)
  foi um erro de leitura.

  - **Papel:** pai de Luiza (Fernandes/Secundina) de Azevedo (P-0013), portanto avô materno
  de Antenor Muniz; chefe do tronco Azevedo (família F-0018) que se uniu à linha
  Muniz. [PROVEN]

  - **Cônjuge:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Filha:** Luiza, nascida em Bom Jesus da Cachoeira Alegre, distrito de São Paulo do
  Muriaé (MG), por volta de 1898 (18 anos em 1916), que se casou com Deocleciano Muniz
  Bittencourt em 1916 (CIV-0001, PAR-0012). [PROVEN]

  - **Óbito:** antes de 21 de outubro de 1916 [PROVEN] — a certidão de inteiro teor do
  casamento de 1916 de sua filha Luiza registra o pai dela "já fallecido", enquanto a mãe
  Thereza estava "residente neste districto" (CIV-0006), e o assento paroquial identifica
  esse pai como Secundino (PAR-0012). Seu próprio registro de óbito — com a data e o local
  exatos — não é conservado. [OPEN]

  - **Nascimento:** não documentado; seus próprios registros vitais não foram localizados.
  [OPEN]

  - **Pais:** desconhecidos — a maior lacuna deste lado. [OPEN]

  ## Posição social e profissão

  Quase nada está documentado diretamente. Sua filha Luiza é registrada como doméstica e
  analfabeta em 1916, coerente com uma família rural modesta e sem terras — o tipo de casa
  que só aparece nas registrações eclesiásticas e civis dos filhos, não em inventários ou
  registros de terras. Nenhuma ocupação, título ou propriedade lhe é atestada. [INFERRED]

  ## Família e rede social

  Sogro de Deocleciano Muniz Bittencourt (P-0012) por meio de Luiza, e nomeado avô materno
  nos registros dos filhos deles (p.ex. Aristides, 1922, PAR-0003). Duas filhas além de Luiza
  estão agora individualmente PROVADAS: **Alcida Fernandes de Azevedo** (irmã de Luiza),
  documentada por seu óbito de 1975 em Mesquita (CIV-0051), que grafa o nome dele como
  "Ascendino Maria de Azevedo" — variante de declarante não parente em 1975, sem sobrepor as
  atestações de 1916/1922; e **Gloria Lacerda de Azevedo**, documentada por seu óbito civil
  (óbito Nº 26.483, 9 de maio de 1960, Niterói, RJ — imagem pública; o registro nomeia seu
  pai "Secundino de Azevedo"). [PROVEN] A data anterior "f. 1900" para Gloria era um erro de
  análise de índice, corrigido em 2026-09-14 após a leitura da imagem do óbito. Um óbito de
  criança de 1913 em Santa Luzia de Carangola, de uma "Maria, filha legitima de José
  [Secundino] d'Azevedo", permanece pista. [LEAD]

  ## O que podemos extrapolar

  Sua invisibilidade é, ela mesma, a evidência de classe. [INFERRED / CONTEXTUAL] Ele está
  ausente de todo índice judicial, fundiário e de imprensa pesquisado, e só aparece nos batismos
  e registros civis de seus filhos. Os proprietários deixam inventários, registros de terras,
  disputas de crédito e menções na imprensa; um homem que não deixa nenhum desses é, quase por
  definição, não um proprietário — muito provavelmente um pequeno arrendatário, meeiro ou
  jornaleiro da Zona da Mata (Muriaé / Cachoeira Alegre) dos anos 1870 até cerca de 1900. O
  analfabetismo e a condição de doméstica de sua filha Luiza (P-0013) corroboram a leitura.

  Ele não mostra capital em nenhuma forma transmissível — o piso Azevedo. [INFERRED] As três
  formas de capital do século XIX eram terra (herdável), ofício (contingente) e comércio (ligado
  à economia); Secundino não mostra nenhuma delas, e seu único ativo — o trabalho — não transmite
  nada além de si mesmo. Isso coloca os Azevedo um degrau abaixo dos Muniz — pequenos
  proprietários — em cuja linha sua filha se casou: onde a emigração Muniz era de filhos
  excedentes deixando pouca terra, a história Azevedo começa sem terra alguma.

  O óbito comprovado de Gloria Lacerda de Azevedo em Niterói (9 de maio de 1960) mostra a
  família já alcançando a área urbana do Rio de Janeiro — o padrão de mobilidade sem terra de
  uma família sem propriedade que a prenda a qualquer lugar. [INFERRED / CONTEXTUAL] Em suma,
  ele lê-se como o arquétipo dos pobres rurais não documentados: nenhuma terra, ofício,
  comércio ou escolaridade atestados, visível apenas como um nome nos registros de seus filhos
  — exatamente por isso sua própria filiação é a lacuna mais difícil deste lado.

  ## Questões em aberto

  - Seus pais — registro decisivo: um inventário Azevedo ou um assento paroquial ou civil de
  Muriaé/Cachoeira Alegre que o nomeie. [OPEN]

  - Seus próprios registros de nascimento, casamento e óbito — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0012 (casamento paroquial de 1916 de Luiza × Deocleciano — "Secundino Maria de
  Azevedo", resolve seu prenome) · CIV-0001 (o casamento civil de 1916, mesma união) ·
  CIV-0006 (o casamento civil de 1916 em inteiro teor — registra o pai de Luiza já falecido;
  sua leitura "Sebastião" do prenome é um erro de leitura de baixo contraste resolvido para
  Secundino por PAR-0012) · PAR-0003 (batismo de 1922 do neto Aristides — "José Secundino de
  Azevedo", avô materno) · CIV-0051 (óbito de 1975 em Mesquita da filha Alcida Fernandes de
  Azevedo — grafa seu nome "Ascendino Maria de Azevedo", variante de declarante não parente).

  ## Contexto regional e migratório

  Uma família Azevedo do eixo São Paulo do Muriaé / Carangola do país cafeeiro da Zona da
  Mata Mineira. [CONTEXTUAL] O local de nascimento de sua filha em Cachoeira Alegre e a
  presença da família em Carangola na década de 1910 o situam nessa micro-região; sua origem
  anterior a ela é não documentada, e nenhuma origem insular ou portuguesa é afirmada a
  partir do sobrenome. A economia cafeeira de trabalho livre dentro da qual a família se moveu
  funcionava sobre a Lei nº 581 de 1850 (Lei Eusébio de Queirós), até a abolição na Lei Áurea
  (1888), com a terra sob a Lei de Terras (nº 601, 1850); a linha direta é documentada apenas na
  Zona da Mata MG, de modo que nenhuma travessia atlântica é afirmada (o fio da Madeira permanece
  apenas como pista colateral em aberto). [CONTEXTUAL]

