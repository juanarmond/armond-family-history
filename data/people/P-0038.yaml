profile: >-
  ## Interesting facts


  - **[PROVEN]** He is no longer only somebody else's father. In November 1898, at Bom Jesus da
  Cachoeira Alegre, he is a party in his own right: one of the heirs-in-law who granted a power
  of attorney for his father-in-law's inventário, and one of the men recorded as signing it "por
  si e suas mulheres por não saberem escrever" (PRB-0014). The earlier statement that he was "never
  a party, a declarant or a signatory" is superseded.

  - **[INFERRED]** He could at least sign his name. The procuração survives as a certified copy
  (*traslado*), so what is held is the notary's statement that "Secundino d'Azevedo" signed, not
  his autograph (PRB-0014). His wife could not sign (PRB-0014), nor could his daughter Luiza in
  1916 (CIV-0006).

  - **[CONTEXTUAL]** He held or worked land. A 1908 Muriaé inventário of another family describes
  a small property in the district of Bom Jesus "dividindo com André Teixeira Crespo, Secundino
  de Azevedo e a viuva de Manoel Alves" — bordering on his land and on that of André Teixeira
  Crespo, his brother-in-law (FAN-0018). It is a third-party record, used here as context; its
  identification with him rests on the name, the district and that neighbour, and is strong. It
  overturns this profile's earlier "landless" reading.

  - **[PROVEN]** His given name was settled by the parish copy against the civil one. The handwritten
  1916 civil inteiro teor reads "Sebastião [uncertain: Manoel] de Azevedo" (CIV-0006); the parish
  act of the *same wedding* reads "Secundino Maria de Azevedo" (PAR-0012), matching the 2004 civil
  certificate (CIV-0001), the fuller "José Secundino" of the 1922 baptism (PAR-0003) and the plain
  "Secundino de Azevedo" of his father-in-law's will and inventário (PRB-0013, PRB-0014).

  - **[LEAD — weak]** The court clerk who copied his father-in-law's will into the 1898 inventário
  wrote "Thereza casada com Secundino de Azevedo Maia", but the original will reads only "Thereza,
  casada com Secundino de Azevedo" (PRB-0014; PRB-0013). One of the will's five witnesses was
  "Domingos Affonso de Azevedo [or Azeredo] Maia, natural de Portugal", a merchant in the town,
  who signs "d'Az.do Maya" (PRB-0013), and the same 1898 copy garbles other witnesses' names.
  The "Maia" is therefore most probably the copyist's contamination from that witness's name,
  not a surname of Secundino's. It does not stand as a name variant.


  ## Identity


  Documented forms of the same man: **Secundino de Azevedo** (his father-in-law's will and inventário,
  1890 and 1898 — PRB-0013, PRB-0014 — where he also appears among the signatories as "Secundino
  d'Azevedo"), **Secundino Maria de Azevedo** (the 1916 civil and parish marriage, CIV-0001 and
  PAR-0012) and **José Secundino de Azevedo** (Aristides's 1922 baptism, PAR-0003). [PROVEN —
  the 1890 and 1898 forms on the identification below] A further form, **Ascendino Maria de Azevedo**,
  is a 1975 informant variant (CIV-0051) and is preserved as such; plain "Secundino de Azevedo"
  is also reported by the retrieval research from his daughter Gloria's 1960 Niterói death (óbito
  nº 26.483), a record not held here. [LEAD] The clerk's "Secundino de Azevedo Maia" in the 1898
  copy of the will (PRB-0014) is not a variant of standing: the original has no "Maia" (PRB-0013),
  and the word most probably comes from a witness's name on the same document. [LEAD — weak]


  No held record gives *him* the **Fernandes** element. The "Fernandes" his daughters carry is
  their mother's: Thereza was the daughter of Manoel João Fernandes (PAR-0108, PRB-0013). "Fernandes
  de Azevedo" is therefore Thereza's birth surname joined to her married name, not a compound
  inherited on his side, and Luiza's alternative name "Luiza Secundina de Azevedo" (PAR-0003)
  echoes his given name. [INFERRED]


  - **Relationship:** maternal grandfather of **Antenor Muniz** (P-0006, 1923–2014) — the chain
  runs José Secundino → Luiza Fernandes de Azevedo (P-0013) → Antenor. Head of the Azevedo household
  (family F-0018) that married into the Muniz line. [derived from families F-0018 and F-0001]

  - **Spouse:** Thereza Fernandes de Azevedo (P-0039), born at Pousa, Barcelos, Portugal, on 3
  May 1864 (PAR-0108). [PROVEN] They were married before 8 March 1890, when her father's will
  names her "Thereza, casada com Secundino de Azevedo" (PRB-0013). [PROVEN] That the testator's
  son-in-law is this man rests on the same names, the same district (Bom Jesus da Cachoeira Alegre,
  where Luiza was born about 1898 — PAR-0012) and the same years, and on the surname Fernandes
  his daughters carry; no record names his wife's parents in the form "Thereza Fernandes de Azevedo",
  but the 1898 heirs' list places "D. Thereza de Jesus casada com Secundino de Azevedo" in that
  district (PRB-0014), and the records agree with no conflict, so the identification is confirmed
  (re-read on the images, 2026-10-12). [PROVEN — a coherent body of primary evidence] Their marriage
  record is not found. [OPEN]

  - **Daughters:** **Luiza** (P-0013), born at Bom Jesus de Cachoeira Alegre, district of São
  Paulo do Muriaé, about 1898, who married Deocleciano Muniz Bittencourt in 1916 (CIV-0001, PAR-0012)
  [PROVEN]; **Alcida Fernandes de Azevedo**, born about 1895 in Minas Gerais, who died a widow
  at Mesquita, RJ, on 20 May 1975 (CIV-0051) [PROVEN]; and **Gloria Lacerda de Azevedo**, who
  died at Niterói, RJ, on 9 May 1960 (óbito nº 26.483 — read from the retrieval drop, **not yet
  catalogued as a source in this repository**). The retrieval research reads Gloria as *natural
  de Minas Geraes*, born about the 1880s and a widow at her death, which would make her the eldest
  of the three. [LEAD]

  - **Death:** before 21 October 1916 [PROVEN] — the full-content act of Luiza's marriage, drawn
  up in the Carangola registry, records her father "já fallecido" while her mother Thereza was
  "residente neste districto" (CIV-0006), and the parish act identifies that father as Secundino
  (PAR-0012). He was alive on 22 November 1898, when he signed the procuração (PRB-0014). [PROVEN
  — on the identification] He was probably alive in 1908, when the neighbouring property is described
  as bordering on "Secundino de Azevedo", not on his widow or heirs, while the next neighbour
  is recorded as "a viuva de Manoel Alves" (FAN-0018). [INFERRED — and the year 1908 rests on
  the catalogue entry; it is not visible on the held pages] His own death record is not held.
  [OPEN]

  - **Birth and parents:** undocumented. [OPEN — the single hardest gap on this side of the tree]
  He was born no later than about 1875, since his daughters were born about 1895 (Alcida, aged
  80 in 1975, CIV-0051) and about 1898 (Luiza, aged 18 in 1916, CIV-0001); a marriage before March
  1890 makes a birth before about 1870 likely. [INFERRED] The retrieval research's working window
  of about 1855–1870 depends on Gloria's reported 1880s birth. [LEAD]


  ## Standing and profession


  No occupation, title or office is attested for him in any held record. [PROVEN as a negative
  across the held set] The property negative of the earlier profile no longer holds: in 1908 he
  is named as the holder of land bordering a property at Bom Jesus (FAN-0018). The record names
  him only as a neighbour; it does not say whether he owned, rented or sharecropped that land,
  or how much of it there was. [CONTEXTUAL — the tenure and size OPEN] The property it borders,
  the "Bôa Vista" — two alqueires of exhausted land, five hundred old coffee trees, a damaged
  wire fence and an old house (FAN-0018) — suggests a neighbourhood of small holdings. [INFERRED]
  His wife was one of the five forced heirs to her father's estate, whose content is not in the
  held part of the inventário (PRB-0013, PRB-0014). [PROVEN — the heirship; the share OPEN] He
  could sign his name (PRB-0014). [INFERRED — from a certified copy] The indirect read through
  his daughter — Luiza recorded *doméstica* and illiterate in 1916 (CIV-0006) — still holds, but
  it now reads as the female side of a literacy pattern that divided his household by sex, not
  as the mark of a household without letters. [INFERRED]


  ## Family and social network


  Son-in-law of Manoel João Fernandes da Cruz (P-0139), a Portuguese immigrant from Barcelos,
  and of Anna Maria Fernandes (P-0140) (PRB-0013, PRB-0014). In 1898 he, his wife and all her
  surviving siblings lived in the district of Bom Jesus da Cachoeira Alegre, and he joined his
  brothers-in-law Joaquim José Fernandes, Francisco Joaquim da Silva and Balbino Alves de Souza
  in granting the procuração (PRB-0014). [PROVEN] In 1908 his land adjoined that of his brother-in-law
  André Teixeira Crespo, husband of Thereza's sister Maria de Jesus (FAN-0018; PRB-0014): he had
  settled inside his wife's family. [CONTEXTUAL / INFERRED]


  Father-in-law of Deocleciano Muniz Bittencourt (P-0012) through Luiza, and named maternal grandfather
  in his grandchildren's records (Aristides, 1922, PAR-0003). Three daughters are documented (Luiza,
  Alcida, Gloria); the count is otherwise open, since no death record or inventário of his or
  his wife's gives a total. Alcida is recorded as the widow of a **Manoel Muniz Bittencourt**
  (CIV-0051) [PROVEN]; that this Manoel was Deocleciano's brother — which would make two of his
  daughters the wives of two Muniz Bittencourt brothers — is a research-profile reading and remains
  a **[LEAD]**.


  A 1913 Santa Luzia de Carangola parish death of an infant "Maria, filha legitima de José [uncertain:
  Secundino] d'Azevedo", recorded "em casa de seu pae", would place a man of that name at Carangola
  in 1913; the mother is unnamed and the middle name is a cursive read, so it stays a **[LEAD]**.
  Thereza's documented birth in 1864 makes it less likely that the infant was their child — she
  would have been about forty-eight — though it does not exclude the father's identity. [INFERRED]
  That death is one of five Carangola parish deaths of Azevedos in 1912–14 kept on the retrieval
  side as possible collateral kin, among them a Madeira-born Francisca d'Azevedo; no record ties
  any of them to him, and an adult death entry names a spouse rather than parents. **[LEAD]**


  One lead is closed. **Leonidia Fernandes de Azevedo**, the minor of a 1924 Leopoldina tutela
  (COARPE 38410248) once proposed as a late daughter of this couple, is not his: the retrieval
  research read the process, which is open on FamilySearch, and her parents are João Fernandes
  and Francisca de Azevedo. The process is not held here; the lead is withdrawn. The other "Fernandes
  de Azevedo" leads — the 1870 Leopoldina arrolamento and justificação of Bernardino Fernandes
  de Azevedo, the Carangola cluster, and the retrieval research's best-surnamed candidate, Manuel
  Fernandes de Azevedo Barros — were prioritised as early carriers of what looked like an inherited
  compound surname. Since the compound is Thereza's birth surname joined to his, that rationale
  has gone; they are unexamined but no longer favoured. [INFERRED]


  ## What we can extrapolate


  **1. His invisibility was partly an artefact of where the research looked. [INFERRED]** The
  earlier version of this profile treated his absence from every court, land and press index as
  class evidence: a man with no paper was a man with no property. The 1898 and 1908 records show
  the flaw. Court indexes are built on the principals of each process — the deceased, the inventariante
  — and he appears only inside other people's: as an heir-in-law in his father-in-law's inventário
  (PRB-0014) and as a neighbour in a stranger's (FAN-0018). The bounded negatives stand as searches
  — zero "Secundino" in a 144-comarca Minas court index, no Fernandes de Azevedo in the 1850s
  *Registro Paroquial de Terras* of Leopoldina and São Paulo do Muriaé, nothing in the web and
  press searches — but they no longer support the conclusion once drawn from them.


  **2. A small cultivator of modest means, married into an immigrant family. [INFERRED]** He held
  or worked land at Bom Jesus, could sign his name, and married the daughter of a Minho emigrant
  whose goods went to inventário and partilha (FAN-0018; PRB-0014; PRB-0013). That is not the
  "class floor" of the earlier reading, nor is it standing: the neighbouring holding was two alqueires
  of exhausted land and old coffee (FAN-0018), and his daughters were *domésticas* (CIV-0006,
  CIV-0051). The safest reading is a modest rural household, below the proprietários whose own
  estates reach the archives. Whether his 1908 land came to him through Thereza's share of her
  father's estate is a question to test, not a finding; the inventário breaks off before the partilha
  (PRB-0014). [OPEN]


  **3. Partible inheritance did touch this family — through his wife. [CONTEXTUAL]** Brazilian
  succession law, still the Ordenações Filipinas in 1898, reserved two thirds of an estate for
  the forced heirs in equal shares. His father-in-law's will disposed only of the *terça*, which
  went to his son Joaquim (PRB-0013), so Thereza was entitled to an equal fifth of the rest. The
  earlier claim that "nothing was fragmented; nothing was there" is withdrawn.


  **4. Literacy divided his household by sex. [INFERRED]** He signed in 1898 while his wife could
  not (PRB-0014); his daughter Luiza could not sign in 1916 while her husband did (CIV-0006).
  The 1916 page that the earlier profile read as a class line between two families shows the same
  pattern as the 1898 procuração, in which every husband signed for his wife. The earlier point
  that "education was purchased, and this household never bought it" is superseded: it was bought
  for the men.


  **5. The daughters' mobility is documented; its cause is now an open question. [INFERRED / CONTEXTUAL]**
  Within a generation of his death his daughters had reached the Rio de Janeiro metropolitan area
  — Gloria at Niterói (1960), Alcida in the Baixada Fluminense (1975, CIV-0051) — and his grandson
  Antenor died at Volta Redonda in 2014 as an urban tradesman (CIV-0028). This is the Brazilian
  rural exodus, and it needs no special explanation for a family of small cultivators; but the
  earlier reading — that a household with no land "loses nothing by leaving" — has lost its premise.
  Note also the honest correction inside this reading: an earlier version of the Azevedo story
  had a daughter dying at Niterói in 1900, which would have put the family in Rio a generation
  before the Muniz; the 1900 date was an index misparse of Gloria's 1960 death, and no pre-1950
  Rio presence is documented.


  **6. What his case implies for the research. [INFERRED]** He is found in other people's papers
  — his in-laws', his neighbours' — and that is where the next records will be too. The single
  best target is his marriage to Thereza: a marriage entry names both spouses' parents, and this
  one lies before March 1890, most probably in the parish where her father lived in 1885 (PRB-0016).
  [LEAD]


  ## Open questions


  - **His parents** — the primary gap. A FamilySearch sweep constrained by spouse returned no
  persona that is him, and his tree node carries no parents and no sources, so the generation
  above is off-tool. The realistic levers are now his marriage record and his death record. [OPEN]

  - **His marriage to Thereza** (before 8 March 1890) — most probably in the parish of São João
  Batista do Laranjal, where her father lived in 1885 (PRB-0016); the books are not on FamilySearch,
  according to the retrieval research, so it is a parish or diocesan archive request. A search
  should run under "Secundino" and "Azevedo"; the copyist's "Azevedo Maia" is worth no more than
  a last-resort check. [LEAD]

  - **His death record** — after November 1898 (probably after 1908) and before October 1916,
  at Bom Jesus / Muriaé or Carangola; it would give the date, his age and, if the informant knew
  them, his parents. [OPEN]

  - **His land in 1908** — whether owned, rented or sharecropped, how large, and how acquired;
  a Muriaé land record, or the rest of his father-in-law's inventário, would answer. [OPEN]

  - The earlier note that the FamilySearch "Muriaé parish films (1838–1943)" were the obvious
  place to search is superseded: the retrieval research opened those catalogue entries and they
  belong to other places; no Muriaé-area church book is on FamilySearch.

  - Whether the Carangola Azevedos of 1912–14 are kin. [OPEN — LEAD]


  ## Sources held (this repository)


  - PRB-0013 (his father-in-law's will, 1890 — "Thereza, casada com Secundino de Azevedo", with
  no "Maia"; the witness Domingos Affonso de Azevedo [or Azeredo] Maia) · PRB-0014 (the 1898 inventário
  — his wife an heir, the procuração he signs, and the clerk's copy of the will with its garbled
  "Azevedo Maia") · FAN-0018 (the 1908 inventário naming him as a land neighbour at Bom Jesus
  — context, not evidence).

  - PAR-0012 (1916 parish marriage of Luiza × Deocleciano — "Secundino Maria de Azevedo"; resolves
  his given name) · CIV-0001 (the 1916 civil marriage, same union) · CIV-0006 (the 1916 full-content
  civil marriage — records him already deceased; its "Sebastião" reading is the misread resolved
  by PAR-0012).

  - PAR-0003 (his grandson Aristides's 1922 baptism — "José Secundino de Azevedo", maternal grandfather)
  · CIV-0051 (1975 Mesquita death of his daughter Alcida — the "Ascendino" variant, and a documented
  second daughter) · PAR-0108 (his wife's 1864 baptism — the source of the daughters' "Fernandes").


  ## Regional and migration context


  An Azevedo household of the **São Paulo do Muriaé / Carangola axis** of the Zona da Mata Mineira.
  [CONTEXTUAL] He is documented at Bom Jesus da Cachoeira Alegre in 1898 (PRB-0014) and, by strong
  identification, in 1908 (FAN-0018); his widow was at Carangola by 1916 (CIV-0006). Anything
  before 1890 is undocumented for him. His wife's family came from the Minho (PAR-0108, PRB-0013),
  but that says nothing about his own origin: no Madeiran, Azorean, Minho or other Portuguese
  origin is documented for him; the island thread in the surrounding records belongs to a Carangola
  collateral of unproven kinship (the Madeira-born Francisca d'Azevedo) and stays a lead; the
  Portuguese birth of the will witness Domingos Affonso de Azevedo [or Azeredo] Maia (PRB-0013)
  is that man's, not his; and no origin is inferred from the surname. [OPEN] The economy he lived
  in ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de Queirós)
  ending the Atlantic slave trade, abolition under the Lei Áurea (1888), and land put on a purchase
  basis by the Lei de Terras (nº 601, 1850). The earlier statement that this was "a market his
  family never entered" is superseded: by 1908 he held or worked land at Bom Jesus, on terms the
  record does not state (FAN-0018). [CONTEXTUAL]


