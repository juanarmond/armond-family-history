profile: >-
  ## Identity

  Two documented forms of the same man: **José Secundino de Azevedo** (Aristides's 1922
  baptism, PAR-0003) and **Secundino Maria de Azevedo** (the 1916 civil and parish
  marriage, CIV-0001 and PAR-0012). [PROVEN] The parish marriage act (PAR-0012) settled his
  given name and confirmed that the "Sebastião [Manoel]" of the 2019 civil inteiro-teor
  (CIV-0006) was a misread.

  - **Role:** father of Luiza (Fernandes/Secundina) de Azevedo (P-0013), hence the maternal
  grandfather of Antenor Muniz's siblings; head of the Azevedo trunk (family F-0018) that
  married into the Muniz line. [PROVEN]

  - **Spouse:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Daughter:** Luiza, born at Bom Jesus da Cachoeira Alegre, district of São Paulo do
  Muriaé (MG), about 1898 (aged 18 in 1916), who married Deocleciano Muniz Bittencourt in
  1916 (CIV-0001, PAR-0012). [PROVEN]

  - **Birth and death:** neither documented. His own vital records have not been located.
  [OPEN]

  - **Parents:** unknown — the single biggest gap on this side. [OPEN]

  ## Standing and profession

  Almost nothing is documented directly. His daughter Luiza is recorded as a doméstica and
  illiterate in 1916, consistent with a modest, non-landed rural family — the kind of
  household that surfaces only in the church and civil registrations of its children, not
  in probate or land registers. No occupation, title or property is attested for him.
  [INFERRED]

  ## Family and social network

  Father-in-law of Deocleciano Muniz Bittencourt (P-0012) through Luiza, and named maternal
  grandfather in the records of their children (e.g. Aristides, 1922, PAR-0003). Two leads
  are recorded but not adopted: a second daughter, Gloria Lacerda de Azevedo (d. 1900,
  Niterói, from an image-gated death persona), and a 1913 Santa Luzia de Carangola infant
  death of a "Maria, filha legitima de José [Secundino] d'Azevedo" placing a José
  [Secundino] de Azevedo resident in Carangola in 1913. [LEAD]

  ## What we can extrapolate

  His absence from every court, land and press index is itself a signal [INFERRED]: he was
  most likely a small rural family head in the Zona da Mata (Muriaé / Cachoeira Alegre)
  from the 1870s to about 1900, not a proprietário.

  ## Open questions

  - His parents — decisive record: an Azevedo probate or a Muriaé/Cachoeira Alegre parish
  or civil register naming him. [OPEN]

  - His own birth, marriage and death records — none located. [OPEN]

  ## Sources held (this repository)

  - PAR-0012 (1916 parish marriage of Luiza × Deocleciano — "Secundino Maria de Azevedo",
  resolves his given name) · CIV-0001 (the 1916 civil marriage, same union) · PAR-0003
  (grandson Aristides's 1922 baptism — "José Secundino de Azevedo", maternal grandfather).

  ## Regional and migration context

  An Azevedo family of the São Paulo do Muriaé / Carangola axis of the Zona da Mata Mineira
  coffee country. [CONTEXTUAL] His daughter's Cachoeira Alegre birthplace and the family's
  presence at Carangola by the 1910s place him in that micro-region; his origin before it
  is undocumented, and no island or Portuguese origin is asserted from the surname.
profile_pt: >-
  ## Identidade

  Duas formas documentadas do mesmo homem: **José Secundino de Azevedo** (batismo de 1922 de
  Aristides, PAR-0003) e **Secundino Maria de Azevedo** (o casamento civil e paroquial de
  1916, CIV-0001 e PAR-0012). [PROVEN] O assento paroquial de casamento (PAR-0012) fixou seu
  prenome e confirmou que o "Sebastião [Manoel]" do inteiro teor civil de 2019 (CIV-0006)
  foi um erro de leitura.

  - **Papel:** pai de Luiza (Fernandes/Secundina) de Azevedo (P-0013), portanto avô materno
  dos irmãos de Antenor Muniz; chefe do tronco Azevedo (família F-0018) que se uniu à linha
  Muniz. [PROVEN]

  - **Cônjuge:** Thereza Fernandes de Azevedo (P-0039). [PROVEN]

  - **Filha:** Luiza, nascida em Bom Jesus da Cachoeira Alegre, distrito de São Paulo do
  Muriaé (MG), por volta de 1898 (18 anos em 1916), que se casou com Deocleciano Muniz
  Bittencourt em 1916 (CIV-0001, PAR-0012). [PROVEN]

  - **Nascimento e óbito:** nenhum documentado. Seus próprios registros vitais não foram
  localizados. [OPEN]

  - **Pais:** desconhecidos — a maior lacuna deste lado. [OPEN]

  ## Posição social e profissão

  Quase nada está documentado diretamente. Sua filha Luiza é registrada como doméstica e
  analfabeta em 1916, coerente com uma família rural modesta e sem terras — o tipo de casa
  que só aparece nas registrações eclesiásticas e civis dos filhos, não em inventários ou
  registros de terras. Nenhuma ocupação, título ou propriedade lhe é atestada. [INFERRED]

  ## Família e rede social

  Sogro de Deocleciano Muniz Bittencourt (P-0012) por meio de Luiza, e nomeado avô materno
  nos registros dos filhos deles (p.ex. Aristides, 1922, PAR-0003). Duas pistas são
  registradas, mas não adotadas: uma segunda filha, Gloria Lacerda de Azevedo (f. 1900,
  Niterói, de uma persona de óbito com imagem restrita), e um óbito de criança de 1913 em
  Santa Luzia de Carangola, de uma "Maria, filha legitima de José [Secundino] d'Azevedo",
  situando um José [Secundino] de Azevedo residente em Carangola em 1913. [LEAD]

  ## O que podemos extrapolar

  Sua ausência de todo índice judicial, fundiário e de imprensa é, ela mesma, um sinal
  [INFERRED]: ele foi muito provavelmente um pequeno chefe de família rural na Zona da Mata
  (Muriaé / Cachoeira Alegre) dos anos 1870 até cerca de 1900, não um proprietário.

  ## Questões em aberto

  - Seus pais — registro decisivo: um inventário Azevedo ou um assento paroquial ou civil de
  Muriaé/Cachoeira Alegre que o nomeie. [OPEN]

  - Seus próprios registros de nascimento, casamento e óbito — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0012 (casamento paroquial de 1916 de Luiza × Deocleciano — "Secundino Maria de
  Azevedo", resolve seu prenome) · CIV-0001 (o casamento civil de 1916, mesma união) ·
  PAR-0003 (batismo de 1922 do neto Aristides — "José Secundino de Azevedo", avô materno).

  ## Contexto regional e migratório

  Uma família Azevedo do eixo São Paulo do Muriaé / Carangola do país cafeeiro da Zona da
  Mata Mineira. [CONTEXTUAL] O local de nascimento de sua filha em Cachoeira Alegre e a
  presença da família em Carangola na década de 1910 o situam nessa micro-região; sua origem
  anterior a ela é não documentada, e nenhuma origem insular ou portuguesa é afirmada a
  partir do sobrenome.
