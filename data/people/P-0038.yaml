  ## Família e rede social


  Genro de Manoel João Fernandes da Cruz (P-0139), imigrante português de Barcelos, e de Anna
  Maria Fernandes (P-0140) (PRB-0013, PRB-0014). Em 1898 ele, a esposa e todos os irmãos sobreviventes
  dela moravam no distrito do Bom Jesus da Cachoeira Alegre, e ele se juntou aos cunhados Joaquim
  José Fernandes, Francisco Joaquim da Silva e Balbino Alves de Souza na outorga da procuração
  (PRB-0014). [PROVEN] Em 1908 sua terra confrontava com a do cunhado André Teixeira Crespo, marido
  de Maria de Jesus, irmã de Thereza (FAN-0018; PRB-0014): ele se estabelecera dentro da família
  da esposa. [CONTEXTUAL / INFERRED]


  Sogro de Deocleciano Muniz Bittencourt (P-0012) por Luiza, e nomeado avô materno nos registros
  de seus netos (Aristides, 1922, PAR-0003). Três filhas estão documentadas (Luiza, Alcida, Gloria);
  a contagem permanece aberta, pois nenhum óbito ou inventário dele ou da esposa dá um total.
  Alcida é registrada como viúva de um **Manoel Muniz Bittencourt** (CIV-0051) [PROVEN]; que esse
  Manoel fosse irmão de Deocleciano — o que faria de duas de suas filhas as esposas de dois irmãos
  Muniz Bittencourt — é leitura do perfil de pesquisa e permanece **[LEAD]**.


  Um óbito paroquial de 1913, em Santa Luzia de Carangola, de uma criança "Maria, filha legitima
  de José [incerto: Secundino] d'Azevedo", registrado "em casa de seu pae", situaria um homem
  desse nome em Carangola em 1913; a mãe não é nomeada e o nome do meio é leitura cursiva, de
