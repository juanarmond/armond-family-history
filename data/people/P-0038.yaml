  ## O que podemos extrapolar


  **1. Sua invisibilidade era em parte um artefato de onde a pesquisa procurou. [INFERRED]** A
  versão anterior deste perfil tratava sua ausência de todo índice judicial, fundiário e de imprensa
  como evidência de classe: um homem sem papel era um homem sem propriedade. Os registros de 1898
  e 1908 mostram a falha. Os índices judiciais são construídos sobre os principais de cada processo
  — o falecido, o inventariante —, e ele só aparece dentro dos processos alheios: como genro-herdeiro
  no inventário do sogro (PRB-0014) e como vizinho no de um estranho (FAN-0018). As negativas
  delimitadas permanecem como buscas — zero "Secundino" num índice judicial mineiro de 144 comarcas,
  nenhum Fernandes de Azevedo no *Registro Paroquial de Terras* dos anos 1850 de Leopoldina e
  São Paulo do Muriaé, nada nas buscas na web e na imprensa —, mas já não sustentam a conclusão
  que delas se tirou.


  **2. Um pequeno lavrador de recursos modestos, casado numa família imigrante. [INFERRED]** Ele
  detinha ou lavrava terra no Bom Jesus, sabia assinar o nome e casou-se com a filha de um emigrante
  minhoto cujos bens foram a inventário e partilha (FAN-0018; PRB-0014; PRB-0013). Isso não é
  o "piso de classe" da leitura anterior, nem é posição social: a posse vizinha era de dois alqueires
  de terras devastadas e café velho (FAN-0018), e suas filhas eram domésticas (CIV-0006, CIV-0051).
  A leitura mais segura é a de um lar rural modesto, abaixo dos proprietários cujos próprios espólios
  chegam aos arquivos. Se sua terra de 1908 lhe veio pelo quinhão de Thereza na herança do pai
  é uma pergunta a testar, não um achado; o inventário interrompe-se antes da partilha (PRB-0014).
  [OPEN]


  **3. A herança partível tocou esta família — pela esposa. [CONTEXTUAL]** O direito sucessório
  brasileiro, ainda as Ordenações Filipinas em 1898, reservava dois terços do espólio aos herdeiros
  necessários, em partes iguais. O testamento do sogro só dispôs da *terça*, que foi para o filho
  Joaquim (PRB-0013), de modo que Thereza tinha direito a um quinto igual do restante. Fica retirada
  a afirmação anterior de que "nada foi fragmentado; nada havia".


  **4. A alfabetização dividia seu lar por sexo. [INFERRED]** Ele assinou em 1898 enquanto a esposa
  não sabia (PRB-0014); sua filha Luiza não sabia assinar em 1916 enquanto o marido assinava (CIV-0006).
  A página de 1916 que o perfil anterior lia como uma linha de classe entre duas famílias mostra
  o mesmo padrão da procuração de 1898, em que todo marido assinou pela esposa. Fica superado
  o ponto anterior de que "a educação era comprada, e este lar nunca a comprou": foi comprada
  para os homens.


  **5. A mobilidade das filhas está documentada; sua causa é agora uma questão em aberto. [INFERRED
  / CONTEXTUAL]** Numa geração após sua morte, as filhas haviam alcançado a região metropolitana
  do Rio de Janeiro — Gloria em Niterói (1960), Alcida na Baixada Fluminense (1975, CIV-0051)
  — e seu neto Antenor morreu em Volta Redonda em 2014 como artífice urbano (CIV-0028). É o êxodo
  rural brasileiro, e ele não precisa de explicação especial para uma família de pequenos lavradores;
  mas a leitura anterior — de que um lar sem terra "nada perde ao partir" — perdeu a premissa.
  Registre-se também a correção honesta dentro desta leitura: uma versão anterior da história
  Azevedo tinha uma filha falecendo em Niterói em 1900, o que poria a família no Rio uma geração
  antes dos Muniz; a data de 1900 era um erro de leitura de índice do óbito de Gloria em 1960,
  e nenhuma presença no Rio anterior a 1950 está documentada.


  **6. O que seu caso implica para a pesquisa. [INFERRED]** Ele é encontrado na papelada alheia
  — a dos sogros, a dos vizinhos —, e é ali que estarão também os próximos registros. O melhor
  alvo isolado é seu casamento com Thereza: um assento de casamento nomeia os pais de ambos os
  cônjuges, e este é anterior a março de 1890, muito provavelmente na paróquia onde o pai dela
  morava em 1885 (PRB-0016). [LEAD]


  ## Questões em aberto


  - **Seus pais** — a lacuna principal. Uma varredura no FamilySearch constrangida pela esposa
