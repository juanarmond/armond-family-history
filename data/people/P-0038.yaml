notes:
- text: >-
    Father of Luiza (Fernandes/Secundina) de Azevedo (P-0013), hence Antenor Muniz's
    maternal grandfather. Named as Luiza's father in the 1916 marriage (CIV-0001, as
    "Secundino Maria de Azevedo") and as Aristides Muniz Bittencourt's maternal
    grandfather in the 1922 baptism (PAR-0003, as "José Secundino de Azevedo"). An
    Azevedo family of the Muriaé/Carangola region (MG); his own vital records are
    not located.
- text: >-
    Nationality left unset: no birthplace or stated nacionalidade is evidenced. His
    daughter Luiza was born in the Muriaé district (MG), but his own origin is not
    documented, so it is not asserted.
- text: >-
    Given-name variant to verify: the 2019 full-content certidão of the 1916
    marriage (CIV-0006, handwritten pages) is read "Sebastião [uncertain: Manoel]
    de Azevedo", conflicting with the "José Secundino" (PAR-0003) and "Secundino
    Maria" (CIV-0001) forms of the same 1916 act. Treated as a probable misread
    pending verification of the original; the preferred name is unchanged.
- text: >-
    Lead (not modelled, 31 July 2026): a 1913 Santa Luzia de Carangola parish death
    of an infant "Maria, filha legitima de José [uncertain: Secundino] d'Azevedo",
    recorded "em casa de seu pae", places a José [Secundino] de Azevedo resident in
    Carangola in 1913 — corroborating this family's Carangola origin and suggesting a
    late-born daughter (a younger sibling of Luiza). The mother is not named and the
    father's middle name is a cursive read, so it is a lead, not promoted.
