profile: >-
  ## Identity

  Always **Antenor Muniz** in the records we hold [PROVEN] — his 1949 marriage
  certificate (CIV-0004) records the short "Antenor Muniz", a later family civil
  record (CIV-0008, living-person content withheld) repeats it, and the owner's
  direct-ancestor roster (REC-0001) lists him under that name. The fuller **Antenor
  Muniz Bittencourt** — the surname his father and siblings carried — remains a
  **[LEAD]** pending a direct source; do not state it as fact.

  - **Parents:** Deocleciano Muniz Bittencourt (P-0012) and Luiza Fernandes de
  Azevedo (P-0013) [PROVEN] — named as his parents in his 1949 marriage certificate
  (CIV-0004); his brother Aristides's 1922 baptism (PAR-0003) documents the same
  couple.

  - **Birth:** 2 November 1923, district of **Alvorada, Minas Gerais** [PROVEN as
  reported] — stated in his 1949 marriage certificate (CIV-0004); this is secondary
  information in a marriage record, not a birth act, and no birth or baptism record
  is held.

  - **Marriage:** married **Iris Bohrer** (P-0007) at Alvorada on **7 December 1949**
  [PROVEN] (CIV-0004, livro 5, fls 66-v); the bride thereafter signed "Iris Bohrer
  Muniz". This union is where the maternal Muniz line joins the Bohrer line.

  - **Death:** 17 October 2014, at 18:45, at the Hospital São João Batista, **Volta
  Redonda, Rio de Janeiro**, aged 90 [PROVEN] — his civil death certificate (CIV-0028,
  event E-0081). He was still married, his wife Iris surviving him (she died in 2021).
  Cause: acute respiratory failure with pulmonary oedema and systemic hypertension. His
  profession at death was **bombeiro hidráulico** (plumber) and he was resident in Monte
  Castelo, Volta Redonda — he left an estate to inventory ("deixou bens a inventariar")
  and five adult children.

  - **Children:** five adult children (living; details withheld for privacy) — stated in
  his 2014 death certificate (CIV-0028) and matched by his widow Iris's 2021 record
  (CIV-0029, "deixou 5 filhos maiores").

  ## Standing and profession

  - **Farm worker ("da lavoura")** [PROVEN] — his profession in the 1949 marriage
  certificate (CIV-0004), living in the comarca of Alvorada, Minas Gerais.

  ## Family and social network

  Son of a Carangola (MG) farming family (P-0012 × P-0013); his 1922-born brother
  **Aristides** is documented at PAR-0003. He married into the **Bohrer** family
  (Iris, P-0007), born at Presidente Soares, MG (CIV-0004) — the maternal line's
  junction with the Bohrer line. CIV-0008 (a later family record; living-person
  detail withheld) records him and "Iris Bohrer Muniz" as a couple.

  ## What we can extrapolate

  [INFERRED] His documented life is that of a rural Minas Gerais smallholder / farm
  worker who married and settled in the Alvorada district. The short "Antenor Muniz",
  dropping the paternal "Bittencourt" his siblings kept, is a plausible identity
  simplification — but our repository proves only the short form; the fuller name is
  a lead.

  [CORRECTED 2026-09-07 — his 2014 death certificate supersedes the earlier "stayed
  rural" reading] Antenor did **not** remain a lifelong rural cultivator. His life brackets
  a migration: a *lavrador* in the Alvorada district (Carangola, MG) at his 1949 marriage
  (CIV-0004), he had become a **bombeiro hidráulico** (plumber) resident in Monte Castelo,
  **Volta Redonda, RJ**, by his death in 2014 (CIV-0028). That is the same interior-Minas →
  industrial-Rio de Janeiro move that the whole Volta Redonda family cluster made in the
  mid-20th century (his wife, in-laws and collaterals all died in Volta Redonda). The
  earlier profile read him as "the son who kept farming"; the primary record shows the
  opposite — he joined the urban working class of the CSN steel city, an urbanisation into
  waged trade, not subsistence on his own plot.

  [INFERRED] Two immigrant peasant streams converge in him: his marriage to Iris Bohrer
  (P-0007) merges the Azorean-Portuguese Muniz with the Swiss/German Bohrer — two
  smallholder-agrarian immigrant lines whose capital was land, labour and kinship rather
  than office, title or schooling — meeting in one Minas Gerais farming district. Both
  lines then followed the same trajectory out of the rural interior into Volta Redonda.

  [INFERRED] Dropping "Bittencourt" reads as an assimilation marker, not a status move:
  keeping only "Muniz" simplified the immigrant compound surname toward a plain
  Brazilian name — ordinary generational assimilation in a family with no title or
  estate-name worth preserving — the small shift that, decades on, made the line harder
  to trace back to Sapucaia and São Miguel.

  [CONTEXTUAL] The Muniz line never had elite standing to lose, so its 20th-century story
  is not decline but the classic interior-agrarian → industrial-urban passage of a
  land-poor immigrant-descended family: from a São Miguel *proprietário* baseline (see
  P-0042), through Sapucaia (RJ) and the Zona da Mata coffee frontier (P-0019, P-0012),
  to a plumber's trade in the steel town of Volta Redonda in Antenor's own lifetime.

  ## Open questions

  - His birth and baptism records (Alvorada, 1923) — not held. [OPEN]

  - His death record — **held** (CIV-0028): died 17 October 2014, Volta Redonda, RJ.
  [RESOLVED]

  - His inventário — "deixou bens a inventariar" (CIV-0028); a post-2014 estate
  involving living heirs, privacy-gated. [LEAD]

  - Whether he formally bore "Bittencourt" — needs a direct source. [OPEN]

  ## Sources held (this repository)

  - CIV-0004 (1949 marriage to Iris Bohrer — his reported birth date/place, "da
  lavoura", his parents) · CIV-0028 (2014 Volta Redonda death certificate — death date
  and place, "bombeiro hidráulico", his parents, five adult children) · CIV-0008 (later
  family civil record; living-person content withheld — corroborates the "Antenor Muniz"
  form) · REC-0001 (owner's direct-ancestor roster).

  - PAR-0003 (1922 baptism of his brother Aristides — documents his parents and the
  Carangola, MG family origin).

  ## Regional and migration context

  His life spans a migration: born and married in the district of **Alvorada**
  (Carangola), MG, a farm worker in 1949 [PROVEN, CIV-0004], he later moved to **Volta
  Redonda, RJ**, where he worked as a plumber and died in 2014 [PROVEN, CIV-0028]. His
  parents' generation had moved from Sapucaia (RJ) into the Zona da Mata Mineira
  (Carangola) around the turn of the century (see P-0012); Antenor's own generation then
  carried the family on into the Rio de Janeiro industrial belt — the whole Volta Redonda
  cluster (his wife, in-laws and collaterals) died there. [CONTEXTUAL]

  ## Where to go today

  - **Birth, marriage and baptism (1923-1949):** Igreja Matriz de Santa Luzia,
  Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) — civil records at the
  Cartório de Registro Civil de Carangola [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Identidade

  Sempre **Antenor Muniz** nos registros que possuímos [PROVEN] — sua certidão de
  casamento de 1949 (CIV-0004) registra a forma curta "Antenor Muniz", um registro
  civil familiar posterior (CIV-0008, com conteúdo de pessoa viva omitido) a repete,
  e a lista de ancestrais diretos do proprietário (REC-0001) o nomeia assim. A forma
  mais completa **Antenor Muniz Bittencourt** — o sobrenome que seu pai e irmãos
  carregavam — permanece uma **[LEAD]** pendente de fonte direta; não afirmar como
  fato.

  - **Pais:** Deocleciano Muniz Bittencourt (P-0012) e Luiza Fernandes de Azevedo
  (P-0013) [PROVEN] — nomeados como seus pais em sua certidão de casamento de 1949
  (CIV-0004); o batismo de 1922 de seu irmão Aristides (PAR-0003) documenta o mesmo
  casal.

  - **Nascimento:** 2 de novembro de 1923, distrito de **Alvorada, Minas Gerais**
  [PROVEN as reported] — declarado em sua certidão de casamento de 1949 (CIV-0004);
  trata-se de informação secundária em um registro de casamento, não de um assento de
  nascimento, e nenhum registro de nascimento ou batismo é conservado.

  - **Casamento:** casou-se com **Iris Bohrer** (P-0007) em Alvorada em **7 de
  dezembro de 1949** [PROVEN] (CIV-0004, livro 5, fls 66-v); a noiva passou a
  assinar "Iris Bohrer Muniz". Essa união é onde a linha materna Muniz se junta à
  linha Bohrer.

  - **Óbito:** 17 de outubro de 2014, às 18:45, no Hospital São João Batista, **Volta
  Redonda, Rio de Janeiro**, aos 90 anos [PROVEN] — sua certidão de óbito (CIV-0028,
  evento E-0081). Ainda era casado, sua esposa Iris o sobrevivendo (ela faleceu em 2021).
  Causa: insuficiência respiratória aguda com edema pulmonar e hipertensão sistêmica. Sua
  profissão ao falecer era **bombeiro hidráulico**, residente em Monte Castelo, Volta
  Redonda — deixou bens a inventariar e cinco filhos maiores.

  - **Filhos:** cinco filhos maiores (vivos; detalhes omitidos por privacidade) — declarado
  em sua certidão de óbito de 2014 (CIV-0028) e coincidente com o registro de 2021 de sua
  esposa Iris (CIV-0029, "deixou 5 filhos maiores").

  ## Posição social e profissão

  - **Trabalhador da lavoura ("da lavoura")** [PROVEN] — sua profissão na certidão de
  casamento de 1949 (CIV-0004), residente na comarca de Alvorada, Minas Gerais.

  ## Família e rede social

  Filho de uma família de lavradores de Carangola (MG) (P-0012 × P-0013); seu irmão
  **Aristides**, nascido em 1922, está documentado em PAR-0003. Casou-se com a família
  **Bohrer** (Iris, P-0007), nascida em Presidente Soares, MG (CIV-0004) — o ponto de
  junção da linha materna com a linha Bohrer. CIV-0008 (registro familiar posterior;
  detalhe de pessoa viva omitido) o registra, com "Iris Bohrer Muniz", como casal.

  ## O que podemos extrapolar

  [INFERRED] Sua vida documentada é a de um pequeno proprietário / trabalhador da
  lavoura do meio rural de Minas Gerais que se casou e se fixou no distrito de
  Alvorada. A forma curta "Antenor Muniz", abandonando o "Bittencourt" paterno que
  seus irmãos mantiveram, é uma simplificação de identidade plausível — mas nosso
  repositório comprova apenas a forma curta; o nome completo é uma pista.

  [CORRIGIDO 2026-09-07 — sua certidão de óbito de 2014 supera a leitura anterior de que
  "ficou no campo"] Antenor **não** permaneceu cultivador rural a vida toda. Sua vida
  atravessa uma migração: *lavrador* no distrito de Alvorada (Carangola, MG) em seu
  casamento de 1949 (CIV-0004), tornara-se **bombeiro hidráulico**, residente em Monte
  Castelo, **Volta Redonda, RJ**, ao falecer em 2014 (CIV-0028). É o mesmo movimento
  interior-Minas → Rio de Janeiro industrial que todo o núcleo familiar de Volta Redonda
  fez em meados do século XX (esposa, sogros e colaterais faleceram todos em Volta
  Redonda). O perfil anterior o lia como "o filho que continuou lavrando"; o registro
  primário mostra o oposto — ele ingressou na classe trabalhadora urbana da cidade
  siderúrgica da CSN, uma urbanização rumo a um ofício assalariado, não à subsistência no
  próprio lote.

  [INFERRED] Duas correntes imigrantes camponesas convergem nele: seu casamento com Iris
  Bohrer (P-0007) funde os Muniz açoriano-portugueses com os Bohrer suíço-alemães — duas
  linhas imigrantes de pequenos agricultores cujo capital era terra, trabalho e parentesco,
  não cargo, título ou instrução — encontrando-se em um distrito rural de Minas Gerais.
  Ambas as linhas então seguiram a mesma trajetória do interior rural rumo a Volta Redonda.

  [INFERRED] Abandonar o "Bittencourt" lê-se como um marcador de assimilação, não como um
  movimento de status: manter apenas "Muniz" simplificou o sobrenome composto de imigrante
  rumo a um nome brasileiro comum — assimilação geracional ordinária numa família sem
  título ou nome de propriedade que valesse preservar — a pequena mudança que, décadas
  depois, tornou a linhagem mais difícil de rastrear até Sapucaia e São Miguel.

  [CONTEXTUAL] A linha Muniz nunca teve posição de elite a perder, de modo que sua história
  no século XX não é de declínio, mas a clássica passagem agrária-interiorana → urbana-
  industrial de uma família descendente de imigrantes pobre em terra: de uma base de
  *proprietário* em São Miguel (ver P-0042), por Sapucaia (RJ) e a fronteira cafeeira da
  Zona da Mata (P-0019, P-0012), até o ofício de bombeiro hidráulico na cidade siderúrgica
  de Volta Redonda na própria vida de Antenor.

  ## Questões em aberto

  - Seus registros de nascimento e batismo (Alvorada, 1923) — não conservados. [OPEN]

  - Seu registro de óbito — **conservado** (CIV-0028): faleceu em 17 de outubro de 2014,
  Volta Redonda, RJ. [RESOLVED]

  - Seu inventário — "deixou bens a inventariar" (CIV-0028); espólio pós-2014 envolvendo
  herdeiros vivos, restrito por privacidade. [LEAD]

  - Se ele portava formalmente "Bittencourt" — requer fonte direta. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0004 (casamento de 1949 com Iris Bohrer — sua data/local de nascimento
  reportados, "da lavoura", seus pais) · CIV-0028 (certidão de óbito de 2014, Volta
  Redonda — data e local do óbito, "bombeiro hidráulico", seus pais, cinco filhos maiores)
  · CIV-0008 (registro civil familiar posterior; conteúdo de pessoa viva omitido —
  corrobora a forma "Antenor Muniz") · REC-0001 (lista de ancestrais diretos do
  proprietário).

  - PAR-0003 (batismo de 1922 de seu irmão Aristides — documenta seus pais e a origem
  familiar em Carangola, MG).

  ## Contexto regional e migratório

  Sua vida abrange uma migração: nasceu e casou-se no distrito de **Alvorada**
  (Carangola), MG, trabalhador da lavoura em 1949 [PROVEN, CIV-0004], e depois mudou-se
  para **Volta Redonda, RJ**, onde trabalhou como bombeiro hidráulico e faleceu em 2014
  [PROVEN, CIV-0028]. A geração de seus pais havia se mudado de Sapucaia (RJ) para a Zona
  da Mata Mineira (Carangola) na virada do século (ver P-0012); a geração do próprio
  Antenor levou a família adiante rumo ao cinturão industrial do Rio de Janeiro — todo o
  núcleo de Volta Redonda (esposa, sogros e colaterais) faleceu ali. [CONTEXTUAL]

  ## Onde ir hoje

  - **Nascimento, casamento e batismo (1923-1949):** Igreja Matriz de Santa Luzia,
  Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) — registros civis no
  Cartório de Registro Civil de Carangola [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
