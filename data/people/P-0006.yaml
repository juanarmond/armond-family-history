profile: >-
  ## Interesting facts

  - **[INFERRED]** Two immigrant peasant streams converge in his marriage: his union with Iris Bohrer (P-0007) fuses the Azorean-Portuguese Muniz line (his father's line, from São Miguel via Sapucaia) with the Swiss/German Bohrer line (his wife's, from Nova Friburgo) — two smallholder-agrarian immigrant families meeting in a Minas Gerais farming district.

  - **[CONTEXTUAL]** He was recorded "da lavoura" (farm worker) at his 1949 marriage (CIV-0004) and "bombeiro hidráulico" (plumber) at his 2014 death in Volta Redonda (CIV-0028) — a direct occupation shift from rural agriculture to urban trade, tracing the same interior-Minas → industrial-Rio de Janeiro migration that the whole family cluster made.

  - **[PROVEN]** His 2014 death certificate records him resident in Monte Castelo, Volta Redonda, and that he left an estate to inventory and five adult children (CIV-0028) — the same "deixou bens a inventariar" formula recorded at the 1991 Volta Redonda death of the owner's paternal grandfather Geraldo Paz Armond (CIV-0003), so both grandfathers died with property to inventory.

  - **[INFERRED]** Dropping "Bittencourt" from his name — he is recorded only as "Antenor Muniz" in every held source — reads as generational assimilation: the immigrant compound surname simplified toward a plain Brazilian name, ordinary in a family with no title or estate-name worth preserving.

  - **[CONTEXTUAL]** His parents Deocleciano × Luiza married in 1916 at Carangola; Antenor was born there in 1923; he married at Alvorada in 1949 and died in Volta Redonda in 2014 — his 90-year life spans from the Sapucaia-to-Carangola frontier move of his grandparents to the final settlement of the whole kin-cluster in the CSN steel city.

  - **[PROVEN endpoints / INFERRED reading]** He died at 90 in Volta Redonda, at the Hospital São João Batista (CIV-0028) — the city where his mother-in-law Celina Bohrer had died in 1977, at the Casa de Saúde São José (CIV-0015), and where his wife Iris Bohrer Muniz would die in 2021 (CIV-0029). Three deaths in three different places, one city: the family's convergence on Volta Redonda is documented across four decades of deaths.

  ## Identity

  Always **Antenor Muniz** in the records we hold [PROVEN] — his 1949 marriage
  certificate (CIV-0004) records the short "Antenor Muniz", a later family civil
  record (CIV-0008, living-person content withheld) repeats it, and the owner's
  direct-ancestor roster (REC-0001) lists him under that name. The fuller **Antenor
  Muniz Bittencourt** — the surname his father and siblings carried — remains a
  **[LEAD]** pending a direct source; do not state it as fact.

  - **Parents:** Deocleciano Muniz Bittencourt (P-0012) and Luiza Fernandes de
  Azevedo (P-0013) — named as his parents in his 1949 marriage certificate (CIV-0004),
  where the father is written simply "Deocleciano Muniz", and again in his 2014 death
  certificate (CIV-0028); his brother Aristides's 1922 baptism (PAR-0003) documents the
  same couple. [PROVEN as stated in the records; parentage held at strong-evidence pending
  his own birth or baptism act — F-0001] The 2014 filiation is not an independent second
  attestation: the declarant presented the 1949 marriage certificate at registration, so
  both rest on one chain of information.

  - **Birth:** 2 November 1923, district of **Alvorada, Minas Gerais** [PROVEN as
  reported] — stated in his 1949 marriage certificate (CIV-0004); this is secondary
  information in a marriage record, not a birth act, and no birth or baptism record
  is held. His 2014 death certificate gives his naturalidade as "Alvorada de Minas - MG"
  (CIV-0028), most likely a registrar's expansion of the Alvorada district of Carangola
  rather than a different birthplace; the marriage record's wording is preferred.
  **[LEAD]** The retrieval research reports that his 1994 identity card (not catalogued
  here; deferred for privacy) also gives 2 November 1923, Minas Gerais, and the same
  parents.

  - **Marriage:** married **Iris Bohrer** (P-0007) at Alvorada on **7 December 1949**
  [PROVEN] (CIV-0004, livro 5, fls 66-v); the bride thereafter signed "Iris Bohrer
  Muniz". The marriage was contracted before the Juiz de Paz [uncertain: Francisco
  Guizotti Gobbi], with the witnesses [uncertain: Yaci Lopes de Faria] and João Machado
  Simas; the certificate held is a copy issued at Vila de Alvorada on 11 August 1955 by
  the interim registrar Francilina Maria de Oliveira. This union is where the maternal
  Muniz line joins the Bohrer line.

  - **Death:** 17 October 2014, at 18:45, at the Hospital São João Batista, **Volta
  Redonda, Rio de Janeiro**, aged 90 [PROVEN] — his civil death certificate (CIV-0028,
  event E-0081). He was still married, his wife Iris surviving him (she died in 2021).
  Cause: acute respiratory failure with pulmonary oedema and systemic hypertension. His
  profession at death was **bombeiro hidráulico** (plumber) and he was resident in Monte
  Castelo, Volta Redonda — he left an estate to inventory ("deixou bens a inventariar"),
  no known will, and five adult children. He was buried in the Cemitério de Volta
  Redonda; the death was registered on 18 October 2014 at the civil registry of the 1ª
  Circunscrição de Volta Redonda (livro C-172, fl. 84, termo 68042).

  - **Children:** five adult children (living; details withheld for privacy) — stated in
  his 2014 death certificate (CIV-0028) and matched by his widow Iris's 2021 record
  (CIV-0029, "deixou 5 filhos maiores").

  ## Standing and profession

  - **Farm worker ("da lavoura")** [PROVEN] — his profession in the 1949 marriage
  certificate (CIV-0004), living in the comarca of Alvorada, Minas Gerais.

  - **Bombeiro hidráulico (plumber)** [PROVEN] — his profession at death in 2014, resident
  in Monte Castelo, Volta Redonda, RJ (CIV-0028). A skilled urban trade, and his final
  recorded occupation; it supersedes "da lavoura" rather than coexisting with it.

  - **Left an estate to inventory** [PROVEN] — his death certificate records "deixou bens a
  inventariar" and no known will (CIV-0028). This is the first documented estate anywhere in
  the Muniz line since his great-grandfather Manoel's Azorean smallholding in 1866
  (PAR-0015).

  - **Literacy:** undocumented [OPEN] — no held record carries his own signature: the
  marriage document (CIV-0004) is a registrar's certificate and the death certificate
  (CIV-0028) was declared by a relative.

  ## Family and social network

  Son of a Carangola (MG) farming family (P-0012 × P-0013); the collaborative tree gives his
  parents six children in total, but no record states that count. [LEAD] His elder brother
  **Aristides** was born on 22 July 1922 and baptised at Santa Luzia do Carangola (PAR-0003)
  [PROVEN]; his fuller name Aristides Muniz Bittencourt and his death in 1981 are reported
  by the retrieval research from records not catalogued here [LEAD]. A further sibling,
  **Rozalina** (b. ~1929, d. 1983), is likewise reported from a 1983 death record and an
  index entry that are not catalogued here [LEAD]. Three additional siblings are attested
  through collaborative trees only and must be treated as leads pending source confirmation:
  **Agenor Muniz Bittencourt** (b. ~1929, d. 2013), **Thereza Bittencourt Almeida** (b.
  ~1933, d. 2023), and **Nestor Muniz Bittencourt** (deceased; dates unknown). [LEAD] The
  godparents at Aristides's baptism were Antonio dos Santos Ferreira and Anna Muniz
  Bittencourt (PAR-0003); the retrieval research identifies this Anna as Deocleciano's
  sister — Antenor's aunt, not a sibling — correcting an older list that counted her among
  his siblings [LEAD]. He married into the **Bohrer** family (Iris, P-0007), born at Presidente Soares, MG
  (CIV-0004) — the maternal line's junction with the Bohrer line. CIV-0008 (a later family
  record; living-person detail withheld) records him and "Iris Bohrer Muniz" as a couple.

  ## What we can extrapolate

  *Antenor closes the four-generation arc — and closes it going up, which is the opposite of
  what the parallel Armond line does in the same city.*

  **1. He did not stay on the land, and the correction is load-bearing [PROVEN — supersedes
  the pre-2026-09-07 reading].** He was *da lavoura* in the Alvorada district of Carangola
  at his 1949 marriage (CIV-0004) and **bombeiro hidráulico** in Monte Castelo, Volta
  Redonda, at his death in 2014 (CIV-0028). The earlier profile cast him as the sibling who
  held the family's rural rung while the others urbanised; his own death certificate refutes
  that. He made the same interior-Minas → industrial-Rio move as the rest of the cluster.

  **2. The exit route was a trade, not schooling — which is what this class had available
  [PROVEN / CONTEXTUAL].** Nothing in the line was ever bought out of a classroom. His
  grandfather and his father could sign their names (CIV-0041, CIV-0006) and it changed
  neither of their positions; **[CONTEXTUAL]** schooling in rural Minas remained a
  purchased, class-linked privilege re-bought each generation, and universal Brazilian
  schooling is a late-twentieth-century achievement. What did move him was an apprenticeable
  skill. **[INFERRED]** *Bombeiro hidráulico* is a qualified trade, not day labour: it
  carried a rate, a name on a form, and a standing in the formal urban labour market that
  "da lavoura" never did.

  **3. A trade and a wage behave completely differently from land — and here that works in
  his favour [CONTEXTUAL / INFERRED].** A trade is the least heritable capital there is: it
  ends with the man, exactly like the unpaid offices that failed the Armond line.
  **[INFERRED]** But unlike those offices it had a **wage underneath it**, and the wage
  could be converted into something that does pass on. That is the mechanism that separates
  Antenor from his four documented ancestors: the Azorean *proprietários* held heritable
  capital with no income stream, his Brazilian father and grandfather held neither, and he
  held an income stream and converted it.

  **4. The conversion is documented, and it is the arc's turning point [PROVEN].** His 2014
  death certificate records that he **"deixou bens a inventariar"** (CIV-0028) — he died
  with property to be inventoried. **[INFERRED]** That is the first documented estate in
  this line since 1866, when Manoel Muniz Bytancourt died intestate at Lomba do Botão
  leaving a smallholding and eight children (PAR-0015). Between those two dates stand three
  generations — João the emigrant, Deocleciano the *lavrador*, and Antenor's own youth — in
  which the family is nowhere documented as owning anything at all. A plumber's wage in the
  CSN steel city did what a century of cultivation had not.

  **5. Volta Redonda is not an accident of geography; it is the mechanism [CONTEXTUAL].**
  The city was built from 1941 around the Companhia Siderúrgica Nacional as a planned
  industrial centre, and it drew exactly this population — landless rural families from
  interior Minas and the Paraíba valley — into formal, documented, wage-paying work.
  **[CONTEXTUAL]** The 1943 labour code turned that wage into a legal category with a floor,
  a record and social insurance; from the 1960s, subsidised housing finance put ownership
  within reach of a skilled tradesman for the first time. **[INFERRED]** None of those
  instruments existed for his father at Carangola. Antenor's rise is not a personal
  exception but the specific opportunity his generation's city offered, taken.

  **6. The two sides of the owner's tree meet here, travelling in opposite directions
  [PROVEN endpoints / INFERRED reading].** The owner's paternal grandfather **Geraldo Paz
  Armond** was a *padeiro* who died in Volta Redonda in 1991; his maternal grandfather
  **Antenor Muniz** was a *bombeiro hidráulico* who died there in 2014. **[INFERRED]** Both
  grandfathers were tradesmen in the same steel city, and they arrived from opposite ends of
  the social scale — the Armonds falling from office-holding and married-in Toledo land
  (P-0027, and the Armond decline), the Muniz climbing from a fragmented Azorean
  smallholding and two propertyless agrarian generations. Volta Redonda is where a declining
  provincial notability and a rising immigrant peasantry converge on the same wage. That
  convergence is the single most structurally revealing fact in the whole family tree.

  **7. And the old arithmetic is still running [PROVEN / INFERRED].** He left **five adult
  children** (CIV-0028). **[INFERRED]** Whatever he accumulated divides five ways, exactly
  as his great-grandfather's Povoação ground divided eight ways in 1866 and his
  grandfather's Carangola household divided eleven ways in 1915. Partible succession
  is not a historical curiosity in this family; it is the continuous condition of it, and
  the only thing that changed across five generations is what there was to divide.

  **8. Dropping the surname is an assimilation marker, not a status move [INFERRED].** He is
  "Antenor Muniz" in every held source, while his father is "Deocleciano Muniz
  Bittencourt" in Aristides's 1922 baptism (PAR-0003) and his siblings are reported to
  have kept "Bittencourt" [LEAD]. **[INFERRED]** Simplifying an immigrant compound surname toward a plain
  Brazilian name is ordinary generational assimilation in a family with no title or
  estate-name worth preserving — and it is the small change that, decades later, made the
  line hard to trace back through Sapucaia to São Miguel. A family with property to signal
  keeps its name; this one had nothing riding on it.

  **Synthesis.** Antenor is where the Muniz line stops merely persisting. His ancestors'
  capital was land that fragmented, then nothing; his was a skill that could not be
  inherited but could be sold, in a city built to buy it. He crossed from subsistence
  cultivation into a formal trade, held it for decades, and died at ninety owning something
  worth inventorying — the line's first property in Brazil after roughly 130 years.
  **[INFERRED]** It is a modest ascent and an entirely typical one, and it is the mirror
  image of the Armond descent that ends in the same city: not a restoration of the Azorean
  *proprietário* standing, but a different kind of property, bought with the one thing none
  of his ancestors ever had — a wage.

  ## Open questions

  - His birth and baptism records (Alvorada, 1923) — not held. Alvorada is a district of
  the município of Carangola, so the birth registration should be at the Cartório de
  Registro Civil de Carangola and the baptism at Santa Luzia de Carangola, the parish that
  baptised his brother Aristides in 1922 (PAR-0003). Either act would also confirm his
  parentage independently of the 1949 marriage certificate. [OPEN]

  - His death record — **held** (CIV-0028): died 17 October 2014, Volta Redonda, RJ.
  [RESOLVED]

  - His inventário — "deixou bens a inventariar" (CIV-0028); a post-2014 estate
  involving living heirs, privacy-gated. [LEAD]

  - Whether he formally bore "Bittencourt" — needs a direct source. [OPEN]

  - A record-based count of his siblings. The six-child total comes from the collaborative
  tree alone; the retrieval research reports bounded-negative FamilySearch index searches
  for Agenor, Thereza and Nestor and for both parents' deaths (most likely too recent to be
  indexed). A death certificate or inventário of Deocleciano or Luiza would name the heirs.
  [OPEN]

  ## Sources held (this repository)

  - CIV-0004 (1949 marriage to Iris Bohrer — his reported birth date/place, "da
  lavoura", his parents) · CIV-0028 (2014 Volta Redonda death certificate — death date
  and place, "bombeiro hidráulico", his parents, five adult children) · CIV-0008 (later
  family civil record; living-person content withheld — corroborates the "Antenor Muniz"
  form) · REC-0001 (owner's direct-ancestor roster) · CIV-0029 (his widow Iris's 2021
  death — corroborates the five adult children).

  - PAR-0003 (1922 baptism of his brother Aristides — documents his parents and the
  Carangola, MG family origin).

  ## Regional and migration context

  His life spans a migration: born and married in the district of **Alvorada**
  (Carangola), MG, a farm worker in 1949 [PROVEN, CIV-0004], he later moved to **Volta
  Redonda, RJ**, where he worked as a plumber and died in 2014 [PROVEN, CIV-0028]. His
  parents' generation had moved from Sapucaia (RJ) into the Zona da Mata Mineira
  (Carangola) around the turn of the century (see P-0012); Antenor's own generation then
  carried the family on into the Rio de Janeiro industrial belt — the whole Volta Redonda
  cluster (his wife, in-laws and collaterals) died there. [CONTEXTUAL]

  ## Where to go today

  - **Birth, marriage and baptism (1923-1949):** Igreja Matriz de Santa Luzia,
  Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) — civil records at the
  Cartório de Registro Civil de Carangola [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)

  - **Death (2014):** Registro Civil das Pessoas Naturais da 1ª Circunscrição de Volta
  Redonda, RJ — livro C-172, fl. 84, termo 68042 (CIV-0028); he lived in the bairro of
  Monte Castelo, Volta Redonda, and was buried in the Cemitério de Volta Redonda [RESOLVED]
profile_pt: >-
  ## Fatos interessantes

  - **[INFERRED]** Duas correntes imigrantes camponesas convergem em seu casamento: sua união com Iris Bohrer (P-0007) funde a linha açoriano-portuguesa dos Muniz (pelo lado paterno, vinda de São Miguel via Sapucaia) com a linha suíço-alemã dos Bohrer (pelo lado da esposa, de Nova Friburgo) — duas famílias imigrantes de pequenos agricultores que se encontram num distrito rural de Minas Gerais.

  - **[CONTEXTUAL]** Registrado como "da lavoura" (trabalhador agrícola) em seu casamento de 1949 (CIV-0004) e como "bombeiro hidráulico" em seu óbito de 2014 em Volta Redonda (CIV-0028) — uma mudança direta de ocupação, da agricultura rural ao ofício urbano, traçando a mesma migração interior-Minas → Rio de Janeiro industrial que todo o núcleo familiar fez.

  - **[PROVEN]** Sua certidão de óbito de 2014 o registra como residente em Monte Castelo, Volta Redonda, e que deixou bens a inventariar e cinco filhos maiores (CIV-0028) — a mesma fórmula "deixou bens a inventariar" registrada no óbito de 1991, em Volta Redonda, do avô paterno do proprietário, Geraldo Paz Armond (CIV-0003), de modo que ambos os avôs morreram com bens a inventariar.

  - **[INFERRED]** Abandonar o "Bittencourt" do nome — em todas as fontes disponíveis ele aparece apenas como "Antenor Muniz" — lê-se como assimilação geracional: o sobrenome composto de imigrante simplificado rumo a um nome brasileiro comum, ordinário numa família sem título ou nome de propriedade que valesse preservar.

  - **[CONTEXTUAL]** Seus pais Deocleciano × Luiza casaram-se em 1916 em Carangola; Antenor nasceu lá em 1923; casou-se em Alvorada em 1949 e faleceu em Volta Redonda em 2014 — seus 90 anos de vida abrangem desde a mudança de fronteira Sapucaia-Carangola de seus avós até o estabelecimento definitivo de todo o grupo de parentesco na cidade siderúrgica da CSN.

  - **[PROVEN nas pontas / INFERRED na leitura]** Faleceu aos 90 anos em Volta Redonda, no Hospital São João Batista (CIV-0028) — a cidade onde sua sogra Celina Bohrer havia falecido em 1977, na Casa de Saúde São José (CIV-0015), e onde sua esposa Iris Bohrer Muniz viria a falecer em 2021 (CIV-0029). Três óbitos em três lugares diferentes, uma só cidade: a convergência da família em Volta Redonda está documentada em quatro décadas de óbitos.

  ## Identidade

  Sempre **Antenor Muniz** nos registros que possuímos [PROVEN] — sua certidão de
  casamento de 1949 (CIV-0004) registra a forma curta "Antenor Muniz", um registro
  civil familiar posterior (CIV-0008, com conteúdo de pessoa viva omitido) a repete,
  e a lista de ancestrais diretos do proprietário (REC-0001) o nomeia assim. A forma
  mais completa **Antenor Muniz Bittencourt** — o sobrenome que seu pai e irmãos
  carregavam — permanece uma **[LEAD]** pendente de fonte direta; não afirmar como
  fato.

  - **Pais:** Deocleciano Muniz Bittencourt (P-0012) e Luiza Fernandes de Azevedo
  (P-0013) — nomeados como seus pais em sua certidão de casamento de 1949 (CIV-0004),
  onde o pai aparece simplesmente como "Deocleciano Muniz", e de novo em sua certidão de
  óbito de 2014 (CIV-0028); o batismo de 1922 de seu irmão Aristides (PAR-0003) documenta
  o mesmo casal. [PROVEN como declarado nos registros; filiação mantida em evidência forte
  até seu próprio assento de nascimento ou batismo — F-0001] A filiação de 2014 não é uma
  segunda atestação independente: o declarante apresentou a certidão de casamento de 1949
  no registro, de modo que ambas repousam numa só cadeia de informação.

  - **Nascimento:** 2 de novembro de 1923, distrito de **Alvorada, Minas Gerais**
  [PROVEN as reported] — declarado em sua certidão de casamento de 1949 (CIV-0004);
  trata-se de informação secundária em um registro de casamento, não de um assento de
  nascimento, e nenhum registro de nascimento ou batismo é conservado. Sua certidão de
  óbito de 2014 dá como naturalidade "Alvorada de Minas - MG" (CIV-0028), muito
  provavelmente uma expansão do escrivão para o distrito de Alvorada, em Carangola, e não
  outro local de nascimento; prevalece a redação do registro de casamento. **[LEAD]** A
  pesquisa de recuperação informa que sua carteira de identidade de 1994 (não catalogada
  aqui; adiada por privacidade) também dá 2 de novembro de 1923, Minas Gerais, e os mesmos
  pais.

  - **Casamento:** casou-se com **Iris Bohrer** (P-0007) em Alvorada em **7 de
  dezembro de 1949** [PROVEN] (CIV-0004, livro 5, fls 66-v); a noiva passou a
  assinar "Iris Bohrer Muniz". O casamento foi contraído perante o Juiz de Paz
  [uncertain: Francisco Guizotti Gobbi], com as testemunhas [uncertain: Yaci Lopes de
  Faria] e João Machado Simas; a certidão conservada é uma cópia emitida na Vila de
  Alvorada em 11 de agosto de 1955 pela oficial interina Francilina Maria de Oliveira.
  Essa união é onde a linha materna Muniz se junta à
  linha Bohrer.

  - **Óbito:** 17 de outubro de 2014, às 18:45, no Hospital São João Batista, **Volta
  Redonda, Rio de Janeiro**, aos 90 anos [PROVEN] — sua certidão de óbito (CIV-0028,
  evento E-0081). Ainda era casado, sua esposa Iris o sobrevivendo (ela faleceu em 2021).
  Causa: insuficiência respiratória aguda com edema pulmonar e hipertensão sistêmica. Sua
  profissão ao falecer era **bombeiro hidráulico**, residente em Monte Castelo, Volta
  Redonda — deixou bens a inventariar, nenhum testamento conhecido e cinco filhos maiores.
  Foi sepultado no Cemitério de Volta Redonda; o óbito foi registrado em 18 de outubro de
  2014 no Registro Civil da 1ª Circunscrição de Volta Redonda (livro C-172, fl. 84, termo
  68042).

  - **Filhos:** cinco filhos maiores (vivos; detalhes omitidos por privacidade) — declarado
  em sua certidão de óbito de 2014 (CIV-0028) e coincidente com o registro de 2021 de sua
  esposa Iris (CIV-0029, "deixou 5 filhos maiores").

  ## Posição social e profissão

  - **Trabalhador da lavoura ("da lavoura")** [PROVEN] — sua profissão na certidão de
  casamento de 1949 (CIV-0004), residente na comarca de Alvorada, Minas Gerais.

  - **Bombeiro hidráulico** [PROVEN] — sua profissão ao falecer em 2014, residente em Monte
  Castelo, Volta Redonda, RJ (CIV-0028). Um ofício urbano qualificado, e sua última ocupação
  registrada; supera "da lavoura", em vez de coexistir com ela.

  - **Deixou bens a inventariar** [PROVEN] — sua certidão de óbito registra que "deixou bens
  a inventariar" e não deixou testamento conhecido (CIV-0028). É o primeiro espólio
  documentado em toda a linhagem Muniz desde a pequena propriedade açoriana de seu bisavô
  Manoel, em 1866 (PAR-0015).

  - **Alfabetização:** não documentada [OPEN] — nenhum registro em mãos traz sua própria
  assinatura: o documento de casamento (CIV-0004) é uma certidão do escrivão e o óbito
  (CIV-0028) foi declarado por um parente.

  ## Família e rede social

  Filho de uma família de lavradores de Carangola (MG) (P-0012 × P-0013); a árvore
  colaborativa atribui a seus pais seis filhos no total, mas nenhum registro declara essa
  contagem. [LEAD] Seu irmão mais velho **Aristides** nasceu em 22 de julho de 1922 e foi
  batizado em Santa Luzia do Carangola (PAR-0003) [PROVEN]; o nome completo Aristides Muniz
  Bittencourt e seu óbito em 1981 são informados pela pesquisa de recuperação a partir de
  registros não catalogados aqui [LEAD]. Uma irmã adicional, **Rozalina** (n. ~1929, f.
  1983), é igualmente informada a partir de um óbito de 1983 e de uma entrada de índice não
  catalogados aqui [LEAD]. Três outros
  irmãos são atestados apenas por árvores colaborativas e devem ser tratados como pistas
  pendentes de confirmação por fonte: **Agenor Muniz Bittencourt** (n. ~1929, f. 2013),
  **Thereza Bittencourt Almeida** (n. ~1933, f. 2023) e **Nestor Muniz Bittencourt**
  (falecido; datas desconhecidas). [LEAD] Os padrinhos no batismo de Aristides foram
  Antonio dos Santos Ferreira e Anna Muniz Bittencourt (PAR-0003); a pesquisa de
  recuperação identifica essa Anna como irmã de Deocleciano — tia de Antenor, não irmã —,
  corrigindo uma lista antiga que a contava entre seus irmãos [LEAD]. Casou-se com a família **Bohrer** (Iris, P-0007),
  nascida em Presidente Soares, MG (CIV-0004) — o ponto de junção da linha materna com a
  linha Bohrer. CIV-0008 (registro familiar posterior; detalhe de pessoa viva omitido) o
  registra, com "Iris Bohrer Muniz", como casal.

  ## O que podemos extrapolar

  *Antenor fecha o arco de quatro gerações — e o fecha para cima, que é o oposto do que a
  linhagem Armond paralela faz na mesma cidade.*

  **1. Ele não ficou na terra, e a correção é estrutural [PROVEN — supera a leitura anterior
  a 2026-09-07].** Era *da lavoura* no distrito de Alvorada, em Carangola, em seu casamento
  de 1949 (CIV-0004), e **bombeiro hidráulico** em Monte Castelo, Volta Redonda, ao falecer
  em 2014 (CIV-0028). O perfil anterior o apresentava como o irmão que manteve o degrau
  rural da família enquanto os outros se urbanizavam; sua própria certidão de óbito refuta
  isso. Ele fez a mesma mudança interior-Minas → Rio industrial que o restante do núcleo
  familiar.

  **2. A rota de saída foi um ofício, não a escola — que era o que esta classe tinha à
  disposição [PROVEN / CONTEXTUAL].** Nada nesta linhagem foi jamais comprado numa sala de
  aula. Seu avô e seu pai sabiam assinar o nome (CIV-0041, CIV-0006) e isso não mudou a
  posição de nenhum dos dois; **[CONTEXTUAL]** a escolarização nas Minas rurais seguiu sendo
  privilégio comprado e ligado à classe, recomprado a cada geração, e a escolarização
  universal brasileira é conquista do fim do século XX. O que o moveu foi uma habilidade
  aprendível por aprendizado. **[INFERRED]** *Bombeiro hidráulico* é ofício qualificado, não
  diária: trazia uma tabela, um nome num formulário e uma posição no mercado urbano formal
  de trabalho que "da lavoura" nunca trouxe.

  **3. Um ofício e um salário se comportam de modo completamente diverso da terra — e aqui
  isso joga a favor dele [CONTEXTUAL / INFERRED].** Um ofício é o capital menos herdável que
  existe: acaba com o homem, exatamente como os cargos não remunerados que falharam com a
  linhagem Armond. **[INFERRED]** Mas, ao contrário daqueles cargos, tinha um **salário por
  baixo**, e o salário podia ser convertido em algo que se transmite. É esse o mecanismo que
  separa Antenor de seus quatro ancestrais documentados: os *proprietários* açorianos tinham
  capital herdável sem fluxo de renda, seu pai e seu avô brasileiros não tinham nem uma
  coisa nem outra, e ele teve um fluxo de renda e o converteu.

  **4. A conversão está documentada, e é o ponto de virada do arco [PROVEN].** Sua certidão
  de óbito de 2014 registra que **"deixou bens a inventariar"** (CIV-0028) — morreu com bens
  a inventariar. **[INFERRED]** É o primeiro espólio documentado nesta linhagem desde 1866,
  quando Manoel Muniz Bytancourt morreu intestado na Lomba do Botão deixando uma pequena
  propriedade e oito filhos (PAR-0015). Entre essas duas datas estão três gerações — João, o
  emigrante; Deocleciano, o *lavrador*; e a própria juventude de Antenor — em que a família
  em parte alguma se documenta como proprietária de coisa alguma. Um salário de bombeiro
  hidráulico na cidade siderúrgica da CSN fez o que um século de lavoura não fizera.

  **5. Volta Redonda não é um acidente de geografia; é o mecanismo [CONTEXTUAL].** A cidade
  foi construída a partir de 1941 em torno da Companhia Siderúrgica Nacional como centro
  industrial planejado, e atraiu exatamente esta população — famílias rurais sem terra do
  interior de Minas e do vale do Paraíba — para o trabalho formal, documentado e
  assalariado. **[CONTEXTUAL]** A legislação trabalhista de 1943 transformou esse salário em
  categoria jurídica com piso, registro e seguro social; a partir dos anos 1960, o
  financiamento habitacional subsidiado colocou a propriedade ao alcance de um trabalhador
  de ofício qualificado pela primeira vez. **[INFERRED]** Nenhum desses instrumentos existia
  para seu pai em Carangola. A ascensão de Antenor não é exceção pessoal, mas a oportunidade
  específica que a cidade de sua geração oferecia, aproveitada.

  **6. Os dois lados da árvore do proprietário do repositório se encontram aqui, viajando em
  direções opostas [PROVEN nas pontas / INFERRED na leitura].** O avô paterno do
  proprietário, **Geraldo Paz Armond**, foi *padeiro* e faleceu em Volta Redonda em 1991;
  seu avô materno, **Antenor Muniz**, foi *bombeiro hidráulico* e faleceu ali em 2014.
  **[INFERRED]** Ambos os avôs foram homens de ofício na mesma cidade siderúrgica, e
  chegaram de extremos opostos da escala social — os Armond caindo de cargos e de terra
  Toledo vinda pelo casamento (P-0027, e o declínio Armond), os Muniz subindo de uma pequena
  propriedade açoriana fragmentada e de duas gerações agrárias sem bens. Volta Redonda é
  onde uma notabilidade provinciana em queda e um campesinato imigrante em ascensão
  convergem sobre o mesmo salário. Essa convergência é o fato estruturalmente mais revelador
  de toda a árvore familiar.

  **7. E a velha aritmética continua rodando [PROVEN / INFERRED].** Ele deixou **cinco
  filhos maiores** (CIV-0028). **[INFERRED]** O que quer que tenha acumulado divide-se em
  cinco, exatamente como o chão da Povoação de seu bisavô se dividiu em oito em 1866 e a
  casa de Carangola de seu avô se dividiu em onze em 1915. A sucessão partilhável não é
  curiosidade histórica nesta família; é sua condição contínua, e a única coisa que mudou ao
  longo de cinco gerações foi o que havia a dividir.

  **8. Abandonar o sobrenome é marcador de assimilação, não movimento de posição
  [INFERRED].** Ele é "Antenor Muniz" em todas as fontes que temos, enquanto seu pai é
  "Deocleciano Muniz Bittencourt" no batismo de Aristides em 1922 (PAR-0003) e seus irmãos
  teriam mantido "Bittencourt" [LEAD]. **[INFERRED]** Simplificar um sobrenome
  composto de imigrante rumo a um nome brasileiro comum é assimilação geracional ordinária
  numa família sem título ou nome de propriedade que valesse preservar — e é a pequena
  mudança que, décadas depois, tornou difícil rastrear a linhagem de volta, por Sapucaia,
  até São Miguel. Uma família com patrimônio a sinalizar guarda o nome; esta não tinha nada
  apostado nele.

  **Síntese.** Antenor é o ponto em que a linhagem Muniz deixa de apenas persistir. O
  capital de seus ancestrais foi terra que se fragmentou e, depois, nada; o dele foi uma
  habilidade que não podia ser herdada, mas podia ser vendida, numa cidade construída para
  comprá-la. Passou da lavoura de subsistência a um ofício formal, sustentou-o por décadas e
  morreu aos noventa anos possuindo algo que valia inventariar — a primeira propriedade da
  linhagem no Brasil depois de cerca de 130 anos. **[INFERRED]** É uma ascensão modesta e
  inteiramente típica, e é a imagem invertida da descida Armond que termina na mesma cidade:
  não a restauração da condição de *proprietário* açoriano, mas outra espécie de
  propriedade, comprada com a única coisa que nenhum de seus ancestrais jamais teve — um
  salário.

  ## Questões em aberto

  - Seus registros de nascimento e batismo (Alvorada, 1923) — não conservados. Alvorada é
  distrito do município de Carangola, de modo que o registro de nascimento deve estar no
  Cartório de Registro Civil de Carangola e o batismo em Santa Luzia de Carangola, a
  paróquia que batizou seu irmão Aristides em 1922 (PAR-0003). Qualquer dos dois atos
  também confirmaria sua filiação independentemente da certidão de casamento de 1949.
  [OPEN]

  - Seu registro de óbito — **conservado** (CIV-0028): faleceu em 17 de outubro de 2014,
  Volta Redonda, RJ. [RESOLVED]

  - Seu inventário — "deixou bens a inventariar" (CIV-0028); espólio pós-2014 envolvendo
  herdeiros vivos, restrito por privacidade. [LEAD]

  - Se ele portava formalmente "Bittencourt" — requer fonte direta. [OPEN]

  - Uma contagem de seus irmãos baseada em registro. O total de seis filhos vem apenas da
  árvore colaborativa; a pesquisa de recuperação informa buscas com resultado negativo
  delimitado nos índices do FamilySearch para Agenor, Thereza e Nestor e para os óbitos de
  ambos os pais (muito provavelmente recentes demais para estarem indexados). Uma certidão
  de óbito ou inventário de Deocleciano ou de Luiza nomearia os herdeiros. [OPEN]

