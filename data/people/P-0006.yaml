profile: >-
  ## Identity

  Always **Antenor Muniz** in the records we hold [PROVEN] — his 1949 marriage
  certificate (CIV-0004) records the short "Antenor Muniz", a later family civil
  record (CIV-0008, living-person content withheld) repeats it, and the owner's
  direct-ancestor roster (REC-0001) lists him under that name. The fuller **Antenor
  Muniz Bittencourt** — the surname his father and siblings carried — remains a
  **[LEAD]** pending a direct source; do not state it as fact.

  - **Parents:** Deocleciano Muniz Bittencourt (P-0012) and Luiza Fernandes de
  Azevedo (P-0013) [PROVEN] — named as his parents in his 1949 marriage certificate
  (CIV-0004); his brother Aristides's 1922 baptism (PAR-0003) documents the same
  couple.

  - **Birth:** 2 November 1923, district of **Alvorada, Minas Gerais** [PROVEN as
  reported] — stated in his 1949 marriage certificate (CIV-0004); this is secondary
  information in a marriage record, not a birth act, and no birth or baptism record
  is held.

  - **Marriage:** married **Iris Bohrer** (P-0007) at Alvorada on **7 December 1949**
  [PROVEN] (CIV-0004, livro 5, fls 66-v); the bride thereafter signed "Iris Bohrer
  Muniz". This union is where the maternal Muniz line joins the Bohrer line.

  - **Death:** not documented in this repository [OPEN]. A FamilySearch-tree lifespan
  (1923–2014) circulates, but no death record is held [LEAD].

  - **Children:** at least one living child (Juan's parent); details withheld for
  privacy.

  ## Standing and profession

  - **Farm worker ("da lavoura")** [PROVEN] — his profession in the 1949 marriage
  certificate (CIV-0004), living in the comarca of Alvorada, Minas Gerais.

  ## Family and social network

  Son of a Carangola (MG) farming family (P-0012 × P-0013); his 1922-born brother
  **Aristides** is documented at PAR-0003. He married into the **Bohrer** family
  (Iris, P-0007), born at Presidente Soares, MG (CIV-0004) — the maternal line's
  junction with the Bohrer line. CIV-0008 (a later family record; living-person
  detail withheld) records him and "Iris Bohrer Muniz" as a couple.

  ## What we can extrapolate

  [INFERRED] His documented life is that of a rural Minas Gerais smallholder / farm
  worker who married and settled in the Alvorada district. The short "Antenor Muniz",
  dropping the paternal "Bittencourt" his siblings kept, is a plausible identity
  simplification — but our repository proves only the short form; the fuller name is
  a lead.

  [INFERRED] Antenor is the 20th-century fork in the Muniz arc — the sibling who held
  the family's ancestral class position by *not* moving. In a line whose only durable
  capital was land-and-labour (see P-0012, P-0019), staying a *lavrador* in Alvorada was
  itself the way to hold the family's inherited rung. Reports that his siblings joined
  the 20th-century rural exodus into the Rio de Janeiro Baixada Fluminense, landing as
  urban working class, are leads not held here [LEAD]; if so, that urbanisation is the
  same downward step the parallel Armond line took a generation earlier, and Antenor is
  the branch that did not take it.

  [INFERRED] Two immigrant peasant streams converge in him, and both were agrarian and
  land-poor: his marriage to Iris Bohrer (P-0007) merges the Azorean-Portuguese Muniz
  with the Swiss/German Bohrer, but the union pools two smallholder-agrarian immigrant
  lines whose capital was the same — land, labour and kinship, not office, title or
  schooling — meeting in one Minas Gerais farming district rather than marrying across
  classes.

  [INFERRED] Dropping "Bittencourt" reads as an assimilation marker, not a status move:
  keeping only "Muniz" simplified the immigrant compound surname toward a plain
  Brazilian name — ordinary generational assimilation in a family with no title or
  estate-name worth preserving — the small shift that, decades on, made the line harder
  to trace back to Sapucaia and São Miguel.

  [CONTEXTUAL] His "da lavoura" living was subsistence off his own plot, not a wage —
  the São Miguel *proprietário* → Zona da Mata cultivator baseline, land held as a living
  rather than accumulating capital, and the bottom of the family tree's economic range
  (the opposite end from the top-of-range Toledo slaveholding coffee fazenda on the
  Armond side). It is exactly the rung that staying rural let him hold.

  [INFERRED] So Antenor closes the Muniz arc where it began — on the land. The line
  never had elite standing to lose, so its story is not decline but agrarian persistence,
  and Antenor is its clearest 20th-century expression: the son who kept farming. The
  class drop that hit the urbanising branches (and, a generation earlier, the Armonds)
  simply did not reach the branch that stayed rural.

  ## Open questions

  - His birth and baptism records (Alvorada, 1923) — not held. [OPEN]

  - His death record (reportedly c.2014) — not held; only a FamilySearch-tree
  lifespan. [LEAD]

  - Whether he formally bore "Bittencourt" — needs a direct source. [OPEN]

  ## Sources held (this repository)

  - CIV-0004 (1949 marriage to Iris Bohrer — his reported birth date/place, "da
  lavoura", his parents) · CIV-0008 (later family civil record; living-person content
  withheld — corroborates the "Antenor Muniz" form) · REC-0001 (owner's
  direct-ancestor roster).

  - PAR-0003 (1922 baptism of his brother Aristides — documents his parents and the
  Carangola, MG family origin).

  ## Regional and migration context

  His documented life sits in rural **Minas Gerais** — born and married in the
  district of **Alvorada** [PROVEN, CIV-0004]. His parents' generation had moved from
  Sapucaia (RJ) into the Zona da Mata Mineira (Carangola) around the turn of the
  century (see P-0012); Antenor's own record places him on the land at Alvorada as a
  farm worker. [CONTEXTUAL] Reports that his siblings later joined the rural exodus
  into the Rio de Janeiro Baixada Fluminense are leads, not held here.
profile_pt: >-
  ## Identidade

  Sempre **Antenor Muniz** nos registros que possuímos [PROVEN] — sua certidão de
  casamento de 1949 (CIV-0004) registra a forma curta "Antenor Muniz", um registro
  civil familiar posterior (CIV-0008, com conteúdo de pessoa viva omitido) a repete,
  e a lista de ancestrais diretos do proprietário (REC-0001) o nomeia assim. A forma
  mais completa **Antenor Muniz Bittencourt** — o sobrenome que seu pai e irmãos
  carregavam — permanece uma **[LEAD]** pendente de fonte direta; não afirmar como
  fato.

  - **Pais:** Deocleciano Muniz Bittencourt (P-0012) e Luiza Fernandes de Azevedo
  (P-0013) [PROVEN] — nomeados como seus pais em sua certidão de casamento de 1949
  (CIV-0004); o batismo de 1922 de seu irmão Aristides (PAR-0003) documenta o mesmo
  casal.

  - **Nascimento:** 2 de novembro de 1923, distrito de **Alvorada, Minas Gerais**
  [PROVEN as reported] — declarado em sua certidão de casamento de 1949 (CIV-0004);
  trata-se de informação secundária em um registro de casamento, não de um assento de
  nascimento, e nenhum registro de nascimento ou batismo é conservado.

  - **Casamento:** casou-se com **Iris Bohrer** (P-0007) em Alvorada em **7 de
  dezembro de 1949** [PROVEN] (CIV-0004, livro 5, fls 66-v); a noiva passou a
  assinar "Iris Bohrer Muniz". Essa união é onde a linha materna Muniz se junta à
  linha Bohrer.

  - **Óbito:** não documentado neste repositório [OPEN]. Circula um período de vida
  da árvore do FamilySearch (1923–2014), mas nenhum registro de óbito é conservado
  [LEAD].

  - **Filhos:** ao menos um filho vivo (o pai/mãe de Juan); detalhes omitidos por
  privacidade.

  ## Posição social e profissão

  - **Trabalhador da lavoura ("da lavoura")** [PROVEN] — sua profissão na certidão de
  casamento de 1949 (CIV-0004), residente na comarca de Alvorada, Minas Gerais.

  ## Família e rede social

  Filho de uma família de lavradores de Carangola (MG) (P-0012 × P-0013); seu irmão
  **Aristides**, nascido em 1922, está documentado em PAR-0003. Casou-se com a família
  **Bohrer** (Iris, P-0007), nascida em Presidente Soares, MG (CIV-0004) — o ponto de
  junção da linha materna com a linha Bohrer. CIV-0008 (registro familiar posterior;
  detalhe de pessoa viva omitido) o registra, com "Iris Bohrer Muniz", como casal.

  ## O que podemos extrapolar

  [INFERRED] Sua vida documentada é a de um pequeno proprietário / trabalhador da
  lavoura do meio rural de Minas Gerais que se casou e se fixou no distrito de
  Alvorada. A forma curta "Antenor Muniz", abandonando o "Bittencourt" paterno que
  seus irmãos mantiveram, é uma simplificação de identidade plausível — mas nosso
  repositório comprova apenas a forma curta; o nome completo é uma pista.

  [INFERRED] Antenor é a bifurcação do século XX no arco Muniz — o irmão que manteve a
  posição de classe ancestral da família ao *não* se mudar. Numa linhagem cujo único
  capital durável era a terra-e-o-trabalho (ver P-0012, P-0019), permanecer *lavrador*
  em Alvorada era, em si, a maneira de manter o degrau herdado da família. Relatos de que
  seus irmãos se juntaram ao êxodo rural do século XX rumo à Baixada Fluminense (RJ),
  aportando como classe trabalhadora urbana, são pistas não conservadas aqui [LEAD]; se
  assim for, essa urbanização é o mesmo passo descendente que a linha Armond paralela deu
  uma geração antes, e Antenor é o ramo que não o deu.

  [INFERRED] Duas correntes imigrantes camponesas convergem nele, ambas agrárias e pobres
  em terra: seu casamento com Iris Bohrer (P-0007) funde os Muniz açoriano-portugueses com
  os Bohrer suíço-alemães, mas a união reúne duas linhas imigrantes de pequenos
  agricultores cujo capital era o mesmo — terra, trabalho e parentesco, não cargo, título
  ou instrução — encontrando-se em um único distrito rural de Minas Gerais, e não num
  casamento entre classes.

  [INFERRED] Abandonar o "Bittencourt" lê-se como um marcador de assimilação, não como um
  movimento de status: manter apenas "Muniz" simplificou o sobrenome composto de imigrante
  rumo a um nome brasileiro comum — assimilação geracional ordinária numa família sem
  título ou nome de propriedade que valesse preservar — a pequena mudança que, décadas
  depois, tornou a linhagem mais difícil de rastrear até Sapucaia e São Miguel.

  [CONTEXTUAL] Seu sustento "da lavoura" era subsistência do próprio lote, não um salário
  — a linha de base do cultivador *proprietário* de São Miguel → Zona da Mata, terra
  tomada como meio de vida e não como capital acumulável, e a extremidade inferior da
  faixa econômica da árvore familiar (o polo oposto ao topo, a fazenda de café escravista
  dos Toledo, no lado Armond). É exatamente o degrau que permanecer no campo lhe permitiu
  manter.

  [INFERRED] Assim, Antenor fecha o arco Muniz onde ele começou — na terra. A linhagem
  nunca teve posição de elite a perder, de modo que sua história não é de declínio, mas de
  persistência agrária, e Antenor é sua expressão mais clara no século XX: o filho que
  continuou lavrando. A queda de classe que atingiu os ramos que se urbanizaram (e, uma
  geração antes, os Armond) simplesmente não alcançou o ramo que ficou no campo.

  ## Questões em aberto

  - Seus registros de nascimento e batismo (Alvorada, 1923) — não conservados. [OPEN]

  - Seu registro de óbito (supostamente c.2014) — não conservado; apenas um período de
  vida da árvore do FamilySearch. [LEAD]

  - Se ele portava formalmente "Bittencourt" — requer fonte direta. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0004 (casamento de 1949 com Iris Bohrer — sua data/local de nascimento
  reportados, "da lavoura", seus pais) · CIV-0008 (registro civil familiar posterior;
  conteúdo de pessoa viva omitido — corrobora a forma "Antenor Muniz") · REC-0001
  (lista de ancestrais diretos do proprietário).

  - PAR-0003 (batismo de 1922 de seu irmão Aristides — documenta seus pais e a origem
  familiar em Carangola, MG).

  ## Contexto regional e migratório

  Sua vida documentada situa-se no meio rural de **Minas Gerais** — nasceu e casou-se
  no distrito de **Alvorada** [PROVEN, CIV-0004]. A geração de seus pais havia se
  mudado de Sapucaia (RJ) para a Zona da Mata Mineira (Carangola) na virada do século
  (ver P-0012); o próprio registro de Antenor o coloca na terra em Alvorada como
  trabalhador da lavoura. [CONTEXTUAL] Relatos de que seus irmãos depois se juntaram ao
  êxodo rural rumo à Baixada Fluminense (RJ) são pistas, não conservadas aqui.
