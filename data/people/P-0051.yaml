notes:
- text: >-
    Mother of Francisco José Bohrer (P-0034); hence Joaquim José Bohrer's (P-0030)
    paternal grandmother. Named in her son's 1888 registered will (PRB-0005) as
    "Catharina Mayer … já fallecida" — deceased before 1888.
  text_pt: >-
    Mãe de Francisco José Bohrer (P-0034); portanto, a avó paterna de Joaquim
    José Bohrer (P-0030). Nomeada no testamento registrado de 1888 de seu filho
    (PRB-0005) como "Catharina Mayer … já fallecida" — falecida antes de 1888.
- text: >-
    Surname conflict preserved: the primary will writes "Mayer", but two secondary
    Nova Friburgo colonist-family compilations (a lead, not catalogued) give "Moser"
    (Catharina Moser of Hägendorf, Soleure, Switzerland, married Jacob Borer 1825).
    "Mayer" is recorded as the source-attested form and "Moser" as an unresolved
    variant; the retrieval note argues the two are the same person, but no primary
    record settles it, so neither surname is treated as certain and no origin is
    asserted. Nationality deliberately left unset for the same reason.
  text_pt: >-
    Conflito de sobrenome preservado: o testamento primário escreve "Mayer", mas
    duas compilações secundárias de famílias de colonos de Nova Friburgo (uma
    pista, não catalogada) trazem "Moser" (Catharina Moser de Hägendorf, Soleure,
    Suíça, casada com Jacob Borer em 1825). "Mayer" é registrado como a forma
    atestada pela fonte e "Moser" como variante não resolvida; a nota de
    recuperação argumenta que as duas são a mesma pessoa, mas nenhum registro
    primário resolve a questão, de modo que nenhum dos sobrenomes é tratado como
    certo e nenhuma origem é afirmada. A nacionalidade foi deliberadamente deixada
    em aberto pela mesma razão.
