notes:
- text: >-
    Mother of Francisco José Bohrer (P-0034); hence Joaquim José Bohrer's (P-0030)
    paternal grandmother. Named in her son's 1888 registered will (PRB-0005) as
    "Catharina Mayer … já fallecida" — deceased before 1888.
- text: >-
    Surname conflict preserved: the primary will writes "Mayer", but two secondary
    Nova Friburgo colonist-family compilations (a lead, not catalogued) give "Moser"
    (Catharina Moser of Hägendorf, Soleure, Switzerland, married Jacob Borer 1825).
    "Mayer" is recorded as the source-attested form and "Moser" as an unresolved
    variant; the retrieval note argues the two are the same person, but no primary
    record settles it, so neither surname is treated as certain and no origin is
    asserted. Nationality deliberately left unset for the same reason.
