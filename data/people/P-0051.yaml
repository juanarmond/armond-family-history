profile: >-
  ## Identity

  **Catharina Mayer** in the one primary record; **Catharina Moser** in the Nova Friburgo
  colonist compilations [PROVEN for "Mayer", the will's form; "Moser" is an unresolved
  variant, [LEAD]]. She is the mother of Francisco José Bohrer (P-0034) and hence paternal
  grandmother of Joaquim José Bohrer (P-0030).

  - **Death:** before 1888 [PROVEN] — named in her son's 1888 registered will (PRB-0005)
  as "Catharina Mayer … já fallecida."

  - **Origin:** Swiss — Canton Solothurn (Soleure) — **primary-confirmed** by her own 1825
  Nova Friburgo marriage (PAR-0059, event E-0116), which names the spouses "colonos suiços"
  of the Cantão de Soleure and records her as natural / baptised at Eggendorf, read as
  **Hägendorf [uncertain]** [PROVEN for the canton / Swiss origin; the parish read is
  uncertain]. **Parents:** unknown from any held record [OPEN]; the compilations name them as
  Joseph Moser × Anne Marie Weiss of Hägendorf — [LEAD], not catalogued.

  ## Family and social network

  Wife of Jacob Bohrer (P-0050), whom she married at Nova Friburgo in 1825 (PAR-0059, event
  E-0116); the couple are the Bohrer line's immigrant-boundary generation (family F-0024).
  Her one securely attested child is Francisco José Bohrer; PUB-0003 (BORER I) credits the
  couple with nine children [LEAD].

  ## What we can extrapolate

  The surname conflict is the crux of her record: a Portuguese-language will drafted two
  generations later, from memory, is exactly where a German maiden name "Moser" could be
  rendered as the more familiar "Mayer." The compilations converging on "Moser" are
  suggestive, but nothing primary settles the maiden surname, so neither surname is treated
  as certain. Her Swiss / Solothurn origin, by contrast, is now primary-confirmed by the
  1825 marriage (PAR-0059). [INFERRED]

  Her Swiss origin now confirmed, her life sits at the same socioeconomic floor as her
  husband's, but — if the compilation holds — reached differently, as an intact family
  rather than as an orphan. [CONTEXTUAL / INFERRED]

  - **A whole-family colony emigration** [LEAD / INFERRED] — the compilations have her Moser
  family emigrating together in the 1819 Solothurn wave (her father Joseph Moser granted
  colonist Lote 67, her mother Anne Marie Weiss), unlike her husband Jacob, who came out an
  orphan. She married a fellow Solothurn colonist at the Nova Friburgo Cathedral in 1825,
  and her daughters later married into the Chaboudez family — endogamous colony society. Her
  parents living nearby is the likeliest reason the widowed household survived Jacob's early
  death intact.

  - **She married sideways into an equally-poor household** [INFERRED] — Jacob was a
  butcher-colonist orphan carrying no Swiss capital; the 1825 union joined two floor-level
  colony families, adding no heritable wealth to either. This is the Bohrer arc's bottom,
  the structural opposite of the Armond decline — there was never a fortune to lose.
  [CONTEXTUAL]

  - **Widowhood put a small holding into her hands, then partible succession dissolved it**
  [INFERRED / CONTEXTUAL] — after Jacob's death (~1843) she is very likely the "Viúva
  Catharina Bohrer" of the 1855 Nova Friburgo land registry, so she held and managed the
  family land into widowhood; but Brazilian partible succession then split that one poor lot
  equally among the many children, and again among theirs — poor land ÷ many heirs, which
  forecloses any estate from forming. [LEAD for the widow identification]

  ## Open questions

  - Her maiden surname at primary level (Mayer vs Moser) — still unresolved: the 1825
  marriage register (PAR-0059) confirms her Swiss / Solothurn origin but does not settle the
  maiden surname. A decisive record would be Jacob Bohrer's Nova Friburgo inventário or a
  Swiss (Hägendorf) baptism register, which would also fix her exact birth date (not held)
  and name her parents at primary level. [OPEN]

  ## Sources held (this repository)

  - PRB-0005 (Francisco José Bohrer's 1888 registered will — names her "Catharina Mayer …
  já fallecida").

  - PAR-0059 (her and Jacob's 1825 Nova Friburgo marriage, primary parish register — names
  both spouses "colonos suiços" of the Cantão de Soleure and records her as baptised at
  Eggendorf, read as Hägendorf [uncertain]; the primary record that confirms her Swiss /
  Solothurn origin and sources her birth event E-0116).

  ## Where to go today

  - **Birth (~1805):** Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf, Solothurn, Switzerland
  (4614 Hägendorf; GPS 47.3347, 7.8445) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3347,7.8445)

  - **Marriage to Jacob Borer (1825):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova
  Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro; GPS -22.28159, -42.53085) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Identidade

  **Catharina Mayer** no único registro primário; **Catharina Moser** nas compilações de
  colonos de Nova Friburgo [PROVEN para "Mayer", a forma do testamento; "Moser" é uma
  variante não resolvida, [LEAD]]. Ela é a mãe de Francisco José Bohrer (P-0034) e,
  portanto, avó paterna de Joaquim José Bohrer (P-0030).

  - **Óbito:** antes de 1888 [PROVEN] — nomeada no testamento registrado de 1888 de seu
  filho (PRB-0005) como "Catharina Mayer … já fallecida".

  - **Origem:** suíça — Cantão de Solothurn (Soleure) — **confirmada por registro primário**
  pelo seu próprio casamento em Nova Friburgo, em 1825 (PAR-0059, evento E-0116), que nomeia
  os cônjuges "colonos suiços" do Cantão de Soleure e a lança como natural / batizada em
  Eggendorf, lido como **Hägendorf [uncertain]** [PROVEN quanto ao cantão / origem suíça; a
  leitura da freguesia é incerta]. **Pais:** desconhecidos em qualquer registro disponível
  [OPEN]; as compilações os nomeiam como Joseph Moser × Anne Marie Weiss, de Hägendorf —
  [LEAD], não catalogado.

  ## Família e rede social

  Esposa de Jacob Bohrer (P-0050), com quem se casou em Nova Friburgo em 1825 (PAR-0059,
  evento E-0116); o casal é a geração que marca a fronteira imigratória da linha Bohrer
  (família F-0024). Seu único filho seguramente atestado é Francisco José Bohrer; PUB-0003
  (BORER I) atribui ao casal nove filhos [LEAD].

  ## O que podemos extrapolar

  O conflito de sobrenome é o ponto central de seu registro: um testamento em português,
  redigido duas gerações depois, de memória, é exatamente onde um sobrenome de solteira
  alemão "Moser" poderia ser grafado como o mais familiar "Mayer". A convergência das
  compilações em "Moser" é sugestiva, mas nada primário resolve o sobrenome de solteira, de
  modo que nenhum dos sobrenomes é tratado como certo. Sua origem suíça / de Solothurn, por
  outro lado, está agora confirmada por registro primário pelo casamento de 1825 (PAR-0059).
  [INFERRED]

  Sua origem suíça agora confirmada, sua vida situa-se no mesmo piso socioeconômico que a do
  marido, mas — se a compilação se sustentar — alcançado de outra forma, como família intacta
  e não como órfã. [CONTEXTUAL / INFERRED]

  - **Uma emigração de família inteira para a colônia** [LEAD / INFERRED] — as compilações
  têm sua família Moser emigrando junta na leva de Solothurn de 1819 (seu pai Joseph Moser
  recebeu o lote de colono 67, sua mãe Anne Marie Weiss), ao contrário do marido Jacob, que
  veio órfão. Casou-se com um colono conterrâneo de Solothurn na Catedral de Nova Friburgo
  em 1825, e suas filhas mais tarde se casaram com a família Chaboudez — sociedade colonial
  endogâmica. Ter os pais por perto é a razão mais provável de o lar viúvo ter sobrevivido
  intacto à morte precoce de Jacob.

  - **Ela casou-se lateralmente com um lar igualmente pobre** [INFERRED] — Jacob era um
  açougueiro-colono órfão que não trazia capital suíço; a união de 1825 juntou duas famílias
  coloniais de nível de chão, sem acrescentar riqueza herdável a nenhuma. Este é o fundo do
  arco Bohrer, o oposto estrutural do declínio Armond — nunca houve uma fortuna a perder.
  [CONTEXTUAL]

  - **A viuvez pôs uma pequena posse em suas mãos, e depois a sucessão partível a dissolveu**
  [INFERRED / CONTEXTUAL] — após a morte de Jacob (~1843), ela é muito provavelmente a "Viúva
  Catharina Bohrer" do registro de terras de Nova Friburgo de 1855, de modo que deteve e
  administrou a terra da família na viuvez; mas a sucessão partível brasileira dividiu em
  seguida aquele único lote pobre igualmente entre os muitos filhos, e de novo entre os
  filhos destes — terra pobre ÷ muitos herdeiros, o que impede a formação de qualquer
  patrimônio. [LEAD quanto à identificação da viúva]

  ## Questões em aberto

  - Seu sobrenome de solteira em nível primário (Mayer vs Moser) — ainda não resolvido: o
  registro de casamento de 1825 (PAR-0059) confirma sua origem suíça / de Solothurn, mas não
  resolve o sobrenome de solteira. Um registro decisivo seria o inventário de Nova Friburgo
  de Jacob Bohrer ou um registro de batismo suíço (Hägendorf), que também fixaria sua data
  exata de nascimento (não disponível) e nomearia seus pais em nível primário. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0005 (testamento registrado de 1888 de Francisco José Bohrer — a nomeia "Catharina
  Mayer … já fallecida").

  - PAR-0059 (casamento de 1825 dela e de Jacob em Nova Friburgo, registro paroquial
  primário — nomeia ambos os cônjuges "colonos suiços" do Cantão de Soleure e a lança como
  batizada em Eggendorf, lido como Hägendorf [uncertain]; o registro primário que confirma
  sua origem suíça / de Solothurn e fundamenta seu evento de nascimento E-0116).

  ## Onde ir hoje

  - **Nascimento (~1805):** Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf, Solothurn, Suíça
  (4614 Hägendorf; GPS 47.3347, 7.8445) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3347,7.8445)

  - **Casamento com Jacob Borer (1825):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova
  Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro; GPS -22.28159, -42.53085) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
