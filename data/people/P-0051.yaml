profile: >-
  ## Identity

  **Catharina Mayer** in the one primary record; **Catharina Moser** in the Nova Friburgo
  colonist compilations [PROVEN for "Mayer", the will's form; "Moser" is an unresolved
  variant, [LEAD]]. She is the mother of Francisco José Bohrer (P-0034) and hence paternal
  grandmother of Joaquim José Bohrer (P-0030).

  - **Death:** before 1888 [PROVEN] — named in her son's 1888 registered will (PRB-0005)
  as "Catharina Mayer … já fallecida."

  - **Origin and parents:** unknown from any held record [OPEN]. The compilations place
  her at Hägendorf, Canton Soleure (Solothurn), married to Jacob Borer in 1825, daughter
  of Joseph Moser × Anne Marie Weiss — all [LEAD], not catalogued. Nationality is
  deliberately left unset for the same reason as her husband's.

  ## Family and social network

  Wife of Jacob Bohrer (P-0050); the couple are the Bohrer line's immigrant-boundary
  generation (family F-0024). Her one securely attested child is Francisco José Bohrer;
  PUB-0003 (BORER I) credits the couple with nine children [LEAD].

  ## What we can extrapolate

  The surname conflict is the crux of her record: a Portuguese-language will drafted two
  generations later, from memory, is exactly where a German maiden name "Moser" could be
  rendered as the more familiar "Mayer." The compilations converging on "Moser" are
  suggestive, but nothing primary settles it, so neither surname is treated as certain and
  no origin is asserted. [INFERRED]

  ## Open questions

  - Her maiden surname at primary level (Mayer vs Moser) and her Swiss origin — decisive
  record: Jacob Bohrer's c.1843 Nova Friburgo inventário, or the 1825 marriage register.
  [OPEN]

  ## Sources held (this repository)

  - PRB-0005 (Francisco José Bohrer's 1888 registered will — names her "Catharina Mayer …
  já fallecida"; the only record held that names her).
profile_pt: >-
  ## Identidade

  **Catharina Mayer** no único registro primário; **Catharina Moser** nas compilações de
  colonos de Nova Friburgo [PROVEN para "Mayer", a forma do testamento; "Moser" é uma
  variante não resolvida, [LEAD]]. Ela é a mãe de Francisco José Bohrer (P-0034) e,
  portanto, avó paterna de Joaquim José Bohrer (P-0030).

  - **Óbito:** antes de 1888 [PROVEN] — nomeada no testamento registrado de 1888 de seu
  filho (PRB-0005) como "Catharina Mayer … já fallecida".

  - **Origem e pais:** desconhecidos em qualquer registro disponível [OPEN]. As
  compilações a situam em Hägendorf, Cantão de Soleure (Solothurn), casada com Jacob Borer
  em 1825, filha de Joseph Moser × Anne Marie Weiss — tudo [LEAD], não catalogado. A
  nacionalidade é deliberadamente deixada em aberto pela mesma razão que a de seu marido.

  ## Família e rede social

  Esposa de Jacob Bohrer (P-0050); o casal é a geração que marca a fronteira imigratória
  da linha Bohrer (família F-0024). Seu único filho seguramente atestado é Francisco José
  Bohrer; PUB-0003 (BORER I) atribui ao casal nove filhos [LEAD].

  ## O que podemos extrapolar

  O conflito de sobrenome é o ponto central de seu registro: um testamento em português,
  redigido duas gerações depois, de memória, é exatamente onde um sobrenome de solteira
  alemão "Moser" poderia ser grafado como o mais familiar "Mayer". A convergência das
  compilações em "Moser" é sugestiva, mas nada primário resolve a questão, de modo que
  nenhum dos sobrenomes é tratado como certo e nenhuma origem é afirmada. [INFERRED]

  ## Questões em aberto

  - Seu sobrenome de solteira em nível primário (Mayer vs Moser) e sua origem suíça —
  registro decisivo: o inventário de Nova Friburgo de Jacob Bohrer, por volta de 1843, ou
  o registro de casamento de 1825. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0005 (testamento registrado de 1888 de Francisco José Bohrer — a nomeia "Catharina
  Mayer … já fallecida"; o único registro disponível que a nomeia).
