profile: >-
  ## Identity

  **Jacob Klein** — a Lutheran colonist born at Nova Friburgo who married within the
  German-colony community and fathered Carolina Klein (P-0029). [PROVEN]

  - **Role:** father of Carolina Klein (P-0029) and husband of Maria Luiza Schenkel
  (P-0104; family F-0051); Iris Bohrer Muniz's great-grandfather on the Klein
  line. [PROVEN]

  - **Birth:** born 16 November 1844 and baptised 4 March 1845 at the Lutheran congregation
  of Nova Friburgo (PAR-0066, event E-0090), legitimate son of the colonist Johannes Klein
  (P-0105) and Anna Margaretha née [Neis — uncertain] (P-0106); family F-0052. [PROVEN]

  - **Marriage:** married Maria Luiza Schenkel at the Nova Friburgo Lutheran church on
  29 April 1872 (PAR-0068, event E-0092), aged 26 and resident at Rio Bonito; his mother
  was recorded as deceased by that date, his father was not. [PROVEN]

  ## Family

  His daughter Carolina was named in the 1890 Catholic marriage at the Nova Friburgo Matriz,
  where she abjured Protestantism before the ceremony (PAR-0064) — establishing that the Klein
  family were Lutheran colonists, distinct from the Swiss-Catholic trunk Carolina married into.
  [PROVEN/INFERRED-CONTEXTUAL]

  ## Open questions

  - His nationality, origin, and death record are not yet located. [OPEN]

  ## Sources held (this repository)

  - PAR-0066 (his 1844/45 Lutheran baptism — names his parents and establishes birth date).

  - PAR-0068 (his 1872 Lutheran marriage — corroborates filiation, records age 26 and
  residence Rio Bonito).

  - PAR-0064 (the 1890 Catholic marriage of Valentim × Carolina — names him as Carolina's
  father).
profile_pt: >-
  ## Identidade

  **Jacob Klein** — colono luterano nascido em Nova Friburgo que se casou dentro da
  comunidade alemã da colônia e foi pai de Carolina Klein (P-0029). [PROVEN]

  - **Papel:** pai de Carolina Klein (P-0029) e marido de Maria Luiza Schenkel (P-0104;
  família F-0051); bisavô de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Nascimento:** nascido em 16 de novembro de 1844 e baptizado em 4 de março de 1845
  na congregação luterana de Nova Friburgo (PAR-0066, evento E-0090), filho legítimo do
  colono Johannes Klein (P-0105) e de Anna Margaretha nascida [Neis — incerto] (P-0106);
  família F-0052. [PROVEN]

  - **Casamento:** casou-se com Maria Luiza Schenkel na igreja luterana de Nova Friburgo
  em 29 de abril de 1872 (PAR-0068, evento E-0092), com 26 anos de idade e residente no
  Rio Bonito; sua mãe já era falecida àquela data, seu pai não. [PROVEN]

  ## Família

  Sua filha Carolina foi nomeada no casamento católico de 1890 na Matriz de Nova Friburgo,
  onde abjurou o protestantismo antes da cerimônia (PAR-0064) — estabelecendo que a família
  Klein era luterana, distinta do tronco suíço-católico ao qual Carolina se uniu.
  [PROVEN/INFERRED-CONTEXTUAL]

  ## Questões em aberto

  - Sua nacionalidade, origem e registro de óbito ainda não foram localizados. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0066 (seu batismo luterano de 1844/45 — nomeia seus pais e estabelece a data de
  nascimento).

  - PAR-0068 (seu casamento luterano de 1872 — corrobora a filiação, registra 26 anos e
  residência no Rio Bonito).

  - PAR-0064 (casamento católico de 1890 de Valentim × Carolina — nomeia-o como pai de
  Carolina).
