- text: >-
    Father of Carolina Klein (P-0029, wife of Valentim Martinho Bohrer); named with his wife Maria
    Luiza Schenkel in Valentim × Carolina's 1890 marriage (PAR-0064). The Klein family were
    Protestant (Carolina abjured Protestantism at that marriage). Jacob's own Lutheran baptism
    (b. 16 November 1844, son of Johannes Klein × Anna Margaretha) and his 1872 Lutheran marriage to
    Maria Luiza Schenkel are catalogued in a later wave. His Brazilian nationality is established
    by his 1844/45 Nova Friburgo Lutheran baptism (PAR-0066, a documented birthplace); only the
    Klein family's earlier European origin remains open.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Born and baptised in the Lutheran congregation of Nova Friburgo in 1844 (PAR-0066) — a second-generation Brazilian colonist, born in the colony but raised within the Protestant German settler community that joined Nova Friburgo mainly with the 1824 German immigration wave.

  - **[CONTEXTUAL]** Nova Friburgo's settler population was divided between Swiss-Catholic arrivals (1819–1820) and German Protestant arrivals (1824 and after). The Klein family's Lutheran faith marks them as part of this later German strand — distinct from the Catholic Swiss families they eventually married into.

  - **[PROVEN]** His daughter Carolina's abjuration of Protestantism before her 1890 Catholic marriage (PAR-0064) is one of the clearest documents in this archive of the religious boundary between the Lutheran German and Catholic Swiss wings of the Nova Friburgo colony — a boundary that her marriage crossed.

  - **[INFERRED]** He was still alive when his son Jacob married in 1872 — the Lutheran marriage register names him without a "deceased" qualifier — suggesting he survived well into the colony's mature phase, long after the hardships of the founding generation had passed.

  ## Identity

  **Jacob Klein** — a Lutheran colonist born at Nova Friburgo who married within the
  German-colony community and fathered Carolina Klein (P-0029). [PROVEN]

  - **Role:** father of Carolina Klein (P-0029) and husband of Maria Luiza Schenkel
  (P-0104; family F-0051); Iris Bohrer Muniz's great-grandfather on the Klein
  line. [PROVEN]

  - **Birth:** born 16 November 1844 and baptised 4 March 1845 at the Lutheran congregation
  of Nova Friburgo (PAR-0066, event E-0090), legitimate son of the colonist Johannes Klein
  (P-0105) and Anna Margaretha née [Neis — uncertain] (P-0106); family F-0052. [PROVEN]

  - **Marriage:** married Maria Luiza Schenkel at the Nova Friburgo Lutheran church on
  29 April 1872 (PAR-0068, event E-0092), aged 26 and resident at Rio Bonito; his mother
  was recorded as deceased by that date, his father was not. [PROVEN]

  ## Family

  His daughter Carolina was named in the 1890 Catholic marriage at the Nova Friburgo Matriz,
  where she abjured Protestantism before the ceremony (PAR-0064) — establishing that the Klein
  family were Lutheran colonists, distinct from the Swiss-Catholic trunk Carolina married into.
  [PROVEN/INFERRED-CONTEXTUAL]

  ## Open questions

  - The Klein family's ancestral (European) origin and his death record are not yet located.
  His own Brazilian nationality is established by his 1844/45 Nova Friburgo birth (PAR-0066).
  [OPEN]

  ## Sources held (this repository)

  - PAR-0066 (his 1844/45 Lutheran baptism — names his parents and establishes birth date).

  - PAR-0068 (his 1872 Lutheran marriage — corroborates filiation, records age 26 and
  residence Rio Bonito).

  - PAR-0064 (the 1890 Catholic marriage of Valentim × Carolina — names him as Carolina's
  father).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nascido e batizado na congregação luterana de Nova Friburgo em 1844 (PAR-0066) — um colono brasileiro de segunda geração, nascido na colônia mas criado dentro da comunidade de colonos protestantes alemães que ingressou em Nova Friburgo principalmente com a leva de imigração alemã de 1824.

  - **[CONTEXTUAL]** A população de colonos de Nova Friburgo dividia-se entre os chegados suíço-católicos de 1819–1820 e os protestantes alemães que chegaram a partir de 1824. A fé luterana da família Klein a identifica como parte dessa vertente alemã posterior — distinta das famílias suíças católicas às quais ela acabaria se unindo pelo casamento.

  - **[PROVEN]** A abjuração do protestantismo por sua filha Carolina antes de seu casamento católico em 1890 (PAR-0064) é um dos documentos mais claros deste arquivo sobre a fronteira religiosa entre as alas luterana alemã e católica suíça da colônia de Nova Friburgo — uma fronteira que o casamento dela transpôs.

  - **[INFERRED]** Ainda estava vivo quando seu filho Jacob casou em 1872 — o registro de casamento luterano o nomeia sem o qualificador "falecido" — sugerindo que sobreviveu bem adentro na fase madura da colônia, muito depois das privações da geração fundadora.

  ## Identidade

  **Jacob Klein** — colono luterano nascido em Nova Friburgo que se casou dentro da
  comunidade alemã da colônia e foi pai de Carolina Klein (P-0029). [PROVEN]

  - **Papel:** pai de Carolina Klein (P-0029) e marido de Maria Luiza Schenkel (P-0104;
  família F-0051); bisavô de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Nascimento:** nascido em 16 de novembro de 1844 e baptizado em 4 de março de 1845
  na congregação luterana de Nova Friburgo (PAR-0066, evento E-0090), filho legítimo do
  colono Johannes Klein (P-0105) e de Anna Margaretha nascida [Neis — incerto] (P-0106);
  família F-0052. [PROVEN]

  - **Casamento:** casou-se com Maria Luiza Schenkel na igreja luterana de Nova Friburgo
  em 29 de abril de 1872 (PAR-0068, evento E-0092), com 26 anos de idade e residente no
  Rio Bonito; sua mãe já era falecida àquela data, seu pai não. [PROVEN]

  ## Família

  Sua filha Carolina foi nomeada no casamento católico de 1890 na Matriz de Nova Friburgo,
  onde abjurou o protestantismo antes da cerimônia (PAR-0064) — estabelecendo que a família
  Klein era luterana, distinta do tronco suíço-católico ao qual Carolina se uniu.
  [PROVEN/INFERRED-CONTEXTUAL]

  ## Questões em aberto

  - A origem ancestral (europeia) da família Klein e seu registro de óbito ainda não foram
  localizados. Sua própria nacionalidade brasileira está estabelecida por seu nascimento em
  Nova Friburgo em 1844/45 (PAR-0066). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0066 (seu batismo luterano de 1844/45 — nomeia seus pais e estabelece a data de
  nascimento).

  - PAR-0068 (seu casamento luterano de 1872 — corrobora a filiação, registra 26 anos e
  residência no Rio Bonito).

  - PAR-0064 (casamento católico de 1890 de Valentim × Carolina — nomeia-o como pai de
  Carolina).
