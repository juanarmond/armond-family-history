notes:
- text: >-
    Father of Carolina Klein (P-0029, wife of Valentim Martinho Bohrer); named with his wife Maria
    Luiza Schenkel in Valentim × Carolina's 1890 marriage (PAR-0064). The Klein family were
    Protestant (Carolina abjured Protestantism at that marriage). Jacob's own Lutheran baptism
    (b. 16 November 1844, son of Johannes Klein × Anna Margaretha) and his 1872 Lutheran marriage to
    Maria Luiza Schenkel are catalogued in a later wave. His Brazilian nationality is established
    by his 1844/45 Nova Friburgo Lutheran baptism (PAR-0066, a documented birthplace); only the
    Klein family's earlier European origin remains open.
profile: >-
  ## Interesting facts

  - **[PROVEN]** Born 16 October 1844 at Nova Friburgo and baptised 4 March 1845 at the Lutheran
  congregation (PAR-0066) — the date confirmed from the held image, superseding a secondary blog's
  "~16 November 1844." He is a second-generation Brazilian colonist, born in the colony and raised
  within the Protestant German settler community that joined Nova Friburgo with the 1824 immigration
  wave.

  - **[PROVEN]** His 1872 Lutheran marriage register (PAR-0068) names his father Johannes Klein
  without a "deceased" qualifier — still living at that date — and his mother as "verstorbenen Anna
  Margaretha geb. Dürr," confirming she had died before 1872. He married at age 26, resident at
  Rio Bonito.

  - **[PROVEN / LEAD]** He and Maria Luiza Schenkel had at least ten children together (1869–1896),
  of whom Carolina (~1873) is the direct ancestor in Juan's line. Two children — Maria (b. 1869)
  and José Marque (b. 1871) — predate their 29 April 1872 Lutheran marriage; the register records
  Jacob as "ledig" (never-married) on the wedding day, formalising a pre-existing union. The couple
  baptised their children in the Catholic São José do Ribeirão parish, diverging from Jacob's
  brothers who baptised Lutheran. [Sibling set LEAD — São José do Ribeirão Catholic books
  undigitised]

  - **[CONTEXTUAL]** His daughter Carolina's abjuration of Protestantism before her 1890 Catholic
  marriage (PAR-0064) documents the religious boundary between the Lutheran German and Catholic Swiss
  wings of the Nova Friburgo colony — a boundary her marriage crossed.

  ## Identity

  **Jacob Klein** — a Lutheran colonist born at Nova Friburgo who married within the
  German-colony community and fathered Carolina Klein (P-0029). [PROVEN]

  - **Role:** father of Carolina Klein (P-0029) and husband of Maria Luiza Schenkel
  (P-0104; family F-0051); Iris Bohrer Muniz's 3×-great-grandfather on the Klein
  line. [PROVEN]

  - **Birth:** born 16 October 1844 and baptised 4 March 1845 at the Lutheran congregation
  of Nova Friburgo (PAR-0066, event E-0090), legitimate son of the colonist Johannes Klein
  (P-0105) and Anna Margaretha née Dürr (P-0106, deceased by 1872); family F-0052. [PROVEN]

  - **Marriage:** married Maria Luiza Schenkel at the Nova Friburgo Lutheran church on
  29 April 1872 (PAR-0068, event E-0092), aged 26 and resident at Rio Bonito; his mother
  was recorded as deceased by that date, his father was not. [PROVEN]

  ## Family

  His daughter Carolina was named in the 1890 Catholic marriage at the Nova Friburgo Matriz,
  where she abjured Protestantism before the ceremony (PAR-0064) — establishing that the Klein
  family were Lutheran colonists, distinct from the Swiss-Catholic trunk Carolina married into.
  [PROVEN/INFERRED-CONTEXTUAL]

  He and Maria Luiza Schenkel had at least ten children baptised Catholic at São José do Ribeirão
  (1869–1896): Carolina (~1873; Juan's direct line) plus siblings Maria, José Marque, Maria Luiza,
  Manuel Aleixo, Isabel, Secundina, Leonel, Antônio Ramos, and Palmira Eugênia. This Catholic
  baptism practice diverged from Jacob's brothers' families, who baptised Lutheran. [LEAD —
  sibling births from index / FS tree; no held parent-naming images for the Catholic entries]

  ## Open questions

  - The Klein family's ancestral (European) origin and his death record are not yet located.
  His own Brazilian nationality is established by his 1844/45 Nova Friburgo birth (PAR-0066).
  [OPEN]

  ## Sources held (this repository)

  - PAR-0066 (his 1844/45 Lutheran baptism — names his parents and establishes birth date
  16 October 1844).

  - PAR-0068 (his 1872 Lutheran marriage — corroborates filiation, records age 26 and
  residence Rio Bonito; records mother as "verstorbenen Anna Margaretha geb. Dürr").

  - PAR-0064 (the 1890 Catholic marriage of Valentim × Carolina — names him as Carolina's
  father).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nascido em 16 de outubro de 1844 em Nova Friburgo e batizado em 4 de março de
  1845 na congregação luterana (PAR-0066) — data confirmada na imagem do documento, corrigindo a
  leitura "~16 de novembro de 1844" de uma fonte secundária. É um colono brasileiro de segunda
  geração, nascido na colônia e criado dentro da comunidade protestante alemã que ingressou em
  Nova Friburgo com a leva de imigração de 1824.

  - **[PROVEN]** O registro de seu casamento luterano de 1872 (PAR-0068) nomeia seu pai Johannes
  Klein sem o qualificador "falecido" — ainda vivo àquela data — e sua mãe como "verstorbenen Anna
  Margaretha geb. Dürr", confirmando que ela havia falecido antes de 1872. Casou-se com 26 anos,
  residente no Rio Bonito.

  - **[PROVEN / LEAD]** Ele e Maria Luiza Schenkel tiveram pelo menos dez filhos juntos (1869–1896),
  dos quais Carolina (~1873) é a ancestral direta na linha de Juan. Dois filhos — Maria (n. 1869) e
  José Marque (n. 1871) — são anteriores ao casamento luterano de 29 de abril de 1872; o registro
  descreve Jacob como "ledig" (solteiro) no dia do casamento, formalizando uma união preexistente.
  O casal batizou seus filhos na paróquia católica de São José do Ribeirão, divergindo dos irmãos
  de Jacob, cujas famílias batizavam na tradição luterana. [Conjunto de irmãos LEAD — livros
  católicos de São José do Ribeirão não digitalizados]

  - **[CONTEXTUAL]** A abjuração do protestantismo por sua filha Carolina antes de seu casamento
  católico em 1890 (PAR-0064) documenta a fronteira religiosa entre as alas luterana alemã e
  católica suíça da colônia de Nova Friburgo — fronteira que o casamento dela transpôs.

  ## Identidade

  **Jacob Klein** — colono luterano nascido em Nova Friburgo que se casou dentro da
  comunidade alemã da colônia e foi pai de Carolina Klein (P-0029). [PROVEN]

  - **Papel:** pai de Carolina Klein (P-0029) e marido de Maria Luiza Schenkel (P-0104;
  família F-0051); trisavô de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Nascimento:** nascido em 16 de outubro de 1844 e batizado em 4 de março de 1845
  na congregação luterana de Nova Friburgo (PAR-0066, evento E-0090), filho legítimo do
  colono Johannes Klein (P-0105) e de Anna Margaretha nascida Dürr (P-0106, falecida antes
  de 1872); família F-0052. [PROVEN]

  - **Casamento:** casou-se com Maria Luiza Schenkel na igreja luterana de Nova Friburgo
  em 29 de abril de 1872 (PAR-0068, evento E-0092), com 26 anos de idade e residente no
  Rio Bonito; sua mãe já era falecida àquela data, seu pai não. [PROVEN]

  ## Família

  Sua filha Carolina foi nomeada no casamento católico de 1890 na Matriz de Nova Friburgo,
  onde abjurou o protestantismo antes da cerimônia (PAR-0064) — estabelecendo que a família
  Klein era luterana, distinta do tronco suíço-católico ao qual Carolina se uniu.
  [PROVEN/INFERRED-CONTEXTUAL]

  Ele e Maria Luiza Schenkel tiveram pelo menos dez filhos batizados na paróquia católica de
  São José do Ribeirão (1869–1896): Carolina (~1873; linha direta de Juan) e os irmãos Maria,
  José Marque, Maria Luiza, Manuel Aleixo, Isabel, Secundina, Leonel, Antônio Ramos e Palmira
  Eugênia. Essa prática de batismo católico divergiu das famílias dos irmãos de Jacob, que
  batizavam na tradição luterana. [LEAD — nascimentos de irmãos via índice / árvore FS; sem
  imagens com nomeação dos pais nos assentos católicos]

  ## Questões em aberto

  - A origem ancestral (europeia) da família Klein e seu registro de óbito ainda não foram
  localizados. Sua própria nacionalidade brasileira está estabelecida por seu nascimento em
  Nova Friburgo em 1844/45 (PAR-0066). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0066 (seu batismo luterano de 1844/45 — nomeia seus pais e estabelece a data de
  nascimento em 16 de outubro de 1844).

  - PAR-0068 (seu casamento luterano de 1872 — corrobora a filiação, registra 26 anos e
  residência no Rio Bonito; registra mãe como "verstorbenen Anna Margaretha geb. Dürr").

  - PAR-0064 (casamento católico de 1890 de Valentim × Carolina — nomeia-o como pai de
  Carolina).
