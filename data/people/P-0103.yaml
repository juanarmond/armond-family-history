- text: >-
    Father of Carolina Klein (P-0029, wife of Valentim Martinho Bohrer); named with his wife Maria
    Luiza Schenkel in Valentim × Carolina's 1890 marriage (PAR-0064). The Klein family were
    Protestant (Carolina abjured Protestantism at that marriage). Jacob's own Lutheran baptism
    (b. 16 November 1844, son of Johannes Klein × Anna Margaretha) and his 1872 Lutheran marriage to
    Maria Luiza Schenkel are catalogued in a later wave. His Brazilian nationality is established
    by his 1844/45 Nova Friburgo Lutheran baptism (PAR-0066, a documented birthplace); only the
    Klein family's earlier European origin remains open.
profile: >-
  ## Interesting facts

  - **[PROVEN]** He was born at Nova Friburgo on 16 November 1844 and baptised on 4 March 1845 in
  the colony's Lutheran congregation, "dem Colonisten Joh. Klein und seiner Ehefrau Anna
  Margar[etha]" — the entry is in German Kurrentschrift, in a Protestant register, roughly four
  months after the birth. (PAR-0066) The register writes the month as "9br", the standard
  early-modern abbreviation for *Novembris*: the series runs 7br = September, 8br = October,
  9br = November, Xbr = December, from the Roman year that began in March. A passing claim that
  this should read 16 October was withdrawn on 2026-09-24 — it mistook "9br" for the ninth month.

  - **[PROVEN]** At his own wedding on 29 April 1872 he was twenty-six, "ledig" — never married
  — and living not at Nova Friburgo but at **Rio Bonito**, some distance down the fluminense
  highlands. His father Johannes is named without a death qualifier; his mother is "der
  verstorbenen Anna Margaretha". (PAR-0068)

  - **[PROVEN]** He was still alive and exercising paternal authority in November 1890: his
  seventeen-year-old daughter Carolina married Valentim Martinho Bohrer at the Nova Friburgo
  Matriz "licenciada verbalmente por seu pae" — verbally licensed by her father. He is named
  again as maternal grandfather in a granddaughter's civil birth register of October 1891.
  (PAR-0064, CIV-0045)

  - **[PROVEN / CONTEXTUAL]** That 1890 wedding recorded a religious crossing in one clause: the
  bride "abjurou o protestantismo, fazendo a profissão de fé catholica e recebido o baptismo"
  immediately before the ceremony. Jacob's family belonged to Nova Friburgo's German Lutheran
  wing; the Bohrers to its Swiss Catholic one. His daughter changed church to marry across that
  line. (PAR-0064)

  - **[LEAD]** He and Maria Luiza Schenkel are credited with at least ten children between 1869
  and 1896, of whom two — Maria (1869) and José Marque (1871) — predate the 1872 marriage that
  recorded him as never-married, so the wedding formalised an existing union. The couple
  baptised those children Catholic at São José do Ribeirão, unlike Jacob's brothers, whose
  families baptised Lutheran. The sibling set rests on index and tree entries; the São José do
  Ribeirão Catholic books are not digitised.

  ## Identity

  **Jacob Klein** — a Brazilian-born Lutheran of the Nova Friburgo German colony, father of
  Carolina Klein (P-0029). Iris Bohrer Muniz's (P-0007) great-grandfather, by the chain Carolina
  → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the family links]

  - **Birth:** 16 November 1844 at Nova Friburgo; baptised 4 March 1845 at the Lutheran
  congregation (PAR-0066, event E-0090). His Brazilian nationality follows from this documented
  birthplace. [PROVEN]

  - **Parents:** legitimate son of the colonist Johannes Klein (P-0105) and Anna Margaretha
  (P-0106), whose maiden surname is illegible in both records that give it; family F-0052.
  [PROVEN for the filiation; the mother's surname is OPEN]

  - **Marriage:** to Maria Luisa Schenkel (P-0104) on 29 April 1872 at 11 a.m., Nova Friburgo
  Lutheran church; he was 26, single and resident at Rio Bonito (PAR-0068, event E-0092).
  [PROVEN]

  - **Death:** not located. He was alive in November 1890 (PAR-0064). [OPEN, with a firm lower
  bound]

  ## Standing and profession

  No occupation, property, office or signature is recorded for him in any held source — a
  striking blank for a man documented four times. The one status word the records do attach is
  his father's, not his: "Colonisten". The most that can honestly be said is where he lived and
  how he worshipped: Lutheran, born in the colony, resident at Rio Bonito by 1872, and back
  within reach of the Nova Friburgo Matriz by 1890, when his daughter married there and his
  granddaughter was registered at São José do Ribeirão the following year. [PROVEN for the
  residences; his trade is OPEN]

  ## Family and social network

  His 1844 baptism already shows the Klein name doubled in the congregation: the godmother was
  "Elisabeth, Tochter von Jacob Klein, [Küster] daselbst" — Elisabeth, daughter of a *Jacob
  Klein* who served as the congregation's sexton. That namesake is a caution for anyone matching
  Kleins in these registers, and a sign of how densely the surname sat in the Lutheran
  community. [PROVEN — PAR-0066]

  His marriage in 1872 joined two German-Protestant colony families, Klein and Schenkel/Stoffel,
  inside the same congregation. [PROVEN — PAR-0068] Eighteen years later his daughter Carolina
  married out of it, into the Swiss-Catholic Bohrer line; her granddaughter's 1891 civil birth
  entry names both grandparent couples — Vicente Borrer × Maria Heggendorn and Jacob Klein ×
  Maria Luiza Schenkel — which is the moment the two colony wings appear on one page. [PROVEN —
  PAR-0064, CIV-0045]

  ## What we can extrapolate

  - **[CONTEXTUAL]** His family came with the 1824 German second wave, not the 1819 Swiss one.
  After Brazilian independence the agent Georg Anton Schäffer recruited in the German states,
  and some eighty families reached the colony on 3–4 May 1824. They worshipped at Nova
  Friburgo's Igreja Luterana, institutionally separate from the Swiss Catholic parish, which is
  why Klein baptisms and marriages sit in a German-language register and not in the Matriz
  books.

  - **[INFERRED]** His move to Rio Bonito by 1872 belongs to the well-documented pattern of
  colonist families leaving the Morro Queimado lots — poor, stony and too small — and dispersing
  across the fluminense highlands. That the family scattered without rising is the point: his
  parents died at Rio Bonito, he married out of there and his children were baptised at São José
  do Ribeirão. Movement, not advancement.

  - **[INFERRED]** He is the first fully Brazilian-born generation of this line, and he inherits
  the colonist floor rather than choosing it. With at least ten children and Brazilian partible
  succession splitting any holding equally among all of them, no estate could accumulate here
  even in principle. The arc is flat by construction.

  - **[CONTEXTUAL]** His daughter's abjuration in 1890 is worth reading as social history, not
  only as religion. Marrying across the colony's confessional line required a formal act of
  conversion recorded in the register — a measurable cost, paid by the bride, that shows how
  real the Lutheran/Catholic boundary still was seventy years after the colony was founded.

  ## Open questions

  - His death record — unlocated. He was alive in November 1890; the Nova Friburgo and São José
  do Ribeirão civil death books after that date are the target. [OPEN]

  - His mother's maiden surname. The catalogued transcriptions of both records read it as "[Neis
  — uncertain]"; the Raibert Klein/Schenkel research material reads the same hand as "Dürr".
  Neither is asserted here, and the two readings are preserved against each other. [OPEN]

  - His mother's maiden name, which PAR-0066 renders "[Neis — uncertain]" while a research
  profile reads "Dürr". Neither is adopted here. A max-zoom re-read of the register image would
  settle it. [OPEN]

  - The full sibling set of his ten children — index- and tree-derived only, with the São José
  do Ribeirão Catholic books undigitised. [LEAD]

  - The Klein family's European origin, which no held record states. [OPEN]

  ## Sources held (this repository)

  - **PAR-0066** — his 1844/45 Lutheran baptism at Nova Friburgo; names his parents and his
  godparents, and records his father as "Colonisten".

  - **PAR-0068** — his 1872 Lutheran marriage to Maria Luisa Schenkel; gives his age (26), his
  status ("ledig"), his residence (Rio Bonito) and both parent couples, with both mothers
  already dead.

  - **PAR-0064** — the 1890 Catholic marriage of Valentim Martinho Bohrer and his daughter
  Carolina; names him as her father and records that he licensed the marriage verbally.

  - **CIV-0045** — the 1891 civil birth registration of his granddaughter Maria Felomena Bohrer
  at São José do Ribeirão; names him and Maria Luiza Schenkel as the maternal grandparents.

  ## Regional and migration context

  Nova Friburgo was founded as a Swiss Catholic colony by Dom João VI's decree of 16 May 1818,
  but it did not stay one. The 1824 German intake under Schäffer added a Protestant population
  that built its own congregation — the Igreja Luterana, whose registers carry Jacob Klein's
  birth and marriage — alongside the Catholic Matriz. [CONTEXTUAL] The Klein and Schenkel
  families came in that second wave, out of the same post-Napoleonic poverty and land hunger
  that had driven the Swiss five years earlier. [CONTEXTUAL] Jacob's own life maps the colony's
  centrifugal phase: born in the colony in 1844, resident at Rio Bonito by 1872, his children
  baptised at São José do Ribeirão, one of the rural districts of Nova Friburgo. [PROVEN]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation whose registers hold his 1845 baptism
  and his 1872 marriage. [RESOLVED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where his
  daughter Carolina abjured Protestantism and married in November 1890, with his verbal consent.
  [RESOLVED]

  - **Rio Bonito, RJ** — Igreja Matriz Nossa Senhora da Conceição, Praça Fonseca Portela s/n,
  Centro · [Maps](https://maps.google.com/?q=-22.71229,-42.62456). The town he was living in
  when he married in 1872, and where his parents are said to have died. [RESOLVED as a place;
  his own record there is OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nasceu em Nova Friburgo em 16 de novembro de 1844 e foi batizado em 4 de março
  de 1845 na congregação luterana da colônia, "dem Colonisten Joh. Klein und seiner Ehefrau Anna
  Margar[etha]" — o assento está em Kurrentschrift alemã, num livro protestante, cerca de quatro
  meses após o nascimento. (PAR-0066) O registro grafa o mês como "9br", abreviatura padrão de
  *Novembris* no período: a série corre 7br = setembro, 8br = outubro, 9br = novembro,
  Xbr = dezembro, herança do ano romano que começava em março. Uma alegação passageira de que se
  deveria ler 16 de outubro foi retirada em 2026-09-24 — confundia "9br" com o nono mês.

  - **[PROVEN]** No próprio casamento, em 29 de abril de 1872, tinha vinte e seis anos, era
  "ledig" — nunca casado — e morava não em Nova Friburgo, mas no **Rio Bonito**, serra
  fluminense abaixo. O pai, Johannes, é nomeado sem qualificador de falecimento; a mãe é "der
  verstorbenen Anna Margaretha". (PAR-0068)

  - **[PROVEN]** Ainda estava vivo e exercendo autoridade paterna em novembro de 1890: sua filha
  Carolina, de dezessete anos, casou-se com Valentim Martinho Bohrer na Matriz de Nova Friburgo
  "licenciada verbalmente por seu pae". É nomeado de novo como avô materno no registro civil de
  nascimento de uma neta, em outubro de 1891. (PAR-0064, CIV-0045)

  - **[PROVEN / CONTEXTUAL]** Aquele casamento de 1890 registrou uma travessia religiosa numa só
  cláusula: a noiva "abjurou o protestantismo, fazendo a profissão de fé catholica e recebido o
  baptismo" imediatamente antes da cerimônia. A família de Jacob pertencia à ala luterana alemã
  de Nova Friburgo; os Bohrer, à ala católica suíça. A filha mudou de igreja para casar através
  dessa linha. (PAR-0064)

  - **[LEAD]** A ele e a Maria Luiza Schenkel atribuem-se pelo menos dez filhos entre 1869 e
  1896, dos quais dois — Maria (1869) e José Marque (1871) — são anteriores ao casamento de 1872
  que o registrou como nunca casado, de modo que a cerimônia formalizou uma união preexistente.
  O casal batizou esses filhos como católicos em São José do Ribeirão, ao contrário dos irmãos
  de Jacob, cujas famílias batizavam na tradição luterana. O conjunto de irmãos apoia-se em
  índices e árvores; os livros católicos de São José do Ribeirão não estão digitalizados.

  ## Identidade

  **Jacob Klein** — luterano nascido no Brasil, da colônia alemã de Nova Friburgo, pai de
  Carolina Klein (P-0029). Bisavô de Iris Bohrer Muniz (P-0007), pela cadeia Carolina → João
  Gonçalves Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Nascimento:** 16 de novembro de 1844, em Nova Friburgo; batizado em 4 de março de 1845 na
  congregação luterana (PAR-0066, evento E-0090). Sua nacionalidade brasileira decorre desse
  local de nascimento documentado. [PROVEN]

  - **Pais:** filho legítimo do colono Johannes Klein (P-0105) e de Anna Margaretha (P-0106),
  cujo sobrenome de solteira é ilegível nos dois registros que o trazem; família F-0052. [PROVEN
  quanto à filiação; o sobrenome da mãe está OPEN]

  - **Casamento:** com Maria Luisa Schenkel (P-0104) em 29 de abril de 1872, às 11 horas, na
  igreja luterana de Nova Friburgo; tinha 26 anos, era solteiro e morava no Rio Bonito
  (PAR-0068, evento E-0092). [PROVEN]

  - **Óbito:** não localizado. Estava vivo em novembro de 1890 (PAR-0064). [OPEN, com limite
  inferior firme]

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo ou assinatura consta dele em qualquer fonte retida — uma
  lacuna notável para um homem documentado quatro vezes. A única palavra de estatuto que os
  registros trazem é a do pai, não a dele: "Colonisten". O máximo que se pode dizer honestamente
  é onde morou e como cultuava: luterano, nascido na colônia, morador do Rio Bonito em 1872 e de
  novo ao alcance da Matriz de Nova Friburgo em 1890, quando a filha ali se casou e a neta foi
  registrada em São José do Ribeirão no ano seguinte. [PROVEN quanto às residências; o ofício
  está OPEN]

  ## Família e rede social

  Seu batismo de 1844 já mostra o nome Klein duplicado na congregação: a madrinha foi
  "Elisabeth, Tochter von Jacob Klein, [Küster] daselbst" — Elisabeth, filha de um *Jacob Klein*
  que servia como sacristão da congregação. Esse homônimo é um alerta para quem cruzar Kleins
  nesses livros, e um sinal de como o sobrenome era denso na comunidade luterana. [PROVEN —
  PAR-0066]

  Seu casamento de 1872 uniu duas famílias protestantes alemãs da colônia, Klein e
  Schenkel/Stoffel, dentro da mesma congregação. [PROVEN — PAR-0068] Dezoito anos depois, a
  filha Carolina casou-se para fora dela, na linha suíço-católica dos Bohrer; o registro civil
  de nascimento da neta, em 1891, nomeia os dois casais de avós — Vicente Borrer × Maria
  Heggendorn e Jacob Klein × Maria Luiza Schenkel —, e é o momento em que as duas alas da
  colônia aparecem na mesma página. [PROVEN — PAR-0064, CIV-0045]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Sua família veio na segunda leva alemã de 1824, não na suíça de 1819.
  Depois da independência, o agente Georg Anton Schäffer recrutou nos estados alemães, e cerca
  de oitenta famílias chegaram à colônia em 3–4 de maio de 1824. Cultuavam na Igreja Luterana de
  Nova Friburgo, institucionalmente separada da paróquia católica — razão pela qual batismos e
  casamentos Klein estão num livro em alemão e não nos livros da Matriz.

  - **[INFERRED]** Sua mudança para o Rio Bonito até 1872 integra o padrão bem documentado de
  famílias colonas que deixaram os lotes do Morro Queimado — pobres, pedregosos e pequenos
  demais — e se dispersaram pela serra fluminense. Que a família tenha se espalhado sem ascender
  é o ponto: os pais morreram no Rio Bonito, ele casou a partir de lá e os filhos foram
  batizados em São José do Ribeirão. Movimento, não progresso.

  - **[INFERRED]** Ele é a primeira geração inteiramente nascida no Brasil desta linha, e herda
  o chão colonial em vez de escolhê-lo. Com pelo menos dez filhos e a sucessão partilhável
  brasileira dividindo qualquer posse igualmente entre todos, nenhum patrimônio poderia
  acumular-se aqui nem em princípio. O arco é plano por construção.

  - **[CONTEXTUAL]** A abjuração da filha, em 1890, merece leitura como história social, e não
  apenas religiosa. Casar através da linha confessional da colônia exigia um ato formal de
  conversão lavrado no assento — um custo mensurável, pago pela noiva, que mostra quão real
  ainda era a fronteira luterana/católica setenta anos após a fundação da colônia.

  ## Questões em aberto

  - Seu registro de óbito — não localizado. Estava vivo em novembro de 1890; os livros civis de
  óbito de Nova Friburgo e São José do Ribeirão posteriores a essa data são o alvo. [OPEN]

  - O sobrenome de solteira da mãe. As transcrições catalogadas dos dois registros o leem como
  "[Neis — incerto]"; o material de pesquisa Raibert Klein/Schenkel lê a mesma mão como "Dürr".
  Nenhuma das duas é afirmada aqui, e as leituras são preservadas uma contra a outra. [OPEN]

  - O nome de solteira de sua mãe, que PAR-0066 grafa "[Neis — incerto]" enquanto um perfil de
  pesquisa lê "Dürr". Nenhum dos dois é adotado aqui. Uma releitura em zoom máximo da imagem
  resolveria a questão. [OPEN]

  - O conjunto completo de seus dez filhos — derivado apenas de índice e árvore, com os livros
  católicos de São José do Ribeirão não digitalizados. [LEAD]

  - A origem europeia da família Klein, que nenhum documento retido declara. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0066** — seu batismo luterano de 1844/45 em Nova Friburgo; nomeia pais e padrinhos e
  registra o pai como "Colonisten".

  - **PAR-0068** — seu casamento luterano de 1872 com Maria Luisa Schenkel; dá sua idade (26),
  seu estado ("ledig"), sua residência (Rio Bonito) e os dois casais de pais, ambas as mães já
  falecidas.

  - **PAR-0064** — o casamento católico de 1890 de Valentim Martinho Bohrer com a filha
  Carolina; nomeia-o como pai dela e registra que ele licenciou verbalmente o casamento.

  - **CIV-0045** — o registro civil de nascimento, em 1891, da neta Maria Felomena Bohrer, em
  São José do Ribeirão; nomeia-o, com Maria Luiza Schenkel, como avô materno.

  ## Contexto regional e migratório

  Nova Friburgo foi fundada como colônia católica suíça pelo decreto de Dom João VI de 16 de
  maio de 1818, mas não permaneceu assim. A entrada alemã de 1824, sob Schäffer, acrescentou uma
  população protestante que ergueu sua própria congregação — a Igreja Luterana, cujos livros
  trazem o nascimento e o casamento de Jacob Klein — ao lado da Matriz católica. [CONTEXTUAL] As
  famílias Klein e Schenkel vieram nessa segunda leva, saídas da mesma pobreza pós-napoleônica e
  fome de terra que empurrara os suíços cinco anos antes. [CONTEXTUAL] A vida de Jacob mapeia a
  fase centrífuga da colônia: nascido nela em 1844, morador do Rio Bonito em 1872, filhos
  batizados em São José do Ribeirão, um dos distritos rurais de Nova Friburgo. [PROVEN]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, cujos livros guardam seu batismo de 1845
  e seu casamento de 1872. [RESOLVED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha Carolina abjurou o protestantismo e se casou em novembro de 1890, com o consentimento
  verbal dele. [RESOLVED]

  - **Rio Bonito, RJ** — Igreja Matriz Nossa Senhora da Conceição, Praça Fonseca Portela s/n,
  Centro · [Mapa](https://maps.google.com/?q=-22.71229,-42.62456). A cidade em que morava quando
  se casou, em 1872, e onde se diz que morreram seus pais. [RESOLVED como lugar; o registro dele
  ali está OPEN]
