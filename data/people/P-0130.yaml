profile: >-
  ## Interesting facts

  - **[COMPILED]** She is the only woman in this Terceira group whose own parents are named: "Maria Fernandes da Costa (**ou de Toledo**), filha de **Belchior Fernandes da Costa** e de **Beatriz Pires**" (Mendes Forjaz Vol. IV, p.312). Every other woman here — Mariana Fagundes's mother, Belchior's mother — stops at a name.

  - **[COMPILED]** She married **Pedro Lourenço Machado** at Santa Bárbara on **14 June 1598** — the earliest dated event anywhere in this archive.

  - **[PROVEN — a bounded negative]** That marriage act has been hunted and not read. Pages 0097–0099 of the Santa Bárbara *casamentos* book C-1560-1606 were browsed in the 2026-09-23 Culturacores pass; they run from April 1597 to June 1598 and bracket 14 June 1598 exactly. Physical damage defeats the read at the delivered resolution. Recorded on event E-0134. **The act is in the window; we simply cannot read it yet.**

  - **[NOTE — a coincidence to disarm, not a finding]** The compiler gives her the alternative surname "**de Toledo**". Her descendants in Brazil carry the surname **Ferreira de Toledo** — but that Toledo comes from a different woman entirely, Gertrudes Maria de Toledo (P-0093), in 18th-century Minas Gerais. The two are unconnected. The resemblance is a trap for anyone reading this line quickly, and it is flagged here deliberately.

  - **[INFERRED]** She bore at least nine children. Their documented baptisms run from Pedro Lourenço the younger in September 1603 to André in December 1612, with Grácia (1607), Beatriz Dias (1609) and Inês (1611) between — which, with the 1598 marriage, points to a birth around **c.1575–1582**. Neither her birth nor her death is recorded anywhere.

  ## Identity

  **Maria Fernandes da Costa**, also written **Maria Fernandes de Toledo** **[COMPILED, PUB-0004 p.312]** — married **Pedro Lourenço Machado** (P-0129), *Capitão*, at Santa Bárbara, Terceira, on 14 June 1598; family F-0065. Mother of **António Martins Fagundes** (P-0127). Daughter of **Belchior Fernandes da Costa** × **Beatriz Pires** **[COMPILED]** — named by the compiler, with no primary image held and no entities modelled for them.

  - **Birth and death:** neither is given by the compiler **[OPEN]**. Inferred birth c.1575–1582 (see above); her death is not recorded even approximately, and her husband's 1655 burial entry, which might have called her his widow or predeceased wife, has not been reached.
  - **Nationality:** Portuguese (Azores, Crown territory)
  - **Occupation:** none recorded, as for every woman in these sources.
  - **Evidence standing:** entirely **[COMPILED]**. No original act naming her is held.

  **Position in the tree.** Along the modelled chain P-0130 → P-0127 → P-0124 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Maria stands nine generations above Geraldo Paz Armond (P-0004) — his 7th-great-grandmother — and eleven generations above the family's present living generation. She and her husband are the deepest modelled ancestors in this tree. The P-0124 → P-0092 step is **[COMPILED]** only and depends on the unresolved "two Gaspars" question; if P-0092 is the following generation, every degree here moves back one.

  ## Standing and profession

  Nothing is documented about her personally — no property, no literacy, no dowry, no will. What is documented is the household she married into and the family she came from, and both are informative in a limited way:

  - **[COMPILED]** She married the captain of a Santa Bárbara *ordenanças* company, in a household that went on to place two sons in the Church, two in the militia officer corps, and daughters into marriages in Lajes, Conceição and other parishes.
  - **[INFERRED + CONTEXTUAL]** That her own parents are named at all, when the compiler leaves most wives anonymous, is weak evidence that her family was itself of record-leaving standing in the parish. Compiled genealogies of this kind only trace families that left documents.
  - **[INFERRED + CONTEXTUAL]** Placing sons in the Church cost money — Latin schooling and, for a secular priest, a *título de património*, a settled income assigned so the candidate would not burden the Church. Whether any of that income came through her is entirely unknown; a wife's property often anchored a Portuguese household's land, but no deed, dowry or inventory survives here to say so.

  **"da Costa", "Fernandes" and "de Toledo" are not evidence of rank or origin.** Nothing in the held record grants this family arms, a *foro* or a title, and the Toledo element must not be read as Castilian or as connected to the Brazilian Toledos.

  ## Family and social network

  - **Parents [COMPILED]:** Belchior Fernandes da Costa × Beatriz Pires. Deliberately not modelled as entities — a compiled naming with no supporting record is a lead, not a person.
  - **Husband:** Pedro Lourenço Machado (P-0129), b. Santa Bárbara 2 February 1571, d. there 27 January 1655, *Capitão*, credited with a company of 79 men at the 1642 siege of the Castelo de São Filipe **[COMPILED]**.
  - **Children [COMPILED, PUB-0004 pp.312–313]:** Pedro Lourenço Machado the younger (b.15 September 1603, d. São Sebastião 20 October 1665, *alferes de ordenanças*, with a will before the notary Bartolomeu Pacheco); Antão Martins Fagundes, "o Giga" (d.28 January 1661); **António Martins Fagundes** (P-0127), *Capitão de ordenanças*, d.17 April 1664; Belchior Machado Fagundes, Franciscan friar; Manuel Machado Fagundes (d.22 March 1643); André Machado Fagundes (b.4 December 1612, *padre beneficiado*); Beatriz Dias Fagundes / Machado (b.8 March 1609); Inês Pacheco / Machado (b.30 January 1611); Grácia (b.18 May 1607); Maria Fernandes Machado (m.27 February 1631 Pedro Gonçalves de Lemos).
  - **Her name in her children [INFERRED]:** one daughter is recorded as **Maria Fernandes Machado** — her own given name and patronymic carried forward intact. The "Machado" that runs through most of the siblings comes from her husband's mother's side, not from hers; in this naming system the two pools mixed freely.
  - **Granddaughter in our line:** **Mariana Fagundes** (P-0124), through her son António, who married into São Sebastião in 1650.

  ## What we can extrapolate

  **She is the upper limit of what this archive currently reaches [INFERRED].** With her husband, she is the earliest modelled generation in the tree, and both of them are held entirely on the word of one 20th-century compiler reading 16th- and 17th-century registers. That is not nothing — Mendes Forjaz is precise, internally consistent, and gives day-exact dates that could only come from parish books — but it is one source, and the whole depth of this line currently rests on it. Everything above her is a cross-reference, not a finding.

  **Nine children, and the beginning of a two-century dispersal [INFERRED + CONTEXTUAL].** Terceira had been settled since about 1450 and was full. Entailed estates (*morgadios*) passed intact to eldest sons; non-entailed land divided and fragmented. A household with nine surviving children had to use every exit at once, and hers did: the Church took two sons, the militia two more, and her daughters married out across the island. Her grandson Manuel Machado is recorded simply as having left Terceira. Four generations later, this line's descendants are in colonial Minas Gerais. The emigration begins as a domestic arithmetic problem in her own house.

  **The archive records her parents and not her dates — which tells you what these sources were for [CONTEXTUAL].** A compiler tracing lineages needs to know whose daughter a woman was; he does not need to know when she was born or when she died. So Maria has a father and a mother and no lifespan, while her husband has three exact dates and no property. The shape of what survives is the shape of what someone once wanted to record.

  ## Open questions

  - **Her marriage act: located but unreadable [BOUNDED NEGATIVE, E-0134].** Santa Bárbara *casamentos* C-1560-1606, pp.0097–0099, bracket 14 June 1598; damage and CDN resolution defeat the read. **Next action:** request pp.0097–0101 at microfilm resolution from BPAR Angra. This does **not** establish that the act is missing from the register.
  - **Her birth and death are entirely unrecorded.** The c.1575–1582 birth window above is inferred from her marriage and her children's baptisms, nothing more. Her death is not even approximately placed; her husband's 1655 burial act, if recovered, might say whether she predeceased him.
  - **Her parentage is compiled only.** Belchior Fernandes da Costa × Beatriz Pires are named by Vol. IV and by nothing else we hold, and are deliberately left unmodelled. The 2026-09-23 full-corpus search of the *Genealogias* found no separate entry for them.
  - **The "de Toledo" alias is unexplained.** Whether it is a second family name, a toponym or a compiler's variant is unknown. It is **not** connected to the Minas Gerais Toledo line (P-0093 / P-0057).
  - **A surname-level negative on her parish.** All 169 pages of Santa Bárbara *casamentos* C-1560-1606 were read; the transcription records Cardoso and Machado entries but no securely identified Costa/Fernandes match for her family. Absence of a confirmed hit in a damaged, unindexed register is not evidence of absence from the parish.

  ## Sources held (this repository)

  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: her name and alias, her parents, her marriage on 14 June 1598, her husband and the nine children of the marriage. *Secondary, compiled — the sole source for everything about her.*
  - *(No primary image naming her is held. The bounded-negative search of Santa Bárbara* casamentos *C-1560-1606 pp.0097–0099 is recorded on event E-0134.)*

  ## Regional and migration context

  **Santa Bárbara das Nove Ribeiras in 1598 [CONTEXTUAL].** A rural parish on Terceira's western side, in the district of Angra — a city since 1534 and the seat of the Azores bishopric, and one of the mid-Atlantic's principal ports of call, where the returning India and Brazil fleets watered and refitted. The island's export staple in her youth was still the blue dye *pastel* (woad), alongside wheat sent to mainland Portugal and the African presidios, wine, and shipbuilding timber. The *pastel* trade was entering the long decline that American indigo would complete during her adult life.

  **She married in an occupied kingdom [CONTEXTUAL].** Her wedding in June 1598 fell eighteen years into the union of the Portuguese and Spanish crowns (1580–1640), on the island that had resisted Philip II longest — Terceira held out for D. António, Prior do Crato, and was subdued only by the invasion of 1583. The Spanish crown had built the Castelo de São Filipe above Angra to garrison it. If she was still alive in 1641–42, she saw her husband's generation blockade that same fortress into surrender on 4 March 1642, two years after the Restoration.

  **The pressure that would move her descendants was already present [CONTEXTUAL].** A finite, long-settled island; entail and primogeniture holding estates on eldest sons; recurrent seismic disaster. What was missing was a destination, and it arrived with the Minas Gerais gold strike of 1697 — a century after her marriage. Her descendants took it; the Crown's 1720 passport controls were written to slow exactly that traffic.

  ## Where to go today

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — where she married on 14 June 1598, where her nine children were baptised, and where her husband was buried in 1655. The one place any record attaches to her. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds Santa Bárbara *casamentos* C-1560-1606, whose pages 0097–0101 at microfilm resolution would recover her marriage act, together with the parish's surviving baptism and burial registers. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
profile_pt: >-
  ## Fatos interessantes

  - **[COMPILED]** É a única mulher deste conjunto terceirense cujos pais são nomeados: "Maria Fernandes da Costa (**ou de Toledo**), filha de **Belchior Fernandes da Costa** e de **Beatriz Pires**" (Mendes Forjaz Vol. IV, p.312). Todas as outras mulheres aqui — a mãe de Mariana Fagundes, a mãe de Belchior — param num nome.

  - **[COMPILED]** Casou com **Pedro Lourenço Machado** em Santa Bárbara a **14 de junho de 1598** — o acontecimento datado mais antigo de todo este arquivo.

  - **[PROVEN — negativo delimitado]** Esse assento de casamento foi procurado e não foi lido. As páginas 0097–0099 do livro de *casamentos* de Santa Bárbara C-1560-1606 foram percorridas na passagem Culturacores de 2026-09-23; vão de abril de 1597 a junho de 1598 e balizam exactamente 14 de junho de 1598. Os danos físicos derrotam a leitura na resolução entregue. Registado no evento E-0134. **O assento está na janela; apenas ainda não conseguimos lê-lo.**

  - **[NOTA — uma coincidência a desarmar, não um achado]** O compilador dá-lhe o apelido alternativo "**de Toledo**". Os descendentes dela no Brasil levam o sobrenome **Ferreira de Toledo** — mas esse Toledo vem de outra mulher completamente diferente, Gertrudes Maria de Toledo (P-0093), nas Minas Gerais do século XVIII. Os dois não têm relação. A semelhança é uma armadilha para quem leia esta linha depressa, e fica aqui assinalada de propósito.

  - **[INFERRED]** Teve pelo menos nove filhos. Os baptismos documentados vão de Pedro Lourenço, o moço, em setembro de 1603, a André, em dezembro de 1612, com Grácia (1607), Beatriz Dias (1609) e Inês (1611) pelo meio — o que, com o casamento de 1598, aponta para um nascimento por volta de **c.1575–1582**. Nem o nascimento nem o óbito estão registados em lado nenhum.

  ## Identidade

  **Maria Fernandes da Costa**, também escrita **Maria Fernandes de Toledo** **[COMPILED, PUB-0004 p.312]** — casou com **Pedro Lourenço Machado** (P-0129), *Capitão*, em Santa Bárbara, Terceira, a 14 de junho de 1598; família F-0065. Mãe de **António Martins Fagundes** (P-0127). Filha de **Belchior Fernandes da Costa** × **Beatriz Pires** **[COMPILED]** — nomeados pelo compilador, sem imagem primária disponível e sem entidades modeladas para eles.

  - **Nascimento e óbito:** nenhum é dado pelo compilador **[OPEN]**. Nascimento inferido c.1575–1582 (ver acima); a morte não está registada nem aproximadamente, e o assento de óbito do marido, de 1655, que poderia tê-la chamado viúva ou pré-falecida, não foi alcançado.
  - **Nacionalidade:** portuguesa (Açores, território da Coroa)
  - **Ocupação:** nenhuma registada, como para todas as mulheres nestas fontes.
  - **Estatuto de evidência:** inteiramente **[COMPILED]**. Nenhum assento original que a nomeie está disponível.

  **Posição na árvore.** Pela cadeia modelada P-0130 → P-0127 → P-0124 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Maria está nove gerações acima de Geraldo Paz Armond (P-0004) — sua 7.ª bisavó (*7th-great-grandmother*) — e onze gerações acima da atual geração viva da família. Ela e o marido são os ancestrais modelados mais recuados desta árvore. O passo P-0124 → P-0092 é apenas **[COMPILED]** e depende da questão não resolvida dos "dois Gaspares"; se P-0092 for a geração seguinte, todos os graus aqui recuam um.

  ## Posição social e profissão

  Nada está documentado sobre ela em termos pessoais — nem bens, nem alfabetização, nem dote, nem testamento. O que está documentado é a casa em que entrou pelo casamento e a família de que veio, e ambas são informativas de modo limitado:

  - **[COMPILED]** Casou com o capitão de uma companhia de *ordenanças* de Santa Bárbara, numa casa que viria a colocar dois filhos na Igreja, dois no corpo de oficiais da milícia, e filhas em casamentos nas Lajes, na Conceição e noutras freguesias.
  - **[INFERRED + CONTEXTUAL]** O facto de os pais dela sequer serem nomeados, quando o compilador deixa a maioria das esposas no anonimato, é indício fraco de que a sua família era, ela própria, de posição com registo na freguesia. Genealogias compiladas deste tipo só traçam famílias que deixaram documentos.
  - **[INFERRED + CONTEXTUAL]** Colocar filhos na Igreja custava dinheiro — estudos de latim e, para o clero secular, um *título de património*, rendimento fixo consignado para que o candidato não pesasse sobre a Igreja. Se algum desse rendimento veio por ela é totalmente desconhecido; a propriedade da mulher ancorava muitas vezes a terra de uma casa portuguesa, mas não sobrevive aqui escritura, dote ou inventário que o diga.

  **"da Costa", "Fernandes" e "de Toledo" não são prova de posição nem de origem.** Nada no registo disponível concede a esta família armas, *foro* ou título, e o elemento Toledo não deve ser lido como castelhano nem como ligado aos Toledo brasileiros.

  ## Família e rede social

  - **Pais [COMPILED]:** Belchior Fernandes da Costa × Beatriz Pires. Deliberadamente não modelados como entidades — uma nomeação compilada sem registo de apoio é uma pista, não uma pessoa.
  - **Marido:** Pedro Lourenço Machado (P-0129), n. Santa Bárbara 2 de fevereiro de 1571, f. ali a 27 de janeiro de 1655, *Capitão*, creditado com uma companhia de 79 homens no cerco de 1642 ao Castelo de São Filipe **[COMPILED]**.
  - **Filhos [COMPILED, PUB-0004 pp.312–313]:** Pedro Lourenço Machado, o moço (n.15 de setembro de 1603, f. São Sebastião 20 de outubro de 1665, *alferes de ordenanças*, com testamento no tabelião Bartolomeu Pacheco); Antão Martins Fagundes, "o Giga" (f.28 de janeiro de 1661); **António Martins Fagundes** (P-0127), *Capitão de ordenanças*, f.17 de abril de 1664; Belchior Machado Fagundes, frade franciscano; Manuel Machado Fagundes (f.22 de março de 1643); André Machado Fagundes (n.4 de dezembro de 1612, *padre beneficiado*); Beatriz Dias Fagundes / Machado (n.8 de março de 1609); Inês Pacheco / Machado (n.30 de janeiro de 1611); Grácia (n.18 de maio de 1607); Maria Fernandes Machado (c.27 de fevereiro de 1631 com Pedro Gonçalves de Lemos).
  - **O seu nome nos filhos [INFERRED]:** uma filha está registada como **Maria Fernandes Machado** — o seu próprio nome e patronímico transmitidos intactos. O "Machado" que atravessa a maioria dos irmãos vem do lado materno do marido, não do dela; neste sistema de nomes os dois repertórios misturavam-se livremente.
  - **Neta na nossa linha:** **Mariana Fagundes** (P-0124), pelo filho António, que casou para São Sebastião em 1650.

  ## O que podemos extrapolar

  **É o limite superior do que este arquivo alcança hoje [INFERRED].** Com o marido, é a geração modelada mais antiga da árvore, e ambos assentam inteiramente na palavra de um compilador do século XX a ler registos dos séculos XVI e XVII. Não é pouco — Mendes Forjaz é preciso, internamente coerente e dá datas ao dia que só podiam vir de livros paroquiais —, mas é uma fonte só, e toda a profundidade desta linha repousa nela. Tudo acima dela é remissão, não achado.

  **Nove filhos, e o começo de uma dispersão de dois séculos [INFERRED + CONTEXTUAL].** A Terceira estava povoada desde cerca de 1450 e estava cheia. Os bens vinculados (*morgadios*) passavam intactos aos primogénitos; a terra não vinculada dividia-se e fragmentava-se. Uma casa com nove filhos sobreviventes tinha de usar todas as saídas ao mesmo tempo, e a dela usou: a Igreja levou dois filhos, a milícia mais dois, e as filhas casaram para fora, pela ilha. O neto Manuel Machado está registado apenas como tendo saído da Terceira. Quatro gerações depois, os descendentes desta linha estão nas Minas Gerais coloniais. A emigração começa como problema de aritmética doméstica na casa dela.

  **O arquivo regista-lhe os pais e não as datas — o que diz para que serviam estas fontes [CONTEXTUAL].** Um compilador que traça linhagens precisa de saber de quem uma mulher era filha; não precisa de saber quando nasceu nem quando morreu. Por isso Maria tem pai e mãe e não tem tempo de vida, enquanto o marido tem três datas exactas e não tem bens. A forma do que sobrevive é a forma daquilo que alguém, um dia, quis registar.

  ## Questões em aberto

  - **O assento de casamento: localizado mas ilegível [NEGATIVO DELIMITADO, E-0134].** *Casamentos* de Santa Bárbara C-1560-1606, pp.0097–0099, balizam 14 de junho de 1598; danos e resolução do CDN derrotam a leitura. **Acção seguinte:** pedir ao BPAR de Angra as pp.0097–0101 em resolução de microfilme. Isto **não** estabelece que o assento falte no livro.
  - **O nascimento e a morte estão totalmente por registar.** A janela de nascimento c.1575–1582 acima é inferida do casamento e dos baptismos dos filhos, e nada mais. A morte não está sequer aproximadamente situada; o assento de óbito do marido, de 1655, se recuperado, poderia dizer se ela o precedeu.
  - **A filiação é apenas compilada.** Belchior Fernandes da Costa × Beatriz Pires são nomeados pelo Vol. IV e por mais nada do que temos, e ficam deliberadamente por modelar. A busca integral de 2026-09-23 nas *Genealogias* não encontrou entrada separada para eles.
  - **O alias "de Toledo" está por explicar.** Se é segundo apelido de família, topónimo ou variante do compilador, não se sabe. **Não** tem ligação à linha Toledo das Minas Gerais (P-0093 / P-0057).
  - **Um negativo ao nível do apelido na sua freguesia.** As 169 páginas dos *casamentos* de Santa Bárbara C-1560-1606 foram lidas; a transcrição regista entradas Cardoso e Machado, mas nenhuma correspondência Costa/Fernandes seguramente identificada para a família dela. A ausência de acerto confirmado num livro danificado e sem índice não é prova de ausência da freguesia.

  ## Fontes disponíveis (neste repositório)

  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: o nome e o alias, os pais, o casamento a 14 de junho de 1598, o marido e os nove filhos do casal. *Secundária, compilada — fonte única para tudo o que lhe diz respeito.*
  - *(Nenhuma imagem primária a nomeia. A busca de negativo delimitado nos* casamentos *de Santa Bárbara C-1560-1606 pp.0097–0099 está registada no evento E-0134.)*

  ## Contexto regional e migratório

  **Santa Bárbara das Nove Ribeiras em 1598 [CONTEXTUAL].** Freguesia rural do lado ocidental da Terceira, no distrito de Angra — cidade desde 1534 e sede do bispado dos Açores, e um dos principais portos de escala do Atlântico médio, onde as armadas da Índia e do Brasil aguavam e se reparavam no regresso. O produto de exportação da ilha na juventude dela era ainda o corante azul *pastel*, a par do trigo enviado para o reino e para as praças africanas, do vinho e da madeira de construção naval. O comércio do *pastel* entrava no longo declínio que o índigo americano viria a completar durante a sua vida adulta.

  **Casou num reino ocupado [CONTEXTUAL].** O casamento, em junho de 1598, caiu dezoito anos dentro da união das coroas portuguesa e espanhola (1580–1640), na ilha que mais tempo resistira a Filipe II — a Terceira sustentou D. António, Prior do Crato, e só foi submetida pela invasão de 1583. A coroa espanhola erguera o Castelo de São Filipe, sobre Angra, para a guarnecer. Se ainda era viva em 1641–42, viu a geração do marido cercar essa mesma fortaleza até à rendição, a 4 de março de 1642, dois anos depois da Restauração.

  **A pressão que moveria os descendentes já existia [CONTEXTUAL].** Ilha finita e povoada de longa data; vínculo e primogenitura a prender bens aos primogénitos; desastre sísmico recorrente. Faltava um destino, e ele chegou com o ouro das Minas Gerais, em 1697 — um século depois do seu casamento. Os descendentes agarraram-no; os controlos de passaporte de 1720 da Coroa foram escritos precisamente para travar esse tráfego.

  ## Onde ir hoje

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — onde casou a 14 de junho de 1598, onde os nove filhos foram baptizados e onde o marido foi sepultado em 1655. O único lugar a que algum registo a liga. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — guarda os *casamentos* de Santa Bárbara C-1560-1606, cujas páginas 0097–0101, em resolução de microfilme, recuperariam o assento do seu casamento, além dos livros de baptismos e óbitos que sobrevivam para a freguesia. · [Mapa](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
