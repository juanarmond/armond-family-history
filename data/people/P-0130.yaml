    Maria Fernandes da Costa (also called "de Toledo" in the compilation): married Pedro
    Lourenço Machado (P-0129) at Santa Bárbara on 14 June 1598; family F-0065. Mother of
    António Martins Fagundes (P-0127). Her parentage: "filha de Belchior Fernandes da Costa
