profile: >-
  ## Interesting facts

  - **[PROVEN]** She was already dead when her son Antonio Engrácio Filho died in June 1964: his death act names her and her husband as his parents and reports both as *falecidos* (CIV-0017). That one word is the only bound we have on her lifespan — she died at some point before 21 June 1964, on a date and in a place no held record gives. (This bullet corrects an earlier reading of this profile, which had her still living in 1964.)

  - **[CONTEXTUAL]** As a woman born likely in the 1860s–1870s in the Zona da Mata Mineira, she would have lived through the abolition of slavery (1888), the proclamation of the Republic (1889) and the entire collapse of the coffee economy — forces that pushed landless rural families toward the urban economy.

  - **[INFERRED]** Her "Pinheiro" surname is a genuine family patronym rather than a devotional name — unlike the common "da Conceição" element, which is devotional. The "Pinheiro" is the single thread that could trace her natal family in pre-Carangola Zona da Mata Mineira registers.

  - **[INFERRED]** Neither she nor her husband Antonio Engrácio de Souza (P-0032) has turned up as a party in any probate record searched: the retrieval research reports no "Luzia Pinheiro" or "Engrácio" party in the COARPE/APM inventário indexes of the Muriaé, Carangola, São Francisco do Glória and Tombos comarcas [LEAD — an index search, not proof of absence]. That is consistent with a small-town or rural family without heritable property, whose presence in the archive runs only through the vital records of their children.

  - **[CONTEXTUAL]** The coffee crisis of the 1890s–1920s accelerated the departure of landless families from the Zona da Mata toward urban and industrial work. Her own branch moved late and in stages: her granddaughter Cidalia was still marrying in Minas Gerais in 1952 (Eugenópolis, CIV-0002), while her son Antonio Engrácio Filho was living at Pavuna, Rio de Janeiro, by his death in 1964 (CIV-0017).

  ## Identity

  **Luzia Pinheiro da Conceição** (also *Luzia da Conceição*) [PROVEN] — paternal
  grandmother of Cidalia (P-0005), mother of Antonio Engracio Filho (P-0010). Three held
  records carry her *Pinheiro* surname — "Luzia Pinheiro da Conceição" (CIV-0017), "Luzia
  Pinheiro [da] Conceição" (CIV-0026) and "Luzia Pinheiro" (CIV-0043) — while the 1930 act
  gives only "Luzia da Conceição" (CIV-0022).

  - **Spouse:** Antonio Engracio de Souza (P-0032) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Children (documented minimum three):** Antonio Engracio Filho (P-0010). Additionally
  identified by their own death records that name both her and her husband as parents:
  Teodolina Engracia de Souza (b. c.1902 MG, d. 25 December 1962, Itaperuna RJ —
  doméstica, widow of Abesterman Pinheiro) [PROVEN — CIV-0043, 'filha legítima de Antonio
  Engracio e Luzia Pinheiro'] and Hermogenes Engrácio de Souza (native of Minas Gerais, d.
  19 November at Rio de Janeiro aged 65 — lavrador, married to Maria Dutra de Souza, leaving
  three adult daughters) [PROVEN — CIV-0026 names both parents]. The year of Hermogenes'
  death is in conflict: CIV-0026 as catalogued reads 1961 (→ b. c.1896), while the register
  image appears to read "setenta e um" (1971 → b. c.1906), as the retrieval research also
  reports after a zoomed re-read; the catalogue entry is flagged for correction. No total
  child count is fixed; these three are the documented minimum.

  - **Death:** already deceased by her son's death in 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN] A FamilySearch tree estimate of
  birth c.1870 is unverified [LEAD].

  ## Note on evidence

  She is named only derivatively: as the deceased mother of Antonio Engracio Filho in the
  1964 civil death (CIV-0017, "Luzia Pinheiro da Conceição") and as Cidalia's paternal
  grandmother in her 1930 birth (CIV-0022, there the shorter "Luzia da Conceição"); both
  spellings are preserved. Additionally, the death records of her children Teodolina (d. 1962,
  Itaperuna, CIV-0043) and Hermogenes (Rio de Janeiro, CIV-0026) each name her and her husband as
  parents, independently corroborating the marriage and the children. No record of her own
  is held.

  ## What we can extrapolate

  Part of a Minas Gerais (Carangola-area) family; her Brazilian nationality is inferred from
  that origin (jus soli), not from the surname [INFERRED]. "Pinheiro" — a real family name,
  unlike the devotional "da Conceição" — is the only handle on her own, undocumented family,
  and it is a better handle than the women on the Guimarães side of this marriage have
  (P-0022, P-0026, whose names are purely devotional).

  She is the one member of her generation in this branch who is only ever named by others.
  [PROVEN — the pattern] Her husband is admitted to vote (GOV-0008) and is reported to have signed a
  procuração [LEAD]; she appears in four records (CIV-0017, CIV-0022, CIV-0026, CIV-0043), all
  of them belonging to her children and grandchildren. That asymmetry is
  not about her personally: it is what the Brazilian civil and notarial record of the period
  does to a married woman with no property in her own name, since the acts that generate
  documents — voting, witnessing, lending, holding title — were closed to her by law or by
  custom. Her invisibility is a property of the archive, not evidence about her.

  She bore at least three children who reached adulthood, and they landed in three different
  places at three different rungs. [PROVEN — the death records; INFERRED — the reading]
  Antônio Filho became a *negociante* at Pavuna, Rio de Janeiro, and died with "não deixou
  bens"; Hermogenes stayed a *lavrador* and died at Rio de Janeiro, living in a numbered lot
  in Duque de Caxias, also with nothing; Teodolina died a widowed *doméstica* at Itaperuna.
  Three siblings, three separate footholds in the Rio metropolitan and interior region, none
  of them property. That fan is what a household with nothing heritable produces: partible
  succession never operated, because there was no estate for it to divide, and each child had
  to make a position from scratch.

  What the household transmitted came through her husband's side of the ledger, not hers.
  [INFERRED / CONTEXTUAL] The branch's one durable asset was functional literacy and a
  foothold in trade — he was an admitted voter in 1898 and reportedly signed his name in 1917 [LEAD], his son ran a shop, his grandson worked
  in commerce. Whether she was literate is unrecorded [OPEN], and for a woman of her cohort
  and class in the rural Zona da Mata the base rate was low: schooling was a purchased,
  class-linked privilege, and girls were the first economy a household made. No inference
  should be drawn either way from her husband's literacy.

  Her own generation is where the line goes dark. [OPEN] No birth, marriage or death record
  of hers is held, so she has no documented parents, no documented birthplace and no death
  date — only the bound "already deceased by June 1964". The *Pinheiro* surname is the one
  thread that could reach her natal family, and the record that would pull it is her marriage
  (before 1894, probably in the Carangola region) or her death.

  ## Open questions

  - Her parents — from her marriage record (most likely before her son's birth in June
  1894, CIV-0002 [INFERRED]) or her death record (before June 1964), likely in the São
  Francisco do Glória / Carangola area. *Pinheiro* is the surname thread. [OPEN]

  - Searches reported by the retrieval research, all negative and none proof of absence
  [LEAD]: no baptism, marriage or death of her own on the FamilySearch index (her tree node's
  only sources are her sons' death records, and the "da Conceição" name returns only
  devotional namesakes); and no "Luzia Pinheiro" or "Pinheiro da Conceição" party in the
  COARPE/APM inventário indexes of the Muriaé, Carangola, São Francisco do Glória and Tombos
  comarcas, where every Pinheiro party belongs to an unrelated family.

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death — "Luzia Pinheiro da Conceição") ·
  CIV-0022 (granddaughter Cidalia's 1930 birth — "Luzia da Conceição") · CIV-0043 (daughter
  Teodolina's 1962 Itaperuna death — "Luzia Pinheiro") · CIV-0026 (son Hermogenes' Rio de
  Janeiro death — "Luzia Pinheiro [da] Conceição"; death year 1961/1971 in conflict). No
  record of her own is held.

  ## Where to go today

  - **Region anchor (no located place):** no place of her own is documented; the Pinheiro
  surname would anchor a search in pre-Carangola Zona da Mata Mineira registers (her
  marriage pre-1894 / her death pre-1964) — Carangola, MG [UNLOCATED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela já havia falecido quando seu filho Antonio Engrácio Filho morreu, em junho de 1964: o ato de óbito dele a nomeia, com o marido, como seus pais e informa ambos como *falecidos* (CIV-0017). Essa única palavra é o único limite que temos sobre sua vida — morreu em algum momento antes de 21 de junho de 1964, em data e lugar que nenhum registro disponível informa. (Este item corrige uma leitura anterior deste perfil, que a dava como ainda viva em 1964.)

  - **[CONTEXTUAL]** Como uma mulher nascida provavelmente nas décadas de 1860–1870 na Zona da Mata Mineira, ela teria vivido a abolição da escravidão (1888), a proclamação da República (1889) e todo o colapso da economia cafeeira — forças que empurraram famílias rurais sem terra para a economia urbana.

  - **[INFERRED]** Seu sobrenome "Pinheiro" é um patronímico de família genuíno, e não um nome devocional — ao contrário do comum elemento "da Conceição", que é devocional. O "Pinheiro" é o único fio que poderia rastrear sua família natal nos registros da Zona da Mata Mineira anteriores a Carangola.

  - **[INFERRED]** Nem ela nem seu marido Antonio Engrácio de Souza (P-0032) apareceram como parte em qualquer inventário pesquisado: a pesquisa de recuperação informa nenhuma parte "Luzia Pinheiro" ou "Engrácio" nos índices de inventários COARPE/APM das comarcas de Muriaé, Carangola, São Francisco do Glória e Tombos [LEAD — uma busca em índice, não prova de ausência]. Isso é coerente com uma família de pequena cidade ou rural sem propriedade herdável, cuja presença no arquivo passa apenas pelos registros vitais dos filhos.

  - **[CONTEXTUAL]** A crise cafeeira das décadas de 1890–1920 acelerou a partida de famílias sem terra da Zona da Mata rumo ao trabalho urbano e industrial. Seu próprio ramo mudou-se tarde e em etapas: sua neta Cidalia ainda se casava em Minas Gerais em 1952 (Eugenópolis, CIV-0002), enquanto seu filho Antonio Engrácio Filho já morava em Pavuna, Rio de Janeiro, ao falecer em 1964 (CIV-0017).

  ## Identidade

  **Luzia Pinheiro da Conceição** (também *Luzia da Conceição*) [PROVEN] — avó paterna de
  Cidalia (P-0005), mãe de Antonio Engracio Filho (P-0010). Três registros disponíveis
  trazem seu sobrenome *Pinheiro* — "Luzia Pinheiro da Conceição" (CIV-0017), "Luzia
  Pinheiro [da] Conceição" (CIV-0026) e "Luzia Pinheiro" (CIV-0043) —, enquanto o ato de 1930
  dá apenas "Luzia da Conceição" (CIV-0022).

  - **Cônjuge:** Antonio Engracio de Souza (P-0032) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filhos (mínimo documentado de três):** Antonio Engracio Filho (P-0010). Identificados
  adicionalmente por seus próprios registros de óbito que nomeiam ela e seu marido como pais:
  Teodolina Engracia de Souza (n. c.1902 MG, f. 25 de dezembro de 1962, Itaperuna RJ —
  doméstica, viúva de Abesterman Pinheiro) [PROVEN — CIV-0043, 'filha legítima de Antonio
  Engracio e Luzia Pinheiro'] e Hermogenes Engrácio de Souza (natural de Minas Gerais, f. em
  19 de novembro no Rio de Janeiro, aos 65 anos — lavrador, casado com Maria Dutra de Souza,
  deixando três filhas maiores) [PROVEN — CIV-0026 nomeia ambos os pais]. O ano do óbito de
  Hermogenes está em conflito: CIV-0026, tal como catalogado, lê 1961 (→ n. c.1896), ao passo
  que a imagem do livro parece ler "setenta e um" (1971 → n. c.1906), como também informa a
  pesquisa de recuperação após releitura ampliada; a entrada do catálogo está sinalizada para
  correção. O total de filhos não está fixado; esses três são o mínimo documentado.

  - **Óbito:** já falecida ao tempo do óbito de seu filho em 1964 (CIV-0017) [PROVEN quanto
  ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN] Uma estimativa de
  nascimento c.1870 na árvore do FamilySearch não está verificada [LEAD].

  ## Nota sobre a evidência

  Ela é nomeada apenas de forma derivada: como mãe falecida de Antonio Engracio Filho no
  óbito civil de 1964 (CIV-0017, "Luzia Pinheiro da Conceição") e como avó paterna de
  Cidalia em seu nascimento de 1930 (CIV-0022, ali a forma mais curta "Luzia da
  Conceição"); ambas as grafias são preservadas. Adicionalmente, os registros de óbito de
  seus filhos Teodolina (f. 1962, Itaperuna, CIV-0043) e Hermogenes (Rio de Janeiro, CIV-0026)
  nomeiam-na e nomeiam seu marido como pais, corroborando independentemente o casamento e os
  filhos. Nenhum registro próprio dela foi obtido.

  ## O que podemos extrapolar

  Parte de uma família de Minas Gerais (região de Carangola); sua nacionalidade brasileira é
  inferida dessa origem (jus soli), não do sobrenome [INFERRED]. "Pinheiro" — um sobrenome de
  família real, ao contrário do devocional "da Conceição" — é a única alça para sua própria
  família, não documentada, e é uma alça melhor do que a das mulheres do lado Guimarães deste
  casamento (P-0022, P-0026, cujos nomes são puramente devocionais).

  Ela é a única de sua geração neste ramo que só é nomeada por outros. [PROVEN — o padrão] Seu
  marido é admitido a votar (GOV-0008) e teria assinado uma procuração [LEAD]; ela aparece em
  quatro registros (CIV-0017, CIV-0022, CIV-0026, CIV-0043), todos pertencentes a filhos e
  netos. Essa assimetria não diz respeito a ela pessoalmente: é o que
  o registro civil e notarial brasileiro do período faz com uma mulher casada sem bens em nome
  próprio, já que os atos que geram documentos — votar, testemunhar, emprestar, ter título —
  lhe eram vedados por lei ou por costume. Sua invisibilidade é uma propriedade do arquivo,
  não uma evidência sobre ela.

  Teve ao menos três filhos que chegaram à vida adulta, e eles aterrissaram em três lugares
  diferentes, em três degraus diferentes. [PROVEN — os registros de óbito; INFERRED — a
  leitura] Antônio Filho tornou-se *negociante* em Pavuna, Rio de Janeiro, e morreu com "não
  deixou bens"; Hermogenes permaneceu *lavrador* e morreu no Rio de Janeiro, morando num lote
  numerado em Duque de Caxias, também sem nada; Teodolina morreu *doméstica* viúva em
  Itaperuna. Três irmãos, três apoios distintos na região metropolitana e no interior
  fluminense, nenhum deles propriedade. Esse leque é o que uma casa sem nada herdável produz:
  a sucessão partível nunca operou, porque não havia espólio a dividir, e cada filho teve de
  construir uma posição do zero.

  O que a casa transmitiu veio do lado do marido no livro-razão, não do dela. [INFERRED /
  CONTEXTUAL] O único ativo durável do ramo era a alfabetização funcional e um pé no comércio
  — ele foi eleitor admitido em 1898 e teria assinado o próprio nome em 1917 [LEAD], o filho tocava uma loja, o neto trabalhou no comércio.
  Se ela era alfabetizada, não está registrado [OPEN], e para uma mulher de sua coorte e
  classe na Zona da Mata rural a taxa de base era baixa: a escolarização era um privilégio
  comprado e ligado à classe, e as meninas eram a primeira economia que uma casa fazia.
  Nenhuma inferência deve ser tirada, em qualquer direção, da alfabetização do marido.

  É na geração dela que a linha escurece. [OPEN] Nenhum registro de nascimento, casamento ou
  óbito dela está disponível, de modo que não tem pais documentados, nem local de nascimento
  documentado, nem data de óbito — apenas o limite "já falecida em junho de 1964". O sobrenome
  *Pinheiro* é o único fio que poderia alcançar sua família natal, e o registro que o puxaria
  é seu casamento (anterior a 1894, provavelmente na região de Carangola) ou seu óbito.

  ## Questões em aberto

  - Seus pais — a partir de seu registro de casamento (provavelmente anterior ao nascimento
  do filho em junho de 1894, CIV-0002 [INFERRED]) ou de óbito (anterior a junho de 1964),
  provavelmente na região de São Francisco do Glória / Carangola. *Pinheiro* é o fio do
  sobrenome. [OPEN]

  - Buscas informadas pela pesquisa de recuperação, todas negativas e nenhuma prova de
  ausência [LEAD]: nenhum batismo, casamento ou óbito próprio dela no índice do FamilySearch
  (as únicas fontes de seu nó na árvore são os óbitos dos filhos, e o nome "da Conceição"
  devolve apenas homônimas devocionais); e nenhuma parte "Luzia Pinheiro" ou "Pinheiro da
  Conceição" nos índices de inventários COARPE/APM das comarcas de Muriaé, Carangola, São
  Francisco do Glória e Tombos, onde toda parte Pinheiro pertence a uma família sem relação.

  ## Fontes disponíveis (neste repositório)

  - CIV-0017 (óbito de 1964 do filho Antonio Engracio Filho — "Luzia Pinheiro da Conceição")
  · CIV-0022 (nascimento de 1930 da neta Cidalia — "Luzia da Conceição") · CIV-0043 (óbito de
  1962 da filha Teodolina, em Itaperuna — "Luzia Pinheiro") · CIV-0026 (óbito do filho
  Hermogenes no Rio de Janeiro — "Luzia Pinheiro [da] Conceição"; ano do óbito 1961/1971 em
  conflito). Nenhum registro próprio dela foi obtido.

  ## Onde ir hoje

  - **Âncora regional (nenhum lugar localizado):** nenhum lugar próprio está documentado;
  o sobrenome Pinheiro ancoraria uma busca em registros da Zona da Mata Mineira
  pré-Carangola (seu casamento anterior a 1894 / seu óbito anterior a 1964) — Carangola, MG
  [UNLOCATED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
