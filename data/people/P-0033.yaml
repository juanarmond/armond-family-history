profile: >-
  ## Interesting facts

  - **[PROVEN]** She was a living widow in the Carangola district when named in the 1964 death of her son Antonio Engrácio Filho — though the exact date of her own death is unknown, leaving open whether she outlived her son (CIV-0017, CIV-0022).

  - **[CONTEXTUAL]** As a woman born likely in the 1860s–1870s in the Zona da Mata Mineira, she would have lived through the abolition of slavery (1888), the proclamation of the Republic (1889) and the entire collapse of the coffee economy — forces that pushed landless rural families toward the urban economy.

  - **[INFERRED]** Her "Pinheiro" surname is a genuine family patronym rather than a devotional name — unlike the common "da Conceição" element, which is devotional. The "Pinheiro" is the single thread that could trace her natal family in pre-Carangola Zona da Mata Mineira registers.

  - **[INFERRED]** Both she and her husband Antonio Engrácio de Souza (P-0032) are absent from all probate, land and press records searched — consistent with a small-town or rural family without heritable property, whose presence in the archive runs only through the vital records of their children.

  - **[CONTEXTUAL]** The coffee crisis of the 1890s–1920s accelerated the departure of families without land from the Zona da Mata toward industrial employment; her son Antonio Engrácio Filho and grandchildren remained in the Carangola area into the 1960s, before the line eventually reached Rio de Janeiro.

  ## Identity

  **Luzia Pinheiro da Conceição** (also *Luzia da Conceição*) [PROVEN] — paternal
  grandmother of Cidalia (P-0005), mother of Antonio Engracio Filho (P-0010).

  - **Spouse:** Antonio Engracio de Souza (P-0032) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Child (in our line):** Antonio Engracio Filho (P-0010).

  - **Death:** already deceased by her son's death in 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN]

  ## Note on evidence

  She is named only derivatively: as the deceased mother of Antonio Engracio Filho in the
  1964 civil death (CIV-0017, "Luzia Pinheiro da Conceição") and as Cidalia's paternal
  grandmother in her 1930 birth (CIV-0022, there the shorter "Luzia da Conceição"); both
  spellings are preserved. No record of her own is held.

  ## What we can extrapolate

  Part of a Minas Gerais (Carangola-area) family; her Brazilian nationality is inferred
  from that origin (jus soli), not from the surname [INFERRED]. "Pinheiro" — a real family
  name, unlike the devotional "da Conceição" — is the only handle on her own (undocumented)
  family.

  On the socioeconomic read, she sits at the head of a branch whose only legible economic
  character is, downstream, commercial-urban. [INFERRED / CONTEXTUAL — OPEN] As wife of the
  obscure Engrácio-Souza trunk (P-0032) and mother of the merchant Antônio Filho (P-0010), she
  carries no documented standing, property or origin of her own. That she bore a real patronym —
  *Pinheiro* — rather than a purely devotional name is the single small hint that her natal
  family was traceable-local, not a marker of any particular class.

  ## Open questions

  - Her parents — from her marriage record (pre-1895) or her death record (pre-1964),
  likely Carangola. [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death) · CIV-0022 (granddaughter Cidalia's
  1930 birth). She appears in no other held record.

  ## Where to go today

  - **Region anchor (no located place):** no place of her own is documented; the Pinheiro
