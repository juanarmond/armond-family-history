profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Era viúva viva no distrito de Carangola quando foi nomeada no óbito de 1964 de seu filho Antonio Engrácio Filho — a data exata de seu próprio óbito é desconhecida, deixando em aberto se sobreviveu ao filho (CIV-0017, CIV-0022).

  - **[CONTEXTUAL]** Como uma mulher nascida provavelmente nas décadas de 1860–1870 na Zona da Mata Mineira, ela teria vivido a abolição da escravidão (1888), a proclamação da República (1889) e todo o colapso da economia cafeeira — forças que empurraram famílias rurais sem terra para a economia urbana.

  - **[INFERRED]** Seu sobrenome "Pinheiro" é um patronímico de família genuíno, e não um nome devocional — ao contrário do comum elemento "da Conceição", que é devocional. O "Pinheiro" é o único fio que poderia rastrear sua família natal nos registros da Zona da Mata Mineira anteriores a Carangola.

  - **[INFERRED]** Tanto ela quanto seu marido Antonio Engrácio de Souza (P-0032) estão ausentes de todos os registros de inventários, terras e imprensa pesquisados — coerente com uma família de pequena cidade ou rural sem propriedade herdável, cuja presença no arquivo passa apenas pelos registros vitais dos filhos.

  - **[CONTEXTUAL]** A crise cafeeira das décadas de 1890–1920 acelerou a partida de famílias sem terra da Zona da Mata rumo ao emprego industrial; seu filho Antonio Engrácio Filho e seus netos permaneceram na região de Carangola até a década de 1960, antes de a linha alcançar eventualmente o Rio de Janeiro.

  ## Identidade

  **Luzia Pinheiro da Conceição** (também *Luzia da Conceição*) [PROVEN] — avó paterna de
  Cidalia (P-0005), mãe de Antonio Engracio Filho (P-0010).

  - **Cônjuge:** Antonio Engracio de Souza (P-0032) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filho (em nossa linha):** Antonio Engracio Filho (P-0010).

  - **Óbito:** já falecida ao tempo do óbito de seu filho em 1964 (CIV-0017) [PROVEN quanto
  ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ela é nomeada apenas de forma derivada: como mãe falecida de Antonio Engracio Filho no
  óbito civil de 1964 (CIV-0017, "Luzia Pinheiro da Conceição") e como avó paterna de
  Cidalia em seu nascimento de 1930 (CIV-0022, ali a forma mais curta "Luzia da
  Conceição"); ambas as grafias são preservadas. Nenhum registro próprio dela foi obtido.

  ## O que podemos extrapolar

  Parte de uma família de Minas Gerais (região de Carangola); sua nacionalidade brasileira
  é inferida dessa origem (jus soli), não do sobrenome [INFERRED]. "Pinheiro" — um
  sobrenome de família real, ao contrário do devocional "da Conceição" — é o único fio
  condutor para sua própria família (não documentada).

  Na leitura socioeconômica, ela está à frente de um ramo cujo único caráter econômico legível
  é, a jusante, comercial-urbano. [INFERRED / CONTEXTUAL — OPEN] Como esposa do obscuro tronco
  Engrácio-Souza (P-0032) e mãe do comerciante Antônio Filho (P-0010), ela não carrega posição,
  propriedade ou origem própria documentadas. Que portasse um patronímico real — *Pinheiro* — em
  vez de um nome puramente devocional é a única pequena pista de que sua família natal era
  rastreável-local, não um marcador de qualquer classe em particular.

  ## Questões em aberto

  - Seus pais — a partir de seu registro de casamento (anterior a 1895) ou de óbito
  (anterior a 1964), provavelmente em Carangola. [OPEN]

