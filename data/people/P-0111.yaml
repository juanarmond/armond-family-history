profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Justino da Silva is known to us entirely because Nova Friburgo's 19th-century Catholic parish marriage acts required the groom to name both parents regardless of where they lived — a legal formality that preserved a Portuguese father's name in a Brazilian record across the Atlantic.

  - **[INFERRED]** He remained in Portugal when his son Antonio emigrated: he never appears in any Brazilian record. His son Antonio settled in Nova Friburgo and married a Swiss-colony daughter (Maria Joanna Rutschmann), forging a link between a Portuguese immigrant family and a Swiss-German colonist trunk.

  - **[CONTEXTUAL]** Antonio's stated birthplace — a parish tentatively read as [Guenfães], Portugal — would be the starting point for any search for Justino's own records; without that parish confirmed, his dates and parentage remain entirely beyond reach of held sources.

  ## Identity

  **Justino da Silva** — a Portuguese man, known solely from his son Antonio da Silva
  Ferreira's 1859 Nova Friburgo marriage record as the father of that son who emigrated to
  Brazil. [PROVEN (named in PAR-0070)]

  - **Role:** father of Antonio da Silva Ferreira (P-0036); husband of Maria Angelica
  (P-0112); family F-0055. [PROVEN — PAR-0070]

  - **Origin:** Portuguese, inferred from his son Antonio's record-attested birthplace in
  Portugal. No held document names Justino's own parish of origin. [INFERRED/CONTEXTUAL —
  PAR-0070 states the son's origin as Portugal; Justino's own origin is unrecorded]

  - **Birth and death:** not established. [OPEN]

  ## Family and social network

  He is named alongside his wife Maria Angelica (P-0112) in the 1859 Nova Friburgo marriage
  entry of their son Antonio — "filho legitimo de Justino da Silva e de Maria Angelica,
  natural e baptizado na Frequezia de [Guenfães? — uncertain] em Portugal" (PAR-0070,
  E-0094). [PROVEN — PAR-0070]

  His son Antonio da Silva Ferreira emigrated to Brazil and married Maria Joanna Rocheman
  (Rutschmann, P-0037) at Nova Friburgo on 3 March 1859, connecting this Portuguese line to
  the Swiss-colony Rutschmann trunk. No record places Justino himself outside Portugal.
  [INFERRED/CONTEXTUAL]

