profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Justino da Silva chega ao nosso conhecimento inteiramente porque os assentos de casamento da paróquia católica de Nova Friburgo no século XIX exigiam que o noivo nomeasse ambos os pais, independentemente de onde vivessem — uma formalidade legal que preservou o nome de um pai português num registro brasileiro através do Atlântico.

  - **[INFERRED]** Permaneceu em Portugal quando seu filho Antonio emigrou: nunca aparece em nenhum registro brasileiro. Seu filho Antonio se estabeleceu em Nova Friburgo e casou com uma filha da colônia suíça (Maria Joanna Rutschmann), forjando um elo entre uma família imigrante portuguesa e um tronco colono suíço-alemão.

  - **[CONTEXTUAL]** O local de nascimento declarado de Antonio — uma freguesia lida provisoriamente como [Guenfães], Portugal — seria o ponto de partida para qualquer busca pelos próprios registros de Justino; sem essa freguesia confirmada, suas datas e filiação permanecem totalmente fora do alcance das fontes disponíveis.

  ## Identidade

  **Justino da Silva** — homem português, conhecido exclusivamente pelo registro de casamento
  de seu filho Antonio da Silva Ferreira em Nova Friburgo em 1859, no qual é nomeado como
  pai desse filho que emigrou para o Brasil. [PROVEN (nomeado em PAR-0070)]

  - **Papel:** pai de Antonio da Silva Ferreira (P-0036); marido de Maria Angelica (P-0112);
  família F-0055. [PROVEN — PAR-0070]

  - **Origem:** portuguesa, inferida do local de nascimento de seu filho Antonio, atestado em
  registro primário como Portugal. Nenhum documento primário disponível nomeia a própria
  freguesia de origem de Justino. [INFERRED/CONTEXTUAL — PAR-0070 declara a origem do filho
  como Portugal; a origem do próprio Justino não está registada]

  - **Nascimento e óbito:** não estabelecidos. [OPEN]

  ## Família e rede social

  É nomeado ao lado de sua esposa Maria Angelica (P-0112) no assento de casamento de seu
  filho Antonio em Nova Friburgo, em 1859 — "filho legitimo de Justino da Silva e de Maria
  Angelica, natural e baptizado na Frequezia de [Guenfães? — incerto] em Portugal" (PAR-0070,
  E-0094). [PROVEN — PAR-0070]

  Seu filho Antonio da Silva Ferreira emigrou para o Brasil e casou-se com Maria Joanna
  Rocheman (Rutschmann, P-0037) em Nova Friburgo em 3 de março de 1859, unindo esta linhagem
  portuguesa ao tronco suíço-colonial dos Rutschmann. Nenhum registro situa o próprio Justino
  fora de Portugal. [INFERRED/CONTEXTUAL]

  ## Questões em aberto

  - Sua freguesia de origem em Portugal — o assento de casamento de 1859 registra o local de
  nascimento de Antonio como [Guenfães? — incerto], Portugal; confirmar o nome dessa freguesia
  e localizar seus registros seria o caminho para as datas e filiação de Justino. [OPEN]

  - Qualquer registro que nomeie Justino diretamente — nascimento, casamento ou óbito. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0070 (casamento de seu filho em Nova Friburgo, 1859 — nomeia-o e sua esposa Maria
  Angelica como pais de Antonio; atesta a origem portuguesa de Antonio).
