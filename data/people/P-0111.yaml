profile: >-
  ## Interesting facts

  - **[PROVEN]** He is known to us entirely because Nova Friburgo's 19th-century Catholic marriage acts required a groom to name both parents regardless of where they lived — a formality that preserved a Portuguese father's name in a Brazilian register across the Atlantic (PAR-0070).

  - **[PROVEN]** In that 1859 act the bride's age is given as 18 and **the groom's age is left blank**. Ages in a parish act came from the contracting parties' own declaration, so the blank means his son could not state his own age with confidence — the position of an emigrant with no baptismal certificate to hand and no family in Brazil to supply one. It is the sharpest single indication of how far Justino was from his son's new life.

  - **[INFERRED]** He never appears in any Brazilian record. He remained in Portugal while his son Antonio emigrated, settled in Nova Friburgo and married into the Swiss-colony Rutschmann family.

  - **[CONTEXTUAL]** Antonio's stated birthplace — a parish tentatively read as [Guenfães], Portugal — is the only pointer to where Justino's own records would be. Until that parish name is confirmed, his dates and parentage are beyond the reach of any held source.

  - **[PROVEN]** No title, rank or honorific attaches to him in the act, and his wife is entered without a surname. Nineteenth-century clerks wrote out the styles that mattered; the plainness of this entry is itself the only status information it carries.

  ## Identity

  **Justino da Silva** — a Portuguese man, known solely from his son Antonio da Silva Ferreira's 1859 Nova Friburgo marriage record as the father of the son who emigrated to Brazil. [PROVEN (named in PAR-0070)] Father of Antonio da Silva Ferreira (P-0036) and so 2nd-great-grandfather of Iris Bohrer Muniz on the Silva Ferreira line (chain: Iris < Celina Bohrer < Lucinda Ferreira da Silva < Antonio < Justino).

  - **Role:** husband of Maria Angelica (P-0112); family F-0055. [PROVEN — PAR-0070]

  - **Origin:** Portuguese, inferred from his son Antonio's record-attested birthplace in Portugal. No held document names Justino's own parish. [INFERRED/CONTEXTUAL — PAR-0070 states the son's origin as Portugal; Justino's own origin is unrecorded]

  - **Birth and death:** not established. [OPEN]

  ## Standing and profession

  - **No occupation, rank or title is recorded for him** in the only act that names him. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** he was not a party to any held record and cannot have signed one.

  - **What the act does say, by omission, is that nobody in Nova Friburgo needed to describe him.** He is a name required by a form, supplied by a son who was marrying two thousand leagues from where his father lived. [INFERRED]

  ## Family and social network

  - He is named alongside his wife Maria Angelica (P-0112) in the 1859 Nova Friburgo marriage entry of their son Antonio — "filho legitimo de Justino da Silva e de Maria Angelica, natural e baptizado na Frequezia de [Guenfães? — uncertain] em Portugal" (PAR-0070, E-0094). [PROVEN — PAR-0070]

  - **Son:** Antonio da Silva Ferreira (P-0036), who emigrated to Brazil and married Maria Joanna Rocheman (Rutschmann, P-0037) at Nova Friburgo on 3 March 1859, connecting this Portuguese line to the Swiss-colony Rutschmann trunk. No record places Justino himself outside Portugal. [INFERRED/CONTEXTUAL]

  - **The witnesses at his son's wedding** — Domingos Baptista Bittencourt and Luiz Mathias Pinheiro — carry Luso-Brazilian, not Swiss-colony, names, and the priest who assisted was of the colony's clergy (Vigário Jacob Joye). So the groom's supporters came from the Portuguese-Brazilian side of Nova Friburgo, not from his bride's community. [PROVEN for the names; the reading INFERRED]

  ## What we can extrapolate

  - **A blank age is a document telling us a family was out of reach** [PROVEN datum / INFERRED reading]. The parish clerk recorded the bride's eighteen years because her parents were there to say so, and left her husband's blank because nobody present could. Whatever Justino's household was, it did not send its emigrant son away with papers, and it could not be consulted. That is the ordinary condition of a modest emigrant family, and it is the most concrete thing the archive says about him.

  - **Emigration disinherited his son in practice, whatever the law said** [CONTEXTUAL]. Portuguese succession divided an estate among all children, but a share in a smallholding in a northern freguesia is unrealisable from Brazil: it cannot be worked, it cannot easily be sold, and pursuing it requires the very documents the blank age suggests his son did not have. A son who crosses the Atlantic converts a legal entitlement into nothing. That, rather than any dispute, is usually why an emigrant line keeps the surname and none of the property.

  - **The marriage his son made was lateral, not upward** [CONTEXTUAL / INFERRED]. Nova Friburgo's Swiss colony, founded 1819, was by the 1850s a community of smallholding farmers and artisans, not a landed elite. A Portuguese immigrant marrying a colonist's daughter is one migrant population joining another — a match between equals in precarity. Nothing in the act suggests either family brought property to it: there is no dowry clause, no styling, no honorific on either side.

  - **Two surnames and only one of them explained** [PROVEN / OPEN]. The act gives the father as "Justino **da Silva**" and the son as "Antonio **da Silva Ferreira**"; his mother is entered with no surname at all. The "da Silva" element therefore descends from Justino and survives two further generations, into his granddaughter Lucinda's documented "Ferreira da Silva". Where the "Ferreira" came from, no held record says.

  - **Education cannot be assessed and probably did not exist** [CONTEXTUAL]. Mid-19th-century rural northern Portugal had very limited schooling, and it was a purchased, class-linked good. Nothing about this household — no title, no trade, no property, a son emigrating young without papers — suggests it was bought here.

  ## Open questions

  - His Portuguese parish of origin. The 1859 act records Antonio's birthplace as [Guenfães? — uncertain], Portugal; confirming that parish name and locating its registers is the only path to Justino's own dates and parents. [OPEN]

  - Any direct record naming him — a birth, a marriage, a death. [OPEN]

  - Whether he was still alive in 1859. The act names him without the "já falecido" formula that a Brazilian clerk would often add, but Portuguese-parentage clauses in these registers are not reliable on that point. [OPEN]

  ## Sources held (this repository)

  - PAR-0070 (his son's 1859 Nova Friburgo marriage — names him and his wife Maria Angelica as Antonio's parents; attests Antonio's Portuguese origin, records the blank groom's age and the two witnesses).

  ## Regional and migration context

  No record places him anywhere but Portugal, in the unconfirmed parish his son was baptised in. [CONTEXTUAL] His son's destination is the documented half of the story: Nova Friburgo, in the Rio de Janeiro highlands, a town founded in 1819 as a Swiss colony and by the 1850s a mixed community of colonist smallholders and Luso-Brazilian settlers, which drew continuing Portuguese immigration through the mid-19th century. Portuguese emigration to Brazil in that period was overwhelmingly young, male and economically driven; nothing in the record states his son's motive. [CONTEXTUAL]

  ## Where to go today

  - **His son's marriage (3 March 1859):** Matriz de São João Batista, Nova Friburgo, RJ [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Matriz%20de%20S%C3%A3o%20Jo%C3%A3o%20Batista%2C%20Nova%20Friburgo%2C%20RJ)

  - **His own parish:** unidentified — the act's "[Guenfães]" is an uncertain read and has not been matched to a Portuguese freguesia. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele nos é conhecido inteiramente porque os atos de casamento católicos de Nova Friburgo, no século XIX, exigiam que o noivo nomeasse ambos os pais, vivessem onde vivessem — formalidade que preservou o nome de um pai português num registro brasileiro, do outro lado do Atlântico (PAR-0070).

  - **[PROVEN]** Nesse ato de 1859, a idade da noiva é dada como 18 anos e **a idade do noivo fica em branco**. As idades, num ato paroquial, vinham da declaração dos próprios contraentes, de modo que o branco significa que seu filho não pôde declarar a própria idade com segurança — a posição de um emigrante sem certidão de batismo à mão e sem família no Brasil que a fornecesse. É a indicação mais nítida de quão distante Justino estava da nova vida do filho.

  - **[INFERRED]** Ele nunca aparece em registro brasileiro algum. Permaneceu em Portugal enquanto seu filho Antonio emigrava, fixava-se em Nova Friburgo e se casava com a família Rutschmann, da colônia suíça.

  - **[CONTEXTUAL]** O local de nascimento declarado de Antonio — freguesia lida tentativamente como [Guenfães], em Portugal — é o único indício de onde estariam os registros do próprio Justino. Até que esse nome de freguesia seja confirmado, suas datas e sua filiação ficam fora do alcance de qualquer fonte disponível.

  - **[PROVEN]** Nenhum título, patente ou tratamento honorífico lhe é atribuído no ato, e sua esposa é lançada sem sobrenome. Os escrivães oitocentistas escreviam por extenso os tratamentos que importavam; a simplicidade desta entrada é, ela própria, a única informação de condição que ela carrega.

  ## Identidade

  **Justino da Silva** — homem português, conhecido unicamente pelo registro de casamento de 1859, em Nova Friburgo, de seu filho Antonio da Silva Ferreira, como pai do filho que emigrou para o Brasil. [PROVEN (nomeado em PAR-0070)] Pai de Antonio da Silva Ferreira (P-0036) e, portanto, trisavô de Iris Bohrer Muniz na linha Silva Ferreira (cadeia: Iris < Celina Bohrer < Lucinda Ferreira da Silva < Antonio < Justino).

  - **Papel:** marido de Maria Angelica (P-0112); família F-0055. [PROVEN — PAR-0070]

  - **Origem:** português, inferida do local de nascimento de seu filho Antonio, atestado em registro como sendo em Portugal. Nenhum documento disponível nomeia a freguesia do próprio Justino. [INFERRED/CONTEXTUAL — PAR-0070 declara a origem do filho como Portugal; a origem de Justino não está registrada]

  - **Nascimento e óbito:** não estabelecidos. [OPEN]

  ## Posição social e profissão

  - **Nenhuma ocupação, patente ou título lhe é registrado** no único ato que o nomeia. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** ele não foi parte em nenhum registro disponível e não poderia tê-lo assinado.

  - **O que o ato diz, por omissão, é que ninguém em Nova Friburgo precisava descrevê-lo.** É um nome exigido por um formulário, fornecido por um filho que se casava a duas mil léguas de onde o pai vivia. [INFERRED]

  ## Família e rede social

  - Ele é nomeado ao lado de sua esposa Maria Angelica (P-0112) no assento de casamento de 1859, em Nova Friburgo, de seu filho Antonio — "filho legitimo de Justino da Silva e de Maria Angelica, natural e baptizado na Frequezia de [Guenfães? — incerto] em Portugal" (PAR-0070, E-0094). [PROVEN — PAR-0070]

  - **Filho:** Antonio da Silva Ferreira (P-0036), que emigrou para o Brasil e se casou com Maria Joanna Rocheman (Rutschmann, P-0037) em Nova Friburgo, em 3 de março de 1859, conectando esta linha portuguesa ao tronco Rutschmann da colônia suíça. Nenhum registro situa Justino fora de Portugal. [INFERRED/CONTEXTUAL]

  - **As testemunhas do casamento de seu filho** — Domingos Baptista Bittencourt e Luiz Mathias Pinheiro — têm nomes luso-brasileiros, não da colônia suíça, e o padre que assistiu era do clero da colônia (Vigário Jacob Joye). Assim, os apoiadores do noivo vinham do lado luso-brasileiro de Nova Friburgo, e não da comunidade da noiva. [PROVEN quanto aos nomes; a leitura é INFERRED]

  ## O que podemos extrapolar

  - **Uma idade em branco é um documento nos dizendo que uma família estava fora de alcance** [dado PROVEN / leitura INFERRED]. O escrivão registrou os dezoito anos da noiva porque os pais dela estavam ali para dizê-lo, e deixou em branco a do marido porque ninguém presente podia. Fosse o que fosse a casa de Justino, ela não despachou seu filho emigrante com papéis e não podia ser consultada. Essa é a condição comum de uma família emigrante modesta, e é a coisa mais concreta que o arquivo diz sobre ele.

  - **A emigração deserdou seu filho na prática, dissesse o que dissesse a lei** [CONTEXTUAL]. A sucessão portuguesa dividia o espólio entre todos os filhos, mas uma cota numa pequena propriedade de freguesia do norte é irrealizável a partir do Brasil: não pode ser lavrada, não se vende com facilidade, e persegui-la exige justamente os documentos que a idade em branco sugere que o filho não tinha. Um filho que atravessa o Atlântico converte um direito legal em nada. É isso, e não qualquer disputa, que em geral explica por que uma linha emigrante conserva o sobrenome e nenhuma propriedade.

  - **O casamento que seu filho fez foi lateral, não ascendente** [CONTEXTUAL / INFERRED]. A colônia suíça de Nova Friburgo, fundada em 1819, era nos anos 1850 uma comunidade de pequenos lavradores e artesãos, não uma elite proprietária. Um imigrante português casando-se com a filha de um colono é uma população migrante unindo-se a outra — um par entre iguais na precariedade. Nada no ato sugere que qualquer das famílias tenha trazido propriedade: não há cláusula de dote, tratamento nem honorífico de nenhum dos lados.

  - **Dois sobrenomes e só um deles explicado** [PROVEN / OPEN]. O ato dá o pai como "Justino **da Silva**" e o filho como "Antonio **da Silva Ferreira**"; a mãe é lançada sem sobrenome algum. O elemento "da Silva" desce, portanto, de Justino e sobrevive mais duas gerações, até o "Ferreira da Silva" documentado de sua neta Lucinda. De onde veio o "Ferreira", nenhum registro disponível diz.

  - **A educação não pode ser avaliada e provavelmente não existiu** [CONTEXTUAL]. O norte rural de Portugal em meados do século XIX tinha escolarização muito limitada, e era bem comprado e ligado à classe. Nada nesta casa — nenhum título, ofício ou propriedade, e um filho que emigra jovem e sem papéis — sugere que ela tenha sido comprada aqui.

  ## Questões em aberto

  - Sua freguesia portuguesa de origem. O ato de 1859 registra o local de nascimento de Antonio como [Guenfães? — incerto], em Portugal; confirmar esse nome de freguesia e localizar seus registros é o único caminho para as datas e os pais do próprio Justino. [OPEN]

  - Qualquer registro direto que o nomeie — nascimento, casamento ou óbito. [OPEN]

  - Se ele ainda estava vivo em 1859. O ato o nomeia sem a fórmula "já falecido" que um escrivão brasileiro muitas vezes acrescentaria, mas as cláusulas de filiação portuguesa nesses registros não são confiáveis nesse ponto. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0070 (casamento de 1859 em Nova Friburgo de seu filho — nomeia-o e à esposa Maria Angelica como pais de Antonio; atesta a origem portuguesa de Antonio, registra a idade em branco do noivo e as duas testemunhas).

  ## Contexto regional e migratório

  Nenhum registro o situa em outro lugar que não Portugal, na freguesia não confirmada em que seu filho foi batizado. [CONTEXTUAL] O destino do filho é a metade documentada da história: Nova Friburgo, na serra fluminense, vila fundada em 1819 como colônia suíça e, nos anos 1850, comunidade mista de pequenos proprietários colonos e povoadores luso-brasileiros, que atraiu imigração portuguesa contínua em meados do século XIX. A emigração portuguesa para o Brasil naquele período era esmagadoramente jovem, masculina e de motivação econômica; nada no registro declara o motivo de seu filho. [CONTEXTUAL]

  ## Onde ir hoje

  - **Casamento de seu filho (3 de março de 1859):** Matriz de São João Batista, Nova Friburgo, RJ [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Matriz%20de%20S%C3%A3o%20Jo%C3%A3o%20Batista%2C%20Nova%20Friburgo%2C%20RJ)

  - **Sua própria freguesia:** não identificada — o "[Guenfães]" do ato é leitura incerta e não foi correspondido a nenhuma freguesia portuguesa. [OPEN]
