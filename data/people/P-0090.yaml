profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Domingos Gonçalves já defunto" — already deceased — in his daughter Joanna's 1716 Ruivais marriage (PAR-0036). That is the only document attesting him, and it fixes his death before May 1716.

  - **[CONTEXTUAL]** His family were *moradores do lugar da quinta* — residents of the quinta sub-locality of Ruivais. A lugar-name used as an address indicates a defined smallholding rather than landless labour: a household with something to transmit, which is precisely what partible inheritance then fragmented.

  - **[PROVEN]** His widow Maria Fernandes is still recorded at the lugar da quinta in 1716, after his death — so the household held its place through the widowhood rather than dispersing.

  - **[INFERRED]** His marriage to Maria Fernandes is a bounded negative across the Ruivais marriage register 1664–1706, which means the couple most likely married in her home parish. That register, wherever it lies, is where his own parents would be named — and it is the reason this branch stops at him.

  ## Identity

  **Domingos Gonçalves**, of the lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese. Already deceased by 1716. Father of Joanna Gonçalves (P-0081) and so 4th-great-grandfather of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Role:** named, as "já defunto", with his wife Maria Fernandes (P-0091) in their daughter's 13 May 1716 Ruivais marriage (PAR-0036; family F-0044). [strong-evidence — see P-0081 for the identity basis]

  - **Death:** before 13 May 1716. Birth and own parents unrecorded. [OPEN]

  ## Standing and profession

  - **Nothing is recorded.** No occupation, rank, title or act of his own. He is a deceased father in one clause of his daughter's marriage entry. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** he was dead before the only record naming him was written; nothing signable can exist.

  - **The one status marker is the lugar:** *moradores no lugar da quinta* is a real, if minimal, description of position — a household located on a named holding, above labourers and far below anyone with a title. [PROVEN for the lugar; the reading INFERRED]

  ## Family and social network

  - **Wife:** Maria Fernandes (P-0091), living and still of the lugar da quinta at the 1716 wedding.

  - **Daughter:** Joanna Gonçalves (P-0081), who married João Rodrigues at Ruivais on 13 May 1716 and was the mother of the emigrant João Rodrigues Valle (P-0078).

  - **No other relation of his is documented.** The witnesses at his daughter's wedding — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo, all of the same freguesia — cannot be tied to him personally. [OPEN]

  ## What we can extrapolate

  - **He is the clearest instance in this line of what partible inheritance does to a small holding** [PROVEN facts / CONTEXTUAL law]. He died leaving a quinta and a widow; the land was settled among her and the children before his daughter married. A smallholding in a highland parish cannot absorb that twice. The generation after, his grandson had to leave the country to hold anything in his own right — which is the same event, seen from the far end.

  - **His household kept its address, which is not nothing** [PROVEN / INFERRED]. His widow is still "moradora no lugar da quinta" in 1716. Many widowed households in the Minho dissolved into service or dependency; hers did not. Whatever the holding was, it was enough to keep a woman and her children on it and to marry a daughter respectably within the parish.

  - **His death before his daughter's wedding is what makes this a documented family at all** [INFERRED]. The "já defunto" clause is the only reason we know he existed, because a marriage act names parents whether alive or dead. The archive here preserves a man only at the moment his child needed to be identified — which is a good description of how the whole Ruivais generation of this branch survives.

  - **Education, office and commerce are all absent and would have been** [CONTEXTUAL]. There was no public schooling in rural Portugal, and nothing in a quinta household's economy would have justified buying letters. The competence first appears in this family in Brazil, several generations later, attached to a militia rank — bought for a role, not inherited.

  ## Open questions

  - **His own parents and origin** [OPEN]. A page-by-page read of the Ruivães marriage register 1664–1706 (retrieval) did not find his marriage to Maria Fernandes, so the couple most likely married in her out-of-parish home freguesia — where the generation above him would be named. A further retrieval sweep (September 2026) of the Ruivães baptisms (1650–1674) and of the neighbouring Vieira do Minho parishes' marriages (Campos, Salamonde/São Gens, Ventosa, Cantelães) was also bounded-negative, so both Ruivães paths are exhausted; the highest-value unread levers are now the Montalegre/Barroso parishes across the Rabagão (Vila Real district, at the ADVR) and his own Ruivães óbito registers. [LEAD]

  - His date of death and any inventário or will, which would show what the quinta actually held. None is known. [OPEN]

  - His full child set — only the daughter Joanna is attested. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of his daughter — names him, deceased, as her father).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de Braga), the origin parish of this branch; his grandson João Rodrigues Valle (P-0078) emigrated to Minas Gerais. [CONTEXTUAL] He is the non-emigrating Ruivães generation at the origin-end of that move: the Minho was Portugal's densest, most land-fragmented region — a smallholding minifúndio at ~96 inhabitants per km² by 1801 — whose surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese emigration to Brazil, his grandson's crossing falling under the Provisão de 20 de março de 1720 passport regime. [CONTEXTUAL]

  ## Where to go today

  - **His parish (his daughter Joana's 1716 marriage):** Igreja de São Martinho de Ruivães, Ruivães, Vieira do Minho, Braga, Portugal (Av. de São Martinho 3896, 4850-341) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeado "Domingos Gonçalves já defunto" — já falecido — no casamento de sua filha Joanna em Ruivais, em 1716 (PAR-0036). É o único documento que o atesta, e fixa sua morte antes de maio de 1716.

  - **[CONTEXTUAL]** Sua família era de *moradores do lugar da quinta* — moradores da sub-localidade da quinta, em Ruivais. Um nome de lugar usado como endereço indica pequena propriedade definida, e não trabalho sem terra: uma casa com algo a transmitir, que é exatamente o que a herança partível depois fragmentou.

  - **[PROVEN]** Sua viúva, Maria Fernandes, ainda é registrada no lugar da quinta em 1716, após a morte dele — de modo que a casa manteve seu lugar durante a viuvez, em vez de se dispersar.

  - **[INFERRED]** Seu casamento com Maria Fernandes é negativo delimitado em todo o registro de casamentos de Ruivais de 1664–1706, o que significa que o casal provavelmente se casou na paróquia natal dela. Esse registro, onde quer que esteja, é onde seus próprios pais seriam nomeados — e é a razão de este ramo parar nele.

  ## Identidade

  **Domingos Gonçalves**, do lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Português. Já falecido em 1716. Pai de Joanna Gonçalves (P-0081) e, portanto, pentavô de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Papel:** nomeado, como "já defunto", com sua mulher Maria Fernandes (P-0091) no casamento de sua filha, em 13 de maio de 1716, em Ruivais (PAR-0036; família F-0044). [evidência forte — ver P-0081 quanto à base de identidade]

  - **Óbito:** antes de 13 de maio de 1716. Nascimento e pais próprios sem registro. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado.** Nenhuma ocupação, patente, título ou ato próprio. É um pai falecido numa cláusula do assento de casamento da filha. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** já estava morto quando se escreveu o único registro que o nomeia; nada assinável pode existir.

  - **O único marcador de condição é o lugar:** *moradores no lugar da quinta* é uma descrição real, ainda que mínima, de posição — uma casa situada numa posse nomeada, acima dos jornaleiros e muito abaixo de quem tivesse título. [PROVEN quanto ao lugar; a leitura é INFERRED]

  ## Família e rede social

  - **Esposa:** Maria Fernandes (P-0091), viva e ainda do lugar da quinta no casamento de 1716.

  - **Filha:** Joanna Gonçalves (P-0081), casada com João Rodrigues em Ruivais em 13 de maio de 1716 e mãe do emigrante João Rodrigues Valle (P-0078).

  - **Nenhuma outra relação sua está documentada.** As testemunhas do casamento da filha — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo, todos da mesma freguesia — não podem ser ligadas a ele pessoalmente. [OPEN]

  ## O que podemos extrapolar

  - **Ele é o caso mais claro, nesta linha, do que a herança partível faz a uma pequena posse** [fatos PROVEN / lei CONTEXTUAL]. Morreu deixando uma quinta e uma viúva; a terra foi acertada entre ela e os filhos antes de a filha se casar. Uma pequena propriedade em freguesia serrana não absorve isso duas vezes. Na geração seguinte, seu neto teve de deixar o país para ter algo em nome próprio — o mesmo evento, visto da outra ponta.

  - **Sua casa manteve o endereço, o que não é pouco** [PROVEN / INFERRED]. Sua viúva ainda é "moradora no lugar da quinta" em 1716. Muitas casas viúvas no Minho se dissolviam em serviço ou dependência; a dela, não. Fosse qual fosse a posse, bastou para manter ali uma mulher e seus filhos e para casar uma filha de modo respeitável dentro da freguesia.

  - **Sua morte antes do casamento da filha é o que faz desta uma família documentada** [INFERRED]. A cláusula "já defunto" é a única razão de sabermos que existiu, porque um ato de casamento nomeia os pais estejam vivos ou mortos. O arquivo, aqui, preserva um homem apenas no momento em que seu filho precisou ser identificado — o que descreve bem como sobrevive toda a geração de Ruivais deste ramo.

  - **Educação, ofício e comércio estão todos ausentes, e estariam** [CONTEXTUAL]. Não havia escolarização pública no Portugal rural, e nada na economia de uma casa de quinta justificaria comprar letras. A competência só aparece nesta família no Brasil, várias gerações depois, ligada a uma patente miliciana — comprada para um papel, não herdada.

  ## Questões em aberto

  - **Seus próprios pais e sua origem** [OPEN]. Uma leitura página a página do registro de casamentos de Ruivães de 1664–1706 (recuperação) não encontrou seu casamento com Maria Fernandes, de modo que o casal provavelmente se casou na freguesia natal dela, fora da paróquia — onde a geração acima dele seria nomeada. Uma nova varredura de recuperação (setembro de 2026) dos batismos de Ruivães (1650–1674) e dos casamentos das freguesias vizinhas de Vieira do Minho (Campos, Salamonde/São Gens, Ventosa, Cantelães) também foi negativa e delimitada, de modo que ambos os caminhos por Ruivães estão esgotados; as alavancas não lidas de maior valor são agora as freguesias de Montalegre/Barroso, do outro lado do Rabagão (distrito de Vila Real, no ADVR), e seus próprios registros de óbito em Ruivães. [LEAD]

  - Sua data de óbito e qualquer inventário ou testamento, que mostrariam o que a quinta de fato continha. Nenhum é conhecido. [OPEN]

  - Seu conjunto completo de filhos — apenas a filha Joanna está atestada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de sua filha — nomeia-o, falecido, como pai dela).

  ## Contexto regional e migratório

  Do lugar da quinta em São Martinho de Ruivais, terras altas do Minho (Arcebispado de Braga), a paróquia de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou para Minas Gerais. [CONTEXTUAL] É a geração não emigrante de Ruivães, na origem desse movimento: o Minho era a região mais densa e mais fragmentada em terra de Portugal — minifúndio de pequenas propriedades a ~96 habitantes por km² em 1801 —, cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada da emigração portuguesa setecentista para o Brasil, caindo a travessia de seu neto sob o regime de passaportes da Provisão de 20 de março de 1720. [CONTEXTUAL]

  ## Onde ir hoje

  - **Sua paróquia (casamento de sua filha Joana, 1716):** Igreja de São Martinho de Ruivães, Ruivães, Vieira do Minho, Braga, Portugal (Av. de São Martinho 3896, 4850-341) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
