profile: >-
  ## Identity

  **Domingos Gonçalves**, of the lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Portuguese. Already deceased by 1716.

  - **Role:** father of Joanna Gonçalves (P-0081), named (as "já defunto") with his wife
  Maria Fernandes (P-0091) in their daughter's 13 May 1716 Ruivais marriage (PAR-0036;
  family F-0044). [strong-evidence — see P-0081 for the identity basis]

  - **Death:** before 13 May 1716 ("já defunto", PAR-0036). Birth and own parents
  unrecorded. [OPEN] A page-by-page read of the Ruivães marriage register 1664–1706 (retrieval)
  did not find his marriage to Maria Fernandes, so the couple most likely married in her
  out-of-parish home freguesia — where the generation above him would be named; his Ruivães
  óbito registers are not yet read. [LEAD]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of his daughter — names him, deceased, as her father).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de
  Braga), the origin parish of this branch; his grandson João Rodrigues Valle (P-0078)
  emigrated to Minas Gerais. [CONTEXTUAL] He is the non-emigrating Ruivães generation at the
  origin-end of that move: the Minho was Portugal's densest, most land-fragmented region — a
  smallholding minifúndio at ~96 inhabitants per km² by 1801 — whose surplus non-inheriting
  sons made it the single greatest source of 18th-century Portuguese emigration to Brazil, his
  grandson's crossing falling under the Provisão de 20 de março de 1720 passport regime.
  [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Domingos Gonçalves**, do lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Português. Já falecido até 1716.

  - **Papel:** pai de Joanna Gonçalves (P-0081), nomeado (como "já defunto") com sua
  mulher Maria Fernandes (P-0091) no casamento de sua filha em 13 de maio de 1716 em
  Ruivais (PAR-0036; família F-0044). [evidência forte — ver P-0081 para a base da
  identidade]

  - **Óbito:** antes de 13 de maio de 1716 ("já defunto", PAR-0036). Nascimento e pais
  próprios sem registro. [OPEN] Uma leitura página a página do registro de casamentos de
  Ruivães de 1664–1706 (recuperação) não encontrou seu casamento com Maria Fernandes, de modo
  que o casal provavelmente se casou na freguesia de origem dela, fora da paróquia — onde a
  geração acima dele seria nomeada; seus registros de óbito de Ruivães ainda não foram lidos.
  [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de sua filha — nomeia-o, falecido, como pai).

  ## Contexto regional e migratório

  Do lugar da quinta em São Martinho de Ruivais, terras altas do Minho (Arcebispado de
  Braga), a paróquia de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou
  para Minas Gerais. [CONTEXTUAL] Ele é a geração não-emigrante de Ruivães na origem desse
  movimento: o Minho era a região mais densa e mais fragmentada em terra de Portugal — um
  minifúndio de pequenas propriedades, ~96 habitantes por km² em 1801 — cujos filhos excedentes
  não herdeiros fizeram dele a maior fonte isolada de emigração portuguesa setecentista para o
  Brasil, com a travessia de seu neto caindo sob o regime de passaportes da Provisão de 20 de
  março de 1720. [CONTEXTUAL]
