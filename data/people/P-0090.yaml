profile: >-
  ## Identity

  **Domingos Gonçalves**, of the lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Portuguese. Already deceased by 1716.

  - **Role:** father of Joanna Gonçalves (P-0081), named (as "já defunto") with his wife
  Maria Fernandes (P-0091) in their daughter's 13 May 1716 Ruivais marriage (PAR-0036;
  family F-0044). [strong-evidence — see P-0081 for the identity basis]

  - **Death:** before 13 May 1716 ("já defunto", PAR-0036). Birth and own parents
  unrecorded. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of his daughter — names him, deceased, as her father).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de
  Braga), the origin parish of this branch; his grandson João Rodrigues Valle (P-0078)
  emigrated to Minas Gerais. [CONTEXTUAL]
