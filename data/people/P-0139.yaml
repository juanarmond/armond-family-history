notes:
- text: >-
    Antenor Muniz's great-grandfather: father of Thereza Fernandes de Azevedo (P-0039), whose
    daughter Luiza (P-0013) was Antenor's mother. Born at Quintã, São Romão da Ucha, Barcelos,
    on 25 April 1833 (PAR-0106); married Joanna/Anna Maria, a foundling, at Ucha on 10 January
    1855 (PAR-0107); a tailor at Pousa, where his nine children were born 1855–1871 (PAR-0124–PAR-0135);
    in Minas Gerais by 1885, a lavrador at São João do Laranjal (PRB-0016); died at Bom Jesus
    da Cachoeira Alegre, Muriaé, on 30 May 1898 (PRB-0014). He could not write (PRB-0013, PRB-0016).
  text_pt: >-
    Bisavô de Antenor Muniz: pai de Thereza Fernandes de Azevedo (P-0039), cuja filha Luiza (P-0013)
    foi a mãe de Antenor. Nascido em Quintã, São Romão da Ucha, Barcelos, em 25 de abril de 1833
    (PAR-0106); casou-se com Joanna/Anna Maria, exposta, na Ucha em 10 de janeiro de 1855 (PAR-0107);
    alfaiate em Pousa, onde nasceram seus nove filhos entre 1855 e 1871 (PAR-0124–PAR-0135); em
    Minas Gerais já em 1885, lavrador em São João do Laranjal (PRB-0016); faleceu em Bom Jesus
    da Cachoeira Alegre, Muriaé, em 30 de maio de 1898 (PRB-0014). Não sabia escrever (PRB-0013,
    PRB-0016).
- text: >-
    Birthplace conflict, resolved in favour of the baptism: his 1890 will calls him "natural da
    freguesia de Santa Christina do Pauzo, em Braga" (PRB-0013), but he was baptised at São Romão
    da Ucha (PAR-0106), and his children's Pousa registers call him "natural da freguezia de São
    Romão da Ucha" (PAR-0108, PAR-0128–PAR-0135). Santa Cristina de Pousa was his parish of residence
    for at least sixteen years, which is the likely sense of the will's wording [inference].
  text_pt: >-
    Conflito de naturalidade, resolvido a favor do batismo: o testamento de 1890 o diz "natural
    da freguesia de Santa Christina do Pauzo, em Braga" (PRB-0013), mas ele foi batizado em São
    Romão da Ucha (PAR-0106), e os registros de Pousa dos filhos o dizem "natural da freguezia
    de São Romão da Ucha" (PAR-0108, PAR-0128–PAR-0135). Santa Cristina de Pousa foi sua freguesia
    de residência por pelo menos dezesseis anos, o que é o sentido provável da expressão do testamento
    [inferência].
- text: >-
    Nationality: Portuguese by birth at Ucha (PAR-0106) and by his will's "reino de Portugal"
    (PRB-0013). He was living in Brazil at the Republic's grande naturalização of 1889 (Decreto
    58-A); no record held says whether he accepted or declined it, so the field records his nationality
    of birth.
  text_pt: >-
    Nacionalidade: portuguesa, pelo nascimento na Ucha (PAR-0106) e pelo "reino de Portugal" do
    testamento (PRB-0013). Vivia no Brasil na grande naturalização republicana de 1889 (Decreto
