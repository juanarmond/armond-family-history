  ## Contexto regional e migratório


  Seu mundo português foram duas freguesias rurais do concelho de Barcelos, no distrito e arquidiocese
  de Braga: São Romão da Ucha, onde nasceu e se casou, e Santa Cristina de Pousa, onde trabalhou
  e criou os filhos. [PROVEN] O norte de Portugal, e o Minho acima de tudo, forneceu grande parte
  dos emigrantes portugueses para o Brasil na segunda metade do século XIX, muitos deles deixando
  pequenas posses familiares divididas ao longo de gerações. [CONTEXTUAL]


  **Rota: Barcelos (até pelo menos outubro de 1871) → São João do Laranjal (em junho de 1885)
  → São Paulo do Muriaé e o distrito do Bom Jesus da Cachoeira Alegre (testamento feito em Muriaé,
  março de 1890; falecido no distrito, maio de 1898).** [PROVEN para cada ponto datado: PAR-0135,
  PRB-0016, PRB-0013, PRB-0014] O Laranjal foi elevado a distrito de paz em 1871, subordinado
  a Leopoldina, e passou depois a Cataguases; a partilha de 1885 o chama "Freg.a de Laranjal"
  do termo de Cataguases (PRB-0016). [CONTEXTUAL; PROVEN para 1885] O Bom Jesus da Cachoeira Alegre
  foi criado distrito de São Paulo do Muriaé pela lei provincial nº 3442, de 28 de setembro de
  1887, confirmada pela lei estadual nº 2, de 14 de setembro de 1891. Passou a chamar-se Bom Jesus
  da Cachoeira em 1943 e continua sendo distrito de Muriaé. A própria cidade passou a chamar-se
  Muriaé em 1911. [CONTEXTUAL — histórico territorial do IBGE] Ele já estava na Zona da Mata antes
  da abolição (1888), numa fronteira cafeeira cuja demanda de mão de obra estava prestes a mudar,
  e a família ali permaneceu. Os herdeiros de 1898 moravam todos no mesmo distrito, e um genro
  tinha terras ali em 1908 (PRB-0014; FAN-0018). [INFERRED]


