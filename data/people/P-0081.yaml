profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named in three documents despite leaving no record of her own: her 1716 Ruivais marriage (PAR-0036), her son's 1728 Ruivais baptism (PAR-0035), and the 1751 Borda do Campo marriage certidão of that emigrant son (PAR-0034) — a woman recoverable only through her husband's and her son's acts, on two continents.

  - **[PROVEN]** Her father Domingos Gonçalves was already dead at her 1716 wedding ("já defunto") — and so was the groom's. Two fatherless children married that day, each bringing whatever a prior division had left them.

  - **[CONTEXTUAL]** She was of the *lugar da quinta* in Ruivais — a defined smallholding sub-locality — which places her family above landless labourers in the Minho's fragmented rural hierarchy, on a holding nonetheless too small to support all its children.

  - **[CONTEXTUAL]** She remained in Portugal while her son emigrated to Minas Gerais: the generation that stayed, raising children in the same minifúndio landscape that was driving them to leave.

  - **[INFERRED]** Her marriage produced the only Portuguese depth in the whole maternal Toledo line. Because her 1716 act names her parents, this branch reaches two generations further back than any other line in that trunk — which it owes to a single well-kept Ruivais register.

  ## Identity

  **Joanna Gonçalves** (recorded *Joana Gonçalues* in her son's 1728 baptism). Of the lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese. Mother of the emigrant João Rodrigues Valle (P-0078) and so 3rd-great-grandmother of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Marriage:** married João Rodrigues (P-0080) on 13 May 1716 at Ruivais — [strong-evidence]: the Ruivais register (PAR-0036; E-0072; family F-0039) is primary, but identifying its spouses with our P-0080/P-0081 rests on the same name/parish/timeline match as the parentage below.

  - **Parents:** legitimate daughter of Domingos Gonçalves (P-0090), already deceased in 1716, and Maria Fernandes (P-0091), moradores no lugar da quinta, named in PAR-0036 — modelled 2026-08-13 as family F-0044. [strong-evidence]

  - **Birth, baptism, death:** not located; a resident and married communicant of Ruivais. [OPEN]

  ## Standing and profession

  - **Nothing is recorded of her in her own right** — no occupation, no property, no act in which she is a party. She is a bride in 1716 and a named mother in 1728. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record; the 1716 act's rubrics belong to the celebrant and the witnesses.

  - **Her standing is her lugar:** the family of the *quinta*, in a parish where the sub-locality was the address, the identity and the whole of the property description. [PROVEN for the lugar; the reading of what it implies is INFERRED]

  ## Family and social network

  - **Husband:** João Rodrigues (P-0080), of the same parish.

  - **Son:** João Rodrigues Valle (P-0078), baptised at Ruivais in 1728 (PAR-0035) — the son who emigrated to Minas Gerais, married a Borda do Campo woman in 1751 and founded the Brazilian branch. [strong-evidence for the child link]

  - **Her mother Maria Fernandes** (P-0091) was living and still of the lugar da quinta at the 1716 wedding, her father already dead — so she married out of a widow's household. [PROVEN]

  - **The 1716 witnesses** — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo "e muitas mais testemunhas … todos desta dita freguezia" — are wholly local: no officer, no cleric, no outsider. This is a parish-scale social world. [PROVEN]

  ## What we can extrapolate

  - **A fatherless bride in a partible-inheritance region starts from a fraction** [PROVEN / CONTEXTUAL]. Her father's death before 1716 means the quinta household had already been settled — a widow's third and the children's shares — before she married. Whatever she brought to the marriage was a portion of a portion, on a holding that a Minho parish could not enlarge. That is the economic starting point of the household that produced an emigrant twelve years later.

  - **The casa logic explains why her son left and she did not** [CONTEXTUAL / INFERRED]. In the Minho highlands the working practice was to keep a smallholding intact for one heir, using the freely disposable third to favour a single child, precisely so the land would not be pulverised. The system's cost is borne by the other children, who emigrate, go into service or go into the church. She is on the inside of that arrangement, her son on the outside of it.

  - **What she transmitted was a name and a parish, and it turned out to be enough** [INFERRED]. She had no land to give her younger son and no office to pass him. What the household did give him was legitimacy, a baptismal record and a parish of origin — which, thirteen years after his crossing, a Brazilian vicar was still writing into the register. In the colonial world an immigrant's documented legitimate birth was not a formality; it was the credential that let him marry into a local family rather than remain an outsider.

  - **Education did not exist in her world and was not missed** [CONTEXTUAL]. There was no public schooling in rural Portugal in her lifetime, and letters were a purchased good with no use in a quinta household. Her literacy is unclassifiable because nothing ever asked her to write — the same blank that covers every woman of this branch until the Brazilian records of the 1860s finally force the question and answer it in the negative.

  - **She is the deepest sourced woman in the Toledo maternal line, and that is an accident of archives** [INFERRED]. Her existence, her parents and her lugar survive because one Braga parish kept and preserved a marriage book. Nothing about her life was more documented than her neighbours'; the register simply survived. Every conclusion above is therefore about a *type* of household as much as about her.

  ## Open questions

  - Her own baptism and death, and the further identity of her parents (Domingos Gonçalves † × Maria Fernandes), would come from the São Martinho de Ruivais registers (Arquivo Distrital de Braga). [OPEN]

  - Her parents' marriage, which would name the generation above her, is a bounded negative in the Ruivais marriage register 1664–1706, so it most likely lies in her mother's out-of-parish home freguesia. [LEAD]

  - Her full child set (Ruivais baptisms 1717–1728), of which only the 1728 son and a probable 1727 daughter are indicated. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage — her marriage and her parents) · PAR-0035 (1728 Ruivais baptism of her son, naming her as mother) · PAR-0034 (1751 Borda do Campo marriage certidão of that emigrant son, which carries the family's Ruivais origin into the Brazilian record).

  ## Regional and migration context

  A woman of the lugar da quinta in São Martinho de Ruivais, in the Minho highlands of the Arcebispado de Braga — the origin parish of this branch, from which her son emigrated to Minas Gerais. She herself is not documented as leaving Portugal. [CONTEXTUAL] She belongs to the non-emigrating Minho generation, the land-fragmented north-west-Portugal origin from which her son João Rodrigues Valle (P-0078) later crossed to Brazil. The Minho was Portugal's densest and most fragmented region, a smallholding minifúndio reaching some of Europe's highest rural densities (around 96 inhabitants per km² by 1801), whose surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese emigration to Brazil; her son's crossing fell under the passport regime of the Provisão de 20 de março de 1720 (D. João V). This is the structural driver behind the emigration — regional history, not a documented motive of her own. [CONTEXTUAL]

  ## Where to go today

  - **Marriage (13 May 1716) and her son's baptism (1728):** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada em três documentos, embora não tenha deixado registro próprio: seu casamento em Ruivais, em 1716 (PAR-0036), o batismo de seu filho em Ruivais, em 1728 (PAR-0035), e a certidão de casamento desse filho emigrante na Borda do Campo, em 1751 (PAR-0034) — uma mulher recuperável apenas pelos atos do marido e do filho, em dois continentes.

  - **[PROVEN]** Seu pai, Domingos Gonçalves, já estava morto em seu casamento de 1716 ("já defunto") — e o do noivo também. Dois órfãos de pai casaram-se naquele dia, cada um trazendo o que uma divisão anterior lhes havia deixado.

  - **[CONTEXTUAL]** Ela era do *lugar da quinta*, em Ruivais — sub-localidade de pequena propriedade definida —, o que situa sua família acima dos jornaleiros sem terra na hierarquia rural fragmentada do Minho, ainda que sobre uma posse pequena demais para sustentar todos os filhos.

  - **[CONTEXTUAL]** Ela permaneceu em Portugal enquanto o filho emigrava para Minas Gerais: a geração que ficou, criando filhos na mesma paisagem de minifúndio que os empurrava a partir.

  - **[INFERRED]** Seu casamento produziu a única profundidade portuguesa de toda a linha materna Toledo. Como o ato de 1716 nomeia seus pais, este ramo alcança duas gerações mais atrás do que qualquer outra linha daquele tronco — o que se deve a um único registro de Ruivais bem conservado.

  ## Identidade

  **Joanna Gonçalves** (registrada *Joana Gonçalues* no batismo de seu filho, em 1728). Do lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguesa. Mãe do emigrante João Rodrigues Valle (P-0078) e, portanto, tetravó de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Casamento:** casou-se com João Rodrigues (P-0080) em 13 de maio de 1716 em Ruivais — [evidência forte]: o registro de Ruivais (PAR-0036; E-0072; família F-0039) é primário, mas identificar seus cônjuges com os nossos P-0080/P-0081 apoia-se na mesma correspondência de nome, freguesia e cronologia da filiação abaixo.

  - **Pais:** filha legítima de Domingos Gonçalves (P-0090), já falecido em 1716, e de Maria Fernandes (P-0091), moradores no lugar da quinta, nomeados em PAR-0036 — modelados em 2026-08-13 como família F-0044. [evidência forte]

  - **Nascimento, batismo, óbito:** não localizados; moradora e comungante casada de Ruivais. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado sobre ela em nome próprio** — nenhuma ocupação, nenhuma propriedade, nenhum ato em que seja parte. É noiva em 1716 e mãe nomeada em 1728. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro assinável disponível; as rubricas do ato de 1716 pertencem ao celebrante e às testemunhas.

  - **Sua posição social é o seu lugar:** a família da *quinta*, numa freguesia em que a sub-localidade era o endereço, a identidade e toda a descrição de propriedade. [PROVEN quanto ao lugar; a leitura do que ele implica é INFERRED]

  ## Família e rede social

  - **Marido:** João Rodrigues (P-0080), da mesma freguesia.

  - **Filho:** João Rodrigues Valle (P-0078), batizado em Ruivais em 1728 (PAR-0035) — o filho que emigrou para Minas Gerais, casou-se com uma mulher da Borda do Campo em 1751 e fundou o ramo brasileiro. [evidência forte quanto ao vínculo filial]

  - **Sua mãe, Maria Fernandes** (P-0091), estava viva e ainda era do lugar da quinta no casamento de 1716, com o pai já morto — de modo que ela se casou saindo de uma casa de viúva. [PROVEN]

  - **As testemunhas de 1716** — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo "e muitas mais testemunhas … todos desta dita freguezia" — são inteiramente locais: nenhum oficial, nenhum clérigo, nenhum forasteiro. É um mundo social de escala paroquial. [PROVEN]

  ## O que podemos extrapolar

  - **Uma noiva órfã de pai, numa região de herança partível, parte de uma fração** [PROVEN / CONTEXTUAL]. A morte do pai antes de 1716 significa que a casa da quinta já havia sido acertada — o terço da viúva e as cotas dos filhos — antes de ela se casar. O que quer que tenha levado ao casamento era parte de uma parte, sobre uma posse que uma freguesia minhota não podia ampliar. É esse o ponto de partida econômico da casa que produziu um emigrante doze anos depois.

  - **A lógica da casa explica por que o filho partiu e ela não** [CONTEXTUAL / INFERRED]. Nas terras altas do Minho, a prática corrente era manter a pequena propriedade íntegra para um herdeiro, usando o terço de livre disposição para favorecer um único filho, justamente para que a terra não fosse pulverizada. O custo do sistema recai sobre os demais filhos, que emigram, entram para o serviço ou para a Igreja. Ela está do lado de dentro desse arranjo; seu filho, do lado de fora.

  - **O que ela transmitiu foi um nome e uma freguesia, e isso bastou** [INFERRED]. Não tinha terra para dar ao filho mais novo nem ofício para lhe passar. O que a casa lhe deu foi legitimidade, um assento de batismo e uma paróquia de origem — que, treze anos após a travessia, um vigário brasileiro ainda lançava no registro. No mundo colonial, o nascimento legítimo documentado de um imigrante não era formalidade; era a credencial que lhe permitia casar-se com uma família local em vez de permanecer forasteiro.

  - **A educação não existia em seu mundo e não fez falta** [CONTEXTUAL]. Não havia escolarização pública no Portugal rural em seu tempo, e as letras eram bem comprado, sem utilidade numa casa de quinta. Sua alfabetização é inclassificável porque nada jamais lhe pediu que escrevesse — a mesma lacuna que cobre todas as mulheres deste ramo até que os registros brasileiros dos anos 1860 finalmente imponham a pergunta e a respondam pela negativa.

  - **Ela é a mulher mais bem documentada em profundidade na linha materna Toledo, e isso é um acidente de arquivo** [INFERRED]. Sua existência, seus pais e seu lugar sobrevivem porque uma paróquia de Braga manteve e conservou um livro de casamentos. Nada em sua vida foi mais documentado do que a de seus vizinhos; o registro é que sobreviveu. Toda conclusão acima é, portanto, tanto sobre um *tipo* de casa quanto sobre ela.

  ## Questões em aberto

  - Seu próprio batismo e óbito, e a identidade ulterior de seus pais (Domingos Gonçalves † × Maria Fernandes), viriam dos registros de São Martinho de Ruivais (Arquivo Distrital de Braga). [OPEN]

  - O casamento de seus pais, que nomearia a geração acima dela, é negativo delimitado no registro de casamentos de Ruivais de 1664–1706, de modo que provavelmente está na freguesia natal da mãe, fora da paróquia. [LEAD]

  - Seu conjunto completo de filhos (batismos de Ruivais, 1717–1728), do qual só se indicam o filho de 1728 e uma provável filha de 1727. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento em Ruivais, 1716 — seu casamento e seus pais) · PAR-0035 (batismo em Ruivais, 1728, de seu filho, nomeando-a mãe) · PAR-0034 (certidão de casamento na Borda do Campo, 1751, desse filho emigrante, que leva a origem ruivalense da família para o registro brasileiro).

  ## Contexto regional e migratório

  Mulher do lugar da quinta em São Martinho de Ruivais, nas terras altas do Minho, no Arcebispado de Braga — a paróquia de origem deste ramo, de onde seu filho emigrou para Minas Gerais. Ela própria não está documentada como tendo deixado Portugal. [CONTEXTUAL] Pertence à geração minhota não emigrante, a origem fragmentada em terra do noroeste de Portugal de onde seu filho João Rodrigues Valle (P-0078) depois atravessou para o Brasil. O Minho era a região mais densa e mais fragmentada de Portugal, um minifúndio de pequenas propriedades que alcançava algumas das maiores densidades rurais da Europa (cerca de 96 habitantes por km² em 1801), cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada da emigração portuguesa setecentista para o Brasil; a travessia de seu filho caiu sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V). Esse é o motor estrutural por trás da emigração — história regional, não motivo documentado dela própria. [CONTEXTUAL]

  ## Onde ir hoje

  - **Casamento (13 de maio de 1716) e batismo de seu filho (1728):** Igreja de São Martinho de Ruivães, Av. de São Martinho 3896, 4850-341 Ruivães, Vieira do Minho, Braga, PT [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
