profile: >-
  ## Identity

  **Joanna Gonçalves** (recorded *Joana Gonçalues* in her son's 1728 baptism). Of the
  lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
  Portuguese.

  - **Marriage:** married João Rodrigues (P-0080) on 13 May 1716 at Ruivais —
  [strong-evidence]: the Ruivais register (PAR-0036; E-0072; family F-0039) is primary, but
  identifying its spouses with our P-0080/P-0081 rests on the same name/parish/timeline match
  as the parentage below.

  - **Parents:** legitimate daughter of Domingos Gonçalves (P-0090) and Maria Fernandes
  (P-0091), named in PAR-0036 — modelled 2026-08-13 as family F-0044. [strong-evidence]

  - **Birth, baptism, death:** not located; a resident and married communicant of
  Ruivais. [OPEN]

  ## Family and social network

  - **Mother of João Rodrigues Valle (P-0078)**, baptised at Ruivais in 1728 (PAR-0035)
  — the son who emigrated to Minas Gerais. [strong-evidence for the child link]

  ## Open questions

  - Her own baptism and death, and the further identity of her parents (Domingos
  Gonçalves † × Maria Fernandes), would come from the São Martinho de Ruivais registers
  (Arquivo Distrital de Braga). [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage — her marriage and her parents) · PAR-0035 (1728
  Ruivais baptism of her son, naming her as mother).

  ## Regional and migration context

  A woman of the lugar da quinta in São Martinho de Ruivais, in the Minho highlands of
  the Arcebispado de Braga — the origin parish of this branch, from which her son
  emigrated to Minas Gerais. She herself is not documented as leaving Portugal.
  [CONTEXTUAL]

  She belongs to the non-emigrating Minho generation — the land-fragmented northwest-Portugal
  origin from which her son João Rodrigues Valle (P-0078) later crossed to Brazil. The Minho
  was Portugal's densest and most fragmented region, a smallholding minifúndio reaching some
  of Europe's highest rural densities (around 96 inhabitants per km² by 1801), whose surplus
  non-inheriting sons made it the single greatest source of 18th-century Portuguese
  emigration to Brazil; her son's crossing fell under the passport regime of the Provisão de
  20 de março de 1720 (D. João V). This is the structural driver behind the emigration — the
  regional history, not a documented motive of her own. [CONTEXTUAL]

  ## Where to go today

  - **Marriage (13 May 1716):** Igreja de São Martinho de Ruivães, Av. de São Martinho
  3896, 4850-341 Ruivães, Vieira do Minho, Braga, PT [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Identidade

  **Joanna Gonçalves** (registrada *Joana Gonçalues* no batismo de 1728 de seu filho). Do
  lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal.
  Portuguesa.

  - **Casamento:** casou-se com João Rodrigues (P-0080) em 13 de maio de 1716 em Ruivais
  — [strong-evidence]: o registro de Ruivais (PAR-0036; E-0072; família F-0039) é primário,
  mas identificar seus cônjuges com os nossos P-0080/P-0081 apoia-se na mesma correspondência
  de nome/paróquia/cronologia da filiação (abaixo).

  - **Pais:** filha legítima de Domingos Gonçalves (P-0090) e Maria Fernandes (P-0091),
  nomeados em PAR-0036 — modelados em 2026-08-13 como família F-0044. [strong-evidence]

  - **Nascimento, batismo, óbito:** não localizados; residente e comungante casada de
  Ruivais. [OPEN]

  ## Família e rede social

  - **Mãe de João Rodrigues Valle (P-0078)**, batizado em Ruivais em 1728 (PAR-0035) — o
  filho que emigrou para Minas Gerais. [evidência forte para a ligação filial]

  ## Questões em aberto

  - Seu próprio batismo e óbito, e a identidade adicional de seus pais (Domingos
  Gonçalves † × Maria Fernandes), viriam dos registros de São Martinho de Ruivais
  (Arquivo Distrital de Braga). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais — seu casamento e seus pais) · PAR-0035
  (batismo de 1728 em Ruivais de seu filho, que a nomeia como mãe).

  ## Contexto regional e migratório

  Mulher do lugar da quinta em São Martinho de Ruivais, nas terras altas do Minho do
  Arcebispado de Braga — a paróquia de origem deste ramo, de onde seu filho emigrou para
  Minas Gerais. Ela própria não está documentada como tendo deixado Portugal.
  [CONTEXTUAL]

  Ela pertence à geração minhota que não emigrou — a origem fragmentada em terras do
  noroeste de Portugal de onde seu filho João Rodrigues Valle (P-0078) mais tarde cruzou
  para o Brasil. O Minho era a região mais densa e mais fragmentada de Portugal, um
  minifúndio de pequenas posses que alcançava algumas das mais altas densidades rurais da
  Europa (cerca de 96 habitantes por km² por volta de 1801), cujos filhos excedentes sem
  herança fizeram dele a maior fonte isolada de emigração portuguesa para o Brasil no século
  XVIII; a travessia de seu filho enquadrou-se no regime de passaportes da Provisão de 20 de
  março de 1720 (D. João V). Este é o motor estrutural por trás da emigração — a história
  regional, não um motivo documentado dela própria. [CONTEXTUAL]

  ## Onde ir hoje

