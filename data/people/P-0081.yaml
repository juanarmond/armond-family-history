notes:
- text: >-
    Of the lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de
    Braga, Portugal. Married João Rodrigues (P-0080) on 13 May 1716 at Ruivais,
    family F-0039 (PAR-0036); legitimate daughter of Domingos Gonçalves (already
    deceased in 1716) and Maria Fernandes (named in PAR-0036; recorded as a lead,
    not modelled). Mother of João Rodrigues Valle (P-0078), baptized at Ruivais in
    1728 (PAR-0035).
- text: >-
    Nationality Portuguese: a resident and married communicant of São Martinho de
    Ruivais, Braga (PAR-0036). No birth, baptism or death record located.
