- text: >-
    Cordeira/Leme paulista lead — recorded, NOT promoted (2026-08-13). The retrieval
    synthesis proposes that this Maria Francisca Cordeira is the "Maria, daughter of
    Francisco Leme do Prado × Francisca Cordeira/Cordeiro de Godoy" baptised at Itu (São
    Paulo) in 1737, and above that couple traces a deep compiled paulista-founder ascent
    (Genealogia Paulistana / Silva Leme). Drop images: ft_sp-batismo-maria-francisca-cordeira-3SGV-L,
    ft_sp-batismo-francisco-leme-do-prado-F638-R4, ft_sp-casamento-francisco-leme-x-francisca-godoy-3SZB-R.
    Held as a lead only, for two reasons: (1) no primary record bridges the 1737 Itu Maria
    to our Ignez (P-0060) — the retrieval agent itself rates the join STRONG, not PROVEN;
    and (2) the "Itu" premise conflicts with PAR-0025, the sole held source naming this
    woman, which reads her origin "natural da Villa de Ouru [Ouro?], Bispado de São Paulo"
    — i.e. Ouro (Preto?), not Itu. Her origin needs the underlying São Paulo register, not
