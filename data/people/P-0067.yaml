notes:
- text: >-
    Maternal grandmother of Ignez Francisca de Lima (P-0060); named in the 1777
    Piracatu baptism of her granddaughter Maria (PAR-0025) as "Maria Francisca
    Cordeira, natural da Villa de Ouru [Ouro?], Bispado de S. Paulo" — possibly
    Villa Rica de Ouro Preto or another settlement in the Bispado de São Paulo;
    reading uncertain. Wife of João Rodrigues de Mello (P-0066). Her own birth,
    marriage and death records have not been located.
