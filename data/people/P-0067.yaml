notes:
- text: >-
    Maternal grandmother of Ignez Francisca de Lima (P-0060); named in the 1777
    Piracatu baptism of her granddaughter Maria (PAR-0025) as "Maria Francisca
    Cordeira, natural da Villa de Ouru [Ouro?], Bispado de S. Paulo" — possibly
    Villa Rica de Ouro Preto or another settlement in the Bispado de São Paulo;
    reading uncertain. Wife of João Rodrigues de Mello (P-0066). Her own birth,
    marriage and death records have not been located.
  text_pt: >-
    Avó materna de Ignez Francisca de Lima (P-0060); nomeada no batismo de 1777
    de sua neta Maria em Piracatu (PAR-0025) como "Maria Francisca Cordeira,
    natural da Villa de Ouru [Ouro?], Bispado de S. Paulo" — possivelmente Villa
    Rica de Ouro Preto ou outro povoado no Bispado de São Paulo; leitura incerta.
    Esposa de João Rodrigues de Mello (P-0066). Seus próprios registros de
    nascimento, casamento e óbito não foram localizados.
