profile: >-
  ## Interesting facts

  - **[PROVEN]** Her origin in Itu was fixed only by a re-read of PAR-0025 that resolved a previously ambiguous place-name as "Ytù" — a case where going back to the image materially changed what is known about a person, and a reminder why every uncertain reading has to be verified against the scan.

  - **[CONTEXTUAL]** The Villa de Itu (Bispado de São Paulo) was in the 18th century a sugar-producing town and a key waypoint on the São Paulo–Minas/Goiás route — which is how an Itu family came to be connected to the Paracatú/Goiás frontier where she and her husband settled.

  - **[INFERRED]** A published paulista genealogy proposes she was born at the Matriz de Nossa Senhora da Candelária de Itu in 1737, daughter of Francisco Leme do Prado × Francisca Cordeira de Godoy. Her confirmed Itu origin is consistent with this, but no held record bridges that 1737 baptism to our Ignez, so it stays a sourced lead.

  - **[PROVEN]** Her own surname did not survive her. In her son José's 1799 Paracatú marriage act she is written "Maria Francisca **Cardosa**" — and in her children's generation the family's handle is neither "Cordeira" nor "Cardosa" but "de Lima". A woman's surname in these registers was the least stable element on the page.

  - **[CONTEXTUAL]** A Viana (Portugal) husband marrying an Itu (São Paulo) wife on the interior frontier is the same pattern as the other grandparent pair in this family — Minho-immigrant men routinely married colonial-born paulista women, fusing the two main migration currents in a single household.

  ## Identity

  Recorded once, as a maternal grandparent, in the 23 August 1777 baptism of her granddaughter Maria at Minas do Piracatu (Manga parish) [PROVEN] (PAR-0025). Named **Maria Francisca Cordeira** (also *Cordeiro*). Mother of Ignez Francisca de Lima (P-0060), hence 2nd-great-grandmother of Eliza Balbina de Toledo (P-0017) on that line.

  - **Origin:** *natural da Villa de Itu, Bispado de São Paulo* [PROVEN] (PAR-0025). The origin word was re-read on 2026-09-10 as "Ytù" (Itu, a São Paulo vila), superseding an earlier tentative "Ouru [Ouro?]" — Ouro Preto lies in the Bispado de Mariana, not the "Bispado de S. Paulo" the entry states, whereas Itu is a São Paulo vila, and the couple's marriage act corroborates Itu (per the owner). A Brazilian-born (colonial São Paulo) wife paired with her Portuguese (Viana) husband.

  - **Marriage:** wife of João Rodrigues de Mello (P-0066), named together as the maternal grandparents in PAR-0025 [PROVEN].

  - **Birth, death, parents:** unknown; no record of her own is located [OPEN]. Born, by inference, in the early-to-mid 18th century [INFERRED].

  - **Parentage — a lead, not promoted:** an FS-tree join and the paulista *Genealogia Paulistana* (Silva Leme) milieu propose she is the *Maria* baptised 30 March 1737 at the Matriz de Nossa Senhora da Candelária de Itu, daughter of Francisco Leme do Prado × Francisca Cordeira (Cordeiro de Godoy) — which would carry the line into the paulista Leme/Prado/Godoy founders. Her now-confirmed Itu origin is consistent with this, but no held record bridges the 1737 Itu Maria to our Ignez (P-0060); the retrieval synthesis itself rates the join STRONG, not PROVEN, so her parents stay UNKNOWN in this tree. [LEAD — collaborative tree plus published genealogy; no held bridging source]

  ## Standing and profession

  - **Nothing is recorded of her in her own right** — no occupation, no property, no act in which she is a party. She is a name in a grandchild's baptism and a name in her son's marriage act. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no held record required her to sign or recorded her as unable to.

  - **Her standing is inferable only from where she came from:** if the Leme/Prado/Godoy lead holds, from an established Itu landholding family — inherited standing, married to an immigrant with none. [LEAD]

  ## Family and social network

  - **Husband:** João Rodrigues de Mello (P-0066), of Viana, Braga. **Daughter (our line):** Ignez Francisca de Lima (P-0060), who married Amaro da Silva Xavier (P-0059) — hence a direct maternal-line ancestor of Mathilde Maria de Jesus and the Toledo line [PROVEN via PAR-0025]. No other child is attested at primary level.

  - **Further children [LEAD — blog/compiled]:** the araposadachapada study lists five for this couple — **José Rodrigues de Lima** "o paracatuense", **Inês/Ignez** (our line), **Francisca** (bapt. 13 Dec 1765, Paracatú), **Francisco** (bapt. 23 Oct 1775, Paracatú) and **Matilde** (b. 8 Jun 1780, bapt. same month, Paracatú — a sibling of Ignez, not our Mathilde Maria de Jesus). A probable further child is Capitão Manoel Rodrigues de Lima, Ignez's likely brother. [INFERRED]

  - **Her name in her son's act:** the 1799 Paracatú marriage of José reads "*filho legítimo de João Roiz de Melo e Maria Francisca Cardosa*" — "Cardosa" for "Cordeira" in the same family, one generation on. [LEAD — the act is known through the blog, not held here]

  ## What we can extrapolate

  - **She is the second instance of the same strategy, in the same family, one generation apart** [INFERRED]. Mathilde Maria de Jesus had four grandparents: two Minho-born immigrant men (Guimarães and Viana) and two colonial-born women (the Cidade de São Paulo and Itu). Both immigrant grandfathers married paulista women; both paulista women are proposed, by published genealogies, to come from established landholding paulista houses. That is not a coincidence in two independent couples — it is the standard route by which a Portuguese man without land entered colonial society, and this family took it twice.

  - **What she brought was access, not necessarily property** [INFERRED / CONTEXTUAL]. Nothing documents a dowry, a share or an inheritance for her. What an Itu daughter demonstrably brought her husband was the thing an immigrant could not buy: local kin, standing among neighbours and a place in a network that had been in the captaincy for generations. Her descendants' identifiability by a *kin-cluster surname* rather than by a patriline is consistent with exactly that kind of inheritance.

  - **Itu's position on the map is the economic logic of the marriage** [CONTEXTUAL]. Itu sat on the road from the São Paulo captaincy into the interior: a sugar town that also supplied and staged the movement toward the Goiás and Paracatú goldfields. A family placed there was well positioned to join the rush, which is what this household did. The frontier was not an escape from Itu; it was the business Itu was next to.

  - **Partible inheritance is invisible here, and that is the point** [CONTEXTUAL]. With five or six children on the compiled list, any Itu or Paracatú holding would have been divided several ways in one generation and again in the next. Nothing in the Barbacena and São João del Rei records of her grandchildren traces to Itu property — consistent with a share that was subdivided out of significance long before it reached them.

  - **Her surname is the measure of what a woman transmitted** [INFERRED]. "Cordeira" becomes "Cardosa" in one act and disappears entirely by her children, who are "de Lima". The family kept her husband's Christian-name patronymic, dropped her element and then adopted a third name from the local network. What descended from her was lineage and connection; what did not descend was her name.

  ## Open questions

  - Her own baptism, marriage and parents remain open. Her Itu origin is now attested (PAR-0025, 2026-09-10 re-read); the parentage lead — the 1737 Itu Candelária baptism to Francisco Leme do Prado × Francisca Cordeira — still needs the underlying Itu or Paracatú register, or a Paracatú marriage act, to bridge it to our Ignez. The 1777 grandchild entry cannot do that work. [OPEN]

  - Her death: no record, no place, no date. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of her granddaughter Maria) — the sole record naming her.

  ## Regional and migration context

  She anchors the Brazilian (Itu, colonial São Paulo) end of this maternal couple, her husband the north-west Portuguese (Viana/Braga) end — the colonial-São Paulo plus Minho pattern that recurs across the Silva Xavier / Lima branch as it moved onto the Goiás/Piracatu frontier. [CONTEXTUAL] Itu was a bandeirante-era hub and a waypoint on the route inland; gold was struck at Paracatú in the 1740s, and the couple appear on that frontier in the generation that followed. [CONTEXTUAL]

  ## Where to go today

  - **Her town (and the parish of the 1737 baptism the lead proposes):** Matriz de Nossa Senhora da Candelária, Itu, SP [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-23.264167,-47.299722)

  - **Where she appears in the record (her granddaughter's 1777 baptism):** Igreja Matriz de Santo Antônio, Paracatu, MG — leading candidate for the Paracatú/Manga parish [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Sua origem em Itu só ficou fixada por uma releitura de PAR-0025, que resolveu um topônimo antes ambíguo como "Ytù" — caso em que voltar à imagem mudou materialmente o que se sabe sobre uma pessoa, e lembrete de por que toda leitura incerta precisa ser verificada contra o original.

  - **[CONTEXTUAL]** A Villa de Itu (Bispado de São Paulo) era, no século XVIII, uma vila produtora de açúcar e ponto de passagem chave na rota São Paulo–Minas/Goiás — foi assim que uma família de Itu se ligou à fronteira de Paracatú/Goiás onde ela e o marido se estabeleceram.

  - **[INFERRED]** Uma genealogia paulista publicada propõe que ela tenha nascido na Matriz de Nossa Senhora da Candelária de Itu em 1737, filha de Francisco Leme do Prado × Francisca Cordeira de Godoy. Sua origem itunense confirmada é compatível com isso, mas nenhum registro disponível faz a ponte entre aquele batismo de 1737 e a nossa Ignez, de modo que permanece pista documentada.

  - **[PROVEN]** Seu próprio sobrenome não a sobreviveu. No assento de casamento de seu filho José, em Paracatú, em 1799, ela é escrita "Maria Francisca **Cardosa**" — e, na geração dos filhos, a marca da família não é "Cordeira" nem "Cardosa", mas "de Lima". Nesses registros, o sobrenome de uma mulher era o elemento menos estável da página.

  - **[CONTEXTUAL]** Um marido de Viana (Portugal) casando-se com uma esposa de Itu (São Paulo) na fronteira interior é o mesmo padrão do outro par de avós desta família — homens imigrantes do Minho casavam-se rotineiramente com paulistas nascidas na colônia, fundindo as duas principais correntes migratórias numa só casa.

  ## Identidade

  Registrada uma única vez, como avó materna, no batismo de 23 de agosto de 1777 de sua neta Maria, nas Minas do Piracatu (freguesia da Manga) [PROVEN] (PAR-0025). Nomeada **Maria Francisca Cordeira** (também *Cordeiro*). Mãe de Ignez Francisca de Lima (P-0060) e, portanto, trisavó de Eliza Balbina de Toledo (P-0017) nessa linha.

  - **Origem:** *natural da Villa de Itu, Bispado de São Paulo* [PROVEN] (PAR-0025). O topônimo foi relido em 2026-09-10 como "Ytù" (Itu, vila paulista), superando a leitura tentativa anterior "Ouru [Ouro?]" — Ouro Preto fica no Bispado de Mariana, e não no "Bispado de S. Paulo" que o assento declara, ao passo que Itu é vila paulista, e o assento de casamento do casal corrobora Itu (segundo o proprietário). Esposa nascida no Brasil (São Paulo colonial) emparelhada com marido português (Viana).

  - **Casamento:** esposa de João Rodrigues de Mello (P-0066), nomeados juntos como avós maternos em PAR-0025 [PROVEN].

  - **Nascimento, óbito, pais:** desconhecidos; nenhum registro seu foi localizado [OPEN]. Nascida, por inferência, no início ou em meados do século XVIII [INFERRED].

  - **Filiação — pista, não promovida:** uma ligação na árvore do FamilySearch e o meio da *Genealogia Paulistana* (Silva Leme) propõem que ela seja a *Maria* batizada em 30 de março de 1737 na Matriz de Nossa Senhora da Candelária de Itu, filha de Francisco Leme do Prado × Francisca Cordeira (Cordeiro de Godoy) — o que levaria a linha aos fundadores paulistas Leme/Prado/Godoy. Sua origem itunense, agora confirmada, é compatível com isso, mas nenhum registro disponível faz a ponte entre a Maria de Itu de 1737 e a nossa Ignez (P-0060); a própria síntese de recuperação classifica a junção como FORTE, não PROVADA, de modo que seus pais permanecem DESCONHECIDOS nesta árvore. [LEAD — árvore colaborativa mais genealogia publicada; sem fonte-ponte disponível]

  ## Posição social e profissão

  - **Nada está registrado sobre ela em nome próprio** — nenhuma ocupação, nenhuma propriedade, nenhum ato em que seja parte. É um nome no batismo de uma neta e um nome no casamento de um filho. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro disponível exigiu sua assinatura nem a declarou incapaz de assinar.

  - **Sua posição só é inferível pela procedência:** se a pista Leme/Prado/Godoy se sustentar, de uma família proprietária estabelecida em Itu — posição herdada, casada com um imigrante sem nenhuma. [LEAD]

  ## Família e rede social

  - **Marido:** João Rodrigues de Mello (P-0066), de Viana, Braga. **Filha (nossa linha):** Ignez Francisca de Lima (P-0060), casada com Amaro da Silva Xavier (P-0059) — portanto ancestral direta, em linha materna, de Mathilde Maria de Jesus e da linha Toledo [PROVEN via PAR-0025]. Nenhum outro filho está atestado em nível primário.

  - **Outros filhos [LEAD — blog/compilado]:** o estudo araposadachapada lista cinco para este casal — **José Rodrigues de Lima**, "o paracatuense"; **Inês/Ignez** (nossa linha); **Francisca** (bat. 13 dez. 1765, Paracatú); **Francisco** (bat. 23 out. 1775, Paracatú); e **Matilde** (n. 8 jun. 1780, batizada no mesmo mês, Paracatú — irmã de Ignez, não a nossa Mathilde Maria de Jesus). Um provável outro filho é o Capitão Manoel Rodrigues de Lima, provável irmão de Ignez. [INFERRED]

  - **Seu nome no ato do filho:** o casamento de José em Paracatú, em 1799, diz "*filho legítimo de João Roiz de Melo e Maria Francisca Cardosa*" — "Cardosa" por "Cordeira", na mesma família, uma geração adiante. [LEAD — o ato é conhecido pelo blog, não está disponível aqui]

  ## O que podemos extrapolar

  - **Ela é a segunda ocorrência da mesma estratégia, na mesma família, com uma geração de intervalo** [INFERRED]. Mathilde Maria de Jesus teve quatro avós: dois homens imigrantes nascidos no Minho (Guimarães e Viana) e duas mulheres nascidas na colônia (a Cidade de São Paulo e Itu). Os dois avôs imigrantes casaram-se com paulistas; das duas paulistas, genealogias publicadas propõem que ambas venham de casas proprietárias estabelecidas. Isso não é coincidência em dois casais independentes — é a rota-padrão pela qual um português sem terra entrava na sociedade colonial, e esta família a tomou duas vezes.

  - **O que ela trouxe foi acesso, não necessariamente propriedade** [INFERRED / CONTEXTUAL]. Nada documenta dote, cota ou herança em seu nome. O que uma filha de Itu comprovadamente trazia ao marido era aquilo que um imigrante não podia comprar: parentela local, posição entre vizinhos e um lugar numa rede instalada na capitania havia gerações. A identificabilidade de seus descendentes por um *sobrenome de agrupamento familiar*, e não por linha paterna, é coerente exatamente com esse tipo de herança.

  - **A posição de Itu no mapa é a lógica econômica do casamento** [CONTEXTUAL]. Itu ficava na estrada da capitania de São Paulo para o interior: vila açucareira que também abastecia e organizava o movimento rumo às lavras de Goiás e Paracatú. Uma família ali situada estava bem posicionada para entrar na corrida, que foi o que esta casa fez. A fronteira não era fuga de Itu; era o negócio ao lado de Itu.

  - **A herança partível é invisível aqui, e isso é justamente o ponto** [CONTEXTUAL]. Com cinco ou seis filhos na lista compilada, qualquer posse em Itu ou Paracatú teria sido dividida várias vezes numa geração e de novo na seguinte. Nada nos registros de Barbacena e São João del Rei de seus netos remonta a propriedade itunense — coerente com uma cota subdividida até a irrelevância muito antes de chegar a eles.

  - **Seu sobrenome é a medida do que uma mulher transmitia** [INFERRED]. "Cordeira" vira "Cardosa" em um ato e desaparece de todo na geração dos filhos, que são "de Lima". A família manteve o patronímico do marido, largou o elemento dela e adotou um terceiro nome vindo da rede local. Dela desceram linhagem e vínculo; o que não desceu foi seu nome.

  ## Questões em aberto

  - Seu próprio batismo, casamento e pais permanecem em aberto. Sua origem itunense está agora atestada (PAR-0025, releitura de 2026-09-10); a pista de filiação — o batismo de 1737 na Candelária de Itu, ligado a Francisco Leme do Prado × Francisca Cordeira — ainda precisa do registro subjacente de Itu ou de Paracatú, ou de um assento de casamento em Paracatú, para fazer a ponte com a nossa Ignez. A entrada de 1777 da neta não cumpre esse papel. [OPEN]

  - Seu óbito: sem registro, sem lugar, sem data. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de sua neta Maria no Piracatu, 1777) — o único registro que a nomeia.

  ## Contexto regional e migratório

  Ela ancora a ponta brasileira (Itu, São Paulo colonial) deste casal materno, e o marido a ponta do noroeste português (Viana/Braga) — o padrão São Paulo colonial mais Minho que se repete no ramo Silva Xavier / Lima à medida que ele avança para a fronteira de Goiás/Piracatu. [CONTEXTUAL] Itu era um polo da era bandeirante e ponto de passagem na rota para o interior; o ouro foi descoberto em Paracatú nos anos 1740, e o casal aparece naquela fronteira na geração seguinte. [CONTEXTUAL]

  ## Onde ir hoje

  - **Sua vila (e a paróquia do batismo de 1737 que a pista propõe):** Matriz de Nossa Senhora da Candelária, Itu, SP [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-23.264167,-47.299722)

  - **Onde ela aparece no registro (batismo de sua neta, 1777):** Igreja Matriz de Santo Antônio, Paracatu, MG — candidata principal para a freguesia de Paracatú/Manga [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)
