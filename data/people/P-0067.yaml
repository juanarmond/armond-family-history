profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Itu (Villa de Itu, Bispado de São Paulo) in the 18th century was a key waypoint on the São Paulo–Minas/Goiás frontier route — a sugar-producing town whose residents were well-positioned to join the interior gold rush, explaining how an Itu family connected to the Paracatú/Goiás frontier where she and her husband settled.

  - **[INFERRED]** A published paulista genealogy (Silva Leme) proposes she was born at the Matriz de Nossa Senhora da Candelária de Itu in 1737, daughter of Francisco Leme do Prado × Francisca Cordeira de Godoy; her confirmed Itu origin is consistent with this, but no held record bridges the 1737 Itu baptism to our Ignez, so this remains a sourced lead.

  - **[CONTEXTUAL]** The pattern of a Viana (Portugal) husband marrying an Itu (São Paulo) wife on the interior frontier is characteristic of the 18th-century NW-Portuguese → colonial São Paulo → Minas/Goiás emigration stream: Minho-immigrant men routinely married propertied paulista women on the frontier, fusing the two main colonial migration currents.

  - **[PROVEN]** Her origin in Itu was fixed by the re-read of PAR-0025 that clarified the previously ambiguous place-name as "Ytù" — a case where archival image re-reading materially changed what is known about her origin and demonstrates why all uncertain readings require image verification (PAR-0025).

  - **[INFERRED]** Her "Cordeira" surname carried into the family cluster as part of the "Lima" grouping, not directly as "Cordeira" — a generational surname drift common in 18th-century Brazilian families, where maternal surnames were frequently replaced by a father's or kin-cluster identifier, making her contribution to the family's naming visible only through genealogical comparison.

  ## Identity

  Recorded once, as a maternal grandparent, in the 23 August 1777 baptism of her
  granddaughter Maria at Minas do Piracatu (Manga parish) [PROVEN] (PAR-0025). Named
  **Maria Francisca Cordeira** (also *Cordeiro*).

  - **Origin:** *natural da Villa de Itu, Bispado de São Paulo* [PROVEN] (PAR-0025). The
  origin word was re-read on 2026-09-10 as "Ytù" (Itu, a São Paulo vila), superseding an
  earlier tentative "Ouru [Ouro?]" read — Ouro Preto lies in the Bispado de Mariana, not
  the "Bispado de S. Paulo" the entry states, whereas Itu is a São Paulo vila, and the
  couple's marriage act corroborates Itu (per the owner). A Brazilian-born (colonial São
  Paulo) wife paired with her Portuguese (Viana) husband.

  - **Marriage:** wife of João Rodrigues de Mello (P-0066), named together as the
  maternal grandparents in PAR-0025 [PROVEN].

  - **Birth, death, parents:** unknown; no record of her own located [OPEN]. Born, by
  inference, in the early-to-mid 18th century [INFERRED].

  - **Parentage — a lead, not promoted:** an FS-tree join and the paulista *Genealogia
  Paulistana* (Silva Leme) milieu propose she is the *Maria* baptised 30 March 1737 at the
  Matriz de Nossa Senhora da Candelária de Itu, daughter of Francisco Leme do Prado ×
  Francisca Cordeira (Cordeiro de Godoy) — which would carry the line into the paulista
  Leme/Prado/Godoy founders. Her now-confirmed Itu origin (above) is consistent with this,
  but no held record bridges the 1737 Itu Maria to our Ignez (P-0060); the retrieval
  synthesis itself rates the join STRONG, not PROVEN, so her parents stay UNKNOWN in this
  tree. [LEAD — collaborative tree + published genealogy; no held bridging source]

  ## Family and social network

  Mother of Ignez Francisca de Lima (P-0060), who married Amaro da Silva Xavier (P-0059)
  — hence a direct maternal-line ancestor of Matilde Maria de Jesus and the Toledo line
  [PROVEN via PAR-0025]. No other child is attested at primary level. The araposadachapada
  blog lists five children of this couple: **José Rodrigues de Lima** "o paracatuense",
  **Inês/Ignez** (our line), **Francisca** (bapt. 13 Dec 1765, Paracatú), **Francisco**
  (bapt. 23 Oct 1775, Paracatú), and **Matilde** (b. 8 Jun 1780, bapt. same month, Paracatú —
  a sibling of Ignez, not our Matilde Maria de Jesus). [LEAD — blog/compiled] A probable further
  child is Capitão Manoel Rodrigues de Lima (Ignez's likely brother) [INFERRED].

  ## Open questions

  - Her own baptism/marriage/parents remain open. Her Itu origin is now attested
  (PAR-0025, 2026-09-10 re-read); the parentage lead (the 1737 Itu Candelária baptism →
  Francisco Leme do Prado × Francisca Cordeira) still needs the underlying Itu/Paracatú
  register or a Paracatú marriage act to bridge it to our Ignez — the 1777 grandchild
  entry cannot. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of granddaughter Maria) — the sole record naming
  her.

  ## Regional and migration context

  She anchors the Brazilian (Itu, colonial São Paulo) end of this maternal couple, her
  husband the north-west Portuguese (Viana/Braga) end — the colonial-São Paulo + Minho
  pattern that recurs across the Silva Xavier / Lima branch as it moved onto the
  Goiás/Piracatu frontier. [CONTEXTUAL]
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** Itu (Villa de Itu, Bispado de São Paulo) no século XVIII era um ponto de passagem essencial na rota de fronteira São Paulo–Minas/Goiás — uma cidade produtora de açúcar cujos habitantes estavam bem posicionados para participar na corrida ao ouro interior, explicando como uma família de Itu se ligou à fronteira do Paracatú/Goiás onde ela e o marido se fixaram.

  - **[INFERRED]** Uma genealogia paulista publicada (Silva Leme) propõe que nasceu na Matriz de Nossa Senhora da Candelária de Itu em 1737, filha de Francisco Leme do Prado × Francisca Cordeira de Godoy; a sua origem confirmada em Itu é consistente com isto, mas nenhum registo comprovado liga o baptizado de Itu de 1737 à nossa Ignez, pelo que permanece uma pista fundamentada.

  - **[CONTEXTUAL]** O padrão de um marido de Viana (Portugal) casando com uma esposa de Itu (São Paulo) na fronteira interior é característico da corrente de emigração do século XVIII NW-Portugal → São Paulo colonial → Minas/Goiás: os homens imigrantes do Minho casavam rotineiramente com mulheres paulistas proprietárias na fronteira, fundindo as duas principais correntes de migração colonial.

  - **[PROVEN]** A sua origem em Itu foi fixada pela releitura do PAR-0025 que esclareceu o topónimo anteriormente ambíguo como "Ytù" — um caso em que a releitura de imagem de arquivo alterou materialmente o que se sabe sobre a sua origem e demonstra por que razão todas as leituras incertas exigem verificação de imagem (PAR-0025).

  - **[INFERRED]** O seu apelido "Cordeira" passou para o agregado familiar como parte do grupo "Lima", e não directamente como "Cordeira" — uma deriva geracional de apelidos comum nas famílias brasileiras do século XVIII, em que os apelidos maternos eram frequentemente substituídos por um identificador paterno ou de grupo de parentesco, tornando a sua contribuição para a nomenclatura familiar visível apenas através de comparação genealógica.

  ## Identidade

  Registrada uma única vez, como avó materna, no batismo de 23 de agosto de 1777 de sua
  neta Maria em Minas do Piracatu (freguesia da Manga) [PROVEN] (PAR-0025). Nomeada
  **Maria Francisca Cordeira** (também *Cordeiro*).

  - **Origem:** *natural da Villa de Itu, Bispado de São Paulo* [PROVEN] (PAR-0025). A
  palavra da origem foi relida em 2026-09-10 como "Ytù" (Itu, vila paulista), superando
  uma leitura anterior e tentativa "Ouru [Ouro?]" — Ouro Preto fica no Bispado de Mariana,
  e não no "Bispado de S. Paulo" que o assento declara, ao passo que Itu é vila paulista,
  e o assento de casamento do casal corrobora Itu (segundo o proprietário). Esposa nascida
  no Brasil (São Paulo colonial), ao lado de seu marido português (de Viana).

  - **Casamento:** esposa de João Rodrigues de Mello (P-0066), nomeados juntos como os
  avós maternos em PAR-0025 [PROVEN].

  - **Nascimento, óbito, pais:** desconhecidos; nenhum registro próprio localizado
  [OPEN]. Nascida, por inferência, no início ou meados do século XVIII [INFERRED].

  - **Filiação — uma pista, não promovida:** uma ligação da árvore do FamilySearch e o
  meio da *Genealogia Paulistana* (Silva Leme) propõem que ela seja a *Maria* batizada em
  30 de março de 1737 na Matriz de Nossa Senhora da Candelária de Itu, filha de Francisco
  Leme do Prado × Francisca Cordeira (Cordeiro de Godoy) — o que levaria a linha aos
  fundadores paulistas Leme/Prado/Godoy. Sua origem em Itu, agora confirmada (acima), é
  consistente com isso, mas nenhum registro disponível liga a Maria de Itu de 1737 à nossa
  Ignez (P-0060); a síntese de recuperação classifica a ligação como STRONG, não PROVEN, de
  modo que seus pais permanecem DESCONHECIDOS nesta árvore. [LEAD — árvore colaborativa +
  genealogia publicada; sem fonte de ponte disponível]

  ## Família e rede social

  Mãe de Ignez Francisca de Lima (P-0060), que se casou com Amaro da Silva Xavier
  (P-0059) — portanto, ancestral direta, pela linha materna, de Matilde Maria de Jesus e
  da linha Toledo [PROVEN via PAR-0025]. Nenhum outro filho está atestado em nível
  primário. O blog araposadachapada lista cinco filhos desse casal: **José Rodrigues de
  Lima** "o paracatuense", **Inês/Ignez** (nossa linha), **Francisca** (bat. 13 dez 1765,
  Paracatú), **Francisco** (bat. 23 out 1775, Paracatú) e **Matilde** (n. 8 jun 1780, bat.
  mesmo mês, Paracatú — irmã de Ignez, não nossa Matilde Maria de Jesus). [LEAD — blog/compilado]
  Um provável outro filho é o Capitão Manoel Rodrigues de Lima (provável irmão de Ignez)
  [INFERRED].

  ## Questões em aberto

  - Seu próprio batismo/casamento/pais permanecem em aberto. Sua origem em Itu está agora
  atestada (PAR-0025, releitura de 2026-09-10); a pista de filiação (o batismo de 1737 na
  Candelária de Itu → Francisco Leme do Prado × Francisca Cordeira) ainda exige o registro
  subjacente de Itu/Paracatú ou um assento de casamento em Paracatú para ligá-la à nossa
  Ignez — o assento da neta de 1777 não basta. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu de sua neta Maria) — o único registro que a
  nomeia.

  ## Contexto regional e migratório

  Ela ancora a ponta brasileira (Itu, São Paulo colonial) deste casal materno, e seu
  marido a ponta portuguesa do noroeste (Viana/Braga) — o padrão São Paulo colonial +
  Minho que se repete ao longo do ramo Silva Xavier / Lima à medida que avançou para a
  fronteira de Goiás/Piracatu. [CONTEXTUAL]
