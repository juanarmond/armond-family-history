profile: >-
  ## Identity

  Recorded once, as a maternal grandparent, in the 23 August 1777 baptism of her
  granddaughter Maria at Minas do Piracatu (Manga parish) [PROVEN] (PAR-0025). Named
  **Maria Francisca Cordeira** (also *Cordeiro*).

  - **Origin:** *natural da Villa de Ouru [Ouro?], Bispado de São Paulo* — reading
  uncertain; possibly Vila Rica de Ouro Preto or another settlement within the Bispado
  de São Paulo [uncertain for the exact vila; PROVEN that she was of the Bispado de São
  Paulo] (PAR-0025). A Brazilian-born wife paired with her Portuguese (Viana) husband.

  - **Marriage:** wife of João Rodrigues de Mello (P-0066), named together as the
  maternal grandparents in PAR-0025 [PROVEN].

  - **Birth, death, parents:** unknown; no record of her own located [OPEN]. Born, by
  inference, in the early-to-mid 18th century [INFERRED].

  ## Family and social network

  Mother of Ignez Francisca de Lima (P-0060), who married Amaro da Silva Xavier (P-0059)
  — hence a direct maternal-line ancestor of Matilde Maria de Jesus and the Toledo line
  [PROVEN via PAR-0025]. No other children are attested here.

  ## Open questions

  - Her origin vila (Ouro Preto? another São Paulo settlement?) and her own
  baptism/marriage/parents remain open. The retrieval synthesis read the place as
  "Itu", which our source image does not support — it reads "Ouru [Ouro?]" — so
  resolving it needs the underlying register, not the 1777 grandchild entry. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of granddaughter Maria) — the sole record naming
  her.

  ## Regional and migration context

  She anchors the Brazilian (Bispado de São Paulo) end of this maternal couple, her
  husband the north-west Portuguese (Viana/Braga) end — the colonial-São Paulo + Minho
  pattern that recurs across the Silva Xavier / Lima branch as it moved onto the
  Goiás/Piracatu frontier. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  Registrada uma única vez, como avó materna, no batismo de 23 de agosto de 1777 de sua
  neta Maria em Minas do Piracatu (freguesia da Manga) [PROVEN] (PAR-0025). Nomeada
  **Maria Francisca Cordeira** (também *Cordeiro*).

  - **Origem:** *natural da Villa de Ouru [Ouro?], Bispado de São Paulo* — leitura
  incerta; possivelmente Villa Rica de Ouro Preto ou outro povoado no Bispado de São
  Paulo [incerto quanto à vila exata; PROVEN que era do Bispado de São Paulo]
  (PAR-0025). Esposa nascida no Brasil, ao lado de seu marido português (de Viana).

  - **Casamento:** esposa de João Rodrigues de Mello (P-0066), nomeados juntos como os
  avós maternos em PAR-0025 [PROVEN].

  - **Nascimento, óbito, pais:** desconhecidos; nenhum registro próprio localizado
  [OPEN]. Nascida, por inferência, no início ou meados do século XVIII [INFERRED].

  ## Família e rede social

  Mãe de Ignez Francisca de Lima (P-0060), que se casou com Amaro da Silva Xavier
  (P-0059) — portanto, ancestral direta, pela linha materna, de Matilde Maria de Jesus e
  da linha Toledo [PROVEN via PAR-0025]. Nenhum outro filho está atestado aqui.

  ## Questões em aberto

  - Sua vila de origem (Ouro Preto? outro povoado de São Paulo?) e seu próprio
  batismo/casamento/pais permanecem em aberto. A síntese de recuperação leu o local como
  "Itu", leitura que a imagem de nossa fonte não sustenta — ela diz "Ouru [Ouro?]" — de
  modo que resolver a questão exige o registro subjacente, não o assento da neta de
  1777. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu de sua neta Maria) — o único registro que a
  nomeia.

  ## Contexto regional e migratório

  Ela ancora a ponta brasileira (Bispado de São Paulo) deste casal materno, e seu marido
  a ponta portuguesa do noroeste (Viana/Braga) — o padrão São Paulo colonial + Minho que
  se repete ao longo do ramo Silva Xavier / Lima à medida que avançou para a fronteira de
  Goiás/Piracatu. [CONTEXTUAL]
