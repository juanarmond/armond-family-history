  ## O que podemos extrapolar

  Ele é a geração em que a linha Toledo atinge seu ápice documentado — e a geração cuja
  morte inicia a descida. Tudo em sua vida se passa dentro do mundo fundiário da
  Concórdia: herdeiro numerado dos espólios dos dois pais, declarante da Lei de Terras por
  toda a família, morto aos cinquenta e poucos anos deixando nove filhos, a maioria
  menores sob curador nomeado pelo juízo. [INFERRED]

  - **Como sua posição foi adquirida — herdada, não conquistada nem obtida por casamento**
  [INFERRED]. É o primeiro homem em quatro gerações Toledo documentadas **sem cargo
  algum**: a geração de seu bisavô é indocumentada, seu avô foi *Capitão* de ordenanças,
  seu pai serviu aos juízos do Rio Pomba como *louvado*; ele detém apenas propriedade.
  Isso não é uma queda — é o aspecto que a posição herdada assume quando a base fundiária
  é segura o bastante para dispensar o cargo como sinal. A exposição é que uma posição
  puramente patrimonial não tem segunda perna: quando a propriedade se vai, nada resta.

  - **Mecânica da riqueza — a "terra" era sobretudo gente, e a gente foi legislada a
  zero** [PROVEN os valores / CONTEXTUAL a consequência]. Somando a avaliação disponível,
  o espólio chega a cerca de **19 contos e meio**, dos quais as dez pessoas escravizadas
  somam **11:300$000 — cerca de três quintos**. O solo nu foi avaliado em **75$000**; o
  que carregava valor acima dele era o cafezal em pé (5:760$000), as benfeitorias
  (1:355$000) e, esmagadoramente, os seres humanos. Isso reenquadra todo o retrato do
  "Toledo fundiário": o capital hereditário da família não era sobretudo imobiliário, mas
  uma classe de ativos que o Estado brasileiro extinguiu sem indenização entre a Lei do
  Ventre Livre de 1871 e a Lei Áurea de 1888 — vinte e dois anos após sua morte. Mesmo sem
  uma única divisão, a maior parte de seu espólio tinha prazo de validade legal.

  - **O contraste entre capital hereditário e contingente com os Armond é real, mas mais
  estreito do que parece** [INFERRED]. Seu capital era hereditário, ao contrário das
  nomeações policiais e dos emolumentos judiciais de Simplício Armond — mas três quintos
  dele foram abolidos, um terço estava hipotecado e o restante foi dividido em nove. A
  terra transmite; a propriedade escravista não sobrevive à emancipação; e nenhuma das
  duas sobrevive à partilha. Os dois lados do casamento de Eliza terminaram no mesmo
  lugar, por mecanismos diferentes.

  - **O crédito venceu a terra dentro da própria família** [PROVEN os fatos / INFERRED a
  leitura]. No registro fundiário de 1856, seu parente Francisco Leocádio declarou apenas
  uma pequena copossessão dentro da Concórdia (entrada Nº 144; a cifra de alqueires é
  leitura incerta), enquanto José Cezário declarou os 200 alqueires inteiros pela casa.
  Ainda assim, em 1867 é a casa comercial de Francisco Leocádio que detém a hipoteca sobre
  o espólio de José Cezário. A um por cento ao mês desde setembro de 1859, só o prêmio
  havia acumulado, na abertura de março de 1867, algo próximo do próprio principal — de
  modo que a dívida plausivelmente beirava sete contos, mais de um terço de todo o espólio
  avaliado. (Se os 3:885$000 já incluírem o prêmio acumulado, o adiantamento original foi
  cerca de metade disso; qualquer das leituras faz dela um dos maiores itens isolados do
  espólio.) O ramo do clã que detinha **crédito e comércio** vinha silenciosamente
  transformando em devedor o ramo que detinha **terra**. [INFERRED aritmética sobre
  PRB-0008 fl.8r; o divisor e o tratamento dos juros não constam dos fólios disponíveis]

  - **O que cada filho podia de fato esperar** [INFERRED — estimativa, explicitamente
  delimitada]. Nenhuma soma de monte-mór ou partilha sobrevive nos fólios disponíveis, de
  modo que o valor por herdeiro não está documentado. Mas a aritmética é instrutiva: ~19
  contos e meio avaliados, menos a dívida declarada de ~3,9 contos (mais, com prêmio),
  restam cerca de 15 contos e meio; divididos ao meio entre a meação da viúva e os
  herdeiros, e depois a metade da própria Claudina repartida entre os mesmos filhos à sua
  morte, o resultado prático fica na ordem de **1,5 a 1,75 conto por filho** — o preço de
  cerca de uma pessoa adulta escravizada, ou aproximadamente quatro anos do salário de um
  trabalhador rural livre. Isso é notavelmente próximo da única quota que o repositório de
  fato possui: os ≈1:539$781 de Eliza no espólio de Mathilde em 1879 [documentado na
  família]. Uma fazenda confortável, dividida em nove, rende a cada herdeiro uma soma
  equivalente a alguns anos de salário — não uma renda, um evento isolado.

  - **O espólio consumiu-se em juízo** [PROVEN as datas / INFERRED o custo]. A herança
  partível não apenas divide; litiga. O inventário de 1867 de seu pai ainda era disputado
  em 1880 e 1881 (os embargos promovidos por Umbelina Ignez de Toledo contra Marianna
  Claudina), uma sentença de 1882 anulou a partilha de 1876 e mandou refazê-la, e uma
  audiência de partilha para *seus próprios* sub-herdeiros ainda se realizava em 1889 —
  vinte e dois anos depois de aberto o espólio e vinte e três depois de sua morte. Duas
  décadas de escrivães, curadores, avaliadores, selos e advogados saem do mesmo monte que
  os herdeiros dividem. A terra não foi apenas repartida; foi desgastada pelo próprio
  processo de reparti-la.

  - **A educação era uma compra que seus filhos em geral não puderam repetir** [INFERRED /
  CONTEXTUAL]. Ele registrou 200 alqueires sob a Lei de Terras em nome da casa, o que
  implica letramento funcional [INFERRED — função], e sua viúva assinou o próprio nome
  (PRB-0008 fl.8r) [PROVEN]. Mas a escolarização no Brasil imperial era um privilégio
  comprado e ligado à classe, recomprado a cada geração e não transmissível por si. Seu
  filho **Geraldo Augusto** vivia no Rio aos quinze anos, "empregado em uma casa de
  negócio" — colocado no comércio, não na escola. Um menino de família proprietária posto
  atrás de um balcão aos quinze é o primeiro momento visível em que os filhos Toledo
  deixam de ser educados como proprietários e passam a ser treinados como empregados.

  - **Migração: o terceiro passo muda de classe** [INFERRED]. Dois deslocamentos
  anteriores nesta linha foram ascendentes — de Villa Rica para os planaltos agrícolas de
  Barbacena, de Barbacena para a fronteira cafeeira da Zona da Mata — cada um convertendo
  uma base em declínio em outra melhor. O deslocamento que começa em sua própria casa é
  diferente: Geraldo Augusto foi para a Corte como empregado assalariado do comércio. É a
  primeira saída da linha Toledo para a economia urbana do salário, uma geração inteira
  antes de Aristão, do lado Armond, mudar-se para o Rio — e é um movimento *para baixo* em
  espécie, mesmo onde possa ter sido para cima em renda.

  - **O ponto de virada é datável** [INFERRED]. 1866: sua morte, com nove herdeiros e um
  espólio hipotecado. 1879–80: a Concórdia vendida para fora da família durante o
  inventário de sua mãe. 1888: a abolição apaga o que fora três quintos de sua riqueza
  avaliada. Três golpes em vinte e dois anos, dos quais apenas o primeiro é um evento
  familiar — os outros dois são estruturais. Eliza casou-se com Simplício Armond em algum
  ponto dessa janela, levando uma quota em dinheiro e nenhuma terra para um casamento com
  um homem cuja própria posição eram cargos não remunerados. O declínio Armond documentado
  em seus descendentes não começa com os Armond; começa aqui, com um espólio que não
  conseguiu sobreviver ao seu dono.

