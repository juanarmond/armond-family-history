  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se na zona da mata do Rio Pardo / Leopoldina, na
  Fazenda da Concórdia, para onde a linha Toledo de seus pais, de Barbacena e São João del
  Rei, havia migrado, na fronteira cafeeira do século XIX que abriu a floresta a leste,
  próxima do mercado do Rio. Essa floresta fora proibida pela Coroa durante o século XVIII
  (os "Sertões do Leste", uma barreira fiscal contra o contrabando de ouro); a Carta Régia
  de 13 de maio de 1808 declarou "guerra justa" ofensiva aos Botocudos e abriu os vales do
  Pomba, Muriaé e Carangola onde ficava a Concórdia. A economia cafeeira que se seguiu
  funcionava com mão de obra escravizada até a abolição (1888) — Leopoldina tinha a segunda
  maior população escravizada de Minas Gerais em 1883, uma medida de quão profunda essa
  economia era em seu próprio distrito. Seu filho Geraldo Augusto já estava "na Corte" (Rio
  de Janeiro) em 1879 — o primeiro deslocamento da família rumo à capital. [CONTEXTUAL]

