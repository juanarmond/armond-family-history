  ## Contexto regional e migratório

  Toda a sua vida documentada transcorre na zona da mata do Rio Pardo / Leopoldina, na
  Fazenda da Concórdia, onde a linha Toledo de seus pais, vinda de Barbacena e São João
  del Rei, se estabelecera na fronteira cafeeira do século XIX que abriu a mata oriental
  próxima ao mercado do Rio. Essa mata estivera vedada pela Coroa ao longo do século XVIII
  (os "Sertões do Leste", barreira fiscal contra o descaminho do ouro); a Carta Régia de
  13 de maio de 1808 declarou "guerra justa" ofensiva aos Botocudos e abriu os vales do
  Pomba, Muriaé e Carangola, onde ficava a Concórdia. A economia cafeeira que se seguiu
  funcionou com trabalho escravizado até a abolição (1888) — Leopoldina tinha, em 1883, a
  segunda maior população escravizada de Minas Gerais, medida da profundidade dessa
  economia em seu próprio distrito. Vale notar uma tensão no título da família: ele
  declarou posse da Concórdia sob a Lei de Terras de 1850 em abril de 1856, mas em agosto
  de 1862 sua mãe viúva comprou a Fazenda da Concórdia de Felippe Barbosa Castro, do
  Espírito Santo, por seis contos (PRB-0007). Sob a Lei de Terras, uma posse declarada
  ainda precisava ser legitimada, e comprar de um terceiro titulado era caminho corrente
  para aperfeiçoá-la — mas os registros disponíveis não o dizem, e a relação entre a
  declaração de 1856 e a compra de 1862 permanece sem solução. [CONTEXTUAL; a relação
  1856/1862 OPEN]

