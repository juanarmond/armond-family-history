notes:
- text: >-
    Father of Simplício José Ferreira Armond (P-0016); hence Aristão Ferreira
    Armond's (P-0008) maternal grandfather and Geraldo Paz Armond's maternal
    great-grandfather. CORRECTION (7 August 2026): Simplício (not Eliza) is JC's
    child — confirmed by PRB-0008 (JC's own 1867 inventário, item 6: Simplício)
    and PRB-0009 (Ladisláo's concurrent 1867 inventário, item 6 among JC's
    representantes: Simplício). PRB-0006 (1879 Matilde inventário) had been
    misread; it names Simplício as heir #5 and Eliza as his wife, not as JC's
    daughter. Son of Mathilde Maria de Jesus (P-0027) and Ladisláo Egydio Ferreira de
    Toledo (P-0056), family F-0027. Deceased before 4 March 1867 (PRB-0008 cover
    lists both JC and Claudina as deceased at inventory opening).
  text_pt: >-
    Pai de Simplício José Ferreira Armond (P-0016); portanto, o avô materno de
    Aristão Ferreira Armond (P-0008) e o bisavô materno de Geraldo Paz Armond.
    CORREÇÃO (7 de agosto de 2026): Simplício (e não Eliza) é o filho de JC —
    confirmado por PRB-0008 (o próprio inventário de 1867 de JC, item 6:
    Simplício) e PRB-0009 (o inventário concomitante de 1867 de Ladisláo, item 6
    entre os representantes de JC: Simplício). PRB-0006 (inventário de Matilde de
    1879) havia sido mal interpretado; ele nomeia Simplício como herdeiro nº 5 e
    Eliza como sua esposa, não como filha de JC. Filho de Mathilde Maria de Jesus
    (P-0027) e Ladisláo Egydio Ferreira de Toledo (P-0056), família F-0027.
    Falecido antes de 4 de março de 1867 (a capa de PRB-0008 lista tanto JC quanto
    Claudina como falecidos na abertura do inventário).
- text: >-
    Do NOT conflate with the inventariante of the same estate, Cezário José de Toledo
    (Mathilde's other son, ⚭ Maria José de Jesus): the near-identical names are
    distinct people (PRB-0006). Nationality Brazilian, consistent with this
    multi-generation Minas Gerais (Leopoldina / Fazenda da Concórdia) Toledo family;
    no explicit birthplace is stated in the located records.
  text_pt: >-
    NÃO confundir com o inventariante do mesmo espólio, Cezário José de Toledo (o
    outro filho de Mathilde, ⚭ Maria José de Jesus): os nomes quase idênticos são
    pessoas distintas (PRB-0006). Nacionalidade brasileira, consistente com esta
    família Toledo de várias gerações em Minas Gerais (Leopoldina / Fazenda da
    Concórdia); nenhum local de nascimento explícito é declarado nos registros
    localizados.
- text: >-
    Landholder at the Fazenda da Concórdia: in the 1856 Lei de Terras registry
    (GOV-0003, entry Nº 145, event E-0073) he declared the 200-alqueire Concórdia
    "por minha Mãe, irmãos e cunhados" — confirming he was alive in April 1856 (he
    died before 4 March 1867) and that his mother (Mathilde Maria de Jesus, P-0027)
    was then living.
  text_pt: >-
    Proprietário de terras na Fazenda da Concórdia: no registro da Lei de Terras
    de 1856 (GOV-0003, entrada Nº 145, evento E-0073) ele declarou os 200
    alqueires da Concórdia "por minha Mãe, irmãos e cunhados" — confirmando que
    estava vivo em abril de 1856 (morreu antes de 4 de março de 1867) e que sua
    mãe (Mathilde Maria de Jesus, P-0027) estava então viva.
