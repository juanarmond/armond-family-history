  ## Regional and migration context

  His whole documented life is in the Rio Pardo / Leopoldina zona da mata, at the Fazenda
  da Concórdia, where his parents' Barbacena and São João del Rei Toledo line had settled
  on the 19th-century coffee frontier that opened the eastern forest near the Rio market.
  That forest had been Crown-forbidden through the 18th century (the "Sertões do Leste", a
  fiscal barrier against gold smuggling); the Carta Régia de 13 de maio de 1808 declared
  offensive "just war" on the Botocudos and opened the Pomba, Muriaé and Carangola valleys
  where the Concórdia lay. The coffee economy that followed ran on enslaved labour until
  abolition (1888) — Leopoldina held the second-largest enslaved population in Minas
  Gerais by 1883, a measure of how deep that economy ran in his own district. A tension
  worth noting in the family's title: he declared possession of the Concórdia under the
  1850 Lei de Terras in April 1856, yet in August 1862 his widowed mother bought the
  Fazenda da Concórdia from Felippe Barbosa Castro of Espírito Santo for six contos
  (PRB-0007). Under the Lei de Terras a declared *posse* still had to be legitimated, and
  purchasing from a titled third party was a standard way to perfect it — but the held
  records do not say so, and the relation between the 1856 declaration and the 1862
  purchase is unresolved. [CONTEXTUAL; the 1856/1862 relation OPEN]

