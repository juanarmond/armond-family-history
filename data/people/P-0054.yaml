  sua avó não: as páginas disponíveis da avaliação de 1833 de Ritta Angélica, em Barbacena
  (PRB-0010), abrem com três tachos de cobre velhos e um caldeirão de ferro. Os
  inventários brasileiros seguiam ordem fixa, metais preciosos primeiro, de modo que a
  diferença na entrada inicial é uma diferença no que a casa de fato possuía.

  - **[PROVEN]** Declarou os 200 alqueires da Fazenda da Concórdia "por minha Mãe, irmãos
  e cunhados" no registro da Lei de Terras de 1856 — atuando como a única voz legal de
  toda a casa Toledo, e não apenas em nome próprio (GOV-0003, Nº 145).

  - **[PROVEN]** Em seu próprio espólio, a terra nua foi avaliada em **75$000**; as dez
  pessoas escravizadas, em **11:300$000**. A fortuna "fundiária" dos Toledo era, em valor,
  esmagadoramente propriedade humana.

  - **[CONTEXTUAL]** A Estrada de Ferro Leopoldina chegou à Zona da Mata em 1875, nove
  anos após sua morte — ele lavrou a fronteira cafeeira inteiramente com tropas de muares
  e transporte fluvial. Seu filho Geraldo Augusto já trabalhava numa casa de negócio no
  Rio de Janeiro ("na Corte", Rua do Visconde de Itaúna 74) em 1879, exatamente quando a
  ferrovia abriu a região ao trânsito rápido.

  - **[INFERRED]** O padrão de nomes de suas filhas — Eliza Balbina, Maria Bulandina,
  Claudina Brandina — espelha o nome da esposa "Claudina Brandina", uma assinatura
  onomástica materna que é o instrumento mais confiável para identificar seus filhos em
  listas de herdeiros mistas, onde os sobrenomes são instáveis.

  - **[PROVEN]** Seu espólio carregava uma hipoteca de 3:885$000 a um por cento ao mês,
  corrente desde 12 de setembro de 1859 [ano incerto], devida a (a casa de) seu próprio
  parente Francisco Leocádio de Toledo — uma linha de crédito intrafamiliar que vinha
  capitalizando havia cerca de sete anos e meio quando ele morreu.

  - **[CONTEXTUAL]** A sucessão partível brasileira exigia divisão igual entre todos os
  filhos; sua morte aos cinquenta e poucos anos, com a maior parte dos nove filhos ainda
