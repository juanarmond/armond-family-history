profile: >-
  ## Interesting facts

  - **[PROVEN]** The 1867 appraisal of his estate opens with "Ouro" and "Prata" — a gold
  watch and chain (250$000) and a dozen silver covers (180$000). His grandmother's
  generation did not: the held pages of the 1833 Barbacena appraisal of Ritta Angélica
  (PRB-0010) open with three worn copper vats and an iron cauldron. Brazilian inventários
  were listed in a fixed order, precious metals first, so the difference in opening entry
  is a difference in what the household actually owned.

  - **[PROVEN]** He declared the 200-alqueire Fazenda da Concórdia "por minha Mãe, irmãos
  e cunhados" in the 1856 Lei de Terras registry — acting as the family's single legal
  voice for the whole Toledo household, not merely his own claim (GOV-0003, Nº 145).

  - **[PROVEN]** In his own estate the bare land was appraised at **75$000**; the ten
  enslaved people at **11:300$000**. The "landed" Toledo fortune was, by value,
  overwhelmingly human property.

  - **[CONTEXTUAL]** The Leopoldina Railway reached the Zona da Mata in 1875, nine years
  after his death — he farmed the coffee frontier entirely on mule-train and river
  transport. His son Geraldo Augusto was already working in a Rio de Janeiro shop ("na
  Corte", Rua do Visconde de Itaúna 74) by 1879, exactly as the railway opened the region
  to faster transit.

  - **[INFERRED]** The naming pattern of his daughters — Eliza Balbina, Maria Bulandina,
  Claudina Brandina — mirrors his wife's name "Claudina Brandina", a maternal naming
  signature that is the most reliable tool for picking his children out of mixed heir
  lists where surnames are unstable.

  - **[PROVEN]** His estate carried a mortgage of 3:885$000 at one per cent a month,
  running since 12 September 1859 [uncertain year], owed to (the house of) his own
  relative Francisco Leocádio de Toledo — a within-family credit line that had been
  compounding for roughly seven and a half years when he died.

  - **[CONTEXTUAL]** Brazilian partible succession required equal division among all
  children; his death in his early fifties, while most of his nine children were still
  minors, put the estate through court-appointed curatela — the mechanism that converted a
  working coffee fazenda into modest one-time cash shares for Eliza's generation.

  ## Identity

  **José Cezário de Toledo Lima** (source spellings *José Cezario de Tolledo Lima*,
  PRB-0006; *José Cesario de Tolledo Lima*, PRB-0008 / PRB-0009; *José Cesario de Toledo
  Lima*, GOV-0003) [PROVEN]. Son of Ladisláo Egídio Ferreira de Toledo (P-0056) and
  Mathilde Maria de Jesus (P-0027), family F-0027 — item 8 among Ladisláo's children in
  the 1867 inventário (PRB-0009). He is the direct-line link: father of Eliza Balbina de
  Toledo (P-0017), hence Aristão Ferreira Armond's (P-0008) maternal grandfather and
  Geraldo Paz Armond's (P-0004) maternal great-grandfather.

  - Do NOT conflate with his brother **Cezário José de Toledo** (Mathilde's other son, ⚭
  Maria José de Jesus), the inventariante of Mathilde's 1879 estate — near-identical
  names, distinct people (PRB-0006).

  - **Birth / baptism:** baptised 10 March 1813 at the Matriz de N.S. do Pilar, São João
  del Rei [PROVEN — PAR-0050, events E-0077 (baptism) / E-0078 (birth)], recorded as the
  legitimate son of Ladislau Egídio Ferreira (P-0056) and Dona Mathildes Maria de Jesus
  (P-0027); born on or shortly before that date (the register states no birth date). The
  godparents were Tenente Coronel Caetano José de Almeida and Dona Anna Francisca de Lima
  (a maternal "de Lima" relative, echoing the "Lima" in his own name), the officiant Pe.
  Manoel Antônio de Castro [PROVEN — PAR-0050; the godparents' names are partly legible
  and marked uncertain in the source]. He is entered under the single given name "José",
  so the identification rests on the exact double-parent match, the parish (where the
  parents married in 1810, PAR-0023) and the date — consistent with his being alive in
  April 1856 (GOV-0003) with adult and teenage children by 1867.

  - **Marriage:** ⚭ Claudina Brandina de Jesus (P-0055), family F-0026; the marriage act
  is not held. Their eldest documented child was about 24 in 1867, so the couple married
  by roughly 1842 [INFERRED].

  - **Death:** before 4 March 1867 [PROVEN] — the joint inventário of him and Claudina
  opens on that date (PRB-0008). Claudina's sworn declaration gives the day as "dois de
  Setembro" with the year cut off at the page break (PRB-0008 p5), most plausibly 1866
  [LEAD for the exact year]. PRB-0009 records that he died after his father Ladisláo (d.
  before 2 August 1862); with GOV-0003 fixing him alive in April 1856, his death falls
  between 1862 and 1867, at roughly 53. ⚠️ The p3 auto states he died "sem testamento"
  (intestate) while a p6 fragment appears to mention a testament of October 1866 — an
  unresolved reading, preserved as a conflict in the source record (PRB-0008).

  ## Standing and profession

  - **Landholder at the Fazenda da Concórdia** [PROVEN] — in the 1856 Lei de Terras
  registry (GOV-0003, entry Nº 145, event E-0073) he declared the 200-alqueire Concórdia
  "por minha Mãe, irmãos e cunhados", i.e. on behalf of his then-living mother, siblings
  and brothers-in-law. No office, rank or title is recorded for him in any held document:
  unlike his grandfather the Capitão, his standing is purely propertied.

  - **A working coffee fazenda, itemised** [PROVEN — PRB-0008, fl.5r–fl.7r]. The avaliação
  folios of his own inventário register about 32,000 coffee trees across three plots
  (1:800$000 + 3:000$000 + 960$000), a coffee-washing installation (*lavador de café*), a
  *paiol*, a roadside store (*casa de negócio na estrada*, 300$000), an engenho and
  dwelling houses (together 1:355$000 in the held folios), canoes, a shod cart (85$000),
  cattle and pack-animals (338$000), and the gold and silver plate. A part of land bought
  from a "[Mestra?] Joana" is appraised at 75$000.

  - **He enslaved ten people, appraised as his property in the avaliação** [PROVEN —
  PRB-0008, fl.6r–fl.6v]. The estate records each by name, origin, age and price:
  **Lucas** (de nação — African-born — 32, 1:700$000), **Pedro** (de nação, 33,
  1:100$000), **Miguel** (crioulo — Brazil-born — 14, 800$000), **Thobias** (crioulo, 12,
  1:400$000), **Benedicto** (crioulo, 9, 800$000), **Faustina** (crioula, 9, 1:100$000),
  **Virgiliana** (crioula, 17, 1:400$000), **Luiza** (de nação, 36 [uncertain], 800$000),
  **Joana** (crioula, 40, 800$000) and **Eugenio** (crioulo, 14, 1:400$000) — three
  African-born, seven Brazil-born, five of them children of fourteen or under. The same
  inventory appraises **"um tronco para prisão, de ferro e algemas"** — an iron
  stocks-and-shackles restraint (4$000) — plainly among the household goods, a documented
  instrument of the coercion this estate rested on. He had earlier given the boy
  **Eugenio** as a wedding dowry (*doação*, 11 June 1866) to his daughter Maria Balandina
  and her husband Manoel Marques Jorge; in the 1867 proceeding Eugenio was brought to
  collation at half value (700$000) and Manoel Marques Jorge petitioned to renounce his
  heir's share (*desistência*), being already satisfied by the dowry. [PROVEN — PRB-0008
  fl.7v, fl.10r]

  - **The estate's debt** [PROVEN — PRB-0008 fl.8r]. The widow Claudina declared, on oath,
  a hypothecary debt of **3:885$000** already due, at **one per cent a month since 12
  September 1859** [uncertain year], owed to (the house of) Francisco Leocádio de Toledo.
  A retrieval reading adds a further ~1:117$ owed to Cypriano Antonio de Araújo on
  créditos signed 20 February 1860, to be settled from the harvested coffee [LEAD — not in
  the catalogued folios].

  - **The Concórdia's fate** — the fazenda was sold ~1879–80 during the settlement of
  Mathilde's estate; the buyer's identity is on folios not yet pulled. After the sale his
  brother **António Ladislão de Toledo** (P-0063) went on living there until his death on
  the property in February 1909 (CIV-0024). [PROVEN sale receipt / LEAD for the buyer]

  ## Family and social network

  - Parents: Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus
  (P-0027). Wife: Claudina Brandina de Jesus (P-0055).

  - **Children:** nine, by Claudina's own sworn declaration of 1867 (PRB-0008 p6). The
  structured direct-line child is **Eliza Balbina de Toledo (P-0017)**, confirmed by
  PRB-0006 (1879 Mathilde inventário, folio 9, where she appears as representante #5 under
  heir #4); two independent primaries — the 1879 Mathilde título (PRB-0006) and the July
  1881 certidão dos herdeiros embedded in the Ladisláo estate (PRB-0009, fl.181r) — name
  "Simplício José Ferreira Armond casado com Dona Elisa Balbina de Toledo" under his
  sub-heir group, defeating a collaborative-tree misattribution of Eliza to Francisco
  Leocádio de Toledo. ⚠️ **CONTESTED (heir-6 identity, 2026-09-13):** the 1867 Auto de
  Partilha (PRB-0008 ords 37–208) names heir 6 as "Simplicio José de Tolledo de sua
  legítima paterna" — the Toledo surname and own-legítima wording could refer to the
  namesake son (b.~1853), not Simplício Ferreira Armond receiving Eliza's share. The
  identification is NOT refuted, but the Auto de Partilha image alone does not prove it;
  do not cite it as an established Armond×Toledo primary until the 188 partilha folhas are
  re-read. His other children are documented on family F-0026: José Augusto, Maria
  Dulcelina, Mathildes Olympia, Josephina Christina, Maria Bulandina/Claudina, a younger
  Ladisláo Egydio, Geraldo Augusto and the infant Josefa — plus a son "Simplício José
  Ferreira de Toledo" (solteiro, 14 in 1867) who died before 1879.

  - **The two-Simplícios trap** [PROVEN]: his own son "Simplício José Ferreira de TOLEDO"
  (item 6 in both 1867 inventários) is a DIFFERENT person from Simplício José Ferreira
  ARMOND (P-0016), who married his daughter Eliza. Simplício Armond is his son-in-law, not
  his son; the identical given name caused a misidentification, corrected 7 August 2026
  (see F-0026 and P-0016).

  - **Sons-in-law, curador and creditor**: two of his daughters' husbands are documented
  in the 1867 estate — Manoel Marques Jorge (⚭ Maria Balandina) and Aureliano Christino da
  Silva Lima (⚭ Josephina Christina) [PROVEN — PRB-0008]. His brother **Aureliano de Sales
  Toledo** was sworn curador of his minor children in both concurrent 1867 inventários,
  and his relative **Francisco Leocádio de Toledo** (P-0061) was his estate's principal
  creditor — the family supplied his children's guardian and his mortgage in the same
  month.

  ## What we can extrapolate

  He is the generation at which the Toledo line reaches its documented peak — and the
  generation whose death starts the descent. Everything in his life sits inside the landed
  Concórdia world: a numbered heir of both his parents' estates, the Lei de Terras
  declarant for the whole family, dead in his early fifties leaving nine children, most of
  them minors under a court-appointed curador. [INFERRED]

  - **How his standing was acquired — inherited, not earned or married-in** [INFERRED]. He
  is the first man in four documented Toledo generations with **no office at all**: his
  great-grandfather's generation is undocumented, his grandfather was a *Capitão* of
  ordenanças, his father served the Rio Pomba courts as *louvado*; he holds nothing but
  property. That is not a fall — it is what inherited standing looks like once the land
  base is secure enough that office is no longer needed to signal it. The exposure is that
  a purely propertied standing has no second leg: when the property goes, nothing remains.

  - **Wealth mechanics — the "land" was mostly people, and the people were legislated to
  zero** [PROVEN figures / CONTEXTUAL consequence]. Add up the held avaliação and the
  estate comes to roughly **19½ contos**, of which the ten enslaved people are
  **11:300$000 — about three-fifths**. The bare soil was appraised at **75$000**; what
  carried value above it was the standing coffee (5:760$000), the buildings (1:355$000)
  and, overwhelmingly, the human beings. This reframes the whole "landed Toledo" picture:
  the family's heritable capital was not primarily real estate but an asset class the
  Brazilian state extinguished without compensation between the 1871 Free Womb law and the
  Lei Áurea of 1888 — twenty-two years after his death. Even without a single division,
  the larger part of his estate had a statutory expiry date.

  - **The heritable-versus-contingent contrast with the Armonds is real but narrower than
  it looks** [INFERRED]. His capital was heritable where Simplício Armond's police
  appointments and court fees were not — but three-fifths of it was abolished, a third of
  it was mortgaged, and the remainder was split nine ways. Land transmits; enslaved
  property does not survive emancipation; and neither survives partition. Both sides of
  Eliza's marriage ended in the same place, by different mechanisms.

  - **Credit beat land inside his own family** [PROVEN facts / INFERRED reading]. In the
  1856 land registry his relative Francisco Leocádio declared only a small co-possession
  within the Concórdia (entry Nº 144; the alqueire figure is an uncertain read) while José
  Cezário declared the whole 200 alqueires for the household. Yet by 1867 it is Francisco
  Leocádio's commercial house that holds the mortgage over José Cezário's estate. At one
  per cent a month from September 1859, the premium alone had accrued to roughly the size
  of the principal by the March 1867 opening — so the debt plausibly stood near seven
  contos, over a third of the whole appraised estate. (If the 3:885$000 already includes
  accrued premium, the original advance was about half that; either reading makes it one
  of the estate's largest single items.) The branch of the clan that held **credit and
  commerce** was quietly converting the branch that held **land** into its debtor.
  [INFERRED arithmetic on PRB-0008 fl.8r; the divisor and the interest treatment are not
  stated in the held folios]

  - **What each child could actually expect** [INFERRED — estimate, clearly bounded]. No
  monte-mór or partilha summation survives in the held folios, so the per-heir figure is
  not documented. But the arithmetic is instructive: ~19½ contos appraised, less the
  ~3.9-conto declared debt (more with premium), leaves roughly 15½ contos; halved between
  the widow's *meação* and the heirs, then Claudina's own half dividing among the same
  children on her death, the practical outcome is on the order of **1½ to 1¾ contos per
  child** — the price of about one adult enslaved person, or roughly four years of a free
  rural labourer's wage. That is strikingly close to the one quota the repository does
  hold: Eliza's ≈1:539$781 from Mathilde's 1879 estate [family-documented]. A comfortable
  fazenda, divided nine ways, yields each heir a sum equivalent to a few years' wages —
  not an income, a windfall.

  - **The estate consumed itself in court** [PROVEN dates / INFERRED cost]. Partible
  inheritance does not only divide; it litigates. His father's 1867 inventário was still
  being fought in 1880 and 1881 (the embargos brought for Umbelina Ignez de Toledo against
  Marianna Claudina), a judgment in 1882 annulled the 1876 partition and ordered it
  redone, and a partilha audiência for *his own* sub-heirs was still being held in 1889 —
  twenty-two years after the estate opened, and twenty-three after his death. Two decades
  of escrivães, curadores, appraisers, stamp duty and lawyers are paid out of the same
  monte the heirs are dividing. The land was not merely split; it was worn down by the
  process of splitting it.

  - **Education was a purchase his children mostly could not repeat** [INFERRED /
  CONTEXTUAL]. He registered 200 alqueires under the Lei de Terras on behalf of the
  household, which implies functional literacy [INFERRED — office], and his widow signed
  her own name (PRB-0008 fl.8r) [PROVEN]. But schooling in imperial Brazil was a
  purchased, class-linked privilege, re-bought in each generation and not transmissible in
  itself. His son **Geraldo Augusto** was living in Rio at fifteen, "empregado em uma casa
  de negócio" — placed in commercial employment, not in school. A boy of a propertied
  family put behind a shop counter at fifteen is the first visible moment at which the
  Toledo children stop being educated as proprietors and start being trained as employees.

  - **Migration: the third step changes class** [INFERRED]. Two earlier moves in this line
  were upward — Villa Rica to the Barbacena farming highlands, Barbacena to the Zona da
  Mata coffee frontier — each converting a declining base into a better one. The move that
  begins in his own household is different: Geraldo Augusto went to the capital as a
  wage-earning shop employee. That is the Toledo line's first exit into the urban wage
  economy, a full generation before the Armond side's Aristão moved to Rio, and it is a
  move *down* in kind even where it may have been up in income.

  - **The turning point is datable** [INFERRED]. 1866: his death, with nine heirs and a
  mortgaged estate. 1879–80: the Concórdia sold out of the family during his mother's
  probate. 1888: abolition erases what had been three-fifths of his appraised wealth.
  Three blows in twenty-two years, of which only the first is a family event — the other
  two are structural. Eliza married Simplício Armond somewhere inside that window,
  bringing a cash quota and no land into a marriage with a man whose own standing was
  unpaid office. The Armond decline documented in her descendants does not begin with the
  Armonds; it begins here, with an estate that could not outlive its owner.

  ## Open questions

  - The exact death year (the "2 September" of Claudina's declaration), and the
  testate/intestate contradiction between PRB-0008 p3 and p6. [OPEN]

  - His marriage to Claudina, and Claudina's own parentage. [OPEN]

  - The monte-mór and partilha summation of his own estate — the folios that would replace
  the per-heir estimate above with a documented figure. [OPEN]

  - The buyer of the Fazenda da Concórdia (1879–80), on folios preceding folio 20 of
  Mathilde's inventário. [OPEN]

