profile: >-
  ## Identity

  **José Cezário de Toledo Lima** (source spellings *José Cezario de Tolledo Lima*,
  PRB-0006; *José Cesario de Tolledo Lima*, PRB-0008 / PRB-0009; *José Cesario de Toledo
  Lima*, GOV-0003) [PROVEN]. Son of Ladisláo Egídio Ferreira de Toledo (P-0056) and
  Mathilde Maria de Jesus (P-0027), family F-0027 — item 8 among Ladisláo's children in
  the 1867 inventário (PRB-0009). He is the direct-line link: father of Eliza Balbina de
  Toledo (P-0017), hence maternal grandfather of Aristão Ferreira Armond (P-0008).

  - Do NOT conflate with his brother **Cezário José de Toledo** (Mathilde's other son, ⚭
  Maria José de Jesus), the inventariante of Mathilde's 1879 estate — near-identical
  names, distinct people (PRB-0006).

  - **Birth:** not fixed by any held record [OPEN]; alive in April 1856 (GOV-0003) with
  adult and teenage children by 1867, implying a birth in the 1810s. A retrieval draft
  reads a 10 March 1813 São João del Rei baptism — [LEAD], not catalogued.

  - **Marriage:** ⚭ Claudina Brandina de Jesus (P-0055), family F-0026; the marriage act
  is not held.

  - **Death:** before 4 March 1867 [PROVEN] — both spouses are named deceased at the
  opening of their joint inventário (PRB-0008 cover). Claudina's sworn declaration gives
  the day as "dois de Setembro" with the year cut off at the page break (PRB-0008 p5),
  most plausibly 1866 [LEAD for the exact year]. PRB-0009 records that he died after his
  father Ladisláo (d. before 2 Aug 1862); with GOV-0003 fixing him alive in April 1856,
  his death falls between 1862 and 1867.

  ## Standing and profession

  - **Landholder at the Fazenda da Concórdia** [PROVEN] — in the 1856 Lei de Terras
  registry (GOV-0003, entry Nº 145, event E-0073) he declared the 200-alqueire Concórdia
  "por minha Mãe, irmãos e cunhados", i.e. on behalf of his then-living mother, siblings
  and brothers-in-law. A propertied head of a landed Toledo household in the Rio Pardo /
  Leopoldina zona da mata.

  - A slaveholding estate household [PROVEN — inventário context], its goods and heirs
  settled across two concurrent 1867 inventários (his own and his father's).

  ## Family and social network

  - Parents: Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus
  (P-0027). Wife: Claudina Brandina de Jesus (P-0055).

  - **Children:** at least nine (Claudina's 1867 declaration, PRB-0008). The structured
  direct-line child is **Eliza Balbina de Toledo (P-0017)**, our ancestor, confirmed by
  PRB-0006 (1879 Matilde inventário, folio 9, where she appears as representante #5 under
  heir #4). His other children are documented on family F-0026: José Augusto, Maria
  Dulcelina, Mathildes Olympia, Josephina Christina, Maria Bulandina/Claudina, a younger
  Ladisláo Egydio, Geraldo Augusto, the infant Josefa — and a son "Simplício José Ferreira
  de Toledo" (solteiro, 14 in 1867), who died before 1879.

  - **The two-Simplícios trap** [PROVEN]: JC's own son "Simplício José Ferreira de TOLEDO"
  (item 6 in both 1867 inventários) is a DIFFERENT person from Simplício José Ferreira
  ARMOND (P-0016), who married JC's daughter Eliza. Simplício Armond is JC's son-in-law,
  not his son; the identical given name caused a misidentification, corrected 7 August
  2026 (see F-0026 and P-0016).

  ## What we can extrapolate

  His life sits entirely within the landed Toledo world of the Fazenda da Concórdia — a
  numbered heir of both his parents' estates, a Lei de Terras declarant acting for the
  whole family, dead in his prime and leaving many minor children under a court-appointed
  curador (his brother Aureliano de Sales Toledo). [INFERRED]

  - **Heritable capital, not office income** [PROVEN act / INFERRED standing]. His standing
  rested on the kind of wealth that transmits: heritable **land** (the 200-alqueire Concórdia
  registered under the 1850 Lei de Terras) worked by **enslaved labour** — arguably the only
  heritable capital any line in this tree held, and the structural opposite of the paternal
  Armond side's non-transmissible office income. He sits squarely in the landed Toledo gentry.

  - **The land→cash pivot** [family-documented from the 1879 inventário; benchmarks
  CONTEXTUAL]. That land-and-enslaved-labour base did not pass down intact: on partition it
  converted to a one-time cash quota, then was split and sold. A reading of Matilde's 1879
  inventário (PRB-0006) puts his daughter **Eliza's** quota at ≈1:539$781 — on regional
  1870s–80s benchmarks roughly the price of one enslaved person (~1 conto), or about 3.7 years
  of a free rural labourer's wage — after which the Concórdia left the family (~1879–80). The
  estate *funded*, rather than arrested, the family's later slide into the urban wage economy.

  - **Early parental death compounds partible fragmentation** [CONTEXTUAL]. With both parents
  gone within roughly a decade and a dozen-plus heirs, the José-Cezário sub-estate passed
  through wardship and was divided among many children rather than held and grown — a classic
  accelerant of the fragmentation that Brazilian partible succession already imposes, and part
  of why Eliza's generation inherited cash shares rather than land.

  - **First urban drift** [INFERRED]. His son Geraldo Augusto was already "na Corte" (Rio de
  Janeiro) by 1879 — the earliest Toledo in the capital, a full generation before the Armond
  side's Aristão moved to Rio. The move off the fragmenting land toward the city begins
  already among his own children.

  ## Open questions

  - His birth/baptism and the exact death year (the "2 September" of Claudina's
  declaration). [OPEN]

  - His marriage to Claudina, and Claudina's own parentage. [OPEN]

  ## Sources held (this repository)

  - GOV-0003 (1856 Lei de Terras, Nº 145 — Concórdia landholder; mother alive in April
  1856) · PRB-0008 (1867 joint inventário of JC and Claudina — cover names both; nine
  children) · PRB-0009 (1867 Ladisláo inventário — JC as deceased item 8; his
  representantes listed) · PRB-0006 (1879 Matilde inventário — heir #4 JC × Claudina;
  Eliza as representante #5) · PRB-0004 (undated Concórdia / São Bento deed — Toledo
  succession context).

  ## Regional and migration context

  His whole documented life is in the Rio Pardo / Leopoldina zona da mata, at the Fazenda
  da Concórdia, where his parents' Barbacena and São João del Rei Toledo line had settled
  on the 19th-century coffee frontier that opened the eastern forest near the Rio market.
  That forest had been Crown-forbidden through the 18th century (the "Sertões do Leste", a
  fiscal barrier against gold smuggling); the Carta Régia de 13 de maio de 1808 declared
  offensive "just war" on the Botocudos and opened the Pomba, Muriaé and Carangola valleys
  where the Concórdia lay. The coffee economy that followed ran on enslaved labour until
  abolition (1888) — Leopoldina held the second-largest enslaved population in Minas Gerais
  by 1883, a measure of how deep that economy ran in his own district. His son Geraldo
  Augusto was already "na Corte" (Rio de Janeiro) by 1879 — the family's first drift toward
  the capital. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **José Cezário de Toledo Lima** (grafias de fonte *José Cezario de Tolledo Lima*,
  PRB-0006; *José Cesario de Tolledo Lima*, PRB-0008 / PRB-0009; *José Cesario de Toledo
  Lima*, GOV-0003) [PROVEN]. Filho de Ladisláo Egídio Ferreira de Toledo (P-0056) e
  Mathilde Maria de Jesus (P-0027), família F-0027 — item 8 entre os filhos de Ladisláo no
  inventário de 1867 (PRB-0009). É o elo da linha direta: pai de Eliza Balbina de Toledo
  (P-0017) e, portanto, avô materno de Aristão Ferreira Armond (P-0008).

  - NÃO confundir com seu irmão **Cezário José de Toledo** (o outro filho de Mathilde, ⚭
  Maria José de Jesus), o inventariante do espólio de Mathilde de 1879 — nomes quase
  idênticos, pessoas distintas (PRB-0006).

  - **Nascimento:** não fixado por nenhum registro disponível [OPEN]; vivo em abril de
  1856 (GOV-0003), com filhos adultos e adolescentes em 1867, o que implica um nascimento
  na década de 1810. Um rascunho de recuperação lê um batismo de 10 de março de 1813 em
  São João del Rei — [LEAD], não catalogado.

  - **Casamento:** ⚭ Claudina Brandina de Jesus (P-0055), família F-0026; o assento de
  casamento não está disponível.

  - **Óbito:** antes de 4 de março de 1867 [PROVEN] — ambos os cônjuges são nomeados
  falecidos na abertura de seu inventário conjunto (capa de PRB-0008). A declaração
  juramentada de Claudina dá o dia como "dois de Setembro", com o ano cortado na quebra de
  página (PRB-0008 p5), muito provavelmente 1866 [LEAD quanto ao ano exato]. PRB-0009
  registra que ele morreu depois de seu pai Ladisláo (f. antes de 2 de agosto de 1862);
  com GOV-0003 situando-o vivo em abril de 1856, seu óbito recai entre 1862 e 1867.

  ## Posição social e profissão

  - **Proprietário de terras na Fazenda da Concórdia** [PROVEN] — no registro da Lei de
  Terras de 1856 (GOV-0003, entrada Nº 145, evento E-0073) declarou os 200 alqueires da
  Concórdia "por minha Mãe, irmãos e cunhados", isto é, em nome de sua mãe então viva, de
  seus irmãos e cunhados. Chefe abastado de uma casa Toledo proprietária na zona da mata
  do Rio Pardo / Leopoldina.

  - Uma casa escravista [PROVEN — contexto de inventário], cujos bens e herdeiros foram
  liquidados em dois inventários concomitantes de 1867 (o seu e o de seu pai).

  ## Família e rede social

  - Pais: Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027).
  Esposa: Claudina Brandina de Jesus (P-0055).

  - **Filhos:** ao menos nove (declaração de Claudina de 1867, PRB-0008). O filho
  estruturado da linha direta é **Eliza Balbina de Toledo (P-0017)**, nossa ancestral,
  confirmada por PRB-0006 (inventário de Mathilde de 1879, fólio 9, onde aparece como
  representante nº 5 sob o herdeiro nº 4). Seus outros filhos estão documentados na família
  F-0026: José Augusto, Maria Dulcelina, Mathildes Olympia, Josephina Christina, Maria
  Bulandina/Claudina, um Ladisláo Egydio mais novo, Geraldo Augusto, a menina Josefa — e um
  filho "Simplício José Ferreira de Toledo" (solteiro, 14 anos em 1867), falecido antes de
  1879.

  - **A armadilha dos dois Simplícios** [PROVEN]: o próprio filho de JC "Simplício José
  Ferreira de TOLEDO" (item 6 em ambos os inventários de 1867) é uma pessoa DIFERENTE de
  Simplício José Ferreira ARMOND (P-0016), que se casou com a filha de JC, Eliza. Simplício
  Armond é genro de JC, não seu filho; o prenome idêntico causou uma identificação
  equivocada, corrigida em 7 de agosto de 2026 (ver F-0026 e P-0016).

  ## O que podemos extrapolar

  Sua vida situa-se inteiramente no mundo Toledo proprietário da Fazenda da Concórdia — um
  herdeiro numerado de ambos os espólios de seus pais, um declarante da Lei de Terras
  atuando por toda a família, morto no auge e deixando muitos filhos menores sob um curador
  nomeado pela justiça (seu irmão Aureliano de Sales Toledo). [INFERRED]

  - **Capital hereditável, não renda de ofício** [PROVEN quanto ao ato / INFERRED quanto à
  posição]. Sua posição assentava-se no tipo de riqueza que se transmite: **terra**
  hereditável (os 200 alqueires da Concórdia registrados sob a Lei de Terras de 1850)
  trabalhada por **mão de obra escravizada** — indiscutivelmente o único capital hereditável
  que qualquer linha desta árvore possuiu, e o oposto estrutural da renda de ofício não
  transmissível do lado paterno Armond. Ele se situa claramente na fidalguia proprietária
  Toledo.

  - **A conversão terra→dinheiro** [documentado pela família a partir do inventário de 1879;
  parâmetros CONTEXTUAL]. Essa base de terra e mão de obra escravizada não passava intacta:
  na partilha convertia-se em uma quota única em dinheiro, depois dividida e vendida. Uma
  leitura do inventário de Matilde de 1879 (PRB-0006) situa a quota de sua filha **Eliza** em
  ≈1:539$781 — pelos parâmetros regionais das décadas de 1870–80, aproximadamente o preço de
  uma pessoa escravizada (~1 conto), ou cerca de 3,7 anos do salário de um trabalhador rural
  livre — após o que a Concórdia deixou a família (~1879–80). O espólio *financiou*, em vez de
  deter, o posterior deslize da família para a economia urbana de salário.

  - **A morte precoce dos pais agrava a fragmentação partível** [CONTEXTUAL]. Com ambos os
  pais falecidos em cerca de uma década e mais de uma dúzia de herdeiros, o sub-espólio de
  José-Cezário passou por tutela e foi dividido entre muitos filhos, em vez de mantido e
  ampliado — um acelerador clássico da fragmentação que a sucessão partível brasileira já
  impõe, e parte da razão pela qual a geração de Eliza herdou quotas em dinheiro, não terra.

  - **O primeiro deslocamento urbano** [INFERRED]. Seu filho Geraldo Augusto já estava "na
  Corte" (Rio de Janeiro) em 1879 — o primeiro Toledo na capital, uma geração inteira antes de
  o Aristão do lado Armond mudar-se para o Rio. A saída da terra em fragmentação rumo à cidade
  começa já entre seus próprios filhos.

  ## Questões em aberto

  - Seu nascimento/batismo e o ano exato do óbito (o "2 de setembro" da declaração de
  Claudina). [OPEN]

  - Seu casamento com Claudina e a própria filiação de Claudina. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - GOV-0003 (Lei de Terras de 1856, Nº 145 — proprietário na Concórdia; mãe viva em abril
  de 1856) · PRB-0008 (inventário conjunto de 1867 de JC e Claudina — a capa nomeia ambos;
  nove filhos) · PRB-0009 (inventário de Ladisláo de 1867 — JC como falecido item 8; seus
  representantes listados) · PRB-0006 (inventário de Mathilde de 1879 — herdeiro nº 4 JC ×
  Claudina; Eliza como representante nº 5) · PRB-0004 (escritura sem data da Concórdia / São
  Bento — contexto da sucessão Toledo).

  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se na zona da mata do Rio Pardo / Leopoldina, na
  Fazenda da Concórdia, para onde a linha Toledo de seus pais, de Barbacena e São João del
  Rei, havia migrado, na fronteira cafeeira do século XIX que abriu a floresta a leste,
  próxima do mercado do Rio. Essa floresta fora proibida pela Coroa durante o século XVIII
  (os "Sertões do Leste", uma barreira fiscal contra o contrabando de ouro); a Carta Régia
  de 13 de maio de 1808 declarou "guerra justa" ofensiva aos Botocudos e abriu os vales do
  Pomba, Muriaé e Carangola onde ficava a Concórdia. A economia cafeeira que se seguiu
  funcionava com mão de obra escravizada até a abolição (1888) — Leopoldina tinha a segunda
  maior população escravizada de Minas Gerais em 1883, uma medida de quão profunda essa
  economia era em seu próprio distrito. Seu filho Geraldo Augusto já estava "na Corte" (Rio
  de Janeiro) em 1879 — o primeiro deslocamento da família rumo à capital. [CONTEXTUAL]
