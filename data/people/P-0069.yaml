profile: >-
  ## Identity

  **Anna Maria Werhly** (also *Anne-Marie Wehrli*; family-name variants *Werly / Verli*)
  [PUB-0003]. The immigrant matriarch of the Borer/Bohrer trunk in Brazil, and the node
  where the Wehrli and Borer families fuse.

  - **Birth:** 1793 at Grindel, Soleure (Solothurn), Switzerland; exact day unknown
  (PUB-0003, strong-evidence).

  - **Parents:** fifth daughter of Johann Jacob Wehrli (P-0072) × Elisabetha Borer
  (P-0073), family F-0035 (PUB-0003). The sibling-ordinal carries minor uncertainty
  across the compilation's sub-sources. [LEAD for the exact ordinal]

  - **Emigration:** arrived Nova Friburgo in 1819 aboard the *Heureux Voyage*, aged about
  26, travelling with her parents and siblings (household at Casa 73 / Lote 86)
  [PUB-0003].

  - **Marriage:** married Laurent Borer (P-0068) on 3 July 1820 at Nova Friburgo
  (PUB-0003, strong-evidence; E-0061).

  - **Death:** unknown; no record held. [OPEN]

  ## Family and social network

  - **Children:** twelve with Laurent per the Casa Suíça database narrative, "at least
  eleven" per the compilation — a discrepancy preserved, not resolved [PUB-0003]. See
  F-0033 for the collateral children; the modelled child is Vicente Borer (P-0070).

  - **A double wedding:** on the very day she married Laurent (3 July 1820) her sister
  Salomé Wehrli married Louis Nicolas Villette (PUB-0003) — two Wehrli daughters married
  at Nova Friburgo the same day.

  - **Borer blood before marriage:** her mother Elisabetha was herself a Borer (of
  Erschwil), which is why the compiler flags Anna Maria as a probable cousin of her Borer
  husband — a suggestion, not evidence. [LEAD]

  ## What we can extrapolate

  - **She is the fulcrum of the Borer–Wehrli fusion [INFERRED].** Her marriage, her
  mother's Borer origin, and (per a blog, [LEAD]) her sister Catherine's marriage to
  Laurent's brother Johann Borer mean the two surnames braid together within a single
  generation — the endogamy typical of a transplanted Solothurn Catholic village
  reconstituting itself at Nova Friburgo.

  - **Her documentary invisibility [INFERRED]** is standard for a colonist wife: she
  surfaces only through her father's household, her husband and her children. Her own
  Grindel baptism (~1793) is the one record that would give her a direct primary
  footprint.

  ## Open questions

  - Her **Grindel baptism (~1793)** (FamilySearch-indexed, FHC-restricted) would fix her
  exact birth date and sibling ordinal; her **Nova Friburgo marriage (1820) and death**
  sit in the Nova Friburgo registers. [OPEN]

  ## Sources held (this repository)

  - PUB-0003 (*Imigrantes de Nova Friburgo* and the Casa Suíça database) — the source
  for her birth year, parentage, emigration, marriage and children.

  ## Regional and migration context

  Born in the poor, land-constrained Catholic Solothurn Jura, she emigrated at 26 with
  the whole Wehrli household under Dom João VI's 1819 Swiss-colony scheme, driven by the
  post-Napoleonic distress and 1816 famine of the region. [CONTEXTUAL] She married and
  remained in the Nova Friburgo area, anchoring a household on the colony's poor serra
  lots.
profile_pt: >-
  ## Identidade

  **Anna Maria Werhly** (também *Anne-Marie Wehrli*; variantes do sobrenome *Werly /
  Verli*) [PUB-0003]. A matriarca imigrante do tronco Borer/Bohrer no Brasil, e o ponto em
  que as famílias Wehrli e Borer se fundem.

  - **Nascimento:** 1793 em Grindel, Soleure (Solothurn), Suíça; dia exato desconhecido
  (PUB-0003, evidência forte).

  - **Pais:** quinta filha de Johann Jacob Wehrli (P-0072) × Elisabetha Borer (P-0073),
  família F-0035 (PUB-0003). A ordem entre os irmãos carrega uma pequena incerteza entre
  as sub-fontes da compilação. [LEAD para a ordem exata]

  - **Emigração:** chegou a Nova Friburgo em 1819 no *Heureux Voyage*, com cerca de 26
  anos, viajando com os pais e irmãos (domicílio na Casa 73 / Lote 86) [PUB-0003].

  - **Casamento:** casou-se com Laurent Borer (P-0068) em 3 de julho de 1820 em Nova
  Friburgo (PUB-0003, evidência forte; E-0061).

  - **Óbito:** desconhecido; nenhum registro em mãos. [OPEN]

  ## Família e rede social

  - **Filhos:** doze com Laurent conforme a narrativa do banco de dados da Casa Suíça,
  "ao menos onze" conforme a compilação — uma discrepância preservada, não resolvida
  [PUB-0003]. Ver F-0033 para os filhos colaterais; o filho modelado é Vicente Borer
  (P-0070).

  - **Um casamento duplo:** no mesmo dia em que se casou com Laurent (3 de julho de 1820),
  sua irmã Salomé Wehrli casou-se com Louis Nicolas Villette (PUB-0003) — duas filhas
  Wehrli casadas em Nova Friburgo no mesmo dia.

  - **Sangue Borer antes do casamento:** sua mãe Elisabetha era ela mesma uma Borer (de
  Erschwil), motivo pelo qual o compilador aponta Anna Maria como provável prima de seu
  marido Borer — uma sugestão, não evidência. [LEAD]

  ## O que podemos extrapolar

  - **Ela é o fulcro da fusão Borer–Wehrli [INFERRED].** Seu casamento, a origem Borer de
  sua mãe e (conforme um blog, [LEAD]) o casamento de sua irmã Catherine com o irmão de
  Laurent, Johann Borer, significam que os dois sobrenomes se entrelaçam dentro de uma
  única geração — a endogamia típica de uma aldeia católica de Solothurn transplantada,
  reconstituindo-se em Nova Friburgo.

  - **Sua invisibilidade documental [INFERRED]** é padrão para uma esposa de colono: ela
  aparece apenas por meio do domicílio do pai, do marido e dos filhos. Seu próprio batismo
  em Grindel (~1793) é o único registro que lhe daria uma pegada primária direta.

  ## Questões em aberto

  - Seu **batismo em Grindel (~1793)** (indexado no FamilySearch, restrito a FHC) fixaria
  sua data exata de nascimento e a ordem entre os irmãos; seu **casamento em Nova Friburgo
  (1820) e óbito** estão nos registros de Nova Friburgo. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PUB-0003 (*Imigrantes de Nova Friburgo* e o banco de dados da Casa Suíça) — a fonte de
  seu ano de nascimento, filiação, emigração, casamento e filhos.

  ## Contexto regional e migratório

  Nascida no Jura católico de Solothurn, pobre e com escassez de terra, emigrou aos 26
  anos com todo o domicílio Wehrli sob o esquema de colônia suíça de Dom João VI em 1819,
  impelida pela penúria pós-napoleônica e pela fome de 1816 da região. [CONTEXTUAL]
  Casou-se e permaneceu na região de Nova Friburgo, ancorando um domicílio nos pobres
  lotes de serra da colônia.
