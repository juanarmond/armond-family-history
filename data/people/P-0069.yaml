profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** She emigrated at about 26 in a cohort that overshot its own contract —
  some 261–265 families, roughly 1,700–2,000 people, against the 100 Swiss Catholic families
  Dom João VI's 1818 decree had provided for — and about a quarter of them died at sea of
  typhus and scurvy before the survivors reached the serra.

  - **[PROVEN]** She and her sister Salomea Wehrli married on the same day, 3 July 1820, and
  their acts are consecutive entries on one page of the Nova Friburgo marriage book: nº 37,
  Salomea × Luiz Nicolão Vilette, with Lourenço Borer as a witness, and nº 38, Anna Maria ×
  Laurent Borer (PAR-0060). Two Wehrli daughters married out of one household in a single
  ceremony, six months after the colony was raised to a vila.

  - **[CONTEXTUAL]** Her mother Elisabetha was herself a Borer (P-0073), which is why the
  compiler reads her marriage to Laurent Borer as a probable cousin match — the endogamy of a
  transplanted Solothurn parish reassembling itself, where Borer, Wehrli and Heggendorn
  recombined across three generations. A suggestion, not evidence.

  - **[INFERRED]** With about twelve children from the Borer marriage, she is the most direct
  demographic reason the branch never accumulated land: one poor colony lot under Brazilian
  partible succession, divided twelve ways and then again.

  - **[CONTEXTUAL]** The colony was named for Canton Fribourg but settled largely by Solothurn
  households like hers, on land that had been the private Fazenda do Morro Queimado two years
  before she arrived — the only Brazilian city founded by royal decree.

  ## Identity

  **Anna Maria Werhly** (also *Anne-Marie Wehrli*; surname variants *Werly / Verli*)
  [PUB-0003]. The immigrant matriarch of the Borer/Bohrer trunk in Brazil, and the point where
  the Wehrli and Borer families fuse.

  - **Birth:** 1793 at Grindel, Soleure (Solothurn), Switzerland; exact day unknown (PUB-0003,
  strong-evidence; E-0111).

  - **Parents:** a daughter — the compilation says the fifth — of Johann Jacob Wehrli (P-0072)
  × Elisabetha Borer (P-0073), family F-0035 (PUB-0003; the parents' own 1782 Grindel marriage
  is held as PAR-0029). The sibling ordinal carries minor uncertainty across the compilation's
  sub-sources [LEAD for the ordinal].

  - **Emigration:** landed at Rio de Janeiro late in 1819 aboard the *Heureux Voyage*, aged
  about 26, reaching Nova Friburgo on 1 January 1820, travelling with her parents and
  siblings; the household held Casa 73 / Lote 86 [PUB-0003].

  - **Marriage:** married Laurent Borer (P-0068) on 3 July 1820 at Nova Friburgo, before the
  vicar J. Joye [PROVEN — PAR-0060; event E-0061]. Her father is named in that act as "João
  Jacobo Verly", of Grindel.

  - **Death:** unknown; no record held. [OPEN] She was alive at least until her son Vicente's
  1828 baptism, where she is named as his mother (PAR-0061), and is named again — without any
  indication of death — in his 1864 marriage (PAR-0062).

  ## Standing and profession

  No occupation, property, office, title or literacy is documented for her. Every record that
  names her does so in a relational position: daughter of Johann Jacob Wehrli in her marriage
  act, "sua mulher Anna Maria Verly" in her son's baptism, "Anna Maria Verly" as the groom's
  mother in his marriage. That is not a gap peculiar to her — it is the standard documentary
  shape of a colonist wife's life, and the profile should say so rather than invent content.
  The one economic fact that attaches to her is the household's: the *Decreto de 16 de maio de
  1818* settlement package, a lot and house with rations, seed, livestock and a daily subsidy
  of 0$160 falling to 0$080 across two years — about 58$000 in year one against a free rural
  labourer's ~420$000. [CONTEXTUAL — role-based]

  ## Family and social network

  - **Husband:** Laurent Borer (P-0068), married 1820; family F-0033.

  - **Children:** twelve with Laurent per the Casa Suíça database narrative, "at least eleven"
  per the compilation's main text — a discrepancy preserved, not resolved [PUB-0003]. See
  F-0033 for the collateral children; the modelled child is Vicente Borer (P-0070), born 6
  September 1828 and baptised 13 October 1828 at Nova Friburgo (PAR-0061).

  - **A double wedding:** on the day she married Laurent her sister Salomea married Louis
  Nicolas Villette, in the entry immediately above hers, witnessed by her own groom [PROVEN —
  PAR-0060].

  - **Borer blood before the Borer marriage:** her mother Elisabetha Borer came from Erschwil,
  so the surname was already in her ascendancy when she married a Borer of Grindel. Whether
  the two Borer stocks were one family is undocumented [LEAD].

  - **Her parents' Swiss generation ended quickly in Brazil:** her father died at Nova
  Friburgo in 1827 and her mother in 1832 (Óbito L1 f.82), within thirteen years of landing —
  so from 1832 the Wehrli household in the colony was hers and her siblings' alone.

  ## What we can extrapolate

  - **Her standing was her family, and the family's standing was a lot [INFERRED].** She
  inherited no property and acquired no office; nothing in the record gives her letters, a
  trade or a title. What she had was position inside an intact, transplanted household — and
  in a colony where the state subsidy ran out after two years and the soil was poor, that was
  a real asset, just not a transferable one. Set against the family's Armond line, where women
  like Eliza Balbina de Toledo carried land into a marriage, the contrast is structural: here
  a bride carried labour, kin and a claim on the same lot, not capital.

  - **The marriage did not create a new economic unit — it loaded an existing one [INFERRED /
  CONTEXTUAL].** Colony allocation was per settled family and fixed: her husband did not
  receive a lot of his own but moved onto Casa 73 / Lote 86, the household's existing
  allotment. Marrying inside the colony pool therefore added hands and mouths to one poor plot
  rather than adding land. That is the mechanism behind the two same-day Wehrli weddings six
  months after the vila was raised: a household under acute pressure forming new couples fast,
  without any new ground to put them on.

  - **She is where two kinds of partible fragmentation meet [CONTEXTUAL].** Her father's
  Grindel household had already been squeezed by the Jura's division of holdings among heirs —
  the push that put the whole clan on a ship. In Brazil the same principle applied to the
  colony lot, and she bore eleven or twelve children into it. One undersized serra plot
  divided among her children, and again among theirs, is the arithmetic that keeps this branch
  flat for a century. Hers is the clearest illustration in this tree of why poor land plus
  many heirs forecloses an estate.

  - **Education: the branch that did not renew it [CONTEXTUAL / INFERRED].** The Solothurn
  cohort arrived with Catholic parish-school literacy in German, an asset Brazil did not
  supply — 19th-century schooling there was a purchased, class-linked privilege with no free
  rural alternative, so it had to be bought again each generation. Her descendants on this
  branch could not: her grandson Valentim Martinho Bohrer registered his daughter's 1891 birth
  "a rogo do declarante **por não saber escrever**", in an act that calls him and his wife
  *lavradores* (CIV-0045). Two generations from an imported literacy to a documented
  illiterate farm household, on land that had been divided too many times to pay for a school.

  - **Documentary invisibility is itself the finding [INFERRED].** She surfaces only through
  her father, her husband and her children; no birth, death or independent act of hers is
  held. That is not an accident of survival but a description of her class and sex in a
  colonist settlement — and it is why her own Grindel baptism (~1793) is the one record that
  would give her a direct footprint rather than a reflected one.

  - **The arc, named [INFERRED].** Grindel smallholder's daughter (pre-1819) → passenger in a
  clan emigration that lost roughly a quarter of its cohort at sea → married in the colony's
  first year onto the household's own poor lot → mother of eleven or twelve children whose
  shares of that lot were worth nothing → grandmother of *lavradores* who left it. Flat
  throughout, and deliberately so: there was never a fortune on this side, which is exactly
  the inverse of the family's Armond line, and the reason the Bohrer story is one of a slow
  climb rather than a fall.

  ## Open questions

  - Her **Grindel baptism (~1793)** — FamilySearch-indexed, FHC-restricted — would fix her
  exact birth date and her sibling ordinal. [OPEN]

  - Her **death**: no record held. The Nova Friburgo parish and civil registers after 1864
  (when she is last named alive in her son's marriage act) are the target, and the branch's
  drift toward São José do Ribeirão and Bom Jardim means those registries should be searched
  too. [OPEN]

  ## Sources held (this repository)

  - PAR-0060 (her own 1820 Nova Friburgo parish marriage to Laurent Borer — confirms the
  marriage, names her father "João Jacobo Verly" of Grindel, and records her sister Salomea's
  marriage in the entry above; sources event E-0061).

  - PAR-0061 (her son Vicente's 1828 Nova Friburgo baptism — "filho legitimo de Lourenço
  Bhorer e da sua mulher Anna Maria Verly, naturaes do cantão de Soleure").

  - PAR-0062 (Vicente's 1864 Nova Friburgo marriage — names her again as the groom's mother).

  - PUB-0003 (*Imigrantes de Nova Friburgo* and the Casa Suíça database) — the secondary
  source for her birth year, parentage, emigration and children.

  ## Regional and migration context

  Born in the poor, land-constrained Catholic Solothurn Jura, she emigrated at about 26 with
  the whole Wehrli household under Dom João VI's 1819 Swiss-colony scheme, driven by
  post-Napoleonic poverty and the 1816 famine. [CONTEXTUAL] She married in the colony's first
  year and remained in the Nova Friburgo area, anchoring a household on its poor serra lots.

  Why the colony existed, and on what terms [CONTEXTUAL]: Nova Friburgo was manufactured by
  the *Decreto de 16 de maio de 1818*, which authorised the Fribourg agent S.-N. Gachet to
  plant 100 Swiss **Catholic** families on the Fazenda do Morro Queimado — the only Brazilian
  city founded by royal decree, in a serra chosen to resemble Switzerland. The push was the
  1815 Tambora eruption and the 1816 "Year Without a Summer" famine on top of Jura land
  hunger; the pull was a guaranteed passage and a land grant, with the decree's Catholic
  requirement acting as a genuine confessional filter on this Solothurn trunk. Recruitment
  overshot to some 261–265 families, roughly a quarter of the colonists died at sea, and what
  the survivors received — small, steep, stony plots with inadequate tools and support — drove
  many to abandon their lots within a few years and disperse across the fluminense highlands.

  ## Where to go today

  - **Birth (~1793):** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt. Solothurn, Switzerland
  — her birthplace parish, still standing [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Marriage to Laurent Borer (3 July 1820):** Catedral Diocesana / Igreja Matriz de São
  João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — the 1820
  marriage predates the present cathedral (inaugurated 1869) and was held in the colony's
  earlier church on the same site [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (undated):** the Nova Friburgo parish and civil death registers, and those of São
  José do Ribeirão / Bom Jardim, into which her children's households moved. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Emigrou por volta dos 26 anos numa coorte que excedeu o próprio contrato
  — cerca de 261–265 famílias, aproximadamente 1.700–2.000 pessoas, contra as 100 famílias
  suíças católicas previstas no decreto de 1818 de Dom João VI — e cerca de um quarto delas
  morreu no mar de tifo e escorbuto antes de os sobreviventes alcançarem a serra.

  - **[PROVEN]** Ela e a irmã Salomea Wehrli casaram-se no mesmo dia, 3 de julho de 1820, e
  seus atos são assentos consecutivos numa página do livro de casamentos de Nova Friburgo: nº
  37, Salomea × Luiz Nicolão Vilette, tendo Lourenço Borer como testemunha, e nº 38, Anna
  Maria × Laurent Borer (PAR-0060). Duas filhas Wehrli casadas para fora de um mesmo domicílio
  numa única cerimônia, seis meses depois de a colônia ser elevada a vila.

  - **[CONTEXTUAL]** Sua mãe Elisabetha era ela própria uma Borer (P-0073), razão pela qual o
  compilador lê seu casamento com Laurent Borer como provável união entre primos — a endogamia
  de uma paróquia de Solothurn transplantada e reagrupada, em que Borer, Wehrli e Heggendorn
  se recombinaram por três gerações. Sugestão, não evidência.

  - **[INFERRED]** Com cerca de doze filhos no casamento Borer, é a razão demográfica mais
  direta de o ramo nunca ter acumulado terra: um lote colonial pobre, sob a sucessão partível
  brasileira, dividido em doze partes e depois outra vez.

  - **[CONTEXTUAL]** A colônia levou o nome do Cantão de Friburgo, mas foi povoada em grande
  parte por domicílios de Solothurn como o dela, em terras que dois anos antes de sua chegada
  eram a Fazenda do Morro Queimado, propriedade privada — a única cidade brasileira fundada
  por decreto real.

  ## Identidade

  **Anna Maria Werhly** (também *Anne-Marie Wehrli*; variantes do sobrenome *Werly / Verli*)
  [PUB-0003]. A matriarca imigrante do tronco Borer/Bohrer no Brasil e o ponto em que as
  famílias Wehrli e Borer se fundem.

  - **Nascimento:** 1793 em Grindel, Soleure (Solothurn), Suíça; dia exato desconhecido
  (PUB-0003, evidência forte; E-0111).

  - **Pais:** filha — a quinta, segundo a compilação — de Johann Jacob Wehrli (P-0072) ×
  Elisabetha Borer (P-0073), família F-0035 (PUB-0003; o casamento dos pais, em Grindel, em
  1782, está disponível como PAR-0029). A ordem entre os irmãos traz incerteza menor entre as
  subfontes da compilação [LEAD quanto à ordem].

  - **Emigração:** desembarcou no Rio de Janeiro no fim de 1819 a bordo do *Heureux Voyage*,
  com cerca de 26 anos, chegando a Nova Friburgo em 1º de janeiro de 1820, viajando com pais e
  irmãos; o domicílio ocupou a Casa 73 / Lote 86 [PUB-0003].

  - **Casamento:** casou-se com Laurent Borer (P-0068) em 3 de julho de 1820, em Nova
  Friburgo, perante o vigário J. Joye [PROVEN — PAR-0060; evento E-0061]. Seu pai é nomeado
  nesse ato como "João Jacobo Verly", de Grindel.

  - **Óbito:** desconhecido; nenhum registro disponível. [OPEN] Estava viva ao menos até o
  batismo do filho Vicente, em 1828, onde é nomeada como mãe (PAR-0061), e é nomeada outra vez
  — sem indicação de falecimento — no casamento dele, em 1864 (PAR-0062).

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo, título ou alfabetização está documentada para ela.
  Todo registro que a nomeia o faz numa posição relacional: filha de Johann Jacob Wehrli em
  seu ato de casamento, "sua mulher Anna Maria Verly" no batismo do filho, "Anna Maria Verly"
  como mãe do noivo no casamento dele. Isso não é uma lacuna peculiar a ela — é o formato
  documental padrão da vida de uma esposa de colono, e o perfil deve dizê-lo em vez de
  inventar conteúdo. O único fato econômico que lhe se aplica é o do domicílio: o pacote de
  assentamento do *Decreto de 16 de maio de 1818*, um lote e uma casa com víveres, sementes,
  gado e subsídio diário de 0$160 caindo a 0$080 ao longo de dois anos — cerca de 58$000 no
  primeiro ano, contra os ~420$000 de um trabalhador rural livre. [CONTEXTUAL — baseado no
  papel]

  ## Família e rede social

  - **Marido:** Laurent Borer (P-0068), casados em 1820; família F-0033.

  - **Filhos:** doze com Laurent segundo a narrativa do banco de dados da Casa Suíça, "ao
  menos onze" segundo o texto principal da compilação — discrepância preservada, não resolvida
  [PUB-0003]. Ver F-0033 para os filhos colaterais; o filho modelado é Vicente Borer (P-0070),
  nascido em 6 de setembro de 1828 e batizado em 13 de outubro de 1828, em Nova Friburgo
  (PAR-0061).

  - **Um casamento duplo:** no dia em que se casou com Laurent, sua irmã Salomea casou-se com
  Louis Nicolas Villette, no assento imediatamente acima do dela, testemunhado pelo próprio
  noivo de Anna Maria [PROVEN — PAR-0060].

  - **Sangue Borer antes do casamento Borer:** sua mãe, Elisabetha Borer, vinha de Erschwil,
  de modo que o sobrenome já estava em sua ascendência quando ela se casou com um Borer de
  Grindel. Se os dois troncos Borer eram uma só família é algo não documentado [LEAD].

  - **A geração suíça de seus pais acabou depressa no Brasil:** o pai morreu em Nova Friburgo
  em 1827 e a mãe em 1832 (Óbito L1 f.82), treze anos após o desembarque — de modo que, a
  partir de 1832, o domicílio Wehrli na colônia era dela e de seus irmãos, e de mais ninguém.

  ## O que podemos extrapolar

  - **Sua posição era sua família, e a posição da família era um lote [INFERRED].** Não herdou
  propriedade nem adquiriu cargo; nada no registro lhe dá letras, ofício ou título. O que
  tinha era posição dentro de um domicílio transplantado e intacto — e, numa colônia em que o
  subsídio estatal acabava em dois anos e o solo era pobre, isso era um ativo real, só que
  intransferível. Contra a linha Armond da família, em que mulheres como Eliza Balbina de
  Toledo levavam terra para um casamento, o contraste é estrutural: aqui uma noiva levava
  trabalho, parentela e uma participação no mesmo lote, não capital.

  - **O casamento não criou uma nova unidade econômica — sobrecarregou uma existente [INFERRED
  / CONTEXTUAL].** A alocação colonial era por família assentada e fixa: o marido não recebeu
  lote próprio, mas mudou-se para a Casa 73 / Lote 86, a alocação já existente do domicílio.
  Casar-se dentro do repertório colonial, portanto, acrescentava braços e bocas a uma gleba
  pobre, não terra nova. É esse o mecanismo por trás dos dois casamentos Wehrli no mesmo dia,
  seis meses depois de a vila ser elevada: um domicílio sob pressão aguda formando casais
  depressa, sem chão novo onde colocá-los.

  - **Ela é o ponto em que dois tipos de fragmentação partível se encontram [CONTEXTUAL].** O
  domicílio de seu pai, em Grindel, já vinha espremido pela divisão das posses do Jura entre
  herdeiros — o empurrão que pôs o clã inteiro num navio. No Brasil, o mesmo princípio se
  aplicou ao lote colonial, e ela pariu onze ou doze filhos dentro dele. Uma gleba serrana
  subdimensionada dividida entre seus filhos, e outra vez entre os filhos destes, é a
  aritmética que mantém este ramo plano por um século. O caso dela é a ilustração mais clara,
  nesta árvore, de por que terra pobre somada a muitos herdeiros inviabiliza um patrimônio.

  - **Educação: o ramo que não a renovou [CONTEXTUAL / INFERRED].** A coorte de Solothurn
  chegou com alfabetização de escola paroquial católica em alemão, ativo que o Brasil não
  fornecia — a escolarização oitocentista era privilégio comprado e ligado à classe, sem
  alternativa rural gratuita, e tinha de ser comprada de novo a cada geração. Seus
  descendentes neste ramo não puderam: seu neto Valentim Martinho Bohrer registrou o
  nascimento da filha, em 1891, "a rogo do declarante **por não saber escrever**", em ato que
  o chama, e à esposa, de *lavradores* (CIV-0045). Duas gerações de uma alfabetização
  importada a um domicílio agrícola comprovadamente analfabeto, em terra dividida vezes demais
  para pagar uma escola.

  - **A invisibilidade documental é, ela própria, o achado [INFERRED].** Ela emerge apenas por
  meio do pai, do marido e dos filhos; nenhum nascimento, óbito ou ato independente seu está
  disponível. Isso não é acidente de preservação, e sim descrição de sua classe e de seu sexo
  num assentamento colonial — e é por isso que seu próprio batismo em Grindel (~1793) é o
  único registro que lhe daria uma pegada direta, e não refletida.

  - **O arco, nomeado [INFERRED].** Filha de pequeno lavrador de Grindel (pré-1819) →
  passageira de uma emigração de clã que perdeu cerca de um quarto da coorte no mar → casada
  no primeiro ano da colônia, no próprio lote pobre do domicílio → mãe de onze ou doze filhos
  cujos quinhões desse lote nada valiam → avó de *lavradores* que o deixaram. Plano do começo
  ao fim, e deliberadamente: nunca houve fortuna deste lado, o que é exatamente o inverso da
  linha Armond da família, e a razão de a história Bohrer ser de subida lenta, e não de queda.

  ## Questões em aberto

  - Seu **batismo em Grindel (~1793)** — indexado no FamilySearch, restrito ao FHC — fixaria
  sua data exata de nascimento e sua ordem entre os irmãos. [OPEN]

  - Seu **óbito**: nenhum registro disponível. Os livros paroquiais e civis de Nova Friburgo
  posteriores a 1864 (quando é nomeada viva pela última vez, no ato de casamento do filho) são
  o alvo, e o deslocamento do ramo rumo a São José do Ribeirão e Bom Jardim faz com que esses
  cartórios também devam ser buscados. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0060 (seu próprio casamento paroquial de 1820 em Nova Friburgo com Laurent Borer —
  confirma o casamento, nomeia seu pai "João Jacobo Verly", de Grindel, e registra o casamento
  da irmã Salomea no assento acima; fundamenta o evento E-0061).

  - PAR-0061 (batismo de 1828, em Nova Friburgo, do filho Vicente — "filho legitimo de
  Lourenço Bhorer e da sua mulher Anna Maria Verly, naturaes do cantão de Soleure").

  - PAR-0062 (casamento de 1864, em Nova Friburgo, de Vicente — a nomeia novamente como mãe do
  noivo).

  - PUB-0003 (*Imigrantes de Nova Friburgo* e o banco de dados da Casa Suíça) — a fonte
  secundária de seu ano de nascimento, filiação, emigração e filhos.

  ## Contexto regional e migratório

  Nascida no Jura católico de Solothurn, pobre e limitado em terra, emigrou por volta dos 26
  anos com todo o domicílio Wehrli, sob o esquema de colônia suíça de Dom João VI de 1819,
  impelida pela pobreza pós-napoleônica e pela fome de 1816. [CONTEXTUAL] Casou-se no primeiro
  ano da colônia e permaneceu na região de Nova Friburgo, ancorando um domicílio em seus
  pobres lotes serranos.

  Por que a colônia existiu, e em que termos [CONTEXTUAL]: Nova Friburgo foi fabricada pelo
  *Decreto de 16 de maio de 1818*, que autorizou o agente friburguês S.-N. Gachet a assentar
  100 famílias suíças **católicas** na Fazenda do Morro Queimado — a única cidade brasileira
  fundada por decreto real, numa serra escolhida por assemelhar-se à Suíça. O empurrão foi a
  erupção do Tambora em 1815 e a fome do "Ano Sem Verão" de 1816 somadas à fome de terra do
  Jura; a atração foi passagem garantida e concessão de terra, com a exigência católica do
  decreto funcionando como filtro confessional real sobre este tronco de Solothurn. O
  recrutamento excedeu para cerca de 261–265 famílias, aproximadamente um quarto dos colonos
  morreu no mar, e o que os sobreviventes receberam — glebas pequenas, íngremes e pedregosas,
  com ferramentas e apoio insuficientes — levou muitos a abandonar seus lotes em poucos anos e
  a dispersar-se pelas serras fluminenses.

