notes:
- text: >-
    Born 1793 at Grindel, Soleure (Solothurn), Switzerland [PUB-0003, strong-evidence].
    Exact day of birth unknown. Fifth daughter of Johann Jacob Wehrli (P-0072) ×
    Elisabetha Borer (P-0073); family F-0035. Emigrated to Brazil in 1819 on the
    Heureux Voyage, aged approximately 26. Married Laurent Borer (P-0068) on
    03/07/1820 at Nova Friburgo, Rio de Janeiro. Date of death unknown.
  text_pt: >-
    Nascida em 1793 em Grindel, Soleure (Solothurn), Suíça [PUB-0003, evidência
    forte]. Dia exato de nascimento desconhecido. Quinta filha de Johann Jacob
    Wehrli (P-0072) × Elisabetha Borer (P-0073); família F-0035. Emigrou para o
    Brasil em 1819 no Heureux Voyage, com aproximadamente 26 anos. Casou-se com
    Laurent Borer (P-0068) em 03/07/1820 em Nova Friburgo, Rio de Janeiro. Data de
    óbito desconhecida.
- text: >-
    The compilation gives "doze filhos" for this couple in the Casa Suíça DB narrative
    and "ao menos onze filhos" in the main text — a one-child discrepancy. See F-0033
    notes for the full count discussion.
  text_pt: >-
    A compilação atribui "doze filhos" a este casal na narrativa do banco de
    dados da Casa Suíça e "ao menos onze filhos" no texto principal — uma
    discrepância de um filho. Ver as notas de F-0033 para a discussão completa da
    contagem.
