profile: >-
  ## Identity

  **Gertrudes Maria de Toledo** [PROVEN given name via PAR-0018] — recovered only as the mother
  of Joaquim José Ferreira de Toledo (P-0057), named in her son's c.1786 Barbacena marriage act
  (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo], de [Villa]
  Rica". A direct ancestor of Juan through that son. Her husband was Gaspar Ferreira (P-0092,
  family F-0045).

  - **Surname:** on the PAR-0018 folio the surname is abbreviated and at the legibility floor —
  "de Toledo" is a bracketed/uncertain read, preserved here as the recorded form. An independent
  FamilySearch index transcription of the same marriage reads the groom's mother "Gertrudes Maria
  de Toledo" (with the identifying father "Gaspar Ferreira" and matching spouse), corroborating
  the read — but as an index transcription it is a navigation lead, not a second physical source.
  [recorded form uncertain; index corroboration LEAD]

  - **Residence / nationality:** the family is seated at Villa Rica (Ouro Preto), Minas Gerais at
  the time her son married — the basis for the Brazilian nationality; "Villa" is likewise a
  bracketed/uncertain read on the ink-bled folio, and no explicit nacionalidade or birthplace of
  her own is stated. [family place; read uncertain]

  - **Birth / death / parents:** unknown — no record of her own is held. Born in the early 18th
  century (soft, from her son's c.1786 marriage). [OPEN; birth window INFERRED, soft]

  ## What we can extrapolate

  - **She is the origin of the "de Toledo" surname** [INFERRED]: her son is "Ferreira **de
  Toledo**" while her husband is only "**Ferreira**", so the "de Toledo" element descends through
  her family — making the whole line's "Toledo" label a maternal inheritance at this apex,
  structurally parallel to the Armond line's Ermonde/Drummond handoff through Margarida.

  ## Open questions

  - Her own baptism, marriage and parents — the generation above her (an earlier "de Toledo"
  family). Online indexes are exhausted (bounded-negative across FamilySearch full-text OCR, FS
  personas, the Nilza/COARPE inventário index and the LAMPEH Mariana catalogue). The decisive
  off-tool record is her son's Villa Rica baptism (~1750–1762), held by the Arquivo Eclesiástico
  da Arquidiocese de Mariana (AEAM), which would spell her full parentage. [OPEN]

  - A second physical copy of the marriage register (parish books were often kept in duplicate)
  would turn the uncertain "de Toledo" read into an independent proven one. [OPEN]
profile_pt: >-
  ## Identidade

  **Gertrudes Maria de Toledo** [PROVEN, o prenome, via PAR-0018] — recuperada apenas como mãe
  de Joaquim José Ferreira de Toledo (P-0057), nomeada no assento de casamento do filho, em
  Barbacena por volta de 1786 (PAR-0018): "filho legítimo de Gaspar Ferreira e de Gertrudes Maria
  [de Toledo], de [Villa] Rica". Ancestral direta de Juan por meio desse filho. Seu marido foi
  Gaspar Ferreira (P-0092, família F-0045).

  - **Sobrenome:** no fólio de PAR-0018 o sobrenome está abreviado e no limite da legibilidade —
  "de Toledo" é uma leitura entre colchetes/incerta, preservada aqui como a forma registrada. Uma
  transcrição de índice independente do FamilySearch do mesmo casamento lê a mãe do noivo como
  "Gertrudes Maria de Toledo" (com o pai identificador "Gaspar Ferreira" e a esposa
  correspondente), corroborando a leitura — mas, sendo uma transcrição de índice, é uma pista de
  navegação, não uma segunda fonte física. [forma registrada incerta; corroboração de índice LEAD]

  - **Residência / nacionalidade:** a família está estabelecida em Villa Rica (Ouro Preto), Minas
  Gerais, à época do casamento do filho — a base para a nacionalidade brasileira; "Villa" é
  igualmente uma leitura entre colchetes/incerta no fólio borrado por tinta, e nenhuma
  nacionalidade ou local de nascimento próprio é declarado. [lugar da família; leitura incerta]

  - **Nascimento / óbito / pais:** desconhecidos — nenhum registro próprio está disponível.
  Nascida no início do século XVIII (aproximado, a partir do casamento do filho por volta de
  1786). [OPEN; janela de nascimento INFERRED, aproximada]

  ## O que podemos extrapolar

  - **Ela é a origem do sobrenome "de Toledo"** [INFERRED]: seu filho é "Ferreira **de Toledo**"
  enquanto seu marido é apenas "**Ferreira**", de modo que o elemento "de Toledo" desce por sua
  família — tornando o rótulo "Toledo" de toda a linha uma herança materna neste ápice,
  estruturalmente paralela à passagem Ermonde/Drummond da linha Armond por Margarida.

  ## Questões em aberto

  - Seu próprio batismo, casamento e pais — a geração acima dela (uma família "de Toledo" mais
  antiga). Os índices online estão esgotados (negativo delimitado no OCR de texto completo do
  FamilySearch, nas personas do FS, no índice de inventários Nilza/COARPE e no catálogo LAMPEH de
  Mariana). O registro decisivo fora das ferramentas é o batismo de seu filho em Villa Rica
  (~1750–1762), sob guarda do Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), que
  soletraria sua filiação completa. [OPEN]

  - Uma segunda cópia física do registro de casamento (os livros paroquiais eram frequentemente
  mantidos em duplicata) transformaria a leitura incerta de "de Toledo" numa comprovada e
  independente. [OPEN]
