profile: >-
  ## Interesting facts

  - **[PROVEN]** Her name survives only in one clause of her son's 1783 Barbacena marriage
  act (PAR-0018), and the surname portion sits at the legibility floor of an ink-bled
  folio — "Gertrudes M[aria] [de Toledo]". She is among the most thinly documented
  ancestors in the entire tree, and she gave the whole branch its name.

  - **[INFERRED]** She is the structural origin of the "de Toledo" family name: her
  husband Gaspar was "Ferreira" only; their son became "Ferreira de Toledo". The Toledo
  branch of this family therefore carries a matrilineal surname — structurally parallel to
  the Armond line's Ermonde handoff through Margarida.

  - **[LEAD]** An independent FamilySearch index transcription of that same 1783 marriage
  reads the groom's mother verbatim as "Gertrudes Ma de Toledo", with the matching father
  "Gaspar Ferreira" and spouse "Ritta Angelica Roiz". It corroborates the reading — but it
  is an index of the same folio, not a second physical source.

  - **[INFERRED]** Her son's Villa Rica baptism of about 1750–1762, held by the Arquivo
  Eclesiástico da Arquidiocese de Mariana, would spell out her full parentage and settle
  the "de Toledo" read permanently. It is the single most decisive off-tool document for
  the entire Toledo maternal line.

  ## Identity

  **Gertrudes Maria de Toledo** [PROVEN given name via PAR-0018] — recovered only as the
  mother of Joaquim José Ferreira de Toledo (P-0057), named in her son's 1783 Barbacena
  marriage act: "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de Toledo], de
  [Villa] Rica". She stands six generations above the present day and three above Eliza
  Balbina de Toledo (P-0017). Her husband was Gaspar Ferreira (P-0092, family F-0045).

  - **Surname:** on the PAR-0018 folio the surname is abbreviated and at the legibility
  floor, so "de Toledo" is a bracketed and uncertain read, preserved here as the recorded
  form. An independent FamilySearch index transcription of the same marriage renders it
  "Gertrudes Maria de Toledo" — corroborating, but as an index reading of the same
  hard-to-read folio it is a navigation lead, not a second physical source. [recorded form
  uncertain; index corroboration LEAD]

  - **Residence / nationality:** the family is seated at Villa Rica (Ouro Preto), Minas
  Gerais, at the time her son married — the basis for the Brazilian nationality assigned
  here; "Villa" is likewise a bracketed and uncertain read on the ink-bled folio, and no
  explicit *nacionalidade* or birthplace of her own is stated. [family place; read
  uncertain]

  - **Birth / death / parents:** unknown — no record of her own is held. Born in the first
  third of the 18th century, inferred softly from her son's 1783 marriage. [OPEN; birth
  window INFERRED, soft]

  ## Standing and profession

  - Nothing is documented for her directly — which is the expected condition of a married
  woman of mid-18th-century Minas recorded only as a groom's mother, not a statement about
  her life. [OPEN]

  - **Literacy [UNCLASSIFIABLE].** No signable record of hers is held.

  ## Family and social network

  - Husband: Gaspar Ferreira (P-0092), *morador* at Villa Rica, family F-0045.

  - Son (the direct line): Capitão Joaquim José Ferreira de Toledo (P-0057), who married
  Ritta Angélica Rodrigues at Barbacena in 1783 and fathered the thirteen-child Barbacena
  Toledo generation. No other children are known. [PROVEN the son; siblings OPEN]

  ## What we can extrapolate

  - **She is the origin of the "de Toledo" surname** [INFERRED, well-supported]. Her son
  is "Ferreira **de Toledo**" while her husband is only "**Ferreira**", so the "de Toledo"
  element descends through her family. The whole line's "Toledo" label is a maternal
  inheritance at this apex — structurally the same handoff as the Armond line's Ermonde
  name, which also reached the family through a woman.

  - **A name outlasted every material thing this family owned** [INFERRED]. Trace what
  actually survived six generations. The Villa Rica connection ended with her son's move.
  The Fazenda Cascalhaes passed into thirteen shares in 1833. The militia captaincy died
  with its holder. The Fazenda da Concórdia was held under twenty years and sold in
  probate. The enslaved people who made up most of the family's appraised wealth were
  emancipated without compensation in 1888. Her surname is still attached to the branch.
  In a family whose every asset proved divisible, abolishable or non-transferable, the
  durable inheritance was the one carried by women and costing nothing.

  - **Her invisibility is systematic, not incidental** [CONTEXTUAL]. A woman of her time
  and place entered the written record at four moments: baptism, marriage, the baptisms of
  her children, and death — and in the last three she is usually named without a surname
  of her own, or with a devotional one. That she is legible at all is an accident of her
  son marrying in a parish whose register preserved the mother's surname. Two generations
  later the same pattern recurs in this family with Claudina Brandina de Jesus, whose
  paternal surname is genuinely unrecoverable.

  - **Nothing about her origins can be read from the surname itself** [INFERRED — a
  caution]. "de Toledo" is a toponymic surname long naturalised in Portugal and Brazil;
  its presence carries no reliable information about Spanish, hidalgo or Old-Christian
  descent, and any such reading would be an inference from a name rather than from a
  record. The only documented facts are the name as written, the family's seat at Villa
  Rica, and her son.

  - **The gap above her is one identifiable act** [INFERRED]. Her son's Villa Rica
  baptism, of about 1750–1762, would name her own parents and confirm the surname in a
  second hand. Every online index is exhausted; the record, if it survives, is at the
  Arquivo Eclesiástico da Arquidiocese de Mariana. Failing that, parish books were often
  kept in duplicate, and a second physical copy of the 1783 marriage would turn the
  uncertain "de Toledo" read into an independent proven one.

  ## Open questions

  - Her own baptism, marriage and parents — the generation above her, and presumably an
  earlier "de Toledo" family at Villa Rica or in Portugal. Online indexes are exhausted
  (bounded-negative across FamilySearch full-text OCR, FamilySearch personas, the
  Nilza/COARPE inventário index and the LAMPEH Mariana catalogue). The decisive off-tool
  record is her son's Villa Rica baptism (~1750–1762), held by the Arquivo Eclesiástico da
  Arquidiocese de Mariana (AEAM). [OPEN]

  - A second physical copy of the 1783 marriage register, which would turn the uncertain
  "de Toledo" read into an independent proven one. [OPEN]

  - Any other children of Gaspar × Gertrudes. [OPEN]

  ## Sources held (this repository)

  - PAR-0018 (her son Joaquim José's 1783 Barbacena marriage — the sole record naming her,
  giving her given name, the uncertain surname, her husband's name and the family's seat
  at Villa Rica).

  ## Regional and migration context

  Recorded as of Villa Rica (Ouro Preto), Minas Gerais — the administrative and mining
  heart of the 18th-century captaincy, at a point when its gold economy was past its peak
  of about 1750. No move of her own is documented; the family's Villa Rica → Barbacena
  migration appears only in her son's generation, as the mining district's families
  relocated toward the farming Campo das Vertentes. [CONTEXTUAL]

  ## Where to go today

  - **Recorded residence (Villa Rica):** Basílica de N.S. do Pilar / Igreja de N.S. da
  Conceição de Antônio Dias, Ouro Preto, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Monsenhor%20Castilho%20Barbosa%2017%2C%20Ouro%20Preto%2C%20MG)

  - **The record that would name her parents (her son's ~1750s–60s Villa Rica baptism):**
  Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM), Mariana, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Sao%20Pedro%20dos%20Clerigos%2C%20Mariana%2C%20MG)

  - **The act that names her (1783):** Capela de N.S. da Glória, Barbacena, MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Capela%20Nossa%20Senhora%20da%20Gloria%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu nome sobrevive apenas numa cláusula do assento de casamento de 1783,
  em Barbacena, de seu filho (PAR-0018), e a porção do sobrenome está no limite de
  legibilidade de um fólio borrado de tinta — "Gertrudes M[aria] [de Toledo]". Está entre
  os ancestrais mais tenuemente documentados de toda a árvore, e foi ela que deu o nome ao
  ramo inteiro.

  - **[INFERRED]** É a origem estrutural do nome de família "de Toledo": seu marido Gaspar
  era apenas "Ferreira"; o filho de ambos tornou-se "Ferreira de Toledo". O ramo Toledo
  desta família carrega, portanto, um sobrenome matrilinear — estruturalmente paralelo à
  passagem do nome Ermonde na linha Armond, por Margarida.

  - **[LEAD]** Uma transcrição de índice independente do FamilySearch, do mesmo casamento
  de 1783, lê a mãe do noivo, verbatim, como "Gertrudes Ma de Toledo", com o pai
  correspondente "Gaspar Ferreira" e a cônjuge "Ritta Angelica Roiz". Corrobora a leitura
  — mas é um índice do mesmo fólio, não uma segunda fonte física.

  - **[INFERRED]** O batismo de seu filho em Villa Rica, de cerca de 1750–1762, sob guarda
  do Arquivo Eclesiástico da Arquidiocese de Mariana, explicitaria sua filiação completa e
  resolveria de vez a leitura "de Toledo". É o documento fora das ferramentas mais
  decisivo para toda a linha materna Toledo.

  ## Identidade

  **Gertrudes Maria de Toledo** [PROVEN o prenome, via PAR-0018] — recuperada apenas como
  mãe de Joaquim José Ferreira de Toledo (P-0057), nomeada no assento de casamento de 1783
  do filho, em Barbacena: "filho legítimo de Gaspar Ferreira e de Gertrudes Maria [de
  Toledo], de [Villa] Rica". Está seis gerações acima do presente e três acima de Eliza
  Balbina de Toledo (P-0017). Seu marido era Gaspar Ferreira (P-0092, família F-0045).

  - **Sobrenome:** no fólio de PAR-0018 o sobrenome está abreviado e no limite de
  legibilidade, de modo que "de Toledo" é leitura entre colchetes e incerta, aqui
  preservada como a forma registrada. Uma transcrição de índice independente do
  FamilySearch, do mesmo casamento, o dá como "Gertrudes Maria de Toledo" — o que
  corrobora, mas, sendo leitura de índice do mesmo fólio de difícil leitura, é pista de
  navegação e não segunda fonte física. [forma registrada incerta; corroboração de índice
  LEAD]

  - **Residência / nacionalidade:** a família está situada em Villa Rica (Ouro Preto),
  Minas Gerais, à época do casamento do filho — base da nacionalidade brasileira aqui
  atribuída; "Villa" é igualmente leitura entre colchetes e incerta no fólio borrado, e
  nenhuma *nacionalidade* ou local de nascimento próprio é declarado. [lugar da família;
  leitura incerta]

  - **Nascimento / óbito / pais:** desconhecidos — nenhum registro próprio está
  disponível. Nascida no primeiro terço do século XVIII, inferência aproximada a partir do
  casamento de 1783 do filho. [OPEN; janela de nascimento INFERRED, aproximada]

  ## Posição social e profissão

  - Nada está documentado diretamente sobre ela — o que é a condição esperada de uma
  mulher casada das Minas de meados do século XVIII, registrada apenas como mãe de um
  noivo, e não uma afirmação sobre sua vida. [OPEN]

  - **Letramento [UNCLASSIFIABLE].** Nenhum registro assinável dela está disponível.

  ## Família e rede social

  - Marido: Gaspar Ferreira (P-0092), *morador* em Villa Rica, família F-0045.

  - Filho (a linha direta): Capitão Joaquim José Ferreira de Toledo (P-0057), que se casou
  com Ritta Angélica Rodrigues em Barbacena em 1783 e foi pai da geração Toledo de treze
  filhos de Barbacena. Não se conhecem outros filhos. [PROVEN o filho; irmãos OPEN]

  ## O que podemos extrapolar

  - **É a origem do sobrenome "de Toledo"** [INFERRED, bem apoiado]. Seu filho é "Ferreira
  **de Toledo**", enquanto seu marido é apenas "**Ferreira**", de modo que o elemento "de
  Toledo" desce pela família dela. O rótulo "Toledo" de toda a linha é herança materna
  neste ápice — estruturalmente a mesma passagem do nome Ermonde na linha Armond, que
  também chegou à família por uma mulher.

  - **Um nome sobreviveu a tudo o que esta família possuiu materialmente** [INFERRED].
  Vale rastrear o que de fato atravessou seis gerações. O vínculo com Villa Rica terminou
  com a mudança do filho. A Fazenda Cascalhaes passou a treze quotas em 1833. A capitania
  de milícia morreu com seu titular. A Fazenda da Concórdia foi detida por menos de vinte
  anos e vendida em inventário. As pessoas escravizadas, que compunham a maior parte da
  riqueza avaliada da família, foram emancipadas sem indenização em 1888. O sobrenome dela
  continua ligado ao ramo. Numa família cujos bens todos se mostraram divisíveis,
  aboliveis ou intransferíveis, a herança durável foi a carregada por mulheres e que nada
  custava.

  - **Sua invisibilidade é sistemática, não acidental** [CONTEXTUAL]. Uma mulher de seu
  tempo e lugar entrava no registro escrito em quatro momentos: batismo, casamento, os
  batismos dos filhos e a morte — e, nos três últimos, costuma ser nomeada sem sobrenome
  próprio, ou com um devocional. Que ela seja legível se deve ao acaso de o filho ter
  casado numa freguesia cujo registro preservava o sobrenome da mãe. Duas gerações depois,
  o mesmo padrão reaparece nesta família com Claudina Brandina de Jesus, cujo sobrenome
  paterno é genuinamente irrecuperável.

  - **Nada sobre suas origens pode ser lido no próprio sobrenome** [INFERRED — uma
  cautela]. "de Toledo" é sobrenome toponímico havia muito naturalizado em Portugal e no
  Brasil; sua presença não carrega informação confiável sobre ascendência espanhola,
  fidalga ou cristã-velha, e qualquer leitura nesse sentido seria inferência a partir de
  um nome, e não de um registro. Os únicos fatos documentados são o nome tal como escrito,
  a sede da família em Villa Rica e seu filho.

  - **A lacuna acima dela é um único assento identificável** [INFERRED]. O batismo de seu
  filho em Villa Rica, de cerca de 1750–1762, nomearia seus próprios pais e confirmaria o
  sobrenome por outra mão. Todos os índices on-line estão esgotados; o registro, se
  sobreviveu, está no Arquivo Eclesiástico da Arquidiocese de Mariana. Na falta dele, os
  livros paroquiais eram muitas vezes mantidos em duplicata, e uma segunda cópia física do
  casamento de 1783 transformaria a leitura incerta "de Toledo" em leitura provada e
  independente.

  ## Questões em aberto

  - Seu próprio batismo, casamento e pais — a geração acima dela e, presumivelmente, uma
  família "de Toledo" anterior em Villa Rica ou em Portugal. Os índices on-line estão
  esgotados (negativa delimitada em OCR de texto integral do FamilySearch, personas do
  FamilySearch, índice de inventários Nilza/COARPE e catálogo LAMPEH de Mariana). O
  registro decisivo, fora das ferramentas, é o batismo de seu filho em Villa Rica
  (~1750–1762), sob guarda do Arquivo Eclesiástico da Arquidiocese de Mariana (AEAM).
  [OPEN]

  - Uma segunda cópia física do registro de casamento de 1783, que transformaria a leitura
  incerta "de Toledo" em leitura provada e independente. [OPEN]

  - Quaisquer outros filhos de Gaspar × Gertrudes. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0018 (casamento de 1783, em Barbacena, de seu filho Joaquim José — o único
  registro que a nomeia, dando seu prenome, o sobrenome incerto, o nome do marido e a sede
  da família em Villa Rica).

  ## Contexto regional e migratório

  Registrada como de Villa Rica (Ouro Preto), Minas Gerais — o coração administrativo e
  minerador da capitania setecentista, num momento em que sua economia aurífera já passara
  do auge de cerca de 1750. Nenhum deslocamento próprio está documentado; a migração Villa
  Rica → Barbacena da família aparece apenas na geração de seu filho, quando as famílias
  do distrito minerador se deslocaram rumo ao Campo das Vertentes agrícola. [CONTEXTUAL]

