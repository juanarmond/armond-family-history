profile: >-
  ## Identity

  **Anna de Souza** — mother of Francisca Roza do Espírito Santo (P-0047), wife of Manoel de
  Motta (P-0086), family F-0042. [PROVEN as named]

  - **Attestation:** named as the bride's mother in her daughter's 1842 Mãe de Deus marriage
  (PAR-0024) and as a maternal grandmother in the held baptisms of three of Francisca's daughters
  (PAR-0045, 1843; PAR-0046, 1849; PAR-0047, 1851); she and her husband also stand as godparents
  at Agostinho's 1843 baptism (PAR-0044). [PROVEN as named]

  - **Namesake caution:** this Anna de Souza (wife of Manoel de Motta) is a *different* woman
  from the "Anna de Souza" who stood godmother at Manoel Muniz's 1821 baptism (that one the wife
  of Antonio de Medeiros Brandão), and from two other "Anna de Souza" brides who married other
  grooms in 1816. "Anna de Souza" is a common parish name; identity must be fixed by husband and
  parents, never by the name alone. [note]

  - **Origin:** São Miguel (Açores), N.S. Mãe de Deus / Povoação district; Portuguese (Açorean).
  Her own records are not held. [INFERRED / OPEN]

  ## Family and social network

  Wife of Manoel de Motta (P-0086) and mother of Francisca Roza do Espírito Santo (P-0047), who
  married the Mãe de Deus landowner Manoel Muniz Bytancourt (P-0042) in 1842 — the tie through
  which this maternal line reaches the emigrant João Muniz Bittencourt (P-0019) and his brother
  José. A second daughter, **Claudina** (a sister of Francisca Roza), is documented in the
  grandchildren's baptisms (PAR-0045/0046) as the maternal aunt / godmother. [PROVEN for Francisca,
  Claudina and the three grandchildren]

  ## What we can extrapolate

  *Proportionate to a maternal-grandmother documented in a marriage act and her grandchildren's
  baptisms.*

  - **Azorean maternal grandmother of the same land-scarce, endogamous class [INFERRED /
  CONTEXTUAL].** With her husband she anchors the São Miguel (Mãe de Deus / Povoação) origin of
  the Muniz line's maternal side; her daughter's blood-kin marriage into the Muniz (a 4th-degree
  dispensation) places her household in the same closed small-proprietor parish network as the
  rest of the line (see P-0042) — a peasant-proprietor world with no documented office, title or
  wealth beyond small parish landholding.

  - **A parentage recovered only through the next generation [INFERRED].** Her daughter's
  devotional surname "do Espírito Santo" obscured this parentage until the children's baptisms
  and the 1842 marriage were read — the recurring pattern by which Azorean women of this line
  survive in the record only as named grandmothers.

  ## Open questions

  - Her marriage to Manoel de Motta is a bounded negative across the whole 1801–1822 Mãe de Deus
  marriage book (all 196 pages read) → it is pre-1801 or in her own home parish (Azorean brides
  marry in their own parish). Identifying where she was baptised — which Povoação-district
  freguesia — is the key unknown that would point to the marriage book. Nordeste / N.S. da Luz is
  off-tool; Achadinha and Água Retorta tested negative. Off-tool (BPARPD, Ponta Delgada). [OPEN]

  - Her baptism, death and parents lie in the same pre-1818 books; off-tool. [OPEN]

  ## Sources held (this repository)

  - PAR-0024 (1842 marriage of her daughter Francisca — names her as the bride's mother) ·
  PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851 baptisms of her grandchildren — name her
  and Manoel de Motta as maternal grandparents) · PAR-0044 (1843 baptism of Agostinho — she and
  Manoel stand as godparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores), with no move documented — the same
  Azorean origin context as her husband (P-0086). [INFERRED] The emigration to Brazil is her
  grandsons' generation (about 1866–1870), driven by the island's *morgadio* land-lock,
  overpopulation and the 1860s collapse of the orange-export economy. [CONTEXTUAL] The Brazil pull
  ran through the Lei nº 581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras
  (nº 601/1850), while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863
  abolished the Portuguese *morgadios*. [CONTEXTUAL]

  ## Where to go today

  - **Where she appears in her daughters' records:** Igreja Matriz de N.S. da Mãe de Deus, Vila
  da Povoação, São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Marriage (likely her own home parish):** Nordeste (Igreja de N.S. da Luz / Matriz de São
  Jorge), São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
profile_pt: >-
  ## Identidade

  **Anna de Souza** — mãe de Francisca Roza do Espírito Santo (P-0047), esposa de Manoel de Motta
  (P-0086), família F-0042. [PROVEN quanto ao nome]

  - **Atestação:** nomeada como mãe da noiva no casamento de 1842 de sua filha em Mãe de Deus
  (PAR-0024) e como avó materna nos batismos obtidos de três filhas de Francisca (PAR-0045, 1843;
  PAR-0046, 1849; PAR-0047, 1851); ela e o marido também são padrinhos no batismo de 1843 de
  Agostinho (PAR-0044). [PROVEN quanto ao nome]

  - **Cautela de homonímia:** esta Anna de Souza (esposa de Manoel de Motta) é uma mulher
  *diferente* da "Anna de Souza" que foi madrinha no batismo de 1821 de Manoel Muniz (essa era
  esposa de Antonio de Medeiros Brandão), e de duas outras noivas "Anna de Souza" que se casaram
  com outros noivos em 1816. "Anna de Souza" é um nome comum na freguesia; a identidade deve ser
  fixada pelo marido e pelos pais, nunca pelo nome isolado. [nota]

  - **Origem:** São Miguel (Açores), distrito de N.S. Mãe de Deus / Povoação; portuguesa
  (açoriana). Seus próprios registros não são obtidos. [INFERRED / OPEN]

  ## Família e rede social

  Esposa de Manoel de Motta (P-0086) e mãe de Francisca Roza do Espírito Santo (P-0047), que se
  casou com o proprietário de Mãe de Deus Manoel Muniz Bytancourt (P-0042) em 1842 — o vínculo
  pelo qual esta linha materna alcança o emigrante João Muniz Bittencourt (P-0019) e seu irmão
  José. Uma segunda filha, **Claudina** (irmã de Francisca Roza), está documentada nos batismos
  dos netos (PAR-0045/0046) como a tia materna / madrinha. [PROVEN quanto a Francisca, a Claudina
  e aos três netos]

  ## O que podemos extrapolar

  *Proporcional a uma avó materna documentada num ato de casamento e nos batismos de seus netos.*

  - **Avó materna açoriana da mesma classe pobre em terra e endogâmica [INFERRED / CONTEXTUAL].**
  Com seu marido, ela ancora a origem em São Miguel (Mãe de Deus / Povoação) do lado materno da
  linha Muniz; o casamento consanguíneo de sua filha com os Muniz (dispensa de 4º grau) coloca seu
  domicílio na mesma rede de freguesia fechada de pequenos proprietários do restante da linha (ver
  P-0042) — um mundo de camponeses-proprietários sem ofício, título ou riqueza documentados além
  de pequena posse de freguesia.

  - **Uma filiação recuperada apenas pela geração seguinte [INFERRED].** O sobrenome devocional de
  sua filha "do Espírito Santo" obscureceu essa filiação até que os batismos dos filhos e o
  casamento de 1842 fossem lidos — o padrão recorrente pelo qual as mulheres açorianas desta linha
  sobrevivem no registro apenas como avós nomeadas.

  ## Questões em aberto

  - Seu casamento com Manoel de Motta é um negativo delimitado em todo o livro de casamentos de
  Mãe de Deus de 1801–1822 (todas as 196 páginas lidas) → é anterior a 1801 ou em sua própria
  freguesia natal (as noivas açorianas casam em sua própria freguesia). Identificar onde ela foi
  batizada — qual freguesia do distrito da Povoação — é a incógnita-chave que apontaria o livro de
  casamentos. Nordeste / N.S. da Luz está fora de alcance; Achadinha e Água Retorta testaram
  negativas. Fora de alcance (BPARPD, Ponta Delgada). [OPEN]

  - Seu batismo, óbito e pais estão nos mesmos livros anteriores a 1818; fora de alcance. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0024 (casamento de 1842 de sua filha Francisca — a nomeia como mãe da noiva) · PAR-0045 /
  PAR-0046 / PAR-0047 (batismos de 1843, 1849 e 1851 de seus netos — a nomeiam, e a Manoel de
  Motta, como avós maternos) · PAR-0044 (batismo de 1843 de Agostinho — ela e Manoel são
  padrinhos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores), sem mudança documentada — o mesmo
  contexto de origem açoriana de seu marido (P-0086). [INFERRED] A emigração para o Brasil é da
  geração de seus netos (por volta de 1866–1870), impulsionada pelo bloqueio fundiário do
  *morgadio* da ilha, pela superpopulação e pelo colapso, na década de 1860, da economia de
  exportação da laranja. [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de
  setembro de 1850 (Eusébio de Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em
  São Miguel afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os *morgadios*
  portugueses. [CONTEXTUAL]

  ## Onde ir hoje

  - **Onde aparece nos registros de suas filhas:** Igreja Matriz de N.S. da Mãe de Deus, Vila
  da Povoação, São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Casamento (provavelmente em sua própria freguesia natal):** Nordeste (Igreja de N.S. da
  Luz / Matriz de São Jorge), São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
