profile: >-
  ## Interesting facts

  - **[PROVEN]** Named as a maternal grandmother in four held documents — the 1842 marriage (PAR-0024), three grandchildren's baptisms (PAR-0045, PAR-0046, PAR-0047) — and standing as godmother at a fifth (PAR-0044), all without any record of her own being located.

  - **[CONTEXTUAL]** "Anna de Souza" was one of the commonest name-combinations in the Mãe de Deus / Povoação registers — at least three different women carried it in the 1816–1821 period alone — making her one of the harder Azorean women to anchor in the archive: identity requires fixing by husband and children, never by name alone.

  - **[INFERRED]** Her probable home parish was in the Nordeste / N.S. da Luz area, because Azorean brides traditionally married in their own parish — which is why the marriage to Manoel de Motta is a bounded negative across the 1801–1822 Mãe de Deus books: the record is almost certainly in a different parish book entirely.

  - **[CONTEXTUAL]** Her grandsons were the emigrant Muniz brothers who crossed to Brazil
  between 1866 and 1882 (most plausibly near 1880; see P-0019), driven by the São Miguel
  orange-export collapse and the 1866 loss of their father at sea — a cascade of disasters
  that unfolded decades after her probable death, completing an arc she set in motion by
  raising her daughter Francisca Roza in this tightly-bound Mãe de Deus community.

  ## Identity

  **Anna de Souza** — mother of Francisca Roza do Espírito Santo (P-0047), wife of Manoel de
  Motta (P-0086), family F-0042. [PROVEN as named]

  - **Attestation:** named as the bride's mother in her daughter's 1842 Mãe de Deus marriage
  (PAR-0024) and as a maternal grandmother in the held baptisms of three of Francisca's daughters
  (PAR-0045, 1843; PAR-0046, 1849; PAR-0047, 1851); she and her husband also stand as godparents
  at Agostinho's 1843 baptism (PAR-0044). [PROVEN as named]

  - **Namesake caution:** this Anna de Souza (wife of Manoel de Motta) is a *different* woman
  from the "Anna de Souza" who stood godmother at Manoel Muniz's 1821 baptism (that one the wife
  of Antonio de Medeiros Brandão), and from two other "Anna de Souza" brides who married other
  grooms in 1816. "Anna de Souza" is a common parish name; identity must be fixed by husband and
  parents, never by the name alone. [note]

  - **Origin:** São Miguel (Açores), N.S. Mãe de Deus / Povoação district; Portuguese (Açorean).
  Her own records are not held. [INFERRED / OPEN]

  ## Standing and profession

  - **Nothing documented** [PROVEN absence]. She appears as the bride's mother in 1842
  (PAR-0024), as a named maternal grandmother in 1849 and 1851 (PAR-0046, PAR-0047), and as
  a godmother in 1843 (PAR-0044). No act records an occupation, property, standing or
  honorific for her, and she is never written *Dona*. The field is left unset deliberately.

  - **[PROVEN]** Her one documented social act is the compadrio: with her husband she
  sponsored the 1843 baptism of Agostinho Muniz (PAR-0044), tying the Motta household to the
  Muniz within a year of the marriage between them. Note the namesake caution recorded on
  this entity — the *Anna de Souza* married to Antonio de Medeiros Brandão who godmothered
  Manoel Muniz Bytancourt in 1822 (PAR-0051) is a different woman and is not equated here.

  ## Family and social network

  Wife of Manoel de Motta (P-0086) and mother of Francisca Roza do Espírito Santo (P-0047), who
  married the Mãe de Deus landowner Manoel Muniz Bytancourt (P-0042) in 1842 — the tie through
  which this maternal line reaches the emigrant João Muniz Bittencourt (P-0019) and his brother
  José. A second daughter, **Claudina** (a sister of Francisca Roza), is documented in the
  grandchildren's baptisms (PAR-0045/0046) as the maternal aunt / godmother. [PROVEN for Francisca,
  Claudina and the three grandchildren]

  ## What we can extrapolate

  *Proportionate to a maternal grandmother documented in one marriage act, two baptisms and
  a godparenthood of her own.*

  **1. She belongs to the same land-scarce, endogamous parish class as the rest of the line
  [PROVEN / CONTEXTUAL].** Her daughter Francisca Roza married a Muniz Bytancourt in 1842 as
  a **fourth-degree blood relative**, under apostolic dispensation (PAR-0024).
  **[INFERRED]** Consanguinity dispensations are sought between households that already
  regard each other as kin and as equals; the marriage therefore places her family at the
  same rung as the *proprietário* household her daughter entered — small parish landholding,
  no office, no title, and no honorific anywhere in the registers.

  **2. She has a documented social act of her own, which is more than most women of this
  line leave [PROVEN].** In April 1843 she and her husband stood godparents to **Agostinho
  Muniz**, the infant brother of the man who had married their daughter the year before
  (PAR-0044). **[INFERRED]** Neither household had land to settle on the couple, so the
  alliance was sealed in sponsorship instead. That is the recurring shape of this family's
  social capital across four generations and two continents: kin bound to kin, never a
  patron reached for above.

  **3. Her parentage of Francisca surfaced only through the next generation [PROVEN /
  INFERRED].** Her daughter carried the devotional surname "do Espírito Santo" instead of a
  patronymic (P-0047), so this couple was invisible until the 1842 marriage act and the 1849
  and 1851 baptisms of their grandchildren were read (PAR-0024, PAR-0046, PAR-0047).
  **[INFERRED]** It is the standing pattern for the women of this line — Maria Eugenia
  (P-0085) and Tereza do Amaral (P-0083) survive the same way, as grandmothers named in
  other people's acts.

  **4. A namesake caution belongs in the analysis, not only in the notes [PROVEN].** A
  different *Anna de Souza*, wife of Antonio de Medeiros Brandão, stood godmother to Manoel
  Muniz Bytancourt in 1822 (PAR-0051); the repository does not equate the two women.
  **[CONTEXTUAL]** Repeated given-name pairs in a parish of this size are the ordinary
  consequence of a marriage market drawing on a handful of families — the same closure that
  produced the 1842 dispensation and two same-named Maria Jacinthas de Medeiros a generation
  earlier (P-0049).

  ## Open questions

  - Her marriage to Manoel de Motta is a bounded negative across the whole 1801–1822 Mãe de Deus
  marriage book (all 196 pages read) → it is pre-1801 or in her own home parish (Azorean brides
  marry in their own parish). Identifying where she was baptised — which Povoação-district
  freguesia — is the key unknown that would point to the marriage book. Nordeste / N.S. da Luz is
  off-tool; Achadinha and Água Retorta tested negative. Off-tool (BPARPD, Ponta Delgada). [OPEN]

  - Her baptism, death and parents lie in the same pre-1818 books; off-tool. [OPEN]

  ## Sources held (this repository)

  - PAR-0024 (1842 marriage of her daughter Francisca — names her as the bride's mother) ·
  PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851 baptisms of her grandchildren — name her
  and Manoel de Motta as maternal grandparents) · PAR-0044 (1843 baptism of Agostinho — she and
  Manoel stand as godparents).

  ## Regional and migration context

  Lived at N.S. Mãe de Deus / Povoação, São Miguel (Açores), with no move documented — the
  same Azorean origin context as her husband (P-0086). [INFERRED] The emigration to Brazil
  is her grandsons' generation (between 1866 and 1882 (most plausibly near 1880; see
  P-0019)), driven by the island's *morgadio* land-lock, overpopulation and the 1860s
  collapse of the orange-export economy. [CONTEXTUAL] The Brazil pull ran through the Lei nº
  581 de 4 de setembro de 1850 (Eusébio de Queirós) and the Lei de Terras (nº 601/1850),
  while the São Miguel push eased as the Carta de Lei de 19 de maio de 1863 abolished the
  Portuguese *morgadios*. [CONTEXTUAL]

  ## Where to go today

  - **Where she appears in her daughters' records:** Igreja Matriz de N.S. da Mãe de Deus, Vila
  da Povoação, São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Marriage (likely her own home parish):** Nordeste (Igreja de N.S. da Luz / Matriz de São
  Jorge), São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada como avó materna em quatro documentos em mãos — o casamento de 1842 (PAR-0024) e três batismos de netos (PAR-0045, PAR-0046, PAR-0047) — e como madrinha em um quinto (PAR-0044), tudo sem que nenhum registro próprio tenha sido localizado.

  - **[CONTEXTUAL]** "Anna de Souza" era uma das combinações de nome mais comuns nos registros de Mãe de Deus / Povoação — pelo menos três mulheres diferentes o carregavam no período de 1816–1821 —, tornando-a uma das mulheres açorianas mais difíceis de ancorar no arquivo: a identidade exige confirmação pelo marido e pelos filhos, nunca pelo nome isolado.

  - **[INFERRED]** Sua provável paróquia natal estava na área de Nordeste / N.S. da Luz, pois as noivas açorianas casavam em sua própria paróquia — o que explica por que o casamento com Manoel de Motta é um negativo delimitado nos livros de Mãe de Deus de 1801–1822: o registro está quase certamente em um livro paroquial diferente.

  - **[CONTEXTUAL]** Seus netos foram os irmãos emigrantes Muniz que cruzaram para o Brasil
  entre 1866 e 1882 (mais plausivelmente por volta de 1880; ver P-0019), impulsionados pelo
  colapso da exportação de laranja de São Miguel e pela perda do pai no mar em 1866 — uma
  cascata de desastres que se desenrolou décadas após sua provável morte, completando um
  arco que ela iniciou ao criar sua filha Francisca Roza nesta comunidade de Mãe de Deus.

  ## Identidade

  **Anna de Souza** — mãe de Francisca Roza do Espírito Santo (P-0047), esposa de Manoel de Motta
  (P-0086), família F-0042. [PROVEN quanto ao nome]

  - **Atestação:** nomeada como mãe da noiva no casamento de 1842 de sua filha em Mãe de Deus
  (PAR-0024) e como avó materna nos batismos obtidos de três filhas de Francisca (PAR-0045, 1843;
  PAR-0046, 1849; PAR-0047, 1851); ela e o marido também são padrinhos no batismo de 1843 de
  Agostinho (PAR-0044). [PROVEN quanto ao nome]

  - **Cautela de homonímia:** esta Anna de Souza (esposa de Manoel de Motta) é uma mulher
  *diferente* da "Anna de Souza" que foi madrinha no batismo de 1821 de Manoel Muniz (essa era
  esposa de Antonio de Medeiros Brandão), e de duas outras noivas "Anna de Souza" que se casaram
  com outros noivos em 1816. "Anna de Souza" é um nome comum na freguesia; a identidade deve ser
  fixada pelo marido e pelos pais, nunca pelo nome isolado. [nota]

  - **Origem:** São Miguel (Açores), distrito de N.S. Mãe de Deus / Povoação; portuguesa
  (açoriana). Seus próprios registros não são obtidos. [INFERRED / OPEN]

  ## Posição social e profissão

  - **Nada documentado** [PROVEN na ausência]. Aparece como mãe da noiva em 1842 (PAR-0024),
  como avó materna nomeada em 1849 e 1851 (PAR-0046, PAR-0047) e como madrinha em 1843
  (PAR-0044). Nenhum ato lhe registra ocupação, bens, posição ou tratamento honorífico, e
  nunca é escrita *Dona*. O campo fica deliberadamente sem preencher.

  - **[PROVEN]** Seu único ato social documentado é o compadrio: com o marido, apadrinhou o
  batismo de 1843 de Agostinho Muniz (PAR-0044), atando a casa dos Motta à dos Muniz no
  espaço de um ano após o casamento entre elas. Note-se a advertência de homonímia
  registrada nesta entidade — a *Anna de Souza* casada com Antonio de Medeiros Brandão, que
  foi madrinha de Manoel Muniz Bytancourt em 1822 (PAR-0051), é outra mulher e aqui não se
  equipara a esta.

  ## Família e rede social

  Esposa de Manoel de Motta (P-0086) e mãe de Francisca Roza do Espírito Santo (P-0047), que se
  casou com o proprietário de Mãe de Deus Manoel Muniz Bytancourt (P-0042) em 1842 — o vínculo
  pelo qual esta linha materna alcança o emigrante João Muniz Bittencourt (P-0019) e seu irmão
  José. Uma segunda filha, **Claudina** (irmã de Francisca Roza), está documentada nos batismos
  dos netos (PAR-0045/0046) como a tia materna / madrinha. [PROVEN quanto a Francisca, a Claudina
  e aos três netos]

  ## O que podemos extrapolar

  *Proporcional a uma avó materna documentada em um ato de casamento, dois batismos e um
  apadrinhamento próprio.*

  **1. Pertence à mesma classe paroquial endogâmica e pobre de terra do resto da linhagem
  [PROVEN / CONTEXTUAL].** Sua filha Francisca Roza casou-se com um Muniz Bytancourt em 1842
  na condição de **parente de sangue em quarto grau**, sob dispensa apostólica (PAR-0024).
  **[INFERRED]** Dispensas de consanguinidade pedem-se entre casas que já se veem como
  parentes e como iguais; o casamento situa, portanto, sua família no mesmo degrau da casa
  de *proprietários* em que a filha entrou — pequena posse paroquial, nenhum cargo, nenhum
  título e nenhum tratamento honorífico em parte alguma dos registros.

  **2. Ela tem um ato social próprio documentado, o que é mais do que a maioria das mulheres
  desta linhagem deixa [PROVEN].** Em abril de 1843, ela e o marido foram padrinhos de
  **Agostinho Muniz**, irmão recém-nascido do homem que se casara com a filha deles no ano
  anterior (PAR-0044). **[INFERRED]** Nenhuma das casas tinha terra para estabelecer o
  casal, e então a aliança foi selada em apadrinhamento. É a forma recorrente do capital
  social desta família ao longo de quatro gerações e dois continentes: parentes atados a
  parentes, nunca um patrono buscado acima.

  **3. Sua maternidade sobre Francisca só aflorou pela geração seguinte [PROVEN /
  INFERRED].** A filha levava o sobrenome devocional "do Espírito Santo" em vez de um
  patronímico (P-0047), de modo que este casal permaneceu invisível até que se lessem o ato
  de casamento de 1842 e os batismos de 1849 e 1851 dos netos (PAR-0024, PAR-0046,
  PAR-0047). **[INFERRED]** É o padrão constante para as mulheres desta linhagem — Maria
  Eugenia (P-0085) e Tereza do Amaral (P-0083) sobrevivem do mesmo modo, como avós nomeadas
  em atos alheios.

  **4. Uma advertência de homonímia pertence à análise, e não apenas às notas [PROVEN].**
  Uma outra *Anna de Souza*, mulher de Antonio de Medeiros Brandão, foi madrinha de Manoel
  Muniz Bytancourt em 1822 (PAR-0051); o repositório não equipara as duas mulheres.
  **[CONTEXTUAL]** Pares de prenomes repetidos numa freguesia deste tamanho são consequência
  ordinária de um mercado matrimonial que se abastece de um punhado de famílias — o mesmo
  fechamento que produziu a dispensa de 1842 e duas Marias Jacinthas de Medeiros homônimas
  uma geração antes (P-0049).

  ## Questões em aberto

  - Seu casamento com Manoel de Motta é um negativo delimitado em todo o livro de casamentos de
  Mãe de Deus de 1801–1822 (todas as 196 páginas lidas) → é anterior a 1801 ou em sua própria
  freguesia natal (as noivas açorianas casam em sua própria freguesia). Identificar onde ela foi
  batizada — qual freguesia do distrito da Povoação — é a incógnita-chave que apontaria o livro de
  casamentos. Nordeste / N.S. da Luz está fora de alcance; Achadinha e Água Retorta testaram
  negativas. Fora de alcance (BPARPD, Ponta Delgada). [OPEN]

  - Seu batismo, óbito e pais estão nos mesmos livros anteriores a 1818; fora de alcance. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0024 (casamento de 1842 de sua filha Francisca — a nomeia como mãe da noiva) · PAR-0045 /
  PAR-0046 / PAR-0047 (batismos de 1843, 1849 e 1851 de seus netos — a nomeiam, e a Manoel de
  Motta, como avós maternos) · PAR-0044 (batismo de 1843 de Agostinho — ela e Manoel são
  padrinhos).

  ## Contexto regional e migratório

  Viveu em N.S. Mãe de Deus / Povoação, São Miguel (Açores), sem mudança documentada — o
  mesmo contexto de origem açoriana de seu marido (P-0086). [INFERRED] A emigração para o
  Brasil é da geração de seus netos (entre 1866 e 1882 (mais plausivelmente por volta de
  1880; ver P-0019)), impulsionada pelo bloqueio fundiário do *morgadio* da ilha, pela
  superpopulação e pelo colapso, na década de 1860, da economia de exportação da laranja.
  [CONTEXTUAL] A atração para o Brasil passou pela Lei nº 581 de 4 de setembro de 1850
  (Eusébio de Queirós) e pela Lei de Terras (nº 601/1850), enquanto o empurrão em São Miguel
  afrouxou quando a Carta de Lei de 19 de maio de 1863 aboliu os *morgadios* portugueses.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Onde aparece nos registros de suas filhas:** Igreja Matriz de N.S. da Mãe de Deus, Vila
  da Povoação, São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Casamento (provavelmente em sua própria freguesia natal):** Nordeste (Igreja de N.S. da
  Luz / Matriz de São Jorge), São Miguel, Açores, Portugal [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Nossa%20Senhora%20da%20Luz%2C%20Nordeste%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)
