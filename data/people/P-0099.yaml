profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Maria Veisse" (= Weiss) in her daughter Catharina's 1825 Nova Friburgo marriage register (PAR-0059) as wife of José Moser, of Hägendorf, Canton Solothurn — a Swiss mother whose existence rests on a single Brazilian church entry.

  - **[CONTEXTUAL]** The Weiss surname is common across Canton Solothurn and the broader Swiss Mittelland — not a Thierstein Jura-specific name like Borer — suggesting she may have come from a slightly different geographic origin than the Erschwil/Grindel cluster, though all these Solothurn communities fell within the same Dom João VI recruiting zone.

  - **[INFERRED]** Secondary compilations associate the Moser family with the *Heureux Voyage* (1819) crossing to Nova Friburgo; if Maria Weiss emigrated too, she would be one of the very few grandmothers in this batch documented as having physically reached Brazil — but the held primary (PAR-0059) names her only as a parent, not as a Nova Friburgo resident, so this remains a LEAD.

  - **[CONTEXTUAL]** Her daughter Catharina married Jacob Bohrer in Nova Friburgo in 1825 — a Moser × Borer union connecting two Solothurn families. If the family arrived in 1819, this marriage took place between neighbours from the same Swiss canton who had spent six years together building the colony — a marriage that was probably expected before either family had left Switzerland.

  ## Identity

  **Maria Weiss** (source-rendered **"Maria Veisse"**) — a Swiss woman of Canton Solothurn, known
  as the mother of Catharina Moser (P-0051), who married the immigrant Jacob Bohrer at Nova
  Friburgo in 1825. [PROVEN]

  - **Identification:** named "Maria Veisse" (= Weiss) in Catharina's 1825 Nova Friburgo marriage
  register alongside her husband José Moser, with Catharina's baptism parish given as Eggendorf
  [Hägendorf — uncertain], Canton Soleure (PAR-0059). [PROVEN]

  ## Family

  She and José Moser (P-0098; family F-0048) are the deepest reached generation on the Moser line,
  attested by a single primary record — their daughter's 1825 marriage. [PROVEN — PAR-0059]
  Secondary compilations associate the Moser family with emigration to Nova Friburgo aboard the
  *Heureux Voyage* (1819), but no held primary source names her beyond PAR-0059. [LEAD]

  ## Open questions

  - Her birth, marriage and death dates; her own parentage — all unreached. The Hägendorf Catholic
  parish registers (Thierstein district; FS catalog 544541, freely accessible online) are the
  primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of daughter Catharina Moser — names "Maria Veisse" and
  José Moser as Catharina's legitimate parents from Canton Solothurn).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada "Maria Veisse" (= Weiss) no registro de casamento de Nova Friburgo de 1825 de sua filha Catharina (PAR-0059) como esposa de José Moser, de Hägendorf, Cantão de Soleure — uma mãe suíça cuja existência repousa em um único assento de igreja brasileira.

  - **[CONTEXTUAL]** O sobrenome Weiss é comum em todo o Cantão de Solothurn e no Mittelland suíço mais amplo — não um nome específico do Jura de Thierstein como Borer —, sugerindo que ela pode ter vindo de uma origem geográfica ligeiramente diferente do conjunto de Erschwil/Grindel, embora todas essas comunidades de Solothurn se enquadrassem na mesma zona de recrutamento de Dom João VI.

  - **[INFERRED]** Compilações secundárias associam a família Moser à travessia do *Heureux Voyage* (1819) para Nova Friburgo; se Maria Weiss também emigrou, seria uma das poucas avós neste lote documentadas como tendo chegado fisicamente ao Brasil — mas o primário em mãos (PAR-0059) a nomeia apenas como progenitora, não como residente de Nova Friburgo, portanto permanece uma LEAD.

  - **[CONTEXTUAL]** Sua filha Catharina casou-se com Jacob Bohrer em Nova Friburgo em 1825 — uma união Moser × Borer que conectou duas famílias de Solothurn. Se a família chegou em 1819, esse casamento teria ocorrido entre vizinhos do mesmo cantão suíço que passaram seis anos juntos construindo a colônia — uma união provavelmente prevista antes de qualquer das famílias ter deixado a Suíça.

  ## Identidade

  **Maria Weiss** (forma de fonte: **"Maria Veisse"**) — mulher suíça do Cantão de Soleure
  (Solothurn), conhecida como mãe de Catharina Moser (P-0051), que se casou com o imigrante Jacob
  Bohrer em Nova Friburgo em 1825. [PROVEN]

  - **Identificação:** nomeada "Maria Veisse" (= Weiss) no registro de casamento de 1825 de
  Catharina, em Nova Friburgo, ao lado de seu marido José Moser, com a freguesia de batismo de
  Catharina indicada como Eggendorf [Hägendorf — incerto], Cantão de Soleure (PAR-0059). [PROVEN]

  ## Família

  Ela e José Moser (P-0098; família F-0048) são a geração mais profunda alcançada na linha Moser,
  atestados por um único registro primário — o casamento de sua filha em 1825. [PROVEN — PAR-0059]
  Compilações secundárias associam a família Moser à emigração para Nova Friburgo no *Heureux
  Voyage* (1819), mas nenhuma fonte primária retida a nomeia além de PAR-0059. [LEAD]

  ## Questões em aberto

  - Suas datas de nascimento, casamento e falecimento; própria filiação — todas não alcançadas.
  Os registros paroquiais católicos de Hägendorf (distrito de Thierstein; catálogo FS 544541,
  livremente acessível online) são o principal alvo de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, da filha Catharina Moser — nomeia "Maria
  Veisse" e José Moser como pais legítimos de Catharina, do Cantão de Soleure).
