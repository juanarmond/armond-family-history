profile: >-
  ## Identity

  **Maria Weiss** (source-rendered **"Maria Veisse"**) — a Swiss woman of Canton Solothurn, known
  as the mother of Catharina Moser (P-0051), who married the immigrant Jacob Bohrer at Nova
  Friburgo in 1825. [PROVEN]

  - **Identification:** named "Maria Veisse" (= Weiss) in Catharina's 1825 Nova Friburgo marriage
  register alongside her husband José Moser, with Catharina's baptism parish given as Eggendorf
  [Hägendorf — uncertain], Canton Soleure (PAR-0059). [PROVEN]

  ## Family

  She and José Moser (P-0098; family F-0048) are the deepest reached generation on the Moser line,
  attested by a single primary record — their daughter's 1825 marriage. [PROVEN — PAR-0059]
  Secondary compilations associate the Moser family with emigration to Nova Friburgo aboard the
  *Heureux Voyage* (1819), but no held primary source names her beyond PAR-0059. [LEAD]

  ## Open questions

  - Her birth, marriage and death dates; her own parentage — all unreached. The Hägendorf Catholic
  parish registers (Thierstein district; FS catalog 544541, freely accessible online) are the
  primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of daughter Catharina Moser — names "Maria Veisse" and
  José Moser as Catharina's legitimate parents from Canton Solothurn).
profile_pt: >-
  ## Identidade

  **Maria Weiss** (forma de fonte: **"Maria Veisse"**) — mulher suíça do Cantão de Soleure
  (Solothurn), conhecida como mãe de Catharina Moser (P-0051), que se casou com o imigrante Jacob
  Bohrer em Nova Friburgo em 1825. [PROVEN]

  - **Identificação:** nomeada "Maria Veisse" (= Weiss) no registro de casamento de 1825 de
  Catharina, em Nova Friburgo, ao lado de seu marido José Moser, com a freguesia de batismo de
  Catharina indicada como Eggendorf [Hägendorf — incerto], Cantão de Soleure (PAR-0059). [PROVEN]

  ## Família

  Ela e José Moser (P-0098; família F-0048) são a geração mais profunda alcançada na linha Moser,
  atestados por um único registro primário — o casamento de sua filha em 1825. [PROVEN — PAR-0059]
  Compilações secundárias associam a família Moser à emigração para Nova Friburgo no *Heureux
  Voyage* (1819), mas nenhuma fonte primária retida a nomeia além de PAR-0059. [LEAD]

  ## Questões em aberto

  - Suas datas de nascimento, casamento e falecimento; própria filiação — todas não alcançadas.
  Os registros paroquiais católicos de Hägendorf (distrito de Thierstein; catálogo FS 544541,
  livremente acessível online) são o principal alvo de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, da filha Catharina Moser — nomeia "Maria
  Veisse" e José Moser como pais legítimos de Catharina, do Cantão de Soleure).
