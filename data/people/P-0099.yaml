profile: >-
  ## Interesting facts

  - **[PROVEN]** She survives in this archive on the strength of four words in one register:
  "sua mulher Maria Veisse" — his wife Maria Weiss — written by the vicar Jacob Joye when her
  daughter Catharina married Jacob Bohrer at Nova Friburgo on 8 August 1825 (PAR-0059). No
  record held here gives her a date, a place of her own, or a signature.

  - **[PROVEN]** The same entry does fix the family's canton, Soleure (Solothurn), and gives her
  daughter's baptismal parish, read "Eggendorf" and interpreted as Hägendorf [uncertain]. Her
  Swiss origin is stated by the record — it is not an inference from the surname Weiss, which
  would be worthless as evidence.

  - **[LEAD]** Colonist compilations and an untriaged Nova Friburgo burial image in the
  retrieval drop give an Anne Marie Weiss of Hägendorf (b. 1775) who emigrated with the Moser
  household on the *Heureux Voyage*, and a "Maria Anna Moser, viúva, com filhos, de José Moser,
  natural do Cantão de Soleure na Suissa, Brasileira naturalizada", buried at Nova Friburgo on
  30 May 1859 aged 84. If that woman is her, she crossed the Atlantic, outlived her husband by
  more than twenty years and died a naturalised Brazilian — but it is not yet catalogued here.

  - **[PROVEN / conflict preserved]** Her daughter is recorded twice under two surnames —
  "Catharina Moser" in 1825, "Catharina Mayer" in the 1888 will of her son Francisco José Borer
  (PRB-0005) — and the archive keeps both. The uncertainty runs upward into this generation.

  ## Identity

  **Maria Weiss** (source form **"Maria Veisse"**) — a Swiss woman of Canton Solothurn, known
  here only as the mother of Catharina Moser (P-0051), who married the immigrant Jacob Bohrer at
  Nova Friburgo in 1825. Iris Bohrer Muniz's (P-0007) 3×-great-grandmother, by the chain
  Catharina → Francisco José Bohrer (P-0034) → Joaquim José Bohrer (P-0030) → Celina Bohrer
  (P-0015). [PROVEN — PAR-0059; degree derived from the family links]

  - **Name as recorded:** "Maria Veisse", read as Weiss. [PROVEN — PAR-0059]

  - **Origin:** Canton Solothurn (Soleure), Switzerland; the family parish is read "Eggendorf"
  and interpreted as Hägendorf. [PROVEN for the canton; parish uncertain]

  - **Spouse:** José Moser (P-0098; family F-0048). No marriage act of their own is held.
  [PROVEN that the two are named as a married couple]

  - **Birth, death, own parentage:** undocumented in anything held here. [OPEN]

  ## Standing and profession

  Nothing is documented. Nineteenth-century Brazilian parish registers rarely record an
  occupation for a woman at all, and this one records nothing about her beyond her married
  status and her motherhood. Saying more would be invention.

  ## Family and social network

  She and José Moser are the deepest generation reached on the Moser line, and they are reached
  only through their daughter's wedding. [PROVEN — PAR-0059] That wedding joined two Solothurn
  families inside the Brazilian colony: Catharina Moser to Jacob Bohrer, a legitimate son of
  João Bohrer × Barbara Probst of Erschwil. The witnesses, João Probst and Isabel Sch[oser —
  uncertain], are from the same transplanted circle. [PROVEN — PAR-0059; the second witness
  surname is an uncertain read]

  ## What we can extrapolate

  - **[CONTEXTUAL]** Her generation of Solothurn women lived through the 1816–17 harvest
  failures that followed the 1815 Tambora eruption — Europe's worst famine of the century — in a
  canton where agriculture was effectively the only economy and too many heirs divided too
  little arable land. That, with post-Napoleonic impoverishment, is the push behind the 1819
  recruitment; no record states it as her motive.

  - **[INFERRED]** If the 1859 Nova Friburgo burial is hers, the shape of her life changes
  materially: she would have emigrated as a wife in an intact household, kept the family going
  through a widowhood of some twenty-two years, and taken Brazilian naturalisation — a colonist
  matriarch rather than a name left behind in Switzerland. Held evidence does not decide it.

  - **[CONTEXTUAL]** Whatever the family held in the colony was a floor, not a foundation: the
  Morro Queimado lots were stony and small, support was inadequate, and Brazilian partible
  succession split any holding equally among all children in the next generation. This line
  never had an estate to lose.

  ## Open questions

  - Her birth, her marriage and her own parents — all unreached. [OPEN]

  - Whether the 30 May 1859 Nova Friburgo burial of "Maria Anna Moser, viúva de José Moser" is
  hers, and cataloguing it here if so. The image sits untriaged in the retrieval drop; the
  recorded age of 84 would imply a birth about 1775, matching the compilation. [OPEN]

  - Whether the maiden surname is Weiss at all, given that the clerk wrote "Veisse" and that her
  daughter's surname is itself contested (Moser vs Mayer — see P-0051). [OPEN]

  ## Sources held (this repository)

  - **PAR-0059** — 1825 Nova Friburgo marriage of her daughter Catharina to Jacob Bohrer. Names
  "Maria Veisse" and "Jose Moser" as Catharina's legitimate parents and states the canton
  (Soleure) and Catharina's baptismal parish ("Eggendorf" [Hägendorf — uncertain]). The only
  held record that names her.

  ## Regional and migration context

  Hägendorf lies in Canton Solothurn, in German-speaking, mainly Catholic north-west
  Switzerland, an agricultural canton with no industrial alternative for its smallholders in the
  1810s. [CONTEXTUAL] The emigration that carried Solothurn families to Brazil was Dom João
  VI's: his decree of 16 May 1818 contracted the Fribourg agent Gachet to settle 100 Swiss
  Catholic families on the Fazenda do Morro Queimado, and recruitment overshot to some 261–265
  families from Fribourg, Solothurn, Valais and Bern. They travelled from Estavayer-le-Lac (4
  July 1819) via Basel and Rotterdam and sailed for Rio; about a quarter died en route of typhus
  and scurvy, and the colony became Vila de Nova Friburgo on 3 January 1820. [CONTEXTUAL] Only
  her daughter is placed in Nova Friburgo by a record held here. [PROVEN]

  ## Where to go today

  - **Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf** — 4614 Hägendorf, Kt.
  Solothurn, Switzerland · [Maps](https://maps.google.com/?q=47.3347,7.8445). The parish read
  into the 1825 entry; its Catholic registers (FamilySearch catalogue 544541, freely viewable
  online) would carry a Weiss baptism and the Moser × Weiss marriage. [RESOLVED as a place; the
  search is OPEN]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  daughter married in 1825, and where the 1859 burial entry — if it is hers — was written. The
  present cathedral dates from 1869; the earlier parish church stood on the same site.
  [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colony's lots were laid out; the ground of the Lote 67 lead. No
  colonist house survives as an address. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela sobrevive neste arquivo graças a quatro palavras de um livro: "sua mulher
  Maria Veisse" — a esposa, Maria Weiss —, escritas pelo vigário Jacob Joye quando sua filha
  Catharina se casou com Jacob Bohrer em Nova Friburgo, em 8 de agosto de 1825 (PAR-0059).
  Nenhum documento retido lhe dá uma data, um lugar próprio ou uma assinatura.

  - **[PROVEN]** O mesmo assento fixa o cantão da família, Soleure (Solothurn), e indica a
  freguesia de batismo da filha, lida como "Eggendorf" e interpretada como Hägendorf [incerto].
  Sua origem suíça é declarada pelo registro — não é inferência a partir do sobrenome Weiss, o
  que não teria valor probatório.

  - **[LEAD]** Compilações de colonos e uma imagem de óbito de Nova Friburgo ainda não triada no
  lote de recuperação apresentam uma Anne Marie Weiss de Hägendorf (n. 1775), emigrada com o
  domicílio Moser no *Heureux Voyage*, e uma "Maria Anna Moser, viúva, com filhos, de José
  Moser, natural do Cantão de Soleure na Suissa, Brasileira naturalizada", sepultada em Nova
  Friburgo em 30 de maio de 1859, aos 84 anos. Se for ela, cruzou o Atlântico, sobreviveu ao
  marido por mais de vinte anos e morreu brasileira naturalizada — mas nada disso está
  catalogado aqui.

  - **[PROVEN / conflito preservado]** Sua filha é registrada duas vezes sob dois sobrenomes —
  "Catharina Moser" em 1825 e "Catharina Mayer" no testamento de 1888 do filho Francisco José
  Borer (PRB-0005) —, e o arquivo guarda ambos. A incerteza sobe até esta geração.

  ## Identidade

  **Maria Weiss** (forma de fonte: **"Maria Veisse"**) — mulher suíça do Cantão de Soleure,
  conhecida aqui apenas como mãe de Catharina Moser (P-0051), que se casou com o imigrante Jacob
  Bohrer em Nova Friburgo, em 1825. Tetravó de Iris Bohrer Muniz (P-0007), pela cadeia Catharina
  → Francisco José Bohrer (P-0034) → Joaquim José Bohrer (P-0030) → Celina Bohrer (P-0015).
  [PROVEN — PAR-0059; grau derivado dos vínculos familiares]

  - **Nome registrado:** "Maria Veisse", lido como Weiss. [PROVEN — PAR-0059]

  - **Origem:** Cantão de Soleure (Solothurn), Suíça; a freguesia da família é lida como
  "Eggendorf" e interpretada como Hägendorf. [PROVEN quanto ao cantão; freguesia incerta]

  - **Cônjuge:** José Moser (P-0098; família F-0048). Nenhum assento de casamento do próprio
  casal está disponível. [PROVEN que os dois são nomeados como casal]

  - **Nascimento, óbito e filiação própria:** não documentados em nada que se tenha aqui. [OPEN]

  ## Posição social e profissão

  Nada está documentado. Os registros paroquiais brasileiros do século XIX raramente anotam
  ocupação de mulher, e este nada registra sobre ela além do estado de casada e da maternidade.
  Dizer mais seria invenção.

  ## Família e rede social

  Ela e José Moser são a geração mais profunda alcançada na linha Moser, e são alcançados apenas
  pelo casamento da filha. [PROVEN — PAR-0059] Esse casamento uniu duas famílias de Solothurn
  dentro da colônia brasileira: Catharina Moser e Jacob Bohrer, filho legítimo de João Bohrer ×
  Barbara Probst, de Erschwil. As testemunhas, João Probst e Isabel Sch[oser — incerto], vêm do
  mesmo círculo transplantado. [PROVEN — PAR-0059; o segundo sobrenome de testemunha é leitura
  incerta]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Sua geração de mulheres de Solothurn atravessou as quebras de safra de
  1816–17 que se seguiram à erupção do Tambora em 1815 — a pior fome europeia do século — num
  cantão em que a agricultura era praticamente a única economia e herdeiros demais dividiam
  terra de menos. Isso, somado ao empobrecimento pós-napoleônico, é o fator de expulsão por trás
  do recrutamento de 1819; nenhum registro o declara como motivo dela.

  - **[INFERRED]** Se o sepultamento de 1859 em Nova Friburgo for o dela, o formato de sua vida
  muda materialmente: teria emigrado como esposa num domicílio íntegro, sustentado a família por
  uma viuvez de cerca de vinte e dois anos e tomado a naturalização brasileira — uma matriarca
  colona, e não um nome deixado na Suíça. As evidências retidas não decidem a questão.

  - **[CONTEXTUAL]** O que a família tivesse na colônia era chão, não alicerce: os lotes do
  Morro Queimado eram pedregosos e pequenos, o apoio era insuficiente, e a sucessão partilhável
  brasileira dividia qualquer posse igualmente entre todos os filhos na geração seguinte. Esta
  linha nunca teve patrimônio a perder.

  ## Questões em aberto

  - Seu nascimento, seu casamento e seus próprios pais — tudo não alcançado. [OPEN]

  - Se o sepultamento de 30 de maio de 1859, em Nova Friburgo, de "Maria Anna Moser, viúva de
  José Moser", é o dela, e o seu catálogo aqui em caso afirmativo. A imagem está no lote de
  recuperação, não triada; a idade registrada de 84 anos implicaria nascimento por volta de
  1775, coincidindo com a compilação. [OPEN]

  - Se o sobrenome de solteira é sequer Weiss, dado que o escrivão escreveu "Veisse" e que o
  sobrenome da própria filha é contestado (Moser vs Mayer — ver P-0051). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0059** — casamento de 1825, em Nova Friburgo, da filha Catharina com Jacob Bohrer.
  Nomeia "Maria Veisse" e "Jose Moser" como pais legítimos de Catharina e declara o cantão
  (Soleure) e a freguesia de batismo dela ("Eggendorf" [Hägendorf — incerto]). É o único
  documento retido que a nomeia.

  ## Contexto regional e migratório

  Hägendorf fica no Cantão de Solothurn, no noroeste suíço de língua alemã e majoritariamente
  católico, um cantão agrícola sem alternativa industrial para seus pequenos proprietários na
  década de 1810. [CONTEXTUAL] A emigração que levou famílias de Solothurn ao Brasil foi a de
  Dom João VI: o decreto de 16 de maio de 1818 contratou o agente friburguês Gachet para
  assentar 100 famílias católicas suíças na Fazenda do Morro Queimado, e o recrutamento
  excedeu-se para cerca de 261–265 famílias, de Friburgo, Solothurn, Valais e Berna. Partiram de
  Estavayer-le-Lac (4 de julho de 1819) via Basileia e Roterdã rumo ao Rio; cerca de um quarto
  morreu no percurso, de tifo e escorbuto, e a colônia tornou-se Vila de Nova Friburgo em 3 de
  janeiro de 1820. [CONTEXTUAL] Apenas a filha é situada em Nova Friburgo por um documento
  retido aqui. [PROVEN]

  ## Onde ir hoje

  - **Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf** — 4614 Hägendorf, Kt.
  Solothurn, Suíça · [Mapa](https://maps.google.com/?q=47.3347,7.8445). A freguesia lida no
  assento de 1825; seus registros católicos (catálogo FamilySearch 544541, de acesso livre
  online) trariam um batismo Weiss e o casamento Moser × Weiss. [RESOLVED como lugar; a busca
  está OPEN]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em 1825 e onde foi lavrado o assento de óbito de 1859 — se for o dela. A
  catedral atual é de 1869; a igreja paroquial anterior ficava no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde foram demarcados os lotes da colônia; é o terreno da pista do
  Lote 67. Nenhuma casa de colono sobrevive como endereço. [APPROX]
