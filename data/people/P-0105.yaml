profile: >-
  ## Interesting facts

  - **[PROVEN]** Recorded as "Colonisten Joh. Klein" in his son's 1844 Lutheran baptism at Nova
  Friburgo (PAR-0066) — the German title "Colonisten" was the formal designation for the original
  settler-grant holders and their families in the colony records.

  - **[LEAD]** A secondary source (Raibert Schenkel/Klein blog) records him as born 3 November 1816
  in Becherbach, Hessen, son of the Klein immigrant patriarch Johann Jacob Klein Sr (b. 1784
  Becherbach). He arrived in Brazil as a child of approximately eight on the ship *Argus* (1824),
  the German second wave to Nova Friburgo; he did not decide the emigration — he was carried on it.
  [LEAD — no held primary for these dates]

  - **[LEAD]** He died 14 April 1886 at Rio Bonito (RJ) — part of the Klein family's dispersal
  from the Nova Friburgo colony core to the adjacent fluminense highlands. His wife Anna Margaretha
  also died at Rio Bonito, while their son Jacob stayed at Nova Friburgo (São José do Ribeirão),
  splitting the family without either branch rising economically.

  - **[INFERRED]** He was apparently still alive when his son Jacob married in 1872 — the Lutheran
  marriage register names him without a "deceased" qualifier — suggesting a lifespan extending into
  the era of Brazilian civil registration.

  ## Identity

  **Johannes Klein** — a Lutheran colonist at Nova Friburgo, named in two held parish records as
  the father of Jacob Klein (P-0103). [PROVEN]

  - **Role:** father of Jacob Klein (P-0103; family F-0052, with wife Anna Margaretha née Dürr
  P-0106); Iris Bohrer Muniz's 4×-great-grandfather on the Klein line. [PROVEN]

  - **Colonist at Nova Friburgo:** Jacob's 1844 Lutheran baptism records him as "Colonisten
  Joh. Klein" (PAR-0066, event E-0090). He is named again — without a "deceased" qualifier —
  in Jacob's 1872 marriage (PAR-0068), suggesting he was still living at that date.
  [PROVEN that he is named; INFERRED the likely-living status in 1872]

  - **Known life dates [LEAD]:** born 3 November 1816, Becherbach, Hessen; arrived Brazil ~age 8
  on the ship *Argus* (1824); died 14 April 1886, Rio Bonito, RJ. [LEAD — Raibert Schenkel/Klein
  blog; no held primary for these dates]

  ## Open questions

  - His Becherbach parish baptism (1816) and the *Argus* 1824 colonist list would confirm his
  dates and father-link at primary level; no held primary for his birth, marriage, or death is
  yet in this repository. [OPEN]

  ## Sources held (this repository)

  - PAR-0066 (Jacob Klein's 1844/45 Lutheran baptism — names him as father with the
  title "Colonisten").

  - PAR-0068 (Jacob Klein's 1872 Lutheran marriage — corroborates him as father).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Registrado como "Colonisten Joh. Klein" no batismo luterano de seu filho em 1844
  em Nova Friburgo (PAR-0066) — o título alemão "Colonisten" era a designação formal dos detentores
  originais de concessões de terra e suas famílias nos registros da colônia.

  - **[LEAD]** Uma fonte secundária (blog Raibert Schenkel/Klein) o registra como nascido em
  3 de novembro de 1816 em Becherbach, Hessen, filho do patriarca imigrante Johann Jacob Klein Sr
  (n. 1784 Becherbach). Chegou ao Brasil com cerca de oito anos no navio *Argus* (1824), a segunda
  leva alemã a Nova Friburgo; não foi ele quem decidiu emigrar — foi levado pela família.
  [LEAD — sem fonte primária para essas datas]

  - **[LEAD]** Faleceu em 14 de abril de 1886 no Rio Bonito (RJ) — parte da dispersão da família
  Klein fora do núcleo central da colônia de Nova Friburgo em direção às terras fluminenses
  adjacentes. Sua esposa Anna Margaretha também faleceu no Rio Bonito, enquanto o filho Jacob
  permaneceu em Nova Friburgo (São José do Ribeirão), dividindo a família sem que nenhum dos ramos
  ascendesse economicamente.

  - **[INFERRED]** Aparentemente ainda estava vivo quando seu filho Jacob casou em 1872 — o
  registro de casamento luterano o nomeia sem o qualificador "falecido" — sugerindo uma vida longa
  que adentrou a era do registro civil brasileiro.

  ## Identidade

  **Johannes Klein** — colono luterano em Nova Friburgo, nomeado em dois registros
  paroquiais como pai de Jacob Klein (P-0103). [PROVEN]

  - **Papel:** pai de Jacob Klein (P-0103; família F-0052, com a esposa Anna Margaretha nascida
  Dürr P-0106); tetravô de Iris Bohrer Muniz na linha Klein. [PROVEN]

  - **Colono em Nova Friburgo:** o batismo luterano de 1844 de Jacob registra-o como
  "Colonisten Joh. Klein" (PAR-0066, evento E-0090). É nomeado novamente — sem o qualificador
  de "falecido" — no casamento de 1872 de Jacob (PAR-0068), sugerindo que ainda estava vivo
  àquela data. [PROVEN que é nomeado; INFERRED a provável sobrevivência em 1872]

  - **Datas de vida conhecidas [LEAD]:** nascido em 3 de novembro de 1816, Becherbach, Hessen;
  chegou ao Brasil com ~8 anos no navio *Argus* (1824); faleceu em 14 de abril de 1886, Rio
  Bonito, RJ. [LEAD — blog Raibert Schenkel/Klein; sem fonte primária para essas datas]

  ## Questões em aberto

  - O registro de batismo em Becherbach (1816) e a lista de colonos do *Argus* de 1824
  confirmariam suas datas e vínculo com o pai em nível primário; nenhuma fonte primária para
  seu nascimento, casamento ou óbito está disponível neste repositório. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0066 (batismo luterano de 1844/45 de Jacob Klein — nomeia-o como pai com o
  título "Colonisten").

  - PAR-0068 (casamento luterano de 1872 de Jacob Klein — corrobora-o como pai).
