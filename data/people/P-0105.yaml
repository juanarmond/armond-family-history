profile: >-
  ## Interesting facts

  - **[PROVEN]** Recorded as "Colonisten Joh. Klein" in his son's 1844 Lutheran baptism at Nova Friburgo (PAR-0066) — the German title "Colonisten" was the formal designation for the original settler-grant holders and their families in the colony records.

  - **[CONTEXTUAL]** His presence in the 1844 baptism register places him among the German Lutheran colonists of Nova Friburgo, likely associated with the 1824 German immigration wave that supplemented the original 1819–1820 Swiss Catholic arrivals and formed a distinct Protestant congregation.

  - **[INFERRED]** He was apparently still alive when his son Jacob married in 1872 — the Lutheran marriage register names him without a "deceased" qualifier — suggesting a lifespan extending well past the colony's first difficult decades and into the era of Brazilian civil registration.

  ## Identity

  **Johannes Klein** — a Lutheran colonist at Nova Friburgo, named in two held parish records as
  the father of Jacob Klein (P-0103). [PROVEN]

  - **Role:** father of Jacob Klein (P-0103; family F-0052, with wife Anna Margaretha née
  [Neis — uncertain] P-0106); Iris Bohrer Muniz's great-great-grandfather on the Klein line. [PROVEN]

  - **Colonist at Nova Friburgo:** Jacob's 1844 Lutheran baptism records him as "Colonisten
  Joh. Klein" (PAR-0066, event E-0090). He is named again — without a "deceased" qualifier —
  in Jacob's 1872 marriage (PAR-0068), suggesting he was still living at that date.
