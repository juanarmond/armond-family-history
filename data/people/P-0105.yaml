profile: >-
  ## Interesting facts

  - **[PROVEN]** The Nova Friburgo Lutheran register of 1844 calls him "dem Colonisten Joh.
  Klein" — *the colonist* Johann Klein. That one German word is the only statement of standing
  any held record makes about him, and it places him formally inside the colony's grant-holding
  settler population rather than merely resident near it. (PAR-0066)

  - **[PROVEN]** Twenty-eight years later he is named again, in his son Jacob's 1872 marriage
  act — and, unlike his wife, without the qualifier "verstorbenen". The register marks her dead
  and says nothing of the kind about him, which is good evidence that he was still living in
  April 1872. (PAR-0068)

  - **[LEAD]** Secondary research material (the Raibert Klein/Schenkel blog) gives him a full
  life the records here do not: born 3 November 1816 at Becherbach, Hessen; brought to Brazil at
  about eight years old aboard the *Argus* in the 1824 German wave; son of the immigrant
  patriarch Johann Jacob Klein Sr; died 14 April 1886 at Rio Bonito, RJ. Not one of those dates
  is confirmed by a document held in this repository.

  - **[INFERRED]** If the Rio Bonito death is his, the family's trajectory is clear enough:
  parents dying away from the colony core while their son Jacob stayed within reach of Nova
  Friburgo, married there in 1872 as a Rio Bonito resident, and had his children baptised at São
  José do Ribeirão. The Kleins dispersed. There is no sign in any record that they rose.

  ## Identity

  **Johannes Klein** (written "Joh. Klein" in 1844) — a colonist of the Nova Friburgo German
  Lutheran community, named in two held parish records as the father of Jacob Klein (P-0103).
  Iris Bohrer Muniz's (P-0007) great-great-grandfather, by the chain Jacob → Carolina Klein
  (P-0029) → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the family links]

  - **Named in two records:** his son's Lutheran baptism of 1844/45, where he is "dem Colonisten
  Joh. Klein" (PAR-0066, event E-0090), and his son's Lutheran marriage of 29 April 1872
  (PAR-0068), where he appears without a death qualifier. [PROVEN]

  - **Wife:** Anna Margaretha (P-0106), whose maiden surname is illegible in both records;
  family F-0052. She was dead by 1872. [PROVEN — PAR-0068]

  - **Birth, death, origin, nationality:** none documented by a held record. Nationality is
  deliberately left unset in this archive for that reason. [OPEN by decision]

  - **Reported life dates [LEAD]:** b. 3 November 1816, Becherbach, Hessen; arrived Brazil c.
  1824 aboard the *Argus*; d. 14 April 1886, Rio Bonito, RJ. Raibert Klein/Schenkel blog; no
  held primary.

  ## Standing and profession

  One word, "Colonisten", and nothing else. No trade, no property, no office, no signature, no
  literacy. The word is worth taking seriously — in the Nova Friburgo registers it designates a
  settler of the colonization scheme, not a generic farmer — but it describes a legal category,
  not a career, and nothing in the held sources says what he actually did with the land or
  whether he kept it.

  ## Family and social network

  He and Anna Margaretha are documented only as a couple raising a child in the German Lutheran
  congregation: their son Jacob was born 16 October 1844 and baptised on 4 March 1845, with
  Jacob Schneider and Elisabeth — daughter of another *Jacob Klein*, the congregation's sexton —
  as godparents. [PROVEN — PAR-0066] That second Jacob Klein is a namesake, not this family, and
  is a standing caution against merging Kleins in these registers.

  By 1872 the household had scattered: his son was living at Rio Bonito and his wife was dead.
  [PROVEN — PAR-0068] The secondary material adds that Johannes and Anna Margaretha both died at
  Rio Bonito, and that Jacob's brothers baptised their children Lutheran while Jacob's own
  family baptised Catholic at São José do Ribeirão — a small confessional divergence inside one
  sibling set. [LEAD]

  ## What we can extrapolate

  - **[CONTEXTUAL]** He belongs to the colony's German second wave, not its Swiss founding one.
  After Brazilian independence the agent Georg Anton Schäffer recruited in the German states,
  and roughly eighty families reached Nova Friburgo on 3–4 May 1824, bringing the same
  post-Napoleonic poverty and land hunger that had driven the Swiss out five years earlier. They
  built the Igreja Luterana, which is why the Klein records are in German and not in the
  Catholic Matriz books.

  - **[INFERRED]** If he did arrive at about eight years old, he did not choose the migration —
  he was carried on it, and inherited its outcome. That distinction matters for reading his
  life: the generation that decided to emigrate can be judged on the gamble; his generation
  simply grew up on whatever the gamble produced.

  - **[CONTEXTUAL]** What it produced was thin. The Morro Queimado grants were stony highland
  lots, too small and too poorly supported, and many colonists abandoned them within a few years
  and dispersed through the fluminense highlands. The Klein family's documented drift toward Rio
  Bonito and São José do Ribeirão is that dispersal, not a move up.

  ## Open questions

  - His birth, marriage and death records. The Becherbach parish register (Rheinland-Pfalz — two
  candidate villages, Becherbach bei der Pfalz and Becherbach bei Kirn) would test the 1816
  birth and his own parentage; a Rio Bonito civil or parish death record would test the 1886
  death. [OPEN]

  - The *Argus* 1824 passenger and colony lot lists, which would confirm or break the whole
  German-wave lead at primary level. [OPEN]

  - His nationality, left unset on purpose because no held record states where he was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0066** — his son Jacob's 1844/45 Lutheran baptism at Nova Friburgo; names him as the
  father, with the title "Colonisten", and names his wife Anna Margaretha.

  - **PAR-0068** — his son Jacob's 1872 Lutheran marriage; names him again as the father, and —
  by omitting the "verstorbenen" applied to his wife — indicates he was then still living.

  ## Regional and migration context

  Nova Friburgo was founded by Dom João VI's decree of 16 May 1818 as a colony of Swiss Catholic
  families, but the 1824 German intake made it a two-confession town. The German settlers
  founded the Igreja Luterana and kept their own registers in German script; their descendants,
  the Kleins and Schenkels among them, married within that community for two generations before
  the boundary was crossed in 1890. [CONTEXTUAL] The German and Swiss waves left Europe for the
  same reasons — a countryside impoverished by the Napoleonic wars, harvests that failed in
  1816–17, and too many heirs for too little land — and arrived to the same disappointment:
  mountain lots that could not support the families placed on them. [CONTEXTUAL]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation whose register records him as
  "Colonisten" in 1844. [RESOLVED]

  - **Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ** — Praça Fonseca Portela s/n,
  Centro · [Maps](https://maps.google.com/?q=-22.71229,-42.62456). The town where the secondary
  sources place his death in 1886, and where his son was living in 1872. [RESOLVED as a place;
  his record there is a LEAD]

  - **Becherbach, Rheinland-Pfalz, Germany — village not yet fixed.** The reported birth parish
  of 1816. Two villages carry the name in Landkreis Bad Kreuznach: Becherbach bei der Pfalz ·
  [Maps](https://maps.google.com/?q=49.6556,7.6833) and Becherbach bei Kirn ·
  [Maps](https://maps.google.com/?q=49.7411,7.5003). Which one, if either, is the family's needs
  a record-level check. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** O livro luterano de Nova Friburgo, em 1844, chama-o "dem Colonisten Joh. Klein"
  — *o colono* Johann Klein. Essa única palavra alemã é a única declaração de posição que
  qualquer documento retido faz sobre ele, e o situa formalmente dentro da população de colonos
  beneficiários de concessão, e não apenas como morador das redondezas. (PAR-0066)

  - **[PROVEN]** Vinte e oito anos depois é nomeado de novo, no assento de casamento do filho
  Jacob, em 1872 — e, ao contrário da esposa, sem o qualificador "verstorbenen". O registro
  marca a mulher como falecida e nada de semelhante diz dele, o que é boa evidência de que ainda
  vivia em abril de 1872. (PAR-0068)

  - **[LEAD]** Material secundário de pesquisa (o blog Raibert Klein/Schenkel) lhe atribui uma
  vida inteira que os documentos daqui não trazem: nascido em 3 de novembro de 1816 em
  Becherbach, Hessen; levado ao Brasil com cerca de oito anos a bordo do *Argus*, na leva alemã
  de 1824; filho do patriarca imigrante Johann Jacob Klein Sr; falecido em 14 de abril de 1886
  no Rio Bonito, RJ. Nenhuma dessas datas é confirmada por documento retido neste repositório.

  - **[INFERRED]** Se a morte no Rio Bonito for a dele, a trajetória da família fica clara: pais
  morrendo longe do núcleo colonial, enquanto o filho Jacob permaneceu ao alcance de Nova
  Friburgo, ali se casou em 1872 como morador do Rio Bonito e teve os filhos batizados em São
  José do Ribeirão. Os Klein dispersaram-se. Não há em nenhum registro sinal de que tenham
  ascendido.

  ## Identidade

  **Johannes Klein** (grafado "Joh. Klein" em 1844) — colono da comunidade luterana alemã de
  Nova Friburgo, nomeado em dois registros paroquiais retidos como pai de Jacob Klein (P-0103).
  Trisavô de Iris Bohrer Muniz (P-0007), pela cadeia Jacob → Carolina Klein (P-0029) → João
  Gonçalves Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Nomeado em dois registros:** o batismo luterano do filho, em 1844/45, em que é "dem
  Colonisten Joh. Klein" (PAR-0066, evento E-0090), e o casamento luterano do filho, em 29 de
  abril de 1872 (PAR-0068), em que aparece sem qualificador de falecimento. [PROVEN]

  - **Esposa:** Anna Margaretha (P-0106), cujo sobrenome de solteira é ilegível nos dois
  registros; família F-0052. Ela já havia morrido em 1872. [PROVEN — PAR-0068]

  - **Nascimento, óbito, origem e nacionalidade:** nada documentado por registro retido. Por
  isso a nacionalidade é deliberadamente deixada em aberto neste arquivo. [OPEN por decisão]

  - **Datas de vida relatadas [LEAD]:** n. 3 de novembro de 1816, Becherbach, Hessen; chegada ao
  Brasil c. 1824 a bordo do *Argus*; f. 14 de abril de 1886, Rio Bonito, RJ. Blog Raibert
  Klein/Schenkel; nenhuma fonte primária retida.

  ## Posição social e profissão

  Uma palavra, "Colonisten", e nada mais. Nenhum ofício, propriedade, cargo, assinatura ou
  alfabetização. A palavra merece ser levada a sério — nos livros de Nova Friburgo designa um
  colono do programa de colonização, não um lavrador genérico —, mas descreve uma categoria
  jurídica, não uma carreira, e nada nas fontes retidas diz o que ele efetivamente fez com a
  terra, ou se a manteve.

  ## Família e rede social

  Ele e Anna Margaretha estão documentados apenas como casal criando um filho na congregação
  luterana alemã: o filho Jacob nasceu em 16 de outubro de 1844 e foi batizado em 4 de março de
  1845, com Jacob Schneider e Elisabeth — filha de outro *Jacob Klein*, sacristão da congregação
  — como padrinhos. [PROVEN — PAR-0066] Esse segundo Jacob Klein é homônimo, não desta família,
  e é um alerta permanente contra fundir Kleins nesses livros.

  Em 1872 o domicílio havia se dispersado: o filho morava no Rio Bonito e a esposa estava morta.
  [PROVEN — PAR-0068] O material secundário acrescenta que Johannes e Anna Margaretha morreram
  ambos no Rio Bonito, e que os irmãos de Jacob batizavam os filhos na tradição luterana,
  enquanto a família do próprio Jacob batizava como católica em São José do Ribeirão — pequena
  divergência confessional dentro de um mesmo conjunto de irmãos. [LEAD]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Ele pertence à segunda leva alemã da colônia, não à fundadora suíça. Depois
  da independência do Brasil, o agente Georg Anton Schäffer recrutou nos estados alemães, e
  cerca de oitenta famílias chegaram a Nova Friburgo em 3–4 de maio de 1824, trazendo a mesma
  pobreza pós-napoleônica e fome de terra que expulsara os suíços cinco anos antes. Ergueram a
  Igreja Luterana — razão pela qual os registros Klein estão em alemão e não nos livros da
  Matriz católica.

  - **[INFERRED]** Se de fato chegou com cerca de oito anos, não escolheu a migração — foi
  levado por ela e herdou o seu resultado. A distinção importa para ler sua vida: a geração que
  decidiu emigrar pode ser julgada pela aposta; a dele apenas cresceu sobre aquilo que a aposta
  produziu.

  - **[CONTEXTUAL]** E o que ela produziu foi pouco. As concessões do Morro Queimado eram lotes
  serranos pedregosos, pequenos demais e mal amparados, e muitos colonos os abandonaram em
  poucos anos, dispersando-se pela serra fluminense. A deriva documentada da família Klein rumo
  ao Rio Bonito e a São José do Ribeirão é essa dispersão, não uma ascensão.

  ## Questões em aberto

  - Seus registros de nascimento, casamento e óbito. O livro paroquial de Becherbach
  (Renânia-Palatinado — duas aldeias candidatas, Becherbach bei der Pfalz e Becherbach bei Kirn)
  testaria o nascimento de 1816 e sua própria filiação; um óbito civil ou paroquial do Rio
  Bonito testaria a morte de 1886. [OPEN]

  - As listas de passageiros e de lotes do *Argus* (1824), que confirmariam ou romperiam toda a
  pista da leva alemã em nível primário. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0066** — batismo luterano de 1844/45 do filho Jacob, em Nova Friburgo; nomeia-o como
  pai, com o título "Colonisten", e nomeia sua esposa Anna Margaretha.

  - **PAR-0068** — casamento luterano de 1872 do filho Jacob; nomeia-o novamente como pai e — ao
  omitir o "verstorbenen" aplicado à esposa — indica que ele ainda vivia.

  ## Contexto regional e migratório

  Nova Friburgo foi fundada pelo decreto de Dom João VI de 16 de maio de 1818 como colônia de
  famílias católicas suíças, mas a entrada alemã de 1824 fez dela uma vila de duas confissões.
  Os colonos alemães fundaram a Igreja Luterana e mantiveram seus próprios livros em escrita
  alemã; seus descendentes, entre eles os Klein e os Schenkel, casaram-se dentro dessa
  comunidade por duas gerações, até a fronteira ser cruzada em 1890. [CONTEXTUAL] As levas alemã
  e suíça deixaram a Europa pelos mesmos motivos — um campo empobrecido pelas guerras
  napoleônicas, colheitas perdidas em 1816–17 e herdeiros demais para terra de menos — e
  chegaram à mesma decepção: lotes de montanha incapazes de sustentar as famílias ali colocadas.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, cujo livro o registra como "Colonisten"
  em 1844. [RESOLVED]

  - **Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ** — Praça Fonseca Portela s/n,
  Centro · [Mapa](https://maps.google.com/?q=-22.71229,-42.62456). A cidade em que as fontes
  secundárias situam sua morte, em 1886, e onde o filho morava em 1872. [RESOLVED como lugar; o
  registro dele ali é LEAD]

  - **Becherbach, Renânia-Palatinado, Alemanha — aldeia ainda não fixada.** A freguesia de
  nascimento relatada para 1816. Duas aldeias levam o nome no distrito de Bad Kreuznach:
  Becherbach bei der Pfalz · [Mapa](https://maps.google.com/?q=49.6556,7.6833) e Becherbach bei
  Kirn · [Mapa](https://maps.google.com/?q=49.7411,7.5003). Qual delas, se alguma, é a da
  família exige verificação documental. [APPROX]
