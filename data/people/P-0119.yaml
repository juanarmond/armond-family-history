profile: >-
  ## Interesting facts

  - **[LEAD]** From Bergöschingen, Klettgau, Baden-Württemberg (Germany) — his family's origin;
  ⚠️ NOT Alsace (a corrected point found in some trees). His son Jean Joseph was born at Bulle,
  Canton Fribourg (Switzerland), where the family had a way-station before the 1819 emigration.
  The Fribourg footprint of the line runs through his wife Jeanne Germaine Caroline (from Bulle),
  not through Frédéric himself. [LEAD — Raibert Rutschmann blog]

  - **[INFERRED]** He is known only through his son's 1840 Nova Friburgo marriage act, where he is
  recorded as "Frederico Rosman" — the Portuguese phonetic rendering of the Swiss-German
  Rutschmann. He never appears in any Brazilian record as a present individual: he is known to us
  only because his son named him in Brazil.

  - **[LEAD]** A secondary source reports that Frédéric died before or during the 1819 emigration
  voyage — in transit — meaning he never reached Brazil. His children arrived at Nova Friburgo as
  orphans aboard the ship *Urania*, without either parent.

  ## Identity

  **Frédéric Rutschmann** — recorded as "Frederico Rosman", the father of the Swiss immigrant
  João José Rutschmann (P-0109); named in his son's 1840 Nova Friburgo marriage (PAR-0076,
  family F-0060). [STRONG-EVIDENCE] A direct ancestor of Iris Bohrer Muniz (P-0007) five
  generations up (a 3×-great-grandfather), via João José → Maria Joanna Rutschmann (P-0037) →
  Lucinda (P-0031) → Celina (P-0015).

  From Bergöschingen, Klettgau, Baden-Württemberg (Germany); his son was "nascido e baptizado na
  freguesia de Bulle na Suissa" (Bulle, Canton Fribourg), recording the family's Fribourg
  way-station. Frédéric's own nationality is left unset — the Bulle birthplace of his son fixes
  the family's Swiss passage-point, not Frédéric's own origin. [LEAD]

  ## Open questions

  - His own birth, death and origin records — no held primary. [OPEN]

  - The maiden surname of his wife Jeanne Germaine Caroline (P-0120). [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (his son João José's 1840 Nova Friburgo marriage — the sole held record naming him,
  as "Frederico Rosman").
profile_pt: >-
  ## Fatos interessantes

  - **[LEAD]** Natural de Bergöschingen, Klettgau, Baden-Württemberg (Alemanha) — origem da
  família; ⚠️ NÃO Alsácia (ponto corrigido, presente em algumas árvores). Seu filho Jean Joseph
  nasceu em Bulle, Cantão de Friburgo (Suíça), onde a família fez uma escala antes da emigração
  de 1819. O vínculo friburguês da linha pertence à esposa Jeanne Germaine Caroline (natural de
  Bulle), não ao próprio Frédéric. [LEAD — blog Raibert Rutschmann]

  - **[INFERRED]** É conhecido apenas pelo assento de casamento de seu filho em 1840 em Nova
  Friburgo, onde aparece registrado como "Frederico Rosman" — a transcrição fonética em português
  do nome suíço-alemão Rutschmann. Nunca aparece em nenhum registro brasileiro como indivíduo
  presente: chegamos a conhecê-lo apenas porque seu filho o nomeou no Brasil.

  - **[LEAD]** Uma fonte secundária relata que Frédéric faleceu antes ou durante a viagem de
  emigração de 1819 — em trânsito — o que significa que nunca chegou ao Brasil. Seus filhos
  chegaram a Nova Friburgo como órfãos no navio *Urania*, sem nenhum dos pais.

  ## Identidade

  **Frédéric Rutschmann** — registrado como "Frederico Rosman", pai do imigrante suíço João José
  Rutschmann (P-0109); nomeado no casamento de 1840 do filho em Nova Friburgo (PAR-0076, família
  F-0060). [STRONG-EVIDENCE] Um ancestral direto de Iris Bohrer Muniz (P-0007) cinco gerações
  acima (3×-bisavô), por João José → Maria Joanna Rutschmann (P-0037) → Lucinda (P-0031) →
  Celina (P-0015).

  Natural de Bergöschingen, Klettgau, Baden-Württemberg (Alemanha); seu filho foi "nascido e
  baptizado na freguesia de Bulle na Suissa" (Bulle, Cantão de Friburgo), registrando a escala
  friburguesa da família. A nacionalidade do próprio Frédéric fica em branco — o local de
  nascimento do filho em Bulle registra a passagem suíça da família, não a origem de Frédéric.
  [LEAD]

  ## Questões em aberto

  - Seus próprios registros de nascimento, óbito e origem — nenhum primário disponível. [OPEN]

  - O sobrenome de solteira de sua esposa Jeanne Germaine Caroline (P-0120). [OPEN]

  ## Fontes disponíveis (neste repositório)

