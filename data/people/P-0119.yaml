profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** His son João José was "nascido e baptizado na freguesia de Bulle na Suissa" — placing the Rutschmann family in Bulle, Canton Fribourg, the canton from which Nova Friburgo took its name. Frédéric therefore belongs to the very community at the source of the 1818–1820 recruitment that founded the Brazilian colony.

  - **[INFERRED]** He is known only through his son's 1840 Nova Friburgo marriage act, where he is recorded as "Frederico Rosman" — the Portuguese phonetic rendering of the Swiss-German Rutschmann. He never appears in any Brazilian record as a present individual: he is known to us only because his son named him in Brazil.

  - **[CONTEXTUAL]** A secondary source reports that Frédéric died before or during the 1819 emigration voyage — either before departure or in transit — meaning he may never have reached Brazil. If accurate, his son João José arrived at Nova Friburgo without either parent, an orphan of approximately 19.

  ## Identity

  **Frédéric Rutschmann** — recorded as "Frederico Rosman", the father of the Swiss immigrant
  João José Rutschmann (P-0109); named in his son's 1840 Nova Friburgo marriage (PAR-0076,
  family F-0060). [STRONG-EVIDENCE] A direct ancestor of Iris Bohrer Muniz (P-0007) five
  generations up (a 3×-great-grandfather), via João José → Maria Joanna Rutschmann (P-0037) →
  Lucinda (P-0031) → Celina (P-0015).

  The son was "nascido e baptizado na freguesia de Bulle na Suissa", so the family is of Bulle,
  Fribourg (Switzerland); Frédéric's own birthplace is not separately stated, so his nationality
  is left unset. [CONTEXTUAL]

  ## Open questions

  - His own birth, death and origin records — no held primary. [OPEN]

  - The maiden surname of his wife Jeanne Germaine Caroline (P-0120). [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (his son João José's 1840 Nova Friburgo marriage — the sole held record naming him,
  as "Frederico Rosman").
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Seu filho João José foi "nascido e baptizado na freguesia de Bulle na Suissa" — situando a família Rutschmann em Bulle, Cantão de Friburgo, o cantão de onde Nova Friburgo tirou seu nome. Frédéric pertence, portanto, à própria comunidade que esteve na origem do recrutamento de 1818–1820 que fundou a colônia brasileira.

  - **[INFERRED]** É conhecido apenas pelo assento de casamento de seu filho em 1840 em Nova Friburgo, onde aparece registrado como "Frederico Rosman" — a transcrição fonética em português do nome suíço-alemão Rutschmann. Nunca aparece em nenhum registro brasileiro como indivíduo presente: chegamos a conhecê-lo apenas porque seu filho o nomeou no Brasil.

  - **[CONTEXTUAL]** Uma fonte secundária relata que Frédéric faleceu antes ou durante a viagem de emigração de 1819 — antes da partida ou em trânsito —, o que significa que pode nunca ter chegado ao Brasil. Se correto, seu filho João José chegou a Nova Friburgo sem nenhum dos pais, órfão com cerca de 19 anos.

  ## Identidade

  **Frédéric Rutschmann** — registrado como "Frederico Rosman", pai do imigrante suíço João José
  Rutschmann (P-0109); nomeado no casamento de 1840 do filho em Nova Friburgo (PAR-0076, família
  F-0060). [STRONG-EVIDENCE] Um ancestral direto de Iris Bohrer Muniz (P-0007) cinco gerações
  acima (3×-bisavô), por João José → Maria Joanna Rutschmann (P-0037) → Lucinda (P-0031) →
  Celina (P-0015).

  O filho foi "nascido e baptizado na freguesia de Bulle na Suissa", portanto a família é de
  Bulle, Friburgo (Suíça); o próprio local de nascimento de Frédéric não é declarado, de modo que
  sua nacionalidade fica em branco. [CONTEXTUAL]

