- text: >-
    Father of João José Rutschmann (P-0109); named "Frederico Rosman" in his son's 1840 Nova Friburgo marriage (PAR-0076), family F-0060. The son was "nascido e baptizado na freguesia de Bulle na Suissa", so the family is of Bulle, Fribourg (Switzerland); Frédéric's own birthplace is not separately stated, so nationality is left unset. Clearly deceased.
profile: >-
  ## Interesting facts

  - **[PROVEN]** He exists in this archive because his son named him in Brazil, twenty-one years
  after he was last alive to be counted. The 1840 Nova Friburgo marriage of João José Rutschmann
  records the groom as "filho legitimo de **Frederico Rosman** e de Joanna Germana Carolina" —
  one clause, in a Portuguese register, on another continent. (PAR-0076)

  - **[LEAD] ⚠ Two corrections to carry forward.** The family's origin is placed at
  **Bergöschingen, in the Klettgau (Baden-Württemberg, Germany)** — **not Alsace**, which
  appears in some collaborative trees, and **not Fribourg**, which is where his son was born but
  not where the Rutschmanns came from. Both errors are common and both should be actively
  contradicted wherever they surface.

  - **[LEAD]** The same research material reports that he died in 1819, in transit, during the
  emigration — so he never reached Brazil. His children are said to have arrived at Nova
  Friburgo aboard the *Urania* as orphans, both parents lost on the way. If true, he is the
  migration rather than a migrant: the family's entire Brazilian existence begins with his
  death.

  - **[CONTEXTUAL / INFERRED]** The Fribourg connection in this couple runs through his wife,
  not through him. Jeanne Germaine Caroline (P-0120) is placed at Bulle, and their son was born
  and baptised at Bulle in 1800 — which is why "Rutschmann of Fribourg" is a convenient
  shorthand and a false ancestry. Bulle was a way-station, not the origin.

  ## Identity

  **Frédéric Rutschmann**, written **"Frederico Rosman"** — the father of the Swiss immigrant
  João José Rutschmann (P-0109), named once, in his son's 1840 Nova Friburgo marriage act. Iris
  Bohrer Muniz's (P-0007) 3×-great-grandfather, by the chain João José → Maria Joanna Rutschmann
  (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer (P-0015). [PROVEN that he is
  named; degree derived from the family links]

  - **Named in one record:** PAR-0076, 23 June 1840, as the father of the groom and husband of
  Joanna Germana Carolina; family F-0060. [PROVEN]

  - **Origin:** Bergöschingen, Klettgau, Baden-Württemberg. Not stated in any held record — his
  son's Bulle birthplace fixes only where the family then was. [LEAD]

  - **Death:** reported in 1819, in transit, before reaching Brazil. No held record touches it.
  [LEAD]

  - **Nationality:** left unset. The held record gives his son's birthplace, not his own, and
  the Baden origin is a lead. [OPEN by decision]

  ## Standing and profession

  Nothing whatever is documented. He has no occupation, property, title or signature in any
  source held here, and he is not recorded as present at any event in Brazil. He is a name
  inside someone else's marriage act.

  ## Family and social network

  One couple and one child are all the held evidence gives: Frédéric Rutschmann and Jeanne
  Germaine Caroline (P-0120), parents of João José Rutschmann, who married Elisabeth Storck at
  the Matriz de São João Baptista, Nova Friburgo, on 23 June 1840 before the coadjutor João José
  Vivianno. [PROVEN — PAR-0076] The secondary material adds a second son, Nicolas, said to have
  died aboard the *Urania* in October 1819; no held record names him. [LEAD]

  ## What we can extrapolate

  - **[CONTEXTUAL]** The 1819 emigration to Nova Friburgo was catastrophic in transit: the fleet
  left the North Sea ports after an overland journey from Estavayer-le-Lac via Basel and
  Rotterdam, and roughly a quarter of some 1,700–2,000 emigrants died of typhus and scurvy, some
  in the Dutch ports before sailing. A couple dying on that route is not an extraordinary claim;
  it is the statistically ordinary outcome for about one family in four.

  - **[INFERRED]** If both parents did die, the consequence for this line is concrete rather
  than sentimental. Their son arrived with no adults, no colonist lot in the family's name and
  no inheritance, and did not marry for twenty years. That is the kind of start that shows up
  two generations later as a household with no property to divide.

  - **[CONTEXTUAL]** A Baden family passing through Fribourg before joining a Fribourg-organised
  colony is a reminder that the recruitment was not confined to Swiss subjects, and that "Swiss
  colony" describes an administrative scheme rather than a population.

  ## Open questions

  - His own birth, marriage and death records. A Bergöschingen (Klettgau, Baden) parish or civil
  register would test the origin and give his own parents; nothing here reaches beyond him.
  [OPEN]

  - Confirmation of the 1819 death in transit, and of the *Urania* passage that reportedly
  carried his orphaned children. A Swiss emigration list or the ship's manifest would settle
  both. [LEAD]

  - His wife's maiden surname, which the 1840 act does not give. [OPEN]

  - His nationality, left unset on purpose because no held record states where he was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0076** — his son João José's 1840 Nova Friburgo marriage act to Isabella Storck; the
  sole held record naming him, as "Frederico Rosman", husband of Joanna Germana Carolina.

  ## Regional and migration context

  Bergöschingen lies in the Klettgau, on the Hochrhein in what is now Baden-Württemberg — German
  territory on the Swiss border, a few hours from Fribourg and a world away from Alsace. [LEAD
  for the family's presence there] The colonisation scheme that carried his children away was
  Dom João VI's: decreed on 16 May 1818 and contracted to the Fribourg agent Gachet for 100
  Swiss Catholic families at the Fazenda do Morro Queimado, it recruited far beyond its brief,
  drawing some 261–265 families from Fribourg, Solothurn, Valais, Bern and German-speaking areas
  nearby. [CONTEXTUAL] The first ship reached Rio on 4 November 1819; the colony became Vila de
  Nova Friburgo on 3 January 1820. What greeted the survivors was poor mountain land, and many
  left it within a few years. [CONTEXTUAL]

  ## Where to go today

  - **Kath. Filialkirche St. Mariä Opferung, Bergöschingen** — Ortsstraße 11, 79801 Hohentengen
  am Hochrhein, Landkreis Waldshut, Baden-Württemberg, Germany ·
  [Maps](https://maps.google.com/?q=47.5955,8.4218). The reported origin parish of the
  Rutschmann family — in the Klettgau, not Alsace. Bergöschingen is today a district of
  Hohentengen am Hochrhein and the church still stands. [APPROX — the origin is a LEAD]

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Canton Fribourg, Switzerland ·
  [Maps](https://maps.google.com/?q=46.6175,7.0581). Not his birthplace, but where his son was
  born and baptised in 1800 and where his wife's family is placed. The Bulle register is the
  realistic route to his marriage record. [RESOLVED as his son's parish]

  - **Died in transit, 1819 — no burial place.** He is reported among the emigrants lost on the
  journey. No cemetery or site is recorded, so there is nothing to visit. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele existe neste arquivo porque o filho o nomeou no Brasil, vinte e um anos
  depois de ele ter sido visto vivo pela última vez. O casamento de 1840, em Nova Friburgo, de
  João José Rutschmann registra o noivo como "filho legitimo de **Frederico Rosman** e de Joanna
  Germana Carolina" — uma cláusula, num livro em português, noutro continente. (PAR-0076)

  - **[LEAD] ⚠ Duas correções a manter.** A origem da família é situada em **Bergöschingen, no
  Klettgau (Baden-Württemberg, Alemanha)** — **não na Alsácia**, que aparece em algumas árvores
  colaborativas, e **não em Friburgo**, onde o filho nasceu mas de onde os Rutschmann não
  vieram. Os dois erros são comuns e ambos devem ser ativamente contraditados onde quer que
  surjam.

  - **[LEAD]** O mesmo material de pesquisa relata que ele morreu em 1819, em trânsito, durante
  a emigração — portanto nunca chegou ao Brasil. Diz-se que seus filhos chegaram a Nova Friburgo
  a bordo do *Urania* como órfãos, tendo perdido ambos os pais no caminho. Se verdadeiro, ele é
  a migração, e não um migrante: toda a existência brasileira da família começa com a sua morte.

  - **[CONTEXTUAL / INFERRED]** A ligação com Friburgo, neste casal, passa pela esposa, não por
  ele. Jeanne Germaine Caroline (P-0120) é situada em Bulle, e o filho dos dois nasceu e foi
  batizado em Bulle em 1800 — razão pela qual "Rutschmann de Friburgo" é atalho conveniente e
  ascendência falsa. Bulle foi escala, não origem.

  ## Identidade

  **Frédéric Rutschmann**, grafado **"Frederico Rosman"** — pai do imigrante suíço João José
  Rutschmann (P-0109), nomeado uma única vez, no assento de casamento do filho, em 1840, em Nova
  Friburgo. Tetravô de Iris Bohrer Muniz (P-0007), pela cadeia João José → Maria Joanna
  Rutschmann (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer (P-0015). [PROVEN que
  é nomeado; grau derivado dos vínculos familiares]

  - **Nomeado em um registro:** PAR-0076, 23 de junho de 1840, como pai do noivo e marido de
  Joanna Germana Carolina; família F-0060. [PROVEN]

  - **Origem:** Bergöschingen, Klettgau, Baden-Württemberg. Não declarada em nenhum documento
  retido — o nascimento do filho em Bulle fixa apenas onde a família então estava. [LEAD]

  - **Óbito:** relatado em 1819, em trânsito, antes de chegar ao Brasil. Nenhum documento retido
  o toca. [LEAD]

  - **Nacionalidade:** deixada em aberto. O documento retido dá o local de nascimento do filho,
  não o dele, e a origem em Baden é pista. [OPEN por decisão]

  ## Posição social e profissão

  Absolutamente nada está documentado. Não tem ocupação, propriedade, título ou assinatura em
  qualquer fonte retida aqui, e não é registrado como presente em nenhum evento no Brasil. É um
  nome dentro do assento de casamento de outra pessoa.

  ## Família e rede social

  Um casal e um filho são tudo o que as evidências retidas fornecem: Frédéric Rutschmann e
  Jeanne Germaine Caroline (P-0120), pais de João José Rutschmann, que se casou com Elisabeth
  Storck na Matriz de São João Baptista, em Nova Friburgo, em 23 de junho de 1840, perante o
  coadjutor João José Vivianno. [PROVEN — PAR-0076] O material secundário acrescenta um segundo
  filho, Nicolas, que teria morrido a bordo do *Urania* em outubro de 1819; nenhum documento
  retido o nomeia. [LEAD]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** A emigração de 1819 para Nova Friburgo foi catastrófica em trânsito: a
  frota partiu dos portos do Mar do Norte após uma viagem terrestre de Estavayer-le-Lac por
  Basileia e Roterdã, e cerca de um quarto dos 1.700 a 2.000 emigrantes morreu de tifo e
  escorbuto, alguns nos portos holandeses antes mesmo de zarpar. Um casal morrer nessa rota não
  é afirmação extraordinária; é o desfecho estatisticamente ordinário para cerca de uma família
  em quatro.

  - **[INFERRED]** Se ambos os pais de fato morreram, a consequência para esta linha é concreta,
  e não sentimental. O filho chegou sem adultos, sem lote de colono em nome da família e sem
  herança, e só se casou vinte anos depois. É o tipo de partida que reaparece duas gerações
  adiante como um domicílio sem bens a dividir.

  - **[CONTEXTUAL]** Uma família de Baden passando por Friburgo antes de aderir a uma colônia
  organizada por Friburgo lembra que o recrutamento não se restringia a súditos suíços, e que
  "colônia suíça" descreve um programa administrativo, não uma população.

  ## Questões em aberto

  - Seus próprios registros de nascimento, casamento e óbito. Um livro paroquial ou civil de
  Bergöschingen (Klettgau, Baden) testaria a origem e daria seus próprios pais; nada aqui
  alcança além dele. [OPEN]

  - Confirmação da morte em trânsito, em 1819, e da travessia do *Urania* que teria levado seus
  filhos órfãos. Uma lista de emigração suíça ou o manifesto do navio resolveria ambas. [LEAD]

  - O sobrenome de solteira da esposa, que o ato de 1840 não fornece. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — assento de casamento de 1840, em Nova Friburgo, do filho João José com
  Isabella Storck; o único documento retido que o nomeia, como "Frederico Rosman", marido de
  Joanna Germana Carolina.

  ## Contexto regional e migratório

  Bergöschingen fica no Klettgau, no Alto Reno, no que é hoje Baden-Württemberg — território
  alemão na fronteira suíça, a poucas horas de Friburgo e a um mundo de distância da Alsácia.
  [LEAD quanto à presença da família ali] O programa de colonização que levou seus filhos foi o
  de Dom João VI: decretado em 16 de maio de 1818 e contratado com o agente friburguês Gachet
  para 100 famílias católicas suíças na Fazenda do Morro Queimado, recrutou muito além do
  previsto, atraindo cerca de 261–265 famílias de Friburgo, Solothurn, Valais, Berna e áreas
  germanófonas vizinhas. [CONTEXTUAL] O primeiro navio chegou ao Rio em 4 de novembro de 1819; a
  colônia tornou-se Vila de Nova Friburgo em 3 de janeiro de 1820. O que recebeu os
  sobreviventes foi terra de montanha pobre, e muitos a deixaram em poucos anos. [CONTEXTUAL]

  ## Onde ir hoje

  - **Kath. Filialkirche St. Mariä Opferung, Bergöschingen** — Ortsstraße 11, 79801 Hohentengen
  am Hochrhein, distrito de Waldshut, Baden-Württemberg, Alemanha ·
  [Mapa](https://maps.google.com/?q=47.5955,8.4218). A freguesia de origem relatada da família
  Rutschmann — no Klettgau, não na Alsácia. Bergöschingen é hoje um distrito de Hohentengen am
  Hochrhein e a igreja continua de pé. [APPROX — a origem é LEAD]

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Cantão de Fribourg, Suíça ·
  [Mapa](https://maps.google.com/?q=46.6175,7.0581). Não é seu local de nascimento, mas é onde o
  filho nasceu e foi batizado em 1800 e onde se situa a família da esposa. O livro de Bulle é a
  via realista para seu registro de casamento. [RESOLVED como freguesia do filho]

  - **Morto em trânsito, 1819 — sem lugar de sepultamento.** Consta entre os emigrantes perdidos
  na viagem. Nenhum cemitério ou sítio é registrado, de modo que não há o que visitar.
  [UNLOCATED]
