profile: >-
  ## Identity

  **Perpétua da Silva** [PROVEN] — named as a paternal grandmother in her granddaughter
  Maria's 1777 Piracatu baptism (PAR-0025). Per that record and family F-0031 she is the
  **mother** of Alferes Amaro da Silva Xavier (P-0059) and the wife of Amaro da Silva
  Barreto (P-0064) — Mathilde Maria de Jesus's grandmother.

  - **Origin:** natural da Cidade de São Paulo (colonial São Paulo) [PROVEN]. Nationality
  Brazilian.

  - Her own birth, marriage and death records are not located as primaries.

  ## Parentage — a probable lead (published genealogy), not promoted to the tree

  A well-sourced published paulista genealogy — Silva Leme's *Genealogia Paulistana* (1903–05),
  Título "Dultras Machados", Cap. 1º §10º — identifies her, with strong probability, as
  **Perpetua Dultra, the tenth and youngest child of Manoel Dultra Machado (Capitão-mor, d. 1752
  at S. Bernardo) × Marianna Machado**, of the Mogi das Cruzes / S. Bernardo (SP) *Dultras
  Machados* family. The entry records her "*falecida antes do pai … casada … faleceu nas minas de
  Goiás … 4 filhos: Rosalia, Francisco, Marianna e um cujo nome se ignora*" — almost certainly
  drawn from her father's 1752 inventário. [PROBABLE — a published secondary, corroborated but
  not primary-confirmed; deliberately NOT promoted to the structured parents/family here.]

  - **Why the identification is probable (convergent, not name-alone):** (1) a *double Goiás
  anchor* — Silva Leme independently has her die "nas minas de Goiás", and our son Amaro da Silva
  Xavier is PROVEN "natural de Meia Ponte, Comarca de Goiás" (her death-place = his birth-place);
  (2) "da Silva" is native to the family (her paternal grandmother was Maria da Silva; siblings
  appear as Maria Dultra da Silva, Rosa Maria da Silva, etc.), so our "Perpétua da Silva" is the
  same person as Silva Leme's "Perpetua Dultra" under the family's alternate surname; (3) the
  chronology fits (Amaro born ~1748–1751, Perpétua dead before 1752); (4) the FamilySearch-tree
  sibling set matches Silva Leme's ten children one-for-one. An earlier "generation-compression"
  worry is refuted — she is a direct daughter, not a granddaughter.

  - **Why it is only probable, not proven:** Silva Leme names neither her husband (our Sargento
  Amaro da Silva Barreto) nor our son Amaro among the four children — Amaro is most likely the
  unnamed fourth, which would make the three named children (Rosalia, Francisco, Marianna) his
  siblings [LEAD]. The documentary nail is still open. Consequently her death (before 1752, in
  the Goiás mines) and her birth (~1710s–1720s, as the youngest of ten) also rest on this
  probable lead, not on a held primary. [PROBABLE / INFERRED]

  ## What we can extrapolate

  The colonial-São Paulo anchor of the Silva-Barreto couple — a São Paulo-city woman married
  to a Guimarães-born (Portugal) husband; her "da Silva" surname feeds her son's "da Silva
  Xavier." [INFERRED]

  - **Deeper roots, if the Dultra parentage holds** [PROBABLE, via Silva Leme]: the *Dultras
  Machados* carry the line back to the Açores (ilha de S. Miguel — the tronco Manoel Dultra
  Machado o velho, d. São Paulo 1711) on the paternal side and to Sardoal, Portugal (Matheus
  Machado Castanho) on the maternal side — an early-1600s Açorean-settler + continental-Portuguese
  couple whose descendants were bandeirante-era Mogi das Cruzes / S. Bernardo landholders, of whom
  Perpétua is the branch that peeled off to the Goiás mining frontier. This whole ascent is
  contingent on the probable identification above.

  ## Open questions

  - The one document that would lift her Dultra parentage from probable to proven: a primary
  tying her marriage/children to her parents — most likely Amaro da Silva Xavier's own Meia Ponte
  / Goiás baptism (~1748–1751), or Perpétua's own Mogi das Cruzes / São Paulo baptism (~1710s–
  1720s), or her father Manoel Dultra Machado's 1752 S. Bernardo inventário (the source Silva Leme
  drew on). The Goiás baptism is largely unindexed (browse-film / archive request); the São Paulo
  marriage of the couple was a bounded negative in the indexed FamilySearch corpus. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of her granddaughter Maria — the only held record that
  names her, giving her São Paulo origin and her husband). The Dultra parentage above rests on a
  published secondary (Silva Leme's *Genealogia Paulistana*), not on a held image.

  ## Regional and migration context

  From the Cidade de São Paulo; her descendants moved on to Meia Ponte (Goiás), Paracatú and
  Barbacena. She anchors the colonial-São Paulo end of this couple, her husband the
  NW-Portugal (Guimarães) end. [CONTEXTUAL] This branch belongs to the broader 18th-century
  Minho → colonial São Paulo → Minas/Goiás-frontier stream: Minho-immigrant men (Guimarães,
  Viana) marrying propertied paulista women — she is one such wife — their children riding the
  gold-and-cattle frontier São Paulo → Goiás/Paracatú → Barbacena. The Minho was Europe's densest
  rural minifúndio (~96 inhabitants/km² by 1801) and the greatest 18th-century source of
  Portuguese emigration to Brazil; movement to the goldfields ran under the Provisão de 20 de
  março de 1720 passport regime, and frontier land under the sesmaria system. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Perpétua da Silva** [PROVEN] — nomeada como avó paterna no batismo de 1777 de sua neta
  Maria em Piracatu (PAR-0025). Conforme esse registro e a família F-0031, ela é a **mãe**
  de Alferes Amaro da Silva Xavier (P-0059) e a esposa de Amaro da Silva Barreto (P-0064) —
  avó de Mathilde Maria de Jesus.

  - **Origem:** natural da Cidade de São Paulo (São Paulo colonial) [PROVEN]. Nacionalidade
  brasileira.

  - Seus próprios registros de nascimento, casamento e óbito não foram localizados como
  primários.

  ## Filiação — uma pista provável (genealogia publicada), não promovida à árvore

  Uma genealogia paulista publicada e bem fundamentada — a *Genealogia Paulistana* de Silva Leme
  (1903–05), Título "Dultras Machados", Cap. 1º §10º — a identifica, com forte probabilidade,
  como **Perpetua Dultra, a décima e mais nova filha de Manoel Dultra Machado (Capitão-mor,
  falecido em 1752 em S. Bernardo) × Marianna Machado**, da família *Dultras Machados* de Mogi
  das Cruzes / S. Bernardo (SP). O verbete a registra "*falecida antes do pai … casada … faleceu
  nas minas de Goiás … 4 filhos: Rosalia, Francisco, Marianna e um cujo nome se ignora*" — quase
  certamente extraído do inventário de 1752 de seu pai. [PROBABLE — uma fonte secundária
  publicada, corroborada mas não confirmada por primário; deliberadamente NÃO promovida à
  filiação/família estruturada aqui.]

  - **Por que a identificação é provável (convergente, não só pelo nome):** (1) uma *dupla
  âncora em Goiás* — Silva Leme, de forma independente, a faz morrer "nas minas de Goiás", e nosso
  filho Amaro da Silva Xavier é PROVEN "natural de Meia Ponte, Comarca de Goiás" (o local de óbito
  dela = o local de nascimento dele); (2) "da Silva" é próprio da família (sua avó paterna era
  Maria da Silva; irmãos aparecem como Maria Dultra da Silva, Rosa Maria da Silva, etc.), de modo
  que nossa "Perpétua da Silva" é a mesma pessoa que a "Perpetua Dultra" de Silva Leme sob o
  sobrenome alternativo da família; (3) a cronologia condiz (Amaro nascido ~1748–1751, Perpétua
  falecida antes de 1752); (4) o conjunto de irmãos na árvore do FamilySearch corresponde um a um
  aos dez filhos de Silva Leme. Uma preocupação anterior de "compressão de gerações" está refutada
  — ela é filha direta, não neta.

  - **Por que é apenas provável, não provada:** Silva Leme não nomeia nem seu marido (nosso
  Sargento Amaro da Silva Barreto) nem nosso filho Amaro entre os quatro filhos — Amaro é muito
  provavelmente o quarto sem nome, o que faria dos três filhos nomeados (Rosalia, Francisco,
  Marianna) seus irmãos [LEAD]. A comprovação documental ainda está em aberto. Por consequência,
  seu óbito (antes de 1752, nas minas de Goiás) e seu nascimento (~1710s–1720s, como a mais nova
  de dez) também se apoiam nesta pista provável, e não num primário disponível. [PROBABLE /
  INFERRED]

  ## O que podemos extrapolar

  A âncora da São Paulo colonial no casal Silva-Barreto — uma mulher da cidade de São Paulo
  casada com um marido nascido em Guimarães (Portugal); seu sobrenome "da Silva" alimenta o
  "da Silva Xavier" de seu filho. [INFERRED]

  - **Raízes mais profundas, se a filiação Dultra se confirmar** [PROBABLE, via Silva Leme]: os
  *Dultras Machados* levam a linha de volta aos Açores (ilha de S. Miguel — o tronco Manoel Dultra
  Machado o velho, falecido em São Paulo em 1711) no lado paterno e a Sardoal, Portugal (Matheus
  Machado Castanho) no lado materno — um casal de colono açoriano + português continental do
  início do século XVII, cujos descendentes foram proprietários de terras de Mogi das Cruzes / S.
  Bernardo na era bandeirante, dos quais Perpétua é o ramo que se desprendeu para a fronteira
  mineradora de Goiás. Toda essa ascendência está condicionada à identificação provável acima.

  ## Questões em aberto

  - O documento que elevaria sua filiação Dultra de provável a provada: um primário que ligue seu
  casamento/filhos aos seus pais — muito provavelmente o próprio batismo de Amaro da Silva Xavier
  em Meia Ponte / Goiás (~1748–1751), ou o batismo da própria Perpétua em Mogi das Cruzes / São
  Paulo (~1710s–1720s), ou o inventário de 1752 de seu pai Manoel Dultra Machado em S. Bernardo (a
  fonte de que Silva Leme se valeu). O batismo em Goiás é em grande parte não indexado (microfilme
  para navegação / solicitação a arquivo); o casamento do casal em São Paulo foi um resultado
  negativo delimitado no acervo indexado do FamilySearch. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu de sua neta Maria — o único registro disponível
  que a nomeia, informando sua origem em São Paulo e seu marido). A filiação Dultra acima
  apoia-se numa fonte secundária publicada (a *Genealogia Paulistana* de Silva Leme), não numa
  imagem disponível.

  ## Contexto regional e migratório

  Da Cidade de São Paulo; seus descendentes seguiram para Meia Ponte (Goiás), Paracatú e
  Barbacena. Ela ancora a ponta da São Paulo colonial deste casal, seu marido a ponta do
  noroeste de Portugal (Guimarães). [CONTEXTUAL] Este ramo pertence à corrente mais ampla do
  século XVIII, do Minho → São Paulo colonial → fronteira de Minas/Goiás: homens imigrantes do
  Minho (Guimarães, Viana) casando-se com mulheres paulistas proprietárias — ela é uma dessas
  esposas — seus filhos cavalgando a fronteira do ouro e do gado, de São Paulo → Goiás/Paracatú →
  Barbacena. O Minho era o minifúndio rural mais denso da Europa (~96 habitantes/km² por volta de
  1801) e a maior fonte de emigração portuguesa para o Brasil no século XVIII; o deslocamento para
  as minas de ouro corria sob o regime de passaportes da Provisão de 20 de março de 1720, e a
  terra de fronteira sob o sistema de sesmarias. [CONTEXTUAL]
