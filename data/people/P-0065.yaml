profile: >-
  ## Interesting facts

  - **[PROVEN]** She is documented in a single record — her granddaughter's 1777 Piracatu baptism (PAR-0025) — named "Perpétua da Silva, natural da Cidade de S. Paulo". That one clause fixes her origin from a primary source and is the whole of what is proven about her.

  - **[CONTEXTUAL]** Born in the principal city of a captaincy then known for its bandeirante-era land grants and its role as the gateway to the Brazilian interior — a social world sharply distinct from her Minho-born husband's.

  - **[INFERRED]** A published paulista genealogy identifies her, with high probability, as Perpetua Dultra, youngest of the ten children of Capitão-mor Manoel Dultra Machado of Mogi das Cruzes. If that holds she is the one person in this cluster whose standing was *inherited* rather than earned — and the only one with a documented death-place.

  - **[CONTEXTUAL]** Silva Leme records that she died "nas minas de Goiás", and her son Amaro da Silva Xavier is primary-attested born at Meia Ponte, Goiás. Her death-place and her son's birthplace converge on the same goldfields — the closest we can currently come to an endpoint for her life without a held vital record.

  - **[INFERRED]** Her "da Silva" feeds directly into her son's compound "da Silva Xavier". The surname-doubling preserved both parents' lineages in a single label, so she is the structural origin of the "Silva" element the branch carried forward.

  ## Identity

  **Perpétua da Silva** [PROVEN] — named as a paternal grandmother in her granddaughter Maria's 1777 Piracatu baptism (PAR-0025). Per that record and family F-0031 she is the **mother** of Alferes Amaro da Silva Xavier (P-0059) and the wife of Amaro da Silva Barreto (P-0064) — grandmother of Mathilde Maria de Jesus (P-0027), and so 2nd-great-grandmother of Eliza Balbina de Toledo (P-0017).

  - **Origin:** natural da Cidade de São Paulo (colonial São Paulo) [PROVEN]. Nationality Brazilian.

  - **Birth, marriage and death:** not located as primaries. [OPEN]

  ## Standing and profession

  - **Nothing is recorded of her in her own right** — she appears once, as a named grandmother, wife of a man carrying an abbreviated rank. No occupation, no property, no act of her own. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no held record required her to sign or recorded her as unable to; the verdict is withheld rather than guessed.

  - **What standing she had was her family's, and — if the published identification holds — it was inherited:** the daughter of a Capitão-mor, in a paulista landholding house, marrying an immigrant with a rank and no land. [PROBABLE, see below]

  ## Family and social network

  - **Husband:** Amaro da Silva Barreto (P-0064), of Guimarães, Braga. **Son (our line):** Alferes Amaro da Silva Xavier (P-0059). No other child is attested at primary level.

  - **Parentage — a probable lead from a published genealogy, deliberately NOT promoted to the tree.** Silva Leme's *Genealogia Paulistana* (1903–05), Título "Dultras Machados", Cap. 1º §10º, identifies her with strong probability as **Perpetua Dultra, tenth and youngest child of Manoel Dultra Machado (Capitão-mor, d. 1752 at S. Bernardo) × Marianna Machado**, of the Mogi das Cruzes / S. Bernardo (SP) *Dultras Machados*. The entry reads "*falecida antes do pai … casada … faleceu nas minas de Goiás … 4 filhos: Rosalia, Francisco, Marianna e um cujo nome se ignora*" — almost certainly drawn from her father's 1752 inventário. [PROBABLE — a published secondary, corroborated but not primary-confirmed]

  - **Why the identification is probable (convergent, not name-alone):** a *double Goiás anchor* — Silva Leme independently has her die "nas minas de Goiás" while our son Amaro is PROVEN "natural de Meia Ponte, Comarca de Goiás", so her death-place equals his birthplace; "da Silva" is native to that family (her paternal grandmother was Maria da Silva; siblings appear as Maria Dultra da Silva, Rosa Maria da Silva), so "Perpétua da Silva" and "Perpetua Dultra" are one woman under the family's alternate surname; the chronology fits (Amaro born c.1748–1751, Perpétua dead before 1752); and the FamilySearch-tree sibling set matches Silva Leme's ten children one-for-one. An earlier "generation-compression" worry is refuted — she is a direct daughter, not a granddaughter.

  - **Why it is only probable:** Silva Leme names neither her husband (our Amaro da Silva Barreto) nor our son Amaro among the four children — Amaro is most likely the unnamed fourth, which would make Rosalia, Francisco and Marianna his siblings [LEAD]. The documentary nail is still missing. Her death (before 1752, in the Goiás mines) and her birth (c.1710s–1720s, as the youngest of ten) rest on this lead, not on a held primary. [PROBABLE / INFERRED]

  ## What we can extrapolate

  - **She is the only inherited standing in this cluster — and inherited standing behaves differently** [PROBABLE via Silva Leme / CONTEXTUAL]. Everyone else on the Silva Xavier side built status: a rank climbed, a marriage made, a frontier taken. If she was a Capitão-mor's daughter, she brought hers with her at birth. That is why the marriage works as a transaction at all — an immigrant with a commission and no land, matched to a colonial daughter with land and no need of a commission.

  - **Her wealth was a quota, not an income — and partible succession had already thinned it before she died** [PROBABLE / CONTEXTUAL]. She was the *tenth of ten* children. Whatever the Capitão-mor's estate was worth, her share was a tenth of it before it was touched again; and because she predeceased her father, that tenth passed by representation to her own four children, splitting to roughly a fortieth apiece. This is Brazilian partible inheritance visible in a single named sequence: ten ways, then four ways, in one generation. What reached the Goiás household was a lump sum, once, not a revenue.

  - **The move to the mines was a bet, and in comfort terms a step down** [INFERRED / CONTEXTUAL]. Leaving the São Paulo / Mogi world of established landholding for a mining camp in Goiás meant trading a settled house for a frontier one. Her generation made that trade because a tenth-share of a paulista estate could not support a household, whereas the goldfields still offered claims, sesmarias and office to those who went. She died there; her son converted the bet into a militia commission.

  - **Education: not purchasable for her, and not offered** [CONTEXTUAL]. Schooling was a class-linked private good in colonial Brazil, and for women of even propertied houses it was rarely bought at all. Her verdict is unclassifiable because nothing in the archive ever asked her to write — which is itself the structural answer.

  - **Deeper roots, if the Dultra parentage holds** [PROBABLE, via Silva Leme]: the *Dultras Machados* carry the line back to the Açores (ilha de S. Miguel — the tronco Manoel Dultra Machado o velho, d. São Paulo 1711) on the paternal side and to Sardoal, Portugal (Matheus Machado Castanho) on the maternal side — an early-1600s Açorean-settler plus continental-Portuguese couple whose descendants were bandeirante-era Mogi das Cruzes / S. Bernardo landholders, with Perpétua as the branch that peeled off to the Goiás mining frontier. The whole ascent is contingent on the identification above and is not in the tree.

  ## Open questions

  - The one document that would lift her Dultra parentage from probable to proven: a primary tying her marriage or children to her parents — most likely her son Amaro's own Meia Ponte / Goiás baptism (c.1748–1751), or her own Mogi das Cruzes / São Paulo baptism (c.1710s–1720s), or her father Manoel Dultra Machado's 1752 S. Bernardo inventário, the source Silva Leme drew on. The Goiás baptism is largely unindexed (browse-film or archive request); the couple's São Paulo marriage was a bounded negative in the indexed FamilySearch corpus. [OPEN]

  - Her own birth and death dates, which currently rest entirely on the published lead. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of her granddaughter Maria — the only held record that names her, giving her São Paulo origin and her husband). The Dultra parentage above rests on a published secondary (Silva Leme's *Genealogia Paulistana*), not on a held image.

  ## Regional and migration context

  From the Cidade de São Paulo; her descendants moved on to Meia Ponte (Goiás), Paracatú and Barbacena. She anchors the colonial-São Paulo end of this couple, her husband the NW-Portugal (Guimarães) end. [CONTEXTUAL] The branch belongs to the broader 18th-century Minho → colonial São Paulo → Minas/Goiás-frontier stream: Minho-immigrant men marrying propertied paulista women — she is one such wife — their children riding the gold-and-cattle frontier from São Paulo to Goiás/Paracatú and on to Barbacena. The Minho was Europe's densest rural minifúndio (~96 inhabitants/km² by 1801) and the greatest 18th-century source of Portuguese emigration to Brazil; movement to the goldfields ran under the Provisão de 20 de março de 1720 passport regime, and frontier land under the sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Birthplace (Cidade de São Paulo):** Pátio do Colégio and Catedral da Sé, São Paulo, SP [APPROX] (the colonial parish is gone) · [Maps](https://www.google.com/maps/search/?api=1&query=P%C3%A1tio%20do%20Col%C3%A9gio%2C%20S%C3%A9%2C%20S%C3%A3o%20Paulo%2C%20SP)

  - **Parents' Dultra-Machado seat (descent probable, not proven):** Catedral de Sant'Ana, Mogi das Cruzes, SP [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20de%20Sant%27Ana%2C%20Mogi%20das%20Cruzes%2C%20SP)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela está documentada em um único registro — o batismo de sua neta no Piracatu, em 1777 (PAR-0025) —, nomeada "Perpétua da Silva, natural da Cidade de S. Paulo". Essa única cláusula fixa sua origem por fonte primária e é tudo o que está provado a seu respeito.

  - **[CONTEXTUAL]** Nascida na principal cidade de uma capitania então conhecida por suas sesmarias da era bandeirante e por seu papel de porta de entrada do interior brasileiro — um mundo social nitidamente distinto do de seu marido, nascido no Minho.

  - **[INFERRED]** Uma genealogia paulista publicada a identifica, com alta probabilidade, como Perpetua Dultra, caçula dos dez filhos do Capitão-mor Manoel Dultra Machado, de Mogi das Cruzes. Se isso se confirmar, ela é a única pessoa deste conjunto cuja posição social foi *herdada* em vez de conquistada — e a única com local de morte documentado.

  - **[CONTEXTUAL]** Silva Leme registra que ela morreu "nas minas de Goiás", e seu filho Amaro da Silva Xavier está atestado por fonte primária como nascido em Meia Ponte, Goiás. Seu local de morte e o local de nascimento do filho convergem nas mesmas lavras — o mais perto que hoje chegamos de um desfecho para sua vida sem um registro vital disponível.

  - **[INFERRED]** Seu "da Silva" alimenta diretamente o composto "da Silva Xavier" do filho. A duplicação de sobrenomes preservava as duas linhagens num só rótulo, de modo que ela é a origem estrutural do elemento "Silva" que o ramo levou adiante.

  ## Identidade

  **Perpétua da Silva** [PROVEN] — nomeada avó paterna no batismo de sua neta Maria, no Piracatu, em 1777 (PAR-0025). Por esse registro e pela família F-0031 ela é a **mãe** do Alferes Amaro da Silva Xavier (P-0059) e esposa de Amaro da Silva Barreto (P-0064) — avó de Mathilde Maria de Jesus (P-0027) e, portanto, trisavó de Eliza Balbina de Toledo (P-0017).

  - **Origem:** natural da Cidade de São Paulo (São Paulo colonial) [PROVEN]. Nacionalidade brasileira.

  - **Nascimento, casamento e óbito:** não localizados como fontes primárias. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado sobre ela em nome próprio** — aparece uma vez, como avó nomeada, esposa de um homem com patente abreviada. Nenhuma ocupação, nenhuma propriedade, nenhum ato seu. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro disponível exigiu sua assinatura nem a declarou incapaz de assinar; o veredito fica suspenso em vez de adivinhado.

  - **A posição que teve era a da família e — se a identificação publicada se sustentar — foi herdada:** filha de Capitão-mor, em casa paulista de proprietários, casada com um imigrante que tinha patente e não tinha terra. [PROBABLE, ver abaixo]

  ## Família e rede social

  - **Marido:** Amaro da Silva Barreto (P-0064), de Guimarães, Braga. **Filho (nossa linha):** Alferes Amaro da Silva Xavier (P-0059). Nenhum outro filho está atestado em nível primário.

  - **Filiação — pista provável de genealogia publicada, deliberadamente NÃO promovida à árvore.** A *Genealogia Paulistana* de Silva Leme (1903–05), Título "Dultras Machados", Cap. 1º §10º, a identifica com forte probabilidade como **Perpetua Dultra, décima e caçula filha de Manoel Dultra Machado (Capitão-mor, f. 1752 em S. Bernardo) × Marianna Machado**, dos *Dultras Machados* de Mogi das Cruzes / S. Bernardo (SP). A entrada diz "*falecida antes do pai … casada … faleceu nas minas de Goiás … 4 filhos: Rosalia, Francisco, Marianna e um cujo nome se ignora*" — quase certamente extraída do inventário de 1752 do pai. [PROBABLE — secundária publicada, corroborada mas não confirmada por fonte primária]

  - **Por que a identificação é provável (convergente, não só pelo nome):** uma *dupla âncora em Goiás* — Silva Leme registra, de modo independente, que ela morreu "nas minas de Goiás", enquanto nosso filho Amaro é PROVEN "natural de Meia Ponte, Comarca de Goiás", de modo que o local de morte dela é o local de nascimento dele; "da Silva" é próprio daquela família (sua avó paterna era Maria da Silva; irmãs aparecem como Maria Dultra da Silva, Rosa Maria da Silva), logo "Perpétua da Silva" e "Perpetua Dultra" são a mesma mulher sob o sobrenome alternativo da casa; a cronologia fecha (Amaro nascido c.1748–1751, Perpétua morta antes de 1752); e o conjunto de irmãos da árvore do FamilySearch corresponde um a um aos dez filhos de Silva Leme. A preocupação anterior com "compressão de geração" está refutada — ela é filha direta, não neta.

  - **Por que é apenas provável:** Silva Leme não nomeia nem o marido dela (nosso Amaro da Silva Barreto) nem nosso filho Amaro entre os quatro filhos — Amaro é muito provavelmente o quarto sem nome, o que faria de Rosalia, Francisco e Marianna seus irmãos [LEAD]. Falta ainda o prego documental. Seu óbito (antes de 1752, nas minas de Goiás) e seu nascimento (c.1710–1720, como caçula de dez) apoiam-se nessa pista, não em fonte primária disponível. [PROBABLE / INFERRED]

  ## O que podemos extrapolar

  - **Ela é a única posição herdada deste conjunto — e posição herdada se comporta de outro modo** [PROBABLE via Silva Leme / CONTEXTUAL]. Todos os demais do lado Silva Xavier construíram status: uma patente galgada, um casamento feito, uma fronteira tomada. Se ela era filha de um Capitão-mor, trouxe o seu de nascença. É por isso que o casamento funciona como transação: um imigrante com provisão e sem terra, pareado a uma filha da colônia com terra e sem necessidade de provisão.

  - **Sua riqueza era uma cota, não uma renda — e a sucessão partível já a havia afinado antes de sua morte** [PROBABLE / CONTEXTUAL]. Ela era a *décima de dez* filhos. Quanto valesse o espólio do Capitão-mor, sua parte era um décimo antes de qualquer nova divisão; e, por ter falecido antes do pai, esse décimo passou por representação aos seus quatro filhos, repartindo-se em cerca de um quarenta avos cada. É a herança partível brasileira visível numa única sequência nomeada: dez partes, depois quatro, numa só geração. O que chegou à casa de Goiás foi uma quantia única, não uma receita.

  - **A ida para as minas foi uma aposta e, em termos de conforto, um passo abaixo** [INFERRED / CONTEXTUAL]. Deixar o mundo estabelecido de São Paulo / Mogi, com suas propriedades, por um arraial minerador em Goiás significava trocar uma casa assentada por uma de fronteira. Sua geração fez essa troca porque um décimo de espólio paulista não sustentava uma casa, ao passo que as lavras ainda ofereciam datas, sesmarias e ofícios a quem fosse. Ela morreu lá; o filho converteu a aposta numa patente miliciana.

  - **Educação: não comprável para ela, e não oferecida** [CONTEXTUAL]. A escolarização era bem privado ligado à classe no Brasil colonial, e para mulheres, mesmo de casas proprietárias, raramente era comprada. Seu veredito é inclassificável porque nada no arquivo jamais lhe pediu que escrevesse — o que já é a resposta estrutural.

  - **Raízes mais fundas, se a filiação Dultra se sustentar** [PROBABLE, via Silva Leme]: os *Dultras Machados* levam a linha aos Açores (ilha de S. Miguel — o tronco Manoel Dultra Machado o velho, f. São Paulo 1711) pelo lado paterno e a Sardoal, Portugal (Matheus Machado Castanho) pelo materno — um casal do início do século XVII, de colono açoriano e portuguesa continental, cujos descendentes foram proprietários da era bandeirante em Mogi das Cruzes / S. Bernardo, sendo Perpétua o ramo que se desgarrou rumo à fronteira mineradora de Goiás. Toda essa ascendência depende da identificação acima e não está na árvore.

  ## Questões em aberto

  - O documento único capaz de elevar sua filiação Dultra de provável a provada: uma fonte primária ligando seu casamento ou seus filhos aos seus pais — muito provavelmente o batismo de seu filho Amaro em Meia Ponte / Goiás (c.1748–1751), ou seu próprio batismo em Mogi das Cruzes / São Paulo (c.1710–1720), ou o inventário de 1752 de seu pai, Manoel Dultra Machado, em S. Bernardo, fonte de que Silva Leme se serviu. O batismo em Goiás está em larga medida não indexado (leitura de filme ou pedido a arquivo); o casamento do casal em São Paulo foi negativo delimitado no corpus indexado do FamilySearch. [OPEN]

  - Suas próprias datas de nascimento e morte, que hoje se apoiam inteiramente na pista publicada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de sua neta Maria no Piracatu, 1777 — o único registro disponível que a nomeia, dando sua origem em São Paulo e seu marido). A filiação Dultra acima se apoia numa secundária publicada (a *Genealogia Paulistana* de Silva Leme), não numa imagem disponível.

  ## Contexto regional e migratório

  Da Cidade de São Paulo; seus descendentes seguiram para Meia Ponte (Goiás), Paracatú e Barbacena. Ela ancora a ponta paulista colonial deste casal, e o marido a ponta do noroeste português (Guimarães). [CONTEXTUAL] O ramo pertence à corrente maior do século XVIII, Minho → São Paulo colonial → fronteira de Minas/Goiás: homens imigrantes do Minho casando-se com paulistas proprietárias — ela é uma dessas esposas —, com os filhos acompanhando a fronteira do ouro e do gado de São Paulo a Goiás/Paracatú e daí a Barbacena. O Minho era o minifúndio rural mais denso da Europa (~96 habitantes/km² em 1801) e a maior fonte setecentista da emigração portuguesa para o Brasil; o deslocamento para as minas corria sob o regime de passaportes da Provisão de 20 de março de 1720, e a terra de fronteira sob o sistema de sesmarias. [CONTEXTUAL]

  ## Onde ir hoje

  - **Local de nascimento (Cidade de São Paulo):** Pátio do Colégio e Catedral da Sé, São Paulo, SP [APPROX] (a paróquia colonial já não existe) · [Maps](https://www.google.com/maps/search/?api=1&query=P%C3%A1tio%20do%20Col%C3%A9gio%2C%20S%C3%A9%2C%20S%C3%A3o%20Paulo%2C%20SP)

  - **Sede dos pais Dultra Machado (descendência provável, não provada):** Catedral de Sant'Ana, Mogi das Cruzes, SP [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20de%20Sant%27Ana%2C%20Mogi%20das%20Cruzes%2C%20SP)
