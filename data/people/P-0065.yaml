notes:
- text: >-
    Paternal grandmother of Alferes Amaro da Silva Xavier (P-0059); named in the 1777
    Piracatu baptism of her granddaughter Maria (PAR-0025) as "Perpétua da Silva,
    natural da Cidade de S. Paulo" (colonial city of São Paulo, Brazil). Wife of Amaro
    da Silva Barreto (P-0064). Her own birth, marriage and death records have not been
    located.
