notes:
- text: >-
    Paternal grandmother of Alferes Amaro da Silva Xavier (P-0059); named in the 1777
    Piracatu baptism of her granddaughter Maria (PAR-0025) as "Perpétua da Silva,
    natural da Cidade de S. Paulo" (colonial city of São Paulo, Brazil). Wife of Amaro
    da Silva Barreto (P-0064). Her own birth, marriage and death records have not been
    located.
  text_pt: >-
    Avó paterna de Alferes Amaro da Silva Xavier (P-0059); nomeada no batismo de
    1777 de sua neta Maria em Piracatu (PAR-0025) como "Perpétua da Silva, natural
    da Cidade de S. Paulo" (cidade colonial de São Paulo, Brasil). Esposa de Amaro
    da Silva Barreto (P-0064). Seus próprios registros de nascimento, casamento e
    óbito não foram localizados.
