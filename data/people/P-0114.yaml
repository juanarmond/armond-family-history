  ## Fatos interessantes

  - **[PROVEN]** Descrito no registro de casamento luterano de Nova Friburgo de 1847 como "dem Schweizer Colonisten Joseph [St]offel" — sua origem suíça e condição de colono são fatos declarados pelo registro, não inferências a partir do sobrenome. É um dos poucos indivíduos neste arquivo cuja identidade suíça é explicitamente atestada pela palavra "Schweizer" na fonte. (PAR-0067)

  - **[CONTEXTUAL]** Sua presença na congregação luterana de Nova Friburgo como colono suíço explícito representa uma minoria dentro de uma minoria: a maioria dos suíços recrutados para Nova Friburgo era católica, de modo que um colono protestante suíço documentado num registro luterano é uma exceção notável ao padrão geral.

  - **[INFERRED]** Dado que sua filha casou em 1847 já adulta, Joseph era provavelmente da geração fundadora de colonos suíços que chegou em 1819–1820 — velho o suficiente na chegada para ter tido filhos que alcançaram a maioridade na década de 1840.

  ## Identidade

  **Joseph Stoffel** — pai de Maria Luiza (Louisa) Stoffel (P-0108), expressamente registrado
  como "Schweizer Colonist" (colono suíço) no registro do casamento luterano de 1847 em Nova
  Friburgo. [PROVEN]

  - **Papel:** pai de Maria Luiza Stoffel (P-0108; família F-0057, nó somente de pai); tetravô
  de Iris Bohrer Muniz na linha Stoffel. [PROVEN]

  - **Origem suíça declarada pelo registro:** o casamento luterano de 1847 (PAR-0067) nomeia-o
  como "dem Schweizer Colonisten Joseph [St]offel" — sua identidade suíça e sua ocupação como
  colono são declaradas pelo registro, não inferidas do sobrenome. [PROVEN]

