profile: >-
  ## Interesting facts

  - **[PROVEN]** Described in the 1847 Nova Friburgo Lutheran marriage register as "dem Schweizer Colonisten Joseph [St]offel" — his Swiss origin and colonist status are record-stated facts, not inferences from his surname. He is one of only a handful of people in this archive whose Swiss identity is explicitly attested by the word "Schweizer" in the source. (PAR-0067)

  - **[CONTEXTUAL]** His presence in the Nova Friburgo Lutheran congregation as an explicit Swiss colonist represents a minority within a minority: most Swiss recruits to Nova Friburgo were Catholic, so a Swiss Protestant colonist documented in a Lutheran register is a notable exception to the general pattern.

  - **[INFERRED]** Given that his daughter married in 1847 as an adult, Joseph was likely among the founding generation of Swiss settlers who arrived 1819–1820 — old enough on arrival to have had children who reached adulthood by the 1840s.

  ## Identity

  **Joseph Stoffel** — father of Maria Luiza (Louisa) Stoffel (P-0108), expressly recorded as
  a "Schweizer Colonist" (Swiss colonist) in the 1847 Lutheran marriage register of Nova Friburgo.
  [PROVEN]

  - **Role:** father of Maria Luiza Stoffel (P-0108; family F-0057, father-only node); Iris Bohrer
  Muniz's 3×-great-grandfather on the Stoffel line. [PROVEN]

  - **Swiss origin stated by the record:** the 1847 Lutheran marriage (PAR-0067) names him as
  "dem Schweizer Colonisten Joseph [St]offel" — his Swiss identity and his occupation as a colonist
  are record-stated, not inferred from the surname. [PROVEN]

  ## Open questions

  - His wife, birth date, origin canton, and death record are not yet located; no record of him
  beyond this single mention is held. [OPEN]

  ## Sources held (this repository)

