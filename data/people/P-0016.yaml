  text_pt: Posição 16 no Ahnentafel.
- text: >-
    1881 Leopoldina lottery consortium (NWS-0004): "Simplicio José Ferreira Armond"
    is listed among the members of a "Grande Loteria da Côrte" ticket consortium
    held by his father-in-law Ladisláo Egídio Ferreira de Toledo (P-0056), alongside
    several Toledos. Corroborates his presence in the Leopoldina Toledo circle in
    1881 — earlier than his 1899/1902 Muriaé police offices — and confirms this is
    the Toledo son-in-law, not the elder Barbacena namesake.
  text_pt: >-
    Consórcio de loteria de Leopoldina, 1881 (NWS-0004): "Simplicio José Ferreira
    Armond" figura entre os membros de um consórcio de bilhetes da "Grande Loteria
    da Côrte" sob depósito de seu sogro Ladisláo Egídio Ferreira de Toledo (P-0056),
    ao lado de vários Toledos. Corrobora sua presença no círculo Toledo de
    Leopoldina em 1881 — anterior a seus cargos policiais de Muriaé (1899/1902) — e
    confirma tratar-se do genro dos Toledo, não do homônimo mais velho de Barbacena.
- text: >-
    Parents UNKNOWN. Simplício's Armond surname distinguishes him from the Toledo
    family he married into. PRB-0008 and PRB-0009 (1867 inventários) list a "Simplício
    José Ferreira de TOLEDO, solteiro, 14 anos" as JC's own son (item 6 in both) — a
    DIFFERENT person with a Toledo surname who died before 1879. A prior session
    (7 August 2026) mistakenly identified that Simplício de Toledo with our Simplício
    Armond and added F-0026 as his birth family; corrected same day. He is Eliza
    Balbina de Toledo's husband; his biological parents remain unidentified. He is NOT
    a child of José Cezário de Toledo Lima (P-0054) or Claudina Brandina de Jesus
    (P-0055).
  text_pt: >-
    Pais DESCONHECIDOS. O sobrenome Armond de Simplício o distingue da família Toledo
    com a qual se casou. PRB-0008 e PRB-0009 (inventários de 1867) listam um
    "Simplício José Ferreira de TOLEDO, solteiro, 14 anos" como filho do próprio JC
    (item 6 em ambos) — uma pessoa DIFERENTE, com o sobrenome Toledo, que faleceu
    antes de 1879. Uma sessão anterior (7 de agosto de 2026) identificou erroneamente
    aquele Simplício de Toledo com o nosso Simplício Armond e adicionou F-0026 como
    sua família de nascimento; corrigido no mesmo dia. Ele é o marido de Eliza Balbina
    de Toledo; seus pais biológicos permanecem não identificados. Ele NÃO é filho de
    José Cezário de Toledo Lima (P-0054) nem de Claudina Brandina de Jesus (P-0055).
- text: >-
    His name appears in four records: the short "Simplicio Armand" (Aristão's 1957
    death, CIV-0005); "Simplício Ferreira Armond" (Marfiza's 1962 death, CIV-0013);
    and "Simplicio José Ferreira Armond" (the 1881 Toledo heir list PRB-0001 and the
    1884 petition PRB-0002) — PRB-0002 bearing his own autograph signature
    ("Simplicio Joze Ferr.a Armond"). The owner confirms his full name is "Simplício
    José Ferreira Armond", set as the preferred name on 2026-07-30 — it matches his
    autograph signature and the two 1880s probate records; the shorter source forms
    ("Simplicio Armand", "Simplício Ferreira Armond") are preserved as variants.
  text_pt: >-
    Seu nome aparece em quatro registros: a forma curta "Simplicio Armand" (óbito de
    1957 de Aristão, CIV-0005); "Simplício Ferreira Armond" (óbito de 1962 de Marfiza,
    CIV-0013); e "Simplicio José Ferreira Armond" (a lista de herdeiros Toledo de 1881,
    PRB-0001, e a petição de 1884, PRB-0002) — sendo que PRB-0002 traz sua própria
    assinatura autógrafa ("Simplicio Joze Ferr.a Armond"). O proprietário confirma que
    seu nome completo é "Simplício José Ferreira Armond", definido como nome preferido
    em 30/07/2026 — ele corresponde à sua assinatura autógrafa e aos dois registros de
    inventário da década de 1880; as formas de fonte mais curtas ("Simplicio Armand",
    "Simplício Ferreira Armond") são preservadas como variantes.
- text: >-
    Public office (1899, 1902): named 2.º supplente do subdelegado of the Boa Família
    district, Muriaé, by an act published in the Minas Geraes state gazette of 28 July
    1899 (GOV-0005) — his earliest documented office — and "3.º supplente do delegado de
    policia de S. Paulo do Muriahé" by an act of 10 September 1902 (Minas Geraes gazette,
    11 Sept 1902, GOV-0006, the official primary; reproduced in O Pharol, Juiz de Fora,
    13 Sept 1902, NWS-0003). Recorded as occupations. Together they document his standing
    and Muriaé activity across 1899–1902 and add a civic role to his documented
    attorney/witness activity there (the FAN documents and the 1904 inventário). Distinct
    from the elder Barbacena Tenente-Coronel Simplício.
  text_pt: >-
    Cargo público (1899, 1902): nomeado 2.º suplente do subdelegado do distrito de Boa
    Família, Muriaé, por ato publicado na gazeta oficial Minas Geraes de 28 de julho de
    1899 (GOV-0005) — seu cargo documentado mais antigo — e "3.º supplente do delegado de
    policia de S. Paulo do Muriahé" por acto de 10 de setembro de 1902 (gazeta Minas
    Geraes, 11 set. 1902, GOV-0006, o primário oficial; reproduzido em O Pharol, Juiz de
    Fora, 13 set. 1902, NWS-0003). Registrados como ocupações. Juntos documentam sua
    posição e atividade em Muriaé entre 1899 e 1902 e acrescentam um papel cívico à sua
    atividade documentada de procurador/testemunha ali (os documentos FAN e o inventário
    de 1904). Distinto do Tenente-Coronel Simplício, o mais velho, de Barbacena.
- text: >-
    1919 Toledo estate (Leopoldina): a partilha "folha de pagamento ao herdeiro"
    (PRB-0011) names Simplício José Ferreira Armond, "casado com Dona Eliza Balbina de
    Toledo", as heir and allots him a fazenda share (dwelling house, paiol, mill, halves
    of the engenho and ventilador, and mata-virgem and capoeira lands). He inherits in
    right of Eliza — a Toledo (in-law) estate — which corroborates his heir-by-marriage
    standing (previously cited only from PRB-0001/PRB-0002) and, if the retrieval agent's
    1919 dating holds, extends his documented presence from "after 1902" (NWS-0003) toward
    c.1919. The folio names neither his own Armond parents nor the decedent whose estate is
    divided; the date and place are the agent's identification, off this page.
  text_pt: >-
    Espólio Toledo de 1919 (Leopoldina): uma "folha de pagamento ao herdeiro" de partilha
    (PRB-0011) nomeia Simplício José Ferreira Armond, "casado com Dona Eliza Balbina de
    Toledo", como herdeiro e lhe destina uma quota de fazenda (casa de morada, paiol,
    moinho, metades do engenho e do ventilador, e terras em matta virgem e capoeiras).
    Ele herda em direito de Eliza — um espólio Toledo (por afinidade) — o que corrobora
    sua condição de herdeiro por casamento (antes citada apenas em PRB-0001/PRB-0002) e,
    se a datação de 1919 do agente de recuperação se confirmar, estende sua presença
    documentada de "depois de 1902" (NWS-0003) para c.1919. A folha não nomeia nem seus
    próprios pais Armond nem o inventariado cujo espólio se divide; a data e o lugar são
    identificação do agente, fora desta página.
profile: >-
  ## Interesting facts

  - **[PROVEN]** His autograph survives from 1884: "Simplicio Joze Ferr.a Armond. Estou sciente" (PRB-0002) — a petition to complete a Toledo estate partition, signed in his own hand. The signature is the only personal trace of the man himself in the archive, everything else being records about him.

  - **[PROVEN]** He held two consecutive police appointments: 2nd substitute subdelegado of the Boa Família district (Muriaé, 1899, GOV-0005) and 3rd substitute police delegate of São Paulo do Muriaé (1902, GOV-0006). Both were unpaid honorary posts — the exact cargo gratuito category defined by Lei nº 261 of 1841 — but markers of civic trust in the republican local governance system established after 1889.

  - **[CONTEXTUAL]** The 1889 Republic abolished the Empire's local governance structure and replaced it with a delegado/subdelegado system; Simplício's 1899 and 1902 appointments are thus acts of the new republican government, not the imperial one. He adapted from one political regime to another without losing his standing.

  - **[PROVEN]** He appears in a 1881 lottery consortium document (NWS-0004) alongside Toledo family members, organised by his father-in-law Ladisláo Egídio Ferreira de Toledo. This places him inside the Toledo social world a decade before his police appointments — social mobility through marriage, not through individual rise.

  - **[INFERRED]** His parents are entirely unknown — the one true gap in this family's tree. Yet he consistently carried the paternal surname "Ferreira Armond" (never a maternal name), suggesting his Armond paternity was socially acknowledged even if the parish records that would prove it remain undigitized.

  - **[CONTEXTUAL]** His whole recorded life (c.1875–c.1919) sits in the Zona da Mata Mineira's peak coffee era: the Leopoldina Railway reached the region in 1875 (the year of his first documented appearance), enabling coffee export and accelerating the plantation economy he served as court official and, later, police authority. When the coffee economy began its long decline after 1888, his sons inherited a world already contracting.

  ## Identity

  Always **Simplício José Ferreira Armond** (also *Armand / Armonde*). He NEVER used
  "de Toledo" [PROVEN] — in the 1881 Toledo heir list (PRB-0001) every Toledo heir
  carries a Toledo surname; Simplício alone signs "Ferreira Armond". He is from the
  Armond family and married INTO the Toledo family. Not to be confused with the
  "Simplício José Ferreira de Toledo, solteiro, 14 annos" of José Cesário's 1867
  inventário (PRB-0008 / PRB-0009) — a different person, José Cesário's own son.

  - **Parents:** unknown — the one true gap [OPEN].

  - **Birth:** c.1845–1853 [INFERRED] — no baptism located; he was already an adult,
  married, court-appointed official by the mid-1870s.

  - **Marriage:** married Eliza Balbina de Toledo (P-0017), c.1868–1872, at Bom Jesus do
  Rio Pardo (Argirita) [LEAD] — implied by downstream records; the marriage act, which
  would name his parents, is not yet held.

  - **Children:** Marfisa Ferreira Armond (bapt. 1873; d. 1962, CIV-0013); Aristão
  Ferreira Armond (P-0008, c.1879–1957, CIV-0005); and he was named as father and
  witness at Aristides Ferreira Armand's 1894 marriage (CIV-0023) [PROVEN].

  - **Death:** after 1902 [PROVEN] (NWS-0003), and further named as a Toledo heir in the
  c.1919 Leopoldina partilha (PRB-0011) — which, if the 1919 dating holds, pushes his
  documented presence to c.1919; exact death date not found.

  ## Standing and profession

  - **Substitute police authority in the Muriaé comarca, 1899–1902** [PROVEN] — 2.º
  suplente do subdelegado of the Boa Família district, Muriaé, by the act published in the
  Minas Geraes state gazette of 28 July 1899 (GOV-0005), his earliest documented office;
  then 3.º suplente do delegado de polícia of São Paulo do Muriaé by the act of 10
  September 1902 (Minas Geraes gazette, 11 September 1902, GOV-0006, the official primary;
  reproduced in O Pharol, NWS-0003). Both were unpaid honorary offices (cargos gratuitos).

  - **Acted as his wife's legal representative** [PROVEN — PRB-0006] — in the 1879 Matilde
  inventário his name is written before his wife's, standing for Eliza as her legal
  representative under 19th-century law. A further role as a court-appointed arbitrador /
  curador — a function of recognized trust, literacy and standing — rests only on FAN-0001 (a
  FAN context entity, not evidence) and an uncatalogued Muriaé probate, and is not attested by
  PRB-0006; it is not proven here. [LEAD]

  - **Literate** [PROVEN] — his autograph survives: "Simplicio Joze Ferr.a Armond.
  Estou sciente" (1884 petition, PRB-0002).

  - **Heir by marriage in the Toledo estate** [PROVEN] — the 1881 heir list (PRB-0001),
  the 1884 petition (PRB-0002) and the c.1919 Leopoldina partilha payment folio (PRB-0011,
  a fazenda share allotted to him as Eliza's husband).

  - **Man of capital / creditor, 1882–83** [LEAD] — named creditor in the D. Rita Maria
  Ferreira coffee-estate probate (from FINDINGS; not yet catalogued here).

  - NOT "Capitão" — the militia title has zero primary instances; do not attribute.

  Documented span of activity: c.1875–1921, across Leopoldina, Muriaé and Argirita
  (Zona da Mata Mineira).

  ## Family and social network

  Married into the landed Toledo clan of the Fazenda da Concórdia; Eliza was a
  granddaughter of Ladisláo Egídio Ferreira de Toledo and Matilde Maria de Jesus. A
  possible SECOND Armond–Toledo marriage in the same generation — Francisco Leocádio de
  Toledo's 1880 declaration names a daughter married to a "[Philos?] José Ferreira
  Armond" [LEAD] (PRB-0009 note; the p.258 image is not yet verified). If confirmed, it
  implies an Armond family unit (brothers) settled in Leopoldina, not a lone individual.

  ## What we can extrapolate

  Simplício stands at the head of a three-generation arc — Simplício → Aristão (P-0008) →
  Geraldo (P-0004) — running from a literate, office-holding Zona-da-Mata notable to a
  landless urban baker two generations later. The fall looks steep only until his standing is
  decomposed: the held records show a starting point much shallower than "rich". [INFERRED]

  - **How the standing was acquired — office, marriage and self-making, not inherited landed
  capital** [INFERRED]. His documented titles were functions, not heritable property, and the
  wage layer beneath them was thin: the substitute-delegado posts were unpaid honorary offices
  (cargos gratuitos under the delegado system of Lei nº 261 of 1841), and note that he never
  held a titular post — he was the *2.º* suplente of a subdelegado in 1899 (GOV-0005) and the
  *3.º* suplente of a delegado in 1902 (GOV-0006, NWS-0003), ranked to serve only when called.
  Any arbitrador / curador role (a lead, not proven here) would have paid only per-diligence
  court fees charged to each estate under the Regimento de Custas — episodic income earned when
  a judge named a man to a specific estate, ending with the appointment and passing to no heir.
  [CONTEXTUAL — role-based] His titles thus bought standing and trust, not a salary or a capital
  base. The land in the household was Eliza's: he married into the Toledo world rather than
  inheriting into it, and if he was a natural or collateral Armond (the reading below), he
  inherited nothing from the Armond trunk either.

  - **The land he married into was a shared, mortgaged and already-dispersing holding** [PROVEN
  records; INFERRED reading]. The Fazenda da Concórdia enters the record in 1856 not as one
  man's estate but as a 200-alqueire holding declared by José Cesário de Toledo Lima "por minha
  Mãe, irmãos e cunhados" — on behalf of his mother, siblings and brothers-in-law (GOV-0003):
  an undivided family commons from its first legal registration under the 1850 Lei de Terras. By
  1867 it carried a hypothecary debt of 3:885$000, running since 1859 and owed to Francisco
  Leocádio de Toledo, himself a declared co-possessor of the same fazenda (PRB-0008 with
  GOV-0003) — the capital was leveraged, and leveraged inside the family. And by 1877 part of it
  was being liquidated: a set of Toledo grandchildren sold "duas sortes de terras de cultura em
  commum na Fazenda da Concordia" to Capitão Antonio Belizandro dos Reis Meirelles, several of
  them signing from São João del-Rei and Rio de Janeiro (PRB-0003). Eliza is not named among
  those sellers, so her share appears to have stayed inside the undivided estate. What Simplício
  married into was a fraction of a mortgaged commons whose own co-heirs were already cashing out
  and moving away — not a fazenda.

  - **What that inheritance actually paid him, in figures** [PROVEN]. The sharpest measure of the
  family's real economic position is the estate-division payment folio (PRB-0011), which allots
  him — expressly "casado com Dona Eliza Balbina de Tollêdo", that is, in his wife's right — not
  property but *value shares* in each asset: "na casa de morada, sómente" 72$910; in the paiol
  9$113; in the moinho 3$645; in the halves of the engenho and ventilador 14$582; in 3,388 ares
  of matta virgem 51$037; in 45,012 ares of capoeiras a worn figure read as either 50$546 or
  508$546 [uncertain]; with at least one further tract continuing off-page. The legible verbas
  come to roughly 151$000, or on the order of 200$000–700$000 once the uncertain capoeira reading
  is included. Measured against a benchmark from the family's own papers — the ten enslaved
  people appraised in his father-in-law's 1867 estate at roughly 800$000 to 1:700$000 each
  (PRB-0008) — even the highest reading of his whole allotment is worth less than the cheapest
  single person that estate had held; and the comparison is nominal, so the real gap is wider
  still, the mil-réis of c.1919 buying far less than that of 1867. [PROVEN figures; the
  benchmark comparison INFERRED and nominal]

  - **Partible inheritance, made visible as arithmetic** [PROVEN record; CONTEXTUAL law]. That
  folio is what Brazilian partible succession looks like on paper. An heir does not receive the
  house, the mill and the engenho; he receives "sómente" a stated fraction of the value of each —
  72$910 of a dwelling, half an engenho, half a ventilador. Estates were split equally among all
  children and then again among theirs, so a working fazenda becomes a ledger of undivided slices
  within two generations. The same law would then divide Simplício's own share again among
  Marfisa, Aristão, Aristides and their siblings.

  - **And the estate took roughly forty years to settle** [PROVEN]. Mathilde Maria de Jezus died
  about 1880; her heirs were listed in 1881 (PRB-0001); in February 1884 Simplício was still
  petitioning the orphans' judge to end the delay, writing in his own hand that for his own
  interest he would ask nothing, but that he had "parentes colateraes em estado de indigencia"
  whom receiving their shares would relieve (PRB-0002); and the payment folio that finally records
  his verbas is dated c.1919 by the retrieval agent (PRB-0011 — the date is not on the folio).
  Capital frozen in probate for four decades earns nothing and funds nobody, and his own petition
  is direct evidence that co-heirs of this "landed" family were destitute while they waited. The
  freeze also straddles 1888: whatever enslaved people the undivided estates still counted as
  assets — the woman Martinha in Mathilde's (PRB-0006), ten in José Cezário's (PRB-0008) — ceased
  to be property during the wait. [PROVEN documents; the valuation consequence INFERRED]

  - **Education was a purchased, class-linked privilege — and it was still being bought in his
  household** [CONTEXTUAL; the literacy PROVEN]. His own literacy (the autograph "Estou sciente",
  PRB-0002) was most likely practical and self-acquired, the competence needed to act as a
  scribe-appraiser inside the propertied Toledo and court world. That it reached the next
  generation is documented: his daughter Aristides signed her own name at her 1894 marriage
  (CIV-0023). But nineteenth-century schooling in the rural Mata was bought, not public, and had
  to be re-bought each generation; a competence acquired for a role does not reproduce on its own,
  and it fell as the money fell.

  - **His standing was local, personal and non-transferable** [PROVEN; class reading INFERRED].
  His daughter's 1894 marriage was celebrated at São Fernando do Divizório "em casa de residencia
  do cidadão Simplicio José Ferreira Armand" — the justice of the peace, the registrar and the
  witnesses, among them a "Dr. Augusto Ferr. de Macedo", came to his house (CIV-0023). Five years
  later he was appointed second substitute subdelegado of that same Boa Família district
  (GOV-0005). That is the texture of a trusted neighbourhood notable: authority attached to the
  man and his house in one district, not an office with a salary or a jurisdiction that could be
  handed on. The same record marks the ceiling of that standing — his 19-year-old daughter is
  entered "do serviço domestico" and marries a 24-year-old lavrador, a working farmer, not a
  match into the fazendeiro class.

  So Simplício is the peak that was not a peak [INFERRED] — the family's most impressive
  generation on paper (offices, a court title of trust, probable credit) but built on contingent
  income and a married-in, mortgaged, fragmenting land base rather than owned heritable capital.
  That is why the later fall to a landless baker grandson is neither a lost fortune nor a mystery:
  there was little transmissible fortune to lose. His one demonstrable money was of the same
  contingent kind — commercial credit, if his role as creditor in the 1882–83 D. Rita Maria
  Ferreira coffee-estate probate holds (a lead, not catalogued here), which is only ever as sound
  as the debtors' coffee estates.

  On his origins, this same profile — literate householder, court-trusted appraiser, police
  suplente, Toledo in-law — is that of an established man inside local respectable society, not a
  marginalized outsider. He consistently carried the paternal surname "Ferreira Armond" (never a
  maternal name), which suggests his Armond paternity was socially acknowledged even where the
  parish registers we hold are silent. [INFERRED] The most likely reading: his parentage was known
  in his lifetime, so the gap is a records gap (the undigitized Argirita / Bom Jesus do Rio Pardo
  parish books), not a concealment. Read with the socioeconomic arc, this quietly supports the
  natural-son reading — a self-made collateral leaves status, not capital or inherited schooling.
  A measure of how completely even that status faded: when Aristão died in 1957, the declarant was
  a non-relative acting "no impedimento ocasional de membros da família do falecido", and
  Simplício's and Eliza's birthplaces were both entered "Ignorado" (CIV-0005). Within two
  generations the family could no longer say where its Zona-da-Mata notable had come from.

  ## Open questions

  - His parents — decisive record: the Argirita marriage (c.1868–72). [OPEN]

  - Was "[Philos?] José Ferreira Armond" his brother? Their records may name the shared
  father. [OPEN]

  - His own birth/baptism and death records — neither yet found. [OPEN]

  ## Sources held (this repository)

  - CIV-0005 (Aristão's 1957 death, names Simplício) · CIV-0013 (Marfiza's 1962 death,
  names Simplício and Eliza) · CIV-0023 (1894 Aristides × João Braga marriage —
  Simplício named as father and witness).

  - PRB-0001 (1881 Toledo heir list — "casado com D. Eliza Balbina de Toledo") ·
  PRB-0002 (1884 petition — his autograph) · PRB-0006 / PRB-0008 / PRB-0009 (Toledo
  inventários; the 2026-09-22 PRB-0009 extension, folio 181r certidão de herdeiros Oct
  1881, names "Simplício José Ferreira Armond casado com Dona Elisa Balbina de Toledo" —
  the most explicit surviving statement of the marriage; also establishes the
  two-Simplícios distinction) · PRB-0011 (c.1919 Leopoldina Toledo partilha — a fazenda
  share allotted to him as Eliza's husband).

  - GOV-0005 (Minas Geraes gazette, 1899 — 2.º suplente do subdelegado, Boa Família,
  Muriaé) · GOV-0006 (Minas Geraes gazette, 1902 — 3.º suplente do delegado, São Paulo do
  Muriaé; the official primary of NWS-0003) · NWS-0003 (O Pharol, 1902 — reproduction of
  the 1902 act) · FAN-0001 (1875 Muriaé procuração — signatário).

  - GOV-0009 · GOV-0010 · GOV-0011 (APM Secretaria de Governo sesmaria grants and
  complaint, 1791–1805, Barbacena — context_only; document the wider Armond trunk active
  in Barbacena [José, Francisco, Marianno as separate adjacent landowners]; do not name
  Simplício directly but narrow the collateral-branch search space).

  - GOV-0002 and PUB-0002 name a DIFFERENT, elder Simplício of Barbacena
  (Tenente-Coronel, b.~1785) — a namesake, not this man.

  ## Regional and migration context

  His whole recorded life (c.1875–1921) sits in the Zona da Mata Mineira — Leopoldina,
  Muriaé, Argirita — the 19th-century coffee frontier that opened the once Crown-forbidden
  "Sertões do Leste" and drew the highland Toledo/Armond generation east into fertile land
  near the Rio market. No move out of the Mata is documented for him; his court roles are
  those of an established man of that booming frontier society. [CONTEXTUAL] The origin
  parish of his own Armond branch — whether the family came east from Barbacena — remains
  the open gap; the three APM sesmaria documents (GOV-0009/0010/0011) establish Francisco,
  José and Marianno as separately named adjacent landowners in Barbacena c.1791–1805,
  narrowing (but not yet resolving) that question.

  ## Where to go today

  - **Marriage (~1868–72):** Matriz do Senhor Bom Jesus, Argirita, MG (hist. Bom Jesus do Rio Pardo) — Rua Catulino Vasconcelos 204, Centro [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.61000,-42.83583)

  - **Documented life (1875–1921):** Catedral de São Sebastião, Leopoldina (Praça Dom Helvécio 25) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20de%20Sao%20Sebastiao%2C%20Leopoldina%2C%20MG)

  - **Documented life (1875–1921), Muriaé (his louvado/suplente/creditor town):** Matriz de São Paulo Apóstolo + Fórum Tabelião Pacheco de Medeiros, Muriaé [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-21.1308577,-42.3684826)

  - **Death (inferred c.1921–40):** the Fazenda da Concórdia / Tebas zone (distrito de Tebas, Leopoldina), MG [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Sua assinatura autógrafa sobrevive desde 1884: "Simplicio Joze Ferr.a Armond. Estou sciente" (PRB-0002) — uma petição para concluir a partilha de um espólio Toledo, assinada de próprio punho. É o único rastro pessoal do homem em si no arquivo; todo o restante são registros sobre ele.

  - **[PROVEN]** Exerceu dois cargos policiais consecutivos: 2.º suplente do subdelegado do distrito de Boa Família (Muriaé, 1899, GOV-0005) e 3.º suplente do delegado de polícia de São Paulo do Muriaé (1902, GOV-0006). Ambos eram cargos honorários não remunerados — a categoria exata de cargo gratuito definida pela Lei nº 261 de 1841 — mas marcadores de confiança cívica no sistema de governança local republicano estabelecido após 1889.

  - **[CONTEXTUAL]** A República de 1889 aboliu a estrutura de governança local do Império e a substituiu pelo sistema de delegados/subdelegados; as nomeações de Simplício em 1899 e 1902 são, portanto, atos do novo governo republicano, não do imperial. Ele adaptou-se de um regime político para outro sem perder a posição.

  - **[PROVEN]** Aparece em um documento de consórcio de loteria de 1881 (NWS-0004) ao lado de membros da família Toledo, organizado por seu sogro Ladisláo Egídio Ferreira de Toledo. Isso o coloca no mundo social Toledo uma década antes de seus cargos policiais — mobilidade social pelo casamento, não pelo esforço individual.

  - **[INFERRED]** Seus pais são inteiramente desconhecidos — a única lacuna real na árvore desta família. Mesmo assim, usou de forma consistente o sobrenome paterno "Ferreira Armond" (nunca um sobrenome materno), sugerindo que sua paternidade Armond era socialmente reconhecida mesmo que os registros paroquiais que a comprovariam permaneçam não digitalizados.

  - **[CONTEXTUAL]** Toda a sua vida documentada (c.1875–c.1919) situa-se na era de auge do café na Zona da Mata Mineira: a Estrada de Ferro Leopoldina chegou à região em 1875 (o ano de seu primeiro aparecimento documentado), possibilitando a exportação do café e acelerando a economia das fazendas a que ele servia como oficial judicial e, depois, autoridade policial. Quando a economia cafeeira começou seu longo declínio após 1888, seus filhos herdaram um mundo já em contração.

  ## Identidade

  Sempre **Simplício José Ferreira Armond** (também *Armand / Armonde*). NUNCA usou
  "de Toledo" [PROVEN] — na lista de herdeiros Toledo de 1881 (PRB-0001) todo herdeiro
  Toledo leva um sobrenome Toledo; só Simplício assina "Ferreira Armond". Ele é da
  família Armond e casou-se COM a família Toledo. Não confundir com o "Simplício José
  Ferreira de Toledo, solteiro, 14 annos" do inventário de 1867 de José Cesário
  (PRB-0008 / PRB-0009) — pessoa diferente, filho do próprio José Cesário.

  - **Pais:** desconhecidos — a única lacuna real [OPEN].

  - **Nascimento:** c.1845–1853 [INFERRED] — nenhum batismo localizado; já era adulto,
  casado e oficial nomeado pela justiça em meados da década de 1870.

  - **Casamento:** casou-se com Eliza Balbina de Toledo (P-0017), c.1868–1872, em Bom
  Jesus do Rio Pardo (Argirita) [LEAD] — deduzido de registros posteriores; o assento de
  casamento, que nomearia seus pais, ainda não foi obtido.

  - **Filhos:** Marfisa Ferreira Armond (bat. 1873; f. 1962, CIV-0013); Aristão Ferreira
  Armond (P-0008, c.1879–1957, CIV-0005); e foi nomeado pai e testemunha no casamento de
  1894 de Aristides Ferreira Armand (CIV-0023) [PROVEN].

  - **Óbito:** depois de 1902 [PROVEN] (NWS-0003), e ainda nomeado herdeiro Toledo na
  partilha de Leopoldina de c.1919 (PRB-0011) — o que, se a datação de 1919 se
  confirmar, estende sua presença documentada para c.1919; data exata de óbito não
  localizada.

  ## Posição social e profissão

  - **Autoridade policial suplente na comarca de Muriaé, 1899–1902** [PROVEN] — 2.º
  suplente do subdelegado do distrito de Boa Família, Muriaé, por ato publicado na gazeta
  oficial Minas Geraes de 28 de julho de 1899 (GOV-0005), seu cargo documentado mais
  antigo; depois 3.º suplente do delegado de polícia de São Paulo do Muriaé por ato de 10
  de setembro de 1902 (gazeta Minas Geraes, 11 de setembro de 1902, GOV-0006, o primário
  oficial; reproduzido em O Pharol, NWS-0003). Ambos eram cargos honorários não remunerados
  (cargos gratuitos).

  - **Atuou como representante legal de sua esposa** [PROVEN — PRB-0006] — no inventário de
  Matilde de 1879 seu nome é escrito antes do da esposa, comparecendo por Eliza como seu
  representante legal, conforme a lei do século XIX. Um eventual papel de arbitrador / curador
  nomeado pela justiça — função de confiança, letramento e prestígio reconhecidos — assenta-se
  apenas em FAN-0001 (uma entidade de contexto FAN, não uma evidência) e num inventário de
  Muriaé não catalogado, e não é atestado por PRB-0006; não está provado aqui. [LEAD]

  - **Letrado** [PROVEN] — sobrevive sua assinatura autógrafa: "Simplicio Joze Ferr.a
  Armond. Estou sciente" (petição de 1884, PRB-0002).

  - **Herdeiro por casamento no espólio Toledo** [PROVEN] — a lista de herdeiros de 1881
  (PRB-0001), a petição de 1884 (PRB-0002) e a folha de pagamento da partilha de
  Leopoldina de c.1919 (PRB-0011, uma quota de fazenda destinada a ele como marido de
  Eliza).

  - **Homem de capital / credor, 1882–83** [LEAD] — nomeado credor no inventário da
  fazenda de café de D. Rita Maria Ferreira (das FINDINGS; ainda não catalogado aqui).

  - NÃO "Capitão" — o título de milícia não tem nenhuma ocorrência primária; não
  atribuir.

  Período documentado de atividade: c.1875–1921, entre Leopoldina, Muriaé e Argirita
  (Zona da Mata Mineira).

  ## Família e rede social

  Casou-se com a família Toledo, proprietária da Fazenda da Concórdia; Eliza era neta de
  Ladisláo Egídio Ferreira de Toledo e Matilde Maria de Jesus. Um possível SEGUNDO
  casamento Armond–Toledo na mesma geração — a declaração de 1880 de Francisco Leocádio de
  Toledo nomeia uma filha casada com um "[Philos?] José Ferreira Armond" [LEAD] (nota de
  PRB-0009; a imagem da p.258 ainda não foi verificada). Se confirmado, sugere uma
  unidade familiar Armond (irmãos) fixada em Leopoldina, não um indivíduo isolado.

  ## O que podemos extrapolar

  Simplício está no início de um arco de três gerações — Simplício → Aristão (P-0008) → Geraldo
  (P-0004) — que vai de um notável letrado e detentor de cargos da Zona da Mata a um padeiro
  urbano sem terra duas gerações depois. A queda só parece abrupta até que sua posição seja
  decomposta: os registros em mãos mostram um ponto de partida bem mais raso do que "rico".
  [INFERRED]

  - **Como a posição foi adquirida — cargo, casamento e esforço próprio, não capital fundiário
  herdado** [INFERRED]. Seus títulos documentados eram funções, não propriedade transmissível, e
  a camada de remuneração sob eles era tênue: os cargos de suplente de delegado eram cargos
  honorários não remunerados (cargos gratuitos, no sistema de delegados da Lei nº 261 de 1841), e
  note-se que ele nunca ocupou um posto titular — foi *2.º* suplente de subdelegado em 1899
  (GOV-0005) e *3.º* suplente de delegado em 1902 (GOV-0006, NWS-0003), classificado para servir
  apenas quando chamado. Qualquer papel de arbitrador/curador (uma pista, não comprovada aqui)
  teria pago somente custas por diligência cobradas de cada espólio, conforme o Regimento de
  Custas — renda episódica, obtida quando um juiz o nomeava para um espólio específico, que
  terminava com a nomeação e não passava a herdeiro algum. [CONTEXTUAL — por função] Seus títulos,
  portanto, compravam posição e confiança, não salário nem base de capital. A terra da casa era de
  Eliza: ele casou-se para dentro do mundo Toledo, em vez de herdar nele; e, se era um Armond
  natural ou colateral (a leitura adiante), tampouco herdou coisa alguma do tronco Armond.

  - **A terra na qual se casou era uma posse comum, hipotecada e já em dispersão** [registros
  PROVEN; leitura INFERRED]. A Fazenda da Concórdia entra nos registros em 1856 não como espólio de
  um homem, mas como uma posse de 200 alqueires declarada por José Cesário de Toledo Lima "por
  minha Mãe, irmãos e cunhados" (GOV-0003): uma posse familiar indivisa desde seu primeiro registro
  legal, sob a Lei de Terras de 1850. Em 1867 ela carregava uma dívida hipotecária de 3:885$000,
  vencida desde 1859 e devida a Francisco Leocádio de Toledo, ele próprio copossuidor declarado da
  mesma fazenda (PRB-0008 com GOV-0003) — o capital estava alavancado, e alavancado dentro da
  própria família. E em 1877 parte dele já estava sendo liquidada: um conjunto de netos Toledo
  vendeu "duas sortes de terras de cultura em commum na Fazenda da Concordia" ao Capitão Antonio
  Belizandro dos Reis Meirelles, vários deles assinando de São João del-Rei e do Rio de Janeiro
  (PRB-0003). Eliza não é nomeada entre esses vendedores, de modo que sua quota parece ter
  permanecido no espólio indiviso. Aquilo com que Simplício se casou era uma fração de um bem comum
  hipotecado, do qual os próprios coerdeiros já se desfaziam e se afastavam — não uma fazenda.

  - **O que essa herança de fato lhe pagou, em números** [PROVEN]. A medida mais nítida da real
  posição econômica da família é a folha de pagamento de partilha (PRB-0011), que lhe destina —
  expressamente "casado com Dona Eliza Balbina de Tollêdo", isto é, em direito de sua mulher — não
  bens, mas *quotas de valor* em cada bem: "na casa de morada, sómente" 72$910; no paiol 9$113; no
  moinho 3$645; nas metades do engenho e do ventilador 14$582; em 3.388 ares de matta virgem
  51$037; em 45.012 ares de capoeiras uma cifra gasta, lida como 50$546 ou 508$546 [uncertain]; com
  ao menos mais uma gleba continuando fora da página. As verbas legíveis somam cerca de 151$000,
  ou algo entre 200$000 e 700$000 conforme a leitura incerta das capoeiras. Medido contra um
  parâmetro dos próprios papéis da família — as dez pessoas escravizadas avaliadas no espólio de
  1867 de seu sogro, entre cerca de 800$000 e 1:700$000 cada uma (PRB-0008) —, mesmo a leitura mais
  alta de todo o seu quinhão vale menos do que a mais barata das pessoas que aquele espólio detinha;
  e a comparação é nominal, de modo que a distância real é ainda maior, pois o mil-réis de c.1919
  comprava muito menos que o de 1867. [cifras PROVEN; a comparação é INFERRED e nominal]

  - **A herança partível, visível como aritmética** [registro PROVEN; lei CONTEXTUAL]. Essa folha é
  o que a sucessão partível brasileira parece no papel. Um herdeiro não recebe a casa, o moinho e o
  engenho; recebe "sómente" uma fração declarada do valor de cada um — 72$910 de uma casa de morada,
  metade de um engenho, metade de um ventilador. Os espólios eram divididos igualmente entre todos
  os filhos e, depois, entre os filhos destes, de modo que uma fazenda em operação vira um livro de
  fatias indivisas em duas gerações. A mesma lei dividiria de novo a quota do próprio Simplício
  entre Marfisa, Aristão, Aristides e os irmãos.

  - **E o espólio levou cerca de quarenta anos para se resolver** [PROVEN]. Mathilde Maria de Jezus
  faleceu por volta de 1880; seus herdeiros foram arrolados em 1881 (PRB-0001); em fevereiro de 1884
  Simplício ainda peticionava ao juiz de órfãos para pôr fim à demora, escrevendo de próprio punho
  que, pelo seu próprio interesse, nada requereria, mas que tinha "parentes colateraes em estado de
  indigencia" a quem o recebimento dos haveres muito aliviaria (PRB-0002); e a folha de pagamento
  que enfim registra suas verbas é datada de c.1919 pelo agente de recuperação (PRB-0011 — a data
  não consta da folha). Capital congelado em inventário por quatro décadas não rende nada e não
  sustenta ninguém, e a petição dele é evidência direta de que coerdeiros desta família
  "proprietária" estavam na indigência enquanto esperavam. O congelamento também atravessa 1888:
  quaisquer pessoas escravizadas que os espólios indivisos ainda contabilizassem como bens — a
  mulher Martinha no de Mathilde (PRB-0006), dez no de José Cezário (PRB-0008) — deixaram de ser
  propriedade durante a espera. [documentos PROVEN; a consequência patrimonial é INFERRED]

  - **A instrução era um privilégio comprado e ligado à classe — e ainda estava sendo comprada em sua
  casa** [CONTEXTUAL; o letramento é PROVEN]. Seu próprio letramento (o autógrafo "Estou sciente",
  PRB-0002) foi muito provavelmente prático e autoadquirido, a competência necessária para atuar
  como escrivão-avaliador dentro do mundo proprietário Toledo e do foro. Que ela chegou à geração
  seguinte está documentado: sua filha Aristides assinou o próprio nome em seu casamento de 1894
  (CIV-0023). Mas a escolarização oitocentista na Mata rural era comprada, não pública, e tinha de
  ser recomprada a cada geração; uma competência adquirida para um papel não se reproduz sozinha, e
  caiu junto com o dinheiro.

  - **Sua posição era local, pessoal e intransferível** [PROVEN; leitura de classe INFERRED]. O
  casamento de sua filha, em 1894, foi celebrado em São Fernando do Divizório "em casa de residencia
  do cidadão Simplicio José Ferreira Armand" — o juiz de paz, o escrivão e as testemunhas, entre
  elas um "Dr. Augusto Ferr. de Macedo", foram até a casa dele (CIV-0023). Cinco anos depois ele era
  nomeado 2.º suplente do subdelegado daquele mesmo distrito de Boa Família (GOV-0005). É a textura
  de um notável de vizinhança em quem se confia: autoridade ligada ao homem e à sua casa em um
  distrito, não um cargo com salário ou uma jurisdição que se pudesse transmitir. O mesmo registro
  marca o teto dessa posição — sua filha de 19 anos é lançada como "do serviço domestico" e casa-se
  com um lavrador de 24 anos, um agricultor que trabalha a terra, e não um casamento para dentro da
  classe fazendeira.

  Assim, Simplício é o auge que não foi auge [INFERRED] — a geração mais impressionante da família no
  papel (cargos, um título judicial de confiança, crédito provável), mas erguida sobre renda
  contingente e uma base de terra hipotecada, por casamento e em fragmentação, e não sobre capital
  próprio transmissível. É por isso que a queda posterior até um neto padeiro sem terra não é fortuna
  perdida nem mistério: havia pouca fortuna transmissível a perder. Seu único dinheiro demonstrável
  era da mesma espécie contingente — crédito comercial, se sua condição de credor no inventário de
  1882–83 do cafezal de D. Rita Maria Ferreira se confirmar (uma pista, não catalogada aqui) —, e
  crédito só vale o que valem os cafezais dos devedores.

  Quanto às suas origens, esse mesmo perfil — chefe de casa letrado, avaliador de confiança do juízo,
  suplente de polícia, genro dos Toledo — é o de um homem estabelecido dentro da sociedade local
  respeitável, não o de um marginalizado. Ele usou de forma consistente o sobrenome paterno "Ferreira
  Armond" (nunca um sobrenome materno), o que sugere que sua paternidade Armond era socialmente
  reconhecida, ainda que os registros paroquiais que temos sejam silenciosos. [INFERRED] A leitura
  mais provável: sua filiação era conhecida em vida, de modo que a lacuna é de registros (os livros
  paroquiais não digitalizados de Argirita / Bom Jesus do Rio Pardo), não ocultação. Lida junto com o
  arco socioeconômico, ela sustenta discretamente a hipótese do filho natural — um colateral que se
  faz sozinho deixa posição, não capital nem instrução herdada. Uma medida de como até essa posição se
  apagou: quando Aristão morreu em 1957, o declarante foi um não parente, agindo "no impedimento
  ocasional de membros da família do falecido", e as naturalidades de Simplício e de Eliza foram ambas
  lançadas como "Ignorado" (CIV-0005). Em duas gerações a família já não sabia dizer de onde viera seu
  notável da Zona da Mata.

  ## Questões em aberto

  - Seus pais — registro decisivo: o casamento de Argirita (c.1868–72). [OPEN]

  - "[Philos?] José Ferreira Armond" era seu irmão? Os registros dele podem nomear o pai
  em comum. [OPEN]

  - Seus próprios registros de nascimento/batismo e óbito — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0005 (óbito de 1957 de Aristão, nomeia Simplício) · CIV-0013 (óbito de 1962 de
  Marfiza, nomeia Simplício e Eliza) · CIV-0023 (casamento de 1894 de Aristides × João
  Braga — Simplício nomeado pai e testemunha).

  - PRB-0001 (lista de herdeiros Toledo de 1881 — "casado com D. Eliza Balbina de
  Toledo") · PRB-0002 (petição de 1884 — sua assinatura autógrafa) · PRB-0006 / PRB-0008
  / PRB-0009 (inventários Toledo; a extensão de PRB-0009 de 22-set-2026, certidão de
  herdeiros folio 181r, out. 1881, nomeia "Simplício José Ferreira Armond casado com Dona
  Elisa Balbina de Toledo" — o registro mais explícito do casamento que sobrevive; também
  estabelece a distinção dos dois Simplícios) · PRB-0011 (partilha Toledo de Leopoldina de
  c.1919 — uma quota de fazenda destinada a ele como marido de Eliza).

  - GOV-0005 (gazeta Minas Geraes, 1899 — 2.º suplente do subdelegado, Boa Família,
  Muriaé) · GOV-0006 (gazeta Minas Geraes, 1902 — 3.º suplente do delegado, São Paulo do
  Muriaé; o primário oficial de NWS-0003) · NWS-0003 (O Pharol, 1902 — reprodução do ato de
  1902) · FAN-0001 (procuração de 1875 em Muriaé — signatário).

  - GOV-0009 · GOV-0010 · GOV-0011 (APM Secretaria de Governo, sesmarias e queixa,
  1791–1805, Barbacena — apenas contexto; documentam o tronco Armond mais amplo ativo em
  Barbacena [José, Francisco e Marianno como proprietários adjacentes distintos]; não nomeiam
  Simplício diretamente, mas delimitam o espaço de busca do ramo colateral).

  - GOV-0002 e PUB-0002 nomeiam um Simplício DIFERENTE e mais velho, de Barbacena
  (Tenente-Coronel, n.~1785) — um homônimo, não este.

  ## Contexto regional e migratório

  Toda a sua vida documentada (c.1875–1921) situa-se na Zona da Mata Mineira — Leopoldina,
  Muriaé, Argirita — a fronteira cafeeira do século XIX que abriu os antes proibidos
  "Sertões do Leste" e atraiu a geração Toledo/Armond das terras altas rumo ao leste, para
  terras férteis próximas do mercado do Rio. Nenhuma saída da Mata está documentada para
  ele; seus cargos judiciais são os de um homem estabelecido naquela sociedade de fronteira
  em expansão. [CONTEXTUAL] A paróquia de origem de seu próprio ramo Armond — se a família
  veio de Barbacena para leste — permanece a lacuna em aberto; os três documentos da APM
  Secretaria de Governo (GOV-0009/0010/0011) estabelecem Francisco, José e Marianno como
  proprietários adjacentes distintos em Barbacena c.1791–1805, delimitando (mas ainda não
  resolvendo) essa questão.

