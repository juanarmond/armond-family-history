  de Toledo" — nome usado por parentes Toledo por afinidade (PRB-0006, PRB-0009) [LEAD —
  registro e linhas de índice não disponíveis aqui].

  - **Pagamentos recebidos, 1883 — um credor?** [contexto FAN — FAN-0002] — a conta prestada
