- text: >-
    Parents UNKNOWN. Simplício's Armond surname distinguishes him from the Toledo
    family he married into. PRB-0008 and PRB-0009 (1867 inventários) list a "Simplício
    José Ferreira de TOLEDO, solteiro, 14 anos" as JC's own son (item 6 in both) — a
    DIFFERENT person with a Toledo surname who died before 1879. A prior session
    (7 August 2026) mistakenly identified that Simplício de Toledo with our Simplício
    Armond and added F-0026 as his birth family; corrected same day. He is Eliza
    Balbina de Toledo's husband; his biological parents remain unidentified. He is NOT
    a child of José Cezário de Toledo Lima (P-0054) or Claudina Brandina de Jesus
    (P-0055).
  text_pt: >-
    Pais DESCONHECIDOS. O sobrenome Armond de Simplício o distingue da família Toledo
    com a qual se casou. PRB-0008 e PRB-0009 (inventários de 1867) listam um
    "Simplício José Ferreira de TOLEDO, solteiro, 14 anos" como filho do próprio JC
    (item 6 em ambos) — uma pessoa DIFERENTE, com o sobrenome Toledo, que faleceu
    antes de 1879. Uma sessão anterior (7 de agosto de 2026) identificou erroneamente
    aquele Simplício de Toledo com o nosso Simplício Armond e adicionou F-0026 como
    sua família de nascimento; corrigido no mesmo dia. Ele é o marido de Eliza Balbina
    de Toledo; seus pais biológicos permanecem não identificados. Ele NÃO é filho de
    José Cezário de Toledo Lima (P-0054) nem de Claudina Brandina de Jesus (P-0055).
- text: >-
    His name appears in four records: the short "Simplicio Armand" (Aristão's 1957
    death, CIV-0005); "Simplício Ferreira Armond" (Marfiza's 1962 death, CIV-0013);
    and "Simplicio José Ferreira Armond" (the 1881 Toledo heir list PRB-0001 and the
    1884 petition PRB-0002) — PRB-0002 bearing his own autograph signature
    ("Simplicio Joze Ferr.a Armond"). The owner confirms his full name is "Simplício
    José Ferreira Armond", set as the preferred name on 2026-07-30 — it matches his
    autograph signature and the two 1880s probate records; the shorter source forms
    ("Simplicio Armand", "Simplício Ferreira Armond") are preserved as variants.
  text_pt: >-
    Seu nome aparece em quatro registros: a forma curta "Simplicio Armand" (óbito de
    1957 de Aristão, CIV-0005); "Simplício Ferreira Armond" (óbito de 1962 de Marfiza,
    CIV-0013); e "Simplicio José Ferreira Armond" (a lista de herdeiros Toledo de 1881,
    PRB-0001, e a petição de 1884, PRB-0002) — sendo que PRB-0002 traz sua própria
    assinatura autógrafa ("Simplicio Joze Ferr.a Armond"). O proprietário confirma que
    seu nome completo é "Simplício José Ferreira Armond", definido como nome preferido
    em 30/07/2026 — ele corresponde à sua assinatura autógrafa e aos dois registros de
    inventário da década de 1880; as formas de fonte mais curtas ("Simplicio Armand",
    "Simplício Ferreira Armond") são preservadas como variantes.
- text: >-
    Public office (1902): named "3.º supplente do delegado de policia de S. Paulo do
    Muriahé" by an act of 10 September 1902, reported in O Pharol (Juiz de Fora,
    13 Sept 1902; NWS-0003). Recorded as an occupation. Confirms he was living and
    active at Muriaé in 1902 and adds a civic role to his documented attorney/witness
    activity there (the FAN documents and the 1904 inventário). Distinct from the elder
    Barbacena Tenente-Coronel Simplício.
  text_pt: >-
    Cargo público (1902): nomeado "3.º supplente do delegado de policia de S. Paulo do
    Muriahé" por acto de 10 de setembro de 1902, noticiado em O Pharol (Juiz de Fora,
    13 set. 1902; NWS-0003). Registrado como ocupação. Confirma que ele estava vivo e
    atuante em Muriaé em 1902 e acrescenta um papel cívico à sua atividade documentada
    de procurador/testemunha ali (os documentos FAN e o inventário de 1904). Distinto do
    Tenente-Coronel Simplício, o mais velho, de Barbacena.
- text: >-
    1919 Toledo estate (Leopoldina): a partilha "folha de pagamento ao herdeiro"
    (PRB-0011) names Simplício José Ferreira Armond, "casado com Dona Eliza Balbina de
    Toledo", as heir and allots him a fazenda share (dwelling house, paiol, mill, halves
    of the engenho and ventilador, and mata-virgem and capoeira lands). He inherits in
    right of Eliza — a Toledo (in-law) estate — which corroborates his heir-by-marriage
    standing (previously cited only from PRB-0001/PRB-0002) and, if the retrieval agent's
    1919 dating holds, extends his documented presence from "after 1902" (NWS-0003) toward
    c.1919. The folio names neither his own Armond parents nor the decedent whose estate is
    divided; the date and place are the agent's identification, off this page.
  text_pt: >-
    Espólio Toledo de 1919 (Leopoldina): uma "folha de pagamento ao herdeiro" de partilha
    (PRB-0011) nomeia Simplício José Ferreira Armond, "casado com Dona Eliza Balbina de
    Toledo", como herdeiro e lhe destina uma quota de fazenda (casa de morada, paiol,
    moinho, metades do engenho e do ventilador, e terras em matta virgem e capoeiras).
    Ele herda em direito de Eliza — um espólio Toledo (por afinidade) — o que corrobora
    sua condição de herdeiro por casamento (antes citada apenas em PRB-0001/PRB-0002) e,
    se a datação de 1919 do agente de recuperação se confirmar, estende sua presença
    documentada de "depois de 1902" (NWS-0003) para c.1919. A folha não nomeia nem seus
    próprios pais Armond nem o inventariado cujo espólio se divide; a data e o lugar são
    identificação do agente, fora desta página.
profile: >-
  ## Identity

  Always **Simplício José Ferreira Armond** (also *Armand / Armonde*). He NEVER used
  "de Toledo" [PROVEN] — in the 1881 Toledo heir list (PRB-0001) every Toledo heir
  carries a Toledo surname; Simplício alone signs "Ferreira Armond". He is from the
  Armond family and married INTO the Toledo family. Not to be confused with the
  "Simplício José Ferreira de Toledo, solteiro, 14 annos" of José Cesário's 1867
  inventário (PRB-0008 / PRB-0009) — a different person, José Cesário's own son.

  - **Parents:** unknown — the one true gap [OPEN].

  - **Birth:** c.1845–1853 [INFERRED] — no baptism located; he was already an adult,
  married, court-appointed official by the mid-1870s.

  - **Marriage:** married Eliza Balbina de Toledo (P-0017), c.1868–1872, at Bom Jesus do
  Rio Pardo (Argirita) [LEAD] — implied by downstream records; the marriage act, which
  would name his parents, is not yet held.

  - **Children:** Marfisa Ferreira Armond (bapt. 1873; d. 1962, CIV-0013); Aristão
  Ferreira Armond (P-0008, c.1879–1957, CIV-0005); and he was named as father and
  witness at Aristides Ferreira Armand's 1894 marriage (CIV-0023) [PROVEN].

  - **Death:** after 1902 [PROVEN] (NWS-0003), and further named as a Toledo heir in the
  c.1919 Leopoldina partilha (PRB-0011) — which, if the 1919 dating holds, pushes his
  documented presence to c.1919; exact death date not found.

  ## Standing and profession

  - **3rd substitute police delegate of São Paulo do Muriaé, 1902** [PROVEN] — a public
  office, reported in O Pharol (NWS-0003).

  - **Court-appointed arbitrador / curador** [PROVEN] — a role of recognized trust,
  literacy and standing (FAN-0001 and the Muriaé probate record); in the 1879 Matilde
  inventário his name is written before his wife's.

  - **Literate** [PROVEN] — his autograph survives: "Simplicio Joze Ferr.a Armond.
  Estou sciente" (1884 petition, PRB-0002).

  - **Heir by marriage in the Toledo estate** [PROVEN] — the 1881 heir list (PRB-0001),
  the 1884 petition (PRB-0002) and the c.1919 Leopoldina partilha payment folio (PRB-0011,
  a fazenda share allotted to him as Eliza's husband).

  - **Man of capital / creditor, 1882–83** [LEAD] — named creditor in the D. Rita Maria
  Ferreira coffee-estate probate (from FINDINGS; not yet catalogued here).

  - NOT "Capitão" — the militia title has zero primary instances; do not attribute.

  Documented span of activity: c.1875–1902, across Leopoldina, Muriaé and Argirita
  (Zona da Mata Mineira).

  ## Family and social network

  Married into the landed Toledo clan of the Fazenda da Concórdia; Eliza was a
  granddaughter of Ladisláo Egídio Ferreira de Toledo and Matilde Maria de Jesus. A
  possible SECOND Armond–Toledo marriage in the same generation — Francisco Leocádio de
  Toledo's 1880 declaration names a daughter married to a "[Philos?] José Ferreira
  Armond" [LEAD] (PRB-0009 note; the p.258 image is not yet verified). If confirmed, it
  implies an Armond family unit (brothers) settled in Leopoldina, not a lone individual.

  ## What we can extrapolate

  Simplício is the head of a three-generation arc (Simplício → Aristão → Geraldo) that runs
  from an office-holding, literate Zona-da-Mata notable down to a landless urban baker
  grandson. The steepness of that fall resolves once his standing is decomposed, because his
  starting point was shallower than "rich". [INFERRED]

  - **How his standing was acquired — office, marriage and self-making, not inherited landed
  capital** [INFERRED]. His documented titles were functions, not heritable property, and
  the wage layer beneath them was thin: the substitute-delegado post was an unpaid honorary
  office (a cargo gratuito under the delegado system of Lei nº 261 of 1841), while the
  arbitrador / curador roles paid only per-diligence court fees charged to each estate (the
  imperial-then-state Regimento de Custas) — episodic income earned when a judge named him to
  a specific estate, ending with the appointment and passing to no heir. [CONTEXTUAL —
  role-based] His most impressive titles thus bought standing and literacy, not a salary or a
  capital base. His land and status sat inside the Toledo world: he married into the landed
  Concórdia clan, so the fazenda base was Eliza's inheritance, not his own; and if he was a
  natural or collateral Armond (the reading below), he inherited nothing from the Armond
  trunk. [INFERRED, on the PROVEN heir-by-marriage records]

  - **His wealth was of the contingent kind** [INFERRED]. What he can be shown to have had
  was office income and — if his role as creditor in the 1882–83 D. Rita Maria Ferreira
  coffee-estate probate holds (a lead, not yet catalogued here) — commercial credit. Both
  were tied to roles he personally held and to the regional coffee economy, and neither
  survives its holder: office income ends with the office, and credit is only as sound as the
  debtors' coffee estates. [INFERRED / partly LEAD]

  - **Education was a purchased, class-linked privilege** [CONTEXTUAL]. His literacy (the
  autograph "Estou sciente") was most likely practical and self-acquired — the competence
  needed to act as scribe-appraiser in the propertied Toledo and court world. In the 19th
  century schooling was bought, not public or heritable; such role-acquired literacy had to
  be re-bought each generation and fell as the money fell.

  - **Partible inheritance was primed to fragment whatever there was** [CONTEXTUAL].
  Brazilian law split estates equally among all children (Marfisa, Aristão, Aristides, José
  Olavo and the rest), so the married-in Toledo share and any commercial capital would divide
  many ways at his death, then again among their children — two generations reduce a
  comfortable estate to little per heir.

  So Simplício is the peak that was not a peak [INFERRED] — the family's most impressive
  generation on paper (offices, a court title of trust, probable credit) but built on income
  and a married-in land base rather than owned, heritable capital. That is why the later fall
  to a landless baker grandson is not a lost fortune or a mystery: there was little
  transmissible fortune to lose.

  On his origins, this same profile — court appraiser, curador, police delegado, literate
  householder, Toledo in-law — is that of an established, trusted man inside local respectable
  society, not a marginalized outsider. He consistently carried the paternal surname "Ferreira
  Armond" (never a maternal name), which suggests his Armond paternity was socially
  acknowledged even where the parish registers we hold are silent. [INFERRED] The most likely
  reading: his parentage was known in his lifetime, so the gap is a records gap (the
  undigitized Argirita / Bom Jesus do Rio Pardo parish books), not a concealment. Read with
  the socioeconomic arc, this quietly supports the natural-son reading — a self-made
  collateral leaves status, not capital or inherited schooling.

  ## Open questions

  - His parents — decisive record: the Argirita marriage (c.1868–72). [OPEN]

  - Was "[Philos?] José Ferreira Armond" his brother? Their records may name the shared
  father. [OPEN]

  - His own birth/baptism and death records — neither yet found. [OPEN]

  ## Sources held (this repository)

  - CIV-0005 (Aristão's 1957 death, names Simplício) · CIV-0013 (Marfiza's 1962 death,
  names Simplício and Eliza) · CIV-0023 (1894 Aristides × João Braga marriage —
  Simplício named as father and witness).

  - PRB-0001 (1881 Toledo heir list — "casado com D. Eliza Balbina de Toledo") ·
  PRB-0002 (1884 petition — his autograph) · PRB-0006 / PRB-0008 / PRB-0009 (Toledo
  inventários — establish the two-Simplícios distinction) · PRB-0011 (c.1919 Leopoldina
  Toledo partilha — a fazenda share allotted to him as Eliza's husband).

  - NWS-0003 (O Pharol, 1902 — 3rd substitute delegado of Muriaé) · FAN-0001 (1875
  Muriaé procuração — signatário).

  - GOV-0002 and PUB-0002 name a DIFFERENT, elder Simplício of Barbacena
  (Tenente-Coronel, b.~1785) — a namesake, not this man.

  ## Regional and migration context

  His whole recorded life (c.1875–1902) sits in the Zona da Mata Mineira — Leopoldina,
  Muriaé, Argirita — the 19th-century coffee frontier that opened the once Crown-forbidden
  "Sertões do Leste" and drew the highland Toledo/Armond generation east into fertile land
  near the Rio market. No move out of the Mata is documented for him; his court roles are
  those of an established man of that booming frontier society. [CONTEXTUAL] The origin
  parish of his own Armond branch — whether the family came east from Barbacena — remains
  the open gap.
profile_pt: >-
  ## Identidade

  Sempre **Simplício José Ferreira Armond** (também *Armand / Armonde*). NUNCA usou
  "de Toledo" [PROVEN] — na lista de herdeiros Toledo de 1881 (PRB-0001) todo herdeiro
  Toledo leva um sobrenome Toledo; só Simplício assina "Ferreira Armond". Ele é da
  família Armond e casou-se COM a família Toledo. Não confundir com o "Simplício José
  Ferreira de Toledo, solteiro, 14 annos" do inventário de 1867 de José Cesário
  (PRB-0008 / PRB-0009) — pessoa diferente, filho do próprio José Cesário.

  - **Pais:** desconhecidos — a única lacuna real [OPEN].

  - **Nascimento:** c.1845–1853 [INFERRED] — nenhum batismo localizado; já era adulto,
  casado e oficial nomeado pela justiça em meados da década de 1870.

  - **Casamento:** casou-se com Eliza Balbina de Toledo (P-0017), c.1868–1872, em Bom
  Jesus do Rio Pardo (Argirita) [LEAD] — deduzido de registros posteriores; o assento de
  casamento, que nomearia seus pais, ainda não foi obtido.

  - **Filhos:** Marfisa Ferreira Armond (bat. 1873; f. 1962, CIV-0013); Aristão Ferreira
  Armond (P-0008, c.1879–1957, CIV-0005); e foi nomeado pai e testemunha no casamento de
  1894 de Aristides Ferreira Armand (CIV-0023) [PROVEN].

  - **Óbito:** depois de 1902 [PROVEN] (NWS-0003), e ainda nomeado herdeiro Toledo na
  partilha de Leopoldina de c.1919 (PRB-0011) — o que, se a datação de 1919 se
  confirmar, estende sua presença documentada para c.1919; data exata de óbito não
  localizada.

  ## Posição social e profissão

  - **3.º supplente do delegado de polícia de São Paulo do Muriaé, 1902** [PROVEN] —
  um cargo público, noticiado em O Pharol (NWS-0003).

  - **Arbitrador / curador nomeado pela justiça** [PROVEN] — papel de confiança,
  letramento e prestígio reconhecidos (FAN-0001 e o inventário de Muriaé); no inventário
  de Matilde de 1879 seu nome é escrito antes do da esposa.

  - **Letrado** [PROVEN] — sobrevive sua assinatura autógrafa: "Simplicio Joze Ferr.a
  Armond. Estou sciente" (petição de 1884, PRB-0002).

  - **Herdeiro por casamento no espólio Toledo** [PROVEN] — a lista de herdeiros de 1881
  (PRB-0001), a petição de 1884 (PRB-0002) e a folha de pagamento da partilha de
  Leopoldina de c.1919 (PRB-0011, uma quota de fazenda destinada a ele como marido de
  Eliza).

  - **Homem de capital / credor, 1882–83** [LEAD] — nomeado credor no inventário da
  fazenda de café de D. Rita Maria Ferreira (das FINDINGS; ainda não catalogado aqui).

  - NÃO "Capitão" — o título de milícia não tem nenhuma ocorrência primária; não
  atribuir.

  Período documentado de atividade: c.1875–1902, entre Leopoldina, Muriaé e Argirita
  (Zona da Mata Mineira).

  ## Família e rede social

  Casou-se com a família Toledo, proprietária da Fazenda da Concórdia; Eliza era neta de
  Ladisláo Egídio Ferreira de Toledo e Matilde Maria de Jesus. Um possível SEGUNDO
  casamento Armond–Toledo na mesma geração — a declaração de 1880 de Francisco Leocádio de
  Toledo nomeia uma filha casada com um "[Philos?] José Ferreira Armond" [LEAD] (nota de
  PRB-0009; a imagem da p.258 ainda não foi verificada). Se confirmado, sugere uma
  unidade familiar Armond (irmãos) fixada em Leopoldina, não um indivíduo isolado.

  ## O que podemos extrapolar

  Simplício encabeça um arco de três gerações (Simplício → Aristão → Geraldo) que vai de um
  notável letrado e detentor de cargos na Zona da Mata até um neto padeiro urbano e sem terra.
  A dureza dessa queda se esclarece quando sua posição é decomposta, pois seu ponto de partida
  era menos elevado do que "rico". [INFERRED]

  - **Como sua posição foi adquirida — cargo, casamento e mérito próprio, não capital
  fundiário herdado** [INFERRED]. Seus títulos documentados eram funções, não propriedade
  transmissível, e a camada de remuneração sob eles era escassa: o cargo de suplente de
  delegado era um posto honorário não remunerado (um cargo gratuito sob o sistema de delegados
  da Lei nº 261 de 1841), enquanto os papéis de arbitrador / curador pagavam apenas custas
  judiciais por diligência cobradas de cada espólio (o Regimento de Custas, imperial e depois
  estadual) — renda episódica, obtida quando um juiz o nomeava para um espólio específico,
  encerrando-se com a nomeação e não passando a herdeiro algum. [CONTEXTUAL — baseado no
  papel] Assim, seus títulos mais impressionantes compravam prestígio e letramento, não um
  salário ou uma base de capital. Suas terras e sua posição situavam-se dentro do mundo
  Toledo: casou-se com a família proprietária da Concórdia, de modo que a base de fazenda era
  herança de Eliza, não sua; e, se ele era um Armond natural ou colateral (a leitura abaixo),
  nada herdou do tronco Armond. [INFERRED, sobre os registros PROVEN de herdeiro por
  casamento]

  - **Sua riqueza era do tipo contingente** [INFERRED]. O que se pode demonstrar que ele teve
  foi renda de cargo e — se se confirmar seu papel de credor no inventário da fazenda de café
  de D. Rita Maria Ferreira em 1882–83 (uma pista, ainda não catalogada aqui) — crédito
  comercial. Ambos estavam atrelados a papéis que ele pessoalmente exercia e à economia
  cafeeira regional, e nenhum dos dois sobrevive a quem os detém: a renda de cargo termina com
  o cargo, e o crédito só é tão sólido quanto as fazendas de café dos devedores. [INFERRED /
  em parte LEAD]

  - **A educação era um privilégio comprado e ligado à classe** [CONTEXTUAL]. Seu letramento
  (a assinatura "Estou sciente") era muito provavelmente prático e autodidata — a competência
  necessária para atuar como escrivão-avaliador no mundo proprietário dos Toledo e da justiça.
  No século XIX a instrução era comprada, não pública nem transmissível; esse letramento
  adquirido para uma função tinha de ser recomprado a cada geração e caiu à medida que o
  dinheiro caiu.

  - **A herança partível já estava disposta a fragmentar o pouco que houvesse** [CONTEXTUAL]. A
  lei brasileira dividia os espólios igualmente entre todos os filhos (Marfisa, Aristão,
  Aristides, José Olavo e os demais), de modo que a quota Toledo por casamento e qualquer
  capital comercial se dividiriam em muitas partes à sua morte, e de novo entre os filhos deles
  — duas gerações reduzem um espólio confortável a pouco por herdeiro.

  Assim, Simplício é o auge que não foi auge [INFERRED] — a geração mais impressionante da
  família no papel (cargos, um título judicial de confiança, provável crédito), mas assentada
  em renda e numa base de terra por casamento, e não em capital próprio e transmissível. É por
  isso que a queda posterior até um neto padeiro sem terra não é uma fortuna perdida nem um
  mistério: havia pouca fortuna transmissível a perder.

  Quanto às suas origens, esse mesmo perfil — avaliador judicial, curador, delegado de polícia,
  chefe de casa letrado, parente por casamento dos Toledo — é o de um homem estabelecido e de
  confiança dentro da sociedade local respeitável, não o de um marginalizado. Usou de forma
  consistente o sobrenome paterno "Ferreira Armond" (nunca um sobrenome materno), o que sugere
  que sua paternidade Armond era socialmente reconhecida, ainda que os registros paroquiais que
  possuímos sejam omissos. [INFERRED] Leitura mais provável: sua filiação era conhecida em
  vida, de modo que a lacuna é de registros (os livros paroquiais não digitalizados de Argirita
  / Bom Jesus do Rio Pardo), não um ocultamento. Lida junto com o arco socioeconômico, essa
  leitura reforça discretamente a hipótese do filho natural — um colateral que se fez por si
  deixa posição, não capital nem instrução herdada.

  ## Questões em aberto

  - Seus pais — registro decisivo: o casamento de Argirita (c.1868–72). [OPEN]

  - "[Philos?] José Ferreira Armond" era seu irmão? Os registros dele podem nomear o pai
  em comum. [OPEN]

  - Seus próprios registros de nascimento/batismo e óbito — nenhum localizado. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0005 (óbito de 1957 de Aristão, nomeia Simplício) · CIV-0013 (óbito de 1962 de
  Marfiza, nomeia Simplício e Eliza) · CIV-0023 (casamento de 1894 de Aristides × João
  Braga — Simplício nomeado pai e testemunha).

  - PRB-0001 (lista de herdeiros Toledo de 1881 — "casado com D. Eliza Balbina de
  Toledo") · PRB-0002 (petição de 1884 — sua assinatura autógrafa) · PRB-0006 / PRB-0008
  / PRB-0009 (inventários Toledo — estabelecem a distinção dos dois Simplícios) · PRB-0011
  (partilha Toledo de Leopoldina de c.1919 — uma quota de fazenda destinada a ele como
  marido de Eliza).

  - NWS-0003 (O Pharol, 1902 — 3.º suplente do delegado de Muriaé) · FAN-0001 (procuração
  de 1875 em Muriaé — signatário).

  - GOV-0002 e PUB-0002 nomeiam um Simplício DIFERENTE e mais velho, de Barbacena
  (Tenente-Coronel, n.~1785) — um homônimo, não este.

  ## Contexto regional e migratório

  Toda a sua vida documentada (c.1875–1902) situa-se na Zona da Mata Mineira — Leopoldina,
  Muriaé, Argirita — a fronteira cafeeira do século XIX que abriu os antes proibidos
  "Sertões do Leste" e atraiu a geração Toledo/Armond das terras altas rumo ao leste, para
  terras férteis próximas do mercado do Rio. Nenhuma saída da Mata está documentada para
  ele; seus cargos judiciais são os de um homem estabelecido naquela sociedade de fronteira
  em expansão. [CONTEXTUAL] A paróquia de origem de seu próprio ramo Armond — se a família
  veio de Barbacena para leste — permanece a lacuna em aberto.
