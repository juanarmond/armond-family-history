  ## Contexto regional e migratório

  Toda a sua vida documentada (c.1875–1921) situa-se na Zona da Mata Mineira — Leopoldina,
  Muriaé, Argirita — a fronteira cafeeira do século XIX que abriu os antes proibidos
  "Sertões do Leste" (abertos pela Carta Régia de 13 de maio de 1808, que declarou guerra
  aos Botocudos) e atraiu a geração Toledo/Armond das terras altas rumo ao leste, para
  terras férteis próximas do mercado do Rio. Nenhuma saída da Mata está documentada para
  ele; seus cargos judiciais são os de um homem estabelecido naquela sociedade de fronteira
  em expansão. [CONTEXTUAL] A paróquia de origem de seu próprio ramo Armond — se a família
  veio de Barbacena para leste — permanece a lacuna em aberto; os três documentos da APM
  Secretaria de Governo (GOV-0009/0010/0011) estabelecem Francisco, José e Marianno como
  proprietários adjacentes distintos em Barbacena c.1791–1805, delimitando (mas ainda não
  resolvendo) essa questão. As pistas vivas estão agora na órbita do Meia Pataca /
  Cataguases e no tronco de Barbacena (ver Questões em aberto).

