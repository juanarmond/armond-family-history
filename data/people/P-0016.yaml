- text: >-
    His name appears in four records: the short "Simplicio Armand" (Aristão's 1957
    death, CIV-0005); "Simplício Ferreira Armond" (Marfiza's 1962 death, CIV-0013);
    and "Simplicio José Ferreira Armond" (the 1881 Toledo heir list PRB-0001 and the
    1884 petition PRB-0002) — PRB-0002 bearing his own autograph signature
    ("Simplicio Joze Ferr.a Armond"). The owner confirms his full name is "Simplício
    José Ferreira Armond", set as the preferred name on 2026-07-30 — it matches his
    autograph signature and the two 1880s probate records; the shorter source forms
    ("Simplicio Armand", "Simplício Ferreira Armond") are preserved as variants.
