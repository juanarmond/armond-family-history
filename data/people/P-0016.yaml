  não diz a que se referiam; lê-los como reembolso de dinheiro que ele emprestara — um homem
  de capital — é interpretação da pesquisa de recuperação [INFERRED].

  - **Tratado por "Capitão"** por escrivães do foro de Muriaé em 1900 e c.1906–07 (FAN-0004,
  FAN-0005 — ver Fatos interessantes). Nenhuma patente foi localizada, então não o apresente
  como cargo que se mostre ter ocupado [OPEN].

  Período documentado de atividade: c.1875–1921, entre Leopoldina, Muriaé e Argirita
  (Zona da Mata Mineira).

  ## Família e rede social

  Casou-se com a família Toledo, proprietária da Fazenda da Concórdia; Eliza era neta de
  Ladisláo Egídio Ferreira de Toledo e Matilde Maria de Jesus. Um possível SEGUNDO
  casamento Armond–Toledo na mesma geração — a declaração de 1880 de Francisco Leocádio de
  Toledo nomeia uma filha casada com um "[Philos?] José Ferreira Armond" [LEAD] (nota de
  PRB-0009; a imagem da p.258 ainda não foi verificada). Se confirmado, sugere uma
  unidade familiar Armond (irmãos) fixada em Leopoldina, não um indivíduo isolado.

  Uma assinatura transcrita como "Ladislao Egidio [Ferre?] [Armonde?]" figura ao lado das de
  Simplício e Eliza na intimação da partilha de 1873 no inventário de Ladisláo (p.150 da
  transcrição) [LEAD — leitura incerta, imagem não verificada]: um parente, um lapso do
  escrivão ou uma transcrição errada do Ladisláo de Toledo mais novo.

  Fora do círculo Toledo, papéis judiciais e notariais de Muriaé o situam entre os homens de
  confiança da comarca de 1875 a 1913 — assinando a rogo de uma outorgante analfabeta
  (FAN-0001), parte numa escritura de 1889 (FAN-0003), louvado, arbitrador, procurador e
  testemunha (FAN-0004 a FAN-0009) — tudo contexto FAN, não registros sobre sua família.

  ## O que podemos extrapolar

  Simplício está no início de um arco de três gerações — Simplício → Aristão (P-0008) → Geraldo
  (P-0004) — que vai de um notável letrado e detentor de cargos da Zona da Mata a um padeiro
  urbano sem terra duas gerações depois. A queda só parece abrupta até que sua posição seja
  decomposta: os registros em mãos mostram um ponto de partida bem mais raso do que "rico".
  [INFERRED]

  - **Como a posição foi adquirida — cargo, casamento e esforço próprio, não capital fundiário
  herdado** [INFERRED]. Seus títulos documentados eram funções, não propriedade transmissível, e
  a camada de remuneração sob eles era tênue: os cargos de suplente de delegado eram cargos
  honorários não remunerados (cargos gratuitos, no sistema de delegados da Lei nº 261 de 1841), e
  note-se que ele nunca ocupou um posto titular — foi *2.º* suplente de subdelegado em 1899
  (GOV-0005) e *3.º* suplente de delegado em 1902 (GOV-0006, NWS-0003), classificado para servir
  apenas quando chamado. Suas nomeações como louvado/arbitrador (FAN-0004, FAN-0005, FAN-0009 —
  contexto FAN) teriam pago somente custas por diligência cobradas de cada espólio, conforme o
  Regimento de Custas — renda episódica, obtida quando um juiz o nomeava para um espólio
  específico, que terminava com a nomeação e não passava a herdeiro algum. [CONTEXTUAL — por
  função] Seus títulos, portanto, compravam posição e confiança, não salário nem base de capital.
  A terra da casa era de Eliza: ele casou-se para dentro do mundo Toledo, em vez de herdar nele;
  e, se era um Armond natural ou colateral (a leitura adiante), tampouco herdou coisa alguma do
  tronco Armond. Uma ressalva: em 1910 ele figura entre os condôminos da fazenda "Vae e Volta ou
  Dezengano", em Muriaé (FAN-0007, contexto FAN); como veio a ter essa parte não é dito.

  - **A terra na qual se casou era uma posse comum, hipotecada e já em dispersão** [registros
  PROVEN; leitura INFERRED]. A Fazenda da Concórdia entra nos registros em 1856 não como espólio de
  um homem, mas como uma posse de 200 alqueires declarada por José Cesário de Toledo Lima "por
  minha Mãe, irmãos e cunhados" (GOV-0003): uma posse familiar indivisa desde seu primeiro registro
  legal, sob a Lei de Terras de 1850. Em 1867 ela carregava uma dívida hipotecária de 3:885$000,
  vencida desde 1859 e devida a Francisco Leocádio de Toledo, ele próprio copossuidor declarado da
  mesma fazenda (PRB-0008 com GOV-0003) — o capital estava alavancado, e alavancado dentro da
  própria família. E em 1877 parte dele já estava sendo liquidada: um conjunto de netos Toledo
  vendeu "duas sortes de terras de cultura em commum na Fazenda da Concordia" ao Capitão Antonio
  Belizandro dos Reis Meirelles, vários deles assinando de São João del-Rei e do Rio de Janeiro
  (PRB-0003). Eliza não é nomeada entre esses vendedores, de modo que sua quota parece ter
  permanecido no espólio indiviso. Aquilo com que Simplício se casou era uma fração de um bem comum
  hipotecado, do qual os próprios coerdeiros já se desfaziam e se afastavam — não uma fazenda.

  - **O que essa herança de fato lhe pagou, em números** [PROVEN]. A medida mais nítida da real
  posição econômica da família é a folha de pagamento de partilha (PRB-0011), que lhe destina —
  expressamente "casado com Dona Eliza Balbina de Tollêdo", isto é, em direito de sua mulher — não
  bens, mas *quotas de valor* em cada bem: "na casa de morada, sómente" 72$910; no paiol 9$113; no
  moinho 3$645; nas metades do engenho e do ventilador 14$582; em 3.388 ares de matta virgem
  51$037; em 45.012 ares de capoeiras uma cifra gasta, lida como 50$546 ou 508$546 [uncertain]; com
  ao menos mais uma gleba continuando fora da página. As verbas legíveis somam cerca de 151$000,
  ou algo entre 200$000 e 700$000 conforme a leitura incerta das capoeiras. Medido contra um
  parâmetro dos próprios papéis da família — as dez pessoas escravizadas avaliadas no espólio de
  1867 de seu sogro, entre cerca de 800$000 e 1:700$000 cada uma (PRB-0008) —, mesmo a leitura mais
  alta de todo o seu quinhão vale menos do que a mais barata das pessoas que aquele espólio detinha;
  e a comparação é nominal, de modo que a distância real é ainda maior, pois o mil-réis de c.1919
  comprava muito menos que o de 1867. [cifras PROVEN; a comparação é INFERRED e nominal]

  - **A herança partível, visível como aritmética** [registro PROVEN; lei CONTEXTUAL]. Essa folha é
  o que a sucessão partível brasileira parece no papel. Um herdeiro não recebe a casa, o moinho e o
  engenho; recebe "sómente" uma fração declarada do valor de cada um — 72$910 de uma casa de morada,
  metade de um engenho, metade de um ventilador. Os espólios eram divididos igualmente entre todos
  os filhos e, depois, entre os filhos destes, de modo que uma fazenda em operação vira um livro de
  fatias indivisas em duas gerações. A mesma lei dividiria de novo a quota do próprio Simplício
  entre Marfisa, Aristão, Aristides e os irmãos.

  - **E o espólio levou cerca de quarenta anos para se resolver** [PROVEN]. Mathilde Maria de Jezus
  faleceu por volta de 1880; seus herdeiros foram arrolados em 1881 (PRB-0001); em fevereiro de 1884
  Simplício ainda peticionava ao juiz de órfãos para pôr fim à demora, escrevendo de próprio punho
  que, pelo seu próprio interesse, nada requereria, mas que tinha "parentes colateraes em estado de
  indigencia" a quem o recebimento dos haveres muito aliviaria (PRB-0002); e a folha de pagamento
  que enfim registra suas verbas é datada de c.1919 pelo agente de recuperação (PRB-0011 — a data
  não consta da folha). Capital congelado em inventário por quatro décadas não rende nada e não
  sustenta ninguém, e a petição dele é evidência direta de que coerdeiros desta família
  "proprietária" estavam na indigência enquanto esperavam. O congelamento também atravessa 1888:
  quaisquer pessoas escravizadas que os espólios indivisos ainda contabilizassem como bens — a
  mulher Martinha no de Mathilde (PRB-0006), dez no de José Cezário (PRB-0008) — deixaram de ser
  propriedade durante a espera. [documentos PROVEN; a consequência patrimonial é INFERRED]

  - **A instrução era um privilégio comprado e ligado à classe — e ainda estava sendo comprada em sua
  casa** [CONTEXTUAL; o letramento é PROVEN]. Seu próprio letramento (a petição de 1884 escrita e
  assinada de próprio punho, PRB-0002) foi muito provavelmente prático e autoadquirido, a competência necessária para atuar
  como escrivão-avaliador dentro do mundo proprietário Toledo e do foro. Que ela chegou à geração
  seguinte está documentado: sua filha Aristides assinou o próprio nome em seu casamento de 1894
  (CIV-0023). Mas a escolarização oitocentista na Mata rural era comprada, não pública, e tinha de
  ser recomprada a cada geração; uma competência adquirida para um papel não se reproduz sozinha, e
  caiu junto com o dinheiro.

  - **Sua posição era local, pessoal e intransferível** [PROVEN; leitura de classe INFERRED]. O
  casamento de sua filha, em 1894, foi celebrado em São Fernando do Divizório "em casa de residencia
  do cidadão Simplicio José Ferreira Armand" — o juiz de paz, o escrivão e as testemunhas, entre
  elas um "Dr. Augusto Ferr. de Macedo", foram até a casa dele (CIV-0023). Cinco anos depois ele era
  nomeado 2.º suplente do subdelegado daquele mesmo distrito de Boa Família (GOV-0005). É a textura
  de um notável de vizinhança em quem se confia: autoridade ligada ao homem e à sua casa em um
  distrito, não um cargo com salário ou uma jurisdição que se pudesse transmitir. O mesmo registro
  marca o teto dessa posição — sua filha de 19 anos é lançada como "do serviço domestico" e casa-se
  com um lavrador de 24 anos, um agricultor que trabalha a terra, e não um casamento para dentro da
  classe fazendeira.

  Assim, Simplício é o auge que não foi auge [INFERRED] — a geração mais impressionante da família no
  papel (cargos, um título judicial de confiança, crédito provável), mas erguida sobre renda
  contingente e uma base de terra hipotecada, por casamento e em fragmentação, e não sobre capital
  próprio transmissível. É por isso que a queda posterior até um neto padeiro sem terra não é fortuna
  perdida nem mistério: havia pouca fortuna transmissível a perder. Seu único dinheiro visível era
  da mesma espécie contingente — os 360$600 pagos a ele em 1883 pela conta de café de D. Rita Maria
  Ferreira (FAN-0002), crédito comercial se fossem reembolso de dinheiro emprestado (o livro não o
  diz) —, e crédito só vale o que valem os cafezais dos devedores.

  Quanto às suas origens, esse mesmo perfil — chefe de casa letrado, avaliador de confiança do juízo,
  suplente de polícia, genro dos Toledo — é o de um homem estabelecido dentro da sociedade local
  respeitável, não o de um marginalizado. Ele usou de forma consistente o sobrenome paterno "Ferreira
  Armond" (nunca um sobrenome materno), o que sugere que sua paternidade Armond era socialmente
  reconhecida, ainda que os registros paroquiais que temos sejam silenciosos. [INFERRED] A leitura
  mais provável: sua filiação era conhecida em vida, de modo que a lacuna é de registros (os livros
  paroquiais não digitalizados de Argirita / Bom Jesus do Rio Pardo), não ocultação. Lida junto com o
  arco socioeconômico, ela sustenta discretamente a hipótese do filho natural — um colateral que se
  faz sozinho deixa posição, não capital nem instrução herdada. Uma medida de como até essa posição se
  apagou: quando Aristão morreu em 1957, o declarante foi um não parente, agindo "no impedimento
  ocasional de membros da família do falecido", e as naturalidades de Simplício e de Eliza foram ambas
  lançadas como "Ignorado" (CIV-0005). Em duas gerações a família já não sabia dizer de onde viera seu
  notável da Zona da Mata.

  ## Questões em aberto

  - Seus pais — os registros decisivos são o casamento de Argirita (c.1868–72; ver
  Identidade) e seu próprio registro de óbito, cuja filiação responderia à questão. [OPEN]

  - **A busca da filiação, em 2026-10-08** — cada item abaixo é uma pista ou uma negativa;
  nenhum nomeia seus pais, e nenhuma pessoa pode ser criada a partir de qualquer deles.

  - **Santa Rita do Meia Pataca, 1831** (GOV-0013) [LEAD] — o fogo 68 é um lavrador branco
  casado de 23 anos, "An.to Ferr.a A[…]ndes", com sua mulher H[e]ngelica Maria, 24. Nossa
  imagem não resolve o sobrenome; a transcrição publicada pelo Projeto Compartilhar (Joana
  Capella) lê "Antonio Ferreira Almondes" e fecha o fogo com o casal sozinho. Se Almondes é
  uma forma de Armond, por troca de L por R, é interpretação, não leitura, e o assento nada
  declara sobre filiação.

  - **Meia Pataca, 1838–39** [negativa delimitada relatada] — o lado da recuperação leu o mapa
  de 1838 (APM caixa 93 doc. 18; 118 fogos, com 44 variantes de sobrenome): nenhum Armond, e
  o casal de 1831 ausente. Um "Simplicio … 17 … Ibitipoca" no fogo 57 é um da Silva nascido
  c.1821, não este homem.

  - **Meia Pataca, 1856** [LEAD — relatado pela pesquisa de recuperação; registro não
  disponível aqui] — um "Antonio Ferreira Armondes" declarou uma fazenda de cerca de 600
  alqueires na freguesia de Santa Rita do Meia Pataca em 2 de janeiro de 1856, comprada ao
  finado Antonio Teixeira de Siqueira (APM Terras Públicas TP 120, reg. nº 53). Não declara
  idade, cônjuge, pais nem filhos. Se for o chefe do fogo de 1831, o casal talvez nunca tenha
  deixado a região mais ampla — o mapa de 1838–39 cobria só o distrito, e a freguesia criada
  em 1851 era maior —, mas a correspondente que o forneceu adverte que pode haver dois homens
  do mesmo nome. A mesma pesquisa relata um depoimento de 1904 em Cataguases lembrando um
  Antonio Ferreira Armond, com um filho José, numa Fazenda Boa Vista nessa órbita [LEAD].

  - **Registro de terras de Tombos, 1854–57** [LEAD — só linha de índice] — o índice de Nilza
  Cantoni arrola um "Simplicio José Ferreira", local "santo antonio", p. 26. Este homem era
  então criança, de modo que o declarante é no máximo um candidato a seu pai; aguarda-se a
  própria página, e se ela declara filiação.

  - **Um "Simplício, pardo claro" liberto, 1856** [LEAD — relatado a partir de uma tese; o
  testamento não está disponível] — a tese de Resende (UFMG, 2008) relata que o testamento de
  1856 do Conde de Prados (Dr. Camilo Maria Ferreira Armond; AHMPAS, 1SVC Cx. 61/17) fez
  batizar como libertas "suas crias", entre elas "Simplício, pardo claro", cada uma com um
  legado de 2:000$000. "Crias" não é "filhos", e nada ainda liga essa criança a este homem; o
  teste gratuito é um batismo em Barbacena, c.1840–56, de um Simplício batizado liberto pelo
  Dr. Camilo.

  - **O tronco de Barbacena** [LEAD] — o inventário de 1845 de Honório José Ferreira Armonde
  só é conhecido por sua carta precatória de Mariana (lida pelo lado da recuperação), que
  nomeia seis signatários adultos "Ferreira Armonde" sem declarar sua filiação: nem confirma
  nem exclui o tronco, e os autos principais de Barbacena são o registro decisivo. Os
  testamentos dos irmãos sem filhos Antônio José (f. 1852) e Lino José (f. 1870) Ferreira
  Armonde seguem como a via ainda não testada do filho natural.

  - **Negativas delimitadas** (relatadas, salvo quando citadas): não existem livros de batismo
  do Meia Pataca para 1832–1853 (segundo Nilza Cantoni); nenhum outro Armond em nenhum dos
  dois mapas de Cataguases; Presídio 1819, Ibertioga 1831 e 1834, e Ibitipoca 1831, todos
  limpos com 44 variantes — o último enfraquece, sem fechar, a indicação da "Serra de
  Ibitipoca"; o distrito de Juiz de Fora em 1831 (GOV-0012, varrido aqui); e o mapa do Cágado
  de 1831, negativa só das formas com R (as imagens se perderam, de modo que não pode ser
  revarrido com formas em L como Almond-/Almend-). Um zero numa lista nada prova sobre outros
  anos ou registros não indexados.

  - "[Philos?] José Ferreira Armond" era seu irmão? Os registros dele podem nomear o pai
  em comum. [OPEN]

  - Quem assinou como "Ladislao Egidio [Ferre?] [Armonde?]" na intimação da partilha de 1873
  (ver Família e rede social)? [OPEN]

  - Em que se apoiava o "Capitão" de FAN-0004 / FAN-0005. [OPEN]

  - Seus próprios registros de nascimento/batismo e óbito — nenhum localizado. [OPEN]

