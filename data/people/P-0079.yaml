notes:
- text: >-
    Wife of João Rodrigues Valle (P-0078); married 22 February 1751 at the Matriz de
    Nossa Senhora da Piedade da Borda do Campo (Barbacena), family F-0038 (PAR-0034).
    "Natural e baptizada nesta freguesia" (Borda do Campo), legitimate daughter of
    Manoel Nado Pestana and Anna Francisca (named in PAR-0034; recorded as a lead,
    not modelled — no records of their own located).
  text_pt: >-
    Esposa de João Rodrigues Valle (P-0078); casou-se em 22 de fevereiro de 1751
    na Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena), família
    F-0038 (PAR-0034). "Natural e baptizada nesta freguesia" (Borda do Campo),
    filha legítima de Manoel Nado Pestana e Anna Francisca (nomeados em PAR-0034;
    registrados como pista, não modelados — nenhum registro próprio localizado).
- text: >-
    Mother of Ritta Angélica Rodrigues (P-0058), who married Joaquim José Ferreira
    de Toledo (P-0057); hence a direct maternal-line ancestor of Eliza Balbina de
    Toledo (P-0017). See F-0038 for the strong-evidence child link (PAR-0018).
  text_pt: >-
    Mãe de Ritta Angélica Rodrigues (P-0058), que se casou com Joaquim José
    Ferreira de Toledo (P-0057); portanto, uma ancestral direta da linha materna
    de Eliza Balbina de Toledo (P-0017). Ver F-0038 para a ligação filial de
    evidência forte (PAR-0018).
- text: >-
