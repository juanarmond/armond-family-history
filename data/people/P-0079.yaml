profile: >-
  ## Identity

  **Isabel Ribeiro** (also *Isabel Ribeyro*; recorded *Izabel Ribeira* in her daughter's
  marriage). Brazilian — "natural e baptizada nesta freguesia" of Borda do Campo
  (Barbacena, Minas Gerais) per the 1751 marriage act [PROVEN of the documented
  birthplace] (PAR-0034). (The retrieval synthesis's "de Lima" and "birth/parents
  unknown" are superseded by our held marriage certidão.)

  - **Parents:** legitimate daughter of Manoel Nado Pestana and Anna Francisca — named
  in PAR-0034 and now modelled as P-0094 × P-0095 (family F-0046) on strong-evidence;
  their origin (Ilha de São Jorge, Açores, per the tentative PAR-0049 read) and own
  records remain a [LEAD].

  - **Marriage:** married João Rodrigues Valle (P-0078) on 22 February 1751 at the
  Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) — [PROVEN] (PAR-0034;
  E-0070; family F-0038).

  - **Birth and death:** no birth or death record located beyond the marriage act's
  statement of her local birth. [OPEN]

  ## Family and social network

  - **Mother of Ritta Angélica Rodrigues (P-0058)** [strong-evidence], who married
  Joaquim José Ferreira de Toledo (P-0057); Ritta's own c.1786 marriage names her mother
  "Izabel Ribeira" (PAR-0018). Through Ritta she is a direct maternal-line ancestor of
  Eliza Balbina de Toledo (P-0017).

  - Her marriage to a Portuguese immigrant grafted her Borda do Campo family onto the
  line that became the maternal Toledo trunk. [PROVEN marriage; strong-evidence graft]

  ## Open questions

  - Her own baptism and death, and the further identity of her parents (Manoel Nado
  Pestana × Anna Francisca), remain open in the Borda do Campo / Barbacena registers.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0034 (1751 Borda do Campo marriage certidão — her marriage, local birth and
  parents) · PAR-0018 (c.1786 Barbacena marriage of her daughter Ritta — the
  strong-evidence child link).

  ## Regional and migration context

  A Barbacena-born woman of the Borda do Campo district in the Campo das Vertentes of
  Minas Gerais, she married a Minho immigrant — the Brazilian half of a colonial-Brazil +
  north-west-Portugal couple typical of the 18th-century Barbacena free-colonist milieu.
  [CONTEXTUAL] The Minho → Minas emigration driver attaches to her husband's Rodrigues/Valle
  line, not securely to her own: an ink-damaged reading of her daughter Rita's 1764
  baptism names Isabel's father, Manoel Nado Pestana, as a native of Nossa Senhora do Rosário,
  Ilha de São Jorge (Açores) — which, if confirmed, would re-root her paternal side to the
  Azores rather than the Braga-Minho line. [LEAD]

  ## Where to go today

  - **Where she lived (Borda do Campo; her daughter's marriage):** Catedral N.S. da Piedade,
  Barbacena, MG (municipality anchor; rural holdings unpinned) [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Identidade

  **Isabel Ribeiro** (também *Isabel Ribeyro*; registrada *Izabel Ribeira* no casamento
  de sua filha). Brasileira — "natural e baptizada nesta freguesia" da Borda do Campo
  (Barbacena, Minas Gerais) conforme o assento de casamento de 1751 [PROVEN quanto ao
  local de nascimento documentado] (PAR-0034). (O "de Lima" e o "nascimento/pais
  desconhecidos" da síntese de recuperação ficam superados por nossa certidão de
  casamento em mãos.)

  - **Pais:** filha legítima de Manoel Nado Pestana e Anna Francisca — nomeados em
  PAR-0034 e agora modelados como P-0094 × P-0095 (família F-0046) com base em
  evidência forte; sua origem (Ilha de São Jorge, Açores, conforme a leitura tentativa
  de PAR-0049) e seus registros próprios permanecem uma [LEAD].

  - **Casamento:** casou-se com João Rodrigues Valle (P-0078) em 22 de fevereiro de 1751
  na Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) — [PROVEN]
  (PAR-0034; E-0070; família F-0038).

  - **Nascimento e óbito:** nenhum registro de nascimento ou óbito localizado além da
  declaração do assento de casamento sobre seu nascimento local. [OPEN]

  ## Família e rede social

  - **Mãe de Ritta Angélica Rodrigues (P-0058)** [evidência forte], que se casou com
  Joaquim José Ferreira de Toledo (P-0057); o próprio casamento de Ritta, por volta de
  1786, nomeia sua mãe "Izabel Ribeira" (PAR-0018). Por meio de Ritta, ela é ancestral
  direta, pela linha materna, de Eliza Balbina de Toledo (P-0017).

  - Seu casamento com um imigrante do Minho enxertou sua família da Borda do Campo na
  linha que se tornou o tronco materno Toledo. [PROVEN para o casamento; evidência forte
  para o enxerto]

  ## Questões em aberto

  - Seu próprio batismo e óbito, e a identidade adicional de seus pais (Manoel Nado
  Pestana × Anna Francisca), permanecem em aberto nos registros da Borda do Campo /
  Barbacena. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0034 (certidão de casamento de 1751 na Borda do Campo — seu casamento, nascimento
  local e pais) · PAR-0018 (casamento de sua filha Ritta em Barbacena por volta de 1786 —
  a ligação filial de evidência forte).

  ## Contexto regional e migratório

  Mulher nascida em Barbacena, no distrito da Borda do Campo, no Campo das Vertentes de
  Minas Gerais, casou-se com um imigrante do Minho — a metade brasileira de um casal
  Brasil colonial + noroeste de Portugal, típico do meio de colonos livres de Barbacena no
  século XVIII. [CONTEXTUAL] O motor migratório Minho → Minas prende-se à linha
  Rodrigues/Valle de seu marido, não com segurança à dela: uma leitura danificada por tinta do
  batismo de 1764 de sua filha Rita nomeia o pai de Isabel, Manoel Nado Pestana, como natural de
  Nossa Senhora do Rosário, Ilha de São Jorge (Açores) — o que, se confirmado, reancoraria o
  lado paterno dela nos Açores, e não na linha Braga-Minho. [LEAD]

  ## Onde ir hoje

  - **Onde viveu (Borda do Campo; casamento de sua filha):** Catedral N.S. da Piedade,
  Barbacena, MG (âncora do município; posses rurais não localizadas) [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
