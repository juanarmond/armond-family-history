profile: >-
  ## Identity

  **José Campello de Moraes** — "Joze Campello de Moraes, natural do Port[o]" in the
  21 October 1821 Itaboraí baptism of his grandson Antonio (PAR-0101); "José Campello
  de Morais" in the 4 March 1841 baptisms of his grandchildren João and Maria
  (PAR-0102) [PROVEN]. Both records name him, with Emerenciana Maria de Jesus
  (P-0135), as maternal grandfather of children of Manoel de Lemos Pereira and Maria
  Thereza de Jesus. He is the father of Maria Thereza de Jesus (P-0053) [STRONG],
  hence Rosa Eugenia de Lemos's (P-0035) maternal grandfather — and, if "do Porto"
  means the Portuguese city, the first Portugal-born ancestor documented on the Lemos
  side.

  - **Nationality:** Portuguese — "natural do Port[o]" (1821) [PROVEN as written]; the
  reading of "Porto" as the city of Porto is the ordinary one but not stated
  [uncertain], and João's 1841 entry's generic "todos naturaes desta Freguezia" sits
  after his name [conflict, recorded].

  - **Birth, marriage, death:** none located; born no later than about 1780
  [INFERRED].

  ## Evidence standing

  The two entries are original parish records, read from the images [PROVEN]. That
  they concern Rosa's family is strong evidence, not proof: the parents carry exactly
  the names of Rosa's parents, in the same parish register series, and the 1821 and
  1841 entries agree on all four grandparents [STRONG]. His daughter carries the
  devotional "de Jesus", not his surname — the ordinary pattern for daughters then
  [CONTEXTUAL].

  ## Open questions

  - His Porto baptism and parents — the Porto diocesan registers would need his
  parish, which only his Itaboraí marriage or death is likely to give [OPEN].

  - **Leads reported by the retrieval side, images not held here [LEAD]:** he and
  Emerenciana stood godparents together at Itaboraí on 16 August 1822; a son, Manoel
  Campello de Moraes — Maria Thereza's probable brother — appears as the father of
  Procopio (baptised 24 May 1840), whose entry reportedly names "José Campello de
  Morais, e Emerencianna Maria de Jesus" as paternal grandparents; and a "Joze
  Campello" owned enslaved people baptised at Itaboraí in 1830-1833, possibly him
  (identity not established).

  ## Sources held (this repository)

  - PAR-0101 (Antonio's 1821 Itaboraí baptism — "Joze Campello de Moraes, natural do
  Port[o]").

  - PAR-0102 (João's and Maria's 1841 Itaboraí baptisms — "José Campello de Morais").
profile_pt: >-
  ## Identidade

  **José Campello de Moraes** — "Joze Campello de Moraes, natural do Port[o]" no
  batismo de seu neto Antonio, em Itaboraí, de 21 de outubro de 1821 (PAR-0101); "José
  Campello de Morais" nos batismos de seus netos João e Maria, de 4 de março de 1841
  (PAR-0102) [PROVEN]. Os dois registros o nomeiam, com Emerenciana Maria de Jesus
  (P-0135), como avô materno de filhos de Manoel de Lemos Pereira e Maria Thereza de
  Jesus. É o pai de Maria Thereza de Jesus (P-0053) [STRONG], portanto avô materno de
  Rosa Eugenia de Lemos (P-0035) — e, se "do Porto" designa a cidade portuguesa, o
  primeiro ancestral nascido em Portugal documentado do lado Lemos.

  - **Nacionalidade:** portuguesa — "natural do Port[o]" (1821) [PROVEN como escrito];
  ler "Porto" como a cidade do Porto é a leitura corrente, mas não está declarada
  [uncertain], e o genérico "todos naturaes desta Freguezia" do assento de João de
  1841 vem depois do seu nome [conflito, registrado].

  - **Nascimento, casamento, óbito:** nenhum localizado; nascido no máximo por volta de
  1780 [INFERRED].

  ## Situação da evidência

  Os dois assentos são registros paroquiais originais, lidos nas imagens [PROVEN].
  Que digam respeito à família de Rosa é evidência forte, não prova: os pais têm
  exatamente os nomes dos pais de Rosa, na mesma série de livros da freguesia, e os
  assentos de 1821 e 1841 concordam nos quatro avós [STRONG]. Sua filha traz o
  devocional "de Jesus", não o sobrenome dele — o padrão corrente para as filhas na
  época [CONTEXTUAL].

  ## Questões em aberto

  - Seu batismo no Porto e seus pais — os livros da diocese do Porto exigiriam a
  freguesia, que provavelmente só seu casamento ou óbito em Itaboraí dariam [OPEN].

  - **Pistas relatadas pela pesquisa de recuperação, imagens não disponíveis aqui
  [LEAD]:** ele e Emerenciana foram padrinhos juntos em Itaboraí em 16 de agosto de
  1822; um filho, Manoel Campello de Moraes — provável irmão de Maria Thereza —
  aparece como pai de Procopio (batizado em 24 de maio de 1840), cujo assento
  nomearia "José Campello de Morais, e Emerencianna Maria de Jesus" como avós
  paternos; e um "Joze Campello" possuía pessoas escravizadas batizadas em Itaboraí em
  1830-1833, possivelmente ele (identidade não estabelecida).

  ## Fontes disponíveis (neste repositório)

  - PAR-0101 (batismo de Antonio em Itaboraí, 1821 — "Joze Campello de Moraes, natural
  do Port[o]").

  - PAR-0102 (batismos de João e Maria em Itaboraí, 1841 — "José Campello de Morais").
