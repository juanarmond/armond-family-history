notes:
- text: >-
    Father of Maria Thereza de Jesus (P-0053) [STRONG], hence maternal grandfather of
    Rosa Eugenia de Lemos (P-0035) and 5th-great-grandfather of the archive's owner
    (P-0001) through his mother's Bohrer line: P-0001 → P-0003 → P-0007 (Iris) →
    P-0015 (Celina) → P-0030 (Joaquim José) → P-0035 (Rosa) → P-0053 (Maria Thereza) →
    P-0134 (Ahnentafel 246). Known only as a grandparent: the 1821 and 1841 Itaboraí
    baptisms of three children of Manoel de Lemos Pereira and Maria Thereza name him
    as their maternal grandfather, beside Emerenciana Maria de Jesus (P-0135, family
    F-0067) [PROVEN as records]. The link to Rosa's mother is strong evidence, not
    proven — same names, same parish register series, two records twenty years apart
    agreeing on all four grandparents — and is held at strong-evidence (see F-0067).
    Modelled on the owner's authorisation of 2026-10-10.
  text_pt: >-
    Pai de Maria Thereza de Jesus (P-0053) [STRONG], portanto avô materno de Rosa
    Eugenia de Lemos (P-0035) e hexavô do dono do arquivo (P-0001) pela linha Bohrer de
    sua mãe: P-0001 → P-0003 → P-0007 (Iris) → P-0015 (Celina) → P-0030 (Joaquim
    José) → P-0035 (Rosa) → P-0053 (Maria Thereza) → P-0134 (Ahnentafel 246). Conhecido
    apenas como avô: os batismos de 1821 e 1841, em Itaboraí, de três filhos de Manoel
    de Lemos Pereira e Maria Thereza o nomeiam como avô materno, ao lado de Emerenciana
    Maria de Jesus (P-0135, família F-0067) [PROVEN como registros]. O vínculo com a mãe
    de Rosa é evidência forte, não prova — mesmos nomes, mesma série de livros da
    freguesia, dois registros com vinte anos de intervalo concordando nos quatro avós
    — e fica em strong-evidence (ver F-0067). Modelado com a autorização do dono de
    2026-10-10.
- text: >-
    Nationality Portuguese, from a stated naturalidade, not from his surname: the 1821
    baptism (PAR-0101) calls him "natural do Port[o]", set apart from the other
    grandparents, who are "todos naturaes desta Freguezia". Two caveats are recorded.
    (1) The entry writes only "do Porto", without "cidade" or "Portugal"; it is read
    as the city of Porto, the ordinary sense of the formula. A local "Porto" — Porto
    das Caixas, then an arraial (later curato and freguesia) within Itaboraí — cannot
    be excluded from this entry alone [uncertain]. (2) João's 1841 entry (PAR-0102)
    places "todos naturaes desta Freguezia de Itaborahy" directly after his name, which
    read literally would make him a native of Itaboraí; the formula is generic and
    misplaced (it splits him from his wife), and Maria's entry of the same day gives no
    naturalidade, so the specific 1821 statement is preferred. The conflict is kept
    open; his Porto baptism or his Itaboraí marriage or death would settle it.
  text_pt: >-
    Nacionalidade portuguesa, a partir de uma naturalidade declarada, não do
    sobrenome: o batismo de 1821 (PAR-0101) o diz "natural do Port[o]", à parte dos
    demais avós, que são "todos naturaes desta Freguezia". Duas ressalvas ficam
    registradas. (1) O assento escreve só "do Porto", sem "cidade" nem "Portugal"; é
    lido como a cidade do Porto, o sentido corrente da fórmula. Um "Porto" local —
    Porto das Caixas, então arraial (depois curato e freguesia) dentro de Itaboraí —
    não pode ser excluído só por este assento [uncertain]. (2) O assento de João de
    1841 (PAR-0102) põe "todos naturaes desta Freguezia de Itaborahy" logo depois do seu
    nome, o que, lido à letra, o faria natural de Itaboraí; a fórmula é genérica e está
    fora de lugar (separa-o da mulher), e o assento de Maria, do mesmo dia, não dá
    naturalidade, de modo que se prefere a declaração específica de 1821. O conflito
    fica em aberto; seu batismo no Porto ou seu casamento ou óbito em Itaboraí o
    resolveriam.
