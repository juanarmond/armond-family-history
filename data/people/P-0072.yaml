profile: >-
  ## Identity

  **Johann Jacob Wehrli** (Latinised *Jacobus Wehrli* in the parish registers;
  family-name variants *Werhly / Werly / Verli*). The emigrating Wehrli patriarch — the
  deepest ancestor on this branch anchored by a held primary record.

  - **Birth:** 17 January 1751 at Grindel, Soleure (Solothurn), Switzerland — [PROVEN]
  from the Grindel Catholic baptism register (PAR-0027, p.571 row 2; E-0068), which
  upgrades the date from the secondary Casa Suíça database to confirmed.

  - **Parents:** Johannes Wehrli (P-0074) × Barbara Alleman (P-0075), of Grindel —
  [PROVEN] (PAR-0027; family F-0036).

  - **Marriage:** married Elisabetha Borer (P-0073) on 27 January 1782 at Grindel —
  [PROVEN] from the Grindel Catholic marriage register (PAR-0029, p.71 entry 4; E-0065),
  witnesses Heinricus Werli and Catharina Borer.

  - **Emigration:** arrived Nova Friburgo in 1819 aboard the *Heureux Voyage*, aged 68,
  leading his wife and adult children; household at Casa 73 / Lote 86 (PUB-0003).

  - **Death:** 28 May 1827, Nova Friburgo (PUB-0003, strong-evidence; E-0066).

  ## Standing and profession

  - **Farmer (agricultor)** and Catholic — the Catholic confession is documented, not
  inferred from surname: the Grindel registers use the Tridentine sacramental formulae
  ("juxta normam S. Concilii Tridentini"; the Latin headers Parentes / Infantes /
  Patrini). [PROVEN] (PAR-0027, PAR-0029; occupation PUB-0003)

  - He **emigrated as an aged patriarch (68), leading a whole family** rather than as a
  lone young colonist — the defining fact of his life-shape. It was into this settled
  household that Laurent Borer married. [PUB-0003]

  - **Database error to ignore:** the Casa Suíça database field "idade 1819: 49" is
  wrong; born 1751 he was 68 in 1819 (the database's own narrative says "68 anos").
  [PUB-0003]

  ## Family and social network

  - **Wife:** Elisabetha Borer (P-0073), herself a Borer of Erschwil — so the very first
  Wehrli marriage already carried Borer blood into the line.

  - **Daughters into the Borer line:** Anna Maria (P-0069) married Laurent Borer, and on
  the same day (3 July 1820) her sister Salomé married Louis Nicolas Villette
  (PUB-0003). See F-0035 for the collateral children (Henri, Salomé, Catherine, Jacques,
  Joseph, and others).

  - **Register network:** the witnesses at his 1782 marriage — Heinricus Werli (a Wehrli
  kinsman) and Catharina Borer (a Borer kinswoman) — show the Wehrli and Borer families
  already interlinked in Grindel a generation before the Nova Friburgo intermarriages.
  [PROVEN] (PAR-0029)

  ## What we can extrapolate

  - **The 1782 marriage register is the deepest hard anchor on this branch [INFERRED
  from PROVEN records].** Its Wehrli-and-Borer witnesses are strong circumstantial
  support that the Nova Friburgo Borer–Wehrli endogamy was continuous from the old
  country — though not proof.

  - **A clan emigration at 68 [INFERRED]** points to economic pressure strong enough to
  move an established farming family wholesale, and/or recruitment into the 1819 Swiss
  colonisation of Nova Friburgo.

  ## Open questions

  - His **Nova Friburgo death record (28 May 1827)** would raise the death date from
  strong-evidence to primary; the Nova Friburgo registers are reportedly off
  FamilySearch. [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel baptism register — his 1751 baptism and his parents) · PAR-0029
  (Grindel marriage register — his 1782 marriage to Elisabetha Borer).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / Casa Suíça database) — occupation,
  emigration, house/lot and 1827 death.

  ## Regional and migration context

  Grindel sat in the Catholic, German-speaking Thierstein Jura (Schwarzbubenland) of
  canton Solothurn, a small, poor, land-constrained farming parish where he was an
  agricultor. [CONTEXTUAL] He led his whole family out of the Jura on the *Heureux
  Voyage* into Dom João VI's 1819 Swiss colonisation of Nova Friburgo — the push of the
  1816 famine and post-Napoleonic poverty, the pull of the colony contract — and died
  there in 1827, about eight years after arrival.
profile_pt: >-
  ## Identidade

  **Johann Jacob Wehrli** (latinizado *Jacobus Wehrli* nos registros paroquiais;
  variantes do sobrenome *Werhly / Werly / Verli*). O patriarca Wehrli emigrante — o
  ancestral mais profundo deste ramo ancorado por um registro primário em mãos.

  - **Nascimento:** 17 de janeiro de 1751 em Grindel, Soleure (Solothurn), Suíça —
  [PROVEN] pelo registro de batismo da paróquia católica de Grindel (PAR-0027, p.571,
  linha 2; E-0068), que eleva a data do banco de dados secundário da Casa Suíça a
  confirmada.

  - **Pais:** Johannes Wehrli (P-0074) × Barbara Alleman (P-0075), de Grindel — [PROVEN]
  (PAR-0027; família F-0036).

  - **Casamento:** casou-se com Elisabetha Borer (P-0073) em 27 de janeiro de 1782 em
  Grindel — [PROVEN] pelo registro de casamento da paróquia católica de Grindel
  (PAR-0029, p.71, assento 4; E-0065), testemunhas Heinricus Werli e Catharina Borer.

  - **Emigração:** chegou a Nova Friburgo em 1819 no *Heureux Voyage*, aos 68 anos,
  conduzindo a esposa e os filhos adultos; domicílio na Casa 73 / Lote 86 (PUB-0003).

  - **Óbito:** 28 de maio de 1827, Nova Friburgo (PUB-0003, evidência forte; E-0066).

  ## Posição social e profissão

  - **Agricultor** e católico — a confissão católica é documentada, não inferida do
  sobrenome: os registros de Grindel usam as fórmulas sacramentais tridentinas ("juxta
  normam S. Concilii Tridentini"; os cabeçalhos latinos Parentes / Infantes / Patrini).
  [PROVEN] (PAR-0027, PAR-0029; ocupação PUB-0003)

  - **Emigrou como patriarca idoso (68), conduzindo uma família inteira** em vez de como
  jovem colono solitário — o fato definidor de sua vida. Foi neste domicílio já
  estabelecido que Laurent Borer se casou. [PUB-0003]

  - **Erro de banco de dados a ignorar:** o campo "idade 1819: 49" do banco de dados da
  Casa Suíça está errado; nascido em 1751, ele tinha 68 anos em 1819 (a própria narrativa
  do banco de dados diz "68 anos"). [PUB-0003]

  ## Família e rede social

  - **Esposa:** Elisabetha Borer (P-0073), ela mesma uma Borer de Erschwil — de modo que
  o primeiro casamento Wehrli já trazia sangue Borer para a linha.

  - **Filhas rumo à linha Borer:** Anna Maria (P-0069) casou-se com Laurent Borer e, no
  mesmo dia (3 de julho de 1820), sua irmã Salomé casou-se com Louis Nicolas Villette
  (PUB-0003). Ver F-0035 para os filhos colaterais (Henri, Salomé, Catherine, Jacques,
  Joseph e outros).

  - **Rede dos registros:** as testemunhas de seu casamento de 1782 — Heinricus Werli (um
  parente Wehrli) e Catharina Borer (uma parente Borer) — mostram as famílias Wehrli e
  Borer já entrelaçadas em Grindel uma geração antes dos casamentos de Nova Friburgo.
  [PROVEN] (PAR-0029)

  ## O que podemos extrapolar

  - **O registro de casamento de 1782 é a âncora firme mais profunda deste ramo
  [INFERRED a partir de registros PROVEN].** Suas testemunhas Wehrli e Borer são forte
  apoio circunstancial de que a endogamia Borer–Wehrli de Nova Friburgo era contínua
  desde o velho país — embora não prova.

  - **Uma emigração em clã aos 68 [INFERRED]** aponta para pressão econômica forte o
  bastante para mover uma família agrícola estabelecida por inteiro e/ou recrutamento
  para a colonização suíça de Nova Friburgo em 1819.

  ## Questões em aberto

  - Seu **registro de óbito em Nova Friburgo (28 de maio de 1827)** elevaria a data de
  óbito de evidência forte a primária; os registros de Nova Friburgo estão, ao que se
  relata, fora do FamilySearch. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0027 (registro de batismo de Grindel — seu batismo de 1751 e seus pais) ·
  PAR-0029 (registro de casamento de Grindel — seu casamento de 1782 com Elisabetha
  Borer).

  - PUB-0003 (*Imigrantes de Nova Friburgo* / banco de dados da Casa Suíça) — ocupação,
  emigração, casa/lote e óbito de 1827.

  ## Contexto regional e migratório

  Grindel situava-se no Jura católico e germanófono de Thierstein (Schwarzbubenland), no
  cantão de Solothurn, uma paróquia agrícola pequena, pobre e com escassez de terra, onde
  ele era agricultor. [CONTEXTUAL] Conduziu toda a sua família para fora do Jura no
  *Heureux Voyage* rumo à colonização suíça de Nova Friburgo de Dom João VI em 1819 — o
  empurrão da fome de 1816 e da pobreza pós-napoleônica, a atração do contrato de colônia
  — e morreu ali em 1827, cerca de oito anos após a chegada.
