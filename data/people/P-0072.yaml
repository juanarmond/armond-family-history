  nos achados de pesquisa, mas ainda não catalogado aqui como fonte; ter a imagem elevaria a
  data do óbito de evidência forte a primária e daria sua idade e origem declaradas. [OPEN]

  - O **registro de casamento de seus pais** em Grindel, e os batismos deles próprios,
  estenderiam o ramo mais uma geração. [OPEN]

