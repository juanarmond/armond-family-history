profile: >-
  ## Interesting facts

  - **[PROVEN]** His birth on 17 January 1751 at Grindel is fixed by the Grindel Catholic
  baptism register (PAR-0027, p.571, row 2), which names his parents Johannes Wehrli and
  Barbara Alleman in the same entry — upgrading a date previously known only from a secondary
  database.

  - **[CONTEXTUAL]** He emigrated at 68, the oldest documented emigrant in this family,
  leading his wife and adult children onto a crossing in which about a quarter of the
  colonists died of typhus and scurvy. The 1816 "Year Without a Summer" famine and
  post-Napoleonic poverty had made staying in the Jura a worse bet than the sea.

  - **[PROVEN]** The witnesses at his 1782 Grindel marriage were **Heinricus Werli** and
  **Catharina Borer** — a Wehrli and a Borer standing together at the altar thirty-eight years
  before the Nova Friburgo Borer–Wehrli marriages. The colony's endogamy was imported, not
  improvised.

  - **[PROVEN]** His Catholicism is documented in the records themselves, not inferred from a
  surname: the Grindel marriage register is headed "juxta normam S. Concilii Tridentini" —
  marriages performed according to the norm of the Council of Trent — and the baptism register
  uses the Latin sacramental columns *Parentes / Infantes / Patrini*. That mattered
  materially: Dom João VI's 1818 decree contracted for Swiss **Catholic** families, so
  confession was a precondition of recruitment.

  - **[CONTEXTUAL]** He died on 28 May 1827, eight years after landing — long enough to see
  two daughters married into the colony in 1820 and the settlement's worst decade, not long
  enough to see a grandchild reach adulthood. He was buried in cemetery lot nº 61 at Nova
  Friburgo, where his widow joined him five years later.

  - **[PROVEN]** A database error to disregard: the Casa Suíça field "idade 1819: 49" is
  wrong. Born in 1751 he was 68 in 1819 — as the same database's own narrative text says.

  ## Identity

  **Johann Jacob Wehrli** (Latinised *Jacobus Werly / Wehrli* in the parish registers;
  family-name variants *Werhly / Werly / Verli*). The emigrating Wehrli patriarch — the
  deepest ancestor on this branch anchored by a held primary record.

  - **Birth:** 17 January 1751 at Grindel, Soleure (Solothurn), Switzerland — [PROVEN] from
  the Grindel Catholic baptism register (PAR-0027, p.571 row 2; event E-0068). His godfather
  was **Hans Jacob Heggendorn** — the same surname that reappears as Heggendorn/Eggendorn in
  the Nova Friburgo generations.

  - **Parents:** Johannes Wehrli (P-0074) × Barbara Alleman (P-0075), of Grindel — [PROVEN]
  (PAR-0027; family F-0036). A younger brother, Johann Joseph Wehrli, was baptised on 23 June
  1752 in the same register.

  - **Marriage:** married Elisabetha Borer (P-0073) on 27 January 1782 at Grindel, "In facie
  Ecclesiae … Honestus Juvenis Jacobus Werly et Elisabetha Borer ambo ex Grindel[-Erschwyl]" —
  [PROVEN] (PAR-0029, p.71 entry 4; event E-0065); witnesses Heinricus Werly and Catharina
  Borer, parish priest Ursus Victor Grütz.

  - **Emigration:** arrived at Nova Friburgo in 1819 aboard the *Heureux Voyage*, aged 68,
  leading his wife and adult children; the household held Casa 73 / Lote 86 (PUB-0003).

  - **Death:** 28 May 1827, Nova Friburgo (PUB-0003, strong-evidence; event E-0066; Óbito L1
  f.65), buried in "cemeterio do nº 61" — the same lot in which his widow was buried in 1832.

  ## Standing and profession

  - **Farmer (*agricultor*)** and Catholic. The occupation comes from the compilation
  [PUB-0003]; the confession is documented in the registers' own Tridentine formulae [PROVEN —
  PAR-0027, PAR-0029]. No office, title, property or literacy record attaches to him: he is a
  Jura smallholder, and the honest reading is that nothing in the record raises him above
  that.

  - **He emigrated as an aged patriarch leading a whole household**, not as a lone young
  colonist — the defining fact of his life-shape, and the reason Laurent Borer could marry
  *into* a functioning family rather than build one. [PUB-0003]

  - **His Brazilian material base was the state package**, not a wage: under the *Decreto de
  16 de maio de 1818* the household received a lot and a built house, rations, seed and
  livestock, and a daily subsidy of 0$160 falling to 0$080 across a two-year establishment
  period — roughly 58$000 in year one, about one-seventh of a free rural labourer's ~420$000.
  [CONTEXTUAL — role-based]

  ## Family and social network

  - **Wife:** Elisabetha Borer (P-0073), herself a Borer of Erschwil — so the very first
  Wehrli marriage in this line already carried Borer blood into it.

  - **Daughters into the Borer line:** Anna Maria (P-0069) married Laurent Borer, and on the
  same day — 3 July 1820, consecutive entries in the Nova Friburgo marriage book — her sister
  Salomea married Luiz Nicolão Vilette, with Laurent as witness (PAR-0060). See F-0035 for the
  collateral children (Henri, Salomé, Catherine, Jacques, Joseph and others).

  - **Register network:** the 1751 baptism gives a **Heggendorn** godfather and the 1782
  marriage a **Wehrli** and a **Borer** witness — the three surnames that recombine at Nova
  Friburgo for the next three generations already stand around him in Grindel. [PROVEN —
  PAR-0027, PAR-0029]

  ## What we can extrapolate

  - **Standing: a settled smallholder, and that is the ceiling [CONTEXTUAL / INFERRED].** His
  documented occupation — *agricultor* in Grindel — places him on the land-holding-but-poor
  peasant rung of the Solothurn Jura, not among burghers, officeholders or anyone with a
  title. He acquired nothing by office (there is none), nothing by marriage (Elisabetha was a
  Borer of the same village world), and nothing by trade. What he had he had by birth, and it
  was small. That makes him the Old-World floor of this whole branch: the level from which the
  Bohrer arc is measured upward, and the structural mirror image of the family's Armond line,
  which began at an office-and-marriage elite and fell.

  - **Wealth mechanics: land, but the wrong kind, and then a substitute for it [CONTEXTUAL].**
  A Jura farm is heritable capital in principle — which is precisely why partible division
  destroyed it. Solothurn holdings were split among heirs until the shares would not feed a
  household, and he had eight or more children. What he exchanged it for in 1819 was not land
  he owned outright but a state settlement package with an expiry date, on a stony serra plot.
  He traded a fragmenting heritable asset for a temporary subsidy plus a poor one — and the
  second was, at best, a wash.

  - **Emigrating at 68 is the measure of the pressure [INFERRED].** Men of 68 do not clear
  mountain forest by choice. Moving an established farming household wholesale, at that age,
  onto a crossing that killed roughly a quarter of the colonists, is what a family does when
  the alternative at home has become worse than the risk. He died eight years later, having
  gained his household a lot and not much else; the decision reads as flight from the
  1816-famine aftermath and Jura land hunger, not as an investment.

  - **He founded the colony's marriage pool — and the succession floor under it [CONTEXTUAL /
  INFERRED].** He brought eight or more adult children into a settlement of a few hundred
  Catholic families, and the Borer, Heggendorn, Freese and Singy households married into them;
  two of his own daughters married on one day. That pool was the family's social capital for a
  century. It was also its ceiling: everyone in it held the same thing, so marriage
  consolidated rather than accumulated, and Brazilian partible succession then divided
  whatever the household held among all those children, and again among theirs.

  - **Education: he is the source of the one asset that crossed intact [CONTEXTUAL /
  INFERRED].** The Solothurn Jura's Catholic parishes gave their smallholders German
  parish-school literacy — an asset 19th-century Brazil did not supply, since schooling there
  was a purchased, class-linked privilege with no free rural alternative. Nothing documents
  his own letters directly, and the honest label is [CONTEXTUAL], not proven. But the
  asymmetry is visible downstream: the other Solothurn Borer branch kept it (Francisco José
  Borer signs his own 1888 will; his sons reach commerce, local office and a newspaper), while
  his own daughter's branch lost it (her grandson Valentim was unable to write in 1891,
  CIV-0045). Imported literacy behaved exactly like property in Brazil — held where there was
  money to renew it, lost where there was not.

  - **The arc, named [INFERRED].** Grindel *agricultor* on a divided holding (1751–1819) →
  **turning point: the 1819 decree**, which he took at 68, converting a fragmenting Jura farm
  into a poor colony lot → a household planted on Casa 73 / Lote 86, married outward into the
  colony pool within a year → dead in 1827 with the settlement still struggling. Lateral, not
  upward; no fortune was made and none was lost. Everything that follows on this branch — the
  drift off the lot, the *lavradores* of Bom Jardim, and much later the move to the city — is
  worked out from the floor he set.

  ## Open questions

  - His **Nova Friburgo death record (28 May 1827, Óbito L1 f.65)** — cited in the research
  findings but not yet catalogued here as a source; holding the image would raise the death
  date from strong-evidence to primary and give his stated age and origin. [OPEN]

  - His parents' **marriage record** at Grindel, and their own baptisms, would extend the
  branch one generation further. [OPEN]

  ## Sources held (this repository)

  - PAR-0027 (Grindel Catholic baptism register, p.571 — his 1751 baptism, his parents
  Johannes Wehrli × Barbara Alleman, and his brother Johann Joseph's 1752 baptism; godfather
  Hans Jacob Heggendorn; sources event E-0068).

  - PAR-0029 (Grindel Catholic marriage register, p.71 entry 4 — his 1782 marriage to
  Elisabetha Borer, witnesses Heinricus Werly and Catharina Borer; sources event E-0065).

  - PAR-0060 (his daughter Anna Maria's 1820 Nova Friburgo marriage — names him "João Jacobo
  Verly, natural de Grindel").

  - PUB-0003 (*Imigrantes de Nova Friburgo* and the Casa Suíça database) — his occupation, the
  emigration, the house and lot, and the 1827 death.

  ## Regional and migration context

  Grindel sat in the Bezirk Thierstein of canton Solothurn — the Catholic, German-speaking
  Jura upland called the Schwarzbubenland — a small, poor, land-constrained farming parish
  where he was an *agricultor*. [CONTEXTUAL] He led his whole family out of it on the *Heureux
  Voyage* in 1819, into Dom João VI's Swiss colonisation of Nova Friburgo, and died there in
  1827, about eight years after arrival. That colony was manufactured by the *Decreto de 16 de
  maio de 1818*, which commissioned the Fribourg agent S.-N. Gachet to settle 100 Swiss
  **Catholic** families on the Fazenda do Morro Queimado — the only Brazilian city founded by
  royal decree, in a serra chosen to resemble Switzerland — and its Catholic requirement was a
  genuine selection driver for this Solothurn trunk. The underlying push was the 1815 Tambora
  eruption and the 1816 "Year Without a Summer" famine on top of chronic Jura land hunger;
  recruitment overshot to some 261–265 families, and about a quarter of the colonists died at
  sea. [CONTEXTUAL]

  ## Where to go today

  - **Birthplace parish and marriage (27 January 1782):** Kath. Pfarrkirche St. Stephan, 4247
  Grindel, Kt. Solothurn, Switzerland (GPS 47.3833, 7.5042) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=47.3833,7.5042)

  - **Death (28 May 1827) and burial (cemetery lot nº 61):** Catedral Diocesana / Igreja
  Matriz de São João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo,
  RJ — the present cathedral, inaugurated 1869, postdates his burial, which took place through
  the colony's earlier São João Batista church on the same site [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu nascimento em 17 de janeiro de 1751, em Grindel, está fixado pelo livro
  de batismos católico de Grindel (PAR-0027, p.571, linha 2), que nomeia seus pais Johannes
  Wehrli e Barbara Alleman no mesmo assento — elevando uma data antes conhecida apenas por um
  banco de dados secundário.

  - **[CONTEXTUAL]** Emigrou aos 68 anos, o mais velho emigrante documentado desta família,
  conduzindo esposa e filhos adultos numa travessia em que cerca de um quarto dos colonos
  morreu de tifo e escorbuto. A fome do "Ano Sem Verão" de 1816 e a pobreza pós-napoleônica
  haviam tornado ficar no Jura uma aposta pior do que o mar.

  - **[PROVEN]** As testemunhas de seu casamento de 1782 em Grindel foram **Heinricus Werli**
  e **Catharina Borer** — um Wehrli e uma Borer juntos ao altar trinta e oito anos antes dos
  casamentos Borer–Wehrli de Nova Friburgo. A endogamia da colônia foi importada, não
  improvisada.

  - **[PROVEN]** Seu catolicismo está documentado nos próprios registros, e não inferido de
  sobrenome: o livro de casamentos de Grindel é encabeçado "juxta normam S. Concilii
  Tridentini" — casamentos celebrados segundo a norma do Concílio de Trento — e o livro de
  batismos usa as colunas sacramentais latinas *Parentes / Infantes / Patrini*. Isso pesou
  materialmente: o decreto de 1818 de Dom João VI contratava famílias suíças **católicas**, de
  modo que a confissão era precondição do recrutamento.

  - **[CONTEXTUAL]** Morreu em 28 de maio de 1827, oito anos após o desembarque — tempo
  bastante para ver duas filhas casadas na colônia, em 1820, e a pior década do assentamento;
  não o bastante para ver um neto chegar à idade adulta. Foi sepultado no lote de cemitério nº
  61, em Nova Friburgo, onde a viúva se juntou a ele cinco anos depois.

  - **[PROVEN]** Um erro de banco de dados a desconsiderar: o campo da Casa Suíça "idade 1819:
  49" está errado. Nascido em 1751, tinha 68 anos em 1819 — como diz o próprio texto narrativo
  do mesmo banco de dados.

  ## Identidade

  **Johann Jacob Wehrli** (latinizado *Jacobus Werly / Wehrli* nos registros paroquiais;
  variantes do sobrenome *Werhly / Werly / Verli*). O patriarca Wehrli emigrante — o ancestral
  mais profundo deste ramo ancorado por um registro primário disponível.

  - **Nascimento:** 17 de janeiro de 1751, em Grindel, Soleure (Solothurn), Suíça — [PROVEN]
  pelo livro de batismos católico de Grindel (PAR-0027, p.571, linha 2; evento E-0068). Seu
  padrinho foi **Hans Jacob Heggendorn** — o mesmo sobrenome que reaparece como
  Heggendorn/Eggendorn nas gerações de Nova Friburgo.

  - **Pais:** Johannes Wehrli (P-0074) × Barbara Alleman (P-0075), de Grindel — [PROVEN]
  (PAR-0027; família F-0036). Um irmão mais novo, Johann Joseph Wehrli, foi batizado em 23 de
  junho de 1752 no mesmo livro.

  - **Casamento:** casou-se com Elisabetha Borer (P-0073) em 27 de janeiro de 1782, em
  Grindel, "In facie Ecclesiae … Honestus Juvenis Jacobus Werly et Elisabetha Borer ambo ex
  Grindel[-Erschwyl]" — [PROVEN] (PAR-0029, p.71, assento 4; evento E-0065); testemunhas
  Heinricus Werly e Catharina Borer, pároco Ursus Victor Grütz.

  - **Emigração:** chegou a Nova Friburgo em 1819 a bordo do *Heureux Voyage*, aos 68 anos,
  conduzindo esposa e filhos adultos; o domicílio ocupou a Casa 73 / Lote 86 (PUB-0003).

  - **Óbito:** 28 de maio de 1827, Nova Friburgo (PUB-0003, evidência forte; evento E-0066;
  Óbito L1 f.65), sepultado no "cemeterio do nº 61" — o mesmo lote em que a viúva foi
  sepultada em 1832.

  ## Posição social e profissão

  - **Agricultor** e católico. A ocupação vem da compilação [PUB-0003]; a confissão está
  documentada nas próprias fórmulas tridentinas dos registros [PROVEN — PAR-0027, PAR-0029].
  Nenhum cargo, título, propriedade ou registro de alfabetização lhe se atribui: é um pequeno
  lavrador do Jura, e a leitura honesta é que nada no registro o eleva acima disso.

  - **Emigrou como patriarca idoso à frente de um domicílio inteiro**, e não como jovem colono
  solitário — o fato definidor da forma de sua vida, e a razão pela qual Laurent Borer pôde
  casar-se *para dentro* de uma família em funcionamento, em vez de construir uma. [PUB-0003]

  - **Sua base material no Brasil foi o pacote estatal**, não um salário: pelo *Decreto de 16
  de maio de 1818*, o domicílio recebeu um lote e uma casa construída, víveres, sementes e
  gado, e um subsídio diário de 0$160 caindo a 0$080 ao longo de dois anos de estabelecimento
  — cerca de 58$000 no primeiro ano, mais ou menos um sétimo dos ~420$000 de um trabalhador
  rural livre. [CONTEXTUAL — baseado no papel]

  ## Família e rede social

  - **Esposa:** Elisabetha Borer (P-0073), ela própria uma Borer de Erschwil — de modo que o
  primeiro casamento Wehrli desta linha já trouxe sangue Borer para dentro dela.

  - **Filhas para a linha Borer:** Anna Maria (P-0069) casou-se com Laurent Borer e, no mesmo
  dia — 3 de julho de 1820, assentos consecutivos do livro de casamentos de Nova Friburgo —, a
  irmã Salomea casou-se com Luiz Nicolão Vilette, tendo Laurent como testemunha (PAR-0060).
  Ver F-0035 para os filhos colaterais (Henri, Salomé, Catherine, Jacques, Joseph e outros).

  - **Rede dos registros:** o batismo de 1751 dá um padrinho **Heggendorn** e o casamento de
  1782, uma testemunha **Wehrli** e uma **Borer** — os três sobrenomes que se recombinam em
  Nova Friburgo pelas três gerações seguintes já estão à sua volta em Grindel. [PROVEN —
  PAR-0027, PAR-0029]

  ## O que podemos extrapolar

  - **Posição: um pequeno lavrador estabelecido, e esse é o teto [CONTEXTUAL / INFERRED].**
  Sua ocupação documentada — *agricultor* em Grindel — o situa no degrau camponês com terra,
  porém pobre, do Jura de Solothurn, e não entre burgueses, detentores de cargo ou quem quer
  que tivesse título. Não adquiriu nada por cargo (não há nenhum), nada por casamento
  (Elisabetha era uma Borer do mesmo mundo de aldeia) e nada por ofício. O que tinha, tinha
  por nascimento, e era pouco. Isso faz dele o piso do Velho Mundo de todo este ramo: o nível
  a partir do qual o arco Bohrer é medido para cima, e a imagem espelhada estrutural da linha
  Armond da família, que partiu de uma elite de cargo e casamento e caiu.

  - **Mecânica da riqueza: terra, mas do tipo errado, e depois um substituto dela
  [CONTEXTUAL].** Uma lavoura do Jura é, em princípio, capital herdável — e é precisamente por
  isso que a divisão partível a destruiu. As posses de Solothurn eram repartidas entre
  herdeiros até os quinhões não alimentarem um domicílio, e ele teve oito filhos ou mais. O
  que trocou por ela em 1819 não foi terra de sua plena propriedade, e sim um pacote estatal
  de assentamento com prazo de validade, numa gleba serrana pedregosa. Trocou um ativo
  herdável em fragmentação por um subsídio temporário mais um ativo pobre — e o segundo foi,
  na melhor hipótese, empate.

  - **Emigrar aos 68 é a medida da pressão [INFERRED].** Homens de 68 anos não desbravam mata
  de montanha por escolha. Mover um domicílio agrícola estabelecido por inteiro, nessa idade,
  numa travessia que matou cerca de um quarto dos colonos, é o que uma família faz quando a
  alternativa em casa passou a ser pior do que o risco. Morreu oito anos depois, tendo
  conseguido ao domicílio um lote e pouco mais; a decisão se lê como fuga do rescaldo da fome
  de 1816 e da fome de terra do Jura, não como investimento.

  - **Ele fundou o repertório matrimonial da colônia — e o piso sucessório sob ele [CONTEXTUAL
  / INFERRED].** Levou oito ou mais filhos adultos para um assentamento de poucas centenas de
  famílias católicas, e os domicílios Borer, Heggendorn, Freese e Singy casaram-se com eles;
  duas de suas próprias filhas casaram-se no mesmo dia. Esse repertório foi o capital social
  da família por um século. Foi também seu teto: todos ali tinham a mesma coisa, de modo que o
  casamento consolidava em vez de acumular, e a sucessão partível brasileira depois dividia o
  que o domicílio tivesse entre todos esses filhos, e outra vez entre os filhos deles.

  - **Educação: ele é a origem do único ativo que atravessou intacto [CONTEXTUAL /
  INFERRED].** As paróquias católicas do Jura de Solothurn davam a seus pequenos lavradores
  alfabetização de escola paroquial em alemão — ativo que o Brasil do século XIX não fornecia,
  já que a escolarização ali era privilégio comprado e ligado à classe, sem alternativa rural
  gratuita. Nada documenta diretamente as letras dele, e o rótulo honesto é [CONTEXTUAL], não
  provado. Mas a assimetria é visível rio abaixo: o outro ramo Borer de Solothurn a manteve
  (Francisco José Borer assina o próprio testamento de 1888; seus filhos chegam ao comércio, a
  cargo local e a um jornal), enquanto o ramo de sua própria filha a perdeu (o neto dela,
  Valentim, não sabia escrever em 1891, CIV-0045). A alfabetização importada comportou-se no
  Brasil exatamente como propriedade — mantida onde havia dinheiro para renová-la, perdida
  onde não havia.

  - **O arco, nomeado [INFERRED].** *Agricultor* de Grindel numa posse dividida (1751–1819) →
  **ponto de virada: o decreto de 1819**, que aceitou aos 68, convertendo uma lavoura do Jura
  em fragmentação num lote colonial pobre → um domicílio plantado na Casa 73 / Lote 86, casado
  para fora dentro do repertório colonial em menos de um ano → morto em 1827, com o
  assentamento ainda em dificuldades. Lateral, não ascendente; nenhuma fortuna foi feita e
  nenhuma foi perdida. Tudo o que se segue neste ramo — a saída do lote, os *lavradores* do
  Bom Jardim e, muito depois, a ida para a cidade — se resolve a partir do piso que ele fixou.

  ## Questões em aberto

