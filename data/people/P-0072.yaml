  - **Óbito (28 maio 1827):** Catedral Diocesana / Igreja Matriz de São João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ, Brasil (GPS -22.28159, -42.53085) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
