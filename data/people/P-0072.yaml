  ## Contexto regional e migratório

  Grindel ficava no Bezirk Thierstein, cantão de Solothurn — o planalto católico e germanófono
  do Jura chamado Schwarzbubenland —, pequena paróquia agrícola pobre e limitada em terra,
  onde ele era *agricultor*. [CONTEXTUAL] Conduziu dali toda a família no *Heureux Voyage*, em
  1819, rumo à colonização suíça de Nova Friburgo de Dom João VI, e ali morreu em 1827, cerca
  de oito anos após a chegada. Essa colônia foi fabricada pelo *Decreto de 16 de maio de
  1818*, que encarregou o agente friburguês S.-N. Gachet de assentar 100 famílias suíças
  **católicas** na Fazenda do Morro Queimado — a única cidade brasileira fundada por decreto
  real, numa serra escolhida por assemelhar-se à Suíça — e sua exigência católica foi um motor
  de seleção real para este tronco de Solothurn. O empurrão de fundo foi a erupção do Tambora
  em 1815 e a fome do "Ano Sem Verão" de 1816 somadas à fome crônica de terra do Jura; o
  recrutamento excedeu para cerca de 261–265 famílias, e aproximadamente um quarto dos colonos
  morreu no mar. [CONTEXTUAL]

