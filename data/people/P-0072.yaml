notes:
- text: >-
    Patriarch of the Wehrli immigrant family in Nova Friburgo. Arrived on the Heureux
    Voyage in 1819 with his wife Elisabetha Borer (P-0073) and most of their children,
    including Anna Maria (P-0069), Laurent Borer's future wife.
  text_pt: >-
    Patriarca da família imigrante Wehrli em Nova Friburgo. Chegou no Heureux
    Voyage em 1819 com sua esposa Elisabetha Borer (P-0073) e a maioria de seus
    filhos, incluindo Anna Maria (P-0069), a futura esposa de Laurent Borer.
- text: >-
    Born 17 January 1751, Grindel, Soleure (Solothurn), Switzerland — PRIMARY
    evidence: Grindel Catholic parish baptism register (PAR-0027, page 571, row 2):
    "17 Januar. 1751, Gofannef Jacobif, parents Johannis Whroli × Barbara Allman."
    Parents confirmed as Johannes Wehrli (P-0074) × Barbara Alleman (P-0075).
    This upgrades the birth date from strong-evidence (PUB-0003 Casa Suíça DB)
    to confirmed. Casa Suíça DB lists his age at arrival (1819) as 49 — a database
    error; born 1751, he was actually ~68 in 1819; the DB narrative text correctly
    states '68 anos.'
  text_pt: >-
    Nascido em 17 de janeiro de 1751, Grindel, Soleure (Solothurn), Suíça —
    evidência PRIMÁRIA: registro de batismo da paróquia católica de Grindel
    (PAR-0027, página 571, linha 2): "17 Januar. 1751, Gofannef Jacobif, parents
    Johannis Whroli × Barbara Allman." Pais confirmados como Johannes Wehrli
    (P-0074) × Barbara Alleman (P-0075). Isso eleva a data de nascimento de
    evidência forte (banco de dados da Casa Suíça, PUB-0003) para confirmada. O
    banco de dados da Casa Suíça lista sua idade na chegada (1819) como 49 — um
    erro do banco de dados; nascido em 1751, ele tinha na verdade ~68 anos em
    1819; o texto narrativo do banco de dados afirma corretamente '68 anos.'
- text: >-
    His daughter Anna Maria Werhly (P-0069) married Laurent Borer (P-0068) on the
    same day — 03/07/1820 — as his daughter Salomé married Louis Nicolas Villette.
    The Wehrli and Borer families were closely linked (Elisabetha Borer's surname
    suggests kinship with Laurent's father's family).
  text_pt: >-
    Sua filha Anna Maria Werhly (P-0069) casou-se com Laurent Borer (P-0068) no
    mesmo dia — 03/07/1820 — em que sua filha Salomé se casou com Louis Nicolas
    Villette. As famílias Wehrli e Borer eram estreitamente ligadas (o sobrenome
    de Elisabetha Borer sugere parentesco com a família do pai de Laurent).
