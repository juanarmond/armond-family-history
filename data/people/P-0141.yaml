notes:
- text: >-
    Antenor Muniz's 2×-great-grandfather: father of Manoel João Fernandes da Cruz (P-0139). Of
    the lugar de Quintã / Quintão, São Romão da Ucha, Barcelos; "natural desta freguezia" (PAR-0121).
    Probably born 20 October 1807 (PAR-0109) and probably died 23 June 1860 (PAR-0110) — both
    strong identifications, not proofs; certainly dead by 14 April 1884 ("já Falecido", PRB-0015)
    and named as dead in his widow's 1885 procuração (PRB-0016).
  text_pt: >-
    Trisavô de Antenor Muniz: pai de Manoel João Fernandes da Cruz (P-0139). Do lugar de Quintã
    / Quintão, São Romão da Ucha, Barcelos; "natural desta freguezia" (PAR-0121). Provavelmente
    nascido em 20 de outubro de 1807 (PAR-0109) e provavelmente falecido em 23 de junho de 1860
    (PAR-0110) — ambas identificações fortes, não provas; com certeza já falecido em 14 de abril
    de 1884 ("já Falecido", PRB-0015) e dado como morto na procuração da viúva em 1885 (PRB-0016).
