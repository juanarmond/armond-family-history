  ## Contexto regional e migratório


  São Romão da Ucha é uma freguesia rural do concelho de Barcelos, no distrito e arquidiocese
  de Braga, no Minho. [CONTEXTUAL] Portugal não tinha registro civil em vida dele — só se tornou
  obrigatório em 1911 —, de modo que os livros paroquiais são os registros vitais. A reforma dos
  registros paroquiais que entrou em vigor em 1860 aparece em seu próprio assento de óbito, numerado
  e lavrado "em duplicado" (PAR-0110), ao contrário do assento sem número do filho, no ano anterior
  (PAR-0117). [CONTEXTUAL; a forma dos assentos, PROVEN]


  O Minho era uma das regiões mais densamente povoadas de Portugal, uma terra de pequenas propriedades
  divididas a cada herança e, ao longo do século XIX, uma das principais fontes da emigração portuguesa
  para o Brasil. [CONTEXTUAL] Não se sabe que ele tenha deixado Ucha. Dois de seus filhos aparecem
  na Zona da Mata de Minas Gerais em 1884–1885 — Domingos no Laranjal, termo de Cataguases, e
  Manoel João em São João do Laranjal (PRB-0015, PRB-0016) —, e a família de Manoel João, mais
  tarde, em Bom Jesus da Cachoeira Alegre, Muriaé (PRB-0013, PRB-0014). [PROVEN] Quando cada um
  dos filhos deixou Portugal não está registrado. [OPEN]


