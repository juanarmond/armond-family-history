  dela, a Pousa, cujos casamentos de 1755–1859 não sobrevivem no catálogo do Arquivo Distrital
  de Braga nem no FamilySearch. [OPEN — negativo delimitado, conforme informado] Os assentos de
  casamento desta arquidiocese costumam nomear os dois pares de pais [INFERRED], de modo que este
  teria posto à prova a identificação de 1807.

  - **Um registro que ligue as duas pontas de sua vida.** Vários de seus filhos eram menores em
  1860 — Thereza, Bento e o segundo José eram adolescentes (PAR-0119, PAR-0120, PAR-0122) —, de
  modo que um inventário orfanológico pode ter sido aberto em Barcelos depois de sua morte; nomearia
  ele, a viúva e os herdeiros, e descreveria a terra. [INFERRED — não pesquisado]

  - **O homônimo a excluir.** A pesquisa de recuperação assinala um segundo casal na Quintam nos
  mesmos anos, Manoel Fernandes × Jozefa de Macedo, cuja mulher poderia em princípio ser escrita
  "Jozefa Maria"; não encontrou nenhum Bento desse casal em 1795–1829. [LEAD] É por isso que a
  identificação de 1807 é forte, e não provada.

  - **Anna Maria, n. 1806** — arquivar o batismo que o agente de recuperação leu mostraria se
  ela é a "tia paterna" de 1829. [LEAD]

  - **Se o assento de 1860 não for o dele**, morreu noutro lugar: a pesquisa de recuperação não
