profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Born around 1851 in Nova Friburgo's Lutheran community — a third-generation colonist child growing up in the period when the colony had matured from a frontier settlement into an established agricultural and trade community, with German-language church registers still in active use.

  - **[PROVEN]** Her 1872 Lutheran marriage records her mother Maria Luiza née Stoffel as already deceased ("verstorbenen"), meaning she had lost her mother before marrying at approximately age 21. (PAR-0068)

  - **[INFERRED]** Her marriage to Jacob Klein in 1872 united two families — Schenkel and Klein — both rooted in the German Protestant wing of the Nova Friburgo colony. Endogamous marriage within the Lutheran community was the norm before the next generation crossed into Catholic families.

  - **[CONTEXTUAL]** She carries both the Schenkel and Stoffel surnames into the Bohrer family tree: her maternal grandfather Joseph Stoffel is explicitly described as a "Schweizer Colonist" in the 1847 register, meaning one branch of her ancestry was Swiss even within the German-dominant Lutheran congregation.

  ## Identity

  **Maria Luiza Schenkel** — a Lutheran colonist of Nova Friburgo who married Jacob Klein in
  1872, carrying the Schenkel and Stoffel lines into the Bohrer family. [PROVEN]

  - **Role:** mother of Carolina Klein (P-0029) and wife of Jacob Klein (P-0103; family F-0051);
  Iris Bohrer Muniz's great-grandmother on the Klein/Schenkel line. [PROVEN]

  - **Marriage:** married Jacob Klein at the Nova Friburgo Lutheran church on 29 April 1872
  (PAR-0068, event E-0092), aged 21 (born ~1851); legitimate daughter of Conrad Schenkel
  (P-0107) and the late Maria Luiza née Stoffel (P-0108); family F-0053. Her mother had
  died before 1872. [PROVEN]

  - **Named as Carolina's mother** in Valentim Martinho Bohrer's 1890 Catholic marriage at the
  Nova Friburgo Matriz (PAR-0064), alongside her husband Jacob Klein. [PROVEN]

  ## Open questions

  - Her birth date, baptism, and death record are not yet located; nationality is unset
  pending her origin. [OPEN]

  ## Sources held (this repository)

  - PAR-0068 (her 1872 Lutheran marriage — names her, records age 21 and filiation).

  - PAR-0064 (the 1890 Catholic marriage of Valentim × Carolina — names her as Carolina's
  mother).
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Nascida por volta de 1851 na comunidade luterana de Nova Friburgo — uma criança colona de terceira geração que cresceu num período em que a colônia havia amadurecido de um assentamento de fronteira para uma comunidade agrícola e comercial consolidada, com registros eclesiásticos em língua alemã ainda em uso ativo.

  - **[PROVEN]** Seu casamento luterano de 1872 registra sua mãe Maria Luiza nascida Stoffel como já falecida ("verstorbenen"), o que significa que ela havia perdido a mãe antes de se casar, com aproximadamente 21 anos de idade. (PAR-0068)

  - **[INFERRED]** Seu casamento com Jacob Klein em 1872 uniu duas famílias — Schenkel e Klein — ambas enraizadas na ala protestante alemã da colônia de Nova Friburgo. O casamento endogâmico dentro da comunidade luterana era a norma antes que a geração seguinte cruzasse para famílias católicas.

  - **[CONTEXTUAL]** Ela carrega os sobrenomes Schenkel e Stoffel para a árvore genealógica da família Bohrer: seu avô materno Joseph Stoffel é explicitamente descrito como "Schweizer Colonist" no registro de 1847, o que significa que um ramo de sua ascendência era suíço mesmo dentro da congregação luterana de predominância alemã.

  ## Identidade

  **Maria Luiza Schenkel** — colona luterana de Nova Friburgo que se casou com Jacob Klein
  em 1872, levando as linhas Schenkel e Stoffel à família Bohrer. [PROVEN]

  - **Papel:** mãe de Carolina Klein (P-0029) e esposa de Jacob Klein (P-0103; família F-0051);
  bisavó de Iris Bohrer Muniz nas linhas Klein/Schenkel. [PROVEN]

  - **Casamento:** casou-se com Jacob Klein na igreja luterana de Nova Friburgo em 29 de
  abril de 1872 (PAR-0068, evento E-0092), com 21 anos de idade (nascida ~1851); filha
  legítima de Conrad Schenkel (P-0107) e da falecida Maria Luiza nascida Stoffel (P-0108);
  família F-0053. Sua mãe havia falecido antes de 1872. [PROVEN]

  - **Nomeada como mãe de Carolina** no casamento católico de 1890 de Valentim Martinho
  Bohrer na Matriz de Nova Friburgo (PAR-0064), ao lado de seu marido Jacob Klein. [PROVEN]

  ## Questões em aberto

  - Sua data de nascimento, batismo e registro de óbito ainda não foram localizados;
  nacionalidade não definida, pendente de origem. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0068 (seu casamento luterano de 1872 — nomeia-a, registra 21 anos e filiação).

  - PAR-0064 (casamento católico de 1890 de Valentim × Carolina — nomeia-a como mãe de
  Carolina).
