profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1872 Lutheran marriage records her mother Maria Luiza née Stoffel as already
  deceased ("verstorbenen"), meaning she had lost her mother before marrying at approximately
  age 21. (PAR-0068)

  - **[PROVEN / index-derived]** Contrary to an earlier blog estimate ("died before 1889"), she was
  alive and bearing children well into the 1890s: she is named as mother in baptism entries for
  Antônio Ramos (1891) and Palmira Eugênia (1896) in the São José do Ribeirão Catholic index
  (Raibert NF Batismos). She therefore lived to at least 1896, at approximately age 45 — a full
  colonist lifespan. The "died young / before 1889" reading is retracted.

  - **[PROVEN / LEAD]** She and Jacob Klein had at least ten children spanning 1869 to 1896: two
  children (Maria b. 1869, José Marque b. 1871) were born before their April 1872 Lutheran
  marriage; Carolina (~1873) is the direct ancestor in Juan's line. All siblings are collateral
  LEADS — the São José do Ribeirão Catholic books are undigitised and off-tool.

  - **[CONTEXTUAL]** She carries both the Schenkel and Stoffel surnames into the Bohrer family
  tree: her maternal grandfather Joseph Stoffel is explicitly described as a "Schweizer Colonist"
  in the 1847 register, meaning one branch of her ancestry was Swiss even within the German-dominant
  Lutheran congregation.

  ## Identity

  **Maria Luiza Schenkel** — a Lutheran colonist of Nova Friburgo who married Jacob Klein in
  1872, carrying the Schenkel and Stoffel lines into the Bohrer family. [PROVEN]

  - **Role:** mother of Carolina Klein (P-0029) and wife of Jacob Klein (P-0103; family F-0051);
  Iris Bohrer Muniz's 3×-great-grandmother on the Klein/Schenkel line. [PROVEN]

  - **Marriage:** married Jacob Klein at the Nova Friburgo Lutheran church on 29 April 1872
  (PAR-0068, event E-0092), aged 21 (born ~1851); legitimate daughter of Conrad Schenkel
  (P-0107) and the late Maria Luiza née Stoffel (P-0108); family F-0053. Her mother had
  died before 1872. [PROVEN]

  - **Named as Carolina's mother** in Valentim Martinho Bohrer's 1890 Catholic marriage at the
  Nova Friburgo Matriz (PAR-0064), alongside her husband Jacob Klein. [PROVEN]

  ## Open questions

  - Her birth date, baptism, and exact death record are not yet located; she is known to have
  been alive in at least 1896 (named as mother in Palmira Eugênia's 1896 baptism). Nationality
  is unset pending her origin. [OPEN]

  ## Sources held (this repository)

  - PAR-0068 (her 1872 Lutheran marriage — names her, records age 21 and filiation).

  - PAR-0064 (the 1890 Catholic marriage of Valentim × Carolina — names her as Carolina's
  mother).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu casamento luterano de 1872 registra sua mãe Maria Luiza nascida Stoffel como
  já falecida ("verstorbenen"), o que significa que ela havia perdido a mãe antes de se casar, com
  aproximadamente 21 anos de idade. (PAR-0068)

  - **[PROVEN / derivado de índice]** Contrariando uma estimativa anterior de um blog ("falecida
  antes de 1889"), ela estava viva e tinha filhos até a década de 1890: é nomeada como mãe em
  assentos de batismo de Antônio Ramos (1891) e Palmira Eugênia (1896) no índice católico de São
  José do Ribeirão (Raibert NF Batismos). Portanto, viveu até pelo menos 1896, com cerca de 45
  anos — uma vida completa de colona. A leitura "morte jovem / antes de 1889" está retratada.

  - **[PROVEN / LEAD]** Ela e Jacob Klein tiveram pelo menos dez filhos entre 1869 e 1896: dois
  filhos (Maria n. 1869, José Marque n. 1871) nasceram antes do casamento luterano de abril de
  1872; Carolina (~1873) é a ancestral direta na linha de Juan. Todos os irmãos são LEADs
  colaterais — os livros católicos de São José do Ribeirão não estão digitalizados.

  - **[CONTEXTUAL]** Ela carrega os sobrenomes Schenkel e Stoffel para a árvore genealógica da
  família Bohrer: seu avô materno Joseph Stoffel é explicitamente descrito como "Schweizer
  Colonist" no registro de 1847, o que significa que um ramo de sua ascendência era suíço mesmo
  dentro da congregação luterana de predominância alemã.

  ## Identidade

  **Maria Luiza Schenkel** — colona luterana de Nova Friburgo que se casou com Jacob Klein
  em 1872, levando as linhas Schenkel e Stoffel à família Bohrer. [PROVEN]

  - **Papel:** mãe de Carolina Klein (P-0029) e esposa de Jacob Klein (P-0103; família F-0051);
  trisavó de Iris Bohrer Muniz nas linhas Klein/Schenkel. [PROVEN]

  - **Casamento:** casou-se com Jacob Klein na igreja luterana de Nova Friburgo em 29 de
  abril de 1872 (PAR-0068, evento E-0092), com 21 anos de idade (nascida ~1851); filha
  legítima de Conrad Schenkel (P-0107) e da falecida Maria Luiza nascida Stoffel (P-0108);
  família F-0053. Sua mãe havia falecido antes de 1872. [PROVEN]

  - **Nomeada como mãe de Carolina** no casamento católico de 1890 de Valentim Martinho
  Bohrer na Matriz de Nova Friburgo (PAR-0064), ao lado de seu marido Jacob Klein. [PROVEN]

  ## Questões em aberto

  - Sua data de nascimento, batismo e data exata de óbito ainda não foram localizados;
  sabe-se que estava viva em pelo menos 1896 (nomeada como mãe no batismo de Palmira Eugênia
  em 1896). Nacionalidade não definida, pendente de origem. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0068 (seu casamento luterano de 1872 — nomeia-a, registra 21 anos e filiação).

  - PAR-0064 (casamento católico de 1890 de Valentim × Carolina — nomeia-a como mãe de
  Carolina).
