profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1872 Lutheran marriage gives her age as twenty-one — so born about 1851 —
  and records her mother as "der verstorbenen Maria Luisa geb. Stoffel". She married without a
  living mother. (PAR-0068)

  - **[LEAD — index-derived, correcting an earlier conclusion]** A secondary blog once had her
  dying "before 1889", and this archive carried that reading. It is retracted. The Raibert Nova
  Friburgo baptism index names her as the mother of children baptised in 1891 and 1896 at São
  José do Ribeirão, which would put her alive at roughly forty-five — not a woman who died
  young. Her actual death date and place remain unlocated; the correction rests on an index, not
  on a held image.

  - **[PROVEN]** She carries two colonist surnames into the Bohrer line, and they point in
  different directions. Schenkel comes from her father's German-Hessen family; Stoffel from her
  mother's father, whom the 1847 marriage register calls "dem Schweizer Colonisten Joseph
  [St]offel" — an explicitly *Swiss* colonist inside the German-speaking Lutheran congregation.
  (PAR-0067, PAR-0068)

  - **[PROVEN]** She is documented across the confessional line she did not herself cross.
  Married in the Lutheran church in 1872, she appears eighteen years later as the mother of a
  bride abjuring Protestantism at the Catholic Matriz, and in 1891 as the maternal grandmother
  named in a civil birth register. (PAR-0068, PAR-0064, CIV-0045)

  ## Identity

  **Maria Luiza Schenkel** — a Nova Friburgo Lutheran, wife of Jacob Klein and mother of
  Carolina Klein (P-0029). Iris Bohrer Muniz's (P-0007) great-grandmother, by the chain Carolina
  → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the family links]

  - **Birth:** about 1851, derived from the age of 21 recorded at her 1872 marriage; no baptism
  record is held. [INFERRED from PAR-0068]

  - **Parents:** legitimate daughter of Conrad Schenkel (P-0107) and the late Maria Luisa née
  Stoffel (P-0108); family F-0053. Her mother was dead by April 1872. [PROVEN — PAR-0068]

  - **Marriage:** to Jacob Klein (P-0103) on 29 April 1872 at the Nova Friburgo Lutheran church,
  aged 21, single, "evang." (PAR-0068, event E-0092). [PROVEN]

  - **Death:** unlocated. The "before 1889" reading is withdrawn; index entries place her alive
  to at least 1896. [OPEN]

  - **Nationality:** left unset in this archive, deliberately — no held record states where she
  was born, and the Schenkel and Stoffel strands point to German and Swiss origins respectively.
  [OPEN by decision]

  ## Standing and profession

  Nothing is recorded — no occupation, property, literacy or signature. What the records do fix
  is her position in a household: married at twenty-one into another colony family of the same
  confession, then named as mother and grandmother in three later acts. The one structural fact
  about her life that the evidence supports is the scale of her childbearing, and that comes
  from an index rather than from held images.

  ## Family and social network

  Her marriage joined Klein to Schenkel/Stoffel — two German-Protestant colony families marrying
  inside the same congregation, at the same level. [PROVEN — PAR-0068] Her daughter Carolina
  then married out, into the Swiss-Catholic Bohrer line, at the cost of a formal abjuration
  recorded in the 1890 act. [PROVEN — PAR-0064]

  Index and tree entries credit her with at least ten children between 1869 and 1896 — Maria
  (1869), José Marque (1871), Carolina (~1873), Maria Luiza (1874), Manuel Aleixo (1879), Isabel
  (1881), Secundina (1886), Leonel (1887), Antônio Ramos (1891) and Palmira Eugênia (1896). Two
  of them predate the marriage. All of this is unverified at image level: the São José do
  Ribeirão Catholic baptism books are not digitised. [LEAD]

  ## What we can extrapolate

  - **[CONTEXTUAL]** Her family belongs to the 1824 German second wave at Nova Friburgo,
  recruited by Georg Anton Schäffer after Brazilian independence and settled alongside the
  1819–20 Swiss. Both waves left the same Europe — post-Napoleonic poverty, land fragmentation,
  no industrial alternative for a smallholder's surplus children — and both were promised more
  than the Morro Queimado lots could deliver.

  - **[INFERRED]** A childbearing span of 1869 to 1896 is not a detail; it is the shape of her
  adult life, and it also supplies the only firm correction to her death date. It is worth
  saying plainly that the earlier "died young" reading was an inference from a blog, and that
  correcting it changed her from a figure of early loss into a woman who outlived most of the
  colony's first Brazilian-born generation.

  - **[CONTEXTUAL / INFERRED]** The Stoffel strand deserves care. Her maternal grandfather is
  called a *Swiss* colonist in the 1847 register, which means at least one branch of her
  ancestry entered Nova Friburgo with the 1819 Swiss rather than the 1824 Germans — a reminder
  that the colony's confessional and national divisions did not line up neatly, and that
  "Lutheran" here does not automatically mean "German".

  ## Open questions

  - Her baptism (about 1851) and her death record — both unlocated. The Nova Friburgo Lutheran
  register and the São José do Ribeirão civil books after 1896 are the targets. [OPEN]

  - Whether the 1891 and 1896 baptism index entries that carry the death correction can be
  confirmed against the original São José do Ribeirão register pages, which are not digitised.
  [LEAD / OPEN]

  - Her nationality, left unset on purpose pending a record that states her birthplace. [OPEN by
  decision]

  ## Sources held (this repository)

  - **PAR-0068** — her own 1872 Lutheran marriage to Jacob Klein at Nova Friburgo; gives her age
  (21), her status and her parents, with her mother already deceased.

  - **PAR-0064** — the 1890 Catholic marriage of Valentim Martinho Bohrer and her daughter
  Carolina at the Nova Friburgo Matriz; names her as Carolina's mother.

  - **CIV-0045** — the 1891 civil birth registration of her granddaughter Maria Felomena Bohrer
  at São José do Ribeirão; names her, written "Maria Luiza Sch[m]enckel", as the maternal
  grandmother.

  ## Regional and migration context

  Nova Friburgo was decreed a Swiss Catholic colony in 1818 and became something more mixed
  within six years. The German families recruited by Schäffer arrived on 3–4 May 1824 and
  founded the Igreja Luterana, whose registers are where the Klein, Schenkel and Stoffel records
  sit — a separate institutional world from the Catholic Matriz a few streets away. [CONTEXTUAL]
  Her generation, born in the colony around 1850, inherited the consequences of the original
  grant: highland lots too poor and too small to carry large families, which is why her husband
  was living at Rio Bonito by 1872 and her children were baptised in the rural district of São
  José do Ribeirão rather than in the town. [CONTEXTUAL for the colony; PROVEN for the
  residences]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation where she married on 29 April 1872 —
  the one fixed event of her life. [RESOLVED]

  - **São José do Ribeirão, Nova Friburgo, RJ** — the rural district where her children were
  baptised and where her granddaughter's 1891 civil birth was registered. The Catholic parish
  books for this district are not digitised, which is the single obstacle between her and a
  documented death date. [APPROX]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  daughter Carolina married in 1890. [RESOLVED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu casamento luterano de 1872 dá sua idade como vinte e um anos — portanto
  nascida por volta de 1851 — e registra a mãe como "der verstorbenen Maria Luisa geb. Stoffel".
  Casou-se sem mãe viva. (PAR-0068)

  - **[LEAD — derivado de índice, corrigindo conclusão anterior]** Um blog secundário chegou a
  dar sua morte como "antes de 1889", e este arquivo adotou essa leitura. Ela está retratada. O
  índice de batismos de Nova Friburgo (Raibert) a nomeia como mãe de crianças batizadas em 1891
  e 1896 em São José do Ribeirão, o que a colocaria viva por volta dos quarenta e cinco anos —
  não uma mulher morta jovem. Sua data e local de óbito continuam não localizados; a correção
  repousa num índice, não numa imagem retida.

  - **[PROVEN]** Ela leva dois sobrenomes de colono para a linha Bohrer, e eles apontam para
  direções diferentes. Schenkel vem da família alemã-hessiana do pai; Stoffel, do pai de sua
  mãe, a quem o registro de casamento de 1847 chama "dem Schweizer Colonisten Joseph [St]offel"
  — um colono explicitamente *suíço* dentro da congregação luterana germanófona. (PAR-0067,
  PAR-0068)

  - **[PROVEN]** Ela está documentada atravessando a linha confessional que não cruzou
  pessoalmente. Casada na igreja luterana em 1872, aparece dezoito anos depois como mãe de uma
  noiva que abjura o protestantismo na Matriz católica, e em 1891 como avó materna nomeada num
  registro civil de nascimento. (PAR-0068, PAR-0064, CIV-0045)

  ## Identidade

  **Maria Luiza Schenkel** — luterana de Nova Friburgo, esposa de Jacob Klein e mãe de Carolina
  Klein (P-0029). Bisavó de Iris Bohrer Muniz (P-0007), pela cadeia Carolina → João Gonçalves
  Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Nascimento:** por volta de 1851, derivado da idade de 21 anos registrada em seu casamento
  de 1872; nenhum registro de batismo está disponível. [INFERRED a partir de PAR-0068]

  - **Pais:** filha legítima de Conrad Schenkel (P-0107) e da falecida Maria Luisa, nascida
  Stoffel (P-0108); família F-0053. A mãe já estava morta em abril de 1872. [PROVEN — PAR-0068]

  - **Casamento:** com Jacob Klein (P-0103) em 29 de abril de 1872, na igreja luterana de Nova
  Friburgo, com 21 anos, solteira, "evang." (PAR-0068, evento E-0092). [PROVEN]

  - **Óbito:** não localizado. A leitura "antes de 1889" está retirada; entradas de índice a
  situam viva até pelo menos 1896. [OPEN]

  - **Nacionalidade:** deliberadamente não atribuída neste arquivo — nenhum documento retido
  declara onde nasceu, e as vertentes Schenkel e Stoffel apontam, respectivamente, para origens
  alemã e suíça. [OPEN por decisão]

  ## Posição social e profissão

  Nada está registrado — nenhuma ocupação, propriedade, alfabetização ou assinatura. O que os
  documentos fixam é sua posição num domicílio: casada aos vinte e um anos com outra família
  colona da mesma confissão, depois nomeada como mãe e avó em três atos posteriores. O único
  fato estrutural de sua vida que as evidências sustentam é a extensão de sua maternidade, e ele
  vem de índice, não de imagens retidas.

  ## Família e rede social

  Seu casamento uniu Klein a Schenkel/Stoffel — duas famílias protestantes alemãs da colônia
  casando dentro da mesma congregação, no mesmo nível. [PROVEN — PAR-0068] A filha Carolina
  casou-se então para fora, na linha suíço-católica dos Bohrer, ao custo de uma abjuração formal
  lavrada no assento de 1890. [PROVEN — PAR-0064]

  Índices e árvores lhe atribuem pelo menos dez filhos entre 1869 e 1896 — Maria (1869), José
  Marque (1871), Carolina (~1873), Maria Luiza (1874), Manuel Aleixo (1879), Isabel (1881),
  Secundina (1886), Leonel (1887), Antônio Ramos (1891) e Palmira Eugênia (1896). Dois deles
  antecedem o casamento. Nada disso está verificado em nível de imagem: os livros católicos de
  batismo de São José do Ribeirão não estão digitalizados. [LEAD]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Sua família pertence à segunda leva alemã de 1824 em Nova Friburgo,
  recrutada por Georg Anton Schäffer depois da independência e assentada ao lado dos suíços de
  1819–20. As duas levas deixaram a mesma Europa — pobreza pós-napoleônica, fragmentação da
  terra, nenhuma alternativa industrial para os filhos excedentes de um pequeno proprietário — e
  a ambas se prometeu mais do que os lotes do Morro Queimado podiam entregar.

  - **[INFERRED]** Uma maternidade que vai de 1869 a 1896 não é detalhe; é o formato de sua vida
  adulta, e é também o que fornece a única correção firme à data de sua morte. Vale dizer com
  clareza que a leitura anterior de "morte jovem" era inferência de um blog, e que corrigi-la a
  transformou de figura de perda precoce em mulher que sobreviveu à maior parte da primeira
  geração da colônia nascida no Brasil.

  - **[CONTEXTUAL / INFERRED]** A vertente Stoffel merece cuidado. Seu avô materno é chamado de
  colono *suíço* no registro de 1847, o que significa que pelo menos um ramo de sua ascendência
  entrou em Nova Friburgo com os suíços de 1819, e não com os alemães de 1824 — lembrete de que
  as divisões confessionais e nacionais da colônia não coincidiam de modo limpo, e de que
  "luterano", aqui, não significa automaticamente "alemão".

  ## Questões em aberto

  - Seu batismo (por volta de 1851) e seu registro de óbito — ambos não localizados. Os alvos
  são o livro luterano de Nova Friburgo e os livros civis de São José do Ribeirão posteriores a
  1896. [OPEN]

  - Se as entradas de índice de batismo de 1891 e 1896 que sustentam a correção da data de óbito
  podem ser confirmadas contra as páginas originais do registro de São José do Ribeirão, não
  digitalizadas. [LEAD / OPEN]

  - Sua nacionalidade, deixada em aberto de propósito, à espera de um documento que declare seu
  local de nascimento. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0068** — seu próprio casamento luterano de 1872 com Jacob Klein, em Nova Friburgo; dá
  sua idade (21), seu estado e sua filiação, com a mãe já falecida.

  - **PAR-0064** — o casamento católico de 1890 de Valentim Martinho Bohrer com a filha
  Carolina, na Matriz de Nova Friburgo; nomeia-a como mãe de Carolina.

  - **CIV-0045** — o registro civil de nascimento, em 1891, da neta Maria Felomena Bohrer, em
  São José do Ribeirão; nomeia-a, grafada "Maria Luiza Sch[m]enckel", como avó materna.

  ## Contexto regional e migratório

  Nova Friburgo foi decretada colônia católica suíça em 1818 e, em seis anos, tornou-se algo
  mais misto. As famílias alemãs recrutadas por Schäffer chegaram em 3–4 de maio de 1824 e
  fundaram a Igreja Luterana, cujos livros guardam os registros Klein, Schenkel e Stoffel — um
  mundo institucional separado da Matriz católica, a poucas ruas dali. [CONTEXTUAL] Sua geração,
  nascida na colônia por volta de 1850, herdou as consequências da concessão original: lotes
  serranos pobres e pequenos demais para sustentar famílias grandes — razão pela qual o marido
  já morava no Rio Bonito em 1872 e os filhos foram batizados no distrito rural de São José do
  Ribeirão, e não na vila. [CONTEXTUAL quanto à colônia; PROVEN quanto às residências]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, onde ela se casou em 29 de abril de 1872
  — o único evento fixo de sua vida. [RESOLVED]

  - **São José do Ribeirão, Nova Friburgo, RJ** — o distrito rural onde seus filhos foram
  batizados e onde o nascimento da neta foi registrado em 1891. Os livros paroquiais católicos
  desse distrito não estão digitalizados, o que é o único obstáculo entre ela e uma data de
  óbito documentada. [APPROX]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha Carolina se casou em 1890. [RESOLVED]
