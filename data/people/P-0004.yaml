  nesse registro são omitidos.

  ## Contexto regional e migratório

  Sua vida documentada vai da **Zona da Mata Mineira**, fronteira cafeeira (nascido em
  Rosário da Limeira em 1915; residente e casado em Eugenópolis em 1952), passando pela
  vida adulta em **Irajá, Rio de Janeiro, Zona Norte** [declaração do proprietário], até
  uma mudança de última fase para **Volta Redonda, RJ** (falecido ali em 1991 no
  Hospital Santa Margarida). Volta Redonda foi onde morreu, não seu lar de toda a vida.
  Sua siderúrgica da CSN (autorizada pelo Decreto-Lei nº 3.002, de 30 de janeiro de
  1941; primeiro aço em 1946) atraiu mão de obra mineira para o estado a partir dos anos
  1940, mas a mudança documentada dele para lá veio décadas depois. Nenhum registro em
  mãos declara seu motivo pessoal para nenhuma das etapas migratórias. [CONTEXTUAL]

