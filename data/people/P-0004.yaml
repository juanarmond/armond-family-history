profile_pt: >-
  ## Identidade

  **Geraldo Paz Armond**, avô paterno de Juan. O nome do meio **"Paz"** é o sobrenome
  da família de sua mãe, levado por ambos os filhos de Aristão × Liliosa; nossos
  registros trazem de forma consistente o sobrenome **"Armond"** (o ramo mais amplo
  apresenta uma oscilação ocasional *Armand ⁓ Armond*). [PROVEN]

  - **Nascimento:** 30 de janeiro de 1915, em "Limeira", Minas Gerais — modelado como
  o município de **Rosário da Limeira**, na Zona da Mata Mineira. A data está declarada
  em seu casamento de 1952 (CIV-0002) e é consistente com a idade de 76 anos indicada
  em seu óbito de 1991 (CIV-0003). [PROVEN quanto à data; a leitura do município é
  INFERRED]

  - **Casamento:** casou-se com **Cidalia Engrácio Guimarães** (P-0005) em 31 de maio
  de 1952, às 14h, no registro civil de **Eugenópolis, MG** (Casamento nº 898, livro
  13-B). [PROVEN]

  - **Pais:** **Aristão Ferreira Armond** (P-0008) e **Liliosa Paz Armond** (P-0009),
  ambos já falecidos quando ele morreu; sua mãe havia falecido em 16 de abril de 1946.
  [PROVEN]

  - **Óbito:** 18 de fevereiro de 1991, às 19h, no Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registrado no dia seguinte (óbito nº 39.006, folha 557);
  aos 76 anos; causa "desequilíbrio metabólico". [PROVEN]

  - **Filhos:** um filho, **vivo — detalhes omitidos**. O registro de 1991 declara que
  ele "deixou um filho". [PROVEN]

  ## Posição social e profissão

  - **Padeiro** em seu casamento de 1952 (CIV-0002); registrado como **aposentado** em
  seu óbito de 1991 (CIV-0003). [PROVEN]

  - **Letrado** — assinou a própria certidão de casamento. [PROVEN]

  - **Espólio:** o registro de 1991 declara que ele **não deixou testamento** ("não
  deixou testamento"), deixou bens a inventariar e deixou um filho. [PROVEN]

  ## Família e rede social

  Sua esposa **Cidalia Engrácio Guimarães** (P-0005), nascida em 1930 em Alvorada, MG,
  doméstica, passou depois a assinar "Cidalia Engrácio Armond"; ela o sobreviveu e é
  nomeada como sua cônjuge em seu óbito de 1991. Seu irmão foi **José Olavo Armond**
  (P-0018), o outro filho documentado de Aristão × Liliosa. Seu casamento é o ponto em
  que a linha Armond/Paz se une à linha Engrácio/Guimarães. [PROVEN]

  ## O que podemos extrapolar

  Geraldo completa um **arco de mobilidade social descendente** ao longo de três
  gerações [INFERRED]: seu avô paterno Simplício José Ferreira Armond exerceu cargos
  judiciais e cívicos (documentado em P-0016), ao passo que Aristão e Geraldo ambos
  trabalharam num ofício, e Geraldo terminou a vida como padeiro aposentado numa cidade
  industrial do Rio de Janeiro. É o ponto em que esse arco se torna legível numa única palavra
  — padeiro — e várias linhas convergem para ele.

  - **O ofício e o que ele pagava** [CONTEXTUAL]. Um padeiro numa cidade-empresa em plena
  expansão siderúrgica ganhava um salário mensal ancorado no salário mínimo, o primeiro
  salário mínimo nacional (Decreto-Lei nº 2.162 de 1º de maio de 1940), fixado em até 240$000
  por mês na faixa de maior custo do Rio, que incluía a parte fluminense de Volta Redonda, e
  lido como cerca de Cr$300 após a conversão para cruzeiro em 1942. Pela história do trabalho
  regional, ele teria ganhado perto desse piso — um salário urbano de serviços sem terra,
  capital ou bem transmissível associado (seu registro de 1991 anota apenas "bens a
  inventariar", um espólio modesto). Esse contraste torna a queda quantitativa, e não apenas
  uma palavra: de uma linha materna proprietária (Toledo) cuja riqueza cafeeira a história
  regional associa ao trabalho escravizado, e de um avô lembrado como emprestador de dinheiro
  (uma pista, ainda não catalogada aqui), até vender a própria força de trabalho por cerca do
  salário mínimo legal — em três a quatro gerações. [CONTEXTUAL; os valores do salário são a
  lei, a atribuição a Geraldo é INFERRED]

  - **A instrução que cai junto com o dinheiro** [CONTEXTUAL]. Um padeiro em Volta Redonda é a
  forma urbanizada de uma família rural que perdera a terra, e a educação caiu do mesmo modo
  que o dinheiro: a instrução era um privilégio comprado e ligado à classe (sem escola pública
  rural gratuita; recomprada a cada geração), de modo que um menino da classe trabalhadora
  nascido no interior de Minas em 1915 tipicamente entrava num ofício por volta dos 12–14 anos
  em vez de concluir os estudos — sendo a escolarização universal no Brasil uma conquista já do
  fim do século XX. Seu letramento é documentado (assinou a certidão de 1952), o que condiz com
  um homem de ofício, e não com o letramento de detentor de cargos da geração de seu bisavô.
  [CONTEXTUAL; letramento PROVEN]

  - **Nada de transmissível chegou até ele** [INFERRED]. Em sua geração, a renda de cargo dois
  degraus acima já morrera com o cargo, a terra Toledo por casamento entrara em espólios a
  serem divididos gerações antes, e a herança partível dividira o restante entre os irmãos do
  pai e depois os filhos do pai. Geraldo começa com um nome e um ofício, não com capital — seu
  próprio registro anota apenas "bens a inventariar", a pequena propriedade de um homem
  trabalhador, não uma fazenda. [INFERRED; a nota do espólio é PROVEN]

  - **A mudança completa a migração que a economia impôs** [CONTEXTUAL]. Sua morte em Volta
  Redonda encaixa-se na atração de mão de obra da cidade siderúrgica da CSN a partir da década
  de 1940 — o estágio final do arco da família, do colapso do café à urbanização. A mudança foi
  um movimento familiar, e não um deslocamento pessoal isolado: o centro de gravidade do ramo
  passou da decadente região cafeeira da Zona da Mata para a cidade siderúrgica ao longo dessas
  décadas.

  Lida como um todo [INFERRED], a vida de Geraldo não é prova de uma fortuna perdida, mas o fim
  clássico de uma família mediana da Zona da Mata, baseada em cargo e casamento, apanhada pelo
  colapso do café e pela urbanização do século XX: renda de cargo e terra por casamento,
  fragmentadas pela herança partível, numa economia regional que ruiu, com descendentes
  reestabelecidos como trabalhadores urbanos de ofício. Lida de trás para frente, é uma
  corroboração discreta de que o aparente auge da família (Simplício) assentava-se em posição,
  não em capital transmissível.

  ## Questões em aberto

  - Seu próprio registro de nascimento/batismo (1915, região de Rosário da Limeira /
  Eugenópolis) — não obtido. [OPEN]

  - Quando exatamente ele se mudou da Zona da Mata para Volta Redonda (casou-se em
  Eugenópolis em 1952; faleceu em Volta Redonda em 1991). [OPEN]

  - Seu inventário — os bens referidos no registro de 1991. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0002 — certidão de casamento de 1952 (nascimento em 30 de janeiro de 1915 em
  Limeira, padeiro; mãe Liliosa Paz "falecida em 16-4-946"; esposa Cidalia Engrácio
  Guimarães).

  - CIV-0003 — registro civil de óbito de Volta Redonda de 1991 (faleceu em 18 de
  fevereiro de 1991, aos 76 anos, aposentado; pais Aristão Ferreira Armond e Liliosa
  Paz Armond, ambos falecidos; sem testamento, um filho).

  - CIV-0008 — uma certidão de nascimento familiar posterior que registra a forma do
  nome "Geraldo Paz Armond" e sua esposa entre os avós; os detalhes de pessoa viva
  nesse registro são omitidos.

  ## Contexto regional e migratório

  Sua vida documentada vai da **Zona da Mata Mineira**, fronteira cafeeira (nascido em
  Rosário da Limeira em 1915; casado em Eugenópolis em 1952), até a cidade siderúrgica
  planejada de **Volta Redonda, RJ** (falecido em 1991), erguida em torno da Companhia
  Siderúrgica Nacional. A mudança encaixa-se na migração de trabalho Minas rural →
  Rio industrial de meados do século XX; nenhum registro em mãos declara seu motivo
  pessoal. [CONTEXTUAL]

