profile: >-
  ## Interesting facts

  - **[PROVEN]** Two consecutive generations of bakers: Geraldo's father Aristão was also recorded "de profissão padeiro" at his 1957 death (CIV-0005). Father and son in the same trade — inherited skill, not inherited capital.

  - **[INFERRED]** His lifespan (1915–1991) brackets the founding and rise of the CSN steel city: born into a coffee-declining Zona da Mata, he worked as a baker, lived his adult life in Rio's Zona Norte [owner-stated] and died retired in Volta Redonda, the city built around the steel mill Vargas authorised by Decreto-Lei nº 3.002 of 30 January 1941. [the decree is CONTEXTUAL]

  - **[CONTEXTUAL]** The CSN mill at Volta Redonda, financed partly by US wartime loans and producing its first steel in 1946, drew tens of thousands of Minas workers in the late 1940s–1960s. That wave is context for the family's wider Minas → Rio shift, but it does not explain Geraldo's own path: he was still resident in Eugenópolis at his 1952 marriage (CIV-0002), lived his adult life in Irajá [owner-stated], and reached Volta Redonda only late in life.

  - **[INFERRED]** Three generations of descent in one word — "padeiro": his grandfather Simplício José Ferreira Armond held unpaid police posts and married into the Toledo landed estate; Aristão worked a trade and held a police title too; Geraldo retired as a baker. The family's whole trajectory from office-holding notable to urban tradesman fits in a single occupation entry.

  - **[PROVEN]** His 1991 death register states that he left **no** will ("não deixou testamento") but did leave assets to inventory ("deixou bens a inventariar") — the estate of a working man, non-empty but modest (CIV-0003). No land, no office income transmitted to heirs. (An earlier reading here, shared by the retrieval research, gave "deixou testamento"; the register image reads "não deixou testamento".)

  - **[CONTEXTUAL]** Volta Redonda grew from 2,782 people in 1940, when it was still the 8th district of Barra Mansa, to 35,965 in 1950 and 88,740 in 1960 (IBGE census figures), driven by the CSN and its supplier industries; it became a municipality in 1954. The city where Geraldo died had barely existed when he was born. (An earlier version of this line gave roughly 20,000 for 1940 and over 100,000 for 1960; the census figures supersede it.)

  ## Identity

  **Geraldo Paz Armond**, Juan's paternal grandfather. The middle name **"Paz"** is
  his mother's family surname, carried by both of Aristão × Liliosa's sons; our
  records consistently give the surname **"Armond"** (the wider branch shows an
  occasional *Armand ⁓ Armond* drift; on the damaged 1952 certificate the surname is
  read Armond, with Armand possible [uncertain], CIV-0002). [PROVEN]

  - **Birth:** 30 January 1915, at "Limeira", Minas Gerais — modelled as the
  municipality of **Rosário da Limeira**, in the Zona da Mata Mineira. The date is
  stated in his 1952 marriage (CIV-0002) and is consistent with the age 76 given at
  his 1991 death (CIV-0003). [PROVEN date; the municipality reading is INFERRED]

  - **Marriage:** married **Cidalia Engrácio Guimarães** (P-0005) on 31 May 1952 at
  14h, civil registry of **Eugenópolis, MG** (Casamento nº 898, livro 13-B, fls. 22).
  Both spouses are recorded as resident in Eugenópolis ("residente nesta cidade"), and
  he as a padeiro. The held copy is a certified extract issued on 5 May 1972 by the
  Eugenópolis registrar Hélio Bomtempo Secunho; its observations note that the marriage
  term was altered by judicial order dated 6 March 197[-] [final digit illegible].
  [PROVEN — CIV-0002]

  - **Parents:** **Aristão Ferreira Armond** (P-0008) and **Liliosa Paz Armond**
  (P-0009), both deceased by his own death; his mother had died 16 April 1946. The 1952
  certificate is torn and stained across the father's name, so Aristão's paternity rests
  on the 1991 death register alone (CIV-0003) and stays strong-evidence pending
  Geraldo's own birth record; his mother is named on both. [PROVEN as recorded]

  - **Death:** 18 February 1991 at 19h in the Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registered the next day (óbito nº 39.006, folha 557);
  aged 76; cause "desequilíbrio metabólico". The register gives his residence as Volta
  Redonda ("residente nesta cidade"; street withheld here) and says he was to be buried
  in the city's cemetery ("Cemitério desta cidade"). [PROVEN — CIV-0003]

  - **Primary lifelong residence: Irajá, Rio de Janeiro (Zona Norte)** — Geraldo and
  Cidalia lived their whole adult lives in Irajá; Volta Redonda was their late-life and
  death-place only, not their lifelong home. [owner-stated 2026-09-14] The 1952
  marriage still records him, at 37, as resident in Eugenópolis (CIV-0002), so the Irajá
  years most likely began after the marriage — "adult life" reads best as married life.
  [INFERRED] The specific Irajá street address is not recorded in any held document.
  [OPEN] The retrieval research reports that neither spouse appears in the digitised
  Rio telephone directories of 1951, 1959 and 1969–70, which suggests no listed
  telephone rather than a gap in the directories. [LEAD — search reported by the
  retrieval side]

  - **Children:** three adult children in total — two predeceased him, one surviving
  at his death. The 1991 register records "deixou um filho" (one surviving child at
  the time). The two who predeceased him: **Fernando Augusto Engrácio Armond**
  (d. 26 August 1989) [LEAD — FS tree; death certificate not yet held]; and a second
  son (given name unknown, d. Irajá, Rio de Janeiro, 1982–early 1991) [LEAD — owner
  knowledge; death record not located despite exhaustive search of the Irajá/11ª
  Circunscrição register, Volta Redonda índices, and Rio circ03 index]. One child
  survives (living — details withheld per privacy). [PROVEN — 1991 óbito + Cidalia's
  2023 óbito combined]

  ## Standing and profession

  - **Padeiro (baker)** at his 1952 marriage (CIV-0002); recorded **aposentado**
  (retired) by his 1991 death (CIV-0003). [PROVEN]

  - **Literacy not documented.** The held 1952 document is a registrar's certified
  extract, issued in 1972, that carries only the officer's signatures, not the spouses'.
  An earlier statement here that he signed it is withdrawn. The original entry in livro
  13-B would show whether he signed. [OPEN]

  - **Estate:** the 1991 register states that he left **no will** ("não deixou
  testamento"), left assets to inventory ("deixou bens a inventariar"), and left one
  child. [PROVEN — CIV-0003]

  ## Family and social network

  His wife **Cidalia Engrácio Guimarães** (P-0005), born 1930 at Alvorada, MG, a
  doméstica, thereafter signed "Cidalia Engrácio Armond"; she survived him and is
  named as his spouse at his 1991 death. His paternal grandparents were **Simplício
  José Ferreira Armond** (P-0016) and **Eliza Balbina de Toledo** (P-0017), through whom
  the landed Toledo ancestry reaches him. His brother was **José Olavo Armond**
  (P-0018, born 25 September 1926 at Eugenópolis — GOV-0001, NWS-0001), the other
  documented son of Aristão × Liliosa. Aristão × Liliosa had six children in all:
  Geraldo and José Olavo are primary-confirmed; the other four (Maria Aparecida Armond
  de Oliveira, Lucia, Marina, and Otavia) appear on the FS Family Tree but each lacks a
  held birth or death record. Maria Aparecida's tree dates (3 October 1933 – 25
  September 2000) are typed on the tree with no attached record, and the retrieval
  research's 2026-09-11 searches, with and without a parent filter, found no
  FamilySearch record for any of the four. [PROVEN for Geraldo + José Olavo; LEAD for
  the remaining four] At the 1952 marriage the witnesses are read as Camilo [uncertain]
  Filho and Mário Dutra da Silva [uncertain], before a judge read as Cyrano Portilho
  [uncertain] (CIV-0002). His marriage is the point where the Armond/Paz line joins the
  Engrácio/Guimarães line. [PROVEN]

  ## What we can extrapolate

  Geraldo completes a downward social arc across three generations [INFERRED]: his paternal
  grandfather Simplício José Ferreira Armond held court and civic roles and married into the landed
  Toledo clan (documented on P-0016), his father Aristão held one unpaid police title but worked a
  trade, and Geraldo ended his life a retired baker in an industrial Rio de Janeiro city. He is the
  point where that arc becomes legible in a single word — padeiro — and several strands converge on
  it.

  - **Why nothing heritable reached him, traced to the document** [PROVEN figures; INFERRED
  reading]. The married-in Toledo inheritance did eventually arrive, but as value fractions rather
  than property: the payment folio dated c.1919 allots his grandfather, in his grandmother Eliza's
  right, 72$910 in a dwelling house, 9$113 in a paiol, 3$645 in a mill, 14$582 in the halves of an
  engenho and ventilador, 51$037 in 3,388 ares of virgin forest and a worn capoeira figure read as
  50$546 or 508$546 [uncertain] (PRB-0011, P-0016). Under partible succession that parcel divided
  again among Aristão and his siblings, and again among Aristão's children. Two steps up, the office
  income had already died with the offices, which paid nothing to begin with. Geraldo starts with a
  name and a trade, not capital.

  - **The trade, and what it paid** [CONTEXTUAL; the occupation PROVEN]. A baker in the Rio region
  earned a monthly wage anchored to the salário mínimo, the first national minimum wage (Decreto-Lei
  nº 2.162 of 1 May 1940), set at 240$000 per month in its highest band, the then Distrito Federal
  (Rio city, which included Irajá) — Cr$240 at the one-to-one 1942 conversion to the cruzeiro, and
  raised by later decrees. In 1952 he was still a padeiro resident in Minas (CIV-0002), where the
  bands were lower. (An earlier version here tied the 240$000 band to Volta Redonda and gave about
  Cr$300 after conversion; both are corrected.) On the regional labour history he would have earned
  close to that floor — an urban service wage with no land, capital or heritable asset attached. That makes the fall quantitative
  rather than merely a word: from a maternal line whose coffee wealth rested on enslaved labour —
  ten people appraised at roughly 800$000 to 1:700$000 each in the 1867 estate of his
  great-grandfather José Cezário de Toledo Lima (PRB-0008) — down to selling one's labour at about the legal minimum wage, in four
  generations. [the wage figures are the law; the attribution to Geraldo is INFERRED]

  - **The schooling that falls with the money** [CONTEXTUAL; literacy not documented]. A padeiro in the Rio
  industrial belt is the urbanized form of a rural family that had lost its land, and education fell
  the same way the money did: schooling was a purchased, class-linked privilege — no free rural
  public school, re-bought each generation — so a working-class boy born in the MG interior in 1915
  would typically enter a trade at around 12–14 rather than finish school, Brazil's universal
  schooling being a late-20th-century achievement. No held record shows whether he could sign: the
  1952 certificate is a registrar's extract that carries no signature of the spouses, so the education
  thread cannot yet be traced through him.

  - **A third consecutive lateral marriage** [PROVEN; reading INFERRED]. In 1952, at 37, he married
  Cidalia Engrácio Guimarães, a doméstica of Alvorada, MG, daughter of an Eugenópolis household
  (CIV-0002). His father had married Liliosa Paz, a woman with no documented property (P-0009); only
  his great-grandfather's generation had married into land. Three generations of matches within the
  same social level are the ordinary way a family's position holds where there is nothing left to
  consolidate. [no held record speaks to motive]

  - **Where he actually lived, and what the move did** [owner-stated residence; CONTEXTUAL meaning].
  Geraldo lived his adult working life in Irajá, Rio de Janeiro (Zona Norte) [owner-stated], in the
  same Zona Norte belt where his in-laws the Engrácio family were anchored (Cidalia's father at
  adjacent Pavuna). He was still resident in Eugenópolis, a padeiro, when he married in 1952
  (CIV-0002), so the move to Rio most likely came after the marriage [INFERRED]. A late-life move took him and Cidalia to Volta Redonda, where he died in 1991.
  The overall Zona da Mata → Rio trajectory fits the mid-20th-century rural-Minas → industrial-Rio
  labour migration; the Irajá → Volta Redonda late-life move had a different, undocumented driver.
  The branch's centre of gravity shifted from the Zona da Mata to Rio's Zona Norte across these
  decades — not to the CSN steel city as primary home.

  - **The arc bottoms out with him, and turns** [PROVEN; reading INFERRED]. He ends recorded
  aposentado, with no will but with assets to inventory (CIV-0003) — the estate of a working man rather
  than a fazenda, but an estate nonetheless, accumulated from a wage rather than inherited. Where his
  forebears' standing came from offices that paid nothing and land that arrived in fractions, what he
  left came from work. That is a different kind of foundation, and it is the one the family kept.

  Read as a whole [INFERRED], Geraldo's life is not evidence of a lost fortune but the textbook end
  of a middling, office-and-marriage-based Zona-da-Mata family caught in the coffee bust and
  20th-century urbanization: contingent office income and a married-in land base, fragmented by
  partible inheritance and frozen for decades in probate, in a regional economy that collapsed, with
  descendants re-established as urban tradesmen. Read backward, it is quiet corroboration that the
  family's apparent peak (Simplício) rested on status, not transmissible capital.

  ## Open questions

  - His own birth/baptism register (1915, Rosário da Limeira / Eugenópolis area) — not
  held. [OPEN]

  - When exactly he moved from Eugenópolis to Irajá (after the 1952 marriage, at which
  he was resident in Eugenópolis), and from Irajá, Rio de Janeiro to Volta Redonda
  (primary lifelong home = Irajá; died Volta Redonda 1991). [OPEN]

  - The Irajá street address — on no held record; the likeliest routes are his post-1991
  inventário or family knowledge. [OPEN]

  - His inventário — the assets the 1991 register says he left to inventory; there was
  no will ("não deixou testamento", CIV-0003). Volta Redonda vara de família / cartório,
  post-1991; it would name his heirs and may state his earlier residences. [OPEN]

  - The two predeceased sons: Fernando Augusto's death certificate (Volta Redonda, 1ª
  Circunscrição, late August 1989; the gated FS film 9GRQ-HZW); the unnamed second son's
  death record (sought exhaustively in the Irajá/11ª Circunscrição óbito register, Volta
  Redonda indices, and Rio circ03 index — all negative; may be a different RJ office).
  [OPEN]

  ## Sources held (this repository)

  - CIV-0002 — 1952 marriage certificate, a certified extract issued 5 May 1972 (birth
  30 January 1915 at Limeira, padeiro, resident in Eugenópolis; mother Liliosa Paz
  "falecida em 16-4-946"; father's name lost to a tear; wife Cidalia Engrácio
  Guimarães).

  - CIV-0003 — 1991 Volta Redonda civil death register (died 18 February 1991, aged 76,
  aposentado; parents Aristão Ferreira Armond and Liliosa Paz Armond, both deceased;
  left no will ("não deixou testamento") but assets to inventory; one surviving
  child).

  - CIV-0008 — a later certified family birth certificate recording the name form
  "Geraldo Paz Armond" and his wife among the grandparents; living-person details in
  that record are withheld.

  ## Regional and migration context

  His documented life runs from the coffee-frontier **Zona da Mata Mineira** (born
  Rosário da Limeira 1915; resident and married at Eugenópolis 1952) through his adult
  life in **Irajá, Rio de Janeiro, Zona Norte** [owner-stated], to a late-life move to
  **Volta Redonda, RJ** (died 1991 at Hospital Santa Margarida). Volta Redonda was where
  he died, not his lifelong home. Its CSN steel mill (authorised by Decreto-Lei nº
  3.002 of 30 January 1941; first steel 1946) pulled Minas labour into the state from
  the 1940s, but his own documented move there came decades later. No held record
  states his personal motive for either leg of the migration. [CONTEXTUAL]

  ## Where to go today

  - **Birth (30 Jan 1915):** Matriz N.S. do Rosário, Rosário da Limeira, MG (Praça N.S. do Rosário, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-20.97889,-42.51194)

  - **Marriage (31 May 1952):** Cartório RCPN de Eugenópolis (Casamento nº 898, Livro 13-B) + Matriz São Sebastião, Eugenópolis, MG (Praça João XXIII 145, Centro) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Joao%20XXIII%20145%2C%20Eugenopolis%2C%20MG)

  - **Death (18 Feb 1991):** Hospital Santa Margarida, Volta Redonda, RJ (Rua São João Batista 35, Bairro Niterói) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Sao%20Joao%20Batista%2035%2C%20Volta%20Redonda%2C%20RJ)

  - **Death registration (óbito nº 39.006):** RCPN de Volta Redonda, Volta Redonda, RJ (Rua Gustavo Lira 282) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Gustavo%20Lira%20282%2C%20Volta%20Redonda%2C%20RJ)

  - **Likely burial:** Cemitério Municipal Bom Jardim, Volta Redonda, RJ (the register says only "Cemitério desta cidade", CIV-0003) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=-22.49491,-44.11730)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Duas gerações consecutivas de padeiros: o pai de Geraldo, Aristão, também foi registrado como "de profissão padeiro" em seu óbito de 1957 (CIV-0005). Pai e filho no mesmo ofício — habilidade herdada, não capital herdado.

  - **[INFERRED]** Sua vida (1915–1991) encadeia a fundação e a ascensão da cidade siderúrgica da CSN: nascido numa Zona da Mata cafeeira em declínio, trabalhou como padeiro, viveu a vida adulta na Zona Norte do Rio [declaração do proprietário] e morreu aposentado em Volta Redonda, a cidade erguida em torno da siderúrgica que Vargas autorizou pelo Decreto-Lei nº 3.002, de 30 de janeiro de 1941. [o decreto é CONTEXTUAL]

  - **[CONTEXTUAL]** A usina da CSN em Volta Redonda, financiada em parte por empréstimos de guerra americanos e com o primeiro aço produzido em 1946, atraiu dezenas de milhares de trabalhadores mineiros no final dos anos 1940–1960. Essa onda é contexto para o deslocamento mais amplo da família de Minas para o Rio, mas não explica o percurso do próprio Geraldo: ele ainda residia em Eugenópolis ao se casar em 1952 (CIV-0002), viveu a vida adulta em Irajá [declaração do proprietário] e só chegou a Volta Redonda na última fase da vida.

  - **[INFERRED]** Três gerações de descida em uma só palavra — "padeiro": seu avô Simplício José Ferreira Armond exerceu cargos policiais não remunerados e casou-se com a família fundiária Toledo; Aristão trabalhou num ofício e também teve um título policial; Geraldo aposentou-se padeiro. Toda a trajetória da família, de notável detentor de cargos a trabalhador urbano, cabe em uma única entrada de ocupação.

  - **[PROVEN]** O registro de óbito de 1991 declara que ele **não** deixou testamento ("não deixou testamento"), mas deixou bens a inventariar ("deixou bens a inventariar") — o espólio modesto de um homem trabalhador, mas não vazio (CIV-0003). Sem terra, sem renda de cargo transmissível aos herdeiros. (Uma leitura anterior aqui, compartilhada pela pesquisa de recuperação, dava "deixou testamento"; a imagem do registro diz "não deixou testamento".)

  - **[CONTEXTUAL]** Volta Redonda cresceu de 2.782 habitantes em 1940, quando ainda era o 8º distrito de Barra Mansa, para 35.965 em 1950 e 88.740 em 1960 (dados censitários do IBGE), impulsionada pela CSN e pelas indústrias fornecedoras; tornou-se município em 1954. A cidade onde Geraldo morreu mal existia quando ele nasceu. (Uma versão anterior desta linha dava cerca de 20.000 para 1940 e mais de 100.000 para 1960; os números do censo a substituem.)

  ## Identidade

  **Geraldo Paz Armond**, avô paterno de Juan. O nome do meio **"Paz"** é o sobrenome
  da família de sua mãe, levado por ambos os filhos de Aristão × Liliosa; nossos
  registros trazem de forma consistente o sobrenome **"Armond"** (o ramo mais amplo
  apresenta uma oscilação ocasional *Armand ⁓ Armond*; na certidão danificada de 1952 o
  sobrenome é lido Armond, sendo possível Armand [uncertain], CIV-0002). [PROVEN]

  - **Nascimento:** 30 de janeiro de 1915, em "Limeira", Minas Gerais — modelado como
  o município de **Rosário da Limeira**, na Zona da Mata Mineira. A data está declarada
  em seu casamento de 1952 (CIV-0002) e é consistente com a idade de 76 anos indicada
  em seu óbito de 1991 (CIV-0003). [PROVEN quanto à data; a leitura do município é
  INFERRED]

  - **Casamento:** casou-se com **Cidalia Engrácio Guimarães** (P-0005) em 31 de maio
  de 1952, às 14h, no registro civil de **Eugenópolis, MG** (Casamento nº 898, livro
  13-B, fls. 22). Ambos os cônjuges são registrados como residentes em Eugenópolis
  ("residente nesta cidade"), e ele como padeiro. A cópia em mãos é uma certidão
  extraída em 5 de maio de 1972 pelo oficial do registro civil de Eugenópolis, Hélio
  Bomtempo Secunho; suas observações anotam que o termo do casamento foi alterado por
  ordem judicial datada de 6 de março de 197[-] [último dígito ilegível]. [PROVEN —
  CIV-0002]

  - **Pais:** **Aristão Ferreira Armond** (P-0008) e **Liliosa Paz Armond** (P-0009),
  ambos já falecidos quando ele morreu; sua mãe havia falecido em 16 de abril de 1946.
  A certidão de 1952 está rasgada e manchada justamente sobre o nome do pai, de modo que
  a paternidade de Aristão repousa apenas no registro de óbito de 1991 (CIV-0003) e
  permanece forte evidência até que se obtenha o registro de nascimento do próprio
  Geraldo; a mãe é nomeada em ambos. [PROVEN as recorded]

  - **Óbito:** 18 de fevereiro de 1991, às 19h, no Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registrado no dia seguinte (óbito nº 39.006, folha 557);
  aos 76 anos; causa "desequilíbrio metabólico". O registro dá sua residência em Volta
  Redonda ("residente nesta cidade"; logradouro omitido aqui) e diz que seria sepultado
  no cemitério da cidade ("Cemitério desta cidade"). [PROVEN — CIV-0003]

  - **Residência principal ao longo da vida: Irajá, Rio de Janeiro (Zona Norte)** —
  Geraldo e Cidalia viveram toda a vida adulta em Irajá; Volta Redonda foi apenas o
  local da morte (última fase de vida), não o lar de toda a vida. [declaração do
  proprietário, 2026-09-14] O casamento de 1952 ainda o registra, aos 37 anos, como
  residente em Eugenópolis (CIV-0002), de modo que os anos de Irajá muito provavelmente
  começaram depois do casamento — "vida adulta" lê-se melhor como vida de casado.
  [INFERRED] O endereço exato em Irajá não consta de nenhum documento obtido. [OPEN] A
  pesquisa de recuperação informa que nenhum dos cônjuges aparece nas listas
  telefônicas digitalizadas do Rio de 1951, 1959 e 1969–70, o que sugere ausência de
  telefone listado, e não lacuna das listas. [LEAD — busca informada pelo lado da
  recuperação]

  - **Filhos:** três filhos adultos no total — dois faleceram antes dele, um sobreviveu
  à sua morte. O registro de 1991 registra "deixou um filho" (um filho sobrevivente à
  época). Os dois que faleceram antes dele: **Fernando Augusto Engrácio Armond**
  (f. 26 de agosto de 1989) [LEAD — árvore FS; certidão de óbito ainda não obtida]; e
  um segundo filho (nome desconhecido, f. Irajá, Rio de Janeiro, 1982–início de 1991)
  [LEAD — conhecimento do proprietário; registro de óbito não localizado apesar de
  busca exaustiva no registro da 11ª Circunscrição de Irajá, nos índices de Volta
  Redonda e no índice mestre da 3ª Circ. do Rio]. Um filho sobrevive (vivo —
  detalhes omitidos por privacidade). [PROVEN — óbito de 1991 + óbito de Cidalia de
  2023 combinados]

  ## Posição social e profissão

  - **Padeiro** em seu casamento de 1952 (CIV-0002); registrado como **aposentado** em
  seu óbito de 1991 (CIV-0003). [PROVEN]

  - **Letramento não documentado.** O documento de 1952 em mãos é uma certidão extraída
  pelo oficial do registro, emitida em 1972, que traz apenas as assinaturas do oficial,
  não as dos cônjuges. Fica retirada a afirmação anterior de que ele a assinou. O
  assento original no livro 13-B mostraria se ele assinou. [OPEN]

  - **Espólio:** o registro de 1991 declara que ele **não deixou testamento** ("não
  deixou testamento"), deixou bens a inventariar ("deixou bens a inventariar") e deixou
  um filho. [PROVEN — CIV-0003]

  ## Família e rede social

  Sua esposa **Cidalia Engrácio Guimarães** (P-0005), nascida em 1930 em Alvorada, MG,
  doméstica, passou depois a assinar "Cidalia Engrácio Armond"; ela o sobreviveu e é
  nomeada como sua cônjuge em seu óbito de 1991. Seus avós paternos foram **Simplício
  José Ferreira Armond** (P-0016) e **Eliza Balbina de Toledo** (P-0017), por meio de
  quem a ancestralidade fundiária Toledo chega até ele. Seu irmão foi **José Olavo
  Armond** (P-0018, nascido em 25 de setembro de 1926 em Eugenópolis — GOV-0001,
  NWS-0001), o outro filho documentado de Aristão × Liliosa. Aristão × Liliosa tiveram
  seis filhos no total: Geraldo e José Olavo são confirmados por documentos primários;
  os outros quatro (Maria Aparecida Armond de Oliveira, Lucia, Marina e Otavia) constam
  da Árvore Genealógica FS, mas nenhum tem registro de nascimento ou óbito em mãos. As
  datas de Maria Aparecida na árvore (3 de outubro de 1933 – 25 de setembro de 2000)
  foram digitadas na árvore sem registro anexado, e as buscas da pesquisa de
  recuperação de 2026-09-11, com e sem filtro de pais, não encontraram registro no
  FamilySearch para nenhum dos quatro. [PROVEN para Geraldo + José Olavo; LEAD para os
  outros quatro] No casamento de 1952 as testemunhas são lidas como Camilo [uncertain]
  Filho e Mário Dutra da Silva [uncertain], perante um juiz lido como Cyrano Portilho
  [uncertain] (CIV-0002). Seu casamento é o ponto em que a linha Armond/Paz se une à
  linha Engrácio/Guimarães. [PROVEN]

  ## O que podemos extrapolar

  Geraldo completa um arco de mobilidade social descendente ao longo de três gerações [INFERRED]: seu
  avô paterno Simplício José Ferreira Armond exerceu cargos judiciais e cívicos e casou-se com o clã
  fundiário Toledo (documentado em P-0016), seu pai Aristão teve um título policial não remunerado mas
  trabalhou num ofício, e Geraldo terminou a vida como padeiro aposentado numa cidade industrial do
  Rio de Janeiro. É o ponto em que esse arco se torna legível numa única palavra — padeiro — e várias
  linhas convergem para ele.

  - **Por que nada de transmissível chegou até ele, rastreado até o documento** [cifras PROVEN;
  leitura INFERRED]. A herança Toledo, vinda por casamento, de fato chegou, mas como frações de valor
  e não como bens: a folha de pagamento datada de c.1919 destina a seu avô, em direito de sua avó
  Eliza, 72$910 numa casa de morada, 9$113 num paiol, 3$645 num moinho, 14$582 nas metades de um
  engenho e de um ventilador, 51$037 em 3.388 ares de matta virgem e uma cifra gasta de capoeiras lida
  como 50$546 ou 508$546 [uncertain] (PRB-0011, P-0016). Pela sucessão partível, esse quinhão dividiu-se
  de novo entre Aristão e os irmãos, e outra vez entre os filhos de Aristão. Dois degraus acima, a
  renda de cargo já havia morrido com os cargos — que, de partida, não pagavam nada. Geraldo começa com
  um nome e um ofício, não com capital.

  - **O ofício e o que ele pagava** [CONTEXTUAL; a ocupação é PROVEN]. Um padeiro na região do Rio
  ganhava um salário mensal ancorado no salário mínimo, o primeiro salário mínimo nacional
  (Decreto-Lei nº 2.162 de 1.º de maio de 1940), fixado em 240$000 por mês em sua faixa mais alta, o
  então Distrito Federal (a cidade do Rio, que incluía Irajá) — Cr$240 pela conversão de um para um
  para o cruzeiro em 1942, e reajustado por decretos posteriores. Em 1952 ele ainda era padeiro
  residente em Minas (CIV-0002), onde as faixas eram mais baixas. (Uma versão anterior aqui ligava a
  faixa de 240$000 a Volta Redonda e dava cerca de Cr$300 após a conversão; ambas as coisas foram
  corrigidas.) Pela história do trabalho regional, ele teria ganhado perto desse piso — um salário
  urbano de serviços, sem terra, capital ou bem transmissível associado.
  Isso torna a queda quantitativa, e não apenas uma palavra: de uma linha materna cuja riqueza cafeeira
  assentava-se em trabalho escravizado — dez pessoas avaliadas entre cerca de 800$000 e 1:700$000 cada
  uma no espólio de 1867 de seu bisavô José Cezário de Toledo Lima (PRB-0008) — até vender a própria força de trabalho por cerca do
  salário mínimo legal, em quatro gerações. [os valores do salário são a lei; a atribuição a Geraldo é
  INFERRED]

  - **A instrução que cai junto com o dinheiro** [CONTEXTUAL; letramento não documentado]. Um padeiro no cinturão
  industrial do Rio é a forma urbanizada de uma família rural que perdera a terra, e a educação caiu do
  mesmo modo que o dinheiro: a instrução era um privilégio comprado e ligado à classe — sem escola
  pública rural gratuita, recomprada a cada geração —, de modo que um menino da classe trabalhadora
  nascido no interior de Minas em 1915 tipicamente entrava num ofício por volta dos 12–14 anos em vez de
  concluir os estudos, sendo a escolarização universal no Brasil uma conquista já do fim do século XX.
  Nenhum registro em mãos mostra se ele sabia assinar: a certidão de 1952 é uma certidão extraída pelo
  oficial, sem assinatura dos cônjuges, de modo que o fio da instrução ainda não pode ser traçado por
  meio dele.

  - **Um terceiro casamento lateral consecutivo** [PROVEN; leitura INFERRED]. Em 1952, aos 37 anos,
  casou-se com Cidalia Engrácio Guimarães, doméstica, de Alvorada, MG, filha de uma casa de Eugenópolis
  (CIV-0002). Seu pai casara-se com Liliosa Paz, mulher sem bens documentados (P-0009); apenas a geração
  de seu bisavô casara-se para dentro da terra. Três gerações de enlaces no mesmo nível social são o modo
  ordinário de a posição de uma família se manter quando já não há o que consolidar. [nenhum registro em
  mãos fala de motivo]

  - **Onde ele realmente viveu, e o que a mudança fez** [residência declarada pelo proprietário; sentido
  CONTEXTUAL]. Geraldo viveu sua vida adulta de trabalho em Irajá, Rio de Janeiro (Zona Norte)
  [declaração do proprietário], no mesmo cinturão da Zona Norte onde a família de Cidalia, os Engrácio,
  estava ancorada (o pai dela em Pavuna, adjacente a Irajá). Ele ainda residia em Eugenópolis, como
  padeiro, quando se casou em 1952 (CIV-0002), de modo que a mudança para o Rio muito provavelmente
  veio depois do casamento [INFERRED]. Uma mudança de última fase o levou, junto
  com Cidalia, a Volta Redonda, onde morreu em 1991. A trajetória geral Zona da Mata → Rio encaixa-se na
  migração rural-Minas → Rio industrial de meados do século XX; a mudança Irajá → Volta Redonda de última
  fase teve um motivo diferente e não documentado. O centro de gravidade do ramo passou da Zona da Mata
  para a Zona Norte do Rio ao longo dessas décadas — não para a cidade siderúrgica como lar principal.

  - **O arco chega ao fundo com ele, e vira** [PROVEN; leitura INFERRED]. Ele termina registrado como
  aposentado, sem testamento, mas com bens a inventariar (CIV-0003) — o espólio de um homem trabalhador, e não
  uma fazenda, mas ainda assim um espólio, acumulado a partir de salário e não herdado. Onde a posição de
  seus antepassados vinha de cargos que não pagavam nada e de terra que chegava em frações, o que ele
  deixou veio do trabalho. É outro tipo de fundamento, e é o que a família guardou.

  Lida como um todo [INFERRED], a vida de Geraldo não é prova de uma fortuna perdida, mas o fim clássico
  de uma família mediana da Zona da Mata, baseada em cargo e casamento, apanhada pelo colapso do café e
  pela urbanização do século XX: renda de cargo contingente e uma base de terra por casamento,
  fragmentadas pela herança partível e congeladas por décadas em inventário, numa economia regional que
  ruiu, com descendentes reestabelecidos como trabalhadores urbanos de ofício. Lida de trás para frente,
  é uma corroboração discreta de que o aparente auge da família (Simplício) assentava-se em posição, não
  em capital transmissível.

