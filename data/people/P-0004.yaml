profile: >-
  ## Identity

  **Geraldo Paz Armond**, Juan's paternal grandfather. The middle name **"Paz"** is
  his mother's family surname, carried by both of Aristão × Liliosa's sons; our
  records consistently give the surname **"Armond"** (the wider branch shows an
  occasional *Armand ⁓ Armond* drift). [PROVEN]

  - **Birth:** 30 January 1915, at "Limeira", Minas Gerais — modelled as the
  municipality of **Rosário da Limeira**, in the Zona da Mata Mineira. The date is
  stated in his 1952 marriage (CIV-0002) and is consistent with the age 76 given at
  his 1991 death (CIV-0003). [PROVEN date; the municipality reading is INFERRED]

  - **Marriage:** married **Cidalia Engrácio Guimarães** (P-0005) on 31 May 1952 at
  14h, civil registry of **Eugenópolis, MG** (Casamento nº 898, livro 13-B). [PROVEN]

  - **Parents:** **Aristão Ferreira Armond** (P-0008) and **Liliosa Paz Armond**
  (P-0009), both deceased by his own death; his mother had died 16 April 1946. [PROVEN]

  - **Death:** 18 February 1991 at 19h in the Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registered the next day (óbito nº 39.006, folha 557);
  aged 76; cause "desequilíbrio metabólico". [PROVEN]

  - **Children:** one son, **living — details withheld**. The 1991 register records
  that he "deixou um filho" (left one child). [PROVEN]

  ## Standing and profession

  - **Padeiro (baker)** at his 1952 marriage (CIV-0002); recorded **aposentado**
  (retired) by his 1991 death (CIV-0003). [PROVEN]

  - **Literate** — he signed his own marriage certificate. [PROVEN]

  - **Estate:** the 1991 register states he left **no will** ("não deixou testamento"),
  left assets to inventory ("bens a inventariar") and left one child. [PROVEN]

  ## Family and social network

  His wife **Cidalia Engrácio Guimarães** (P-0005), born 1930 at Alvorada, MG, a
  doméstica, thereafter signed "Cidalia Engrácio Armond"; she survived him and is
  named as his spouse at his 1991 death. His brother was **José Olavo Armond**
  (P-0018), the other documented son of Aristão × Liliosa. His marriage is the point
  where the Armond/Paz line joins the Engrácio/Guimarães line. [PROVEN]

  ## What we can extrapolate

  Geraldo completes a **downward social arc** across three generations [INFERRED]: his
  paternal great-grandfather Simplício José Ferreira Armond held court and civic roles
  (documented on P-0016), while Aristão and Geraldo both worked a trade and Geraldo
  ended his life a retired baker in an industrial Rio de Janeiro city.

  ## Open questions

  - His own birth/baptism register (1915, Rosário da Limeira / Eugenópolis area) — not
  held. [OPEN]

  - When exactly he moved from the Zona da Mata to Volta Redonda (married Eugenópolis
  1952; died Volta Redonda 1991). [OPEN]

  - His inventário — the assets referenced in the 1991 register. [OPEN]

  ## Sources held (this repository)

  - CIV-0002 — 1952 marriage certificate (birth 30 January 1915 at Limeira, padeiro;
  mother Liliosa Paz "falecida em 16-4-946"; wife Cidalia Engrácio Guimarães).

  - CIV-0003 — 1991 Volta Redonda civil death register (died 18 February 1991, aged 76,
  aposentado; parents Aristão Ferreira Armond and Liliosa Paz Armond, both deceased;
  no will, one child).

  - CIV-0008 — a later certified family birth certificate recording the name form
  "Geraldo Paz Armond" and his wife among the grandparents; living-person details in
  that record are withheld.

  ## Regional and migration context

  His documented life runs from the coffee-frontier **Zona da Mata Mineira** (born
  Rosário da Limeira 1915; married Eugenópolis 1952) to the planned steel city of
  **Volta Redonda, RJ** (died 1991), built around the Companhia Siderúrgica Nacional.
  The move fits the mid-20th-century rural-Minas → industrial-Rio labour migration; no
  held record states his personal motive. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Geraldo Paz Armond**, avô paterno de Juan. O nome do meio **"Paz"** é o sobrenome
  da família de sua mãe, levado por ambos os filhos de Aristão × Liliosa; nossos
  registros trazem de forma consistente o sobrenome **"Armond"** (o ramo mais amplo
  apresenta uma oscilação ocasional *Armand ⁓ Armond*). [PROVEN]

  - **Nascimento:** 30 de janeiro de 1915, em "Limeira", Minas Gerais — modelado como
  o município de **Rosário da Limeira**, na Zona da Mata Mineira. A data está declarada
  em seu casamento de 1952 (CIV-0002) e é consistente com a idade de 76 anos indicada
  em seu óbito de 1991 (CIV-0003). [PROVEN quanto à data; a leitura do município é
  INFERRED]

  - **Casamento:** casou-se com **Cidalia Engrácio Guimarães** (P-0005) em 31 de maio
  de 1952, às 14h, no registro civil de **Eugenópolis, MG** (Casamento nº 898, livro
  13-B). [PROVEN]

  - **Pais:** **Aristão Ferreira Armond** (P-0008) e **Liliosa Paz Armond** (P-0009),
  ambos já falecidos quando ele morreu; sua mãe havia falecido em 16 de abril de 1946.
  [PROVEN]

  - **Óbito:** 18 de fevereiro de 1991, às 19h, no Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registrado no dia seguinte (óbito nº 39.006, folha 557);
  aos 76 anos; causa "desequilíbrio metabólico". [PROVEN]

  - **Filhos:** um filho, **vivo — detalhes omitidos**. O registro de 1991 declara que
  ele "deixou um filho". [PROVEN]

  ## Posição social e profissão

  - **Padeiro** em seu casamento de 1952 (CIV-0002); registrado como **aposentado** em
  seu óbito de 1991 (CIV-0003). [PROVEN]

  - **Letrado** — assinou a própria certidão de casamento. [PROVEN]

  - **Espólio:** o registro de 1991 declara que ele **não deixou testamento** ("não
  deixou testamento"), deixou bens a inventariar e deixou um filho. [PROVEN]

  ## Família e rede social

  Sua esposa **Cidalia Engrácio Guimarães** (P-0005), nascida em 1930 em Alvorada, MG,
  doméstica, passou depois a assinar "Cidalia Engrácio Armond"; ela o sobreviveu e é
  nomeada como sua cônjuge em seu óbito de 1991. Seu irmão foi **José Olavo Armond**
  (P-0018), o outro filho documentado de Aristão × Liliosa. Seu casamento é o ponto em
  que a linha Armond/Paz se une à linha Engrácio/Guimarães. [PROVEN]

  ## O que podemos extrapolar

  Geraldo completa um **arco de mobilidade social descendente** ao longo de três
  gerações [INFERRED]: seu bisavô paterno Simplício José Ferreira Armond exerceu cargos
  judiciais e cívicos (documentado em P-0016), ao passo que Aristão e Geraldo ambos
  trabalharam num ofício, e Geraldo terminou a vida como padeiro aposentado numa cidade
  industrial do Rio de Janeiro.

  ## Questões em aberto

  - Seu próprio registro de nascimento/batismo (1915, região de Rosário da Limeira /
  Eugenópolis) — não obtido. [OPEN]

  - Quando exatamente ele se mudou da Zona da Mata para Volta Redonda (casou-se em
  Eugenópolis em 1952; faleceu em Volta Redonda em 1991). [OPEN]

  - Seu inventário — os bens referidos no registro de 1991. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0002 — certidão de casamento de 1952 (nascimento em 30 de janeiro de 1915 em
  Limeira, padeiro; mãe Liliosa Paz "falecida em 16-4-946"; esposa Cidalia Engrácio
  Guimarães).

  - CIV-0003 — registro civil de óbito de Volta Redonda de 1991 (faleceu em 18 de
  fevereiro de 1991, aos 76 anos, aposentado; pais Aristão Ferreira Armond e Liliosa
  Paz Armond, ambos falecidos; sem testamento, um filho).

  - CIV-0008 — uma certidão de nascimento familiar posterior que registra a forma do
  nome "Geraldo Paz Armond" e sua esposa entre os avós; os detalhes de pessoa viva
  nesse registro são omitidos.

  ## Contexto regional e migratório

  Sua vida documentada vai da **Zona da Mata Mineira**, fronteira cafeeira (nascido em
  Rosário da Limeira em 1915; casado em Eugenópolis em 1952), até a cidade siderúrgica
  planejada de **Volta Redonda, RJ** (falecido em 1991), erguida em torno da Companhia
  Siderúrgica Nacional. A mudança encaixa-se na migração de trabalho Minas rural →
  Rio industrial de meados do século XX; nenhum registro em mãos declara seu motivo
  pessoal. [CONTEXTUAL]
