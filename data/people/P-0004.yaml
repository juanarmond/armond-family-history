profile: >-
  ## Identity

  **Geraldo Paz Armond**, Juan's paternal grandfather. The middle name **"Paz"** is
  his mother's family surname, carried by both of Aristão × Liliosa's sons; our
  records consistently give the surname **"Armond"** (the wider branch shows an
  occasional *Armand ⁓ Armond* drift). [PROVEN]

  - **Birth:** 30 January 1915, at "Limeira", Minas Gerais — modelled as the
  municipality of **Rosário da Limeira**, in the Zona da Mata Mineira. The date is
  stated in his 1952 marriage (CIV-0002) and is consistent with the age 76 given at
  his 1991 death (CIV-0003). [PROVEN date; the municipality reading is INFERRED]

  - **Marriage:** married **Cidalia Engrácio Guimarães** (P-0005) on 31 May 1952 at
  14h, civil registry of **Eugenópolis, MG** (Casamento nº 898, livro 13-B). [PROVEN]

  - **Parents:** **Aristão Ferreira Armond** (P-0008) and **Liliosa Paz Armond**
  (P-0009), both deceased by his own death; his mother had died 16 April 1946. [PROVEN]

  - **Death:** 18 February 1991 at 19h in the Hospital Santa Margarida, **Volta
  Redonda, Rio de Janeiro**; registered the next day (óbito nº 39.006, folha 557);
  aged 76; cause "desequilíbrio metabólico". [PROVEN]

  - **Children:** one son, **living — details withheld**. The 1991 register records
  that he "deixou um filho" (left one child). [PROVEN]

  ## Standing and profession

  - **Padeiro (baker)** at his 1952 marriage (CIV-0002); recorded **aposentado**
  (retired) by his 1991 death (CIV-0003). [PROVEN]

  - **Literate** — he signed his own marriage certificate. [PROVEN]

  - **Estate:** the 1991 register states he left **no will** ("não deixou testamento"),
  left assets to inventory ("bens a inventariar") and left one child. [PROVEN]

  ## Family and social network

  His wife **Cidalia Engrácio Guimarães** (P-0005), born 1930 at Alvorada, MG, a
  doméstica, thereafter signed "Cidalia Engrácio Armond"; she survived him and is
  named as his spouse at his 1991 death. His brother was **José Olavo Armond**
  (P-0018), the other documented son of Aristão × Liliosa. His marriage is the point
  where the Armond/Paz line joins the Engrácio/Guimarães line. [PROVEN]

  ## What we can extrapolate

  Geraldo completes a **downward social arc** across three generations [INFERRED]: his
  paternal grandfather Simplício José Ferreira Armond held court and civic roles
  (documented on P-0016), while Aristão and Geraldo both worked a trade and Geraldo
  ended his life a retired baker in an industrial Rio de Janeiro city. He is the point where
  that arc becomes legible in a single word — padeiro — and several strands converge on it.

  - **The trade, and what it paid** [CONTEXTUAL]. A baker in a steel-boom company town earned
  a monthly wage anchored to the salário mínimo, the first national minimum wage (Decreto-Lei
  nº 2.162 of 1 May 1940), set at up to 240$000 per month in the highest-cost Rio band that
  included Volta Redonda's part of RJ and reading as roughly Cr$300 after the 1942 cruzeiro
  conversion. On the regional labour history he would have earned close to that floor — an
  urban service wage with no land, capital or heritable asset attached (his 1991 register
  notes only "bens a inventariar", a modest estate). That contrast makes the fall
  quantitative rather than merely a word: from a landed maternal (Toledo) line whose coffee
  wealth the regional history ties to enslaved labour, and a grandfather remembered as a
  lender of money (a lead, not yet catalogued here), down to selling one's labour at about the
  legal minimum wage — in three to four generations. [CONTEXTUAL; the wage figures are the
  law, the attribution to Geraldo is INFERRED]

  - **The schooling that falls with the money** [CONTEXTUAL]. A padeiro in Volta Redonda is
  the urbanized form of a rural family that had lost its land, and education fell the same way
  the money did: schooling was a purchased, class-linked privilege (no free rural public
  school; re-bought each generation), so a working-class boy born in the MG interior in 1915
  would typically enter a trade at around 12–14 rather than finish school — Brazil's universal
  schooling being a late-20th-century achievement. His literacy is documented (he signed his
  1952 certificate), which fits a tradesman rather than the office-holding literacy of his
  great-grandfather's generation. [CONTEXTUAL; literacy PROVEN]

  - **Nothing heritable reached him** [INFERRED]. By his generation the office income two
  steps up had died with the office, the married-in Toledo land had entered estates to be
  divided generations earlier, and partible inheritance had split the remainder among his
  father's siblings and then his father's children. Geraldo starts with a name and a trade,
  not capital — his own register records only "bens a inventariar", the small property of a
  working man, not a fazenda. [INFERRED; estate note PROVEN]

  - **The move completes the migration the economy forced** [CONTEXTUAL]. His death in Volta
  Redonda fits the CSN steel-city labour pull of the 1940s onward — the terminal stage of the
  family's coffee-bust-to-urbanization arc. The relocation was a family movement rather than
  an isolated personal one: the branch's centre of gravity shifted from the declining Zona da
  Mata coffee country to the CSN steel city across these decades.

  Read as a whole [INFERRED], Geraldo's life is not evidence of a lost fortune but the
  textbook end of a middling, office-and-marriage-based Zona-da-Mata family caught in the
  coffee bust and 20th-century urbanization: office income and married-in land, fragmented by
  partible inheritance, in a regional economy that collapsed, with descendants re-established
  as urban tradesmen. Read backward, it is quiet corroboration that the family's apparent peak
  (Simplício) rested on status, not transmissible capital.

  ## Open questions

  - His own birth/baptism register (1915, Rosário da Limeira / Eugenópolis area) — not
  held. [OPEN]

  - When exactly he moved from the Zona da Mata to Volta Redonda (married Eugenópolis
  1952; died Volta Redonda 1991). [OPEN]

  - His inventário — the assets referenced in the 1991 register. [OPEN]

  ## Sources held (this repository)

  - CIV-0002 — 1952 marriage certificate (birth 30 January 1915 at Limeira, padeiro;
  mother Liliosa Paz "falecida em 16-4-946"; wife Cidalia Engrácio Guimarães).

  - CIV-0003 — 1991 Volta Redonda civil death register (died 18 February 1991, aged 76,
  aposentado; parents Aristão Ferreira Armond and Liliosa Paz Armond, both deceased;
  no will, one child).

  - CIV-0008 — a later certified family birth certificate recording the name form
  "Geraldo Paz Armond" and his wife among the grandparents; living-person details in
  that record are withheld.

  ## Regional and migration context

  His documented life runs from the coffee-frontier **Zona da Mata Mineira** (born
  Rosário da Limeira 1915; married Eugenópolis 1952) to the planned steel city of
  **Volta Redonda, RJ** (died 1991), built around the Companhia Siderúrgica Nacional.
  The move fits the mid-20th-century rural-Minas → industrial-Rio labour migration; no
  held record states his personal motive. [CONTEXTUAL]

