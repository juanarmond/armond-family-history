notes:
- text: >-
    Father of Elisabetha Borer (P-0073). Confirmed in the Erschwil (Erischwyg)
    Catholic parish baptism register (PAR-0028, church book #68): named as "Joseph
    Borer fusemnistr" — the suffix "fusemnistr" is an abbreviated title or local
    office not fully deciphered (possibly "Feuersmeister" or a similar communal
    role). He also appears as godfather at an Erschwil baptism ("Joseph Borer gmüpl")
    on the same page. The Borer surname was common in the Solothurn district
    (Erschwil/Grindel area).
- text: >-
    This Joseph Borer is distinct from Jacob Borer (BORER I, P-0050, b. 1801
    Erschwil) and Laurent Borer (BORER II, P-0068, b. 1797 Grindel), who were
    the Nova Friburgo immigrants. The connection between this Joseph Borer and the
    Nova Friburgo Borer immigrants has not been established by primary evidence.
