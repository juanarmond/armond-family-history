profile: >-
  ## Interesting facts

  - **[PROVEN]** He is named "Joseph Borer *fusemnistr*" in the Erschwil Catholic baptism
  register of 17 June 1760, as the father of Elisabetha (PAR-0028, church book #68) — fixing
  this family in the Solothurn Schwarzbubenland nearly sixty years before Dom João VI's
  recruiters reached the Jura.

  - **[uncertain]** The suffix "*fusemnistr*" is an abbreviated local title or office that has
  **not** been deciphered. *Feuersmeister* (fire warden) or a similar communal duty is the
  plausible reading, but it is a guess about a half-legible word and must be treated as one.
  The godfather on the same entry carries another undeciphered tag, "*gmüpl*".

  - **[PROVEN]** Both he and his wife are surnamed **Borer**, and so are the godfather
  ("Joseph Borer *gmüpl*") and godmother ("Mari Elisabth Borr") on the same act. Four Borers
  around one baptism is the clearest single image of how small this village's kin network was.

  - **[CONTEXTUAL]** Erschwil sits in the Thierstein Jura, among the poorest and most
  land-constrained districts of Canton Solothurn — a Catholic enclave of smallholders with
  little to divide, exactly the demographic the Brazilian recruiters targeted two generations
  later.

  - **[PROVEN]** He did not emigrate. It was his daughter's married line, through the Wehrlis
  of Grindel, that reached Brazil in 1819 — sixty years after the baptism that is his only
  appearance in the record.

  ## Identity

  **Joseph Borer** (Latinised *Josephus Borer*; recorded "Joseph Borer *fusemnistr*"). Of
  Erschwil (Erischwyg), Soleure (Solothurn), Switzerland; the earliest named Borer on this
  branch fixed by a held primary entry. Swiss.

  - **Role / title:** the suffix "*fusemnistr*" attached to his name is an abbreviated local
  title or office, not fully deciphered — possibly *Feuersmeister* or a comparable communal
  role. [uncertain] (PAR-0028)

  - **Marriage:** husband of Anna Maria Borer (P-0077) — a Borer × Borer union, both spouses
  recorded under the same surname — [PROVEN] as the couple named at their daughter's 1760
  baptism (PAR-0028; family F-0037). No marriage record located. [OPEN]

  - **Birth, death, own parents:** not documented; no record held. [OPEN]

  ## Standing and profession

  - **No occupation is recorded**, and no property, wealth or literacy. The only status marker
  in the whole record is the undeciphered "*fusemnistr*" tag, and the honest position is that
  we do not know what it means.

  - **What can be said about that tag, carefully [INFERRED].** Whatever it abbreviates, it is
  a *village* designation attached to a man in a small Jura parish, not a rank, a military
  title or a seigneurial office. Titles of that sort — fire warden, communal officer, church
  functionary — conferred standing and, characteristically, no income: unpaid duty in a
  commune of a few hundred people. That is a recognisable pattern in this tree, where honorary
  offices recur across four lines and pay nothing.

  ## Family and social network

  - **Child (documented):** Elisabetha Borer (P-0073, b. 17 June 1760 Erschwil), who married
  Johann Jacob Wehrli at Grindel in 1782 and became the Wehrli matriarch of the Nova Friburgo
  line. [PROVEN — PAR-0028] A FamilySearch collaborative tree instead names Elisabetha's
  father Joannes Borer (with mother Elisabeth Borer) — contradicted by the held baptism naming
  Joseph × Anna Maria, which prevails; the tree pair is a navigation lead, not adopted
  [LEAD/contradicted].

  - **Namesake caution:** the 1760 register page carries several Borer men, including a
  "Joseph Borer *gmüpl*" as godfather at this very baptism. Our identification rests
  specifically on the entry naming him as Elisabetha's father, not on the same-name
  godparents. [PROVEN for that entry only]

  - He **did not emigrate**; only his daughter's married line reached Brazil, a generation
  later and via the Wehrlis.

  ## What we can extrapolate

  - **A Borer × Borer marriage inside a page of Borers [INFERRED].** Both parents, the
  godfather and the godmother at his daughter's baptism carry the surname. That indicates a
  very small, endogamous Borer population in Erschwil around 1760 — and it makes the Erschwil
  Borers a plausible common pool behind Laurent Borer's Grindel Borers too. Plausible, not
  proven: the two are documented as distinct households and should stay so.

  - **Standing that is neither wealth nor office income [INFERRED / CONTEXTUAL].** He is the
  only person in this Swiss group to whom any record attaches a designation at all, which
  makes him marginally the most "placed" of them — and it is worth being precise that this
  buys nothing. A communal village duty is a position within a poor parish, not a claim on
  land, fees or a salary, and it does not descend. Read against the family's Armond line,
  where the proudest offices were likewise unpaid and the status collapsed the moment the
  married-in land was gone, this is the same lesson at village scale: standing without a
  wage-base underneath it transmits nothing.

  - **Wealth mechanics: a smallholding subject to division, and nothing else in evidence
  [CONTEXTUAL].** The Thierstein Jura ran on subsistence farms divided among heirs. Whatever
  the household held would have been split, and split again, across the generations between
  him and the 1819 emigration — which is the standing explanation for why his descendants had
  nothing to carry to Brazil and every reason to go.

  - **Education: he sits before the question arises [CONTEXTUAL].** The Catholic Solothurn
  parishes gave their smallholders German parish-school literacy, and nothing states whether
  he had it. The point is downstream: that asset crossed the Atlantic with his descendants and
  then behaved like property — kept on the branch that reached town trade, lost on the branch
  that stayed on fragmenting land, where his great-great-great-grandson's household was
  recorded as unable to write in 1891.

  - **He is the Old-World floor of the Borer surname in this tree [CONTEXTUAL / INFERRED].** A
  Catholic Erschwil smallholder in a poor, land-hungry Jura district, with a village duty and
  no capital: the very bottom rung from which the whole Borer/Bohrer arc departs. No fortune
  existed here to lose, which is the structural mirror image of the family's Armond line. The
  lateral colony emigration, and every gain or loss that followed it, belong to his
  descendants' generations.

  ## Open questions

  - His and Anna Maria Borer's **own parents**, and their **marriage record** — the Erschwil
  registers (church book #68) and the Thierstein district *Inventar- und Teilungen*, which
  would also test the FS tree's competing "Joannes × Elisabeth" pair. [OPEN]

  - **The "*fusemnistr*" tag** — a higher-resolution image of the 1760 page, or a comparison
  with other entries in the same hand, would decide whether it is *Feuersmeister* or something
  else entirely. Until then it stays [uncertain] and should not be translated as a fact.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil Catholic baptism register, church book #68 — his daughter Elisabetha's
  1760 baptism, naming him "Joseph Borer *fusemnistr*" as father and Anna Maria Borer as
  mother; sources event E-0069).

  ## Regional and migration context

  An Erschwil Borer of the Catholic Solothurn Jura — the Schwarzbubenland of the Thierstein
  district, poor land-constrained farming country where smallholdings were divided among heirs
  until the shares would not support a household. [CONTEXTUAL] He stayed at the origin end of
  the branch: the emigration to Nova Friburgo belongs to a later generation (1819), prompted
  by the 1815 Tambora eruption and the 1816 "Year Without a Summer" famine on top of
  post-Napoleonic poverty, and carried out under Dom João VI's *Decreto de 16 de maio de 1818*
  for 100 Swiss **Catholic** families. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (named as father in the 1760 Erschwil baptism of his daughter Elisabetha; he
  did not emigrate):** Kath. Pfarrkirche St. Peter und Paul, 4228 Erschwil, Kt. Solothurn,
  Switzerland (GPS 47.3736, 7.5431) [RESOLVED as a place; his own records OPEN] ·
  [Maps](https://maps.google.com/?q=47.3736,7.5431)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É nomeado "Joseph Borer *fusemnistr*" no livro de batismos católico de
  Erschwil de 17 de junho de 1760, como pai de Elisabetha (PAR-0028, livro paroquial nº 68) —
  fixando esta família no Schwarzbubenland de Solothurn quase sessenta anos antes de os
  recrutadores de Dom João VI chegarem ao Jura.

  - **[incerto]** O sufixo "*fusemnistr*" é um título ou cargo local abreviado que **não** foi
  decifrado. *Feuersmeister* (guarda de incêndio) ou dever comunal semelhante é a leitura
  plausível, mas é um palpite sobre uma palavra meio legível e deve ser tratado como tal. O
  padrinho, no mesmo assento, carrega outra etiqueta não decifrada, "*gmüpl*".

  - **[PROVEN]** Tanto ele quanto a esposa têm o sobrenome **Borer**, assim como o padrinho
  ("Joseph Borer *gmüpl*") e a madrinha ("Mari Elisabth Borr") do mesmo ato. Quatro Borer em
  torno de um batismo é a imagem isolada mais clara de quão pequena era a rede de parentesco
  desta aldeia.

  - **[CONTEXTUAL]** Erschwil fica no Jura de Thierstein, entre os distritos mais pobres e
  mais limitados em terra do Cantão de Solothurn — um enclave católico de pequenos lavradores
  com pouco a dividir, exatamente o perfil demográfico que os recrutadores brasileiros visaram
  duas gerações depois.

  - **[PROVEN]** Ele não emigrou. Foi a linha casada de sua filha, pelos Wehrli de Grindel,
  que chegou ao Brasil em 1819 — sessenta anos depois do batismo que é sua única aparição no
  registro.

  ## Identidade

  **Joseph Borer** (latinizado *Josephus Borer*; registrado "Joseph Borer *fusemnistr*"). De
  Erschwil (Erischwyg), Soleure (Solothurn), Suíça; o Borer nomeado mais antigo deste ramo
  fixado por um assento primário disponível. Suíço.

  - **Cargo / título:** o sufixo "*fusemnistr*" anexado a seu nome é título ou cargo local
  abreviado, não plenamente decifrado — possivelmente *Feuersmeister* ou função comunal
  comparável. [incerto] (PAR-0028)

  - **Casamento:** marido de Anna Maria Borer (P-0077) — união Borer × Borer, ambos os
  cônjuges registrados sob o mesmo sobrenome — [PROVEN] como o casal nomeado no batismo da
  filha, em 1760 (PAR-0028; família F-0037). Nenhum registro de casamento localizado. [OPEN]

  - **Nascimento, óbito, próprios pais:** não documentados; nenhum registro disponível. [OPEN]

  ## Posição social e profissão

  - **Nenhuma ocupação está registrada**, nem propriedade, riqueza ou alfabetização. O único
  marcador de posição em todo o registro é a etiqueta não decifrada "*fusemnistr*", e a
  posição honesta é que não sabemos o que significa.

  - **O que se pode dizer sobre essa etiqueta, com cuidado [INFERRED].** Seja o que for que
  abrevie, é uma designação *de aldeia* anexada a um homem numa pequena paróquia do Jura, não
  uma patente, um título militar ou um cargo senhorial. Títulos desse tipo — guarda de
  incêndio, oficial comunal, funcionário da igreja — conferiam posição e, caracteristicamente,
  nenhuma renda: dever não remunerado numa comuna de poucas centenas de pessoas. É um padrão
  reconhecível nesta árvore, em que cargos honorários se repetem em quatro linhas e não pagam
  nada.

  ## Família e rede social

  - **Filha (documentada):** Elisabetha Borer (P-0073, n. 17 de junho de 1760, em Erschwil),
  que se casou com Johann Jacob Wehrli em Grindel, em 1782, e se tornou a matriarca Wehrli da
  linha de Nova Friburgo. [PROVEN — PAR-0028] Uma árvore colaborativa do FamilySearch nomeia,
  em vez disso, o pai de Elisabetha como Joannes Borer (com a mãe Elisabeth Borer) —
  contradito pelo batismo disponível, que nomeia Joseph × Anna Maria e prevalece; o par da
  árvore é pista de navegação, não adotado [LEAD/contradicted].

  - **Cautela com homônimos:** a página do livro de 1760 traz vários homens Borer, inclusive
  um "Joseph Borer *gmüpl*" como padrinho neste mesmo batismo. Nossa identificação assenta
  especificamente no assento que o nomeia pai de Elisabetha, não nos padrinhos de mesmo nome.
  [PROVEN apenas para esse assento]

  - Ele **não emigrou**; apenas a linha casada de sua filha chegou ao Brasil, uma geração
  depois e pelos Wehrli.

  ## O que podemos extrapolar

  - **Um casamento Borer × Borer dentro de uma página de Borer [INFERRED].** Os dois pais, o
  padrinho e a madrinha do batismo de sua filha carregam o sobrenome. Isso indica uma
  população Borer muito pequena e endogâmica em Erschwil por volta de 1760 — e torna os Borer
  de Erschwil um repertório comum plausível também por trás dos Borer de Grindel de Laurent
  Borer. Plausível, não provado: os dois estão documentados como domicílios distintos e assim
  devem permanecer.

  - **Posição que não é nem riqueza nem renda de cargo [INFERRED / CONTEXTUAL].** É a única
  pessoa deste grupo suíço a quem algum registro anexa qualquer designação, o que faz dele,
  por pouco, o mais "situado" de todos — e convém ser preciso quanto ao fato de que isso não
  compra nada. Um dever comunal de aldeia é uma posição dentro de uma paróquia pobre, não um
  direito sobre terra, emolumentos ou salário, e não se transmite. Lido contra a linha Armond
  da família, em que os cargos mais orgulhosos eram igualmente não remunerados e a posição
  ruiu assim que a terra obtida por casamento acabou, esta é a mesma lição em escala de
  aldeia: posição sem base salarial por baixo não transmite nada.

  - **Mecânica da riqueza: um minifúndio sujeito a divisão, e nada mais em evidência
  [CONTEXTUAL].** O Jura de Thierstein funcionava com lavouras de subsistência divididas entre
  herdeiros. O que quer que o domicílio detivesse teria sido repartido, e repartido de novo,
  ao longo das gerações entre ele e a emigração de 1819 — que é a explicação corrente para o
  fato de seus descendentes não terem nada a levar ao Brasil e todos os motivos para ir.

  - **Educação: ele está antes de a questão surgir [CONTEXTUAL].** As paróquias católicas de
  Solothurn davam a seus pequenos lavradores alfabetização de escola paroquial em alemão, e
  nada declara se ele a tinha. O ponto está rio abaixo: esse ativo atravessou o Atlântico com
  seus descendentes e então se comportou como propriedade — mantido no ramo que alcançou o
  comércio urbano, perdido no ramo que permaneceu em terra que se fragmentava, onde o
  domicílio de seu tetraneto foi registrado como incapaz de escrever em 1891.

  - **Ele é o piso do Velho Mundo do sobrenome Borer nesta árvore [CONTEXTUAL / INFERRED].**
  Um pequeno lavrador católico de Erschwil, num distrito pobre e faminto por terra do Jura,
  com um dever de aldeia e sem capital: o degrau mais baixo de onde parte todo o arco
  Borer/Bohrer. Não havia aqui fortuna a perder, o que é a imagem espelhada estrutural da
  linha Armond da família. A emigração colonial lateral, e todo ganho ou perda que a seguiu,
  pertencem às gerações de seus descendentes.

  ## Questões em aberto

  - Os **pais dele e de Anna Maria Borer**, e o **registro de casamento** do casal — os livros
  de Erschwil (livro paroquial nº 68) e o *Inventar- und Teilungen* do distrito de Thierstein,
  que também testariam o par concorrente "Joannes × Elisabeth" da árvore FS. [OPEN]

  - **A etiqueta "*fusemnistr*"** — uma imagem de resolução mais alta da página de 1760, ou a
  comparação com outros assentos da mesma mão, decidiria se é *Feuersmeister* ou outra coisa.
  Até lá permanece [incerto] e não deve ser traduzida como fato. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (livro de batismos católico de Erschwil, livro paroquial nº 68 — o batismo de
  1760 de sua filha Elisabetha, que o nomeia "Joseph Borer *fusemnistr*" como pai e Anna Maria
  Borer como mãe; fundamenta o evento E-0069).

  ## Contexto regional e migratório

  Um Borer de Erschwil, do Jura católico de Solothurn — o Schwarzbubenland do distrito de
  Thierstein, terra agrícola pobre e limitada, onde os minifúndios eram divididos entre
  herdeiros até os quinhões não sustentarem um domicílio. [CONTEXTUAL] Permaneceu na ponta de
  origem do ramo: a emigração para Nova Friburgo pertence a uma geração posterior (1819),
  motivada pela erupção do Tambora de 1815 e pela fome do "Ano Sem Verão" de 1816 sobre a
  pobreza pós-napoleônica, e realizada sob o *Decreto de 16 de maio de 1818* de Dom João VI
  para 100 famílias suíças **católicas**. [CONTEXTUAL]

