profile: >-
  ## Identity

  **Joseph Borer** (Latinised *Josephus Borer*; recorded "Joseph Borer *fusemnistr*").
  Of Erschwil (Erischwyg), Soleure (Solothurn), Switzerland; the earliest named Borer on
  this branch, fixed by a held primary entry. Swiss.

  - **Role/title:** the suffix "*fusemnistr*" on his name is an abbreviated local title
  or office, not fully deciphered (possibly *Feuersmeister* or a similar communal role).
  [uncertain] (PAR-0028)

  - **Marriage:** husband of Anna Maria Borer (P-0077) — a Borer×Borer union (both
  spouses surnamed Borer) — [PROVEN] as the couple named at their daughter's 1760
  baptism (PAR-0028; family F-0037). No marriage record located. [OPEN]

  - **Birth, death, own parents:** not documented; no record held. [OPEN]

  ## Family and social network

  - **Child (documented):** Elisabetha Borer (P-0073, b. 17 June 1760 Erschwil), who
  married Johann Jacob Wehrli and became the Wehrli matriarch of the Nova Friburgo line.
  [PROVEN] (PAR-0028)

  - **Namesake caution:** the 1760 register page carries several Borer men (a "Joseph
  Borer *gmüpl*" stands as godfather; other Joseph/Josephus Borer entries appear
  nearby). Our identification rests specifically on the entry naming him as Elisabetha's
  father — not on the same-name godparents. [PROVEN for that entry only]

  - He **did not emigrate**; only his daughter's married line reached Brazil, a
  generation later via the Wehrlis.

  ## What we can extrapolate

  - **[INFERRED]** A Borer×Borer marriage plus a cluster of Borer godparents on one page
  indicates a small, endogamous Borer population in Erschwil c.1760 — the plausible
  common pool behind both this Erschwil Borer line and (possibly) Laurent Borer's Grindel
  Borers, though the two are not documented as one family.

  - **The Borer/Bohrer arc's Old-World floor starts here [CONTEXTUAL / INFERRED].** A
  Catholic Erschwil Borer in the poor, land-hungry Thierstein Jura, he sits at the very
  bottom rung of the line's socioeconomic arc — a smallholder/peasant community with no
  fortune to lose (the structural mirror image of the family's Armond line). It was his
  descendants' generation, not his, that made the lateral 1819 colony emigration.

  ## Open questions

  - His and Anna Maria Borer's own parents (one more Erschwil generation) and his
  marriage record would come from the Erschwil registers (church book #68) and the
  Thierstein district *Inventar- und Teilungen*. [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil baptism register, church book #68 — his daughter Elisabetha's
  1760 baptism, naming him as father).

  ## Regional and migration context

  An Erschwil Borer of the Catholic Solothurn Jura (Schwarzbubenland), poor
  land-constrained farming country; he stayed at the origin end of the branch, the
  emigration to Nova Friburgo belonging to a later generation (1819). [CONTEXTUAL]

  ## Where to go today

  - **Home parish (named as father in the 1760 Erschwil baptism of his daughter Elisabetha; did not emigrate):** Kath. Pfarrkirche St. Peter und Paul, Erschwil, Kt. Solothurn, Switzerland (4228 Erschwil) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3736,7.5431)
profile_pt: >-
  ## Identidade

  **Joseph Borer** (latinizado *Josephus Borer*; registrado "Joseph Borer
  *fusemnistr*"). De Erschwil (Erischwyg), Soleure (Solothurn), Suíça; o Borer nomeado
  mais antigo deste ramo, fixado por um assento primário em mãos. Suíço.

  - **Cargo/título:** o sufixo "*fusemnistr*" em seu nome é um título ou ofício local
  abreviado, não totalmente decifrado (possivelmente *Feuersmeister* ou função comunal
  semelhante). [uncertain] (PAR-0028)

  - **Casamento:** marido de Anna Maria Borer (P-0077) — uma união Borer×Borer (ambos os
  cônjuges com o sobrenome Borer) — [PROVEN] como o casal nomeado no batismo de 1760 de
  sua filha (PAR-0028; família F-0037). Nenhum registro de casamento localizado. [OPEN]

  - **Nascimento, óbito, próprios pais:** não documentados; nenhum registro em mãos.
  [OPEN]

  ## Família e rede social

  - **Filha (documentada):** Elisabetha Borer (P-0073, n. 17 de junho de 1760 Erschwil),
  que se casou com Johann Jacob Wehrli e tornou-se a matriarca Wehrli da linha de Nova
  Friburgo. [PROVEN] (PAR-0028)

  - **Cautela com homônimos:** a página do registro de 1760 traz vários homens Borer (um
  "Joseph Borer *gmüpl*" atua como padrinho; outras entradas Joseph/Josephus Borer
  aparecem por perto). Nossa identificação apoia-se especificamente no assento que o
  nomeia como pai de Elisabetha — não nos padrinhos de mesmo nome. [PROVEN apenas para
  aquele assento]

  - Ele **não emigrou**; apenas a linha casada de sua filha chegou ao Brasil, uma geração
  depois, por meio dos Wehrli.

  ## O que podemos extrapolar

  - **[INFERRED]** Um casamento Borer×Borer somado a um conjunto de padrinhos Borer em uma
  só página indica uma população Borer pequena e endogâmica em Erschwil por volta de 1760
  — o plausível conjunto comum por trás tanto desta linha Borer de Erschwil quanto
  (possivelmente) dos Borer de Grindel de Laurent Borer, embora os dois não estejam
  documentados como uma só família.

  - **O piso do Velho Mundo do arco Borer/Bohrer começa aqui [CONTEXTUAL / INFERRED].** Um
  Borer católico de Erschwil no pobre Jura de Thierstein, faminto por terra, ele se situa
  no degrau mais baixo do arco socioeconômico da linha — uma comunidade de pequenos
  proprietários/camponeses sem fortuna a perder (o inverso estrutural da linha Armond da
  família). Foi a geração de seus descendentes, não a dele, que fez a emigração lateral
  para a colônia em 1819.

  ## Questões em aberto

  - Os próprios pais dele e de Anna Maria Borer (mais uma geração de Erschwil) e seu
  registro de casamento viriam dos registros de Erschwil (livro paroquial nº 68) e do
  *Inventar- und Teilungen* do distrito de Thierstein. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (registro de batismo de Erschwil, livro paroquial nº 68 — o batismo de 1760
  de sua filha Elisabetha, que o nomeia como pai).

  ## Contexto regional e migratório

  Um Borer de Erschwil, no Jura católico de Solothurn (Schwarzbubenland), terra agrícola
  pobre e com escassez de terra; ele permaneceu na ponta de origem do ramo, pertencendo a
  emigração para Nova Friburgo a uma geração posterior (1819). [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia natal (citado como pai no batismo de 1760 em Erschwil de sua filha Elisabetha; não emigrou):** Kath. Pfarrkirche St. Peter und Paul, Erschwil, Kt. Solothurn, Suíça (4228 Erschwil) [RESOLVED] · [Maps](https://maps.google.com/?q=47.3736,7.5431)
