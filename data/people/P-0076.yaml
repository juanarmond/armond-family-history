notes:
- text: >-
    Father of Elisabetha Borer (P-0073). Confirmed in the Erschwil (Erischwyg)
    Catholic parish baptism register (PAR-0028, church book #68): named as "Joseph
    Borer fusemnistr" — the suffix "fusemnistr" is an abbreviated title or local
    office not fully deciphered (possibly "Feuersmeister" or a similar communal
    role). He also appears as godfather at an Erschwil baptism ("Joseph Borer gmüpl")
    on the same page. The Borer surname was common in the Solothurn district
    (Erschwil/Grindel area).
  text_pt: >-
    Pai de Elisabetha Borer (P-0073). Confirmado no registro de batismo da
    paróquia católica de Erschwil (Erischwyg) (PAR-0028, livro da igreja nº 68):
    nomeado como "Joseph Borer fusemnistr" — o sufixo "fusemnistr" é um título
    abreviado ou cargo local não totalmente decifrado (possivelmente
    "Feuersmeister" ou uma função comunal semelhante). Ele também aparece como
    padrinho em um batismo em Erschwil ("Joseph Borer gmüpl") na mesma página. O
    sobrenome Borer era comum no distrito de Solothurn (região de
    Erschwil/Grindel).
- text: >-
    This Joseph Borer is distinct from Jacob Borer (BORER I, P-0050, b. 1801
    Erschwil) and Laurent Borer (BORER II, P-0068, b. 1797 Grindel), who were
    the Nova Friburgo immigrants. The connection between this Joseph Borer and the
    Nova Friburgo Borer immigrants has not been established by primary evidence.
  text_pt: >-
    Este Joseph Borer é distinto de Jacob Borer (BORER I, P-0050, n. 1801
    Erschwil) e de Laurent Borer (BORER II, P-0068, n. 1797 Grindel), que foram
    os imigrantes de Nova Friburgo. A conexão entre este Joseph Borer e os
    imigrantes Borer de Nova Friburgo não foi estabelecida por evidência primária.
