profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Manoel Nado Pestana" as the father of Isabel Ribeiro in the 1751 Borda do Campo marriage act (PAR-0034) — the single document that fixes his existence; without it, he would leave no trace in the archive.

  - **[CONTEXTUAL]** A tentative reading of his granddaughter Ritta's 1764 baptism (PAR-0049) places him as "natural da freguesia de Nossa Senhora do Rosário da Ilha de São Jorge" (Açores) — which, if confirmed by a clearer image, would make him one of the Azorean settlers in the colonial Minas Gerais interior, adding an Atlantic-island strand to the family's origins.

  - **[INFERRED]** The unusual element "Nado" in his full name ("Manoel Nado Pestana") may be a baptismal middle name drawn from a godparent or a copyist's insertion of "nato" (born); it does not appear as a surname in the Borda do Campo registers and may index a distinct Azorean naming pattern not found in the Portuguese mainland records of this archive.

  **Manoel Nado Pestana** — a stub ancestor named only as the father of Isabel Ribeiro
  (P-0079) in her 1751 Borda do Campo (Barbacena) marriage act (PAR-0034): "filha
  legitima de Manoel Nado Pestana e de Anna Francisca". [PROVEN name via PAR-0034] His
  wife was Anna Francisca (P-0095, family F-0046). Portuguese (Azorean) — his
  granddaughter Ritta's 1764 baptism (PAR-0049) reads him "natural da freguesia de
  N.S. do Rosário da Ilha de São Jorge" (Açores), but that grandparent clause is
