profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Manoel Nado Pestana" as the father of Isabel Ribeiro in the 1751 Borda do Campo marriage act (PAR-0034) — the single document that fixes his existence. Without it he would leave no trace in the archive at all.

  - **[CONTEXTUAL]** A tentative reading of his granddaughter Ritta's 1764 baptism (PAR-0049) places him as "natural da freguesia de Nossa Senhora do Rosário da Ilha de São Jorge" (Açores). If a clearer image confirms it, he would be an Azorean settler in the colonial Minas Gerais interior, adding an Atlantic-island strand to this family's origins. The clause is ink-damaged; the origin is held as a lead, not a fact, and nothing here rests on the surname.

  - **[INFERRED]** The unusual element "Nado" in his recorded name may be a baptismal middle name taken from a godparent, or a copyist's rendering of "nato"; it does not appear as a surname elsewhere in the Borda do Campo registers.

  - **[INFERRED]** Whatever he was, he was in Minas Gerais early. His daughter was born and baptised in the Borda do Campo parish and married there in 1751, so the household was established in the district by the 1720s or 1730s — a full generation before the crown's organised Azorean settlement schemes of 1748–1756, which went to the southern coast, not to Minas. Any island crossing of his was an individual gold-rush movement, not a state programme. [CONTEXTUAL for the schemes]

  ## Identity

  **Manoel Nado Pestana** — a stub ancestor, named only as the father of Isabel Ribeiro (P-0079) in her 1751 Borda do Campo (Barbacena) marriage act (PAR-0034): "filha legitima de Manoel Nado Pestana e de Anna Francisca". [PROVEN name via PAR-0034] Grandfather of Ritta Angélica Rodrigues (P-0058) and so 3rd-great-grandfather of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Wife:** Anna Francisca (P-0095), family F-0046.

  - **Origin:** Portuguese (Azorean) — his granddaughter Ritta's 1764 baptism (PAR-0049) reads him "natural da freguesia de N.S. do Rosário da Ilha de São Jorge" (Açores), but that grandparent clause is ink-damaged and tentative, so the origin and the nationality resting on it carry that read-uncertainty. [LEAD]

  - **Birth, marriage and death:** no record of his own is located. [OPEN] The parentage of Isabel rests on the informant-reported filiation in her marriage act, not on a birth or baptism, hence strong-evidence rather than primary.

  ## Standing and profession

  - **Nothing is recorded.** No rank, occupation, property or act of his own; the 1751 clerk gave him a name and no description at all. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record exists.

  - **He is not even placed geographically at the time of the marriage** — the act says where his daughter was born and baptised, not where he was living or whether he was alive. [OPEN]

  ## Family and social network

  - **Wife:** Anna Francisca (P-0095), likewise named only in the same clause.

  - **Daughter:** Isabel Ribeiro (P-0079), "natural e baptizada nesta freguesia" of the Borda do Campo, who married the Portuguese immigrant João Rodrigues Valle (P-0078) on 22 February 1751 (PAR-0034). Through her he is the grandfather of the Toledo line's Ritta Angélica Rodrigues.

  - **No other child, kinsman or associate is documented.** The Coronel and the other witnesses at his daughter's wedding cannot be tied to him personally, though the likeliest reading is that a local bride's family, not a newly-arrived groom, brought them. [INFERRED — see P-0079]

  ## What we can extrapolate

  - **His one traceable contribution was a daughter born in the parish, and in this family that was worth a great deal** [INFERRED]. The Borda do Campo of 1751 was a district of recent arrivals, where belonging was measured in a baptismal entry. By having a daughter born and baptised there, his household manufactured exactly the asset a Portuguese immigrant needed and could not buy — and it is what João Rodrigues Valle married for.

  - **If the São Jorge reading holds, "local" in this family was only one generation deep** [LEAD-contingent / INFERRED]. His daughter's Brazilian birth, which gave her husband his footing, would itself be the product of his own Atlantic crossing a generation earlier. Two migrations, twenty-odd years apart, with the second one buying its standing from the first.

  - **Nothing suggests property, office or means** [INFERRED]. No rank, no lugar, no trade, no inventário. In a gold-district parish the record would normally style a man of substance, and it does not style him. The honest reading is a household of modest standing whose only documented asset was residence.

  - **Education does not arise** [CONTEXTUAL]. Schooling in the colonial interior was a purchased, class-linked privilege bought by families who needed letters for office or commerce; nothing places this household in either. His literacy is unclassifiable because no record ever required him to write.

  ## Open questions

  - Any record of his own — a baptism, a marriage, a death, a residence, a rank. None is located. [OPEN]

  - Whether the Ilha de São Jorge origin is real. A clearer image of the 1764 grandparent clause in PAR-0049, or an Azorean or Borda do Campo record naming him, would settle it. Until then the Azorean origin and the Portuguese nationality resting on it stay a lead. [LEAD]

  - What "Nado" is. [uncertain]

  ## Sources held (this repository)

  - PAR-0034 (1751 Borda do Campo marriage of his daughter Isabel — names him as her father; the only record that attests him).

  - PAR-0049 (1764 Barbacena baptism of his granddaughter Ritta — the ink-damaged grandparent clause that proposes his Ilha de São Jorge origin). [LEAD]

  ## Regional and migration context

  Placed, by the only act that names him, in the orbit of the Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) in the Campo das Vertentes of Minas Gerais — a colonial district on the road between the mining heartland and the coast, populated by free colonists of recent arrival. [CONTEXTUAL] If the tentative 1764 read is right, his own origin was the Ilha de São Jorge in the Azores, which would make this branch's Portuguese root an Atlantic-island one, entirely distinct from the Braga-Minho crossing that his son-in-law made. Azorean movement to Brazil in this period ran partly as individual migration toward the goldfields and, from 1748, as crown-organised *casal* settlement of the southern coast; the timing of his daughter's Borda do Campo birth places him in the earlier, individual current rather than the scheme. [LEAD for the origin; CONTEXTUAL for the currents]

  ## Where to go today

  - **Where his daughter was born, baptised and married:** Catedral N.S. da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **His proposed origin parish (a lead, not confirmed):** Igreja de Nossa Senhora do Rosário, Ilha de São Jorge, Açores, Portugal [APPROX / LEAD] · [Maps](https://www.google.com/maps/search/?api=1&query=Ilha%20de%20S%C3%A3o%20Jorge%2C%20A%C3%A7ores%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeado "Manoel Nado Pestana" como pai de Isabel Ribeiro no ato de casamento da Borda do Campo, em 1751 (PAR-0034) — o único documento que fixa sua existência. Sem ele, não deixaria rastro algum no arquivo.

  - **[CONTEXTUAL]** Uma leitura tentativa do batismo de sua neta Ritta, em 1764 (PAR-0049), o situa como "natural da freguesia de Nossa Senhora do Rosário da Ilha de São Jorge" (Açores). Se uma imagem mais nítida confirmar, ele seria um colono açoriano no interior das Minas Gerais coloniais, acrescentando às origens desta família um fio atlântico insular. A cláusula está danificada por tinta; a origem é mantida como pista, não como fato, e nada aqui se apoia no sobrenome.

  - **[INFERRED]** O elemento incomum "Nado" em seu nome registrado pode ser um nome de meio, de batismo, tomado de um padrinho, ou a grafia de um copista para "nato"; não aparece como sobrenome em nenhum outro ponto dos registros da Borda do Campo.

  - **[INFERRED]** Fosse o que fosse, ele estava cedo em Minas Gerais. Sua filha nasceu e foi batizada na freguesia da Borda do Campo e ali se casou em 1751, de modo que a casa estava estabelecida no distrito nos anos 1720 ou 1730 — uma geração inteira antes dos esquemas régios de povoamento açoriano de 1748–1756, que se dirigiram ao litoral sul, não a Minas. Qualquer travessia insular sua foi movimento individual de corrida do ouro, não programa de Estado. [CONTEXTUAL quanto aos esquemas]

  ## Identidade

  **Manoel Nado Pestana** — ancestral de registro mínimo, nomeado apenas como pai de Isabel Ribeiro (P-0079) no ato de casamento dela na Borda do Campo (Barbacena), em 1751 (PAR-0034): "filha legitima de Manoel Nado Pestana e de Anna Francisca". [nome PROVEN via PAR-0034] Avô de Ritta Angélica Rodrigues (P-0058) e, portanto, tetravô de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Esposa:** Anna Francisca (P-0095), família F-0046.

  - **Origem:** português (açoriano) — o batismo de sua neta Ritta, em 1764 (PAR-0049), o lê "natural da freguesia de N.S. do Rosário da Ilha de São Jorge" (Açores), mas essa cláusula de avós está danificada por tinta e é tentativa, de modo que a origem e a nacionalidade que nela se apoiam carregam essa incerteza de leitura. [LEAD]

  - **Nascimento, casamento e óbito:** nenhum registro seu foi localizado. [OPEN] A filiação de Isabel apoia-se na declaração de informante no ato de casamento dela, e não num nascimento ou batismo, sendo portanto evidência forte, e não primária.

  ## Posição social e profissão

  - **Nada está registrado.** Nenhuma patente, ocupação, propriedade ou ato próprio; o escrivão de 1751 lhe deu um nome e nenhuma descrição. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** não existe registro assinável disponível.

  - **Ele não é sequer localizado geograficamente à época do casamento** — o ato diz onde a filha nasceu e foi batizada, não onde ele morava nem se estava vivo. [OPEN]

  ## Família e rede social

  - **Esposa:** Anna Francisca (P-0095), igualmente nomeada apenas na mesma cláusula.

  - **Filha:** Isabel Ribeiro (P-0079), "natural e baptizada nesta freguesia" da Borda do Campo, casada com o imigrante português João Rodrigues Valle (P-0078) em 22 de fevereiro de 1751 (PAR-0034). Por ela, ele é avô de Ritta Angélica Rodrigues, da linha Toledo.

  - **Nenhum outro filho, parente ou associado está documentado.** O Coronel e as demais testemunhas do casamento de sua filha não podem ser ligados a ele pessoalmente, ainda que a leitura mais provável seja que a família de uma noiva local, e não um noivo recém-chegado, os tenha trazido. [INFERRED — ver P-0079]

  ## O que podemos extrapolar

  - **Sua única contribuição rastreável foi uma filha nascida na freguesia, e nesta família isso valia muito** [INFERRED]. A Borda do Campo de 1751 era um distrito de chegados recentes, em que o pertencimento se media por um assento de batismo. Ao ter uma filha nascida e batizada ali, sua casa fabricou exatamente o ativo de que um imigrante português precisava e que não podia comprar — e foi por isso que João Rodrigues Valle se casou.

  - **Se a leitura de São Jorge se sustentar, "local" nesta família tinha só uma geração de profundidade** [dependente de LEAD / INFERRED]. O nascimento brasileiro de sua filha, que deu pé ao marido dela, seria ele próprio produto de sua própria travessia atlântica uma geração antes. Duas migrações, com uns vinte anos de intervalo, comprando a segunda a sua posição da primeira.

  - **Nada sugere propriedade, ofício ou meios** [INFERRED]. Nenhuma patente, nenhum lugar, nenhuma ocupação, nenhum inventário. Numa freguesia de distrito aurífero, o registro normalmente trataria por título um homem de posses, e a ele não trata. A leitura honesta é a de uma casa de posição modesta, cujo único ativo documentado era a residência.

  - **A educação não se coloca** [CONTEXTUAL]. A escolarização no interior colonial era privilégio comprado e ligado à classe, adquirido por famílias que precisavam de letras para ofício ou comércio; nada situa esta casa em qualquer dos dois. Sua alfabetização é inclassificável porque nenhum registro jamais exigiu que escrevesse.

  ## Questões em aberto

  - Qualquer registro próprio — batismo, casamento, óbito, residência, patente. Nenhum foi localizado. [OPEN]

  - Se a origem na Ilha de São Jorge é real. Uma imagem mais nítida da cláusula de avós de 1764 em PAR-0049, ou um registro açoriano ou da Borda do Campo que o nomeie, resolveria. Até lá, a origem açoriana e a nacionalidade portuguesa que nela se apoia permanecem pista. [LEAD]

  - O que é "Nado". [uncertain]

  ## Fontes disponíveis (neste repositório)

  - PAR-0034 (casamento de 1751 na Borda do Campo de sua filha Isabel — nomeia-o como pai dela; o único registro que o atesta).

  - PAR-0049 (batismo de 1764 em Barbacena de sua neta Ritta — a cláusula de avós, danificada por tinta, que propõe sua origem na Ilha de São Jorge). [LEAD]

  ## Contexto regional e migratório

  Situado, pelo único ato que o nomeia, na órbita da Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena), no Campo das Vertentes de Minas Gerais — distrito colonial na estrada entre o coração minerador e o litoral, povoado por colonos livres de chegada recente. [CONTEXTUAL] Se a leitura tentativa de 1764 estiver certa, sua própria origem era a Ilha de São Jorge, nos Açores, o que faria da raiz portuguesa deste ramo uma raiz atlântica insular, inteiramente distinta da travessia Braga-Minho feita por seu genro. O movimento açoriano para o Brasil nesse período correu em parte como migração individual rumo às lavras e, a partir de 1748, como povoamento régio de *casais* no litoral sul; a cronologia do nascimento de sua filha na Borda do Campo o situa na corrente individual anterior, e não no esquema. [LEAD quanto à origem; CONTEXTUAL quanto às correntes]

  ## Onde ir hoje

  - **Onde sua filha nasceu, foi batizada e se casou:** Catedral N.S. da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)

  - **Sua paróquia de origem proposta (pista, não confirmada):** Igreja de Nossa Senhora do Rosário, Ilha de São Jorge, Açores, Portugal [APPROX / LEAD] · [Maps](https://www.google.com/maps/search/?api=1&query=Ilha%20de%20S%C3%A3o%20Jorge%2C%20A%C3%A7ores%2C%20Portugal)
