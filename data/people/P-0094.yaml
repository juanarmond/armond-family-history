  - **[INFERRED]** O elemento incomum "Nado" em seu nome completo ("Manoel Nado Pestana") pode ser um nome do meio batismal retirado de um padrinho, uma interpolação do escrivão de "nato" (nascido), ou um padrão de nomeação açoriano distinto não encontrado nos registros do Portugal continental deste arquivo.

  **Manoel Nado Pestana** — um ancestral esboço, nomeado apenas como pai de Isabel
