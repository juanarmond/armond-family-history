notes:
  - text: >-
      Ahnentafel position 10. Recorded both as "Antonio Engracio Filho" (family
      roster REC-0001; his 1964 death CIV-0017) and "Antônio Engrácio de Souza"
      (his daughter Cidalia's 1952 marriage CIV-0002) — "Filho" distinguishes him
      from his father Antonio Engracio de Souza (P-0032), who shares the base name.
  - text: >-
      Born 15 June 1894 in Minas Gerais (CIV-0002, recorded while living; the age 69
      at his 1964 death, CIV-0017, implied c.1895). Died 21 June 1964 at Rio de
      Janeiro (residence Pavuna, then Guanabara; buried São João de Meriti), a
      negociante married to Maria Aurora Guimarães. His parents were Antonio Engracio
      de Souza (P-0032) and Luzia Pinheiro da Conceição (P-0033) — family F-0015 —
      both deceased by 1964; the record reports six surviving adult children.
