      Posição 10 no Ahnentafel. Registrado tanto como "Antonio Engracio Filho"
      (lista familiar REC-0001; óbito de 1964 CIV-0017) quanto como "Antônio
      Engrácio de Souza" (casamento de 1952 de sua filha Cidalia CIV-0002) —
      "Filho" o distingue de seu pai Antonio Engracio de Souza (P-0032), que tem
      o mesmo nome base.
  - text: >-
      Born 15 June 1894 in Minas Gerais (CIV-0002, recorded while living; the age 69
      at his 1964 death, CIV-0017, implied c.1895). Died 21 June 1964 at Rio de
      Janeiro (residence Pavuna, then Guanabara; buried São João de Meriti), a
      negociante married to Maria Aurora Guimarães. His parents were Antonio Engracio
      de Souza (P-0032) and Luzia Pinheiro da Conceição (P-0033) — family F-0015 —
      both deceased by 1964; the record reports six surviving adult children.

      Nascido em 15 de junho de 1894 em Minas Gerais (CIV-0002, registrado em vida;
      a idade de 69 anos ao óbito em 1964, CIV-0017, indica c.1895). Falecido em
      21 de junho de 1964 no Rio de Janeiro (residência em Pavuna, depois Guanabara;
      sepultado em São João de Meriti), negociante, casado com Maria Aurora Guimarães.
      Seus pais foram Antonio Engracio de Souza (P-0032) e Luzia Pinheiro da Conceição
      (P-0033) — família F-0015 — ambos falecidos antes de 1964; o registro indica seis
      filhos adultos sobreviventes.
