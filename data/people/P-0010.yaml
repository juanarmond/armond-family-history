profile: >-
  ## Identity

  Recorded as **Antonio Engracio Filho** (his 1964 civil death, CIV-0017; the owner's
  family roster, REC-0001) and as **Antônio Engrácio de Souza** (his daughter Cidalia's
  1930 birth registration, CIV-0022, and her 1952 marriage, CIV-0002). The suffix
  **"Filho"** distinguishes him from his father, Antonio Engracio de Souza (P-0032), who
  bore the identical base name — Cidalia's 1930 birth registration names that same
  "Antonio Engracio de Souza" as her paternal grandfather, confirming that our man is the
  son (CIV-0022). [PROVEN]

  - **Birth:** 15 June 1894, Minas Gerais [PROVEN] — recorded while he was living, on
  Cidalia's 1952 marriage certificate (CIV-0002). His 1964 death gives his age as 69,
  implying c.1895; treat 15 June 1894 as the primary figure and the roughly one-year gap
  as benign (CIV-0017).

  - **Marriage:** married Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0002, CIV-0022,
  CIV-0017, CIV-0018).

  - **Parents:** Antonio Engracio de Souza (P-0032) and Luzia Pinheiro da Conceição
  (P-0033), both already deceased by 1964 [PROVEN] (CIV-0017; CIV-0022 records the
  grandmother as "Luzia da Conceição").

  - **Children:** six surviving adult children at his 1964 death (CIV-0017), five at his
  widow's 1991 death (CIV-0018), so one predeceased her. Named among them: his daughter
  Cidalia (P-0005, CIV-0022) and his son Werner Engracio Guimarães, who at age 32 was the
  informant at his death (CIV-0017). [PROVEN]

  - **Death:** 21 June 1964 at Rio de Janeiro (registered the next day, 22 June, óbito
  nº 37.787), of prostate cancer; buried at the Cemitério de São João de Meriti. [PROVEN]
  (CIV-0017)

  ## Standing and profession

  - **Negociante** (merchant/shopkeeper) [PROVEN] — his 1964 death records the profession
  (CIV-0017); his documented residence was rua Honório Hermeto nº 138, Pavuna, then in the
  estado da Guanabara (Rio de Janeiro).

  - His death record states he "não deixou bens" (left no goods) [PROVEN] (CIV-0017) — a
  modest urban trader at death, not a landed estate.

  ## Family and social network

  He is the node in which the two branches of this line unify: his marriage to Maria
  Aurora Guimarães fused his own Engrácio-Souza branch (his parents Antonio Engracio de
  Souza and Luzia Pinheiro da Conceição) with her Carvalho-Guimarães branch. Their
  children carry the double surname *Engracio Guimarães*, recording the fusion. [PROVEN]
  (CIV-0017, CIV-0022, CIV-0018)

  The owner's family roster (REC-0001) anchored this ancestor in the tree; as family
  recollection it is a navigation lead, while the documented name forms and vital facts
  come from the civil records. [LEAD]

  ## What we can extrapolate

  Minas-born (1894), Minas-married, and raising Minas-born children (his daughter Cidalia
  was born at Alvorada, Carangola, in 1930, CIV-0022), the family was rooted in the
  Carangola area of the Zona da Mata Mineira through the early 20th century, then moved to
  Rio de Janeiro by the time of his 1964 death (CIV-0017). A merchant family relocating
  from interior Minas to the capital is a common early/mid-20th-century trajectory.
  [INFERRED]

  "Não deixou bens" alongside the *negociante* trade points to a small retail operation,
  or to assets dispersed before death, rather than a propertied estate. [INFERRED]

  His documented wealth was commercial, and therefore contingent — it did not survive him.
  [INFERRED / CONTEXTUAL] The pairing of *negociante* with "não deixou bens" (CIV-0017) is the
  signature of commercial rather than landed capital: a merchant's assets sit in stock, credit
  and the going concern and — unlike land — do not automatically pass down as heritable
  property, so they can simply dissolve when the man dies or the economy turns. On this reading
  he is the family's clearest case of a wealth-form that ends with the role, the same structural
  fragility that office income carries.

  Commerce also made him mobile toward the metropolis in a way a landed family never is.
  [INFERRED / CONTEXTUAL] Where land tethers a family to its ground, a merchant follows the
  market; as the Zona da Mata coffee economy declined, the commercial class was the most mobile
  toward Rio de Janeiro, and his arc — a Carangola-region store to the capital, where he died —
  reads as the market-seeking relocation of a small interior trader rather than the *êxodo
  rural* of a displaced farmer.

  What the branch transmitted was a trade, not an estate. [INFERRED / CONTEXTUAL] A *negociante*
  had to be functionally literate and numerate — a modest, class-linked competence acquired for
  the trade — and it appears to have passed on as such: the son who informed his 1964 death (at
  32) is himself recorded in commerce (a *comerciário*, per the family research reading of
  CIV-0017). The Engrácio-Souza reproduced through commercial skill and an urban foothold — a
  place in the trade — rather than through heritable property.

  ## Open questions

  - His birth/baptism record (c.1894, Minas Gerais) — would independently confirm the
  15 June 1894 date and his parents, and possibly pin a birthplace parish in the Carangola
  region. [OPEN]

  - His parents' own vital records — Antonio Engracio de Souza (P-0032) and Luzia Pinheiro
  da Conceição (P-0033) are off the current indexes; their marriage or deaths would extend
  the Engrácio-Souza line upward. [OPEN]

  - The full set of his six children — from Carangola/Alvorada civil birth registers, or
  from an inventário (though he "left no goods"). [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (his 1964 civil death — date, age 69, negociante, wife, parents, six adult
  children, burial at São João de Meriti; his son Werner Engracio Guimarães as informant)
  · CIV-0022 (Cidalia's 1930 birth registration — names him as father and confirms the
  "Filho" distinction).

  - CIV-0002 (Cidalia's 1952 marriage — his name form "Antônio Engrácio de Souza" and
  birth 15 June 1894) · CIV-0018 (his widow's 1991 death — "viúva de Antonio Engracio
  Filho", five surviving children).

  - REC-0001 (owner's family roster — anchored this ancestor; secondary, [LEAD]).

  ## Regional and migration context

  His life traces the classic Zona da Mata Mineira → Rio de Janeiro path: born and rooted
  in the Carangola region of Minas Gerais (his daughter was born at Alvorada, Carangola, in
  1930, CIV-0022), he had moved to Rio de Janeiro — Pavuna, then Guanabara — by his 1964
  death (CIV-0017). The move fits the early/mid-20th-century decline of the Zona da Mata
  coffee economy and the rural-to-urban exodus toward the capital, and as a *negociante* he
  belonged to the commercial class most mobile toward the metropolis. [CONTEXTUAL] No held
  record states his personal reason for moving. The Carangola coffee frontier the family rooted
  on was built by the post-1850 free-labour pivot (Lei Eusébio de Queirós 1850 → Lei Áurea
  1888); his own Carangola → Rio move belongs to the 20th-century coffee collapse and the
  rural-to-urban exodus toward the capital (he was buried at São João de Meriti, in the
  Vargas-era Baixada Fluminense). [CONTEXTUAL]

  ## Where to go today

  - **Residence (1964):** Pavuna, Rio de Janeiro, RJ (Rua Honório Hermeto 138, CEP
  21520-230) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua+Hon%C3%B3rio+Hermeto+138%2C+Pavuna%2C+Rio+de+Janeiro)

  - **Death registration (óbito nº 37.787):** 5º Registro Civil de Pessoas Naturais,
  Botafogo, Rio de Janeiro, RJ (Rua São João Batista 28, CEP 22270-030) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=5%C2%BA+Registro+Civil+de+Pessoas+Naturais%2C+Rua+S%C3%A3o+Jo%C3%A3o+Batista+28%2C+Botafogo%2C+Rio+de+Janeiro)

  - **Burial (1964):** Cemitério de São João de Meriti, São João de Meriti, RJ (probably the
  former Cemitério Municipal de Vila Rosali) [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Cemit%C3%A9rio+Municipal+de+Vila+Rosali%2C+S%C3%A3o+Jo%C3%A3o+de+Meriti%2C+RJ)

  - **Birth area (c.1894):** Igreja Matriz de Santa Luzia, Carangola, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Identidade

  Registrado como **Antonio Engracio Filho** (seu óbito civil de 1964, CIV-0017; a lista
  familiar do proprietário, REC-0001) e como **Antônio Engrácio de Souza** (o registro de
  nascimento de 1930 de sua filha Cidalia, CIV-0022, e o casamento dela de 1952, CIV-0002).
  O sufixo **"Filho"** o distingue de seu pai, Antonio Engracio de Souza (P-0032), que
  tinha o mesmo nome base — o registro de nascimento de 1930 de Cidalia nomeia esse mesmo
  "Antonio Engracio de Souza" como avô paterno dela, confirmando que nosso homem é o filho
  (CIV-0022). [PROVEN]

  - **Nascimento:** 15 de junho de 1894, Minas Gerais [PROVEN] — registrado em vida, na
  certidão de casamento de 1952 de Cidalia (CIV-0002). Seu óbito de 1964 informa a idade de
  69 anos, indicando c.1895; trate 15 de junho de 1894 como o dado primário e a diferença
  de cerca de um ano como benigna (CIV-0017).

  - **Casamento:** casou-se com Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0002,
  CIV-0022, CIV-0017, CIV-0018).

  - **Pais:** Antonio Engracio de Souza (P-0032) e Luzia Pinheiro da Conceição (P-0033),
  ambos já falecidos em 1964 [PROVEN] (CIV-0017; CIV-0022 registra a avó como "Luzia da
  Conceição").

  - **Filhos:** seis filhos adultos sobreviventes ao seu óbito em 1964 (CIV-0017), cinco ao
  óbito de sua viúva em 1991 (CIV-0018), de modo que um faleceu antes dela. Nomeados entre
  eles: sua filha Cidalia (P-0005, CIV-0022) e seu filho Werner Engracio Guimarães, que aos
  32 anos foi o declarante em seu óbito (CIV-0017). [PROVEN]

  - **Óbito:** 21 de junho de 1964 no Rio de Janeiro (registrado no dia seguinte, 22 de
  junho, óbito nº 37.787), por câncer de próstata; sepultado no Cemitério de São João de
  Meriti. [PROVEN] (CIV-0017)

  ## Posição social e profissão

  - **Negociante** (comerciante/lojista) [PROVEN] — seu óbito de 1964 registra a profissão
  (CIV-0017); sua residência documentada era a rua Honório Hermeto nº 138, Pavuna, então no
  estado da Guanabara (Rio de Janeiro).

  - Seu registro de óbito declara que "não deixou bens" [PROVEN] (CIV-0017) — um modesto
  comerciante urbano ao morrer, não um espólio de terras.

  ## Família e rede social

  Ele é o nó em que os dois ramos desta linha se unificam: seu casamento com Maria Aurora
  Guimarães fundiu seu próprio ramo Engrácio-Souza (seus pais Antonio Engracio de Souza e
  Luzia Pinheiro da Conceição) com o ramo Carvalho-Guimarães dela. Seus filhos carregam o
  sobrenome duplo *Engracio Guimarães*, que registra a fusão. [PROVEN] (CIV-0017, CIV-0022,
  CIV-0018)

  A lista familiar do proprietário (REC-0001) fixou este ancestral na árvore; como
  recordação familiar é uma pista de navegação, enquanto as formas de nome documentadas e
  os fatos vitais vêm dos registros civis. [LEAD]

  ## O que podemos extrapolar

  Nascido em Minas (1894), casado em Minas e criando filhos nascidos em Minas (sua filha
  Cidalia nasceu em Alvorada, Carangola, em 1930, CIV-0022), a família estava enraizada na
  região de Carangola, na Zona da Mata Mineira, ao longo do início do século XX, e depois
  mudou-se para o Rio de Janeiro por volta de seu óbito em 1964 (CIV-0017). Uma família de
  comerciantes que se muda do interior de Minas para a capital é uma trajetória comum do
  início/meados do século XX. [INFERRED]

  "Não deixou bens" ao lado do ofício de *negociante* aponta para um pequeno comércio
  varejista, ou para bens dispersos antes da morte, e não para um espólio de terras.
  [INFERRED]

  Sua riqueza documentada era comercial e, portanto, contingente — não sobreviveu a ele.
  [INFERRED / CONTEXTUAL] O par *negociante* + "não deixou bens" (CIV-0017) é a assinatura de
  capital comercial, e não fundiário: os bens de um comerciante estão em estoque, crédito e no
  negócio em funcionamento e — ao contrário da terra — não passam automaticamente como
  propriedade herdável, podendo simplesmente dissolver-se quando o homem morre ou a economia
  vira. Nessa leitura, ele é o caso mais claro da família de uma forma de riqueza que termina
  com o papel, a mesma fragilidade estrutural que a renda de ofício carrega.

  O comércio também o tornava móvel rumo à metrópole de um modo que uma família de terras nunca
  é. [INFERRED / CONTEXTUAL] Onde a terra prende uma família ao seu solo, o comerciante segue o
  mercado; à medida que a economia cafeeira da Zona da Mata declinava, a classe comercial era a
  mais móvel rumo ao Rio de Janeiro, e seu percurso — uma loja da região de Carangola até a
  capital, onde faleceu — lê-se como a realocação em busca de mercado de um pequeno comerciante
  do interior, e não o *êxodo rural* de um lavrador deslocado.

  O que o ramo transmitiu foi um ofício, não um espólio. [INFERRED / CONTEXTUAL] Um *negociante*
  precisava ser funcionalmente alfabetizado e numerado — uma competência modesta e ligada à
  classe, adquirida para o comércio — e ela parece ter passado adiante como tal: o filho que
  declarou seu óbito de 1964 (aos 32 anos) é ele próprio registrado no comércio (um
  *comerciário*, conforme a leitura da pesquisa da família sobre CIV-0017). Os Engrácio-Souza
  reproduziram-se por meio da habilidade comercial e de um pé firme urbano — um lugar no
  comércio — e não por propriedade herdável.

  ## Questões em aberto

  - Seu registro de nascimento/batismo (c.1894, Minas Gerais) — confirmaria de forma
  independente a data de 15 de junho de 1894 e seus pais, e possivelmente fixaria uma
  paróquia de nascimento na região de Carangola. [OPEN]

  - Os próprios registros vitais de seus pais — Antonio Engracio de Souza (P-0032) e Luzia
  Pinheiro da Conceição (P-0033) estão fora dos índices atuais; seu casamento ou seus
  óbitos estenderiam a linha Engrácio-Souza para cima. [OPEN]

  - O conjunto completo de seus seis filhos — a partir dos registros civis de nascimento de
  Carangola/Alvorada, ou de um inventário (embora ele "não tenha deixado bens"). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0017 (seu óbito civil de 1964 — data, idade 69, negociante, esposa, pais, seis
  filhos adultos, sepultamento em São João de Meriti; seu filho Werner Engracio Guimarães
  como declarante) · CIV-0022 (registro de nascimento de 1930 de Cidalia — nomeia-o como
  pai e confirma a distinção "Filho").

  - CIV-0002 (casamento de 1952 de Cidalia — sua forma de nome "Antônio Engrácio de Souza"
  e nascimento em 15 de junho de 1894) · CIV-0018 (óbito de sua viúva em 1991 — "viúva de
  Antonio Engracio Filho", cinco filhos sobreviventes).

  - REC-0001 (lista familiar do proprietário — fixou este ancestral; secundária, [LEAD]).

  ## Contexto regional e migratório

  Sua vida traça o percurso clássico Zona da Mata Mineira → Rio de Janeiro: nascido e
  enraizado na região de Carangola, em Minas Gerais (sua filha nasceu em Alvorada,
  Carangola, em 1930, CIV-0022), ele havia se mudado para o Rio de Janeiro — Pavuna, depois
  Guanabara — até seu óbito em 1964 (CIV-0017). A mudança encaixa-se no declínio da economia
  cafeeira da Zona da Mata no início/meados do século XX e no êxodo rural-urbano em direção
  à capital, e como *negociante* ele pertencia à classe comercial mais móvel rumo à
  metrópole. [CONTEXTUAL] Nenhum registro mantido declara seu motivo pessoal para a mudança. A
  fronteira cafeeira de Carangola na qual a família se enraizou foi construída pelo pivô do
  trabalho livre do pós-1850 (Lei Eusébio de Queirós 1850 → Lei Áurea 1888); sua própria mudança
  Carangola → Rio pertence ao colapso cafeeiro do século XX e ao êxodo rural-urbano rumo à
  capital (foi sepultado em São João de Meriti, na Baixada Fluminense da era Vargas).
  [CONTEXTUAL]

