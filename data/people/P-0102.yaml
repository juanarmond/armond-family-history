notes:
- text: >-
    Mother of Maria Thecla Regina Heggendorn (P-0071); named "Maria Freese" (with José Eggendorn)
    in the 1864 marriage (PAR-0062). She is the bride "Anna Maria Frees, filha legitima de Jacob
    Frees" in the 1829 Nova Friburgo marriage to José Eggendorn (PAR-0073, event E-0097); her
    parents Jacob Frees (P-0117) × Anna Maria (P-0118, deceased by 1829) are named there (family
    F-0059). She is also named as the mother in Maria Thecla's own 1845 baptism (PAR-0072). Swiss
    (Frees/Freese; her stated origin canton is [uncertain] in the register). Modelled per the
    stated-ancestor rule.
