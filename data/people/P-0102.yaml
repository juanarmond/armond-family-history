profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Married in Nova Friburgo in 1829 as "Anna Maria Frees, filha legitima de Jacob Frees," she belongs to the Frees/Freese family — part of the tight Solothurn colonist cluster (Borer, Wehrli, Freese, Heggendorn) who reconstituted their Swiss community in Brazil after the 1819 wave and intermarried across generations.

  - **[INFERRED]** Her mother was already deceased ("já falecida") by the time of her 1829 marriage — likely lost in the difficult early years of Nova Friburgo, where mortality among first-generation settlers was high due to disease, unfamiliar climate, and hardship.

  - **[CONTEXTUAL]** Her name shifted from "Anna Maria Frees" (1829) to "Maria Freese" (1845, 1864) across three decades of records — a gradual Portuguesification of the Swiss-German Frees spelling that mirrors the colony's broader cultural assimilation across generations.

  - **[PROVEN]** Documented in three separate records spanning 35 years, she is one of the most consistently attested mothers in the Nova Friburgo colonist cluster of this archive. (PAR-0073, PAR-0072, PAR-0062)

  ## Identity

  **Maria Freese** (also recorded Anna Maria Frees) — Swiss-colony settler of Nova Friburgo,
  documented by her own 1829 parish marriage and her daughter's 1845 baptism. [PROVEN]

  - **Marriage:** married José Eggendorn (P-0101) on 20 July 1829 at the Matriz de São João
  Baptista, Nova Friburgo, recorded as "Anna Maria Frees, filha legitima de Jacob Frees"
  (PAR-0073, event E-0097). [PROVEN]

  - **Parents:** legitimate daughter of Jacob Frees (P-0117) and the deceased Anna Maria
  (P-0118, maiden surname unrecorded); family F-0059. The register's stated parish and canton of
  her origin are uncertain reads. [STRONG-EVIDENCE; origin canton UNCERTAIN]

  ## Family

  She and José Eggendorn had at least one documented child: Maria Thecla Regina Eggendorn
  (P-0071), born 23 September 1844 and baptised 2 June 1845 at the Matriz de São João Baptista,
  with Pedro Freese and Regina Freese as godparents (PAR-0072, event E-0096). [PROVEN] A second
  daughter, Bibiana Heggendorn (b. 1833), is named in a published colonist compilation but no
  held primary record names her parents. [LEAD]

  The Freese/Frees surname recurs among the Nova Friburgo colonist cluster alongside Borer, Wehrli,
  and Heggendorn. A published compilation suggests Jacob Freese (possibly her father — unproven)
  also fathered Valentim and Christian Freese, both of whom married into the Borer line. The
  possibility is plausible within the endogamous colony context but must not be merged without a
  primary source. [LEAD]

  ## Open questions

  - Her birth, death, and precise origin (the 1829 register's stated parish and canton for her
  are uncertain reads, and no second primary locates her). [OPEN]

  ## Sources held (this repository)

  - PAR-0073 (her 1829 Nova Friburgo marriage — names her as "Anna Maria Frees", her father
  Jacob Frees, and her deceased mother Anna Maria).

  - PAR-0072 (daughter Maria Thecla's 1845 baptism — names her as Maria Freese, mother).

  - PAR-0062 (daughter Maria Thecla's 1864 marriage — names her as Maria Freese, mother).
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Casada em Nova Friburgo em 1829 como "Anna Maria Frees, filha legitima de Jacob Frees," ela pertence à família Frees/Freese — parte do grupo coeso de colonos de Solothurn (Borer, Wehrli, Freese, Heggendorn) que reconstituiu sua comunidade suíça no Brasil após a leva de 1819 e se intercruzou por gerações.

  - **[INFERRED]** Sua mãe já havia falecido ("já falecida") quando de seu casamento em 1829 — provavelmente perdida nos difíceis primeiros anos de Nova Friburgo, onde a mortalidade entre os colonos de primeira geração era alta devido a doenças, clima desconhecido e privações.

  - **[CONTEXTUAL]** Seu nome passou de "Anna Maria Frees" (1829) para "Maria Freese" (1845, 1864) ao longo de três décadas de registros — uma lusitanização gradual da grafia suíço-alemã Frees que espelha a assimilação cultural mais ampla da colônia ao longo das gerações.

  - **[PROVEN]** Documentada em três registros separados ao longo de 35 anos, ela é uma das mães mais consistentemente atestadas no grupo colonial de Nova Friburgo deste arquivo. (PAR-0073, PAR-0072, PAR-0062)

  ## Identidade

  **Maria Freese** (também registrada como Anna Maria Frees) — colona da colônia suíça de Nova
  Friburgo, documentada pelo seu próprio casamento paroquial de 1829 e pelo batismo da sua filha
  em 1845. [PROVEN]

  - **Casamento:** casou-se com José Eggendorn (P-0101) em 20 de julho de 1829, na Matriz de
  São João Baptista, Nova Friburgo, registrada como "Anna Maria Frees, filha legitima de Jacob
  Frees" (PAR-0073, evento E-0097). [PROVEN]

  - **Pais:** filha legítima de Jacob Frees (P-0117) e da falecida Anna Maria (P-0118, apelido
  de solteira não registrado); família F-0059. A freguesia e o cantão de origem declarados no
  registo apresentam leitura incerta. [STRONG-EVIDENCE; cantão de origem INCERTO]

  ## Família

  Ela e José Eggendorn tiveram pelo menos uma filha documentada: Maria Thecla Regina Eggendorn
  (P-0071), nascida em 23 de setembro de 1844 e baptizada em 2 de junho de 1845, na Matriz de
  São João Baptista, com Pedro Freese e Regina Freese como padrinhos (PAR-0072, evento E-0096).
  [PROVEN] Uma segunda filha, Bibiana Heggendorn (n. 1833), é mencionada em uma compilação
  publicada de colonos, mas nenhuma fonte primária retida nomeia seus pais. [LEAD]

  O apelido Freese/Frees surge repetidamente no grupo colonial de Nova Friburgo, ao lado de Borer,
  Wehrli e Heggendorn. Uma compilação publicada sugere que Jacob Freese (possivelmente o pai dela
  — não comprovado) também foi pai de Valentim e Christian Freese, ambos casados na linhagem Borer.
  A possibilidade é plausível no contexto endogâmico colonial, mas não deve ser fundida sem fonte
  primária. [LEAD]

  ## Questões em aberto

  - Seu nascimento, óbito e origem precisa (a freguesia e o cantão declarados no registo de
  1829 apresentam leitura incerta, e nenhuma segunda fonte primária a localiza). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0073 (seu casamento de 1829 em Nova Friburgo — nomeia-a como "Anna Maria Frees", seu
  pai Jacob Frees e sua mãe falecida Anna Maria).

  - PAR-0072 (batismo de 1845 da filha Maria Thecla — nomeia-a como Maria Freese, mãe).

  - PAR-0062 (casamento de 1864 da filha Maria Thecla — nomeia-a como Maria Freese, mãe).
