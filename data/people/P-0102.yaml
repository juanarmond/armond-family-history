profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named in three held records across thirty-five years — her own 1829
  marriage, her daughter's 1845 baptism and that daughter's 1864 marriage — and in each one the
  clerk writes her name differently: "Anna Maria Frees" in 1829, "Maria Freese" in 1845 and
  1864. (PAR-0073, PAR-0072, PAR-0062)

  - **[PROVEN]** Her mother was already dead when she married in July 1829 — the act calls her
  "filha legitima de Jacob Frees e de sua mulher Anna Maria, já falecida" — while her father is
  named without that qualifier. She married without a living mother. (PAR-0073)

  - **[PROVEN / uncertain]** The 1829 act does state where she came from — "natural e baptizada
  na Freguezia de [Senen? — uncertain], Cantão de [Pottein? — uncertain]" — but both readings
  failed. So a Swiss canton of origin is recorded for her and remains unreadable: her Swiss
  origin is record-stated, her precise origin is not recoverable from this document.

  - **[PROVEN]** When her daughter Maria Thecla Regina was baptised in 1845, both godparents
  were Freeses — Pedro Freese and Regina Freese. Her own family stood on both sides of the font,
  which is the clearest surviving trace of a Frees kin group present at Nova Friburgo.
  (PAR-0072)

  ## Identity

  **Maria Freese**, recorded at her marriage as **Anna Maria Frees** — a Swiss-born woman
  resident at Nova Friburgo from at least 1829. Iris Bohrer Muniz's (P-0007)
  great-great-grandmother, by the chain Maria Thecla Regina Eggendorn (P-0071) → Valentim
  Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the
  family links]

  - **Marriage:** to José Eggendorn (P-0101) on 20 July 1829 at the Matriz de São João Baptista,
  Nova Friburgo, both spouses recorded as "de presente moradores d'esta Freguezia"; witnesses
  José Maria Dubra and Anna Maria Geggendorn, before the Vigário Jacob Joye. (PAR-0073, event
  E-0097) [PROVEN]

  - **Parents:** legitimate daughter of Jacob Frees (P-0117) and the late Anna Maria (P-0118),
  whose maiden surname the record does not give; family F-0059. [PROVEN — PAR-0073]

  - **Origin:** a Swiss canton, named in the 1829 act but illegible; the parish reading failed
  too. [PROVEN that a Swiss canton was recorded; the canton and parish are OPEN]

  - **Birth and death:** undocumented in anything held here. [OPEN]

  ## Standing and profession

  Nothing is recorded. She has no occupation, property, literacy or signature in any held
  source; the three records name her as a bride, then twice as a mother. That is the whole of
  her documented public life, and it is typical of what parish registers preserved about
  colonist women.

  ## Family and social network

  She and José Eggendorn (family F-0050) married in 1829 and are documented together as parents
  in 1845 and again in 1864. [PROVEN] Their daughter Maria Thecla Regina (P-0071) was born 23
  September 1844, baptised 2 June 1845, and married Vicente Borer in 1864 — carrying the
  Eggendorn and Frees names into the Bohrer line. [PROVEN — PAR-0072, PAR-0062]

  The Frees/Freese surname recurs around her: Pedro and Regina Freese as her daughter's
  godparents in 1845, and — in a published colonist compilation only — a Jacob Freese said to
  have fathered Valentim and Christian Freese, both of whom married into the Borer line. Whether
  that Jacob is her father is plausible in a colony this small and entirely unproven. [PROVEN
  for the godparents; LEAD for the wider Freese kin]

  ## What we can extrapolate

  - **[CONTEXTUAL]** She belongs to the 1819–20 Swiss cohort settled at Nova Friburgo under Dom
  João VI's decree of 16 May 1818, whose people were driven out of Switzerland by the 1816–17
  harvest failures after the Tambora eruption, post-Napoleonic impoverishment and land hunger,
  and drawn to Brazil by the promise of a passage and a grant in a serra chosen to resemble
  home.

  - **[INFERRED]** Her mother's death before 1829 is consistent with what that migration cost —
  roughly a quarter of the emigrants died en route of typhus and scurvy, and mortality stayed
  high in the colony's first years — but the record fixes only that she was dead by July 1829.
  Where and when is not known, and should not be asserted.

  - **[CONTEXTUAL / INFERRED]** Marrying inside the transplanted colony pool, as she did, is the
  pattern that defines this whole cluster: Frees, Eggendorn, Borer and Wehrli recombining among
  themselves on small serra lots that Brazilian partible succession divided again each
  generation. It is a flat economic position, maintained by marrying at level.

  ## Open questions

  - Her parish and canton of origin — recorded in 1829 but illegible; no second record locates
  her. [OPEN]

  - Her birth and death. [OPEN]

  - Her mother's maiden surname, which the 1829 act omits entirely (P-0118 is entered by given
  names alone). [OPEN]

  - Whether her father Jacob Frees is the Jacob Freese of the Lorenz/Bon colonist compilation,
  said to have fathered Valentim and Christian Freese. [LEAD]

  ## Sources held (this repository)

  - **PAR-0073** — her own 1829 Nova Friburgo marriage to José Eggendorn; names her "Anna Maria
  Frees", her father Jacob Frees, her late mother Anna Maria, and her (illegible) Swiss parish
  and canton.

  - **PAR-0072** — her daughter Maria Thecla Regina's 1845 baptism; names her as the mother,
  "Maria Freese", with Pedro and Regina Freese as godparents.

  - **PAR-0062** — that daughter's 1864 marriage to Vicente Borer; names her as the mother.

  ## Regional and migration context

  The colony she married into was built to a decree. Dom João VI contracted the Fribourg agent
  Gachet on 16 May 1818 to settle 100 Swiss Catholic families on the Fazenda do Morro Queimado
  in the cool Serra fluminense; recruitment overshot to some 261–265 families from Fribourg,
  Solothurn, Valais and Bern, who left Estavayer-le-Lac on 4 July 1819 and sailed from the North
  Sea ports. [CONTEXTUAL] The colony became Vila de Nova Friburgo on 3 January 1820. The land it
  offered was stony highland, the plots small and the support thin, and many colonists abandoned
  their lots within a few years. [CONTEXTUAL] What the held records establish about her
  personally is narrower and firmer: she was resident in the parish of São João Baptista by July
  1829, and her household was still there in 1845 and 1864. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Her 1829
  marriage and her daughter's 1845 baptism and 1864 marriage were celebrated in this parish; the
  present cathedral dates from 1869, the earlier church stood on the same site. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colony's lots lay. [APPROX]

  - **Switzerland — origin unlocated.** The 1829 act records a Swiss parish and canton for her,
  but both readings failed, so no origin place can honestly be named. A high-resolution re-read
  of the register image is the cheapest way to change that. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é nomeada em três documentos retidos ao longo de trinta e cinco anos — seu
  próprio casamento de 1829, o batismo da filha em 1845 e o casamento dessa filha em 1864 — e em
  cada um o escrivão grafa seu nome de modo diferente: "Anna Maria Frees" em 1829, "Maria
  Freese" em 1845 e 1864. (PAR-0073, PAR-0072, PAR-0062)

  - **[PROVEN]** Sua mãe já havia falecido quando ela se casou, em julho de 1829 — o assento a
  dá como "filha legitima de Jacob Frees e de sua mulher Anna Maria, já falecida" —, enquanto o
  pai é nomeado sem esse qualificador. Casou-se sem mãe viva. (PAR-0073)

  - **[PROVEN / incerto]** O assento de 1829 declara de onde ela veio — "natural e baptizada na
  Freguezia de [Senen? — incerto], Cantão de [Pottein? — incerto]" —, mas ambas as leituras
  falharam. Ou seja: um cantão suíço de origem foi registrado para ela e continua ilegível — sua
  origem suíça é declarada pelo documento, sua origem precisa não é recuperável a partir dele.

  - **[PROVEN]** No batismo de sua filha Maria Thecla Regina, em 1845, os dois padrinhos eram
  Freese — Pedro Freese e Regina Freese. A própria família dela esteve dos dois lados da pia, o
  que é o traço mais claro que restou de um grupo de parentes Frees presente em Nova Friburgo.
  (PAR-0072)

  ## Identidade

  **Maria Freese**, registrada em seu casamento como **Anna Maria Frees** — mulher nascida na
  Suíça e moradora de Nova Friburgo desde pelo menos 1829. Trisavó de Iris Bohrer Muniz
  (P-0007), pela cadeia Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer
  (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Casamento:** com José Eggendorn (P-0101) em 20 de julho de 1829, na Matriz de São João
  Baptista, Nova Friburgo, constando ambos os nubentes como "de presente moradores d'esta
  Freguezia"; testemunhas José Maria Dubra e Anna Maria Geggendorn, perante o Vigário Jacob
  Joye. (PAR-0073, evento E-0097) [PROVEN]

  - **Pais:** filha legítima de Jacob Frees (P-0117) e da falecida Anna Maria (P-0118), cujo
  sobrenome de solteira o registro não informa; família F-0059. [PROVEN — PAR-0073]

  - **Origem:** um cantão suíço, nomeado no assento de 1829 mas ilegível; a leitura da freguesia
  também falhou. [PROVEN que um cantão suíço foi registrado; cantão e freguesia OPEN]

  - **Nascimento e óbito:** não documentados em nada que se tenha aqui. [OPEN]

  ## Posição social e profissão

  Nada está registrado. Ela não tem ocupação, propriedade, alfabetização ou assinatura em
  nenhuma fonte retida; os três documentos a nomeiam como noiva e, depois, duas vezes como mãe.
  É toda a sua vida pública documentada, e é típico do que os registros paroquiais preservavam
  sobre mulheres colonas.

  ## Família e rede social

  Ela e José Eggendorn (família F-0050) casaram-se em 1829 e estão documentados juntos como pais
  em 1845 e novamente em 1864. [PROVEN] A filha Maria Thecla Regina (P-0071) nasceu em 23 de
  setembro de 1844, foi batizada em 2 de junho de 1845 e casou-se com Vicente Borer em 1864 —
  levando os nomes Eggendorn e Frees para a linha Bohrer. [PROVEN — PAR-0072, PAR-0062]

  O sobrenome Frees/Freese recorre à sua volta: Pedro e Regina Freese como padrinhos da filha em
  1845 e — apenas numa compilação publicada de colonos — um Jacob Freese tido como pai de
  Valentim e Christian Freese, ambos casados na linha Borer. Se esse Jacob é o pai dela, é
  plausível numa colônia tão pequena e inteiramente não comprovado. [PROVEN quanto aos
  padrinhos; LEAD quanto à parentela Freese mais ampla]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Ela pertence à coorte suíça de 1819–20 assentada em Nova Friburgo sob o
  decreto de Dom João VI de 16 de maio de 1818, gente empurrada para fora da Suíça pelas quebras
  de safra de 1816–17 após a erupção do Tambora, pelo empobrecimento pós-napoleônico e pela fome
  de terra, e atraída ao Brasil pela promessa de passagem e concessão numa serra escolhida por
  lembrar a terra natal.

  - **[INFERRED]** A morte da mãe antes de 1829 é compatível com o custo dessa migração — cerca
  de um quarto dos emigrantes morreu no percurso, de tifo e escorbuto, e a mortalidade seguiu
  alta nos primeiros anos da colônia —, mas o registro fixa apenas que ela estava morta em julho
  de 1829. Onde e quando não se sabe, e não se deve afirmar.

  - **[CONTEXTUAL / INFERRED]** Casar dentro do conjunto colonial transplantado, como ela fez, é
  o padrão que define todo este grupo: Frees, Eggendorn, Borer e Wehrli recombinando-se entre si
  em pequenos lotes serranos que a sucessão partilhável brasileira voltava a dividir a cada
  geração. É uma posição econômica plana, mantida por casamentos no mesmo nível.

  ## Questões em aberto

  - Sua freguesia e cantão de origem — registrados em 1829, mas ilegíveis; nenhum segundo
  documento a localiza. [OPEN]

  - Seu nascimento e seu óbito. [OPEN]

  - O sobrenome de solteira de sua mãe, que o assento de 1829 omite por completo (P-0118 está
  registrada apenas por prenomes). [OPEN]

  - Se seu pai Jacob Frees é o Jacob Freese da compilação de colonos Lorenz/Bon, tido como pai
  de Valentim e Christian Freese. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — seu próprio casamento de 1829, em Nova Friburgo, com José Eggendorn; nomeia-a
  "Anna Maria Frees", seu pai Jacob Frees, sua mãe falecida Anna Maria, e sua freguesia e cantão
  suíços (ilegíveis).

  - **PAR-0072** — batismo de 1845 da filha Maria Thecla Regina; nomeia-a como mãe, "Maria
  Freese", com Pedro e Regina Freese como padrinhos.

  - **PAR-0062** — casamento dessa filha, em 1864, com Vicente Borer; nomeia-a como mãe.

  ## Contexto regional e migratório

  A colônia em que ela se casou foi erguida por decreto. Dom João VI contratou o agente
  friburguês Gachet em 16 de maio de 1818 para assentar 100 famílias católicas suíças na Fazenda
  do Morro Queimado, na fria serra fluminense; o recrutamento excedeu-se para cerca de 261–265
  famílias, de Friburgo, Solothurn, Valais e Berna, que partiram de Estavayer-le-Lac em 4 de
  julho de 1819 e embarcaram nos portos do Mar do Norte. [CONTEXTUAL] A colônia tornou-se Vila
  de Nova Friburgo em 3 de janeiro de 1820. A terra oferecida era serrana e pedregosa, os lotes
  pequenos e o apoio escasso, e muitos colonos abandonaram seus lotes em poucos anos.
  [CONTEXTUAL] O que os documentos retidos estabelecem sobre ela pessoalmente é mais estreito e
  mais firme: era moradora da freguesia de São João Baptista em julho de 1829, e seu domicílio
  ali continuava em 1845 e 1864. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Seu
  casamento de 1829 e o batismo (1845) e casamento (1864) da filha foram celebrados nesta
  paróquia; a catedral atual é de 1869, e a igreja anterior ficava no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde ficavam os lotes da colônia. [APPROX]

  - **Suíça — origem não localizada.** O assento de 1829 registra uma freguesia e um cantão
  suíços para ela, mas ambas as leituras falharam, de modo que nenhum lugar de origem pode ser
  honestamente nomeado. Uma releitura em alta resolução da imagem do registro é o caminho mais
  barato para mudar isso. [UNLOCATED]
