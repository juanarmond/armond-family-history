profile: >-
  ## Interesting facts

  - **[PROVEN]** Since 24 September 2026 he has his own original record. The São Sebastião death register reads "faleceo m.el de Ponte Cardozo aos dezanove dias de Agosto de mil e seiscentos [e] cinquoenta e dous annos con todos os sacramentos da Igr[ej]a, está sepultado nesta Igr[ej]a … sepultura sua junto ao arco da cape[la mor]" (PAR-0097, book O-1642-1696, CDN image 0016). Before that image he was documented by a single clause in his son's 1615 baptism, "Belchior fo[i filho] a **Manoell de Ponte** e de sua molher Maria da Cota" (PAR-0087, book B-1611-1687 p.0037) — which still carries his wife and his paternity.

  - **[PROVEN]** His surname is **Cardoso**, not Valadão. The registers write him "Manoell de Ponte" (1615), "m.el de Ponte Cardozo" (his own 1652 óbito) and "M.el de Ponte Cardoso" (his wife's 1654 óbito) — the same surname his son Belchior carries. **[COMPILED]** "Manuel da Ponte Valadão" is Mendes Forjaz's headline form, derived from his mother Catarina Valadão, and the compilation itself adds "Ou Manuel da Ponte Cardoso". This repository carried the Valadão form until the 1652 image was read on 24 September 2026; it is now kept only as a compiled-genealogy variant.

  - **[PROVEN]** He died at São Sebastião on 19 August 1652 and his wife on 27 December 1654; both acts are now held from the same book, TER-AH-SAOSEBASTIAO-O-1642-1696 (PAR-0097, PAR-0098). The register adds what the compilation could not: he received all the sacraments, and he was buried *inside* the church, in a grave of his own beside the arch of the chancel — the same position his wife was given two years later.

  - **[PROVEN]** The priest who buried him was his own son. A three-line note in the margin of the 1652 act reads "M.el de Pon / te Cardozo / **meu pai**", and two years later the same hand opens his wife's act "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). Two independent first-person attestations in one register. **[COMPILED + PROVEN]** That son is **António Coelho Souto-Maior** (b.13 February 1619, d.17 July 1686), the only priest among the couple's children in Vol. IX and *padre vigário* of the Matriz de São Sebastião — an identification made from the neighbouring signatures in the same book and from the compilation, since the two family acts are signed only "o Vig.º So[u]tomaior" without a forename. **[NOTE]** The retrieval agent's 2026-09-24 handoff called him "Manoel Coelho Souto Maior"; the images do not support that name.

  - **[COMPILED]** His household therefore placed one son at the head of the parish and another in the militia officer corps: Belchior became *Alferes de ordenanças*.

  - **[COMPILED]** His father, **Gaspar de Souto Cardoso**, died at Praia on 15 February 1618 "em idade avançada" and was buried in the Matriz there. **[INFERRED]** The family's centre therefore shifted from Praia to São Sebastião between his father's generation and his own — Manuel's children are all baptised at São Sebastião from 1612.

  ## Identity

  **Manuel da Ponte Cardoso** — written "m.el de Ponte Cardozo" in his own death act **[PROVEN, PAR-0097]**, "M.el de Ponte Cardoso" in his wife's **[PROVEN, PAR-0098]**, and plain "Manoell de Ponte" in his son's baptism **[PROVEN, PAR-0087]**. The form *Manuel da Ponte Valadão* is the compiled genealogy's **[COMPILED, PUB-0005 p.259]**, not the register's, and is retained here only as a variant. Died São Sebastião, Terceira, 19 August 1652, with the sacraments, and buried in the church beside the chancel arch **[PROVEN]**. Married **Maria da Costa Leonardes** (P-0126), family F-0063; father of **Belchior da Ponte Cardoso** (P-0123) and of the parish vicar **António Coelho Souto-Maior**.

  - **Birth date and place:** unknown. **[INFERRED]** His children's baptisms run from 1612, so he married by about 1611 and was probably born in the 1580s. His baptism, on that reckoning, predates the earliest surviving São Sebastião baptism book (B-1611-1687) and may not exist in any digitised series.
  - **Parents:** **Gaspar de Souto Cardoso** × **Catarina Valadão** **[COMPILED, PUB-0005 p.258]** — not modelled as entities here, and not independently evidenced.
  - **Nationality:** Portuguese (Azores, Crown territory)
  - **Rank or occupation:** none recorded anywhere in the held sources — his own death act gives him no title, rank or trade. **[OPEN]**
  - **Burial:** inside the Igreja Matriz de São Sebastião, "sepultura sua junto ao arco da cape[la mor]" — a grave the family held, beside the chancel arch **[PROVEN, PAR-0097]**.

  **Position in the tree.** Along the modelled chain P-0125 → P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Manuel stands eight generations above Geraldo Paz Armond (P-0004) — his 6th-great-grandfather — and ten generations above the family's present living generation. The degree is provisional in one respect: the P-0123 → P-0092 step is **[COMPILED]** only and rests on the unresolved "two Gaspars" question, so if P-0092 is the following generation each degree moves back one.

  ## Standing and profession

  **Nothing states what he did.** No rank, no office, no trade, no property, no will and no inventory is recorded for him in any source we hold, and his own death act — which would have been the natural place for a title — gives none. That is a real gap, not an oversight in this profile. His son's *Alferes* rank is documented; his own is not.

  **What the burial does say [PROVEN + CONTEXTUAL].** He was buried inside the parish church, in a grave described as his own, beside the arch of the chancel. Interment inside the building, in a named family grave, at the east end nearest the altar, was the most sought-after position a parish had to give, and it was not available to everyone **[CONTEXTUAL]**. His wife was buried in the same place two years later. This is the first hard, document-stated indicator of the household's standing — stronger than anything that can be read off his sons' careers, though it still says nothing about his occupation or his property.

  What can be reasoned from the household, carefully:

  - **[INFERRED + CONTEXTUAL]** Placing a son as *padre vigário* of the parish matriz was not free. A candidate for ordination needed Latin schooling and a *título de património* — a settled income assigned to him so that he would not be a burden on the Church. That is a real capital requirement, and it implies a household with land or rents behind it, even though no deed survives to name them.
  - **[INFERRED]** A second son with a militia ensign's commission points the same way: *ordenanças* officers were drawn from the parish's principal householders **[CONTEXTUAL]**.
  - **[INFERRED]** Taken together, one priest and one officer is the classic placement strategy of a middling landholding family — but it remains an inference from the children's careers, not a documented statement about the father.

  **Do not read the surnames as rank.** "Valadão", "Souto Cardoso" and "da Ponte" all look armigerous; nothing in the held record grants this family arms, a *foro*, a *morgadio* or the style of *Dom*.

  ## Family and social network

  - **Wife:** Maria da Costa Leonardes (P-0126) — named alongside him in Belchior's 1615 baptism as "sua molher Maria da Cota" **[PROVEN, PAR-0087]** and again in her own 1654 death act as "molher de M.el de Ponte Cardoso" **[PROVEN, PAR-0098]**. No marriage record, date or parish is known **[OPEN]**.
  - **Children [COMPILED, PUB-0005 p.259]:** Baltazar (b. São Sebastião 6 November 1612); **Belchior da Ponte Cardoso** (b.10 January 1615 per the compilation; the primary act reads ~9 January) **[PROVEN via PAR-0087]**; Francisco Cardoso da Ponte, also called Cardoso Souto-Maior (b.12 March 1617, d.28 December 1679, unmarried); and **António Coelho Souto-Maior** (b.13 February 1619, d.17 July 1686), *padre vigário* of the Matriz de São Sebastião — whose sonship is now **[PROVEN]** by the first-person "meu pai" note on this man's own death act and the first-person opening of his wife's (PAR-0097, PAR-0098). Do not confuse that son with his namesake grandson, the António Coelho Souto-Maior baptised 12 March 1654 to Belchior × Mariana Fagundes (PAR-0092).
  - **Brothers [COMPILED, PUB-0005 p.258]:** Roque da Ponte Cardoso (b. Praia 13 February 1575, married Beatriz Álvares Cardoso, lived at Pico de Gil de Borba) and Belchior da Ponte Maciel. **[NOTE]** An earlier working description of this line as a "Roque → Manuel → Belchior chain" is wrong and is already corrected in the source record: Roque was Manuel's *brother*, not his father.
  - **Grandchildren:** through Belchior, at least nine, seven of whose baptisms are held as images (1651–1666).
  - **The name he passed on.** Three of his four recorded sons carry a different surname combination, and two of them carry "Souto-Maior" — the house name that his grandson Gaspar de Souto Maior (b.23 December 1657, P-0092) would bear, and that the compiler eventually used as the chapter heading for the whole family. **[STRONG LEAD — not proven]** With the vicar now established as Gaspar's uncle, the obvious reading is that Gaspar took the surname from him. It is not documented: Gaspar's own baptism image is at the CDN's published maximum of 383×527 px and its filiation and signature lines are illegible, so the transmission cannot yet be shown from the act itself.

  ## What we can extrapolate

  **A family reorganising itself around São Sebastião [INFERRED].** His father died at Praia in 1618 and was buried in the Matriz there; his own children were all baptised at São Sebastião from 1612 onward; he and his wife both died at São Sebastião in the 1650s. Something moved this branch from the Praia district to São Sebastião in his lifetime — a marriage, an inheritance, or simply the land available. No record we hold says which.

  **Two sons, two institutions, one strategy [INFERRED + CONTEXTUAL].** The Church and the *ordenanças* were the two ladders available to the sons of a middling island household that could not divide its land indefinitely. Manuel's family used both. Neither produced transferable wealth: a priest has no heirs, and an unpaid militia commission dies with the man holding it. So what this generation actually transmitted downward was *standing*, and standing has to be re-earned. That is the mechanism that makes the family's later Brazilian restart legible — they arrive on the Minas frontier with the bearing of an established household and no island capital behind them.

  **The documentary floor has moved down one step [INFERRED].** Until September 2026 his own generation was covered by a single line in a baptism act plus Mendes Forjaz. His death act now puts him, like his son, in the original registers; his parents' generation remains compiled only. São Sebastião's surviving baptism book begins in 1611 and its death book in 1642 — which is very likely *why* the primary record for this family starts and stops where it does.

  ## Open questions

  - **[RESOLVED 2026-09-24] His burial act has been read.** TER-AH-SAOSEBASTIAO-O-1642-1696, CDN image 0016, is now catalogued as PAR-0097; his wife's follows two images later as PAR-0098. One word at the start of the burial clause is illegible at the CDN maximum of 1239×944 px, and the signature carries no forename — a higher-resolution BPAR Angra scan would settle both.
  - **His birth and baptism are probably not recoverable from the digitised series.** The São Sebastião baptism book begins in 1611; if he was born in the 1580s his act predates it. Whether an earlier São Sebastião book survives at BPAR Angra is unverified.
  - **His marriage to Maria da Costa Leonardes:** no date, no parish, no record **[OPEN]**.
  - **His parentage is compiled only.** Gaspar de Souto Cardoso × Catarina Valadão rest on Vol. IX p.258 and on nothing else we hold. They are deliberately not modelled as entities.
  - **He is absent from the compiled genealogies by name.** The 2026-09-23 full-corpus search of *Genealogias da Ilha Terceira* Vols I–VIII did not find him; the VALADÃO chapter in Vol. I covers the Praia, Vila Nova and Lajes branches, not his. He exists in the compilation only inside the Vol. IX SOUTO-MAIOR narrative, as the link between his father and his son. That absence is now easier to read: the registers never call him Valadão either.
  - **Whether Gaspar de Souto Maior took the surname from his uncle the vicar is untested [STRONG LEAD].** The test is Gaspar's own 1657 baptism act, illegible at the held resolution.
  - **No occupation, property, will or inventory** has been located for him. His standing is inferred from his sons' careers, which is weaker than it reads.

  ## Sources held (this repository)

  - **PAR-0097** — his own death act, São Sebastião, 19 August 1652: the register spelling of his name ("m.el de Ponte Cardozo"), the sacraments, the burial beside the chancel arch, and the marginal "meu pai". *Primary.*
  - **PAR-0098** — his wife's death act, São Sebastião, 27 December 1654: names him as her husband in a primary hand and states the writer's parentage in the first person. *Primary.*
  - **PAR-0087** — his son Belchior's baptism, São Sebastião, ~9 January 1615: names him "Manoell de Ponte" with his wife and his son. *Primary.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, p. 259 (and p. 258 for his parents and brothers): his name variants, his death date, his wife and his four recorded children. *Secondary, compiled — still the only source for his parents, his brothers and three of his four children.*

  ## Regional and migration context

  **Terceira in his lifetime [CONTEXTUAL].** If he was born in the 1580s, Manuel lived his whole life under the Spanish Habsburg union of the crowns (1580–1640), on an island that had been the last part of the Portuguese realm to resist Philip II and was taken only by the invasion of 1583. He was in his fifties or sixties at the Restoration of 1640 and at the eleven-month blockade that forced the Castilian garrison of the Castelo de São Filipe at Angra to capitulate on 4 March 1642. He died ten years later.

  **The island economy around him [CONTEXTUAL].** Terceira exported wheat to mainland Portugal and the African presidios, grew the blue dye *pastel* (woad) in what was already its long decline against American indigo, made wine, and cut shipbuilding timber. Angra — city since 1534, seat of the Azores bishopric — was a mid-Atlantic port of call for the returning India and Brazil fleets. Praia, where his father died, and São Sebastião, where he did, sit at the island's eastern and south-eastern ends.

  **Emigration is not his story [CONTEXTUAL].** The pressures that later pushed Azoreans to Brazil — a finite island, *morgadio* and primogeniture locking estates on eldest sons, periodic seismic disaster — were already present, but the pull that made emigration mass was the Minas Gerais gold strike of 1697, forty-five years after his death. His descendants leave; he did not.

  ## Where to go today

  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — the parish where his four sons were baptised (1612–1619), where one of them served as vicar, where he and his wife died, and where both are buried inside the church beside the arch of the chancel. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Igreja Matriz de Santa Cruz, Praia da Vitória, Terceira** — where his father Gaspar de Souto Cardoso was buried in 1618, per Mendes Forjaz. [APPROX — compiled only, not verified against a register] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Cruz%2C%20Praia%20da%20Vit%C3%B3ria%2C%20Terceira)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds TER-AH-SAOSEBASTIAO-O-1642-1696, the book containing his 19 August 1652 burial act (now held as PAR-0097 at the CDN maximum), and can supply a higher-resolution reproduction and say whether any São Sebastião register predating 1611 survives. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Desde 24 de setembro de 2026 tem registo original próprio. O livro de óbitos de São Sebastião lê "faleceo m.el de Ponte Cardozo aos dezanove dias de Agosto de mil e seiscentos [e] cinquoenta e dous annos con todos os sacramentos da Igr[ej]a, está sepultado nesta Igr[ej]a … sepultura sua junto ao arco da cape[la mor]" (PAR-0097, livro O-1642-1696, imagem CDN 0016). Até essa imagem, estava documentado por uma única cláusula no baptismo do filho, "Belchior fo[i filho] a **Manoell de Ponte** e de sua molher Maria da Cota" (PAR-0087, livro B-1611-1687 p.0037) — que continua a fixar a mulher e a paternidade.

  - **[PROVEN]** O apelido é **Cardoso**, não Valadão. Os registos escrevem-no "Manoell de Ponte" (1615), "m.el de Ponte Cardozo" (o seu próprio óbito de 1652) e "M.el de Ponte Cardoso" (o óbito da mulher, 1654) — o mesmo apelido que o filho Belchior leva. **[COMPILED]** "Manuel da Ponte Valadão" é a forma de cabeçalho de Mendes Forjaz, derivada da mãe Catarina Valadão, e a própria compilação acrescenta "Ou Manuel da Ponte Cardoso". Este repositório usou a forma Valadão até à leitura da imagem de 1652, a 24 de setembro de 2026; passa a conservá-la apenas como variante de genealogia compilada.

  - **[PROVEN]** Faleceu em São Sebastião a 19 de agosto de 1652 e a mulher a 27 de dezembro de 1654; os dois assentos estão agora disponíveis, do mesmo livro TER-AH-SAOSEBASTIAO-O-1642-1696 (PAR-0097, PAR-0098). O registo acrescenta o que a compilação não podia dar: recebeu todos os sacramentos e foi sepultado *dentro* da igreja, em sepultura sua junto ao arco da capela-mor — a mesma posição dada à mulher dois anos depois.

  - **[PROVEN]** O sacerdote que o sepultou era seu filho. Uma nota de três linhas na margem do assento de 1652 lê "M.el de Pon / te Cardozo / **meu pai**", e dois anos depois a mesma mão abre o assento da mulher com "faleceo maria da Costa Leonardes **minha mai**, molher de M.el de Ponte Cardoso **meu pai**" (PAR-0098). Duas atestações independentes, em primeira pessoa, no mesmo livro. **[COMPILED + PROVEN]** Esse filho é **António Coelho Souto-Maior** (n.13 de fevereiro de 1619, f.17 de julho de 1686), o único sacerdote entre os filhos do casal no Vol. IX e *padre vigário* da Matriz de São Sebastião — identificação feita pelas assinaturas vizinhas no mesmo livro e pela compilação, já que os dois assentos da família estão assinados apenas "o Vig.º So[u]tomaior", sem nome próprio. **[NOTA]** O handoff do agente de recolha de 2026-09-24 chamou-lhe "Manoel Coelho Souto Maior"; as imagens não sustentam esse nome.

  - **[COMPILED]** A casa colocou, portanto, um filho à frente da paróquia e outro no corpo de oficiais da milícia: Belchior tornou-se *Alferes de ordenanças*.

  - **[COMPILED]** O pai, **Gaspar de Souto Cardoso**, faleceu na Praia a 15 de fevereiro de 1618 "em idade avançada" e foi sepultado na Matriz. **[INFERRED]** O centro da família terá, pois, passado da Praia para São Sebastião entre a geração do pai e a dele — os filhos de Manuel são todos baptizados em São Sebastião a partir de 1612.

  ## Identidade

  **Manuel da Ponte Cardoso** — escrito "m.el de Ponte Cardozo" no seu próprio assento de óbito **[PROVEN, PAR-0097]**, "M.el de Ponte Cardoso" no da mulher **[PROVEN, PAR-0098]** e simples "Manoell de Ponte" no baptismo do filho **[PROVEN, PAR-0087]**. A forma *Manuel da Ponte Valadão* é da genealogia compilada **[COMPILED, PUB-0005 p.259]**, não do registo, e fica aqui apenas como variante. Falecido em São Sebastião, Terceira, a 19 de agosto de 1652, com os sacramentos, e sepultado na igreja junto ao arco da capela-mor **[PROVEN]**. Casou com **Maria da Costa Leonardes** (P-0126), família F-0063; pai de **Belchior da Ponte Cardoso** (P-0123) e do vigário da freguesia **António Coelho Souto-Maior**.

  - **Data e local de nascimento:** desconhecidos. **[INFERRED]** Os baptismos dos filhos começam em 1612, logo terá casado por volta de 1611 e nascido, provavelmente, na década de 1580. Nessa conta, o seu baptismo é anterior ao mais antigo livro de baptismos de São Sebastião que sobrevive (B-1611-1687) e pode não existir em nenhuma série digitalizada.
  - **Pais:** **Gaspar de Souto Cardoso** × **Catarina Valadão** **[COMPILED, PUB-0005 p.258]** — não modelados como entidades aqui, e sem evidência independente.
  - **Nacionalidade:** portuguesa (Açores, território da Coroa)
  - **Patente ou ocupação:** nenhuma registada em qualquer fonte disponível — o próprio assento de óbito não lhe dá título, patente nem ofício. **[OPEN]**
  - **Sepultura:** dentro da Igreja Matriz de São Sebastião, "sepultura sua junto ao arco da cape[la mor]" — uma sepultura da casa, junto ao arco da capela-mor **[PROVEN, PAR-0097]**.

  **Posição na árvore.** Pela cadeia modelada P-0125 → P-0123 → P-0092 → P-0057 → P-0056 → P-0054 → P-0017 → P-0008 → P-0004, Manuel está oito gerações acima de Geraldo Paz Armond (P-0004) — seu 6.º bisavô (*6th-great-grandfather*) — e dez gerações acima da atual geração viva da família. O grau é provisório num ponto: o passo P-0123 → P-0092 é apenas **[COMPILED]** e depende da questão não resolvida dos "dois Gaspares"; se P-0092 for a geração seguinte, cada grau recua um.

  ## Posição social e profissão

  **Nada diz o que ele fazia.** Nenhuma patente, cargo, ofício, propriedade, testamento ou inventário está registado para ele em nenhuma fonte disponível, e o próprio assento de óbito — que seria o lugar natural para um título — não dá nenhum. É uma lacuna real, não um descuido deste retrato. A patente de *Alferes* do filho está documentada; a dele não.

  **O que a sepultura diz [PROVEN + CONTEXTUAL].** Foi sepultado dentro da igreja paroquial, em sepultura descrita como sua, junto ao arco da capela-mor. O enterramento no interior do templo, em sepultura própria da casa, na extremidade mais próxima do altar, era a posição mais disputada que uma freguesia tinha para dar, e não estava ao alcance de todos **[CONTEXTUAL]**. A mulher foi sepultada no mesmo lugar dois anos depois. É o primeiro indicador firme, declarado por documento, da posição da casa — mais forte do que tudo o que se pode ler nas carreiras dos filhos, ainda que nada diga sobre ocupação ou bens.

  O que se pode raciocinar a partir da casa, com cuidado:

  - **[INFERRED + CONTEXTUAL]** Colocar um filho como *padre vigário* da matriz não era grátis. Um candidato à ordenação precisava de estudos de latim e de um *título de património* — um rendimento fixo consignado para que não pesasse sobre a Igreja. É uma exigência real de capital, e implica uma casa com terra ou rendas por trás, ainda que nenhuma escritura sobreviva para as nomear.
  - **[INFERRED]** Um segundo filho com patente de alferes aponta no mesmo sentido: os oficiais das *ordenanças* saíam dos principais moradores da freguesia **[CONTEXTUAL]**.
  - **[INFERRED]** Somados, um padre e um oficial são a estratégia clássica de colocação de uma família proprietária de meios medianos — mas continua a ser inferência a partir das carreiras dos filhos, e não declaração documentada sobre o pai.

  **Não ler os apelidos como posição.** "Valadão", "Souto Cardoso" e "da Ponte" soam a apelidos de armas; nada no registo disponível concede a esta família armas, *foro*, *morgadio* ou tratamento de *Dom*.

  ## Família e rede social

  - **Mulher:** Maria da Costa Leonardes (P-0126) — nomeada ao lado dele no baptismo de Belchior, em 1615, como "sua molher Maria da Cota" **[PROVEN, PAR-0087]**, e de novo no seu próprio assento de óbito de 1654 como "molher de M.el de Ponte Cardoso" **[PROVEN, PAR-0098]**. Não se conhece registo, data nem freguesia do casamento **[OPEN]**.
  - **Filhos [COMPILED, PUB-0005 p.259]:** Baltazar (n. São Sebastião 6 de novembro de 1612); **Belchior da Ponte Cardoso** (n.10 de janeiro de 1615 na compilação; o assento primário lê ~9 de janeiro) **[PROVEN via PAR-0087]**; Francisco Cardoso da Ponte, também dito Cardoso Souto-Maior (n.12 de março de 1617, f.28 de dezembro de 1679, solteiro); e **António Coelho Souto-Maior** (n.13 de fevereiro de 1619, f.17 de julho de 1686), *padre vigário* da Matriz de São Sebastião — cuja filiação está agora **[PROVEN]** pela nota em primeira pessoa "meu pai" no assento de óbito deste homem e pela abertura em primeira pessoa do assento da mulher (PAR-0097, PAR-0098). Não confundir esse filho com o neto homónimo, o António Coelho Souto-Maior baptizado a 12 de março de 1654, filho de Belchior × Mariana Fagundes (PAR-0092).
  - **Irmãos [COMPILED, PUB-0005 p.258]:** Roque da Ponte Cardoso (n. Praia 13 de fevereiro de 1575, casado com Beatriz Álvares Cardoso, viveram no Pico de Gil de Borba) e Belchior da Ponte Maciel. **[NOTA]** Uma descrição de trabalho anterior desta linha como "cadeia Roque → Manuel → Belchior" está errada e já se encontra corrigida no registo da fonte: Roque era *irmão* de Manuel, não o pai.
  - **Netos:** por Belchior, pelo menos nove, dos quais sete baptismos estão disponíveis em imagem (1651–1666).
  - **O nome que transmitiu.** Três dos quatro filhos registados levam combinações de apelido diferentes, e dois deles levam "Souto-Maior" — o nome de casa que o neto Gaspar de Souto Maior (n.23 de dezembro de 1657, P-0092) viria a usar e que o compilador acabou por adoptar como título de capítulo para toda a família. **[STRONG LEAD — não provado]** Estabelecido o vigário como tio de Gaspar, a leitura óbvia é que Gaspar tomou o apelido dele. Não está documentado: a imagem do baptismo de Gaspar está no máximo publicado pelo CDN, 383×527 px, e as linhas da filiação e da assinatura são ilegíveis, pelo que a transmissão não pode ainda ser demonstrada pelo assento.

  ## O que podemos extrapolar

  **Uma família a reorganizar-se em torno de São Sebastião [INFERRED].** O pai morreu na Praia em 1618 e foi ali sepultado na Matriz; os filhos dele foram todos baptizados em São Sebastião a partir de 1612; ele e a mulher morreram em São Sebastião, na década de 1650. Alguma coisa deslocou este ramo do termo da Praia para São Sebastião durante a sua vida — um casamento, uma herança ou simplesmente a terra disponível. Nenhum registo disponível diz qual.

  **Dois filhos, duas instituições, uma estratégia [INFERRED + CONTEXTUAL].** A Igreja e as *ordenanças* eram as duas escadas ao alcance dos filhos de uma casa insular mediana que não podia dividir a terra indefinidamente. A família de Manuel usou ambas. Nenhuma produzia riqueza transferível: um padre não tem herdeiros, e uma patente de milícia sem soldo morre com quem a detém. O que esta geração de facto transmitiu para baixo foi *posição*, e a posição tem de ser reconquistada. É esse o mecanismo que torna legível o recomeço brasileiro da família — chegam à fronteira das Minas com o porte de uma casa estabelecida e sem capital insular por trás.

  **O piso documental desceu um degrau [INFERRED].** Até setembro de 2026, a geração dele estava coberta por uma linha num assento de baptismo mais Mendes Forjaz. O seu assento de óbito coloca-o agora, como o filho, nos registos originais; a geração dos pais continua apenas compilada. O livro de baptismos de São Sebastião que sobrevive começa em 1611 e o de óbitos em 1642 — o que é, muito provavelmente, *a razão* pela qual o registo primário desta família começa e pára onde começa e pára.

  ## Questões em aberto

  - **[RESOLVIDO 2026-09-24] O assento de óbito foi lido.** O TER-AH-SAOSEBASTIAO-O-1642-1696, imagem CDN 0016, está agora catalogado como PAR-0097; o da mulher segue duas imagens adiante, como PAR-0098. Uma palavra no início da cláusula da sepultura é ilegível ao máximo do CDN, 1239×944 px, e a assinatura não traz nome próprio — uma reprodução de maior resolução do BPAR de Angra resolveria ambas.
  - **O nascimento e o baptismo provavelmente não são recuperáveis na série digitalizada.** O livro de baptismos de São Sebastião começa em 1611; se nasceu na década de 1580, o assento é anterior. Se sobrevive algum livro de São Sebastião anterior a 1611 no BPAR de Angra é coisa por verificar.
  - **O casamento com Maria da Costa Leonardes:** sem data, sem freguesia, sem registo **[OPEN]**.
  - **A filiação é apenas compilada.** Gaspar de Souto Cardoso × Catarina Valadão assentam no Vol. IX p.258 e em mais nada do que temos. Deliberadamente, não são modelados como entidades.
  - **Está ausente das genealogias compiladas pelo nome.** A busca integral de 2026-09-23 nos vols. I–VIII das *Genealogias da Ilha Terceira* não o encontrou; o capítulo VALADÃO do Vol. I cobre os ramos da Praia, Vila Nova e Lajes, não o dele. Na compilação só existe dentro da narrativa SOUTO-MAIOR do Vol. IX, como elo entre o pai e o filho. Essa ausência lê-se agora melhor: também os registos nunca lhe chamam Valadão.
  - **Se Gaspar de Souto Maior tomou o apelido do tio vigário está por testar [STRONG LEAD].** O teste é o próprio assento de baptismo de Gaspar, de 1657, ilegível na resolução disponível.
  - **Nenhuma ocupação, propriedade, testamento ou inventário** foi localizado. A sua posição é inferida das carreiras dos filhos, o que é mais frágil do que parece.

  ## Fontes disponíveis (neste repositório)

  - **PAR-0097** — o seu próprio assento de óbito, São Sebastião, 19 de agosto de 1652: a grafia do nome no registo ("m.el de Ponte Cardozo"), os sacramentos, a sepultura junto ao arco da capela-mor e a nota marginal "meu pai". *Primária.*
  - **PAR-0098** — o assento de óbito da mulher, São Sebastião, 27 de dezembro de 1654: nomeia-o como marido em mão primária e declara, em primeira pessoa, a filiação de quem escreve. *Primária.*
  - **PAR-0087** — o baptismo do filho Belchior, São Sebastião, ~9 de janeiro de 1615: nomeia-o "Manoell de Ponte", com a mulher e o filho. *Primária.*
  - **PUB-0005** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IX, SOUTO-MAIOR § 1º, p. 259 (e p. 258 para pais e irmãos): variantes do nome, data de óbito, mulher e os quatro filhos registados. *Secundária, compilada — continua a ser a única fonte para os pais, os irmãos e três dos quatro filhos.*

  ## Contexto regional e migratório

  **A Terceira no seu tempo [CONTEXTUAL].** Se nasceu na década de 1580, Manuel viveu toda a vida sob a união dinástica com Espanha (1580–1640), numa ilha que fora a última parcela do reino português a resistir a Filipe II e só foi tomada pela invasão de 1583. Tinha cinquenta e tal ou sessenta e tal anos na Restauração de 1640 e no cerco de onze meses que obrigou a guarnição castelhana do Castelo de São Filipe, em Angra, a capitular a 4 de março de 1642. Morreu dez anos depois.

  **A economia da ilha à sua volta [CONTEXTUAL].** A Terceira exportava trigo para o reino e para as praças africanas, cultivava o corante azul *pastel* já em longo declínio face ao índigo americano, fazia vinho e cortava madeira de construção naval. Angra — cidade desde 1534, sede do bispado dos Açores — era porto de escala do Atlântico médio para as armadas da Índia e do Brasil no regresso. A Praia, onde o pai morreu, e São Sebastião, onde ele morreu, ficam no extremo oriental e sudeste da ilha.

  **A emigração não é a história dele [CONTEXTUAL].** As pressões que mais tarde empurraram os açorianos para o Brasil — ilha finita, *morgadio* e primogenitura a prender bens aos primogénitos, desastre sísmico periódico — já existiam, mas o ímã que tornou a emigração massiva foi a descoberta do ouro nas Minas Gerais, em 1697, quarenta e cinco anos depois da sua morte. Os descendentes partem; ele não.

