notes:
- text: >-
    Manuel da Ponte Valadão (also called Manuel da Ponte Cardoso): died 19 August 1652,
    S. Sebastião, Terceira (PUB-0005, p.259). Married Maria da Costa Leonardes (P-0126),
    who died 27 December 1654, S. Sebastião. Father of Belchior da Ponte Cardoso (P-0123).
    Son of Gaspar de Souto Cardoso × Catarina Valadão (compiled, Vol. IX p.258); the
    "Valadão" surname derives from his mother's family. His birth date is not given.
- text: >-
    His father Gaspar de Souto Cardoso × Catarina Valadão are not modelled as separate entities
    in this repository batch (they are two generations above Belchior, and no primary records
    for them are held). Their existence is noted in PUB-0005 notes for traceability.
