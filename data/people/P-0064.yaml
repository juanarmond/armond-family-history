notes:
- text: >-
    Paternal grandfather of Alferes Amaro da Silva Xavier (P-0059); named in the 1777
    Piracatu baptism of his granddaughter Maria (PAR-0025) as "Amaro da Silva Barreto,
    natural da Villa de Guimaraes, Arcebispado de Braga" — Guimarães, Portugal. The
    source shows an abbreviated military title before his name; the exact rank is
    uncertain ("[Sargento / Tenente?]"). He is the Portuguese immigrant ancestor on
    the paternal side of the da Silva Xavier / Mathilde / Toledo direct line. His own
    birth, marriage and death records have not been located.
