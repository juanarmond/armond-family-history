profile: >-
  ## Identity

  **Amaro da Silva Barreto** [PROVEN] — named, with an abbreviated and uncertain military
  rank ("[Sargento / Tenente?]"), as a paternal grandparent in his granddaughter Maria's
  1777 Piracatu baptism (PAR-0025). Per that record and family F-0031 he is the **father**
  of Alferes Amaro da Silva Xavier (P-0059) — the Portuguese immigrant ancestor of this
  branch's paternal (Silva) side, and Mathilde Maria de Jesus's grandfather.

  - **Origin:** natural da Villa de Guimarães, Arcebispado de Braga, Portugal (NW Portugal
  / Minho) [PROVEN]. Nationality Portuguese.

  - **Marriage:** ⚭ Perpétua da Silva (P-0065, of the Cidade de São Paulo), family F-0031.
  His own birth, marriage and death records are not located; other children are not
  attested.

  ## What we can extrapolate

  A Guimarães-born officer marrying a São Paulo-city woman — the entry point of the family's
  militia standing (his son an Alferes/Capitão, his grandson Cezário a Capitão) and one of
  two documented Braga-archdiocese roots of Mathilde's maternal branch (the other, Viana,
  on the Lima side). [INFERRED]

  ## Open questions

  - His own baptism, marriage and parents (Guimarães, ~1710s–1730s). [OPEN] The exact Guimarães
  freguesia stays unpinned after two tool-passes: on the Portugal side Guimarães is excluded from
  the Arquivo Distrital de Braga and the Arquivo Municipal Alfredo Pimenta is a finding-aid index
  only (name-search returned nothing); on the Brazil side the São Paulo marriage that would name
  the freguesia was not found. [bounded-negative, 2026-08-12]

  - His marriage to Perpétua (likely São Paulo, her city) is a bounded negative in the indexed
  FamilySearch corpus (Records personas + Full-Text OCR returned only modern namesakes; no 18th-c
  act indexed). His node on the FamilySearch collaborative tree attaches no parents — a clean gap,
  nothing to retract. [bounded-negative, 2026-08-12]

  - No land grant (sesmaria) is catalogued for the Silva Barreto / Silva Xavier surnames in the
  Plataforma SILB (checked 2026-08-13, 0 grantees) — consistent with the under-digitisation of
  colonial SP / Goiás / Paracatú land records, so absence there is not absence of the underlying
  record; any grant would sit off-SILB (Arquivo do Estado de SP / Arquivo Público Mineiro).
  [bounded-negative]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of his granddaughter Maria — the only held record that
  names him, giving his rank, his Guimarães origin, and his wife).

  ## Regional and migration context

  From the Villa de Guimarães (Minho, NW Portugal); his descendants moved through colonial
  São Paulo (his wife's city) into the Goiás / Paracatú frontier and on to Barbacena — the
  NW-Portugal-emigration to São-Paulo-captaincy to Minas/Goiás-frontier stream that carried
  militia families inland through the 18th century. [CONTEXTUAL] The Minho was Portugal's densest
  rural minifúndio (~96 inhabitants/km² by 1801) and the single greatest source of 18th-century
  Portuguese emigration to Brazil — the structural push behind a Guimarães emigrant like him;
  movement to the goldfields ran under the Provisão / Alvará régio de 20 de março de 1720 (D. João
  V) passport regime, and frontier land under the sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Origin freguesia:** Guimarães, freguesia de São Paio, Braga, Portugal (specific São Paio parish church unpinned) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Guimar%C3%A3es%2C%20freguesia%20de%20S%C3%A3o%20Paio%2C%20Portugal)

  - **Descendants' Brazilian seat:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Identidade

  **Amaro da Silva Barreto** [PROVEN] — nomeado, com uma patente militar abreviada e
  incerta ("[Sargento / Tenente?]"), como avô paterno no batismo de 1777 de sua neta Maria
  em Piracatu (PAR-0025). Conforme esse registro e a família F-0031, ele é o **pai** de
  Alferes Amaro da Silva Xavier (P-0059) — o ancestral imigrante português do lado paterno
  (Silva) deste ramo, e avô de Mathilde Maria de Jesus.

  - **Origem:** natural da Villa de Guimarães, Arcebispado de Braga, Portugal (noroeste de
  Portugal / Minho) [PROVEN]. Nacionalidade portuguesa.

  - **Casamento:** ⚭ Perpétua da Silva (P-0065, da Cidade de São Paulo), família F-0031.
  Seus próprios registros de nascimento, casamento e óbito não foram localizados; outros
  filhos não são atestados.

  ## O que podemos extrapolar

  Um oficial nascido em Guimarães casando-se com uma mulher da cidade de São Paulo — o ponto
  de entrada do prestígio de milícia da família (seu filho um Alferes/Capitão, seu neto
  Cezário um Capitão) e uma de duas raízes documentadas do Arcebispado de Braga no ramo
  materno de Mathilde (a outra, Viana, do lado Lima). [INFERRED]

  ## Questões em aberto

  - Seu próprio batismo, casamento e pais (Guimarães, ~1710s–1730s). [OPEN] A freguesia exata de
  Guimarães permanece não fixada após duas passagens de ferramentas: no lado português, Guimarães
  está excluída do Arquivo Distrital de Braga e o Arquivo Municipal Alfredo Pimenta é apenas um
  índice/instrumento de pesquisa (a busca por nome não retornou nada); no lado brasileiro, o
  casamento em São Paulo que nomearia a freguesia não foi encontrado. [bounded-negative,
  2026-08-12]

  - Seu casamento com Perpétua (provavelmente em São Paulo, cidade dela) é um resultado negativo
  delimitado no acervo indexado do FamilySearch (personas de Records + OCR de texto integral só
  retornaram homônimos modernos; nenhum ato do século XVIII indexado). Seu nó na árvore
  colaborativa do FamilySearch não tem pais anexados — uma lacuna limpa, nada a retratar.
  [bounded-negative, 2026-08-12]

  - Nenhuma sesmaria está catalogada para os sobrenomes Silva Barreto / Silva Xavier na
  Plataforma SILB (verificada em 2026-08-13, 0 sesmeiros) — consistente com a subdigitalização dos
  registros fundiários coloniais de SP / Goiás / Paracatú, de modo que essa ausência não é
  ausência do registro subjacente; qualquer sesmaria estaria fora do SILB (Arquivo do Estado de SP
  / Arquivo Público Mineiro). [bounded-negative]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu de sua neta Maria — o único registro disponível
  que o nomeia, informando sua patente, sua origem em Guimarães e sua esposa).

  ## Contexto regional e migratório

  Da Villa de Guimarães (Minho, noroeste de Portugal); seus descendentes deslocaram-se pela
  São Paulo colonial (a cidade de sua esposa) para a fronteira de Goiás / Paracatú e adiante
  para Barbacena — a corrente da emigração do noroeste de Portugal para a capitania de São
  Paulo e para a fronteira de Minas/Goiás que levou famílias de milícia para o interior ao
  longo do século XVIII. [CONTEXTUAL] O Minho era o minifúndio rural mais denso de Portugal (~96
  habitantes/km² por volta de 1801) e a maior fonte isolada de emigração portuguesa para o Brasil
  no século XVIII — o impulso estrutural por trás de um emigrante de Guimarães como ele; o
  deslocamento para as minas de ouro corria sob o regime de passaportes da Provisão / Alvará régio
  de 20 de março de 1720 (D. João V), e a terra de fronteira sob o sistema de sesmarias.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de origem:** Guimarães, freguesia de São Paio, Braga, Portugal (igreja paroquial específica de São Paio não fixada) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Guimar%C3%A3es%2C%20freguesia%20de%20S%C3%A3o%20Paio%2C%20Portugal)

  - **Sede brasileira dos descendentes:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
