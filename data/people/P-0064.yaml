profile: >-
  ## Interesting facts

  - **[PROVEN]** He survives in exactly one document — his granddaughter's 1777 Piracatu baptism (PAR-0025) — which names him "Amaro da Silva Barreto, natural da Villa de Guimaraes, Arcebispado de Braga", fixing his Portuguese origin from a primary source. Everything else about him is silence.

  - **[uncertain]** The record puts an abbreviated military title in front of his name, but the abbreviation will not resolve: it reads "[Sargento / Tenente?]". He carried a rank; which one is not recoverable from this image.

  - **[CONTEXTUAL]** Guimarães, his documented birthplace, is one of Portugal's oldest cities and in the 18th century a textile and crafts centre of the Minho — a town economy, not a subsistence-farming one, and a very different world from the Brazilian goldfields his family ended on.

  - **[INFERRED]** His marriage to Perpétua da Silva, "natural da Cidade de S. Paulo", crosses the two main colonial currents: a Minho-born immigrant man marrying a colonial-born paulista woman. For a man arriving without land, that marriage was not a private matter — it was how an outsider acquired local kin and a claim on local property.

  - **[INFERRED]** He is the entry point of a three-generation rank ladder: his own uncertain rank, then his son's Alferes and Capitão, then his grandson Cezário's Capitão. The immigrant plants the standing; the Brazilian-born son climbs it.

  ## Identity

  **Amaro da Silva Barreto** [PROVEN] — named, with an abbreviated and uncertain military rank ("[Sargento / Tenente?]"), as a paternal grandparent in his granddaughter Maria's 1777 Piracatu baptism (PAR-0025). Per that record and family F-0031 he is the **father** of Alferes Amaro da Silva Xavier (P-0059), the grandfather of Mathilde Maria de Jesus (P-0027), and hence the 2nd-great-grandfather of Eliza Balbina de Toledo (P-0017) — the Portuguese immigrant root on the paternal (Silva) side of that branch.

  - **Origin:** natural da Villa de Guimarães, Arcebispado de Braga, Portugal (NW Portugal / Minho) [PROVEN]. Nationality Portuguese.

  - **Marriage:** ⚭ Perpétua da Silva (P-0065, of the Cidade de São Paulo), family F-0031.

  - **Birth, marriage act, death:** not located; no other child is attested. [OPEN]

  ## Standing and profession

  - **A military rank of uncertain grade** [PROVEN that he had one; the grade uncertain]. In 1777 the scribe styled him with an abbreviated title that reads "[Sargento / Tenente?]" — recorded a generation after the fact, in a grandchild's baptism, so it is how the family styled him rather than a contemporaneous commission.

  - **Literacy — [INFERRED — office], weakly:** a militia rank presupposes functional letters (muster rolls, orders), but no autograph and no *a rogo* formula is held for him, and the rank itself is an uncertain read. The inference is thinner here than for his son.

  - **No property, trade or office of profit is recorded.** Nothing states what he lived on. [OPEN]

  ## Family and social network

  - **Wife:** Perpétua da Silva (P-0065), of the Cidade de São Paulo. A published paulista genealogy would make her the youngest daughter of a Capitão-mor of Mogi das Cruzes, but that identification is a probable lead, not proven — see her profile.

  - **Son (our line):** Alferes Amaro da Silva Xavier (P-0059), who married Ignez Francisca de Lima and fathered Mathilde Maria de Jesus. No other child is attested at primary level; if the Silva Leme reading of his wife's family holds, three further children — Rosalia, Francisco and Marianna — would be his. [LEAD]

  - **No witness, godparent or associate of his own is recorded anywhere in the held corpus** — the FAN network that would show his standing simply has not survived. [OPEN]

  ## What we can extrapolate

  - **He acquired standing the way a landless immigrant could: a commission and a marriage** [INFERRED / CONTEXTUAL]. An emigrant from the Minho arrived in Brazil with no inheritable land — that was the point of leaving. The two routes open to him were the Ordenanças, whose ranks were unpaid but conferred free-white, locally-authoritative standing on men of no fortune, and marriage into a colonial-born family that already had land and kin. The single held record shows him having taken both. This is *self-made* standing, not inherited and not bought.

  - **But none of it was income, and the money in this couple was probably hers** [CONTEXTUAL on the rank; PROBABLE on the capital]. The militia rank paid nothing. If the published identification of his wife holds, the one real capital transfer into this household was her share of a paulista Capitão-mor's estate, arriving as a one-time quota through representation in a 1752 São Paulo inventário — a lump, not a revenue, and one that would have reached her children rather than her. Contingent, unearned and finite: the opposite of a land base that throws off a crop every year.

  - **Emigration and then the frontier were the same strategy twice** [INFERRED / CONTEXTUAL]. The Minho's minifúndio, subdivided past viability, left non-inheriting sons nothing to wait for; the Goiás and Paracatú frontiers were places where land was still being *granted* by sesmaria rather than divided by inheritance. A family that moves from a region where land can only be subdivided to a region where it can still be claimed is not wandering — it is escaping partible arithmetic, twice.

  - **Education is invisible here, and that is itself the finding** [CONTEXTUAL]. Formal schooling in the 18th century was a purchased, class-linked privilege with no public provision in rural Portugal or the colonial interior. What his line acquired instead was the functional literacy attached to holding a rank — a competence bought for a role, which had to be re-bought by each man who wanted the next rank, and which never passed to the women of the house at all.

  - **The arc that runs from him is upward across three generations and he is its floor** [INFERRED]. A Guimarães man with a barely-legible title, a paulista wife, a son who made Alferes and then Capitão, a granddaughter who died owning a fazenda. The later fall belongs to other branches; his own line's direction is unambiguous, and the mechanism is office plus marriage rather than inheritance.

  ## Open questions

  - His own baptism, marriage and parents (Guimarães, c.1710s–1730s). [OPEN] The exact Guimarães freguesia is unpinned after two tool-passes: on the Portugal side Guimarães is excluded from the Arquivo Distrital de Braga and the Arquivo Municipal Alfredo Pimenta offers a finding-aid index only (name-search returned nothing); on the Brazil side the São Paulo marriage that would name the freguesia was not found. [bounded-negative, 2026-08-12]

  - His marriage to Perpétua (likely at São Paulo, her city) is a bounded negative in the indexed FamilySearch corpus — Records personas and Full-Text OCR returned only modern namesakes, with no 18th-century act indexed. His node on the FamilySearch collaborative tree attaches no parents: a clean gap, nothing to retract. [bounded-negative, 2026-08-12]

  - Which rank the 1777 abbreviation actually holds. [OPEN]

  - What he lived on. No land grant is catalogued for the Silva Barreto / Silva Xavier surnames in the Plataforma SILB (checked 2026-08-13, 0 grantees) — consistent with the under-digitisation of colonial SP / Goiás / Paracatú land records, so absence there is not absence of the record; any grant would sit off-SILB (Arquivo do Estado de SP / Arquivo Público Mineiro). [bounded-negative]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of his granddaughter Maria — the only held record that names him, giving his rank, his Guimarães origin and his wife).

  ## Regional and migration context

  From the Villa de Guimarães (Minho, NW Portugal); his descendants moved through colonial São Paulo — his wife's city — into the Goiás / Paracatú frontier and on to Barbacena: the NW-Portugal → São-Paulo-captaincy → Minas/Goiás-frontier stream that carried militia families inland through the 18th century. [CONTEXTUAL] The Minho was Portugal's densest rural minifúndio (~96 inhabitants/km² by 1801) and the single greatest source of 18th-century Portuguese emigration to Brazil — the structural push behind a Guimarães emigrant like him; movement to the goldfields ran under the Provisão / Alvará régio de 20 de março de 1720 (D. João V) passport regime, and frontier land under the sesmaria system. [CONTEXTUAL] Guimarães itself was a crafts and textile town rather than a purely agrarian parish, so the standard "landless peasant son" story fits the region but is not documented for him personally. [CONTEXTUAL]

  ## Where to go today

  - **Origin freguesia:** Guimarães, freguesia de São Paio, Braga, Portugal (the specific São Paio parish church is unpinned) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Guimar%C3%A3es%2C%20freguesia%20de%20S%C3%A3o%20Paio%2C%20Portugal)

  - **Descendants' Brazilian seat:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele sobrevive em exatamente um documento — o batismo de sua neta no Piracatu, em 1777 (PAR-0025) —, que o nomeia "Amaro da Silva Barreto, natural da Villa de Guimaraes, Arcebispado de Braga", fixando sua origem portuguesa por fonte primária. Todo o resto a seu respeito é silêncio.

  - **[uncertain]** O registro põe um título militar abreviado diante de seu nome, mas a abreviatura não se resolve: lê-se "[Sargento / Tenente?]". Ele carregava uma patente; qual delas não é recuperável nesta imagem.

  - **[CONTEXTUAL]** Guimarães, seu local de nascimento documentado, é uma das cidades mais antigas de Portugal e, no século XVIII, um centro têxtil e artesanal do Minho — uma economia urbana, não de agricultura de subsistência, e um mundo muito distinto das lavras brasileiras onde sua família foi parar.

  - **[INFERRED]** Seu casamento com Perpétua da Silva, "natural da Cidade de S. Paulo", cruza as duas principais correntes coloniais: um imigrante nascido no Minho casando-se com uma paulista nascida na colônia. Para um homem que chegava sem terra, esse casamento não era assunto privado — era o modo pelo qual um forasteiro adquiria parentela local e acesso à propriedade local.

  - **[INFERRED]** Ele é a porta de entrada de uma escala de patentes de três gerações: a sua própria, incerta; depois o Alferes e Capitão do filho; depois o Capitão do neto Cezário. O imigrante planta a posição; o filho nascido no Brasil a galga.

  ## Identidade

  **Amaro da Silva Barreto** [PROVEN] — nomeado, com patente militar abreviada e incerta ("[Sargento / Tenente?]"), como avô paterno no batismo de sua neta Maria, no Piracatu, em 1777 (PAR-0025). Por esse registro e pela família F-0031 ele é o **pai** do Alferes Amaro da Silva Xavier (P-0059), avô de Mathilde Maria de Jesus (P-0027) e, portanto, trisavô de Eliza Balbina de Toledo (P-0017) — a raiz imigrante portuguesa do lado paterno (Silva) desse ramo.

  - **Origem:** natural da Villa de Guimarães, Arcebispado de Braga, Portugal (noroeste de Portugal / Minho) [PROVEN]. Nacionalidade portuguesa.

  - **Casamento:** ⚭ Perpétua da Silva (P-0065, da Cidade de São Paulo), família F-0031.

  - **Nascimento, assento de casamento, óbito:** não localizados; nenhum outro filho está atestado. [OPEN]

  ## Posição social e profissão

  - **Uma patente militar de grau incerto** [PROVEN que a teve; o grau incerto]. Em 1777 o escrivão o tratou com um título abreviado que se lê "[Sargento / Tenente?]" — lavrado uma geração depois do fato, no batismo de uma neta, de modo que é o tratamento que a família lhe dava, e não uma provisão contemporânea.

  - **Alfabetização — [INFERRED — ofício], de modo fraco:** uma patente miliciana pressupõe letras funcionais (listas de mostra, ordens), mas não há autógrafo nem fórmula *a rogo* em seu nome entre as fontes disponíveis, e a própria patente é leitura incerta. A inferência é mais tênue aqui do que para o filho.

  - **Nenhuma propriedade, ofício ou negócio está registrado.** Nada indica de que vivia. [OPEN]

  ## Família e rede social

  - **Esposa:** Perpétua da Silva (P-0065), da Cidade de São Paulo. Uma genealogia paulista publicada faria dela a filha caçula de um Capitão-mor de Mogi das Cruzes, mas essa identificação é pista provável, não provada — ver o perfil dela.

  - **Filho (nossa linha):** Alferes Amaro da Silva Xavier (P-0059), que se casou com Ignez Francisca de Lima e foi pai de Mathilde Maria de Jesus. Nenhum outro filho está atestado em nível primário; se a leitura de Silva Leme sobre a família da esposa se confirmar, mais três filhos — Rosalia, Francisco e Marianna — seriam dele. [LEAD]

  - **Nenhuma testemunha, padrinho ou associado seu aparece em todo o corpus disponível** — a rede FAN que mostraria sua posição social simplesmente não sobreviveu. [OPEN]

  ## O que podemos extrapolar

  - **Ele adquiriu posição do modo como um imigrante sem terra podia: uma patente e um casamento** [INFERRED / CONTEXTUAL]. Um emigrante do Minho chegava ao Brasil sem terra herdável — era exatamente esse o motivo de partir. As duas vias abertas a ele eram as Ordenanças, cujas patentes não pagavam nada mas conferiam condição de branco livre e autoridade local a homens sem fortuna, e o casamento com uma família nascida na colônia que já tinha terra e parentela. O único registro disponível mostra que ele tomou as duas. Isso é posição *autoconstruída*, não herdada nem comprada.

  - **Mas nada disso era renda, e o dinheiro deste casal provavelmente era dela** [CONTEXTUAL quanto à patente; PROBABLE quanto ao capital]. A patente miliciana não pagava nada. Se a identificação publicada de sua esposa se sustentar, a única transferência real de capital para esta casa foi a cota dela no espólio de um Capitão-mor paulista, chegando como quinhão único por representação num inventário de 1752 em São Paulo — uma quantia, não uma receita, e que teria alcançado os filhos dela, não ela. Contingente, não ganho e finito: o oposto de uma base fundiária que rende safra todo ano.

  - **A emigração e depois a fronteira foram a mesma estratégia, duas vezes** [INFERRED / CONTEXTUAL]. O minifúndio minhoto, subdividido além da viabilidade, não deixava nada a esperar aos filhos não herdeiros; as fronteiras de Goiás e Paracatú eram lugares onde a terra ainda era *concedida* por sesmaria, em vez de dividida por herança. Uma família que se desloca de uma região onde a terra só pode ser subdividida para outra onde ela ainda pode ser requerida não está errando — está escapando, duas vezes, da aritmética partível.

  - **A educação é invisível aqui, e isso já é o achado** [CONTEXTUAL]. A escolarização formal no século XVIII era privilégio comprado e ligado à classe, sem oferta pública no Portugal rural ou no interior colonial. O que sua linha adquiriu, em vez disso, foi a alfabetização funcional ligada ao exercício de uma patente — competência comprada para um papel, que precisava ser recomprada por cada homem que quisesse a patente seguinte, e que nunca chegou às mulheres da casa.

  - **O arco que parte dele é ascendente ao longo de três gerações, e ele é o piso** [INFERRED]. Um homem de Guimarães com título mal legível, uma esposa paulista, um filho que fez Alferes e depois Capitão, uma neta que morreu dona de fazenda. A queda posterior pertence a outros ramos; a direção de sua própria linha é inequívoca, e o mecanismo é ofício mais casamento, não herança.

  ## Questões em aberto

  - Seu próprio batismo, casamento e pais (Guimarães, c.1710–1730). [OPEN] A freguesia exata de Guimarães permanece indefinida após duas passagens de ferramenta: do lado português, Guimarães está excluída do Arquivo Distrital de Braga e o Arquivo Municipal Alfredo Pimenta oferece apenas índice de instrumento de pesquisa (a busca por nome não retornou nada); do lado brasileiro, o casamento em São Paulo que nomearia a freguesia não foi encontrado. [negativo delimitado, 2026-08-12]

  - Seu casamento com Perpétua (provavelmente em São Paulo, cidade dela) é negativo delimitado no corpus indexado do FamilySearch — Records personas e OCR de texto integral retornaram apenas homônimos modernos, sem nenhum ato setecentista indexado. Seu nó na árvore colaborativa do FamilySearch não anexa pais: uma lacuna limpa, nada a retratar. [negativo delimitado, 2026-08-12]

  - Qual patente a abreviatura de 1777 de fato contém. [OPEN]

  - De que ele vivia. Nenhuma concessão de terra está catalogada para os sobrenomes Silva Barreto / Silva Xavier na Plataforma SILB (verificado em 2026-08-13, 0 sesmeiros) — coerente com a subdigitalização dos registros fundiários coloniais de SP / Goiás / Paracatú, de modo que a ausência ali não é ausência do registro; qualquer concessão estaria fora do SILB (Arquivo do Estado de SP / Arquivo Público Mineiro). [negativo delimitado]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de sua neta Maria no Piracatu, 1777 — o único registro disponível que o nomeia, dando sua patente, sua origem em Guimarães e sua esposa).

  ## Contexto regional e migratório

  Da Villa de Guimarães (Minho, noroeste de Portugal); seus descendentes passaram por São Paulo colonial — a cidade da esposa — rumo à fronteira de Goiás / Paracatú e daí a Barbacena: a corrente noroeste de Portugal → capitania de São Paulo → fronteira de Minas/Goiás que levou famílias milicianas para o interior ao longo do século XVIII. [CONTEXTUAL] O Minho era o minifúndio rural mais denso de Portugal (~96 habitantes/km² em 1801) e a maior fonte isolada da emigração portuguesa setecentista para o Brasil — o empurrão estrutural por trás de um emigrante de Guimarães como ele; o deslocamento para as minas corria sob o regime de passaportes da Provisão / Alvará régio de 20 de março de 1720 (D. João V), e a terra de fronteira sob o sistema de sesmarias. [CONTEXTUAL] A própria Guimarães era uma vila de ofícios e têxteis, e não uma freguesia puramente agrária, de modo que a história-padrão do "filho camponês sem terra" cabe à região, mas não está documentada para ele. [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de origem:** Guimarães, freguesia de São Paio, Braga, Portugal (a igreja paroquial exata de São Paio permanece indefinida) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Guimar%C3%A3es%2C%20freguesia%20de%20S%C3%A3o%20Paio%2C%20Portugal)

  - **Sede brasileira dos descendentes:** Catedral N.S. da Piedade de Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
