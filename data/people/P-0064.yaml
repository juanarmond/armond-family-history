notes:
- text: >-
    Paternal grandfather of Alferes Amaro da Silva Xavier (P-0059); named in the 1777
    Piracatu baptism of his granddaughter Maria (PAR-0025) as "Amaro da Silva Barreto,
    natural da Villa de Guimaraes, Arcebispado de Braga" — Guimarães, Portugal. The
    source shows an abbreviated military title before his name; the exact rank is
    uncertain ("[Sargento / Tenente?]"). He is the Portuguese immigrant ancestor on
    the paternal side of the da Silva Xavier / Mathilde / Toledo direct line. His own
    birth, marriage and death records have not been located.
  text_pt: >-
    Avô paterno de Alferes Amaro da Silva Xavier (P-0059); nomeado no batismo de
    1777 de sua neta Maria em Piracatu (PAR-0025) como "Amaro da Silva Barreto,
    natural da Villa de Guimaraes, Arcebispado de Braga" — Guimarães, Portugal. A
    fonte mostra um título militar abreviado antes de seu nome; a patente exata é
    incerta ("[Sargento / Tenente?]"). Ele é o ancestral imigrante português do
    lado paterno da linha direta da Silva Xavier / Mathilde / Toledo. Seus
    próprios registros de nascimento, casamento e óbito não foram localizados.
