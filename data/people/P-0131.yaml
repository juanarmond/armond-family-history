connection_pt: >-
  Tradição familiar, não ancestral provado: é apontado como pai de Francisco Ferreira Armonde
  (f. 1751), patriarca dos Ferreira Armonde de Barbacena, que só se ligaria ao proprietário do
  arquivo através dos pais desconhecidos de Simplício José Ferreira Armond (P-0016). Nenhum
  registo prova ainda qualquer dos dois elos.
notes:
- text: >-
    Created 2026-10-10 to separate two different men whom the tree had joined. Gaspar Ferreira
    (P-0092) is the father of Joaquim José Ferreira de Toledo (P-0057), named in the son's 1783
    Barbacena marriage (PAR-0018), whose son was born and baptised at Villa Rica, Minas Gerais —
    the Toledo line. Gaspar de Souto Maior (this person) is the son of the Alferes Belchior da
    Ponte Cardoso (P-0123) and Mariana Fagundes (P-0124), family F-0062, baptised at São
    Sebastião, Terceira, on 23 December 1657 (PAR-0099) and dead there on 2 December 1727, still
    married to Maria Mendes (PAR-0100). The Terceira Gaspar lived and died on Terceira; no record
    places him in Brazil. The baptism event E-0135, once attached to P-0092, is his. The
    identification of the two had rested on Mendes Forjaz Vol. IX alone and was withdrawn by
    the owner's decision of 10 October 2026.
  text_pt: >-
    Criado a 2026-10-10 para separar dois homens diferentes que a árvore tinha unido. Gaspar
    Ferreira (P-0092) é o pai de Joaquim José Ferreira de Toledo (P-0057), nomeado no casamento
    do filho em Barbacena, em 1783 (PAR-0018), filho esse nascido e baptizado em Villa Rica,
    Minas Gerais — a linha Toledo. Gaspar de Souto Maior (esta pessoa) é filho do Alferes
    Belchior da Ponte Cardoso (P-0123) e de Mariana Fagundes (P-0124), família F-0062, baptizado
    em São Sebastião, Terceira, a 23 de dezembro de 1657 (PAR-0099) e ali falecido a 2 de
    dezembro de 1727, ainda casado com Maria Mendes (PAR-0100). O Gaspar da Terceira viveu e
    morreu na Terceira; nenhum registo o situa no Brasil. O evento de baptismo E-0135, antes
    ligado ao P-0092, é dele. A identificação dos dois assentava só no Vol. IX de Mendes Forjaz e
    foi retirada por decisão do proprietário de 10 de outubro de 2026.
- text: >-
    Baptism date. His own baptism act reads 23 DECEMBER 1657 (PAR-0099). Mendes Forjaz Vol. IX
    (PUB-0005, p.261) prints "b. … 23.2.1657" and Lacerda's thesis footnote 74 (PUB-0002) "23 de
    setembro de 1657". The register governs; the printed months are kept as variants in E-0135
    and PAR-0099, without asserting how either book went wrong. No birth date is evidenced, so
    no birth event is modelled; the baptism is his earliest dated event.
  text_pt: >-
    Data do baptismo. O próprio assento de baptismo lê 23 de DEZEMBRO de 1657 (PAR-0099). O Vol.
    IX de Mendes Forjaz (PUB-0005, p.261) imprime "b. … 23.2.1657" e a nota 74 da tese de Lacerda
    (PUB-0002) "23 de setembro de 1657". Prevalece o registo; os meses impressos ficam como
    variantes no E-0135 e no PAR-0099, sem afirmar como errou cada livro. Não há data de
    nascimento comprovada, pelo que não se modela evento de nascimento; o baptismo é o seu evento
    datado mais antigo.
- text: >-
    Nationality Portuguese: born in the Azores, then Portuguese Crown territory. Neither held
    record states a nationality; as for his father (P-0123), persons born in the islands are
    recorded as Portuguese, not separately "Azorean" for nationality purposes.
  text_pt: >-
    Nacionalidade portuguesa: nascido nos Açores, então território da Coroa portuguesa. Nenhum
    dos registos guardados declara nacionalidade; tal como para o pai (P-0123), quem nasceu nas
    ilhas é registado como português, e não à parte como "açoriano" para efeitos de
    nacionalidade.
- text: >-
    Marriages — spouses deliberately NOT modelled. (1) 2 October 1690, Igreja do Convento da
    Graça, Angra (registered at São Sebastião), to D. Margarida Machado (Vol. IX, PUB-0005)
    [COMPILED]; she is very probably the "Margarida das Candeyas" whom the 1751 will of
    Francisco Ferreira Armonde, as quoted by Lacerda, names as his mother (PUB-0002 ff. 55–56;
    f. 56, after a private 2008 typescript by Paulo Ribeiro Luz, joins the two as "Margarida das
    Candeyas Machado"; n. 74 has her baptised 29.5.1667 and dead 9.4.1693 at São Sebastião)
    [LEAD]. (2) 8 February 1694, São Sebastião, to Maria Mendes de Borba, daughter of Bartolomeu
    Vieira de Borba and Iria Mendes (Vol. IX) [COMPILED]; corroborated by his own death act,
    "Cazado Com Maria Mendes" (PAR-0100) [PROVEN that his wife in 1727 was a Maria Mendes]. No
    marriage record is held in this repository, so neither wife is modelled and no partner
    family exists for him — an intentional omission, not a gap for an audit to fill. The
    retrieval side reports reading both marriage acts (São Sebastião C-1673-1766 pp.0036 and
    0044) and gives Maria's parents as Brás Gil de Borba × D. Iria/Inês Mendes, against Vol. IX's
    Bartolomeu Vieira de Borba [LEAD — not held].
  text_pt: >-
    Casamentos — cônjuges deliberadamente NÃO modelados. (1) 2 de outubro de 1690, Igreja do
    Convento da Graça, Angra (registado em São Sebastião), com D. Margarida Machado (Vol. IX,
    PUB-0005) [COMPILED]; é muito provavelmente a "Margarida das Candeyas" que o testamento de
    1751 de Francisco Ferreira Armonde, citado por Lacerda, nomeia como sua mãe (PUB-0002 ff.
    55–56; a f. 56, a partir de um datiloscrito particular de 2008 de Paulo Ribeiro Luz, junta as
    duas como "Margarida das Candeyas Machado"; a n. 74 dá-a baptizada a 29.5.1667 e falecida a
    9.4.1693 em São Sebastião) [LEAD]. (2) 8 de fevereiro de 1694, São Sebastião, com Maria
    Mendes de Borba, filha de Bartolomeu Vieira de Borba e de Iria Mendes (Vol. IX) [COMPILED];
    corroborado pelo próprio assento de óbito dele, "Cazado Com Maria Mendes" (PAR-0100) [PROVEN
    que a mulher em 1727 era uma Maria Mendes]. Nenhum registo de casamento está guardado neste
    repositório, pelo que nenhuma das mulheres é modelada e ele não tem família conjugal — omissão
    intencional, não lacuna a preencher por uma auditoria. A pesquisa de recuperação diz ter lido
    os dois assentos de casamento (São Sebastião C-1673-1766, pp.0036 e 0044) e dá os pais de
    Maria como Brás Gil de Borba × D. Iria/Inês Mendes, contra o Bartolomeu Vieira de Borba do
    Vol. IX [LEAD — não guardado].
- text: >-
    Children — none modelled. Vol. IX lists three children of the second marriage, all baptised
    at São Sebastião: Maria (16.2.1698), António (4.6.1700) and Lourença (17.8.1701) [COMPILED];
