  text_pt: >-
    Filhos — nenhum modelado. O Vol. IX lista três filhos do segundo casamento, todos baptizados
    em São Sebastião: Maria (16.2.1698), António (4.6.1700) e Lourença (17.8.1701) [COMPILED]; no
    primeiro casamento escreve "C.g. que aí segue, por ter preferido os apelidos maternos",
    remetendo a geração para DRUMMOND, § 3º, que não está guardado aqui. Lacerda, a partir do
    datiloscrito de Luz de 2008, faz do patriarca de Barbacena Francisco Ferreira Armonde (f.
    1751) e do irmão Antônio filhos do primeiro casamento (PUB-0002 ff. 55–56) [LEAD]. Como não
