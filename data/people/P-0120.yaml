profile: >-
  ## Identity

  **Jeanne Germaine Caroline** — recorded by given names only as "Joanna Germana Carolina", the
  mother of the Swiss immigrant João José Rutschmann (P-0109); named in her son's 1840 Nova
  Friburgo marriage (PAR-0076, family F-0060). [STRONG-EVIDENCE] A direct ancestor of Iris Bohrer
  Muniz (P-0007) five generations up (a 3×-great-grandmother), via João José → Maria Joanna
  Rutschmann (P-0037) → Lucinda (P-0031) → Celina (P-0015). The family is of Bulle, Fribourg
  (Switzerland), from her son's stated origin; her own birthplace is not stated, so her
  nationality is left unset. [CONTEXTUAL]

  ## Open questions

