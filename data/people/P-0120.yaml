profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** Recorded only as "Joanna Germana Carolina" — three given names with no surname — in her son's 1840 Nova Friburgo marriage act. Recording a deceased mother by given names alone was standard in Nova Friburgo parish acts when her maiden surname was unavailable to the priest at the time of the ceremony.

  - **[CONTEXTUAL]** From Bulle, Canton Fribourg — the canton from which Nova Friburgo took its
  name. The Fribourg footprint of the Rutschmann couple runs through her: her husband Frédéric was
  from Bergöschingen (Klettgau, Baden-Württemberg, Germany), while she was the Fribourg-Swiss half
  of the couple. Their son Jean Joseph was born at Bulle in 1800 — the Fribourg connection is hers.

  - **[LEAD]** A secondary source reports she died 5 September 1819 in the Netherlands — at a
  North-Sea staging point of the 1819 emigration, before the fleet sailed for Rio. Her son João
  José reached Nova Friburgo orphaned on the ship *Urania*, without either parent. She is preserved
  in this archive only because her son named her in his 1840 marriage act, twenty-one years after
  her death.

  ## Identity

  **Jeanne Germaine Caroline** — recorded by given names only as "Joanna Germana Carolina", the
  mother of the Swiss immigrant João José Rutschmann (P-0109); named in her son's 1840 Nova
  Friburgo marriage (PAR-0076, family F-0060). [STRONG-EVIDENCE] A direct ancestor of Iris Bohrer
  Muniz (P-0007) five generations up (a 3×-great-grandmother), via João José → Maria Joanna
  Rutschmann (P-0037) → Lucinda (P-0031) → Celina (P-0015). The family is of Bulle, Fribourg
  (Switzerland), from her son's stated origin; her own birthplace is not stated, so her
  nationality is left unset. [CONTEXTUAL]

  ## Open questions

  - Her maiden surname — she is recorded by given names only, and the third element
  "Carolina/Caroline" may be a given name or a surname. [uncertain / OPEN]

  - Her own birth, death and origin records — no held primary. [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (her son João José's 1840 Nova Friburgo marriage — the sole held record naming her,
  as "Joanna Germana Carolina").
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** Registrada apenas como "Joanna Germana Carolina" — três prenomes sem sobrenome — no assento de casamento do filho em 1840 em Nova Friburgo. Registrar a mãe falecida apenas pelos prenomes era prática corrente nos assentos paroquiais de Nova Friburgo quando o sobrenome de solteira não estava disponível ao padre no momento da cerimônia.

  - **[CONTEXTUAL]** Natural de Bulle, Cantão de Friburgo — o cantão de onde Nova Friburgo tirou
  seu nome. O vínculo friburguês do casal Rutschmann pertence a ela: seu marido Frédéric era de
  Bergöschingen (Klettgau, Baden-Württemberg, Alemanha), enquanto ela era a metade suíço-friburguesa
  do casal. Seu filho Jean Joseph nasceu em Bulle em 1800 — a ligação com Friburgo é dela.

  - **[LEAD]** Uma fonte secundária relata que ela faleceu em 5 de setembro de 1819, nos Países
  Baixos — num ponto de escala da emigração de 1819 antes da frota partir para o Rio. Seu filho
  João José chegou a Nova Friburgo como órfão no navio *Urania*, sem nenhum dos pais. Ela está
  preservada neste arquivo apenas porque o filho a nomeou em seu assento de casamento de 1840,
  vinte e um anos após sua morte.

  ## Identidade

  **Jeanne Germaine Caroline** — registrada apenas por prenomes como "Joanna Germana Carolina",
  mãe do imigrante suíço João José Rutschmann (P-0109); nomeada no casamento de 1840 do filho em
  Nova Friburgo (PAR-0076, família F-0060). [STRONG-EVIDENCE] Uma ancestral direta de Iris Bohrer
  Muniz (P-0007) cinco gerações acima (3×-bisavó), por João José → Maria Joanna Rutschmann
  (P-0037) → Lucinda (P-0031) → Celina (P-0015). A família é de Bulle, Friburgo (Suíça), pela
  origem declarada do filho; o próprio local de nascimento dela não é declarado, de modo que sua
  nacionalidade fica em branco. [CONTEXTUAL]

  ## Questões em aberto

  - Seu sobrenome de solteira — registrada apenas por prenomes, e o terceiro elemento
  "Carolina/Caroline" pode ser um prenome ou um sobrenome. [uncertain / OPEN]

  - Seus próprios registros de nascimento, óbito e origem — nenhum primário disponível. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0076 (o casamento de 1840 do filho João José em Nova Friburgo — o único registro
  disponível que a nomeia, como "Joanna Germana Carolina").
