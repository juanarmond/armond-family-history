profile: >-
  ## Interesting facts

  - **[PROVEN]** She is recorded by given names alone — "**Joanna Germana Carolina**", three
  names and no surname — in her son's 1840 Nova Friburgo marriage act. It is the only document
  in this archive that names her, and it names her twenty-one years after she was last known to
  be alive. (PAR-0076)

  - **[uncertain]** Whether "Carolina" is a third given name or a rendering of her family name
  cannot be determined from the act. The profile keeps her under the given-name form and asserts
  no surname.

  - **[LEAD]** Research material places her birth at Bulle, Canton Fribourg, in 1763, and her
  death on 5 September 1819 in the Netherlands — at a North Sea staging point of the emigration,
  before the fleet sailed for Rio. If that holds, she died on the way to a country she never
  saw, and her son reached Nova Friburgo without either parent.

  - **[CONTEXTUAL / INFERRED]** The Fribourg thread in the Rutschmann line is hers. Her
  husband's family is placed at Bergöschingen in the Klettgau (Baden-Württemberg); her son was
  born and baptised at Bulle in 1800. That combination is only explicable through her, which
  makes her — on the leads — the reason the line looks Swiss at all.

  ## Identity

  **Jeanne Germaine Caroline**, recorded as **"Joanna Germana Carolina"** — the mother of the
  Swiss immigrant João José Rutschmann (P-0109), named once, in her son's 1840 Nova Friburgo
  marriage act. Iris Bohrer Muniz's (P-0007) 3×-great-grandmother, by the chain João José →
  Maria Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer
  (P-0015). [PROVEN that she is named; degree derived from the family links]

  - **Named in one record:** PAR-0076, 23 June 1840, as the mother of the groom and wife of
  "Frederico Rosman"; family F-0060. [PROVEN]

  - **Maiden surname:** none recorded. The third element of her name may be a given name or a
  surname and is treated as unresolved. [OPEN / uncertain]

  - **Birth and death:** reported as 1763 at Bulle, Canton Fribourg, and 5 September 1819 in the
  Netherlands, in transit. No held record touches either. [LEAD]

  - **Nationality:** left unset. Her son's Bulle birthplace is in the record; hers is not. [OPEN
  by decision]

  ## Standing and profession

  Nothing is documented. No occupation, property, residence, literacy or signature exists for
  her — nor would any be expected, since the single act that names her does so only to establish
  her son's legitimacy.

  ## Family and social network

  Her documented world is one marriage and one son. She and Frédéric Rutschmann (P-0119) are
  named together as the parents of João José Rutschmann, who married Elisabeth Storck at the
  Matriz de São João Baptista, Nova Friburgo, on 23 June 1840. [PROVEN — PAR-0076] Secondary
  material adds a second son, Nicolas, reportedly dead aboard the *Urania* in October 1819.
  [LEAD] Nothing else — no siblings, no parents, no godparent ties — survives for her in any
  source held here.

  ## What we can extrapolate

  - **[CONTEXTUAL]** The 1819 emigration route ran overland from Estavayer-le-Lac, which the
  colonists left on 4 July 1819, through Basel and Rotterdam to the North Sea ports, and only
  then by sea to Rio. Deaths at the Dutch staging points, before embarkation, were part of the
  toll — the whole passage killed roughly a quarter of the emigrants, of typhus and scurvy. A
  death "in the Netherlands" in September 1819 fits that leg of the journey precisely, which is
  why the lead is plausible; plausibility is not confirmation.

  - **[INFERRED]** She is preserved in this archive only because her son said her name aloud in
  a Brazilian church twenty-one years after she died. That is worth stating plainly: the entire
  survival of this woman's identity rests on one man's memory being written down once, by a
  priest who did not ask for her surname.

  - **[CONTEXTUAL]** If the Bulle birth holds, she married across a border — a Fribourg woman
  and a Klettgau man — and the family's presence in Fribourg, where their son was born, follows
  from her rather than from him. Correcting that direction of origin is the single most useful
  thing this profile does.

  ## Open questions

  - Her maiden surname, absent from the only record that names her. A Bulle baptism of 1763, or
  her marriage to Frédéric Rutschmann, would supply it. [OPEN]

  - Whether the 1763 Bulle birth and the 5 September 1819 death in the Netherlands are hers. A
  Swiss emigration list or the *Urania* documentation would test both. [LEAD]

  - Her own parents — unreached; the line stops at her. [OPEN]

  - Her nationality, left unset on purpose because no held record states where she was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0076** — her son João José's 1840 Nova Friburgo marriage act to Isabella Storck; the
  sole held record naming her, as "Joanna Germana Carolina", wife of Frederico Rosman.

  ## Regional and migration context

  Bulle is the principal town of the Gruyère district in Canton Fribourg — the canton whose
  government sponsored the Brazilian colony and gave Nova Friburgo its name. [CONTEXTUAL] Dom
  João VI's decree of 16 May 1818 contracted the Fribourg agent Sébastien-Nicolas Gachet to
  settle 100 Swiss Catholic families on the Fazenda do Morro Queimado; recruitment overshot to
  some 261–265 families, and the journey — Estavayer-le-Lac, Basel, Rotterdam, then the Atlantic
  — killed roughly a quarter of them. [CONTEXTUAL] Her family joined that movement; on the
  leads, she and her husband did not survive it, and their son arrived alone into a colony that
  was raised to Vila de Nova Friburgo on 3 January 1820. [LEAD for the deaths; PROVEN that the
  son was there and married in 1840]

  ## Where to go today

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Canton Fribourg, Switzerland ·
  [Maps](https://maps.google.com/?q=46.6175,7.0581). Her reported birth parish of 1763 and the
  recorded birth and baptism parish of her son in 1800. The church still stands, and its
  Catholic register is where her maiden surname would be found. [RESOLVED as a place; her own
  entry is a LEAD]

  - **Died in transit, 5 September 1819, in the Netherlands — no burial place.** She is reported
  to have died at a North Sea staging point before the fleet sailed. No cemetery or site is
  recorded. [UNLOCATED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where her
  son married in 1840 and where her name was written down for the only time. [RESOLVED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela é registrada apenas por prenomes — "**Joanna Germana Carolina**", três
  nomes e nenhum sobrenome — no assento de casamento do filho, em 1840, em Nova Friburgo. É o
  único documento deste arquivo que a nomeia, e o faz vinte e um anos depois da última data em
  que se sabe que estava viva. (PAR-0076)

  - **[incerto]** Se "Carolina" é um terceiro prenome ou a forma de um nome de família não se
  pode determinar pelo ato. O perfil a mantém sob a forma de prenomes e não afirma sobrenome
  algum.

  - **[LEAD]** Material de pesquisa situa seu nascimento em Bulle, Cantão de Fribourg, em 1763,
  e sua morte em 5 de setembro de 1819, nos Países Baixos — num ponto de escala no Mar do Norte,
  antes de a frota zarpar para o Rio. Se isso se sustentar, ela morreu a caminho de um país que
  nunca viu, e o filho chegou a Nova Friburgo sem nenhum dos pais.

  - **[CONTEXTUAL / INFERRED]** O fio friburguês da linha Rutschmann é dela. A família do marido
  é situada em Bergöschingen, no Klettgau (Baden-Württemberg); o filho dos dois nasceu e foi
  batizado em Bulle em 1800. Essa combinação só se explica por ela, o que a torna — segundo as
  pistas — a razão de a linha sequer parecer suíça.

  ## Identidade

  **Jeanne Germaine Caroline**, registrada como **"Joanna Germana Carolina"** — mãe do imigrante
  suíço João José Rutschmann (P-0109), nomeada uma única vez, no assento de casamento do filho,
  em 1840, em Nova Friburgo. Tetravó de Iris Bohrer Muniz (P-0007), pela cadeia João José →
  Maria Joanna Rutschmann (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer
  (P-0015). [PROVEN que é nomeada; grau derivado dos vínculos familiares]

  - **Nomeada em um registro:** PAR-0076, 23 de junho de 1840, como mãe do noivo e esposa de
  "Frederico Rosman"; família F-0060. [PROVEN]

  - **Sobrenome de solteira:** nenhum registrado. O terceiro elemento de seu nome pode ser
  prenome ou sobrenome e é tratado como não resolvido. [OPEN / incerto]

  - **Nascimento e óbito:** relatados como 1763 em Bulle, Cantão de Fribourg, e 5 de setembro de
  1819 nos Países Baixos, em trânsito. Nenhum documento retido toca em qualquer dos dois. [LEAD]

  - **Nacionalidade:** deixada em aberto. O local de nascimento do filho, Bulle, está no
  registro; o dela, não. [OPEN por decisão]

  ## Posição social e profissão

  Nada está documentado. Não existe para ela ocupação, propriedade, residência, alfabetização ou
  assinatura — nem se esperaria qualquer delas, já que o único ato que a nomeia o faz apenas
  para estabelecer a legitimidade do filho.

  ## Família e rede social

  Seu mundo documentado é um casamento e um filho. Ela e Frédéric Rutschmann (P-0119) são
  nomeados juntos como pais de João José Rutschmann, que se casou com Elisabeth Storck na Matriz
  de São João Baptista, em Nova Friburgo, em 23 de junho de 1840. [PROVEN — PAR-0076] Material
  secundário acrescenta um segundo filho, Nicolas, que teria morrido a bordo do *Urania* em
  outubro de 1819. [LEAD] Nada mais — nem irmãos, nem pais, nem laços de apadrinhamento —
  sobrevive dela em qualquer fonte retida aqui.

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** A rota de emigração de 1819 seguia por terra desde Estavayer-le-Lac, de
  onde os colonos partiram em 4 de julho de 1819, por Basileia e Roterdã até os portos do Mar do
  Norte, e só então por mar até o Rio. As mortes nos pontos de escala holandeses, antes do
  embarque, faziam parte do preço — toda a passagem matou cerca de um quarto dos emigrantes, de
  tifo e escorbuto. Uma morte "nos Países Baixos" em setembro de 1819 encaixa-se exatamente
  nesse trecho da viagem, e é por isso que a pista é plausível; plausibilidade não é
  confirmação.

  - **[INFERRED]** Ela é preservada neste arquivo apenas porque o filho pronunciou seu nome numa
  igreja brasileira vinte e um anos depois de sua morte. Vale dizê-lo com clareza: toda a
  sobrevivência da identidade desta mulher repousa na memória de um homem, escrita uma única
  vez, por um padre que não lhe perguntou o sobrenome.

  - **[CONTEXTUAL]** Se o nascimento em Bulle se sustentar, ela casou-se atravessando uma
  fronteira — uma mulher de Friburgo e um homem do Klettgau —, e a presença da família em
  Friburgo, onde nasceu o filho, decorre dela, não dele. Corrigir essa direção de origem é a
  coisa mais útil que este perfil faz.

  ## Questões em aberto

  - Seu sobrenome de solteira, ausente do único registro que a nomeia. Um batismo em Bulle, de
  1763, ou seu casamento com Frédéric Rutschmann, o forneceria. [OPEN]

  - Se o nascimento em Bulle em 1763 e a morte em 5 de setembro de 1819 nos Países Baixos são
  dela. Uma lista de emigração suíça ou a documentação do *Urania* testaria ambos. [LEAD]

  - Seus próprios pais — não alcançados; a linha para nela. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — assento de casamento de 1840, em Nova Friburgo, do filho João José com
  Isabella Storck; o único documento retido que a nomeia, como "Joanna Germana Carolina", esposa
  de Frederico Rosman.

  ## Contexto regional e migratório

  Bulle é a principal cidade do distrito da Gruyère, no Cantão de Fribourg — o cantão cujo
  governo patrocinou a colônia brasileira e deu nome a Nova Friburgo. [CONTEXTUAL] O decreto de
  Dom João VI de 16 de maio de 1818 contratou o agente friburguês Sébastien-Nicolas Gachet para
  assentar 100 famílias católicas suíças na Fazenda do Morro Queimado; o recrutamento excedeu-se
  para cerca de 261–265 famílias, e a viagem — Estavayer-le-Lac, Basileia, Roterdã e depois o
  Atlântico — matou perto de um quarto delas. [CONTEXTUAL] Sua família aderiu a esse movimento;
  segundo as pistas, ela e o marido não sobreviveram a ele, e o filho chegou sozinho a uma
  colônia elevada a Vila de Nova Friburgo em 3 de janeiro de 1820. [LEAD quanto às mortes;
  PROVEN que o filho esteve lá e se casou em 1840]

  ## Onde ir hoje

  - **Église Saint-Pierre-aux-Liens, Bulle** — Bulle, Cantão de Fribourg, Suíça ·
  [Mapa](https://maps.google.com/?q=46.6175,7.0581). Sua freguesia de nascimento relatada, de
  1763, e a freguesia registrada de nascimento e batismo do filho, em 1800. A igreja continua de
  pé, e é em seu livro católico que se encontraria o sobrenome de solteira dela. [RESOLVED como
  lugar; o assento dela é LEAD]

  - **Morta em trânsito, 5 de setembro de 1819, nos Países Baixos — sem lugar de sepultamento.**
  Consta que morreu num ponto de escala no Mar do Norte, antes de a frota zarpar. Nenhum
  cemitério ou sítio é registrado. [UNLOCATED]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde o
  filho se casou em 1840 e onde seu nome foi escrito pela única vez. [RESOLVED]
