profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** The devotional surname "de Jesus" that she shared with Mathilde Maria
  de Jesus and Claudina Brandina de Jesus was common practice among Brazilian women of the
  period: a fixed paternal surname was replaced by a devotional particle, which makes
  lineage tracing structurally difficult for all three women at once.

  - **[INFERRED]** The phrase "casado que foi com" applied to her husband in PRB-0009
  indicates she predeceased Francisco Leocádio; if the reported death date of ~16 April
  1866 at the Fazenda do Socorro is correct, she died just five months before José Cezário
  (September 1866) — two deaths in the same family estate cluster within a single year.

  - **[PROVEN]** Her entire documentary footprint is one clause naming her as someone's
  late wife, in a probate opened for someone else, in which even her given name is an
  uncertain cursive read.

  - **[INFERRED]** She may nonetheless be the pivot of the family's largest unresolved
  structural question: if the 1882 embargos judgment is read correctly, she — not her
  husband — was Ladisláo's blood heir, and the Toledo share that passed into the Francisco
  Leocádio branch passed through her.

  ## Identity

  **Maria Joaquina de Jesus** — named with uncertainty in the 1867 Ladisláo inventário
  (PRB-0009): "casado que foi com Maria [Joa?]quina de Jesus"; the first element of the
  given name reads "[Joa?]quina" in the cursive, most likely "Joaquina" but an uncertain
  read [PROVEN existence, uncertain name]. Wife of Francisco Leocádio de Toledo (P-0061),
  family F-0030. Nationality Brazilian; no birthplace or death date is stated in any held
  record.

  - Whether she predeceased Francisco Leocádio is not stated outright; the "vivo/viúvo
  casado que foi" phrasing suggests he was already a widower at Ladisláo's death. A
  retrieval read of the 1879 inventário transcript (p.260) reports a certidão giving her
  death as 16 April 1866 at the Fazenda do Socorro — [LEAD], not image-verified; no death
  event has been created.

  - PRB-0009 also carries an 1881 embargos supplement (folio 185, a held image): a 6
  August 1881 Leopoldina audiência that reopened Ladisláo's 1867 estate on behalf of
  Umbelina Ignez de Toledo and others. The 1882 judgment reported in the inventário
  transcript (p.383, image not verified [LEAD]) is said to have found that Maria Joaquina
  de Jesus SURVIVED Ladisláo and to have ordered the 1876 partition redone — which, if
  verified, would place her death after Ladisláo's (before 1862), broadly consistent with
  the 16 April 1866 lead above.

  - See the material conflict on P-0061: the same 1882 embargos may make her Ladisláo's
  own daughter rather than only his daughter-in-law. [OPEN]

  ## What we can extrapolate

  - **She marks the floor of female documentary visibility in this family** [INFERRED].
  Three women of the Toledo world are documented in three different ways, and the
  difference is entirely structural rather than personal. Ritta Angélica Rodrigues is
  fully recorded because she *was* an estate: her death produced an inventory. Claudina
  Brandina de Jesus is fully recorded because she *ran* an estate: widowhood made her a
  legal actor who swore, declared and signed. Maria Joaquina did neither — she died before
  her husband and never headed a household in court — and so she survives in a single
  subordinate clause, with her own given name unresolved. Nothing about her life explains
  the difference; only her position relative to a probate does.

  - **A litigated absence is still a presence** [PROVEN dates / INFERRED reading].
  Precisely because she died before her father-in-law's estate was settled, her share had
  to be represented rather than taken, and that representation is what the 1876 partition,
  its 1882 annulment and the intervening embargos were fought over. A woman with one
  uncertain mention is at the centre of fourteen years of family litigation.

  - **If the embargos reading holds, the family's wealth story changes shape** [OPEN —
  explicitly unresolved]. On the held PRB-0009 reading she married into the Toledos and
  her husband was the blood heir. On the unverified 1882 reading she was Ladisláo's
  daughter and her husband the in-law — meaning the branch that ended up holding a
  mortgage over the main Toledo estate got its claim on Toledo property *through her*. The
  two readings produce materially different accounts of how capital moved inside this
  family, and the held evidence does not choose between them.

  ## Open questions

  - Whether she was Ladisláo's daughter or his daughter-in-law (conflict #15 on P-0061),
  pending verification of the 1882 embargos image. [OPEN]

  - Her given name — the "[Joa?]quina" read in the only record that names her. [OPEN]

  - Her parents, birth and death. The reported 16 April 1866 death at the Fazenda do
  Socorro needs image verification before any death event is created. [LEAD]

  - Any children of her marriage to Francisco Leocádio de Toledo. [OPEN]

  ## Sources held (this repository)

  - PRB-0009 (1867 Ladisláo inventário título de herdeiros — names her, uncertainly, as
  Francisco Leocádio's late wife — plus the 1881 embargos supplement folio filed in the
  same autos).

  ## Regional and migration context

  No place of her own is recorded. She belongs to the Fazenda da Concórdia / Fazenda do
  Socorro cluster in the Rio Pardo (Leopoldina) zona da mata, the Toledo family's
  coffee-frontier seat, and the only estate proceedings that name her were held at
  Leopoldina. [CONTEXTUAL]

  ## Where to go today

  - **The estate that names her (1867–1882):** Fórum da Comarca de Leopoldina, MG (Rua
  Geraldo Campana 200) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)

  - **Reported place of death (16 April 1866) [LEAD]:** Fazenda do Socorro, Rio Pardo /
  Leopoldina district, MG [UNLOCATED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** O sobrenome devocional "de Jesus" que compartilhava com Mathilde
  Maria de Jesus e Claudina Brandina de Jesus era prática comum entre mulheres brasileiras
  do período: um sobrenome paterno fixo era substituído por uma partícula devocional, o
  que torna o rastreamento de linhagem estruturalmente difícil para as três ao mesmo
  tempo.

  - **[INFERRED]** A expressão "casado que foi com", aplicada a seu marido em PRB-0009,
  indica que ela faleceu antes de Francisco Leocádio; se a data de óbito relatada de ~16
  de abril de 1866, na Fazenda do Socorro, estiver correta, ela morreu apenas cinco meses
  antes de José Cezário (setembro de 1866) — duas mortes no mesmo núcleo de fazendas da
  família dentro de um só ano.

  - **[PROVEN]** Toda a sua pegada documental é uma cláusula que a nomeia como esposa
  falecida de alguém, num inventário aberto para outra pessoa, e na qual até seu prenome é
  leitura cursiva incerta.

  - **[INFERRED]** Ainda assim, pode ser o eixo da maior questão estrutural não resolvida
  da família: se a sentença dos embargos de 1882 estiver corretamente lida, foi ela — e
  não o marido — a herdeira de sangue de Ladisláo, e a quota Toledo que passou ao ramo de
  Francisco Leocádio passou por ela.

  ## Identidade

  **Maria Joaquina de Jesus** — nomeada com incerteza no inventário de Ladisláo de 1867
  (PRB-0009): "casado que foi com Maria [Joa?]quina de Jesus"; o primeiro elemento do
  prenome lê-se "[Joa?]quina" na cursiva, muito provavelmente "Joaquina", mas leitura
  incerta [PROVEN a existência, nome incerto]. Esposa de Francisco Leocádio de Toledo
  (P-0061), família F-0030. Nacionalidade brasileira; nenhum local de nascimento ou data
  de óbito é declarado em qualquer registro disponível.

  - Se faleceu antes de Francisco Leocádio não está dito de modo expresso; a formulação
  "vivo/viúvo casado que foi" sugere que ele já era viúvo à morte de Ladisláo. Uma leitura
  da recuperação da transcrição do inventário de 1879 (p.260) relata uma certidão que dá
  seu óbito em 16 de abril de 1866, na Fazenda do Socorro — [LEAD], sem verificação de
  imagem; nenhum evento de óbito foi criado.

  - PRB-0009 traz também um suplemento dos embargos de 1881 (fólio 185, imagem
  disponível): uma audiência em Leopoldina, de 6 de agosto de 1881, que reabriu o espólio
  de 1867 de Ladisláo em nome de Umbelina Ignez de Toledo e outros. A sentença de 1882
  relatada na transcrição do inventário (p.383, imagem não verificada [LEAD]) teria
  concluído que Maria Joaquina de Jesus SOBREVIVEU a Ladisláo e mandado refazer a partilha
  de 1876 — o que, se verificado, situaria sua morte depois da dele (antes de 1862), em
  linha geral com a pista de 16 de abril de 1866 acima.

  - Ver o conflito material em P-0061: os mesmos embargos de 1882 podem fazer dela filha
  do próprio Ladisláo, e não apenas sua nora. [OPEN]

  ## O que podemos extrapolar

  - **Ela marca o piso da visibilidade documental feminina nesta família** [INFERRED].
  Três mulheres do mundo Toledo estão documentadas de três modos diferentes, e a diferença
  é inteiramente estrutural, não pessoal. Ritta Angélica Rodrigues está plenamente
  registrada porque *era* um espólio: sua morte produziu um inventário. Claudina Brandina
  de Jesus está plenamente registrada porque *administrou* um espólio: a viuvez fez dela
  sujeito de direito que jurou, declarou e assinou. Maria Joaquina não fez nem uma coisa
  nem outra — morreu antes do marido e nunca chefiou uma casa em juízo — e por isso
  sobrevive numa única oração subordinada, com o próprio prenome em aberto. Nada de sua
  vida explica a diferença; apenas sua posição em relação a um inventário.

  - **Uma ausência litigada ainda é uma presença** [PROVEN as datas / INFERRED a leitura].
  Justamente por ter morrido antes de liquidado o espólio do sogro, sua quota teve de ser
  representada em vez de recebida, e é essa representação que a partilha de 1876, sua
  anulação em 1882 e os embargos intermediários disputaram. Uma mulher com uma única
  menção incerta está no centro de catorze anos de litígio familiar.

  - **Se a leitura dos embargos se sustentar, a história da riqueza da família muda de
  forma** [OPEN — explicitamente não resolvido]. Na leitura disponível de PRB-0009, ela
  casou-se com os Toledo e o marido era o herdeiro de sangue. Na leitura não verificada de
  1882, era filha de Ladisláo e o marido, o afim — o que significa que o ramo que acabou
  detendo hipoteca sobre o principal espólio Toledo obteve seu direito sobre a propriedade
  Toledo *por meio dela*. As duas leituras produzem relatos materialmente diferentes de
  como o capital se moveu dentro desta família, e a evidência disponível não escolhe entre
  elas.

  ## Questões em aberto

  - Se era filha ou nora de Ladisláo (conflito nº 15 em P-0061), pendente de verificação
  da imagem dos embargos de 1882. [OPEN]

  - Seu prenome — a leitura "[Joa?]quina" no único registro que a nomeia. [OPEN]

  - Seus pais, nascimento e óbito. O óbito relatado de 16 de abril de 1866, na Fazenda do
  Socorro, precisa de verificação de imagem antes que qualquer evento de óbito seja
  criado. [LEAD]

  - Eventuais filhos de seu casamento com Francisco Leocádio de Toledo. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0009 (título de herdeiros do inventário de Ladisláo de 1867 — nomeia-a, com
  incerteza, como esposa falecida de Francisco Leocádio — além do fólio suplementar dos
  embargos de 1881 juntado aos mesmos autos).

  ## Contexto regional e migratório

  Nenhum lugar próprio lhe é registrado. Pertence ao núcleo Fazenda da Concórdia / Fazenda
  do Socorro, na zona da mata do Rio Pardo (Leopoldina), sede da família Toledo na
  fronteira cafeeira, e os únicos autos que a nomeiam correram em Leopoldina. [CONTEXTUAL]

  ## Onde ir hoje

