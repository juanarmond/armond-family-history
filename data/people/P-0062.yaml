profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** The devotional surname "de Jesus" that she shared with Mathilde Maria de Jesus and Claudina Brandina de Jesus was a common practice among Brazilian women of the period: a fixed surname was replaced by a devotional particle, making lineage tracing structurally difficult for all three women simultaneously.

  - **[INFERRED]** The phrase "casado que foi com" applied to her husband in PRB-0009 indicates she predeceased Francisco Leocádio; if the apparent death date of ~16 April 1866 at the Fazenda do Socorro is correct, she died just five months before José Cezário (September 1866) — two deaths on the same family estate cluster in a single year.

  - **[CONTEXTUAL]** Women named only in their husbands' estate proceedings, without independent vital records, are among the most documentation-invisible individuals of 19th-century Zona da Mata Brazil — her entire documentary footprint is a single mention in one probate source (PRB-0009), which itself required expert reading to confirm.

  - **[INFERRED]** The uncertainty in her identification — she is named with caveats in every entry referencing her — reflects the fundamental limit of the existing source base; additional register searches for Leopoldina-area deaths c.1860–1870 are the only way to resolve it, and those registers remain only partially indexed.

  ## Identity

  **Maria Joaquina de Jesus** — named with uncertainty in the 1867 Ladisláo inventário
  (PRB-0009): "casado que foi com Maria [Joa?]quina de Jesus"; the first part of the given
  name reads "[Joa?]quina" in the cursive, most likely "Joaquina" but an uncertain read
  [PROVEN existence, uncertain name]. Wife of Francisco Leocádio de Toledo (P-0061), family
  F-0030. Nationality Brazilian; no birthplace or death date stated in any held record.

  - Whether she predeceased Francisco Leocádio is unclear; the "vivo casado que foi"
  phrasing may indicate he was already a widower at Ladisláo's death. A retrieval read of
  the 1879 inventário transcript (p.260) reports a certidão giving her death as 16 April
  1866 at the Fazenda do Socorro — [LEAD], not image-verified; no death event has been
  created.

  - PRB-0009 also carries an 1881 embargos supplement (folio 185, a held image): a 6 August
  1881 Leopoldina audiência that reopened Ladisláo's 1867 estate on behalf of Umbelina Ignez
  de Toledo and others. The 1882 judgment reported in the inventário transcript (p.383, image
  not verified [LEAD]) is said to have found that Maria Joaquina de Jesus SURVIVED Ladisláo
  and to have ordered the 1876 partition redone — which, if verified, would place her death
  after Ladisláo's (before 1862), broadly consistent with the 16 April 1866 death lead above.

  - See the material conflict on P-0061: the same 1882 embargos may make her Ladisláo's own
  daughter rather than only his daughter-in-law. [OPEN]

  ## Sources held (this repository)

  - PRB-0009 (1867 Ladisláo inventário título de herdeiros — names her, uncertainly, as
  Francisco Leocádio's wife — plus an 1881 embargos supplement folio filed in the same autos).
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** O apelido devocional "de Jesus" que partilhava com Mathilde Maria de Jesus e Claudina Brandina de Jesus era uma prática comum entre as mulheres brasileiras do período: um apelido fixo era substituído por uma partícula devocional, tornando o rastreamento da linhagem estruturalmente difícil para as três mulheres simultaneamente.

  - **[INFERRED]** A expressão "casado que foi com" aplicada ao marido no PRB-0009 indica que ela faleceu antes de Francisco Leocádio; se a data de óbito aparente de ~16 de Abril de 1866 na Fazenda do Socorro for correcta, morreu apenas cinco meses antes de José Cezário (Setembro de 1866) — dois óbitos no mesmo agregado familiar a espaço de um único ano.

  - **[CONTEXTUAL]** As mulheres nomeadas apenas nos processos de espólio dos maridos, sem registos vitais independentes, são alguns dos indivíduos mais invisíveis na documentação do século XIX na Zona da Mata brasileira — toda a sua pegada documental é uma única referência numa fonte de inventário (PRB-0009), que ela própria exigiu leitura especializada para ser confirmada.

  - **[INFERRED]** A incerteza na sua identificação — está nomeada com ressalvas em cada entrada que a referencia — reflecte o limite fundamental da base de fontes existente; pesquisas adicionais em registos de óbito da área de Leopoldina c.1860–1870 são a única forma de a resolver, e esses registos permanecem apenas parcialmente indexados.

  ## Identidade

  **Maria Joaquina de Jesus** — nomeada com incerteza no inventário de Ladisláo de 1867
  (PRB-0009): "casado que foi com Maria [Joa?]quina de Jesus"; a primeira parte do prenome
  lê-se "[Joa?]quina" na letra cursiva, muito provavelmente "Joaquina", mas de leitura
  incerta [PROVEN a existência, o nome incerto]. Esposa de Francisco Leocádio de Toledo
  (P-0061), família F-0030. Nacionalidade brasileira; nenhum local de nascimento ou data de
  óbito é declarado em qualquer registro disponível.

  - Se ela faleceu antes de Francisco Leocádio não está claro; a expressão "vivo casado que
  foi" pode indicar que ele já era viúvo por ocasião do óbito de Ladisláo. Uma leitura de
  recuperação da transcrição do inventário de 1879 (p.260) relata uma certidão que dá seu
  óbito em 16 de abril de 1866, na Fazenda do Socorro — [LEAD], não verificado por imagem;
  nenhum evento de óbito foi criado.

  - PRB-0009 também traz um suplemento dos embargos de 1881 (fólio 185, imagem disponível):
  uma audiência de 6 de agosto de 1881, em Leopoldina, que reabriu o inventário de 1867 de
  Ladisláo por parte de Umbelina Ignez de Toledo e outros. A sentença de 1882 relatada na
  transcrição do inventário (p.383, imagem não verificada [LEAD]) teria concluído que Maria
  Joaquina de Jesus SOBREVIVEU a Ladisláo e mandado refazer a partilha de 1876 — o que, se
  confirmado, situaria seu óbito depois do de Ladisláo (antes de 1862), em geral consistente
  com a pista de óbito em 16 de abril de 1866 acima.

  - Ver o conflito material em P-0061: os mesmos embargos de 1882 podem torná-la filha do
  próprio Ladisláo, e não apenas sua nora. [OPEN]

  ## Fontes disponíveis (neste repositório)

