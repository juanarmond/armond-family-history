profile: >-
  ## Interesting facts

  - **[PROVEN]** Recorded as "surdo e mudo" (deaf-mute) in the 1867 Ladisláo inventário
  (PRB-0009), yet his 1909 death record names him a **carpinteiro** — a skilled manual
  trade (CIV-0024). He married, was widowed, raised four children to adulthood and worked
  a craft.

  - **[PROVEN]** He died at the Fazenda da Concórdia in February 1909 — roughly thirty
  years after the family sold it. He is the last documented Toledo to live and die on the
  land his family had lost.

  - **[PROVEN]** In the 1867 estate proceedings he could not act for himself: Narciso
  Marques Braz signed "por Antônio Ladislao de Toledo" as his proxy (PRB-0009 p5),
  consistent with the disability the same document records.

  - **[CONTEXTUAL]** By 1909, when he died, Brazil had abolished slavery (1888),
  proclaimed the Republic (1889) and survived its first republican decade. He lived
  through the Empire's entire collapse — and through the abolition of the labour system on
  which his father's estate had rested.

  - **[CONTEXTUAL]** Brazil's only school for deaf children in his lifetime, the Imperial
  Instituto dos Surdos-Mudos, was founded in Rio de Janeiro in 1857 and taught a handful
  of pupils. For a deaf child on a Zona da Mata fazenda it was, in practice, out of reach:
  whatever he learned, he learned at home and in a workshop.

  - **[PROVEN]** He is the only child of Ladisláo and Mathilde whose disability is
  recorded, which makes him identifiable across documents despite a given name shared with
  his father and a nephew (PRB-0009, CIV-0024).

  ## Identity

  **António Ladislão de Toledo** (source *Antonio Ladislao de Tolledo*, PRB-0009;
  abbreviated *Antonio Toledo*, CIV-0024) [PROVEN]. Child #7 of Ladisláo Egídio Ferreira
  de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027), family F-0027 — a brother of the
  direct-line José Cezário (P-0054) and so an uncle of Eliza Balbina de Toledo (P-0017); a
  collateral. Listed "surdo e mudo" in the 1867 Ladisláo inventário. Recorded Brazilian,
  natural of Minas Gerais ("natural d'este Estado") and of cor branca [PROVEN — CIV-0024].

  - **Death:** 11 February 1909 at 9pm, Fazenda da Concórdia, Districto de Thebes,
  Leopoldina (MG), of a cardiac lesion, without medical attendance [PROVEN — CIV-0024,
  event E-0058]. Widower of Maria Euphronyza de Jesus; approximately 70 years of age,
  explicitly estimated by the informant ("setenta annos presumíveis"), so born
  c.1834–1839. Buried in the public cemetery of the Thebes district.

  - **Occupation:** carpinteiro [PROVEN — CIV-0024].

  - Do not confuse him with his father Ladisláo Egydio (P-0056), with the namesake
  grandson "Ladisláo Egydio Ferreira de Toledo, solteiro, 23 anos" of PRB-0006, or with
  the "Antonio Ladislau de Toledo" listed among José Cezário's children in the 1881
  certidão — three separate men in the same records.

  ## Standing and profession

  - **Carpinteiro** [PROVEN — CIV-0024]. The only occupation recorded for any of Ladisláo
  × Mathilde's eight children in the held sources. It is a manual trade, not a
  proprietor's description: a son of a slaveholding fazendeiro household earning by his
  hands.

  - **Resident at the Fazenda da Concórdia** [PROVEN — CIV-0024 places his death there in
  1909], on a property the family had sold around 1879–80 during Mathilde's probate. He
  was therefore living on it as an occupant rather than an owner for roughly the last
  three decades of his life.

  - **Legal capacity:** in the 1867 proceedings he appears through a proxy signature
  rather than his own hand (PRB-0009 p5). No autograph of his is held, and no literacy
  statement of any kind appears in the record. [UNCLASSIFIABLE]

  ## Family and social network

  - Parents: Ladisláo (P-0056) × Mathilde (P-0027). The 1909 record names them "Ladislao
  Igidio Ferreira de Toledo" and "Mathilde Luiza de Toledo" — the mother's surname a
  non-family informant's simplification of her "de Jesus" (P-0027).

  - Widower of Maria Euphronyza de Jesus (styled "Maria Eufrania/Euphrazia de Jesus" in
  the 1867 and 1879 estate lists). Four adult children are named in CIV-0024 — Francisco
  Themotheo de Toledo, José Ladislao de Toledo, Amélia (⚭ Frederico Augusto Rodrigues) and
  Mathilde (solteira) — recorded as research leads, not modelled. [LEAD]

  - His death was declared by José Bernado do Silva Junior, a *lavrador* resident in the
  district, on an atestado from Quirino Symphonio de Rezende and Francisco Barboza de
  Miranda — three men, none of them family. In rural Brazil the declarant was routinely
  whoever went to the cartório, so this should not be read as estrangement; it does show
  that his immediate neighbours, not his children, handled the formalities. [PROVEN —
  CIV-0024; the reading of it deliberately conservative]

  - Promoted from a documented_child on F-0027 to a person entity on the strength of
  CIV-0024, a primary civil death record.

  ## What we can extrapolate

  - **He is the counter-example that tests the whole inheritance argument** [INFERRED].
  The Toledo story is usually told as heritable land preserving a family's standing until
  partible succession and abolition dissolved it. He is an heir of exactly that estate — a
  numbered child of Ladisláo × Mathilde, entitled to a share of the Concórdia — who spent
  his life as a carpenter and died on the property as a resident of land his family no
  longer owned. An inheritance share in a twenty-two-year litigation is not a livelihood.
  What actually supported him was a trade.

  - **The descent into manual work does not begin in the 20th century** [INFERRED]. The
  family narrative locates the shift from proprietor to tradesman in the urban Armond
  descendants of the 1900s–1940s. His case shows the shift happening a full two
  generations earlier, inside the landed household itself, to an individual heir whose
  share was insufficient or inaccessible. Partible fragmentation does not push a whole
  family down a step at once; it pushes individual members off the bottom edge, one at a
  time, while the family as a whole still describes itself as landed.

  - **Disability compounded the structural disadvantage of a partible estate** [PROVEN
  facts / INFERRED reading]. He could not personally appear, swear or sign, so another man
  acted for him in 1867 — and his father's estate then ran in court until at least 1889.
  Twenty-two years of contested partition reward the heir who can attend audiences,
  instruct counsel and press a claim. Nothing in the record says he was disadvantaged in
  the division; everything in the structure of the proceedings suggests he was among the
  least able to influence it.

  - **A trade was the more transmissible asset** [INFERRED / CONTEXTUAL]. Carpentry could
  be practised with a disability that barred him from the spoken transactions of estate
  business, it required no capital he had to defend in court, it could not be divided
  among heirs, and abolition did not extinguish it. Measured against a land share that
  took decades to settle and a labour system that was legislated away, the craft looks
  less like a fall than like the only durable thing anyone in his generation held.

  - **His thirty years on the sold Concórdia are the family's quietest documented loss**
  [INFERRED]. The property left the family around 1879–80; he died on it in 1909. Whether
  he stayed as a tenant, a worker or by an arrangement with the buyer is not recorded, and
  should not be guessed. What the two dates establish is that the Toledo presence on the
  Concórdia outlasted Toledo ownership of it by roughly three decades, and that the person
  who represented that presence to the end was the son who owned nothing.

  ## Open questions

  - His exact birth year — the informant's "~70" is explicitly an estimate. An 1839 Bonfim
  population register showing a child "Antonio" aged about 5 in Ladisláo's household would
  place his birth c.1834, but that register is not catalogued here. [LEAD]

  - His marriage to Maria Euphronyza de Jesus, and her parentage. [OPEN]

  - On what basis he remained at the Fazenda da Concórdia after its sale — tenancy,
  employment, or an arrangement with the buyer. Nothing in the held record says. [OPEN]

  - His share in his father's estate, and whether it was ever paid out before the 1889
  partilha audiência. [OPEN]

  ## Sources held (this repository)

  - CIV-0024 (1909 civil death registration — death, parentage, occupation, widowerhood,
  cor, estimated age and four children) · PRB-0009 (1867 Ladisláo inventário — child #7,
  "surdo e mudo", represented by proxy at the louvação).

  ## Regional and migration context

  His whole recorded life is at the Fazenda da Concórdia (Thebes district, Leopoldina),
  the Toledo family seat in the zona da mata — where he was born, married, widowed and
  died. Alone among the men of this line he makes no migration at all: his father moved
  from the Barbacena highlands to the coffee frontier, his nephew Geraldo Augusto went to
  Rio de Janeiro as a shop employee, and the Armond descendants went on to Rio and Volta
  Redonda. He stayed on the one piece of ground the family had, and remained there after
  it stopped being theirs. [CONTEXTUAL]

  ## Where to go today

  - **Lived and died (1909):** Fazenda da Concórdia, distrito de Tebas (Leopoldina), MG
  [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **Burial (February 1909):** public cemetery of the Tebas district, Leopoldina, MG
  [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **His death registration:** Cartório de Registro Civil, distrito de Tebas / Fórum da
  Comarca de Leopoldina, MG (Rua Geraldo Campana 200) [RESOLVED — comarca] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Registrado como "surdo e mudo" no inventário de Ladisláo de 1867
  (PRB-0009), seu assento de óbito de 1909 no entanto o nomeia **carpinteiro** — um ofício
  manual qualificado (CIV-0024). Casou-se, enviuvou, criou quatro filhos até a idade
  adulta e exerceu um ofício.

  - **[PROVEN]** Morreu na Fazenda da Concórdia em fevereiro de 1909 — cerca de trinta
  anos depois de a família a ter vendido. É o último Toledo documentado a viver e morrer
  na terra que sua família perdera.

  - **[PROVEN]** Nos autos de 1867 não podia agir por si: Narciso Marques Braz assinou
  "por Antônio Ladislao de Toledo" como procurador (PRB-0009 p5), coerente com a
  deficiência que o mesmo documento registra.

  - **[CONTEXTUAL]** Em 1909, quando morreu, o Brasil havia abolido a escravidão (1888),
  proclamado a República (1889) e sobrevivido à sua primeira década republicana. Viveu
  todo o colapso do Império — e a abolição do sistema de trabalho sobre o qual o espólio
  de seu pai se assentava.

  - **[CONTEXTUAL]** A única escola para crianças surdas existente no Brasil em seu tempo,
  o Imperial Instituto dos Surdos-Mudos, foi fundada no Rio de Janeiro em 1857 e atendia
  um punhado de alunos. Para uma criança surda numa fazenda da Zona da Mata, estava na
  prática fora de alcance: o que quer que tenha aprendido, aprendeu em casa e numa
  oficina.

  - **[PROVEN]** É o único filho de Ladisláo e Mathilde cuja deficiência está registrada,
  o que o torna identificável entre documentos apesar de um prenome compartilhado com o
  pai e com um sobrinho (PRB-0009, CIV-0024).

  ## Identidade

  **António Ladislão de Toledo** (fonte *Antonio Ladislao de Tolledo*, PRB-0009; abreviado
  *Antonio Toledo*, CIV-0024) [PROVEN]. Filho nº 7 de Ladisláo Egídio Ferreira de Toledo
  (P-0056) × Mathilde Maria de Jesus (P-0027), família F-0027 — irmão do José Cezário da
  linha direta (P-0054) e, portanto, tio de Eliza Balbina de Toledo (P-0017); um
  colateral. Arrolado como "surdo e mudo" no inventário de Ladisláo de 1867. Registrado
  brasileiro, natural de Minas Gerais ("natural d'este Estado") e de cor branca [PROVEN —
  CIV-0024].

  - **Óbito:** 11 de fevereiro de 1909, às 21h, Fazenda da Concórdia, Districto de Thebes,
  Leopoldina (MG), por lesão cardíaca, sem assistência médica [PROVEN — CIV-0024, evento
  E-0058]. Viúvo de Maria Euphronyza de Jesus; com cerca de 70 anos, explicitamente
  estimados pelo informante ("setenta annos presumíveis"), portanto nascido por volta de
  1834–1839. Sepultado no cemitério público do distrito de Thebes.

  - **Ocupação:** carpinteiro [PROVEN — CIV-0024].

  - Não confundi-lo com seu pai Ladisláo Egydio (P-0056), com o neto homônimo "Ladisláo
  Egydio Ferreira de Toledo, solteiro, 23 anos" de PRB-0006, nem com o "Antonio Ladislau
  de Toledo" arrolado entre os filhos de José Cezário na certidão de 1881 — três homens
  distintos nos mesmos registros.

  ## Posição social e profissão

  - **Carpinteiro** [PROVEN — CIV-0024]. A única ocupação registrada para qualquer dos
  oito filhos de Ladisláo × Mathilde nas fontes disponíveis. É um ofício manual, não a
  descrição de um proprietário: um filho de casa de fazendeiro escravista ganhando a vida
  com as mãos.

  - **Residente na Fazenda da Concórdia** [PROVEN — CIV-0024 situa ali sua morte em 1909],
  numa propriedade que a família vendera por volta de 1879–80, durante o inventário de
  Mathilde. Vivia nela, portanto, como ocupante e não como dono, nas últimas três décadas
  de sua vida, aproximadamente.

  - **Capacidade jurídica:** nos autos de 1867 aparece por assinatura de procurador, e não
  de próprio punho (PRB-0009 p5). Nenhum autógrafo seu está disponível, e nenhuma
  declaração de letramento de qualquer tipo consta do registro. [UNCLASSIFIABLE]

  ## Família e rede social

  - Pais: Ladisláo (P-0056) × Mathilde (P-0027). O assento de 1909 os nomeia "Ladislao
  Igidio Ferreira de Toledo" e "Mathilde Luiza de Toledo" — o sobrenome da mãe sendo
  simplificação de um informante não familiar para seu "de Jesus" (P-0027).

  - Viúvo de Maria Euphronyza de Jesus (grafada "Maria Eufrania/Euphrazia de Jesus" nas
  listas de herdeiros de 1867 e 1879). Quatro filhos adultos são nomeados em CIV-0024 —
  Francisco Themotheo de Toledo, José Ladislao de Toledo, Amélia (⚭ Frederico Augusto
  Rodrigues) e Mathilde (solteira) — registrados como pistas de pesquisa, não modelados.
  [LEAD]

  - Seu óbito foi declarado por José Bernado do Silva Junior, *lavrador* residente no
  distrito, com atestado de Quirino Symphonio de Rezende e Francisco Barboza de Miranda —
  três homens, nenhum deles da família. No Brasil rural, o declarante era rotineiramente
  quem fosse ao cartório, de modo que isso não deve ser lido como afastamento; mostra,
  sim, que foram seus vizinhos imediatos, e não seus filhos, que cuidaram das
  formalidades. [PROVEN — CIV-0024; a leitura deliberadamente conservadora]

  - Promovido de documented_child em F-0027 a entidade de pessoa com base em CIV-0024,
  registro civil primário de óbito.

  ## O que podemos extrapolar

  - **Ele é o contraexemplo que põe à prova todo o argumento sobre herança** [INFERRED]. A
  história Toledo costuma ser contada como terra hereditária preservando a posição de uma
  família até que a sucessão partível e a abolição a dissolveram. Ele é herdeiro
  exatamente desse espólio — filho numerado de Ladisláo × Mathilde, com direito a uma
  parte da Concórdia — e passou a vida como carpinteiro, morrendo na propriedade como
  morador de terra que sua família já não possuía. Uma quota de herança dentro de um
  litígio de vinte e dois anos não é meio de vida. O que de fato o sustentou foi um
  ofício.

  - **A descida ao trabalho manual não começa no século XX** [INFERRED]. A narrativa
  familiar situa a passagem de proprietário a artesão nos descendentes Armond urbanos dos
  anos 1900–1940. O caso dele mostra a passagem ocorrendo duas gerações inteiras antes,
  dentro da própria casa fundiária, para um herdeiro individual cuja quota foi
  insuficiente ou inacessível. A fragmentação partível não empurra uma família inteira um
  degrau abaixo de uma vez; empurra membros individuais para fora da borda, um a um,
  enquanto a família como um todo ainda se descreve como proprietária.

  - **A deficiência agravou a desvantagem estrutural de um espólio partível** [PROVEN os
  fatos / INFERRED a leitura]. Não podia comparecer, jurar ou assinar pessoalmente, de
  modo que outro homem agiu por ele em 1867 — e o espólio de seu pai correu em juízo até
  ao menos 1889. Vinte e dois anos de partilha contestada premiam o herdeiro capaz de
  comparecer a audiências, instruir advogado e pressionar sua pretensão. Nada no registro
  diz que foi prejudicado na divisão; tudo na estrutura do processo sugere que estava
  entre os menos capazes de influenciá-la.

  - **Um ofício era o ativo mais transmissível** [INFERRED / CONTEXTUAL]. A carpintaria
  podia ser exercida com uma deficiência que o excluía das transações faladas dos negócios
  do espólio, não exigia capital que ele tivesse de defender em juízo, não podia ser
  dividida entre herdeiros e a abolição não a extinguiu. Medido contra uma quota de terra
  que levou décadas para ser liquidada e um sistema de trabalho legislado para fora de
  existência, o ofício parece menos uma queda do que a única coisa durável que alguém de
  sua geração deteve.

  - **Seus trinta anos na Concórdia vendida são a perda documentada mais silenciosa da
  família** [INFERRED]. A propriedade saiu da família por volta de 1879–80; ele morreu
  nela em 1909. Se permaneceu como arrendatário, como trabalhador ou por arranjo com o
  comprador, não está registrado, e não se deve adivinhar. O que as duas datas estabelecem
  é que a presença Toledo na Concórdia sobreviveu à propriedade Toledo sobre ela por cerca
  de três décadas, e que quem representou essa presença até o fim foi o filho que nada
  possuía.

  ## Questões em aberto

  - Seu ano exato de nascimento — os "~70" do informante são explicitamente uma
  estimativa. Um registro populacional de Bonfim de 1839, mostrando uma criança "Antonio"
  de cerca de 5 anos no domicílio de Ladisláo, situaria seu nascimento por volta de 1834,
  mas esse registro não está catalogado aqui. [LEAD]

  - Seu casamento com Maria Euphronyza de Jesus e a filiação dela. [OPEN]

  - Com que base permaneceu na Fazenda da Concórdia após a venda — arrendamento, emprego
  ou arranjo com o comprador. Nada no registro disponível o diz. [OPEN]

  - Sua quota no espólio do pai, e se chegou a ser paga antes da audiência de partilha de
  1889. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0024 (registro civil de óbito de 1909 — morte, filiação, ocupação, viuvez, cor,
  idade estimada e quatro filhos) · PRB-0009 (inventário de Ladisláo de 1867 — filho nº 7,
  "surdo e mudo", representado por procurador na louvação).

  ## Contexto regional e migratório

  Toda a sua vida registrada transcorre na Fazenda da Concórdia (distrito de Thebes,
  Leopoldina), a sede da família Toledo na zona da mata — onde nasceu, casou-se, enviuvou
  e morreu. Sozinho entre os homens desta linha, não faz migração alguma: seu pai mudou-se
  dos planaltos de Barbacena para a fronteira cafeeira, seu sobrinho Geraldo Augusto foi
  para o Rio de Janeiro como empregado do comércio, e os descendentes Armond seguiram para
  o Rio e Volta Redonda. Ele ficou no único pedaço de chão que a família tinha, e nele
  permaneceu depois que deixou de ser dela. [CONTEXTUAL]

