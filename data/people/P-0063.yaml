profile: >-
  ## Identity

  **António Ladislão de Toledo** (source *Antonio Ladislao de Tolledo*, PRB-0009;
  abbreviated *Antonio Toledo*, CIV-0024) [PROVEN]. Child #7 of Ladisláo Egídio Ferreira de
  Toledo (P-0056) × Mathilde Maria de Jesus (P-0027), family F-0027 — a brother of the
  direct-line José Cezário (P-0054); a collateral. Listed "surdo e mudo" (deaf-mute) in the
  1867 Ladisláo inventário (PRB-0009). Nationality Brazilian.

  - **Death:** 11 February 1909 at 9pm, Fazenda da Concórdia, Districto de Thebes,
  Leopoldina (MG), of a cardiac lesion, without medical attendance [PROVEN — CIV-0024,
  event E-0058]. Widower of Maria Euphronyza de Jesus; approximately 70 years of age
  (estimated by a non-family informant, so born c.1834–1839). Buried in the public cemetery
  of Thebes.

  - **Occupation:** carpinteiro [PROVEN — CIV-0024].

  ## Family and social network

  - Parents: Ladisláo (P-0056) × Mathilde (P-0027). The 1909 record names them "Ladislao
  Igidio Ferreira de Toledo" and "Mathilde Luiza de Toledo" — the mother's surname a
  non-family informant's simplification of her "de Jesus" (P-0027).

  - Widower of Maria Euphronyza de Jesus. Four adult children are named in CIV-0024 —
  Francisco Themotheo de Toledo, José Ladislao de Toledo, Amélia (⚭ Frederico Augusto
  Rodrigues) and Mathilde (solteira) — recorded as research leads, not modelled. [LEAD]

  - Promoted from a documented_child on F-0027 to a person entity on the strength of
  CIV-0024 (a primary civil death record).

  ## What we can extrapolate

  A deaf-mute son who nonetheless married, was widowed, worked as a carpenter and lived to
  old age at the family's Fazenda da Concórdia — represented by proxy (Narciso Marques Braz)
  in the 1867 estate proceedings, consistent with his condition. [INFERRED] A 1839 Bonfim
  population register showing a child "Antonio" aged ~5 in Ladisláo's household would place
  his birth c.1834 — [LEAD], not catalogued.

  ## Open questions

  - His exact birth year — the informant's "~70" is an estimate. [OPEN]

  ## Sources held (this repository)

  - CIV-0024 (1909 civil death registration — death, parentage, occupation, widowerhood and
  four children). He is also listed as child #7, "surdo e mudo", in the 1867 Ladisláo
  inventário (PRB-0009).

  ## Regional and migration context

  His whole recorded life is at the Fazenda da Concórdia (Thebes district, Leopoldina), the
  Toledo family seat in the zona da mata — where he was born, married, widowed and died.
  [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **António Ladislão de Toledo** (fonte *Antonio Ladislao de Tolledo*, PRB-0009; abreviado
  *Antonio Toledo*, CIV-0024) [PROVEN]. Filho nº 7 de Ladisláo Egídio Ferreira de Toledo
  (P-0056) × Mathilde Maria de Jesus (P-0027), família F-0027 — um irmão do José Cezário da
  linha direta (P-0054); um colateral. Listado "surdo e mudo" no inventário de Ladisláo de
  1867 (PRB-0009). Nacionalidade brasileira.

  - **Óbito:** 11 de fevereiro de 1909, às 21h, na Fazenda da Concórdia, Districto de
  Thebes, Leopoldina (MG), por uma lesão cardíaca, sem assistência médica [PROVEN —
  CIV-0024, evento E-0058]. Viúvo de Maria Euphronyza de Jesus; com aproximadamente 70 anos
  de idade (estimados por informante não familiar, portanto nascido por volta de
  1834–1839). Sepultado no cemitério público de Thebes.

  - **Ocupação:** carpinteiro [PROVEN — CIV-0024].

  ## Família e rede social

  - Pais: Ladisláo (P-0056) × Mathilde (P-0027). O registro de 1909 os nomeia "Ladislao
  Igidio Ferreira de Toledo" e "Mathilde Luiza de Toledo" — o sobrenome da mãe sendo uma
  simplificação de informante não familiar do "de Jesus" dela (P-0027).

  - Viúvo de Maria Euphronyza de Jesus. Quatro filhos adultos são nomeados em CIV-0024 —
  Francisco Themotheo de Toledo, José Ladislao de Toledo, Amélia (⚭ Frederico Augusto
  Rodrigues) e Mathilde (solteira) — registrados como pistas de pesquisa, não modelados.
  [LEAD]

  - Promovido de documented_child em F-0027 a entidade de pessoa com base em CIV-0024 (um
  registro civil primário de óbito).

  ## O que podemos extrapolar

  Um filho surdo-mudo que, ainda assim, casou-se, enviuvou, trabalhou como carpinteiro e
  viveu até idade avançada na Fazenda da Concórdia da família — representado por procurador
  (Narciso Marques Braz) nos autos do espólio de 1867, condizente com sua condição.
  [INFERRED] Um registro populacional de Bonfim de 1839 mostrando uma criança "Antonio" com
  ~5 anos no domicílio de Ladisláo situaria seu nascimento por volta de 1834 — [LEAD], não
  catalogado.

  ## Questões em aberto

  - Seu ano exato de nascimento — o "~70" do informante é uma estimativa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0024 (registro civil de óbito de 1909 — óbito, filiação, ocupação, viuvez e quatro
  filhos). Ele também é listado como filho nº 7, "surdo e mudo", no inventário de Ladisláo
  de 1867 (PRB-0009).

  ## Contexto regional e migratório

  Toda a sua vida registrada situa-se na Fazenda da Concórdia (distrito de Thebes,
  Leopoldina), a sede da família Toledo na zona da mata — onde nasceu, casou-se, enviuvou e
  morreu. [CONTEXTUAL]
