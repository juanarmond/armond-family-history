notes:
- text: >-
    Ahnentafel position 31 — mother of Celina (Selina) Bohrer (P-0015). Named as
    "Lucinda Ferreira da Silva Bohrer" in Celina's 1977 death (CIV-0015) and as
    "Lucinda Ferreira Bohrer" (maternal grandmother, "já falecidos") in the 1924
    Nova Friburgo birth (CIV-0016). "Ferreira da Silva" is her own surname and
    "Bohrer" her married name; both variants are preserved. A Nova Friburgo (RJ)
    family; no record of her own has been located.
