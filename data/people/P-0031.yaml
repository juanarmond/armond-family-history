profile: >-
  ## Identity

  **Lucinda Ferreira da Silva** (married *Lucinda Ferreira da Silva Bohrer*; also *Lucinda
  Ferreira Bohrer*) [PROVEN]. Wife of Joaquim José Bohrer (P-0030) and mother of Celina
  (Selina) Bohrer (P-0015).

  - **Born:** 10 August 1862 in Rio de Janeiro (Corte), baptised 16 March 1863 at the
  Matriz de São João Baptista da Lagoa [PROVEN — PAR-0077]. This corrects the earlier
  "natural desta Freguezia" (Nova Friburgo, RJ) reading from her son Alberto's 1890 birth
  (CIV-0019), now preserved as an informant-reported conflict — the Silva-Ferreira family
  was in Rio in 1862-63 and returned to Nova Friburgo later.

  - **Parents:** Antonio da Silva Ferreira (P-0036) and Maria Joanna da Silva Ferreira
  (P-0037) [PROVEN] — named as the maternal grandparents in her son Alberto's 1890 birth
  (CIV-0019).

  - **Marriage:** to Joaquim José Bohrer (P-0030) on 19 April 1884 at the Nova Friburgo Matriz
  de São João Baptista, aged 21 [PROVEN — her own marriage act PAR-0056, event E-0085]. That act
  records her "nascida e baptisada na freguezia de S. João Baptista da Lagoa, na Corte" (Rio),
  independently corroborating her 1863 Rio baptism (PAR-0077).

  - **Children:** Alberto (1890), an infant son (1891–92), Antonio José (d. 1899, aged 13),
  Celina / Selina (P-0015, b. 13 May 1899, PAR-0057), Etelvina (b. 1900, baptised 1902,
  PAR-0075) and Lucinda Maria (b. 26 July 1908, PAR-0052) — later Lucinda Bohrer Moreira, d. 1996
  (CIV-0032). The 1908 baptism and 1996 death name one woman [STRONG-EVIDENCE] (same 26 July
  birthday and parents; the death's "1909" is informant-reported) — see P-0030. [PROVEN]

  - **Death:** already deceased by 1924 (recorded "já falecidos" with her husband on
  Eunir's 1924 birth, CIV-0016) and named as Celina's deceased mother in 1977 (CIV-0015)
  [PROVEN of the bound]; exact date not held. [OPEN]

  ## Standing and profession

  - No occupation or record of her own is held [PROVEN of the gap]. Her married household
  was that of a Nova Friburgo negociante at the Alto da Serra (her husband's trade and
  residence, CIV-0019). "Ferreira da Silva" is her own surname and "Bohrer" her married
  name; both variants are preserved.

  ## Family and social network

  She married into the Borer colonist line and carried the Ferreira da Silva family into
  it. She appears only as wife and mother across the held registers, never as declarant —
  consistent with a woman who predeceased the generation that would have registered her.
  [INFERRED]

  ## What we can extrapolate

  Her married household — a Nova Friburgo *negociante*'s at the Alto da Serra (CIV-0019) — places
  her in the **petty-merchant band the colony's descendants reached at their modest local peak**
  [INFERRED/CONTEXTUAL]: standing of position, not heritable landed capital. Like the rest of this
  line she carries no landed estate and no inherited office; its wealth was commerce, contingent
  on the town's economy [CONTEXTUAL]. This is the inverse of the Armond exemplar, which fell into
  the 20th-century urban working class *from* an office-and-marriage elite — here there was no
  elite to fall from, and the next generation simply urbanizes into that same working class.
  [INFERRED]

  ## Open questions

  - Her death record — not held; would fix her death date. (Her marriage is now held —
  PAR-0056, 19 April 1884; her birth and baptism are held — PAR-0077, Rio de Janeiro, which
  also independently confirms her parents.) [OPEN]

  ## Sources held (this repository)

  - PAR-0077 (her own 1863 Rio de Janeiro baptism — her birth date, birthplace and
  parents) · PAR-0056 (her own 1884 Nova Friburgo marriage to Joaquim — 19 April 1884, aged 21,
  Rio birthplace corroborated) · CIV-0019 (son Alberto's 1890 birth — names her, her husband and
  her parents) · CIV-0020 (infant son's 1891 birth) · CIV-0015 (daughter Celina's 1977 death) ·
  CIV-0016 (granddaughter Eunir's 1924 birth, naming her a deceased maternal grandmother).

  - PAR-0057 (daughter Celina's 1899 baptism) · PAR-0075 (daughter Etelvina's 1902 baptism) ·
  PAR-0052 (daughter Lucinda Maria's 1908 baptism) · CIV-0032 (the same daughter's 1996 Volta
  Redonda death, as Lucinda Bohrer Moreira) — all naming her as mother.

  ## Regional and migration context

  Her Brazilian nationality follows jus soli from her 1862 Rio de Janeiro birth (PAR-0077).
  Born in the Corte in 1862, she was in Nova Friburgo by the time she married and lived her
  documented adult life in the colony town (RJ); the move out of the colony came with a
  later generation. [CONTEXTUAL]

  ## Where to go today

  - **Marriage (19 Apr 1884, held) and death (not held) parish:** Catedral Diocesana / Igreja
  Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro,
  CEP 28610-390) — her marriage act (PAR-0056) is held; her death record is not. [RESOLVED for
  the marriage] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Baptism (already held, 1863):** Matriz de São João Baptista da Lagoa, Rio de Janeiro
  (Corte) — her own baptism (PAR-0077) is held. [RESOLVED]
profile_pt: >-
  ## Identidade

  **Lucinda Ferreira da Silva** (de casada *Lucinda Ferreira da Silva Bohrer*; também
  *Lucinda Ferreira Bohrer*) [PROVEN]. Esposa de Joaquim José Bohrer (P-0030) e mãe de
  Celina (Selina) Bohrer (P-0015).

  - **Nascimento:** 10 de agosto de 1862 no Rio de Janeiro (Corte), baptizada em 16 de
  março de 1863 na Matriz de São João Baptista da Lagoa [PROVEN — PAR-0077]. Isso corrige
  a leitura anterior "natural desta Freguezia" (Nova Friburgo, RJ) do nascimento de 1890
  de seu filho Alberto (CIV-0019), agora preservada como conflito relatado pelo informante
  — a família Silva-Ferreira estava no Rio em 1862-63 e retornou a Nova Friburgo depois.

  - **Pais:** Antonio da Silva Ferreira (P-0036) e Maria Joanna da Silva Ferreira (P-0037)
  [PROVEN] — nomeados como avós maternos no nascimento de 1890 de seu filho Alberto
  (CIV-0019).

  - **Casamento:** com Joaquim José Bohrer (P-0030) em 19 de abril de 1884 na Matriz de São
  João Baptista de Nova Friburgo, aos 21 anos [PROVEN — seu próprio ato de casamento PAR-0056,
  evento E-0085]. Esse ato a registra "nascida e baptisada na freguezia de S. João Baptista da
  Lagoa, na Corte" (Rio), corroborando de forma independente seu batismo de 1863 no Rio
  (PAR-0077).

  - **Filhos:** Alberto (1890), um filho menino (1891–92), Antonio José (f. 1899, aos 13 anos),
  Celina / Selina (P-0015, n. 13 de maio de 1899, PAR-0057), Etelvina (n. 1900, baptizada em
  1902, PAR-0075) e Lucinda Maria (n. 26 de julho de 1908, PAR-0052) — depois Lucinda Bohrer
  Moreira, f. 1996 (CIV-0032). O batismo de 1908 e o óbito de 1996 são a mesma mulher
  [STRONG-EVIDENCE] (mesmo aniversário, 26 de julho, e mesmos pais; o "1909" do óbito é declarado
  pelo informante) — ver P-0030. [PROVEN]

  - **Óbito:** já falecida em 1924 (registrada "já falecidos" com o marido no nascimento de
  1924 de Eunir, CIV-0016) e nomeada como mãe falecida de Celina em 1977 (CIV-0015) [PROVEN
  quanto ao limite]; data exata não obtida. [OPEN]

  ## Posição social e profissão

  - Nenhuma ocupação ou registro próprio está disponível [PROVEN quanto à lacuna]. Seu lar
  de casada era o de um negociante de Nova Friburgo no Alto da Serra (a profissão e a
  residência do marido, CIV-0019). "Ferreira da Silva" é seu sobrenome próprio e "Bohrer" o
  nome de casada; ambas as variantes são preservadas.

  ## Família e rede social

  Casou-se com a linha colona Borer e trouxe para ela a família Ferreira da Silva. Aparece
  apenas como esposa e mãe nos registros disponíveis, nunca como declarante — coerente com
  uma mulher que faleceu antes da geração que a teria registrado. [INFERRED]

  ## O que podemos extrapolar

  Seu lar de casada — o de um *negociante* de Nova Friburgo no Alto da Serra (CIV-0019) — a situa
  na **faixa de pequenos comerciantes que os descendentes da colônia alcançaram em seu modesto
  pico local** [INFERRED/CONTEXTUAL]: posição de status, não capital fundiário herdável. Como o
  restante desta linha, ela não carrega patrimônio fundiário nem cargo herdado; sua riqueza era o
  comércio, contingente à economia da cidade [CONTEXTUAL]. Isso é o inverso do exemplo Armond, que
  caiu na classe trabalhadora urbana do século XX *a partir de* uma elite de cargos e de
  casamento — aqui não havia elite da qual cair, e a geração seguinte simplesmente se urbaniza
  nessa mesma classe trabalhadora. [INFERRED]

  ## Questões em aberto

  - Seu registro de óbito — não obtido; fixaria sua data de óbito. (Seu casamento está agora
  obtido — PAR-0056, 19 de abril de 1884; seu nascimento e batismo estão obtidos — PAR-0077, Rio
  de Janeiro, que também confirma de forma independente seus pais.) [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0077 (seu próprio batismo de 1863 no Rio de Janeiro — data e local de nascimento e
  os pais) · PAR-0056 (seu próprio casamento de 1884 em Nova Friburgo com Joaquim — 19 de abril
  de 1884, aos 21 anos, local de nascimento no Rio corroborado) · CIV-0019 (nascimento de 1890
  do filho Alberto — nomeia ela, o marido e os pais dela) · CIV-0020 (nascimento de 1891 do
  filho menino) · CIV-0015 (óbito de 1977 da filha Celina) · CIV-0016 (nascimento de 1924 da
  neta Eunir, nomeando-a avó materna falecida).

  - PAR-0057 (batismo de 1899 da filha Celina) · PAR-0075 (batismo de 1902 da filha Etelvina) ·
  PAR-0052 (batismo de 1908 da filha Lucinda Maria) · CIV-0032 (óbito de 1996 da mesma filha, como
  Lucinda Bohrer Moreira, em Volta Redonda) — todos nomeando-a como mãe.

  ## Contexto regional e migratório

  Sua nacionalidade brasileira decorre do jus soli, por nascimento no Rio de Janeiro em
  1862 (PAR-0077). Nascida na Corte em 1862, já estava em Nova Friburgo quando se casou e
  viveu sua vida adulta documentada na cidade colonial (RJ); a saída da colônia veio com
  uma geração posterior. [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de casamento (19 abr 1884, obtido) e óbito (não obtido):** Catedral Diocesana /
  Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23,
  Centro, CEP 28610-390) — seu ato de casamento (PAR-0056) está obtido; seu registro de óbito
  não. [RESOLVED quanto ao casamento] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Batismo (já obtido, 1863):** Matriz de São João Baptista da Lagoa, Rio de Janeiro
  (Corte) — seu próprio batismo (PAR-0077) está obtido. [RESOLVED]
