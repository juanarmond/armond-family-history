  ## Contexto regional e migratório

  Sua nacionalidade brasileira decorre do jus soli, por nascimento no Rio de Janeiro em
  1862 (PAR-0077). Nascida na Corte em 1862, já estava em Nova Friburgo quando se casou e
  viveu sua vida adulta documentada na cidade colonial (RJ); a saída da colônia veio com
  uma geração posterior. [CONTEXTUAL]

  - **Uma infância em movimento.** Seus pais casaram-se em Nova Friburgo em 1859 (PAR-0070); ela
  nasceu no Rio em 1862 (PAR-0077); seu irmão Octávio nasceu em Aparecida (RJ) por volta de 1868
  (CIV-0036) e sua irmã Maria da Gloria em Nova Friburgo por volta de 1876 (CIV-0037) [PROVEN, etapa
  por etapa] — portanto, provavelmente cresceu em parte fora da colônia e estava de volta a ela, no
  mais tardar, no início da adolescência. [INFERRED]

  - **Vida de casada.** No Alto da Serra, na freguesia de São João Baptista, em 1890–91, onde o
  marido comerciava (CIV-0019, CIV-0020) [PROVEN]; em 1899–1908 os eventos da família ocorrem no
  distrito de São Pedro de Nova Friburgo (NWS-0006, PAR-0052) [PROVEN], o que sugere que o
  domicílio se mudara mais para dentro dos distritos rurais [INFERRED].

