profile: >-
  ## Interesting facts

  - **[PROVEN]** She was born not in Nova Friburgo but in Rio de Janeiro (the Imperial Corte) on 10 August 1862 — her 1863 baptism record places her at the Matriz de São João Baptista da Lagoa (PAR-0077), and her 1884 marriage corroborates this independently. Her family was in Rio in 1862–63 before returning to Nova Friburgo.

  - **[CONTEXTUAL]** She was born in the final years of the Second Empire: 1862 Rio de Janeiro was the capital of a slave-holding Empire whose court life was still at its peak. Her father Antonio da Silva Ferreira was a Portuguese immigrant, making her the daughter of an immigrant and the wife of a Swiss-descent colonist — a family that bridged three immigrant streams at Nova Friburgo.

  - **[INFERRED]** She married into the Bohrer family on 19 April 1884 — five years before the Republic and the civil registration law of 1889 — so her marriage was recorded in the old parish registers (PAR-0056), not the new civil cartório system that would govern her children's births.

  - **[CONTEXTUAL]** Nova Friburgo in 1884 was entering its textile and commerce phase: the highland Swiss-German colonists had pivoted from farming to trade, and her husband Joaquim's household as a *negociante* at the Alto da Serra was representative of where colonist descendants had arrived by the 1880s — modest commercial standing, not landed wealth.

  - **[INFERRED]** She was born in Rio, married in Nova Friburgo, and had died by 1923 (CIV-0038) — never documented in Volta Redonda. The move to the CSN steel city was her daughter Celina's and son-in-law João's generation, not hers.

  ## Identity

  **Lucinda Ferreira da Silva** (married *Lucinda Ferreira da Silva Bohrer*; also *Lucinda
  Ferreira Bohrer*) [PROVEN]. Wife of Joaquim José Bohrer (P-0030) and mother of Celina
  (Selina) Bohrer (P-0015). Her fullest recorded form is **Lucinda Roschemant da Silva
  Ferreira**, in her own 1884 marriage (PAR-0056) — the "Roschemant" carrying her mother's
  Rutschmann surname [PROVEN]. Her children's baptisms write her variously as "Lucinda Ferreira
  Bor[b]er" (PAR-0057, PAR-0078), "Lucinda da Silva Ferreira Berber" (PAR-0079), "Lucinda da
  Silva Borber" (PAR-0075) and "Lucinda Silva Ferreira Bor[b]er" (PAR-0052); her own 1863
  baptism gives her forename only (PAR-0077).

  - **Born:** 10 August 1862 in Rio de Janeiro (Corte), baptised 16 March 1863 at the
  Matriz de São João Baptista da Lagoa [PROVEN — PAR-0077]. This corrects the earlier
  "natural desta Freguezia" (Nova Friburgo, RJ) reading from her son Alberto's 1890 birth
  (CIV-0019), now preserved as an informant-reported conflict — the Silva-Ferreira family
  was in Rio in 1862-63 and returned to Nova Friburgo later.

  - **Parents:** Antonio da Silva Ferreira (P-0036) and Maria Joanna da Silva Ferreira
  (P-0037) [PROVEN] — named in her own 1863 baptism (PAR-0077) and her own 1884 marriage
  (PAR-0056), two independent originals, and again as the maternal grandparents in her son
  Alberto's 1890 birth (CIV-0019).

  - **Marriage:** to Joaquim José Bohrer (P-0030) on 19 April 1884 at the Nova Friburgo Matriz
  de São João Baptista, aged 21 [PROVEN — her own marriage act PAR-0056, event E-0085]. That act
  records her "nascida e baptisada na freguezia de S. João Baptista da Lagoa, na Corte" (Rio),
  independently corroborating her 1863 Rio baptism (PAR-0077).

  - **Children:** Alberto (1890), an infant son (1891–92), Antonio José (d. 1899, aged 13),
  Celina / Selina (P-0015, b. 13 May 1899, PAR-0057), Etelvina (b. 1900, baptised 1902,
  PAR-0075), Joaquim Carlos (b. 6 January 1896, PAR-0078), Renato (b. 12 September 1897,
  baptised 1898, PAR-0079) and Lucinda Maria (b. 26 July 1908, PAR-0052) — later Lucinda Bohrer
  Moreira, d. 1996 (CIV-0032). The 1908 baptism and 1996 death name one woman [STRONG-EVIDENCE]
  (same 26 July birthday and parents; the death's "1909" is informant-reported) — see P-0030.
  [PROVEN] Two qualifications: Antonio José's death notice names only his father (NWS-0006), so
  her motherhood of him rests on the dates — born c.1885–86, after her 1884 marriage, with no
  other wife of Joaquim documented [INFERRED; BORDERLINE]; and the 1891 infant son's given name
  falls on a folio the held image does not capture (CIV-0020) — the retrieval research reads
  it as João [LEAD]. The retrieval research also carries three further sons known only from
  the FamilySearch tree — Francisco José (1885–1973), Joaquim José Júnior (1899–1970) and
  Álvaro José — with no record found for any of them [LEAD — tree only, not modelled].

  - **Death:** already deceased by 1923, when a granddaughter's birth registration calls her
  "já fallecida" (CIV-0038), again "já fallecida" on Eunir's 1924 birth (CIV-0016), and named
  as Celina's deceased mother in 1977 (CIV-0015) [PROVEN of the bound]; [Corrected 2026-10-08
  from the image: CIV-0016 uses the singular "fallecida" — only she, not her husband, is marked
  deceased in 1924;]
  exact date not held. [OPEN] A death in 1921 is reported by a genealogy blog and the
  FamilySearch tree [LEAD]; the retrieval research reports searching the Nova Friburgo
  cathedral death register gap-free from November 1919 to May 1924 without finding her
  [LEAD — negative search by the retrieval side], so the death was probably registered
  elsewhere.

  ## Standing and profession

  - No occupation or record of her own is held [PROVEN of the gap]. Her married household
  was that of a Nova Friburgo negociante at the Alto da Serra (her husband's trade and
  residence, CIV-0019). "Ferreira da Silva" is her own surname and "Bohrer" her married
  name; both variants are preserved.

  ## Family and social network

  She married into the Borer colonist line and carried the Ferreira da Silva family into
  it. She appears only as wife and mother across the held registers, never as declarant —
  consistent with a woman who predeceased the generation that would have registered her.
  [INFERRED]

  - **Her own siblings** (children of Antonio × Maria Joanna, family F-0017): Isabel (b. 28 April,
  d. 9 June 1860, Nova Friburgo; PAR-0082), Octávio Ferreira da Silva (b. ~1868 at Aparecida, RJ,
  operário; m. Octavia Froidevaux at Nova Friburgo, 28 December 1895; CIV-0036) and Maria da
  Gloria da Silva Ferreira (b. ~1876 at Nova Friburgo; m. the Portuguese merchant Ezequiel Mathias
  Dias, 28 October 1899; CIV-0037), each act naming both parents [PROVEN]; and Antonio da Silva
  Ferreira Junior, operário, who declared their father's death in 1914 — that act names only the
  father [STRONG-EVIDENCE — CIV-0035].

  - **Godparents as a kin map.** Her own godparents in Rio in 1863 were Manoel José [surname
  illegible in this repository's reading; "dos Santos Braga" in the retrieval research's,
  uncertain] and Dona Maria Anastacia Paulina (PAR-0077). For her daughter Celina in 1899 she chose
  her sister Maria da Gloria and a José da Silva Ferreira (PAR-0057) [PROVEN]; José's relationship
  is not stated — the retrieval research treats him as a possible brother [LEAD]. For her son
  Renato in 1898 the godparents were Bernardo Nunes [Pinto] and Laura Borba Nunes (PAR-0079) —
  almost certainly her husband's sister Laura Maria Bohrer, who had married Bernardo Nunes Pinto
  in May 1884, a month after Lucinda's own wedding (PAR-0056) [INFERRED, strong]. Both sides of the
  family stood at the font.

  ## What we can extrapolate

  **Four held records place her family in four different places inside seventeen years.** Her
  parents married at Nova Friburgo in March 1859 (PAR-0070) and buried a six-week-old daughter
  there in June 1860 (PAR-0082); Lucinda herself was born in Rio de Janeiro — the Corte — on 10
  August 1862 and baptised at the Matriz de São João Baptista da Lagoa in March 1863 (PAR-0077);
  her brother Octávio was born in the freguesia of Nossa Senhora da Conceição de Aparecida, Rio
  de Janeiro province, about 1868 (CIV-0036); her sister Maria da Gloria was born back at Nova
  Friburgo about 1876 (CIV-0037). Nova Friburgo → the imperial capital → Aparecida → Nova
  Friburgo again [PROVEN, leg by leg]. That is the movement of a household following work, not
  of one holding land. [INFERRED]

  **She is the junction of two in-migrant streams, and neither carried capital.** Her father
  Antonio da Silva Ferreira came from Portugal as an individual, with no colony grant (PAR-0070)
  [PROVEN]; her mother Maria Joanna was the Brazil-born daughter of the Nova Friburgo colonist
  couple João José Rocheman and Elisabeth Storck (PAR-0069) [PROVEN]. One stream had a state
  settlement package worth roughly a seventh of a free rural labourer's annual wage
  [CONTEXTUAL]; the other had a passage and nothing else. Her own name preserves the collision:
  "Roschemant" (PAR-0056) [PROVEN] — rendered "Rochemont" in some research readings — the
  lusophonised fossil of Rutschmann.

  **Her marriage at twenty-one was lateral — into the same band, from a different stream.** In
  April 1884 she married Joaquim José Bohrer at the Nova Friburgo matriz; the witnesses were
  Eduardo Guilherme Buck and Candido Pereira de Lemos, the groom's maternal uncle (PAR-0056)
  [PROVEN]. She brought no documented property into a household that lived on a merchant's
  margin at the Alto da Serra (CIV-0019, CIV-0020) [PROVEN]. Standing of position, not heritable
  capital — and a position that had to be re-earned by each holder, since commerce income ends
  with the man who earns it [CONTEXTUAL].

  **A household of eleven pregnancies and repeated child deaths has no surplus to convert into
  anything.** [INFERRED] At least eight of her children are documented in the held records, and
  at least two died young: an infant son born in December 1891 and dead by 29 January 1892
  (CIV-0020, marginal note), and Antonio José, killed by a jararacussú bite at thirteen in April
  1899 (NWS-0006) [PROVEN]. Schooling, in this period, was a purchased privilege that had to be
  bought again for each child [CONTEXTUAL]; a household on a back-country trading margin with
  this many children could not buy it at scale, which is why the literacy of the Alto da Serra
  generation does not reappear as a family trait in the next one.

  **Her documentary invisibility is itself the finding.** No occupation, property, literacy or
  will is recorded for her anywhere in the held corpus. She exists as a bride in 1884, as a
  mother across eight baptism and birth acts between 1890 and 1909, and as *falecida* on her
  children's papers thereafter; she had died by 1923, when a granddaughter's birth registration
  calls her "já falecida" (CIV-0038) [PROVEN], and no death act has been located. Women of this
  band generate records only at the sacraments that involve them, and a woman who predeceases
  the generation that would have registered her leaves almost nothing. That is not a research
  failure but a description of what the archive does to the non-propertied. [INFERRED]

  **What she transmits is a place in the band, and it does not outlast her daughter.**
  [INFERRED/CONTEXTUAL] Celina (P-0015) died in 1977 a working widow who "não deixou bens nem
  testamento" (CIV-0015) [PROVEN]. This is the exact inverse of the paternal Armond arc of the
  same family, which fell into the 20th-century urban working class *from* an
  office-and-marriage elite: here there was no elite to fall from, and the next generation
  simply urbanised into it.

  ## Open questions

  - Her death record — not held; would fix her death date. (Her marriage is now held —
  PAR-0056, 19 April 1884; her birth and baptism are held — PAR-0077, Rio de Janeiro, which
  also independently confirms her parents.) [OPEN] With the cathedral register reportedly
  searched without result for 1919–1924 [LEAD], the retrieval research proposes the registers
  of the parish the household had moved to — it names São José do Ribeirão, from about 1902
  [LEAD] — and the civil registration of the outlying districts. The held record places the
  household's later events in the São Pedro district of Nova Friburgo: Antonio José died there
  in 1899 (NWS-0006) and Lucinda Maria was baptised at its Capela filial de São Pedro in 1908
  (PAR-0052) [PROVEN], so the São Pedro chapel's and district's death records are a natural
  first target [INFERRED].

  - The three tree-only sons (Francisco José, Joaquim José Júnior, Álvaro José) — need a record
  naming Lucinda before any can be counted. [LEAD]

  ## Sources held (this repository)

  - PAR-0077 (her own 1863 Rio de Janeiro baptism — her birth date, birthplace and
  parents) · PAR-0056 (her own 1884 Nova Friburgo marriage to Joaquim — 19 April 1884, aged 21,
  Rio birthplace corroborated) · CIV-0019 (son Alberto's 1890 birth — names her, her husband and
  her parents) · CIV-0020 (infant son's 1891 birth) · CIV-0015 (daughter Celina's 1977 death) ·
  CIV-0016 (grandson Eunir's 1924 birth, naming her a deceased maternal grandmother).

  - PAR-0057 (daughter Celina's 1899 baptism) · PAR-0075 (daughter Etelvina's 1902 baptism) ·
  PAR-0078 (son Joaquim Carlos's 1896 baptism) · PAR-0079 (son Renato's 1897/1898 baptism) ·
  PAR-0052 (daughter Lucinda Maria's 1908 baptism) · CIV-0032 (the same daughter's 1996 Volta
  Redonda death, as Lucinda Bohrer Moreira) — all naming her as mother.

  - CIV-0038 (granddaughter Senira's 1923 Nova Friburgo birth — names her "já falecida") ·
  NWS-0006 (son Antonio José's 1899 death notice — names only his father).

  - PAR-0082 / CIV-0036 / CIV-0037 / CIV-0035 (her siblings Isabel's 1860 death, Octávio's 1895
  and Maria da Gloria's 1899 marriages, and her father's 1914 death declared by her brother
  Antonio Junior).

  ## Regional and migration context

  Her Brazilian nationality follows jus soli from her 1862 Rio de Janeiro birth (PAR-0077).
  Born in the Corte in 1862, she was in Nova Friburgo by the time she married and lived her
  documented adult life in the colony town (RJ); the move out of the colony came with a
  later generation. [CONTEXTUAL]

  - **Childhood on the move.** Her parents married at Nova Friburgo in 1859 (PAR-0070); she was
  born in Rio in 1862 (PAR-0077); her brother Octávio was born at Aparecida (RJ) about 1868
  (CIV-0036) and her sister Maria da Gloria at Nova Friburgo about 1876 (CIV-0037) [PROVEN, leg by
  leg] — so she probably grew up partly outside the colony and was back in it by her early teens
  at the latest. [INFERRED]

  - **Married life.** At the Alto da Serra, in the parish of São João Baptista, in 1890–91, where
  her husband traded (CIV-0019, CIV-0020) [PROVEN]; by 1899–1908 the family's events fall in the
  São Pedro district of Nova Friburgo (NWS-0006, PAR-0052) [PROVEN], suggesting the household had
  moved deeper into the rural districts [INFERRED].

  ## Where to go today

  - **Marriage parish (19 Apr 1884, held):** Catedral Diocesana / Igreja Matriz de São João
  Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) — her
  marriage act (PAR-0056) is held. Her death parish is unknown: the cathedral's 1919–1924 death
  register was reportedly searched without finding her [LEAD]. [RESOLVED for the marriage] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Baptism (already held, 1863):** Matriz de São João Baptista da Lagoa, Rio de Janeiro
  (Corte) — her own baptism (PAR-0077) is held. [RESOLVED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela nasceu não em Nova Friburgo, mas no Rio de Janeiro (a Corte Imperial), em 10 de agosto de 1862 — seu registro de batismo de 1863 a situa na Matriz de São João Baptista da Lagoa (PAR-0077), e seu casamento de 1884 corrobora isso de forma independente. Sua família estava no Rio em 1862–63 antes de retornar a Nova Friburgo.

  - **[CONTEXTUAL]** Ela nasceu nos anos finais do Segundo Reinado: o Rio de Janeiro de 1862 era a capital de um Império escravista cujos ritos da vida da corte ainda estavam em seu auge. Seu pai Antonio da Silva Ferreira era imigrante português, tornando-a filha de um imigrante e esposa de um descendente de colonos suíços — uma família que conectou três correntes imigratórias em Nova Friburgo.

  - **[INFERRED]** Ela se casou com a família Bohrer em 19 de abril de 1884 — cinco anos antes da República e da lei de registro civil de 1889 —, de modo que seu casamento foi registrado nos antigos registros paroquiais (PAR-0056), e não no novo sistema civil de cartório que regeria os nascimentos de seus filhos.

  - **[CONTEXTUAL]** Nova Friburgo em 1884 entrava em sua fase têxtil e comercial: os colonos serrano-alemães haviam deixado a lavoura pelo comércio, e o lar do marido Joaquim como *negociante* no Alto da Serra era representativo do patamar que os descendentes de colonos haviam alcançado nos anos 1880 — posição comercial modesta, não riqueza fundiária.

  - **[INFERRED]** Ela nasceu no Rio, casou-se em Nova Friburgo e já havia falecido em 1923 (CIV-0038) — sem registro em Volta Redonda. A mudança para a cidade siderúrgica da CSN foi da geração de sua filha Celina e do genro João, não da sua.

  ## Identidade

  **Lucinda Ferreira da Silva** (de casada *Lucinda Ferreira da Silva Bohrer*; também
  *Lucinda Ferreira Bohrer*) [PROVEN]. Esposa de Joaquim José Bohrer (P-0030) e mãe de
  Celina (Selina) Bohrer (P-0015). Sua forma registrada mais completa é **Lucinda Roschemant
  da Silva Ferreira**, em seu próprio casamento de 1884 (PAR-0056) — o "Roschemant" trazendo o
  sobrenome Rutschmann de sua mãe [PROVEN]. Os batismos de seus filhos a escrevem de vários modos:
  "Lucinda Ferreira Bor[b]er" (PAR-0057, PAR-0078), "Lucinda da Silva Ferreira Berber" (PAR-0079),
  "Lucinda da Silva Borber" (PAR-0075) e "Lucinda Silva Ferreira Bor[b]er" (PAR-0052); seu próprio
  batismo de 1863 traz apenas o prenome (PAR-0077).

  - **Nascimento:** 10 de agosto de 1862 no Rio de Janeiro (Corte), baptizada em 16 de
  março de 1863 na Matriz de São João Baptista da Lagoa [PROVEN — PAR-0077]. Isso corrige
  a leitura anterior "natural desta Freguezia" (Nova Friburgo, RJ) do nascimento de 1890
  de seu filho Alberto (CIV-0019), agora preservada como conflito relatado pelo informante
  — a família Silva-Ferreira estava no Rio em 1862-63 e retornou a Nova Friburgo depois.

  - **Pais:** Antonio da Silva Ferreira (P-0036) e Maria Joanna da Silva Ferreira (P-0037)
  [PROVEN] — nomeados em seu próprio batismo de 1863 (PAR-0077) e em seu próprio casamento de
  1884 (PAR-0056), dois originais independentes, e de novo como avós maternos no nascimento de
  1890 de seu filho Alberto (CIV-0019).

  - **Casamento:** com Joaquim José Bohrer (P-0030) em 19 de abril de 1884 na Matriz de São
  João Baptista de Nova Friburgo, aos 21 anos [PROVEN — seu próprio ato de casamento PAR-0056,
  evento E-0085]. Esse ato a registra "nascida e baptisada na freguezia de S. João Baptista da
  Lagoa, na Corte" (Rio), corroborando de forma independente seu batismo de 1863 no Rio
  (PAR-0077).

  - **Filhos:** Alberto (1890), um filho menino (1891–92), Antonio José (f. 1899, aos 13 anos),
  Celina / Selina (P-0015, n. 13 de maio de 1899, PAR-0057), Etelvina (n. 1900, baptizada em
  1902, PAR-0075), Joaquim Carlos (n. 6 de janeiro de 1896, PAR-0078), Renato (n. 12 de setembro
  de 1897, baptizado em 1898, PAR-0079) e Lucinda Maria (n. 26 de julho de 1908, PAR-0052) —
  depois Lucinda Bohrer Moreira, f. 1996 (CIV-0032). O batismo de 1908 e o óbito de 1996 são
  a mesma mulher [STRONG-EVIDENCE] (mesmo aniversário, 26 de julho, e mesmos pais; o "1909" do
  óbito é declarado pelo informante) — ver P-0030. [PROVEN] Duas ressalvas: a nota de falecimento
  de Antonio José nomeia apenas o pai (NWS-0006), de modo que a maternidade dela repousa nas datas
  — nascido c.1885–86, após o casamento de 1884, sem outra esposa de Joaquim documentada
  [INFERRED; BORDERLINE]; e o prenome do filho menino de 1891 cai num fólio que a imagem disponível
  não captura (CIV-0020) — a pesquisa de recuperação o lê como João [LEAD]. A pesquisa de
  recuperação traz ainda três outros filhos conhecidos apenas pela árvore do FamilySearch —
  Francisco José (1885–1973), Joaquim José Júnior (1899–1970) e Álvaro José — sem registro
  encontrado para nenhum deles [LEAD — apenas árvore, não modelados].

  - **Óbito:** já falecida em 1923, quando o registro de nascimento de uma neta a chama "já
  fallecida" (CIV-0038), de novo "já fallecida" no nascimento de 1924 de Eunir (CIV-0016), e
  nomeada como mãe falecida de Celina em 1977 (CIV-0015) [PROVEN quanto ao limite];
  [Corrigido em 2026-10-08 a partir da imagem: CIV-0016 usa o singular "fallecida" — apenas
  ela, e não o marido, é dada como falecida em 1924;] data exata não obtida. [OPEN] Um óbito em 1921 é relatado por um blog genealógico e
  pela árvore do FamilySearch [LEAD]; a pesquisa de recuperação relata ter percorrido sem lacunas o
  livro de óbitos da catedral de Nova Friburgo de novembro de 1919 a maio de 1924 sem encontrá-la
  [LEAD — busca negativa do lado da recuperação], de modo que o óbito provavelmente foi registrado
  em outro lugar.

  ## Posição social e profissão

  - Nenhuma ocupação ou registro próprio está disponível [PROVEN quanto à lacuna]. Seu lar
  de casada era o de um negociante de Nova Friburgo no Alto da Serra (a profissão e a
  residência do marido, CIV-0019). "Ferreira da Silva" é seu sobrenome próprio e "Bohrer" o
  nome de casada; ambas as variantes são preservadas.

  ## Família e rede social

  Casou-se com a linha colona Borer e trouxe para ela a família Ferreira da Silva. Aparece
  apenas como esposa e mãe nos registros disponíveis, nunca como declarante — coerente com
  uma mulher que faleceu antes da geração que a teria registrado. [INFERRED]

  - **Seus próprios irmãos** (filhos de Antonio × Maria Joanna, família F-0017): Isabel (n. 28 de
  abril, f. 9 de junho de 1860, Nova Friburgo; PAR-0082), Octávio Ferreira da Silva (n. ~1868 em
  Aparecida, RJ, operário; c. Octavia Froidevaux em Nova Friburgo, 28 de dezembro de 1895;
  CIV-0036) e Maria da Gloria da Silva Ferreira (n. ~1876 em Nova Friburgo; c. o negociante
  português Ezequiel Mathias Dias, 28 de outubro de 1899; CIV-0037), cada ato nomeando ambos os
  pais [PROVEN]; e Antonio da Silva Ferreira Junior, operário, que declarou o óbito do pai em
  1914 — esse ato nomeia apenas o pai [STRONG-EVIDENCE — CIV-0035].

  - **Os padrinhos como mapa de parentesco.** Seus próprios padrinhos, no Rio em 1863, foram
  Manoel José [sobrenome ilegível na leitura deste repositório; "dos Santos Braga" na da pesquisa
  de recuperação, incerto] e Dona Maria Anastacia Paulina (PAR-0077). Para a filha Celina, em 1899,
  escolheu a irmã Maria da Gloria e um José da Silva Ferreira (PAR-0057) [PROVEN]; o parentesco de
  José não é declarado — a pesquisa de recuperação o trata como possível irmão [LEAD]. Para o
  filho Renato, em 1898, os padrinhos foram Bernardo Nunes [Pinto] e Laura Borba Nunes (PAR-0079) —
  quase certamente a irmã do marido, Laura Maria Bohrer, que se casara com Bernardo Nunes Pinto em
  maio de 1884, um mês depois do casamento da própria Lucinda (PAR-0056) [INFERRED, forte]. Os dois
  lados da família estiveram na pia batismal.

  ## O que podemos extrapolar

  **Quatro registros disponíveis situam sua família em quatro lugares diferentes em dezessete
  anos.** Seus pais casaram-se em Nova Friburgo em março de 1859 (PAR-0070) e ali sepultaram uma
  filha de seis semanas em junho de 1860 (PAR-0082); a própria Lucinda nasceu no Rio de Janeiro
  — a Corte — em 10 de agosto de 1862 e foi baptizada na Matriz de São João Baptista da Lagoa em
  março de 1863 (PAR-0077); seu irmão Octávio nasceu na freguesia de Nossa Senhora da Conceição
  de Aparecida, província do Rio de Janeiro, por volta de 1868 (CIV-0036); sua irmã Maria da
  Gloria nasceu de volta em Nova Friburgo por volta de 1876 (CIV-0037). Nova Friburgo → a
  capital imperial → Aparecida → Nova Friburgo outra vez [PROVEN, etapa por etapa]. É o
  movimento de um domicílio que segue o trabalho, não de um que possui terra. [INFERRED]

  **Ela é a junção de duas correntes imigratórias, e nenhuma delas trazia capital.** Seu pai,
  Antonio da Silva Ferreira, veio de Portugal por conta própria, sem concessão colonial
  (PAR-0070) [PROVEN]; sua mãe, Maria Joanna, era filha nascida no Brasil do casal colono
  friburguense João José Rocheman e Elisabeth Storck (PAR-0069) [PROVEN]. Uma corrente tinha um
  pacote estatal de assentamento que valia cerca de um sétimo do salário anual de um trabalhador
  rural livre [CONTEXTUAL]; a outra tinha uma passagem e mais nada. O próprio nome dela guarda a
  colisão: "Roschemant" (PAR-0056) [PROVEN] — grafado "Rochemont" em algumas leituras de
  pesquisa —, o fóssil lusitanizado de Rutschmann.

  **Seu casamento aos vinte e um anos foi lateral — para a mesma faixa, vindo de outra
  corrente.** Em abril de 1884 casou-se com Joaquim José Bohrer na matriz de Nova Friburgo; as
  testemunhas foram Eduardo Guilherme Buck e Candido Pereira de Lemos, tio materno do noivo
  (PAR-0056) [PROVEN]. Ela não levou propriedade documentada para um domicílio que vivia de uma
  margem de comerciante no Alto da Serra (CIV-0019, CIV-0020) [PROVEN]. Posição de status, não
  capital herdável — e uma posição que cada titular tinha de reconquistar, pois a renda do
  comércio termina com o homem que a ganha [CONTEXTUAL].

  **Um domicílio com onze gestações e mortes infantis repetidas não tem excedente a converter em
  coisa alguma.** [INFERRED] Ao menos oito de seus filhos estão documentados nos registros
  disponíveis, e ao menos dois morreram cedo: um filho nascido em dezembro de 1891 e falecido em
  29 de janeiro de 1892 (CIV-0020, nota marginal) e Antonio José, morto por picada de
  jararacussú aos treze anos, em abril de 1899 (NWS-0006) [PROVEN]. A escolaridade, nesse
  período, era um privilégio comprado que precisava ser comprado de novo para cada filho
  [CONTEXTUAL]; um lar vivendo de uma margem comercial de mato, com tantos filhos, não podia
  comprá-la em escala — razão pela qual o letramento da geração do Alto da Serra não reaparece
  como traço familiar na geração seguinte.

  **Sua invisibilidade documental é, ela própria, o achado.** Nenhuma ocupação, propriedade,
  letramento ou testamento consta dela em todo o corpus disponível. Ela existe como noiva em
  1884, como mãe em oito assentos de batismo e nascimento entre 1890 e 1909 e como *falecida*
  nos papéis dos filhos daí em diante; já havia morrido em 1923, quando o registro de nascimento
  de uma neta a chama "já falecida" (CIV-0038) [PROVEN], e nenhum assento de óbito foi
  localizado. Mulheres desta faixa geram registro apenas nos sacramentos que as envolvem, e uma
  mulher que morre antes da geração que a teria registrado quase nada deixa. Isso não é falha de
  pesquisa: é a descrição do que o arquivo faz com os não proprietários. [INFERRED]

  **O que ela transmite é um lugar na faixa, e esse lugar não sobrevive à filha.**
  [INFERRED/CONTEXTUAL] Celina (P-0015) morreu em 1977 viúva e trabalhadora, tendo "não deixado
  bens nem testamento" (CIV-0015) [PROVEN]. É o inverso exato do arco paterno Armond da mesma
  família, que caiu na classe trabalhadora urbana do século XX *a partir de* uma elite de cargos
  e casamentos: aqui não havia elite da qual cair, e a geração seguinte simplesmente se
  urbanizou nela.

  ## Questões em aberto

  - Seu registro de óbito — não obtido; fixaria sua data de óbito. (Seu casamento está agora
  obtido — PAR-0056, 19 de abril de 1884; seu nascimento e batismo estão obtidos — PAR-0077, Rio
  de Janeiro, que também confirma de forma independente seus pais.) [OPEN] Com o livro da
  catedral supostamente percorrido sem resultado para 1919–1924 [LEAD], a pesquisa de recuperação
  propõe os livros da paróquia para onde o domicílio se mudara — nomeia São José do Ribeirão, a
  partir de cerca de 1902 [LEAD] — e o registro civil dos distritos afastados. O registro
  disponível situa os eventos posteriores do domicílio no distrito de São Pedro de Nova Friburgo:
  Antonio José morreu ali em 1899 (NWS-0006) e Lucinda Maria foi baptizada em sua Capela filial
  de São Pedro em 1908 (PAR-0052) [PROVEN], de modo que os registros de óbito da capela e do
  distrito de São Pedro são um primeiro alvo natural [INFERRED].

  - Os três filhos conhecidos apenas pela árvore (Francisco José, Joaquim José Júnior, Álvaro José)
  — exigem um registro que nomeie Lucinda antes que qualquer um possa ser contado. [LEAD]

