profile: >-
  ## Identity

  **Celina Bohrer** (variant **Selina**) [PROVEN] — the preferred spelling "Celina" is
  used by three primary civil records: her own 1977 death (CIV-0015), her husband's
  1970 death (CIV-0014) and Eunir Bohrer's 1924 birth (CIV-0016); "Selina" appears in
  the 1949 marriage (CIV-0004) and the owner roster (REC-0001).

  - **Birth:** c.1900 at **Nova Friburgo, RJ** [PROVEN for the place, INFERRED for the
  year] — recorded "natural deste Districto" (Nova Friburgo) on Eunir's 1924 birth
  (CIV-0016); her 1977 death gives her age as **77** (CIV-0015), back-calculating to
  c.1900. This Nova Friburgo origin distinguishes her from the São Leopoldo (RS)
  "Celina Amalia Bohrer", a different person.

  - **Parents:** **Joaquim José Bohrer** (P-0030) and **Lucinda Ferreira da Silva**
  (P-0031, recorded "Lucinda Ferreira da Silva Bohrer"), both deceased [PROVEN]
  (CIV-0015; corroborated by CIV-0016, where they are already *já fallecidos* by May
  1924).

  - **Marriage:** married **João Gonçalves Bohrer** (P-0014), reportedly at **Carangola,
  Minas Gerais** [uncertain reading, CIV-0014] — a **Bohrer × Bohrer** union.

  - **Death:** **19 February 1977** (registered 20 February 1977), at the Casa de Saúde
  São José, **Volta Redonda, RJ**, aged 77, a **widow**; *causa mortis* **blastoma
  gástrico** [PROVEN] (CIV-0015). She left no goods and no will.

  ## Standing and profession

  - **Doméstica** [PROVEN] — her occupation on her 1977 death record (CIV-0015). She was
  a **widow** at death, João Gonçalves having predeceased her in 1970 (CIV-0014,
  CIV-0015) — consistent across both records.

  ## Family and social network

  - **Children:** the count conflicts across the two parental death records — her own
  1977 death states she "deixou **quatorze** filhos" (fourteen; CIV-0015), while her
  husband's 1970 death states "**quinze** filhos" (fifteen; CIV-0014). Both figures are
  preserved. [PROVEN, conflicting] Documented children include Iris Bohrer Muniz
  (P-0007), Eunir Bohrer (1924; CIV-0016) and João Bohrer (d. 2001; CIV-0025).

  - **Her Nova Friburgo birth family:** her siblings' civil records fix her parents
  Joaquim José × Lucinda as a couple of the Alto da Serra, Nova Friburgo. Her brother
  **Alberto Bohrer** was born there in 1890 (CIV-0019), an infant brother in 1891 who
  died in 1892 (CIV-0020), and a brother **Antonio José Bohrer** died in 1899 aged 13 of
  a jararacussú snakebite (NWS-0006). CIV-0019 also names her grandparents — paternal
  **Francisco José Bohrer** (deceased) × **Roza Eugenia de Lemos**, maternal **Antonio
  da Silva Ferreira** × **Maria Joanna da Silva Ferreira**.

  - **Her father Joaquim José Bohrer** was a *negociante* at the Alto da Serra (CIV-0019,
  CIV-0020) and was alive in Nova Friburgo in 1898, his birthday fixed at **16 December**
  by a newspaper notice (NWS-0005) [PROVEN].

  ## What we can extrapolate

  Born at Nova Friburgo c.1900, married into a Carangola (MG) household, and dead a widow
  at Volta Redonda in 1977, Celina's life mirrors the family's Nova Friburgo → Zona da
  Mata Mineira → Volta Redonda steel-city migration. [INFERRED] Her descent runs through
  the Nova Friburgo Bohrer *negociante* family of the Alto da Serra (Joaquim José →
  Francisco José Bohrer; CIV-0019).

  Her one documented status — a **doméstica and widow who "left no goods and no will"**
  (CIV-0015) — is the female face of that arc [INFERRED]. It reads not as decline but as the
  **baseline of a line that never accumulated heritable capital**: colonist-descended Nova
  Friburgo people whose wealth was labour and petty commerce, not land or office, resettled as
  urban working people in the Volta Redonda steel city [CONTEXTUAL]. That is precisely the
  inverse of the Armond exemplar, where propertylessness marks a *fall* from an
  office-and-marriage elite; here there was no elite to fall from. [INFERRED] Through her father
  Joaquim José Bohrer, an Alto da Serra *negociante* (CIV-0019, CIV-0020), she carries a
  non-elite inheritance **of position, not property**, into the modern generation.

  ## Open questions

  - Her **birth/baptism** (c.1900, Nova Friburgo, São João Baptista) — not held; would
  fix her exact date and settle the Celina/Selina spelling at source. [OPEN]

  - The **child count** (fourteen vs fifteen) — resolvable only by assembling the
  children's own records. [OPEN]

  - Her **marriage to João Gonçalves** — the Carangola (MG) civil marriage register would
  date the union and confirm her filiation independently. [OPEN]

  ## Sources held (this repository)

  - CIV-0015 (her 1977 Volta Redonda death — age, widow, doméstica, parents, fourteen
  children) · CIV-0016 (Eunir's 1924 Nova Friburgo birth — "natural deste Districto", her
  parents) · CIV-0014 (husband's 1970 death — names her, fifteen children) · CIV-0004
  (daughter Iris's 1949 marriage — "Selina") · CIV-0025 (son João Bohrer's 2001 death) ·
  REC-0001 (owner family roster).

  - CIV-0019 (brother Alberto Bohrer's 1890 Nova Friburgo birth — names her parents and
  both grandparent couples) · CIV-0020 (infant brother's 1891 birth, d. 1892) · NWS-0005
  (A Sentinella — her father's 16 December birthday) · NWS-0006 (A Sentinella — her brother
  Antonio José's 1899 death) · PUB-0003 (published Nova Friburgo genealogy).

  ## Regional and migration context

  She was born at **Nova Friburgo** (CIV-0016), the Serra-fluminense town built by the
  1819–1824 Swiss / German Catholic colony, into the Bohrer *negociante* family of the
  Alto da Serra (CIV-0019, CIV-0020). The family's descent from the Nova Friburgo
  Borer/Bohrer immigrants (her line through Joaquim José → Francisco José Bohrer, P-0034)
  is documented in the published Nova Friburgo genealogy (PUB-0003) [LEAD] and is not
  inferred from the surname alone. She married into a Carangola (MG) household and died at
  **Volta Redonda**, the CSN steel city, in 1977. [CONTEXTUAL]

  ## Where to go today

  - **Birth (~1900):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo,
  RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Marriage to João Gonçalves Bohrer:** Igreja Matriz de Santa Luzia, Carangola, MG
  (Praça Coronel Maximiano 138, Centro, CEP 36800-000) [DOCUMENTED-addr] ·
  [Maps](https://maps.google.com/?q=-20.73337,-42.02975)

  - **Death (1977):** Igreja Matriz de Santa Cecília, Vila Santa Cecília, Volta Redonda, RJ
  (Rua 31-A, CEP 27260-110) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.52408,-44.10435)
profile_pt: >-
  ## Identidade

  **Celina Bohrer** (variante **Selina**) [PROVEN] — a grafia preferida "Celina" é usada
  por três registros civis primários: seu próprio óbito de 1977 (CIV-0015), o óbito do
  marido em 1970 (CIV-0014) e o nascimento de Eunir Bohrer em 1924 (CIV-0016); "Selina"
  aparece no casamento de 1949 (CIV-0004) e na lista do proprietário (REC-0001).

  - **Nascimento:** c.1900, em **Nova Friburgo, RJ** [PROVEN quanto ao lugar, INFERRED
  quanto ao ano] — registrada "natural deste Districto" (Nova Friburgo) no nascimento de
  Eunir em 1924 (CIV-0016); seu óbito de 1977 dá sua idade como **77 anos** (CIV-0015),
  retrocalculando para c.1900. Essa origem em Nova Friburgo a distingue da "Celina Amalia
  Bohrer" de São Leopoldo (RS), pessoa diferente.

  - **Pais:** **Joaquim José Bohrer** (P-0030) e **Lucinda Ferreira da Silva** (P-0031,
  registrada "Lucinda Ferreira da Silva Bohrer"), ambos falecidos [PROVEN] (CIV-0015;
  corroborado por CIV-0016, onde já constam *já fallecidos* em maio de 1924).

  - **Casamento:** casou-se com **João Gonçalves Bohrer** (P-0014), ao que consta em
  **Carangola, Minas Gerais** [uncertain — leitura, CIV-0014] — uma união **Bohrer ×
  Bohrer**.

  - **Óbito:** **19 de fevereiro de 1977** (registrado em 20 de fevereiro de 1977), na
  Casa de Saúde São José, **Volta Redonda, RJ**, aos 77 anos, **viúva**; *causa mortis*
  **blastoma gástrico** [PROVEN] (CIV-0015). Não deixou bens nem testamento.

  ## Posição social e profissão

  - **Doméstica** [PROVEN] — sua ocupação no óbito de 1977 (CIV-0015). Era **viúva** ao
  falecer, tendo João Gonçalves falecido antes dela em 1970 (CIV-0014, CIV-0015) —
  consistente entre ambos os registros.

  ## Família e rede social

  - **Filhos:** a contagem diverge entre os dois óbitos parentais — seu próprio óbito de
  1977 afirma que "deixou **quatorze** filhos" (CIV-0015), enquanto o óbito do marido em
  1970 afirma "**quinze** filhos" (CIV-0014). Ambos os números são preservados. [PROVEN,
  conflitante] Entre os filhos documentados estão Iris Bohrer Muniz (P-0007), Eunir
  Bohrer (1924; CIV-0016) e João Bohrer (f. 2001; CIV-0025).

  - **Sua família de origem em Nova Friburgo:** os registros civis de seus irmãos fixam
  seus pais Joaquim José × Lucinda como um casal do Alto da Serra, em Nova Friburgo. Seu
  irmão **Alberto Bohrer** nasceu ali em 1890 (CIV-0019), um irmão infante em 1891 que
  faleceu em 1892 (CIV-0020) e um irmão **Antonio José Bohrer** faleceu em 1899 aos 13
  anos por mordedura de cobra jararacussú (NWS-0006). CIV-0019 também nomeia seus avós —
  paternos **Francisco José Bohrer** (falecido) × **Roza Eugenia de Lemos**, maternos
  **Antonio da Silva Ferreira** × **Maria Joanna da Silva Ferreira**.

  - **Seu pai Joaquim José Bohrer** era *negociante* no Alto da Serra (CIV-0019, CIV-0020)
  e estava vivo em Nova Friburgo em 1898, com o aniversário fixado em **16 de dezembro**
  por uma nota de jornal (NWS-0005) [PROVEN].

  ## O que podemos extrapolar

  Nascida em Nova Friburgo c.1900, casada em um lar de Carangola (MG) e falecida viúva em
  Volta Redonda em 1977, a vida de Celina espelha a migração da família de Nova Friburgo
  → Zona da Mata Mineira → cidade siderúrgica de Volta Redonda. [INFERRED] Sua
  descendência corre pela família Bohrer *negociante* do Alto da Serra, em Nova Friburgo
  (Joaquim José → Francisco José Bohrer; CIV-0019).

  Sua única condição documentada — uma **doméstica e viúva que "não deixou bens nem
  testamento"** (CIV-0015) — é a face feminina desse arco [INFERRED]. Ela se lê não como
  declínio, mas como a **linha de base de uma família que nunca acumulou capital herdável**:
  gente de Nova Friburgo descendente de colonos, cuja riqueza era o trabalho e o pequeno
  comércio, não terra nem cargo, reassentada como gente trabalhadora urbana na cidade
  siderúrgica de Volta Redonda [CONTEXTUAL]. Isso é exatamente o inverso do exemplo Armond, no
  qual a ausência de bens marca uma *queda* a partir de uma elite de cargos e de casamento; aqui
  não havia elite da qual cair. [INFERRED] Por meio de seu pai Joaquim José Bohrer, um
  *negociante* do Alto da Serra (CIV-0019, CIV-0020), ela carrega para a geração moderna uma
  herança não elitista **de posição, não de propriedade**.

  ## Questões em aberto

  - Seu **nascimento/batismo** (c.1900, Nova Friburgo, São João Baptista) — não está em
  mãos; fixaria sua data exata e resolveria a grafia Celina/Selina na fonte. [OPEN]

  - A **contagem de filhos** (quatorze vs quinze) — resolvível apenas reunindo os
  registros dos próprios filhos. [OPEN]

  - Seu **casamento com João Gonçalves** — o registro civil de casamento de Carangola
  (MG) dataria a união e confirmaria sua filiação de forma independente. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0015 (seu óbito de 1977 em Volta Redonda — idade, viúva, doméstica, pais,
  quatorze filhos) · CIV-0016 (nascimento de Eunir em 1924, Nova Friburgo — "natural
  deste Districto", seus pais) · CIV-0014 (óbito do marido em 1970 — nomeia-a, quinze
  filhos) · CIV-0004 (casamento da filha Iris em 1949 — "Selina") · CIV-0025 (óbito do
  filho João Bohrer em 2001) · REC-0001 (lista familiar do proprietário).

  - CIV-0019 (nascimento do irmão Alberto Bohrer em 1890, Nova Friburgo — nomeia seus
  pais e ambos os casais de avós) · CIV-0020 (nascimento do irmão infante em 1891, f.
  1892) · NWS-0005 (A Sentinella — o aniversário de 16 de dezembro do pai) · NWS-0006 (A
  Sentinella — a morte do irmão Antonio José em 1899) · PUB-0003 (genealogia publicada de
  Nova Friburgo).

  ## Contexto regional e migratório

  Nasceu em **Nova Friburgo** (CIV-0016), a cidade serrano-fluminense construída pela
  colônia católica suíço-alemã de 1819–1824, na família Bohrer *negociante* do Alto da
  Serra (CIV-0019, CIV-0020). A descendência da família a partir dos imigrantes
  Borer/Bohrer de Nova Friburgo (sua linha através de Joaquim José → Francisco José
  Bohrer, P-0034) está documentada na genealogia publicada de Nova Friburgo (PUB-0003)
  [LEAD] e não é inferida apenas a partir do sobrenome. Casou-se em um lar de Carangola
  (MG) e faleceu em **Volta Redonda**, a cidade siderúrgica da CSN, em 1977. [CONTEXTUAL]

