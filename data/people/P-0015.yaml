notes:
  - text: >-
      Ahnentafel position 15. Preferred name is "Celina", the spelling used by
      three primary civil records — her own 1977 death (CIV-0015), her husband's
      1970 death (CIV-0014) and Eunir Bohrer's 1924 birth (CIV-0016). "Selina" is
      preserved as a variant but appears only in the 1949 marriage certificate
      (CIV-0004) and the owner's family roster (REC-0001). The preferred name was
      changed from "Selina" to "Celina" on 2026-07-30: her own death record and
      the weight of civil evidence outweigh the single marriage spelling.
    text_pt: >-
      Posição 15 no Ahnentafel. O nome preferido é "Celina", a grafia usada por
      três registros civis primários — seu próprio óbito de 1977 (CIV-0015), o
      óbito de seu marido de 1970 (CIV-0014) e o nascimento de Eunir Bohrer em
      1924 (CIV-0016). "Selina" é preservado como variante, mas aparece apenas na
      certidão de casamento de 1949 (CIV-0004) e na lista familiar do proprietário
      (REC-0001). O nome preferido foi alterado de "Selina" para "Celina" em
      30/07/2026: o próprio registro de óbito e o peso das evidências civis superam
      a única grafia do casamento.
  - text: >-
      Died 19 February 1977 at Volta Redonda, RJ, aged 77 (so born c.1900), a
      widow, per her civil death (CIV-0015). Born in Nova Friburgo, RJ ("natural
      deste Districto", CIV-0016), which resolves the São Leopoldo (RS) "Celina
      Amalia Bohrer" as a different person. Her parents were Joaquim José Bohrer
      (P-0030) and Lucinda Ferreira da Silva (P-0031) — family F-0014.
    text_pt: >-
      Falecida em 19 de fevereiro de 1977 em Volta Redonda, RJ, com 77 anos
      (portanto nascida c.1900), viúva, conforme seu óbito civil (CIV-0015).
      Nascida em Nova Friburgo, RJ ("natural deste Districto", CIV-0016), o que
      diferencia a "Celina Amalia Bohrer" de São Leopoldo (RS) como uma pessoa
      diferente. Seus pais foram Joaquim José Bohrer (P-0030) e Lucinda Ferreira
      da Silva (P-0031) — família F-0014.
