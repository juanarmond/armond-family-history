notes:
  - text: >-
      Ahnentafel position 15. Preferred name is "Celina", the spelling used by
      three primary civil records — her own 1977 death (CIV-0015), her husband's
      1970 death (CIV-0014) and Eunir Bohrer's 1924 birth (CIV-0016). "Selina" is
      preserved as a variant but appears only in the 1949 marriage certificate
      (CIV-0004) and the owner's family roster (REC-0001). The preferred name was
      changed from "Selina" to "Celina" on 2026-07-30: her own death record and
      the weight of civil evidence outweigh the single marriage spelling.
  - text: >-
      Died 19 February 1977 at Volta Redonda, RJ, aged 77 (so born c.1900), a
      widow, per her civil death (CIV-0015). Born in Nova Friburgo, RJ ("natural
      deste Districto", CIV-0016), which resolves the São Leopoldo (RS) "Celina
      Amalia Bohrer" as a different person. Her parents were Joaquim José Bohrer
      (P-0030) and Lucinda Ferreira da Silva (P-0031) — family F-0014.
