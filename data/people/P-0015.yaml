  ## Contexto regional e migratório

  Nasceu em **Nova Friburgo** (CIV-0016), a cidade serrano-fluminense construída pela
  colônia católica suíço-alemã de 1819–1824, na família Bohrer *negociante* do Alto da
  Serra (CIV-0019, CIV-0020). A descendência da família a partir dos imigrantes Borer/Bohrer de Nova Friburgo está documentada por registros paroquiais em mãos neste repositório, e não inferida do sobrenome: o casamento do pai em 1884 nomeia os pais dele, Francisco José Bohrer (P-0034) × Roza Eugenia de Lemos (PAR-0056); o batismo de Francisco José em 1832 nomeia Jacob Bohrer × Catharina Moser (PAR-0054); e o casamento destes em Nova Friburgo em 1825 os registra como colonos suíços do cantão de Soleure — Jacob de Beinwil, que o registro grafa "Erswill" (PAR-0059). A genealogia publicada (PUB-0003) concorda. (A pesquisa de recuperação situa Jacob em Erschwil; este repositório lê o "Erswill" do registro como Beinwil.) Depois do casamento viveu na Zona da Mata Mineira, onde nasceram filhos a partir de 1929 (CIV-0004, CIV-0025, CIV-0040) [INFERRED a partir dos locais de nascimento dos filhos], e faleceu em **Volta Redonda**, a cidade siderúrgica da CSN, em 1977. [CONTEXTUAL]

