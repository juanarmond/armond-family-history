notes:
  - text: >-
      Ahnentafel position 15. The name is now evidenced both ways: the 1949
      marriage (CIV-0004) recorded "Selina", while three primary civil records —
      her 1977 death (CIV-0015), her husband's 1970 death (CIV-0014) and Eunir
      Bohrer's 1924 birth (CIV-0016) — consistently record "Celina". Both are
      preserved; "Celina" is the civil-registered form.
  - text: >-
      Died 19 February 1977 at Volta Redonda, RJ, aged 77 (so born c.1900), a
      widow, per her civil death (CIV-0015). Born in Nova Friburgo, RJ ("natural
      deste Districto", CIV-0016), which resolves the São Leopoldo (RS) "Celina
      Amalia Bohrer" as a different person. Her parents were Joaquim José Bohrer
      (P-0030) and Lucinda Ferreira da Silva (P-0031) — family F-0014.
