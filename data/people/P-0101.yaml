- text: >-
    Father of Maria Thecla Regina Heggendorn (P-0071); named as her father (with Maria Freese) in
    the 1864 Vicente Borer × Maria Thecla marriage (PAR-0062). He is himself the groom "José
    Heggendorn, natural e baptizado na freguezia de São Lucas [St. Lukas], Cantão de Soleure" in
    the 1829 Nova Friburgo marriage to Anna Maria Frees (PAR-0073, event E-0097); his parents
    †José Eggendorn Sr (P-0115) × Maria Lutz (P-0116) are named there (family F-0058). He is also
    named as the father in Maria Thecla's own 1845 baptism (PAR-0072). Swiss immigrant to Nova
    Friburgo (São Lucas, Cantão de Soleure/Solothurn). Surname also written Heggendorn / Eckdorn.
profile: >-
  ## Interesting facts

  - **[PROVEN]** He appears in three held records across thirty-five years — his own marriage
  (1829), his daughter's baptism (1845) and her marriage (1864) — which makes him, for a
  first-generation colonist, unusually well attested. At the 1864 wedding he was not only named
  as the bride's father but stood as a witness, so he was alive and present at Nova Friburgo
  that April. (PAR-0073, PAR-0072, PAR-0062)

  - **[PROVEN]** His own origin is stated, not guessed: he was "nascido e baptizado na Freguezia
  de São Lucas [St. Lukas — uncertain], Cantão de Soleure" — a Solothurn man in a colony
  recruited in the name of Canton Fribourg. The parish name is an uncertain read; the canton is
  not. (PAR-0073)

  - **[PROVEN]** His father was already dead when he married in July 1829 — the act calls him
  "filho legitimo do defunto Joze Geggendorn" — while his mother Maria Lutz is named without
  that qualifier. (PAR-0073)

  - **[PROVEN]** Four clerks spelled him four ways: **Geggendorn** (1829), **Eggendora** (1845),
  **Eggendorn** (1864), and **Eckdorn** for his daughter in 1890. The surname in this tree is a
  record of Portuguese-speaking scribes doing their best with a Swiss-German name, not a stable
  spelling.

  ## Identity

  **José Eggendorn** (also written Geggendorn, Eggendora, Heggendorn, Eckdorn) — a
  Solothurn-born man who married and raised a family at Nova Friburgo. Iris Bohrer Muniz's
  (P-0007) great-great-grandfather, by the chain Maria Thecla Regina Eggendorn (P-0071) →
  Valentim Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN; degree derived
  from the family links]

  - **Origin:** born and baptised in the parish of São Lucas [St. Lukas — uncertain], Cantão de
  Soleure (Solothurn), Switzerland. [PROVEN for the canton — PAR-0073; parish uncertain]

  - **Marriage:** to Anna Maria Frees / Maria Freese (P-0102) on 20 July 1829 at the Matriz de
  São João Baptista, Nova Friburgo; witnesses José Maria Dubra and Anna Maria Geggendorn, before
  the Vigário Jacob Joye with the assistance of R. P. Sondeo Cosme. Both spouses are recorded as
  "de presente moradores d'esta Freguezia". (PAR-0073, event E-0097) [PROVEN]

  - **Parents:** legitimate son of the late José Eggendorn Sr (P-0115) and Maria Lutz (P-0116);
  family F-0058. [PROVEN — PAR-0073]

  - **Birth and death dates:** not documented by any record held here. He was alive in April
  1864. [OPEN / PROVEN for 1864]

  ## Standing and profession

  No occupation, property, office, literacy or signature is recorded for him in any held source.
  The 1829 act names him a resident of the parish and nothing more; the 1845 and 1864 entries
  name him only as a father, and the 1864 one as a witness. A colonist-smallholder milieu is a
  reasonable reading of the context but it is a reading, not a record.

  ## Family and social network

  He and Anna Maria Frees (P-0102; family F-0050) married in 1829 and their household is
  documented at Nova Friburgo through the 1845 baptism of their daughter Maria Thecla Regina
  (P-0071), born 23 September 1844, with Pedro Freese and Regina Freese as godparents — the
  mother's own surname on both sides of the font. [PROVEN — PAR-0072] In 1864 that daughter
  married Vicente Borer, and José both gave her away in the record and signed on as a witness;
  the other witness was Anna Maria Bohrer. [PROVEN — PAR-0062]

  A published colonist compilation adds a second daughter, Bibiana Heggendorn (b. 1833), who
  married José Borer in 1854 — which would mean two Eggendorn sisters married two Borer
  brothers. No held record names Bibiana's parents, so the pairing stays a lead. [LEAD]

  ## What we can extrapolate

  - **[CONTEXTUAL]** He belongs to the 1819–20 cohort recruited under Dom João VI's decree of 16
  May 1818, which contracted the Fribourg agent Gachet for 100 Swiss Catholic families at the
  Fazenda do Morro Queimado. Recruitment overshot to some 261–265 families drawn from Solothurn,
  Valais and Bern as well as Fribourg — the reason a São Lucas / Soleure man is in this colony
  at all. The push behind it was the 1816–17 harvest failures after the Tambora eruption,
  post-Napoleonic poverty, and too many heirs for too little Jura land.

  - **[INFERRED]** His father's death before 1829 and the family's arrival in the cohort that
  lost roughly a quarter of its people to typhus and scurvy fit together, but the held record
  only places the death before July 1829 — it does not say where or when. The inference is
  permitted; the conclusion is not.

  - **[CONTEXTUAL / INFERRED]** The Eggendorns married repeatedly into the same small pool —
  Borer, Wehrli, Freese — and that endogamy is the social face of a flat economic position.
  Marrying at level, generation after generation, on stony serra lots divided equally among all
  heirs by Brazilian partible succession, is how a colonist family stays exactly where it
  started. No estate is built here and none is lost.

  ## Open questions

  - His birth record at São Lucas / Solothurn — the parish name is an uncertain read and has not
  been matched to a Swiss parish; his own baptism and death are both unlocated. [OPEN]

  - Which colonist lot was his. A secondary transcription of the *Heureux Voyage* arrival lists
  two Joseph Heggendorn households (Casa 71 / Lote 92 and Casa 72 / Lote 37); neither has been
  tied to this man. That transcription also gives the family's Swiss origin as Grindel, which
  does not match the 1829 act's São Lucas — an unresolved conflict between a lead and a record.
  [LEAD / OPEN]

  - Whether Bibiana Heggendorn (b. 1833, ⚭ José Borer 1854) is his daughter. [LEAD]

  ## Sources held (this repository)

  - **PAR-0073** — his own 1829 Nova Friburgo marriage to Anna Maria Frees. Names him, his
  stated origin parish and canton, his late father and his mother, and his wife's father.

  - **PAR-0072** — his daughter Maria Thecla Regina's 1845 baptism; names him and Maria Freese
  as her parents.

  - **PAR-0062** — his daughter's 1864 marriage to Vicente Borer; names him as her father and
  records him present as a witness.

  ## Regional and migration context

  Solothurn is a small, mostly German-speaking and predominantly Catholic canton in north-west
  Switzerland whose 19th-century economy was essentially agricultural. [CONTEXTUAL] Its
  emigrants of 1819 joined the Fribourg-organised passage — Estavayer-le-Lac on 4 July 1819,
  then Basel and Rotterdam to the North Sea, and on to Rio in a fleet that included the *Heureux
  Voyage*; the first ship reached Rio on 4 November 1819 and the settlement was raised to Vila
  de Nova Friburgo on 3 January 1820. [CONTEXTUAL] What the colony delivered was poor, stony
  highland land, plots too small and support too thin, and many colonists abandoned their lots
  within a few years and dispersed across the fluminense highlands. José Eggendorn's family did
  not: the held records place him at Nova Friburgo in 1829, 1845 and 1864, and his descendants
  stayed there into the 20th century. [PROVEN for the residences; CONTEXTUAL for the colony's
  condition]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). His 1829
  marriage, his daughter's 1845 baptism and her 1864 marriage were all celebrated in this
  parish. The present cathedral was inaugurated in 1869, so the earlier acts took place in the
  previous church on the same site. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colony's house and lot numbers were laid out; the ground of the
  two unresolved Heggendorn lots. [APPROX]

  - **Canton Solothurn, Switzerland — origin parish unlocated.** The 1829 act's "São Lucas" has
  not been matched to a Solothurn parish, and the competing Grindel reading is a lead. Until the
  reading is resolved there is no honest single place to visit; the Kath. Pfarrkirche St.
  Stephan at 4247 Grindel · [Maps](https://maps.google.com/?q=47.3833,7.5042) is the lead's
  candidate, not a documented site. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele aparece em três documentos retidos ao longo de trinta e cinco anos — seu
  próprio casamento (1829), o batismo da filha (1845) e o casamento dela (1864) —, o que o
  torna, para um colono de primeira geração, excepcionalmente bem atestado. No casamento de 1864
  não foi apenas nomeado como pai da noiva: serviu de testemunha, de modo que estava vivo e
  presente em Nova Friburgo naquele abril. (PAR-0073, PAR-0072, PAR-0062)

  - **[PROVEN]** Sua origem é declarada, não adivinhada: foi "nascido e baptizado na Freguezia
  de São Lucas [St. Lukas — incerto], Cantão de Soleure" — um homem de Solothurn numa colônia
  recrutada em nome do Cantão de Friburgo. O nome da freguesia é leitura incerta; o cantão não
  é. (PAR-0073)

  - **[PROVEN]** Seu pai já havia falecido quando ele se casou, em julho de 1829 — o assento o
  chama "filho legitimo do defunto Joze Geggendorn" —, enquanto a mãe, Maria Lutz, é nomeada sem
  esse qualificador. (PAR-0073)

  - **[PROVEN]** Quatro escrivães o grafaram de quatro maneiras: **Geggendorn** (1829),
  **Eggendora** (1845), **Eggendorn** (1864) e **Eckdorn**, para a filha, em 1890. O sobrenome
  nesta árvore é o registro de escrivães lusófonos fazendo o que podiam com um nome
  suíço-alemão, não uma grafia estável.

  ## Identidade

  **José Eggendorn** (também grafado Geggendorn, Eggendora, Heggendorn, Eckdorn) — homem nascido
  em Solothurn que se casou e constituiu família em Nova Friburgo. Trisavô de Iris Bohrer Muniz
  (P-0007), pela cadeia Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer
  (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN; grau derivado dos vínculos familiares]

  - **Origem:** nascido e batizado na freguesia de São Lucas [St. Lukas — incerto], Cantão de
  Soleure (Solothurn), Suíça. [PROVEN quanto ao cantão — PAR-0073; freguesia incerta]

  - **Casamento:** com Anna Maria Frees / Maria Freese (P-0102) em 20 de julho de 1829, na
  Matriz de São João Baptista, Nova Friburgo; testemunhas José Maria Dubra e Anna Maria
  Geggendorn, perante o Vigário Jacob Joye, com assistência do R. P. Sondeo Cosme. Ambos os
  nubentes constam como "de presente moradores d'esta Freguezia". (PAR-0073, evento E-0097)
  [PROVEN]

  - **Pais:** filho legítimo do falecido José Eggendorn Sr (P-0115) e de Maria Lutz (P-0116);
  família F-0058. [PROVEN — PAR-0073]

  - **Datas de nascimento e óbito:** não documentadas em nenhum registro retido. Estava vivo em
  abril de 1864. [OPEN / PROVEN quanto a 1864]

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo, alfabetização ou assinatura consta dele em qualquer
  fonte retida. O assento de 1829 o dá como morador da freguesia e nada mais; os de 1845 e 1864
  o nomeiam apenas como pai, e o de 1864 como testemunha. O meio de colono pequeno proprietário
  é leitura razoável do contexto, mas é leitura, não registro.

  ## Família e rede social

  Ele e Anna Maria Frees (P-0102; família F-0050) casaram-se em 1829, e o domicílio do casal
  está documentado em Nova Friburgo pelo batismo, em 1845, da filha Maria Thecla Regina
  (P-0071), nascida em 23 de setembro de 1844, com Pedro Freese e Regina Freese como padrinhos —
  o sobrenome da mãe dos dois lados da pia. [PROVEN — PAR-0072] Em 1864 essa filha casou-se com
  Vicente Borer, e José tanto consta como pai no assento quanto assinou como testemunha; a outra
  testemunha foi Anna Maria Bohrer. [PROVEN — PAR-0062]

  Uma compilação publicada de colonos acrescenta uma segunda filha, Bibiana Heggendorn (n.
  1833), casada com José Borer em 1854 — o que significaria duas irmãs Eggendorn casadas com
  dois irmãos Borer. Nenhum documento retido nomeia os pais de Bibiana, de modo que o par
  permanece pista. [LEAD]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Ele pertence à coorte de 1819–20 recrutada sob o decreto de Dom João VI de
  16 de maio de 1818, que contratou o agente friburguês Gachet para 100 famílias católicas
  suíças na Fazenda do Morro Queimado. O recrutamento excedeu-se para cerca de 261–265 famílias,
  vindas de Solothurn, Valais e Berna além de Friburgo — a razão pela qual um homem de São Lucas
  / Soleure está nesta colônia. O empurrão foram as quebras de safra de 1816–17 após a erupção
  do Tambora, a pobreza pós-napoleônica e herdeiros demais para pouca terra no Jura.

  - **[INFERRED]** A morte do pai antes de 1829 e a chegada numa coorte que perdeu cerca de um
  quarto de sua gente para tifo e escorbuto encaixam-se, mas o registro retido apenas situa a
  morte antes de julho de 1829 — não diz onde nem quando. A inferência é permitida; a conclusão,
  não.

  - **[CONTEXTUAL / INFERRED]** Os Eggendorn casaram-se repetidamente dentro do mesmo pequeno
  conjunto — Borer, Wehrli, Freese —, e essa endogamia é a face social de uma posição econômica
  plana. Casar no mesmo nível, geração após geração, em lotes pedregosos da serra divididos
  igualmente entre todos os herdeiros pela sucessão partilhável brasileira, é como uma família
  colona permanece exatamente onde começou. Aqui não se constrói patrimônio, e nenhum se perde.

  ## Questões em aberto

  - Seu registro de nascimento em São Lucas / Solothurn — o nome da freguesia é leitura incerta
  e não foi identificado com nenhuma paróquia suíça; seu batismo e seu óbito estão ambos não
  localizados. [OPEN]

  - Qual era o seu lote de colono. Uma transcrição secundária da chegada do *Heureux Voyage*
  lista dois domicílios Joseph Heggendorn (Casa 71 / Lote 92 e Casa 72 / Lote 37); nenhum foi
  vinculado a este homem. Essa transcrição também dá a origem suíça da família como Grindel, o
  que não coincide com o São Lucas do assento de 1829 — um conflito não resolvido entre pista e
  registro. [LEAD / OPEN]

  - Se Bibiana Heggendorn (n. 1833, ⚭ José Borer 1854) é filha dele. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — seu próprio casamento de 1829, em Nova Friburgo, com Anna Maria Frees.
  Nomeia-o, declara sua freguesia e cantão de origem, seu pai falecido e sua mãe, e o pai da
  esposa.

  - **PAR-0072** — batismo de 1845 da filha Maria Thecla Regina; nomeia-o, com Maria Freese,
  como pai.

  - **PAR-0062** — casamento de 1864 da filha com Vicente Borer; nomeia-o como pai e o registra
  presente como testemunha.

  ## Contexto regional e migratório

  Solothurn é um cantão pequeno do noroeste suíço, de maioria germanófona e predominantemente
  católica, cuja economia oitocentista era essencialmente agrícola. [CONTEXTUAL] Seus emigrantes
  de 1819 juntaram-se à passagem organizada por Friburgo — Estavayer-le-Lac em 4 de julho de
  1819, depois Basileia e Roterdã rumo ao Mar do Norte, e daí ao Rio numa frota que incluía o
  *Heureux Voyage*; o primeiro navio chegou ao Rio em 4 de novembro de 1819 e o povoado foi
  elevado a Vila de Nova Friburgo em 3 de janeiro de 1820. [CONTEXTUAL] O que a colônia entregou
  foi terra serrana pobre e pedregosa, lotes pequenos demais e apoio escasso, e muitos colonos
  abandonaram seus lotes em poucos anos, dispersando-se pela serra fluminense. A família de José
  Eggendorn não: os documentos retidos o situam em Nova Friburgo em 1829, 1845 e 1864, e seus
  descendentes ali permaneceram até o século XX. [PROVEN quanto às residências; CONTEXTUAL
  quanto à condição da colônia]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Seu
  casamento de 1829, o batismo da filha em 1845 e o casamento dela em 1864 foram todos
  celebrados nesta paróquia. A catedral atual foi inaugurada em 1869, de modo que os atos
  anteriores ocorreram na igreja precedente, no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde foram demarcados os números de casa e lote da colônia; o
  terreno dos dois lotes Heggendorn não resolvidos. [APPROX]

  - **Cantão de Solothurn, Suíça — freguesia de origem não localizada.** O "São Lucas" do
  assento de 1829 não foi identificado com nenhuma paróquia de Solothurn, e a leitura
  concorrente Grindel é pista. Enquanto a leitura não se resolver, não há um lugar único honesto
  a visitar; a Kath. Pfarrkirche St. Stephan, em 4247 Grindel ·
  [Mapa](https://maps.google.com/?q=47.3833,7.5042), é a candidata da pista, não um sítio
  documentado. [UNLOCATED]
