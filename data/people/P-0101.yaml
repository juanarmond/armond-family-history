- text: >-
    Father of Maria Thecla Regina Heggendorn (P-0071); named as her father (with Maria Freese) in
    the 1864 Vicente Borer × Maria Thecla marriage (PAR-0062). He is himself the groom "José
    Heggendorn, natural e baptizado na freguezia de São Lucas [St. Lukas], Cantão de Soleure" in
    the 1829 Nova Friburgo marriage to Anna Maria Frees (PAR-0073, event E-0097); his parents
    †José Eggendorn Sr (P-0115) × Maria Lutz (P-0116) are named there (family F-0058). He is also
    named as the father in Maria Thecla's own 1845 baptism (PAR-0072). Swiss immigrant to Nova
    Friburgo (São Lucas, Cantão de Soleure/Solothurn). Surname also written Heggendorn / Eckdorn.
profile: >-
  ## Identity

  **José Eggendorn** (also recorded Heggendorn, Geggendorn, Eckdorn) — Swiss colonist of Nova
  Friburgo, documented by his own 1829 parish marriage and his daughter's 1845 baptism. [PROVEN]

  - **Origin:** born and baptised in the parish of São Lucas (reading uncertain: "Frequézia de São
  Lucas"), Cantão de Soleure (Solothurn), Switzerland. [PROVEN — PAR-0073]

  - **Marriage:** married Anna Maria Frees (P-0102, also Maria Freese) on 20 July 1829 at the
  Matriz de São João Baptista, Nova Friburgo; witnesses José Maria Dubra and Anna Maria
  Geggendorn; officiant Vigário Jacob Joye (PAR-0073, event E-0097). [PROVEN]

  - **Parents:** legitimate son of the deceased José Eggendorn Sr (P-0115) and of Maria Lutz
  (P-0116), of the family of São Lucas, Cantão de Soleure (PAR-0073, family F-0058).
  [STRONG-EVIDENCE]

  ## Family

  He and Anna Maria Frees formed a household in the Nova Friburgo colony. Their daughter Maria
  Thecla Regina Eggendorn (P-0071) was born 23 September 1844 and baptised 2 June 1845 at the
  Matriz de São João Baptista, with Pedro Freese and Regina Freese as godparents (PAR-0072,
  event E-0096). [PROVEN] A second daughter, Bibiana Heggendorn (b. 1833, ⚭ José Borer 1854), is
  named in a published colonist compilation but no held primary record names her parents. [LEAD]

  The Eggendorn/Heggendorn family belongs to the tight, endogamous cluster of Soleure colonists
  — Borer, Wehrli, Freese, Heggendorn — who reconstituted their community in Nova Friburgo after
  the 1819 wave and intermarried across generations. A genealogy blog and a colonist receipt
  suggest the family arrived on the ship *Heureux Voyage* (1819–1820), occupying one of two
  Heggendorn lots on the colonial list — which lot is his remains unsettled. [LEAD]

  ## Open questions

  - His own birth and death records (no held primary record). [OPEN]

  - Precise lot assignment in the 1819 colonist list (two Heggendorn households recorded; link
  to this one unresolved). [OPEN]

  ## Sources held (this repository)

  - PAR-0073 (his 1829 Nova Friburgo marriage — names him, his parents, and his wife's father).

  - PAR-0072 (daughter Maria Thecla's 1845 baptism — names him and Maria Freese as parents).

  - PAR-0062 (daughter Maria Thecla's 1864 marriage — names him and Maria Freese as parents).
profile_pt: >-
  ## Identidade

  **José Eggendorn** (também registrado como Heggendorn, Geggendorn, Eckdorn) — colono suíço
  de Nova Friburgo, documentado pelo seu próprio casamento paroquial de 1829 e pelo batismo da
  sua filha em 1845. [PROVEN]

  - **Origem:** nascido e baptizado na Freguesia de São Lucas (leitura incerta: "Frequézia de
  São Lucas"), Cantão de Soleure (Solothurn), Suíça. [PROVEN — PAR-0073]

  - **Casamento:** casou-se com Anna Maria Frees (P-0102, também Maria Freese) em 20 de julho
  de 1829, na Matriz de São João Baptista, Nova Friburgo; testemunhas José Maria Dubra e Anna
  Maria Geggendorn; vigário Jacob Joye (PAR-0073, evento E-0097). [PROVEN]

  - **Pais:** filho legítimo do falecido José Eggendorn Sr (P-0115) e de Maria Lutz (P-0116),
  da família da Freguesia de São Lucas, Cantão de Soleure (PAR-0073, família F-0058).
  [STRONG-EVIDENCE]

  ## Família

  Ele e Anna Maria Frees formaram um lar na colônia de Nova Friburgo. Sua filha Maria Thecla
  Regina Eggendorn (P-0071) nasceu em 23 de setembro de 1844 e foi baptizada em 2 de junho de
  1845, na Matriz de São João Baptista, com Pedro Freese e Regina Freese como padrinhos
  (PAR-0072, evento E-0096). [PROVEN] Uma segunda filha, Bibiana Heggendorn (n. 1833, ⚭ José
  Borer 1854), é mencionada em uma compilação publicada de colonos, mas nenhuma fonte primária
  retida nomeia seus pais. [LEAD]

  A família Eggendorn/Heggendorn pertence ao grupo endogâmico de colonos de Soleure — Borer,
  Wehrli, Freese, Heggendorn — que reconstituíram a sua comunidade em Nova Friburgo após a leva
  de 1819 e intercruzaram-se por gerações. Um blog genealógico e um recibo de colonos sugerem
  que a família chegou no navio *Heureux Voyage* (1819–1820), ocupando um dos dois lotes
  Heggendorn da lista colonial — qual deles pertence a esta linhagem permanece indefinido. [LEAD]

  ## Questões em aberto

  - Seus registros de nascimento e óbito (nenhum documento primário retido). [OPEN]

  - Atribuição precisa de lote na lista de colonos de 1819 (dois domicílios Heggendorn
  registrados; o vínculo com este não está resolvido). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0073 (seu casamento de 1829 em Nova Friburgo — nomeia-o, seus pais e o pai de sua
  esposa).

  - PAR-0072 (batismo de 1845 da filha Maria Thecla — nomeia-o e a Maria Freese como pais).

  - PAR-0062 (casamento de 1864 da filha Maria Thecla — nomeia-o e a Maria Freese como pais).
