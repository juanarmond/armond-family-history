notes:
- text: >-
    Maternal grandfather of Ignez Francisca de Lima (P-0060); named in the 1777
    Piracatu baptism of his granddaughter Maria (PAR-0025) as "Joao Rodrigues de
    Mello, natural da Villa de Vianna, Arcebispado de Braga" — almost certainly Vila
    de Viana (today Viana do Castelo), Portugal. He is the Portuguese immigrant
    ancestor on the maternal side of the da Silva Xavier / Mathilde / Toledo direct
    line. His own birth, marriage and death records have not been located.
