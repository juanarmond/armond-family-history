profile: >-
  ## Identity

  Recorded once, as a maternal grandparent, in the 23 August 1777 baptism of his
  granddaughter Maria at Minas do Piracatu (Manga parish) [PROVEN] (PAR-0025). Named
  **João Rodrigues de Mello** (also *de Mello*).

  - **Origin:** *natural da Villa de Vianna, Arcebispado de Braga* — almost certainly
  Viana (today Viana do Castelo), north-west Portugal (Minho) [PROVEN] (PAR-0025). He
  is the Portuguese immigrant root on the maternal side of the da Silva Xavier /
  Matilde / Toledo direct line.

  - **Marriage:** husband of Maria Francisca Cordeira (P-0067), named together as the
  maternal grandparents in PAR-0025 [PROVEN].

  - **Birth, death, parents:** unknown; no record of his own located [OPEN]. Born, by
  inference, in the early-to-mid 18th century (grandfather of a child baptised 1777)
  [INFERRED].

  ## Family and social network

  Father of Ignez Francisca de Lima (P-0060), who married Amaro da Silva Xavier
  (P-0059); through her he is a direct maternal-line ancestor of Matilde Maria de Jesus
  and the Toledo trunk [PROVEN for the P-0060 link via PAR-0025]. No other children are
  attested in our records.

  ## Open questions

  - His own baptism, marriage and death — the generation above — would sit in the Viana
  (Braga archdiocese) parish books and, for the marriage, likely wherever he settled in
  colonial Brazil. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of granddaughter Maria) — the sole record naming
  him, establishing his Viana/Braga origin and his role as maternal grandfather.

  ## Regional and migration context

  His Viana origin marks this maternal branch as north-west Portuguese (Minho) immigrant
  stock; it pairs with the paternal side's Guimarães origin (Amaro da Silva Barreto,
  P-0064) — both in the Arcebispado de Braga. [CONTEXTUAL] The family surfaces on the
  Goiás/Piracatu frontier by 1777 and at Barbacena in the next generation, consistent
  with the 18th-century Minho → colonial-Brazil emigration into the gold-and-cattle
  interior.
profile_pt: >-
  ## Identidade

  Registrado uma única vez, como avô materno, no batismo de 23 de agosto de 1777 de sua
  neta Maria em Minas do Piracatu (freguesia da Manga) [PROVEN] (PAR-0025). Nomeado
  **João Rodrigues de Mello** (também *de Mello*).

  - **Origem:** *natural da Villa de Vianna, Arcebispado de Braga* — quase certamente
  Viana (hoje Viana do Castelo), noroeste de Portugal (Minho) [PROVEN] (PAR-0025). É a
  raiz imigrante portuguesa do lado materno da linha direta da Silva Xavier / Matilde /
  Toledo.

  - **Casamento:** marido de Maria Francisca Cordeira (P-0067), nomeados juntos como os
  avós maternos em PAR-0025 [PROVEN].

  - **Nascimento, óbito, pais:** desconhecidos; nenhum registro próprio localizado
  [OPEN]. Nascido, por inferência, no início ou meados do século XVIII (avô de uma
  criança batizada em 1777) [INFERRED].

  ## Família e rede social

  Pai de Ignez Francisca de Lima (P-0060), que se casou com Amaro da Silva Xavier
  (P-0059); por meio dela é ancestral direto, pela linha materna, de Matilde Maria de
  Jesus e do tronco Toledo [PROVEN para a ligação com P-0060 via PAR-0025]. Nenhum outro
  filho está atestado em nossos registros.

  ## Questões em aberto

  - Seu próprio batismo, casamento e óbito — a geração anterior — estariam nos livros
  paroquiais de Viana (arquidiocese de Braga) e, quanto ao casamento, provavelmente onde
  quer que ele tenha se estabelecido no Brasil colonial. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de 1777 em Piracatu de sua neta Maria) — o único registro que o
  nomeia, estabelecendo sua origem em Viana/Braga e seu papel de avô materno.

  ## Contexto regional e migratório

  Sua origem em Viana marca este ramo materno como descendência imigrante do noroeste de
  Portugal (Minho); combina-se com a origem em Guimarães do lado paterno (Amaro da Silva
  Barreto, P-0064) — ambos no Arcebispado de Braga. [CONTEXTUAL] A família surge na
  fronteira de Goiás/Piracatu por volta de 1777 e em Barbacena na geração seguinte,
  consistente com a emigração setecentista do Minho → Brasil colonial rumo ao interior do
  ouro e do gado.
