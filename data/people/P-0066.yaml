profile: >-
  ## Interesting facts

  - **[PROVEN]** One record holds him: his granddaughter's 1777 Piracatu baptism (PAR-0025), "Joao Rodrigues de Mello, natural da Villa de Vianna, Arcebispado de Braga" — the clause that fixes his Portuguese origin as primary-confirmed.

  - **[CONTEXTUAL]** Viana (today Viana do Castelo) is the principal town of the northern Minho coast — a fishing and mercantile port that in the 18th century was one of the major departure points for Portuguese emigration to Brazil.

  - **[CONTEXTUAL]** His Viana origin pairs exactly with Amaro da Silva Barreto's Guimarães origin: two grandfathers of the same generation, both from the Arcebispado de Braga, each marrying a colonial Brazilian-born woman on the frontier. The pairing is not coincidence but the standard shape of the 18th-century immigrant marriage market.

  - **[INFERRED]** Unlike the paternal grandfather, he carries **no rank and no title in any record**. Whatever standing this side of the family had, it was not military-administrative — which makes the compiled claim that he was working a mining claim by 1748 the only proposed explanation on the table.

  - **[INFERRED]** The "de Lima" that his daughter Ignez and his probable son Manoel both carried is not his surname ("Rodrigues de Mello") nor his wife's ("Cordeira"). His children re-labelled themselves to a local kin-cluster — a naming flexibility that obscures the patriline and is itself evidence of how an immigrant's family assimilated.

  ## Identity

  Recorded once, as a maternal grandparent, in the 23 August 1777 baptism of his granddaughter Maria at Minas do Piracatu (Manga parish) [PROVEN] (PAR-0025). Named **João Rodrigues de Mello** (also *do Mello*). Father of Ignez Francisca de Lima (P-0060), hence 2nd-great-grandfather of Eliza Balbina de Toledo (P-0017) on that line.

  - **Origin:** *natural da Villa de Vianna, Arcebispado de Braga* — almost certainly Viana (today Viana do Castelo), north-west Portugal (Minho) [PROVEN] (PAR-0025). He is the Portuguese immigrant root on the maternal side of the da Silva Xavier / Mathilde / Toledo direct line.

  - **Marriage:** husband of Maria Francisca Cordeira (P-0067), named together as the maternal grandparents in PAR-0025 [PROVEN].

  - **Birth, death, parents:** unknown at primary level; no record of his own is located [OPEN]. Born, by inference, in the early-to-mid 18th century (grandfather of a child baptised 1777) [INFERRED]. The FamilySearch collaborative tree (node LT21-QN6) estimates 1715–1795 [LEAD — a tree estimate, not primary]. That tree assigns him parents Domingos Rodrigues de Lima × Maria Nunes of Viana do Castelo, but this rests on a single garbled auto-extracted Viana index record that does not even pin the parish; it is attractive only because "Rodrigues de Lima" would explain the "de Lima" his children carried, which is possibly circular. A 2026-09-10 register check weakens it further: both Viana-town baptism books (Santa Maria Maior and Monserrate) were read across the claimed date (b. 1 Jan 1715) and contain no such baptism — the parentage is now contradicted at the very register the claim cites. Do not promote. [LEAD — weak]

  ## Standing and profession

  - **No rank, office or occupation is stated for him in any held record.** He survives only as a named grandparent — the plainest entry of the four grandparents in PAR-0025, and pointedly plainer than the paternal grandfather's abbreviated military title. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record, and no office to infer letters from. Unlike the militia men on the paternal side, there is nothing here even to argue from.

  - **A compiled claim of mining capital, not held here:** the araposadachapada blog places him at the Paracatú mines by **1748**, holding a claim on the São Domingos creek with **14 enslaved workers**. If true it would be the only material wealth ever attributed to him, and it would be extractive capital rather than land. [LEAD — blog/compiled; no held record]

  ## Family and social network

  - **Daughter (our line):** Ignez Francisca de Lima (P-0060), who married Amaro da Silva Xavier (P-0059); through her he is a direct maternal-line ancestor of Mathilde Maria de Jesus and the Toledo trunk [PROVEN for the P-0060 link via PAR-0025]. No other child is attested at primary level.

  - **Further children [LEAD — blog/compiled]:** the araposadachapada study lists five — **José Rodrigues de Lima** "o paracatuense", **Inês/Ignez** (our line), **Francisca** (bapt. 13 Dec 1765, Paracatú), **Francisco** (bapt. 23 Oct 1775, Paracatú) and **Matilde** (b. 8 Jun 1780, bapt. same month, Paracatú — a sibling of Ignez, not our Mathilde Maria de Jesus). A 1799 Paracatú marriage document for José reads verbatim "*filho legítimo de João Roiz de Melo e Maria Francisca Cardosa*", where "Cardosa" is a variant of "Cordeira/Cordeiro" in that act.

  - **A probable further son:** Capitão Manoel Rodrigues de Lima of São João del Rei — Mathilde's dowry-donor "uncle", who called Ignez "minha irmã Dona Francisca de Lima". The shared "Rodrigues" supports his being Ignez's brother. [INFERRED]

  - **The "de Lima" surname puzzle** [INFERRED]: he is "Rodrigues do Mello" and his wife "Cordeira", yet the children are "de Lima" — an adopted or inherited element that became the family's handle in São João del Rei and remains a useful identification key when reading mixed SJdRei registers.

  ## What we can extrapolate

  - **His standing, whatever it was, was not office-based — and that is the sharpest contrast in the whole couple** [INFERRED]. His daughter's father-in-law carried a rank; his son-in-law made Alferes and then Capitão; his grandson made Capitão. He is styled nothing at all, in a document that styles the other grandfather. Two immigrant grandfathers of the same generation and the same archdiocese took different routes into colonial society: one through the Ordenanças, one not.

  - **If the mining claim is real, his capital was the perishable kind** [LEAD for the claim; CONTEXTUAL for the mechanics]. A placer claim with fourteen enslaved workers is wealth in *labour and a deposit*, not in land. Land keeps yielding and passes intact-in-principle to heirs; a gold claim exhausts, and the enslaved people held to work it are liquidated, sold or divided when the claim fails or the owner dies. That is why an extractive fortune rarely shows up two generations later, and why nothing in the Barbacena record traces back to Paracatú gold.

  - **Partible inheritance then compounded the problem** [CONTEXTUAL]. On the compiled child-list he had five children, plausibly six with Manoel. Brazilian law split an estate equally among all of them; a mining claim already past its best, divided six ways, leaves each child a name rather than a holding — which may be exactly why his children are identifiable by a kin-cluster surname rather than by property.

  - **"De Lima" is the assimilation, visible as a word** [INFERRED]. An immigrant from Viana whose children adopt a surname neither he nor his wife carried is a family that anchored itself to a local network instead of to a patriline. In practical terms the children inherited *connections* — a São João del Rei kin-cluster that could style a son Capitão and hand an enslaved woman into a niece's dowry — where they may not have inherited much else. Connections are transmissible in a way a worked-out claim is not.

  - **Education, on this side, cannot even be argued** [CONTEXTUAL]. Schooling was a purchased, class-linked privilege in the colonial interior, and the usual inferential handle — an office that presupposes letters — does not exist for him. His grandson's line acquired letters through militia rank on the *paternal* side, not through him.

  - **The arc:** a Viana emigrant to the Paracatú goldfields, whose daughter married into a rising militia family and whose grandchildren became Barbacena and São João del Rei gentry. The upward movement is real, but the vehicle was his daughter's marriage and the Lima network, not anything he is documented to have owned. [INFERRED]

  ## Open questions

  - His own baptism, marriage and death — the generation above — would sit in the Viana (Braga archdiocese) parish books and, for the marriage, wherever he settled in colonial Brazil. His exact Viana parish is not pinned; Viana do Castelo has several and no clean primary names his. [bounded-negative, 2026-08-12]

  - His marriage to Maria Francisca Cordeira, which would name both sets of parents and his Viana parish, is not at Itu: the N.S. da Candelária marriage registers were browsed and cleared — Livro 3 (free parishioners, 1742–1763, to book-end) and Livro 4 (1752–1759) — and the couple is absent. It was most likely at the arraial de Paracatú (per the blog, and since daughter Ignez is recorded "natural" there), and the Paracatú parish books are not on FamilySearch, so the act is off-tool (Arquivo da Diocese / Arquivo Público de Paracatu). [bounded-negative, 2026-08-13]

  - Whether the 1748 São Domingos mining claim is his. A Paracatú lavra record or a claim register would settle it and would be the only evidence of his means. [OPEN]

  ## Sources held (this repository)

  - PAR-0025 (1777 Piracatu baptism of his granddaughter Maria) — the sole record naming him, establishing his Viana/Braga origin and his role as maternal grandfather.

  ## Regional and migration context

  His Viana origin marks this maternal branch as north-west Portuguese (Minho) immigrant stock; it pairs with the paternal side's Guimarães origin (Amaro da Silva Barreto, P-0064) — both in the Arcebispado de Braga. [CONTEXTUAL] The family surfaces on the Goiás/Piracatu frontier by 1777 and at Barbacena in the next generation, consistent with the 18th-century Minho → colonial-Brazil emigration into the gold-and-cattle interior; gold was struck at Paracatú in the 1740s, which is the decade the compiled sources place him there. [CONTEXTUAL] The Minho was Europe's densest rural minifúndio (~96 inhabitants/km² by 1801) and the single greatest 18th-century source of Portuguese emigration to Brazil — the structural push behind a Viana emigrant like him; movement to the goldfields ran under the Provisão de 20 de março de 1720 (D. João V) passport regime, and frontier land under the sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Origin parish:** Sé Catedral / Igreja Matriz de Viana do Castelo, Santa Maria Maior, Viana do Castelo, Portugal (his baptism is not held; the parentage is a lead) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=S%C3%A9%20Catedral%20de%20Viana%20do%20Castelo%2C%20Santa%20Maria%20Maior%2C%20Portugal)

  - **His wife's town:** Matriz da Candelária, Itu, SP [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-23.264167,-47.299722)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Um único registro o sustenta: o batismo de sua neta no Piracatu, em 1777 (PAR-0025), "Joao Rodrigues de Mello, natural da Villa de Vianna, Arcebispado de Braga" — a cláusula que fixa sua origem portuguesa como confirmada por fonte primária.

  - **[CONTEXTUAL]** Viana (hoje Viana do Castelo) é a principal vila do litoral norte do Minho — porto pesqueiro e mercantil que, no século XVIII, foi um dos maiores pontos de partida da emigração portuguesa para o Brasil.

  - **[CONTEXTUAL]** Sua origem em Viana emparelha exatamente com a origem de Amaro da Silva Barreto em Guimarães: dois avôs da mesma geração, ambos do Arcebispado de Braga, cada um casado com uma mulher nascida na colônia, na fronteira. O par não é coincidência, mas o formato-padrão do mercado matrimonial imigrante setecentista.

  - **[INFERRED]** Diferentemente do avô paterno, ele não carrega **patente nem título em registro algum**. Qualquer posição social que este lado da família tivesse não era militar-administrativa — o que faz da alegação compilada de que ele explorava uma lavra em 1748 a única explicação em cima da mesa.

  - **[INFERRED]** O "de Lima" que sua filha Ignez e seu provável filho Manoel carregavam não é o sobrenome dele ("Rodrigues de Mello") nem o da esposa ("Cordeira"). Os filhos se rotularam segundo um agrupamento familiar local — flexibilidade de nomeação que obscurece a linha paterna e é, ela própria, evidência de como a família de um imigrante se assimilou.

  ## Identidade

  Registrado uma única vez, como avô materno, no batismo de 23 de agosto de 1777 de sua neta Maria, nas Minas do Piracatu (freguesia da Manga) [PROVEN] (PAR-0025). Nomeado **João Rodrigues de Mello** (também *do Mello*). Pai de Ignez Francisca de Lima (P-0060) e, portanto, trisavô de Eliza Balbina de Toledo (P-0017) nessa linha.

  - **Origem:** *natural da Villa de Vianna, Arcebispado de Braga* — quase certamente Viana (hoje Viana do Castelo), noroeste de Portugal (Minho) [PROVEN] (PAR-0025). É a raiz imigrante portuguesa do lado materno da linha direta da Silva Xavier / Mathilde / Toledo.

  - **Casamento:** marido de Maria Francisca Cordeira (P-0067), nomeados juntos como avós maternos em PAR-0025 [PROVEN].

  - **Nascimento, óbito, pais:** desconhecidos em nível primário; nenhum registro seu foi localizado [OPEN]. Nascido, por inferência, no início ou em meados do século XVIII (avô de uma criança batizada em 1777) [INFERRED]. A árvore colaborativa do FamilySearch (nó LT21-QN6) estima 1715–1795 [LEAD — estimativa de árvore, não fonte primária]. Essa árvore lhe atribui os pais Domingos Rodrigues de Lima × Maria Nunes, de Viana do Castelo, mas isso se apoia num único registro de índice de Viana, truncado e extraído automaticamente, que nem sequer fixa a freguesia; é atraente apenas porque "Rodrigues de Lima" explicaria o "de Lima" dos filhos, o que é possivelmente circular. Uma verificação de registro em 2026-09-10 o enfraquece ainda mais: os dois livros de batismos da vila de Viana (Santa Maria Maior e Monserrate) foram lidos na data alegada (n. 1 jan. 1715) e não contêm tal batismo — a filiação está agora contrariada no próprio registro que a alegação cita. Não promover. [LEAD — fraco]

  ## Posição social e profissão

  - **Nenhuma patente, ofício ou ocupação lhe é atribuída em registro disponível.** Ele sobrevive apenas como avô nomeado — a entrada mais simples dos quatro avós em PAR-0025, e notavelmente mais simples que o título militar abreviado do avô paterno. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro assinável disponível e nenhum ofício de que inferir letras. Diferentemente dos milicianos do lado paterno, aqui não há sequer de que argumentar.

  - **Uma alegação compilada de capital minerador, não disponível aqui:** o blog araposadachapada o situa nas minas de Paracatú em **1748**, com uma data no córrego São Domingos e **14 trabalhadores escravizados**. Se verdadeira, seria a única riqueza material já atribuída a ele — e seria capital extrativo, não fundiário. [LEAD — blog/compilado; sem registro disponível]

  ## Família e rede social

  - **Filha (nossa linha):** Ignez Francisca de Lima (P-0060), casada com Amaro da Silva Xavier (P-0059); por ela é ancestral direto, em linha materna, de Mathilde Maria de Jesus e do tronco Toledo [PROVEN quanto ao vínculo com P-0060, via PAR-0025]. Nenhum outro filho está atestado em nível primário.

  - **Outros filhos [LEAD — blog/compilado]:** o estudo araposadachapada lista cinco — **José Rodrigues de Lima**, "o paracatuense"; **Inês/Ignez** (nossa linha); **Francisca** (bat. 13 dez. 1765, Paracatú); **Francisco** (bat. 23 out. 1775, Paracatú); e **Matilde** (n. 8 jun. 1780, batizada no mesmo mês, Paracatú — irmã de Ignez, não a nossa Mathilde Maria de Jesus). Um documento de casamento de 1799 em Paracatú, relativo a José, diz literalmente "*filho legítimo de João Roiz de Melo e Maria Francisca Cardosa*", em que "Cardosa" é variante de "Cordeira/Cordeiro" naquele ato.

  - **Um provável outro filho:** o Capitão Manoel Rodrigues de Lima, de São João del Rei — o "tio" doador do dote de Mathilde, que chamou Ignez de "minha irmã Dona Francisca de Lima". O "Rodrigues" comum sustenta que ele seja irmão de Ignez. [INFERRED]

  - **O enigma do sobrenome "de Lima"** [INFERRED]: ele é "Rodrigues do Mello" e a esposa "Cordeira", mas os filhos são "de Lima" — elemento adotado ou herdado que virou a marca da família em São João del Rei e continua útil como chave de identificação na leitura de registros mistos daquela vila.

  ## O que podemos extrapolar

  - **Sua posição social, qualquer que fosse, não se baseava em ofício — e esse é o contraste mais nítido de todo o casal** [INFERRED]. O sogro de sua filha tinha patente; o genro fez Alferes e depois Capitão; o neto fez Capitão. Ele não recebe tratamento algum, num documento que trata o outro avô. Dois avôs imigrantes da mesma geração e do mesmo arcebispado tomaram rotas distintas para dentro da sociedade colonial: um pelas Ordenanças, outro não.

  - **Se a lavra for real, seu capital era do tipo perecível** [LEAD quanto à lavra; CONTEXTUAL quanto à mecânica]. Uma data de aluvião com catorze trabalhadores escravizados é riqueza em *mão de obra e num depósito*, não em terra. A terra segue rendendo e passa, em princípio íntegra, aos herdeiros; uma lavra de ouro se esgota, e as pessoas escravizadas mantidas para trabalhá-la são liquidadas, vendidas ou divididas quando a data falha ou o dono morre. É por isso que uma fortuna extrativa raramente reaparece duas gerações depois, e por que nada no registro de Barbacena remonta ao ouro de Paracatú.

  - **A sucessão partível então agravou o problema** [CONTEXTUAL]. Pela lista compilada de filhos, ele teve cinco, plausivelmente seis com Manoel. A lei brasileira dividia o espólio igualmente entre todos; uma lavra já passada do auge, repartida em seis, deixa a cada filho um nome, não uma posse — o que pode ser exatamente a razão de seus filhos serem identificáveis por um sobrenome de agrupamento familiar, e não por propriedade.

  - **"De Lima" é a assimilação, visível como palavra** [INFERRED]. Um imigrante de Viana cujos filhos adotam um sobrenome que nem ele nem a esposa carregavam é uma família que se ancorou numa rede local em vez de numa linha paterna. Na prática, os filhos herdaram *vínculos* — um agrupamento familiar em São João del Rei capaz de intitular um filho de Capitão e de entregar uma mulher escravizada ao dote de uma sobrinha — onde talvez pouco mais tenham herdado. Vínculos são transmissíveis de um modo que uma lavra exaurida não é.

  - **A educação, deste lado, não pode sequer ser argumentada** [CONTEXTUAL]. A escolarização era privilégio comprado e ligado à classe no interior colonial, e a alça inferencial habitual — um ofício que pressupõe letras — não existe para ele. A linha de seu neto adquiriu letras pela patente miliciana do lado *paterno*, não por ele.

  - **O arco:** um emigrante de Viana rumo às lavras de Paracatú, cuja filha casou com uma família miliciana em ascensão e cujos netos se tornaram gente de posses em Barbacena e São João del Rei. O movimento ascendente é real, mas o veículo foi o casamento da filha e a rede Lima, não algo que ele esteja documentado como tendo possuído. [INFERRED]

  ## Questões em aberto

  - Seu próprio batismo, casamento e óbito — a geração acima — estariam nos livros paroquiais de Viana (Arcebispado de Braga) e, quanto ao casamento, onde quer que ele se tenha estabelecido no Brasil colonial. Sua freguesia exata em Viana não está fixada; Viana do Castelo tem várias e nenhuma fonte primária limpa nomeia a dele. [negativo delimitado, 2026-08-12]

  - Seu casamento com Maria Francisca Cordeira, que nomearia os dois conjuntos de pais e sua freguesia em Viana, não está em Itu: os registros de casamento de N.S. da Candelária foram percorridos e descartados — Livro 3 (fregueses livres, 1742–1763, até o fim do livro) e Livro 4 (1752–1759) — e o casal está ausente. Foi muito provavelmente no arraial de Paracatú (conforme o blog e porque a filha Ignez consta ali como "natural"), e os livros paroquiais de Paracatú não estão no FamilySearch, de modo que o ato fica fora do alcance da ferramenta (Arquivo da Diocese / Arquivo Público de Paracatu). [negativo delimitado, 2026-08-13]

  - Se a lavra de 1748 no São Domingos é dele. Um registro de lavra ou de datas em Paracatú resolveria a questão e seria a única evidência de seus meios. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0025 (batismo de sua neta Maria no Piracatu, 1777) — o único registro que o nomeia, estabelecendo sua origem em Viana/Braga e seu papel de avô materno.

  ## Contexto regional e migratório

  Sua origem em Viana marca este ramo materno como estirpe imigrante do noroeste português (Minho); emparelha com a origem do lado paterno em Guimarães (Amaro da Silva Barreto, P-0064) — ambas no Arcebispado de Braga. [CONTEXTUAL] A família aflora na fronteira de Goiás/Piracatu em 1777 e em Barbacena na geração seguinte, coerentemente com a emigração setecentista do Minho para o Brasil colonial rumo ao interior do ouro e do gado; o ouro foi descoberto em Paracatú nos anos 1740, década em que as fontes compiladas o situam ali. [CONTEXTUAL] O Minho era o minifúndio rural mais denso da Europa (~96 habitantes/km² em 1801) e a maior fonte setecentista isolada da emigração portuguesa para o Brasil — o empurrão estrutural por trás de um emigrante de Viana como ele; o deslocamento para as minas corria sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V), e a terra de fronteira sob o sistema de sesmarias. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia de origem:** Sé Catedral / Igreja Matriz de Viana do Castelo, Santa Maria Maior, Viana do Castelo, Portugal (seu batismo não está disponível; a filiação é pista) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=S%C3%A9%20Catedral%20de%20Viana%20do%20Castelo%2C%20Santa%20Maria%20Maior%2C%20Portugal)

  - **A vila da esposa:** Matriz da Candelária, Itu, SP [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-23.264167,-47.299722)
