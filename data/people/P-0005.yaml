profile: >-
  ## Identity

  Always **Cidalia Engracio Guimarães** at birth and marriage, and **Cidalia Engracio
  Armond** by her married name. Her name is written in several forms across her own
  records: the given name "CIDÁLIA" alone in her 1930 birth registration (CIV-0022);
  "Cidalia Engracio Guimarães" and the adopted signature "Cidalia Engrácio Armond" on
  her 1952 marriage certificate (CIV-0002); "Cidalia Engracio Armond" as surviving wife
  in her husband's 1991 death record (CIV-0003); and "Cidalia Igracio Armond" as a
  grandparent name on a later family birth certificate (CIV-0008). [PROVEN]

  - **Birth:** 15 September 1930, at home ("em domicílio"), district of Alvorada,
  município de Carangola, Minas Gerais [PROVEN] — her own civil birth registration,
  declared by her father (CIV-0022). This supersedes the "15 November" family variant.

  - **Parents:** Antonio Engracio Filho (P-0010, recorded there as "Antônio Engrácio de
  Souza") and Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0022, CIV-0002).

  - **Marriage:** married Geraldo Paz Armond (P-0004) on 31 May 1952 at Eugenópolis,
  Minas Gerais (Casamento nº 898, livro 13-B) [PROVEN] (CIV-0002); she thereafter signed
  "Cidalia Engrácio Armond".

  - **Children:** she and Geraldo left at least one child — a living descendant, details
  withheld [PROVEN] (Geraldo's 1991 death records "deixou um filho", CIV-0003).

  - **Death:** deceased [per repository standing]; no death record is held. She was still
  living in February 1991, named as surviving wife in Geraldo's death record (CIV-0003).
  [PROVEN — living Feb 1991]

  ## Standing and profession

  - **Doméstica** at her 1952 marriage [PROVEN] (CIV-0002). No further occupation is
  documented.

  Her marriage is the point at which the Engrácio/Guimarães line joins the tree: she is
  the ancestor through whom this whole branch enters the family. [INFERRED]

  ## Family and social network

  Her 1952 marriage (CIV-0002) is the bridge between two lines — it ties her
  Engrácio/Guimarães ascendance to the Armond/Paz line of her husband Geraldo (son of
  Aristão Ferreira Armond and Liliosa Paz). [PROVEN]

  Her own 1930 birth registration (CIV-0022) is unusually rich: in a single act it fixes
  both her parents and both grandparent couples — paternal Antonio Engracio de Souza and
  Luzia da Conceição, maternal Francisco José de Carvalho Guimarães and Emerenciana Maria
  de Jesus — which makes it the structural spine of the whole line. [PROVEN]

  ## What we can extrapolate

  Both her parents were Minas Gerais-born and the family was rooted in the
  Carangola/Alvorada area of the Zona da Mata Mineira at her 1930 birth (CIV-0022). By
  mid-century the family straddled interior Minas and, in the next generation, Rio de
  Janeiro: her 1952 marriage was registered in the adjacent Minas município of Eugenópolis
  (CIV-0002), while her husband's line ended in Volta Redonda, RJ (CIV-0003). [INFERRED]

  The double surname *Engracio Guimarães* she carries is the visible fusion of her
  father's Engrácio line and her mother's Carvalho-Guimarães line. [INFERRED]

  Structurally, she is the convergence node of two different non-landed routes to standing.
  [INFERRED / CONTEXTUAL] Her paternal Engrácio-Souza line was commercial-urban — a *negociante*
  father who "não deixou bens" (see P-0010) — while her maternal Carvalho-Guimarães line was
  immigrant-descended and read in the family research as officer-rooted (a Guarda Nacional rank,
  a lead from the maternal-line profiles). Neither route was heritable land, and both were
  already migrating interior-MG → Rio de Janeiro in her parents' generation; her 1952 marriage
  into the Armond line carried that same interior → RJ trajectory forward. (Structural inference
  only; nothing of her private life is recorded here.)

  ## Open questions

  - Her own death record — not held; it would confirm the date and place. [OPEN]

  - Her full sibling set — her parents' death records report several adult children, but
  her siblings are not yet named from the records held for her. [OPEN]

  ## Sources held (this repository)

  - CIV-0022 (her own 1930 birth registration, Alvorada — birth date, place and both
  grandparent couples) · CIV-0002 (1952 marriage to Geraldo Paz Armond — doméstica,
  adopted name "Cidalia Engrácio Armond").

  - CIV-0003 (Geraldo's 1991 death — names her as surviving wife "Cidalia Engracio
  Armond"; the couple left one child) · CIV-0008 (a later family birth certificate —
  records the name form "Cidalia Igracio Armond").

  ## Regional and migration context

  Her documented life sits in the Zona da Mata Mineira — born at Alvorada (Carangola) in
  1930 (CIV-0022), married at Eugenópolis in 1952 (CIV-0002). In her generation the
  region's coffee economy was in long decline and her paternal Engrácio household moved to
  Rio de Janeiro (where both her parents later died); her own marriage into the Armond
  line carried the same interior-Minas → Rio trajectory forward. [CONTEXTUAL] No held
  record states a personal migration motive. Her two ascendant lines rooted on the post-1850
  Carangola coffee frontier (Lei Eusébio de Queirós 1850 → Lei Áurea 1888); in her generation
  that economy declined and the family shifted toward Rio de Janeiro — the same interior-MG → RJ
  movement. [CONTEXTUAL]

  ## Where to go today

  - **Birth (1930):** district of Alvorada, Carangola, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Alvorada%2C+Carangola%2C+MG)

  - **Marriage (1952, civil registration):** Eugenópolis, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Eugen%C3%B3polis%2C+MG)
profile_pt: >-
  ## Identidade

  Sempre **Cidalia Engracio Guimarães** ao nascer e ao casar, e **Cidalia Engracio
  Armond** pelo nome de casada. Seu nome aparece em várias formas em seus próprios
  registros: apenas o prenome "CIDÁLIA" em seu registro de nascimento de 1930 (CIV-0022);
  "Cidalia Engracio Guimarães" e a assinatura adotada "Cidalia Engrácio Armond" em sua
  certidão de casamento de 1952 (CIV-0002); "Cidalia Engracio Armond" como esposa
  sobrevivente no registro de óbito de seu marido em 1991 (CIV-0003); e "Cidalia Igracio
  Armond" como nome de avó em uma certidão de nascimento familiar posterior (CIV-0008).
  [PROVEN]

  - **Nascimento:** 15 de setembro de 1930, em domicílio, distrito de Alvorada, município
  de Carangola, Minas Gerais [PROVEN] — seu próprio registro civil de nascimento,
  declarado por seu pai (CIV-0022). Isso supera a variante familiar de "15 de novembro".

  - **Pais:** Antonio Engracio Filho (P-0010, ali registrado como "Antônio Engrácio de
  Souza") e Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0022, CIV-0002).

  - **Casamento:** casou-se com Geraldo Paz Armond (P-0004) em 31 de maio de 1952, em
  Eugenópolis, Minas Gerais (Casamento nº 898, livro 13-B) [PROVEN] (CIV-0002); passou
  então a assinar "Cidalia Engrácio Armond".

  - **Filhos:** ela e Geraldo deixaram ao menos um filho — um descendente vivo, cujos
  detalhes são omitidos [PROVEN] (o óbito de Geraldo de 1991 registra "deixou um
  filho", CIV-0003).

  - **Óbito:** falecida [conforme o registro do repositório]; nenhum registro de óbito é
  mantido. Ainda estava viva em fevereiro de 1991, nomeada como esposa sobrevivente no
  registro de óbito de Geraldo (CIV-0003). [PROVEN — viva em fev. 1991]

  ## Posição social e profissão

  - **Doméstica** em seu casamento de 1952 [PROVEN] (CIV-0002). Nenhuma outra ocupação
  está documentada.

  Seu casamento é o ponto em que a linha Engrácio/Guimarães se junta à árvore: ela é a
  ancestral por meio de quem todo esse ramo entra na família. [INFERRED]

  ## Família e rede social

  Seu casamento de 1952 (CIV-0002) é a ponte entre duas linhas — liga sua ascendência
  Engrácio/Guimarães à linha Armond/Paz de seu marido Geraldo (filho de Aristão Ferreira
  Armond e Liliosa Paz). [PROVEN]

  Seu próprio registro de nascimento de 1930 (CIV-0022) é excepcionalmente rico: em um
  único ato fixa tanto seus pais quanto os dois casais de avós — paternos Antonio Engracio
  de Souza e Luzia da Conceição, maternos Francisco José de Carvalho Guimarães e
  Emerenciana Maria de Jesus — o que o torna a espinha estrutural de toda a linha. [PROVEN]

  ## O que podemos extrapolar

  Ambos os pais nasceram em Minas Gerais e a família estava enraizada na região de
  Carangola/Alvorada, na Zona da Mata Mineira, ao seu nascimento em 1930 (CIV-0022). Em
  meados do século a família se dividia entre o interior de Minas e, na geração seguinte,
  o Rio de Janeiro: seu casamento de 1952 foi registrado no município mineiro vizinho de
  Eugenópolis (CIV-0002), enquanto a linha de seu marido terminou em Volta Redonda, RJ
  (CIV-0003). [INFERRED]

  O sobrenome duplo *Engracio Guimarães* que ela carrega é a fusão visível da linha
  Engrácio de seu pai com a linha Carvalho-Guimarães de sua mãe. [INFERRED]

  Estruturalmente, ela é o nó de convergência de dois caminhos distintos e não fundiários rumo à
  posição social. [INFERRED / CONTEXTUAL] Sua linha paterna Engrácio-Souza era comercial-urbana
  — um pai *negociante* que "não deixou bens" (ver P-0010) —, enquanto sua linha materna
  Carvalho-Guimarães era descendente de imigrantes e lida na pesquisa da família como enraizada
  em oficialato (um posto na Guarda Nacional, uma pista dos perfis da linha materna). Nenhum dos
  caminhos era terra herdável, e ambos já migravam do interior de MG para o Rio de Janeiro na
  geração de seus pais; seu casamento de 1952 com a linha Armond levou adiante essa mesma
  trajetória interior → RJ. (Apenas inferência estrutural; nada de sua vida privada é registrado
  aqui.)

  ## Questões em aberto

  - Seu próprio registro de óbito — não localizado; confirmaria a data e o local. [OPEN]

  - O conjunto completo de seus irmãos — os registros de óbito de seus pais informam
  vários filhos adultos, mas seus irmãos ainda não foram nomeados a partir dos registros
  mantidos para ela. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0022 (seu próprio registro de nascimento de 1930, Alvorada — data, local e os dois
  casais de avós) · CIV-0002 (casamento de 1952 com Geraldo Paz Armond — doméstica, nome
  adotado "Cidalia Engrácio Armond").

  - CIV-0003 (óbito de Geraldo em 1991 — nomeia-a como esposa sobrevivente "Cidalia
  Engracio Armond"; o casal deixou um filho) · CIV-0008 (uma certidão de nascimento
  familiar posterior — registra a forma de nome "Cidalia Igracio Armond").

  ## Contexto regional e migratório

  Sua vida documentada situa-se na Zona da Mata Mineira — nascida em Alvorada (Carangola)
  em 1930 (CIV-0022), casada em Eugenópolis em 1952 (CIV-0002). Em sua geração a economia
  cafeeira da região estava em longo declínio e a casa paterna Engrácio mudou-se para o Rio
  de Janeiro (onde ambos os pais viriam a falecer); seu próprio casamento com a linha
  Armond levou adiante a mesma trajetória interior-Minas → Rio. [CONTEXTUAL] Nenhum
  registro mantido declara um motivo pessoal de migração. Suas duas linhas ascendentes
  enraizaram-se na fronteira cafeeira de Carangola do pós-1850 (Lei Eusébio de Queirós 1850 →
  Lei Áurea 1888); em sua geração essa economia declinou e a família deslocou-se rumo ao Rio de
  Janeiro — o mesmo movimento interior-MG → RJ. [CONTEXTUAL]

