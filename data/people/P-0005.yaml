profile: >-
  ## Interesting facts

  - **[PROVEN]** Her 1930 birth registration (CIV-0022) is the archive's single richest document for her branch: one act records not only her own birth but both sets of grandparents — paternal Antonio Engracio de Souza and Luzia da Conceição, maternal Francisco José de Carvalho Guimarães and Emerenciana Maria de Jesus. Without it, the two grandparent couples would be unanchored.

  - **[INFERRED]** Her double surname "Engrácio Guimarães" is the visible fusion of two lines: her father's Engrácio-Souza commercial family and her mother's Carvalho-Guimarães immigrant-descended farming family — two non-landed routes to standing, joined in one woman.

  - **[PROVEN]** She appears as "CIDÁLIA" at birth (CIV-0022), "Cidalia Engrácio Guimarães" at marriage (CIV-0002), "Cidalia Engrácio Armond" as a wife and widow (CIV-0003), and "Cidalia Igracio Armond" on a later family birth certificate (CIV-0008) — four name forms across a 93-year documented life.

  - **[CONTEXTUAL]** She was born in the coffee-frontier Zona da Mata Mineira (Alvorada, Carangola, 1930), married in the adjacent município of Eugenópolis (1952), and died in Volta Redonda (2023) — her biography spans the same Minas interior → Rio de Janeiro industrial-city trajectory that defined mid-20th-century Brazil.

  - **[PROVEN]** Her occupation shifted from "doméstica" at her 1952 marriage (CIV-0002) to "costureira aposentada" (retired seamstress) at her 2023 death (CIV-0027) — she had practised a skilled trade during her adult working life, a fact invisible from the marriage record alone.

  - **[INFERRED]** Her death certificate (CIV-0027) records her naturalidade as "Eugenópolis-MG" — the municipality of her 1952 marriage — rather than her true birthplace of Alvorada, Carangola. This kind of administrative drift was common when a woman's identity effectively began with her marriage in the civil records of the period.

  - **[LEAD]** Owner-family testimony places her lifelong adult residence in Irajá, a northern bairro of Rio de Janeiro — not in Volta Redonda, which was her late-life and death location. Her father Antonio Engrácio Filho (P-0010) was recorded at Pavuna (an adjacent northern bairro) in his 1964 death, which is consistent with the family's Irajá base [owner-stated; no held record locates her in Irajá].

  ## Identity

  Always **Cidalia Engracio Guimarães** at birth and marriage, and **Cidalia Engracio
  Armond** by her married name. Her name is written in several forms across her own
  records: the given name "CIDÁLIA" alone in her 1930 birth registration (CIV-0022);
  "Cidalia Engracio Guimarães" and the adopted signature "Cidalia Engrácio Armond" on
  her 1952 marriage certificate (CIV-0002); "Cidalia Engracio Armond" as surviving wife
  in her husband's 1991 death record (CIV-0003); and "Cidalia Igracio Armond" as a
  grandparent name on a later family birth certificate (CIV-0008). [PROVEN]

  - **Birth:** 15 September 1930, at home ("em domicílio"), district of Alvorada,
  município de Carangola, Minas Gerais [PROVEN] — her own civil birth registration,
  declared by her father (CIV-0022). This supersedes the "15 November" family variant.

  - **Parents:** Antonio Engracio Filho (P-0010, recorded there as "Antônio Engrácio de
  Souza") and Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0022, CIV-0002).

  - **Marriage:** married Geraldo Paz Armond (P-0004) on 31 May 1952 at Eugenópolis,
  Minas Gerais (Casamento nº 898, livro 13-B) [PROVEN] (CIV-0002); she thereafter signed
  "Cidalia Engrácio Armond".

  - **Children:** she and Geraldo left at least one child — a living descendant, details
  withheld [PROVEN] (Geraldo's 1991 death records "deixou um filho", CIV-0003).

  - **Death:** 17 April 2023, at 17:57, at the Hospital São João Batista, **Volta Redonda,
  Rio de Janeiro** (PL-0003), aged 92, a widow [PROVEN] — her civil death certificate
  (CIV-0027, event E-0079), which confirms and upgrades the earlier owner-attested date
  (REC-0002). She was a retired seamstress ("costureira aposentada"), buried at the Cemitério
  Municipal de Volta Redonda, and left three adult children — one living and two already
  deceased (none named, for privacy). The cause of death was left pending a forensic report
  (art. 160 CPP). Her death certificate records her *naturalidade* as "Eugenópolis-MG" — the
  Zona-da-Mata município of her 1952 marriage and last residence, not her birthplace, which
  her own 1930 registration fixes at Alvorada, Carangola (CIV-0022 governs). [PROVEN] She had
  been living as recently as February 1991, named as surviving wife in Geraldo's death record
  (CIV-0003).

  ## Standing and profession

  - **Doméstica** at her 1952 marriage (CIV-0002) and later a **costureira aposentada**
  (retired seamstress) at her 2023 death (CIV-0027) [PROVEN].

  Her marriage is the point at which the Engrácio/Guimarães line joins the tree: she is
  the ancestor through whom this whole branch enters the family. [INFERRED]

  ## Family and social network

  Her 1952 marriage (CIV-0002) is the bridge between two lines — it ties her
  Engrácio/Guimarães ascendance to the Armond/Paz line of her husband Geraldo (son of
  Aristão Ferreira Armond and Liliosa Paz). [PROVEN]

  Her own 1930 birth registration (CIV-0022) is unusually rich: in a single act it fixes
  both her parents and both grandparent couples — paternal Antonio Engracio de Souza and
  Luzia da Conceição, maternal Francisco José de Carvalho Guimarães and Emerenciana Maria
  de Jesus — which makes it the structural spine of the whole line. [PROVEN]

  ## What we can extrapolate

  Both her parents were Minas Gerais-born and the family was rooted in the
  Carangola/Alvorada area of the Zona da Mata Mineira at her 1930 birth (CIV-0022). By
  mid-century the family straddled interior Minas and, in the next generation, Rio de
  Janeiro: her 1952 marriage was registered in the adjacent Minas município of Eugenópolis
  (CIV-0002), while her husband's line ended in Volta Redonda, RJ (CIV-0003). [INFERRED]

  The double surname *Engracio Guimarães* she carries is the visible fusion of her
  father's Engrácio line and her mother's Carvalho-Guimarães line. [INFERRED]

  Structurally, she is the convergence node of two different non-landed routes to standing.
  [INFERRED / CONTEXTUAL] Her paternal Engrácio-Souza line was commercial-urban — a *negociante*
  father who "não deixou bens" (see P-0010) — while her maternal Carvalho-Guimarães line was
  immigrant-descended and read in the family research as officer-rooted (a Guarda Nacional rank,
  a lead from the maternal-line profiles). Neither route was heritable land, and both were
  already migrating interior-MG → Rio de Janeiro in her parents' generation; her 1952 marriage
  into the Armond line carried that same interior → RJ trajectory forward. (Structural inference
  only; nothing of her private life is recorded here.)

  She is the first woman in this documented line with a trade of her own and a pension in her
  own name. [PROVEN — the words; INFERRED — the meaning] Her 1952 marriage records her as
  *doméstica*; her 2023 death records her as *costureira aposentada* (CIV-0002, CIV-0027).
  Set that against the two women above her: her great-grandmother Maria Paula de Jesus and her
  grandmother Emmerenciana appear inside a household's collective *lavradores* — unpaid family
  field labour (CIV-0007) — and her mother Maria Aurora is "do lar", with no economic role
  recorded at all (CIV-0018). Cidalia's record names a skill and attaches a retirement to it,
  which means a contributory relationship with the state in her own right. That is the single
  clearest measurable gain anywhere in this branch, and it took four generations and a move to
  an industrial city to arrive.

  The same certificate places her inside the institutional economy her grandparents stood
  outside of. [PROVEN / INFERRED] "Eleitor: Sim" (CIV-0027) — she was a registered voter. Her
  mother's 1991 act says "Era eleitor? não" (CIV-0018), and her great-uncle Sebastião's 1982
  act says "não era eleitor" at a date when Brazilian law still barred illiterates from the
  franchise (CIV-0050). Her own birth, in 1930, was registered the same day it happened
  (CIV-0022) — whereas her mother and five aunts and uncles had gone unregistered for up to
  fourteen years until a 1914 amnesty decree brought them in (CIV-0007). Across three
  generations the family moves from outside the civil register to fully inside it: registered
  at birth, enfranchised, employed, pensioned, and finally recorded at death with a matrícula
  number.

  There was nothing left to divide, and that is the whole story of both her lines. [PROVEN /
  INFERRED] Her 2023 death records "não deixou bens a inventariar" (CIV-0027), as her father's
  did in 1964 and her mother's in 1991. Her husband's 1991 death, by contrast, records "deixou
  bens a inventariar" (CIV-0003), so whatever the couple held passed at his death, thirty-two
  years before hers. Brazilian partible succession never had much work to do in this family:
  neither of her ascending lines — the commercial Engrácio-Souza nor the farming
  Carvalho-Guimarães — ever converted its position into heritable property, so what descended
  to her generation was a trade and a foothold, which is what she in turn passed on.

  Volta Redonda is where both halves of her descendants' ancestry finally converge. [PROVEN —
  the places; CONTEXTUAL — the meaning] Her husband Geraldo, a *padeiro*, died there in 1991
  (CIV-0003); her maternal uncle João José died there in 1992 (CIV-0033); she died there in
  2023 (CIV-0027). Two families that had no connection before 1952 — an Armond-Paz line coming
  out of the Muriaé/Eugenópolis side of the Zona da Mata and a Guimarães-Engrácio line coming
  out of Carangola — both ended up in the same CSN steel city, by the same logic: a declining
  coffee interior emptying into a planned industrial town that offered wage work to people
  with no land. Her 92 years run from a home birth in a rural Carangola district to a hospital
  death in that steel city, which is as exact a summary of 20th-century Brazil as this archive
  contains.

  ## Open questions

  - Her civil death registration — **held** (CIV-0027): confirms her death on 17 April
  2023 at Volta Redonda, aged 92, a retired seamstress. [RESOLVED]

  - Her full sibling set — her parents' death records report several adult children, but
  her siblings are not yet named from the records held for her. [OPEN]

  ## Sources held (this repository)

  - CIV-0022 (her own 1930 birth registration, Alvorada — birth date, place and both
  grandparent couples) · CIV-0002 (1952 marriage to Geraldo Paz Armond — doméstica,
  adopted name "Cidalia Engrácio Armond").

  - CIV-0027 (her own 2023 Volta Redonda death certificate — death date and place,
  "costureira aposentada", her parents, three adult children) · CIV-0003 (Geraldo's 1991
  death — names her as surviving wife "Cidalia Engracio Armond"; the couple left one child)
  · CIV-0008 (a later family birth certificate — records the name form "Cidalia Igracio
  Armond").

  ## Regional and migration context

  Her documented life sits in the Zona da Mata Mineira — born at Alvorada (Carangola) in
  1930 (CIV-0022), married at Eugenópolis in 1952 (CIV-0002). In her generation the
  region's coffee economy was in long decline and her paternal Engrácio household moved to
  Rio de Janeiro (where both her parents later died); her own marriage into the Armond
  line carried the same interior-Minas → Rio trajectory forward. [CONTEXTUAL] No held
  record states a personal migration motive. Her two ascendant lines rooted on the post-1850
  Carangola coffee frontier (Lei Eusébio de Queirós 1850 → Lei Áurea 1888); in her generation
  that economy declined and the family shifted toward Rio de Janeiro — the same interior-MG → RJ
  movement. [CONTEXTUAL]

  ## Where to go today

  - **Birth (1930):** district of Alvorada, Carangola, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Alvorada%2C+Carangola%2C+MG)

  - **Marriage (1952, civil registration):** Eugenópolis, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Eugen%C3%B3polis%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu registro de nascimento de 1930 (CIV-0022) é o documento mais rico do arquivo para seu ramo: um único ato registra não apenas o seu nascimento, mas os dois casais de avós — paternos Antonio Engracio de Souza e Luzia da Conceição, maternos Francisco José de Carvalho Guimarães e Emerenciana Maria de Jesus. Sem ele, os dois casais de avós estariam sem âncora.

  - **[INFERRED]** Seu sobrenome duplo "Engrácio Guimarães" é a fusão visível de duas linhas: a família comercial Engrácio-Souza de seu pai e a família de lavradores descendentes de imigrantes Carvalho-Guimarães de sua mãe — dois caminhos não fundiários rumo à posição social, reunidos em uma só mulher.

  - **[PROVEN]** Ela aparece como "CIDÁLIA" ao nascer (CIV-0022), "Cidalia Engrácio Guimarães" ao se casar (CIV-0002), "Cidalia Engrácio Armond" como esposa e viúva (CIV-0003), e "Cidalia Igracio Armond" em uma certidão de nascimento familiar posterior (CIV-0008) — quatro formas de nome ao longo de uma vida documentada de 93 anos.

  - **[CONTEXTUAL]** Nasceu na Zona da Mata Mineira cafeeira (Alvorada, Carangola, 1930), casou-se no município vizinho de Eugenópolis (1952) e faleceu em Volta Redonda (2023) — sua biografia percorre a mesma trajetória interior mineiro → cidade industrial do Rio de Janeiro que definiu o Brasil de meados do século XX.

  - **[PROVEN]** Sua ocupação passou de "doméstica" no casamento de 1952 (CIV-0002) para "costureira aposentada" no óbito de 2023 (CIV-0027) — ela exerceu um ofício qualificado durante a vida ativa, fato invisível apenas pelo registro de casamento.

  - **[INFERRED]** Sua certidão de óbito (CIV-0027) registra sua naturalidade como "Eugenópolis-MG" — o município do casamento de 1952 — em vez de seu verdadeiro local de nascimento, Alvorada, Carangola. Esse tipo de deriva administrativa era comum quando a identidade de uma mulher efetivamente começava com o casamento nos registros civis da época.

  - **[LEAD]** Testemunho da família-proprietária situa sua residência adulta permanente em Irajá, bairro do norte do Rio de Janeiro — não em Volta Redonda, que foi seu local de vida tardia e óbito. Seu pai Antonio Engrácio Filho (P-0010) foi registrado em Pavuna (bairro do norte adjacente) em seu óbito de 1964, o que é condizente com a base familiar em Irajá [declarado pelo proprietário; nenhum registro disponível a localiza em Irajá].

  ## Identidade

  Sempre **Cidalia Engracio Guimarães** ao nascer e ao casar, e **Cidalia Engracio
  Armond** pelo nome de casada. Seu nome aparece em várias formas em seus próprios
  registros: apenas o prenome "CIDÁLIA" em seu registro de nascimento de 1930 (CIV-0022);
  "Cidalia Engracio Guimarães" e a assinatura adotada "Cidalia Engrácio Armond" em sua
  certidão de casamento de 1952 (CIV-0002); "Cidalia Engracio Armond" como esposa
  sobrevivente no registro de óbito de seu marido em 1991 (CIV-0003); e "Cidalia Igracio
  Armond" como nome de avó em uma certidão de nascimento familiar posterior (CIV-0008).
  [PROVEN]

  - **Nascimento:** 15 de setembro de 1930, em domicílio, distrito de Alvorada, município
  de Carangola, Minas Gerais [PROVEN] — seu próprio registro civil de nascimento,
  declarado por seu pai (CIV-0022). Isso supera a variante familiar de "15 de novembro".

  - **Pais:** Antonio Engracio Filho (P-0010, ali registrado como "Antônio Engrácio de
  Souza") e Maria Aurora Guimarães (P-0011) [PROVEN] (CIV-0022, CIV-0002).

  - **Casamento:** casou-se com Geraldo Paz Armond (P-0004) em 31 de maio de 1952, em
  Eugenópolis, Minas Gerais (Casamento nº 898, livro 13-B) [PROVEN] (CIV-0002); passou
  então a assinar "Cidalia Engrácio Armond".

  - **Filhos:** ela e Geraldo deixaram ao menos um filho — um descendente vivo, cujos
  detalhes são omitidos [PROVEN] (o óbito de Geraldo de 1991 registra "deixou um
  filho", CIV-0003).

  - **Óbito:** 17 de abril de 2023, às 17:57, no Hospital São João Batista, **Volta
  Redonda, Rio de Janeiro** (PL-0003), aos 92 anos, viúva [PROVEN] — sua certidão de óbito
  (CIV-0027, evento E-0079), que confirma e eleva a data antes atestada pelo proprietário
  (REC-0002). Era costureira aposentada, sepultada no Cemitério Municipal de Volta Redonda,
  e deixou três filhos maiores — um vivo e dois já falecidos (não nomeados, por privacidade).
  A causa da morte ficou pendente de laudo pericial (art. 160 do CPP). Sua certidão de óbito
  registra a *naturalidade* como "Eugenópolis-MG" — o município da Zona da Mata de seu
  casamento de 1952 e última residência, não o de nascimento, que seu próprio registro de
  1930 fixa em Alvorada, Carangola (CIV-0022 prevalece). [PROVEN] Ainda estava viva em
  fevereiro de 1991, nomeada como esposa sobrevivente no registro de óbito de Geraldo (CIV-0003).

  ## Posição social e profissão

  - **Doméstica** em seu casamento de 1952 (CIV-0002) e, mais tarde, **costureira
  aposentada** em seu óbito de 2023 (CIV-0027) [PROVEN].

  Seu casamento é o ponto em que a linha Engrácio/Guimarães se junta à árvore: ela é a
  ancestral por meio de quem todo esse ramo entra na família. [INFERRED]

  ## Família e rede social

  Seu casamento de 1952 (CIV-0002) é a ponte entre duas linhas — liga sua ascendência
  Engrácio/Guimarães à linha Armond/Paz de seu marido Geraldo (filho de Aristão Ferreira
  Armond e Liliosa Paz). [PROVEN]

  Seu próprio registro de nascimento de 1930 (CIV-0022) é excepcionalmente rico: em um
  único ato fixa tanto seus pais quanto os dois casais de avós — paternos Antonio Engracio
  de Souza e Luzia da Conceição, maternos Francisco José de Carvalho Guimarães e
  Emerenciana Maria de Jesus — o que o torna a espinha estrutural de toda a linha. [PROVEN]

  ## O que podemos extrapolar

  Ambos os pais nasceram em Minas Gerais e a família estava enraizada na região de
  Carangola/Alvorada, na Zona da Mata Mineira, ao seu nascimento em 1930 (CIV-0022). Em
  meados do século a família se dividia entre o interior de Minas e, na geração seguinte,
  o Rio de Janeiro: seu casamento de 1952 foi registrado no município mineiro vizinho de
  Eugenópolis (CIV-0002), enquanto a linha de seu marido terminou em Volta Redonda, RJ
  (CIV-0003). [INFERRED]

  O sobrenome duplo *Engracio Guimarães* que ela carrega é a fusão visível da linha
  Engrácio de seu pai com a linha Carvalho-Guimarães de sua mãe. [INFERRED]

  Estruturalmente, ela é o nó de convergência de dois caminhos distintos e não fundiários rumo à
  posição social. [INFERRED / CONTEXTUAL] Sua linha paterna Engrácio-Souza era comercial-urbana
  — um pai *negociante* que "não deixou bens" (ver P-0010) —, enquanto sua linha materna
  Carvalho-Guimarães era descendente de imigrantes e lida na pesquisa da família como enraizada
  em oficialato (um posto na Guarda Nacional, uma pista dos perfis da linha materna). Nenhum dos
  caminhos era terra herdável, e ambos já migravam do interior de MG para o Rio de Janeiro na
  geração de seus pais; seu casamento de 1952 com a linha Armond levou adiante essa mesma
  trajetória interior → RJ. (Apenas inferência estrutural; nada de sua vida privada é registrado
  aqui.)

  Ela é a primeira mulher desta linha documentada com um ofício próprio e aposentadoria em
  nome próprio. [PROVEN — as palavras; INFERRED — o significado] Seu casamento de 1952 a
  registra como *doméstica*; seu óbito de 2023 a registra como *costureira aposentada*
  (CIV-0002, CIV-0027). Compare com as duas mulheres acima dela: sua bisavó Maria Paula de
  Jesus e sua avó Emmerenciana aparecem dentro dos *lavradores* coletivos de uma casa —
  trabalho agrícola familiar não remunerado (CIV-0007) — e sua mãe Maria Aurora é "do lar", sem
  nenhum papel econômico registrado (CIV-0018). O registro de Cidalia nomeia uma habilidade e
  lhe anexa uma aposentadoria, o que significa uma relação contributiva com o Estado em nome
  próprio. É o ganho mensurável mais nítido de todo este ramo, e levou quatro gerações e uma
  mudança para uma cidade industrial para chegar.

  A mesma certidão a coloca dentro da economia institucional da qual seus avós estavam fora.
  [PROVEN / INFERRED] "Eleitor: Sim" (CIV-0027) — era eleitora inscrita. O ato de 1991 de sua
  mãe diz "Era eleitor? não" (CIV-0018), e o ato de 1982 de seu tio-avô Sebastião diz "não era
  eleitor" numa data em que a lei brasileira ainda barrava os analfabetos do voto (CIV-0050).
  Seu próprio nascimento, em 1930, foi registrado no mesmo dia em que ocorreu (CIV-0022) — ao
  passo que sua mãe e cinco tios haviam ficado sem registro por até quatorze anos, até que um
  decreto de anistia de 1914 os trouxesse para dentro (CIV-0007). Em três gerações a família
  passa de fora do registro civil para plenamente dentro dele: registrada ao nascer, eleitora,
  empregada, aposentada e, por fim, registrada no óbito com número de matrícula.

  Não restava nada a dividir, e essa é a história inteira de suas duas linhas. [PROVEN /
  INFERRED] Seu óbito de 2023 registra "não deixou bens a inventariar" (CIV-0027), como o de
  seu pai em 1964 e o de sua mãe em 1991. O óbito de seu marido, em 1991, por outro lado,
  registra "deixou bens a inventariar" (CIV-0003) — de modo que o que o casal tinha passou na
  morte dele, trinta e dois anos antes da dela. A sucessão partível brasileira nunca teve muito
  trabalho nesta família: nenhuma de suas linhas ascendentes — nem a comercial Engrácio-Souza
  nem a lavradora Carvalho-Guimarães — converteu sua posição em propriedade herdável, de modo
  que o que desceu à geração dela foi um ofício e um ponto de apoio, que é o que ela, por sua
  vez, transmitiu.

  Volta Redonda é onde as duas metades da ascendência de seus descendentes finalmente
  convergem. [PROVEN — os lugares; CONTEXTUAL — o significado] Seu marido Geraldo, *padeiro*,
  faleceu ali em 1991 (CIV-0003); seu tio materno João José faleceu ali em 1992 (CIV-0033); ela
  faleceu ali em 2023 (CIV-0027). Duas famílias sem conexão alguma antes de 1952 — uma linha
  Armond-Paz vinda do lado Muriaé/Eugenópolis da Zona da Mata e uma linha Guimarães-Engrácio
  vinda de Carangola — terminaram ambas na mesma cidade siderúrgica da CSN, pela mesma lógica:
  um interior cafeeiro em declínio esvaziando-se numa cidade industrial planejada que oferecia
  trabalho assalariado a quem não tinha terra. Seus 92 anos vão de um nascimento em domicílio
  num distrito rural de Carangola a uma morte hospitalar naquela cidade do aço — um resumo tão
  exato do Brasil do século XX quanto este arquivo contém.

  ## Questões em aberto

