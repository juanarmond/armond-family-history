profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** The devotional surname "de Jesus" hides her paternal lineage entirely — a common practice among lower-status Brazilian families of the period, where a devotional particle replaced a fixed surname. Only her own marriage or death act could supply a paternal surname, and the retrieval research reports both as falling in gaps of the filmed Itaboraí registers [LEAD], so her ancestry was out of reach through her own records. It is reached instead through her children's: the 1821 and 1841 baptisms of Antonio, João and Maria, held since 2026-10-10, name her parents — José Campello de Moraes, "natural do Porto", and Emerenciana Maria de Jesus (P-0134, P-0135; PAR-0101, PAR-0102) [STRONG]. Her "de Jesus" echoes her mother's name [INFERRED].

  - **[PROVEN]** Every baptism of her children from 1832 to 1838 names her "Maria Thereza" — with "de Jesus" / "de Jezus" in 1834, 1835 and 1838 (PAR-0030, PAR-0031, PAR-0016, PAR-0032, PAR-0033). A "Maria Nunes de Jesus" form once carried here, and the question whether two women lay behind it, rested on a misreading of the 1832 and 1834 entries and were retired after a re-reading of the images on 2026-10-10.

  - **[PROVEN / CONTEXTUAL]** A later form of her name — "Maria Tereza Pereira de Lemos" — appears in her daughter Rosa's 1919 Nova Friburgo death register, which gives the mother her husband's surname ("Pereira de Lemos") in place of the devotional "de Jesus" (PAR-0058). Recording a wife under her husband's surname decades later is a recurring drift in Brazilian records, and it obscures rather than clarifies the original identity.

  - **[PROVEN]** Her daughter Rosa's 1835 Itaboraí baptism names both parents as "naturaes desta freguezia", making her a documented native of Itaboraí and placing her and her husband in the same parish of origin (PAR-0016).

  - **[INFERRED]** The Lemos family entered the Swiss-German colony world only through her daughter Rosa's marriage. Nothing held places her at Nova Friburgo; the cultural crossing belongs to the next generation, not to her.

  ## Identity

  **Maria Thereza de Jesus** in the 1835 Rosa baptism (PAR-0016), "Maria Thereza de Jezus"
  in the 1834 Anna and 1838 Polidoro baptisms (PAR-0031, PAR-0033), and plain "Maria Thereza"
  in the 1832 Maria and 1836 Thomaz baptisms (PAR-0030, PAR-0032) — one name, consistently
  recorded [PROVEN]. (A "Maria Nunes de Jesus" reading of the 1832 and 1834 entries was a
  misreading, retired on 2026-10-10.) A later form —
  **Maria Tereza Pereira de Lemos** — appears in her daughter Rosa's 1919 Nova Friburgo death
  (PAR-0058), which swaps the devotional "de Jesus" for her husband's "de Lemos" (and adds
  "Pereira"); it is preserved as a variant, the nearer-the-event baptisms governing. She is the
  mother of Rosa Eugenia de Lemos (P-0035), hence maternal grandmother of Joaquim José Bohrer
  (P-0030).

  - **Nationality:** Brazilian [PROVEN] — "natural desta freguezia" (Itaboraí) in the 1835
  baptism (PAR-0016).

  - **Parents:** José Campello de Moraes (P-0134), "natural do Port[o]", and Emerenciana
  Maria de Jesus (P-0135), family F-0067 [STRONG] — named as maternal grandparents in the
  1821 and 1841 baptisms of her children Antonio, João and Maria (PAR-0101, PAR-0102), held
  and read on 2026-10-10 [PROVEN as records]. The link is strong, not proven: it rests on
  identifying her with the Maria Thereza those records name. Her own devotional "de Jesus"
  carries no lineage clue; her father's surname survives in her probable brother Manoel
  Campello de Moraes [LEAD]. (Until 2026-10-10 this read "unknown from any held record",
  with the names as a retrieval lead.)

  - **Marriage and children:** wife of Manoel de Lemos [Pereira] (P-0052), family F-0025;
  mother of the 1832–1838 Itaboraí children (Maria, Anna, Rosa Eugenia, Thomaz, Polídoro).
  A mother baptising children from the early 1830s implies a birth no later than
  c.1810–1815 [INFERRED]. A sixth baptism, of a son Manoel in 1831, is reported by the
  retrieval research but not held here [LEAD]. Rosa's brothers Candido Pereira de Lemos
  (PRB-0005) and Manoel Pereira de Lemos (d. 1898 aged 72, so b. c.1826, NWS-0002) are
  documented, but no held record names their mother. If they were her sons, her childbearing
  began by c.1826 and her birth falls no later than c.1810 [INFERRED]. Three more children are now
  held: Antonio, baptised 21 October 1821 (PAR-0101), and João (b. 16 August 1839) and Maria
  (b. 24 September 1840), both baptised 4 March 1841 (PAR-0102) [STRONG]; the mother of a
  legitimate son in October 1821 was born about 1805 or earlier [INFERRED]. The retrieval
  agent reports the couple married before 18 March 1821 [LEAD].

  - **Death:** not located. She was dead by November 1919, when Rosa's death names both
  parents as "falecidos" (PAR-0058) [PROVEN of the bound]. The retrieval agent reports her
  alive on 30 September 1856 [LEAD].

  ## Standing and profession

  Nothing documented. The held acts name her only as a mother: no occupation, property,
  signature or literacy is recorded [OPEN], nor would one be expected for a married woman in
  these baptism entries [CONTEXTUAL].

  ## Family and social network

  **Husband.** Manoel de Lemos Pereira (P-0052), written "Manoel de Lemos Pereira" (1832,
  1834, 1838), "Manoel de Lemos" (1835, 1836) and "Manoel Pereira Lemos" (1919) (PAR-0030,
  PAR-0031, PAR-0033, PAR-0016, PAR-0032, PAR-0058) [PROVEN]. (An earlier "Ferreira" reading
  was corrected from the images on 2026-10-10.)

  **Children in held records.** Maria, baptised 14 July 1832 (PAR-0030); Anna, 11 February 1834
  (PAR-0031); Rosa, 12 October 1835, "nascida a dez mezes" (PAR-0016); Thomaz, 13 June 1836,
  "nascido a tres mezes" (PAR-0032); and Polidoro, 18 March 1838, "nascido a tres mezes"
  (PAR-0033) [PROVEN]. To these the 1821 and 1841 entries add Antonio, baptised 21 October 1821
  (PAR-0101), and João, born 16 August 1839, and a second Maria, born 24 September 1840, both
  baptised 4 March 1841 (PAR-0102) [STRONG — through the identification]. The older brothers
  Candido and Manoel are discussed under Identity.

  **Godparents.** Capitão José Custodio Vieira (Maria, PAR-0030; and Thomaz, with Nossa Senhora,
  PAR-0032); João José Antunes and Anna Roza da Encarnação (Anna, PAR-0031); Manoel José da
  Silva and Ro[z]a de Maria da Conceição (Rosa, PAR-0016); Hermenegildo José de Mattos with
  Nossa Senhora (Polidoro, PAR-0033) [PROVEN]. One sponsor carries a style — the *Capitão*,
  chosen twice. (Corrected from the images on 2026-10-10; earlier readings gave "Flor de
  Maria", "[Felício?]", "José Antonio and Anna Roza de Guimarães" and illegible 1836/1838
  sponsors, and said none carried a rank.) The 1821 and 1841 entries add Antonio Joze da
  Fonceca and Anna Maria das Dores (Antonio, PAR-0101) and the Reverendo José Antonio Ferreira
  Pacheco (João and Maria, PAR-0102) [STRONG].

  **Her own parents:** José Campello de Moraes (P-0134) and Emerenciana Maria de Jesus
  (P-0135), family F-0067 [STRONG — see Identity]. (Until 2026-10-10: "unknown; no held record
  names them", with a retrieval lead.)

  ## What we can extrapolate

  The "Thereza" vs "Nunes" question that once stood here is closed. It rested on a misreading:
  re-read from the images on 2026-10-10, all five baptisms of 1832–1838 name her "Maria
  Thereza", so the "two wives, or two Manoel de Lemos" alternative is retired [PROVEN].

  **Her entire documented life is a run of baptisms.** [INFERRED] Between 1832 and 1838 she
  appears in five held Itaboraí baptism entries — a birth roughly every eighteen months
  through the middle of her childbearing years — and the 1821 and 1841 entries, held since
  2026-10-10, stretch the run to twenty years [STRONG] (a further baptism, from 1831, is
  reported but not held [LEAD]); and in nothing else of her own: no property act, no
  will, no signature, no occupation, no burial record located. Even her own surname withholds
  her: the devotional *de Jesus* carries no lineage, which is why her parentage stayed
  invisible until her children's baptisms named her parents (PAR-0101, PAR-0102).
  That is not a gap in the research. In a household with nothing to transact, the parish
  register is the only archive that records anything at all, so the bottom of a genealogy looks
  flat — and the flatness is a property of the record-keeping, not of the lives.

  **Class location [CONTEXTUAL].** Like her husband she stands on the modest Itaboraí
  Portuguese-descended *fluminense* floor: a local rural, church-integrated family with no
  documented land, office or wealth, and a single titled godparent in her children's baptisms —
  the Capitão José Custodio Vieira, twice (PAR-0030, PAR-0032) — among otherwise untitled
  sponsors [PROVEN]. Itaboraí in her lifetime was a sugar municipality
  worked by enslaved labour [CONTEXTUAL]; nothing in the held acts places her household on the
  owning side of that economy.

  **The turn comes after her, and it comes by moving.** [INFERRED] Her own generation neither
  rose nor migrated; her children's did. A daughter married into the Nova Friburgo Swiss colony
  and died there in 1919, "moradora nesta da Nova Friburgo" (PAR-0058); Rosa's brother Candido
  is named second executor in her husband's 1879 will and witnessed a wedding at Nova Friburgo
  in 1884 (PRB-0005, PAR-0056) [PROVEN].
  Rosa's other brother Manoel was "o conhecido industrial da Venda das Pedras" at his death in
  1898 (NWS-0002) [PROVEN], and may have stayed nearer home, since Venda das Pedras is today a
  neighbourhood of Itaboraí [CONTEXTUAL]; no held record names either brother's mother. The Lemos
  enter the colony world only through that generation, and they enter it by leaving Itaboraí.

  ## Open questions

  - Her own parents — now named from the 1821 and 1841 baptisms of her children (PAR-0101,
  PAR-0102) and modelled as F-0067 at strong evidence; what would prove the link is her own
  baptism or the Itaboraí marriage of Manoel de Lemos × Maria Thereza de Jesus. Her father's
  "natural do Port[o]" is read as the city of Porto but not stated so [uncertain]. (Whether "Maria Thereza" and "Maria Nunes" were one woman is
  no longer a question: the "Nunes" reading was a misreading, retired 2026-10-10.) [OPEN]

  - **Search bounds reported by the retrieval research (2026-09-10) [LEAD — not repeated
  here]:** the marriage falls in a FamilySearch coverage gap (Itaboraí marriages jump from
  1766–1767 to 1832, and the one 1830s book is access-restricted); her own baptism falls in a
  second gap (baptisms jump from 1727–1729 to 1821); and the 1835–1843 óbito book was sampled
  after 1838 without finding her. The unfilmed books are reported at the archdiocesan archive in
  Niterói. [OPEN]

  - **Polidoro's 1838 entry** (PAR-0033): re-read from the image on 2026-10-10, the mother's name,
  earlier recorded as illegible, is "Maria Thereza de Jezus". [RESOLVED]

  - **Her death:** an Itaboraí óbito naming her widower and heirs would fix the sibling set and
  the name question together. [OPEN]

  ## Sources held (this repository)

  - PAR-0030 (Maria's 1832 baptism — "Maria [Th]ereza") · PAR-0031 (Anna's 1834 baptism —
  "Maria Thereza de Jezus") · PAR-0016 (Rosa's 1835 baptism — "Maria Thereza de Jesus") ·
  PAR-0032 (Thomaz's 1836 baptism — "Maria Thereza") · PAR-0033 (Polidoro's 1838 baptism —
  "Maria Thereza de Jezus"). PAR-0058 (daughter Rosa's 1919 Nova Friburgo death — names her
  "Maria Tereza Pereira de Lemos", a later variant).

  - PAR-0101 (son Antonio's 1821 baptism — "Maria Thereza de Jezus") · PAR-0102 (João's and
  Maria's 1841 baptisms — "Maria Thereza de Jesus") — both name her parents [identification
  STRONG].

  ## Regional and migration context

  She was "natural desta freguezia", Itaboraí, and baptised her children at the Itaboraí matriz
  from 1832 to 1838 (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033) [PROVEN]. Itaboraí was
  then a Portuguese-descended sugar and farming parish east of Guanabara Bay, worked by enslaved
  labour [CONTEXTUAL]. Her Brazilian nationality follows from that documented birthplace. Her
  father, José Campello de Moraes, is "natural do Port[o]" in 1821 (PAR-0101) — most naturally
  the Portuguese city [uncertain] — so she was probably the Brazilian-born daughter of a
  Portuguese immigrant and an Itaboraí-born mother [STRONG for the parentage; INFERRED for
  the migration]. The
  family's move into the Nova Friburgo colony belongs to her daughter Rosa's generation: Rosa's
  marriage was celebrated at Itaboraí (PAR-0002) and she died a resident of Nova Friburgo
  (PAR-0058).

  ## Where to go today

  - **Baptisms of her children (1832–1838):** Igreja Matriz de São João Batista de Itaboraí (Praça Marechal Floriano Peixoto 15, Centro, Itaboraí, RJ) — the Lemos family's home parish [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** O sobrenome devocional "de Jesus" oculta por completo sua linhagem paterna — prática comum nas famílias brasileiras de condição mais modesta da época, em que uma partícula devocional substituía um sobrenome fixo. Só seu próprio casamento ou óbito poderia fornecer um sobrenome paterno, e a pesquisa de recuperação relata que ambos caem em lacunas dos registros filmados de Itaboraí [LEAD]; sua ascendência estava, portanto, fora de alcance pelos seus próprios registros. É alcançada pelos dos filhos: os batismos de 1821 e 1841 de Antonio, João e Maria, disponíveis desde 2026-10-10, nomeiam seus pais — José Campello de Moraes, "natural do Porto", e Emerenciana Maria de Jesus (P-0134, P-0135; PAR-0101, PAR-0102) [STRONG]. Seu "de Jesus" ecoa o nome da mãe [INFERRED].

  - **[PROVEN]** Todos os batismos de seus filhos de 1832 a 1838 a nomeiam "Maria Thereza" — com "de Jesus" / "de Jezus" em 1834, 1835 e 1838 (PAR-0030, PAR-0031, PAR-0016, PAR-0032, PAR-0033). Uma forma "Maria Nunes de Jesus" antes registrada aqui, e a questão de haver duas mulheres por trás dela, apoiavam-se numa leitura errada dos assentos de 1832 e 1834 e foram aposentadas após nova leitura das imagens em 2026-10-10.

  - **[PROVEN / CONTEXTUAL]** Uma forma posterior de seu nome — "Maria Tereza Pereira de Lemos" — aparece no registro de óbito de 1919 de sua filha Rosa em Nova Friburgo, que dá à mãe o sobrenome do marido ("Pereira de Lemos") no lugar do devocional "de Jesus" (PAR-0058). Registrar décadas depois uma esposa com o sobrenome do marido é uma deriva recorrente nos registros brasileiros, e ela obscurece, em vez de esclarecer, a identidade original.

  - **[PROVEN]** O batismo de 1835 de sua filha Rosa em Itaboraí nomeia ambos os pais como "naturaes desta freguezia", o que faz dela uma natural documentada de Itaboraí e situa ela e o marido na mesma freguesia de origem (PAR-0016).

  - **[INFERRED]** A família Lemos entrou no mundo da colônia suíço-alemã apenas pelo casamento da filha Rosa. Nada do que se dispõe a situa em Nova Friburgo; a travessia cultural pertence à geração seguinte, não à dela.

  ## Identidade

  **Maria Thereza de Jesus** no batismo de Rosa de 1835 (PAR-0016), "Maria Thereza de Jezus"
  nos batismos de Anna (1834) e Polidoro (1838) (PAR-0031, PAR-0033) e apenas "Maria Thereza"
  nos de Maria (1832) e Thomaz (1836) (PAR-0030, PAR-0032) — um só nome, registrado de forma
  consistente [PROVEN]. (Uma leitura "Maria Nunes de Jesus" dos assentos de 1832 e 1834 era
  errada e foi aposentada em 2026-10-10.) Uma forma mais tardia — **Maria Tereza Pereira de
  Lemos** — aparece no óbito de 1919 de
  sua filha Rosa em Nova Friburgo (PAR-0058), que troca o devocional "de Jesus" pelo "de Lemos"
  do marido (e acrescenta "Pereira"); é preservada como variante, prevalecendo os batismos, mais
  próximos do evento. Ela é a mãe de Rosa Eugenia de Lemos (P-0035) e, portanto, avó materna de
  Joaquim José Bohrer (P-0030).

  - **Nacionalidade:** brasileira [PROVEN] — "natural desta freguezia" (Itaboraí) no
  batismo de 1835 (PAR-0016).

  - **Pais:** José Campello de Moraes (P-0134), "natural do Port[o]", e Emerenciana Maria de
  Jesus (P-0135), família F-0067 [STRONG] — nomeados avós maternos nos batismos de 1821 e 1841
  de seus filhos Antonio, João e Maria (PAR-0101, PAR-0102), disponíveis e lidos em 2026-10-10
  [PROVEN como registros]. O vínculo é forte, não provado: depende de identificá-la com a
  Maria Thereza que esses registros nomeiam. Seu próprio "de Jesus" devocional não traz pista
  de linhagem; o sobrenome do pai sobrevive no seu provável irmão Manoel Campello de Moraes
  [LEAD]. (Até 2026-10-10 dizia-se aqui "desconhecidos em qualquer registro disponível", com
  os nomes como pista da pesquisa de recuperação.)

  - **Casamento e filhos:** esposa de Manoel de Lemos [Pereira] (P-0052), família F-0025;
  mãe dos filhos de Itaboraí de 1832–1838 (Maria, Anna, Rosa Eugenia, Thomaz, Polídoro).
  Uma mãe batizando filhos desde o início da década de 1830 implica um nascimento não
  posterior a c.1810–1815 [INFERRED]. Um sexto batismo, de um filho Manoel em 1831, é relatado
  pela pesquisa de recuperação, mas não está disponível aqui [LEAD]. Os irmãos de Rosa, Candido
  Pereira de Lemos (PRB-0005) e Manoel Pereira de Lemos (f. 1898 aos 72 anos, portanto n.
  c.1826, NWS-0002), estão documentados, mas nenhum registro disponível nomeia a mãe deles. Se
  fossem filhos dela, sua fase de partos começou até c.1826 e seu nascimento não é posterior a
  c.1810 [INFERRED]. Mais três filhos estão agora disponíveis: Antonio, batizado em 21 de
  outubro de 1821 (PAR-0101), e João (n. 16 de agosto de 1839) e Maria (n. 24 de setembro de
  1840), ambos batizados em 4 de março de 1841 (PAR-0102) [STRONG]; a mãe de um filho legítimo
  em outubro de 1821 nasceu por volta de 1805 ou antes [INFERRED]. O agente de recuperação
  relata o casal casado antes de 18 de março de 1821 [LEAD].

  - **Óbito:** não localizado. Já estava morta em novembro de 1919, quando o óbito de Rosa nomeia
  ambos os pais como "falecidos" (PAR-0058) [PROVEN quanto ao limite]. O agente de recuperação
  a relata viva em 30 de setembro de 1856 [LEAD].

  ## Posição social e profissão

  Nada documentado. Os atos disponíveis a nomeiam apenas como mãe: nenhuma ocupação,
  propriedade, assinatura ou alfabetização é registrada [OPEN], nem seria de esperar para uma
  mulher casada nesses assentos de batismo [CONTEXTUAL].

  ## Família e rede social

  **Marido.** Manoel de Lemos Pereira (P-0052), escrito "Manoel de Lemos Pereira" (1832, 1834,
  1838), "Manoel de Lemos" (1835, 1836) e "Manoel Pereira Lemos" (1919) (PAR-0030, PAR-0031,
  PAR-0033, PAR-0016, PAR-0032, PAR-0058) [PROVEN]. (Uma leitura anterior "Ferreira" foi
  corrigida a partir das imagens em 2026-10-10.)

  **Filhos nos registros disponíveis.** Maria, batizada em 14 de julho de 1832 (PAR-0030); Anna,
  em 11 de fevereiro de 1834 (PAR-0031); Rosa, em 12 de outubro de 1835, "nascida a dez mezes"
  (PAR-0016); Thomaz, em 13 de junho de 1836, "nascido a tres mezes" (PAR-0032); e Polidoro, em
  18 de março de 1838, "nascido a tres mezes" (PAR-0033) [PROVEN]. A estes os assentos de 1821 e
  1841 acrescentam Antonio, batizado em 21 de outubro de 1821 (PAR-0101), e João, nascido em 16
  de agosto de 1839, e uma segunda Maria, nascida em 24 de setembro de 1840, ambos batizados em
  4 de março de 1841 (PAR-0102) [STRONG — pela identificação]. Os irmãos mais velhos Candido e
  Manoel são tratados em Identidade.

  **Padrinhos.** O Capitão José Custodio Vieira (Maria, PAR-0030; e Thomaz, com Nossa Senhora,
  PAR-0032); João José Antunes e Anna Roza da Encarnação (Anna, PAR-0031); Manoel José da Silva
  e Ro[z]a de Maria da Conceição (Rosa, PAR-0016); Hermenegildo José de Mattos com Nossa
  Senhora (Polidoro, PAR-0033) [PROVEN]. Um padrinho traz tratamento — o *Capitão*, escolhido
  duas vezes. (Corrigido a partir das imagens em 2026-10-10; leituras anteriores davam "Flor de
  Maria", "[Felício?]", "José Antonio e Anna Roza de Guimarães" e padrinhos ilegíveis em
  1836/1838, e diziam que nenhum tinha patente.) Os assentos de 1821 e 1841 acrescentam
  Antonio Joze da Fonceca e Anna Maria das Dores (Antonio, PAR-0101) e o Reverendo José
  Antonio Ferreira Pacheco (João e Maria, PAR-0102) [STRONG].

  **Seus próprios pais:** José Campello de Moraes (P-0134) e Emerenciana Maria de Jesus
  (P-0135), família F-0067 [STRONG — ver Identidade]. (Até 2026-10-10: "desconhecidos; nenhum
  registro disponível os nomeia", com uma pista da pesquisa de recuperação.)

  ## O que podemos extrapolar

  A questão "Thereza" vs "Nunes" que antes figurava aqui está encerrada. Apoiava-se numa leitura
  errada: relidos a partir das imagens em 2026-10-10, os cinco batismos de 1832–1838 a nomeiam
  "Maria Thereza", de modo que a alternativa "duas esposas, ou dois Manoel de Lemos" fica
  aposentada [PROVEN].

  **Toda a sua vida documentada cabe numa sequência de batismos.** [INFERRED] Entre 1832 e
  1838 ela aparece em cinco assentos de batismo de Itaboraí disponíveis — um parto a cada
  dezoito meses, aproximadamente, no meio de seus anos férteis —, e os assentos de 1821 e
  1841, disponíveis desde 2026-10-10, estendem a sequência a vinte anos [STRONG] (outro
  batismo, de 1831, é relatado mas não está disponível [LEAD]); e em mais nada de seu: nenhum ato
  de propriedade, nenhum testamento, nenhuma assinatura, nenhuma ocupação, nenhum registro de
  sepultamento localizado. Até o próprio sobrenome a esconde: o devocional *de Jesus* não
  carrega linhagem, e é por isso que sua filiação ficou invisível até os batismos dos filhos
  nomearem seus pais (PAR-0101, PAR-0102). Isso não é uma lacuna de
  pesquisa. Num domicílio sem nada a transacionar, o registro paroquial é o único arquivo que
  registra o que quer que seja, de modo que o fundo de uma genealogia parece plano — e a planura
  é uma propriedade do sistema de registro, não das vidas.

  **Posição de classe [CONTEXTUAL].** Como seu marido, ela se situa sobre o modesto piso
  *fluminense* de descendência portuguesa de Itaboraí: uma família local, rural e integrada à
  igreja, sem terra, ofício ou riqueza documentados, e com um único padrinho titulado nos
  batismos de seus filhos — o Capitão José Custodio Vieira, duas vezes (PAR-0030, PAR-0032) —
  entre padrinhos de resto sem título [PROVEN]. Itaboraí, em sua época, era um
  município açucareiro movido por trabalho escravizado [CONTEXTUAL]; nada nos atos disponíveis
  situa seu domicílio do lado proprietário dessa economia.

  **A virada vem depois dela, e vem pela mudança de lugar.** [INFERRED] Sua própria geração não
  subiu nem migrou; a dos filhos, sim. Uma filha casou-se na colônia suíça de Nova Friburgo e ali
  morreu em 1919, "moradora nesta da Nova Friburgo" (PAR-0058); Candido, irmão de Rosa, aparece
  como segundo testamenteiro no testamento do marido dela de 1879 e como testemunha de um
  casamento em Nova Friburgo em 1884 (PRB-0005, PAR-0056) [PROVEN]. O outro irmão de Rosa, Manoel, era "o conhecido industrial da Venda das Pedras" ao
  morrer em 1898 (NWS-0002) [PROVEN] e pode ter ficado mais perto de casa, pois Venda das Pedras
  é hoje um bairro de Itaboraí [CONTEXTUAL]; nenhum registro disponível nomeia a mãe de qualquer
  dos dois irmãos. Os Lemos entram no mundo da colônia apenas por essa geração, e entram nele
  saindo de Itaboraí.

  ## Questões em aberto

  - Seus próprios pais — agora nomeados pelos batismos de 1821 e 1841 de seus filhos
  (PAR-0101, PAR-0102) e modelados como F-0067 com evidência forte; o que provaria o vínculo é
  o seu próprio batismo ou o casamento em Itaboraí de Manoel de Lemos × Maria Thereza de
  Jesus. O "natural do Port[o]" de seu pai é lido como a cidade do Porto, mas não está
  declarado assim [uncertain]. (Se "Maria Thereza" e "Maria Nunes"
  eram uma só mulher já não é questão: a leitura "Nunes" era errada, aposentada em
  2026-10-10.) [OPEN]

  - **Limites de busca relatados pela pesquisa de recuperação (2026-09-10) [LEAD — não
  repetidos aqui]:** o casamento cai numa lacuna de cobertura do FamilySearch (os casamentos de
  Itaboraí saltam de 1766–1767 para 1832, e o único livro da década de 1830 tem acesso
  restrito); seu próprio batismo cai numa segunda lacuna (os batismos saltam de 1727–1729 para
  1821); e o livro de óbitos de 1835–1843 foi amostrado depois de 1838 sem encontrá-la. Os
  livros não filmados estariam no arquivo da arquidiocese em Niterói. [OPEN]

  - **O assento de Polidoro, 1838** (PAR-0033): relido a partir da imagem em 2026-10-10, o nome da
  mãe, antes registrado como ilegível, é "Maria Thereza de Jezus". [RESOLVED]

  - **Seu óbito:** um óbito de Itaboraí que nomeasse o viúvo e os herdeiros fixaria de uma vez o
