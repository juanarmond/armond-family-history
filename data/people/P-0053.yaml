profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** The devotional surname "de Jesus" hides her paternal lineage entirely — a common practice among lower-status Brazilian families of the period, where a devotional particle replaced a fixed surname. Only her own marriage or death act could supply a paternal surname, and the retrieval research reports both as falling in gaps of the filmed Itaboraí registers [LEAD], so her ancestry is out of reach for now rather than untraceable in principle.

  - **[INFERRED]** The alternation between "Maria Thereza" and "Maria Nunes" across her children's baptisms, with the same husband and officiant, strongly points to a single scribe varying the middle element of her name — standard 19th-century Brazilian scribal inconsistency, not evidence of two different women.

  - **[PROVEN / CONTEXTUAL]** A third form of her name — "Maria Tereza Pereira de Lemos" — appears in her daughter Rosa's 1919 Nova Friburgo death register, which gives the mother her husband's surname ("Pereira de Lemos") in place of the devotional "de Jesus" (PAR-0058). Recording a wife under her husband's surname decades later is a recurring drift in Brazilian records, and it obscures rather than clarifies the original identity.

  - **[PROVEN]** Her daughter Rosa's 1835 Itaboraí baptism names both parents as "naturaes desta freguezia", making her a documented native of Itaboraí and placing her and her husband in the same parish of origin (PAR-0016).

  - **[INFERRED]** The Lemos family entered the Swiss-German colony world only through her daughter Rosa's marriage. Nothing held places her at Nova Friburgo; the cultural crossing belongs to the next generation, not to her.

  ## Identity

  Recorded two ways by the same Itaboraí vigário: **Maria Thereza de Jesus** in the 1835
  Rosa and 1836 Thomaz baptisms (PAR-0016, PAR-0032), and **Maria Nunes de Jesus** in the
  1832 Maria and 1834 Anna baptisms (PAR-0030, PAR-0031) — scribal inconsistency for one
  woman; "Maria Thereza de Jesus" is the preferred form [PROVEN]. A third, later form —
  **Maria Tereza Pereira de Lemos** — appears in her daughter Rosa's 1919 Nova Friburgo death
  (PAR-0058), which swaps the devotional "de Jesus" for her husband's "de Lemos" (and adds
  "Pereira"); it is preserved as a variant, the nearer-the-event baptisms governing. She is the
  mother of Rosa Eugenia de Lemos (P-0035), hence maternal grandmother of Joaquim José Bohrer
  (P-0030).

  - **Nationality:** Brazilian [PROVEN] — "natural desta freguezia" (Itaboraí) in the 1835
  baptism (PAR-0016).

  - **Parents:** unknown from any held record [OPEN]; the devotional surname "de Jesus"
  carries no lineage clue.

  - **Marriage and children:** wife of Manoel de Lemos [Pereira] (P-0052), family F-0025;
  mother of the 1832–1838 Itaboraí children (Maria, Anna, Rosa Eugenia, Thomaz, Polídoro).
  A mother baptising children from the early 1830s implies a birth no later than
  c.1810–1815 [INFERRED]. A sixth baptism, of a son Manoel in 1831, is reported by the
  retrieval research but not held here [LEAD]. Rosa's brothers Candido Pereira de Lemos
  (PRB-0005) and Manoel Pereira de Lemos (d. 1898 aged 72, so b. c.1826, NWS-0002) are
  documented, but no held record names their mother. If they were her sons, her childbearing
  began by c.1826 and her birth falls no later than c.1810 [INFERRED].

  - **Death:** not located. She was dead by November 1919, when Rosa's death names both
  parents as "falecidos" (PAR-0058) [PROVEN of the bound].

  ## Standing and profession

  Nothing documented. The held acts name her only as a mother: no occupation, property,
  signature or literacy is recorded [OPEN], nor would one be expected for a married woman in
  these baptism entries [CONTEXTUAL].

  ## Family and social network

  **Husband.** Manoel de Lemos Pereira (P-0052), written "Manoel de Lemos" (1835, 1836),
  "Manoel de Lemos [Ferreira]" and "Manoel de Lemos Ferreira" (1832, 1834, 1838) and "Manoel
  Pereira Lemos" (1919) (PAR-0016, PAR-0032, PAR-0030, PAR-0031, PAR-0033, PAR-0058) [PROVEN].

  **Children in held records.** Maria, baptised 14 July 1832 (PAR-0030); Anna, 12 February 1834
  (PAR-0031); Rosa, October 1835, "nascida a dez mezes" (PAR-0016); Thomaz, June 1836
  (PAR-0032); and Polidoro, c. November 1838, whose mother's name is illegible (PAR-0033)
  [PROVEN]. The older brothers Candido and Manoel are discussed under Identity.

  **Godparents.** Manoel José da Silva and Flor de Maria da Conceição (Rosa, PAR-0016); [Felício?]
  José Custódio Vieira (Maria, PAR-0030); José Antonio and Anna Roza de Guimarães (Anna,
  PAR-0031). The 1836 and 1838 sponsors are illegible (PAR-0032, PAR-0033). None carries a
  title or rank [PROVEN as recorded].

  **Her own parents:** unknown; no held record names them.

  ## What we can extrapolate

  The "Thereza" vs "Nunes" alternation is the one live question. The ordinary reading — one
  woman, the same husband, the same matriz and officiant era, a tight window, and the two forms
  alternating within Manoel's own children — is a scribe varying the middle element of "Maria …
  de Jesus". This is the working assumption; the alternative (two wives, or two "Manoel de
  Lemos" men in the parish) is not ruled out by anything held. [INFERRED]

  **Her entire documented life is five baptisms across six years.** [INFERRED] Between 1832
  and 1838 she appears in five held Itaboraí baptism entries (a sixth, from 1831, is reported but
  not held [LEAD]) — a birth roughly every eighteen months through the middle of her
  childbearing years — and in nothing else of her own: no property act, no
  will, no signature, no occupation, no burial record located. Even her own surname withholds
  her: the devotional *de Jesus* carries no lineage, which is why her parentage is invisible.
  That is not a gap in the research. In a household with nothing to transact, the parish
  register is the only archive that records anything at all, so the bottom of a genealogy looks
  flat — and the flatness is a property of the record-keeping, not of the lives.

  **Class location [CONTEXTUAL].** Like her husband she stands on the modest Itaboraí
  Portuguese-descended *fluminense* floor: a local rural, church-integrated family with no
  documented land, office or wealth, and no titled godparent anywhere in her children's baptisms
  (PAR-0016, PAR-0030, PAR-0031) [PROVEN]. Itaboraí in her lifetime was a sugar municipality
  worked by enslaved labour [CONTEXTUAL]; nothing in the held acts places her household on the
  owning side of that economy.

  **The turn comes after her, and it comes by moving.** [INFERRED] Her own generation neither
  rose nor migrated; her children's did. A daughter married into the Nova Friburgo Swiss colony
  and died there in 1919, "moradora nesta da Nova Friburgo" (PAR-0058); Rosa's brother Candido
  appears in Nova Friburgo acts as executor and wedding witness (PRB-0005, PAR-0056) [PROVEN].
  Rosa's other brother Manoel was "o conhecido industrial da Venda das Pedras" at his death in
  1898 (NWS-0002) [PROVEN], and may have stayed nearer home, since Venda das Pedras is today a
  neighbourhood of Itaboraí [CONTEXTUAL]; no held record names either brother's mother. The Lemos
  enter the colony world only through that generation, and they enter it by leaving Itaboraí.

  ## Open questions

  - Whether "Maria Thereza" and "Maria Nunes" are one woman, and her own parents —
  decisive record: the Itaboraí marriage of Manoel de Lemos × Maria [Thereza/Nunes] de
  Jesus, which would give her single true name and her father's surname. [OPEN]

  - **Search bounds reported by the retrieval research (2026-09-10) [LEAD — not repeated
  here]:** the marriage falls in a FamilySearch coverage gap (Itaboraí marriages jump from
  1766–1767 to 1832, and the one 1830s book is access-restricted); her own baptism falls in a
  second gap (baptisms jump from 1727–1729 to 1821); and the 1835–1843 óbito book was sampled
  after 1838 without finding her. The unfilmed books are reported at the archdiocesan archive in
  Niterói. [OPEN]

  - **Polidoro's damaged 1838 entry** (PAR-0033): a better image or re-read of the mother's name
  could tip the Thereza/Nunes question. [OPEN]

  - **Her death:** an Itaboraí óbito naming her widower and heirs would fix the sibling set and
  the name question together. [OPEN]

  ## Sources held (this repository)

  - PAR-0016 (Rosa's 1835 baptism — "Maria Thereza de Jesus") · PAR-0032 (Thomaz's 1836
  baptism — "Maria Thereza") · PAR-0030 (Maria's 1832 baptism — "Maria Nunes de Jesus") ·
  PAR-0031 (Anna's 1834 baptism — "Maria Nunes de Jesus"). PAR-0033 (Polídoro's 1838
  baptism) has her name damaged/illegible. PAR-0058 (daughter Rosa's 1919 Nova Friburgo death —
  names her "Maria Tereza Pereira de Lemos", a further later variant).

  ## Regional and migration context

  She was "natural desta freguezia", Itaboraí, and baptised her children at the Itaboraí matriz
  from 1832 to 1838 (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033) [PROVEN]. Itaboraí was
  then a Portuguese-descended sugar and farming parish east of Guanabara Bay, worked by enslaved
  labour [CONTEXTUAL]. Her Brazilian nationality follows from that documented birthplace. The
  family's move into the Nova Friburgo colony belongs to her daughter Rosa's generation: Rosa's
  marriage was celebrated at Itaboraí (PAR-0002) and she died a resident of Nova Friburgo
  (PAR-0058).

  ## Where to go today

  - **Baptisms of her children (1832–1838):** Igreja Matriz de São João Batista de Itaboraí (Praça Marechal Floriano Peixoto 15, Centro, Itaboraí, RJ) — the Lemos family's home parish [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)
profile_pt: >-
  ## Fatos interessantes

  - **[CONTEXTUAL]** O sobrenome devocional "de Jesus" oculta por completo sua linhagem paterna — prática comum nas famílias brasileiras de condição mais modesta da época, em que uma partícula devocional substituía um sobrenome fixo. Só seu próprio casamento ou óbito poderia fornecer um sobrenome paterno, e a pesquisa de recuperação relata que ambos caem em lacunas dos registros filmados de Itaboraí [LEAD]; sua ascendência está, portanto, fora de alcance por ora, e não impossível de rastrear em princípio.

  - **[INFERRED]** A alternância entre "Maria Thereza" e "Maria Nunes" nos batismos dos filhos, com o mesmo marido e o mesmo oficiante, aponta fortemente para um único escrivão variando o elemento central do nome — inconsistência de escrivão do século XIX, não indício de duas mulheres diferentes.

  - **[PROVEN / CONTEXTUAL]** Uma terceira forma de seu nome — "Maria Tereza Pereira de Lemos" — aparece no registro de óbito de 1919 de sua filha Rosa em Nova Friburgo, que dá à mãe o sobrenome do marido ("Pereira de Lemos") no lugar do devocional "de Jesus" (PAR-0058). Registrar décadas depois uma esposa com o sobrenome do marido é uma deriva recorrente nos registros brasileiros, e ela obscurece, em vez de esclarecer, a identidade original.

  - **[PROVEN]** O batismo de 1835 de sua filha Rosa em Itaboraí nomeia ambos os pais como "naturaes desta freguezia", o que faz dela uma natural documentada de Itaboraí e situa ela e o marido na mesma freguesia de origem (PAR-0016).

  - **[INFERRED]** A família Lemos entrou no mundo da colônia suíço-alemã apenas pelo casamento da filha Rosa. Nada do que se dispõe a situa em Nova Friburgo; a travessia cultural pertence à geração seguinte, não à dela.

  ## Identidade

  Registrada de duas formas pelo mesmo vigário de Itaboraí: **Maria Thereza de Jesus** nos
  batismos de Rosa (1835) e Thomaz (1836) (PAR-0016, PAR-0032), e **Maria Nunes de Jesus**
  nos batismos de Maria (1832) e Anna (1834) (PAR-0030, PAR-0031) — inconsistência de
  escrivão para uma só mulher; "Maria Thereza de Jesus" é a forma preferida [PROVEN]. Uma
  terceira forma, mais tardia — **Maria Tereza Pereira de Lemos** — aparece no óbito de 1919 de
  sua filha Rosa em Nova Friburgo (PAR-0058), que troca o devocional "de Jesus" pelo "de Lemos"
  do marido (e acrescenta "Pereira"); é preservada como variante, prevalecendo os batismos, mais
  próximos do evento. Ela é a mãe de Rosa Eugenia de Lemos (P-0035) e, portanto, avó materna de
  Joaquim José Bohrer (P-0030).

  - **Nacionalidade:** brasileira [PROVEN] — "natural desta freguezia" (Itaboraí) no
  batismo de 1835 (PAR-0016).

  - **Pais:** desconhecidos em qualquer registro disponível [OPEN]; o sobrenome devocional
  "de Jesus" não traz pista de linhagem.

  - **Casamento e filhos:** esposa de Manoel de Lemos [Pereira] (P-0052), família F-0025;
  mãe dos filhos de Itaboraí de 1832–1838 (Maria, Anna, Rosa Eugenia, Thomaz, Polídoro).
  Uma mãe batizando filhos desde o início da década de 1830 implica um nascimento não
  posterior a c.1810–1815 [INFERRED]. Um sexto batismo, de um filho Manoel em 1831, é relatado
  pela pesquisa de recuperação, mas não está disponível aqui [LEAD]. Os irmãos de Rosa, Candido
  Pereira de Lemos (PRB-0005) e Manoel Pereira de Lemos (f. 1898 aos 72 anos, portanto n.
  c.1826, NWS-0002), estão documentados, mas nenhum registro disponível nomeia a mãe deles. Se
  fossem filhos dela, sua fase de partos começou até c.1826 e seu nascimento não é posterior a
  c.1810 [INFERRED].

  - **Óbito:** não localizado. Já estava morta em novembro de 1919, quando o óbito de Rosa nomeia
  ambos os pais como "falecidos" (PAR-0058) [PROVEN quanto ao limite].

  ## Posição social e profissão

  Nada documentado. Os atos disponíveis a nomeiam apenas como mãe: nenhuma ocupação,
  propriedade, assinatura ou alfabetização é registrada [OPEN], nem seria de esperar para uma
  mulher casada nesses assentos de batismo [CONTEXTUAL].

  ## Família e rede social

  **Marido.** Manoel de Lemos Pereira (P-0052), escrito "Manoel de Lemos" (1835, 1836), "Manoel
  de Lemos [Ferreira]" e "Manoel de Lemos Ferreira" (1832, 1834, 1838) e "Manoel Pereira Lemos"
  (1919) (PAR-0016, PAR-0032, PAR-0030, PAR-0031, PAR-0033, PAR-0058) [PROVEN].

  **Filhos nos registros disponíveis.** Maria, batizada em 14 de julho de 1832 (PAR-0030); Anna,
  em 12 de fevereiro de 1834 (PAR-0031); Rosa, em outubro de 1835, "nascida a dez mezes"
  (PAR-0016); Thomaz, em junho de 1836 (PAR-0032); e Polidoro, c. novembro de 1838, cujo nome da
  mãe está ilegível (PAR-0033) [PROVEN]. Os irmãos mais velhos Candido e Manoel são tratados em
  Identidade.

  **Padrinhos.** Manoel José da Silva e Flor de Maria da Conceição (Rosa, PAR-0016); [Felício?]
  José Custódio Vieira (Maria, PAR-0030); José Antonio e Anna Roza de Guimarães (Anna,
  PAR-0031). Os padrinhos de 1836 e 1838 estão ilegíveis (PAR-0032, PAR-0033). Nenhum traz
  título ou patente [PROVEN conforme registrado].

  **Seus próprios pais:** desconhecidos; nenhum registro disponível os nomeia.

  ## O que podemos extrapolar

  A alternância "Thereza" vs "Nunes" é a única questão em aberto. A leitura ordinária — uma só
  mulher, o mesmo marido, a mesma matriz e época de vigário, uma janela estreita e as duas
  formas alternando entre os próprios filhos de Manoel — é a de um escrivão variando o elemento
  intermediário de "Maria … de Jesus". Essa é a hipótese de trabalho; a alternativa (duas
  esposas, ou dois homens "Manoel de Lemos" na freguesia) não é descartada por nada do que se
  dispõe. [INFERRED]

  **Toda a sua vida documentada cabe em cinco batismos ao longo de seis anos.** [INFERRED]
  Entre 1832 e 1838 ela aparece em cinco assentos de batismo de Itaboraí disponíveis (um sexto,
  de 1831, é relatado mas não está disponível [LEAD]) — um parto a cada dezoito meses,
  aproximadamente, no meio de seus anos férteis — e em mais nada de seu: nenhum ato
  de propriedade, nenhum testamento, nenhuma assinatura, nenhuma ocupação, nenhum registro de
  sepultamento localizado. Até o próprio sobrenome a esconde: o devocional *de Jesus* não
  carrega linhagem, e é por isso que sua filiação é invisível. Isso não é uma lacuna de
  pesquisa. Num domicílio sem nada a transacionar, o registro paroquial é o único arquivo que
  registra o que quer que seja, de modo que o fundo de uma genealogia parece plano — e a planura
  é uma propriedade do sistema de registro, não das vidas.

  **Posição de classe [CONTEXTUAL].** Como seu marido, ela se situa sobre o modesto piso
  *fluminense* de descendência portuguesa de Itaboraí: uma família local, rural e integrada à
  igreja, sem terra, ofício ou riqueza documentados, e sem nenhum padrinho titulado nos batismos
  de seus filhos (PAR-0016, PAR-0030, PAR-0031) [PROVEN]. Itaboraí, em sua época, era um
  município açucareiro movido por trabalho escravizado [CONTEXTUAL]; nada nos atos disponíveis
  situa seu domicílio do lado proprietário dessa economia.

  **A virada vem depois dela, e vem pela mudança de lugar.** [INFERRED] Sua própria geração não
  subiu nem migrou; a dos filhos, sim. Uma filha casou-se na colônia suíça de Nova Friburgo e ali
  morreu em 1919, "moradora nesta da Nova Friburgo" (PAR-0058); Candido, irmão de Rosa, aparece
  em atos de Nova Friburgo como testamenteiro e testemunha de casamento (PRB-0005, PAR-0056)
  [PROVEN]. O outro irmão de Rosa, Manoel, era "o conhecido industrial da Venda das Pedras" ao
  morrer em 1898 (NWS-0002) [PROVEN] e pode ter ficado mais perto de casa, pois Venda das Pedras
  é hoje um bairro de Itaboraí [CONTEXTUAL]; nenhum registro disponível nomeia a mãe de qualquer
  dos dois irmãos. Os Lemos entram no mundo da colônia apenas por essa geração, e entram nele
  saindo de Itaboraí.

  ## Questões em aberto

  - Se "Maria Thereza" e "Maria Nunes" são uma só mulher, e seus próprios pais — registro
  decisivo: o casamento em Itaboraí de Manoel de Lemos × Maria [Thereza/Nunes] de Jesus,
  que daria seu nome verdadeiro único e o sobrenome de seu pai. [OPEN]

  - **Limites de busca relatados pela pesquisa de recuperação (2026-09-10) [LEAD — não
  repetidos aqui]:** o casamento cai numa lacuna de cobertura do FamilySearch (os casamentos de
  Itaboraí saltam de 1766–1767 para 1832, e o único livro da década de 1830 tem acesso
  restrito); seu próprio batismo cai numa segunda lacuna (os batismos saltam de 1727–1729 para
  1821); e o livro de óbitos de 1835–1843 foi amostrado depois de 1838 sem encontrá-la. Os
  livros não filmados estariam no arquivo da arquidiocese em Niterói. [OPEN]

  - **O assento danificado de Polidoro, 1838** (PAR-0033): uma imagem melhor ou nova leitura do
  nome da mãe poderia decidir a questão Thereza/Nunes. [OPEN]

  - **Seu óbito:** um óbito de Itaboraí que nomeasse o viúvo e os herdeiros fixaria de uma vez o
  conjunto de irmãos e a questão do nome. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0016 (batismo de Rosa em 1835 — "Maria Thereza de Jesus") · PAR-0032 (batismo de
  Thomaz em 1836 — "Maria Thereza") · PAR-0030 (batismo de Maria em 1832 — "Maria Nunes de
  Jesus") · PAR-0031 (batismo de Anna em 1834 — "Maria Nunes de Jesus"). PAR-0033 (batismo
  de Polídoro em 1838) tem o nome dela danificado/ilegível. PAR-0058 (óbito de 1919 da filha
  Rosa em Nova Friburgo — nomeia-a "Maria Tereza Pereira de Lemos", mais uma variante tardia).

  ## Contexto regional e migratório

  Era "natural desta freguezia", Itaboraí, e batizou os filhos na matriz de Itaboraí de 1832 a
  1838 (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033) [PROVEN]. Itaboraí era então uma
  freguesia de descendência portuguesa, açucareira e agrícola, a leste da baía de Guanabara,
  movida por trabalho escravizado [CONTEXTUAL]. Sua nacionalidade brasileira decorre desse local
  de nascimento documentado. A entrada da família na colônia de Nova Friburgo pertence à geração
  da filha Rosa: o casamento de Rosa foi celebrado em Itaboraí (PAR-0002) e ela morreu moradora
  de Nova Friburgo (PAR-0058).

  ## Onde ir hoje

  - **Batismos de seus filhos (1832–1838):** Igreja Matriz de São João Batista de Itaboraí (Praça Marechal Floriano Peixoto 15, Centro, Itaboraí, RJ) — a paróquia da família Lemos [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)
