  ## Contexto regional e migratório

  Era "natural desta freguezia", Itaboraí, e batizou os filhos na matriz de Itaboraí de 1832 a
  1838 (PAR-0016, PAR-0030, PAR-0031, PAR-0032, PAR-0033) [PROVEN]. Itaboraí era então uma
  freguesia de descendência portuguesa, açucareira e agrícola, a leste da baía de Guanabara,
  movida por trabalho escravizado [CONTEXTUAL]. Sua nacionalidade brasileira decorre desse local
  de nascimento documentado. Seu pai, José Campello de Moraes, é "natural do Port[o]" em 1821
  (PAR-0101) — mais naturalmente a cidade portuguesa [uncertain] —, de modo que ela era
  provavelmente a filha, nascida no Brasil, de um imigrante português e de uma mãe natural de
  Itaboraí [STRONG quanto à filiação; INFERRED quanto à migração]. A entrada da família na colônia de Nova Friburgo pertence à geração
  da filha Rosa: o casamento de Rosa foi celebrado em Itaboraí (PAR-0002) e ela morreu moradora
  de Nova Friburgo (PAR-0058).

