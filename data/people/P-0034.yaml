profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele fez um testamento cerrado formal em 27 de junho de 1879 (PRB-0005; aberto no dia de sua morte, 6 de julho de 1888, e registrado naquele mês) que incluía um legado de caridade de 50 mil réis para a construção da Capella de Santo Antonio no Suspiro, em Nova Friburgo — um ato modesto mas real de filantropia cívica que o marca como um chefe de família colono proprietário e vinculado à igreja.

  - **[PROVEN]** À sua morte o espólio já não cobria as dívidas: no inventário os bens do casal foram descritos, avaliados, vendidos em praça pública e "absorvidos" pelos credores, e em setembro de 1890 o juízo exonerou a viúva da prestação de contas da testamentaria, porque ela não podia "dar cumprimento do testamento" (PRB-0012).

  - **[PROVEN]** Seu próprio registro de batismo de 1832 (PAR-0054) fixa seu nascimento em 9 de julho de 1832 — corrigindo o "4 de julho" da compilação Imigrantes de Nova Friburgo por cinco dias, ilustrando como um batismo paroquial primário silenciosamente corrige uma compilação genealógica secundária.

  - **[CONTEXTUAL]** Ele nasceu na colônia de Nova Friburgo apenas 13 anos após sua fundação — velho o suficiente para ouvir as histórias dos primeiros colonos em primeira mão, e jovem o suficiente para crescer na segunda geração que se assimilou plenamente à cultura católica brasileira e à língua portuguesa.

  - **[PROVEN]** Sua morte em 1888 por "insuficiência mitral e dilatação aórtica" aos 56 anos (PAR-0055) antecedeu a abolição da escravidão por alguns meses, de modo que nunca viveu num Brasil de trabalho livre. Seu filho Joaquim (P-0030) e a geração seguinte enfrentaram essa transição.

  - **[INFERRED]** Seu casamento com Rosa Eugenia de Lemos (P-0035), de Itaboraí — celebrado perante o coadjutor de Itaboraí e só justificado pelo juízo eclesiástico do Rio e registrado na Matriz de Itaboraí décadas depois — é o único fio não colono deste ramo, e exigiu navegar pelo sistema eclesiástico: a comunidade colona era fechada o suficiente para que casar fora dela não fosse simples.

  - **[CONTEXTUAL]** Seu testamento (PRB-0005) é o documento que sustenta toda a linhagem Jacob Borer: o único registro em que o próprio Francisco nomeia seus pais Jacob Bohrer e Catharina Mayer, e a única fonte primária que conta Joaquim entre os herdeiros de Francisco — um único ato testamentário, feito em 1879 e aberto em 1888, que responde a questões que nenhum censo ou registro vital havia respondido.

  ## Identidade

  **Francisco José Bohrer** — grafado *Borer* na compilação dos colonos de Nova Friburgo
  (PUB-0003) e *Bohrer* em seu próprio testamento e nos registros civis de seus
  descendentes (a cópia do testamento escreve *Bohrer* no testamento propriamente dito e
  *Borer* na aprovação do tabelião de 1879 e nos termos de 1888); a variação *Borer → Bohrer*
  passa por ele. [PROVEN]

  - **Nascimento:** 9 de julho de 1832 na comarca de Nova Friburgo; batizado em 19 de agosto
  de 1832 em São João Baptista [PROVEN — PAR-0054]. Seu próprio testamento (feito em 1879,
  aberto em 1888) declara, de forma independente, que era "natural deste termo" (PRB-0005).
  [PROVEN] A compilação
  Imigrantes de Nova Friburgo dá 4 de julho de 1832 (PUB-0003) — uma discrepância de cinco
  dias que o batismo em mãos corrige. [LEAD, secundário]

  - **Pais:** Jacob Bohrer (assim lido na imagem do testamento; antes catalogado "Bahrer"
  [incerto]) e Catharina Moser (P-0050, P-0051; família F-0024), ambos já falecidos em 27 de
  junho de 1879, nomeados em seu próprio testamento (PRB-0005) — que a escreve "Mayer". [PROVEN] A mesma
  compilação os identifica como o casal de colonos suíços Jacob Borer (n. 1801, Erschwil,
  Soleure) e Catharina Moser (PUB-0003) [LEAD] — a origem suíça e o sobrenome de solteira
  "Moser" NÃO são afirmados a partir do testamento, que lê "Mayer".

  - **Casamento:** Rosa Eugenia de Lemos (P-0035). O casamento foi celebrado antes em
  Itaboraí, perante o coadjutor Rufino José Alves e na casa do pai de José Antunes de
  Lemos, e só foi judicialmente justificado (Rio, 30 de junho de 1879) e registrado na
  Matriz de Itaboraí em 1º de agosto de 1879 (PAR-0002). [PROVEN, é anterior a 1879] Uma cláusula incerta de
  "mais de vinte anos" nesse ato recuaria o casamento para cerca de 1858. [LEAD] Seu testamento
  cerrado foi aprovado em 27 de junho de 1879, três dias antes daquela sentença: ele parece ter
  posto em ordem o casamento e a sucessão ao mesmo tempo. [INFERRED]

  - **Filhos:** Joaquim José Bohrer (P-0030, o primogênito), Laura, Guilherme (Samuel) e
  Fernando — os quatro herdeiros nomeados em seu testamento, "todos de menor idade" em 27 de
  junho de 1879 (PRB-0005) [PROVEN] — além de
  Ludovina Borer (n. 21 de julho de 1862, f. ainda criança em 27 de dezembro de 1862),
  conforme PUB-0003 [LEAD]. Joaquim está ausente da lista de filhos da compilação; o
  testamento é a fonte autoritativa que o nomeia primogênito.

  - **Óbito:** 6 de julho de 1888 no Alto da Serra, Nova Friburgo, aos 56 anos, de
  insuficiência mitral e dilatação aórtica [PROVEN — PAR-0055] — seu próprio ato paroquial de
  óbito/sepultamento. Já estava "já falecido" quando o registro de nascimento de 1890 de seu
  neto Alberto o nomeia (CIV-0019) [PROVEN], e a data concorda com a abertura de seu
  testamento nesse mesmo dia, 6 de julho de 1888 — "este testamento com que falleceu Francisco
  José Borer" (PRB-0005) — e com a compilação (PUB-0003).

  ## Posição social e profissão

  - **Testador com bens** [PROVEN] — em 1879 fez um testamento cerrado formal, com
  testamenteiros nomeados e um legado de caridade, marca de um homem com patrimônio a
  dispor (PRB-0005). À sua morte, em 1888, esse patrimônio já não cobria as dívidas: foi
  vendido em praça pública e absorvido pelos credores (PRB-0012) [PROVEN].

  - **Legado de caridade** [PROVEN] — 50 mil réis para as obras da Capella de Santo
  Antonio a ser edificada no Suspiro, na vila (PRB-0005). É duvidoso que tenha sido pago:
  em 1890 a viúva declarou ao juízo que não podia "dar cumprimento do testamento" porque os
  bens não bastaram para os credores (PRB-0012) [INFERRED que o legado ficou sem pagamento].

  - **Testamenteiros nomeados no testamento** [PROVEN] — "testamenteiros e tutores de meus
  filhos, na ordem em que se achão": primeiro sua esposa Rosa Eugenia de Lemos, depois seu
  cunhado Candido Pereira de Lemos (irmão de Rosa) e por fim seu amigo Samuel Antonio dos
  Santos (PRB-0005). A escolha de um cunhado Lemos o situa dentro da rede Lemos-Itaboraí de
  sua esposa. Samuel Antonio dos Santos também foi testemunha da aprovação de 1879,
  apresentou o testamento para abertura em 6 de julho de 1888 e em 1890 assinou a petição de
  Rosa por ela (PRB-0005, PRB-0012).

  - **Letrado** [PROVEN] — seu testamento de 1879 encerra com "…que pedi a João José Zamith
  que por mim escrevesse conforme lhe ditei e no qual me assigno por estar conforme"
  (PRB-0005; o sobrenome do tabelião é leitura incerta, antes "Kramith"): a redação foi
  delegada ao tabelião (praxe de um testamento cerrado), mas o próprio testador assina o
  instrumento — não uma fórmula *a rogo* / de analfabetismo —, e o auto de approvação
  registra "que assigna o testador". O texto disponível é uma certidão, de modo que atesta a
  assinatura sem mostrá-la. O letramento é coerente com sua condição de colono proprietário;
  sua esposa, ao contrário, não sabia escrever (PRB-0005, PRB-0012).

  - **Residente no Alto da Serra** da Freguesia de São João Baptista, Nova Friburgo
  [PROVEN] — o mesmo bairro que seu filho Joaquim e seu neto Alberto ocupam no registro de
  1890 (CIV-0019; PUB-0003).

  ## Família e rede social

  Filho nascido no Brasil da geração imigrante, manteve-se dentro da endogamia da colônia
  acima e ao redor de si. Seus irmãos, conforme PUB-0003 [LEAD], foram Catharina (n. 1830,
  casada com Frederico Chaboudez), Maria (n. 1834, casada com Francisco Xavier Chaboudez),
  Augusto (n. 1837) e João José (n. 1840, f. 1859, solteiro) — o duplo casamento Chaboudez
  de duas irmãs Borer com dois irmãos Chaboudez é uma aliança de grupo de irmãos. Casou-se
  para fora: Rosa Eugenia de Lemos veio de Itaboraí (RJ), o único fio não colono a se casar
  com a fechada colônia suíça de Nova Friburgo.

  - Um retrato de estúdio do casal (cerca de 1875) sobrevive nos materiais de recuperação
  [LEAD] — apenas uma imagem, não um registro catalogado.

  ## O que podemos extrapolar

  Seu testamento é o documento que sustenta toda a linhagem Jacob-Borer. [INFERRED] É o único
  registro primário disponível que liga a geração colonial nascida no Brasil aos pais imigrantes
  nomeados e a única fonte primária que inclui Joaquim entre os filhos. Sem ele, tanto o elo
  para cima quanto esta descendência passam a depender apenas de fontes secundárias — daí o peso
  dos conflitos "Mayer vs Moser" e da data do casamento.

  **Como a posição foi adquirida: construída sobre um lote concedido — não herdada, não obtida
  por casamento, não sustentada por cargo.** [INFERRED] Seus pais foram imigrantes do esquema de
  Nova Friburgo de 1819–20; portanto, o que ele possuía ao morrer possuía porque a Coroa havia
  assentado seu pai num lote da colônia e a família o trabalhou e dele comerciou. Ele não se
  casou com propriedade: sua mulher Rosa Eugenia de Lemos vinha de uma família de Itaboraí cujos
  registros disponíveis (PAR-0016, PAR-0030–PAR-0033) não nomeiam terra, ofício ou título. E ele
  não exerceu cargo algum — nenhuma patente, delegacia ou posto de milícia aparece para ele em
  todo o corpus disponível. Resta uma única categoria: **feito por si mesmo sobre terra
  concedida**, a única forma de riqueza herdável que esta família chegou a tocar. (Os materiais
  de recuperação também situam "Francisco José Borer" e sua mulher no registro de terras de Nova
  Friburgo de 1854–55 — item não catalogado que aponta no mesmo sentido. [LEAD])

  **Medido contra a economia à sua volta, o ápice é pequeno.** [CONTEXTUAL/INFERRED] O pacote
  colonial prometido a seus pais era deliberadamente mínimo: um lote e uma casa, um subsídio
  diário de 160 réis no primeiro ano caindo a 80 réis depois, além de rações, sementes e gado,
  por um período de estabelecimento de dois anos (Decreto de 16 de maio de 1818) — cerca de
  58$000 por ano, algo como um sétimo dos ~420$000 de um trabalhador rural livre [CONTEXTUAL].
  Duas gerações depois, a única cifra que o próprio espólio dele põe no papel são os **50$000
  que legou às obras da Capela de Santo Antonio** (PRB-0005) [PROVEN] — cerca de um oitavo do
  ano desse mesmo trabalhador e da ordem de um vigésimo do que custava uma pessoa escravizada
  adulta nessas décadas [CONTEXTUAL]. Propriedade real, posição real, um ato real de filantropia
  cívica — e, medido contra o mundo em que se inseria, muito pouco dinheiro; e em 1890 até esse
  legado provavelmente ficara sem pagamento, absorvido o espólio pelos credores (PRB-0012)
  [INFERRED].

  **O que o testamento não contém informa tanto quanto o que contém.** [INFERRED] Ele dispõe de
  "meus bens" sem nomear um único item: nenhum lote, nenhuma casa, nenhuma venda, nenhum crédito
  a receber — e nenhuma pessoa escravizada. Um testamento não é um inventário e não tem
  obrigação de arrolar o espólio, de modo que o silêncio não prova que ele fosse pequeno (o
  inventário, que o arrolaria, não está disponível; o lado da recuperação o relata no
  FamilySearch [LEAD]). Mas foi ditado em junho de 1879, nove anos antes da Abolição, numa
  província em que a escravização era a forma
  corrente de capital entre proprietários, e **nenhum registro disponível neste repositório
  nomeia uma pessoa escravizada em qualquer domicílio Bohrer, Lemos ou Silva-Ferreira** — uma
  negativa delimitada ao corpus disponível, não uma afirmação sobre registros ainda não vistos.
  Seja o que for que esta família possuísse, os documentos que temos nunca a mostram possuindo
  pessoas, o que a situa inteiramente fora do estrato fundiário.

  **Uma venda para os credores, e não a partilha, pôs fim ao único momento fundiário.**
  [PROVEN/INFERRED] O testamento nomeia quatro filhos — Joaquim, Laura, Guilherme e Fernando —
  como "meus unicos e legitimos herdeiros" (PRB-0005) [PROVEN], e a lei brasileira dividiria o
  espólio igualmente entre eles, depois da meação da viúva [CONTEXTUAL]. Essa divisão nunca
  aconteceu. No inventário que se seguiu à sua morte os bens do casal ("os bens de seu cazal")
  foram descritos, avaliados, vendidos em praça pública e rateados entre os credores, "e
  consequentemente, absorvidos para taes pagamentos"; em setembro de 1890 Rosa Eugenia declarou
  à Provedoria que não podia cumprir o testamento, e o juízo a exonerou da prestação de contas
  (PRB-0012) [PROVEN]. Nem os quinhões dos herdeiros nem a metade da viúva sobreviveram à venda
  [INFERRED]. Rosa Eugenia viveu mais trinta e um anos, até novembro de 1919 (PAR-0058)
  [PROVEN], sem o espólio. O único momento fundiário da linha nunca chegou à geração seguinte
  como capital de giro.

  **Daqui em diante a base não cresce; ela se converte — de herdável em contingente.**
  [INFERRED] Seus filhos sobreviventes saíram da terra para o comércio e a vida pública local:
  Joaquim, *negociante* no Alto da Serra (CIV-0019, CIV-0020); Guilherme, gerente e proprietário
  do semanário *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN]. É uma passagem de riqueza
  que se herda para riqueza que termina com o homem e com o mercado — e, depois da venda para os
  credores de 1888–90 (PRB-0012), o que os filhos tinham foi reconstruído, não herdado
  [INFERRED]. O letramento seguiu o mesmo
  caminho: ele assina o próprio testamento [PROVEN] e, na geração dos filhos, as letras eram o
  instrumento de trabalho de um comerciante e de um jornalista — compradas porque o papel as
  exigia, não transmitidas como vantagem de classe [CONTEXTUAL/INFERRED]. Este é o arco Bohrer
  em seu ponto mais alto, e ainda assim situa-se bem abaixo da elite de cargos e casamentos de
  que a linha paterna Armond desta mesma família partiu e de que caiu: duas linhas convergindo
  para um mesmo nível urbano modesto por direções opostas.

  ## Questões em aberto

  - "Mayer" (testamento) versus "Moser" (batismo e compilação) para o sobrenome de solteira
  de sua mãe — seu batismo de 1832 (PAR-0054) lê "Moser"; o registro decisivo seria o
  inventário de Jacob Borer, por volta de 1843, em Nova Friburgo. [OPEN]

  - A data exata do casamento por trás da justificação de 1879. [OPEN]

  - Seu próprio inventário (Juízo de Órfãos de Nova Friburgo, 1888–90; inventariante Rosa)
  arrolaria o espólio, as dívidas, os credores e as idades dos herdeiros. O lado da
  recuperação o relata localizado no FamilySearch (DGS 105875671, cerca de 300 imagens,
  incluindo a praça de uma "caza de negocio do Alto da Serra") [LEAD — não lido]. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0005 (certidão, de 27 de janeiro de 1890, de seu testamento cerrado registrado de 27
  de junho de 1879 — pais, esposa, quatro filhos menores, testamenteiros e tutores, legado;
  sua aprovação no mesmo dia, sua abertura em 6 de julho de 1888 e seu registro em 24 de julho
  de 1888) · PRB-0012 (os autos da Provedoria de 1890 sobre a sua testamentaria — o espólio
  vendido em praça e absorvido pelos credores; a viúva exonerada da prestação de contas, 16 de
  setembro de 1890) · PAR-0002 (justificação de casamento de 1879 registrada na Matriz de
  Itaboraí).

  - PAR-0054 (seu próprio batismo de 1832 em Nova Friburgo — nascido em 9 de julho, batizado
  em 19 de agosto de 1832; pais Jacob Bohrer × Catharina Moser) · PAR-0055 (seu próprio
  óbito/sepultamento de 1888 em Nova Friburgo — 6 de julho de 1888, aos 56 anos, causa
  insuficiência mitral e dilatação aórtica).

  - CIV-0019 (nascimento de 1890 do neto Alberto, em Nova Friburgo — nomeia-o avô paterno,
  "já falecido").

  - PUB-0003 (compilação Imigrantes de Nova Friburgo — datas e causa do óbito, irmãos, e a
  pista da origem suíça; secundária).

  ## Contexto regional e migratório

  Toda a sua vida situa-se em Nova Friburgo, a cidade serrana do Rio de Janeiro fundada
  sobre a colônia suíço-alemã de 1819–1824. [CONTEXTUAL] Ele é a geração colonial
  estabelecida e nascida no Brasil do tronco Jacob Borer — nascido, casado e falecido na
  freguesia, residente nos lotes serranos do Alto da Serra — e seu casamento com uma noiva
  das terras baixas de Itaboraí é o único fio não colono entretecido numa comunidade
  imigrante de resto endogâmica.

