- text: >-
    Ahnentafel position 60 — father of Joaquim José Bohrer (P-0030), hence Celina's
    (P-0015) paternal grandfather. Married Rosa Eugenia de Lemos (P-0035); their
    marriage was justified and registered at the Nova Friburgo Matriz in 1879
    [corrected 2026-10-10: the Itaboraí Matriz, not Nova Friburgo — see PAR-0002] (PAR-0002). Already deceased by 1890, when Alberto Bohrer's birth (CIV-0019)
    names him "Francisco José Bohrer já falecido".
  text_pt: >-
    Posição 60 no Ahnentafel — pai de Joaquim José Bohrer (P-0030), portanto avô
    paterno de Celina (P-0015). Casou-se com Rosa Eugenia de Lemos (P-0035); o
    casamento deles foi justificado e registrado na Matriz de Nova Friburgo em 1879
    [corrigido em 2026-10-10: Matriz de Itaboraí, não de Nova Friburgo — ver PAR-0002] (PAR-0002). Já falecido em 1890, quando o nascimento de Alberto Bohrer (CIV-0019)
    o nomeia "Francisco José Bohrer já falecido".
- text: >-
    Parentage and birthplace RESOLVED (1 August 2026) by his own registered will
    (PRB-0005, Provedoria de Nova Friburgo, registered 1888): he declares himself
    "natural deste termo" — i.e. born in the Nova Friburgo comarca — and "filho
    legitimo de Jacob Bahrer e de Catharina Mayer, já fallecidos" (parents P-0050,
    P-0051, family F-0024). Nationality is therefore Brazilian (a documented
    birthplace, not a surname inference); the earlier "immigrant vs Brazilian-born"
    question is settled — he was Brazilian-born, and the immigrant boundary moves up
    to his parents Jacob and Catharina. The will also names his wife and their four
    children (Joaquim, Laura, Guilherme, Fernando) as sole heirs and dates his death
    to c.1888 (consistent with "já falecido" by 1890).
    [Corrected 2026-10-10: PRB-0005 is now held whole (8 pages). The will was made on 27 June
    1879 and only opened on 6 July 1888 (the day he died) and registered on 24 July 1888, so
    it was not an "1888 will", and it does not itself date his death, which rests on his death
    act (PAR-0055). The father's surname reads "Bohrer" on the image; "Bahrer" is possible
    but not secure (see P-0050).]
  text_pt: >-
    Filiação e local de nascimento RESOLVIDOS (1 de agosto de 2026) por seu próprio
    testamento registrado (PRB-0005, Provedoria de Nova Friburgo, registrado em 1888):
    ele se declara "natural deste termo" — ou seja, nascido na comarca de Nova Friburgo
    — e "filho legitimo de Jacob Bahrer e de Catharina Mayer, já fallecidos" (pais
    P-0050, P-0051, família F-0024). A nacionalidade é, portanto, brasileira (um local
    de nascimento documentado, não uma inferência a partir do sobrenome); a anterior
    questão "imigrante vs. nascido no Brasil" está resolvida — ele nasceu no Brasil, e a
    fronteira da imigração sobe para seus pais Jacob e Catharina. O testamento também
    nomeia sua esposa e os quatro filhos deles (Joaquim, Laura, Guilherme, Fernando)
    como herdeiros únicos e data sua morte em c.1888 (coerente com "já falecido" em
    1890).
    [Corrigido em 2026-10-10: PRB-0005 está agora disponível por inteiro (8 páginas). O
    testamento foi feito em 27 de junho de 1879 e só aberto em 6 de julho de 1888 (o dia de
    sua morte) e registrado em 24 de julho de 1888; não era, portanto, um "testamento de 1888",
    e não data por si a sua morte, que se apoia no ato de óbito (PAR-0055). O sobrenome do pai
    lê-se "Bohrer" na imagem; "Bahrer" é possível, mas não seguro (ver P-0050).]
- text: >-
