- text: >-
    [2026-10-10] The whole will and its sequel are now held (PRB-0005, 8 pages; PRB-0012, the
    1890 Provedoria proceedings). His closed will was made on 27 June 1879, written at his
    dictation by the tabellião João José Zamith [surname uncertain; formerly read "Kramith"]
    and signed by him, and approved the same day before five witnesses (Antonio Rodrigues
    Teixeira, José Ribeiro Ramalho, Francisco Paulo Marcello Leglaye [uncertain], Rodrigo
    Joaquim da Silva, Samuel Antonio dos Santos). It was presented by Samuel Antonio dos
    Santos and opened by the Juiz da Provedoria on 6 July 1888, the day he died ("este
    testamento com que falleceu Francisco José Borer"), ordered complied with on 7 July and
    registered on 24 July 1888 (Livro de Registro de Testamentos nº 9, fl. 8v). It names as
    sole heirs Joaquim, Laura, Guilherme and Fernando, "todos de menor idade" in 1879, so a
    child born after June 1879 would not appear (none is known; Ludovina, d. 1862, is absent
    as already dead). His parents were already dead by 27 June 1879. The testamenteiros and
    tutors of his children, in order, were his wife Rosa, his brother-in-law Candido Pereira
    de Lemos and his friend Samuel Antonio dos Santos. In the inventário that followed, the
    couple's goods were sold at public auction and wholly absorbed by his creditors, and on
    16 September 1890 the court exonerated Rosa from rendering the executor's accounts
    (PRB-0012). The will was approved three days before the Rio sentence of 30 June 1879 that
    justified his marriage (PAR-0002): he appears to have put his marriage and his succession
    in order together [INFERRED].
  text_pt: >-
    [2026-10-10] O testamento completo e o seu desfecho estão agora disponíveis (PRB-0005, 8
    páginas; PRB-0012, os autos da Provedoria de 1890). Seu testamento cerrado foi feito em 27
    de junho de 1879, escrito a seu ditado pelo tabelião João José Zamith [sobrenome incerto;
    antes lido "Kramith"] e por ele assinado, e aprovado no mesmo dia perante cinco
    testemunhas (Antonio Rodrigues Teixeira, José Ribeiro Ramalho, Francisco Paulo Marcello
    Leglaye [incerto], Rodrigo Joaquim da Silva, Samuel Antonio dos Santos). Foi apresentado
    por Samuel Antonio dos Santos e aberto pelo Juiz da Provedoria em 6 de julho de 1888, o dia
    de sua morte ("este testamento com que falleceu Francisco José Borer"), mandado cumprir em
    7 de julho e registrado em 24 de julho de 1888 (Livro de Registro de Testamentos nº 9, fl.
    8v). Nomeia como únicos herdeiros Joaquim, Laura, Guilherme e Fernando, "todos de menor
    idade" em 1879; um filho nascido depois de junho de 1879 não apareceria (não se conhece
    nenhum; Ludovina, f. 1862, está ausente por já ter morrido). Seus pais já tinham morrido em
    27 de junho de 1879. Os testamenteiros e tutores dos filhos, nesta ordem, foram a esposa
    Rosa, o cunhado Candido Pereira de Lemos e o amigo Samuel Antonio dos Santos. No inventário
    que se seguiu, os bens do casal foram vendidos em praça pública e inteiramente absorvidos
    pelos credores, e em 16 de setembro de 1890 o juízo exonerou Rosa da prestação de contas da
    testamentaria (PRB-0012). O testamento foi aprovado três dias antes da sentença do Rio de
    30 de junho de 1879 que justificou seu casamento (PAR-0002): ele parece ter posto em ordem
    o casamento e a sucessão ao mesmo tempo [INFERRED].
profile: >-
  ## Interesting facts

  - **[PROVEN]** He made a formal closed will on 27 June 1879 (PRB-0005; opened on the day of his death, 6 July 1888, and registered that month) that included a charitable bequest of 50 mil réis to the construction of the Capella de Santo Antonio at the Suspiro in Nova Friburgo — a modest but real act of civic philanthropy that marks him as a propertied, church-connected colonist householder.

  - **[PROVEN]** By his death the estate no longer covered his debts: in the inventário the couple's goods were described, appraised, sold at public auction and "absorvidos" by his creditors, and in September 1890 the court exonerated his widow from rendering the executor's accounts because she could not "dar cumprimento do testamento" (PRB-0012).

  - **[PROVEN]** His own 1832 baptism record (PAR-0054) fixes his birth to 9 July 1832 — correcting the Imigrantes de Nova Friburgo compilation's "4 July" by five days, illustrating how a primary parish baptism quietly corrects a secondary genealogy compilation.

  - **[CONTEXTUAL]** He was born in the Nova Friburgo colony just 13 years after its founding — old enough to hear the early settlers' stories firsthand, and young enough to grow up in the second generation that fully assimilated into Brazilian Catholic culture and the Portuguese language.

  - **[PROVEN]** His death in 1888 from "insuficiência mitral e dilatação aórtica" at age 56 (PAR-0055) preceded the abolition of slavery by a few months, so he never lived under a free-labour Brazil. His son Joaquim (P-0030) and the next generation faced that transition.

  - **[INFERRED]** His marriage to Rosa Eugenia de Lemos (P-0035) from Itaboraí — celebrated before the Itaboraí coadjutor and only justified by the Rio ecclesiastical court and registered at the Itaboraí Matriz decades later — is the one non-colonist thread in this branch, and it required navigating the ecclesiastical system to accomplish: the colonist community was tight enough that marrying outside it was not straightforward.

  - **[CONTEXTUAL]** His will (PRB-0005) is the load-bearing document of the entire Jacob Borer line: the only record in which Francisco himself names his parents Jacob Bohrer and Catharina Mayer, and the only primary source counting Joaquim among Francisco's heirs — a single testamentary act, made in 1879 and opened in 1888, that answers questions no census or vital record answered.

  ## Identity

  **Francisco José Bohrer** — spelled *Borer* in the Nova Friburgo colonist compilation
  (PUB-0003) and *Bohrer* in his own will and his descendants' civil registers (the copy of
  his will writes *Bohrer* in the will itself and *Borer* in the notary's 1879 approval and
  the 1888 termos); the *Borer → Bohrer* drift runs through him. [PROVEN]

  - **Born:** 9 July 1832 in the Nova Friburgo comarca; baptised 19 August 1832 at São João
  Baptista [PROVEN — PAR-0054]. His own will (made 1879, opened 1888) independently states he
  was "natural deste termo" (PRB-0005). [PROVEN] The Imigrantes de Nova Friburgo compilation gives 4 July 1832
  (PUB-0003) — a five-day discrepancy the held baptism corrects. [LEAD, secondary]

  - **Parents:** Jacob Bohrer (so read on the will's image; formerly catalogued "Bahrer"
  [uncertain]) and Catharina Moser (P-0050, P-0051; family F-0024), both already deceased by
  27 June 1879, named in his own will (PRB-0005) — which writes her "Mayer". [PROVEN] The same
  compilation identifies them as the Swiss colonist couple Jacob Borer (b. 1801,
  Erschwil, Soleure) and Catharina Moser (PUB-0003) [LEAD] — the Swiss origin and the
  "Moser" maiden name are NOT asserted from the will, which reads "Mayer".

  - **Marriage:** Rosa Eugenia de Lemos (P-0035). The marriage was celebrated earlier at
  Itaboraí, before the coadjutor Rufino José Alves and at the house of José Antunes de
  Lemos's father, and only judicially justified (Rio, 30 June 1879) and registered at the
  Itaboraí Matriz on 1 August 1879 (PAR-0002). [PROVEN it predates 1879] An uncertain "more than
  twenty years" clause in that act would push the wedding back to about 1858. [LEAD] His closed
  will was approved on 27 June 1879, three days before that sentence: he appears to have put his
  marriage and his succession in order together. [INFERRED]

  - **Children:** Joaquim José Bohrer (P-0030, the firstborn), Laura, Guilherme (Samuel)
  and Fernando — the four heirs named in his will, "todos de menor idade" on 27 June 1879
  (PRB-0005) [PROVEN] — plus Ludovina
  Borer (b. 21 July 1862, d. in infancy 27 December 1862) per PUB-0003 [LEAD]. Joaquim is
  absent from the compilation's child-list; the will is the authoritative source naming
  him firstborn.

  - **Death:** 6 July 1888 at the Alto da Serra, Nova Friburgo, aged 56, of mitral
  insufficiency and aortic dilatation [PROVEN — PAR-0055] — his own parish death/burial act.
  He was already "já falecido" when his grandson Alberto's 1890 birth register names him
  (CIV-0019) [PROVEN], and the date agrees with the opening of his will that same day, 6 July
  1888 — "este testamento com que falleceu Francisco José Borer" (PRB-0005) — and with the
  compilation (PUB-0003).

  ## Standing and profession

  - **A propertied testator** [PROVEN] — in 1879 he made a formal closed will with named
  executors and a charitable bequest, the mark of a man with an estate to dispose of
  (PRB-0005). By his death in 1888 that estate no longer covered his debts: it was sold at
  public auction and absorbed by his creditors (PRB-0012) [PROVEN].

  - **Charitable bequest** [PROVEN] — 50 mil réis to the works of the Capella de Santo
  Antonio to be built at the Suspiro in the vila (PRB-0005). Whether it was ever paid is
  doubtful: in 1890 his widow told the court she could not "dar cumprimento do testamento"
  because the goods had not sufficed for the creditors (PRB-0012) [INFERRED that the bequest
  went unpaid].

  - **Executors named in the will** [PROVEN] — "testamenteiros e tutores de meus filhos, na
  ordem em que se achão": his wife Rosa Eugenia de Lemos first, then his brother-in-law
  Candido Pereira de Lemos (Rosa's brother), then his friend Samuel Antonio dos Santos
  (PRB-0005). The choice of a Lemos brother-in-law situates him inside his wife's
  Itaboraí-Lemos network. Samuel Antonio dos Santos also witnessed the 1879 approval,
  presented the will for opening on 6 July 1888 and in 1890 signed Rosa's petition for her
  (PRB-0005, PRB-0012).

  - **Literate** [PROVEN] — his 1879 will closes "…que pedi a João José Zamith que por mim
  escrevesse conforme lhe ditei e no qual me assigno por estar conforme" (PRB-0005; the
  notary's surname is an uncertain reading, formerly "Kramith"): the drafting was delegated
  to the notary (standard for a testamento cerrado), but the testator signs the instrument
  himself — not an *a rogo* / illiteracy formula — and the auto de approvação records "que
  assigna o testador". The held text is a certified copy, so it attests his signature rather
  than showing it. The literacy is consistent with his propertied colonist standing; his
  wife, by contrast, could not write (PRB-0005, PRB-0012).

  - **Resident at the Alto da Serra** of the Freguesia de São João Baptista, Nova Friburgo
  [PROVEN] — the same neighbourhood his son Joaquim and grandson Alberto occupy in the
  1890 register (CIV-0019; PUB-0003).

  ## Family and social network

  Brazil-born son of the immigrant generation, he stayed inside the colony's endogamy
  above and around him. His siblings, per PUB-0003 [LEAD], were Catharina (b. 1830,
  married Frederico Chaboudez), Maria (b. 1834, married Francisco Xavier Chaboudez),
  Augusto (b. 1837) and João José (b. 1840, d. 1859, unmarried) — the double Chaboudez
  marriage of two Borer sisters to two Chaboudez brothers is a sibling-cluster alliance.
  He married outward: Rosa Eugenia de Lemos came from Itaboraí (RJ), the one non-colonist
  thread married into the otherwise tight Nova Friburgo Swiss colony.

  - A studio cabinet-card portrait of the couple (about 1875) survives in the retrieval
  materials [LEAD] — a likeness only, not a catalogued record.

  ## What we can extrapolate

  His will is the load-bearing document of the whole Jacob-Borer line. [INFERRED] It is the one
  held primary record tying the Brazil-born colonial generation to its named immigrant parents,
  and the only primary source that counts Joaquim among the children. Remove it and both the
  link upward and this descent become secondary-only — which is why the "Mayer vs Moser" and the
  marriage-date conflicts carry so much weight.

  **How the standing was acquired: built on a granted lot — not inherited, not married in, not
  held by office.** [INFERRED] His parents were immigrants of the 1819–20 Nova Friburgo scheme,
  so whatever he held at his death he held because the Crown had placed his father on a colony
  lot and the family worked and traded from it. He did not marry into property: his wife Rosa
  Eugenia de Lemos came from an Itaboraí family whose own held records (PAR-0016,
  PAR-0030–PAR-0033) name no land, office or title. And he held no office — no rank, no
  delegacy, no militia patent appears for him anywhere in the held corpus. That leaves one
  category: **self-made on assigned land**, the only heritable wealth-form this family ever
  touched. (The retrieval materials also place "Francisco José Borer" and his wife in the
  1854–55 Nova Friburgo land registry — an uncatalogued item pointing the same way. [LEAD])

  **Priced against the economy around it, the apex is small.** [CONTEXTUAL/INFERRED] The colony
  package his parents were promised was deliberately bare: a lot and a house, a daily subsidy of
  160 réis in the first year dropping to 80 réis thereafter, plus rations, seed and livestock,
  for a two-year establishment period (Decreto de 16 May 1818) — roughly 58$000 a year, about a
  seventh of a free rural labourer's ~420$000 [CONTEXTUAL]. Two generations later the one figure
  his own estate puts on paper is the **50$000 he willed to the works of the Capela de Santo
  Antonio** (PRB-0005) [PROVEN] — about an eighth of that same labourer's year, and on the order
  of a twentieth of what one enslaved adult cost in these decades [CONTEXTUAL]. Real property,
  real standing, a real act of civic philanthropy — and, measured against the world it sat in,
  very little money; and by 1890 even that legacy had probably gone unpaid, the estate having
  been absorbed by his creditors (PRB-0012) [INFERRED].

  **What the will does not contain is as informative as what it does.** [INFERRED] It disposes
  of "meus bens" without naming a single item: no lot, no house, no store, no credit owed to him
  — and no enslaved person. A testamento is not an inventário and is under no obligation to
  enumerate an estate, so the silence is not proof of a small one (his inventário, which would
  list it, is not held; the retrieval side reports it on FamilySearch [LEAD]). But it was
  dictated in June 1879, nine years before Abolition, in a province where slaveholding was the
  ordinary form of propertied capital, and **no record held in this repository names an enslaved person in any Bohrer, Lemos
  or Silva-Ferreira household** — a bounded negative across the held corpus, not a claim about
  records not yet seen. Whatever this family owned, the documents we hold never show it owning
  people, which places it outside the landed stratum entirely.

  **A creditors' sale, not partition, is what ended the one landed moment.** [PROVEN/INFERRED]
  His will names four children — Joaquim, Laura, Guilherme and Fernando — as "meus unicos e
  legitimos herdeiros" (PRB-0005) [PROVEN], and Brazilian law would have split the estate
  equally among them after the widow's meação [CONTEXTUAL]. That division never happened. In
  the inventário that followed his death the couple's goods ("os bens de seu cazal") were
  described, appraised, sold at public auction and prorated among his creditors, "e
  consequentemente, absorvidos para taes pagamentos"; in September 1890 Rosa Eugenia told the
  Provedoria she could not carry out the will, and the court exonerated her from rendering
  accounts (PRB-0012) [PROVEN]. Neither the heirs' shares nor the widow's half survived the
  sale [INFERRED]. Rosa Eugenia lived another thirty-one years, to November 1919 (PAR-0058)
  [PROVEN], without the estate. The line's single landed moment never reached the next
  generation as working capital at all.

  **From here the base does not grow; it converts — from heritable to contingent.** [INFERRED]
  His surviving sons moved off the land into commerce and local public life: Joaquim a
  *negociante* at the Alto da Serra (CIV-0019, CIV-0020), Guilherme the manager and proprietor
  of the town weekly *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN]. That is a move from
  wealth that can be inherited to wealth that ends with the man and the market — and after the
  1888–90 creditors' sale (PRB-0012) what the sons had was rebuilt, not inherited [INFERRED]. Literacy
  travelled the same way: he signs his own will [PROVEN], and in his sons' generation letters
  were the working tool of a merchant and a newspaperman — bought because the role demanded it,
  not transmitted as class advantage [CONTEXTUAL/INFERRED]. This is the Bohrer arc at its high
  point, and it still sits well below the office-and-marriage elite that the paternal Armond
  line of this same family started from and fell out of: two lines converging on a modest urban
  level from opposite directions.

  ## Open questions

  - "Mayer" (will) versus "Moser" (baptism and compilation) for his mother's maiden name —
  his 1832 baptism (PAR-0054) reads "Moser"; a decisive record would be Jacob Borer's
  about-1843 Nova Friburgo inventário. [OPEN]

  - The exact marriage date behind the 1879 justification. [OPEN]

  - His own inventário (Juízo de Órfãos de Nova Friburgo, 1888–90; inventariante Rosa) would
  list the estate, the debts, the creditors and the heirs' ages. The retrieval side reports it
  located on FamilySearch (DGS 105875671, about 300 images, including the auction of a "caza de
  negocio do Alto da Serra") [LEAD — not read]. [OPEN]

  ## Sources held (this repository)

  - PRB-0005 (certified copy, 27 January 1890, of his registered closed will of 27 June 1879 —
  parents, wife, four minor children, executors and tutors, bequest; its approval the same day,
  its opening on 6 July 1888 and its registration on 24 July 1888) · PRB-0012 (the 1890
  Provedoria proceedings on his testamentaria — the estate sold at auction and absorbed by
  creditors; his widow exonerated from rendering accounts, 16 September 1890) · PAR-0002 (1879
  marriage justification registered at the Itaboraí Matriz).

  - PAR-0054 (his own 1832 Nova Friburgo baptism — born 9 July, baptised 19 August 1832;
  parents Jacob Bohrer × Catharina Moser) · PAR-0055 (his own 1888 Nova Friburgo
  death/burial — 6 July 1888, aged 56, cause mitral insufficiency and aortic dilatation).

  - CIV-0019 (grandson Alberto's 1890 Nova Friburgo birth — names him paternal
  grandfather, "já falecido").

  - PUB-0003 (Imigrantes de Nova Friburgo compilation — birth/death dates and cause,
  siblings, and the Swiss-origin lead; secondary).

  ## Regional and migration context

  His whole life sits in Nova Friburgo, the Rio de Janeiro highland town founded on the
  1819–1824 Swiss-German colony. [CONTEXTUAL] He is the settled, Brazil-born colonial
  generation of the Jacob Borer trunk — born, married and dead in the parish, resident on
  the serra lots of the Alto da Serra — and his marriage to an Itaboraí lowland bride is
  the single non-colonist thread woven into an otherwise endogamous immigrant community.

  ## Where to go today

  - **Birth and death (1832, 1888):** Catedral Diocesana /
  Igreja Matriz de São João Batista, Centro, Nova Friburgo, RJ (Rua Monsenhor José Antônio
  Teixeira 23, CEP 28610-390; GPS -22.28159, -42.53085) [RESOLVED] ·
