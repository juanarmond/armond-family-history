profile: >-
  ## Interesting facts

  - **[PROVEN]** He left a formal registered will (PRB-0005, 1888) that included a charitable bequest of 50 mil réis to the construction of the Capella de Santo Antonio at the Suspiro in Nova Friburgo — a modest but real act of civic philanthropy that marks him as a propertied, church-connected colonist householder.

  - **[PROVEN]** His own 1832 baptism record (PAR-0054) fixes his birth to 9 July 1832 — correcting the Imigrantes de Nova Friburgo compilation's "4 July" by five days, illustrating how a primary parish baptism quietly corrects a secondary genealogy compilation.

  - **[CONTEXTUAL]** He was born in the Nova Friburgo colony just 13 years after its founding — old enough to hear the early settlers' stories firsthand, and young enough to grow up in the second generation that fully assimilated into Brazilian Catholic culture and the Portuguese language.

  - **[PROVEN]** His death in 1888 from "insuficiência mitral e dilatação aórtica" at age 56 (PAR-0055) preceded the abolition of slavery by a few months, so he never lived under a free-labour Brazil. His son Joaquim (P-0030) and the next generation faced that transition.

  - **[INFERRED]** His marriage to Rosa Eugenia de Lemos (P-0035) from Itaboraí — celebrated before the Itaboraí coadjutor and only justified at Nova Friburgo decades later — is the one non-colonist thread in this branch, and it required navigating the ecclesiastical system to accomplish: the colonist community was tight enough that marrying outside it was not straightforward.

  - **[CONTEXTUAL]** His will (PRB-0005) is the load-bearing document of the entire Jacob Borer line: the only primary record that names Jacob Bahrer as Francisco's father, and the only primary source counting Joaquim among Francisco's heirs — a single 1888 testamentary act that answers questions no census or vital record answered.

  ## Identity

  **Francisco José Bohrer** — spelled *Borer* in the Nova Friburgo colonist compilation
  (PUB-0003) and *Bohrer* in his own will and his descendants' civil registers; the
  *Borer → Bohrer* drift runs through him. [PROVEN]

  - **Born:** 9 July 1832 in the Nova Friburgo comarca; baptised 19 August 1832 at São João
  Baptista [PROVEN — PAR-0054]. His own 1888 will independently states he was "natural deste
  termo" (PRB-0005). [PROVEN] The Imigrantes de Nova Friburgo compilation gives 4 July 1832
  (PUB-0003) — a five-day discrepancy the held baptism corrects. [LEAD, secondary]

  - **Parents:** Jacob Bahrer and Catharina Moser (P-0050, P-0051; family F-0024), both
  already deceased by 1888, named in his own will (PRB-0005). [PROVEN] The same
  compilation identifies them as the Swiss colonist couple Jacob Borer (b. 1801,
  Erschwil, Soleure) and Catharina Moser (PUB-0003) [LEAD] — the Swiss origin and the
  "Moser" maiden name are NOT asserted from the will, which reads "Mayer".

  - **Marriage:** Rosa Eugenia de Lemos (P-0035). The marriage was celebrated earlier at
  Itaboraí, before the coadjutor Rufino José Alves and at the house of José Antunes de
  Lemos's father, and only judicially justified and registered at the Nova Friburgo
  Matriz on 1 August 1879 (PAR-0002). [PROVEN it predates 1879] An uncertain "more than
  twenty years" clause in that act would push the wedding back to about 1858. [LEAD]

  - **Children:** Joaquim José Bohrer (P-0030, the firstborn), Laura, Guilherme (Samuel)
  and Fernando — the four heirs named in his will (PRB-0005) [PROVEN] — plus Ludovina
  Borer (b. 21 July 1862, d. in infancy 27 December 1862) per PUB-0003 [LEAD]. Joaquim is
  absent from the compilation's child-list; the will is the authoritative source naming
  him firstborn.

  - **Death:** 6 July 1888 at the Alto da Serra, Nova Friburgo, aged 56, of mitral
  insufficiency and aortic dilatation [PROVEN — PAR-0055] — his own parish death/burial act.
  He was already "já falecido" when his grandson Alberto's 1890 birth register names him
  (CIV-0019) [PROVEN], and the date agrees with the will registered in 1888 and the
  compilation (PUB-0003).

  ## Standing and profession

  - **A propertied testator** [PROVEN] — he left a formal registered will with named
  executors and a charitable bequest, the mark of a man with an estate to dispose of
  (PRB-0005).

  - **Charitable bequest** [PROVEN] — 50 mil réis to the works of the Capella de Santo
  Antonio to be built at the Suspiro in the vila (PRB-0005).

  - **Executors named in the will** [PROVEN] — his wife Rosa Eugenia de Lemos first, then
  his brother-in-law Candido Pereira de Lemos (Rosa's brother), then his friend Samuel
  Antonio dos Santos (PRB-0005). The choice of a Lemos brother-in-law situates him inside
  his wife's Itaboraí-Lemos network.

  - **Literate** [PROVEN] — his 1888 will closes "…que pedi a João José Kramith que por
  mim escrevesse conforme lhe ditei, e no qual me assigno por estar conforme" (PRB-0005):
  the drafting was delegated to the escrivão (standard for a notarial testamento), but the
  testator signs the instrument himself — not an *a rogo* / illiteracy formula. The
  literacy is consistent with his propertied colonist standing.

  - **Resident at the Alto da Serra** of the Freguesia de São João Baptista, Nova Friburgo
  [PROVEN] — the same neighbourhood his son Joaquim and grandson Alberto occupy in the
  1890 register (CIV-0019; PUB-0003).

  ## Family and social network

  Brazil-born son of the immigrant generation, he stayed inside the colony's endogamy
  above and around him. His siblings, per PUB-0003 [LEAD], were Catharina (b. 1830,
  married Frederico Chaboudez), Maria (b. 1834, married Francisco Xavier Chaboudez),
  Augusto (b. 1837) and João José (b. 1840, d. 1859, unmarried) — the double Chaboudez
  marriage of two Borer sisters to two Chaboudez brothers is a sibling-cluster alliance.
  He married outward: Rosa Eugenia de Lemos came from Itaboraí (RJ), the one non-colonist
  thread married into the otherwise tight Nova Friburgo Swiss colony.

  - A studio cabinet-card portrait of the couple (about 1875) survives in the retrieval
  materials [LEAD] — a likeness only, not a catalogued record.

  ## What we can extrapolate

  His will is the load-bearing document of the whole Jacob-Borer line. [INFERRED] It is the one
  held primary record tying the Brazil-born colonial generation to its named immigrant parents,
  and the only primary source that counts Joaquim among the children. Remove it and both the
  link upward and this descent become secondary-only — which is why the "Mayer vs Moser" and the
  marriage-date conflicts carry so much weight.

  **How the standing was acquired: built on a granted lot — not inherited, not married in, not
  held by office.** [INFERRED] His parents were immigrants of the 1819–20 Nova Friburgo scheme,
  so whatever he held at his death he held because the Crown had placed his father on a colony
  lot and the family worked and traded from it. He did not marry into property: his wife Rosa
  Eugenia de Lemos came from an Itaboraí family whose own held records (PAR-0016,
  PAR-0030–PAR-0033) name no land, office or title. And he held no office — no rank, no
  delegacy, no militia patent appears for him anywhere in the held corpus. That leaves one
  category: **self-made on assigned land**, the only heritable wealth-form this family ever
  touched. (The retrieval materials also place "Francisco José Borer" and his wife in the
  1854–55 Nova Friburgo land registry — an uncatalogued item pointing the same way. [LEAD])

  **Priced against the economy around it, the apex is small.** [CONTEXTUAL/INFERRED] The colony
  package his parents were promised was deliberately bare: a lot and a house, a daily subsidy of
  160 réis in the first year dropping to 80 réis thereafter, plus rations, seed and livestock,
  for a two-year establishment period (Decreto de 16 May 1818) — roughly 58$000 a year, about a
  seventh of a free rural labourer's ~420$000 [CONTEXTUAL]. Two generations later the one figure
  his own estate puts on paper is the **50$000 he willed to the works of the Capela de Santo
  Antonio** (PRB-0005) [PROVEN] — about an eighth of that same labourer's year, and on the order
  of a twentieth of what one enslaved adult cost in these decades [CONTEXTUAL]. Real property,
  real standing, a real act of civic philanthropy — and, measured against the world it sat in,
  very little money.

  **What the will does not contain is as informative as what it does.** [INFERRED] It disposes
  of "meus bens" without naming a single item: no lot, no house, no store, no credit owed to him
  — and no enslaved person. A testamento is not an inventário and is under no obligation to
  enumerate an estate, so the silence is not proof of a small one. But it was dictated months
  before Abolition, in a province where slaveholding was the ordinary form of propertied
  capital, and **no record held in this repository names an enslaved person in any Bohrer, Lemos
  or Silva-Ferreira household** — a bounded negative across the held corpus, not a claim about
  records not yet seen. Whatever this family owned, the documents we hold never show it owning
  people, which places it outside the landed stratum entirely.

  **Partible succession and a long widowhood kept the one landed moment from ever compounding.**
  [CONTEXTUAL/INFERRED] Brazilian law split an estate equally among all children, and his will
  names four — Joaquim, Laura, Guilherme and Fernando — as "meus unicos e legitimos herdeiros"
  (PRB-0005) [PROVEN]; the holding was therefore quartered from the outset. The widow's meação
  then held half of it out of the heirs' reach for as long as Rosa Eugenia lived, and she lived
  another thirty-one years, to November 1919 (PAR-0058) [PROVEN]. By the time the property could
  actually devolve, the firstborn Joaquim was himself dead — he is already "já fallecido" in
  1924 (CIV-0016) [PROVEN]. The line's single landed moment never reached the next generation as
  working capital; it arrived late, and in fractions.

  **From here the base does not grow; it converts — from heritable to contingent.** [INFERRED]
  His surviving sons moved off the land into commerce and local public life: Joaquim a
  *negociante* at the Alto da Serra (CIV-0019, CIV-0020), Guilherme the manager and proprietor
  of the town weekly *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN]. That is a move from
  wealth that can be inherited to wealth that ends with the man and the market. Literacy
  travelled the same way: he signs his own will [PROVEN], and in his sons' generation letters
  were the working tool of a merchant and a newspaperman — bought because the role demanded it,
  not transmitted as class advantage [CONTEXTUAL/INFERRED]. This is the Bohrer arc at its high
  point, and it still sits well below the office-and-marriage elite that the paternal Armond
  line of this same family started from and fell out of: two lines converging on a modest urban
  level from opposite directions.

  ## Open questions

  - "Mayer" (will) versus "Moser" (baptism and compilation) for his mother's maiden name —
  his 1832 baptism (PAR-0054) reads "Moser"; a decisive record would be Jacob Borer's
  about-1843 Nova Friburgo inventário. [OPEN]

  - The exact marriage date behind the 1879 justification. [OPEN]

  ## Sources held (this repository)

  - PRB-0005 (his own 1888 registered will — parents, wife, four children, executors,
  bequest) · PAR-0002 (1879 marriage justification at the Nova Friburgo Matriz).

  - PAR-0054 (his own 1832 Nova Friburgo baptism — born 9 July, baptised 19 August 1832;
  parents Jacob Bohrer × Catharina Moser) · PAR-0055 (his own 1888 Nova Friburgo
  death/burial — 6 July 1888, aged 56, cause mitral insufficiency and aortic dilatation).

  - CIV-0019 (grandson Alberto's 1890 Nova Friburgo birth — names him paternal
  grandfather, "já falecido").

  - PUB-0003 (Imigrantes de Nova Friburgo compilation — birth/death dates and cause,
  siblings, and the Swiss-origin lead; secondary).

  ## Regional and migration context

  His whole life sits in Nova Friburgo, the Rio de Janeiro highland town founded on the
  1819–1824 Swiss-German colony. [CONTEXTUAL] He is the settled, Brazil-born colonial
  generation of the Jacob Borer trunk — born, married and dead in the parish, resident on
  the serra lots of the Alto da Serra — and his marriage to an Itaboraí lowland bride is
  the single non-colonist thread woven into an otherwise endogamous immigrant community.

  ## Where to go today

  - **Birth, death and marriage justification (1832, 1888, 1879):** Catedral Diocesana /
  Igreja Matriz de São João Batista, Centro, Nova Friburgo, RJ (Rua Monsenhor José Antônio
  Teixeira 23, CEP 28610-390; GPS -22.28159, -42.53085) [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Marriage as celebrated (~1858 or earlier):** Igreja Matriz de São João Batista de
  Itaboraí, Centro, Itaboraí, RJ (Praça Marechal Floriano Peixoto 15, CEP 24800-165; GPS
  -22.74472, -42.85833) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.74472,-42.85833)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele deixou um testamento registrado formal (PRB-0005, 1888) que incluía um legado de caridade de 50 mil réis para a construção da Capella de Santo Antonio no Suspiro, em Nova Friburgo — um ato modesto mas real de filantropia cívica que o marca como um chefe de família colono proprietário e vinculado à igreja.

  - **[PROVEN]** Seu próprio registro de batismo de 1832 (PAR-0054) fixa seu nascimento em 9 de julho de 1832 — corrigindo o "4 de julho" da compilação Imigrantes de Nova Friburgo por cinco dias, ilustrando como um batismo paroquial primário silenciosamente corrige uma compilação genealógica secundária.

  - **[CONTEXTUAL]** Ele nasceu na colônia de Nova Friburgo apenas 13 anos após sua fundação — velho o suficiente para ouvir as histórias dos primeiros colonos em primeira mão, e jovem o suficiente para crescer na segunda geração que se assimilou plenamente à cultura católica brasileira e à língua portuguesa.

  - **[PROVEN]** Sua morte em 1888 por "insuficiência mitral e dilatação aórtica" aos 56 anos (PAR-0055) antecedeu a abolição da escravidão por alguns meses, de modo que nunca viveu num Brasil de trabalho livre. Seu filho Joaquim (P-0030) e a geração seguinte enfrentaram essa transição.

  - **[INFERRED]** Seu casamento com Rosa Eugenia de Lemos (P-0035), de Itaboraí — celebrado perante o coadjutor de Itaboraí e só justificado em Nova Friburgo décadas depois — é o único fio não colono deste ramo, e exigiu navegar pelo sistema eclesiástico: a comunidade colona era fechada o suficiente para que casar fora dela não fosse simples.

  - **[CONTEXTUAL]** Seu testamento (PRB-0005) é o documento que sustenta toda a linhagem Jacob Borer: o único registro primário que nomeia Jacob Bahrer como pai de Francisco, e a única fonte primária que conta Joaquim entre os herdeiros de Francisco — um único ato testamentário de 1888 que responde a questões que nenhum censo ou registro vital havia respondido.

  ## Identidade

  **Francisco José Bohrer** — grafado *Borer* na compilação dos colonos de Nova Friburgo
  (PUB-0003) e *Bohrer* em seu próprio testamento e nos registros civis de seus
  descendentes; a variação *Borer → Bohrer* passa por ele. [PROVEN]

  - **Nascimento:** 9 de julho de 1832 na comarca de Nova Friburgo; batizado em 19 de agosto
  de 1832 em São João Baptista [PROVEN — PAR-0054]. Seu próprio testamento de 1888 declara,
  de forma independente, que era "natural deste termo" (PRB-0005). [PROVEN] A compilação
  Imigrantes de Nova Friburgo dá 4 de julho de 1832 (PUB-0003) — uma discrepância de cinco
  dias que o batismo em mãos corrige. [LEAD, secundário]

  - **Pais:** Jacob Bahrer e Catharina Moser (P-0050, P-0051; família F-0024), ambos já
  falecidos em 1888, nomeados em seu próprio testamento (PRB-0005). [PROVEN] A mesma
  compilação os identifica como o casal de colonos suíços Jacob Borer (n. 1801, Erschwil,
  Soleure) e Catharina Moser (PUB-0003) [LEAD] — a origem suíça e o sobrenome de solteira
  "Moser" NÃO são afirmados a partir do testamento, que lê "Mayer".

  - **Casamento:** Rosa Eugenia de Lemos (P-0035). O casamento foi celebrado antes em
  Itaboraí, perante o coadjutor Rufino José Alves e na casa do pai de José Antunes de
  Lemos, e só foi judicialmente justificado e registrado na Matriz de Nova Friburgo em
  1º de agosto de 1879 (PAR-0002). [PROVEN, é anterior a 1879] Uma cláusula incerta de
  "mais de vinte anos" nesse ato recuaria o casamento para cerca de 1858. [LEAD]

  - **Filhos:** Joaquim José Bohrer (P-0030, o primogênito), Laura, Guilherme (Samuel) e
  Fernando — os quatro herdeiros nomeados em seu testamento (PRB-0005) [PROVEN] — além de
  Ludovina Borer (n. 21 de julho de 1862, f. ainda criança em 27 de dezembro de 1862),
  conforme PUB-0003 [LEAD]. Joaquim está ausente da lista de filhos da compilação; o
  testamento é a fonte autoritativa que o nomeia primogênito.

  - **Óbito:** 6 de julho de 1888 no Alto da Serra, Nova Friburgo, aos 56 anos, de
  insuficiência mitral e dilatação aórtica [PROVEN — PAR-0055] — seu próprio ato paroquial de
  óbito/sepultamento. Já estava "já falecido" quando o registro de nascimento de 1890 de seu
  neto Alberto o nomeia (CIV-0019) [PROVEN], e a data concorda com o testamento registrado em
  1888 e com a compilação (PUB-0003).

  ## Posição social e profissão

  - **Testador com bens** [PROVEN] — deixou um testamento registrado formal, com
  testamenteiros nomeados e um legado de caridade, marca de um homem com patrimônio a
  dispor (PRB-0005).

  - **Legado de caridade** [PROVEN] — 50 mil réis para as obras da Capella de Santo
  Antonio a ser edificada no Suspiro, na vila (PRB-0005).

  - **Testamenteiros nomeados no testamento** [PROVEN] — primeiro sua esposa Rosa Eugenia
  de Lemos, depois seu cunhado Candido Pereira de Lemos (irmão de Rosa) e por fim seu
  amigo Samuel Antonio dos Santos (PRB-0005). A escolha de um cunhado Lemos o situa dentro
  da rede Lemos-Itaboraí de sua esposa.

  - **Letrado** [PROVEN] — seu testamento de 1888 encerra com "…que pedi a João José
  Kramith que por mim escrevesse conforme lhe ditei, e no qual me assigno por estar
  conforme" (PRB-0005): a redação foi delegada ao escrivão (praxe de um testamento
  notarial), mas o próprio testador assina o instrumento — não uma fórmula *a rogo* / de
  analfabetismo. O letramento é coerente com sua condição de colono proprietário.

  - **Residente no Alto da Serra** da Freguesia de São João Baptista, Nova Friburgo
  [PROVEN] — o mesmo bairro que seu filho Joaquim e seu neto Alberto ocupam no registro de
  1890 (CIV-0019; PUB-0003).

  ## Família e rede social

  Filho nascido no Brasil da geração imigrante, manteve-se dentro da endogamia da colônia
  acima e ao redor de si. Seus irmãos, conforme PUB-0003 [LEAD], foram Catharina (n. 1830,
  casada com Frederico Chaboudez), Maria (n. 1834, casada com Francisco Xavier Chaboudez),
  Augusto (n. 1837) e João José (n. 1840, f. 1859, solteiro) — o duplo casamento Chaboudez
  de duas irmãs Borer com dois irmãos Chaboudez é uma aliança de grupo de irmãos. Casou-se
  para fora: Rosa Eugenia de Lemos veio de Itaboraí (RJ), o único fio não colono a se casar
  com a fechada colônia suíça de Nova Friburgo.

  - Um retrato de estúdio do casal (cerca de 1875) sobrevive nos materiais de recuperação
  [LEAD] — apenas uma imagem, não um registro catalogado.

  ## O que podemos extrapolar

  Seu testamento é o documento que sustenta toda a linhagem Jacob-Borer. [INFERRED] É o único
  registro primário disponível que liga a geração colonial nascida no Brasil aos pais imigrantes
  nomeados e a única fonte primária que inclui Joaquim entre os filhos. Sem ele, tanto o elo
  para cima quanto esta descendência passam a depender apenas de fontes secundárias — daí o peso
  dos conflitos "Mayer vs Moser" e da data do casamento.

  **Como a posição foi adquirida: construída sobre um lote concedido — não herdada, não obtida
  por casamento, não sustentada por cargo.** [INFERRED] Seus pais foram imigrantes do esquema de
  Nova Friburgo de 1819–20; portanto, o que ele possuía ao morrer possuía porque a Coroa havia
  assentado seu pai num lote da colônia e a família o trabalhou e dele comerciou. Ele não se
  casou com propriedade: sua mulher Rosa Eugenia de Lemos vinha de uma família de Itaboraí cujos
  registros disponíveis (PAR-0016, PAR-0030–PAR-0033) não nomeiam terra, ofício ou título. E ele
  não exerceu cargo algum — nenhuma patente, delegacia ou posto de milícia aparece para ele em
  todo o corpus disponível. Resta uma única categoria: **feito por si mesmo sobre terra
  concedida**, a única forma de riqueza herdável que esta família chegou a tocar. (Os materiais
  de recuperação também situam "Francisco José Borer" e sua mulher no registro de terras de Nova
  Friburgo de 1854–55 — item não catalogado que aponta no mesmo sentido. [LEAD])

  **Medido contra a economia à sua volta, o ápice é pequeno.** [CONTEXTUAL/INFERRED] O pacote
  colonial prometido a seus pais era deliberadamente mínimo: um lote e uma casa, um subsídio
  diário de 160 réis no primeiro ano caindo a 80 réis depois, além de rações, sementes e gado,
  por um período de estabelecimento de dois anos (Decreto de 16 de maio de 1818) — cerca de
  58$000 por ano, algo como um sétimo dos ~420$000 de um trabalhador rural livre [CONTEXTUAL].
  Duas gerações depois, a única cifra que o próprio espólio dele põe no papel são os **50$000
  que legou às obras da Capela de Santo Antonio** (PRB-0005) [PROVEN] — cerca de um oitavo do
  ano desse mesmo trabalhador e da ordem de um vigésimo do que custava uma pessoa escravizada
  adulta nessas décadas [CONTEXTUAL]. Propriedade real, posição real, um ato real de filantropia
  cívica — e, medido contra o mundo em que se inseria, muito pouco dinheiro.

  **O que o testamento não contém informa tanto quanto o que contém.** [INFERRED] Ele dispõe de
  "meus bens" sem nomear um único item: nenhum lote, nenhuma casa, nenhuma venda, nenhum crédito
  a receber — e nenhuma pessoa escravizada. Um testamento não é um inventário e não tem
  obrigação de arrolar o espólio, de modo que o silêncio não prova que ele fosse pequeno. Mas
  foi ditado poucos meses antes da Abolição, numa província em que a escravização era a forma
  corrente de capital entre proprietários, e **nenhum registro disponível neste repositório
  nomeia uma pessoa escravizada em qualquer domicílio Bohrer, Lemos ou Silva-Ferreira** — uma
  negativa delimitada ao corpus disponível, não uma afirmação sobre registros ainda não vistos.
  Seja o que for que esta família possuísse, os documentos que temos nunca a mostram possuindo
  pessoas, o que a situa inteiramente fora do estrato fundiário.

  **A sucessão partível e uma longa viuvez impediram que o único momento fundiário se
  compusesse.** [CONTEXTUAL/INFERRED] A lei brasileira dividia o espólio igualmente entre todos
  os filhos, e o testamento nomeia quatro — Joaquim, Laura, Guilherme e Fernando — como "meus
  unicos e legitimos herdeiros" (PRB-0005) [PROVEN]; o patrimônio foi, portanto, dividido em
  quatro desde o início. A meação da viúva manteve depois metade dele fora do alcance dos
  herdeiros enquanto Rosa Eugenia vivesse, e ela viveu mais trinta e um anos, até novembro de
  1919 (PAR-0058) [PROVEN]. Quando a propriedade pôde de fato ser transmitida, o primogênito
  Joaquim já estava morto — em 1924 consta "já fallecido" (CIV-0016) [PROVEN]. O único momento
  fundiário da linha nunca chegou à geração seguinte como capital de giro; chegou tarde e em
  frações.

  **Daqui em diante a base não cresce; ela se converte — de herdável em contingente.**
  [INFERRED] Seus filhos sobreviventes saíram da terra para o comércio e a vida pública local:
  Joaquim, *negociante* no Alto da Serra (CIV-0019, CIV-0020); Guilherme, gerente e proprietário
  do semanário *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN]. É uma passagem de riqueza
  que se herda para riqueza que termina com o homem e com o mercado. O letramento seguiu o mesmo
  caminho: ele assina o próprio testamento [PROVEN] e, na geração dos filhos, as letras eram o
  instrumento de trabalho de um comerciante e de um jornalista — compradas porque o papel as
  exigia, não transmitidas como vantagem de classe [CONTEXTUAL/INFERRED]. Este é o arco Bohrer
  em seu ponto mais alto, e ainda assim situa-se bem abaixo da elite de cargos e casamentos de
  que a linha paterna Armond desta mesma família partiu e de que caiu: duas linhas convergindo
  para um mesmo nível urbano modesto por direções opostas.

  ## Questões em aberto

  - "Mayer" (testamento) versus "Moser" (batismo e compilação) para o sobrenome de solteira
  de sua mãe — seu batismo de 1832 (PAR-0054) lê "Moser"; o registro decisivo seria o
  inventário de Jacob Borer, por volta de 1843, em Nova Friburgo. [OPEN]

  - A data exata do casamento por trás da justificação de 1879. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0005 (seu próprio testamento registrado de 1888 — pais, esposa, quatro filhos,
  testamenteiros, legado) · PAR-0002 (justificação de casamento de 1879 na Matriz de Nova
  Friburgo).

  - PAR-0054 (seu próprio batismo de 1832 em Nova Friburgo — nascido em 9 de julho, batizado
  em 19 de agosto de 1832; pais Jacob Bohrer × Catharina Moser) · PAR-0055 (seu próprio
  óbito/sepultamento de 1888 em Nova Friburgo — 6 de julho de 1888, aos 56 anos, causa
  insuficiência mitral e dilatação aórtica).

  - CIV-0019 (nascimento de 1890 do neto Alberto, em Nova Friburgo — nomeia-o avô paterno,
  "já falecido").

  - PUB-0003 (compilação Imigrantes de Nova Friburgo — datas e causa do óbito, irmãos, e a
  pista da origem suíça; secundária).

  ## Contexto regional e migratório

  Toda a sua vida situa-se em Nova Friburgo, a cidade serrana do Rio de Janeiro fundada
  sobre a colônia suíço-alemã de 1819–1824. [CONTEXTUAL] Ele é a geração colonial
  estabelecida e nascida no Brasil do tronco Jacob Borer — nascido, casado e falecido na
  freguesia, residente nos lotes serranos do Alto da Serra — e seu casamento com uma noiva
  das terras baixas de Itaboraí é o único fio não colono entretecido numa comunidade
  imigrante de resto endogâmica.

