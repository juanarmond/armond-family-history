profile: >-
  ## Interesting facts

  - **[PROVEN]** His 1847 marriage act does something unusual for this group: it gives his
  father a title. Conrad is "ehel[icher] leibl[icher] Sohn von dem **Kirchenvorsteher** Heinrich
  Schenkel" — the legitimate son of a Lutheran church warden. Among the twenty-odd colonist
  ancestors in this cluster, Heinrich Schenkel is the only one a record credits with holding an
  office of any kind. (PAR-0067)

  - **[PROVEN]** The same act was written, witnessed and signed entirely in German, by a
  German-speaking pastor, in a Brazilian colony founded for Swiss Catholics twenty-nine years
  earlier. The Lutheran congregation was still running its institutional life in its own
  language in 1847.

  - **[PROVEN]** He married across an internal colony line without leaving his congregation: his
  bride's father is expressly "dem **Schweizer** Colonisten Joseph [St]offel", a Swiss colonist,
  while the Schenkels came with the German intake. Swiss and German settlers shared the Lutheran
  church, and this marriage is what that sharing looked like in practice. (PAR-0067)

  - **[PROVEN]** Twenty-five years later, at his daughter's 1872 marriage, he is named without
  the "verstorbenen" that marks her mother — so he outlived his wife and was still living in
  April 1872. (PAR-0068)

  - **[PROVEN]** The register writes his name simply as **Conrad**. The fuller "Georg Conrad"
  found in secondary compilations is not in the record and is not adopted here.

  ## Identity

  **Conrad Schenkel** — a Lutheran of the Nova Friburgo German colony, husband of Maria Luiza
  Stoffel and father of Maria Luiza Schenkel (P-0104). Iris Bohrer Muniz's (P-0007)
  great-great-grandfather, by the chain Maria Luiza Schenkel → Carolina Klein (P-0029) → João
  Gonçalves Bohrer (P-0014). [PROVEN; degree derived from the family links]

  - **Marriage:** to Louisa — i.e. Maria Luiza — Stoffel (P-0108) on 3 February 1847 at the Nova
  Friburgo Lutheran church; witnesses Gustav Lenenroth and Paul Lenenroth, both described as
  *Handelsmann* (merchant), the act signed by Pastor Gustav Lenenroth. (PAR-0067, event E-0091)
  [PROVEN; note that the pastor and the first witness are recorded under the same name, which
  the transcription does not resolve]

  - **Father:** Heinrich Schenkel (P-0113), *Kirchenvorsteher* of the Lutheran congregation;
  family F-0056. The descriptor was earlier hedged as "[Bürger?]" and resolved on a maximum-zoom
  re-read of the register image in September 2026 — the word is a long compound ending
  unmistakably in "-vorsteher". [PROVEN]

  - **Named again** as the father of Maria Luiza Schenkel in her 1872 Lutheran marriage to Jacob
  Klein, and there recorded as still living. [PROVEN — PAR-0068]

  - **Birth, death, nationality:** not documented by any held record; nationality is left unset
  for that reason. [OPEN by decision]

  - **Reported birth [LEAD]:** 1824, at the Armação das Baleias landing on the Rio de Janeiro
  coast, during the *Argus* voyage, before the German colonists travelled inland; his father's
  colony grant is given as House 59 / Lot 53. Raibert Schenkel ship transcription; no held
  primary.

  ## Standing and profession

  His own standing is undocumented — no occupation, property, literacy or signature appears for
  him in any held source. What the record gives is his father's office, and that is worth
  separating carefully: a *Kirchenvorsteher* is a lay church warden, elected or appointed to
  administer a congregation's finances, property and community affairs. It is a position of
  local trust and no income. It belonged to Heinrich, not to Conrad, and it was not heritable.

  ## Family and social network

  The 1847 marriage is the one social scene the records give him, and it is informative: the
  witnesses were two merchants of the same surname as the officiating pastor, which places the
  wedding inside the congregation's small commercial and clerical circle rather than among
  farming neighbours. [PROVEN — PAR-0067]

  His household produced Maria Luiza Schenkel (P-0104), born about 1851, who married Jacob Klein
  in 1872 and carried both the Schenkel and the Stoffel names into the Klein and then the Bohrer
  lines. His wife died before that wedding; he did not. [PROVEN — PAR-0068]

  ## What we can extrapolate

  - **[CONTEXTUAL]** The Schenkels belong to the 1824 German second wave. After independence the
  Brazilian government's agent Georg Anton Schäffer recruited in the German states, and some
  eighty families reached Nova Friburgo on 3–4 May 1824, taking the same kind of poor serra
  grant the Swiss had taken five years earlier and founding the Igreja Luterana that kept their
  records.

  - **[INFERRED]** If the 1824 Armação das Baleias birth is his, he is the family's first
  Brazilian-born generation, born at the point of landing — a biography that starts at the exact
  moment of the migration and inherits its consequences rather than choosing them. It remains a
  lead.

  - **[CONTEXTUAL / INFERRED]** A church wardenship is exactly the kind of standing that does
  not transmit. It carried respect and no wage, ended with the man who held it, and left no
  capital behind; the next Schenkel generation married within the same congregation and the one
  after that was baptising children in a rural district. The family's position stayed level,
  which in a colony of undersized lots divided equally among all heirs was the likeliest outcome
  available.

  ## Open questions

  - His birth, death and nationality — all unreached. The Nova Friburgo Lutheran register is the
  obvious place for a birth or death entry. [OPEN]

  - Whether the *Argus* / Armação das Baleias birth and the House 59 / Lot 53 grant belong to
  this family at primary level. [LEAD]

  - The apparent duplication of the name Gustav Lenenroth as both witness and officiating pastor
  in the 1847 act — a transcription question that a re-read of the image would answer. [OPEN]

  ## Sources held (this repository)

  - **PAR-0067** — his own 1847 Lutheran marriage to Louisa (Maria Luiza) Stoffel at Nova
  Friburgo; names him, his father Heinrich Schenkel with the title *Kirchenvorsteher*, his
  bride's father the Swiss colonist Joseph Stoffel, and the two Lenenroth witnesses.

  - **PAR-0068** — his daughter Maria Luiza's 1872 Lutheran marriage to Jacob Klein; names him
  as her father and, by omitting a death qualifier, indicates he was then still living.

  ## Regional and migration context

  Nova Friburgo was created by Dom João VI's decree of 16 May 1818 to settle 100 Swiss Catholic
  families at the Fazenda do Morro Queimado, and the recruitment that followed overshot to some
  261–265 families from Fribourg, Solothurn, Valais and Bern. [CONTEXTUAL] The German wave of
  1824 was a separate scheme with the same logic and the same disappointing land, and it added a
  Protestant congregation to a Catholic town. [CONTEXTUAL] Conrad Schenkel lived his documented
  life inside that Protestant half — married in its church in 1847, still named in its register
  in 1872 — while the Swiss Catholic parish a few streets away recorded the family his
  granddaughter would eventually marry into. [PROVEN]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation, where he married on 3 February 1847
  and where his father served as warden. [RESOLVED]

  - **Armação das Baleias, Rio de Janeiro coast — unlocated.** The reported 1824 birthplace, a
  former royal whale-processing station where the *Argus* colonists came ashore. Candidate sites
  include Ponta da Armação in Niterói and Armação dos Búzios, but the birth is not pinned to
  either and no honest point can be given. [UNLOCATED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). Where the colony's
  house and lot numbers were laid out, including the reported House 59 / Lot 53 of his father's
  grant. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu assento de casamento de 1847 faz algo incomum neste grupo: dá um título ao
  pai. Conrad é "ehel[icher] leibl[icher] Sohn von dem **Kirchenvorsteher** Heinrich Schenkel" —
  filho legítimo de um presbítero luterano. Entre os cerca de vinte ancestrais colonos deste
  conjunto, Heinrich Schenkel é o único a quem um documento atribui algum cargo. (PAR-0067)

  - **[PROVEN]** O mesmo assento foi escrito, testemunhado e assinado inteiramente em alemão,
  por um pastor germanófono, numa colônia brasileira fundada vinte e nove anos antes para
  católicos suíços. Em 1847 a congregação luterana ainda conduzia sua vida institucional na
  própria língua.

  - **[PROVEN]** Ele casou-se cruzando uma linha interna da colônia sem sair de sua congregação:
  o pai da noiva é expressamente "dem **Schweizer** Colonisten Joseph [St]offel", um colono
  suíço, enquanto os Schenkel vieram na entrada alemã. Suíços e alemães partilhavam a igreja
  luterana, e este casamento é o que essa partilha significava na prática. (PAR-0067)

  - **[PROVEN]** Vinte e cinco anos depois, no casamento da filha em 1872, ele é nomeado sem o
  "verstorbenen" que marca a mãe dela — portanto sobreviveu à esposa e ainda vivia em abril de
  1872. (PAR-0068)

  - **[PROVEN]** O registro grafa seu nome simplesmente como **Conrad**. A forma mais longa
  "Georg Conrad", encontrada em compilações secundárias, não consta do documento e não é adotada
  aqui.

  ## Identidade

  **Conrad Schenkel** — luterano da colônia alemã de Nova Friburgo, marido de Maria Luiza
  Stoffel e pai de Maria Luiza Schenkel (P-0104). Trisavô de Iris Bohrer Muniz (P-0007), pela
  cadeia Maria Luiza Schenkel → Carolina Klein (P-0029) → João Gonçalves Bohrer (P-0014).
  [PROVEN; grau derivado dos vínculos familiares]

  - **Casamento:** com Louisa — ou seja, Maria Luiza — Stoffel (P-0108) em 3 de fevereiro de
  1847, na igreja luterana de Nova Friburgo; testemunhas Gustav Lenenroth e Paul Lenenroth,
  ambos descritos como *Handelsmann* (comerciante), com o assento assinado pelo pastor Gustav
  Lenenroth. (PAR-0067, evento E-0091) [PROVEN; registre-se que o pastor e a primeira testemunha
  constam sob o mesmo nome, o que a transcrição não resolve]

  - **Pai:** Heinrich Schenkel (P-0113), *Kirchenvorsteher* da congregação luterana; família
  F-0056. O descritor fora antes hesitado como "[Bürger?]" e foi resolvido numa releitura em
  zoom máximo da imagem do registro, em setembro de 2026 — a palavra é um composto longo que
  termina inequivocamente em "-vorsteher". [PROVEN]

  - **Nomeado novamente** como pai de Maria Luiza Schenkel em seu casamento luterano de 1872 com
  Jacob Klein, e ali registrado como ainda vivo. [PROVEN — PAR-0068]

  - **Nascimento, óbito e nacionalidade:** não documentados em nenhum registro retido; por isso
  a nacionalidade é deixada em aberto. [OPEN por decisão]

  - **Nascimento relatado [LEAD]:** 1824, no desembarque da Armação das Baleias, na costa
  fluminense, durante a travessia do *Argus*, antes de os colonos alemães seguirem para o
  interior; a concessão colonial do pai é dada como Casa 59 / Lote 53. Transcrição Raibert
  Schenkel; nenhuma fonte primária retida.

  ## Posição social e profissão

  Sua própria posição não está documentada — não aparecem para ele ocupação, propriedade,
  alfabetização ou assinatura em qualquer fonte retida. O que o registro oferece é o cargo do
  pai, e isso deve ser separado com cuidado: um *Kirchenvorsteher* é um presbítero leigo, eleito
  ou nomeado para administrar finanças, patrimônio e assuntos comunitários da congregação. É
  posição de confiança local e de renda nenhuma. Pertencia a Heinrich, não a Conrad, e não era
  hereditária.

  ## Família e rede social

  O casamento de 1847 é a única cena social que os documentos lhe dão, e é informativa: as
  testemunhas foram dois comerciantes com o mesmo sobrenome do pastor celebrante, o que situa a
  cerimônia no pequeno círculo comercial e clerical da congregação, e não entre vizinhos
  lavradores. [PROVEN — PAR-0067]

  Seu domicílio gerou Maria Luiza Schenkel (P-0104), nascida por volta de 1851, que se casou com
  Jacob Klein em 1872 e levou os nomes Schenkel e Stoffel para as linhas Klein e, depois,
  Bohrer. A esposa morreu antes desse casamento; ele, não. [PROVEN — PAR-0068]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Os Schenkel pertencem à segunda leva alemã de 1824. Depois da
  independência, o agente do governo brasileiro Georg Anton Schäffer recrutou nos estados
  alemães, e cerca de oitenta famílias chegaram a Nova Friburgo em 3–4 de maio de 1824,
  recebendo o mesmo tipo de concessão serrana pobre que os suíços haviam recebido cinco anos
  antes e fundando a Igreja Luterana que guardou seus registros.

  - **[INFERRED]** Se o nascimento de 1824 na Armação das Baleias for o dele, ele é a primeira
  geração da família nascida no Brasil, nascida no ponto de desembarque — uma biografia que
  começa no exato instante da migração e herda suas consequências em vez de escolhê-las.
  Permanece pista.

  - **[CONTEXTUAL / INFERRED]** Um presbiterato é exatamente o tipo de posição que não se
  transmite. Trazia respeito e nenhum salário, terminava com o homem que a exercia e não deixava
  capital; a geração Schenkel seguinte casou-se dentro da mesma congregação, e a subsequente
  batizava filhos num distrito rural. A posição da família manteve-se no mesmo plano — o que,
  numa colônia de lotes exíguos divididos igualmente entre todos os herdeiros, era o desfecho
  mais provável disponível.

  ## Questões em aberto

  - Seu nascimento, seu óbito e sua nacionalidade — tudo não alcançado. O livro luterano de Nova
  Friburgo é o lugar óbvio para um assento de nascimento ou óbito. [OPEN]

  - Se o nascimento no *Argus* / Armação das Baleias e a concessão Casa 59 / Lote 53 pertencem a
  esta família em nível primário. [LEAD]

  - A aparente duplicação do nome Gustav Lenenroth como testemunha e como pastor celebrante no
  assento de 1847 — questão de transcrição que uma releitura da imagem resolveria. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0067** — seu próprio casamento luterano de 1847 com Louisa (Maria Luiza) Stoffel, em
  Nova Friburgo; nomeia-o, nomeia seu pai Heinrich Schenkel com o título *Kirchenvorsteher*, o
  pai da noiva, o colono suíço Joseph Stoffel, e as duas testemunhas Lenenroth.

  - **PAR-0068** — casamento luterano de 1872 da filha Maria Luiza com Jacob Klein; nomeia-o
  como pai dela e, ao omitir qualificador de falecimento, indica que então ainda vivia.

  ## Contexto regional e migratório

  Nova Friburgo foi criada pelo decreto de Dom João VI de 16 de maio de 1818 para assentar 100
  famílias católicas suíças na Fazenda do Morro Queimado, e o recrutamento que se seguiu
  excedeu-se para cerca de 261–265 famílias, de Friburgo, Solothurn, Valais e Berna.
  [CONTEXTUAL] A leva alemã de 1824 foi um programa distinto, com a mesma lógica e a mesma terra
  decepcionante, e acrescentou uma congregação protestante a uma vila católica. [CONTEXTUAL]
  Conrad Schenkel viveu sua vida documentada dentro dessa metade protestante — casado em sua
  igreja em 1847, ainda nomeado em seu livro em 1872 —, enquanto a paróquia católica suíça, a
  poucas ruas dali, registrava a família com a qual sua neta acabaria por se casar. [PROVEN]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, onde ele se casou em 3 de fevereiro de
  1847 e onde o pai serviu como presbítero. [RESOLVED]

  - **Armação das Baleias, costa fluminense — não localizada.** O local de nascimento relatado
  para 1824, antiga armação real de baleias onde os colonos do *Argus* desembarcaram. Entre os
  candidatos estão a Ponta da Armação, em Niterói, e Armação dos Búzios, mas o nascimento não
  está fixado em nenhum deles e nenhum ponto honesto pode ser indicado. [UNLOCATED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). Onde foram
  demarcados os números de casa e lote da colônia, entre eles a relatada Casa 59 / Lote 53 da
  concessão do pai. [APPROX]
