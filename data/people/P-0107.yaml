profile: >-
  ## Interesting facts

  - **[PROVEN]** His father Heinrich Schenkel held the title of *Kirchenvorsteher* — Lutheran church warden or elder — at the time of Conrad's 1847 marriage, making the Schenkel family holders of a formal leadership role in the Nova Friburgo Lutheran congregation. (PAR-0067)

  - **[CONTEXTUAL]** A *Kirchenvorsteher* in a 19th-century German Lutheran parish was a lay administrator elected or appointed to manage church finances and community affairs — a position reflecting the family's established, respected standing in the colony's Protestant community.

  - **[CONTEXTUAL]** The 1847 Lutheran marriage register at Nova Friburgo was conducted in German, reflecting the congregation's maintenance of language and institutional life within a Portuguese-speaking Catholic colonial environment — a remarkable persistence of European identity into the third decade of settlement.

  - **[INFERRED]** Conrad was likely born in Nova Friburgo or arrived there as a young child in the 1820s–1830s — his 1847 marriage places him as a contemporary of Johannes Klein (also a colonist in 1844), representing the second generation of German Protestant settlers in the colony.

  ## Identity

  **Conrad Schenkel** — a Lutheran colonist at Nova Friburgo, groom in the 1847 Lutheran
  marriage that links the Schenkel and Stoffel families. [PROVEN]

  - **Role:** father of Maria Luiza Schenkel (P-0104) and husband of Maria Luiza Stoffel
  (P-0108; family F-0053); son of Heinrich Schenkel (P-0113; family F-0056). Iris Bohrer
  Muniz's great-great-grandfather on the Schenkel line. [PROVEN]

  - **Marriage:** married Louisa (Maria Luiza) Stoffel (P-0108) on 3 February 1847 at the
  Nova Friburgo Lutheran church (PAR-0067, event E-0091), recorded as "Conrad Schenkel,
  ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — Heinrich (P-0113)
  is titled *Kirchenvorsteher* (Lutheran church warden/elder), a reading resolved on a max-zoom
  re-read of the register (2026-09-11), superseding the earlier "[Bürger?]" hedge. The
  register writes only "Conrad", not "Georg Conrad". [PROVEN]

  - **Named as Maria Luiza Schenkel's father** in her 1872 Lutheran marriage to Jacob Klein
  (PAR-0068). [PROVEN]

  ## Open questions

  - His birth date, nationality, and death record are not yet located. [OPEN]

  ## Sources held (this repository)

  - PAR-0067 (his 1847 Lutheran marriage to Maria Luiza Stoffel — names him and his father
  Heinrich Schenkel).

  - PAR-0068 (his daughter's 1872 Lutheran marriage — corroborates him as father).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu pai Heinrich Schenkel ostentava o título de *Kirchenvorsteher* — presbítero ou administrador leigo da igreja luterana — quando do casamento de Conrad em 1847, tornando a família Schenkel detentora de um cargo formal de liderança na congregação luterana de Nova Friburgo. (PAR-0067)

  - **[CONTEXTUAL]** Um *Kirchenvorsteher* numa paróquia luterana alemã do século XIX era um administrador leigo eleito ou nomeado para gerir as finanças e os assuntos comunitários da igreja — um cargo que reflete a posição estabelecida e respeitada da família na comunidade protestante da colônia.

  - **[CONTEXTUAL]** O registro do casamento luterano de 1847 em Nova Friburgo foi lavrado em alemão, refletindo a manutenção da língua e da vida institucional da congregação num ambiente colonial de língua portuguesa e predominantemente católico — uma notável persistência da identidade europeia três décadas após a fundação da colônia.

  - **[INFERRED]** Conrad provavelmente nasceu em Nova Friburgo ou chegou lá ainda criança nas décadas de 1820–1830 — seu casamento em 1847 o coloca como contemporâneo de Johannes Klein (também colono em 1844), representando a segunda geração de colonos protestantes alemães na colônia.

  ## Identidade

  **Conrad Schenkel** — colono luterano em Nova Friburgo, noivo no casamento luterano de 1847
  que une as famílias Schenkel e Stoffel. [PROVEN]

  - **Papel:** pai de Maria Luiza Schenkel (P-0104) e marido de Maria Luiza Stoffel (P-0108;
  família F-0053); filho de Heinrich Schenkel (P-0113; família F-0056). Trisavô de Iris Bohrer
  Muniz na linha Schenkel. [PROVEN]

  - **Casamento:** casou-se com Louisa (Maria Luiza) Stoffel (P-0108) em 3 de fevereiro de 1847
  na igreja luterana de Nova Friburgo (PAR-0067, evento E-0091), registrado como "Conrad
  Schenkel, ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — Heinrich
  (P-0113) é titulado *Kirchenvorsteher* (presbítero/administrador da igreja luterana), leitura
  resolvida numa releitura em zoom máximo do registro (2026-09-11), superando a hesitação anterior
  "[Bürger?]". O registro escreve apenas "Conrad", não "Georg Conrad". [PROVEN]

  - **Nomeado como pai de Maria Luiza Schenkel** em seu casamento luterano de 1872 com Jacob
  Klein (PAR-0068). [PROVEN]

  ## Questões em aberto

  - Sua data de nascimento, nacionalidade e registro de óbito ainda não foram localizados.
  [OPEN]

