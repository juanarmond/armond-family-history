profile: >-
  ## Identity

  **Conrad Schenkel** — a Lutheran colonist at Nova Friburgo, groom in the 1847 Lutheran
  marriage that links the Schenkel and Stoffel families. [PROVEN]

  - **Role:** father of Maria Luiza Schenkel (P-0104) and husband of Maria Luiza Stoffel
  (P-0108; family F-0053); son of Heinrich Schenkel (P-0113; family F-0056). Iris Bohrer
  Muniz's great-great-grandfather on the Schenkel line. [PROVEN]

  - **Marriage:** married Louisa (Maria Luiza) Stoffel (P-0108) on 3 February 1847 at the
  Nova Friburgo Lutheran church (PAR-0067, event E-0091), recorded as "Conrad Schenkel,
  ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — Heinrich (P-0113)
  is titled *Kirchenvorsteher* (Lutheran church warden/elder), a reading resolved on a max-zoom
  re-read of the register (2026-09-11), superseding the earlier "[Bürger?]" hedge. The
  register writes only "Conrad", not "Georg Conrad". [PROVEN]

  - **Named as Maria Luiza Schenkel's father** in her 1872 Lutheran marriage to Jacob Klein
  (PAR-0068). [PROVEN]

  ## Open questions

  - His birth date, nationality, and death record are not yet located. [OPEN]

  ## Sources held (this repository)

  - PAR-0067 (his 1847 Lutheran marriage to Maria Luiza Stoffel — names him and his father
  Heinrich Schenkel).

  - PAR-0068 (his daughter's 1872 Lutheran marriage — corroborates him as father).
profile_pt: >-
  ## Identidade

  **Conrad Schenkel** — colono luterano em Nova Friburgo, noivo no casamento luterano de 1847
  que une as famílias Schenkel e Stoffel. [PROVEN]

  - **Papel:** pai de Maria Luiza Schenkel (P-0104) e marido de Maria Luiza Stoffel (P-0108;
  família F-0053); filho de Heinrich Schenkel (P-0113; família F-0056). Trisavô de Iris Bohrer
  Muniz na linha Schenkel. [PROVEN]

  - **Casamento:** casou-se com Louisa (Maria Luiza) Stoffel (P-0108) em 3 de fevereiro de 1847
  na igreja luterana de Nova Friburgo (PAR-0067, evento E-0091), registrado como "Conrad
  Schenkel, ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — Heinrich
  (P-0113) é titulado *Kirchenvorsteher* (presbítero/administrador da igreja luterana), leitura
  resolvida numa releitura em zoom máximo do registro (2026-09-11), superando a hesitação anterior
  "[Bürger?]". O registro escreve apenas "Conrad", não "Georg Conrad". [PROVEN]

  - **Nomeado como pai de Maria Luiza Schenkel** em seu casamento luterano de 1872 com Jacob
  Klein (PAR-0068). [PROVEN]

  ## Questões em aberto

  - Sua data de nascimento, nacionalidade e registro de óbito ainda não foram localizados.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0067 (seu casamento luterano de 1847 com Maria Luiza Stoffel — nomeia-o e a seu
  pai Heinrich Schenkel).

  - PAR-0068 (casamento luterano de 1872 de sua filha — corrobora-o como pai).
