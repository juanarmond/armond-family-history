profile: >-
  ## Interesting facts

  - **[PROVEN]** She kept her maiden name in life and only acquires her husband's at death. She is "Rita Ignacia de Jesus" in her daughter's 1866 baptism, in her granddaughter Anna's 1885 baptism as godmother, and still "Dona Rita Ignacia de Jesus" in her granddaughter Ritta's 1890 civil birth entry — twenty-four years and two generations on (PAR-0005, PAR-0006, CIV-0041). Only the 1898 death act calls her "Rita do Rego Brandão" (PAR-0009), which is exactly why identifying that act as hers depends on the husband's name rather than her own.

  - **[PROVEN]** She stood godmother with her husband to the children of the Azorean Muniz immigrants (PAR-0006) — a role she held in her own right alongside him, not merely as his wife.

  - **[PROVEN]** She died at Carangola on 4 January 1898, aged 51, of "morte natural". The act records that the family "não procuraram Confissão" — no confession was sought — but that she was "solemnemente encommendada nesta Egreja e Acompanhada ao Cemeterio" the following day (PAR-0009). The ceremony happened; the priest had not been called beforehand.

  - **[INFERRED]** She died young by her own family's standard. Her father reached about 70 (PAR-0010), her mother about 65 (PAR-0011) and her husband 79 (PAR-0008); she died at 51, within a few years of the household's move from Sapucaia to Carangola.

  - **[INFERRED]** The name chain is visible across three generations: **Ignacia** Maria de Jesus (her presumed mother, P-0046) → **Rita Ignacia** de Jesus → her daughter Susanna **Rita** Brandão. In a family with no patronymic worth carrying, given names did the work of a lineage.

  ## Identity

  **Rita Ignacia de Jesus** in her baptismal and lifelong form, and **Rita do Rego Brandão** in the married form used at her death. [PROVEN]

  - **Relationship:** great-grandmother of **Antenor Muniz** (P-0006, 1923–2014) — the chain runs Rita → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derived from families F-0019, F-0007 and F-0001]

  - **Father:** Antonio Caetano Machado (P-0045), named "avô materno" at her daughter Susanna's baptism, which is the basis for his fatherhood (PAR-0005); corroborated by his own 1868 Sapucaia death (PAR-0010). [PROVEN]

  - **Mother:** Ignacia Maria de Jesus (P-0046), inferred from her being Antonio Caetano Machado's widow (PAR-0011) plus the shared given name; the record does not state the mother-daughter link, so it stays an inference (family F-0022). [INFERRED]

  - **Marriage:** José do Rego Brandão (P-0040), family F-0019; no marriage act is held, and it must predate her daughter's 1865 birth. [PROVEN as a fact; the act OPEN]

  - **Born:** about **1847**, on the age of 51 given in the 1898 death act — which makes her about eighteen when Susanna was born. [INFERRED from the stated age]

  - **Children:** Susanna (Suzana) Rita Brandão (P-0020), born 20 August 1865 (PAR-0005). Susanna's married-name element "Rita" descends from her. Other children are undocumented; no inventário or "N filhos" statement exists. [OPEN]

  - **Death:** 4 January 1898 at Santa Luzia de Carangola (MG), aged 51, a natural death, solemnly commended in the church and accompanied to the cemetery on 5 January; officiant Cônego [Francisco] Sabino (PAR-0009). The identification as this woman rests on the married-name and husband match — her husband's own 1912 act calls him "viuvo de Rita do Rego Brandão" (PAR-0008) — so it is strong but not carried by a single source giving both name forms. [INFERRED, strong] A different, younger "Lina Rita Brandão" who died in childbirth at Carangola in 1906 is **not** this person.

  ## Standing and profession

  No occupation, property or title is stated for her in any held record. [PROVEN as a negative across the held set] What the records give instead is a role: godmother, with her husband, to the Azorean Muniz brothers' children (PAR-0006), and a named grandparent in a civil birth act (CIV-0041). Both are positions of trust rather than of income. Her literacy is undocumented — no held act carries her signature, and she is never recorded signing or signing by proxy. [OPEN] She is styled "Dona" in the 1890 civil act (CIV-0041), the ordinary courtesy for a married woman of the period. [INFERRED — the reading]

  ## Family and social network

  Through her the maternal line reaches its deepest Brazilian-born ancestor, her father Antonio Caetano Machado, born about 1798 at or near Sapucaia. Her married family (Rego Brandão) and her father's line (Machado) both belonged to the Santo Antônio de Sapucaia parish, and both were embedded in the godparent network that received the Azorean Muniz immigrants in the 1880s. She moved with her husband's household from Sapucaia (RJ) to Carangola (MG) in the 1890s and died there. She must not be conflated with the younger Lina Rita Brandão of Carangola.

  ## What we can extrapolate

  **1. She was co-holder, not appendage, of the family's one asset. [INFERRED / CONTEXTUAL]** Standing godmother to newcomers' children is a role given to a woman on her own reckoning, and the acts name her in it beside her husband rather than behind him. Whatever the Rego Brandão household possessed — and it possessed no land, title or office anyone recorded — consisted of exactly this: being the people a stranger could ask. She held half of that, and the 1885 and 1890 acts are where the archive shows it.

  **2. Her name is the evidence that there was nothing else to inherit. [INFERRED / CONTEXTUAL]** "Ignacia de Jesus" is a devotional surname, not a lineage one; it carries no family, no property and no claim. Women in propertied Brazilian families were named for the lineages their marriages joined, because those names meant something transferable. Hers was chosen from the calendar of saints and passed on to her daughter as a given name. Three generations of this branch — Ignacia, Rita Ignacia, Susanna Rita — transmit first names where wealthier lines transmit surnames and estates.

  **3. Partible inheritance never engaged, and her death shows why that matters. [INFERRED / CONTEXTUAL]** Brazilian law divided estates equally among all children; her death in 1898 generated no inventário, no partition and no heirs' list, and neither did her husband's in 1912. Analytically the absence is the finding. A household that leaves no probate at either spouse's death held nothing worth the cost of opening one — which also means there is no record-based route to the rest of her children, and none to her own parentage.

  **4. The move cost the family its standing, and her burial is where that becomes visible. [INFERRED]** Her father died at Sapucaia in 1868 "sacramentado", with the priest named (PAR-0010); her mother died there in 1878 with a physician's diagnosis on the act (PAR-0011). She died at Carangola in 1898 with "não procuraram Confissão" recorded against her, and her husband died there in 1912 "sem sacramentos" (PAR-0009, PAR-0008). The Sapucaia generation died inside a parish it belonged to; the Carangola generation died at the edge of one it had only recently joined. Her own act splits the difference — no confession sought, but a solemn commendation and procession the next day — which reads as a household that still commanded respect but no longer had the priest within reach. This is the cost of the one form of capital the family had: rootedness cannot be packed.

  **5. She dies at the hinge. [INFERRED]** Her death in January 1898, at 51, falls a few years after the household reached Minas Gerais and eighteen years before her grandson Deocleciano signed his own name on a marriage act — the first documented signature in this descent (CIV-0006). She belongs entirely to the older world: the Paraíba valley parish, the devotional surname, the godparent economy. What came after was a Zona da Mata family with a little literacy, no land, and grandchildren who would end up selling labour in cities.

  ## Open questions

  - A single primary source linking "Rita Ignacia de Jesus" to "Rita do Rego Brandão" — her own baptism (about 1847) or her marriage act — which would promote the 1898 death from a strong inference to a proven fact as hers. [OPEN]

  - Direct confirmation of her mother. Her father's 1868 death act names no wife (both pages read; a bounded negative), so the decisive records are her father's marriage act or her own baptism, both in the undigitised pre-1885 books of the Sapucaia predecessor parish. A weak alternative candidate, Luiza Maria da Conceição, appears as the co-godparent at Susanna's 1866 baptism but is **not** labelled "avó materna" as her husband is labelled "avô materno" — an asymmetry that argues against her. [OPEN — LEAD, weak]

  - Her other children — no denominator exists. [OPEN]

  ## Sources held (this repository)

  - PAR-0005 (her daughter Susanna's 1866 baptism transcript — names her the mother and her father the maternal grandfather) · PAR-0006 (her granddaughter Anna's 1885 baptism — godmother) · CIV-0041 (her granddaughter Ritta's 1890 civil birth — names her, with her husband, as the maternal grandparents, still under her maiden name).

  - PAR-0009 (the 1898 Carangola death of "Rita do Rego Brandão", inferentially hers) · PAR-0010 and PAR-0011 (her father's 1868 and her presumed mother's 1878 Sapucaia deaths).

  ## Regional and migration context

  A woman of **Santo Antônio de Sapucaia** in the Paraíba do Sul valley (RJ) — daughter of the Sapucaia-rooted Machado line and wife of the Rego Brandão householder — who moved with that household in the Brazilian internal shift from the exhausted Paraíba coffee soils west into the **Zona da Mata Mineira**, dying at Carangola in 1898. [CONTEXTUAL] Nationality is recorded as Brazilian on the entity but no birthplace is evidenced, and nothing is inferred from her surname. The economy her family lived in ran on the post-1850 free-labour transition — the Lei nº 581 de 1850 (Lei Eusébio de Queirós), which by choking the slave trade drew in the Azorean immigrants her household sponsored, through to abolition under the Lei Áurea (1888), with land on a purchase basis under the Lei de Terras (nº 601, 1850). No held record states a motive for the move. [CONTEXTUAL]

  ## Where to go today

  - **Family record centre (baptism, marriage, godparent acts):** Igreja Matriz de Santo Antônio de Sapucaia, RJ — Praça Miguel Couto Filho, Centro [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Death (4 January 1898, inferentially hers):** Carangola, MG — Paróquia de Santa Luzia (Praça Cel. Maximiano 138) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ela manteve o nome de solteira em vida e só adquire o do marido na morte. É "Rita Ignacia de Jesus" no batismo de 1866 de sua filha, no batismo de 1885 de sua neta Anna como madrinha, e ainda "Dona Rita Ignacia de Jesus" no assento civil de nascimento de sua neta Ritta, em 1890 — vinte e quatro anos e duas gerações depois (PAR-0005, PAR-0006, CIV-0041). Somente o ato de óbito de 1898 a chama "Rita do Rego Brandão" (PAR-0009), e é exatamente por isso que identificar esse ato como dela depende do nome do marido, não do dela.

  - **[PROVEN]** Foi madrinha, com o marido, dos filhos dos imigrantes açorianos Muniz (PAR-0006) — papel que exerceu em nome próprio ao lado dele, não apenas como sua esposa.

  - **[PROVEN]** Morreu em Carangola em 4 de janeiro de 1898, aos 51 anos, de "morte natural". O ato registra que a família "não procuraram Confissão" — não se buscou confissão —, mas que ela foi "solemnemente encommendada nesta Egreja e Acompanhada ao Cemeterio" no dia seguinte (PAR-0009). A cerimônia aconteceu; o padre não havia sido chamado antes.

  - **[INFERRED]** Morreu jovem para o padrão de sua própria família. Seu pai chegou aos 70 (PAR-0010), sua mãe aos 65 (PAR-0011) e seu marido aos 79 (PAR-0008); ela morreu aos 51, poucos anos depois da mudança do lar de Sapucaia para Carangola.

  - **[INFERRED]** A cadeia de nomes é visível em três gerações: **Ignacia** Maria de Jesus (sua presumida mãe, P-0046) → **Rita Ignacia** de Jesus → sua filha Susanna **Rita** Brandão. Numa família sem patronímico que valesse carregar, os prenomes fizeram o trabalho de uma linhagem.

  ## Identidade

  **Rita Ignacia de Jesus** na forma batismal, usada a vida toda, e **Rita do Rego Brandão** na forma de casada empregada em seu óbito. [PROVEN]

  - **Parentesco:** bisavó de **Antenor Muniz** (P-0006, 1923–2014) — a cadeia corre Rita → Susanna Rita Brondão (P-0020) → Deocleciano Muniz Bittencourt (P-0012) → Antenor. [derivado das famílias F-0019, F-0007 e F-0001]

  - **Pai:** Antonio Caetano Machado (P-0045), nomeado "avô materno" no batismo de sua filha Susanna, que é a base para sua paternidade (PAR-0005); corroborado por seu próprio óbito de 1868 em Sapucaia (PAR-0010). [PROVEN]

  - **Mãe:** Ignacia Maria de Jesus (P-0046), inferida por ser a viúva de Antonio Caetano Machado (PAR-0011) somado ao prenome compartilhado; o registro não declara o vínculo mãe-filha, de modo que permanece inferência (família F-0022). [INFERRED]

  - **Casamento:** José do Rego Brandão (P-0040), família F-0019; nenhum ato de casamento é conservado, e ele deve preceder o nascimento da filha em 1865. [PROVEN quanto ao fato; o ato OPEN]

  - **Nascimento:** por volta de **1847**, pela idade de 51 anos dada no ato de óbito de 1898 — o que a põe com cerca de dezoito anos quando Susanna nasceu. [INFERRED a partir da idade declarada]

  - **Filhos:** Susanna (Suzana) Rita Brandão (P-0020), nascida em 20 de agosto de 1865 (PAR-0005). O elemento "Rita" do nome de casada de Susanna descende dela. Outros filhos não estão documentados; não existe inventário nem declaração de "N filhos". [OPEN]

  - **Óbito:** 4 de janeiro de 1898, em Santa Luzia de Carangola (MG), aos 51 anos, morte natural, solenemente encomendada na igreja e acompanhada ao cemitério em 5 de janeiro; celebrante Cônego [Francisco] Sabino (PAR-0009). A identificação como sendo ela repousa na correspondência do nome de casada e do marido — o próprio ato dele, de 1912, o chama "viuvo de Rita do Rego Brandão" (PAR-0008) —, de modo que é forte, mas não sustentada por uma única fonte que traga ambas as formas do nome. [INFERRED, forte] Uma "Lina Rita Brandão" diferente e mais jovem, falecida de parto em Carangola em 1906, **não** é esta pessoa.

  ## Posição social e profissão

  Nenhuma ocupação, propriedade ou título lhe é declarado em qualquer registro conservado. [PROVEN como negativa no conjunto disponível] O que os registros dão em lugar disso é um papel: madrinha, com o marido, dos filhos dos irmãos açorianos Muniz (PAR-0006), e avó nomeada num assento civil de nascimento (CIV-0041). Ambos são posições de confiança, não de renda. Sua alfabetização não está documentada — nenhum ato conservado traz sua assinatura, e ela nunca aparece assinando nem assinando por procuração. [OPEN] É tratada por "Dona" no ato civil de 1890 (CIV-0041), a cortesia comum para mulher casada do período. [INFERRED — a leitura]

  ## Família e rede social

  Por ela a linha materna alcança seu ancestral nascido no Brasil mais recuado, seu pai Antonio Caetano Machado, nascido por volta de 1798 em Sapucaia ou nas cercanias. Sua família de casada (Rego Brandão) e a linha de seu pai (Machado) pertenciam ambas à freguesia de Santo Antônio de Sapucaia, e ambas estavam entranhadas na rede de apadrinhamento que recebeu os imigrantes açorianos Muniz nos anos 1880. Mudou-se com o lar do marido de Sapucaia (RJ) para Carangola (MG) nos anos 1890 e ali morreu. Não deve ser confundida com a mais jovem Lina Rita Brandão, de Carangola.

  ## O que podemos extrapolar

  **1. Ela era cotitular, não apêndice, do único ativo da família. [INFERRED / CONTEXTUAL]** Ser madrinha dos filhos de recém-chegados é papel concedido a uma mulher por conta própria, e os atos a nomeiam nele ao lado do marido, não atrás dele. O que quer que o lar Rego Brandão possuísse — e não possuía terra, título ou cargo que alguém tenha registrado — consistia exatamente nisto: ser a gente a quem um estranho podia recorrer. Ela detinha metade disso, e os atos de 1885 e 1890 são onde o arquivo o mostra.

  **2. Seu nome é a evidência de que não havia mais nada a herdar. [INFERRED / CONTEXTUAL]** "Ignacia de Jesus" é sobrenome devocional, não de linhagem; não carrega família, propriedade nem pretensão. Mulheres de famílias brasileiras com propriedade eram nomeadas pelas linhagens que seus casamentos uniam, porque aqueles nomes significavam algo transferível. O dela foi escolhido do calendário dos santos e passado à filha como prenome. Três gerações deste ramo — Ignacia, Rita Ignacia, Susanna Rita — transmitem prenomes onde linhas mais ricas transmitem sobrenomes e espólios.

  **3. A herança partível nunca engatou, e a morte dela mostra por que isso importa. [INFERRED / CONTEXTUAL]** A lei brasileira dividia os espólios igualmente entre todos os filhos; sua morte em 1898 não gerou inventário, partilha nem lista de herdeiros, e a do marido em 1912 tampouco. Analiticamente, a ausência é o achado. Um lar que não deixa inventário na morte de nenhum dos cônjuges nada detinha que valesse o custo de abrir um — o que também significa que não há rota documental para o restante de seus filhos, nem para sua própria filiação.

  **4. A mudança custou à família sua posição, e o sepultamento dela é onde isso se torna visível. [INFERRED]** Seu pai morreu em Sapucaia, em 1868, "sacramentado", com o padre nomeado (PAR-0010); sua mãe morreu ali em 1878 com diagnóstico médico no ato (PAR-0011). Ela morreu em Carangola, em 1898, com "não procuraram Confissão" anotado contra si, e o marido morreu ali em 1912 "sem sacramentos" (PAR-0009, PAR-0008). A geração de Sapucaia morreu dentro de uma paróquia a que pertencia; a geração de Carangola morreu à margem de outra à qual só recentemente se juntara. O ato dela fica no meio-termo — sem confissão buscada, mas com encomendação solene e cortejo no dia seguinte —, o que se lê como um lar que ainda impunha respeito, mas já não tinha o padre ao alcance. É o custo da única forma de capital que a família tinha: o enraizamento não se leva na bagagem.

  **5. Ela morre na dobradiça. [INFERRED]** Sua morte em janeiro de 1898, aos 51 anos, cai poucos anos depois de o lar chegar a Minas Gerais e dezoito anos antes de seu neto Deocleciano assinar o próprio nome num ato de casamento — a primeira assinatura documentada nesta descendência (CIV-0006). Ela pertence inteiramente ao mundo anterior: a paróquia do vale do Paraíba, o sobrenome devocional, a economia do apadrinhamento. O que veio depois foi uma família da Zona da Mata com um pouco de alfabetização, sem terra, e netos que acabariam vendendo trabalho nas cidades.

  ## Questões em aberto

  - Uma única fonte primária que ligue "Rita Ignacia de Jesus" a "Rita do Rego Brandão" — seu próprio batismo (por volta de 1847) ou seu ato de casamento —, o que promoveria o óbito de 1898 de inferência forte a fato provado como sendo dela. [OPEN]

  - Confirmação direta de sua mãe. O ato de óbito de 1868 de seu pai não nomeia esposa (ambas as páginas lidas; negativa delimitada), de modo que os registros decisivos são o ato de casamento do pai ou o próprio batismo dela, ambos nos livros não digitalizados anteriores a 1885 da paróquia antecessora de Sapucaia. Uma candidata alternativa fraca, Luiza Maria da Conceição, aparece como comadrinha no batismo de 1866 de Susanna, mas **não** é rotulada "avó materna" como o marido é rotulado "avô materno" — assimetria que argumenta contra ela. [OPEN — LEAD, fraca]

  - Seus demais filhos — não existe denominador. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0005 (a transcrição do batismo de 1866 de sua filha Susanna — nomeia-a como mãe e seu pai como avô materno) · PAR-0006 (o batismo de 1885 de sua neta Anna — madrinha) · CIV-0041 (o nascimento civil de 1890 de sua neta Ritta — nomeia-a, com o marido, como o casal de avós maternos, ainda sob o nome de solteira).

  - PAR-0009 (o óbito de 1898 em Carangola de "Rita do Rego Brandão", inferencialmente dela) · PAR-0010 e PAR-0011 (os óbitos de seu pai, em 1868, e de sua presumida mãe, em 1878, em Sapucaia).

  ## Contexto regional e migratório

  Uma mulher de **Santo Antônio de Sapucaia**, no vale do Paraíba do Sul (RJ) — filha da linha Machado enraizada em Sapucaia e esposa do chefe de casa Rego Brandão —, que se deslocou com aquele lar no movimento interno brasileiro dos solos cafeeiros exauridos do Paraíba para oeste, rumo à **Zona da Mata Mineira**, falecendo em Carangola em 1898. [CONTEXTUAL] A nacionalidade consta como brasileira na entidade, mas nenhum local de nascimento está evidenciado, e nada é inferido de seu sobrenome. A economia em que sua família viveu funcionava sobre a transição para o trabalho livre pós-1850 — a Lei nº 581 de 1850 (Lei Eusébio de Queirós), que, ao estrangular o tráfico, atraiu os imigrantes açorianos apadrinhados por seu lar, até a abolição pela Lei Áurea (1888), com a terra em base de compra sob a Lei de Terras (nº 601, 1850). Nenhum registro conservado declara um motivo para a mudança. [CONTEXTUAL]

  ## Onde ir hoje

  - **Centro de registros da família (batismo, casamento, atos de apadrinhamento):** Igreja Matriz de Santo Antônio de Sapucaia, RJ — Praça Miguel Couto Filho, Centro [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Óbito (4 de janeiro de 1898, inferencialmente dela):** Carangola, MG — Paróquia de Santa Luzia (Praça Cel. Maximiano 138) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
