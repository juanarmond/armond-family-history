    Mother of Susanna (Suzana) Rita Brandão (P-0020) — Susanna's married name
    "Rita" derives from her. Named in Susanna's 1866 baptism (PAR-0005) as her
    legitimate mother, and again as a godparent of her granddaughter Anna's 1885
    baptism (PAR-0006).
- text: >-
    Maternal-line lead, not modelled: Susanna's 1866 baptism names the padrinho
    Antonio Castro Machado as the child's "avô materno" (maternal grandfather),
    i.e. Rita Ignacia de Jesus's own father. Recorded here as a research lead.
