notes:
- text: >-
    Mother of Susanna (Suzana) Rita Brandão (P-0020) — Susanna's married name
    "Rita" derives from her. Named in Susanna's 1866 baptism (PAR-0005) as her
    legitimate mother, and again as a godparent of her granddaughter Anna's 1885
    baptism (PAR-0006).
  text_pt: >-
    Mãe de Susanna (Suzana) Rita Brandão (P-0020) — o nome de casada "Rita" de
    Susanna deriva dela. Nomeada no batismo de 1866 de Susanna (PAR-0005) como sua
    mãe legítima, e novamente como madrinha no batismo de 1885 de sua neta Anna
    (PAR-0006).
- text: >-
    Died 4 January 1898 at Carangola, aged 51 (born c.1847), under her married name
    "Rita do Rego Brandão", per her death register (PAR-0009 → event E-0038);
    identified as hers by her husband José do Rego Brandão (whose 1912 óbito names him
    "viuvo de Rita do Rego Brandão"). A different "Rita Brandão" who died 1906 at
    Carangola (wife of João de Souza Freitas) is not this person.
  text_pt: >-
    Falecida em 4 de janeiro de 1898 em Carangola, com 51 anos (nascida c.1847), sob
    seu nome de casada "Rita do Rego Brandão", conforme seu registro de óbito (PAR-0009
    → evento E-0038); identificado como sendo o dela por seu marido José do Rego Brandão
    (cujo óbito de 1912 o nomeia "viuvo de Rita do Rego Brandão"). Uma "Rita Brandão"
    diferente, que faleceu em 1906 em Carangola (esposa de João de Souza Freitas), não é
    esta pessoa.
- text: >-
    Her parents (family F-0022): father Antonio Caetano Machado (P-0045) — the
    "avô materno" of Susanna's 1866 baptism (PAR-0005), his name now resolved from the
    earlier "Castro/Caetano" ambiguity to Caetano by his own 1868 óbito (PAR-0010) and
    his widow's 1878 óbito (PAR-0011); mother Ignacia Maria de Jesus (P-0046), inferred
    from being Antonio Caetano Machado's widow plus the shared "Ignacia" name.
  text_pt: >-
    Seus pais (família F-0022): pai Antonio Caetano Machado (P-0045) — o "avô materno"
    do batismo de 1866 de Susanna (PAR-0005), cujo nome agora foi resolvido da anterior
    ambiguidade "Castro/Caetano" para Caetano por seu próprio óbito de 1868 (PAR-0010) e
    pelo óbito de 1878 de sua viúva (PAR-0011); mãe Ignacia Maria de Jesus (P-0046),
    inferida por ser a viúva de Antonio Caetano Machado somada ao nome "Ignacia"
    compartilhado.
