profile: >-
  ## Identity

  **Rita Ignacia de Jesus** in her baptismal/maiden form (from her daughter's baptism,
  PAR-0005), and **Rita do Rego Brandão** in her married form (PAR-0009). [PROVEN]

  - **Father:** Antonio Caetano Machado (P-0045), named "avô materno" (maternal
  grandfather) at Susanna's baptism — the basis for his fatherhood of Rita (PAR-0005).
  [PROVEN]

  - **Mother:** Ignacia Maria de Jesus (P-0046), inferred from being Antonio Caetano
  Machado's widow (PAR-0011) plus the shared "Ignacia" name; not directly stated (family
  F-0022). [INFERRED]

  - **Marriage:** José do Rego Brandão (P-0040), the Sapucaia patriarch (family F-0019).
  [PROVEN]

  - **Born:** about 1847, if the 1898 "Rita do Rego Brandão, 51 anos" is her. [INFERRED]

  - **Children:** Susanna (Suzana) Rita Brandão (P-0020) — Susanna's married name "Rita"
  derives from her. [PROVEN]

  - **Death:** 4 January 1898 at Santa Luzia de Carangola (MG), aged 51, as "Rita do Rego
  Brandão" (PAR-0009). The identification as this person rests on the married-name and
  husband match (José's 1912 óbito calls him "viuvo de Rita do Rego Brandão"); it is not a
  single primary source linking both name-forms, so it is strong but inferential. [INFERRED]

  ## Standing and profession

  Wife of the Sapucaia Rego Brandão patriarch; godmother, with her husband, to the Açorean
  Muniz brothers' children — named godmother at her granddaughter Anna's 1885 baptism
  (PAR-0006). No occupation or property is attested. [PROVEN role]

  ## Family and social network

  Through her, the maternal line reaches its deepest Sapucaia-born ancestor, her father
  Antonio Caetano Machado (born about 1798). Her married family (Rego Brandão) and her
  father's line (Machado) both moved from Sapucaia (RJ) to Carangola (MG). A ⚠ caution:
  she is not to be conflated with a different, younger "Ana Rita Brandão" who died in
  childbirth at Carangola in 1906.

  ## What we can extrapolate

  She was the female half of the established host family. [INFERRED / CONTEXTUAL] Sharing the
  godparent role with her husband — standing godmother to the Açorean Muniz brothers' children —
  she was co-holder of the Brandão line's social rootedness (see P-0040): a settled native woman
  sponsoring newcomers' baptisms is exercising exactly the standing an established local family
  has to give.

  Her documentary identity carries no surname-capital of its own. [INFERRED / CONTEXTUAL] She
  bore the devotional maiden form "Ignacia de Jesus" (later the married "do Rego Brandão"), not
  a lineage patronymic; her identity runs through her father (the church-integrated Antonio
  Caetano Machado, born about 1798) and her husband, not a name of her own — the mark of a
  middling-established family whose standing was social rather than heritable-material.

  ## Open questions

  - A single primary source linking "Rita Ignacia de Jesus" to "Rita do Rego Brandão"
  (her own baptism or marriage giving both) — to promote the 1898 death from inferential
  to proven as hers. [OPEN]

  - Direct confirmation of her mother (Ignacia Maria de Jesus) — her own baptism (about
  1847, Sapucaia) or a record giving her filiation. [OPEN]

  ## Sources held (this repository)

  - PAR-0005 (daughter Susanna's 1866 baptism — names her the mother and her father the
  maternal grandfather) · PAR-0006 (granddaughter Anna's 1885 baptism — godmother).

  - PAR-0009 (the 1898 Carangola death of "Rita do Rego Brandão", inferentially hers) ·
  PAR-0010 / PAR-0011 (her father's 1868 and her presumed mother's 1878 Sapucaia deaths).

  ## Regional and migration context

  A Santo Antônio de Sapucaia (RJ) woman — daughter of the Sapucaia-born Machado line and
  wife of the Rego Brandão patriarch — who moved with that family in the Brazilian-side
  RJ-to-MG coffee-frontier shift, dying at Carangola in 1898. [CONTEXTUAL] Nationality is
  left unset: no birthplace is evidenced. The free-labour coffee economy this family moved
  within ran on the Lei nº 581 de 1850 (Lei Eusébio de Queirós), through abolition in the Lei
  Áurea (1888), with land under the Lei de Terras (nº 601, 1850) — the Brazilian, receiving side
  of that history, with no Atlantic crossing. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Rita Ignacia de Jesus** em sua forma de batismo/solteira (do batismo de sua filha,
  PAR-0005), e **Rita do Rego Brandão** em sua forma de casada (PAR-0009). [PROVEN]

  - **Pai:** Antonio Caetano Machado (P-0045), nomeado "avô materno" no batismo de Susanna —
  a base para sua paternidade sobre Rita (PAR-0005). [PROVEN]

  - **Mãe:** Ignacia Maria de Jesus (P-0046), inferida por ser a viúva de Antonio Caetano
  Machado (PAR-0011) somada ao nome "Ignacia" compartilhado; não declarada diretamente
  (família F-0022). [INFERRED]

  - **Casamento:** José do Rego Brandão (P-0040), o patriarca de Sapucaia (família F-0019).
  [PROVEN]

  - **Nascimento:** por volta de 1847, se a "Rita do Rego Brandão, 51 anos" de 1898 for ela.
  [INFERRED]

  - **Filhos:** Susanna (Suzana) Rita Brandão (P-0020) — o nome de casada "Rita" de Susanna
  deriva dela. [PROVEN]

  - **Óbito:** 4 de janeiro de 1898 em Santa Luzia de Carangola (MG), aos 51 anos, como
  "Rita do Rego Brandão" (PAR-0009). A identificação como esta pessoa apoia-se na
  correspondência do nome de casada e do marido (o óbito de 1912 de José o chama "viuvo de
  Rita do Rego Brandão"); não há uma única fonte primária ligando ambas as formas de nome,
  de modo que é forte, porém inferencial. [INFERRED]

  ## Posição social e profissão

  Esposa do patriarca Rego Brandão de Sapucaia; madrinha, junto com o marido, dos filhos dos
  irmãos açorianos Muniz — nomeada madrinha no batismo de 1885 de sua neta Anna (PAR-0006).
  Nenhuma ocupação ou propriedade lhe é atestada. [PROVEN, o papel]

  ## Família e rede social

  Por meio dela, a linha materna alcança seu ancestral mais antigo nascido em Sapucaia, seu
  pai Antonio Caetano Machado (nascido por volta de 1798). Sua família por casamento (Rego
  Brandão) e a linha de seu pai (Machado) mudaram-se ambas de Sapucaia (RJ) para Carangola
  (MG). ⚠ Uma ressalva: ela não deve ser confundida com uma "Ana Rita Brandão" diferente e
  mais nova, que faleceu de parto em Carangola em 1906.

  ## O que podemos extrapolar

  Ela era a metade feminina da família anfitriã estabelecida. [INFERRED / CONTEXTUAL]
  Compartilhando o papel de padrinho/madrinha com o marido — sendo madrinha dos filhos dos
  irmãos açorianos Muniz —, ela era coproprietária do enraizamento social da linha Brandão (ver
  P-0040): uma mulher nativa estabelecida que apadrinha os batismos dos recém-chegados exerce
  exatamente a posição que uma família local estabelecida tem a oferecer.

  Sua identidade documental não carrega capital de sobrenome próprio. [INFERRED / CONTEXTUAL]
  Ela portava a forma devocional de solteira "Ignacia de Jesus" (depois a de casada "do Rego
  Brandão"), não um patronímico de linhagem; sua identidade corre por seu pai (o
  integrado-à-igreja Antonio Caetano Machado, nascido por volta de 1798) e por seu marido, não
  por um nome próprio — a marca de uma família de posição média-estabelecida cuja posição era
  social, e não herdável-material.

  ## Questões em aberto

  - Uma única fonte primária ligando "Rita Ignacia de Jesus" a "Rita do Rego Brandão" (seu
  próprio batismo ou casamento trazendo ambos) — para promover o óbito de 1898 de
  inferencial a comprovado como sendo o dela. [OPEN]

  - Confirmação direta de sua mãe (Ignacia Maria de Jesus) — seu próprio batismo (por volta
  de 1847, Sapucaia) ou um registro que traga sua filiação. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0005 (batismo de 1866 da filha Susanna — nomeia-a mãe e a seu pai como avô materno) ·
  PAR-0006 (batismo de 1885 da neta Anna — madrinha).

  - PAR-0009 (o óbito de 1898 em Carangola de "Rita do Rego Brandão", inferencialmente o dela)
  · PAR-0010 / PAR-0011 (os óbitos de 1868 de seu pai e de 1878 de sua presumida mãe, em
  Sapucaia).

  ## Contexto regional e migratório

  Uma mulher de Santo Antônio de Sapucaia (RJ) — filha da linha Machado nascida em Sapucaia e
  esposa do patriarca Rego Brandão — que se mudou com essa família no deslocamento pela
  fronteira cafeeira do lado brasileiro, de RJ para MG, falecendo em Carangola em 1898.
  [CONTEXTUAL] A nacionalidade é deixada em branco: nenhum local de nascimento está
  evidenciado. A economia cafeeira de trabalho livre dentro da qual esta família se moveu
  funcionava sobre a Lei nº 581 de 1850 (Lei Eusébio de Queirós), até a abolição na Lei Áurea
  (1888), com a terra sob a Lei de Terras (nº 601, 1850) — o lado brasileiro, receptor, dessa
  história, sem travessia atlântica. [CONTEXTUAL]
