profile: >-
  ## Interesting facts

  - **[PROVEN]** He registered all six of his children — born between 1901 and 1915 — in one sitting in 1915 (CIV-0007), under the government amnesty decree of 1914 that allowed late registration of children born without civil registration. None had been registered at birth. This is the only document that anchors his family in the archive.

  - **[CONTEXTUAL]** The 1914 amnesty decree was a response to widespread non-compliance with the 1889 civil registration law in rural Brazil, where families in remote areas had limited access to civil registry offices. The Fazenda do Barroso, São Francisco do Glória, where his children were born, was a typical Zona da Mata interior farm far from administrative centres.

  - **[PROVEN]** He was born at Vila do Rio Claro (CIV-0007) — his father Vicente was Portuguese and his mother Maria Tertuliana da Conceição was from the same Rio Claro area. He is therefore the first generation of a Portuguese-immigrant family to have been born in Brazil.

  - **[INFERRED]** A possible Guarda Nacional Alferes rank in 1897 (an uncatalogued lead, not proven) would make him the high point of his immigrant branch's arc: from Portuguese immigrant father (Vicente) to local militia officer in one generation — the self-made immigrant climb that the coffee-frontier Zona da Mata enabled.

  - **[CONTEXTUAL]** The Carangola coffee frontier where he farmed was one of the Zona da Mata's later openings, settled in the decades after the Lei de Terras (1850) and Lei Áurea (1888), when free immigrant-descended families moved onto land previously inaccessible or organised around enslaved labour. His farming life sits at the post-abolition frontier stage.

  ## Identity

  **Francisco José de Carvalho Guimarães** [PROVEN]. A Brazilian-born farmer of the
  Carvalho Guimarães family — the pivot between this line's Portuguese origin (his father
  was Portuguese) and its settlement on the Zona da Mata Mineira.

  - **Born:** native of Vila do Rio Claro [PROVEN as stated] (CIV-0007); date not recorded.

  - **Parents:** Vicente José de Carvalho Guimarães (P-0023), Portuguese, and Maria
  Tertuliana da Conceição (P-0024) [PROVEN as reported] — named in CIV-0007.

  - **Marriage:** to Emmerenciana Maria de Jesus (P-0022) [PROVEN] (CIV-0007, CIV-0018,
  CIV-0022).

  - **Children:** six, all born at the Fazenda do Barroso, São Francisco do Glória, and
  registered together by him in 1915 (CIV-0007): José (1901), Maria Amora / Aurora (P-0011,
  1904), Maria da Conceição (1906), Sebastião José (1909), João José (1912) and Maria de
  Lourdes (1915). [PROVEN] Three of these children are individually confirmed by held death
  records that name him as father: his son José de Carvalho Guimarães Sobrinho died on 21
  December 1964 at Califórnia, Paraná (Norte Pioneiro do Paraná) [PROVEN] (CIV-0049); his
  son Sebastião José de Carvalho Guimarães died on 13 April 1982 at Jacarezinho, Paraná
  (also Norte Pioneiro) [PROVEN] (CIV-0050); and his son João José de Carvalho Guimarães
  died on 4 May 1992 at Volta Redonda, RJ, aged 79, a widower and retired, leaving some
  fourteen adult children [PROVEN; the child count is an uncertain read] (CIV-0033). The
  Paraná sons' deaths in the Norte Pioneiro do Paraná region place at least part of his family
  in the interior coffee frontier of northern Paraná, the mid-20th-century continuation of
  the Zona da Mata frontier movement. [CONTEXTUAL]

  - **Death:** before 1991 (his daughter Maria Aurora's 1991 death names him, CIV-0018);
  date and place not held. [INFERRED]

  ## Standing and profession

  - **Lavrador (farmer)** resident at São Francisco do Glória, Carangola (MG), in 1915
  [PROVEN] — CIV-0007 describes him and his wife collectively as "lavradores"; he was the
  declarant of his six children's retrospective birth registrations under the 1914 amnesty
  decree.

  - **Possible Guarda Nacional Alferes, Carangola, 1897** [LEAD] — an uncatalogued
  retrieval lead (a transcribed 1897 militia roll) lists a "Francisco José de Carvalho
  Guimarães" as Alferes alongside several same-surname officers who may be his brothers;
  not confirmed against a primary record.

  ## Family and social network

  Son of a Portuguese immigrant (Vicente) and a Rio-Claro-born mother, he anchored the
  family in the Carangola coffee interior, where his daughter Maria Aurora married into
  the Engracio-Souza line (P-0010). [PROVEN]

  ## What we can extrapolate

  Start with what is PROVEN, because the standing usually attributed to him is not. [PROVEN
  / LEAD] The only occupation any held record gives him is *lavrador* — CIV-0007 describes
  him and his wife collectively as "lavradores" — while the 1897 Guarda Nacional Alferes
  rank is a transcribed militia roll with no primary behind it [LEAD]. Two details of the
  one record we do hold pull against the notable reading. He left six children unregistered
  for between four months and fourteen years and entered them only when an amnesty decree
  made it possible ("decreto número dois mil oitocentos e oitenta e sete, de vinte e cinco
  de novembro", 1914) — the behaviour of a household outside the administrative net rather
  than of a man who held office inside it. And his two witnesses were townsmen of the small
  commercial sort: José Guida, *commerciante*, and Joaquim Ferreira de Mello, *official de
  pharmacia* — not fazendeiros, priests or fellow officers. What he demonstrably was is a
  literate farmer (he signed the act himself) with a district-town social circle.

  If the 1897 rank does hold, he is the high point of this branch's arc — the generation
  that turned an immigrant arrival into local standing. [INFERRED / CONTEXTUAL, conditional
  on the lead] A militia Alferes flanked by a cluster of same-surname officers (Alacrino,
  Juvenal, Pedro, José de Carvalho Guimarães — likely brothers) is the signature of an
  established, locally-prominent family, and one that rose within a single generation: his
  father Vicente was a Portuguese immigrant, so any such rank was earned in Brazil, not
  inherited from an Old-World estate. Guarda Nacional officer rank in the interior marked
  propertied, literate, locally-respected men.

  Either way, the standing he reached was of a kind that does not descend. [CONTEXTUAL] A
  militia rank and local prominence are not land: they confer status while the man holds
  them and leave no estate that passes automatically. Guarda Nacional service was moreover
  *gratuita* — the rank itself paid nothing, a 0$ honorific — so it produced authority and
  creditworthiness but no salary and no capital to bank. His farming is equally
  undeterminable as capital: the record does not say whether he owned, rented or
  share-cropped the Fazenda do Barroso, and no land title, probate or inventário in his name
  has been located [OPEN — bounded negative].

  Six children, then eleven and fourteen, is the arithmetic that settles the question.
  [INFERRED / CONTEXTUAL] Brazilian partible succession divides an estate equally among all
  the children, so whatever he held was destined to be cut six ways (CIV-0007) and then cut
  again — his son José Sobrinho left eleven adult children (CIV-0049), his son João José
  some fourteen (CIV-0033). No modest holding survives that denominator twice. The held
  death records show what in fact reached the next generation: José Sobrinho died a
  *lavrador* at Califórnia, Paraná, in 1964 with "não tem bens a inventariar"; Sebastião
  died in 1982 at Jacarezinho, unmarried, a *lavrador* living in the Asilo São Vicente de
  Paula, "não deixa bens"; only João José, who died at Volta Redonda in 1992, "deixou bens a
  inventariar" — to be split among those fourteen. His daughter Maria Aurora reached the
  modest urban middle in Rio and likewise "não deixou bens" (CIV-0018).

  Education fell with the property, and one record shows the break. [INFERRED / CONTEXTUAL]
  He himself was literate: he signed his own name to the 1915 act. His son Sebastião's 1982
  death act, by contrast, records "não era eleitor", and Brazilian law barred illiterates
  from the franchise until Emenda Constitucional nº 25 of 1985 — so a 72-year-old recorded
  as a non-voter in 1982 was very probably never schooled to literacy [INFERRED — strong,
  not conclusive]. Schooling in the rural Zona da Mata was a purchased, class-linked
  privilege that had to be re-bought each generation, with no free village school behind it;
  a family whose children reached fourteen without a birth registration was not buying it.
  Whatever literacy Francisco had was competence acquired for his own position, and it did
  not reproduce on its own.

  The arc, with its turning points. [INFERRED / CONTEXTUAL] (1) His father Vicente emigrates
  from Portugal carrying labour rather than capital, and the family bases itself at Vila do
  Rio Claro. (2) It moves to the late-opening Carangola coffee frontier — the opportunity
  structure that let an immigrant-descended household take up land and, if the lead holds,
  militia office. (3) 1915: six children at the Fazenda do Barroso, registered late in a
  single act — the branch's moment of maximum visibility, and the moment the partible
  denominator is fixed. (4) The coffee collapse of the 1920s–30s disperses those children
  three ways: two sons re-frontier to the Norte Pioneiro do Paraná and remain *lavradores*,
  one daughter urbanises to Rio as a merchant's wife, one son ends in the Volta Redonda
  steel city. Read against the Armond decline, Francisco is its mirror-image running forward
  — an immigrant line assembling upward into local standing within a generation, instead of
  an elite line fragmenting downward — but because that standing rested on office and
  frontier opportunity rather than on heritable land, it marked a peak rather than a
  foundation. His children went back out to a frontier, as his father had; the family
  climbed once and then repeated itself.

  ## Open questions

  - His and Emmerenciana's marriage record, and his own birth and death records — not
  held; would confirm his parents and possibly his father's Portuguese parish. [OPEN]

  - A tension to reconcile, not to resolve here: his son José Sobrinho's 1964 death act
  states that both parents were "ambos naturais do Estado de Minas Gerais" (CIV-0049), while
  the 1915 registration Francisco himself declared gives his own naturalidade as Villa do
  Rio Claro (CIV-0007). The 1915 statement is the earlier and better-informed one and
  governs; the 1964 informant statement is logged rather than resolved. Separately, this
  repository's structured place entry for Villa do Rio Claro (PL-0008) records it in the
  state of Rio de Janeiro, while this profile's research trail assumes Rio Claro, São Paulo;
  the two have not been reconciled. [OPEN]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of his six children — the anchor record:
  names him, his wife, his parents and her parents) · CIV-0018 (daughter Maria Aurora's
  1991 death — names him as her father) · CIV-0022 (granddaughter Cidália's 1930 birth —
  names him as maternal grandfather) · CIV-0033 (son João José's 1992 Volta Redonda death —
  names him as father) · CIV-0049 (son José Sobrinho's 1964 death at Califórnia, Paraná —
  names him as father) · CIV-0050 (son Sebastião José's 1982 death at Jacarezinho, Paraná —
  names him as father).

  ## Regional and migration context

  He embodies the family's internal move from Vila do Rio Claro to the Carangola frontier
  (Zona da Mata Mineira), the late-opening coffee zone that drew immigrant-descended
  families after 1888. [CONTEXTUAL] His Brazilian nationality follows jus soli from his
  Rio Claro birth, not the surname.

  ## Where to go today

  - **Birth (Villa do Rio Claro, SP):** Igreja Matriz de São João Batista, Rua 6, Centro, Rio Claro — the family church, where his parents married [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)

  - **Carangola, MG (1897, Guarda Nacional Alferes):** Igreja Matriz de Santa Luzia [RESOLVED town] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Registrou todos os seis filhos — nascidos entre 1901 e 1915 — numa única assentada em 1915 (CIV-0007), ao amparo do decreto de anistia governamental de 1914 que permitia o registro tardio de filhos sem registro civil de nascimento. Nenhum havia sido registrado ao nascer. Este é o único documento que ancora sua família no arquivo.

  - **[CONTEXTUAL]** O decreto de anistia de 1914 foi uma resposta ao generalizado descumprimento da lei de registro civil de 1889 no Brasil rural, onde famílias em áreas remotas tinham acesso limitado aos cartórios de registro civil. A Fazenda do Barroso, em São Francisco do Glória, onde seus filhos nasceram, era uma fazenda típica do interior da Zona da Mata, longe dos centros administrativos.

  - **[PROVEN]** Nasceu em Vila do Rio Claro (CIV-0007) — seu pai Vicente era português e sua mãe Maria Tertuliana da Conceição era da mesma região do Rio Claro. É, portanto, a primeira geração de uma família de imigrantes portugueses a ter nascido no Brasil.

  - **[INFERRED]** Uma possível patente de Alferes da Guarda Nacional em 1897 (uma pista não catalogada, não comprovada) o tornaria o ponto mais alto do arco de seu ramo imigrante: do pai imigrante português (Vicente) a oficial de milícia local em uma geração — a ascensão autoconstruída do imigrante que a fronteira cafeeira da Zona da Mata possibilitou.

  - **[CONTEXTUAL]** A fronteira cafeeira de Carangola onde lavrou era uma das aberturas mais tardias da Zona da Mata, colonizada nas décadas após a Lei de Terras (1850) e a Lei Áurea (1888), quando famílias de descendência imigrante livre avançaram sobre terras antes inacessíveis ou organizadas em torno do trabalho escravizado. Sua vida de lavrador situa-se no estágio de fronteira pós-abolição.

  ## Identidade

  **Francisco José de Carvalho Guimarães** [PROVEN]. Lavrador nascido no Brasil, da
  família Carvalho Guimarães — o elo entre a origem portuguesa desta linhagem (seu pai era
  português) e seu estabelecimento na Zona da Mata Mineira.

  - **Nascimento:** natural da Vila do Rio Claro [PROVEN conforme declarado] (CIV-0007);
  data não registrada.

  - **Pais:** Vicente José de Carvalho Guimarães (P-0023), português, e Maria Tertuliana
  da Conceição (P-0024) [PROVEN conforme declarado] — nomeados em CIV-0007.

  - **Casamento:** com Emmerenciana Maria de Jesus (P-0022) [PROVEN] (CIV-0007, CIV-0018,
  CIV-0022).

  - **Filhos:** seis, todos nascidos na Fazenda do Barroso, São Francisco do Glória, e
  registrados por ele em conjunto em 1915 (CIV-0007): José (1901), Maria Amora / Aurora
  (P-0011, 1904), Maria da Conceição (1906), Sebastião José (1909), João José (1912) e
  Maria de Lourdes (1915). [PROVEN] Três desses filhos são individualmente confirmados por
  registros de óbito disponíveis que o nomeiam como pai: seu filho José de Carvalho
  Guimarães Sobrinho faleceu em 21 de dezembro de 1964, em Califórnia, Paraná (Norte
  Pioneiro do Paraná) [PROVEN] (CIV-0049); seu filho Sebastião José de Carvalho Guimarães
  faleceu em 13 de abril de 1982, em Jacarezinho, Paraná (também Norte Pioneiro) [PROVEN]
  (CIV-0050); e seu filho João José de Carvalho Guimarães faleceu em 4 de maio de 1992, em
  Volta Redonda, RJ, aos 79 anos, viúvo e aposentado, deixando cerca de quatorze filhos
  maiores [PROVEN; a contagem de filhos é leitura incerta] (CIV-0033). Os óbitos dos filhos
  paranaenses na região do Norte Pioneiro do Paraná situam ao menos parte de sua família na
  fronteira cafeeira do interior do norte do Paraná, a continuação no século XX do movimento
  de fronteira da Zona da Mata. [CONTEXTUAL]

  - **Óbito:** antes de 1991 (o óbito de 1991 de sua filha Maria Aurora o nomeia,
  CIV-0018); data e local não obtidos. [INFERRED]

  ## Posição social e profissão

  - **Lavrador** residente em São Francisco do Glória, Carangola (MG), em 1915 [PROVEN] —
  CIV-0007 descreve o casal coletivamente como "lavradores"; foi o declarante dos
  registros retroativos de nascimento de seus seis filhos, ao amparo do decreto de anistia
  de 1914.

  - **Possível Alferes da Guarda Nacional, Carangola, 1897** [LEAD] — uma pista de
  recuperação não catalogada (transcrição de uma relação da milícia de 1897) lista um
  "Francisco José de Carvalho Guimarães" como Alferes, junto a vários oficiais de mesmo
  sobrenome que podem ser seus irmãos; não confirmado por registro primário.

  ## Família e rede social

  Filho de um imigrante português (Vicente) e de mãe nascida no Rio Claro, fixou a família
  no interior cafeeiro de Carangola, onde sua filha Maria Aurora casou-se com a linhagem
  Engracio-Souza (P-0010). [PROVEN]

  ## O que podemos extrapolar

  Comece pelo que é PROVEN, porque a posição que costuma lhe ser atribuída não é. [PROVEN /
  LEAD] A única ocupação que qualquer registro disponível lhe dá é *lavrador* — CIV-0007
  descreve ele e a esposa coletivamente como "lavradores" —, enquanto a patente de Alferes
  da Guarda Nacional de 1897 é uma relação de milícia transcrita, sem primário por trás
  [LEAD]. Dois detalhes do único registro que de fato temos puxam contra a leitura de
  notável. Ele deixou seis filhos sem registro por entre quatro meses e quatorze anos e só
  os registrou quando um decreto de anistia o tornou possível ("decreto número dois mil
  oitocentos e oitenta e sete, de vinte e cinco de novembro", 1914) — comportamento de uma
  casa fora da malha administrativa, e não de um homem que ocupava cargo dentro dela. E suas
  duas testemunhas eram homens da vila, do pequeno comércio: José Guida, *commerciante*, e
  Joaquim Ferreira de Mello, *official de pharmacia* — não fazendeiros, padres ou colegas de
  oficialato. O que ele comprovadamente era: um lavrador alfabetizado (assinou o próprio ato)
  com um círculo social de vila.

  Se a patente de 1897 se confirmar, ele é o ponto alto do arco deste ramo — a geração que
  transformou uma chegada imigrante em posição local. [INFERRED / CONTEXTUAL, condicionado à
  pista] Um Alferes de milícia ladeado por um grupo de oficiais de mesmo sobrenome
  (Alacrino, Juvenal, Pedro, José de Carvalho Guimarães — provavelmente irmãos) é a
  assinatura de uma família estabelecida e localmente proeminente, e que ascendeu em uma
  única geração: seu pai Vicente era imigrante português, de modo que tal patente teria sido
  conquistada no Brasil, não herdada de um patrimônio do Velho Mundo. A patente de oficial da
  Guarda Nacional no interior marcava homens com bens, letrados e localmente respeitados.

  De um jeito ou de outro, a posição que ele alcançou é do tipo que não desce. [CONTEXTUAL]
  Uma patente de milícia e a proeminência local não são terra: conferem status enquanto o
  homem as detém e não deixam patrimônio que passe automaticamente. O serviço na Guarda
  Nacional era, ademais, *gratuito* — a patente em si nada pagava, uma honraria de 0$ —, de
  modo que produzia autoridade e crédito, mas nenhum salário e nenhum capital a acumular. Sua
  lavoura é igualmente indeterminada como capital: o registro não diz se era dono, arrendava
  ou meava a Fazenda do Barroso, e nenhum título de terra, inventário ou partilha em seu nome
  foi localizado [OPEN — negativo delimitado].

  Seis filhos, depois onze e quatorze, é a aritmética que resolve a questão. [INFERRED /
  CONTEXTUAL] A sucessão partível brasileira divide o espólio igualmente entre todos os
  filhos, de modo que o que quer que ele tivesse estava destinado a ser cortado em seis
  (CIV-0007) e depois cortado de novo — seu filho José Sobrinho deixou onze filhos maiores
  (CIV-0049), seu filho João José cerca de quatorze (CIV-0033). Nenhuma propriedade modesta
  sobrevive a esse denominador duas vezes. Os registros de óbito disponíveis mostram o que de
  fato chegou à geração seguinte: José Sobrinho morreu *lavrador* em Califórnia, Paraná, em
  1964, "não tem bens a inventariar"; Sebastião morreu em 1982 em Jacarezinho, solteiro,
  *lavrador* residente no Asilo São Vicente de Paula, "não deixa bens"; apenas João José, que
  morreu em Volta Redonda em 1992, "deixou bens a inventariar" — a partilhar entre aqueles
  quatorze. Sua filha Maria Aurora alcançou a modesta classe média urbana no Rio e igualmente
  "não deixou bens" (CIV-0018).

  A educação caiu junto com a propriedade, e um registro mostra a ruptura. [INFERRED /
  CONTEXTUAL] Ele próprio era alfabetizado: assinou o próprio nome no ato de 1915. O ato de
  óbito de seu filho Sebastião, em 1982, por outro lado, registra "não era eleitor", e a lei
  brasileira barrou os analfabetos do voto até a Emenda Constitucional nº 25, de 1985 — de
  modo que um homem de 72 anos registrado como não eleitor em 1982 muito provavelmente nunca
  foi escolarizado até a alfabetização [INFERRED — forte, não conclusivo]. A escolarização na
  Zona da Mata rural era um privilégio comprado e ligado à classe, que precisava ser
  recomprado a cada geração, sem escola pública de aldeia por trás; uma família cujos filhos
  chegavam aos quatorze anos sem registro de nascimento não estava comprando isso. A
  alfabetização que Francisco tinha era competência adquirida para a própria posição, e não
  se reproduziu sozinha.

  O arco e seus pontos de inflexão. [INFERRED / CONTEXTUAL] (1) Seu pai Vicente emigra de
  Portugal carregando trabalho, e não capital, e a família se fixa na Vila do Rio Claro. (2)
  Ela se muda para a fronteira cafeeira de abertura tardia de Carangola — a estrutura de
  oportunidade que permitiu a uma casa de descendência imigrante tomar terra e, se a pista se
  confirmar, oficialato de milícia. (3) 1915: seis filhos na Fazenda do Barroso, registrados
  tardiamente num único ato — o momento de máxima visibilidade do ramo, e o momento em que o
  denominador partível fica fixado. (4) O colapso cafeeiro dos anos 1920–30 dispersa esses
  filhos em três direções: dois filhos refazem a fronteira no Norte Pioneiro do Paraná e
  permanecem *lavradores*, uma filha se urbaniza no Rio como esposa de comerciante, um filho
  termina na cidade siderúrgica de Volta Redonda. Lido contra o declínio Armond, Francisco é
  sua imagem espelhada correndo para a frente — uma linhagem imigrante se montando para cima
  em posição local dentro de uma geração, em vez de uma linhagem de elite se fragmentando
  para baixo —, mas, como essa posição repousava em cargo e oportunidade de fronteira, e não
  em terra herdável, marcou um pico, e não um alicerce. Seus filhos voltaram a uma fronteira,
  como fizera o avô deles; a família subiu uma vez e depois se repetiu.

  ## Questões em aberto

  - Seu casamento com Emmerenciana e seus próprios registros de nascimento e óbito — não
  obtidos; confirmariam seus pais e, possivelmente, a freguesia portuguesa de seu pai.
  [OPEN]

  - Uma tensão a reconciliar, não a resolver aqui: o ato de óbito de 1964 de seu filho José
  Sobrinho declara que ambos os pais eram "ambos naturais do Estado de Minas Gerais"
  (CIV-0049), ao passo que o registro de 1915 que o próprio Francisco declarou dá sua
  naturalidade como Villa do Rio Claro (CIV-0007). A declaração de 1915 é a mais antiga e a
  mais bem informada, e prevalece; a declaração de informante de 1964 fica registrada, não
  resolvida. À parte disso, a entrada estruturada de lugar deste repositório para a Villa do
  Rio Claro (PL-0008) a registra no estado do Rio de Janeiro, enquanto a trilha de pesquisa
  deste perfil pressupõe Rio Claro, São Paulo; as duas não foram reconciliadas. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus seis filhos — o registro
  âncora: nomeia ele, a esposa, os pais dele e os pais dela) · CIV-0018 (óbito de 1991 da
  filha Maria Aurora — o nomeia como pai) · CIV-0022 (nascimento de 1930 da neta Cidália —
  o nomeia como avô materno) · CIV-0033 (óbito de 1992 do filho João José, em Volta Redonda —
  o nomeia como pai) · CIV-0049 (óbito de 1964 do filho José Sobrinho, em Califórnia, Paraná —
  o nomeia como pai) · CIV-0050 (óbito de 1982 do filho Sebastião José, em Jacarezinho, Paraná
  — o nomeia como pai).

  ## Contexto regional e migratório

  Ele encarna a mudança interna da família da Vila do Rio Claro para a fronteira de
  Carangola (Zona da Mata Mineira), a zona cafeeira de abertura tardia que atraiu famílias
  de descendência imigrante após 1888. [CONTEXTUAL] Sua nacionalidade brasileira decorre
  do jus soli, por seu nascimento no Rio Claro, não do sobrenome.

