profile: >-
  ## Identity

  **Francisco José de Carvalho Guimarães** [PROVEN]. A Brazilian-born farmer of the
  Carvalho Guimarães family — the pivot between this line's Portuguese origin (his father
  was Portuguese) and its settlement on the Zona da Mata Mineira.

  - **Born:** native of Vila do Rio Claro [PROVEN as stated] (CIV-0007); date not recorded.

  - **Parents:** Vicente José de Carvalho Guimarães (P-0023), Portuguese, and Maria
  Tertuliana da Conceição (P-0024) [PROVEN as reported] — named in CIV-0007.

  - **Marriage:** to Emmerenciana Maria de Jesus (P-0022) [PROVEN] (CIV-0007, CIV-0018,
  CIV-0022).

  - **Children:** six, all born at the Fazenda do Barroso, São Francisco do Glória, and
  registered together by him in 1915 (CIV-0007): José (1901), Maria Amora / Aurora (P-0011,
  1904), Maria da Conceição (1906), Sebastião José (1909), João José (1912) and Maria de
  Lourdes (1915). [PROVEN]

  - **Death:** before 1991 (his daughter Maria Aurora's 1991 death names him, CIV-0018);
  date and place not held. [INFERRED]

  ## Standing and profession

  - **Lavrador (farmer)** resident at São Francisco do Glória, Carangola (MG), in 1915
  [PROVEN] — CIV-0007 describes him and his wife collectively as "lavradores"; he was the
  declarant of his six children's retrospective birth registrations under the 1914 amnesty
  decree.

  - **Possible Guarda Nacional Alferes, Carangola, 1897** [LEAD] — an uncatalogued
  retrieval lead (a transcribed 1897 militia roll) lists a "Francisco José de Carvalho
  Guimarães" as Alferes alongside several same-surname officers who may be his brothers;
  not confirmed against a primary record.

  ## Family and social network

  Son of a Portuguese immigrant (Vicente) and a Rio-Claro-born mother, he anchored the
  family in the Carangola coffee interior, where his daughter Maria Aurora married into
  the Engracio-Souza line (P-0010). [PROVEN]

  ## Open questions

  - His and Emmerenciana's marriage record, and his own birth and death records — not
  held; would confirm his parents and possibly his father's Portuguese parish. [OPEN]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of his six children — the anchor record:
  names him, his wife, his parents and her parents) · CIV-0018 (daughter Maria Aurora's
  1991 death — names him as her father) · CIV-0022 (granddaughter Cidália's 1930 birth —
  names him as maternal grandfather).

  ## Regional and migration context

  He embodies the family's internal move from Vila do Rio Claro to the Carangola frontier
  (Zona da Mata Mineira), the late-opening coffee zone that drew immigrant-descended
  families after 1888. [CONTEXTUAL] His Brazilian nationality follows jus soli from his
  Rio Claro birth, not the surname.
profile_pt: >-
  ## Identidade

  **Francisco José de Carvalho Guimarães** [PROVEN]. Lavrador nascido no Brasil, da
  família Carvalho Guimarães — o elo entre a origem portuguesa desta linhagem (seu pai era
  português) e seu estabelecimento na Zona da Mata Mineira.

  - **Nascimento:** natural da Vila do Rio Claro [PROVEN conforme declarado] (CIV-0007);
  data não registrada.

  - **Pais:** Vicente José de Carvalho Guimarães (P-0023), português, e Maria Tertuliana
  da Conceição (P-0024) [PROVEN conforme declarado] — nomeados em CIV-0007.

  - **Casamento:** com Emmerenciana Maria de Jesus (P-0022) [PROVEN] (CIV-0007, CIV-0018,
  CIV-0022).

  - **Filhos:** seis, todos nascidos na Fazenda do Barroso, São Francisco do Glória, e
  registrados por ele em conjunto em 1915 (CIV-0007): José (1901), Maria Amora / Aurora
  (P-0011, 1904), Maria da Conceição (1906), Sebastião José (1909), João José (1912) e
  Maria de Lourdes (1915). [PROVEN]

  - **Óbito:** antes de 1991 (o óbito de 1991 de sua filha Maria Aurora o nomeia,
  CIV-0018); data e local não obtidos. [INFERRED]

  ## Posição social e profissão

  - **Lavrador** residente em São Francisco do Glória, Carangola (MG), em 1915 [PROVEN] —
  CIV-0007 descreve o casal coletivamente como "lavradores"; foi o declarante dos
  registros retroativos de nascimento de seus seis filhos, ao amparo do decreto de anistia
  de 1914.

  - **Possível Alferes da Guarda Nacional, Carangola, 1897** [LEAD] — uma pista de
  recuperação não catalogada (transcrição de uma relação da milícia de 1897) lista um
  "Francisco José de Carvalho Guimarães" como Alferes, junto a vários oficiais de mesmo
  sobrenome que podem ser seus irmãos; não confirmado por registro primário.

  ## Família e rede social

  Filho de um imigrante português (Vicente) e de mãe nascida no Rio Claro, fixou a família
  no interior cafeeiro de Carangola, onde sua filha Maria Aurora casou-se com a linhagem
  Engracio-Souza (P-0010). [PROVEN]

  ## Questões em aberto

  - Seu casamento com Emmerenciana e seus próprios registros de nascimento e óbito — não
  obtidos; confirmariam seus pais e, possivelmente, a freguesia portuguesa de seu pai.
  [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus seis filhos — o registro
  âncora: nomeia ele, a esposa, os pais dele e os pais dela) · CIV-0018 (óbito de 1991 da
  filha Maria Aurora — o nomeia como pai) · CIV-0022 (nascimento de 1930 da neta Cidália —
  o nomeia como avô materno).

  ## Contexto regional e migratório

  Ele encarna a mudança interna da família da Vila do Rio Claro para a fronteira de
  Carangola (Zona da Mata Mineira), a zona cafeeira de abertura tardia que atraiu famílias
  de descendência imigrante após 1888. [CONTEXTUAL] Sua nacionalidade brasileira decorre
  do jus soli, por seu nascimento no Rio Claro, não do sobrenome.
