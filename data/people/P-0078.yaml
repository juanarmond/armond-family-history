profile: >-
  ## Interesting facts

  - **[PROVEN]** He is documented in three primary records across two continents — his 1728 Ruivais baptism (PAR-0035), his 1751 Borda do Campo marriage (PAR-0034) and his daughter Ritta's 1764 Barbacena baptism (PAR-0049) — which makes him the best-sourced ancestor in the Toledo maternal line.

  - **[PROVEN]** His 1751 marriage was witnessed by **Coronel Joseph Lopes de Oliveira** and Ignacio Rodrigues Guimaraens; thirteen years later the godmother at his daughter's baptism was **Maria, daughter of José Lopes de Oliveira** (PAR-0049). The same house stood beside this family twice, a decade apart. For a Portuguese immigrant of about twenty-three, having the district's Coronel witness his wedding is the single clearest measure of the footing he had gained.

  - **[INFERRED]** The 1751 vicar first wrote him "natural desta freguesia" — a local — then struck it out and corrected to "de Ruvans do Arceb.o de Braga". The slip is informative twice over: Portuguese immigrants were common enough at the Borda do Campo that a scribe assumed it, and someone at the ceremony cared enough to have the correction registered.

  - **[INFERRED]** Thirteen years after the wedding, his daughter's baptism still records him as "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga". He was still identified by his home parish more than a decade into his Brazilian life.

  - **[CONTEXTUAL]** He came from the Minho, Portugal's densest and most land-fragmented region (~96 inhabitants/km² by 1801, among Europe's highest rural densities) — a minifúndio landscape that produced more 18th-century emigrants to Brazil than any other Portuguese region, because non-inheriting sons had nothing to wait for.

  ## Identity

  **João Rodrigues Valle** (also *João Roiz Valle* — "Roiz" being the customary abbreviation of "Rodrigues" — and, as an infant, *Joam Rodrigues*). The "Valle" derives from the family's *lugar*, the quinta do Vale in Ruivais. Portuguese. Father of Ritta Angélica Rodrigues (P-0058) and so 2nd-great-grandfather of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line (chain: Eliza < José Cezário de Toledo Lima < Ladisláo < Ritta < João).

  - **Birth and baptism:** born 15 April 1728 and baptised 16 April 1728 at the Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal — [PROVEN] from the original Ruivais baptism register (PAR-0035; E-0071).

  - **Parents:** legitimate son of João Rodrigues [Valle] (P-0080) × Joana Gonçalves (P-0081), of Ruivais — family F-0039 [PROVEN for the baptism entry; the identification of those parents with the 1716 Ruivais marriage couple is strong-evidence].

  - **Marriage:** emigrated to Minas Gerais and married Isabel Ribeiro (P-0079) on 22 February 1751 at the Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) — [PROVEN] from the certified transcript of the act (PAR-0034; E-0070; family F-0038).

  - **Death:** no record located. [OPEN]

  ## Standing and profession

  - **Documented Portuguese immigrant [PROVEN].** The 1751 act corrects itself explicitly: "foi equivocação do R.do Vigar.o dizer que João Roiz Valle h.[om]em desta freg.a pois h.[om]em de Ruvans do Arceb.o de Braga" — a contemporaneous statement of his Ruivais (Braga) origin, corroborated by his 1728 baptism and independently repeated in his daughter's 1764 baptism.

  - **No rank, office, trade or property is stated for him in any held record.** He married at twenty-two, in a parish not his own, and no document ever styles him. [OPEN] *A retrieval research profile calls him "Capitão"; no held record does, and the title most plausibly belongs to his son Capitão José Rodrigues Valle. Not adopted here.* [LEAD — not supported by any held source]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record. His 1728 baptism carries the priest's and witnesses' hands, not his; his marriage certidão is a modern transcript that reproduces the officiant's signature clause, not the groom's.

  - **What the records do show is the company he kept.** A Coronel as marriage witness (1751) and that Coronel's family as baptismal godparents (1764) is the standing — a documented tie to the top of the local militia hierarchy, sustained across thirteen years.

  ## Family and social network

  - **Wife:** Isabel Ribeiro (P-0079), "natural e baptizada nesta freguesia" of the Borda do Campo — the local half of a cross-Atlantic couple.

  - **Daughter (our line):** Ritta Angélica Rodrigues (P-0058) [PROVEN], who married Joaquim José Ferreira de Toledo (P-0057). Ritta's 1764 Barbacena baptism (PAR-0049; E-0076) names him her father, so the P-0078 → P-0058 link is primary, no longer the earlier strong-evidence name-match; her 1783 marriage independently names her parents "João Rodrigues [do Valle] e Izabel Ribeira" (PAR-0018).

  - **His documented FAN circle:** Coronel Joseph Lopes de Oliveira and Ignacio Rodrigues Guimaraens as marriage witnesses (1751); Silvestre de Lima, *solteiro*, and Maria, daughter of José Lopes de Oliveira, as his daughter's godparents (1764) — the same Lopes de Oliveira house on both occasions. [PROVEN] The second witness's name, "Rodrigues Guimaraens", carries both his own patronymic and a Minho toponym, which is suggestive of a fellow countryman or a kinsman but proves neither. [INFERRED]

  - **A documented collateral Valle branch** [José PROVEN; the sibling link STRONG-secondary]. A retrieval finding holds a primary 1852 inventário of Capitão José Rodrigues Valle (⚭ Anna Querobina de São José, Fazenda Boa Ventura, Termo de Mar de Espanha) naming his widow and ten children. That José was João's son and Ritta's brother rests on a secondary genealogy — the inventário does not name his parents — so the attachment to our line is a strong lead, not confirmed. [LEAD for the link]

  - A retrieval finding ties his line to a "Fazenda do Contramestre" (Barbacena) with a 1750 senzala inscription; the estate attribution is an unverified tree/site lead our sources do not carry, and whether the estate was his or a descendant's is unpinned. [LEAD]

  ## What we can extrapolate

  - **He is the man standing on the seam between two inheritance regimes, and that is the whole story of his life** [CONTEXTUAL / INFERRED]. In the Minho, a smallholding *casa* was in practice kept intact for one heir — the freely disposable third let a family favour a single child — so the surplus sons of a quinta got a blessing and a road. In Brazil, succession was fully partible: every child took an equal share. He left a system that would give him nothing and entered one that would divide whatever he built. Emigration, for a younger son of Ruivais, was not adventure; it was the only way to be a first heir of something.

  - **His standing was earned by crossing and cemented by marrying local** [INFERRED]. He arrived with no land, no rank and no kin. Within a few years he had married a woman born and baptised in the parish, which gave him at one stroke the thing an immigrant cannot buy — local belonging, in-laws, and standing among neighbours. The vicar's slip in 1751, writing him down as a local before being corrected, is the measure of how quickly that worked.

  - **The FAN network is the only honest measure of his rise, and it is a good one** [PROVEN]. No deed, no rank, no inventário survives for him. But a Coronel witnessed his marriage and that Coronel's daughter held his child at the font. Patronage of that kind was not extended downward indefinitely; a man with a Coronel at his wedding was a man with something — probably land, possibly a claim, certainly credit in the parish.

  - **The class arc across his own life and the next generation is upward, and fast** [INFERRED]. Son of a Ruivais couple whose only recorded distinction is a *lugar*-name; emigrant at about twenty; married into a local family at twenty-two; his daughter baptised with the Coronel's daughter as godmother; that daughter married in 1783 to the son of a Capitão. Two generations from a Minho quinta to the Barbacena gentry. The mechanism was migration plus marriage, not inheritance and not office — the exact inverse of the Armond paternal line, which later fell by holding offices that paid nothing and standing on no land.

  - **Education had no part in it** [CONTEXTUAL]. Schooling in 18th-century rural Portugal and colonial Minas was a purchased, class-linked privilege; nothing suggests he had it, nothing required him to sign, and nothing indicates he bought it for his children. What this family transmitted upward was connection and marriage, not letters — which is why the literacy question first becomes answerable two or three generations later, on the Toledo side.

  - **He carries the Toledo line's deepest sourced ancestry** [INFERRED]. With his parents' 1716 Ruivais marriage (PAR-0036) and his own 1728 baptism both held, this branch reaches documented early-18th-century Portugal — the only genuinely multi-generational, primary-sourced depth on the maternal Toledo side, and, since Ritta's 1764 baptism, securely attached to our tree.

  ## Open questions

  - His **death record** remains unlocated. His identity, origin and the Ritta link are already fixed by primary records. [OPEN]

  - Any document of his means — a sesmaria, a deed, an inventário, a militia roll. Nothing of the kind is held, and until something is, his standing rests entirely on who stood beside him at two ceremonies. [OPEN]

  - Whether the Fazenda do Contramestre was his or a descendant's. [LEAD]

  ## Sources held (this repository)

  - PAR-0035 (1728 Ruivais baptism — his birth and parents) · PAR-0034 (1751 Borda do Campo marriage certidão — his marriage, his Portuguese origin and the Coronel witness) · PAR-0036 (1716 Ruivais marriage of his parents).

  - PAR-0049 (1764 Barbacena baptism of his daughter Ritta — names him her father, records his Ruivães origin and the Lopes de Oliveira godmother; the primary that makes the P-0078 → P-0058 link direct) · PAR-0018 (1783 Barbacena marriage of his daughter Ritta — corroborates the child link).

  ## Regional and migration context

  Born in São Martinho de Ruivais, in the Minho highlands of the Arcebispado de Braga, he emigrated to the Campo das Vertentes of Minas Gerais and settled in the Borda do Campo (Barbacena) district. [CONTEXTUAL] His move fits the large 18th-century Minho → Minas Gerais stream into the gold-and-then-agriculture economy — the same north-west-Portuguese current that seeded much of the free-colonist population around Barbacena. No record states his personal motive. [CONTEXTUAL] The Minho was Portugal's densest, most land-fragmented region — a smallholding minifúndio at ~96 inhabitants per km² by 1801 — so surplus non-inheriting sons had no holding to wait for, making it the single greatest source of 18th-century Portuguese emigration to Brazil; his Atlantic crossing fell under the Provisão de 20 de março de 1720 passport regime (D. João V), imposed to stem the gold-rush exodus. [CONTEXTUAL]

  ## Where to go today

  - **Baptism (15 April 1728):** Igreja de São Martinho de Ruivães, Vieira do Minho, Braga, Portugal (Av. de São Martinho 3896, 4850-341 Ruivães) [DOCUMENTED-addr / RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)

  - **Marriage (1751) — Brazilian seat:** Catedral Basílica de Nossa Senhora da Piedade, Barbacena (Borda do Campo), MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele está documentado em três registros primários em dois continentes — seu batismo em Ruivais, em 1728 (PAR-0035), seu casamento na Borda do Campo, em 1751 (PAR-0034), e o batismo de sua filha Ritta em Barbacena, em 1764 (PAR-0049) —, o que faz dele o ancestral mais bem documentado da linha materna Toledo.

  - **[PROVEN]** Seu casamento de 1751 teve por testemunhas o **Coronel Joseph Lopes de Oliveira** e Ignacio Rodrigues Guimaraens; treze anos depois, a madrinha no batismo de sua filha foi **Maria, filha de José Lopes de Oliveira** (PAR-0049). A mesma casa esteve ao lado desta família duas vezes, com uma década de intervalo. Para um imigrante português de cerca de vinte e três anos, ter o Coronel do distrito como testemunha de casamento é a medida mais clara do terreno que havia conquistado.

  - **[INFERRED]** O vigário de 1751 escreveu-o primeiro como "natural desta freguesia" — um local — e depois riscou e corrigiu para "de Ruvans do Arceb.o de Braga". O lapso informa duas vezes: imigrantes portugueses eram comuns o bastante na Borda do Campo para que um escrivão o presumisse, e alguém na cerimônia se importou o suficiente para que a correção fosse lavrada.

  - **[INFERRED]** Treze anos após o casamento, o batismo de sua filha ainda o registra como "natural da freguesia de São Martinho de Ruivães, Arcebispado de Braga". Ele continuava identificado por sua paróquia de origem mais de uma década depois de instalado no Brasil.

  - **[CONTEXTUAL]** Veio do Minho, a região mais densa e mais fragmentada em terra de Portugal (~96 habitantes/km² em 1801, entre as maiores densidades rurais da Europa) — uma paisagem de minifúndio que produziu mais emigrantes setecentistas para o Brasil do que qualquer outra região portuguesa, porque os filhos não herdeiros nada tinham a esperar.

  ## Identidade

  **João Rodrigues Valle** (também *João Roiz Valle* — sendo "Roiz" a abreviatura corrente de "Rodrigues" — e, quando criança, *Joam Rodrigues*). O "Valle" deriva do *lugar* da família, a quinta do Vale em Ruivais. Português. Pai de Ritta Angélica Rodrigues (P-0058) e, portanto, trisavô de Eliza Balbina de Toledo (P-0017) na linha materna Toledo (cadeia: Eliza < José Cezário de Toledo Lima < Ladisláo < Ritta < João).

  - **Nascimento e batismo:** nascido em 15 de abril de 1728 e batizado em 16 de abril de 1728 na Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal — [PROVEN] pelo registro original de batismos de Ruivais (PAR-0035; E-0071).

  - **Pais:** filho legítimo de João Rodrigues [Valle] (P-0080) × Joana Gonçalves (P-0081), de Ruivais — família F-0039 [PROVEN quanto ao assento de batismo; a identificação desses pais com o casal do casamento de 1716 em Ruivais é evidência forte].

  - **Casamento:** emigrou para Minas Gerais e casou-se com Isabel Ribeiro (P-0079) em 22 de fevereiro de 1751 na Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) — [PROVEN] pelo traslado certificado do ato (PAR-0034; E-0070; família F-0038).

  - **Óbito:** nenhum registro localizado. [OPEN]

  ## Posição social e profissão

  - **Imigrante português documentado [PROVEN].** O ato de 1751 se corrige explicitamente: "foi equivocação do R.do Vigar.o dizer que João Roiz Valle h.[om]em desta freg.a pois h.[om]em de Ruvans do Arceb.o de Braga" — declaração contemporânea de sua origem em Ruivais (Braga), corroborada por seu batismo de 1728 e repetida de modo independente no batismo de sua filha em 1764.

  - **Nenhuma patente, ofício, ocupação ou propriedade lhe é atribuída em registro disponível.** Casou-se aos vinte e dois anos, em freguesia que não era a sua, e nenhum documento jamais o trata por título. [OPEN] *Um perfil de pesquisa da recuperação o chama de "Capitão"; nenhum registro disponível o faz, e o título pertence muito plausivelmente a seu filho, o Capitão José Rodrigues Valle. Não adotado aqui.* [LEAD — sem apoio em qualquer fonte disponível]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro assinável disponível. Seu batismo de 1728 traz a mão do padre e das testemunhas, não a sua; sua certidão de casamento é traslado moderno que reproduz a cláusula de assinatura do celebrante, não a do noivo.

  - **O que os registros de fato mostram é a companhia que ele tinha.** Um Coronel como testemunha de casamento (1751) e a família desse Coronel como padrinhos de batismo (1764) são a posição social — um vínculo documentado com o topo da hierarquia miliciana local, sustentado por treze anos.

  ## Família e rede social

  - **Esposa:** Isabel Ribeiro (P-0079), "natural e baptizada nesta freguesia" da Borda do Campo — a metade local de um casal transatlântico.

  - **Filha (nossa linha):** Ritta Angélica Rodrigues (P-0058) [PROVEN], casada com Joaquim José Ferreira de Toledo (P-0057). O batismo de Ritta em Barbacena, em 1764 (PAR-0049; E-0076), o nomeia pai dela, de modo que o vínculo P-0078 → P-0058 é primário, e não mais a correspondência de nomes de evidência forte anterior; o casamento dela em 1783 nomeia independentemente os pais, "João Rodrigues [do Valle] e Izabel Ribeira" (PAR-0018).

  - **Seu círculo FAN documentado:** o Coronel Joseph Lopes de Oliveira e Ignacio Rodrigues Guimaraens como testemunhas de casamento (1751); Silvestre de Lima, *solteiro*, e Maria, filha de José Lopes de Oliveira, como padrinhos de sua filha (1764) — a mesma casa Lopes de Oliveira nas duas ocasiões. [PROVEN] O nome da segunda testemunha, "Rodrigues Guimaraens", carrega tanto o patronímico dele quanto um topônimo minhoto, o que sugere conterrâneo ou parente, mas não prova nenhum dos dois. [INFERRED]

  - **Um ramo colateral Valle documentado** [José PROVEN; o vínculo fraterno FORTE-secundário]. Um achado da recuperação guarda um inventário primário de 1852 do Capitão José Rodrigues Valle (⚭ Anna Querobina de São José, Fazenda Boa Ventura, Termo de Mar de Espanha), nomeando sua viúva e dez filhos. Que esse José fosse filho de João e irmão de Ritta apoia-se numa genealogia secundária — o inventário não nomeia os pais dele —, de modo que a ligação à nossa linha é pista forte, não confirmada. [LEAD quanto ao vínculo]

  - Um achado da recuperação liga sua linha a uma "Fazenda do Contramestre" (Barbacena), com inscrição de senzala de 1750; a atribuição da propriedade é pista não verificada de árvore/sítio que nossas fontes não sustentam, e não se sabe se a fazenda era dele ou de um descendente. [LEAD]

  ## O que podemos extrapolar

  - **Ele é o homem na costura entre dois regimes de herança, e é essa a história inteira de sua vida** [CONTEXTUAL / INFERRED]. No Minho, uma *casa* de pequena propriedade era, na prática, mantida íntegra para um único herdeiro — o terço de livre disposição permitia favorecer um filho —, de modo que os filhos excedentes de uma quinta recebiam uma bênção e uma estrada. No Brasil, a sucessão era plenamente partível: cada filho tomava parte igual. Ele deixou um sistema que nada lhe daria e entrou em outro que dividiria tudo o que construísse. Emigrar, para um filho mais novo de Ruivais, não era aventura; era a única forma de ser o primeiro herdeiro de alguma coisa.

  - **Sua posição foi conquistada ao atravessar e cimentada ao casar com uma local** [INFERRED]. Chegou sem terra, sem patente e sem parentela. Em poucos anos havia casado com uma mulher nascida e batizada na freguesia, o que lhe deu de uma só vez aquilo que um imigrante não compra — pertencimento local, sogros e posição entre vizinhos. O lapso do vigário em 1751, que o lançou como natural dali antes de ser corrigido, é a medida da rapidez com que isso funcionou.

  - **A rede FAN é a única medida honesta de sua ascensão, e é uma boa medida** [PROVEN]. Nenhuma escritura, patente ou inventário seu sobreviveu. Mas um Coronel testemunhou seu casamento e a filha desse Coronel levou sua filha à pia. Patrocínio desse tipo não se estendia indefinidamente para baixo; um homem com um Coronel em seu casamento era um homem com alguma coisa — provavelmente terra, possivelmente uma data, certamente crédito na freguesia.

  - **O arco de classe em sua própria vida e na geração seguinte é ascendente, e rápido** [INFERRED]. Filho de um casal de Ruivais cuja única distinção registrada é um nome de *lugar*; emigrante por volta dos vinte; casado com uma família local aos vinte e dois; sua filha batizada com a filha do Coronel por madrinha; essa filha casada em 1783 com o filho de um Capitão. Duas gerações de uma quinta minhota à gente de posses de Barbacena. O mecanismo foi migração mais casamento, não herança nem ofício — exatamente o inverso da linha paterna Armond, que mais tarde caiu por exercer ofícios que nada pagavam sem terra alguma por baixo.

  - **A educação não teve parte nisso** [CONTEXTUAL]. A escolarização no Portugal rural setecentista e nas Minas coloniais era privilégio comprado e ligado à classe; nada sugere que a tivesse, nada exigiu que assinasse e nada indica que a tenha comprado para os filhos. O que esta família transmitiu para cima foi vínculo e casamento, não letras — razão pela qual a questão da alfabetização só se torna respondível duas ou três gerações depois, do lado Toledo.

  - **Ele carrega a ascendência documentada mais profunda da linha Toledo** [INFERRED]. Com o casamento de seus pais em Ruivais em 1716 (PAR-0036) e seu próprio batismo de 1728 ambos disponíveis, este ramo alcança o Portugal documentado do início do século XVIII — a única profundidade genuinamente multigeracional e de fonte primária no lado materno Toledo e, desde o batismo de Ritta em 1764, seguramente ligada à nossa árvore.

  ## Questões em aberto

  - Seu **registro de óbito** permanece não localizado. Sua identidade, sua origem e o vínculo com Ritta já estão fixados por fontes primárias. [OPEN]

  - Qualquer documento de seus meios — sesmaria, escritura, inventário, lista de mostra miliciana. Nada disso está disponível e, até que algo esteja, sua posição social se apoia inteiramente em quem esteve ao seu lado em duas cerimônias. [OPEN]

  - Se a Fazenda do Contramestre era dele ou de um descendente. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0035 (batismo em Ruivais, 1728 — seu nascimento e seus pais) · PAR-0034 (certidão de casamento na Borda do Campo, 1751 — seu casamento, sua origem portuguesa e a testemunha Coronel) · PAR-0036 (casamento de seus pais em Ruivais, 1716).

  - PAR-0049 (batismo de sua filha Ritta em Barbacena, 1764 — nomeia-o pai, registra sua origem em Ruivães e a madrinha Lopes de Oliveira; a fonte primária que torna direto o vínculo P-0078 → P-0058) · PAR-0018 (casamento de sua filha Ritta em Barbacena, 1783 — corrobora o vínculo filial).

  ## Contexto regional e migratório

  Nascido em São Martinho de Ruivais, nas terras altas do Minho, no Arcebispado de Braga, emigrou para o Campo das Vertentes de Minas Gerais e estabeleceu-se no distrito da Borda do Campo (Barbacena). [CONTEXTUAL] Sua mudança se encaixa na grande corrente setecentista Minho → Minas Gerais rumo à economia do ouro e, depois, da agricultura — a mesma corrente do noroeste português que povoou boa parte da população colona livre em torno de Barbacena. Nenhum registro declara seu motivo pessoal. [CONTEXTUAL] O Minho era a região mais densa e mais fragmentada em terra de Portugal — minifúndio de ~96 habitantes por km² em 1801 —, de modo que os filhos excedentes não herdeiros não tinham posse a esperar, o que o tornou a maior fonte isolada da emigração portuguesa setecentista para o Brasil; sua travessia atlântica caiu sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V), imposta para conter o êxodo da corrida do ouro. [CONTEXTUAL]

