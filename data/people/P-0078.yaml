notes:
- text: >-
    Portuguese-born ancestor of the maternal Toledo line. Baptized 16 April 1728
    (born 15 April 1728) at the Freguesia de São Martinho de Ruivais, Arcebispado
    de Braga, Portugal (PAR-0035), legitimate son of João Rodrigues [Valle] (P-0080)
    and Joana Gonçalves (P-0081), family F-0039. He emigrated to Minas Gerais and
    married Isabel Ribeiro (P-0079) on 22 February 1751 at the Matriz de Nossa
    Senhora da Piedade da Borda do Campo (Barbacena), family F-0038 (PAR-0034).
  text_pt: >-
    Ancestral nascido em Portugal da linha materna Toledo. Batizado em 16 de
    abril de 1728 (nascido em 15 de abril de 1728) na Freguesia de São Martinho
    de Ruivais, Arcebispado de Braga, Portugal (PAR-0035), filho legítimo de João
    Rodrigues [Valle] (P-0080) e Joana Gonçalves (P-0081), família F-0039. Ele
    emigrou para Minas Gerais e casou-se com Isabel Ribeiro (P-0079) em 22 de
    fevereiro de 1751 na Matriz de Nossa Senhora da Piedade da Borda do Campo
    (Barbacena), família F-0038 (PAR-0034).
- text: >-
    Father of Ritta Angélica Rodrigues (P-0058), who married Joaquim José Ferreira de
    Toledo (P-0057); hence a direct maternal-line ancestor of Eliza Balbina de Toledo
    (P-0017). The link P-0078 → P-0058 rests on PAR-0018 (Ritta's own marriage naming
    her parents "João Rodrigues [do Valle] e Izabel Ribeira") identified with the
    PAR-0034 couple — strong-evidence, not certain (common names).
  text_pt: >-
    Pai de Ritta Angélica Rodrigues (P-0058), que se casou com Joaquim José
    Ferreira de Toledo (P-0057); portanto, um ancestral direto da linha materna
    de Eliza Balbina de Toledo (P-0017). A ligação P-0078 → P-0058 baseia-se em
    PAR-0018 (o próprio casamento de Ritta nomeando seus pais "João Rodrigues [do
    Valle] e Izabel Ribeira"), identificado com o casal de PAR-0034 — evidência
    forte, não certa (nomes comuns).
- text: >-
    Nationality Portuguese: born and baptized at Ruivais, Braga, Portugal (PAR-0035),
    a documented foreign birthplace; the 1751 marriage certidão (PAR-0034) corrects
    an initial "natural desta freguezia" to "h.em de Ruvans do Arceb.o de Braga".
    No death record located.
  text_pt: >-
    Nacionalidade portuguesa: nascido e batizado em Ruivais, Braga, Portugal
    (PAR-0035), um local de nascimento estrangeiro documentado; a certidão de
    casamento de 1751 (PAR-0034) corrige um inicial "natural desta freguezia"
    para "h.em de Ruvans do Arceb.o de Braga". Nenhum registro de óbito
    localizado.
