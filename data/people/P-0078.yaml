profile: >-
  ## Identity

  **João Rodrigues Valle** (also *João Roiz Valle* — "Roiz" being the customary
  abbreviation of "Rodrigues" — and, as an infant, *Joam Rodrigues*). The "Valle"
  surname derives from the family's *lugar*, the quinta do Vale in Ruivais. Portuguese.

  - **Birth/baptism:** born 15 April 1728 and baptised 16 April 1728 at the Freguesia de
  São Martinho de Ruivais, Arcebispado de Braga, Portugal — [PROVEN] from the original
  Ruivais baptism register (PAR-0035; E-0071).

  - **Parents:** legitimate son of João Rodrigues [Valle] (P-0080) × Joana Gonçalves
  (P-0081), of Ruivais — family F-0039 [PROVEN via the strong-evidence identification of
  the 1728 baptism parents with the 1716 Ruivais marriage couple].

  - **Marriage:** emigrated to Minas Gerais and married Isabel Ribeiro (P-0079) on 22
  February 1751 at the Matriz de Nossa Senhora da Piedade da Borda do Campo (Barbacena) —
  [PROVEN] from the certified transcript of the marriage act (PAR-0034; E-0070; family
  F-0038).

  - **Death:** no record located. [OPEN]

  ## Standing and profession

  - **Documented Portuguese immigrant [PROVEN].** The 1751 marriage act first wrote him
  "natural desta freguezia" and then corrected itself: "foi equivocação do R.do Vigar.o
  dizer que João Roiz Valle h.[om]em desta freg.a pois h.[om]em de Ruvans do Arceb.o de
  Braga" — an explicit contemporaneous statement of his Ruivais (Braga) origin,
  corroborated by his 1728 baptism.

  ## Family and social network

  - **Father of Ritta Angélica Rodrigues (P-0058)** [strong-evidence], who married
  Joaquim José Ferreira de Toledo (P-0057). Ritta's own 1783 Barbacena marriage names
  her parents "João Rodrigues [do Valle] e Izabel Ribeira" (PAR-0018); identifying that
  couple with this couple — same names, same Borda do Campo parish, consistent timeline —
  is strong, not certain. Through Ritta he is a direct maternal-line ancestor of Eliza
  Balbina de Toledo (P-0017).

  - His marriage grafted the Portuguese Rodrigues/Valle line onto the maternal Toledo
  trunk. [PROVEN for the marriage; strong-evidence for the graft via P-0058]

  ## What we can extrapolate

  - **He carries the Toledo line's deepest sourced ancestry [INFERRED].** With his
  parents' 1716 Ruivais marriage (PAR-0036) and his 1728 baptism (PAR-0035) both held,
  this branch reaches documented early-18th-century Portugal — the only genuinely
  multi-generational, primary-sourced depth on the maternal Toledo side.

  - **A documented collateral Valle branch** [José PROVEN; sibling link to Rita
  STRONG-secondary]. A retrieval finding holds a primary 1852 inventário of Capitão José
  Rodrigues Valle (⚭ Anna Querobina de São José, Fazenda Boa Ventura, Termo de Mar de Espanha),
  naming his widow and ten children — a whole Valle collateral branch at primary level. That
  José was João's son / Rita's brother rests on a secondary genealogy (the inventário does not
  name his parents), so the attachment to our line is a strong lead, not confirmed. [LEAD for the link]

  - The retrieval synthesis (older than our records) still treats his Portuguese origin
  and the Ritta link as unproven blog leads and ties his line to a "Fazenda do
  Contramestre" with a 1750 senzala inscription; that estate attribution is an unverified
  tree/site lead our sources do not carry. [LEAD]

  ## Open questions

  - His **death record**, and true-primary confirmation of the Ritta link (ideally
  Ritta's own ~1760s Barbacena baptism), remain open; the marriage act and baptism
  already fix his identity and origin. [OPEN]

  ## Sources held (this repository)

  - PAR-0035 (1728 Ruivais baptism — his birth and parents) · PAR-0034 (1751 Borda do
  Campo marriage certidão — his marriage and Portuguese origin) · PAR-0036 (1716 Ruivais
  marriage of his parents).

  - PAR-0018 (1783 Barbacena marriage of his daughter Ritta — the strong-evidence
  child link).

  ## Regional and migration context

  Born in São Martinho de Ruivais, in the Minho highlands of the Arcebispado de Braga, he
  emigrated to the Campo das Vertentes of Minas Gerais and settled in the Borda do Campo
  (Barbacena) district. [CONTEXTUAL] His move fits the large 18th-century Minho
  (north-west Portugal) → Minas Gerais stream into the gold-and-then-agriculture economy
  — the same north-west-Portuguese current that seeded much of the free-colonist
  population around Barbacena. No record states his personal motive. [CONTEXTUAL] The Minho
  was Portugal's densest, most land-fragmented region — a smallholding minifúndio at ~96
  inhabitants per km² by 1801, among Europe's highest rural densities — so surplus
  non-inheriting sons had no holding to inherit, making it the single greatest source of
  18th-century Portuguese emigration to Brazil; his Atlantic crossing fell under the Provisão
  de 20 de março de 1720 passport regime (D. João V), imposed to stem the gold-rush exodus.
  [CONTEXTUAL]

  ## Where to go today

  - **Baptism (15 April 1728):** Igreja de São Martinho de Ruivães, Vieira do Minho,
  Braga, Portugal (Av. de São Martinho 3896, 4850-341 Ruivães)
  [DOCUMENTED-addr / RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)

  - **Marriage (1751) — Brazilian seat:** Catedral Basílica de Nossa Senhora da
  Piedade, Barbacena (Borda do Campo), MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Identidade

  **João Rodrigues Valle** (também *João Roiz Valle* — sendo "Roiz" a abreviatura
  costumeira de "Rodrigues" — e, como criança, *Joam Rodrigues*). O sobrenome "Valle"
  deriva do *lugar* da família, a quinta do Vale em Ruivais. Português.

  - **Nascimento/batismo:** nascido em 15 de abril de 1728 e batizado em 16 de abril de
  1728 na Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal — [PROVEN]
  pelo registro original de batismo de Ruivais (PAR-0035; E-0071).

  - **Pais:** filho legítimo de João Rodrigues [Valle] (P-0080) × Joana Gonçalves
  (P-0081), de Ruivais — família F-0039 [PROVEN via a identificação de evidência forte
  dos pais do batismo de 1728 com o casal do casamento de Ruivais de 1716].

  - **Casamento:** emigrou para Minas Gerais e casou-se com Isabel Ribeiro (P-0079) em 22
  de fevereiro de 1751 na Matriz de Nossa Senhora da Piedade da Borda do Campo
  (Barbacena) — [PROVEN] pelo traslado certificado do assento de casamento (PAR-0034;
  E-0070; família F-0038).

  - **Óbito:** nenhum registro localizado. [OPEN]

  ## Posição social e profissão

  - **Imigrante português documentado [PROVEN].** O assento de casamento de 1751
  escreveu-o primeiro como "natural desta freguezia" e depois corrigiu-se: "foi
  equivocação do R.do Vigar.o dizer que João Roiz Valle h.[om]em desta freg.a pois
  h.[om]em de Ruvans do Arceb.o de Braga" — uma declaração explícita e contemporânea de
  sua origem em Ruivais (Braga), corroborada por seu batismo de 1728.

  ## Família e rede social

  - **Pai de Ritta Angélica Rodrigues (P-0058)** [evidência forte], que se casou com
  Joaquim José Ferreira de Toledo (P-0057). O próprio casamento de Ritta em Barbacena, por
  volta de 1786, nomeia seus pais "João Rodrigues [do Valle] e Izabel Ribeira" (PAR-0018);
  identificar esse casal com este casal — mesmos nomes, mesma freguesia da Borda do Campo,
  cronologia consistente — é forte, não certo. Por meio de Ritta, ele é ancestral direto,
  pela linha materna, de Eliza Balbina de Toledo (P-0017).

  - Seu casamento enxertou a linha portuguesa Rodrigues/Valle no tronco materno Toledo.
  [PROVEN para o casamento; evidência forte para o enxerto via P-0058]

  ## O que podemos extrapolar

  - **Ele carrega a ancestralidade documentada mais profunda da linha Toledo [INFERRED].**
  Com o casamento de 1716 de seus pais em Ruivais (PAR-0036) e seu batismo de 1728
  (PAR-0035) ambos em mãos, este ramo alcança o Portugal documentado do início do século
  XVIII — a única profundidade genuinamente multigeracional e de fonte primária do lado
  materno Toledo.

  - **Um ramo colateral Valle documentado** [José PROVEN; a ligação fraterna com Rita é
  STRONG-secundária]. Um achado de recuperação mantém um inventário primário de 1852 do Capitão
  José Rodrigues Valle (⚭ Anna Querobina de São José, Fazenda Boa Ventura, Termo de Mar de
  Espanha), nomeando sua viúva e dez filhos — todo um ramo colateral Valle em nível primário.
  Que José fosse filho de João / irmão de Rita apoia-se numa genealogia secundária (o inventário
  não nomeia seus pais), de modo que a vinculação à nossa linha é uma pista forte, não
  confirmada. [LEAD quanto à ligação]

  - A síntese de recuperação (mais antiga que nossos registros) ainda trata sua origem
  portuguesa e a ligação com Ritta como pistas de blog não comprovadas e associa sua linha
  a uma "Fazenda do Contramestre" com uma inscrição na senzala de 1750; essa atribuição de
  fazenda é uma pista de árvore/local não verificada que nossas fontes não carregam.
  [LEAD]

  ## Questões em aberto

  - Seu **registro de óbito** e a confirmação verdadeiramente primária da ligação com
  Ritta (idealmente o próprio batismo de Ritta em Barbacena por volta de 1760) permanecem
  em aberto; o assento de casamento e o batismo já fixam sua identidade e origem. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0035 (batismo de 1728 em Ruivais — seu nascimento e seus pais) · PAR-0034
  (certidão de casamento de 1751 na Borda do Campo — seu casamento e origem portuguesa) ·
  PAR-0036 (casamento de 1716 em Ruivais de seus pais).

  - PAR-0018 (casamento de sua filha Ritta em Barbacena por volta de 1786 — a ligação
  filial de evidência forte).

  ## Contexto regional e migratório

  Nascido em São Martinho de Ruivais, nas terras altas do Minho do Arcebispado de Braga,
  emigrou para o Campo das Vertentes de Minas Gerais e estabeleceu-se no distrito da Borda
  do Campo (Barbacena). [CONTEXTUAL] Sua mudança enquadra-se na grande corrente
  setecentista do Minho (noroeste de Portugal) → Minas Gerais rumo à economia do ouro e
  depois da agricultura — a mesma corrente do noroeste português que semeou boa parte da
  população de colonos livres em torno de Barbacena. Nenhum registro declara seu motivo
  pessoal. [CONTEXTUAL] O Minho era a região mais densa e mais fragmentada em terra de
  Portugal — um minifúndio de pequenas propriedades, ~96 habitantes por km² em 1801, entre as
  maiores densidades rurais da Europa — de modo que os filhos excedentes não herdeiros não
  tinham propriedade a herdar, o que fez dele a maior fonte isolada de emigração portuguesa
  setecentista para o Brasil; sua travessia atlântica caiu sob o regime de passaportes da
  Provisão de 20 de março de 1720 (D. João V), imposto para conter o êxodo da corrida do ouro.
  [CONTEXTUAL]

