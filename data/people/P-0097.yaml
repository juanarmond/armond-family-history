profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named once, in her son Jacob's 1825 Nova Friburgo marriage register:
  "filho legitimo de João Bohrer e da sua mulher Barbara Probst" (PAR-0059). A Swiss mother
  who never crossed the Atlantic, recorded in a Brazilian colonial parish book because her son
  did.

  - **[PROVEN / CORRECTION 2026-09-23]** The parish the same act gives — "Erswill" — is
  **Beinwil**, not Erschwil. The Staatsarchiv Solothurn (C-011) searched the Erschwil Catholic
  registers in full without finding this Borer family: a bounded negative that closes Erschwil
  and leaves the Beinwil books unsearched.

  - **[PROVEN]** Her surname travelled even though she did not: a **"João Probst"** signed as
  a witness at her son's 1825 wedding — a Probst present in the colony while the Borer
  parental generation was not. His exact relationship to her is undocumented. [PROVEN that a
  Probst witnessed; the kinship OPEN]

  - **[CONTEXTUAL]** Probst, like Borer and Wehrli, is one of the small stock of surnames that
  recur across the Solothurn Jura parishes and then again among the Nova Friburgo founding
  families — the marriage pool was narrow at both ends of the crossing.

  ## Identity

  **Barbara Probst** — a Swiss woman of the Canton of Solothurn, known solely as the mother of
  the Nova Friburgo immigrant Jacob Bohrer (P-0050). [PROVEN]

  - **Identification:** named in her son Jacob's 1825 Nova Friburgo marriage register as the
  wife of João Borer and mother of the groom [PROVEN — PAR-0059].

  - **Home parish:** **Beinwil**, Canton Solothurn — the act's "Erswill" read through the
  2026-09-23 archival correction (C-011), which closed Erschwil as a bounded negative. No
  Beinwil record is yet held. [PROVEN for the canton; the Beinwil resolution rests on that
  correction]

  - **Birth, marriage, death, own parents:** none held. [OPEN] A Nova Friburgo colonist
  compilation reports that she and her husband were both dead in Switzerland before the 1819
  departure [LEAD].

  ## Standing and profession

  Nothing is documented — no occupation, property, office, title or literacy. The single act
  that names her attests only that she was married to João Borer and that their son was born
  of that marriage. [PROVEN for the marriage and the legitimacy; everything else OPEN]

  ## Family and social network

  - **Husband:** João Borer (P-0096); family F-0047 — the deepest couple reached on this
  branch, attested by one primary record. [PROVEN — PAR-0059]

  - **Son:** Jacob Bohrer (P-0050), the 1819 emigrant; through him the line reaches Francisco
  José Bohrer, Joaquim José Bohrer, Celina Bohrer and Iris Bohrer.

  - **A Probst in the colony:** the marriage witness João Probst is the one sign that her side
  of the family was represented at Nova Friburgo. Whether he was her brother, nephew or
  unrelated namesake is not recorded. [OPEN]

  ## What we can extrapolate

  - **Her surname is the only capital that reached Brazil [INFERRED].** The household
  transmitted no land, money or office — nothing in any record suggests it had any to give.
  What did cross was the network: a Probst standing as witness at her son's wedding meant an
  orphaned young colonist had someone in the colony who knew his family. In a settlement where
  the state subsidy expired after two years, that kind of connection was worth more than a
  Jura inheritance share would have been.

  - **The Jura's partible division is why her son is the one who moved [CONTEXTUAL].**
  Solothurn smallholdings were divided among heirs until the shares could not feed a
  household. Emigration was the release valve, and it selected exactly her son's position:
  young, with a share too small to stay for. She stayed because the system pushed out the
  young, not the old.

  - **She sits at the bottom of the arc and the record proves nothing else [CONTEXTUAL /
  INFERRED].** A Catholic Jura peasant household, never elite, with nothing heritable: this is
  the floor the Bohrer trajectory is measured from, and the exact inverse of the family's
  Armond line, which began at an office-and-marriage elite and fell. Any rise on this side —
  the colony lot, the literate son in the next century, the town trade after that — belongs to
  her descendants' generations, not to hers. The evidence here is one line in one register,
  and the profile should not pretend to more.

  ## Open questions

  - **The Beinwil parish registers** (Kantonsarchiv / Staatsarchiv Solothurn) — her marriage
  to João Borer, her son Jacob's baptism, and her own baptism and burial. Erschwil is a closed
  bounded negative (C-011, 2026-09-23) and should not be re-searched. [OPEN]

  - **The witness João Probst** — identifying him in the Nova Friburgo colonist registers
  would show whether her family was present in the colony and in what relation. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of her son Jacob Bohrer — names Barbara Probst, wife
  of João Borer, as Jacob's mother; a João Probst appears as witness).

  ## Regional and migration context

  She belongs to the Catholic, German-speaking Solothurn Jura, poor upland farming country
  where holdings were divided among heirs until there was too little land to go round.
  [CONTEXTUAL] The 1816 "Year Without a Summer" famine, post-Napoleonic poverty and that
  chronic land hunger were the push; Dom João VI's *Decreto de 16 de maio de 1818* —
  contracting 100 Swiss **Catholic** families for the Fazenda do Morro Queimado — was the
  pull. Recruitment overshot to some 261–265 families, and about a quarter of the colonists
  died at sea. She did not travel; her son did. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (all records unsearched):** the Catholic parish of **Beinwil (SO), Canton
  Solothurn, Switzerland** — the corrected target after the Erschwil bounded negative. [OPEN]
  · [Maps](https://maps.google.com/?q=Beinwil+SO+Switzerland)

  - **Where she is named:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É nomeada uma única vez, no registro de casamento de seu filho Jacob, em Nova
  Friburgo, em 1825: "filho legitimo de João Bohrer e da sua mulher Barbara Probst"
  (PAR-0059). Uma mãe suíça que nunca cruzou o Atlântico, registrada num livro paroquial
  colonial brasileiro porque o filho cruzou.

  - **[PROVEN / CORREÇÃO 2026-09-23]** A freguesia que o mesmo ato dá — "Erswill" — é
  **Beinwil**, não Erschwil. O Staatsarchiv Solothurn (C-011) buscou integralmente nos livros
  católicos de Erschwil sem encontrar esta família Borer: negativa delimitada que encerra
  Erschwil e deixa os livros de Beinwil por buscar.

  - **[PROVEN]** O sobrenome dela viajou ainda que ela não: um **"João Probst"** assinou como
  testemunha no casamento do filho em 1825 — um Probst presente na colônia enquanto a geração
  parental Borer não estava. A relação exata dele com ela não está documentada. [PROVEN que um
  Probst testemunhou; o parentesco OPEN]

  - **[CONTEXTUAL]** Probst, como Borer e Wehrli, é um dos poucos sobrenomes que se repetem
  pelas freguesias do Jura de Solothurn e depois outra vez entre as famílias fundadoras de
  Nova Friburgo — o repertório matrimonial era estreito nas duas pontas da travessia.

  ## Identidade

  **Barbara Probst** — mulher suíça do Cantão de Soleure (Solothurn), conhecida exclusivamente
  como mãe do imigrante de Nova Friburgo Jacob Bohrer (P-0050). [PROVEN]

  - **Identificação:** nomeada no registro de casamento de 1825 de seu filho Jacob, em Nova
  Friburgo, como esposa de João Borer e mãe do noivo [PROVEN — PAR-0059].

  - **Freguesia de origem:** **Beinwil**, Cantão de Solothurn — o "Erswill" do ato lido à luz
  da correção arquivística de 2026-09-23 (C-011), que encerrou Erschwil como negativa
  delimitada. Nenhum registro de Beinwil está disponível ainda. [PROVEN quanto ao cantão; a
  resolução Beinwil apoia-se nessa correção]

  - **Nascimento, casamento, óbito, pais:** nenhum disponível. [OPEN] Uma compilação de
  colonos de Nova Friburgo relata que ela e o marido já estavam mortos na Suíça antes da
  partida de 1819 [LEAD].

  ## Posição social e profissão

  Nada está documentado — nenhuma ocupação, propriedade, cargo, título ou alfabetização. O
  único ato que a nomeia atesta apenas que era casada com João Borer e que o filho nasceu
  desse casamento. [PROVEN quanto ao casamento e à legitimidade; todo o resto OPEN]

  ## Família e rede social

  - **Marido:** João Borer (P-0096); família F-0047 — o casal mais profundo alcançado neste
  ramo, atestado por um registro primário. [PROVEN — PAR-0059]

  - **Filho:** Jacob Bohrer (P-0050), o emigrante de 1819; por ele a linha chega a Francisco
  José Bohrer, Joaquim José Bohrer, Celina Bohrer e Iris Bohrer.

  - **Um Probst na colônia:** a testemunha João Probst é o único sinal de que o lado dela
  estava representado em Nova Friburgo. Se era irmão, sobrinho ou homônimo sem parentesco, não
  está registrado. [OPEN]

  ## O que podemos extrapolar

  - **Seu sobrenome é o único capital que chegou ao Brasil [INFERRED].** O domicílio não
  transmitiu terra, dinheiro nem cargo — nada em registro algum sugere que tivesse o que dar.
  O que atravessou foi a rede: um Probst servindo de testemunha no casamento do filho
  significava que um jovem colono órfão tinha, na colônia, alguém que conhecia sua família.
  Num assentamento em que o subsídio estatal expirava em dois anos, esse tipo de vínculo valia
  mais do que teria valido um quinhão de herança no Jura.

  - **A divisão partível do Jura é a razão de o filho ser quem se mudou [CONTEXTUAL].** Os
  minifúndios de Solothurn eram divididos entre herdeiros até os quinhões não alimentarem um
  domicílio. A emigração era a válvula de escape, e selecionava exatamente a posição do filho
  dela: jovem, com um quinhão pequeno demais para ficar. Ela permaneceu porque o sistema
  expulsava os jovens, não os velhos.

  - **Ela está no fundo do arco, e o registro não prova mais do que isso [CONTEXTUAL /
  INFERRED].** Um domicílio camponês católico do Jura, nunca de elite, sem nada herdável: este
  é o piso a partir do qual se mede a trajetória Bohrer, e o inverso exato da linha Armond da
  família, que partiu de uma elite de cargo e casamento e caiu. Qualquer ascensão deste lado —
  o lote colonial, o filho alfabetizado no século seguinte, o comércio urbano depois —
  pertence às gerações de seus descendentes, não à dela. A evidência aqui é uma linha num
  livro, e o perfil não deve fingir mais do que isso.

  ## Questões em aberto

  - **Os livros paroquiais de Beinwil** (Kantonsarchiv / Staatsarchiv Solothurn) — seu
  casamento com João Borer, o batismo do filho Jacob e seu próprio batismo e sepultamento.
  Erschwil é negativa delimitada encerrada (C-011, 2026-09-23) e não deve ser rebuscada.
  [OPEN]

  - **A testemunha João Probst** — identificá-lo nos registros de colonos de Nova Friburgo
  mostraria se a família dela estava presente na colônia e em que grau de parentesco. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, do filho Jacob Bohrer — nomeia Barbara
  Probst, esposa de João Borer, como mãe de Jacob; um João Probst aparece como testemunha).

  ## Contexto regional e migratório

  Pertence ao Jura católico e germanófono de Solothurn, terra pobre de lavoura de planalto
  onde as posses eram divididas entre herdeiros até faltar terra para todos. [CONTEXTUAL] A
  fome do "Ano Sem Verão" de 1816, a pobreza pós-napoleônica e essa fome crônica de terra
  foram o empurrão; o *Decreto de 16 de maio de 1818* de Dom João VI — contratando 100
  famílias suíças **católicas** para a Fazenda do Morro Queimado — foi a atração. O
  recrutamento excedeu para cerca de 261–265 famílias, e cerca de um quarto dos colonos morreu
  no mar. Ela não viajou; o filho, sim. [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de origem (todos os registros por buscar):** a paróquia católica de **Beinwil
  (SO), Cantão de Solothurn, Suíça** — o alvo corrigido após a negativa delimitada de
  Erschwil. [OPEN] · [Maps](https://maps.google.com/?q=Beinwil+SO+Switzerland)

  - **Onde ela é nomeada:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
