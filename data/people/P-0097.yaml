profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "Barbara Probst" in her son Jacob's 1825 Nova Friburgo marriage register (PAR-0059) as wife of João Borer, of Erschwil, Canton Solothurn — a Swiss mother documented through a Brazilian church record six years after Nova Friburgo was founded, known from a single entry.

  - **[CONTEXTUAL]** She remained in Switzerland while her son Jacob crossed to Brazil in the 1818–1820 Swiss recruitment wave — the typical generational split of the Nova Friburgo emigration, where parents aged out of the colonial venture stayed in Erschwil while sending young adult children to the Serra Fluminense highlands.

  - **[INFERRED]** A "João Probst" appeared as a witness at her son's 1825 Nova Friburgo marriage — a probable Probst kinsman who did make the emigration — suggesting the Probst network overlapped with the Borer network in Erschwil and may have emigrated in the same cohort, maintaining family-kin ties in the new colony.

  - **[CONTEXTUAL]** The Probst surname is documented alongside Borer and Wehrli in the Canton Solothurn district — the same limited name pool from Erschwil/Grindel that supplied several Nova Friburgo founding families. Her son Jacob's marriage to Catharina Moser (daughter of a Hägendorf/Solothurn family) connected two different Solothurn lines in the colony.

  ## Identity

  **Barbara Probst** — a Swiss woman of Erschwil, Canton Solothurn, known solely as the mother
  of the Nova Friburgo immigrant Jacob Bohrer (P-0050). [PROVEN]

  - **Identification:** named in her son Jacob's 1825 Nova Friburgo marriage register as wife of
  João Borer and mother of the groom, "filho legitimo de João Bohrer e da sua mulher Barbara
  Probst" (PAR-0059). [PROVEN]

  ## Family

  She and João Borer (P-0096; family F-0047) are the deepest reached couple on the Bohrer maternal
  line, attested by a single primary record. [PROVEN — PAR-0059] A João Probst — a probable
  Probst kinsman — is listed among the marriage witnesses, suggesting the surname was also
  represented in the Nova Friburgo colony. [PROVEN — PAR-0059; exact relationship undocumented]
  Barbara herself presumably remained in Switzerland. [INFERRED/CONTEXTUAL]

  ## Open questions

  - Birth, marriage and death dates; her own parentage — all unreached. The Erschwil Catholic
  parish registers (Thierstein district; FS catalog 544541, freely accessible online) are the
  primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of son Jacob Bohrer — names Barbara Probst, wife of
  João Borer, as Jacob's mother; a João Probst appears as witness).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada "Barbara Probst" no registro de casamento de Nova Friburgo de 1825 de seu filho Jacob (PAR-0059) como esposa de João Borer, de Erschwil, Cantão de Soleure — uma mãe suíça documentada por meio de um registro de igreja brasileiro seis anos após a fundação de Nova Friburgo, conhecida por um único assento.

  - **[CONTEXTUAL]** Permaneceu na Suíça enquanto seu filho Jacob cruzou para o Brasil na onda de recrutamento suíço de 1818–1820 — a típica divisão geracional da emigração de Nova Friburgo, em que pais que passaram da idade para a aventura colonial ficaram em Erschwil enquanto enviavam filhos adultos jovens para as serras fluminenses.

  - **[INFERRED]** Um "João Probst" apareceu como testemunha no casamento de seu filho em Nova Friburgo em 1825 — um provável parente Probst que fez a emigração — sugerindo que a rede Probst se sobrepunha à rede Borer em Erschwil e pode ter emigrado na mesma coorte, mantendo laços de parentesco na nova colônia.

  - **[CONTEXTUAL]** O sobrenome Probst está documentado ao lado de Borer e Wehrli no distrito do Cantão de Solothurn — o mesmo repertório limitado de nomes de Erschwil/Grindel que forneceu várias das famílias fundadoras de Nova Friburgo. O filho Jacob casou-se com Catharina Moser (filha de uma família de Hägendorf/Solothurn), conectando duas linhas de Solothurn na colônia.

  ## Identidade

  **Barbara Probst** — mulher suíça de Erschwil, Cantão de Soleure (Solothurn), conhecida
  exclusivamente como mãe do imigrante de Nova Friburgo Jacob Bohrer (P-0050). [PROVEN]

  - **Identificação:** nomeada no registro de casamento de 1825 de seu filho Jacob, em Nova
  Friburgo, como esposa de João Borer e mãe do noivo, "filho legitimo de João Bohrer e da sua
  mulher Barbara Probst" (PAR-0059). [PROVEN]

  ## Família

  Ela e João Borer (P-0096; família F-0047) são o casal mais profundo alcançado na linha materna
  Bohrer, atestados por um único registro primário. [PROVEN — PAR-0059] Um João Probst — provável
  parente Probst — figura entre as testemunhas do casamento, sugerindo que o sobrenome também estava
  representado na colônia de Nova Friburgo. [PROVEN — PAR-0059; relação exata não documentada] A
  própria Barbara presumivelmente permaneceu na Suíça. [INFERRED/CONTEXTUAL]

  ## Questões em aberto

  - Datas de nascimento, casamento e falecimento; própria filiação — todas não alcançadas. Os
  registros paroquiais católicos de Erschwil (distrito de Thierstein; catálogo FS 544541,
  livremente acessível online) são o principal alvo de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, do filho Jacob Bohrer — nomeia Barbara Probst,
  esposa de João Borer, como mãe de Jacob; um João Probst aparece como testemunha).
