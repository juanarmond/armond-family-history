profile: >-
  ## Identity

  **Barbara Probst** — a Swiss woman of Erschwil, Canton Solothurn, known solely as the mother
  of the Nova Friburgo immigrant Jacob Bohrer (P-0050). [PROVEN]

  - **Identification:** named in her son Jacob's 1825 Nova Friburgo marriage register as wife of
  João Borer and mother of the groom, "filho legitimo de João Bohrer e da sua mulher Barbara
  Probst" (PAR-0059). [PROVEN]

  ## Family

  She and João Borer (P-0096; family F-0047) are the deepest reached couple on the Bohrer paternal
  line, attested by a single primary record. [PROVEN — PAR-0059] A João Probst — a probable
  Probst kinsman — is listed among the marriage witnesses, suggesting the surname was also
  represented in the Nova Friburgo colony. [PROVEN — PAR-0059; exact relationship undocumented]
  Barbara herself presumably remained in Switzerland. [INFERRED/CONTEXTUAL]

  ## Open questions

  - Birth, marriage and death dates; her own parentage — all unreached. The Erschwil Catholic
  parish registers (Thierstein district; FS catalog 544541, freely accessible online) are the
  primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of son Jacob Bohrer — names Barbara Probst, wife of
  João Borer, as Jacob's mother; a João Probst appears as witness).
profile_pt: >-
  ## Identidade

  **Barbara Probst** — mulher suíça de Erschwil, Cantão de Soleure (Solothurn), conhecida
  exclusivamente como mãe do imigrante de Nova Friburgo Jacob Bohrer (P-0050). [PROVEN]

  - **Identificação:** nomeada no registro de casamento de 1825 de seu filho Jacob, em Nova
  Friburgo, como esposa de João Borer e mãe do noivo, "filho legitimo de João Bohrer e da sua
  mulher Barbara Probst" (PAR-0059). [PROVEN]

  ## Família

  Ela e João Borer (P-0096; família F-0047) são o casal mais profundo alcançado na linha paterna
  Bohrer, atestados por um único registro primário. [PROVEN — PAR-0059] Um João Probst — provável
  parente Probst — figura entre as testemunhas do casamento, sugerindo que o sobrenome também estava
  representado na colônia de Nova Friburgo. [PROVEN — PAR-0059; relação exata não documentada] A
  própria Barbara presumivelmente permaneceu na Suíça. [INFERRED/CONTEXTUAL]

  ## Questões em aberto

  - Datas de nascimento, casamento e falecimento; própria filiação — todas não alcançadas. Os
  registros paroquiais católicos de Erschwil (distrito de Thierstein; catálogo FS 544541,
  livremente acessível online) são o principal alvo de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, do filho Jacob Bohrer — nomeia Barbara Probst,
  esposa de João Borer, como mãe de Jacob; um João Probst aparece como testemunha).
