notes:
  - text: Ahnentafel position 11.
  - text: >-
      Resolves material conflict 10. Both name forms are preserved and proven to be
      one woman: the 1915 retrospective birth registration (CIV-0007) records
      "Maria Amora", while her own 1991 death (CIV-0018), her marriage (CIV-0002)
      and the family roster (REC-0001) record "Maria Aurora"; both forms name the
      identical parents (Francisco José de Carvalho Guimarães + Emerenciana Maria
      de Jesus). Preferred name set to "Maria Aurora" on 2026-07-30: three sources
      — including her own death record — use it, against a single retrospective,
      certified-copy birth registration that most likely mis-transcribed the
      unusual "Amora" for the common name "Aurora". (Consistent with the same
      choice for P-0015 Celina/Selina.)
  - text: >-
      Died 15 September 1991 at Rio de Janeiro, aged 87 (so born c.1904, matching
      her 1904 birth, E-0007), a widow of Antonio Engracio Filho, per her civil
      death (CIV-0018).
