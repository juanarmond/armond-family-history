notes:
  - text: >-
      Ahnentafel position 11.
    text_pt: >-
      Posição 11 no Ahnentafel.
  - text: >-
      Resolves material conflict 10. Both name forms are preserved and proven to be
      one woman: the 1915 retrospective birth registration (CIV-0007) records
      "Maria Amora", while her own 1991 death (CIV-0018), her marriage (CIV-0002)
      and the family roster (REC-0001) record "Maria Aurora"; both forms name the
      identical parents (Francisco José de Carvalho Guimarães + Emerenciana Maria
      de Jesus). Preferred name set to "Maria Aurora" on 2026-07-30: three sources
      — including her own death record — use it, against a single retrospective,
      certified-copy birth registration that most likely mis-transcribed the
      unusual "Amora" for the common name "Aurora". (Consistent with the same
      choice for P-0015 Celina/Selina.)
    text_pt: >-
      Resolve o conflito material 10. Ambas as formas de nome são preservadas e
      comprovadas como sendo a mesma mulher: o registro retroativo de nascimento
      de 1915 (CIV-0007) registra "Maria Amora", enquanto seu próprio óbito de 1991
      (CIV-0018), seu casamento (CIV-0002) e a lista familiar (REC-0001) registram
      "Maria Aurora"; ambas as formas identificam os mesmos pais (Francisco José de
      Carvalho Guimarães + Emerenciana Maria de Jesus). Nome preferido definido como
      "Maria Aurora" em 30/07/2026: três fontes — incluindo seu próprio registro de
      óbito — o utilizam, contra um único registro retroativo em certidão de nascimento
      que provavelmente transcreveu "Amora" no lugar do nome comum "Aurora". (Coerente
      com a mesma escolha para P-0015 Celina/Selina.)
  - text: >-
      Died 15 September 1991 at Rio de Janeiro, aged 87 (so born c.1904, matching
      her 1904 birth, E-0007), a widow of Antonio Engracio Filho, per her civil
      death (CIV-0018).
    text_pt: >-
      Falecida em 15 de setembro de 1991 no Rio de Janeiro, com 87 anos (portanto
      nascida c.1904, compatível com seu nascimento em 1904, E-0007), viúva de
      Antonio Engracio Filho, conforme seu óbito civil (CIV-0018).
