notes:
  - text: Ahnentafel position 11.
  - text: >-
      Resolves material conflict 10. The 1915 retrospective birth registration
      (CIV-0007) names her Maria Amora Guimarães; her own 1991 civil death
      (CIV-0018) names her Maria Aurora Guimarães. Both are preserved, and both
      name the identical parents (Francisco José de Carvalho Guimarães +
      Emerenciana Maria de Jesus), proving the two forms are one woman. The
      preferred name is kept as the birth-registration form, Maria Amora.
  - text: >-
      Died 15 September 1991 at Rio de Janeiro, aged 87 (so born c.1904, matching
      her 1904 birth, E-0007), a widow of Antonio Engracio Filho, per her civil
      death (CIV-0018).
