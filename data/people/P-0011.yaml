profile: >-
  ## Identity

  Recorded as **Maria Aurora Guimarães** on her daughter Cidalia's 1952 marriage
  certificate (CIV-0002), her own 1991 death (CIV-0018) and the owner's family roster
  (REC-0001), and as **Maria Amora Guimarães** in the 1915 collective birth registration
  (CIV-0007). Both forms name the identical parents, proving they are one woman; the
  preferred form "Maria Aurora" is used by three sources, including her own death record,
  against the single retrospective 1915 registration that most likely mis-transcribed the
  common name "Aurora" as "Amora". [PROVEN]

  - **Birth:** 1 January 1904, Minas Gerais [PROVEN] — the 1915 collective registration
  records her born 1 January 1904 at the Fazenda do Barroso, district of São Francisco do
  Glória (Carangola) (CIV-0007); the same date appears on the 1952 marriage certificate
  (CIV-0002) and is corroborated by her age of 87 at her 1991 death (CIV-0018). Registered
  retrospectively in 1915, so treat the exact day with mild caution.

  - **Parents:** Francisco José de Carvalho Guimarães (P-0021) and Emerenciana Maria de
  Jesus (P-0022) [PROVEN] — named on her 1991 death (CIV-0018) and the 1915 registration
  (CIV-0007, spelled "Emmerenciana"), and confirmed by Cidalia's 1930 birth registration,
  which names them as maternal grandparents (CIV-0022).

  - **Marriage:** married Antonio Engracio Filho (P-0010); widowed by 1964 and recorded
  "viúva de Antonio Engracio Filho" at her death [PROVEN] (CIV-0018, CIV-0002, CIV-0017).

  - **Children:** five surviving adult children at her 1991 death (CIV-0018), six at her
  husband's 1964 death (CIV-0017), so one predeceased her. Named: her daughter Cidalia
  (P-0005, CIV-0022) and her son Werner Engracio Guimarães (CIV-0017). [PROVEN]

  - **Death:** 15 September 1991 at Rio de Janeiro (rua David Campista 326, a hospital;
  registered 16 September, óbito nº 63.792, livro 386-C), aged 87; buried at the Cemitério
  São Francisco Xavier. [PROVEN] (CIV-0018)

  ## Standing and profession

  - **Do lar** (homemaker) at her 1991 death [PROVEN] (CIV-0018). Her death record adds
  that she "não deixou bens", was not an *eleitor*, and left no known will. [PROVEN]

  ## Family and social network

  She carries the Carvalho-Guimarães surname into her union with Antonio Engracio Filho;
  her half of their children's double surname *Engracio Guimarães* is her line. [PROVEN]
  (CIV-0018, CIV-0022)

  The 1915 collective registration (CIV-0007) records her as the second of six children
  her father registered together at the Fazenda do Barroso: José (b. 8 November 1901),
  Maria Aurora/Amora herself (b. 1 January 1904), Maria da Conceição (b. 8 September 1906),
  Sebastião José (b. 2 June 1909), João José (b. 16 December 1912) and Maria de Lourdes
  (b. 24 June 1915). [PROVEN]

  Her father's parents are recorded in CIV-0007 as Vicente José de Carvalho Guimarães,
  described as *portuguez* and died at Carangola, and Maria Tertuliana da Conceição; her
  mother's parents as Antonio Francisco da Silva and Maria Paula de Jesus. The label
  "portuguez" supplies nationality only and cannot by itself establish a Portuguese
  district, municipality, island or parish. [PROVEN — nationality only]

  The informant at her 1991 death was a grandson; his personal identifiers are withheld
  here as he may be living. [PROVEN] (CIV-0018)

  ## What we can extrapolate

  Minas-born in 1904 into the Carvalho-Guimarães family rooted around Carangola (Fazenda do
  Barroso, São Francisco do Glória, CIV-0007), she married the merchant Antonio Engracio
  Filho, and the household migrated to Rio de Janeiro, where she lived out a long widowhood
  of roughly 27 years (1964–1991). [INFERRED]

  She died on 15 September 1991 — the same day of the year as her daughter Cidalia's
  birthday (15 September 1930, CIV-0022). This is a coincidence of dates, flagged to
  prevent future confusion, not a data error. [PROVEN — dates]

  ## Open questions

  - Her birth/baptism record (c.1 January 1904, Carangola region) — would independently
  confirm her parents and pin the parish. [OPEN]

  - Her parents' marriage (Francisco José de Carvalho Guimarães × Emerenciana Maria de
  Jesus). [OPEN]

  ## Sources held (this repository)

  - CIV-0018 (her 1991 civil death — date, age 87, do lar, widow of Antonio Engracio
  Filho, parents, five adult children, burial at São Francisco Xavier) · CIV-0007 (1915
  collective birth registration — her 1 January 1904 birth as "Maria Amora", her five
  siblings, and her grandparents).

  - CIV-0002 (her daughter Cidalia's 1952 marriage — name form "Maria Aurora", birth
  1 January 1904) · CIV-0022 (Cidalia's 1930 birth registration — names her as mother and
  her parents as maternal grandparents) · CIV-0017 (her husband's 1964 death — "casado com
  Maria Aurora Guimarães", six adult children).

  - REC-0001 (owner's family roster — anchored this ancestor; secondary, [LEAD]).

  ## Regional and migration context

  Her life traces the Zona da Mata Mineira → Rio de Janeiro path: born in 1904 into the
  Carvalho-Guimarães family of the Carangola region (CIV-0007) and married to the merchant
  Antonio Engracio Filho, she moved with the household to Rio de Janeiro, where she died in
  1991 (CIV-0018). Her paternal line had itself reached the Carangola region from the
  "Villa do Rio Claro", the birthplace recorded for her father in 1915 (CIV-0007). The
  mid-century move to the capital fits the decline of the Zona da Mata coffee economy and
  the rural-to-urban exodus of the period. [CONTEXTUAL] No held record states her personal
  motive.
profile_pt: >-
  ## Identidade

  Registrada como **Maria Aurora Guimarães** na certidão de casamento de 1952 de sua filha
  Cidalia (CIV-0002), em seu próprio óbito de 1991 (CIV-0018) e na lista familiar do
  proprietário (REC-0001), e como **Maria Amora Guimarães** no registro coletivo de
  nascimento de 1915 (CIV-0007). Ambas as formas nomeiam os pais idênticos, provando que
  são a mesma mulher; a forma preferida "Maria Aurora" é usada por três fontes, inclusive
  seu próprio registro de óbito, contra o único registro retroativo de 1915 que
  provavelmente transcreveu erroneamente o nome comum "Aurora" como "Amora". [PROVEN]

  - **Nascimento:** 1 de janeiro de 1904, Minas Gerais [PROVEN] — o registro coletivo de
  1915 a registra nascida em 1 de janeiro de 1904 na Fazenda do Barroso, distrito de São
  Francisco do Glória (Carangola) (CIV-0007); a mesma data aparece na certidão de casamento
  de 1952 (CIV-0002) e é corroborada por sua idade de 87 anos ao óbito em 1991 (CIV-0018).
  Registrada retroativamente em 1915, então trate o dia exato com leve cautela.

  - **Pais:** Francisco José de Carvalho Guimarães (P-0021) e Emerenciana Maria de Jesus
  (P-0022) [PROVEN] — nomeados em seu óbito de 1991 (CIV-0018) e no registro de 1915
  (CIV-0007, grafado "Emmerenciana"), e confirmados pelo registro de nascimento de 1930 de
  Cidalia, que os nomeia como avós maternos (CIV-0022).

  - **Casamento:** casou-se com Antonio Engracio Filho (P-0010); viúva em 1964 e registrada
  como "viúva de Antonio Engracio Filho" em seu óbito [PROVEN] (CIV-0018, CIV-0002,
  CIV-0017).

  - **Filhos:** cinco filhos adultos sobreviventes ao seu óbito em 1991 (CIV-0018), seis ao
  óbito de seu marido em 1964 (CIV-0017), de modo que um faleceu antes dela. Nomeados: sua
  filha Cidalia (P-0005, CIV-0022) e seu filho Werner Engracio Guimarães (CIV-0017).
  [PROVEN]

  - **Óbito:** 15 de setembro de 1991 no Rio de Janeiro (rua David Campista 326, um
  hospital; registrado em 16 de setembro, óbito nº 63.792, livro 386-C), aos 87 anos;
  sepultada no Cemitério São Francisco Xavier. [PROVEN] (CIV-0018)

  ## Posição social e profissão

  - **Do lar** (dona de casa) em seu óbito de 1991 [PROVEN] (CIV-0018). Seu registro de
  óbito acrescenta que "não deixou bens", não era eleitora e não deixou testamento
  conhecido. [PROVEN]

  ## Família e rede social

  Ela carrega o sobrenome Carvalho-Guimarães para sua união com Antonio Engracio Filho; sua
  metade do sobrenome duplo *Engracio Guimarães* dos filhos do casal é a linha dela.
  [PROVEN] (CIV-0018, CIV-0022)

  O registro coletivo de 1915 (CIV-0007) a registra como a segunda de seis filhos que seu
  pai registrou juntos na Fazenda do Barroso: José (n. 8 de novembro de 1901), a própria
  Maria Aurora/Amora (n. 1 de janeiro de 1904), Maria da Conceição (n. 8 de setembro de
  1906), Sebastião José (n. 2 de junho de 1909), João José (n. 16 de dezembro de 1912) e
  Maria de Lourdes (n. 24 de junho de 1915). [PROVEN]

  Os pais de seu pai são registrados em CIV-0007 como Vicente José de Carvalho Guimarães,
  descrito como *portuguez* e falecido em Carangola, e Maria Tertuliana da Conceição; os
  pais de sua mãe como Antonio Francisco da Silva e Maria Paula de Jesus. O rótulo
  "portuguez" fornece apenas a nacionalidade e não pode, por si só, estabelecer um
  distrito, município, ilha ou paróquia portugueses. [PROVEN — apenas nacionalidade]

  O declarante em seu óbito de 1991 foi um neto; seus dados pessoais são omitidos aqui,
  pois ele pode estar vivo. [PROVEN] (CIV-0018)

  ## O que podemos extrapolar

  Nascida em Minas em 1904, na família Carvalho-Guimarães enraizada em torno de Carangola
  (Fazenda do Barroso, São Francisco do Glória, CIV-0007), ela se casou com o comerciante
  Antonio Engracio Filho, e a casa migrou para o Rio de Janeiro, onde viveu uma longa
  viuvez de cerca de 27 anos (1964–1991). [INFERRED]

  Faleceu em 15 de setembro de 1991 — o mesmo dia do ano do aniversário de sua filha
  Cidalia (15 de setembro de 1930, CIV-0022). Trata-se de uma coincidência de datas,
  sinalizada para evitar confusão futura, não de um erro de dados. [PROVEN — datas]

  ## Questões em aberto

  - Seu registro de nascimento/batismo (c.1 de janeiro de 1904, região de Carangola) —
  confirmaria de forma independente seus pais e fixaria a paróquia. [OPEN]

  - O casamento de seus pais (Francisco José de Carvalho Guimarães × Emerenciana Maria de
  Jesus). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0018 (seu óbito civil de 1991 — data, idade 87, do lar, viúva de Antonio Engracio
  Filho, pais, cinco filhos adultos, sepultamento em São Francisco Xavier) · CIV-0007
  (registro coletivo de nascimento de 1915 — seu nascimento em 1 de janeiro de 1904 como
  "Maria Amora", seus cinco irmãos e seus avós).

  - CIV-0002 (casamento de 1952 de sua filha Cidalia — forma de nome "Maria Aurora",
  nascimento em 1 de janeiro de 1904) · CIV-0022 (registro de nascimento de 1930 de Cidalia
  — nomeia-a como mãe e seus pais como avós maternos) · CIV-0017 (óbito de seu marido em
  1964 — "casado com Maria Aurora Guimarães", seis filhos adultos).

  - REC-0001 (lista familiar do proprietário — fixou esta ancestral; secundária, [LEAD]).

  ## Contexto regional e migratório

  Sua vida traça o percurso Zona da Mata Mineira → Rio de Janeiro: nascida em 1904 na
  família Carvalho-Guimarães da região de Carangola (CIV-0007) e casada com o comerciante
  Antonio Engracio Filho, mudou-se com a casa para o Rio de Janeiro, onde faleceu em 1991
  (CIV-0018). Sua linha paterna havia chegado à região de Carangola vinda da "Villa do Rio
  Claro", o local de nascimento registrado para seu pai em 1915 (CIV-0007). A mudança de
  meados do século para a capital encaixa-se no declínio da economia cafeeira da Zona da
  Mata e no êxodo rural-urbano do período. [CONTEXTUAL] Nenhum registro mantido declara seu
  motivo pessoal.
