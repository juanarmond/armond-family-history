profile: >-
  ## Identity

  **Valentim Martinho Bohrer** (also *Valentim Martinho Borer*) [PROVEN as named]. Father
  of João Gonçalves Bohrer (P-0014) and a descendant of the Swiss Borer colonists of Nova
  Friburgo.

  - **Born:** 14 November 1868, Nova Friburgo (RJ) [INFERRED — from the record-citing
  compilation PUB-0003, entry 1.1.7.3; no baptism image held].

  - **Parents:** Vicente Borer (P-0070) and Maria Heggendorn (P-0071), married 11 April
  1864 [INFERRED, PUB-0003] — placing him in the Borer II (Laurent) line: the line runs up
  through his grandfather to Laurent Borer (P-0068), a Swiss immigrant who came on the
  Heureux Voyage (1819) from Grindel, Soleure.

  - **Marriage:** to Carolina Bohrer (P-0029) [PROVEN of the union — both named as João's
  parents in CIV-0014 and as Eunir's paternal grandparents in CIV-0016]. Her maiden surname
  is not recorded in our sources ("Bohrer" is her married name); a secondary/blog lead
  proposing "Klein" is unverified. [LEAD]

  - **Child (in our line):** João Gonçalves Bohrer (P-0014, b. c.1894, d. 1970), a
  comerciante at Volta Redonda (RJ) [PROVEN — CIV-0014].

  - **Death:** already deceased by his son João's death in 1970 (CIV-0014) [PROVEN of the
  bound]; no record of his own is held and no date or place is documented. Secondary/blog
  leads give conflicting death dates that our evidence cannot settle. [OPEN]

  ## Standing and profession

  - No occupation, property, office or record of his own is held [PROVEN of the gap]. He
  appears only derivatively, as a named (deceased) parent and grandparent — a records gap,
  not an absence of life.

  ## Family and social network

  He belongs to the Borer II (Laurent) trunk of the Nova Friburgo Swiss colony, distinct
  from the Borer I (Jacob) trunk of Joaquim José Bohrer (P-0030); the compilation records
  no proven close kinship between the two Borer families despite the shared surname
  (PUB-0003). His son João Gonçalves married Celina Bohrer (P-0015), a daughter of that
  other Borer trunk — a Bohrer-married-Bohrer union (CIV-0016). [INFERRED]

  ## What we can extrapolate

  Valentim sits on the seam between the Nova Friburgo colony generation and the migrating
  modern one [INFERRED]: he is the last generation of this branch for whom no document of
  his own is held, while his son João Gonçalves led the family out to Minas Gerais
  (Carangola) and then to the Volta Redonda steel city.

  Though no occupation of his own is documented, his place in the family's class arc is legible
  from his position [INFERRED/CONTEXTUAL]: a Brazil-born descendant of the 1819 Grindel colonists
  of the Borer II (Laurent) line, living off the same poor Nova Friburgo highland lots his
  forebears took [CONTEXTUAL], in a branch that never accumulated heritable capital. Brazilian
  partible succession over this line's characteristically large families had, by his generation,
  reduced each descendant's share of already-marginal land to a sliver rather than an estate
  [CONTEXTUAL]. He is also the **last generation of this branch to stay put**; it was his son
  João Gonçalves — not Valentim — who converted the stagnant rural base into the mid-century move
  to Minas Gerais and then the Volta Redonda steel city. [INFERRED]

  ## Open questions

  - His baptism (~1868, Nova Friburgo), his marriage to Carolina, and his death record —
  none held; the first two would confirm his parentage and Carolina's maiden name. [OPEN]

  ## Sources held (this repository)

  - CIV-0014 (son João Gonçalves's 1970 Volta Redonda death — names him as deceased father)
  · CIV-0016 (grandson Eunir's 1924 Nova Friburgo birth — names him as paternal
  grandfather) · PUB-0003 (Imigrantes de Nova Friburgo — his 14 November 1868 birth and the
  Borer II / Laurent line).

  ## Regional and migration context

  His Brazilian nationality follows jus soli from a Nova Friburgo birth; the Swiss origin
  is documented up the Borer line, not inferred from the surname. [CONTEXTUAL] His
  generation stayed tethered to the Nova Friburgo colony; the move out to the Zona da Mata
  Mineira and the Volta Redonda CSN steel town was his son's and grandson's.

  ## Where to go today

  - **Birth (14 Nov 1868), marriage to Carolina Klein (27 Nov 1890) & carried death (1948):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Disputed rival death record (6 Sep 1893, not accepted):** Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ (Praça Fonseca Portela s/n, Centro, CEP 28800-000) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.71229,-42.62456)
profile_pt: >-
  ## Identidade

  **Valentim Martinho Bohrer** (também *Valentim Martinho Borer*) [PROVEN quanto ao nome].
  Pai de João Gonçalves Bohrer (P-0014) e descendente dos colonos suíços Borer de Nova
  Friburgo.

  - **Nascimento:** 14 de novembro de 1868, Nova Friburgo (RJ) [INFERRED — da compilação
  PUB-0003, que cita registros, entrada 1.1.7.3; nenhuma imagem de batismo obtida].

  - **Pais:** Vicente Borer (P-0070) e Maria Heggendorn (P-0071), casados em 11 de abril de
  1864 [INFERRED, PUB-0003] — situando-o na linha Borer II (Laurent): a linha sobe, pelo
  avô, até Laurent Borer (P-0068), um imigrante suíço vindo no Heureux Voyage (1819) de
  Grindel, Soleure.

  - **Casamento:** com Carolina Bohrer (P-0029) [PROVEN quanto à união — ambos nomeados
  como pais de João em CIV-0014 e como avós paternos de Eunir em CIV-0016]. Seu sobrenome
  de solteira não está registrado em nossas fontes ("Bohrer" é o nome de casada); uma pista
  secundária/de blog que propõe "Klein" é não verificada. [LEAD]

  - **Filho (em nossa linha):** João Gonçalves Bohrer (P-0014, n. c.1894, f. 1970),
  comerciante em Volta Redonda (RJ) [PROVEN — CIV-0014].

  - **Óbito:** já falecido ao tempo do óbito de seu filho João em 1970 (CIV-0014) [PROVEN
  quanto ao limite]; nenhum registro próprio dele foi obtido e nenhuma data ou local está
  documentado. Pistas secundárias/de blog dão datas de óbito conflitantes que nossa
  evidência não pode resolver. [OPEN]

  ## Posição social e profissão

  - Nenhuma ocupação, propriedade, cargo ou registro próprio está disponível [PROVEN quanto
  à lacuna]. Ele aparece apenas de forma derivada, como pai e avô (falecido) nomeado — uma
  lacuna de registros, não uma ausência de vida.

  ## Família e rede social

  Ele pertence ao tronco Borer II (Laurent) da colônia suíça de Nova Friburgo, distinto do
  tronco Borer I (Jacob) de Joaquim José Bohrer (P-0030); a compilação não registra
  parentesco próximo comprovado entre as duas famílias Borer, apesar do sobrenome comum
  (PUB-0003). Seu filho João Gonçalves casou-se com Celina Bohrer (P-0015), filha daquele
  outro tronco Borer — uma união Bohrer com Bohrer (CIV-0016). [INFERRED]

  ## O que podemos extrapolar

  Valentim situa-se na costura entre a geração da colônia de Nova Friburgo e a geração
  moderna migrante [INFERRED]: é a última geração deste ramo para a qual não se dispõe de
  documento próprio, enquanto seu filho João Gonçalves conduziu a família para Minas Gerais
  (Carangola) e depois para a cidade siderúrgica de Volta Redonda.

  Embora nenhuma ocupação própria esteja documentada, sua posição no arco de classe da família é
  legível a partir de seu lugar [INFERRED/CONTEXTUAL]: um descendente nascido no Brasil dos
  colonos de Grindel de 1819, da linha Borer II (Laurent), vivendo dos mesmos lotes serranos
  pobres de Nova Friburgo que seus antepassados tomaram [CONTEXTUAL], num ramo que nunca acumulou
  capital herdável. A sucessão partível brasileira, ao longo das famílias caracteristicamente
  grandes desta linha, havia, na geração dele, reduzido a parte de cada descendente numa terra já
  marginal a uma lasca, e não a um patrimônio [CONTEXTUAL]. Ele é também a **última geração deste
  ramo a permanecer fixa**; foi seu filho João Gonçalves — não Valentim — quem converteu a base
  rural estagnada na mudança de meados do século para Minas Gerais e, depois, para a cidade
  siderúrgica de Volta Redonda. [INFERRED]

  ## Questões em aberto

  - Seu batismo (~1868, Nova Friburgo), seu casamento com Carolina e seu registro de óbito
  — nenhum obtido; os dois primeiros confirmariam sua filiação e o sobrenome de solteira de
  Carolina. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0014 (óbito de 1970 do filho João Gonçalves em Volta Redonda — o nomeia como pai
  falecido) · CIV-0016 (nascimento de 1924 do neto Eunir em Nova Friburgo — o nomeia como
  avô paterno) · PUB-0003 (Imigrantes de Nova Friburgo — seu nascimento em 14 de novembro
  de 1868 e a linha Borer II / Laurent).

  ## Contexto regional e migratório

  Sua nacionalidade brasileira decorre do jus soli, por nascimento em Nova Friburgo; a
  origem suíça está documentada acima, na linha Borer, não inferida do sobrenome.
  [CONTEXTUAL] Sua geração permaneceu presa à colônia de Nova Friburgo; a saída para a Zona
  da Mata Mineira e para a cidade siderúrgica da CSN, em Volta Redonda, foi obra do filho e
  do neto.

  ## Onde ir hoje

  - **Nascimento (14 nov 1868), casamento com Carolina Klein (27 nov 1890) e óbito atribuído (1948):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Registro de óbito rival contestado (6 set 1893, não aceito):** Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ (Praça Fonseca Portela s/n, Centro, CEP 28800-000) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.71229,-42.62456)
