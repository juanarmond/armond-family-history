  ## Contexto regional e migratório

  Sua nacionalidade brasileira decorre do jus soli, por nascimento em Nova Friburgo; a
  origem suíça está documentada acima, na linha Borer, não inferida do sobrenome.
  [CONTEXTUAL] Sua geração permaneceu presa à colônia de Nova Friburgo; a saída para a Zona
  da Mata Mineira e para a cidade siderúrgica da CSN, em Volta Redonda, foi obra do filho e
  do neto.

