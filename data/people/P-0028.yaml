notes:
- text: >-
    Ahnentafel position 28 — father of João Gonçalves Bohrer (P-0014). Named as
    João's father (already deceased) in his 1970 Volta Redonda death (CIV-0014)
    and as Eunir Bohrer's paternal grandfather in the 1924 Nova Friburgo birth
    (CIV-0016). No record of his own has been located.
  text_pt: >-
    Posição 28 no Ahnentafel — pai de João Gonçalves Bohrer (P-0014). Nomeado como
    pai de João (já falecido) em seu óbito de 1970 em Volta Redonda (CIV-0014) e como
    avô paterno de Eunir Bohrer no nascimento de 1924 em Nova Friburgo (CIV-0016).
    Nenhum registro próprio dele foi localizado.
- text: >-
    Birth date confirmed from Imigrantes de Nova Friburgo compilation (PUB-0003, p.301,
    BORER II tree entry 1.1.7.3): born 14/11/1868. Parent family F-0034 (Vicente Borer
    × Maria Heggendorn). Both parents are now modelled (P-0070 × P-0071); their parent
    family F-0033 extends the line to Laurent Borer (P-0068), a Swiss immigrant (Heureux
    Voyage, 1819, Grindel, Soleure).
  text_pt: >-
    Data de nascimento confirmada pela compilação Imigrantes de Nova Friburgo
    (PUB-0003, p.301, entrada 1.1.7.3 da árvore BORER II): nascido em 14/11/1868.
    Família de origem F-0034 (Vicente Borer × Maria Heggendorn). Ambos os pais estão
    agora modelados (P-0070 × P-0071); sua família de origem F-0033 estende a linhagem
    até Laurent Borer (P-0068), um imigrante suíço (Heureux Voyage, 1819, Grindel,
    Soleure).
