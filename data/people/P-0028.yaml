profile: >-
  ## Interesting facts

  - **[PROVEN]** His 1890 parish marriage record (PAR-0064) records that his wife Carolina Klein abjured Protestantism and was baptised Catholic just before the wedding — showing the religious tension still present in the Nova Friburgo colony's third generation, where Lutheran Klein family intermarried with Catholic Bohrer family.

  - **[CONTEXTUAL]** He was born in 1868 into the third or fourth generation of the Swiss-German Nova Friburgo colony: his ancestors arrived in 1819 from Grindel, Soleure, and by his time the colony had shifted from highland farming to trade and small commerce, though still rooted in the mountain settlement.

  - **[PROVEN]** A rival death record placing him at Rio Bonito on 6 September 1893 is positively excluded by his own 1948 Nova Friburgo parish death — he lived to 80, buried 23 September 1948 (PAR-0065), outliving by 55 years the date the erroneous record gave.

  - **[CONTEXTUAL]** By the 1860s, Brazilian partible inheritance had divided the original Nova Friburgo colonist lots so many times across generations that each descendant's share was too small to sustain a family, making trade or wage labour the only viable path for the third generation.

  - **[INFERRED]** He is the last generation of his branch to remain anchored in Nova Friburgo: his son João Gonçalves led the family first to Minas Gerais and then to Volta Redonda, where the CSN steel mill provided the wage economy the depleted colony lands could no longer sustain.

  ## Identity

  **Valentim Martinho Bohrer** (also *Valentim Martinho Borer*) [PROVEN as named]. Father
  of João Gonçalves Bohrer (P-0014) and a descendant of the Swiss Borer colonists of Nova
  Friburgo.

  - **Born:** 14 November 1868, Nova Friburgo (RJ) [PROVEN — his own 1868 parish baptism
  PAR-0063 (event E-0064), which reads "nascido a quatorze de Novembro"; this also confirms
  PUB-0003's "14 Nov 1868" (Imigrantes de Nova Friburgo, p.301, entry 1.1.7.3), which had
  been treated as uncertain pending the primary record but is now corroborated].

  - **Parents:** Vicente Borer (P-0070) and Maria Heggendorn (P-0071), married 11 April
  1864 [INFERRED, PUB-0003] — placing him in the Borer II (Laurent) line: the line runs up
  through his grandfather to Laurent Borer (P-0068), a Swiss immigrant who came on the
  Heureux Voyage (1819) from Grindel, Soleure.

  - **Marriage:** married Carolina Klein (married name Carolina Bohrer; P-0029) on 27
  November 1890 at the Nova Friburgo Matriz [PROVEN — his own 1890 parish marriage PAR-0064
  (event E-0088)]; he was 22, she 17 (→ b. ~1873). Her maiden surname KLEIN — once only a
  blog lead — is now primary-confirmed by that record, which names her parents Jacob Klein
  (P-0103) × Maria Luiza Schenkel (P-0104), Lutheran Nova Friburgo colonists (family F-0051);
  the bride abjured Protestantism and was baptised Catholic just before the wedding. The union
  is also attested by both being named as João's parents (CIV-0014) and as Eunir's paternal
  grandparents (CIV-0016).

  - **Child (in our line):** João Gonçalves Bohrer (P-0014, b. c.1894, d. 1970), a
  comerciante at Volta Redonda (RJ) [PROVEN — CIV-0014].

  - **Death:** buried 23 September 1948 at Nova Friburgo, aged 80 (→ b. ~1868), husband of
  Carolina (Klein) Bohrer, of heart failure [PROVEN — his own 1948 parish death PAR-0065
  (event E-0089)]. This resolves the earlier open death: the rival FamilySearch/blog "6
  September 1893, Rio Bonito" date is a namesake and is excluded (a 1893 death is
  irreconcilable with his living into 1948 and with his descendants). He was already deceased
  by his son João's 1970 death (CIV-0014), consistent with the 1948 record.

  ## Standing and profession

  - His own vital-record trio is now held — 1868 baptism (PAR-0063), 1890 marriage (PAR-0064)
  and 1948 death (PAR-0065) — but they document only vital events; no occupation, property or
  office is recorded for him [PROVEN of the gap]. Beyond these he appears only derivatively, as
  a named parent and grandparent — the occupational picture is a records gap, not an absence of
  life.

  ## Family and social network

  He belongs to the Borer II (Laurent) trunk of the Nova Friburgo Swiss colony, distinct
  from the Borer I (Jacob) trunk of Joaquim José Bohrer (P-0030); the compilation records
  no proven close kinship between the two Borer families despite the shared surname
  (PUB-0003). His son João Gonçalves married Celina Bohrer (P-0015), a daughter of that
  other Borer trunk — a Bohrer-married-Bohrer union (CIV-0016). [INFERRED]

  ## What we can extrapolate

  **Two records give him an occupation and a literacy status that his other acts do not.** In
  October 1891, registering his daughter Maria Felomena's birth at São José do Ribeirão, he and
  his wife are recorded as "brazileiros, **lavradores** e moradores desta Parochia", and the act
  closes with the escrivão signing "a rogo do declarante **por não saber escrever**" (CIV-0045)
  [PROVEN]. At about twenty-three he was a farming smallholder in an outlying parish of the Nova
  Friburgo comarca who could not write his own name. Twenty-two years later his name appears in
  the signature block of a Bom Jardim marriage act (CIV-0048, 1913) [PROVEN that the name is in
  the block; whether it is an autograph is not established by the transcription]. If it is his
  own hand, he acquired signature literacy in adulthood — the one piece of visible
  self-improvement anywhere in this branch. [INFERRED]

  **Two Borer families, one ship and one scheme — and two very different outcomes within seventy
  years.** The Nova Friburgo colonist compilation puts Jacob Borer (Casa/Lote 70/56) and Laurent
  Borer (Casa/Lote 73/86) aboard the same 1819 *Heureux Voyage*, allocated adjacent lots, with
  no evidence of close kinship between them (PUB-0003) [COMPILED]. Valentim descends from
  Laurent; the woman his son married, Celina Bohrer (P-0015), descends from Jacob. Set the two
  branches side by side at the same moment and they are plainly not level: Jacob's grandson
  Francisco José (P-0034) signs his own will in 1888, names executors, leaves an estate and a
  pious bequest and puts his sons into trade and a newspaper — while Laurent's grandson Valentim
  is a *lavrador* in an outlying parish who cannot sign his daughter's birth act three years
  later. Identical starting packages, divergent trajectories. That is the sharpest evidence this
  family offers about what the colony scheme actually delivered: a **starting position, not a
  trajectory**, with nothing in it to stop one branch stalling while another climbed. [INFERRED]

  **Across an eighty-year life he generates no economic record at all.** [INFERRED] Valentim
  appears in his baptism, his marriage, his children's baptisms and registrations, and his own
  death act (PAR-0063, PAR-0064, PAR-0065, CIV-0045, PAR-0074, PAR-0080, PAR-0052, PAR-0053) —
  and in nothing else. No land registration, no will, no probate, no commercial notice, no
  newspaper item, no office, no rank. The branch his son married into is, by contrast, in a
  registered will, a land registry and a town weekly. An absence in a record set this dense is
  not neutral: it is what a household with nothing to transact looks like in an archive.
  [INFERRED — an argument from the shape of the held corpus, not a proof of poverty.]

  **The arithmetic of the lot.** [CONTEXTUAL/INFERRED] Laurent Borer's Casa 73 / Lote 86 passed,
  per the same compilation, into a family of some twelve children [COMPILED]; Valentim's father
  Vicente was one of them; Valentim was one of at least six children of Vicente; and Valentim
  himself had at least eleven, of whom eight are documented in the held records — Maria Felomena
  (1891), João Gonçalves, the twins Adelaide and Carolina (1899), Valentim Luciano (1902), Maria
  Clara (1908), Durval Baptista (1910) and Maria (1919). Three rounds of equal division over an
  already-marginal stony serra lot leave a share too small to farm, let alone to inherit.
  Nothing had to go wrong: the succession law and the birth rate did the work between them.

  **His marriage is where the two colonisation waves fuse, and it cost a conversion.** In
  November 1890 he married Carolina Klein, seventeen, of the German-Lutheran second-wave
  colonist families — and the act records that she had first "abjurado o protestantismo, fazendo
  a profissão de fé catholica e recebido o baptismo", verbally licensed by her father (PAR-0064)
  [PROVEN]. The 1819 Swiss-Catholic and 1824 German-Lutheran colonies merge in this union, the
  bride changing confession to make it possible. Endogamy inside the colony pool was still the
  rule in his generation [INFERRED]; what it bought was a spouse at precisely the same economic
  level.

  **He is the last generation of this branch to stay put, and the staying is itself the
  finding.** [INFERRED] The household moved only within the município — early children
  registered at rural São José do Ribeirão (1891), later ones at the Nova Friburgo matriz, São
  Pedro and Lumiar (1899–1910) [PROVEN] — while his daughter Maria was born in the city of Rio
  de Janeiro in 1919 (CIV-0047) and his son João Gonçalves (P-0014) took his own family to the
  Zona da Mata Mineira and then to the Volta Redonda steel city. Valentim died at Nova Friburgo
  on 23 September 1948, aged eighty, "faleceu do coração" (PAR-0065) [PROVEN]. The turning point
  of the Bohrer arc is his son, not him — and the reason is legible in his own records: there
  was nothing left at Nova Friburgo to hold a family except land that could no longer be
  enlarged.

  ## Open questions

  - His baptism, marriage and death are now all held (PAR-0063/PAR-0064/PAR-0065): the baptism
  confirmed his parentage and fixed his birth as 14 November 1868 (the record reads "nascido a
  quatorze de Novembro"), the 1890 marriage confirmed Carolina's maiden name (Klein) and her
  parents, and the 1948 death fixed his death (buried 23 Sep 1948, aged 80) and excluded the 1893
  namesake. Remaining refinements: the exact death day (a secondary reading gives died 22 / buried
  23 Sep 1948) and any separate civil duplicate of the 1890 marriage. [OPEN — minor detail]

  ## Sources held (this repository)

  - PAR-0063 (his own 1868 Nova Friburgo baptism — parents, birth 14 Nov 1868) · PAR-0064
  (his 1890 Nova Friburgo marriage to Carolina Klein — names both filiations) · PAR-0065 (his
  1948 Nova Friburgo death — aged 80, husband of Carolina, of heart failure) · CIV-0014 (son
  João Gonçalves's 1970 Volta Redonda death — names him as
  deceased father) · CIV-0016 (grandson Eunir's 1924 Nova Friburgo birth — names him as
  paternal grandfather) · PUB-0003 (Imigrantes de Nova Friburgo — BORER II / Laurent line;
  its "14 Nov 1868" birth is confirmed by PAR-0063).

  ## Regional and migration context

  His Brazilian nationality follows jus soli from a Nova Friburgo birth; the Swiss origin
  is documented up the Borer line, not inferred from the surname. [CONTEXTUAL] His
  generation stayed tethered to the Nova Friburgo colony; the move out to the Zona da Mata
  Mineira and the Volta Redonda CSN steel town was his son's and grandson's.

  ## Where to go today

  - **Birth (14 Nov 1868), marriage to Carolina Klein (27 Nov 1890) & death (buried 23 Sep 1948):** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Rival death record (6 Sep 1893, Rio Bonito — now excluded as a namesake by PAR-0065):** Igreja Matriz Nossa Senhora da Conceição, Rio Bonito, RJ (Praça Fonseca Portela s/n, Centro, CEP 28800-000) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.71229,-42.62456)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu registro de casamento paroquial de 1890 (PAR-0064) registra que sua esposa Carolina Klein abjurou o protestantismo e foi batizada católica logo antes do casamento — evidenciando a tensão religiosa ainda presente na terceira geração da colônia de Nova Friburgo, onde a família luterana Klein se casava com a família católica Bohrer.

  - **[CONTEXTUAL]** Ele nasceu em 1868 na terceira ou quarta geração da colônia suíço-alemã de Nova Friburgo: seus ancestrais chegaram em 1819 de Grindel, Soleure, e em sua época a colônia havia passado da lavoura serrana ao comércio e ao pequeno comércio, ainda que enraizada no assentamento montanhoso.

  - **[PROVEN]** Um registro de óbito rival que o situava em Rio Bonito em 6 de setembro de 1893 é positivamente excluído por seu próprio registro de óbito paroquial de 1948 em Nova Friburgo — ele viveu até os 80 anos, sepultado em 23 de setembro de 1948 (PAR-0065), sobrevivendo em 55 anos à data que o registro equivocado indicava.

  - **[CONTEXTUAL]** Na década de 1860, a herança partível brasileira havia dividido os lotes originais de colonos de Nova Friburgo tantas vezes entre gerações que a parte de cada descendente era pequena demais para sustentar uma família, tornando o comércio ou o trabalho assalariado a única via viável para a terceira geração.

  - **[INFERRED]** Ele é a última geração de seu ramo a permanecer ancorada em Nova Friburgo: seu filho João Gonçalves conduziu a família primeiro a Minas Gerais e depois a Volta Redonda, onde a usina siderúrgica da CSN oferecia a economia salarial que as terras depletadas da colônia já não podiam sustentar.

  ## Identidade

  **Valentim Martinho Bohrer** (também *Valentim Martinho Borer*) [PROVEN quanto ao nome].
  Pai de João Gonçalves Bohrer (P-0014) e descendente dos colonos suíços Borer de Nova
  Friburgo.

  - **Nascimento:** 14 de novembro de 1868, Nova Friburgo (RJ) [PROVEN — seu próprio batismo
  paroquial de 1868 PAR-0063 (evento E-0064), que registra "nascido a quatorze de Novembro";
  isso também confirma o "14 nov. 1868" da compilação PUB-0003 (Imigrantes de Nova Friburgo,
  p.301, entrada 1.1.7.3), que havia sido tratado como incerto aguardando o registro primário,
  mas agora está corroborado].

  - **Pais:** Vicente Borer (P-0070) e Maria Heggendorn (P-0071), casados em 11 de abril de
  1864 [INFERRED, PUB-0003] — situando-o na linha Borer II (Laurent): a linha sobe, pelo
  avô, até Laurent Borer (P-0068), um imigrante suíço vindo no Heureux Voyage (1819) de
  Grindel, Soleure.

  - **Casamento:** casou-se com Carolina Klein (nome de casada Carolina Bohrer; P-0029) em
  27 de novembro de 1890, na Matriz de Nova Friburgo [PROVEN — seu próprio casamento
  paroquial de 1890 PAR-0064 (evento E-0088)]; ele com 22 anos, ela com 17 (→ n. ~1873). Seu
  sobrenome de solteira KLEIN — antes apenas pista de blog — está agora confirmado em fonte
  primária por esse registro, que nomeia seus pais Jacob Klein (P-0103) × Maria Luiza Schenkel
  (P-0104), colonos luteranos de Nova Friburgo (família F-0051); a noiva abjurou o
  protestantismo e foi batizada católica pouco antes do casamento. A união também é atestada
  por ambos serem nomeados como pais de João (CIV-0014) e como avós paternos de Eunir
  (CIV-0016).

  - **Filho (em nossa linha):** João Gonçalves Bohrer (P-0014, n. c.1894, f. 1970),
  comerciante em Volta Redonda (RJ) [PROVEN — CIV-0014].

  - **Óbito:** sepultado em 23 de setembro de 1948 em Nova Friburgo, aos 80 anos (→ n. ~1868),
  marido de Carolina (Klein) Bohrer, do coração [PROVEN — seu próprio óbito paroquial de 1948
  PAR-0065 (evento E-0089)]. Isso resolve o óbito antes em aberto: a data rival do
  FamilySearch/blog "6 de setembro de 1893, Rio Bonito" é de um homônimo e está excluída (um
  óbito em 1893 é irreconciliável com ele viver até 1948 e com seus descendentes). Já estava
  falecido ao tempo do óbito de seu filho João em 1970 (CIV-0014), coerente com o registro de
  1948.

  ## Posição social e profissão

  - Sua trinca de registros vitais próprios já está em mãos — batismo de 1868 (PAR-0063),
  casamento de 1890 (PAR-0064) e óbito de 1948 (PAR-0065) —, mas eles documentam apenas
  eventos vitais; nenhuma ocupação, propriedade ou cargo lhe é registrado [PROVEN quanto à
  lacuna]. Além destes, ele aparece apenas de forma derivada, como pai e avô nomeado — o
  quadro ocupacional é uma lacuna de registros, não uma ausência de vida.

  ## Família e rede social

  Ele pertence ao tronco Borer II (Laurent) da colônia suíça de Nova Friburgo, distinto do
  tronco Borer I (Jacob) de Joaquim José Bohrer (P-0030); a compilação não registra
  parentesco próximo comprovado entre as duas famílias Borer, apesar do sobrenome comum
  (PUB-0003). Seu filho João Gonçalves casou-se com Celina Bohrer (P-0015), filha daquele
  outro tronco Borer — uma união Bohrer com Bohrer (CIV-0016). [INFERRED]

  ## O que podemos extrapolar

  **Dois registros lhe atribuem uma ocupação e uma condição de letramento que seus demais atos
  não dão.** Em outubro de 1891, ao registrar o nascimento de sua filha Maria Felomena em São
  José do Ribeirão, ele e a mulher são lançados como "brazileiros, **lavradores** e moradores
  desta Parochia", e o ato encerra-se com o escrivão assinando "a rogo do declarante **por não
  saber escrever**" (CIV-0045) [PROVEN]. Aos cerca de vinte e três anos era um pequeno lavrador
  numa freguesia periférica da comarca de Nova Friburgo que não sabia escrever o próprio nome.
  Vinte e dois anos depois seu nome figura no bloco de assinaturas de um ato de casamento em Bom
  Jardim (CIV-0048, 1913) [PROVEN que o nome está no bloco; se é autógrafo, a transcrição não
  estabelece]. Se for de próprio punho, ele adquiriu letramento de assinatura já adulto — o
  único gesto visível de progresso pessoal em todo este ramo. [INFERRED]

  **Duas famílias Borer, um só navio e um só esquema — e dois resultados muito diferentes em
  setenta anos.** A compilação dos colonos de Nova Friburgo põe Jacob Borer (Casa/Lote 70/56) e
  Laurent Borer (Casa/Lote 73/86) a bordo do mesmo *Heureux Voyage* de 1819, com lotes vizinhos
  e sem evidência de parentesco próximo entre eles (PUB-0003) [COMPILED]. Valentim descende de
  Laurent; a mulher com quem seu filho casou, Celina Bohrer (P-0015), descende de Jacob. Postos
  lado a lado no mesmo momento, os dois ramos não estão no mesmo nível: o neto de Jacob,
  Francisco José (P-0034), assina o próprio testamento em 1888, nomeia testamenteiros, deixa
  espólio e legado pio e encaminha os filhos ao comércio e a um jornal — enquanto o neto de
  Laurent, Valentim, é *lavrador* numa freguesia periférica e não consegue assinar o ato de
  nascimento da filha três anos depois. Pacotes iniciais idênticos, trajetórias divergentes. É a
  evidência mais nítida que esta família oferece sobre o que o esquema colonial de fato
  entregou: uma **posição de partida, não uma trajetória**, sem nada nele que impedisse um ramo
  de estagnar enquanto outro subia. [INFERRED]

  **Ao longo de uma vida de oitenta anos ele não gera nenhum registro econômico.** [INFERRED]
  Valentim aparece em seu batismo, em seu casamento, nos batismos e registros dos filhos e em
  seu próprio óbito (PAR-0063, PAR-0064, PAR-0065, CIV-0045, PAR-0074, PAR-0080, PAR-0052,
  PAR-0053) — e em mais nada. Nenhum registro de terras, nenhum testamento, nenhum inventário,
  nenhuma nota comercial, nenhum item de jornal, nenhum cargo, nenhuma patente. O ramo com o
  qual seu filho se casou está, ao contrário, num testamento registrado, num registro de terras
  e num semanário da cidade. Uma ausência num conjunto documental tão denso não é neutra: é
  assim que um domicílio sem nada a transacionar aparece num arquivo. [INFERRED — argumento a
  partir do formato do corpus disponível, não prova de pobreza.]

  **A aritmética do lote.** [CONTEXTUAL/INFERRED] A Casa 73 / Lote 86 de Laurent Borer passou,
  segundo a mesma compilação, a uma família de cerca de doze filhos [COMPILED]; o pai de
  Valentim, Vicente, foi um deles; Valentim foi um de ao menos seis filhos de Vicente; e o
  próprio Valentim teve ao menos onze, dos quais oito estão documentados nos registros
  disponíveis — Maria Felomena (1891), João Gonçalves, as gêmeas Adelaide e Carolina (1899),
  Valentim Luciano (1902), Maria Clara (1908), Durval Baptista (1910) e Maria (1919). Três
  rodadas de divisão igual sobre um lote serrano pedregoso já marginal deixam um quinhão pequeno
  demais para lavrar, quanto mais para herdar. Nada precisou dar errado: a lei sucessória e a
  taxa de natalidade fizeram o serviço entre si.

  **Seu casamento é onde as duas ondas de colonização se fundem, e custou uma conversão.** Em
  novembro de 1890 ele casou-se com Carolina Klein, de dezessete anos, das famílias colonas
  alemãs luteranas da segunda leva — e o ato registra que ela havia antes "abjurado o
  protestantismo, fazendo a profissão de fé catholica e recebido o baptismo", licenciada
  verbalmente pelo pai (PAR-0064) [PROVEN]. A colônia suíço-católica de 1819 e a alemã-luterana
  de 1824 fundem-se nessa união, com a noiva mudando de confissão para torná-la possível. A
  endogamia dentro do conjunto colonial ainda era a regra na geração dele [INFERRED]; o que ela
  comprou foi um cônjuge exatamente do mesmo nível econômico.

  **Ele é a última geração deste ramo a permanecer fixa, e a permanência é, ela própria, o
  achado.** [INFERRED] O domicílio mudou-se apenas dentro do município — os filhos mais velhos
  registrados na rural São José do Ribeirão (1891), os mais novos na matriz de Nova Friburgo, em
  São Pedro e no Lumiar (1899–1910) [PROVEN] —, enquanto sua filha Maria nasceu na cidade do Rio
  de Janeiro em 1919 (CIV-0047) e seu filho João Gonçalves (P-0014) levou a própria família para
  a Zona da Mata Mineira e depois para a cidade siderúrgica de Volta Redonda. Valentim morreu em
  Nova Friburgo em 23 de setembro de 1948, aos oitenta anos, "faleceu do coração" (PAR-0065)
  [PROVEN]. O ponto de virada do arco Bohrer é o filho, não ele — e a razão é legível nos
  próprios registros dele: nada restava em Nova Friburgo para prender uma família senão uma
  terra que já não podia ser ampliada.

  ## Questões em aberto

  - Seu batismo, casamento e óbito já estão todos em mãos (PAR-0063/PAR-0064/PAR-0065): o
  batismo confirmou sua filiação e fixou seu nascimento em 14 de novembro de 1868 (o registro
  lê "nascido a quatorze de Novembro"), o casamento de 1890 confirmou o sobrenome de solteira
  de Carolina (Klein) e seus pais, e o óbito de 1948 fixou sua morte (sepultado em 23 de
  setembro de 1948, aos 80 anos) e excluiu o homônimo de 1893. Refinamentos restantes: o dia
  exato do óbito (uma leitura secundária dá falecido em 22 / sepultado em 23 de setembro de
  1948) e qualquer registro civil separado do casamento de 1890. [OPEN — detalhe menor]

