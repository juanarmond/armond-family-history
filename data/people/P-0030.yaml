  Joaquim José Júnior (n. 1899) e Álvaro José [LEAD — apenas na árvore; nenhum registro
  encontrado].

  - **Óbito:** data não obtida. O único limite documental disponível é superior: o óbito de
  Celina em 1977 o nomeia como seu pai falecido (CIV-0015) [PROVEN quanto ao limite]. [OPEN]
  [Corrigido em 2026-10-08 a partir da imagem: o nascimento de 1924 de Eunir em Nova Friburgo
