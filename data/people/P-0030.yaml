profile: >-
  ## Interesting facts

  - **[PROVEN]** His birthday — 16 December — was documented not by a vital record but by the family newspaper *A Sentinella* on 18 December 1898, in a birthday notice published by his brother Guilherme Samuel Bohrer, the editor (NWS-0005). A personal date fixed by a press notice alone.

  - **[PROVEN]** His son Antonio José, aged 13, died on 2 April 1899 from a jararacussú snakebite — reported in *A Sentinella* as "sobrinho do gerente desta folha," the nephew of the paper's own editor: a family tragedy documented by a family newspaper (NWS-0006).

  - **[PROVEN]** His own 1884 marriage record (PAR-0056) places his birthplace at Itaboraí ("natural e baptisado em Itaborahy"), not Nova Friburgo — contradicting the "natural desta Freguezia" his brother declared in the 1890 birth registration (CIV-0019). The same man's origin differs between self-declaration and informant-declaration.

  - **[CONTEXTUAL]** His generation represents the brief petty-bourgeois peak of the colonist line: with a brother editing a regional newspaper and a household in commerce, the Bohrer family of the late 19th century had moved well beyond farming into civic life — the same shift visible across Nova Friburgo as Swiss descendants urbanised in the railway era.

  - **[INFERRED]** He is absent from two published Nova Friburgo colonist genealogy compilations, yet his own father's 1888 will names him as the firstborn heir (PRB-0005) — proof that a man born before systematic civil registration can slip the compilers' net entirely, and that a primary will often recovers what printed genealogies miss.

  - **[CONTEXTUAL]** The *A Sentinella* newspaper he was part of (through his brother) traces a remarkable generational arc: from Swiss colonists who arrived in 1819 speaking French and German, to a Portuguese-language regional press within three generations, operating at the heart of the Zona da Mata coffee country.

  ## Identity

  **Joaquim José Bohrer** (*Bohrer / Borer* are the same surname) [PROVEN]. A Nova Friburgo
  merchant, father of Celina (Selina) Bohrer (P-0015), and a grandson of the Swiss Borer
  colonists.

  - **Born:** at Itaboraí (RJ) — his own 1884 marriage records him "natural e baptisado em
  Itaborahy" [PROVEN — PAR-0056], the family's Itaboraí home (his mother Roza was born there and
  his parents' marriage was celebrated there). This conflicts with the third-party "natural
  desta Freguezia" (Nova Friburgo) declared by his brother at son Alberto's 1890 birth
  (CIV-0019); both are preserved, the self-stated Itaboraí reading being the stronger. His
  birthday was 16 December — the weekly A Sentinella (18 December 1898) lists him among those who
  "fizeram annos … no dia 16" (NWS-0005) [PROVEN of the day]. The 1884 marriage gives his age as
  22 → b. ~1861/62 [PROVEN as stated]; a structural inference (firstborn of a couple married by
  ~1858, older than his sister Ludovina b. 1862) may place it a few years earlier, ~1858–59
  [INFERRED, resting on leads]. Exact year [OPEN].

  - **Parents:** Francisco José Bohrer (P-0034) and Rosa Eugenia de Lemos (P-0035) [PROVEN]
  — named as the paternal grandparents in his son Alberto's 1890 birth (CIV-0019);
  Francisco's own 1888 will names Joaquim first among his four heirs (PRB-0005).

  - **Marriage:** to Lucinda Ferreira da Silva (P-0031, also "Lucinda Ferreira da Silva
  Bohrer") on 19 April 1884 at the Nova Friburgo Matriz de São João Baptista (celebrant Padre
  José Giffoni), he 22 and she 21 [PROVEN — their own marriage act PAR-0056, event E-0085; also
  named as the married parents in their sons' 1890 and 1891 births, CIV-0019, CIV-0020].

  - **Children:** documented — Alberto (b. 17 June 1890, CIV-0019); an infant son (b. 23
  December 1891, d. 29 January 1892, CIV-0020); Antonio José (d. 2 April 1899, aged 13, of a
  jararacussú snakebite, NWS-0006); Celina / Selina (P-0015, b. 13 May 1899, baptised 27
  September 1899, PAR-0057 — the ancestor of our line); Etelvina (b. 16 May 1900, baptised 1902,
  PAR-0075); Joaquim Carlos (b. 6 January 1896, PAR-0078); Renato (b. 12 September 1897,
  baptised 1898, PAR-0079); and Lucinda Maria (b. 26 July 1908, PAR-0052) — later Lucinda Bohrer
  Moreira, married Antonio Moreira, d. 3 July 1996 Volta Redonda, widow without issue (CIV-0032).
  The 1908 baptism and the 1996 death name one woman [STRONG-EVIDENCE]: identical 26 July birthday
  and parents; the death's "born 1909" is informant-reported, the baptism year (1908) primary.
  [PROVEN]

  - **Death:** already deceased by 1924 — recorded "já falecidos" with his wife on his
  grandson Eunir's 1924 Nova Friburgo birth (CIV-0016) and as Celina's deceased father
  in her 1977 death (CIV-0015) [PROVEN of the bound]; exact date not held. [OPEN]

  ## Standing and profession

  - **Negociante (merchant) at the Alto da Serra, Nova Friburgo** [PROVEN] — so recorded in
  his sons' 1890 and 1891 birth registrations (CIV-0019, CIV-0020); his residence at the
  Alto da Serra, the old Swiss-German colony quarter, is the family seat.

  - He was alive and named in his family's paper A Sentinella in 1898–1899 (run by his
  brother Guilherme Samuel Bohrer), but only in a birthday notice and his son's death
  notice — suggesting a private tradesman rather than a public office-holder, unlike his
  brothers. [INFERRED, NWS-0005, NWS-0006]

  ## Family and social network

  His father Francisco José Bohrer declared himself "natural deste termo" and a legitimate
  son of Jacob Bahrer (Borer) and Catharina Mayer, "já fallecidos" (PRB-0005) — the
  immigrant boundary of this Borer I (Jacob) line, from Erschwil, Soleure. His mother Rosa
  Eugenia de Lemos was of the Lemos family associated with Itaboraí (RJ): his parents'
  marriage had been celebrated before the coadjutor of Itaboraí and was judicially
  justified and registered at the Nova Friburgo matriz in 1879 (PAR-0002). His siblings
  were Laura, Guilherme Samuel (the A Sentinella proprietor) and Fernando (PRB-0005); his
  maternal uncle Manoel Pereira de Lemos, an industrialist of Venda das Pedras, died in
  1898 (NWS-0002).

  ## What we can extrapolate

  Joaquim proves that a primary will beats printed compilations. [INFERRED] Two Nova Friburgo
  genealogy compilations omit him entirely, yet his own father's 1888 will names him firstborn
  heir (PRB-0005). The most economical reading is that he was born at Itaboraí, his mother's
  lowland parish, outside the net the Nova Friburgo compilers cast — his own 1884 marriage
  records him "natural e baptisado em Itaborahy", aged 22 (PAR-0056) [PROVEN]. Absence from the
  printed lists is not absence of the person, a caution that applies to this whole line.

  **What he inherited was a quarter-share; what he made of it was trade.** [INFERRED] His
  father's will made him one of four co-heirs to a modest serra holding (PRB-0005) [PROVEN], and
  by 1890–91 he is a *negociante* with his own house at the Alto da Serra (CIV-0019, CIV-0020)
  [PROVEN]. That is the family's defining conversion in a single step: from land, which is
  heritable, to a merchant's margin, which is not. Commerce income rises and falls with the
  surrounding economy, is not a fixed wage, and leaves nothing behind that a child can inherit
  [CONTEXTUAL].

  **The geography of that trade tells you what kind of merchant he was.** Both of his children's
  birth registrations record the distance from the cartório: his brother Guilherme, declaring
  for him in 1890, came "distante deste cartorio tres leguas", and Joaquim himself in 1891
  "distante deste cartorio mais de uma legua" (CIV-0019, CIV-0020) [PROVEN]. Three leagues is on
  the order of eighteen kilometres of serra track. This was a back-country store serving
  scattered farms, not a shop on the town square; and the two witnesses to the 1890 act are a
  *jornaleiro* (day-labourer) and a *caçeiro* (CIV-0019) [PROVEN] — the household's immediate
  circle at the moment of registration was labouring, not notable. [INFERRED]

  **His generation is the clearest snapshot of the family's ceiling — and of how contingent that
  ceiling was.** [INFERRED/CONTEXTUAL] Joaquim was a *negociante*; his brother Guilherme was
  manager and proprietor of the weekly *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN],
  and the retrieval materials add a Capitão rank and a São Pedro subdelegacy for him [LEAD] —
  posts that, if held, were unpaid under Brazilian law [CONTEXTUAL]. So the household's prestige
  sat on a newspaper and a shop, with no salaried office underneath it. That is the same
  structural weakness that undid the paternal Armond line of this family from above: status with
  no wage-base cannot survive the loss of the thing paying for it.

  **Partible succession, applied twice, is the whole explanation.** [CONTEXTUAL/INFERRED] The
  1888 estate was divided four ways; Joaquim's own household then produced at least eight
  children documented in the held records — Antonio José (b. ~1885), Alberto (1890), an infant
  son (b. Dec 1891, d. Jan 1892), Joaquim Carlos (1896), Renato (1897), Celina (1899), Etelvina
  (1900) and Lucinda (1908/09) — with the reconciled research roster putting the total nearer
  eleven [LEAD]. A quarter-share divided again by eight or eleven leaves nothing measurable per
  head. No catastrophe is needed to explain why his daughter Celina died in 1977 having "não
  deixou bens nem testamento" (CIV-0015) [PROVEN]: the arithmetic does it on its own.

  **A private tradesman in a public family, in a household exposed to back-country risk.**
  [INFERRED] Although his brother owned the town paper, Joaquim appears in it only twice — a
  birthday notice (NWS-0005) and the death of his own son (NWS-0006) [PROVEN] — which reads as a
  working merchant rather than a public man. And the household carried the mortality profile of
  the mata rather than the town: an infant son died in January 1892 (CIV-0020, marginal note),
  and in April 1899 his 13-year-old son Antonio José died of a jararacussú bite in the São Pedro
  district (NWS-0006) [PROVEN]. He is the last generation to hold the Alto da Serra position:
  within a generation his daughter has left for Minas Gerais, and the plateau closes behind her.

  ## Open questions

  - His exact baptism act (Itaboraí, ~1858–62) and his death record (Nova Friburgo, between
  1921 and 1924) — not held. (His 1884 marriage to Lucinda is now held — PAR-0056.) [OPEN]

  ## Sources held (this repository)

  - CIV-0019 (son Alberto's 1890 birth — his parents, both grandparent couples, his trade
  and residence) · CIV-0020 (infant son's 1891 birth and 1892 death) · NWS-0005 (A
  Sentinella, 18 Dec 1898 — his 16 December birthday) · NWS-0006 (A Sentinella, 4 Apr 1899
  — his son Antonio José's death) · NWS-0002 (A Sentinella, 1898 — his mother's brother
  Manoel Pereira de Lemos's death).

  - PAR-0056 (his own 1884 Nova Friburgo marriage to Lucinda — 19 April 1884, aged 22, "natural
  e baptisado em Itaborahy", his parents named) · PAR-0057 (daughter Celina's 1899 baptism) ·
  PAR-0075 (daughter Etelvina's 1902 baptism) · PAR-0078 (son Joaquim Carlos's 1896 baptism) ·
  PAR-0079 (son Renato's 1897/1898 baptism) · PAR-0052 (daughter Lucinda Maria's 1908
  baptism) · CIV-0032 (the same daughter's 1996 Volta Redonda death, as Lucinda Bohrer Moreira) — all naming
  him as father.

  - PRB-0005 (his father Francisco José's 1888 will — names Joaquim firstborn; gives the
  Swiss immigrant grandparents) · PAR-0002 (his parents' 1879 marriage justification) ·
  CIV-0015 (daughter Celina's 1977 death) · CIV-0016 (grandson Eunir's 1924 birth) —
  the last two name him as deceased father / grandfather.

  ## Regional and migration context

  His whole documented life sits in Nova Friburgo, the highland Swiss-German colony town
  (RJ); by the late 19th century the colonist descendants had turned from farming to trade,
  politics and journalism, and Joaquim was a merchant of that urbanizing town. [CONTEXTUAL]
  His Brazilian nationality follows jus soli; the Swiss origin is documented up the Borer
  line (PRB-0005), not inferred from the surname. His branch stayed in Nova Friburgo; the
  move out to Minas Gerais and Volta Redonda came through his daughter Celina's marriage
  and the next generation.

  ## Where to go today

  - **1884 marriage to Lucinda (19 April 1884, held):** Catedral Diocesana / Igreja
  Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira
  23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Baptism (~1858–62, per his 1884 marriage "natural de Itaboraí"):** Igreja Matriz de São
  João Batista de Itaboraí, RJ (Praça Marechal Floriano Peixoto 15, Centro; CEP 24800-165) — the
  exact act is not held. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu aniversário — 16 de dezembro — foi documentado não por um registro vital, mas pelo jornal da família *A Sentinella* em 18 de dezembro de 1898, numa nota publicada por seu irmão Guilherme Samuel Bohrer, o redator (NWS-0005). Uma data pessoal fixada apenas por uma nota de imprensa.

  - **[PROVEN]** Seu filho Antonio José, de 13 anos, faleceu em 2 de abril de 1899 por mordedura de jararacussú — reportado no *A Sentinella* como "sobrinho do gerente desta folha", o sobrinho do próprio redator: uma tragédia familiar noticiada pelo jornal da família (NWS-0006).

  - **[PROVEN]** Seu próprio registro de casamento de 1884 (PAR-0056) indica seu local de nascimento como Itaboraí ("natural e baptisado em Itaborahy"), e não Nova Friburgo — contradizendo o "natural desta Freguezia" declarado pelo irmão no registro de nascimento de 1890 (CIV-0019). A origem de um mesmo homem difere entre autodeclaração e declaração de terceiros.

  - **[CONTEXTUAL]** Sua geração representa o breve platô pequeno-burguês do topo da linha colona: com um irmão editando um jornal regional e um lar no comércio, a família Bohrer do final do século XIX havia avançado muito além da lavoura para a vida cívica — a mesma mudança visível em toda Nova Friburgo à medida que os descendentes suíços se urbanizavam na era ferroviária.

  - **[INFERRED]** Ele está ausente de duas compilações genealógicas publicadas sobre colonos de Nova Friburgo, mas o testamento de 1888 de seu próprio pai o nomeia como herdeiro primogênito (PRB-0005) — prova de que um homem nascido antes do registro civil sistemático pode escapar totalmente da rede dos compiladores, e que um testamento primário frequentemente recupera o que as genealogias impressas não alcançam.

  - **[CONTEXTUAL]** O jornal *A Sentinella*, do qual fazia parte (por meio do irmão), traça um notável arco geracional: de colonos suíços que chegaram em 1819 falando francês e alemão, para uma imprensa regional em português dentro de três gerações, atuando no coração do país cafeeiro da Zona da Mata.

  ## Identidade

  **Joaquim José Bohrer** (*Bohrer / Borer* são o mesmo sobrenome) [PROVEN]. Negociante em
  Nova Friburgo, pai de Celina (Selina) Bohrer (P-0015) e neto dos colonos suíços Borer.

  - **Nascimento:** em Itaboraí (RJ) — seu próprio casamento de 1884 o registra "natural e
  baptisado em Itaborahy" [PROVEN — PAR-0056], o lar da família em Itaboraí (sua mãe Roza nasceu
  ali e o casamento de seus pais foi celebrado ali). Isso conflita com o "natural desta
  Freguezia" (Nova Friburgo) declarado por seu irmão no nascimento de 1890 do filho Alberto
  (CIV-0019); ambas as formas são preservadas, sendo a de Itaboraí (declarada por ele próprio) a
  mais forte. Seu aniversário era 16 de dezembro — o semanário A Sentinella (18 de dezembro de
  1898) o inclui entre os que "fizeram annos … no dia 16" (NWS-0005) [PROVEN quanto ao dia]. O
  casamento de 1884 dá sua idade como 22 → n. ~1861/62 [PROVEN conforme declarado]; uma
  inferência estrutural (primogênito de um casal casado até ~1858, mais velho que a irmã Ludovina
  n. 1862) pode situá-lo alguns anos antes, ~1858–59 [INFERRED, baseado em pistas]. Ano exato
  [OPEN].

  - **Pais:** Francisco José Bohrer (P-0034) e Rosa Eugenia de Lemos (P-0035) [PROVEN] —
  nomeados como avós paternos no nascimento de 1890 de seu filho Alberto (CIV-0019); o
  próprio testamento de 1888 de Francisco nomeia Joaquim em primeiro lugar entre os quatro
  herdeiros (PRB-0005).

  - **Casamento:** com Lucinda Ferreira da Silva (P-0031, também "Lucinda Ferreira da Silva
  Bohrer") em 19 de abril de 1884 na Matriz de São João Baptista de Nova Friburgo (celebrante
  Padre José Giffoni), ele com 22 e ela com 21 anos [PROVEN — o próprio ato de casamento
  PAR-0056, evento E-0085; também nomeados como os pais casados nos nascimentos de 1890 e 1891
  de seus filhos, CIV-0019, CIV-0020].

  - **Filhos:** documentados — Alberto (n. 17 de junho de 1890, CIV-0019); um filho menino
  (n. 23 de dezembro de 1891, f. 29 de janeiro de 1892, CIV-0020); Antonio José (f. 2 de abril
  de 1899, aos 13 anos, por mordedura de jararacussú, NWS-0006); Celina / Selina (P-0015, n. 13
  de maio de 1899, baptizada em 27 de setembro de 1899, PAR-0057 — a ancestral de nossa linha);
  Etelvina (n. 16 de maio de 1900, baptizada em 1902, PAR-0075); Joaquim Carlos (n. 6 de janeiro
  de 1896, PAR-0078); Renato (n. 12 de setembro de 1897, baptizado em 1898, PAR-0079); e Lucinda
  Maria (n. 26 de julho de 1908, PAR-0052) — depois Lucinda Bohrer Moreira, casada com Antonio
  Moreira, f. 3 de julho de 1996, Volta Redonda, viúva sem descendência (CIV-0032). O baptismo de
  1908 e o óbito de 1996 nomeiam a mesma mulher [STRONG-EVIDENCE]: mesmo aniversário (26 de julho)
  e mesmos pais; o "n. 1909" do óbito é declarado pelo informante, e o ano do baptismo (1908) é o
  primário. [PROVEN]

  - **Óbito:** já falecido em 1924 — registrado "já falecidos" com a esposa no nascimento
  de 1924 de seu neto Eunir em Nova Friburgo (CIV-0016) e como pai falecido de Celina em
  seu óbito de 1977 (CIV-0015) [PROVEN quanto ao limite]; data exata não obtida. [OPEN]

  ## Posição social e profissão

  - **Negociante no Alto da Serra, Nova Friburgo** [PROVEN] — assim registrado nos
  nascimentos de 1890 e 1891 de seus filhos (CIV-0019, CIV-0020); sua residência no Alto da
  Serra, o antigo bairro da colônia suíço-alemã, é a sede da família.

  - Estava vivo e foi nomeado no jornal da família, A Sentinella, em 1898–1899 (dirigido
  por seu irmão Guilherme Samuel Bohrer), mas apenas em uma nota de aniversário e na nota
  de óbito de seu filho — o que sugere um comerciante reservado, e não um titular de cargo
  público, ao contrário dos irmãos. [INFERRED, NWS-0005, NWS-0006]

  ## Família e rede social

  Seu pai Francisco José Bohrer declarou-se "natural deste termo" e filho legítimo de Jacob
  Bahrer (Borer) e Catharina Mayer, "já fallecidos" (PRB-0005) — o limite imigrante desta
  linha Borer I (Jacob), de Erschwil, Soleure. Sua mãe Rosa Eugenia de Lemos era da família
  Lemos associada a Itaboraí (RJ): o casamento de seus pais fora celebrado perante o
  coadjutor de Itaboraí e foi judicialmente justificado e registrado na matriz de Nova
  Friburgo em 1879 (PAR-0002). Seus irmãos eram Laura, Guilherme Samuel (o proprietário de
  A Sentinella) e Fernando (PRB-0005); seu tio materno Manoel Pereira de Lemos, industrial
  da Venda das Pedras, faleceu em 1898 (NWS-0002).

  ## O que podemos extrapolar

  Joaquim prova que um testamento primário supera as compilações impressas. [INFERRED] Duas
  compilações genealógicas de Nova Friburgo o omitem por completo, mas o testamento de 1888 de
  seu próprio pai o nomeia herdeiro primogênito (PRB-0005). A leitura mais econômica é que ele
  nasceu em Itaboraí, a freguesia de terras baixas de sua mãe, fora da rede lançada pelos
  compiladores friburguenses — seu próprio casamento de 1884 o registra "natural e baptisado em
  Itaborahy", com 22 anos (PAR-0056) [PROVEN]. Ausência das listas impressas não é ausência da
  pessoa, advertência que vale para toda esta linha.

  **O que ele herdou foi um quarto; o que fez disso foi comércio.** [INFERRED] O testamento do
  pai o tornou um de quatro coerdeiros de uma propriedade serrana modesta (PRB-0005) [PROVEN], e
  já em 1890–91 ele é *negociante* com casa própria no Alto da Serra (CIV-0019, CIV-0020)
  [PROVEN]. Essa é a conversão que define a família, em um único passo: da terra, que se herda,
  para a margem de comerciante, que não se herda. A renda do comércio sobe e desce com a
  economia ao redor, não é salário fixo e não deixa atrás de si nada que um filho possa herdar
  [CONTEXTUAL].

  **A geografia desse comércio diz que tipo de comerciante ele era.** Os dois registros de
  nascimento de filhos anotam a distância até o cartório: seu irmão Guilherme, declarando por
  ele em 1890, veio "distante deste cartorio tres leguas", e o próprio Joaquim, em 1891,
  "distante deste cartorio mais de uma legua" (CIV-0019, CIV-0020) [PROVEN]. Três léguas são da
  ordem de dezoito quilômetros de caminho de serra. Tratava-se de uma venda de mato servindo
  sítios dispersos, não de uma loja na praça da cidade; e as duas testemunhas do ato de 1890 são
  um *jornaleiro* (diarista) e um *caçeiro* (CIV-0019) [PROVEN] — o círculo imediato do
  domicílio no momento do registro era de trabalhadores, não de notáveis. [INFERRED]

  **A geração dele é o retrato mais nítido do teto da família — e de quão contingente esse teto
  era.** [INFERRED/CONTEXTUAL] Joaquim era *negociante*; seu irmão Guilherme era gerente e
  proprietário do semanário *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN], e os
  materiais de recuperação acrescentam para ele a patente de Capitão e a subdelegacia de São
  Pedro [LEAD] — cargos que, se exercidos, eram gratuitos na lei brasileira [CONTEXTUAL]. O
  prestígio do domicílio assentava, portanto, sobre um jornal e uma venda, sem nenhum cargo
  remunerado por baixo. É a mesma fragilidade estrutural que desfez, por cima, a linha paterna
  Armond desta família: posição sem base salarial não sobrevive à perda daquilo que a paga.

  **A sucessão partível, aplicada duas vezes, é a explicação inteira.** [CONTEXTUAL/INFERRED] O
  espólio de 1888 foi dividido em quatro; o próprio domicílio de Joaquim produziu depois ao
  menos oito filhos documentados nos registros disponíveis — Antonio José (n. ~1885), Alberto
  (1890), um filho de colo (n. dez. 1891, f. jan. 1892), Joaquim Carlos (1896), Renato (1897),
  Celina (1899), Etelvina (1900) e Lucinda (1908/09) —, com o levantamento de pesquisa
  reconciliado apontando um total mais próximo de onze [LEAD]. Um quarto dividido de novo por
  oito ou onze não deixa nada mensurável por cabeça. Nenhuma catástrofe é necessária para
  explicar por que sua filha Celina morreu em 1977 tendo "não deixado bens nem testamento"
  (CIV-0015) [PROVEN]: a aritmética faz isso sozinha.

  **Um comerciante discreto numa família pública, num domicílio exposto ao risco do mato.**
  [INFERRED] Embora o irmão fosse dono do jornal da cidade, Joaquim aparece nele apenas duas
  vezes — uma nota de aniversário (NWS-0005) e o falecimento do próprio filho (NWS-0006)
  [PROVEN] —, o que se lê como comerciante de trabalho e não como homem público. E o domicílio
  carregava o perfil de mortalidade do mato, não o da cidade: um filho de colo morreu em janeiro
  de 1892 (CIV-0020, nota marginal) e, em abril de 1899, seu filho Antonio José, de 13 anos,
  morreu picado por uma jararacussú no distrito de São Pedro (NWS-0006) [PROVEN]. Ele é a última
  geração a ocupar a posição do Alto da Serra: em uma geração sua filha parte para Minas Gerais
  e o platô se fecha atrás dela.

