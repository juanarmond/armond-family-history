  relatado para 1921, e não no dele [LEAD]. A última prova de vida disponível é a concepção de
  Lucinda Maria, nascida em julho de 1908 (PAR-0052) [INFERRED].

  ## Posição social e profissão

  - **Negociante no Alto da Serra, Nova Friburgo** [PROVEN] — assim registrado nos
  nascimentos de 1890 e 1891 de seus filhos (CIV-0019, CIV-0020); sua residência no Alto da
  Serra, o antigo bairro da colônia suíço-alemã, é a sede da família. Em 1890 seu irmão
  Guilherme registrou o nascimento de Alberto, ocorrido na casa de Joaquim, porque Joaquim estava
  fora: "por achar-se o seu dito irmão ausente" (CIV-0019) [PROVEN].

  - Estava vivo e foi nomeado no jornal da família, A Sentinella, em 1898–1899 (dirigido
  por seu irmão Guilherme Samuel Bohrer), mas apenas em uma nota de aniversário e na nota
  de óbito de seu filho — o que sugere um comerciante reservado, e não um titular de cargo
  público, ao contrário dos irmãos. [INFERRED, NWS-0005, NWS-0006] Uma terceira aparição é
  relatada pela pesquisa de recuperação: o convite para a missa de 6 de fevereiro de 1898 por seu
  tio materno, que ele assinou como sobrinho com a esposa e os irmãos. Este projeto leu esse
  recorte, mas não o catalogou [LEAD].

  - **Alfabetização:** nenhuma assinatura dele sobrevive num ato disponível; o assento de 1891
  que ele declarou continua fora da imagem retida (CIV-0020). O ofício de negociante implica
  alfabetização funcional [INFERRED].

  ## Família e rede social

  Seu pai Francisco José Bohrer declarou-se "natural deste termo" e filho legítimo de Jacob
  Bohrer ([incerto]; antes lido "Bahrer"; Borer) e Catharina Mayer, "já fallecidos" (PRB-0005) — o limite
  imigrante desta linha Borer I (Jacob), do Cantão de Solothurn (Soleure). Sua mãe Rosa Eugenia de Lemos era da família
  Lemos associada a Itaboraí (RJ): o casamento de seus pais fora celebrado perante o
  coadjutor de Itaboraí e foi judicialmente justificado em 1879, sendo a justificação
  registrada no livro de casamentos da Matriz de Itaboraí (fl. 177) em 1º de agosto de 1879
  (PAR-0002). Seus irmãos eram Laura, Guilherme Samuel (o proprietário de
  A Sentinella) e Fernando (PRB-0005); seu tio materno Manoel Pereira de Lemos, industrial
  da Venda das Pedras, faleceu em 1898 (NWS-0002). Venda das Pedras é hoje um bairro de Itaboraí
  [CONTEXTUAL]; o convite de missa de 6 de fevereiro de 1898, não catalogado, escreve o tio
  "Manoel Antunes de Lemos" [LEAD].

  **Parentes em seus próprios atos.** O irmão de sua mãe, Candido Pereira de Lemos, nomeado no
  testamento como "meu cunhado", segundo testamenteiro e tutor dos filhos (PRB-0005), foi
  testemunha do casamento de Joaquim em 1884 (PAR-0056) [PROVEN]. Sua irmã Laura Maria Bohrer,
  de 18 anos, casou-se com Bernardo Nunes Pinto em 24 de maio de 1884, na mesma abertura do livro
  que o seu próprio casamento (PAR-0056) [PROVEN]. O casal foi padrinho de seu filho Renato em
  1898, escritos "Bernardo Nunes" e "Laura Borba Nunes", sendo "Pinto" leitura incerta
  (PAR-0079). O testamento chama os quatro filhos de "todos de menor idade": foi feito em 27 de
  junho de 1879, cinco anos antes do casamento de Joaquim em 1884, e só aberto e registrado em
  1888 (PRB-0005) [PROVEN — confirma-se a inferência anterior de que precedia o registro]. A
  pesquisa de recuperação acrescenta uma quinta filha de seus pais, Ludovina,
  n. e f. 1862 [LEAD].

  **A família da esposa.** Lucinda (P-0031) era filha de Antonio da Silva Ferreira e de Maria
  Joanna Roschemant da Silva Ferreira (PAR-0056), sendo "Roschemant" a grafia do padre para
  Rutschmann; sua linha é seguida no perfil dela.

  **Compadrio.** Os padrinhos de seus filhos foram João Berbert e Luiza Berbert (Joaquim Carlos,
  1896, PAR-0078); sua irmã e o cunhado (Renato, 1898, PAR-0079); José da Silva Ferreira e Maria
  da Gloria da Silva Ferreira (Celina, 1899, PAR-0057); Antonio Auverney Sobrinho e Maria Orich
  Marchon (Etelvina, 1902, PAR-0075); e João Gonçalves Pinheiro e Maria Hortencia Pinheiro
  (Lucinda Maria, 1908, PAR-0052) [PROVEN]. Nenhum traz patente ou título. Os padrinhos de Celina
  partilham o sobrenome da esposa e eram provavelmente parentes dela [INFERRED]; os demais são
  parentes e famílias da colônia, o mesmo circuito fechado visto no domicílio de Valentim ×
  Carolina.

  ## O que podemos extrapolar

  Joaquim prova que um testamento primário supera as compilações impressas. [INFERRED] Duas
  compilações genealógicas de Nova Friburgo o omitem por completo, mas o testamento de seu
  próprio pai o põe em primeiro lugar entre os herdeiros (PRB-0005). A leitura mais econômica é que ele
  nasceu em Itaboraí, a freguesia de terras baixas de sua mãe, fora da rede lançada pelos
  compiladores friburguenses — seu próprio casamento de 1884 o registra "natural e baptisado em
  Itaborahy", com 22 anos (PAR-0056) [PROVEN]. Ausência das listas impressas não é ausência da
  pessoa, advertência que vale para toda esta linha.

  **Ele nada herdou; o que tinha era o comércio.** [PROVEN/INFERRED] O testamento do pai o
  tornou um de quatro coerdeiros (PRB-0005) [PROVEN], mas o espólio nunca foi transmitido:
  depois da morte do pai os bens do casal foram vendidos em praça pública e inteiramente
  absorvidos pelos credores, e em 1890 sua mãe foi exonerada da prestação de contas da
  testamentaria (PRB-0012) [PROVEN]. Já em 1890–91 ele é *negociante* com casa própria no Alto
  da Serra (CIV-0019, CIV-0020) [PROVEN] — posição reconstruída, não herdada [INFERRED]. Se o
  comércio foi uma ruptura com a vida do pai ou uma continuação dela é questão aberta: entradas
  de índice do FamilySearch não lidas, relatadas pelo lado da recuperação, situam uma "caza de
  negocio do Alto da Serra" no inventário do pai de 1888 [LEAD]. A renda do comércio sobe e
  desce com a economia ao redor, não é salário fixo e não deixa atrás de si nada que um filho
  possa herdar [CONTEXTUAL].

  **A geografia desse comércio diz que tipo de comerciante ele era.** Os dois registros de
  nascimento de filhos anotam a distância até o cartório: seu irmão Guilherme, declarando por
  ele em 1890, veio "distante deste cartorio tres leguas", e o próprio Joaquim, em 1891,
  "distante deste cartorio mais de uma legua" (CIV-0019, CIV-0020) [PROVEN]. Três léguas são da
  ordem de dezoito quilômetros de caminho de serra. Tratava-se de uma venda de mato servindo
  sítios dispersos, não de uma loja na praça da cidade; e as duas testemunhas do ato de 1890 são
  um *jornaleiro* (diarista) e um *caçeiro* (CIV-0019) [PROVEN] — o círculo imediato do
  domicílio no momento do registro era de trabalhadores, não de notáveis. [INFERRED]

  **A geração dele é o retrato mais nítido do teto da família — e de quão contingente esse teto
  era.** [INFERRED/CONTEXTUAL] Joaquim era *negociante*; seu irmão Guilherme era gerente e
  proprietário do semanário *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN], e os
  materiais de recuperação acrescentam para ele a patente de Capitão e a subdelegacia de São
  Pedro [LEAD] — cargos que, se exercidos, eram gratuitos na lei brasileira [CONTEXTUAL]. O
  prestígio do domicílio assentava, portanto, sobre um jornal e uma venda, sem nenhum cargo
  remunerado por baixo. É a mesma fragilidade estrutural que desfez, por cima, a linha paterna
  Armond desta família: posição sem base salarial não sobrevive à perda daquilo que a paga.

  **Uma venda para os credores, e depois a sucessão partível, é a explicação inteira.**
  [PROVEN/CONTEXTUAL/INFERRED] O espólio do pai, de 1888, não foi dividido em quatro — foi
  vendido para os credores e absorvido (PRB-0012) [PROVEN]; o próprio domicílio de Joaquim produziu depois ao
  menos oito filhos documentados nos registros disponíveis — Antonio José (n. ~1885), Alberto
  (1890), um filho de colo (n. dez. 1891, f. jan. 1892), Joaquim Carlos (1896), Renato (1897),
  Celina (1899), Etelvina (1900) e Lucinda (1908/09) —, com o levantamento de pesquisa
  reconciliado apontando um total mais próximo de onze [LEAD]. Nada desceu do pai, e o que ele
  mesmo construísse seria dividido de novo por oito ou onze. Nenhuma outra catástrofe é
  necessária para explicar por que sua filha Celina morreu em 1977 tendo "não deixado bens nem
  testamento" (CIV-0015) [PROVEN]: a venda para os credores e a aritmética fazem isso sozinhas.

  **Um comerciante discreto numa família pública, num domicílio exposto ao risco do mato.**
  [INFERRED] Embora o irmão fosse dono do jornal da cidade, Joaquim aparece nele apenas duas
  vezes — uma nota de aniversário (NWS-0005) e o falecimento do próprio filho (NWS-0006)
  [PROVEN] —, o que se lê como comerciante de trabalho e não como homem público. E o domicílio
  carregava o perfil de mortalidade do mato, não o da cidade: um filho de colo morreu em janeiro
  de 1892 (CIV-0020, nota marginal) e, em abril de 1899, seu filho Antonio José, de 13 anos,
  morreu picado por uma jararacussú no distrito de São Pedro (NWS-0006) [PROVEN]. Ele é a última
  geração a ocupar a posição do Alto da Serra: em uma geração sua filha parte para Minas Gerais
  e o platô se fecha atrás dela.

