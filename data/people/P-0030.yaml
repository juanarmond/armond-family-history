profile: >-
  ## Interesting facts

  - **[PROVEN]** His birthday — 16 December — was documented not by a vital record but by the family newspaper *A Sentinella* on 18 December 1898, in a birthday notice published by his brother Guilherme Samuel Bohrer, the editor (NWS-0005). A personal date fixed by a press notice alone.

  - **[PROVEN]** His son Antonio José, aged 13, died on 2 April 1899 from a jararacussú snakebite — reported in *A Sentinella* as "sobrinho do gerente desta folha," the nephew of the paper's own editor: a family tragedy documented by a family newspaper (NWS-0006).

  - **[PROVEN]** His own 1884 marriage record (PAR-0056) places his birthplace at Itaboraí ("natural e baptisado em Itaborahy"), not Nova Friburgo — contradicting the "natural desta Freguezia" his brother declared in the 1890 birth registration (CIV-0019). The same man's origin differs between self-declaration and informant-declaration.

  - **[CONTEXTUAL]** His generation represents the brief petty-bourgeois peak of the colonist line: with a brother editing a regional newspaper and a household in commerce, the Bohrer family of the late 19th century had moved well beyond farming into civic life — the same shift visible across Nova Friburgo as Swiss descendants urbanised in the railway era.

  - **[INFERRED]** He is absent from two published Nova Friburgo colonist genealogy compilations, yet his own father's will (made 27 June 1879, opened 1888) names him first of the four heirs, which is read as firstborn (PRB-0005) — proof that a man born before systematic civil registration can slip the compilers' net entirely, and that a primary will often recovers what printed genealogies miss.

  - **[CONTEXTUAL]** The *A Sentinella* newspaper he was part of (through his brother) traces a remarkable generational arc: from Swiss colonists who arrived in 1819 speaking French and German, to a Portuguese-language regional press within three generations, published in the highland Serra Fluminense of Rio de Janeiro.

  - **[PROVEN]** On 14 September 1908, at the São Pedro chapel of Nova Friburgo, his daughter Lucinda Maria was baptised on the same day and the same folio as Maria Clara, a daughter of Valentim Martinho Bohrer and Carolina Klein. Those were the parents of João Gonçalves Bohrer, who would marry his daughter Celina (PAR-0052). The two Bohrer households whose children later married were baptising daughters side by side.

  ## Identity

  **Joaquim José Bohrer** (*Bohrer / Borer* are the same surname) [PROVEN]. A Nova Friburgo
  merchant, father of Celina (Selina) Bohrer (P-0015), and a grandson of the Swiss Borer
  colonists.

  - **Born:** at Itaboraí (RJ) — his own 1884 marriage records him "natural e baptisado em
  Itaborahy" [PROVEN — PAR-0056], the family's Itaboraí home (his mother Roza was born there and
  his parents' marriage was celebrated there). This conflicts with the third-party "natural
  desta Freguezia" (Nova Friburgo) declared by his brother at son Alberto's 1890 birth
  (CIV-0019); both are preserved, the self-stated Itaboraí reading being the stronger. His
  birthday was 16 December — the weekly A Sentinella (18 December 1898) lists him among those who
  "fizeram annos … no dia 16" (NWS-0005) [PROVEN of the day]. The 1884 marriage gives his age as
  22 → b. ~1861/62 [PROVEN as stated]; taken with the 16 December birthday, an exact age would
  mean 16 December 1861 [INFERRED]. The retrieval research prefers ~1858–59: his parents'
  marriage was deposed in 1879 as celebrated "a mais de vinte annos" earlier (PAR-0002) [PROVEN
  as deposed], the will lists him first of the children (PRB-0005), and a sister Ludovina is
  reported born in July 1862 and dead that December [LEAD — record not held here]. The will calls
  all four children "todos de menor idade" on 27 June 1879 (PRB-0005) [PROVEN]; with majority at
  21, that puts his birth after about June 1858 if taken literally [INFERRED]. If that
  sister is right, a December-1861 birth is impossible, so he was born no later than December
  1860 and the stated age of 22 is too low [INFERRED, resting on a lead]. Exact year [OPEN].

  - **Parents:** Francisco José Bohrer (P-0034) and Rosa Eugenia de Lemos (P-0035) [PROVEN]
  — named as the paternal grandparents in his son Alberto's 1890 birth (CIV-0019);
  Francisco's own will (27 June 1879; opened 1888) names Joaquim first among his four heirs
  (PRB-0005).

  - **Marriage:** to Lucinda Ferreira da Silva (P-0031, also "Lucinda Ferreira da Silva
  Bohrer") on 19 April 1884 at the Nova Friburgo Matriz de São João Baptista (celebrant Padre
  José Giffoni), he 22 and she 21 [PROVEN — their own marriage act PAR-0056, event E-0085; also
  named as the married parents in their sons' 1890 and 1891 births, CIV-0019, CIV-0020]. The act
  writes her "Lucinda Roschemant da Silva Ferreira", born at S. João Baptista da Lagoa "na
  Corte", both partners then living at Nova Friburgo; the witnesses were Eduardo Guilherme Buck
  and his maternal uncle Candido Pereira de Lemos (PAR-0056).

  - **Children:** documented — Alberto (b. 17 June 1890, CIV-0019); an infant son (b. 23
  December 1891, d. 29 January 1892, CIV-0020); Antonio José (d. 2 April 1899, aged 13, of a
  jararacussú snakebite, NWS-0006); Celina / Selina (P-0015, b. 13 May 1899, baptised 27
  September 1899, PAR-0057 — the ancestor of our line); Etelvina (b. 16 May 1900, baptised 1902,
  PAR-0075); Joaquim Carlos (b. 6 January 1896, PAR-0078); Renato (b. 12 September 1897,
  baptised 1898, PAR-0079); and Lucinda Maria (b. 26 July 1908, PAR-0052) — later Lucinda Bohrer
  Moreira, married Antonio Moreira, d. 3 July 1996 Volta Redonda, widow without issue (CIV-0032).
  The 1908 baptism and the 1996 death name one woman [STRONG-EVIDENCE]: identical 26 July birthday
  and parents; the death's "born 1909" is informant-reported, the baptism year (1908) primary.
  [PROVEN] The 1891 infant's given name is not legible on the held image (CIV-0020); the
  retrieval side labels him João. The FamilySearch tree adds Francisco José (b. 1885), Joaquim
  José Júnior (b. 1899) and Álvaro José [LEAD — tree only; no record found].

  - **Death:** date not held. The only documentary bound held is from above: Celina's 1977
  death names him as her deceased father (CIV-0015) [PROVEN of the bound]. [OPEN] [Corrected
  2026-10-08 from the image: Eunir's 1924 Nova Friburgo birth (CIV-0016) reads "já fallecida" in
  the singular, marking only Lucinda as deceased — not "já falecidos" with his wife — so it does
  not place his death before 1924.] Both his granddaughter Senira's 1923 birth (CIV-0038) and his
  grandson Eunir's May 1924 birth (CIV-0016) name him as maternal grandfather and mark only
  Lucinda as deceased. That hints he was still living in 1923 and in May 1924, though a scribe's
  grammar is weak evidence [INFERRED]. The 1921 lower bound used elsewhere rests on Lucinda's reported 1921 death, not on
  his [LEAD]. The latest held proof of life is the conception of Lucinda Maria, born July 1908
  (PAR-0052) [INFERRED].

  ## Standing and profession

  - **Negociante (merchant) at the Alto da Serra, Nova Friburgo** [PROVEN] — so recorded in
  his sons' 1890 and 1891 birth registrations (CIV-0019, CIV-0020); his residence at the
  Alto da Serra, the old Swiss-German colony quarter, is the family seat. In 1890 his brother
  Guilherme registered Alberto's birth, which took place in Joaquim's house, because Joaquim was
  away: "por achar-se o seu dito irmão ausente" (CIV-0019) [PROVEN].

  - He was alive and named in his family's paper A Sentinella in 1898–1899 (run by his
  brother Guilherme Samuel Bohrer), but only in a birthday notice and his son's death
  notice — suggesting a private tradesman rather than a public office-holder, unlike his
  brothers. [INFERRED, NWS-0005, NWS-0006] A third appearance is reported by the retrieval
  research: the 6 February 1898 memorial-mass notice for his maternal uncle, which he co-signed
  as nephew with his wife and brothers. This project read that clipping but did not catalogue
  it [LEAD].

  - **Literacy:** no signature of his survives in a held act; the 1891 entry he declared runs
  off the retained image (CIV-0020). A negociante's trade implies working literacy [INFERRED].

  ## Family and social network

  His father Francisco José Bohrer declared himself "natural deste termo" and a legitimate
  son of Jacob Bohrer ([uncertain]; formerly read "Bahrer"; Borer) and Catharina Mayer, "já fallecidos"
  (PRB-0005) — the immigrant boundary of this Borer I (Jacob) line, from Canton Solothurn
  (Soleure). His mother Rosa
  Eugenia de Lemos was of the Lemos family associated with Itaboraí (RJ): his parents'
  marriage had been celebrated before the coadjutor of Itaboraí and was judicially
  justified in 1879, the justification being registered in the Itaboraí Matriz marriage book
  (fl. 177) on 1 August 1879 (PAR-0002). His siblings
  were Laura, Guilherme Samuel (the A Sentinella proprietor) and Fernando (PRB-0005); his
  maternal uncle Manoel Pereira de Lemos, an industrialist of Venda das Pedras, died in
  1898 (NWS-0002). Venda das Pedras is today a neighbourhood of Itaboraí [CONTEXTUAL]; the
  uncatalogued 6 February 1898 mass notice writes the uncle "Manoel Antunes de Lemos" [LEAD].

  **Kin in his own acts.** His mother's brother Candido Pereira de Lemos, named in the will as
  "meu cunhado", second executor and guardian of the children (PRB-0005), was a witness at
  Joaquim's 1884 wedding (PAR-0056) [PROVEN]. His sister Laura Maria Bohrer, aged 18, married
  Bernardo Nunes Pinto on 24 May 1884, on the same register opening as his own marriage
  (PAR-0056) [PROVEN]. The couple stood as godparents to his son Renato in 1898, written
  "Bernardo Nunes" and "Laura Borba Nunes", the "Pinto" an uncertain read (PAR-0079). The
  will calls all four children "todos de menor idade": it was made on 27 June 1879, five years
  before Joaquim's 1884 marriage, and only opened and registered in 1888 (PRB-0005) [PROVEN —
  the earlier inference that it predated its registration is confirmed]. The retrieval research
  adds a fifth child of his parents, Ludovina, b. and d. 1862 [LEAD].

  **His wife's family.** Lucinda (P-0031) was the daughter of Antonio da Silva Ferreira and
  Maria Joanna Roschemant da Silva Ferreira (PAR-0056), "Roschemant" being the priest's
  rendering of Rutschmann; her line is followed on her own profile.

  **Compadrio.** His children's godparents were João Berbert and Luiza Berbert (Joaquim Carlos,
  1896, PAR-0078); his sister and brother-in-law (Renato, 1898, PAR-0079); José da Silva Ferreira
  and Maria da Gloria da Silva Ferreira (Celina, 1899, PAR-0057); Antonio Auverney Sobrinho and
  Maria Orich Marchon (Etelvina, 1902, PAR-0075); and João Gonçalves Pinheiro and Maria Hortencia
  Pinheiro (Lucinda Maria, 1908, PAR-0052) [PROVEN]. None carries a rank or title. Celina's
  sponsors share his wife's surname and were probably her kin [INFERRED]; the rest are kin and
  colony families, the same closed circuit seen in the Valentim × Carolina household.

  ## What we can extrapolate

  Joaquim proves that a primary will beats printed compilations. [INFERRED] Two Nova Friburgo
  genealogy compilations omit him entirely, yet his own father's will lists him first among the
  heirs (PRB-0005). The most economical reading is that he was born at Itaboraí, his mother's
  lowland parish, outside the net the Nova Friburgo compilers cast — his own 1884 marriage
  records him "natural e baptisado em Itaborahy", aged 22 (PAR-0056) [PROVEN]. Absence from the
  printed lists is not absence of the person, a caution that applies to this whole line.

  **He inherited nothing; what he had was trade.** [PROVEN/INFERRED] His father's will made him
  one of four co-heirs (PRB-0005) [PROVEN], but the estate never devolved: after his father's
  death the couple's goods were sold at public auction and wholly absorbed by the creditors, and
  in 1890 his mother was exonerated from rendering the executor's accounts (PRB-0012) [PROVEN].
  By 1890–91 he is a *negociante* with his own house at the Alto da Serra (CIV-0019, CIV-0020)
  [PROVEN] — a standing rebuilt, not inherited [INFERRED]. Whether trade was a break from his
  father's life or a continuation of it is open: unread FamilySearch index entries reported by
  the retrieval side place a "caza de negocio do Alto da Serra" in his father's 1888 inventário
  [LEAD]. Commerce income rises and falls with the surrounding economy, is not a fixed wage, and
  leaves nothing behind that a child can inherit [CONTEXTUAL].

  **The geography of that trade tells you what kind of merchant he was.** Both of his children's
  birth registrations record the distance from the cartório: his brother Guilherme, declaring
  for him in 1890, came "distante deste cartorio tres leguas", and Joaquim himself in 1891
  "distante deste cartorio mais de uma legua" (CIV-0019, CIV-0020) [PROVEN]. Three leagues is on
  the order of eighteen kilometres of serra track. This was a back-country store serving
  scattered farms, not a shop on the town square; and the two witnesses to the 1890 act are a
  *jornaleiro* (day-labourer) and a *caçeiro* (CIV-0019) [PROVEN] — the household's immediate
  circle at the moment of registration was labouring, not notable. [INFERRED]

  **His generation is the clearest snapshot of the family's ceiling — and of how contingent that
  ceiling was.** [INFERRED/CONTEXTUAL] Joaquim was a *negociante*; his brother Guilherme was
  manager and proprietor of the weekly *A Sentinella* (NWS-0002, NWS-0005, NWS-0006) [PROVEN],
  and the retrieval materials add a Capitão rank and a São Pedro subdelegacy for him [LEAD] —
  posts that, if held, were unpaid under Brazilian law [CONTEXTUAL]. So the household's prestige
  sat on a newspaper and a shop, with no salaried office underneath it. That is the same
  structural weakness that undid the paternal Armond line of this family from above: status with
  no wage-base cannot survive the loss of the thing paying for it.

  **A creditors' sale, then partible succession, is the whole explanation.**
  [PROVEN/CONTEXTUAL/INFERRED] His father's 1888 estate was not divided four ways — it was sold
  for the creditors and absorbed (PRB-0012) [PROVEN]; Joaquim's own household then produced at least eight
  children documented in the held records — Antonio José (b. ~1885), Alberto (1890), an infant
  son (b. Dec 1891, d. Jan 1892), Joaquim Carlos (1896), Renato (1897), Celina (1899), Etelvina
  (1900) and Lucinda (1908/09) — with the reconciled research roster putting the total nearer
  eleven [LEAD]. Nothing came down from his father, and whatever he built himself would be divided
  again by eight or eleven. No further catastrophe is needed to explain why his daughter Celina
  died in 1977 having "não deixou bens nem testamento" (CIV-0015) [PROVEN]: the creditors' sale
  and the arithmetic do it on their own.

  **A private tradesman in a public family, in a household exposed to back-country risk.**
  [INFERRED] Although his brother owned the town paper, Joaquim appears in it only twice — a
  birthday notice (NWS-0005) and the death of his own son (NWS-0006) [PROVEN] — which reads as a
  working merchant rather than a public man. And the household carried the mortality profile of
  the mata rather than the town: an infant son died in January 1892 (CIV-0020, marginal note),
  and in April 1899 his 13-year-old son Antonio José died of a jararacussú bite in the São Pedro
  district (NWS-0006) [PROVEN]. He is the last generation to hold the Alto da Serra position:
  within a generation his daughter has left for Minas Gerais, and the plateau closes behind her.

  ## Open questions

  - His exact baptism act (Itaboraí, ~1858–62) and his death record (Nova Friburgo; date open —
  no longer bounded to 1921–1924, since CIV-0016 does not mark him deceased) — not held. (His 1884 marriage to Lucinda is now held — PAR-0056.) [OPEN]

  - **Death search bounds.** The retrieval research reports a bounded negative for him in the
  Nova Friburgo Matriz óbito book from November 1919 to 11 May 1924, with one gap of about six
  entries around September–October 1920 [LEAD — search not repeated here]. The remaining
  targets are the São Pedro and São José do Ribeirão parish books and the civil death registers
  — from 1921 onward, or from late May 1924 onward if the singular "já fallecida" in CIV-0038
  (1923) and CIV-0016 (May 1924) means he was then living [INFERRED]; the Matriz negative to 11
  May 1924 would not reach that later window. [OPEN] [Corrected 2026-10-08: the earlier
  1921–1924 window rested partly on misreading CIV-0016 as "já falecidos".]

  - **The tree-only children** (Francisco José, Joaquim José Júnior, Álvaro José): Nova Friburgo
  civil births or baptisms would confirm or retire them. [OPEN]

  ## Sources held (this repository)

  - CIV-0019 (son Alberto's 1890 birth — his parents, both grandparent couples, his trade
  and residence) · CIV-0020 (infant son's 1891 birth and 1892 death) · NWS-0005 (A
  Sentinella, 18 Dec 1898 — his 16 December birthday) · NWS-0006 (A Sentinella, 4 Apr 1899
  — his son Antonio José's death) · NWS-0002 (A Sentinella, 1898 — his mother's brother
  Manoel Pereira de Lemos's death).

  - PAR-0056 (his own 1884 Nova Friburgo marriage to Lucinda — 19 April 1884, aged 22, "natural
  e baptisado em Itaborahy", his parents named) · PAR-0057 (daughter Celina's 1899 baptism) ·
  PAR-0075 (daughter Etelvina's 1902 baptism) · PAR-0078 (son Joaquim Carlos's 1896 baptism) ·
  PAR-0079 (son Renato's 1897/1898 baptism) · PAR-0052 (daughter Lucinda Maria's 1908
  baptism) · CIV-0032 (the same daughter's 1996 Volta Redonda death, as Lucinda Bohrer Moreira) — all naming
  him as father.

  - PRB-0005 (certified copy of his father Francisco José's registered will of 27 June 1879,
  opened 1888 — names Joaquim first of four minor heirs; gives the grandparents Jacob Bohrer and
  Catharina Mayer) · PRB-0012 (the 1890 Provedoria proceedings on his father's testamentaria —
  the estate sold at auction and absorbed by creditors) · PAR-0002 (his parents' 1879 marriage
  justification) ·
  CIV-0015 (daughter Celina's 1977 death — names him as deceased father) · CIV-0016
  (grandson Eunir's 1924 birth — names him as maternal grandfather, with only Lucinda marked
  "já fallecida"; corrected 2026-10-08 from the image) · CIV-0038 (granddaughter Senira's
  1923 birth — names him as maternal grandfather, with only Lucinda marked "já fallecida").

  ## Regional and migration context

  Born and baptised at Itaboraí (PAR-0056), he spent his documented adult life in Nova
  Friburgo, the highland Swiss-German colony town (RJ) founded under João VI's decree of 16 May
  1818; by the late 19th century the colonist descendants had turned from farming to trade,
  politics and journalism, and Joaquim was a merchant of that urbanizing town. [CONTEXTUAL]
  His household was at the Alto da Serra in 1890–91 (CIV-0019, CIV-0020); by 1899 a son died
  in the São Pedro district (NWS-0006) and in 1908 a daughter was baptised at the São Pedro
  chapel (PAR-0052), which suggests a shift toward São Pedro [INFERRED].
  His Brazilian nationality follows jus soli; the Swiss origin is documented up the Borer
  line (PRB-0005), not inferred from the surname. His branch stayed in Nova Friburgo; the
  move out to Minas Gerais and Volta Redonda came through his daughter Celina's marriage
  and the next generation.

  ## Where to go today

  - **1884 marriage to Lucinda (19 April 1884, held):** Catedral Diocesana / Igreja
  Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira
  23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Baptism (~1858–62, per his 1884 marriage "natural de Itaboraí"):** Igreja Matriz de São
  João Batista de Itaboraí, RJ (Praça Marechal Floriano Peixoto 15, Centro; CEP 24800-165) — the
  exact act is not held. [OPEN]

  - **Residence, 1890–91:** the Alto da Serra district of the freguesia of São João Baptista,
  Nova Friburgo, RJ ("morador no Alto da Serra desta Freguezia", CIV-0019) — a rural serra area
  with no single verified visitable point. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu aniversário — 16 de dezembro — foi documentado não por um registro vital, mas pelo jornal da família *A Sentinella* em 18 de dezembro de 1898, numa nota publicada por seu irmão Guilherme Samuel Bohrer, o redator (NWS-0005). Uma data pessoal fixada apenas por uma nota de imprensa.

  - **[PROVEN]** Seu filho Antonio José, de 13 anos, faleceu em 2 de abril de 1899 por mordedura de jararacussú — reportado no *A Sentinella* como "sobrinho do gerente desta folha", o sobrinho do próprio redator: uma tragédia familiar noticiada pelo jornal da família (NWS-0006).

  - **[PROVEN]** Seu próprio registro de casamento de 1884 (PAR-0056) indica seu local de nascimento como Itaboraí ("natural e baptisado em Itaborahy"), e não Nova Friburgo — contradizendo o "natural desta Freguezia" declarado pelo irmão no registro de nascimento de 1890 (CIV-0019). A origem de um mesmo homem difere entre autodeclaração e declaração de terceiros.

  - **[CONTEXTUAL]** Sua geração representa o breve platô pequeno-burguês do topo da linha colona: com um irmão editando um jornal regional e um lar no comércio, a família Bohrer do final do século XIX havia avançado muito além da lavoura para a vida cívica — a mesma mudança visível em toda Nova Friburgo à medida que os descendentes suíços se urbanizavam na era ferroviária.

  - **[INFERRED]** Ele está ausente de duas compilações genealógicas publicadas sobre colonos de Nova Friburgo, mas o testamento de seu próprio pai (feito em 27 de junho de 1879, aberto em 1888) o nomeia em primeiro lugar entre os quatro herdeiros, o que se lê como primogênito (PRB-0005) — prova de que um homem nascido antes do registro civil sistemático pode escapar totalmente da rede dos compiladores, e que um testamento primário frequentemente recupera o que as genealogias impressas não alcançam.

  - **[CONTEXTUAL]** O jornal *A Sentinella*, do qual fazia parte (por meio do irmão), traça um notável arco geracional: de colonos suíços que chegaram em 1819 falando francês e alemão, para uma imprensa regional em português dentro de três gerações, publicada na Serra Fluminense, no planalto do Rio de Janeiro.

  - **[PROVEN]** Em 14 de setembro de 1908, na capela de São Pedro de Nova Friburgo, sua filha Lucinda Maria foi batizada no mesmo dia e na mesma folha que Maria Clara, filha de Valentim Martinho Bohrer e Carolina Klein. Eram os pais de João Gonçalves Bohrer, que viria a casar-se com sua filha Celina (PAR-0052). Os dois domicílios Bohrer cujos filhos depois se casariam batizavam filhas lado a lado.

  ## Identidade

  **Joaquim José Bohrer** (*Bohrer / Borer* são o mesmo sobrenome) [PROVEN]. Negociante em
  Nova Friburgo, pai de Celina (Selina) Bohrer (P-0015) e neto dos colonos suíços Borer.

  - **Nascimento:** em Itaboraí (RJ) — seu próprio casamento de 1884 o registra "natural e
  baptisado em Itaborahy" [PROVEN — PAR-0056], o lar da família em Itaboraí (sua mãe Roza nasceu
  ali e o casamento de seus pais foi celebrado ali). Isso conflita com o "natural desta
  Freguezia" (Nova Friburgo) declarado por seu irmão no nascimento de 1890 do filho Alberto
  (CIV-0019); ambas as formas são preservadas, sendo a de Itaboraí (declarada por ele próprio) a
  mais forte. Seu aniversário era 16 de dezembro — o semanário A Sentinella (18 de dezembro de
  1898) o inclui entre os que "fizeram annos … no dia 16" (NWS-0005) [PROVEN quanto ao dia]. O
  casamento de 1884 dá sua idade como 22 → n. ~1861/62 [PROVEN conforme declarado]; somada ao
  aniversário de 16 de dezembro, uma idade exata significaria 16 de dezembro de 1861 [INFERRED].
  A pesquisa de recuperação prefere ~1858–59: o casamento de seus pais foi declarado em 1879 como
  celebrado "a mais de vinte annos" (PAR-0002) [PROVEN conforme depoimento], o testamento o põe
  em primeiro lugar entre os filhos (PRB-0005), e uma irmã Ludovina teria nascido em julho de
  1862 e falecido em dezembro do mesmo ano [LEAD — registro não disponível aqui]. O testamento
  chama os quatro filhos de "todos de menor idade" em 27 de junho de 1879 (PRB-0005) [PROVEN];
  com a maioridade aos 21 anos, isso situa seu nascimento depois de cerca de junho de 1858, se
  tomado ao pé da letra [INFERRED]. Se essa irmã
  estiver correta, um nascimento em dezembro de 1861 é impossível; ele teria nascido até
  dezembro de 1860, e a idade declarada de 22 anos estaria baixa [INFERRED, apoiado numa pista].
  Ano exato [OPEN].

  - **Pais:** Francisco José Bohrer (P-0034) e Rosa Eugenia de Lemos (P-0035) [PROVEN] —
  nomeados como avós paternos no nascimento de 1890 de seu filho Alberto (CIV-0019); o
  próprio testamento de Francisco (27 de junho de 1879; aberto em 1888) nomeia Joaquim em
  primeiro lugar entre os quatro herdeiros (PRB-0005).

  - **Casamento:** com Lucinda Ferreira da Silva (P-0031, também "Lucinda Ferreira da Silva
  Bohrer") em 19 de abril de 1884 na Matriz de São João Baptista de Nova Friburgo (celebrante
  Padre José Giffoni), ele com 22 e ela com 21 anos [PROVEN — o próprio ato de casamento
  PAR-0056, evento E-0085; também nomeados como os pais casados nos nascimentos de 1890 e 1891
  de seus filhos, CIV-0019, CIV-0020]. O ato a escreve "Lucinda Roschemant da Silva Ferreira",
  nascida em S. João Baptista da Lagoa, "na Corte", ambos os noivos então residentes em Nova
  Friburgo; as testemunhas foram Eduardo Guilherme Buck e seu tio materno Candido Pereira de
  Lemos (PAR-0056).

  - **Filhos:** documentados — Alberto (n. 17 de junho de 1890, CIV-0019); um filho menino
  (n. 23 de dezembro de 1891, f. 29 de janeiro de 1892, CIV-0020); Antonio José (f. 2 de abril
  de 1899, aos 13 anos, por mordedura de jararacussú, NWS-0006); Celina / Selina (P-0015, n. 13
  de maio de 1899, baptizada em 27 de setembro de 1899, PAR-0057 — a ancestral de nossa linha);
  Etelvina (n. 16 de maio de 1900, baptizada em 1902, PAR-0075); Joaquim Carlos (n. 6 de janeiro
  de 1896, PAR-0078); Renato (n. 12 de setembro de 1897, baptizado em 1898, PAR-0079); e Lucinda
