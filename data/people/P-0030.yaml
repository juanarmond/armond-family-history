  ## Contexto regional e migratório

  Nascido e batizado em Itaboraí (PAR-0056), viveu sua vida adulta documentada em Nova Friburgo,
  a cidade colonial suíço-alemã de planalto (RJ) fundada pelo decreto de D. João VI de 16 de maio
  de 1818; no fim do século XIX os descendentes dos colonos haviam passado da lavoura ao
  comércio, à política e ao jornalismo, e Joaquim era um negociante dessa cidade em urbanização.
  [CONTEXTUAL] Seu domicílio estava no Alto da Serra em 1890–91 (CIV-0019, CIV-0020); em 1899 um
  filho morreu no distrito de São Pedro (NWS-0006) e em 1908 uma filha foi batizada na capela de
  São Pedro (PAR-0052), o que sugere um deslocamento para São Pedro [INFERRED]. Sua nacionalidade brasileira decorre do jus soli; a origem
  suíça está documentada acima, na linha Borer (PRB-0005), não inferida do sobrenome. Seu
  ramo permaneceu em Nova Friburgo; a saída para Minas Gerais e Volta Redonda veio pelo
  casamento de sua filha Celina e pela geração seguinte.

