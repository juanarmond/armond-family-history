notes:
- text: >-
    Ahnentafel position 30 — father of Celina (Selina) Bohrer (P-0015). Named as
    Celina's father (already deceased) in her 1977 Volta Redonda death (CIV-0015)
    and as Eunir Bohrer's maternal grandfather in the 1924 Nova Friburgo birth
    (CIV-0016, "já falecidos" by 1924). A negociante at the Alto da Serra, Nova
    Friburgo (RJ), "natural desta Freguezia".
  text_pt: >-
    Posição 30 no Ahnentafel — pai de Celina (Selina) Bohrer (P-0015). Nomeado como
    pai de Celina (já falecido) em seu óbito de 1977 em Volta Redonda (CIV-0015) e
    como avô materno de Eunir Bohrer no nascimento de 1924 em Nova Friburgo (CIV-0016,
    "já falecidos" em 1924). Negociante no Alto da Serra, Nova Friburgo (RJ), "natural
    desta Freguezia".
- text: >-
    His parents are now established: Francisco José Bohrer (P-0034, deceased by
    1890) and Rosa Eugenia de Lemos (P-0035) — family F-0016 — named as the
    paternal grandparents in his son Alberto's 1890 birth (CIV-0019), declared by
    his brother Guilherme Samuel Bohrer. He also appears as the declarant father in
    a second child's 1891 birth (CIV-0020). His own birth/death records are still
    unlocated.
  text_pt: >-
    Seus pais estão agora estabelecidos: Francisco José Bohrer (P-0034, falecido até
    1890) e Rosa Eugenia de Lemos (P-0035) — família F-0016 — nomeados como os avós
    paternos no nascimento de 1890 de seu filho Alberto (CIV-0019), declarado por seu
    irmão Guilherme Samuel Bohrer. Ele também aparece como pai declarante no nascimento
    de 1891 de um segundo filho (CIV-0020). Seus próprios registros de nascimento/óbito
    ainda não foram localizados.
