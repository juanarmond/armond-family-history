  ## Contexto regional e migratório

  Toda a sua vida documentada situa-se em Nova Friburgo, a cidade colonial suíço-alemã de
  planalto (RJ); no fim do século XIX os descendentes dos colonos haviam passado da
  lavoura ao comércio, à política e ao jornalismo, e Joaquim era um negociante dessa cidade
  em urbanização. [CONTEXTUAL] Sua nacionalidade brasileira decorre do jus soli; a origem
  suíça está documentada acima, na linha Borer (PRB-0005), não inferida do sobrenome. Seu
  ramo permaneceu em Nova Friburgo; a saída para Minas Gerais e Volta Redonda veio pelo
  casamento de sua filha Celina e pela geração seguinte.

