profile: >-
  ## Interesting facts

  - **[COMPILED]** He is the earliest-dated person in this entire archive — in its Terceira trunk, and not a proven ancestor of the owner: baptised at Santa Bárbara, Terceira, on **2 February 1571** (the book prints "B.", its abbreviation for baptised, distinct from "n." for born), died there on **27 January 1655** — a week short of 84 years after that baptism, and a life that opens nine years before the Spanish Habsburgs took the Portuguese crown and closes fifteen years after they lost it.

  - **[COMPILED]** Mendes Forjaz credits him with the single most concrete act recorded of anyone in this Azorean group: "*Capitão de uma companhia de 79 homens, que tomou parte no assalto do Castelo de S. Filipe, de Angra em 1642*" — captain of a company of 79 men in the operation against the Castelo de São Filipe at Angra.

  - **[CONTEXTUAL — verified]** That operation is well documented independently. The Castilian garrison under Mestre-de-Campo D. Álvaro de Viveiros held the castle from **27 March 1641 to 4 March 1642**, eleven months, against a blockade mounted by the *ordenanças* of Terceira and the other islands under Francisco Ornelas da Câmara and João de Bettencourt; the garrison marched out on 6 March 1642 with the honours of war, leaving 138 guns behind. **[NOTE]** The compiler's word "*assalto*" is loose: what actually happened was a long investment ending in capitulation, not a storming. A Santa Bárbara company of 79 men fits that besieging force exactly.

  - **[INFERRED — a real problem, not a flourish]** If he was baptised in 1571 (and so born that year or shortly before), he was **70 or 71 years old** during that siege. Ordenanças captaincies were local appointments held by a parish's senior householders rather than field commands **[CONTEXTUAL]**, so an old captain is not impossible — but the age is striking enough that the alternative should stay open: the compiler may have attached the company to the head of the family rather than to the man who marched with it.

  - **[COMPILED]** He married at Santa Bárbara on **14 June 1598**, and Mendes Forjaz lists **ten children** of that marriage — among them a Franciscan friar, a beneficed priest, a captain of *ordenanças* and an ensign. A household that placed its sons systematically.

  - **[PROVEN — a bounded negative]** His marriage act has been hunted and not read. Pages 0097–0099 of the Santa Bárbara *casamentos* book C-1560-1606 were browsed via the Culturacores CDN in the 2026-09-23 pass; they cover April 1597 to June 1598 and therefore bracket 14 June 1598 exactly. The act is in that window, but physical damage makes the names illegible at the delivered resolution. Recorded on event E-0134. **This is a failed read, not an absence.**

  ## Identity

  **Pedro Lourenço Machado** **[COMPILED, PUB-0004 p.312]** — baptised Santa Bárbara, Terceira, 2 February 1571; died Santa Bárbara, 27 January 1655. *Capitão*. Son of **Antão Martins Fagundes** × **Bárbara Dias Vieira** (Vol. IV § 5º, nº 4 — a section not read, and not modelled here). Married **Maria Fernandes da Costa** (P-0130) at Santa Bárbara, 14 June 1598; family F-0065. Father of **António Martins Fagundes** (P-0127).

  - **Nationality:** Portuguese (Azores, Crown territory)
  - **Name:** the "Machado" element comes from his mother's side, not his father's — his father is recorded as Antão Martins Fagundes **[COMPILED]**. Three of the surnames in play here (Machado, Martins, Fagundes) redistribute across his children in no fixed pattern.
  - **Evidence standing:** entirely **[COMPILED]**. No original act naming him is held. His baptism, marriage and death are three precise dates from one secondary source — precise because the compiler was reading parish registers we have not yet reached, not because we have verified them.

  **Place in the archive [corrected 2026-10-10].** Pedro Lourenço is not a proven ancestor of the archive's owner. He belongs to the Terceira Armond trunk as the maternal great-grandfather of Gaspar de Souto Maior (P-0131), through his son António Martins Fagundes (P-0127) and António's daughter Mariana Fagundes (P-0124). Family tradition — Lacerda's 2010 thesis (PUB-0002, ff. 55–56), after a private 2008 typescript by Paulo Ribeiro Luz and the 1751 will it quotes — makes that Gaspar the father of Francisco Ferreira Armonde (d. 1751), patriarch of the Ferreira Armonde of Barbacena **[LEAD]**; that family would attach to the owner only through the unknown parents of Simplício José Ferreira Armond (P-0016) **[OPEN]**. Neither link is proven. Until 10 October 2026 the tree routed this line through Gaspar Ferreira (P-0092) of Vila Rica, on the Toledo side, and counted him as Geraldo Paz Armond's (P-0004) 7th-great-grandfather and the earliest-born person in the tree; that identification is rejected and the "two Gaspars" are two men (owner's decision, 2026-10-10) — Gaspar de Souto Maior was baptised at São Sebastião on 23 December 1657 (PAR-0099) and died there on 2 December 1727 aged about seventy (PAR-0100), decades before Gaspar Ferreira's son was born at Vila Rica — and the degree is withdrawn.

  ## Standing and profession

  **Capitão [COMPILED].** The *ordenanças* were the third and lowest tier of the Portuguese military organisation — a territorial reserve raised parish by parish, whose officers were local householders serving **without pay** **[CONTEXTUAL]**. Command of a company was conferred on a principal householder and brought precedence, mustering authority and local standing. It did not bring a salary, and it could not be inherited.

  - **[INFERRED]** His is the highest documented rank in this Terceira cluster, and it repeats: his son António was also a *Capitão de ordenanças*, another son an *alferes*, a grandson-in-law an *alferes*. Three generations inside the officer layer of one parish.
  - **[INFERRED + CONTEXTUAL]** But the wealth mechanics are unforgiving. Unpaid office produces standing, not capital; it ends with the officeholder and divides among no heirs. Whatever land the household held is undocumented — no will, inventory, deed or rental appears in any source we hold. So what this household demonstrably transmitted, across the generations the compiler records in Terceira, was **social position and the expectation of it**, not property. If the family tradition holds and the trunk reached Barbacena four generations on **[LEAD]**, that is the single most useful thing to know about its later trajectory.
  - **[INFERRED]** Placing one son as a Franciscan friar and another as a *padre beneficiado* has a cost: ordination required Latin schooling and, for a secular priest, a *título de património* — a settled income assigned to the candidate **[CONTEXTUAL]**. A household that did this twice had land or rents behind it, even though none is named.

  **Nothing states he was noble.** "Machado", "Fagundes" and "Martins" are not evidence of rank; no held record grants this family arms, a *foro* or a *morgadio*, and the *Nobiliário da Ilha Terceira*'s treatment of Fagundes families in general says nothing specific about him.

  ## Family and social network

  - **Parents [COMPILED, not read]:** Antão Martins Fagundes × Bárbara Dias Vieira, referred by Vol. IV to its own § 5º, nº 4 — a section not read in the 2026-09-23 pass and deliberately not modelled as entities here.
  - **Wife:** Maria Fernandes da Costa, also called "de Toledo" (P-0130), daughter of Belchior Fernandes da Costa × Beatriz Pires **[COMPILED]**.
  - **Children [COMPILED, PUB-0004 pp.312–313]:** Pedro Lourenço Machado the younger (bapt. Santa Bárbara 15 September 1603, d. São Sebastião 20 October 1665, *alferes de ordenanças*, with a will drawn before the notary Bartolomeu Pacheco); Antão Martins Fagundes, "o Giga" (d.28 January 1661, m.19 February 1659 Beatriz Dias); **António Martins Fagundes** (P-0127), *Capitão de ordenanças*, d.17 April 1664; Belchior Machado Fagundes, Franciscan friar; Manuel Machado Fagundes (d.22 March 1643, m.21 November 1635 Maria Coelho); André Machado Fagundes (bapt. 4 December 1612, *padre beneficiado*); Beatriz Dias Fagundes / Machado (bapt. 8 March 1609); Inês Pacheco / Machado (bapt. 30 January 1611); Grácia (bapt. 18 May 1607); and Maria Fernandes Machado (m.27 February 1631 Pedro Gonçalves de Lemos).
  - **[INFERRED]** A will exists — his son Pedro Lourenço the younger's, drawn before the notary **Bartolomeu Pacheco** and noted by the compiler. Terceira notarial books are a different archive from the parish registers, and that reference is the most concrete unfollowed lead in this whole group.
  - **Grandchildren in the Terceira trunk:** through António, at least seven, including **Mariana Fagundes** (P-0124), who married into São Sebastião in 1650.

  ## What we can extrapolate

  **Ten children on a full island: the arithmetic behind emigration [INFERRED + CONTEXTUAL].** Terceira had been settled since about 1450 and by 1600 carried a dense population on finite land. Entailed estates (*morgadios*) passed intact to eldest sons under primogeniture; non-entailed property divided among all children and fragmented fast. Either regime leaves the same problem for a captain with ten children, and the compiler's own list shows every available answer being used at once: the Church took two sons, the militia absorbed two more, daughters married into Lajes, Conceição and other parishes, and a grandson is recorded simply as having left Terceira. If the family tradition holds, descendants of this household were in Minas Gerais four generations on — Francisco Ferreira Armonde (d. 1751), patriarch of the Ferreira Armonde of Barbacena, would be his great-great-grandson **[LEAD]** — and the emigration would then be not a rupture but the last term in a sequence that starts in his lifetime. No proven chain yet shows this household reaching Brazil.

  **Status without a wage base — a pattern the archive meets again in Brazil [INFERRED + CONTEXTUAL].** Everything this family is credited with is *office* — captaincies, ensigncies, benefices. None of it paid, none of it inherited. It is a striking anticipation of what the archive's Brazilian families do generations later, where the proudest posts are again unpaid appointments sitting on top of no income. Whether that is the same bloodline repeating itself depends on the family tradition **[LEAD]**; on the proven tree it is a parallel, not an inheritance. A line that reproduces standing rather than capital is permanently exposed: it looks secure until the land behind it goes, and then it falls in one generation.

  **His life is a perfect frame for the Habsburg period [CONTEXTUAL].** Baptised in 1571, he was twelve when the 1583 invasion finally broke Terceira's resistance to Philip II — the island had been the last part of the Portuguese realm to hold out for D. António, Prior do Crato. The Spanish crown then built the Castelo de São Filipe above Angra to garrison the island it had had to conquer. He was 69 at the Restoration of 1640, and the fortress his company is credited with besieging in 1641–42 was the same one built to hold his island down. He died in 1655, fifteen years into a restored kingdom, in the parish where he had been baptised.

  **The compiler's precision is a lead, not a proof [INFERRED].** Mendes Forjaz gives day-exact dates for his baptism, marriage and death. Dates that precise come from parish registers the compiler had in front of him. Two of those three books should therefore exist — the Santa Bárbara *baptismos* for 1571 and the *óbitos* for 1655 — and neither has yet been reached in the digitised series. That is the strongest argument that the gaps below are retrieval gaps, not archival ones.

  ## Open questions

  - **His 1598 marriage act: located but unreadable [BOUNDED NEGATIVE, E-0134].** Santa Bárbara *casamentos* C-1560-1606, pages 0097–0099 (April 1597 → June 1598) were browsed and bracket the date exactly; damage and CDN resolution defeat the read. **Next action:** request C-1560-1606 pp.0097–0101 at microfilm resolution from BPAR Angra. This does not prove the act is missing from the register.
  - **His baptism (2 February 1571) is not in any book reached.** The only Santa Bárbara baptism register accessible on the Culturacores CDN begins in 1600. Whether a 16th-century Santa Bárbara baptism book survives at BPAR is unverified.
  - **His burial (27 January 1655) has not been reached** — no Santa Bárbara burial register for the period has been identified in the retrieval drop.
  - **His parents are compiled and unread.** Antão Martins Fagundes × Bárbara Dias Vieira sit in Vol. IV § 5º, nº 4, which was not read; they are deliberately not modelled as entities. **Do not mint them from the cross-reference alone.**
  - **A surname-level negative.** All 169 pages of Santa Bárbara *casamentos* C-1560-1606 were read, and **no confirmed Fagundes entry** was found in 1560–1606; the Santa Bárbara *baptismos* 1600–1610 produced none either. Since the compiler puts this family in that parish across exactly those decades, the most likely explanation is damage, hand and indexing — **not** absence. Recorded so that no one later mistakes it for a negative result about the family.
  - **The 1642 age problem.** Whether a man of 70 personally commanded the 79-man company, or whether the compiler credited the family head with a company led in the field by someone else, is unresolved and probably only resolvable from a muster roll or a *provisão* of the captaincy.
  - **The notarial lead is unfollowed.** His son's will, before the notary Bartolomeu Pacheco, is named in the compilation. Terceira notarial books at BPAR would be a different and richer class of evidence than the parish registers — property, not just dates.

  ## Sources held (this repository)

  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: his baptism, marriage and death dates, his captaincy and the 1642 company, his parents, his wife and her parents, and his ten children. *Secondary, compiled — the sole source for everything about him.*
  - *(No primary image naming him is held. The bounded-negative search of Santa Bárbara* casamentos *C-1560-1606 pp.0097–0099 is recorded on event E-0134.)*

  ## Regional and migration context

  **Santa Bárbara das Nove Ribeiras [CONTEXTUAL].** A rural parish on Terceira's western side, in the district of Angra — a city since 1534 and the seat of the Azores bishopric, and one of the mid-Atlantic's great ports of call, where the returning India and Brazil fleets watered and refitted. He was baptised, married, raised ten children and died in this one parish, and as far as any record shows he never lived anywhere else.

  **The island economy of his lifetime [CONTEXTUAL].** Terceira exported wheat to mainland Portugal and the African presidios, grew the blue dye *pastel* (woad) — the 15th- and 16th-century export staple, entering its long decline against American indigo during exactly his adult life — made wine, and cut shipbuilding timber. A parish captain in that economy was a farmer-householder with standing, not a professional soldier.

  **Two wars bracket him [CONTEXTUAL].** The 1580–83 succession crisis, in which Terceira resisted Philip II longest and was subdued by invasion when he was twelve; and the Restoration war, in which the island's *ordenanças* blockaded the Castilian garrison of the Castelo de São Filipe into surrender on 4 March 1642, when he was 71. He is the only person in this group with a documented, if compiled, role in either.

  **Emigration, if the family tradition holds, is four generations downstream [CONTEXTUAL + LEAD].** The Minas Gerais gold strike of 1697 and the Crown's 1720 passport controls come long after him, and the family tradition would bring the trunk to Barbacena only with his great-great-grandson Francisco Ferreira Armonde (d. 1751) **[LEAD]**. But the conditions were already his: a finite island, entail and primogeniture, and ten children to place. His grandson Manuel Machado is recorded leaving Terceira in the 17th century, before the gold made the destination obvious.

  ## Where to go today

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — the whole of his documented life is in this one parish: baptised there in 1571, married there in 1598, buried there in 1655. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Fortaleza de São João Baptista (the former Castelo de São Filipe), Monte Brasil, Angra do Heroísmo, Terceira** — the fortress his company is credited with besieging in 1641–42, built by the Spanish crown to garrison the island and still standing. The one visitable place tied to a documented act of his. [COMPILED — his role; the site itself is certain] · [Maps](https://www.google.com/maps/search/?api=1&query=Fortaleza%20de%20S%C3%A3o%20Jo%C3%A3o%20Baptista%2C%20Angra%20do%20Hero%C3%ADsmo)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — holds Santa Bárbara *casamentos* C-1560-1606 (pp.0097–0101 at microfilm resolution would recover his marriage act), whatever 16th-century baptism and 17th-century burial registers survive for the parish, and the Terceira notarial books in which Bartolomeu Pacheco's protocols would sit. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
profile_pt: >-
  ## Fatos interessantes

  - **[COMPILED]** É a pessoa com datas mais recuadas de todo este arquivo — no seu tronco terceirense, e não antepassado provado do proprietário: batizado em Santa Bárbara, Terceira, a **2 de fevereiro de 1571** (o livro imprime "B.", sua abreviatura de batizado, distinta de "n." para nascido), e ali falecido a **27 de janeiro de 1655** — a uma semana de completar 84 anos desse batismo, numa vida que abre nove anos antes de os Habsburgos espanhóis tomarem a coroa portuguesa e fecha quinze anos depois de a perderem.

  - **[COMPILED]** Mendes Forjaz credita-lhe o acto mais concreto registado para quem quer que seja deste grupo açoriano: "*Capitão de uma companhia de 79 homens, que tomou parte no assalto do Castelo de S. Filipe, de Angra em 1642*".

  - **[CONTEXTUAL — verificado]** Essa operação está bem documentada de forma independente. A guarnição castelhana, sob o Mestre-de-Campo D. Álvaro de Viveiros, susteve o castelo de **27 de março de 1641 a 4 de março de 1642**, onze meses, contra o cerco montado pelas *ordenanças* da Terceira e das outras ilhas, sob Francisco Ornelas da Câmara e João de Bettencourt; a guarnição saiu a 6 de março de 1642 com honras de guerra, deixando 138 peças de artilharia. **[NOTA]** A palavra "*assalto*", do compilador, é imprecisa: o que houve foi um longo cerco terminado em capitulação, não uma tomada de assalto. Uma companhia de 79 homens de Santa Bárbara encaixa exactamente nessa força sitiante.

  - **[INFERRED — problema real, não floreado]** Se foi batizado em 1571 (e, portanto, nasceu nesse ano ou pouco antes), tinha **70 ou 71 anos** durante esse cerco. As capitanias de ordenanças eram nomeações locais detidas pelos moradores mais graduados de uma freguesia, e não comandos de campanha **[CONTEXTUAL]**, pelo que um capitão idoso não é impossível — mas a idade é bastante notável para manter aberta a alternativa: o compilador pode ter atribuído a companhia ao chefe da família e não ao homem que de facto marchou com ela.

  - **[COMPILED]** Casou em Santa Bárbara a **14 de junho de 1598**, e Mendes Forjaz lista **dez filhos** desse casamento — entre eles um frade franciscano, um padre beneficiado, um capitão de *ordenanças* e um alferes. Uma casa que colocava os filhos com método.

  - **[PROVEN — negativo delimitado]** O assento do casamento foi procurado e não foi lido. As páginas 0097–0099 do livro de *casamentos* de Santa Bárbara C-1560-1606 foram percorridas no CDN da Culturacores na passagem de 2026-09-23; cobrem abril de 1597 a junho de 1598 e, portanto, balizam exactamente 14 de junho de 1598. O assento está nessa janela, mas os danos físicos tornam os nomes ilegíveis na resolução entregue. Registado no evento E-0134. **É uma leitura falhada, não uma ausência.**

  ## Identidade

  **Pedro Lourenço Machado** **[COMPILED, PUB-0004 p.312]** — batizado em Santa Bárbara, Terceira, a 2 de fevereiro de 1571; falecido em Santa Bárbara a 27 de janeiro de 1655. *Capitão*. Filho de **Antão Martins Fagundes** × **Bárbara Dias Vieira** (Vol. IV § 5º, nº 4 — secção não lida e aqui não modelada). Casou com **Maria Fernandes da Costa** (P-0130) em Santa Bárbara, a 14 de junho de 1598; família F-0065. Pai de **António Martins Fagundes** (P-0127).

  - **Nacionalidade:** portuguesa (Açores, território da Coroa)
  - **Nome:** o elemento "Machado" vem do lado materno, não do paterno — o pai está registado como Antão Martins Fagundes **[COMPILED]**. Três dos apelidos em jogo (Machado, Martins, Fagundes) redistribuem-se pelos filhos sem padrão fixo.
  - **Estatuto de evidência:** inteiramente **[COMPILED]**. Nenhum assento original que o nomeie está disponível. Batismo, casamento e óbito são três datas precisas de uma única fonte secundária — precisas porque o compilador lia registos paroquiais a que ainda não chegámos, e não porque as tenhamos verificado.

  **Lugar no arquivo [corrigido em 2026-10-10].** Pedro Lourenço não é antepassado provado do proprietário do arquivo. Pertence ao tronco terceirense dos Armond como bisavô materno de Gaspar de Souto Maior (P-0131), pelo filho António Martins Fagundes (P-0127) e pela filha deste, Mariana Fagundes (P-0124). A tradição familiar — a tese de Lacerda de 2010 (PUB-0002, ff. 55–56), na esteira de um datiloscrito particular de 2008 de Paulo Ribeiro Luz e do testamento de 1751 que este cita — dá esse Gaspar como pai de Francisco Ferreira Armonde (f. 1751), patriarca dos Ferreira Armonde de Barbacena **[LEAD]**; essa família só se ligaria ao proprietário pelos pais desconhecidos de Simplício José Ferreira Armond (P-0016) **[OPEN]**. Nenhuma das duas ligações está provada. Até 10 de outubro de 2026 a árvore fazia passar esta linha por Gaspar Ferreira (P-0092), de Vila Rica, do lado Toledo, e contava-o como 7.º bisavô (*7th-great-grandfather*) de Geraldo Paz Armond (P-0004) e a pessoa nascida mais cedo na árvore; essa identificação foi rejeitada e os "dois Gaspares" são dois homens (decisão do proprietário, 2026-10-10) — Gaspar de Souto Maior foi batizado em São Sebastião a 23 de dezembro de 1657 (PAR-0099) e ali faleceu a 2 de dezembro de 1727, com cerca de setenta anos (PAR-0100), décadas antes de o filho de Gaspar Ferreira nascer em Vila Rica — e o grau fica retirado.

  ## Posição social e profissão

  **Capitão [COMPILED].** As *ordenanças* eram o terceiro e mais baixo escalão da organização militar portuguesa — reserva territorial levantada freguesia a freguesia, com oficiais que eram moradores locais servindo **sem soldo** **[CONTEXTUAL]**. O comando de uma companhia era conferido a um morador principal e trazia precedência, autoridade de mostra e posição local. Não trazia salário, e não se herdava.

  - **[INFERRED]** É a patente mais alta documentada neste conjunto terceirense, e repete-se: o filho António também foi *Capitão de ordenanças*, outro filho alferes, um neto por afinidade alferes. Três gerações dentro da camada de oficiais de uma só freguesia.
  - **[INFERRED + CONTEXTUAL]** Mas a mecânica da riqueza é implacável. Cargo sem soldo produz posição, não capital; acaba com quem o detém e não se divide por herdeiros. A terra que a casa detivesse não está documentada — nenhum testamento, inventário, escritura ou arrendamento aparece em qualquer fonte disponível. Logo, o que esta casa demonstravelmente transmitiu, ao longo das gerações que o compilador regista na Terceira, foi **posição social e a expectativa dela**, não propriedade. Se a tradição familiar se confirmar e o tronco tiver chegado a Barbacena quatro gerações depois **[LEAD]**, é a coisa mais útil a saber sobre a sua trajectória posterior.
  - **[INFERRED]** Colocar um filho como frade franciscano e outro como *padre beneficiado* tem custo: a ordenação exigia estudos de latim e, para o clero secular, um *título de património* — rendimento fixo consignado ao candidato **[CONTEXTUAL]**. Uma casa que fez isto duas vezes tinha terra ou rendas por trás, ainda que nenhuma seja nomeada.

  **Nada afirma que fosse nobre.** "Machado", "Fagundes" e "Martins" não são prova de posição; nenhum registo disponível concede a esta família armas, *foro* ou *morgadio*, e o tratamento genérico das famílias Fagundes no *Nobiliário da Ilha Terceira* nada diz de específico sobre ele.

  ## Família e rede social

  - **Pais [COMPILED, não lidos]:** Antão Martins Fagundes × Bárbara Dias Vieira, remetidos pelo Vol. IV para o seu § 5º, nº 4 — secção não lida na passagem de 2026-09-23 e deliberadamente não modelada como entidades.
  - **Mulher:** Maria Fernandes da Costa, também dita "de Toledo" (P-0130), filha de Belchior Fernandes da Costa × Beatriz Pires **[COMPILED]**.
  - **Filhos [COMPILED, PUB-0004 pp.312–313]:** Pedro Lourenço Machado, o moço (bat. Santa Bárbara 15 de setembro de 1603, f. São Sebastião 20 de outubro de 1665, *alferes de ordenanças*, com testamento lavrado no tabelião Bartolomeu Pacheco); Antão Martins Fagundes, "o Giga" (f.28 de janeiro de 1661, c.19 de fevereiro de 1659 com Beatriz Dias); **António Martins Fagundes** (P-0127), *Capitão de ordenanças*, f.17 de abril de 1664; Belchior Machado Fagundes, frade franciscano; Manuel Machado Fagundes (f.22 de março de 1643, c.21 de novembro de 1635 com Maria Coelho); André Machado Fagundes (bat. 4 de dezembro de 1612, *padre beneficiado*); Beatriz Dias Fagundes / Machado (bat. 8 de março de 1609); Inês Pacheco / Machado (bat. 30 de janeiro de 1611); Grácia (bat. 18 de maio de 1607); e Maria Fernandes Machado (c.27 de fevereiro de 1631 com Pedro Gonçalves de Lemos).
  - **[INFERRED]** Existe um testamento — o do filho Pedro Lourenço, o moço, lavrado no tabelião **Bartolomeu Pacheco** e referido pelo compilador. Os livros notariais da Terceira são arquivo distinto dos registos paroquiais, e essa referência é a pista concreta mais promissora por seguir em todo este grupo.
  - **Netos no tronco terceirense:** por António, pelo menos sete, entre eles **Mariana Fagundes** (P-0124), que casou para São Sebastião em 1650.

  ## O que podemos extrapolar

  **Dez filhos numa ilha cheia: a aritmética por trás da emigração [INFERRED + CONTEXTUAL].** A Terceira estava povoada desde cerca de 1450 e, em 1600, sustentava população densa em terra finita. Os bens vinculados (*morgadios*) passavam intactos aos primogénitos por primogenitura; a propriedade não vinculada dividia-se por todos e fragmentava-se depressa. Qualquer dos regimes deixa o mesmo problema a um capitão com dez filhos, e a própria lista do compilador mostra todas as respostas disponíveis a serem usadas ao mesmo tempo: a Igreja levou dois filhos, a milícia absorveu mais dois, as filhas casaram para as Lajes, a Conceição e outras freguesias, e um neto está registado apenas como tendo saído da Terceira. Se a tradição familiar se confirmar, descendentes desta casa estavam nas Minas Gerais quatro gerações depois — Francisco Ferreira Armonde (f. 1751), patriarca dos Ferreira Armonde de Barbacena, seria seu trineto **[LEAD]** — e a emigração seria então não uma ruptura, mas o último termo de uma sequência que começa no tempo dele. Nenhuma cadeia provada mostra ainda esta casa a chegar ao Brasil.

  **Estatuto sem base salarial — um padrão que o arquivo volta a encontrar no Brasil [INFERRED + CONTEXTUAL].** Tudo o que se credita a esta família é *cargo* — capitanias, alferesias, benefícios. Nada pagava, nada se herdava. É uma antecipação notável do que as famílias brasileiras do arquivo fazem gerações depois, onde os postos de que mais se orgulham são de novo nomeações sem soldo assentes sobre rendimento nenhum. Se é a mesma linhagem a repetir-se depende da tradição familiar **[LEAD]**; na árvore provada é um paralelo, não uma herança. Uma linha que reproduz posição em vez de capital fica permanentemente exposta: parece segura até a terra por trás desaparecer, e depois cai numa geração.

  **A vida dele emoldura com perfeição o período habsburgo [CONTEXTUAL].** Batizado em 1571, tinha doze anos quando a invasão de 1583 quebrou finalmente a resistência da Terceira a Filipe II — a ilha fora a última parcela do reino a sustentar D. António, Prior do Crato. A coroa espanhola ergueu então o Castelo de São Filipe, sobre Angra, para guarnecer a ilha que tivera de conquistar. Tinha 69 anos na Restauração de 1640, e a fortaleza que a sua companhia é creditada de cercar em 1641–42 era a mesma construída para manter a sua ilha sujeita. Morreu em 1655, quinze anos dentro de um reino restaurado, na freguesia onde fora batizado.

  **A precisão do compilador é pista, não prova [INFERRED].** Mendes Forjaz dá datas ao dia para batismo, casamento e óbito. Datas assim vêm de registos paroquiais que o compilador tinha à frente. Dois desses três livros deveriam, portanto, existir — os *baptismos* de Santa Bárbara de 1571 e os *óbitos* de 1655 — e nenhum foi ainda alcançado na série digitalizada. É o argumento mais forte de que as lacunas abaixo são de recolha, e não de arquivo.

  ## Questões em aberto

  - **O assento de casamento de 1598: localizado mas ilegível [NEGATIVO DELIMITADO, E-0134].** *Casamentos* de Santa Bárbara C-1560-1606, páginas 0097–0099 (abril de 1597 → junho de 1598) foram percorridas e balizam exactamente a data; danos e resolução do CDN derrotam a leitura. **Acção seguinte:** pedir ao BPAR de Angra C-1560-1606 pp.0097–0101 em resolução de microfilme. Isto não prova que o assento falte no livro.
  - **O baptismo (2 de fevereiro de 1571) não está em nenhum livro alcançado.** O único livro de baptismos de Santa Bárbara acessível no CDN da Culturacores começa em 1600. Se sobrevive algum livro de baptismos quinhentista da freguesia no BPAR é coisa por verificar.
  - **O óbito (27 de janeiro de 1655) não foi alcançado** — nenhum livro de óbitos de Santa Bárbara do período foi identificado no lote de recolha.
  - **Os pais são compilados e por ler.** Antão Martins Fagundes × Bárbara Dias Vieira estão no Vol. IV § 5º, nº 4, que não foi lido; deliberadamente, não são modelados como entidades. **Não os criar só a partir da remissão.**
  - **Um negativo ao nível do apelido.** As 169 páginas dos *casamentos* de Santa Bárbara C-1560-1606 foram lidas e **nenhuma entrada Fagundes confirmada** foi encontrada entre 1560 e 1606; os *baptismos* de Santa Bárbara de 1600–1610 também não deram nenhuma. Como o compilador coloca esta família nessa freguesia exactamente nessas décadas, a explicação mais provável são danos, letra e indexação — **não** ausência. Fica registado para que ninguém, mais tarde, o confunda com resultado negativo sobre a família.
  - **O problema da idade em 1642.** Se um homem de 70 anos comandou pessoalmente a companhia de 79 homens, ou se o compilador creditou ao chefe da casa uma companhia conduzida no terreno por outro, está por resolver — e provavelmente só se resolve com um rol de mostra ou a *provisão* da capitania.
  - **A pista notarial está por seguir.** O testamento do filho, no tabelião Bartolomeu Pacheco, é nomeado na compilação. Os livros notariais da Terceira, no BPAR, seriam uma classe de evidência diferente e mais rica do que os registos paroquiais — propriedade, e não apenas datas.

  ## Fontes disponíveis (neste repositório)

  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: datas de batismo, casamento e óbito, a capitania e a companhia de 1642, os pais, a mulher e os pais dela, e os dez filhos. *Secundária, compilada — fonte única para tudo o que lhe diz respeito.*
  - *(Nenhuma imagem primária o nomeia. A busca de negativo delimitado nos* casamentos *de Santa Bárbara C-1560-1606 pp.0097–0099 está registada no evento E-0134.)*

  ## Contexto regional e migratório

  **Santa Bárbara das Nove Ribeiras [CONTEXTUAL].** Freguesia rural do lado ocidental da Terceira, no distrito de Angra — cidade desde 1534 e sede do bispado dos Açores, e um dos grandes portos de escala do Atlântico médio, onde as armadas da Índia e do Brasil aguavam e se reparavam no regresso. Foi batizado, casou, criou dez filhos e morreu nesta única freguesia e, tanto quanto mostra qualquer registo, nunca viveu noutro lugar.

  **A economia insular do seu tempo [CONTEXTUAL].** A Terceira exportava trigo para o reino e para as praças africanas, cultivava o corante azul *pastel* — produto de exportação dos séculos XV e XVI, a entrar no seu longo declínio face ao índigo americano exactamente durante a vida adulta dele —, fazia vinho e cortava madeira de construção naval. Um capitão de freguesia nessa economia era um lavrador-morador com posição, não um militar profissional.

  **Duas guerras o emolduram [CONTEXTUAL].** A crise sucessória de 1580–83, em que a Terceira resistiu mais tempo a Filipe II e foi submetida por invasão quando ele tinha doze anos; e a guerra da Restauração, em que as *ordenanças* da ilha cercaram a guarnição castelhana do Castelo de São Filipe até à rendição, a 4 de março de 1642, quando ele tinha 71. É a única pessoa deste grupo com um papel documentado, ainda que compilado, em qualquer delas.

  **A emigração, se a tradição familiar se confirmar, fica quatro gerações a jusante [CONTEXTUAL + LEAD].** O ouro das Minas Gerais (1697) e os controlos de passaporte de 1720 vêm muito depois dele, e a tradição familiar só traria o tronco a Barbacena com o trineto Francisco Ferreira Armonde (f. 1751) **[LEAD]**. Mas as condições já eram as suas: ilha finita, vínculo e primogenitura, e dez filhos para colocar. O neto Manuel Machado está registado a deixar a Terceira ainda no século XVII, antes de o ouro tornar o destino óbvio.

  ## Onde ir hoje

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — toda a sua vida documentada cabe nesta freguesia: baptizado ali em 1571, casado ali em 1598, sepultado ali em 1655. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Fortaleza de São João Baptista (antigo Castelo de São Filipe), Monte Brasil, Angra do Heroísmo, Terceira** — a fortaleza que a sua companhia é creditada de cercar em 1641–42, construída pela coroa espanhola para guarnecer a ilha, e ainda de pé. O único lugar visitável ligado a um acto documentado seu. [COMPILED — o papel dele; o sítio é certo] · [Mapa](https://www.google.com/maps/search/?api=1&query=Fortaleza%20de%20S%C3%A3o%20Jo%C3%A3o%20Baptista%2C%20Angra%20do%20Hero%C3%ADsmo)
