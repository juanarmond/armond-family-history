  Fagundes × Bárbara Dias Vieira (PUB-0004 § 5º nº 4, not read). Married Maria Fernandes
  da Costa (P-0130), 14 June 1598, Santa Bárbara; family F-0065. Father of António Martins
  Fagundes (P-0127).

  - **Nationality:** Portuguese (Azores)

