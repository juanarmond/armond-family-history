notes:
- text: >-
    Pedro Lourenço Machado: born 2 February 1571, Santa Bárbara, Terceira; died 27 January
    1655, Santa Bárbara (PUB-0004, p.312). Married Maria Fernandes da Costa (P-0130) at
    Santa Bárbara on 14 June 1598; family F-0065. Father of António Martins Fagundes (P-0127).
    Son of Antão Martins Fagundes × Bárbara Dias Vieira (Mendes Forjaz Vol. IV, § 5º, nº 4,
    not read in this session). The "Machado" element of his name derives from his mother's
    family (Bárbara Dias Vieira's connection to the Machado family is implied by the
    compiler's naming pattern).
- text: >-
    Military record: "Capitão de uma companhia de 79 homens, que tomou parte no assalto do
    Castelo de S. Filipe, de Angra em 1642" (Vol. IV). The Castelo de S. Filipe was the main
    fortress of Angra do Heroísmo, the capital of Terceira; the 1642 assault was part of the
    Portuguese Restoration War actions in the Azores following independence from Spain in 1640.
    Pedro Lourenço's military role places him as an active participant in the Restoration.
profile: >-
  ## Interesting facts

  - **[COMPILED]** Pedro Lourenço Machado was born 2 February 1571 in Santa Bárbara, Terceira,
  and died 27 January 1655 — a life of nearly 84 years.

  - **[COMPILED]** He commanded 79 men in the 1642 assault on the Castelo de S. Filipe, Angra
  — part of the Portuguese Restoration War in the Azores, just two years after Portugal
  declared independence from Spain in 1640. This places the family squarely in the events
  of the Restoration.

  - **[COMPILED]** He had at least nine children documented in the compilation, reflecting a
  large established family in Santa Bárbara parish.

  ## Identity

  **Pedro Lourenço Machado** [COMPILED, name via PUB-0004] — born 2 February 1571, Santa
