profile: >-
  ## Identity

  **Antonio da Silva Ferreira** — a thinly documented ancestor, known from a single held
  record. [PROVEN]

  - **Role:** father of Lucinda Ferreira da Silva (P-0031) and husband of Maria Joanna da
  Silva Ferreira (P-0037; family F-0017); hence Celina Bohrer's (P-0015) maternal
  grandfather. [PROVEN]

  - **Only attestation:** named, with his wife, as the maternal grandparents of the child
  in Alberto Bohrer's 1890 Nova Friburgo civil birth (CIV-0019). No record of his own has
  been located. [PROVEN via CIV-0019]

  - **Origin:** undocumented; nationality deliberately left unset. His daughter Lucinda was
  "natural desta Freguezia" (Nova Friburgo, CIV-0019), but his own birthplace is not
  evidenced and is not asserted. [OPEN]

  ## Family and social network

  Beyond the parent-child and marriage links above, nothing of his network is documented in
  this repository. A retrieval synthesis draft floats unverified leads — a Portuguese
  origin, an 1859 Nova Friburgo marriage, and parents "Justino Ferreira" and "Maria
  Angélica da Silva" — sourced only to a genealogy blog and not reconciled with our records
  (which model his wife simply as "Maria Joanna da Silva Ferreira"). These are recorded as
  leads, not evidence, and are not adopted here. [LEAD]

  ## What we can extrapolate

  What the held record does fix is that his daughter Lucinda married **into the documented Nova
  Friburgo petty-merchant band** — the *negociante* household of Joaquim José Bohrer at the Alto
  da Serra (CIV-0019) — a non-elite standing of position, not heritable landed capital
  [INFERRED/CONTEXTUAL]. If the unverified Portuguese-immigrant lead noted above ever proves out,
  Antonio would be the family's **single non-colony individual in-migration** — a Portuguese who
  married into the 1819–1824 Swiss/German colony network rather than a subsidised colonist —
  reinforcing rather than lifting the line's non-elite, petty-commerce trajectory. That reading is
  a lead, not evidence, and is not asserted here. [LEAD]

  ## Open questions

  - His own vital records and Portuguese/Brazilian origin — decisive record: his marriage
  act (which would state his naturalidade and parents). [OPEN]

  ## Sources held (this repository)

  - CIV-0019 (Alberto Bohrer's 1890 Nova Friburgo birth — the sole record naming him, as
  maternal grandfather).

  ## Where to go today

  - **Marriage (3 Mar 1859) & named as maternal grandfather in grandson Alberto's 1890 birth:** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Identidade

  **Antonio da Silva Ferreira** — um ancestral pouco documentado, conhecido por um único
  registro disponível. [PROVEN]

  - **Papel:** pai de Lucinda Ferreira da Silva (P-0031) e marido de Maria Joanna da Silva
  Ferreira (P-0037; família F-0017); portanto, avô materno de Celina Bohrer (P-0015).
  [PROVEN]

  - **Única atestação:** nomeado, junto com sua esposa, como avós maternos da criança no
  nascimento civil de 1890 de Alberto Bohrer, em Nova Friburgo (CIV-0019). Nenhum registro
  próprio dele foi localizado. [PROVEN via CIV-0019]

  - **Origem:** não documentada; nacionalidade deliberadamente deixada em branco. Sua filha
  Lucinda era "natural desta Freguezia" (Nova Friburgo, CIV-0019), mas o local de nascimento
  dele próprio não está evidenciado e não é afirmado. [OPEN]

  ## Família e rede social

  Além das ligações de filiação e casamento acima, nada de sua rede está documentado neste
  repositório. Um rascunho de síntese da recuperação levanta pistas não verificadas — uma
  origem portuguesa, um casamento de 1859 em Nova Friburgo e os pais "Justino Ferreira" e
  "Maria Angélica da Silva" — apoiadas apenas em um blog de genealogia e não conciliadas com
  nossos registros (que modelam sua esposa simplesmente como "Maria Joanna da Silva
  Ferreira"). Registram-se como pistas, não como evidência, e não são adotadas aqui. [LEAD]

  ## O que podemos extrapolar

  O que o registro disponível de fato fixa é que sua filha Lucinda casou-se **com a faixa
  documentada de pequenos comerciantes de Nova Friburgo** — o lar *negociante* de Joaquim José
  Bohrer, no Alto da Serra (CIV-0019) — uma posição não elitista de status, não capital fundiário
  herdável [INFERRED/CONTEXTUAL]. Se a pista não verificada de imigrante português apontada acima
  algum dia se confirmar, Antonio seria a **única imigração individual não colona da família** —
  um português que se casou dentro da rede da colônia suíço-alemã de 1819–1824, em vez de um
  colono subsidiado — reforçando, e não elevando, a trajetória não elitista e de pequeno comércio
  da linha. Essa leitura é uma pista, não evidência, e não é afirmada aqui. [LEAD]

  ## Questões em aberto

  - Seus próprios registros vitais e sua origem portuguesa/brasileira — registro decisivo:
  seu ato de casamento (que declararia sua naturalidade e seus pais). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0019 (nascimento de 1890 de Alberto Bohrer, em Nova Friburgo — o único registro que
  o nomeia, como avô materno).

