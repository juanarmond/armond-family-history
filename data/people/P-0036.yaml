  ## Contexto regional e migratório

  - **Arco de vida, etapa por etapa.** Portugal (n. ~1826; freguesia lida "Guenfães", incerta) →
  Nova Friburgo, onde se casou em 3 de março de 1859 (PAR-0070) e onde ainda estava em junho de
  1860 (PAR-0082) → Rio de Janeiro, freguesia de São João Baptista da Lagoa, onde Lucinda nasceu em
  agosto de 1862 e foi baptizada em março de 1863 (PAR-0077) → a freguesia de Nossa Senhora da
  Conceição de Aparecida (RJ), local de nascimento de Octávio por volta de 1868 (CIV-0036) → de
  volta a Nova Friburgo por volta de 1876, local de nascimento de Maria da Gloria (CIV-0037), e
  residente em seu 1º Distrito ao menos desde 1895 até seu óbito em 1914 (CIV-0036, CIV-0037,
  CIV-0035) [PROVEN, etapa por etapa]. Um domicílio que se mudou duas vezes e voltou é coerente
  com um homem que seguia o trabalho, e não com um que possuía terra. [INFERRED]

  - **Uma migração distinta da colonial.** [CONTEXTUAL] As famílias suíças e alemãs com as quais se
  aparentou haviam vindo sob o Decreto de 16 de maio de 1818 de D. João VI — um esquema coletivo de
  assentamento, recrutado pelo Estado, com lotes e subsídios. Ele veio depois, individualmente e
  sem auxílio, na imigração portuguesa comum para a província do Rio de Janeiro; nenhum registro
  disponível declara quando chegou nem por quê.

  - **Origem portuguesa.** [LEAD] Se a identificação da pesquisa de recuperação se confirmar, sua
  freguesia natal era São Faustino de Gueifães, no concelho da Maia, logo ao norte do Porto — uma
  freguesia que, segundo a mesma pesquisa, deixou de existir separadamente desde que a reforma
  administrativa portuguesa de 2013 a fundiu na união das freguesias da Cidade da Maia, razão pela
  qual as buscas em dicionários geográficos falharam.

