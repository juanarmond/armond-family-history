- text: >-
    Ahnentafel position 62 — father of Lucinda Ferreira da Silva (P-0031), hence
    Celina's (P-0015) maternal grandfather. Named with his wife Maria Joanna da
    Silva Ferreira (P-0037) as the maternal grandparents in Alberto Bohrer's 1890
    Nova Friburgo birth (CIV-0019). No record of his own has been located.
- text: >-
    Nationality left unset: no birthplace or stated nacionalidade is evidenced. His
