profile: >-
  ## Identity

  **Antonio da Silva Ferreira** — a Portuguese immigrant who married into the Swiss/German
  colony of Nova Friburgo. [PROVEN]

  - **Role:** father of Lucinda Ferreira da Silva (P-0031) and husband of Maria Joanna
  Rocheman/Rutschmann (P-0037; family F-0017); hence Celina Bohrer's (P-0015) maternal
  grandfather. [PROVEN]

  - **Origin:** Portuguese — his 1859 marriage (PAR-0070) records him "natural e baptizado na
  Freguezia de [Guenfães — uncertain], em Portugal", legitimate son of Justino da Silva (P-0111)
  and Maria Angelica (P-0112), both Portuguese (family F-0055). Read from the record, not inferred
  from the surname. [PROVEN]

  - **Attestations:** his own marriage to Maria Joanna on 3 March 1859 at the Matriz de São João
  Baptista, Nova Friburgo (PAR-0070, event E-0094); and the couple named as the maternal
  grandparents of the child in Alberto Bohrer's 1890 Nova Friburgo civil birth (CIV-0019). The
  marriage left his age blank; his 1914 death (CIV-0035) records him aged 88, placing his birth
  ~1826 [approximate]. His death is now held; no baptism of his own has yet been located. [PROVEN]

  - **Death:** he died 19 September 1914 at the Rua Sete de Setembro, Nova Friburgo (registered
  20 September), of arteriosclerosis, aged 88, "Portuguez, viuvo" (a widower — so Maria Joanna
  P-0037 predeceased him); buried in the Cemitério Público de Nova Friburgo; declarant his son
  Antonio da Silva Ferreira Junior [PROVEN — CIV-0035, event E-0123]. This falsifies the earlier
  "died in Rio" hypothesis — the family returned to Nova Friburgo.

  ## Family and social network

  He married the Nova-Friburgo-born Maria Joanna Rocheman (P-0037, 18 at marriage), daughter of the
  Swiss immigrant João José Rocheman (Rutschmann) of Bulle and Isabel Stork — so a Portuguese man
  joining a Swiss-colony household. Their daughter Lucinda in turn married **into the documented
  Nova Friburgo petty-merchant band** — the *negociante* household of Joaquim José Bohrer at the
  Alto da Serra (CIV-0019) — a non-elite standing of position, not heritable landed capital
  [INFERRED/CONTEXTUAL]. He and Maria Joanna also had Octávio Ferreira da Silva (m. Octavia
  Froidevaux, 1895, CIV-0036) and Maria da Gloria da Silva Ferreira (m. Ezequiel Mathias Dias,
  1899, CIV-0037), both documented siblings of Lucinda (family F-0017).

  ## What we can extrapolate

  Antonio is the family's **single documented non-colony individual in-migration** — a Portuguese
  who married into the 1819–1824 Swiss/German colony network rather than a subsidised colonist —
  reinforcing rather than lifting the line's non-elite, petty-commerce trajectory
  [INFERRED/CONTEXTUAL].

  ## Open questions

  - His own baptism and the exact Portuguese home parish (read as "Guenfães", uncertain) — a
  Portuguese baptism would confirm the parish and his ~1826 birth year. The 1914 death (CIV-0035)
  named neither his origin parish nor his parents, so that gap is unchanged. (His death is now
  held.) [OPEN]

  ## Sources held (this repository)

  - PAR-0070 (his 1859 Nova Friburgo marriage — states his Portuguese origin and parents).

  - CIV-0019 (Alberto Bohrer's 1890 Nova Friburgo birth — names him as maternal grandfather).

  - PAR-0077 (daughter Lucinda's 1863 Rio de Janeiro baptism — names him as father) · PAR-0056
  (daughter Lucinda's 1884 Nova Friburgo marriage — names him as father).

  - CIV-0035 (his 1914 Nova Friburgo death — died aged 88, "Portuguez, viuvo").

  - CIV-0036 (son Octávio's 1895 marriage — names him alive and resident at Nova Friburgo) ·
  CIV-0037 (daughter Maria da Gloria's 1899 marriage — he is alive and personally signs).

  ## Where to go today

  - **Marriage (3 Mar 1859) & named as maternal grandfather in grandson Alberto's 1890 birth:** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (19 Sep 1914, already held):** Cartório do Registro Civil, 1º Distrito de São João Baptista, Nova Friburgo (óbitos, termo 5045); burial at the Cemitério Público de Nova Friburgo. [RESOLVED]

  - **Portuguese baptism / home parish (read as "Guenfães", uncertain):** to be located in Portugal — would confirm the parish and his ~1826 birth year. [OPEN]
profile_pt: >-
  ## Identidade

  **Antonio da Silva Ferreira** — um imigrante português que se casou dentro da colônia
  suíço-alemã de Nova Friburgo. [PROVEN]

  - **Papel:** pai de Lucinda Ferreira da Silva (P-0031) e marido de Maria Joanna
  Rocheman/Rutschmann (P-0037; família F-0017); portanto, avô materno de Celina Bohrer (P-0015).
  [PROVEN]

  - **Origem:** portuguesa — seu casamento de 1859 (PAR-0070) o registra "natural e baptizado na
  Freguezia de [Guenfães — incerto], em Portugal", filho legítimo de Justino da Silva (P-0111) e
  Maria Angelica (P-0112), ambos portugueses (família F-0055). Lido do registro, não inferido do
  sobrenome. [PROVEN]

  - **Atestações:** seu próprio casamento com Maria Joanna em 3 de março de 1859, na Matriz de São
  João Baptista, Nova Friburgo (PAR-0070, evento E-0094); e o casal nomeado como avós maternos da
  criança no nascimento civil de 1890 de Alberto Bohrer, em Nova Friburgo (CIV-0019). O casamento
  deixou sua idade em branco; seu óbito de 1914 (CIV-0035) o registra com 88 anos, situando seu
  nascimento em ~1826 [aproximado]. Seu óbito está agora disponível; nenhum batismo próprio dele
  foi ainda localizado. [PROVEN]

  - **Óbito:** faleceu em 19 de setembro de 1914 na Rua Sete de Setembro, Nova Friburgo (registrado
  em 20 de setembro), de arteriosclerose, com 88 anos, "Portuguez, viuvo" (viúvo — logo Maria Joanna
  P-0037 faleceu antes dele); sepultado no Cemitério Público de Nova Friburgo; declarante seu filho
  Antonio da Silva Ferreira Junior [PROVEN — CIV-0035, evento E-0123]. Isso falsifica a hipótese
  anterior de que "faleceu no Rio" — a família retornou a Nova Friburgo.

  ## Família e rede social

  Casou-se com Maria Joanna Rocheman (P-0037, 18 anos ao casar), nascida em Nova Friburgo, filha do
  imigrante suíço João José Rocheman (Rutschmann) de Bulle e de Isabel Stork — ou seja, um português
  ingressando num lar da colônia suíça. A filha do casal, Lucinda, por sua vez casou-se **com a
  faixa documentada de pequenos comerciantes de Nova Friburgo** — o lar *negociante* de Joaquim José
  Bohrer, no Alto da Serra (CIV-0019) — uma posição não elitista de status, não capital fundiário
  herdável [INFERRED/CONTEXTUAL]. Ele e Maria Joanna também tiveram Octávio Ferreira da Silva (c.
  Octavia Froidevaux, 1895, CIV-0036) e Maria da Gloria da Silva Ferreira (c. Ezequiel Mathias Dias,
  1899, CIV-0037), ambos irmãos documentados de Lucinda (família F-0017).

  ## O que podemos extrapolar

  Antonio é a **única imigração individual não colona documentada da família** — um português que se
  casou dentro da rede da colônia suíço-alemã de 1819–1824, em vez de um colono subsidiado —
  reforçando, e não elevando, a trajetória não elitista e de pequeno comércio da linha
  [INFERRED/CONTEXTUAL].

  ## Questões em aberto

  - Seu próprio batismo e a freguesia portuguesa exata (lida como "Guenfães", incerta) — um batismo
  português confirmaria a freguesia e seu ano de nascimento ~1826. O óbito de 1914 (CIV-0035) não
  nomeou sua freguesia de origem nem seus pais, de modo que essa lacuna permanece. (Seu óbito está
  agora disponível.) [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0070 (seu casamento de 1859 em Nova Friburgo — declara sua origem portuguesa e seus pais).

  - CIV-0019 (nascimento de 1890 de Alberto Bohrer, em Nova Friburgo — nomeia-o como avô materno).

  - PAR-0077 (batismo de 1863 da filha Lucinda, no Rio de Janeiro — nomeia-o como pai) · PAR-0056
  (casamento de 1884 da filha Lucinda, em Nova Friburgo — nomeia-o como pai).

  - CIV-0035 (seu óbito de 1914 em Nova Friburgo — falecido aos 88 anos, "Portuguez, viuvo").

  - CIV-0036 (casamento de 1895 do filho Octávio — nomeia-o vivo e residente em Nova Friburgo) ·
  CIV-0037 (casamento de 1899 da filha Maria da Gloria — está vivo e assina pessoalmente).

  ## Onde ir hoje

  - **Casamento (3 mar 1859) e citado como avô materno no nascimento de 1890 do neto Alberto:** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Óbito (19 set 1914, já obtido):** Cartório do Registro Civil, 1º Distrito de São João Baptista, Nova Friburgo (óbitos, termo 5045); sepultamento no Cemitério Público de Nova Friburgo. [RESOLVED]

  - **Batismo português / freguesia de origem (lida como "Guenfães", incerta):** a localizar em Portugal — confirmaria a freguesia e seu ano de nascimento ~1826. [OPEN]
