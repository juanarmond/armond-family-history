profile: >-
  ## Interesting facts

  - **[PROVEN]** He is the only documented non-colony immigrant in this branch of the family tree: his 1859 Nova Friburgo marriage recorded him "natural e baptizado na Freguezia de [Guenfães — uncertain], em Portugal" — a Portuguese man marrying into the Swiss/German colonist community rather than arriving as a subsidised colonist (PAR-0070).

  - **[PROVEN]** He died at Nova Friburgo on 19 September 1914, aged 88 ("Portuguez, viuvo"), at a house on the Rua Sete de Setembro (CIV-0035) — back in the town where he had married 55 years earlier, after a documented interlude away from it in the 1860s: a daughter born in Rio de Janeiro in 1862 (PAR-0077) and a son born in the freguesia of Nossa Senhora da Conceição de Aparecida (RJ) about 1868 (CIV-0036). At 88, he is one of the longest-lived individuals documented in this archive.

  - **[LEAD]** The retrieval research has matched the phonetic "Guenfães" of his marriage act to the parish of São Faustino de Gueifães (concelho da Maia, district of Porto), and reports a 10 June 1824 Gueifães marriage of a Justino da Silva and a Maria Angélica — the names of his parents, two years before his estimated birth. The record is not held here and nothing yet proves that couple are his parents.

  - **[CONTEXTUAL]** He married in 1859, lived through the entire Empire and Republic, the abolition of slavery, and died in 1914 at the start of World War I — a Portuguese immigrant who spent 55 or more years in Brazil, long enough to be remembered only as "Portuguez, viuvo" in his own death record.

  - **[INFERRED]** His marriage into the Rutschmann family (his wife Maria Joanna was the daughter of Swiss colonist João José Rocheman/Rutschmann) shows how the Nova Friburgo colony integrated individual Portuguese immigrants alongside Swiss-German colonists, bringing a different national and cultural identity into a community otherwise defined by its Swiss origin.

  - **[CONTEXTUAL]** The 1889 civil registration law shifted vital records from Catholic parish registers to civil cartórios; his children's marriages (CIV-0036, CIV-0037) were registered civilly in the 1890s, while his own marriage (PAR-0070, 1859) was in the old parish register — his life spans both documentary worlds.

  ## Identity

  **Antonio da Silva Ferreira** — a Portuguese immigrant who married into the Swiss/German
  colony of Nova Friburgo. [PROVEN]

  - **Role:** father of Lucinda Ferreira da Silva (P-0031) and husband of Maria Joanna
  Rocheman/Rutschmann (P-0037; family F-0017); hence Celina Bohrer's (P-0015) maternal
  grandfather. [PROVEN]

  - **Origin:** Portuguese — his 1859 marriage (PAR-0070) records him "natural e baptizado na
  Freguezia de [Guenfães — uncertain], em Portugal", legitimate son of Justino da Silva (P-0111)
  and Maria Angelica (P-0112), both Portuguese (family F-0055). Read from the record, not inferred
  from the surname. [PROVEN]

  - **Attestations:** his own marriage to Maria Joanna on 3 March 1859 at the Matriz de São João
  Baptista, Nova Friburgo (PAR-0070, event E-0094); and the couple named as the maternal
  grandparents of the child in Alberto Bohrer's 1890 Nova Friburgo civil birth (CIV-0019). The
  marriage left his age blank; his 1914 death (CIV-0035) records him aged 88, placing his birth
  ~1826 [approximate]. His death is now held; no baptism of his own has yet been located. [PROVEN]

  - **Death:** he died 19 September 1914 at the Rua Sete de Setembro, Nova Friburgo (registered
  20 September), of arteriosclerosis, aged 88, "Portuguez, viuvo" (a widower — so Maria Joanna
  P-0037 predeceased him); buried in the Cemitério Público de Nova Friburgo; declarant his son
  Antonio da Silva Ferreira Junior [PROVEN — CIV-0035, event E-0123]. This falsifies the earlier
  "died in Rio" hypothesis — the family returned to Nova Friburgo.

  ## Standing and profession

  - No occupation is stated for him in any held act — not in his marriage (PAR-0070), his
  children's marriages (CIV-0036, CIV-0037) or his own death (CIV-0035) [PROVEN of the gap]. He
  was literate: he signs his daughter Maria da Gloria's 1899 civil marriage act (CIV-0037)
  [PROVEN]. His two documented adult sons were both *operários* (CIV-0035, CIV-0036) [PROVEN].
  No property, will or probate is held for him.

  ## Family and social network

  He married the Nova-Friburgo-born Maria Joanna Rocheman (P-0037, 18 at marriage), daughter of the
  Swiss immigrant João José Rocheman (Rutschmann) of Bulle and Isabel Stork — so a Portuguese man
  joining a Swiss-colony household. The marriage witnesses were Domingos Baptista Bittencourt and
  Luiz Mathias Pinheiro (PAR-0070; the retrieval research reads the second as "Luiz Martins
  Pinheiro" [uncertain]). Their daughter Lucinda in turn married **into the documented
  Nova Friburgo petty-merchant band** — the *negociante* household of Joaquim José Bohrer at the
  Alto da Serra (CIV-0019) — a non-elite standing of position, not heritable landed capital
  [INFERRED/CONTEXTUAL]. He and Maria Joanna also had **Isabel da Silva Ferreira** (b. 23 April
  1860, d. 9 June 1860, Nova Friburgo, infant; PAR-0082) [PROVEN — held parish death register
  entry, names both parents], **Octávio Ferreira da Silva** (b. ~1868, operário, m. Octavia
  Froidevaux, 1895, CIV-0036) and **Maria da Gloria da Silva Ferreira** (b. ~1876, m. Ezequiel
  Mathias Dias, 1899, CIV-0037), all documented siblings of Lucinda (family F-0017). A further son,
  **Antonio da Silva Ferreira Junior**, an *operário* at Nova Friburgo, declared his father's
  death in 1914; that act names only the father ("seu pae"), so his parentage rests on one parent
  [STRONG-EVIDENCE — CIV-0035].

  - **Kin around the 1899 marriage:** João Julião Froidevaux — the father of Octávio's wife —
  also signs Maria da Gloria's 1899 act alongside Antonio (CIV-0037) [PROVEN], so the two
  in-law families stood together. That same year Maria da Gloria and a **José da Silva Ferreira**
  were the godparents of Antonio's granddaughter Celina (PAR-0057) [PROVEN]; José's relationship
  to Antonio is not stated, and the retrieval research treats him only as a possible son [LEAD,
  weak].

  ## What we can extrapolate

  **He is the family's one documented non-colonist immigration, and the comparison it allows is
  exact.** His 1859 marriage act records him "natural e baptizado na Freguezia de [Guenfães —
  uncertain], em Portugal", legitimate son of Justino da Silva and Maria Angelica, both in
  Portugal (PAR-0070) [PROVEN]; his 1914 death gives his age as 88, placing his birth about 1826
  (CIV-0035) [PROVEN]. The origin is stated by the records, not inferred from the surname. The
  Swiss and German families he married into had arrived under a state contract — a lot, a house,
  rations, seed, livestock and a daily subsidy of 160 réis falling to 80, for two years (Decreto
  de 16 May 1818) [CONTEXTUAL]. Antonio arrived on his own account with none of it. Fifty-five
  documented years later the two paths sit at the same level. On the evidence of this household,
  the colony package bought a starting position and conferred no durable advantage over ordinary
  unassisted immigration. [INFERRED]

  **He was literate, and the proof comes late.** On 28 October 1899, at about seventy-three, he
  personally signs his daughter Maria da Gloria's civil marriage act at Nova Friburgo, his name
  among the signatories (CIV-0037) [PROVEN]. It is the only literacy evidence held for him, and
  it places him on the literate side of a line that was not uniformly literate: in the same
  decade Valentim Martinho Bohrer (P-0028), of the other branch this family married into, could
  not write his own name (CIV-0045) [PROVEN].

  **His household is the town-and-wage variant of the same low band, not the serra-lot one.** He
  died on 19 September 1914 at a house in the Rua Sete de Setembro — a central Nova Friburgo
  street — aged 88, a widower, of arteriosclerosis, and was buried in the town's public cemetery
  (CIV-0035) [PROVEN]: no chapel, no brotherhood, no family plot named. The declarant was his
  son Antonio da Silva Ferreira Junior, an *operario*; his other son Octávio was likewise an
  *operario* at his own 1895 marriage (CIV-0035, CIV-0036) [PROVEN]. The Portuguese in-migrant's
  Brazilian-born sons were wage workers living in town while the colonist branch was still on
  parish lots — two routes to the same floor. [INFERRED]

  **His children married across the town's immigrant strata, which tells you which boundary
  actually mattered.** Octávio married Octavia Froidevaux, of a Nova Friburgo colony family, in
  1895 (CIV-0036); Maria da Gloria married Ezequiel Mathias Dias, a *negociante* "natural de
  Portugal", in 1899 (CIV-0037); Lucinda married the colonist-descended *negociante* Joaquim
  José Bohrer in 1884 (PAR-0056) [PROVEN]. Portuguese to Swiss-colony to Portuguese inside one
  sibling set: in an immigrant town the line that organised marriage was economic level, not
  national origin. [INFERRED]

  **Fifty-five documented years in Brazil, and not one property record.** [INFERRED] Between his
  1859 marriage and his 1914 death he appears in that marriage, in four of his children's acts
  and in his own death — and in no land registry, will, probate or commercial notice. He
  reinforces the line's trajectory rather than lifting it: an unassisted in-migration with
  nothing behind it, joining a colonist network with almost nothing behind it, and producing
  wage-working sons and a daughter who married into petty commerce.

  ## Open questions

  - His own baptism and the exact Portuguese home parish (read as "Guenfães", uncertain) — a
  Portuguese baptism would confirm the parish and his ~1826 birth year. The 1914 death (CIV-0035)
  named neither his origin parish nor his parents, so that gap is unchanged. (His death is now
  held.) [OPEN]

  - **The Gueifães lead.** [LEAD] The retrieval research identifies the parish as São Faustino de
  Gueifães (Maia, Porto) and reports the 10 June 1824 marriage there of Justino da Silva — son of
  José da Silva and Victoria de Jesus — and Maria Angélica — daughter of Raphael Francisco and
  Roza Angélica (Gueifães marriage register 1814–1859, digitised by the Portuguese archives; not
  held here). The match rests on both parents' names, the parish and the chronology only. The
  same research cautions that at least three men named Justino da Silva lived in Gueifães at the
  time, and that the microfilm searched had no baptisms after about 1813, so Antonio's own
  baptism (c. 1824–1832) is still unsearched. Proof needs that baptism. [OPEN]

  - **Where "Ferreira" came from.** [INFERRED] If the Gueifães couple are his parents, neither
  carries "Ferreira" — the lead's bride is a daughter of Raphael Francisco — so the origin of his
  Brazilian surname "da Silva Ferreira" would remain unexplained. Neither PAR-0070 nor CIV-0035
  explains it. [OPEN]

  - Maria Joanna's own death record: the retrieval research reports her Nova Friburgo burial entry
  of 1 December 1896 (died 30 November, "casada com Antonio da Silva Ferreira") [LEAD — not
  catalogued here]; until it is catalogued, her death stays bracketed between Dec 1895 and Oct 1899
  (CIV-0036, CIV-0037). [OPEN]

  ## Sources held (this repository)

  - PAR-0070 (his 1859 Nova Friburgo marriage — states his Portuguese origin and parents).

  - CIV-0019 (Alberto Bohrer's 1890 Nova Friburgo birth — names him as maternal grandfather).

  - PAR-0077 (daughter Lucinda's 1863 Rio de Janeiro baptism — names him as father) · PAR-0056
  (daughter Lucinda's 1884 Nova Friburgo marriage — names him as father).

  - CIV-0035 (his 1914 Nova Friburgo death — died aged 88, "Portuguez, viuvo").

  - CIV-0036 (son Octávio's 1895 marriage — names him alive and resident at Nova Friburgo) ·
  CIV-0037 (daughter Maria da Gloria's 1899 marriage — he is alive and personally signs) ·
  PAR-0082 (infant daughter Isabel's 1860 Nova Friburgo death — names him and Maria Joanna as
  parents; b. 23 Apr 1860, d. 9 Jun 1860).

  ## Regional and migration context

  - **Life arc, leg by leg.** Portugal (born ~1826; parish read "Guenfães", uncertain) → Nova
  Friburgo, married there 3 March 1859 (PAR-0070) and still there in June 1860 (PAR-0082) → Rio de
  Janeiro, freguesia of São João Baptista da Lagoa, where Lucinda was born in August 1862 and
  baptised in March 1863 (PAR-0077) → the freguesia of Nossa Senhora da Conceição de Aparecida
  (RJ), Octávio's birthplace about 1868 (CIV-0036) → back at Nova Friburgo by about 1876, Maria da
  Gloria's birthplace (CIV-0037), and resident in its 1º Distrito from at least 1895 until his
  death in 1914 (CIV-0036, CIV-0037, CIV-0035) [PROVEN, leg by leg]. A household that moved
  twice and came back is consistent with a man following work rather than holding land.
  [INFERRED]

  - **A separate migration from the colony's.** [CONTEXTUAL] The Swiss and German families he
  married into had come under King João VI's Decreto de 16 May 1818 — a collective, state-recruited
  settlement scheme with lots and subsidies. He came later, individually and unassisted, in the
  ordinary Portuguese in-migration to the province of Rio de Janeiro; no held record states when he
  arrived or why.

  - **Portuguese origin.** [LEAD] If the retrieval research's identification holds, his home parish
  was São Faustino de Gueifães, in the concelho of Maia just north of Porto — a freguesia that the
  same research says no longer exists separately since Portugal's 2013 parish reform merged it into
  the Cidade da Maia union, which is why gazetteer searches for it failed.

  ## Where to go today

  - **Marriage (3 Mar 1859) & named as maternal grandfather in grandson Alberto's 1890 birth:** Catedral Diocesana / Igreja Matriz de São João Batista, Nova Friburgo, RJ (Rua Monsenhor José Antônio Teixeira 23, Centro, CEP 28610-390) [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **Death (19 Sep 1914, already held):** Cartório do Registro Civil, 1º Distrito de São João Baptista, Nova Friburgo (óbitos, termo 5045); burial at the Cemitério Público de Nova Friburgo. [RESOLVED]

  - **Portuguese baptism / home parish (read as "Guenfães", uncertain):** to be located in Portugal — would confirm the parish and his ~1826 birth year. The retrieval research points to the parish registers of São Faustino de Gueifães (Maia), held by the Arquivo Distrital do Porto and digitised on its online catalogue [LEAD]. [OPEN]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é o único imigrante individual não colono documentado neste ramo da árvore genealógica: seu registro de casamento de 1859 em Nova Friburgo o registrou "natural e baptizado na Freguezia de [Guenfães — incerto], em Portugal" — um português que se casou dentro da comunidade colona suíço-alemã, e não como um colono subsidiado (PAR-0070).

  - **[PROVEN]** Ele faleceu em Nova Friburgo em 19 de setembro de 1914, aos 88 anos ("Portuguez, viuvo"), numa casa da Rua Sete de Setembro (CIV-0035) — de volta à cidade onde se casara 55 anos antes, após um interlúdio documentado fora dela na década de 1860: uma filha nascida no Rio de Janeiro em 1862 (PAR-0077) e um filho nascido na freguesia de Nossa Senhora da Conceição de Aparecida (RJ) por volta de 1868 (CIV-0036). Com 88 anos, é um dos indivíduos mais longevos documentados neste arquivo.

  - **[LEAD]** A pesquisa de recuperação associou o fonético "Guenfães" de seu ato de casamento à freguesia de São Faustino de Gueifães (concelho da Maia, distrito do Porto), e relata um casamento em Gueifães, em 10 de junho de 1824, de um Justino da Silva com uma Maria Angélica — os nomes de seus pais, dois anos antes de seu nascimento estimado. O registro não está neste repositório e nada ainda prova que esse casal seja o de seus pais.

  - **[CONTEXTUAL]** Ele se casou em 1859, viveu todo o Império e a República, a abolição da escravidão, e faleceu em 1914 no início da Primeira Guerra Mundial — um imigrante português que passou 55 ou mais anos no Brasil, tempo suficiente para ser lembrado apenas como "Portuguez, viuvo" em seu próprio registro de óbito.

  - **[INFERRED]** Seu casamento com a família Rutschmann (sua esposa Maria Joanna era filha do colono suíço João José Rocheman/Rutschmann) mostra como a colônia de Nova Friburgo integrou imigrantes portugueses individuais ao lado dos colonos suíço-alemães, trazendo uma identidade nacional e cultural diferente para uma comunidade de outra forma definida por sua origem suíça.

  - **[CONTEXTUAL]** A lei de registro civil de 1889 transferiu os registros vitais das paróquias católicas para os cartórios civis; os casamentos de seus filhos (CIV-0036, CIV-0037) foram registrados civilmente na década de 1890, enquanto seu próprio casamento (PAR-0070, 1859) estava no antigo registro paroquial — sua vida abrange ambos os mundos documentais.

  ## Identidade

  **Antonio da Silva Ferreira** — um imigrante português que se casou dentro da colônia
  suíço-alemã de Nova Friburgo. [PROVEN]

  - **Papel:** pai de Lucinda Ferreira da Silva (P-0031) e marido de Maria Joanna
  Rocheman/Rutschmann (P-0037; família F-0017); portanto, avô materno de Celina Bohrer (P-0015).
  [PROVEN]

  - **Origem:** portuguesa — seu casamento de 1859 (PAR-0070) o registra "natural e baptizado na
  Freguezia de [Guenfães — incerto], em Portugal", filho legítimo de Justino da Silva (P-0111) e
  Maria Angelica (P-0112), ambos portugueses (família F-0055). Lido do registro, não inferido do
  sobrenome. [PROVEN]

  - **Atestações:** seu próprio casamento com Maria Joanna em 3 de março de 1859, na Matriz de São
  João Baptista, Nova Friburgo (PAR-0070, evento E-0094); e o casal nomeado como avós maternos da
  criança no nascimento civil de 1890 de Alberto Bohrer, em Nova Friburgo (CIV-0019). O casamento
  deixou sua idade em branco; seu óbito de 1914 (CIV-0035) o registra com 88 anos, situando seu
  nascimento em ~1826 [aproximado]. Seu óbito está agora disponível; nenhum batismo próprio dele
  foi ainda localizado. [PROVEN]

  - **Óbito:** faleceu em 19 de setembro de 1914 na Rua Sete de Setembro, Nova Friburgo (registrado
  em 20 de setembro), de arteriosclerose, com 88 anos, "Portuguez, viuvo" (viúvo — logo Maria Joanna
  P-0037 faleceu antes dele); sepultado no Cemitério Público de Nova Friburgo; declarante seu filho
  Antonio da Silva Ferreira Junior [PROVEN — CIV-0035, evento E-0123]. Isso falsifica a hipótese
  anterior de que "faleceu no Rio" — a família retornou a Nova Friburgo.

  ## Posição social e profissão

  - Nenhuma ocupação lhe é atribuída em qualquer ato disponível — nem em seu casamento
  (PAR-0070), nem nos casamentos dos filhos (CIV-0036, CIV-0037), nem em seu próprio óbito
  (CIV-0035) [PROVEN quanto à lacuna]. Era letrado: assina o ato de casamento civil de 1899 da
  filha Maria da Gloria (CIV-0037) [PROVEN]. Seus dois filhos adultos documentados eram ambos
  *operários* (CIV-0035, CIV-0036) [PROVEN]. Nenhuma propriedade, testamento ou inventário dele
  está disponível.

  ## Família e rede social

  Casou-se com Maria Joanna Rocheman (P-0037, 18 anos ao casar), nascida em Nova Friburgo, filha do
  imigrante suíço João José Rocheman (Rutschmann) de Bulle e de Isabel Stork — ou seja, um português
  ingressando num lar da colônia suíça. As testemunhas do casamento foram Domingos Baptista
  Bittencourt e Luiz Mathias Pinheiro (PAR-0070; a pesquisa de recuperação lê o segundo como "Luiz
  Martins Pinheiro" [incerto]). A filha do casal, Lucinda, por sua vez casou-se **com a
  faixa documentada de pequenos comerciantes de Nova Friburgo** — o lar *negociante* de Joaquim José
  Bohrer, no Alto da Serra (CIV-0019) — uma posição não elitista de status, não capital fundiário
  herdável [INFERRED/CONTEXTUAL]. Ele e Maria Joanna também tiveram **Isabel da Silva Ferreira** (n.
  23 de abril de 1860, f. 9 de junho de 1860, Nova Friburgo, infante; PAR-0082) [PROVEN — registro
  paroquial de óbito em mãos, nomeia ambos os pais], **Octávio Ferreira da Silva** (n. ~1868,
  operário, c. Octavia Froidevaux, 1895, CIV-0036) e **Maria da Gloria da Silva Ferreira** (n.
  ~1876, c. Ezequiel Mathias Dias, 1899, CIV-0037), todos irmãos documentados de Lucinda (família
  F-0017). Um outro filho, **Antonio da Silva Ferreira Junior**, *operário* em Nova Friburgo,
  declarou o óbito do pai em 1914; esse ato nomeia apenas o pai ("seu pae"), de modo que sua
  filiação repousa sobre um único genitor [STRONG-EVIDENCE — CIV-0035].

  - **Parentes em torno do casamento de 1899:** João Julião Froidevaux — pai da esposa de Octávio
  — também assina o ato de 1899 de Maria da Gloria ao lado de Antonio (CIV-0037) [PROVEN], de modo
  que as duas famílias aparentadas estavam juntas. No mesmo ano, Maria da Gloria e um **José da
  Silva Ferreira** foram os padrinhos da neta de Antonio, Celina (PAR-0057) [PROVEN]; o parentesco
  de José com Antonio não é declarado, e a pesquisa de recuperação o trata apenas como possível
  filho [LEAD, fraco].

  ## O que podemos extrapolar

  **Ele é a única imigração não colona documentada da família, e a comparação que isso permite é
  exata.** Seu ato de casamento de 1859 o registra "natural e baptizado na Freguezia de
  [Guenfães — incerto], em Portugal", filho legítimo de Justino da Silva e Maria Angelica, ambos
  em Portugal (PAR-0070) [PROVEN]; seu óbito de 1914 lhe dá 88 anos, situando o nascimento por
  volta de 1826 (CIV-0035) [PROVEN]. A origem é declarada pelos registros, não inferida do
  sobrenome. As famílias suíças e alemãs com as quais se aparentou haviam chegado sob contrato
  do Estado — lote, casa, rações, sementes, gado e um subsídio diário de 160 réis caindo para
  80, por dois anos (Decreto de 16 de maio de 1818) [CONTEXTUAL]. Antonio chegou por conta
  própria, sem nada disso. Cinquenta e cinco anos documentados depois, os dois caminhos estão no
  mesmo nível. Pela evidência deste domicílio, o pacote colonial comprou uma posição de partida
  e não conferiu vantagem durável sobre a imigração comum, sem subsídio. [INFERRED]

  **Ele era letrado, e a prova é tardia.** Em 28 de outubro de 1899, com cerca de setenta e três
  anos, assina pessoalmente o ato de casamento civil de sua filha Maria da Gloria em Nova
  Friburgo, com o nome entre os signatários (CIV-0037) [PROVEN]. É a única evidência de
  letramento disponível para ele, e o coloca do lado letrado de uma linha que não era
  uniformemente letrada: na mesma década, Valentim Martinho Bohrer (P-0028), do outro ramo com
  que esta família se aparentou, não sabia escrever o próprio nome (CIV-0045) [PROVEN].

  **Seu domicílio é a variante urbana e assalariada da mesma faixa baixa, não a variante do lote
  serrano.** Morreu em 19 de setembro de 1914 numa casa da Rua Sete de Setembro — rua central de
  Nova Friburgo —, aos 88 anos, viúvo, de arteriosclerose, e foi sepultado no cemitério público
  da cidade (CIV-0035) [PROVEN]: sem capela, sem irmandade, sem jazigo familiar nomeado. O
  declarante foi seu filho Antonio da Silva Ferreira Junior, *operario*; seu outro filho,
  Octávio, era igualmente *operario* em seu próprio casamento de 1895 (CIV-0035, CIV-0036)
  [PROVEN]. Os filhos nascidos no Brasil do imigrante português eram trabalhadores assalariados
  morando na cidade enquanto o ramo colono ainda estava em lotes de freguesia — dois caminhos
  para o mesmo piso. [INFERRED]

  **Seus filhos casaram-se atravessando os estratos imigrantes da cidade, o que revela qual
  fronteira de fato importava.** Octávio casou-se com Octavia Froidevaux, de uma família da
  colônia friburguense, em 1895 (CIV-0036); Maria da Gloria casou-se com Ezequiel Mathias Dias,
  *negociante* "natural de Portugal", em 1899 (CIV-0037); Lucinda casou-se com o *negociante*
  descendente de colonos Joaquim José Bohrer em 1884 (PAR-0056) [PROVEN]. Português, colônia
  suíça e português dentro de um mesmo conjunto de irmãos: numa cidade de imigrantes, a linha
  que organizava o casamento era o nível econômico, não a origem nacional. [INFERRED]

  **Cinquenta e cinco anos documentados no Brasil e nenhum registro de propriedade.** [INFERRED]
  Entre seu casamento de 1859 e seu óbito de 1914 ele aparece nesse casamento, em quatro atos de
  filhos e em sua própria morte — e em nenhum registro de terras, testamento, inventário ou nota
  comercial. Ele reforça a trajetória da linha em vez de elevá-la: uma imigração sem subsídio e
  sem nada atrás de si, integrando-se a uma rede colona com quase nada atrás de si, e produzindo
  filhos assalariados e uma filha casada no pequeno comércio.

  ## Questões em aberto

  - Seu próprio batismo e a freguesia portuguesa exata (lida como "Guenfães", incerta) — um batismo
  português confirmaria a freguesia e seu ano de nascimento ~1826. O óbito de 1914 (CIV-0035) não
  nomeou sua freguesia de origem nem seus pais, de modo que essa lacuna permanece. (Seu óbito está
  agora disponível.) [OPEN]

  - **A pista de Gueifães.** [LEAD] A pesquisa de recuperação identifica a freguesia como São
  Faustino de Gueifães (Maia, Porto) e relata ali o casamento, em 10 de junho de 1824, de Justino
  da Silva — filho de José da Silva e Victoria de Jesus — com Maria Angélica — filha de Raphael
  Francisco e Roza Angélica (livro de casamentos de Gueifães 1814–1859, digitalizado pelos arquivos
  portugueses; não disponível neste repositório). A correspondência repousa apenas nos nomes de
  ambos os pais, na freguesia e na cronologia. A mesma pesquisa adverte que ao menos três homens
  chamados Justino da Silva viviam em Gueifães na época, e que o microfilme consultado não tinha
  batismos posteriores a cerca de 1813, de modo que o próprio batismo de Antonio (c. 1824–1832)
  ainda não foi pesquisado. A prova exige esse batismo. [OPEN]

  - **De onde veio o "Ferreira".** [INFERRED] Se o casal de Gueifães for o de seus pais, nenhum dos
  dois leva "Ferreira" — a noiva da pista é filha de Raphael Francisco —, de modo que a origem de
  seu sobrenome brasileiro "da Silva Ferreira" continuaria sem explicação. Nem PAR-0070 nem
  CIV-0035 a explicam. [OPEN]

  - O próprio registro de óbito de Maria Joanna: a pesquisa de recuperação relata seu assento de
  sepultamento em Nova Friburgo de 1º de dezembro de 1896 (falecida em 30 de novembro, "casada com
  Antonio da Silva Ferreira") [LEAD — não catalogado aqui]; até ser catalogado, seu óbito permanece
  delimitado entre dez. 1895 e out. 1899 (CIV-0036, CIV-0037). [OPEN]

