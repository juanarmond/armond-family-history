profile: >-
  ## Identity

  **José Moser** — a Swiss man of Canton Solothurn, known as the father of Catharina Moser
  (P-0051), who married the immigrant Jacob Bohrer at Nova Friburgo in 1825. [PROVEN]

  - **Identification:** named "Jose Moser" in Catharina's 1825 Nova Friburgo marriage register,
  alongside his wife "Maria Veisse" (Weiss), with Catharina described as "natural e baptizada na
  freg.a d'Eggendorf [Hägendorf — uncertain], Cantão de Soleure" (PAR-0059). [PROVEN]

  ## Family

  He and Maria Weiss (P-0099; family F-0048) are attested together in a single primary record —
  their daughter's 1825 marriage. [PROVEN — PAR-0059] Secondary compilations record a Joseph
  Moser of Hägendorf emigrating to Nova Friburgo aboard the *Heureux Voyage* (1819) and holding
  colonist Lote 67 — consistent with the Hägendorf/Solothurn origin the marriage record implies —
  but no held primary source about him has been located beyond PAR-0059. [LEAD]

  ## Open questions

  - His birth, marriage and death dates; his own parentage; whether a death record survives in
  Nova Friburgo — all unreached. The Hägendorf Catholic parish registers (Thierstein district;
  FS catalog 544541, freely accessible online) are the primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of daughter Catharina Moser — names José Moser and
  Maria Weiss as Catharina's legitimate parents from Canton Solothurn).
profile_pt: >-
  ## Identidade

  **José Moser** — homem suíço do Cantão de Soleure (Solothurn), conhecido como pai de Catharina
  Moser (P-0051), que se casou com o imigrante Jacob Bohrer em Nova Friburgo em 1825. [PROVEN]

  - **Identificação:** nomeado "Jose Moser" no registro de casamento de 1825 de Catharina, em Nova
  Friburgo, ao lado de sua esposa "Maria Veisse" (Weiss), com Catharina descrita como "natural e
  baptizada na freg.a d'Eggendorf [Hägendorf — incerto], Cantão de Soleure" (PAR-0059). [PROVEN]

  ## Família

  Ele e Maria Weiss (P-0099; família F-0048) são atestados juntos em um único registro primário —
  o casamento de sua filha em 1825. [PROVEN — PAR-0059] Compilações secundárias registram um
  Joseph Moser de Hägendorf emigrando para Nova Friburgo no *Heureux Voyage* (1819) e detendo o
  lote de colono 67 — compatível com a origem em Hägendorf/Solothurn que o registro de casamento
  implica — mas nenhuma fonte primária retida sobre ele foi localizada além de PAR-0059. [LEAD]

  ## Questões em aberto

  - Suas datas de nascimento, casamento e falecimento; própria filiação; eventual registro de
  óbito em Nova Friburgo — tudo não alcançado. Os registros paroquiais católicos de Hägendorf
  (distrito de Thierstein; catálogo FS 544541, livremente acessível online) são o principal alvo
  de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, da filha Catharina Moser — nomeia José Moser
  e Maria Weiss como pais legítimos de Catharina, do Cantão de Soleure).
