profile: >-
  ## Interesting facts

  - **[PROVEN]** He is named exactly once in a record held here — his daughter Catharina's
  marriage at Nova Friburgo on 8 August 1825, where the vicar Jacob Joye wrote her as "filha
  legitima de Jose Moser e de sua mulher Maria Veisse [Weiss], natural e baptizada na freguezia
  d'Eggendorf [Hägendorf — uncertain], Cantão de Soleure" (PAR-0059). One line in one register
  is the whole of his documented existence in this archive.

  - **[PROVEN]** The entry fixes a canton, not merely a surname: "Soleure" (Solothurn) is
  written out, and a baptismal parish is given for his daughter, even though the clerk's
  "Eggendorf" is an uncertain read for Hägendorf. His Swiss origin is therefore record-stated,
  not inferred from the name Moser.

  - **[PROVEN / conflict preserved]** Even the surname rests on that single reading. His
  daughter appears as "Catharina Moser" in 1825 but as "Catharina Mayer" in her son Francisco
  José Borer's 1888 registered will (PRB-0005); the archive preserves both, and since 2026-09-24
  she is entered as P-0051, **Catharina Moser** — the form her own marriage act and her son's
  1832 baptism both use, against a will written 63 years later at second hand.

  - **[LEAD]** Colonist compilations, and an untriaged Nova Friburgo burial image in the
  retrieval drop, place a Joseph Moser of Hägendorf on the *Heureux Voyage* (reaching Nova
  Friburgo 1 January 1820) holding colonist Lote 67, and record his death there on 4 December
  1837 aged 84. If that is this man he crossed the Atlantic himself; none of it is yet a source
  in this repository.

  ## Identity

  **José Moser** — a Swiss man of Canton Solothurn, known here only as the father of Catharina
  Moser (P-0051), who married the immigrant Jacob Bohrer at Nova Friburgo in 1825. Iris Bohrer
  Muniz's (P-0007) 3×-great-grandfather, by the chain Catharina → Francisco José Bohrer (P-0034)
  → Joaquim José Bohrer (P-0030) → Celina Bohrer (P-0015). [PROVEN — PAR-0059; degree derived
  from the family links, not from a source abstract]

  - **Name as recorded:** "Jose Moser". [PROVEN — PAR-0059]

  - **Origin:** Canton Solothurn (Soleure), Switzerland; the family parish is read "Eggendorf"
  and interpreted as Hägendorf. [PROVEN for the canton; parish uncertain]

  - **Spouse:** Maria Weiss, written "Maria Veisse" (P-0099; family F-0048). No marriage act of
  their own is held. [PROVEN that the two are named as a married couple]

  - **Birth, death, own parentage:** undocumented in anything held here. [OPEN]

  ## Standing and profession

  Nothing is known. The 1825 act gives him no occupation, title, residence or signature — the
  phrase "colonos suiços e moradores n'esta freg.a" describes the bride and groom, not the
  bride's parents. Any account of how he made his living would be invention.

  ## Family and social network

  He and Maria Weiss are the deepest generation reached on the Moser line, and they are reached
  only through their daughter. [PROVEN — PAR-0059] Catharina married Jacob Bohrer, a legitimate
  son of João Bohrer × Barbara Probst of Erschwil — also Solothurn: a Solothurn × Solothurn
  match made in Brazil six years after the colony was founded. The witnesses, João Probst and
  Isabel Sch[oser — uncertain], point the same way, to a wedding inside a transplanted circle
  from the same canton. [PROVEN — PAR-0059; the second witness surname is an uncertain read]

  ## What we can extrapolate

  - **[CONTEXTUAL]** A Solothurn farming household in 1818–19 sat in the worst subsistence
  crisis of the century: the 1815 Tambora eruption produced the 1816 "Year Without a Summer",
  harvests failed across Europe in 1816–17, and the shock landed on a countryside already
  impoverished by the Napoleonic wars and short of land for too many heirs. That is the push
  behind every Solothurn family here — regional history, not a motive any record attributes to
  him.

  - **[CONTEXTUAL]** The pull was manufactured. Dom João VI's decree of 16 May 1818 contracted
  the Fribourg agent Sébastien-Nicolas Gachet to plant 100 Swiss Catholic families on the
  Fazenda do Morro Queimado; recruitment overshot to some 261–265 families, drawn from
  Solothurn, Valais and Bern as well as Fribourg — which is how Solothurn people came to settle
  a nominally Fribourgeois colony.

  - **[INFERRED]** If the Lote 67 lead is ever confirmed it would matter: an intact household —
  husband, wife, children, one lot — is a materially better starting position than the orphaned
  arrivals this tree also contains, and would explain why Catharina married *within* the colony
  in 1825 rather than into it. Unconfirmed, it stays a lead.

  ## Open questions

  - His birth, his marriage and his own parents — all unreached. [OPEN]

  - Whether the *Heureux Voyage* / Lote 67 assignment and the 4 December 1837 Nova Friburgo
  burial belong to this man, and cataloguing them here if so. The burial image is in the
  retrieval drop, untriaged; its stated age of 84 implies a birth about 1753, against the
  compilation's 10 November 1757 — a four-year gap left unresolved. [OPEN]

  - Whether the family surname is Moser or Mayer at all — the 1825 vs 1888 conflict recorded on
  P-0051. [OPEN]

  ## Sources held (this repository)

  - **PAR-0059** — 1825 Nova Friburgo marriage of his daughter Catharina to Jacob Bohrer. Names
  "Jose Moser" and "Maria Veisse" as her legitimate parents and states the canton (Soleure) and
  her baptismal parish ("Eggendorf" [Hägendorf — uncertain]). The only held record that names
  him.

  ## Regional and migration context

  Hägendorf lies in Canton Solothurn, in German-speaking, predominantly Catholic north-west
  Switzerland, where agriculture was through the 19th century effectively the only economy.
  [CONTEXTUAL] The 1819 emigrants left along the route the Fribourg recruitment used —
  Estavayer-le-Lac on 4 July 1819, then Basel and Rotterdam to the North Sea ports, and on to
  Rio in a fleet that included the *Heureux Voyage*; the first ship reached Rio on 4 November
  1819 and the settlement became Vila de Nova Friburgo on 3 January 1820. Roughly a quarter of
  the emigrants died en route of typhus and scurvy, and the highland lots that greeted the
  survivors were stony, small and under-equipped, so many abandoned them within a few years.
  [CONTEXTUAL] Whether José Moser was on that route is a lead; what the held record does place
  at Nova Friburgo is his daughter, married there in 1825. [PROVEN]

  ## Where to go today

  - **Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf** — 4614 Hägendorf, Kt.
  Solothurn, Switzerland · [Maps](https://maps.google.com/?q=47.3347,7.8445). The parish read
  into the 1825 entry; its Catholic registers (FamilySearch catalogue 544541, freely viewable
  online) are where a Moser baptism, marriage and parentage would sit. [RESOLVED as a place; the
  search itself is OPEN]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where his
  daughter married in 1825. The present cathedral was inaugurated in 1869; the act was
  celebrated in the earlier parish church on the same site. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). The former Fazenda
  do Morro Queimado, where the colony's house and lot numbers were laid out. If the Lote 67 lead
  holds this is the ground; no colonist house survives as an address. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é nomeado exatamente uma vez em um documento disponível aqui — o casamento
  de sua filha Catharina em Nova Friburgo, em 8 de agosto de 1825, em que o vigário Jacob Joye a
  registrou como "filha legitima de Jose Moser e de sua mulher Maria Veisse [Weiss], natural e
  baptizada na freguezia d'Eggendorf [Hägendorf — incerto], Cantão de Soleure" (PAR-0059). Uma
  linha em um livro é toda a sua existência documentada neste arquivo.

  - **[PROVEN]** O assento fixa um cantão, e não apenas um sobrenome: "Soleure" (Solothurn) está
  escrito por extenso, e a freguesia de batismo da filha é indicada, ainda que o "Eggendorf" do
  escrivão seja leitura incerta para Hägendorf. Sua origem suíça é, portanto, declarada pelo
  registro — não inferida do sobrenome Moser.

  - **[PROVEN / conflito preservado]** Até o sobrenome depende dessa leitura única. A filha
  aparece como "Catharina Moser" em 1825, mas como "Catharina Mayer" no testamento registrado de
  1888 de seu filho Francisco José Borer (PRB-0005); o arquivo preserva as duas formas e, desde
  2026-09-24, ela é registrada como P-0051, **Catharina Moser** — a forma usada tanto em seu
  próprio ato de casamento quanto no batismo de seu filho em 1832, contra um testamento escrito
  63 anos depois, em segunda mão.

  - **[LEAD]** Compilações de colonos, e uma imagem de óbito de Nova Friburgo ainda não triada
  no lote de recuperação, situam um Joseph Moser de Hägendorf no *Heureux Voyage* (chegada a
  Nova Friburgo em 1º de janeiro de 1820), detentor do Lote 67 de colono, e registram sua morte
  ali em 4 de dezembro de 1837, aos 84 anos. Se for este homem, ele mesmo cruzou o Atlântico;
  nada disso é ainda uma fonte neste repositório.

  ## Identidade

  **José Moser** — homem suíço do Cantão de Soleure, conhecido aqui apenas como pai de Catharina
  Moser (P-0051), que se casou com o imigrante Jacob Bohrer em Nova Friburgo, em 1825. Tetravô
  de Iris Bohrer Muniz (P-0007), pela cadeia Catharina → Francisco José Bohrer (P-0034) →
  Joaquim José Bohrer (P-0030) → Celina Bohrer (P-0015). [PROVEN — PAR-0059; grau derivado dos
  vínculos familiares, não copiado de um resumo de fonte]

  - **Nome registrado:** "Jose Moser". [PROVEN — PAR-0059]

  - **Origem:** Cantão de Soleure (Solothurn), Suíça; a freguesia da família é lida como
  "Eggendorf" e interpretada como Hägendorf. [PROVEN quanto ao cantão; freguesia incerta]

  - **Cônjuge:** Maria Weiss, grafada "Maria Veisse" (P-0099; família F-0048). Nenhum assento de
  casamento do próprio casal está disponível. [PROVEN que os dois são nomeados como casal]

  - **Nascimento, óbito e filiação própria:** não documentados em nada que se tenha aqui. [OPEN]

  ## Posição social e profissão

  Nada se sabe. O assento de 1825 não lhe dá ocupação, título, residência nem assinatura — a
  expressão "colonos suiços e moradores n'esta freg.a" descreve os noivos, não os pais da noiva.
  Qualquer relato de como ele ganhava a vida seria invenção.

  ## Família e rede social

  Ele e Maria Weiss são a geração mais profunda alcançada na linha Moser, e são alcançados
  apenas por meio da filha. [PROVEN — PAR-0059] Catharina casou-se com Jacob Bohrer, filho
  legítimo de João Bohrer × Barbara Probst, de Erschwil — também Solothurn: uma união Solothurn
  × Solothurn feita no Brasil, seis anos após a fundação da colônia. As testemunhas, João Probst
  e Isabel Sch[oser — incerto], apontam no mesmo sentido: um casamento dentro de um círculo
  transplantado do mesmo cantão. [PROVEN — PAR-0059; o segundo sobrenome de testemunha é leitura
  incerta]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Um domicílio agrícola de Solothurn em 1818–19 estava na pior crise de
  subsistência do século: a erupção do Tambora em 1815 produziu o "Ano Sem Verão" de 1816, as
  colheitas falharam em toda a Europa em 1816–17, e o choque atingiu um campo já empobrecido
  pelas guerras napoleônicas e escasso de terra para herdeiros demais. Esse é o fator de
  expulsão por trás de toda família de Solothurn aqui — história regional, não um motivo que
  algum registro lhe atribua.

  - **[CONTEXTUAL]** A atração foi fabricada. O decreto de Dom João VI de 16 de maio de 1818
  contratou o agente friburguês Sébastien-Nicolas Gachet para assentar 100 famílias católicas
  suíças na Fazenda do Morro Queimado; o recrutamento excedeu-se para cerca de 261–265 famílias,
  vindas de Solothurn, Valais e Berna além de Friburgo — foi assim que gente de Solothurn veio
  povoar uma colônia nominalmente friburguesa.

  - **[INFERRED]** Se a pista do Lote 67 vier a confirmar-se, fará diferença: um domicílio
  íntegro — marido, mulher, filhos, um lote — é uma posição de partida materialmente melhor do
  que a dos órfãos que esta árvore também contém, e explicaria por que Catharina se casou
  *dentro* da colônia em 1825, e não com alguém de fora. Sem confirmação, permanece pista.

  ## Questões em aberto

  - Seu nascimento, seu casamento e seus próprios pais — tudo não alcançado. [OPEN]

  - Se a atribuição *Heureux Voyage* / Lote 67 e o sepultamento de 4 de dezembro de 1837 em Nova
  Friburgo pertencem a este homem, e o seu catálogo aqui em caso afirmativo. A imagem do óbito
  está no lote de recuperação, não triada; a idade declarada de 84 anos implica nascimento por
  volta de 1753, contra os 10 de novembro de 1757 da compilação — uma diferença de quatro anos
  deixada sem solução. [OPEN]

  - Se o sobrenome da família é sequer Moser ou Mayer — o conflito 1825 vs 1888 registrado em
  P-0051. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0059** — casamento de 1825, em Nova Friburgo, da filha Catharina com Jacob Bohrer.
  Nomeia "Jose Moser" e "Maria Veisse" como pais legítimos dela e declara o cantão (Soleure) e a
  freguesia de batismo ("Eggendorf" [Hägendorf — incerto]). É o único documento retido que o
  nomeia.

  ## Contexto regional e migratório

  Hägendorf fica no Cantão de Solothurn, no noroeste suíço de língua alemã e predominantemente
  católico, onde a agricultura foi, ao longo do século XIX, praticamente a única economia.
  [CONTEXTUAL] Os emigrantes de 1819 partiram pela rota usada pelo recrutamento friburguês —
  Estavayer-le-Lac em 4 de julho de 1819, depois Basileia e Roterdã rumo aos portos do Mar do
  Norte, e daí ao Rio numa frota que incluía o *Heureux Voyage*; o primeiro navio chegou ao Rio
  em 4 de novembro de 1819 e o povoado foi elevado a Vila de Nova Friburgo em 3 de janeiro de
  1820. Cerca de um quarto dos emigrantes morreu no percurso, de tifo e escorbuto, e os lotes
  serranos que receberam os sobreviventes eram pedregosos, pequenos e mal equipados, de modo que
  muitos os abandonaram em poucos anos. [CONTEXTUAL] Se José Moser esteve nessa rota é pista; o
  que o documento retido efetivamente situa em Nova Friburgo é a filha, ali casada em 1825.
  [PROVEN]

  ## Onde ir hoje

  - **Kath. Pfarrkirche St. Gervasius und Protasius, Hägendorf** — 4614 Hägendorf, Kt.
  Solothurn, Suíça · [Mapa](https://maps.google.com/?q=47.3347,7.8445). A freguesia lida no
  assento de 1825; seus registros católicos (catálogo FamilySearch 544541, de acesso livre
  online) são onde estariam um batismo, um casamento e a filiação Moser. [RESOLVED como lugar; a
  busca em si está OPEN]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em 1825. A catedral atual foi inaugurada em 1869; o ato foi celebrado na igreja
  paroquial anterior, no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). A antiga
  Fazenda do Morro Queimado, onde foram demarcados os números de casa e lote da colônia. Se a
  pista do Lote 67 se sustentar, é este o terreno; nenhuma casa de colono sobrevive como
  endereço. [APPROX]
