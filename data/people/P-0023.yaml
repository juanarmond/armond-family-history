profile: >-
  ## Interesting facts

  - **[PROVEN]** He is recorded only as "portuguez" (Portuguese) in the single document that names him — his grandchildren's 1915 birth registration (CIV-0007). No Portuguese district, municipality, island or parish is stated. The surname "Guimarães" is a common northern-Portuguese toponym but cannot by itself establish an origin.

  - **[CONTEXTUAL]** Portuguese emigration to Brazil accelerated after 1850 with the expansion of the coffee economy and the end of the African slave trade (Lei Eusébio de Queirós — Lei nº 581 de 4 set 1850), which created demand for free immigrant labour. A Portuguese man arriving in the interior of São Paulo in the mid-to-late 19th century was typical of this labour migration wave; the subsequent Lei Áurea (nº 3.353, 13 maio 1888) extended that pull, turning the coffee frontier toward European labour and small tradesmen.

  - **[INFERRED]** He is the line's door back to Portugal, but the record closes immediately: origin must not be inferred from the surname alone. His parish remains the single highest-value open target for this branch — if found, it would extend the documented line back into the Old World.

  - **[CONTEXTUAL]** He died in Carangola, Minas Gerais (CIV-0007) — the Zona da Mata coffee frontier that drew immigrant-descended families in the late 19th century. He followed, or his son followed, the classic São Paulo coffee plateau → Minas Gerais interior frontier movement of the period.

  ## Identity

  **Vicente José de Carvalho Guimarães** [PROVEN] — the Portuguese immigrant ancestor of
  this line.

  - **Origin:** described only as "portuguez" (Portuguese) [PROVEN] (CIV-0007); no
  district, municipality, island or parish is stated. Leading prior = mainland / Minho
  (the surname "Guimarães" is a Minho toponymic; the AMAP São Paio hypothesis — see
  below — is plausible but unproven).

  - **Pre-Carangola base:** Villa do Rio Claro, SP — his son Francisco and daughter-in-law
  were "naturais da Villa do Rio Claro" (CIV-0007). [DOCUMENTED]

  - **Spouse:** Maria Tertuliana da Conceição (P-0024) [PROVEN as reported] (CIV-0007).
  Marriage ~1863–1878 at Igreja Matriz de São João Batista, Rio Claro, SP (access-gated
  remotely).

  - **Child (in our line):** Francisco José de Carvalho Guimarães (P-0021) — the only
  documented child. A 2026-09-12 sibling investigation found 0 PROVEN additional siblings
  (probable leads only: the 1897 militia / 1898 voter cluster of Carvalho-Guimarães names
  in Carangola). [PROVEN — Francisco; other siblings LEAD]

  - **Death:** at the city of Carangola (MG) [PROVEN as stated] (CIV-0007); date not
  recorded.

  - **Birth and parents:** not held. [OPEN]

  ## What we can extrapolate

  He is the family's door back to Portugal, but the record supports only "Portuguese." His
  origin must not be inferred from the surname "Guimarães" (a common northern-Portuguese
  toponym); the parish remains the single highest-value open target on this side. [OPEN]

  As the line's Portuguese immigrant, he is best read as a self-made emigrant, not a
  transplanted fortune. [INFERRED / CONTEXTUAL] An emigrant carries no inherited estate across
  the Atlantic; his capital is labour, skill and willingness to move, so his standing in
  Brazil was built after arrival — visible not in his own (undocumented) record but in his
  son's generation, if the Carangola Guarda Nacional officer cluster around Francisco (P-0021)
  holds ([LEAD]). Vicente is the low base of an upward immigrant arc.

  The two-step internal migration is opportunity-seeking, not flight. [INFERRED / CONTEXTUAL]
  Portugal (Minho land-hunger) → Rio Claro SP (booming Oeste Paulista coffee frontier, a
  heavy immigrant magnet) → Carangola MG (late-opening coffee frontier). Each step moves
  toward fresher opportunity — the immigrant-climb pattern, the pattern of a man accumulating
  a foothold that the next generation converted into local standing.

  A leading but unproven lead — tied to no held record — points to a same-named "Vicente José
  de Carvalho", mestre pedreiro (master stonemason), active at Guimarães (Minho) 1787–1808
  (3 notarial acts; sons José b. 4 Apr 1806, Domingos b. 20 Dec 1808 at São Paio), as a
  possible father, with our Vicente an unindexed later son who appended the toponym
  "Guimarães" on emigrating. This is date/place plausibility only, testable against his
  Brazilian marriage record; it must not be treated as an established origin. [LEAD]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of his grandchildren — names him as their
  Portuguese paternal grandfather, deceased at Carangola). He appears in no other held
  record. Note: CIV-0007's own FamilySearch ark/persona ID is unrecorded and the 1915
  registration is not re-findable on the current FS index; best-fit read [INFERRED] = a
  late birth registration of Maria Aurora (~1915), Carangola / São Francisco do Glória MG.

  ## Where to go today

  - **Marriage to Maria Tertuliana (~1863–1878):** Igreja Matriz de São João Batista, Rua 6,
  Centro, Rio Claro, SP — the single visitable site tied to him [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)

  - **Death:** Igreja Matriz de Santa Luzia, Carangola, MG [RESOLVED town] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)

  - **Birth parish (unconfirmed lead):** Guimarães (São Paio), Braga, Portugal [OPEN / APPROX-LEAD] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Guimar%C3%A3es%2C+Braga%2C+Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É registrado apenas como "portuguez" (português) no único documento que o nomeia — o registro de nascimento de 1915 de seus netos (CIV-0007). Não se indica distrito, município, ilha ou freguesia portuguesa. O sobrenome "Guimarães" é um topônimo comum do norte de Portugal, mas não pode por si só estabelecer uma origem.

  - **[CONTEXTUAL]** A emigração portuguesa para o Brasil se acelerou após 1850 com a expansão da economia cafeeira e o fim do tráfico africano de escravizados (Lei Eusébio de Queirós — Lei nº 581 de 4 set 1850), que criou demanda por mão de obra imigrante livre. A posterior Lei Áurea (nº 3.353, 13 maio 1888) ampliou essa atração, voltando a fronteira cafeeira para a mão de obra europeia e os pequenos negociantes.

  - **[INFERRED]** Ele é a porta da linha de volta a Portugal, mas o registro se fecha imediatamente: a origem não deve ser inferida apenas do sobrenome. Sua freguesia continua sendo o alvo em aberto de maior valor para este ramo — se encontrada, estenderia a linha documentada de volta ao Velho Mundo.

  - **[CONTEXTUAL]** Faleceu em Carangola, Minas Gerais (CIV-0007) — a fronteira cafeeira da Zona da Mata que atraía famílias de descendência imigrante no final do século XIX. Ele ou seu filho seguiu o clássico movimento de fronteira do plateau cafeeiro paulista → interior mineiro do período.

  ## Identidade

  **Vicente José de Carvalho Guimarães** [PROVEN] — o ancestral imigrante português desta
  linhagem.

  - **Origem:** descrito apenas como "portuguez" (português) [PROVEN] (CIV-0007); não se
  indica distrito, município, ilha ou freguesia. Prior principal = continente / Minho (o
  sobrenome "Guimarães" é um topônimo do Minho; a hipótese AMAP São Paio — ver abaixo —
  é plausível mas não comprovada).

  - **Base antes de Carangola:** Villa do Rio Claro, SP — seu filho Francisco e nora eram
  "naturais da Villa do Rio Claro" (CIV-0007). [DOCUMENTADO]

  - **Cônjuge:** Maria Tertuliana da Conceição (P-0024) [PROVEN conforme declarado]
  (CIV-0007). Casamento ~1863–1878 na Igreja Matriz de São João Batista, Rio Claro, SP
  (acesso remoto bloqueado).

  - **Filho (em nossa linha):** Francisco José de Carvalho Guimarães (P-0021) — o único
  filho documentado. Uma investigação de irmãos em 2026-09-12 encontrou 0 irmãos
  PROVEN (apenas pistas prováveis: o grupo de nomes Carvalho-Guimarães na milícia de 1897
  e nos eleitores de 1898 em Carangola). [PROVEN — Francisco; outros irmãos LEAD]

  - **Óbito:** na cidade de Carangola (MG) [PROVEN conforme declarado] (CIV-0007); data
  não registrada.

  - **Nascimento e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ele é a porta da família de volta a Portugal, mas o registro sustenta apenas
  "português." Sua origem não deve ser inferida do sobrenome "Guimarães" (um topônimo
  comum do norte de Portugal); a freguesia permanece o alvo em aberto de maior valor deste
  lado. [OPEN]

  Como o imigrante português da linhagem, ele é mais bem lido como um emigrante
  autoconstruído, não uma fortuna transplantada. [INFERRED / CONTEXTUAL] Um emigrante não leva
  patrimônio herdado através do Atlântico; seu capital é trabalho, ofício e disposição de se
  mover, de modo que sua posição no Brasil foi construída após a chegada — visível não em seu
  próprio registro (inexistente), mas na geração de seu filho, caso o grupo de oficiais da
  Guarda Nacional de Carangola em torno de Francisco (P-0021) se confirme ([LEAD]). Vicente é
  a base baixa de um arco imigrante ascendente.

  A migração interna em dois passos é busca de oportunidade, não fuga. [INFERRED /
  CONTEXTUAL] Portugal (fome de terra no Minho) → Rio Claro SP (próspera fronteira cafeeira do
  Oeste Paulista, grande ímã de imigrantes) → Carangola MG (fronteira cafeeira de abertura
  tardia). Cada passo em direção a uma oportunidade mais nova — o padrão do imigrante que
  acumula um ponto de apoio que a geração seguinte converteu em posição local.

  Uma pista destacada, porém não comprovada — atada a nenhum registro disponível — aponta um
  homônimo "Vicente José de Carvalho", mestre pedreiro, ativo em Guimarães (Minho) 1787–1808
  (3 atos notariais; filhos José n. 4 abr 1806, Domingos n. 20 dez 1808 em São Paio), como
  possível pai, sendo nosso Vicente um filho posterior não indexado que teria acrescentado o
  topônimo "Guimarães" ao emigrar. Trata-se apenas de plausibilidade de data/local, testável
  contra seu registro de casamento no Brasil; não deve ser tratada como origem estabelecida.
  [LEAD]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus netos — o nomeia como o avô
  paterno português, falecido em Carangola). Não aparece em nenhum outro registro obtido.
  Nota: o próprio ark/ID-persona do FamilySearch de CIV-0007 não está registado no
  repositório e o registro de 1915 não é re-localizável no índice atual do FS; leitura de
  melhor encaixe [INFERRED] = um registro tardio de nascimento de Maria Aurora (~1915),
  Carangola / São Francisco do Glória MG.

