profile: >-
  ## Identity

  **Vicente José de Carvalho Guimarães** [PROVEN] — the Portuguese immigrant ancestor of
  this line.

  - **Origin:** described only as "portuguez" (Portuguese) [PROVEN] (CIV-0007); no
  district, municipality, island or parish is stated.

  - **Spouse:** Maria Tertuliana da Conceição (P-0024) [PROVEN as reported] (CIV-0007).

  - **Child (in our line):** Francisco José de Carvalho Guimarães (P-0021). [PROVEN]

  - **Death:** at the city of Carangola (MG) [PROVEN as stated] (CIV-0007); date not
  recorded.

  - **Birth and parents:** not held. [OPEN]

  ## What we can extrapolate

  He is the family's door back to Portugal, but the record supports only "Portuguese." His
  origin must not be inferred from the surname "Guimarães" (a common northern-Portuguese
  toponym); the parish remains the single highest-value open target on this side. [OPEN]

  As the line's Portuguese immigrant, he is best read as a self-made emigrant, not a
  transplanted fortune. [INFERRED / CONTEXTUAL] An emigrant carries no inherited estate across
  the Atlantic; his capital is labour, skill and willingness to move, so his standing in
  Brazil was built after arrival — visible not in his own (undocumented) record but in his
  son's generation, if the Carangola Guarda Nacional officer cluster around Francisco (P-0021)
  holds ([LEAD]). Vicente is the low base of an upward immigrant arc, and the family's later
  internal move onto the Carangola coffee frontier reads as opportunity-seeking rather than
  flight — each step toward fresher frontier, the pattern of a man accumulating a foothold
  that the next generation converted into local standing. [INFERRED / CONTEXTUAL]

  A leading but unproven lead — tied to no held record — points to a same-named "Vicente José
  de Carvalho", mestre pedreiro (master stonemason), active at Guimarães (Minho) 1787–1808, as
  a possible father, with our Vicente an unindexed later son who appended the toponym
  "Guimarães" on emigrating. This is date/place plausibility only, testable against his
  Brazilian marriage record; it must not be treated as an established origin. [LEAD]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of his grandchildren — names him as their
  Portuguese paternal grandfather, deceased at Carangola). He appears in no other held
  record.
profile_pt: >-
  ## Identidade

  **Vicente José de Carvalho Guimarães** [PROVEN] — o ancestral imigrante português desta
  linhagem.

  - **Origem:** descrito apenas como "portuguez" (português) [PROVEN] (CIV-0007); não se
  indica distrito, município, ilha ou freguesia.

  - **Cônjuge:** Maria Tertuliana da Conceição (P-0024) [PROVEN conforme declarado]
  (CIV-0007).

  - **Filho (em nossa linha):** Francisco José de Carvalho Guimarães (P-0021). [PROVEN]

  - **Óbito:** na cidade de Carangola (MG) [PROVEN conforme declarado] (CIV-0007); data
  não registrada.

  - **Nascimento e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ele é a porta da família de volta a Portugal, mas o registro sustenta apenas
  "português." Sua origem não deve ser inferida do sobrenome "Guimarães" (um topônimo
  comum do norte de Portugal); a freguesia permanece o alvo em aberto de maior valor deste
  lado. [OPEN]

  Como o imigrante português da linhagem, ele é mais bem lido como um emigrante
  autoconstruído, não uma fortuna transplantada. [INFERRED / CONTEXTUAL] Um emigrante não leva
  patrimônio herdado através do Atlântico; seu capital é trabalho, ofício e disposição de se
  mover, de modo que sua posição no Brasil foi construída após a chegada — visível não em seu
  próprio registro (inexistente), mas na geração de seu filho, caso o grupo de oficiais da
  Guarda Nacional de Carangola em torno de Francisco (P-0021) se confirme ([LEAD]). Vicente é a
  base baixa de um arco imigrante ascendente, e a posterior mudança interna da família rumo à
  fronteira cafeeira de Carangola lê-se como busca de oportunidade, e não fuga — cada passo em
  direção a uma fronteira mais nova, o padrão de um homem acumulando um ponto de apoio que a
  geração seguinte converteu em posição local. [INFERRED / CONTEXTUAL]

  Uma pista destacada, porém não comprovada — atada a nenhum registro disponível — aponta um
  homônimo "Vicente José de Carvalho", mestre pedreiro, ativo em Guimarães (Minho) 1787–1808,
  como possível pai, sendo nosso Vicente um filho posterior não indexado que teria acrescentado
  o topônimo "Guimarães" ao emigrar. Trata-se apenas de plausibilidade de data/local, testável
  contra seu registro de casamento no Brasil; não deve ser tratada como origem estabelecida.
  [LEAD]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus netos — o nomeia como o avô
  paterno português, falecido em Carangola). Não aparece em nenhum outro registro obtido.
