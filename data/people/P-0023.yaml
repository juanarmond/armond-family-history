profile: >-
  ## Interesting facts

  - **[PROVEN]** He is recorded only as "portuguez" (Portuguese) in the single document that names him — his grandchildren's 1915 birth registration (CIV-0007). No Portuguese district, municipality, island or parish is stated. The surname "Guimarães" is a common northern-Portuguese toponym but cannot by itself establish an origin.

  - **[CONTEXTUAL]** Portuguese emigration to Brazil accelerated after 1850 with the expansion of the coffee economy and the end of the African slave trade (Lei Eusébio de Queirós — Lei nº 581 de 4 set 1850), which created demand for free immigrant labour. A Portuguese man arriving in the interior of São Paulo in the mid-to-late 19th century was typical of this labour migration wave; the subsequent Lei Áurea (nº 3.353, 13 maio 1888) extended that pull, turning the coffee frontier toward European labour and small tradesmen.

  - **[INFERRED]** He is the line's door back to Portugal, but the record closes immediately: origin must not be inferred from the surname alone. His parish remains the single highest-value open target for this branch — if found, it would extend the documented line back into the Old World.

  - **[CONTEXTUAL]** He died in Carangola, Minas Gerais (CIV-0007) — the Zona da Mata coffee frontier that drew immigrant-descended families in the late 19th century. If the "Villa do Rio Claro" of the record is the São Paulo town (see below), he or his son followed the classic São Paulo coffee plateau → Minas Gerais interior frontier movement of the period.

  ## Identity

  **Vicente José de Carvalho Guimarães** [PROVEN] — the Portuguese immigrant ancestor of
  this line.

  - **Origin:** described only as "portuguez" (Portuguese) [PROVEN] (CIV-0007); no
  district, municipality, island or parish is stated. No regional prior is adopted: the
  surname "Guimarães" must not be converted into an origin, and the AMAP São Paio hypothesis
  — see below — was retired in September 2026. [OPEN]

  - **Pre-Carangola base:** "Villa do Rio Claro" — his son Francisco and his wife Maria
  Tertuliana are each recorded as "natural da Villa do Rio Claro" (CIV-0007) [PROVEN as
  stated], so the couple was most probably living there when Francisco was born [INFERRED].
  The record does not name the state; whether this is Rio Claro, São Paulo, or the Vila do
  Rio Claro of Rio de Janeiro is unresolved (see below).

  - **Spouse:** Maria Tertuliana da Conceição (P-0024), also a native of the "Villa do Rio
  Claro" and, like him, deceased at the city of Carangola by 1915 [PROVEN as reported]
  (CIV-0007). The marriage itself has not been located; the working target is the Matriz de
  São João Batista at Rio Claro, SP, c.1863–1878, whose registers are microfilmed at
  FamilySearch but access-restricted online [LEAD — place and date window are research
  estimates].

  - **Child (in our line):** Francisco José de Carvalho Guimarães (P-0021) — the only
  documented child. A 2026-09-12 sibling investigation found 0 PROVEN additional siblings
  (probable leads only: the 1897 militia / 1898 voter cluster of Carvalho-Guimarães names
  in Carangola — the 1898 electoral act held here, GOV-0008, names a Ramiro José and an
  Alaerino José de Carvalho Guimarães at São Francisco da Glória, relationship unverified).
  [PROVEN — Francisco; other siblings LEAD]

  - **Death:** at the city of Carangola (MG), before the 12 October 1915 registration that
  calls him "fallecido" [PROVEN as stated] (CIV-0007); date not recorded.

  - **Birth and parents:** not held. [OPEN]

  ## What we can extrapolate

  He is the family's door back to Portugal, but the record supports only "Portuguese." His
  origin must not be inferred from the surname "Guimarães" (a common northern-Portuguese
  toponym); the parish remains the single highest-value open target on this side. [OPEN]

  As the line's Portuguese immigrant, he is best read as a self-made emigrant, not a
  transplanted fortune. [INFERRED / CONTEXTUAL] An emigrant carries no inherited estate across
  the Atlantic; his capital is labour, skill and willingness to move, so his standing in
  Brazil was built after arrival — visible not in his own (undocumented) record but in his
  son's generation, if the Carangola Guarda Nacional officer cluster around Francisco (P-0021)
  holds ([LEAD]). Vicente is the low base of an upward immigrant arc.

  The two-step internal migration is opportunity-seeking, not flight. [INFERRED / CONTEXTUAL]
  Portugal (district unknown) → Rio Claro (on this profile's São Paulo reading, the booming
  Oeste Paulista coffee frontier, a heavy immigrant magnet) → Carangola MG (late-opening coffee frontier). Each step moves
  toward fresher opportunity — the immigrant-climb pattern, the pattern of a man accumulating
  a foothold that the next generation converted into local standing.

  One caution about that route: the intermediate stop is not firmly located. [OPEN] CIV-0007
  says only "Villa do Rio Claro". This profile's research trail reads it as Rio Claro, São
  Paulo — an Oeste Paulista coffee town and a heavy immigrant magnet — but this repository's
  own structured place entry for it (PL-0008) records Vila do Rio Claro in the state of Rio
  de Janeiro. The two have not been reconciled, and the difference changes the story: a São
  Paulo stop makes him part of the great immigrant inflow to the paulista coffee plateau,
  while a Rio de Janeiro one makes the later move to Carangola a short hop inside the
  Paraíba/Zona da Mata complex. Until his marriage record is retrieved, treat the
  intermediate location as unsettled.

  He died in the town, not on the land. [PROVEN — the place; INFERRED — the reading]
  CIV-0007 places his death, and his wife's, in "a cidade do Carangola", while his son
  Francisco was farming out in the São Francisco do Glória district. An immigrant who ends
  in the municipal seat rather than on a rural property is consistent with a trade, a small
  commerce, or simply old age in town — and it is not what one expects of a man holding and
  working a fazenda. But the record states no occupation and no property for him at all, so
  this reads where he died, not what he did. [OPEN]

  Whatever he might have inherited stayed in Portugal. [CONTEXTUAL] Emigration is in
  practice a renunciation of an inheritance share: a son who leaves is rarely in place to
  claim a Portuguese *partilha*, and nothing crossed the Atlantic with him that the Brazilian
  record can see. The line therefore begins at zero capital in Brazil. That is precisely why
  everything this branch later had was built after arrival — and why it had so little depth
  to lose when the coffee economy turned two generations on.

  On his literacy nothing is recorded. [OPEN] He appears in no act he could have signed. The
  only literacy datum in this generation of the family belongs to the other side of the
  eventual marriage — Antonio Engracio de Souza (P-0032), a qualified voter in 1898 and a
  signing witness in 1917 as reported [LEAD] — and cannot be transferred to him.

  A former lead — tied to no held record — pointed to a same-named "Vicente José de
  Carvalho", mestre pedreiro (master stonemason), active at Guimarães (Minho) 1787–1808, as
  a possible father, with our Vicente an unindexed later son who appended the toponym
  "Guimarães" on emigrating. It is **retired**. On 2026-09-25 the Guimarães municipal archive
  (AMAP) reported that it had searched and found no son of Vicente José de Carvalho and Maria
  Rosa at São Paio beyond José (b. 4 Apr 1806) and Domingos (b. 21 Dec 1808; the index gives
  20 Dec). That is a strong bounded negative, not a disproof: a son could have been baptised
  in another freguesia, and the archive's method and year range are unconfirmed. The two
  baptisms, read by the retrieval agent from the archive's images (not yet held here), name
  the parents but give no trade or origin, so even the stonemason link rests on an index
  only. [LEAD — retired]

  ## Open questions

  - His Portuguese parish and parents. The bridge record is his Brazilian marriage to Maria
  Tertuliana (or its habilitação), which should state his naturalidade and parents; if it
  was not at Rio Claro, the Santa Luzia do Carangola marriages (1898–1924) and, before 1898,
  the mother parish of Tombos are the fallbacks. Do not convert "portuguez" into a specific
  origin before a record names one, and do not re-run the São Paio search. [OPEN]

  - His death. The Carangola civil death books before 12 October 1915 may hold his óbito,
  which in Minas Gerais typically states naturalidade, parents and surviving spouse. [OPEN]

  - Which "Villa do Rio Claro". CIV-0007 names no state; this repository's place entry
  (PL-0008) records the Rio de Janeiro vila, while the research trail reads São Paulo.
  [OPEN]

  - Name-searchable immigration sources — the CEPESE passport database and the Arquivo
  Nacional "Entrada de Estrangeiros" (Rio de Janeiro, 1875–1910) — can be searched without
  knowing a locality and might themselves reveal his origin. An 1866 power of attorney at
  "Vila do Rio Claro" naming a Vicente José de Carvalho Guimarães has not been tied to him;
  it most plausibly refers to the Rio de Janeiro vila. [LEAD]

  ## Sources held (this repository)

  - CIV-0007 (1915 collective birth registration of his grandchildren — names him as their
  Portuguese paternal grandfather, deceased at Carangola). He appears in no other held
  record. CIV-0007 is a 2025 full-content certificate of the 12 October 1915 collective
  registration of six siblings (São Francisco do Glória, book 4-A, fl. 23, nº 38), obtained
  through a FamilySearch Family Tree source attachment. The retrieval research reports that
  it cannot re-find the 1915 entry on the FamilySearch index and treats the record as
  unrecoverable, but this repository holds the certificate, and Sebastião's 1982 death
  (CIV-0050) cites the same book and folio.

  ## Where to go today

  - **Marriage to Maria Tertuliana (~1863–1878, not yet located):** Igreja Matriz de São
  João Batista, Rua 6, Centro, Rio Claro, SP — the working target, if the record's "Villa do
  Rio Claro" is the São Paulo town [LEAD] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)

  - **Death:** Igreja Matriz de Santa Luzia, Carangola, MG [RESOLVED town] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)

  - **Birth parish:** unknown [OPEN]. The former Guimarães (São Paio) lead was retired on
  2026-09-25 (see above).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É registrado apenas como "portuguez" (português) no único documento que o nomeia — o registro de nascimento de 1915 de seus netos (CIV-0007). Não se indica distrito, município, ilha ou freguesia portuguesa. O sobrenome "Guimarães" é um topônimo comum do norte de Portugal, mas não pode por si só estabelecer uma origem.

  - **[CONTEXTUAL]** A emigração portuguesa para o Brasil se acelerou após 1850 com a expansão da economia cafeeira e o fim do tráfico africano de escravizados (Lei Eusébio de Queirós — Lei nº 581 de 4 set 1850), que criou demanda por mão de obra imigrante livre. A posterior Lei Áurea (nº 3.353, 13 maio 1888) ampliou essa atração, voltando a fronteira cafeeira para a mão de obra europeia e os pequenos negociantes.

  - **[INFERRED]** Ele é a porta da linha de volta a Portugal, mas o registro se fecha imediatamente: a origem não deve ser inferida apenas do sobrenome. Sua freguesia continua sendo o alvo em aberto de maior valor para este ramo — se encontrada, estenderia a linha documentada de volta ao Velho Mundo.

  - **[CONTEXTUAL]** Faleceu em Carangola, Minas Gerais (CIV-0007) — a fronteira cafeeira da Zona da Mata que atraía famílias de descendência imigrante no final do século XIX. Se a "Villa do Rio Claro" do registro for a cidade paulista (ver abaixo), ele ou seu filho seguiu o clássico movimento de fronteira do planalto cafeeiro paulista → interior mineiro do período.

  ## Identidade

  **Vicente José de Carvalho Guimarães** [PROVEN] — o ancestral imigrante português desta
  linhagem.

  - **Origem:** descrito apenas como "portuguez" (português) [PROVEN] (CIV-0007); não se
  indica distrito, município, ilha ou freguesia. Nenhuma hipótese regional é adotada: o
  sobrenome "Guimarães" não deve ser convertido em origem, e a hipótese AMAP São Paio — ver
  abaixo — foi abandonada em setembro de 2026. [OPEN]

  - **Base antes de Carangola:** "Villa do Rio Claro" — seu filho Francisco e sua esposa
  Maria Tertuliana são registrados cada um como "natural da Villa do Rio Claro" (CIV-0007)
  [PROVEN conforme declarado], de modo que o casal muito provavelmente vivia ali quando
  Francisco nasceu [INFERRED]. O registro não indica o estado; se se trata de Rio Claro, São
  Paulo, ou da Vila do Rio Claro fluminense, segue sem solução (ver abaixo).

  - **Cônjuge:** Maria Tertuliana da Conceição (P-0024), também natural da "Villa do Rio
  Claro" e, como ele, falecida na cidade do Carangola antes de 1915 [PROVEN conforme
  declarado] (CIV-0007). O casamento em si não foi localizado; o alvo de trabalho é a Matriz
  de São João Batista de Rio Claro, SP, c.1863–1878, cujos livros estão microfilmados no
  FamilySearch mas com acesso restrito online [LEAD — lugar e janela de datas são estimativas
  da pesquisa].

  - **Filho (em nossa linha):** Francisco José de Carvalho Guimarães (P-0021) — o único
  filho documentado. Uma investigação de irmãos em 2026-09-12 encontrou 0 irmãos
  PROVEN (apenas pistas prováveis: o grupo de nomes Carvalho-Guimarães na milícia de 1897
  e nos eleitores de 1898 em Carangola — a ata eleitoral de 1898 mantida aqui, GOV-0008,
  nomeia um Ramiro José e um Alaerino José de Carvalho Guimarães em São Francisco da Glória,
  relação não verificada). [PROVEN — Francisco; outros irmãos LEAD]

  - **Óbito:** na cidade do Carangola (MG), antes do registro de 12 de outubro de 1915, que
  o diz "fallecido" [PROVEN conforme declarado] (CIV-0007); data não registrada.

  - **Nascimento e pais:** não obtidos. [OPEN]

  ## O que podemos extrapolar

  Ele é a porta da família de volta a Portugal, mas o registro sustenta apenas
  "português." Sua origem não deve ser inferida do sobrenome "Guimarães" (um topônimo
  comum do norte de Portugal); a freguesia permanece o alvo em aberto de maior valor deste
  lado. [OPEN]

  Como o imigrante português da linhagem, ele é mais bem lido como um emigrante
  autoconstruído, não uma fortuna transplantada. [INFERRED / CONTEXTUAL] Um emigrante não leva
  patrimônio herdado através do Atlântico; seu capital é trabalho, ofício e disposição de se
  mover, de modo que sua posição no Brasil foi construída após a chegada — visível não em seu
  próprio registro (inexistente), mas na geração de seu filho, caso o grupo de oficiais da
  Guarda Nacional de Carangola em torno de Francisco (P-0021) se confirme ([LEAD]). Vicente é
  a base baixa de um arco imigrante ascendente.

  A migração interna em dois passos é busca de oportunidade, não fuga. [INFERRED /
  CONTEXTUAL] Portugal (distrito desconhecido) → Rio Claro (na leitura paulista deste perfil,
  próspera fronteira cafeeira do Oeste Paulista, grande ímã de imigrantes) → Carangola MG (fronteira cafeeira de abertura
  tardia). Cada passo em direção a uma oportunidade mais nova — o padrão do imigrante que
  acumula um ponto de apoio que a geração seguinte converteu em posição local.

  Uma ressalva sobre esse percurso: a parada intermediária não está firmemente localizada.
  [OPEN] CIV-0007 diz apenas "Villa do Rio Claro". A trilha de pesquisa deste perfil a lê
  como Rio Claro, São Paulo — cidade cafeeira do Oeste Paulista e grande ímã de imigrantes —,
  mas a própria entrada estruturada de lugar deste repositório (PL-0008) registra a Vila do
  Rio Claro no estado do Rio de Janeiro. As duas não foram reconciliadas, e a diferença muda
  a história: uma parada paulista o insere no grande fluxo imigrante para o planalto cafeeiro
  paulista, ao passo que uma fluminense torna a mudança posterior para Carangola um salto
  curto dentro do complexo Paraíba/Zona da Mata. Até que seu registro de casamento seja
  obtido, trate a localização intermediária como não resolvida.

  Ele morreu na vila, não na lavoura. [PROVEN — o lugar; INFERRED — a leitura] CIV-0007 situa
  seu óbito, e o da esposa, "na cidade do Carangola", enquanto seu filho Francisco lavrava
  fora, no distrito de São Francisco do Glória. Um imigrante que termina na sede do município
  e não numa propriedade rural é compatível com um ofício, um pequeno comércio ou
  simplesmente a velhice na vila — e não é o que se espera de um homem que detém e trabalha
  uma fazenda. Mas o registro não declara ocupação nem bens para ele, de modo que isto lê
  onde morreu, não o que fez. [OPEN]

  O que quer que pudesse herdar ficou em Portugal. [CONTEXTUAL] Emigrar é, na prática, uma
  renúncia à quota hereditária: um filho que parte raramente está presente para reclamar uma
  *partilha* portuguesa, e nada atravessou o Atlântico com ele que o registro brasileiro
  possa ver. A linha começa, portanto, com capital zero no Brasil. É exatamente por isso que
  tudo o que este ramo veio a ter foi construído após a chegada — e por que tinha tão pouca
  profundidade a perder quando a economia cafeeira virou, duas gerações depois.

  Sobre sua alfabetização nada está registrado. [OPEN] Ele não aparece em nenhum ato que
  pudesse ter assinado. O único dado de alfabetização nesta geração da família pertence ao
  outro lado do casamento futuro — Antonio Engracio de Souza (P-0032), eleitor habilitado em
  1898 e, segundo se informa, testemunha signatária em 1917 [LEAD] — e não pode ser transferido para ele.

  Uma antiga pista — atada a nenhum registro disponível — apontava um homônimo "Vicente José
  de Carvalho", mestre pedreiro, ativo em Guimarães (Minho) 1787–1808, como possível pai,
  sendo nosso Vicente um filho posterior não indexado que teria acrescentado o topônimo
  "Guimarães" ao emigrar. Está **abandonada**. Em 2026-09-25 o arquivo municipal de
  Guimarães (AMAP) informou ter pesquisado e não ter encontrado, em São Paio, nenhum filho de
  Vicente José de Carvalho e Maria Rosa além de José (n. 4 abr 1806) e Domingos (n. 21 dez
  1808; o índice dá 20 dez). É um forte negativo delimitado, não uma refutação: um filho pode
  ter sido batizado noutra freguesia, e o método e o intervalo de anos do arquivo não estão
  confirmados. Os dois batismos, lidos pelo agente de recuperação nas imagens do arquivo
  (ainda não guardadas aqui), nomeiam os pais mas não dão ofício nem origem, de modo que até
  o vínculo com o mestre pedreiro assenta apenas num índice. [LEAD — abandonada]

  ## Questões em aberto

  - Sua freguesia portuguesa e seus pais. O registro-ponte é seu casamento brasileiro com
  Maria Tertuliana (ou a habilitação), que deve declarar sua naturalidade e seus pais; se
  não foi em Rio Claro, os casamentos de Santa Luzia do Carangola (1898–1924) e, antes de
  1898, a freguesia-mãe de Tombos são as alternativas. Não converter "portuguez" em uma
  origem específica antes que um registro a nomeie, e não repetir a busca em São Paio.
  [OPEN]

  - Seu óbito. Os livros de óbitos civis de Carangola anteriores a 12 de outubro de 1915
  podem conter seu assento, que em Minas Gerais costuma declarar naturalidade, pais e
  cônjuge sobrevivente. [OPEN]

  - Qual "Villa do Rio Claro". CIV-0007 não indica o estado; a entrada de lugar deste
  repositório (PL-0008) registra a vila fluminense, enquanto a trilha de pesquisa lê São
  Paulo. [OPEN]

  - Fontes de imigração pesquisáveis por nome — a base de passaportes do CEPESE e a "Entrada
  de Estrangeiros" do Arquivo Nacional (Rio de Janeiro, 1875–1910) — podem ser consultadas
  sem conhecer a localidade e poderiam, elas próprias, revelar sua origem. Uma procuração de
  1866 na "Vila do Rio Claro" que nomeia um Vicente José de Carvalho Guimarães não foi ligada
  a ele; muito provavelmente refere-se à vila fluminense. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - CIV-0007 (registro coletivo de nascimento de 1915 de seus netos — o nomeia como o avô
  paterno português, falecido em Carangola). Não aparece em nenhum outro registro obtido.
  CIV-0007 é uma certidão de inteiro teor, de 2025, do registro coletivo de seis irmãos de
  12 de outubro de 1915 (São Francisco do Glória, livro 4-A, fl. 23, nº 38), obtida por meio
  de uma fonte anexada à árvore do FamilySearch. A pesquisa de recuperação informa não
  conseguir re-localizar o assento de 1915 no índice do FamilySearch e o trata como
  irrecuperável, mas este repositório detém a certidão, e o óbito de 1982 de Sebastião
  (CIV-0050) cita o mesmo livro e folha.

  ## Onde ir hoje

  - **Casamento com Maria Tertuliana (~1863–1878, ainda não localizado):** Igreja Matriz de
  São João Batista, Rua 6, Centro, Rio Claro, SP — o alvo de trabalho, se a "Villa do Rio
  Claro" do registro for a cidade paulista [LEAD] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+S%C3%A3o+Jo%C3%A3o+Batista%2C+Rua+6%2C+Centro%2C+Rio+Claro%2C+SP)

  - **Óbito:** Igreja Matriz de Santa Luzia, Carangola, MG [RESOLVED town] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)

  - **Freguesia de nascimento:** desconhecida [OPEN]. A antiga pista de Guimarães (São Paio)
  foi abandonada em 2026-09-25 (ver acima).
