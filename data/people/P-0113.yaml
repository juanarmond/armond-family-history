profile: >-
  ## Identity

  **Heinrich Schenkel** — father of Conrad Schenkel (P-0107), known from a single mention in
  Conrad's 1847 Lutheran marriage at Nova Friburgo. [PROVEN]

  - **Role:** father of Conrad Schenkel (P-0107; family F-0056, father-only node); Iris Bohrer
  Muniz's 3×-great-grandfather on the Schenkel line. [PROVEN]

  - **Named in one record:** Conrad's 1847 Lutheran marriage (PAR-0067) identifies Conrad as
  "ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — i.e. Heinrich held
  the office of *Kirchenvorsteher* (Lutheran church warden/elder). The descriptor, earlier hedged
  as "[Bürger?]", was resolved on a max-zoom re-read of the register image (2026-09-11): a long
  compound clearly ending in "-vorsteher". [PROVEN — PAR-0067]

  ## Open questions

  - His wife, origin, nationality, birth, and death are not documented; no record beyond
  this single mention is held. [OPEN]

