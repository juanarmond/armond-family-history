profile: >-
  ## Interesting facts

  - **[PROVEN]** He is the only person in this whole Swiss-German collateral group whom a held
  record credits with an office. His son Conrad's 1847 Lutheran marriage at Nova Friburgo names
  him "dem **Kirchenvorsteher** Heinrich Schenkel" — the church warden Heinrich Schenkel.
  Everyone else here is a name, a parent, or at most a "colonist". (PAR-0067)

  - **[PROVEN]** The reading was earned. The word was carried for a time as a hedged
  "[Bürger?]", and was resolved on a maximum-zoom re-read of the register image in September
  2026: it is a long compound ending unmistakably in "-vorsteher", far too long for "Bürger".
  The profile records the correction rather than quietly adopting it.

  - **[LEAD]** Research material identifies him as Johann Heinrich Schenkel, born 8 February
  1789 at Ottzweiler in Hessen, married to Maria Elisabeth Klein at Becherbach on 31 May 1812,
  head of the Schenkel household on the ship *Argus* that reached Rio on 7 January 1824, granted
  House 59 / Lot 53 in the colony, and dead at Nova Friburgo on 31 August 1862. A daughter is
  said to have died aboard the *Argus* and his son Georg Conrad to have been born at the coastal
  landing. None of it is confirmed by a document held here.

  - **[CAUTION]** A separate figure of the same name circulates in the secondary material: a
  blog-only "Heinrich Schenkel", husband of an Anna Margaretha Klein, given as the *father* of
  Johann Heinrich. That man is a generation above this one and must not be merged with him.

  ## Identity

  **Heinrich Schenkel** — father of Conrad Schenkel (P-0107), named once, in his son's 1847
  Lutheran marriage act at Nova Friburgo. Iris Bohrer Muniz's (P-0007) 3×-great-grandfather, by
  the chain Conrad → Maria Luiza Schenkel (P-0104) → Carolina Klein (P-0029) → João Gonçalves
  Bohrer (P-0014). [PROVEN that he is named; degree derived from the family links]

  - **Named in one record:** "Conrad Schenkel, ehel[icher] leibl[icher] Sohn von dem
  Kirchenvorsteher Heinrich Schenkel" (PAR-0067, 3 February 1847). He is modelled as a
  father-only node, family F-0056. [PROVEN]

  - **Office:** *Kirchenvorsteher* of the Nova Friburgo Lutheran congregation as at February
  1847. [PROVEN]

  - **Wife, birth, death, origin, nationality:** none documented by a held record. Nationality
  is deliberately left unset for that reason. [OPEN by decision]

  - **Reported life [LEAD]:** Johann Heinrich Schenkel, b. 8 February 1789 Ottzweiler (Hessen);
  ⚭ Maria Elisabeth Klein, Becherbach, 31 May 1812; *Argus* 1824, House 59 / Lot 53; d. 31
  August 1862, Nova Friburgo. Raibert Schenkel material; no held primary.

  ## Standing and profession

  A *Kirchenvorsteher* is a lay church warden or elder — a congregation member elected or
  appointed to administer the church's finances, property and community affairs. It is real
  local authority and, characteristically, it carries no salary and no heritable asset. That is
  the whole of his documented standing: a position of trust in a small immigrant congregation,
  held in 1847, with nothing recorded about his trade, his land or his literacy.

  ## Family and social network

  The 1847 act is his only appearance, and it shows his son marrying the daughter of a Swiss
  colonist before two merchant witnesses and the congregation's pastor. [PROVEN — PAR-0067]
  Nothing else about his household is held: no wife is named in any record here, and no other
  child is attested. Whether he had the large family the secondary material describes is
  untested.

  ## What we can extrapolate

  - **[CONTEXTUAL]** A church wardenship in 1847 implies an established presence. The Lutheran
  congregation at Nova Friburgo was founded by the German families who arrived on 3–4 May 1824
  under the agent Georg Anton Schäffer; a man trusted with its administration in 1847 had most
  likely been part of it for years, which is consistent with — though not proof of — the 1824
  arrival the leads describe.

  - **[CONTEXTUAL / INFERRED]** His office is exactly the kind of status that dies with the man.
  It produced respect, not income, and nothing in this line suggests it converted into land or
  education for the next generation: his son Conrad has no recorded occupation, his
  granddaughter married a Klein inside the same congregation, and her daughter married out into
  a farming family. Standing without a wage underneath it does not transmit.

  - **[CONTEXTUAL]** The German intake left the Rhineland and Hessen for the same reasons the
  Swiss had left the Jura five years earlier — post-Napoleonic impoverishment, harvest failure
  and land too fragmented for the next generation — and received the same poor serra lots. The
  Schenkels' arrival on that scheme is a lead; the conditions that produced it are not in doubt.

  ## Open questions

  - His own birth, marriage, death and origin — nothing held. The Ottzweiler parish register (an
  1789 baptism) and the Becherbach marriage register (1812) would test the whole identification
  at primary level. [OPEN]

  - Whether he is the Johann Heinrich Schenkel of the *Argus* 1824 passenger transcription,
  granted House 59 / Lot 53. [LEAD]

  - His wife, unnamed in any held record. [OPEN]

  - His nationality, left unset on purpose because no held record states where he was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0067** — his son Conrad's 1847 Lutheran marriage at Nova Friburgo; the sole held
  record naming him, and the source of his title *Kirchenvorsteher*.

  ## Regional and migration context

  Nova Friburgo was founded in 1818–20 as a Swiss Catholic colony, and acquired a German
  Protestant half when roughly eighty families recruited by Schäffer arrived in May 1824. That
  second community built the Igreja Luterana and kept its own German-language registers — the
  books in which Heinrich Schenkel appears, and in which he held office. [CONTEXTUAL] Its
  members had left a countryside emptied of prospects by the Napoleonic wars and the failed
  harvests that followed, and they arrived to the same stony, undersized highland lots that had
  already disappointed the Swiss. [CONTEXTUAL]

  ## Where to go today

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28705,-42.53424). The
  continuing community of the 1824 Lutheran congregation in which he served as
  *Kirchenvorsteher* and whose register is the only document naming him. [RESOLVED]

  - **Ottzweiler and Becherbach, Rheinland-Pfalz / Saarland region, Germany — unconfirmed.** The
  reported origin and marriage parishes of 1789 and 1812. Both are leads; until a register entry
  ties them to this man there is no documented origin site to visit. [UNLOCATED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). Where the colony's
  house and lot numbers, including the reported House 59 / Lot 53, were laid out. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é a única pessoa de todo este grupo colateral suíço-alemão a quem um
  documento retido atribui um cargo. O casamento luterano de seu filho Conrad, em 1847, em Nova
  Friburgo, nomeia-o "dem **Kirchenvorsteher** Heinrich Schenkel" — o presbítero Heinrich
  Schenkel. Todos os demais aqui são um nome, um progenitor ou, no máximo, um "colono".
  (PAR-0067)

  - **[PROVEN]** A leitura foi conquistada. A palavra foi por algum tempo mantida como um
  hesitante "[Bürger?]", e foi resolvida numa releitura em zoom máximo da imagem do registro, em
  setembro de 2026: é um composto longo que termina inequivocamente em "-vorsteher", longo
  demais para "Bürger". O perfil registra a correção em vez de adotá-la em silêncio.

  - **[LEAD]** Material de pesquisa o identifica como Johann Heinrich Schenkel, nascido em 8 de
  fevereiro de 1789 em Ottzweiler, Hessen, casado com Maria Elisabeth Klein em Becherbach em 31
  de maio de 1812, chefe do domicílio Schenkel no navio *Argus*, que chegou ao Rio em 7 de
  janeiro de 1824, agraciado com a Casa 59 / Lote 53 na colônia, e falecido em Nova Friburgo em
  31 de agosto de 1862. Diz-se ainda que uma filha morreu a bordo do *Argus* e que o filho Georg
  Conrad nasceu no desembarque, na costa. Nada disso é confirmado por documento retido aqui.

  - **[CAUTION]** Uma figura homônima circula no material secundário: um "Heinrich Schenkel"
  conhecido apenas por blog, marido de uma Anna Margaretha Klein, dado como *pai* de Johann
  Heinrich. Esse homem está uma geração acima deste e não deve ser fundido com ele.

  ## Identidade

  **Heinrich Schenkel** — pai de Conrad Schenkel (P-0107), nomeado uma única vez, no assento de
  casamento luterano do filho, em 1847, em Nova Friburgo. Tetravô de Iris Bohrer Muniz (P-0007),
  pela cadeia Conrad → Maria Luiza Schenkel (P-0104) → Carolina Klein (P-0029) → João Gonçalves
  Bohrer (P-0014). [PROVEN que é nomeado; grau derivado dos vínculos familiares]

  - **Nomeado em um registro:** "Conrad Schenkel, ehel[icher] leibl[icher] Sohn von dem
  Kirchenvorsteher Heinrich Schenkel" (PAR-0067, 3 de fevereiro de 1847). É modelado como nó
  somente de pai, família F-0056. [PROVEN]

  - **Cargo:** *Kirchenvorsteher* da congregação luterana de Nova Friburgo em fevereiro de 1847.
  [PROVEN]

  - **Esposa, nascimento, óbito, origem e nacionalidade:** nada documentado por registro retido.
  Por isso a nacionalidade é deliberadamente deixada em aberto. [OPEN por decisão]

  - **Vida relatada [LEAD]:** Johann Heinrich Schenkel, n. 8 de fevereiro de 1789, Ottzweiler
  (Hessen); ⚭ Maria Elisabeth Klein, Becherbach, 31 de maio de 1812; *Argus* 1824, Casa 59 /
  Lote 53; f. 31 de agosto de 1862, Nova Friburgo. Material Raibert Schenkel; nenhuma fonte
  primária retida.

  ## Posição social e profissão

  Um *Kirchenvorsteher* é um presbítero ou administrador leigo — membro da congregação eleito ou
  nomeado para administrar finanças, patrimônio e assuntos comunitários da igreja. É autoridade
  local real e, caracteristicamente, não traz salário nem bem hereditário. É toda a sua posição
  documentada: um cargo de confiança numa pequena congregação de imigrantes, exercido em 1847,
  sem nada registrado sobre seu ofício, suas terras ou sua alfabetização.

  ## Família e rede social

  O assento de 1847 é sua única aparição, e mostra o filho casando-se com a filha de um colono
  suíço diante de duas testemunhas comerciantes e do pastor da congregação. [PROVEN — PAR-0067]
  Nada mais de seu domicílio está disponível: nenhuma esposa é nomeada em documento daqui, e
  nenhum outro filho é atestado. Se teve a família numerosa que o material secundário descreve,
  é coisa não testada.

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Um presbiterato em 1847 implica presença consolidada. A congregação
  luterana de Nova Friburgo foi fundada pelas famílias alemãs chegadas em 3–4 de maio de 1824
  sob o agente Georg Anton Schäffer; um homem a quem se confiou sua administração em 1847 muito
  provavelmente fazia parte dela havia anos — compatível com, mas não prova de, a chegada de
  1824 que as pistas descrevem.

  - **[CONTEXTUAL / INFERRED]** Seu cargo é exatamente o tipo de posição que morre com o homem.
  Produzia respeito, não renda, e nada nesta linha sugere que se tenha convertido em terra ou
  educação para a geração seguinte: o filho Conrad não tem ocupação registrada, a neta casou-se
  com um Klein dentro da mesma congregação, e a filha dela casou-se para fora, numa família de
  lavradores. Posição sem salário por baixo não se transmite.

  - **[CONTEXTUAL]** A entrada alemã deixou a Renânia e Hessen pelos mesmos motivos que levaram
  os suíços a deixar o Jura cinco anos antes — empobrecimento pós-napoleônico, quebra de safra e
  terra fragmentada demais para a geração seguinte — e recebeu os mesmos lotes serranos pobres.
  A chegada dos Schenkel por esse programa é pista; as condições que a produziram não estão em
  dúvida.

  ## Questões em aberto

  - Seu próprio nascimento, casamento, óbito e origem — nada disponível. O livro paroquial de
  Ottzweiler (um batismo de 1789) e o de casamentos de Becherbach (1812) testariam toda a
  identificação em nível primário. [OPEN]

  - Se ele é o Johann Heinrich Schenkel da transcrição de passageiros do *Argus* de 1824,
  agraciado com a Casa 59 / Lote 53. [LEAD]

  - Sua esposa, sem nome em qualquer documento retido. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0067** — casamento luterano de 1847 do filho Conrad, em Nova Friburgo; o único
  documento retido que o nomeia, e a fonte de seu título *Kirchenvorsteher*.

  ## Contexto regional e migratório

  Nova Friburgo foi fundada em 1818–20 como colônia católica suíça e ganhou uma metade
  protestante alemã quando cerca de oitenta famílias recrutadas por Schäffer chegaram em maio de
  1824. Essa segunda comunidade ergueu a Igreja Luterana e manteve seus próprios livros em
  língua alemã — os livros em que Heinrich Schenkel aparece, e nos quais exerceu cargo.
  [CONTEXTUAL] Seus membros haviam deixado um campo esvaziado de perspectivas pelas guerras
  napoleônicas e pelas colheitas perdidas que se seguiram, e chegaram aos mesmos lotes serranos
  pedregosos e exíguos que já haviam decepcionado os suíços. [CONTEXTUAL]

  ## Onde ir hoje

  - **Comunidade Evangélica de Nova Friburgo (IECLB)** — Av. Dr. Galdino do Valle Filho 1,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28705,-42.53424). A
  comunidade herdeira da congregação luterana de 1824, na qual serviu como *Kirchenvorsteher* e
  cujo livro é o único documento que o nomeia. [RESOLVED]

  - **Ottzweiler e Becherbach, região da Renânia-Palatinado / Sarre, Alemanha — não
  confirmadas.** As freguesias relatadas de origem e de casamento, em 1789 e 1812. Ambas são
  pistas; enquanto um assento não as ligar a este homem, não há sítio de origem documentado a
  visitar. [UNLOCATED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). Onde foram
  demarcados os números de casa e lote da colônia, entre eles a relatada Casa 59 / Lote 53.
  [APPROX]
