profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Identificado como *Kirchenvorsteher* — presbítero ou administrador leigo da igreja luterana — no assento de casamento de 1847 de seu filho Conrad em Nova Friburgo, leitura confirmada numa releitura em zoom máximo da imagem do registro em 2026 (superando a hesitação anterior "[Bürger?]"). É o único ancestral neste arquivo atestado como detentor de um cargo formal na congregação luterana de Nova Friburgo. (PAR-0067)

  - **[CONTEXTUAL]** Um *Kirchenvorsteher* numa paróquia luterana alemã do século XIX era um administrador leigo responsável pela gestão das finanças, do patrimônio e do bem-estar comunitário da igreja — um cargo eleito ou nomeado de autoridade real e prestígio comunitário, e não um título meramente cerimonial.

  - **[INFERRED]** Seu título implica uma presença estabelecida e consolidada na comunidade luterana de Nova Friburgo até 1847 — sugerindo que estava na colônia há tempo suficiente para conquistar a confiança da congregação, possivelmente um dos chegados alemães mais antigos da leva de 1824.

  ## Identidade

  **Heinrich Schenkel** — pai de Conrad Schenkel (P-0107), conhecido por uma única menção no
  casamento luterano de 1847 de Conrad em Nova Friburgo. [PROVEN]

  - **Papel:** pai de Conrad Schenkel (P-0107; família F-0056, nó somente de pai); tetravô
  de Iris Bohrer Muniz na linha Schenkel. [PROVEN]

  - **Nomeado em um único registro:** o casamento luterano de 1847 de Conrad (PAR-0067)
  identifica Conrad como "ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich
  Schenkel" — ou seja, Heinrich ocupava o cargo de *Kirchenvorsteher* (presbítero/administrador
  da igreja luterana). O descritor, antes hesitado como "[Bürger?]", foi resolvido numa releitura
  em zoom máximo da imagem do registro (2026-09-11): uma palavra composta longa que termina
  claramente em "-vorsteher". [PROVEN — PAR-0067]

  ## Questões em aberto

  - Sua esposa, origem, nacionalidade, nascimento e óbito não estão documentados; nenhum
  registro além desta única menção está disponível. [OPEN]

