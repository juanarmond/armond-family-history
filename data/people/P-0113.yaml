profile: >-
  ## Interesting facts

  - **[PROVEN]** Identified as *Kirchenvorsteher* — Lutheran church warden or elder — in his son Conrad's 1847 Nova Friburgo marriage act, a reading confirmed on a max-zoom re-read of the register image in 2026 (superseding the earlier hedged "[Bürger?]" reading). He is the only ancestor in this archive attested as holding a formal office in the Nova Friburgo Lutheran congregation. (PAR-0067)

  - **[CONTEXTUAL]** A *Kirchenvorsteher* in a 19th-century German Lutheran parish was a lay administrator responsible for managing church finances, property, and community welfare — an elected or appointed position of real authority and community standing, not a purely ceremonial title.

  - **[INFERRED]** His title implies a settled, established presence in the Nova Friburgo Lutheran community by 1847 — suggesting he had been in the colony long enough to earn the trust of the congregation, possibly one of the earlier German arrivals from the 1824 wave.

  ## Identity

  **Heinrich Schenkel** — father of Conrad Schenkel (P-0107), known from a single mention in
  Conrad's 1847 Lutheran marriage at Nova Friburgo. [PROVEN]

  - **Role:** father of Conrad Schenkel (P-0107; family F-0056, father-only node); Iris Bohrer
  Muniz's 3×-great-grandfather on the Schenkel line. [PROVEN]

  - **Named in one record:** Conrad's 1847 Lutheran marriage (PAR-0067) identifies Conrad as
  "ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich Schenkel" — i.e. Heinrich held
  the office of *Kirchenvorsteher* (Lutheran church warden/elder). The descriptor, earlier hedged
  as "[Bürger?]", was resolved on a max-zoom re-read of the register image (2026-09-11): a long
  compound clearly ending in "-vorsteher". [PROVEN — PAR-0067]

  ## Open questions

