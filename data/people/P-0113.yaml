profile_pt: >-
  ## Identidade

  **Heinrich Schenkel** — pai de Conrad Schenkel (P-0107), conhecido por uma única menção no
  casamento luterano de 1847 de Conrad em Nova Friburgo. [PROVEN]

  - **Papel:** pai de Conrad Schenkel (P-0107; família F-0056, nó somente de pai); tetravô
  de Iris Bohrer Muniz na linha Schenkel. [PROVEN]

  - **Nomeado em um único registro:** o casamento luterano de 1847 de Conrad (PAR-0067)
  identifica Conrad como "ehel[icher] leibl[icher] Sohn von dem Kirchenvorsteher Heinrich
  Schenkel" — ou seja, Heinrich ocupava o cargo de *Kirchenvorsteher* (presbítero/administrador
  da igreja luterana). O descritor, antes hesitado como "[Bürger?]", foi resolvido numa releitura
  em zoom máximo da imagem do registro (2026-09-11): uma palavra composta longa que termina
  claramente em "-vorsteher". [PROVEN — PAR-0067]

  ## Questões em aberto

  - Sua esposa, origem, nacionalidade, nascimento e óbito não estão documentados; nenhum
  registro além desta única menção está disponível. [OPEN]

