profile: >-
  ## Interesting facts

  - **[CONTEXTUAL]** A "Capitão" in the colonial Companhias de Ordenanças was an unpaid honorary militia rank — the local badge of free-white, propertied standing in frontier Minas, not a salaried position; its economic value was privilege resting on a transmissible land base, the precise contrast with the later Armond line's non-transmissible police offices.

  - **[CONTEXTUAL]** His parents Gaspar Ferreira and Gertrudes Maria de Toledo were from Vila Rica (Ouro Preto) — the apex of the colonial gold-mining economy; his generation's move to the farming highlands of Barbacena tracks the post-1760 collapse of gold production that pushed mining-district families into agriculture.

  - **[PROVEN]** His rank is independently confirmed by two of his children's marriage records decades apart: the 1810 São João del Rei marriage of his son Ladisláo names him "Capitão Joaquim José Ferreira de Toledo," and the 1816 marriage of his daughter Carolina Francelina names him "Capitão João José Ferreira de Toledo" — the forename variant is a scribal discrepancy, not a different person (PAR-0023, PAR-0021).

  - **[INFERRED]** The preferred forename "Joaquim José" was settled by cross-reading the clearest surviving record (the 1810 marriage) against two fainter daughters' marriages — a case where the most legible source, not the most numerous, is the decisive one.

  - **[CONTEXTUAL]** His 13 children, documented in his wife's 1833 Barbacena inventário, set the partible-succession clock running for several generations; Brazilian law divided estates equally among all children, so the Cascalhães holding was destined to be split 13 ways, and each share split again in the next generation — explaining why Eliza's cohort inherited fractional cash payments rather than land.

  - **[INFERRED]** The compound surname "Ferreira de Toledo" that his descendants carried into Leopoldina is a direct record of the Vila Rica gold-field ancestry: "Ferreira" from his father's mining-family line, "de Toledo" from his mother's, fused into a single family marker that his children and grandchildren all bore.

  ## Identity

  Preferred **Joaquim José Ferreira de Toledo** — his own 1783 marriage (PAR-0018), his
  son Ladisláo's 1787 baptism (PAR-0019), and the clean, legible 1810 São João del Rei
  marriage of Ladisláo × Mathilde (PAR-0023) all name him "Joaquim José" / "Capitão
  Joaquim José Ferreira de Toledo" [PROVEN]. The "João José" form is attested only in the
  two faded daughters' marriages (PAR-0020, 1812; PAR-0021, 1816) and is kept as a source
  variant [PROVEN for both forms]. A direct image re-read (11 August 2026) settled this in
  favour of Joaquim: PAR-0023 is the clearest record and reads Joaquim, and his own
  marriage confirms it — superseding an earlier choice of "João José" that had over-weighted
  the two faded 1812/1816 reads.

  - He is the father of Ladisláo Egídio Ferreira de Toledo (P-0056), hence Eliza Balbina de
  Toledo's (P-0017) great-grandfather.

  - **Marriage:** ⚭ Ritta Angélica Rodrigues (P-0058) at Barbacena, 1783 (PAR-0018),
  family F-0028.

  - **Parents:** Gaspar Ferreira and Gertrudes Maria [de Toledo], of Vila Rica (Ouro
  Preto), are named in PAR-0018 — the apparent origin of the family's "Ferreira" + "de
  Toledo" surname — and are now modelled as P-0092 × P-0093 (family F-0045) on
  strong-evidence. Nationality Brazilian (a Barbacena / Minas Gerais family); no
  birthplace of his own is stated in the located records.

  ## Standing and profession

  - **Capitão** [PROVEN] — a militia/ordenanças captaincy, styled "Capitão João José
  Ferreira de Toledo" in his daughter Carolina Francelina's 1816 marriage (PAR-0021) and in
  the 1810 Ladisláo × Mathilde marriage (PAR-0023). The family's status marker.

  ## Family and social network

  - Wife: Ritta Angélica Rodrigues (P-0058). Confirmed son: Ladisláo (P-0056, via his 1787
  baptism PAR-0019). Documented daughters: Anna Belizaria (m.1812, PAR-0020) and Carolina
  Francelina (⚭ Vicente José da Cunha, m.1816, PAR-0021), both naming the couple.

  - The 1833 Barbacena inventário of Ritta's estate (catalogued here as the held source
  PRB-0010) enumerates, on the widower's sworn declaration, all thirteen children of the
  couple: (1) Ladisláo Egídio Ferreira (P-0056, child #1, our line); (2) Maria (⚭ Manoel
  Pereira de Andrade); (3) Joaquim [Neuterio? — uncertain]; (4) Lauriana (⚭ Francisco Pereira
  do Valle); (5) Anna (⚭ Antônio Dias Ladeira — the held source equates her with the Anna
  Belizaria of PAR-0020); (6) Cândida (already deceased, ⚭ Vicente José de Ab[reu?]
  [uncertain], leaving seven orphaned minor children aged 3–13); (7) Rita (⚭ Patrício
  Barroso); (8) Francisco; (9) José Anastácio; (10) Antônio Zeferino — who married his own
  niece Maria Perpétua (Ladisláo × Matilde's daughter), the clearest uncle-niece endogamous
  match in the line; (11) João Rodrigues; (12) Venâncio do Nascimento; (13) Manoel Joaquim
  [PROVEN — PRB-0010]. The record reads the couple's marriage year as 1783. Mapping the
  daughter Carolina Francelina (⚭ Vicente José da Cunha, PAR-0021) onto this first-name-only
  list is still [OPEN].

  ## What we can extrapolate

  A large, landholding, militia-officer Barbacena family — the rural elite of
  late-colonial Minas, whose standing let the line marry as social peers into, and become
  numbered heirs of, the Concórdia estate a generation later. [INFERRED]

  - **How the standing was acquired — earned militia office, not inherited nobility**
  [INFERRED/CONTEXTUAL]. The "Capitão" is a *militia* captaincy: in colonial Minas the local
  badge of free-white propertied standing and neighbourhood authority, appointed/earned by
  frontier service rather than a hereditary title — status *built* on the gold-to-farming
  frontier, then consolidated at Barbacena.

  - **What the captaincy PAID — nothing, and that is the point** [CONTEXTUAL — role-based]. The
  Companhias de Ordenanças were unpaid forces; the officer posts (capitão/alferes/sargento)
  were Antigo-Regime status markers served *gratuitamente*, conferring privilege — local
  authority, tax/military exemptions, precedence — rather than a salary. So the captaincy put no
  wage into the household; its economic value was privilege sitting *atop a transmitting land
  base* (the Barbacena family seat, the Fazenda Cascalhães named in Rita's 1833 inventário,
  PRB-0010, worked by enslaved labour). The sharp contrast is with the later Armond unpaid
  offices (Simplício's *suplente de delegado*, Aristão's *subdelegado*), equally unpaid but
  standing on no heritable land — there the honour left only status; here it reinforced
  heritable capital.

  - **The partible-inheritance clock starts here** [CONTEXTUAL]. Brazilian law split estates
  equally among all children, and Joaquim José × Rita had thirteen (Rita's 1833 inventário,
  PRB-0010). Rita's 1832 death triggered the 1833 accounting that divided the Cascalhães estate
  thirteen ways; each of those children (e.g. Ladisláo) then had a further dozen-plus children,
  so within two generations the apex holding is diluted into scores of small shares. This is the
  mechanism that, three generations on, leaves Eliza with a modest *cash* inheritance rather
  than land — the fragmentation the family's cousin/uncle-niece endogamy was partly a strategy
  to resist.

  - **A "Simpliciano" name-echo inside the family** [INFERRED, noted]: among the deceased
  daughter Cândida's orphaned children named in the 1833 inventário (PRB-0010) is a
  *Simpliciano* (aged 4, so born c.1829) — the "Simplício" root already circulating within the
  Toledo family a generation before Eliza's husband Simplício José Ferreira Armond. Not
  evidence of a tie, but logged, because the Armond surname-adoption puzzle turns on such
  naming currents.

  ## Open questions

  - His parents (Gaspar Ferreira × Gertrudes Maria) at modelled/primary level, and his own
  birth at Vila Rica. [OPEN]

  ## Sources held (this repository)

  - PAR-0018 (his 1783 Barbacena marriage — names both parent couples) · PAR-0019 (1787
  baptism of his son Ladisláo) · PAR-0020 (1812 marriage of daughter Anna Belizaria) ·
  PAR-0021 (1816 marriage of daughter Carolina Francelina — "Capitão João José") · PAR-0023
  (1810 Ladisláo × Mathilde marriage — records him "Capitão Joaquim José").

  ## Regional and migration context

  A Barbacena (Piedade da Borda do Campo) family; his own parents were of Vila Rica (Ouro
  Preto), the apparent origin of the "Ferreira de Toledo" surname — consistent with the
  gold-to-farming shift that moved mining-district families into the farming Campo das
  Vertentes after ~1760. [CONTEXTUAL]

  ## Where to go today

  - **Origin (natural de Villa Rica):** Basílica de N.S. do Pilar / Igreja de N.S. da
  Conceição de Antônio Dias, Ouro Preto, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Monsenhor%20Castilho%20Barbosa%2017%2C%20Ouro%20Preto%2C%20MG);
  his ~1750s–60s Villa Rica baptism (naming Gaspar × Gertrudes) → AEAM, Mariana [RESOLVED]
  · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Sao%20Pedro%20dos%20Clerigos%2C%20Mariana%2C%20MG)

  - **Marriage (15 Jan 1783):** Capela de N.S. da Glória, Barbacena, MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Capela%20Nossa%20Senhora%20da%20Gloria%2C%20Barbacena%2C%20MG);
  family seat Fazenda Cascalhães, Termo de Barbacena [UNLOCATED] — ask Barbacena historians
  · [Maps](https://www.google.com/maps/search/?api=1&query=Barbacena%2C%20MG)
profile_pt: >-
  ## Factos notáveis

  - **[CONTEXTUAL]** Um "Capitão" nas Companhias de Ordenanças coloniais era um posto honorário de milícia não remunerado — a distinção local de estatuto livre, branco e proprietário na fronteira mineira, não um cargo assalariado; o seu valor económico era o privilégio assente numa base fundiária transmissível, o contraste exacto com os cargos policiais não transmissíveis da linha Armond mais tarde.

  - **[CONTEXTUAL]** Os seus pais Gaspar Ferreira e Gertrudes Maria de Toledo eram de Vila Rica (Ouro Preto) — o auge da economia mineira colonial; a mudança da sua geração para as terras altas agrícolas de Barbacena acompanha o colapso pós-1760 da produção aurífera que empurrou as famílias dos distritos mineiros para a agricultura.

  - **[PROVEN]** A sua patente é confirmada independentemente por dois registos de casamento de filhos, separados por décadas: o casamento de 1810 em São João del Rei do filho Ladisláo nomeia-o "Capitão Joaquim José Ferreira de Toledo", e o casamento de 1816 da filha Carolina Francelina nomeia-o "Capitão João José Ferreira de Toledo" — a variante do nome próprio é uma discrepância de escrivão, não uma pessoa diferente (PAR-0023, PAR-0021).

  - **[INFERRED]** O nome próprio preferido "Joaquim José" foi determinado cruzando o registo mais legível que sobreviveu (o casamento de 1810) com dois casamentos de filhas de legibilidade inferior — um caso em que a fonte mais legível, e não a mais numerosa, é a decisiva.

  - **[CONTEXTUAL]** Os seus 13 filhos, documentados no inventário de 1833 da esposa em Barbacena, puseram o relógio da sucessão partilhável a contar para várias gerações; a lei brasileira dividia os espólios igualitariamente entre todos os filhos, pelo que o património de Cascalhães estava destinado a ser dividido em 13 partes — e cada parte voltaria a ser dividida na geração seguinte — explicando por que a geração de Eliza herdou quotas em dinheiro de valor modesto, não terras.

  - **[INFERRED]** O apelido composto "Ferreira de Toledo" que os seus descendentes levaram para Leopoldina é um registo directo da ascendência nas minas de ouro de Vila Rica: "Ferreira" da linha mineira do pai, "de Toledo" da linha da mãe, fundidos num único marcador familiar que todos os filhos e netos adoptaram.

  ## Identidade

  Preferido **Joaquim José Ferreira de Toledo** — seu próprio casamento de 1783 (PAR-0018),
  o batismo de 1787 de seu filho Ladisláo (PAR-0019) e o casamento limpo e legível de 1810
  em São João del Rei de Ladisláo × Mathilde (PAR-0023) todos o nomeiam "Joaquim José" /
  "Capitão Joaquim José Ferreira de Toledo" [PROVEN]. A forma "João José" só é atestada nos
  dois casamentos borrados das filhas (PAR-0020, 1812; PAR-0021, 1816) e é mantida como
  variante de fonte [PROVEN para ambas as formas]. Uma releitura direta da imagem (11 de
  agosto de 2026) resolveu em favor de Joaquim: PAR-0023 é o registro mais claro e lê
  Joaquim, e seu próprio casamento o confirma — superando uma escolha anterior de "João
  José" que sobrevalorizara as duas leituras borradas de 1812/1816.

  - É o pai de Ladisláo Egídio Ferreira de Toledo (P-0056) e, portanto, bisavô de Eliza
  Balbina de Toledo (P-0017).

  - **Casamento:** ⚭ Ritta Angélica Rodrigues (P-0058) em Barbacena, 1783
  (PAR-0018), família F-0028.

  - **Pais:** Gaspar Ferreira e Gertrudes Maria [de Toledo], de Vila Rica (Ouro Preto), são
  nomeados em PAR-0018 — a aparente origem do sobrenome "Ferreira" + "de Toledo" da família
  — e agora estão modelados como P-0092 × P-0093 (família F-0045), com base em evidência
  forte. Nacionalidade brasileira (uma família de Barbacena / Minas Gerais); nenhum local
  de nascimento próprio é declarado nos registros localizados.

  ## Posição social e profissão

  - **Capitão** [PROVEN] — uma capitania de milícia/ordenanças, tratado por "Capitão João
  José Ferreira de Toledo" no casamento de 1816 de sua filha Carolina Francelina (PAR-0021)
  e no casamento de 1810 de Ladisláo × Mathilde (PAR-0023). O marcador de status da
  família.

  ## Família e rede social

  - Esposa: Ritta Angélica Rodrigues (P-0058). Filho confirmado: Ladisláo (P-0056, via seu
  batismo de 1787, PAR-0019). Filhas documentadas: Anna Belizaria (c.1812, PAR-0020) e
  Carolina Francelina (⚭ Vicente José da Cunha, c.1816, PAR-0021), ambas nomeando o casal.

  - O inventário de 1833 do espólio de Ritta em Barbacena (catalogado aqui como a fonte
  disponível PRB-0010) enumera, na declaração juramentada do viúvo, todos os treze filhos do
  casal: (1) Ladisláo Egídio Ferreira (P-0056, filho nº 1, nossa linha); (2) Maria (⚭ Manoel
  Pereira de Andrade); (3) Joaquim [Neuterio? — incerto]; (4) Lauriana (⚭ Francisco Pereira
  do Valle); (5) Anna (⚭ Antônio Dias Ladeira — a fonte disponível a identifica com a Anna
  Belizaria de PAR-0020); (6) Cândida (já falecida, ⚭ Vicente José de Ab[reu?] [incerto],
  deixando sete filhos menores órfãos com idades de 3 a 13 anos); (7) Rita (⚭ Patrício
  Barroso); (8) Francisco; (9) José Anastácio; (10) Antônio Zeferino — que se casou com a
  própria sobrinha Maria Perpétua (filha de Ladisláo × Matilde), o mais claro enlace
  tio-sobrinha da linha; (11) João Rodrigues; (12) Venâncio do Nascimento; (13) Manoel
  Joaquim [PROVEN — PRB-0010]. O registro lê o ano do casamento do casal como 1783. O
  mapeamento da filha Carolina Francelina (⚭ Vicente José da Cunha, PAR-0021) nessa lista
  apenas de prenomes permanece [OPEN].

  ## O que podemos extrapolar

  Uma grande família Barbacena proprietária, de oficial de milícia — a elite rural da Minas
  do fim do período colonial, cujo prestígio permitiu à linha casar-se como par social e
  tornar-se herdeira numerada do espólio da Concórdia uma geração depois. [INFERRED]

  - **Como a posição foi adquirida — ofício de milícia conquistado, não nobreza herdada**
  [INFERRED/CONTEXTUAL]. O "Capitão" é uma capitania de *milícia*: na Minas colonial, o
  distintivo local de condição proprietária branco-livre e autoridade de vizinhança,
  nomeado/conquistado por serviço na fronteira, e não um título hereditário — status
  *construído* na fronteira do ouro-para-agricultura e depois consolidado em Barbacena.

  - **Quanto a capitania PAGAVA — nada, e é esse o ponto** [CONTEXTUAL — baseado no papel]. As
  Companhias de Ordenanças eram forças não remuneradas; os postos de oficial
  (capitão/alferes/sargento) eram marcadores de status do Antigo Regime servidos
  *gratuitamente*, conferindo privilégio — autoridade local, isenções fiscais/militares,
  precedência — em vez de salário. Assim, a capitania não punha salário algum na casa; seu
  valor econômico era o privilégio assentado *sobre uma base de terra transmissível* (a sede da
  família em Barbacena, a Fazenda Cascalhães nomeada no inventário de Rita de 1833, PRB-0010,
  trabalhada por mão de obra escravizada). O contraste agudo é com os ofícios não remunerados
  Armond posteriores (o *suplente de delegado* de Simplício, o *subdelegado* de Aristão),
  igualmente não pagos, mas assentados em terra alguma hereditável — ali a honra deixava só
  status; aqui reforçava capital hereditável.

  - **O relógio da herança partível começa aqui** [CONTEXTUAL]. A lei brasileira dividia os
  espólios igualmente entre todos os filhos, e Joaquim José × Rita tiveram treze (inventário de
  Rita de 1833, PRB-0010). A morte de Rita em 1832 desencadeou o acerto de 1833 que dividiu o
  espólio da Cascalhães em treze partes; cada um desses filhos (por exemplo, Ladisláo) teve, por
  sua vez, mais de uma dúzia de filhos, de modo que em duas gerações a propriedade apical se
  dilui em dezenas de pequenas quotas. É esse o mecanismo que, três gerações adiante, deixa
  Eliza com uma modesta herança em *dinheiro* em vez de terra — a fragmentação que a endogamia
  entre primos/tio-sobrinha da família era, em parte, uma estratégia para resistir.

  - **Um eco do nome "Simpliciano" dentro da família** [INFERRED, noted]: entre os filhos
  órfãos da falecida filha Cândida nomeados no inventário de 1833 (PRB-0010) há um
  *Simpliciano* (com 4 anos, portanto nascido por volta de 1829) — a raiz "Simplício" já
  circulando dentro da família Toledo uma geração antes do marido de Eliza, Simplício José
  Ferreira Armond. Não é evidência de vínculo, mas fica registrado, pois o enigma da adoção do
  sobrenome Armond gira em torno de tais correntes de nomeação.

  ## Questões em aberto

  - Seus pais (Gaspar Ferreira × Gertrudes Maria) em nível modelado/primário, e seu próprio
  nascimento em Vila Rica. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0018 (seu casamento de 1783 em Barbacena — nomeia os dois casais de pais)
  · PAR-0019 (batismo de 1787 de seu filho Ladisláo) · PAR-0020 (casamento de 1812 da filha
  Anna Belizaria) · PAR-0021 (casamento de 1816 da filha Carolina Francelina — "Capitão João
  José") · PAR-0023 (casamento de 1810 de Ladisláo × Mathilde — o registra "Capitão Joaquim
  José").

  ## Contexto regional e migratório

  Uma família de Barbacena (Piedade da Borda do Campo); seus próprios pais eram de Vila Rica
  (Ouro Preto), a aparente origem do sobrenome "Ferreira de Toledo" — consistente com a
  transição do ouro para a agricultura que levou famílias do distrito minerador ao Campo
  das Vertentes agrícola depois de ~1760. [CONTEXTUAL]

  ## Onde ir hoje

