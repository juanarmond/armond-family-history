notes:
- text: >-
    Father of Ladisláo Egídio Ferreira de Toledo (P-0056), confirmed by Ladisláo's own
    1787 baptism (PAR-0019); hence Eliza Balbina de Toledo's (P-0017)
    great-great-grandfather. Married Ritta Angélica Rodrigues (P-0058, family F-0028)
    at Barbacena c.1786 (PAR-0018). Two of his daughters' marriages independently name
    the couple: Anna Belizaria (1812, PAR-0020) and Carolina Francelina (1816,
    PAR-0021) — both documented children on F-0028.
  text_pt: >-
    Pai de Ladisláo Egídio Ferreira de Toledo (P-0056), confirmado pelo próprio
    batismo de Ladisláo de 1787 (PAR-0019); portanto, o trisavô de Eliza Balbina
    de Toledo (P-0017). Casou-se com Ritta Angélica Rodrigues (P-0058, família
    F-0028) em Barbacena por volta de 1786 (PAR-0018). Os casamentos de duas de
    suas filhas nomeiam independentemente o casal: Anna Belizaria (1812, PAR-0020)
    e Carolina Francelina (1816, PAR-0021) — ambas filhas documentadas em F-0028.
- text: >-
    Forename reconciliation (João vs Joaquim): the two clearer, later records name him
    "João José" — plainly "Capitão João José Ferreira de Toledo" in PAR-0021 (1816) and
    "João José" in PAR-0020 (1812). The earlier "Joaquim José" reads come from
    ink-bled scans (PAR-0018 marriage, PAR-0019 baptism) and are most likely a misread
    of "João"; "João José Ferreira de Toledo" is adopted as the preferred form and
    "Joaquim José" preserved as a source variant.
  text_pt: >-
    Reconciliação de prenome (João vs Joaquim): os dois registros mais claros e
    mais tardios o nomeiam "João José" — claramente "Capitão João José Ferreira
    de Toledo" em PAR-0021 (1816) e "João José" em PAR-0020 (1812). As leituras
    mais antigas de "Joaquim José" vêm de scans borrados de tinta (o casamento
    PAR-0018, o batismo PAR-0019) e são muito provavelmente uma leitura equivocada
    de "João"; "João José Ferreira de Toledo" é adotado como a forma preferencial
    e "Joaquim José" preservado como variante de fonte.
- text: >-
    His parents Gaspar Ferreira and Gertrudes Maria [de Toledo] are named in PAR-0018
    (Gaspar of Vila Rica / Ouro Preto — the apparent origin of the family's "Ferreira"
    + "de Toledo" surname) but are not yet modelled as entities; recorded as a lead.
    Nationality Brazilian (a Barbacena / Minas Gerais family); no explicit birthplace
    of his own is stated in the located records.
  text_pt: >-
    Seus pais Gaspar Ferreira e Gertrudes Maria [de Toledo] são nomeados em
    PAR-0018 (Gaspar de Vila Rica / Ouro Preto — a aparente origem do sobrenome
    "Ferreira" + "de Toledo" da família), mas ainda não estão modelados como
    entidades; registrados como pista. Nacionalidade brasileira (uma família de
    Barbacena / Minas Gerais); nenhum local de nascimento próprio é declarado nos
    registros localizados.
