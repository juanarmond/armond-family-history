profile: >-
  ## Interesting facts

  - **[PROVEN]** He signed his own name — "Joaq.m Jozé Ferr.a de Toledo" — at the foot of
  the oath he swore as widower and inventariante of his wife's estate at the Fazenda
  Cascalhaes on 15 July 1833 (PRB-0010). It is the earliest held autograph of any Toledo
  ancestor in this line.

  - **[PROVEN]** The Juiz dos Órfãos of Barbacena travelled out to the Fazenda Cascalhaes
  to administer that oath in person, bringing his escrivão with him. Courts came to men of
  standing; men without it came to the court.

  - **[CONTEXTUAL]** A "Capitão" in the colonial Companhias de Ordenanças was an unpaid
  honorary militia rank — the local badge of free-white, propertied standing in frontier
  Minas, not a salaried position. Its economic value was privilege resting on a
  transmissible land base, the precise contrast with the later Armond line's
  non-transmissible police offices.

  - **[PROVEN]** His wife's 1833 appraisal opens with three worn copper vats, an iron
  cauldron, a weighing scale, an iron pan and ten used scythes — a running subtotal of
  42$980. Brazilian inventários listed goods in a fixed order, gold and silver first; a
  list that begins at copper is a list with no plate to declare.

  - **[PROVEN]** He asked the court for a *second* inventory. The 1833 petition states
  that an inventory and partition of the couple's goods had already been carried out, and
  requests a fresh one "with the same appraisers, or those the judge shall name", so as
  not to prejudice the orphans — the earliest instance of a pattern that recurs across
  three generations of Toledo estates.

  - **[CONTEXTUAL]** His 13 children set the partible-succession clock running for the
  whole line: Brazilian law divided estates equally among all children, so the Cascalhaes
  holding was destined to be split thirteen ways, and each share split again in the next
  generation.

  ## Identity

  Preferred **Joaquim José Ferreira de Toledo** — his own 1783 marriage (PAR-0018), his
  son Ladisláo's 1787 baptism (PAR-0019), the clean and legible 1810 São João del Rei
  marriage of Ladisláo × Mathilde (PAR-0023) and his own 1833 signature (PRB-0010) all
  give "Joaquim" [PROVEN]. The "João José" form is attested only in the two faded
  daughters' marriages (PAR-0020, 1812; PAR-0021, 1816) and is kept as a source variant. A
  direct image re-read (11 August 2026) settled this in favour of Joaquim, superseding an
  earlier choice of "João José" that had over-weighted the two faded reads.

  - He is the father of Ladisláo Egídio Ferreira de Toledo (P-0056), hence Eliza Balbina
  de Toledo's (P-0017) great-grandfather and Aristão Ferreira Armond's (P-0008) maternal
  2×-great-grandfather.

  - **Marriage:** ⚭ Ritta Angélica Rodrigues (P-0058) at the Capela de N.S. da Glória,
  filial of the Barbacena matriz, 15 January 1783 (PAR-0018), family F-0028. He was
  therefore born around 1755–1765 [INFERRED] and was in his seventies when he swore the
  1833 oath.

  - **Origin:** PAR-0018 records the groom as "*morador na Villa Rica*" (Ouro Preto) at
  the time of the 1783 marriage — so he was then residing in the Comarca de Vila Rica, not
  yet settled in Barbacena [LEAD — moderate legibility on the ink-bled folio].

  - **Death:** after 1 July 1833 [PROVEN — he is the living widower and inventariante of
  Rita's estate on that date, PRB-0010]. No death record is held.

  - **Parents:** Gaspar Ferreira and Gertrudes Maria [de Toledo], of Vila Rica (Ouro
  Preto), are named in PAR-0018 — the apparent origin of the family's "Ferreira" + "de
  Toledo" surname — and are modelled as P-0092 × P-0093 (family F-0045) on
  strong-evidence. Nationality Brazilian.

  ## Standing and profession

  - **Capitão** [PROVEN] — a militia / ordenanças captaincy, styled "Capitão João José
  Ferreira de Toledo" in his daughter Carolina Francelina's 1816 marriage (PAR-0021),
  "Capitão Joaquim José Ferreira de Toledo" in the 1810 Ladisláo × Mathilde marriage
  (PAR-0023), and "o Cap.m Joaquim José Ferreira de Toledo" throughout the 1833 estate
  proceedings (PRB-0010). The family's status marker across fifty years of records.

  - **Seat: the Fazenda Cascalhaes, Termo de Barbacena** [PROVEN — PRB-0010]. The 1833
  oath and appraisal were conducted at the fazenda itself, the judge and escrivão coming
  out from the vila. The held pages of the appraisal cover only the opening movables —
  copper vats (20$800), an iron cauldron (8$000), a weighing scale (2$500), an iron pan
  (2$680) and ten used scythes (9$000), running subtotal 42$980 — the land, any enslaved
  people and the monte-mór are on folios not in the digitised set.

  - **Literacy [PROVEN — signed]** — his autograph closes the *termo de juramento* of 1833
  (PRB-0010 p.5), alongside those of the judge and the two sworn appraisers, Capitão
  Simião Ferreira da Silva and Alferes Domingos Jaime Ferreira de Castro.

  ## Family and social network

  - Wife: Ritta Angélica Rodrigues (P-0058), who died 9 February 1832 intestate. Confirmed
  son: Ladisláo (P-0056, via his 1787 baptism PAR-0019 and as child #1 of the 1833
  inventory). Documented daughters: Anna Belizaria (m.1812, PAR-0020) and Carolina
  Francelina (⚭ Vicente José da Cunha, m.1816, PAR-0021).

  - The 1833 Barbacena inventory of Ritta's estate (PRB-0010) enumerates, on the widower's
  sworn declaration, all thirteen children of the couple: (1) Ladisláo Egídio Ferreira
  (P-0056, our line); (2) Maria (⚭ Manoel Pereira de Andrade); (3) Joaquim [Neuterio? —
  uncertain]; (4) Lauriana (⚭ Francisco Pereira do Valle); (5) Anna (⚭ Antônio Dias
  Ladeira — the source equates her with the Anna Belizaria of PAR-0020); (6) Cândida
  (already deceased, ⚭ Vicente José de Ab[reu?] [uncertain], leaving seven orphaned minor
  children aged 3–13); (7) Rita (⚭ Patrício Barroso); (8) Francisco; (9) José Anastácio;
  (10) Antônio Zeferino — who married his own niece Maria Perpétua (Ladisláo × Mathilde's
  daughter), the clearest uncle-niece endogamous match in the line; (11) João Rodrigues;
  (12) Venâncio do Nascimento; (13) Manoel Joaquim [PROVEN — PRB-0010]. Mapping the
  daughter Carolina Francelina (PAR-0021) onto this first-name-only list is still [OPEN].

  - The couple's social peers are visible in who the court used: the appraisers of Rita's
  estate were themselves a Capitão and an Alferes of the same district, and his son
  married the daughter of an Alferes. This is an officer-rank neighbourhood marrying and
  valuing among itself.

  ## What we can extrapolate

  A large, landholding, militia-officer Barbacena family — the rural elite of
  late-colonial Minas, whose standing let the line marry as social peers into, and become
  numbered heirs of, the Concórdia estate a generation later. [INFERRED]

  - **How the standing was acquired — earned militia office, not inherited nobility**
  [INFERRED/CONTEXTUAL]. The "Capitão" is a *militia* captaincy: in colonial Minas the
  local badge of free-white propertied standing and neighbourhood authority, appointed and
  earned by frontier service rather than a hereditary title. Nothing is documented for his
  own father Gaspar Ferreira beyond a name and a residence at Villa Rica, so on the held
  evidence the rank appears *at* him, not above him. He is the first documented rise in
  this line — and the rise is one generation deep.

  - **What the captaincy PAID — nothing, and that is the point** [CONTEXTUAL —
  role-based]. The Companhias de Ordenanças were unpaid forces; capitão, alferes and
  sargento were Antigo-Regime status markers served *gratuitamente*, conferring privilege
  — local authority, tax and military exemptions, precedence — rather than a salary. So
  the captaincy put no wage into the household. Its economic value was privilege sitting
  *atop a transmitting land base*, the Fazenda Cascalhaes. The sharp contrast is with the
  unpaid police offices held a century later by Simplício Armond, his great-granddaughter
  Eliza's husband: equally unpaid, but standing on no heritable land at all. Here the
  honour reinforced capital; there it substituted for it.

  - **Wealth mechanics — land as the transmitting asset, and how thin the rest was**
  [PROVEN figures / INFERRED reading]. The held opening of the 1833 appraisal is a working
  farm's kit: copper vats, an iron cauldron, a scale, scythes, totalling 42$980 across the
  first entries. Because Brazilian inventários were listed in a canonical order with gold
  and silver first, a list that *begins* at copper is a household with no plate to
  declare. Thirty-four years later his grandson's Concórdia estate opens with a gold watch
  (250$000) and a dozen silver covers (180$000). The movables are not the fortune in
  either case — but the order of the lists is a legible measure of how far the line rose
  between 1833 and 1867, and of how much of that rise was recent.

  - **The partible-inheritance clock starts here, and the arithmetic is brutal** [PROVEN
  counts / CONTEXTUAL law]. Rita's death in 1832 put her *meação* — half the couple's
  estate — into division among thirteen stirpes. That is one twenty-sixth of the
  household's property per child; and because the deceased daughter Cândida was
  represented by seven minor children, each of those grandchildren took a seventh of a
  thirteenth of a half, roughly one part in 182. Nineteen claimants stood in a single 1833
  division, before Joaquim José's own half had even been touched. Each of his surviving
  children then had large families of their own — Ladisláo alone had at least eight.
  Within two generations the apex holding is diluted into scores of fractions. This is the
  mechanism that, three generations on, leaves Eliza with a modest cash inheritance rather
  than land, and the reason the family's later cousin and uncle-niece endogamy reads as a
  deliberate counter-strategy.

  - **Estates in this family were routinely reopened** [PROVEN]. His 1833 petition asks
  for a *second* inventory over goods already inventoried and partitioned once. His
  grandson's and great-grandson's estates repeat the pattern: the 1876 partition of
  Ladisláo's estate was annulled by the 1882 embargos judgment and ordered redone, and a
  partilha audiência was still being held in 1889. Reopening is not an accident of one
  generation; it is how a partible estate with many heirs behaves, and every reopening is
  paid for out of the estate.

  - **Education was a purchase, and here it was made** [PROVEN base / CONTEXTUAL reading].
  He signed his own name in 1833; his son Ladisláo was marked literate in the 1839 census
  [LEAD]; his grandson José Cezário registered 200 alqueires under the Lei de Terras; that
  grandson's wife Claudina signed her own sworn declarations. Literacy in imperial Brazil
  was a purchased, class-linked competence, bought anew for each child and in no sense
  heritable. This family bought it consistently for four generations — which is exactly
  why its eventual descent into the urban wage economy took four more.

  - **Migration — the gold-to-agriculture pivot, made by him** [INFERRED / CONTEXTUAL].
  His father is recorded a *morador* of Villa Rica; he himself is recorded there in 1783
  and settled on a Barbacena fazenda thereafter. The Minas placers passed their peak
  around 1750 and mining-district families relocated to the farming Campo das Vertentes
  through the later 18th century. He is the man who made that move in this line —
  converting a share of a declining extractive economy into land in a rising agricultural
  one. No record states his reason.

  - **The arc, from here** [INFERRED]. Above him there is only a name at Villa Rica. Below
  him the line rises for two more generations — Ladisláo onto the coffee frontier, José
  Cezário to a nineteen-conto slaveholding fazenda — and then falls: the Concórdia sold in
  1879–80, abolition in 1888, and his great-granddaughter Eliza marrying a man whose
  standing was unpaid office. The peak sits two generations after him; the mechanism that
  undoes it starts in his own household, with thirteen children and a partible law.

  ## Open questions

  - His own birth and baptism at Vila Rica (~1750s–60s), which would name his parents'
  parents and test the "de Toledo" reading. [OPEN]

  - His death date and place, and whether he left an inventory of his own at Barbacena.
  [OPEN]

  - The full 1833 monte-mór — the land, any enslaved people and the partition itself, on
  folios beyond the six-page digitised set. [OPEN]

  - Whether the Fazenda Cascalhaes was held by sesmaria: SILB returns no Toledo or
  Ferreira sesmeiro in Minas Gerais, so if a grant exists it would be in the Registro de
  Sesmarias de Minas Gerais / Arquivo Público Mineiro. [OPEN — bounded negative]

  ## Sources held (this repository)

  - PAR-0018 (his 1783 Barbacena marriage — names both parent couples) · PAR-0019 (1787
  baptism of his son Ladisláo) · PAR-0020 (1812 marriage of daughter Anna Belizaria) ·
  PAR-0021 (1816 marriage of daughter Carolina Francelina — "Capitão João José") ·
  PAR-0023 (1810 Ladisláo × Mathilde marriage — records him "Capitão Joaquim José") ·
  PRB-0010 (1833 Barbacena inventory of his wife's estate — he is the widower and
  inventariante, signs his own name, declares her death and all thirteen children, and the
  estate is seated at the Fazenda Cascalhaes).

  ## Regional and migration context

  A Barbacena (Piedade da Borda do Campo) family seated at the Fazenda Cascalhaes; his own
  parents were of Vila Rica (Ouro Preto), the apparent origin of the "Ferreira de Toledo"
  surname. The move is the local expression of the gold-to-agriculture shift that took
  mining-district families into the farming Campo das Vertentes after ~1760. His wife's
  father had come the other way across the Atlantic, from São Martinho de Ruivães in the
  Archbishopric of Braga — so the household joined a Minas mining-district line to a Minho
  immigrant one, on highland farmland, in the last decades of the colony. [CONTEXTUAL]

  ## Where to go today

  - **Origin (morador na Villa Rica):** Basílica de N.S. do Pilar / Igreja de N.S. da
  Conceição de Antônio Dias, Ouro Preto, MG [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Praca%20Monsenhor%20Castilho%20Barbosa%2017%2C%20Ouro%20Preto%2C%20MG);
  his ~1750s–60s Villa Rica baptism (naming Gaspar × Gertrudes) → AEAM, Mariana [RESOLVED]
  ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Sao%20Pedro%20dos%20Clerigos%2C%20Mariana%2C%20MG)

  - **Marriage (15 Jan 1783):** Capela de N.S. da Glória, Barbacena, MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Capela%20Nossa%20Senhora%20da%20Gloria%2C%20Barbacena%2C%20MG)

  - **Family seat and the 1833 oath:** Fazenda Cascalhaes, Termo de Barbacena [UNLOCATED]
  — ask Barbacena historians; municipality anchor Barbacena, MG ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Assinou o próprio nome — "Joaq.m Jozé Ferr.a de Toledo" — ao pé do
  juramento que prestou como viúvo e inventariante do espólio da esposa, na Fazenda
  Cascalhaes, em 15 de julho de 1833 (PRB-0010). É o autógrafo mais antigo disponível de
  qualquer ancestral Toledo desta linha.

  - **[PROVEN]** O Juiz dos Órfãos de Barbacena deslocou-se até a Fazenda Cascalhaes para
  tomar esse juramento pessoalmente, levando consigo o escrivão. Os juízos iam aos homens
  de posição; os homens sem posição iam ao juízo.

  - **[CONTEXTUAL]** Um "Capitão" nas Companhias de Ordenanças coloniais era um posto de
  milícia honorífico e não remunerado — o distintivo local de condição livre, branca e
  proprietária nas Minas de fronteira, não um cargo assalariado. Seu valor econômico era o
  privilégio assentado sobre uma base fundiária transmissível, exatamente o contrário dos
  cargos policiais não transmissíveis da linha Armond posterior.

  - **[PROVEN]** A avaliação de 1833 de sua esposa abre com três tachos de cobre velhos,
  um caldeirão de ferro, uma balança de pesar, um tacho de ferro e dez foices usadas —
  subtotal corrente de 42$980. Os inventários brasileiros arrolavam os bens em ordem fixa,
  ouro e prata primeiro; uma lista que começa no cobre é uma lista sem baixela a declarar.

  - **[PROVEN]** Ele pediu ao juízo um *segundo* inventário. A petição de 1833 afirma que
  já se procedera a inventário e partilhas dos bens do casal, e requer outro, "com os
  mesmos louvados, ou com aquelles que elle Juiz nomeasse", a fim de não prejudicar os
  órfãos — a mais antiga ocorrência de um padrão que se repete por três gerações de
  espólios Toledo.

  - **[CONTEXTUAL]** Seus 13 filhos puseram em marcha o relógio da sucessão partível para
  toda a linha: a lei brasileira dividia os espólios igualmente entre todos os filhos, de
  modo que o patrimônio de Cascalhaes estava destinado a ser repartido em treze, e cada
  parte repartida de novo na geração seguinte.

  ## Identidade

  Forma preferencial **Joaquim José Ferreira de Toledo** — seu próprio casamento de 1783
  (PAR-0018), o batismo de 1787 de seu filho Ladisláo (PAR-0019), o casamento limpo e
  legível de 1810 de Ladisláo × Mathilde em São João del Rei (PAR-0023) e sua própria
  assinatura de 1833 (PRB-0010) dão todos "Joaquim" [PROVEN]. A forma "João José" está
  atestada apenas nos dois casamentos borrados das filhas (PAR-0020, 1812; PAR-0021, 1816)
  e é mantida como variante de fonte. Uma releitura direta das imagens (11 de agosto de
  2026) resolveu a questão em favor de Joaquim, superando a escolha anterior de "João
  José", que dera peso excessivo às duas leituras esmaecidas.

  - É o pai de Ladisláo Egídio Ferreira de Toledo (P-0056), portanto bisavô de Eliza
  Balbina de Toledo (P-0017) e trisavô materno de Aristão Ferreira Armond (P-0008).

  - **Casamento:** ⚭ Ritta Angélica Rodrigues (P-0058) na Capela de N.S. da Glória, filial
  da matriz de Barbacena, 15 de janeiro de 1783 (PAR-0018), família F-0028. Nasceu,
  portanto, por volta de 1755–1765 [INFERRED] e estava na casa dos setenta quando prestou
  o juramento de 1833.

  - **Origem:** PAR-0018 registra o noivo como "*morador na Villa Rica*" (Ouro Preto) à
  época do casamento de 1783 — residia, então, na Comarca de Vila Rica, ainda não
  estabelecido em Barbacena [LEAD — legibilidade moderada no fólio borrado de tinta].

  - **Óbito:** depois de 1º de julho de 1833 [PROVEN — é o viúvo vivo e inventariante do
  espólio de Rita nessa data, PRB-0010]. Nenhum registro de óbito está disponível.

  - **Pais:** Gaspar Ferreira e Gertrudes Maria [de Toledo], de Vila Rica (Ouro Preto),
  são nomeados em PAR-0018 — a aparente origem do sobrenome "Ferreira" + "de Toledo" da
  família — e estão modelados como P-0092 × P-0093 (família F-0045), com base em evidência
  forte. Nacionalidade brasileira.

  ## Posição social e profissão

  - **Capitão** [PROVEN] — capitania de milícia / ordenanças, tratado como "Capitão João
  José Ferreira de Toledo" no casamento de 1816 de sua filha Carolina Francelina
  (PAR-0021), "Capitão Joaquim José Ferreira de Toledo" no casamento de 1810 de Ladisláo ×
  Mathilde (PAR-0023) e "o Cap.m Joaquim José Ferreira de Toledo" ao longo dos autos de
  1833 (PRB-0010). O marcador de posição da família ao longo de cinquenta anos de
  registros.

  - **Sede: a Fazenda Cascalhaes, Termo de Barbacena** [PROVEN — PRB-0010]. O juramento e
  a avaliação de 1833 foram feitos na própria fazenda, com o juiz e o escrivão vindo da
  vila. As páginas disponíveis da avaliação cobrem apenas os móveis iniciais — tachos de
  cobre (20$800), um caldeirão de ferro (8$000), uma balança de pesar (2$500), um tacho de
  ferro (2$680) e dez foices usadas (9$000), subtotal corrente de 42$980 — as terras,
  eventuais pessoas escravizadas e o monte-mór estão em fólios fora do conjunto
  digitalizado.

  - **Letramento [PROVEN — assinou]** — seu autógrafo encerra o *termo de juramento* de
  1833 (PRB-0010 p.5), ao lado dos do juiz e dos dois louvados juramentados, o Capitão
  Simião Ferreira da Silva e o Alferes Domingos Jaime Ferreira de Castro.

  ## Família e rede social

  - Esposa: Ritta Angélica Rodrigues (P-0058), falecida em 9 de fevereiro de 1832,
  intestada. Filho confirmado: Ladisláo (P-0056, por seu batismo de 1787, PAR-0019, e como
  filho nº 1 do inventário de 1833). Filhas documentadas: Anna Belizaria (c.1812,
  PAR-0020) e Carolina Francelina (⚭ Vicente José da Cunha, c.1816, PAR-0021).

  - O inventário de 1833, em Barbacena, do espólio de Ritta (PRB-0010) enumera, na
  declaração juramentada do viúvo, os treze filhos do casal: (1) Ladisláo Egídio Ferreira
  (P-0056, nossa linha); (2) Maria (⚭ Manoel Pereira de Andrade); (3) Joaquim [Neuterio? —
  incerto]; (4) Lauriana (⚭ Francisco Pereira do Valle); (5) Anna (⚭ Antônio Dias Ladeira
  — a fonte a equipara à Anna Belizaria de PAR-0020); (6) Cândida (já falecida, ⚭ Vicente
  José de Ab[reu?] [incerto], deixando sete filhos menores órfãos de 3 a 13 anos); (7)
  Rita (⚭ Patrício Barroso); (8) Francisco; (9) José Anastácio; (10) Antônio Zeferino —
  que se casou com a própria sobrinha Maria Perpétua (filha de Ladisláo × Mathilde), o
  mais claro enlace endogâmico tio-sobrinha da linha; (11) João Rodrigues; (12) Venâncio
  do Nascimento; (13) Manoel Joaquim [PROVEN — PRB-0010]. Mapear a filha Carolina
  Francelina (PAR-0021) nessa lista de prenomes permanece [OPEN].

  - Os pares sociais do casal aparecem em quem o juízo empregava: os avaliadores do
  espólio de Rita eram eles próprios um Capitão e um Alferes do mesmo distrito, e seu
  filho casou-se com a filha de um Alferes. É uma vizinhança de postos de oficial
  casando-se e avaliando-se entre si.

  ## O que podemos extrapolar

  Uma família de Barbacena numerosa, proprietária e de oficialato miliciano — a elite
  rural das Minas do fim do período colonial, cuja posição permitiu à linha casar-se como
  par social com o espólio da Concórdia, e tornar-se herdeira numerada dele, uma geração
  depois. [INFERRED]

  - **Como a posição foi adquirida — cargo de milícia conquistado, não nobreza herdada**
  [INFERRED/CONTEXTUAL]. O "Capitão" é uma capitania de *milícia*: nas Minas coloniais, o
  distintivo local de condição livre, branca e proprietária e de autoridade de vizinhança,
  nomeado e conquistado por serviço de fronteira, não título hereditário. Nada está
  documentado sobre seu próprio pai, Gaspar Ferreira, além de um nome e uma residência em
  Villa Rica, de modo que, na evidência disponível, o posto aparece *nele*, e não acima
  dele. É a primeira ascensão documentada desta linha — e a ascensão tem uma geração de
  profundidade.

  - **O que a capitania PAGAVA — nada, e é esse o ponto** [CONTEXTUAL — baseado na
  função]. As Companhias de Ordenanças eram forças não remuneradas; capitão, alferes e
  sargento eram marcadores de status do Antigo Regime servidos *gratuitamente*, conferindo
  privilégio — autoridade local, isenções fiscais e militares, precedência — e não
  salário. A capitania, portanto, não punha salário algum na casa. Seu valor econômico era
  o privilégio assentado *sobre uma base fundiária transmissível*, a Fazenda Cascalhaes. O
  contraste agudo é com os cargos policiais não remunerados detidos um século depois por
  Simplício Armond, marido de sua bisneta Eliza: igualmente não pagos, mas apoiados em
  nenhuma terra hereditária. Aqui a honra reforçava o capital; lá, substituía-o.

  - **Mecânica da riqueza — a terra como ativo que transmite, e quão magro era o resto**
  [PROVEN os valores / INFERRED a leitura]. A abertura disponível da avaliação de 1833 é o
  ferramental de uma lavoura em funcionamento: tachos de cobre, um caldeirão de ferro, uma
  balança, foices, somando 42$980 nas primeiras entradas. Como os inventários brasileiros
  eram arrolados em ordem canônica, com ouro e prata primeiro, uma lista que *começa* no
  cobre é uma casa sem baixela a declarar. Trinta e quatro anos depois, o espólio da
  Concórdia de seu neto abre com um relógio de ouro (250$000) e uma dúzia de talheres de
  prata (180$000). Os móveis não são a fortuna em nenhum dos casos — mas a ordem das
  listas é uma medida legível de quanto a linha subiu entre 1833 e 1867, e de quão recente
  era essa subida.

  - **O relógio da herança partível começa aqui, e a aritmética é brutal** [PROVEN as
  contagens / CONTEXTUAL a lei]. A morte de Rita em 1832 pôs sua *meação* — metade do
  patrimônio do casal — em divisão entre treze estirpes. Isso é um vinte e seis avos da
  propriedade da casa por filho; e, como a filha falecida Cândida era representada por
  sete filhos menores, cada um desses netos tomava um sétimo de um treze avos de uma
  metade, cerca de uma parte em 182. Dezenove pretendentes estavam numa única divisão de
  1833, antes mesmo de se tocar na metade do próprio Joaquim José. Cada um de seus filhos
  sobreviventes teve depois famílias numerosas — só Ladisláo teve ao menos oito filhos. Em
  duas gerações o patrimônio do ápice é diluído em dezenas de frações. É esse o mecanismo
  que, três gerações adiante, deixa Eliza com uma modesta herança em dinheiro em vez de
  terra, e a razão pela qual a endogamia de primos e de tio-sobrinha da família se lê como
  contramedida deliberada.

  - **Nesta família, os espólios eram rotineiramente reabertos** [PROVEN]. Sua petição de
  1833 pede um *segundo* inventário sobre bens já inventariados e partilhados uma vez. Os
  espólios de seu filho e de seu neto repetem o padrão: a partilha de 1876 do espólio de
  Ladisláo foi anulada pela sentença dos embargos de 1882 e mandada refazer, e ainda se
  realizava uma audiência de partilha em 1889. A reabertura não é acidente de uma geração;
  é como se comporta um espólio partível com muitos herdeiros, e cada reabertura é paga
  pelo próprio espólio.

  - **A educação era uma compra, e aqui ela foi feita** [PROVEN a base / CONTEXTUAL a
  leitura]. Ele assinou o próprio nome em 1833; seu filho Ladisláo foi marcado como
  letrado no censo de 1839 [LEAD]; seu neto José Cezário registrou 200 alqueires sob a Lei
  de Terras; a esposa desse neto, Claudina, assinou as próprias declarações juramentadas.
  O letramento no Brasil imperial era competência comprada e ligada à classe, adquirida de
  novo para cada filho e de modo algum hereditária. Esta família a comprou com constância
  por quatro gerações — que é exatamente a razão pela qual sua eventual descida à economia
  urbana do salário levou outras quatro.

  - **Migração — o giro do ouro para a lavoura, feito por ele** [INFERRED / CONTEXTUAL].
  Seu pai é registrado como *morador* de Villa Rica; ele próprio é ali registrado em 1783
  e estabelecido numa fazenda de Barbacena em seguida. As lavras de Minas passaram do auge
  por volta de 1750 e as famílias do distrito mineiro deslocaram-se para o Campo das
  Vertentes agrícola ao longo do fim do século XVIII. É ele quem faz esse movimento nesta
  linha — convertendo uma parcela de uma economia extrativa em declínio em terra numa
  economia agrícola em ascensão. Nenhum registro declara sua razão.

  - **O arco, a partir daqui** [INFERRED]. Acima dele há apenas um nome em Villa Rica.
  Abaixo, a linha sobe por mais duas gerações — Ladisláo até a fronteira cafeeira, José
  Cezário até uma fazenda escravista de dezenove contos — e então cai: a Concórdia vendida
  em 1879–80, a abolição em 1888, e sua bisneta Eliza casando-se com um homem cuja posição
  eram cargos não remunerados. O ápice fica duas gerações depois dele; o mecanismo que o
  desfaz começa em sua própria casa, com treze filhos e uma lei partível.

