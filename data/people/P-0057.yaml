  ## Contexto regional e migratório

  Uma família de Barbacena (Piedade da Borda do Campo) com sede na Fazenda Cascalhaes;
  seus próprios pais eram de Vila Rica (Ouro Preto), a aparente origem do sobrenome
  "Ferreira de Toledo". O deslocamento é a expressão local do giro do ouro para a lavoura,
  que levou famílias do distrito mineiro ao Campo das Vertentes agrícola depois de ~1760.
  O pai de sua esposa fizera o caminho contrário através do Atlântico, vindo de São
  Martinho de Ruivães, no Arcebispado de Braga — de modo que a casa uniu uma linha do
  distrito mineiro de Minas a uma linha imigrante do Minho, em terra agrícola de planalto,
  nas últimas décadas da colônia. [CONTEXTUAL]

