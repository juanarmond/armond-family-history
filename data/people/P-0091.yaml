profile: >-
  ## Identity

  **Maria Fernandes**, of the lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Portuguese.

  - **Role:** mother of Joanna Gonçalves (P-0081), named (as wife of the late Domingos
  Gonçalves) in her daughter's 13 May 1716 Ruivais marriage (PAR-0036; family F-0044).
  [strong-evidence — see P-0081 for the identity basis]

  - **Birth, death, own parents:** unrecorded; living (a moradora of the lugar da quinta)
  at her daughter's 1716 marriage. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of her daughter — names her as the bride's mother).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de
  Braga), the origin parish of this branch; her grandson João Rodrigues Valle (P-0078)
  emigrated to Minas Gerais. [CONTEXTUAL]
