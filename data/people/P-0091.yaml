profile: >-
  ## Interesting facts

  - **[PROVEN]** Named as the bride's mother in her daughter Joanna's 1716 Ruivais marriage (PAR-0036) — a *moradora* of the lugar da quinta in São Martinho de Ruivais, and the only primary document attesting her.

  - **[PROVEN]** She was alive and still resident at the quinta in 1716 while her husband Domingos Gonçalves was already dead. She had kept the household on its holding through widowhood and was marrying a daughter out of it.

  - **[INFERRED]** Her marriage to Domingos Gonçalves does not appear in the Ruivais marriage register 1664–1706, which suggests she came from outside the parish and married in her own home church. That record, not yet found, is the only document that would name her parents and open the generation above the deepest reached on this branch.

  - **[CONTEXTUAL]** She is two generations above the emigrant João Rodrigues Valle (P-0078): her daughter Joanna married into the Rodrigues household, and Joanna's son crossed to Minas Gerais. The land-pressure conditions that produced that crossing were already defining her widowed life in Ruivais in 1716.

  ## Identity

  **Maria Fernandes**, of the lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguese. Mother of Joanna Gonçalves (P-0081) and so 4th-great-grandmother of Eliza Balbina de Toledo (P-0017) on the maternal Toledo line.

  - **Role:** named, as the wife of the late Domingos Gonçalves (P-0090), in her daughter's 13 May 1716 Ruivais marriage (PAR-0036; family F-0044). [strong-evidence — see P-0081 for the identity basis]

  - **Birth, death, own parents:** unrecorded; living, and a moradora of the lugar da quinta, at her daughter's 1716 marriage. [OPEN]

  ## Standing and profession

  - **Nothing is recorded in her own right** — no occupation, no property in her name, no act in which she is a party. [OPEN]

  - **Literacy — [UNCLASSIFIABLE]:** no signable held record; the 1716 rubrics belong to the celebrant and the witnesses.

  - **Her one documented attribute is her residence:** *moradora no lugar da quinta*, recorded as a widow. In these registers a widow's stated residence is the nearest thing to a statement of her standing. [PROVEN]

  ## Family and social network

  - **Husband:** Domingos Gonçalves (P-0090), already deceased by May 1716.

  - **Daughter:** Joanna Gonçalves (P-0081), who married João Rodrigues at Ruivais in 1716 and was the mother of the emigrant João Rodrigues Valle (P-0078).

  - **The wedding circle** — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo and "muitas mais testemunhas … todos desta dita freguezia" — is wholly local, and none of them can be tied to her specifically. [PROVEN for the names; no link to her documented]

  - **No kin of her own is named anywhere**, which is consistent with her having married into Ruivais from another parish. [INFERRED]

  ## What we can extrapolate

  - **A widow who keeps the lugar is a household that survived its own succession** [PROVEN / INFERRED]. When Domingos died, the quinta had to be divided — a widow's portion and the children's shares. That she is still recorded at the lugar in 1716 means the division did not dissolve the household. In a region where a widowed family could easily fall into service or dependency, holding the address is the measure of how far above the floor they were, and of how little above it.

  - **She married a daughter out of a divided estate** [CONTEXTUAL]. Joanna's marriage portion came from a holding already reduced once. Her grandson's emigration twelve years later is the next term in that sequence: a smallholding that has been split cannot be split again and still support anyone, so the surplus children leave.

  - **Her own origin is the wall this branch stops at** [INFERRED]. Everything upward from her runs through a marriage act that is not in the Ruivais book. The bounded negative is therefore not a gap in her life but the boundary of the archive: the deepest reach of the maternal Toledo line is set by which parish a woman happened to be born in around 1680.

  - **Nothing distinguishes her economically from her neighbours, and the record was never going to** [INFERRED / CONTEXTUAL]. She has no title, no trade, no property described beyond a lugar-name. Everything above is an inference about a *type* of Minho widow's household, drawn from regional history — not from anything documented about her personally. Education is not even a question here: rural Portugal had no schooling to offer and no use for it in a quinta.

  ## Open questions

  - **Her own parents and origin parish** [OPEN]. A page-by-page read of the Ruivães marriage register 1664–1706 (retrieval) did not find her marriage to Domingos Gonçalves, so the couple most likely married in her own out-of-parish home freguesia — where her parents would be named; a further retrieval sweep (September 2026) of the neighbouring Vieira do Minho parishes' marriages (Campos, Salamonde/São Gens, Ventosa, Cantelães) likewise did not find it, leaving the Montalegre/Barroso parishes across the Rabagão (Vila Real district, at the ADVR) as the highest-value unread lever. [LEAD]

  - Her birth and death, and any Ruivães óbito entry. [OPEN]

  - Her full child set — only the daughter Joanna is attested. [OPEN]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of her daughter — names her as the bride's mother).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de Braga), the origin parish of this branch; her grandson João Rodrigues Valle (P-0078) emigrated to Minas Gerais. [CONTEXTUAL] She is the non-emigrating Ruivães generation at the origin-end of that move: the Minho was Portugal's densest, most land-fragmented region — a smallholding minifúndio at ~96 inhabitants per km² by 1801 — whose surplus non-inheriting sons made it the single greatest source of 18th-century Portuguese emigration to Brazil, her grandson's crossing falling under the Provisão de 20 de março de 1720 passport regime. [CONTEXTUAL] Her own birth parish is probably not Ruivais and is not yet identified. [LEAD]

  ## Where to go today

  - **Her daughter Joana's marriage (1716):** Igreja de São Martinho de Ruivães, Vieira do Minho, Braga, Portugal (Av. de São Martinho 3896, 4850-341 Ruivães) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeada como mãe da noiva no casamento de sua filha Joanna em Ruivais, em 1716 (PAR-0036) — *moradora* do lugar da quinta, em São Martinho de Ruivais, e o único documento primário que a atesta.

  - **[PROVEN]** Estava viva e ainda residente na quinta em 1716, enquanto seu marido Domingos Gonçalves já havia morrido. Havia mantido a casa em sua posse durante a viuvez e casava uma filha a partir dela.

  - **[INFERRED]** Seu casamento com Domingos Gonçalves não aparece no registro de casamentos de Ruivais de 1664–1706, o que sugere que ela veio de fora da freguesia e se casou em sua própria igreja natal. Esse registro, ainda não encontrado, é o único documento que nomearia seus pais e abriria a geração acima da mais profunda alcançada neste ramo.

  - **[CONTEXTUAL]** Ela está duas gerações acima do emigrante João Rodrigues Valle (P-0078): sua filha Joanna casou-se com a casa Rodrigues, e o filho de Joanna atravessou para Minas Gerais. As condições de pressão fundiária que produziram essa travessia já definiam sua vida de viúva em Ruivais, em 1716.

  ## Identidade

  **Maria Fernandes**, do lugar da quinta, Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal. Portuguesa. Mãe de Joanna Gonçalves (P-0081) e, portanto, pentavó de Eliza Balbina de Toledo (P-0017) na linha materna Toledo.

  - **Papel:** nomeada, como mulher do falecido Domingos Gonçalves (P-0090), no casamento de sua filha, em 13 de maio de 1716, em Ruivais (PAR-0036; família F-0044). [evidência forte — ver P-0081 quanto à base de identidade]

  - **Nascimento, óbito, pais próprios:** sem registro; viva, e moradora do lugar da quinta, no casamento da filha em 1716. [OPEN]

  ## Posição social e profissão

  - **Nada está registrado em nome próprio** — nenhuma ocupação, nenhuma propriedade em seu nome, nenhum ato em que seja parte. [OPEN]

  - **Alfabetização — [UNCLASSIFIABLE]:** nenhum registro assinável disponível; as rubricas de 1716 pertencem ao celebrante e às testemunhas.

  - **Seu único atributo documentado é a residência:** *moradora no lugar da quinta*, registrada como viúva. Nesses registros, a residência declarada de uma viúva é o mais próximo que há de uma declaração de sua posição. [PROVEN]

  ## Família e rede social

  - **Marido:** Domingos Gonçalves (P-0090), já falecido em maio de 1716.

  - **Filha:** Joanna Gonçalves (P-0081), casada com João Rodrigues em Ruivais em 1716 e mãe do emigrante João Rodrigues Valle (P-0078).

  - **O círculo do casamento** — Duarte Dias, Domingos Afonso, Gregorio do Rego Macedo e "muitas mais testemunhas … todos desta dita freguezia" — é inteiramente local, e nenhum deles pode ser ligado especificamente a ela. [PROVEN quanto aos nomes; sem vínculo documentado com ela]

  - **Nenhum parente seu é nomeado em parte alguma**, o que é coerente com ter vindo casar-se em Ruivais a partir de outra freguesia. [INFERRED]

  ## O que podemos extrapolar

  - **Uma viúva que mantém o lugar é uma casa que sobreviveu à própria sucessão** [PROVEN / INFERRED]. Quando Domingos morreu, a quinta teve de ser dividida — a parte da viúva e as cotas dos filhos. Que ela ainda apareça no lugar em 1716 significa que a divisão não dissolveu a casa. Numa região em que uma família viúva podia facilmente cair em serviço ou dependência, manter o endereço é a medida de quanto estavam acima do piso — e de quão pouco acima dele.

  - **Ela casou uma filha a partir de um espólio já dividido** [CONTEXTUAL]. A parte de Joanna veio de uma posse já reduzida uma vez. A emigração do neto, doze anos depois, é o termo seguinte dessa sequência: uma pequena propriedade já repartida não pode ser repartida de novo e ainda sustentar alguém, de modo que os filhos excedentes partem.

  - **Sua própria origem é o muro em que este ramo para** [INFERRED]. Tudo acima dela passa por um ato de casamento que não está no livro de Ruivais. O negativo delimitado não é, portanto, uma lacuna em sua vida, mas o limite do arquivo: o alcance máximo da linha materna Toledo é definido pela freguesia em que uma mulher por acaso nasceu, por volta de 1680.

  - **Nada a distingue economicamente de seus vizinhos, e o registro jamais o faria** [INFERRED / CONTEXTUAL]. Não tem título, ofício nem propriedade descrita além de um nome de lugar. Tudo o que está acima é inferência sobre um *tipo* de casa de viúva minhota, extraída da história regional — não de algo documentado sobre ela pessoalmente. A educação nem sequer é uma questão aqui: o Portugal rural não tinha escolarização a oferecer nem utilidade para ela numa quinta.

  ## Questões em aberto

  - **Seus próprios pais e sua paróquia de origem** [OPEN]. Uma leitura página a página do registro de casamentos de Ruivães de 1664–1706 (recuperação) não encontrou seu casamento com Domingos Gonçalves, de modo que o casal provavelmente se casou em sua própria freguesia natal, fora da paróquia — onde seus pais seriam nomeados; uma nova varredura de recuperação (setembro de 2026) dos casamentos das freguesias vizinhas de Vieira do Minho (Campos, Salamonde/São Gens, Ventosa, Cantelães) também não o encontrou, deixando as freguesias de Montalegre/Barroso, do outro lado do Rabagão (distrito de Vila Real, no ADVR), como a alavanca não lida de maior valor. [LEAD]

  - Seu nascimento e óbito, e qualquer assento de óbito em Ruivães. [OPEN]

  - Seu conjunto completo de filhos — apenas a filha Joanna está atestada. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de sua filha — nomeia-a como mãe da noiva).

  ## Contexto regional e migratório

  Do lugar da quinta em São Martinho de Ruivais, terras altas do Minho (Arcebispado de Braga), a paróquia de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou para Minas Gerais. [CONTEXTUAL] É a geração não emigrante de Ruivães, na origem desse movimento: o Minho era a região mais densa e mais fragmentada em terra de Portugal — minifúndio de pequenas propriedades a ~96 habitantes por km² em 1801 —, cujos filhos excedentes não herdeiros fizeram dele a maior fonte isolada da emigração portuguesa setecentista para o Brasil, caindo a travessia de seu neto sob o regime de passaportes da Provisão de 20 de março de 1720. [CONTEXTUAL] Sua própria freguesia de nascimento provavelmente não é Ruivais e ainda não foi identificada. [LEAD]

  ## Onde ir hoje

  - **Casamento de sua filha Joana (1716):** Igreja de São Martinho de Ruivães, Vieira do Minho, Braga, Portugal (Av. de São Martinho 3896, 4850-341 Ruivães) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
