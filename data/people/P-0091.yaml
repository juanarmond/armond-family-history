profile: >-
  ## Identity

  **Maria Fernandes**, of the lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Portuguese.

  - **Role:** mother of Joanna Gonçalves (P-0081), named (as wife of the late Domingos
  Gonçalves) in her daughter's 13 May 1716 Ruivais marriage (PAR-0036; family F-0044).
  [strong-evidence — see P-0081 for the identity basis]

  - **Birth, death, own parents:** unrecorded; living (a moradora of the lugar da quinta)
  at her daughter's 1716 marriage. [OPEN] A page-by-page read of the Ruivães marriage register
  1664–1706 (retrieval) did not find her marriage to Domingos Gonçalves, so the couple most
  likely married in her own out-of-parish home freguesia — where her parents (the generation
  above) would be named. [LEAD]

  ## Sources held (this repository)

  - PAR-0036 (1716 Ruivais marriage of her daughter — names her as the bride's mother).

  ## Regional and migration context

  Of the lugar da quinta in São Martinho de Ruivais, Minho highlands (Arcebispado de
  Braga), the origin parish of this branch; her grandson João Rodrigues Valle (P-0078)
  emigrated to Minas Gerais. [CONTEXTUAL] She is the non-emigrating Ruivães generation at the
  origin-end of that move: the Minho was Portugal's densest, most land-fragmented region — a
  smallholding minifúndio at ~96 inhabitants per km² by 1801 — whose surplus non-inheriting
  sons made it the single greatest source of 18th-century Portuguese emigration to Brazil, her
  grandson's crossing falling under the Provisão de 20 de março de 1720 passport regime.
  [CONTEXTUAL]

  ## Where to go today

  - **Daughter Joana's marriage (1716):** Igreja de São Martinho de Ruivães, Vieira do Minho, Braga,
  Portugal (Av. de São Martinho 3896, 4850-341 Ruivães) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
profile_pt: >-
  ## Identidade

  **Maria Fernandes**, do lugar da quinta, Freguesia de São Martinho de Ruivais,
  Arcebispado de Braga, Portugal. Portuguesa.

  - **Papel:** mãe de Joanna Gonçalves (P-0081), nomeada (como mulher do falecido Domingos
  Gonçalves) no casamento de sua filha em 13 de maio de 1716 em Ruivais (PAR-0036; família
  F-0044). [evidência forte — ver P-0081 para a base da identidade]

  - **Nascimento, óbito, pais próprios:** sem registro; viva (moradora do lugar da quinta)
  ao casamento de sua filha em 1716. [OPEN] Uma leitura página a página do registro de
  casamentos de Ruivães de 1664–1706 (recuperação) não encontrou seu casamento com Domingos
  Gonçalves, de modo que o casal provavelmente se casou na freguesia de origem dela, fora da
  paróquia — onde seus pais (a geração acima) seriam nomeados. [LEAD]

  ## Fontes disponíveis (neste repositório)

  - PAR-0036 (casamento de 1716 em Ruivais de sua filha — nomeia-a como mãe da noiva).

  ## Contexto regional e migratório

  Do lugar da quinta em São Martinho de Ruivais, terras altas do Minho (Arcebispado de
  Braga), a paróquia de origem deste ramo; seu neto João Rodrigues Valle (P-0078) emigrou
  para Minas Gerais. [CONTEXTUAL] Ela é a geração não-emigrante de Ruivães na origem desse
  movimento: o Minho era a região mais densa e mais fragmentada em terra de Portugal — um
  minifúndio de pequenas propriedades, ~96 habitantes por km² em 1801 — cujos filhos excedentes
  não herdeiros fizeram dele a maior fonte isolada de emigração portuguesa setecentista para o
  Brasil, com a travessia de seu neto caindo sob o regime de passaportes da Provisão de 20 de
  março de 1720. [CONTEXTUAL]

  ## Onde ir hoje

  - **Casamento da filha Joana (1716):** Igreja de São Martinho de Ruivães, Vieira do Minho, Braga,
  Portugal (Av. de São Martinho 3896, 4850-341 Ruivães) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20S%C3%A3o%20Martinho%2C%20Ruiv%C3%A3es%2C%20Vieira%20do%20Minho%2C%20Portugal)
