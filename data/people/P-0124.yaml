notes:
- text: >-
    Mariana Fagundes: died 7 July 1684, S. Sebastião, Terceira (PUB-0004). Married Belchior
    da Ponte Cardoso at Santa Bárbara, 26 September 1650 (PAR-0086, PUB-0004, PUB-0005).
    Daughter of António Martins Fagundes (P-0127) × Catarina Machado de Faria (P-0128),
    family F-0064. Her own birth date and place are not given in the compilation; she died
    before her husband Belchior (d.26.6.1687), making her survival to 7.7.1684 consistent.
    The couple's son Gaspar de Souto-Maior (P-0092) was born 23.2.1657.
- text: >-
    Vol. IV and Vol. IX each cross-reference the other for this marriage. Vol. IV states
    "vid. SOUTO-MAIOR, § 5º, nº 5" and Vol. IX states "vid. FAGUNDES, § 6º, nº 7" —
    bilateral corroboration of the couple's identity in both family lines.
- text: >-
    Birth date unknown; not given in either compilation. She was alive for the 1650 marriage
    and died 1684. If her father António died 1664 and she was still alive, she was at minimum
    in her teens at the 1650 marriage (born approximately 1620s–1640s). [INFERRED from context]
profile: >-
  ## Interesting facts

  - **[COMPILED]** Mariana Fagundes married Belchior da Ponte Cardoso on 26 September 1650 at
  the church of Santa Bárbara — a marriage confirmed by both a primary parish image (PAR-0086)
  and bilateral cross-references in the Mendes Forjaz compilation (PUB-0004, PUB-0005).

  - **[COMPILED]** She died 7 July 1684 in S. Sebastião — about three years before her husband
  Belchior (d.26.6.1687).

  - **[COMPILED]** Her father António Martins Fagundes was a Capitão de ordenanças; her grandfather
  Pedro Lourenço Machado led 79 men in the 1642 assault on the Castelo de S. Filipe, Angra —
  a family with a documented military tradition across two generations.

  ## Identity

