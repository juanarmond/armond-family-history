profile: >-
  ## Interesting facts

  - **[PROVEN]** Her burial act is unusually specific about where she was put: "sepultura da fabrica, segunda fiada nona" — the ninth grave in the second row of the parish fabric's plots, *inside* the church (PAR-0089, São Sebastião óbitos O-1642-1696 p.0062). Burial within the church body was a paid privilege **[CONTEXTUAL]**, and it is the one status marker the record gives her in her own right.

  - **[PROVEN]** She appears in eight held parish images, and the scribes vary her name: "Mariana Fagundes" (1650 marriage margin, 1652, 1654, 1664 and her own burial), "mariana Fagunda" (1651, ending **[uncertain]**), "marian[a/e] Fg.des" (1656, surname abbreviated) and "marianna Fagundes" (1666). [Corrected 2026-10-08 on direct image re-reads: earlier versions gave "Fagueda", "Faguedes" and, for 1656, "morsarana", and counted nine images including PAR-0094, which is another family's baptism.] [Added 2026-10-10: a ninth held image now names her — her son Gaspar's 1657 baptism (PAR-0099), as "mariana Fag.des".]

  - **[PROVEN]** The vicar who buried her on 7 July 1684 signs as **Antônio Coelho Sotomayor**. **[INFERRED]** That is, very probably, her husband's own brother — Mendes Forjaz makes an António Coelho Souto-Maior *padre vigário* of the Matriz de São Sebastião until his death in 1686 **[COMPILED]**. Her son baptised in 1654 carries the same name.

  - **[PROVEN]** She died 7 July 1684, almost exactly three years before her husband (26 June 1687). Both burial acts survive in the same register.

  - **[PROVEN]** Her parents are named by the register, not only by the genealogists. Her 1650 marriage act reads "…com **Mariana Fagunda filha do** [one word illegible] **Ant.º Machado e de sua m[ulhe]r C.ta Machada**…" (PAR-0086, image 0072). The clause was read at magnification on 24 September 2026 from an image the archive had already held for two days — the parentage was never missing, only unread. It is the deepest point in this Terceira trunk where a primary document, rather than a compilation, states who someone's parents were.

  - **[COMPILED]** Her brother Manuel Machado is recorded in Vol. IV with no further detail than "**que saiu da Terceira**" — he left the island. A documented departure inside her own sibling set, two generations before the Brazilian move that family tradition ascribes to her grandson's line **[LEAD]**.

  - **[INFERRED]** Her birth date is nowhere recorded, but it is bracketed: she married in 1650 and bore a documented child in 1666, so she was born roughly **c.1625–1632** — not much before 1620 (or she would have been unusually old at the 1666 baptism) and not after about 1632 (or unusually young at the 1650 marriage).

  ## Identity

  **Mariana Fagundes** — died and was buried 7 July 1684, São Sebastião, Terceira **[PROVEN, PAR-0089]**; married **Belchior da Ponte Cardoso** (P-0123) on 26 September 1650 at Santa Bárbara **[PROVEN, PAR-0086]**; family F-0062. Her burial act identifies her only as "Mariana Fagundes m.er do Alf.es Balchior de Ponte" — wife of the Alferes Belchior da Ponte (re-read 2026-10-08; earlier misread "M° Balchion de Ponte"). Daughter of **António Martins Fagundes** (P-0127) and **Catarina Machado de Faria** (P-0128), family F-0064 — **[PROVEN, PAR-0086]**: her own marriage act names both parents, "filha do [illegible] **Ant.º Machado** e de sua m[ulhe]r **C.ta [Cat(arin)a] Machada**". Mendes Forjaz Vol. IV § 6º, which gives the same couple under their fuller names, is thereby **confirmed at primary level — confirmed, not replaced**.

  - **Birth:** unknown; inferred **c.1625–1632** (see above). No baptism located — and, at present, none locatable: see Open questions.
  - **Nationality:** Portuguese (born in the Azores, Crown territory)
  - **Occupation:** none recorded. The registers name her as daughter, wife and mother and nothing else.

  **Place in the archive [corrected 2026-10-10].** Mariana is **not a proven ancestor** of the archive's owner. She belongs to the **Terceira Armond trunk** as the mother of Gaspar de Souto Maior (P-0131), whose own baptism of 23 December 1657 names her "mariana Fag.des" **[PROVEN, PAR-0099]**. Family tradition — Lacerda's 2010 thesis (PUB-0002, ff. 55–56), following a private 2008 typescript by Paulo Ribeiro Luz and the 1751 will it quotes — makes that Gaspar the father of Francisco Ferreira Armonde (d. 1751), patriarch of the Ferreira Armonde of Barbacena, and so Mariana the patriarch's paternal grandmother **[LEAD]**; only the parents' names come from the will as quoted, the grandparents from the typescript. That family would attach to the owner only through the unknown parents of Simplício José Ferreira Armond (P-0016) **[OPEN]**. Neither link is proven. Until 10 October 2026 the tree ran this line instead through Gaspar Ferreira (P-0092) of Vila Rica, on the Toledo side, and counted Mariana as Geraldo Paz Armond's (P-0004) 5th-great-grandmother; that identification is rejected (owner's decision, 2026-10-10) — Gaspar de Souto Maior was baptised at São Sebastião in 1657 and died there on 2 December 1727 aged about seventy (PAR-0100), decades before Gaspar Ferreira's son was born at Vila Rica — and the degree is withdrawn.

  ## Standing and profession

  Nothing is recorded of her own work, property or literacy, and that silence is itself informative rather than accidental. Seventeenth-century Azorean parish registers record women through the men they belong to: her burial entry gives her husband's name but not her age, not her parents, not her birthplace **[PROVEN, PAR-0089]** — whereas her husband's entry gives his militia rank. Her father's and grandfather's ranks are known; hers, by definition, cannot be.

  Two things can be said with the documents in hand:

  - **She was of an officer household on both sides of the marriage [COMPILED].** Her father is recorded as *Capitão de ordenanças* and her paternal grandfather as the captain of a 79-man company; her husband was an *Alferes de ordenanças* **[PROVEN]**.
  - **The household could pay for a grave inside the church [PROVEN + CONTEXTUAL].** The "sepultura da fabrica" was the parish fabric's own plot, allotted for a fee. It is a means marker, not a nobility marker, and no held record grants this family arms or a title.

  ## Family and social network

  - **Parents [PROVEN, PAR-0086]:** the 1650 marriage act names them, in the register's own short forms, as **Ant.º Machado** and **C.ta [Cat(arin)a] Machada** — "e de sua m[ulhe]r", which also attests that the two were married. **[COMPILED, PUB-0004]** the same couple appear in Vol. IV as António Martins Fagundes (*ou* Machado Fagundes) and Catarina Machado de Faria, of Santa Bárbara; the fuller forms, his captaincy, his 1664 death and her LEMOS descent remain compiled. One word stands between "filha do" and her father's name — very likely a style or militia rank — and it is **not** readable at the held resolution.
  - **Siblings [COMPILED, PUB-0004 p.312]:** António Machado, *padre*; **Manuel Machado, "que saiu da Terceira"**; Margarida de Lemos Machado, who married André de Azedias, *alferes de ordenanças*, and died at Conceição on 15 June 1658 *com testamento*; Inês de Lemos Machado, married at Lajes 15 February 1669 to António Ferreira de Melo; Pedro Lourenço Machado, *alferes de ordenanças*, married at Lajes 17 November 1669; and Guilherme Vieira. Note the pattern: a priest, an emigrant, two daughters married to men of other parishes, and a brother carrying their grandfather's full name.
  - **Her own children:** nine listed by Mendes Forjaz **[COMPILED]**, six of them with held baptism images naming her as mother **[PROVEN]** — 1651, 1652, 1654, 1656, 1664 and 1666. The compiled Maria of ~1662 has no held baptism (PAR-0094 is another family's act; corrected 2026-10-08). Her last documented childbirth was at Isabel's baptism in September 1666, eighteen years before her death. [Added 2026-10-10: a seventh held baptism now names her as mother — her son Gaspar de Souto Maior's, 23 December 1657 (PAR-0099; P-0131).]
  - **Godparents at her children's baptisms [PROVEN, some reads uncertain]:** the Capitão André Coelho [?] Fagundes and Maria de Ponte (1651); the Padre André Machado and Ignes Machada (1652); Fr.co Cardozo de Ponte (1654); Ant.º Cardozo (1664); the Alferes Pedro Lourenço and Izabel de Souto (1666). Mostly from the husband's Ponte–Cardozo–Souto kindred, but the 1651 godfather carries her own surname, Fagundes — so her kin were not wholly absent **[INFERRED]**. [Corrected 2026-10-08: earlier read "Asceto André Coelho" and "[?] Cardos da Ponte", and described all godparents as the husband's kin.]
  - **Two parishes, one life [PROVEN].** Santa Bárbara holds her marriage; São Sebastião holds her children and her grave. That split is the documentary signature of a woman who married out of her home parish.

  ## What we can extrapolate

  **The marriage moved her across the island, and the records follow [INFERRED + CONTEXTUAL].** Marrying in the bride's parish and then living in the husband's was the norm; for Mariana it meant leaving Santa Bárbara for São Sebastião, at the other end of Terceira. Everything about her *before* 1650 therefore sits in a different archive series from everything after — which is exactly why her baptism has not been found and her death has.

  **Hers was the branch with the military rank, and it did not arrive as money [INFERRED + CONTEXTUAL].** Her father's captaincy and her grandfather's company are the highest offices anywhere in this Terceira cluster. But *ordenanças* commissions were unpaid local appointments **[CONTEXTUAL]**: they conferred precedence among the parish's principal householders and nothing transferable. If, as family tradition holds, this line's descendants reached Brazil as the Ferreira Armonde of Barbacena **[LEAD]**, they arrived with the habits and expectations of an officer family and none of its assets — the same pattern the documented Armond line in Brazil shows two centuries later.

  **A large surviving household on a full island [INFERRED + CONTEXTUAL].** Nine children of her own, and at least seven siblings in her father's house. Terceira's land was finite and long divided; entail (*morgadio*) held estates on eldest sons while the rest had the Church, the militia, marriage or departure. Her own siblings demonstrate every one of those exits, including the bare compiled line "que saiu da Terceira" **[COMPILED]**. If the family tradition holds, the Azorean emigration that carried a grandson of hers to Minas Gerais was not an event that happened *to* the family from outside; it was the continuation of a dispersal already visible in her generation.

  **What the silence does not license.** "Fagundes", "Machado" and "de Faria" are not evidence of origin or rank, and nothing here should be read as nobility. Her mother's line is cross-referenced by the compiler to a LEMOS section we have never read; until it is read, that half of her ancestry is a citation, not a finding.

  ## Open questions

  - **Her baptism cannot currently be located — a bounded negative, not an absence.** The 2026-09-23 Culturacores probe established that **no Santa Bárbara baptism book covering 1610–1650 is on the CDN**: more than 50 candidate book identifiers were tested and all returned HTTP 404; the only accessible baptism book for the parish in the period is TER-AH-SANTABARBARA-B-1600-1610, which predates her. Her entry therefore falls in a digitisation gap. This proves nothing about the physical register at BPAR Angra, which should be requested directly.
  - **Her exact birth date and age at marriage** remain unknown; the c.1625–1632 window above is inference, not record.
  - **Her parentage is CLOSED, not open — resolved 2026-09-24.** This entry previously asked for a BPAR rescan to move her parentage from compiled to proven. That request is withdrawn: the filiation clause was legible in the image already held, and PAR-0086 now carries the reading. The residual unknowns in that clause are minor and do not touch the parentage — one illegible word before her father's name, and the torn place-name that follows her mother's.
  - **Nothing is known of her parents' own lives from any record.** PAR-0086 proves who they were; it says nothing about when either was born, married or died. Their own vital records remain unlocated.
  - **Her mother's line is unread.** Vol. IV sends Catarina Machado de Faria to "LEMOS, § 3º, nº 5"; that section was not located in the nine volumes covered by the 2026-09-23 full-corpus search.
  - **A surname-level negative worth recording.** The Santa Bárbara *casamentos* book C-1560-1606 was read in full (all 169 pages) and yielded **no confirmed Fagundes entry** across 1560–1606, and the Santa Bárbara baptisms 1600–1610 yielded none either (one "Bárbora F[agun?]andes" reading is explicitly uncertain between Fagundes and Fernandes). Since Vol. IV places her grandfather's family in that parish from the 1590s, this is most likely a legibility and indexing limit rather than a real absence — it must not be read as proof that the family was not there.
  - **The "two Gaspars" question — RESOLVED 2026-10-10: two men.** Vol. IX lists one Gaspar for her and Belchior: Gaspar de Souto-Maior, baptised at São Sebastião (it prints 23 February 1657; his own act, PAR-0099, reads 23 December 1657) and died 2 December 1727 — the book prints no place of death — who married D. Margarida Machado in 1690 and, secondly, Maria Mendes de Borba at São Sebastião in 1694, with three children baptised there in 1698–1701 **[COMPILED]**. His death act, now held, records that death at São Sebastião, "de idade de setenta annos", "casado com Maria Mendes" **[PROVEN, PAR-0100]**: he lived and died on Terceira. The Brazilian Gaspar Ferreira (P-0092), placed at Villa Rica by his son's recorded birth and baptism there, with that son marrying in 1783, is therefore a different man; the owner rejected the identification on 10 October 2026, and Gaspar de Souto Maior is now P-0131. What stays open is the family tradition that makes him the father of the Barbacena patriarch Francisco Ferreira Armonde (PUB-0002, ff. 55–56) **[LEAD]**, and whether Simplício José Ferreira Armond (P-0016) descends from that family at all **[OPEN]**.
  - **The compiled Maria of ~1662 is unattested by any held image.** PAR-0094, once read as naming Mariana as her mother, does not: its legible "Ant.º" entry is António, son of Gregório Cardozo (12 June 1662), and its facing-page "M[?]" entry is illegible. [Corrected 2026-10-08: earlier held as **[PROBABLE]**.]

  ## Sources held (this repository)

  - **PAR-0089** — her burial, São Sebastião, 7 July 1684 (O-1642-1696 p.0062): margin "Mariana / Fags"; body "…faleceo Mariana Fagundes m.er do Alf.es Balchior de Ponte" (re-read 2026-10-08; earlier misread "…de M° Balchion de Ponte"); grave "sepultura da fabrica segunda fiada nona"; officiant Vicar Antônio Coelho Sotomayor. *Primary.*
  - **PAR-0086** — her marriage, Santa Bárbara, 26 September 1650 (3 images). Besides the marriage itself, the act is **the proof of her parentage**: "filha do [illegible] Ant.º Machado e de sua m[ulhe]r C.ta Machada". *Primary; the leaf is torn and the officiant's formula and most of the witness list remain unread, but the filiation clause is legible.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0095 / 0096** — the baptisms of six of her children, 1651–1666, each naming her as mother. *Primary.* (PAR-0094, the pages probed for the compiled Maria of 1662, does not attest her.)
  - **PAR-0099** — the baptism of her son Gaspar de Souto Maior (P-0131), São Sebastião, 23 December 1657, naming her "mariana Fag.des". *Primary.* [Added 2026-10-10.]
  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: her parents, her death date, her marriage and her siblings. *Secondary, compiled — and, for the parentage specifically, now corroborated by PAR-0086 at primary level.*
  - **PUB-0005** — the same compilation, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: the 1650 marriage from her husband's side and the full list of their children. The two volumes cross-refer to each other for this marriage, which is why the couple's identity is firm even where the image is not.

  ## Regional and migration context

  **Santa Bárbara das Nove Ribeiras [CONTEXTUAL].** Her home parish sits on Terceira's western side, a rural *freguesia* of the Angra district, in an island economy of wheat, wine, *pastel* (woad) and shipbuilding timber, with Angra itself — city since 1534, seat of the Azores bishopric — serving as a mid-Atlantic port of call for the returning India and Brazil fleets.

  **A childhood in the Restoration [CONTEXTUAL].** If she was born around 1625–1632, she was a child or young girl through the whole crisis: Portugal's break with Spain in December 1640, Terceira's immediate adherence, and the eleven-month blockade of the Castilian garrison in the Castelo de São Filipe above Angra, which capitulated on 4 March 1642. The besieging force was drawn from the *ordenanças* of Terceira and the other islands — the same militia in which her grandfather is credited with a company of 79 men **[COMPILED]** and her future husband held an ensign's commission **[PROVEN]**. Her marriage in 1650 came eight years into a restored kingdom.

  **Departure as a family habit [COMPILED + CONTEXTUAL].** Azorean emigration is usually told as an 18th-century story — the Minas gold rush from 1697, the Crown's 1720 passport controls. But one of her own brothers is recorded leaving Terceira in the 17th century, with no destination given. The push factors were already in place in her lifetime: a finite island, entailed estates passing intact to eldest sons, and recurrent seismic shock. If the family tradition holds, a grandson's move to Minas Gerais is the same pressure finding a bigger outlet **[LEAD]**. The **casais açorianos** Crown scheme (1748–1756, aimed at southern Brazil) is later and unrelated to this family's route.

  ## Where to go today

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — her home parish, where she married on 26 September 1650 and where her baptism was almost certainly recorded in a book that is not yet digitised. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — where she baptised her children between 1651 and 1666 and where she was buried inside the church in 1684. [RESOLVED — parish] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — the place to request the Santa Bárbara baptism register for 1610–1650 that is missing from the Culturacores CDN, and a higher-resolution copy of the 1650 marriage act. · [Maps](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** O assento de óbito é invulgarmente preciso quanto ao lugar em que foi sepultada: "sepultura da fabrica, segunda fiada nona" — a nona cova da segunda fiada das sepulturas da fábrica da paróquia, *dentro* da igreja (PAR-0089, óbitos de São Sebastião O-1642-1696 p.0062). A sepultura no corpo da igreja era privilégio pago **[CONTEXTUAL]**, e é o único marcador de posição que o registo lhe dá em nome próprio.

  - **[PROVEN]** Aparece em oito imagens paroquiais disponíveis, e os escrivães variam o nome dela: "Mariana Fagundes" (margem do casamento de 1650, 1652, 1654, 1664 e o próprio óbito), "mariana Fagunda" (1651, terminação **[incerta]**), "marian[a/e] Fg.des" (1656, apelido abreviado) e "marianna Fagundes" (1666). [Corrigido em 2026-10-08 após releitura direta das imagens: versões anteriores davam "Fagueda", "Faguedes" e, para 1656, "morsarana", e contavam nove imagens incluindo o PAR-0094, que é o baptismo de outra família.] [Acrescentado em 2026-10-10: uma nona imagem disponível nomeia-a agora — o baptismo do filho Gaspar, de 1657 (PAR-0099), como "mariana Fag.des".]

  - **[PROVEN]** O vigário que a sepultou a 7 de julho de 1684 assina **Antônio Coelho Sotomayor**. **[INFERRED]** Muito provavelmente é o próprio irmão do marido — Mendes Forjaz faz de um António Coelho Souto-Maior *padre vigário* da Matriz de São Sebastião até à sua morte, em 1686 **[COMPILED]**. O filho dela baptizado em 1654 leva o mesmo nome.

  - **[PROVEN]** Morreu a 7 de julho de 1684, quase exactamente três anos antes do marido (26 de junho de 1687). Os dois assentos de óbito sobrevivem no mesmo livro.

  - **[PROVEN]** Os pais dela são nomeados pelo livro paroquial, e não apenas pelos genealogistas. O assento de casamento de 1650 lê "…com **Mariana Fagunda filha do** [uma palavra ilegível] **Ant.º Machado e de sua m[ulhe]r C.ta Machada**…" (PAR-0086, imagem 0072). A cláusula foi lida com ampliação a 24 de setembro de 2026, a partir de uma imagem que o arquivo já tinha havia dois dias — a filiação nunca esteve em falta, apenas por ler. É o ponto mais fundo deste tronco terceirense em que um documento primário, e não uma compilação, declara de quem alguém é filho.

  - **[COMPILED]** O irmão Manuel Machado está registado no Vol. IV sem outro detalhe além de "**que saiu da Terceira**" — deixou a ilha. Uma partida documentada dentro do seu próprio conjunto de irmãos, duas gerações antes da mudança para o Brasil que a tradição familiar atribui à linha do neto **[LEAD]**.

  - **[INFERRED]** A data de nascimento não está registada em lado nenhum, mas está balizada: casou em 1650 e teve um filho documentado em 1666, pelo que terá nascido por volta de **c.1625–1632** — não muito antes de 1620 (ou teria idade invulgar no baptismo de 1666) e não depois de cerca de 1632 (ou seria invulgarmente nova no casamento de 1650).

  ## Identidade

  **Mariana Fagundes** — falecida e sepultada a 7 de julho de 1684, São Sebastião, Terceira **[PROVEN, PAR-0089]**; casou com **Belchior da Ponte Cardoso** (P-0123) a 26 de setembro de 1650, em Santa Bárbara **[PROVEN, PAR-0086]**; família F-0062. O assento de óbito identifica-a apenas como "Mariana Fagundes m.er do Alf.es Balchior de Ponte" — mulher do Alferes Belchior da Ponte (relido em 2026-10-08; antes lido "M° Balchion de Ponte"). Filha de **António Martins Fagundes** (P-0127) e **Catarina Machado de Faria** (P-0128), família F-0064 — **[PROVEN, PAR-0086]**: o próprio assento de casamento nomeia os dois, "filha do [ilegível] **Ant.º Machado** e de sua m[ulhe]r **C.ta [Cat(arin)a] Machada**". Mendes Forjaz, Vol. IV § 6º, que dá o mesmo casal com os nomes mais extensos, fica assim **confirmado ao nível primário — confirmado, não substituído**.

  - **Nascimento:** desconhecido; inferido **c.1625–1632** (ver acima). Nenhum baptismo localizado — e, de momento, não localizável: ver Questões em aberto.
  - **Nacionalidade:** portuguesa (nascida nos Açores, território da Coroa)
  - **Ocupação:** nenhuma registada. Os livros nomeiam-na como filha, mulher e mãe, e nada mais.

  **Lugar no arquivo [corrigido em 2026-10-10].** Mariana **não é ancestral provada** do proprietário do arquivo. Pertence ao **tronco Armond terceirense** como mãe de Gaspar de Souto Maior (P-0131), cujo próprio assento de baptismo, de 23 de dezembro de 1657, a nomeia "mariana Fag.des" **[PROVEN, PAR-0099]**. A tradição familiar — a tese de Lacerda de 2010 (PUB-0002, f. 55–56), seguindo um material genealógico digitado e particular de 2008, de Paulo Ribeiro Luz, e o testamento de 1751 que cita — faz desse Gaspar o pai de Francisco Ferreira Armonde (f. 1751), patriarca dos Ferreira Armonde de Barbacena, e portanto de Mariana a avó paterna do patriarca **[LEAD]**; só os nomes dos pais vêm do testamento citado, os avós vêm do material digitado. Essa família só se ligaria ao proprietário do arquivo pelos pais desconhecidos de Simplício José Ferreira Armond (P-0016) **[OPEN]**. Nenhum dos dois elos está provado. Até 10 de outubro de 2026 a árvore fazia passar esta linha, em vez disso, por Gaspar Ferreira (P-0092), de Vila Rica, do lado Toledo, e contava Mariana como 5.ª bisavó (*5th-great-grandmother*) de Geraldo Paz Armond (P-0004); essa identificação foi rejeitada (decisão do proprietário, 2026-10-10) — Gaspar de Souto Maior foi baptizado em São Sebastião em 1657 e ali faleceu a 2 de dezembro de 1727, com cerca de setenta anos (PAR-0100), décadas antes de o filho de Gaspar Ferreira nascer em Vila Rica — e o grau fica retirado.

  ## Posição social e profissão

  Nada se regista sobre trabalho, bens ou alfabetização dela, e esse silêncio é informativo, não acidental. Os registos paroquiais açorianos do século XVII inscrevem as mulheres através dos homens a que pertencem: o assento de óbito dá o nome do marido, mas não a idade dela, nem os pais, nem a naturalidade **[PROVEN, PAR-0089]** — enquanto o assento do marido dá a patente de milícia dele. Conhecem-se as patentes do pai e do avô dela; a dela, por definição, não pode existir.

  Duas coisas podem ser ditas com os documentos em mão:

  - **Pertencia a uma casa de oficiais dos dois lados do casamento [COMPILED].** O pai está registado como *Capitão de ordenanças* e o avô paterno como capitão de uma companhia de 79 homens; o marido era *Alferes de ordenanças* **[PROVEN]**.
  - **A casa podia pagar uma cova dentro da igreja [PROVEN + CONTEXTUAL].** A "sepultura da fabrica" era do próprio fabrico da paróquia, atribuída mediante pagamento. É marcador de meios, não de nobreza, e nenhum registo disponível concede armas ou título a esta família.

  ## Família e rede social

  - **Pais [PROVEN, PAR-0086]:** o assento de 1650 nomeia-os, nas formas curtas do próprio livro, como **Ant.º Machado** e **C.ta [Cat(arin)a] Machada** — "e de sua m[ulhe]r", o que atesta também que os dois eram casados. **[COMPILED, PUB-0004]** o mesmo casal aparece no Vol. IV como António Martins Fagundes (*ou* Machado Fagundes) e Catarina Machado de Faria, de Santa Bárbara; as formas mais extensas, a capitania dele, o óbito de 1664 e a descendência LEMOS dela continuam compilados. Entre "filha do" e o nome do pai há uma palavra — muito provavelmente um tratamento ou uma patente — que **não** é legível na resolução disponível.
  - **Irmãos [COMPILED, PUB-0004 p.312]:** António Machado, *padre*; **Manuel Machado, "que saiu da Terceira"**; Margarida de Lemos Machado, casada com André de Azedias, *alferes de ordenanças*, falecida na Conceição a 15 de junho de 1658 *com testamento*; Inês de Lemos Machado, casada nas Lajes a 15 de fevereiro de 1669 com António Ferreira de Melo; Pedro Lourenço Machado, *alferes de ordenanças*, casado nas Lajes a 17 de novembro de 1669; e Guilherme Vieira. Repare-se no padrão: um padre, um emigrante, duas filhas casadas com homens de outras freguesias e um irmão que leva o nome completo do avô.
  - **Os seus filhos:** nove listados por Mendes Forjaz **[COMPILED]**, seis deles com imagem de baptismo disponível nomeando-a como mãe **[PROVEN]** — 1651, 1652, 1654, 1656, 1664 e 1666. A Maria compilada de ~1662 não tem baptismo disponível (o PAR-0094 é assento de outra família; corrigido em 2026-10-08). O último parto documentado foi o baptismo de Isabel, em setembro de 1666, dezoito anos antes da sua morte. [Acrescentado em 2026-10-10: um sétimo baptismo disponível nomeia-a agora como mãe — o do filho Gaspar de Souto Maior, de 23 de dezembro de 1657 (PAR-0099; P-0131).]
  - **Padrinhos dos filhos [PROVEN, algumas leituras incertas]:** o Capitão André Coelho [?] Fagundes e Maria de Ponte (1651); o Padre André Machado e Ignes Machada (1652); Fr.co Cardozo de Ponte (1654); Ant.º Cardozo (1664); o Alferes Pedro Lourenço e Izabel de Souto (1666). Sobretudo da parentela Ponte–Cardozo–Souto do marido, mas o padrinho de 1651 leva o apelido dela, Fagundes — a parentela dela não estava de todo ausente **[INFERRED]**. [Corrigido em 2026-10-08: antes lidos "Asceto André Coelho" e "[?] Cardos da Ponte", e todos os padrinhos descritos como parentes do marido.]
  - **Duas freguesias, uma vida [PROVEN].** Santa Bárbara guarda o casamento; São Sebastião guarda os filhos e a sepultura. Essa divisão é a assinatura documental de uma mulher que casou fora da sua freguesia de origem.

  ## O que podemos extrapolar

  **O casamento levou-a para o outro lado da ilha, e os registos acompanham-na [INFERRED + CONTEXTUAL].** Casar na freguesia da noiva e viver depois na do marido era a norma; para Mariana significou deixar Santa Bárbara por São Sebastião, no extremo oposto da Terceira. Tudo o que lhe diz respeito *antes* de 1650 está, portanto, noutra série de arquivo — razão exacta pela qual o baptismo não foi encontrado e o óbito foi.

  **O ramo dela é o da patente militar, e ela não chegou em dinheiro [INFERRED + CONTEXTUAL].** A capitania do pai e a companhia do avô são os mais altos cargos de todo este conjunto terceirense. Mas as patentes de *ordenanças* eram nomeações locais sem soldo **[CONTEXTUAL]**: conferiam precedência entre os principais moradores da freguesia e nada de transferível. Se, como diz a tradição familiar, os descendentes desta linha chegaram ao Brasil como os Ferreira Armonde de Barbacena **[LEAD]**, chegaram com os hábitos e as expectativas de uma família de oficiais e sem nenhum dos seus bens — o mesmo padrão que a linha Armond documentada no Brasil mostra dois séculos depois.

  **Uma casa numerosa numa ilha cheia [INFERRED + CONTEXTUAL].** Nove filhos seus e pelo menos sete irmãos na casa do pai. A terra da Terceira era finita e há muito repartida; o vínculo (*morgadio*) prendia bens aos primogénitos, enquanto aos restantes sobravam a Igreja, a milícia, o casamento ou a partida. Os seus próprios irmãos exemplificam todas essas saídas, incluindo a linha compilada seca "que saiu da Terceira" **[COMPILED]**. Se a tradição familiar se confirmar, a emigração açoriana que levou um neto seu às Minas Gerais não foi algo que acontecesse à família de fora; foi a continuação de uma dispersão já visível na geração dela.

  **O que o silêncio não autoriza.** "Fagundes", "Machado" e "de Faria" não são prova de origem nem de posição, e nada aqui deve ser lido como nobreza. A linha materna dela é remetida pelo compilador para uma secção LEMOS que nunca lemos; enquanto não for lida, essa metade da sua ascendência é uma citação, não um achado.

  ## Questões em aberto

  - **O baptismo dela não é hoje localizável — negativo delimitado, não ausência.** A sondagem Culturacores de 2026-09-23 estabeleceu que **nenhum livro de baptismos de Santa Bárbara cobrindo 1610–1650 está no CDN**: foram testados mais de 50 identificadores de livro candidatos e todos devolveram HTTP 404; o único livro de baptismos acessível da freguesia no período é TER-AH-SANTABARBARA-B-1600-1610, anterior a ela. O assento cai, portanto, numa lacuna de digitalização. Isto nada prova sobre o livro físico no BPAR de Angra, que deve ser pedido directamente.
  - **A data exacta de nascimento e a idade ao casar** continuam desconhecidas; a janela c.1625–1632 acima é inferência, não registo.
  - **A filiação está FECHADA, não em aberto — resolvida a 2026-09-24.** Esta entrada pedia antes uma nova digitalização do BPAR para passar a filiação de compilada a provada. O pedido é retirado: a cláusula de filiação estava legível na imagem já disponível, e o PAR-0086 já traz a leitura. O que resta por ler nessa cláusula é menor e não toca na filiação — uma palavra ilegível antes do nome do pai e o topónimo rasgado que segue o nome da mãe.
  - **Nada se sabe, por registo, da vida dos próprios pais.** O PAR-0086 prova quem eles eram; não diz quando nasceu, casou ou morreu qualquer um deles. Os registos vitais próprios continuam por localizar.
  - **A linha materna está por ler.** O Vol. IV remete Catarina Machado de Faria para "LEMOS, § 3º, nº 5"; essa secção não foi localizada nos nove volumes cobertos pela busca integral de 2026-09-23.
  - **Um negativo ao nível do apelido, que importa registar.** O livro de *casamentos* de Santa Bárbara C-1560-1606 foi lido integralmente (as 169 páginas) e não deu **nenhuma entrada Fagundes confirmada** entre 1560 e 1606; os baptismos de Santa Bárbara de 1600–1610 também não (uma leitura "Bárbora F[agun?]andes" é explicitamente incerta entre Fagundes e Fernandes). Como o Vol. IV coloca a família do avô nessa freguesia desde a década de 1590, trata-se muito provavelmente de um limite de legibilidade e de indexação, e não de uma ausência real — não deve ser lido como prova de que a família ali não estava.
  - **A questão dos "dois Gaspares" — RESOLVIDA em 2026-10-10: dois homens.** O Vol. IX lista um só Gaspar para ela e Belchior: Gaspar de Souto-Maior, baptizado em São Sebastião (imprime 23 de fevereiro de 1657; o próprio assento, PAR-0099, lê 23 de dezembro de 1657) e falecido a 2 de dezembro de 1727 — sem local impresso para o óbito —, que casou com D. Margarida Machado em 1690 e, em segundas núpcias, com Maria Mendes de Borba em São Sebastião em 1694, com três filhos ali baptizados em 1698–1701 **[COMPILED]**. O assento de óbito, agora disponível, regista essa morte em São Sebastião, "de idade de setenta annos", "casado com Maria Mendes" **[PROVEN, PAR-0100]**: viveu e morreu na Terceira. O Gaspar Ferreira brasileiro (P-0092), situado em Villa Rica pelo nascimento e baptismo ali registados do filho, que casou em 1783, é portanto outro homem; o proprietário rejeitou a identificação a 10 de outubro de 2026, e Gaspar de Souto Maior é agora P-0131. Fica em aberto a tradição familiar que o faz pai do patriarca de Barbacena Francisco Ferreira Armonde (PUB-0002, f. 55–56) **[LEAD]**, e se Simplício José Ferreira Armond (P-0016) descende de todo dessa família **[OPEN]**.
  - **A Maria compilada de ~1662 não é atestada por nenhuma imagem disponível.** O PAR-0094, antes lido como nomeando Mariana como mãe dela, não o faz: o seu assento legível "Ant.º" é de António, filho de Gregório Cardozo (12 de junho de 1662), e o assento "M[?]" da página fronteira é ilegível. [Corrigido em 2026-10-08: antes mantido como **[PROBABLE]**.]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0089** — o seu óbito, São Sebastião, 7 de julho de 1684 (O-1642-1696 p.0062): margem "Mariana / Fags"; corpo "…faleceo Mariana Fagundes m.er do Alf.es Balchior de Ponte" (relido em 2026-10-08; antes lido "…de M° Balchion de Ponte"); sepultura "da fabrica segunda fiada nona"; officiante o Vigário Antônio Coelho Sotomayor. *Primária.*
  - **PAR-0086** — o seu casamento, Santa Bárbara, 26 de setembro de 1650 (3 imagens). Além do casamento, o assento é **a prova da sua filiação**: "filha do [ilegível] Ant.º Machado e de sua m[ulhe]r C.ta Machada". *Primária; a folha está rasgada e a fórmula do celebrante e quase toda a lista de testemunhas ficam por ler, mas a cláusula de filiação está legível.*
  - **PAR-0090 / 0091 / 0092 / 0093 / 0095 / 0096** — os baptismos de seis dos seus filhos, 1651–1666, cada um nomeando-a como mãe. *Primárias.* (O PAR-0094, as páginas sondadas para a Maria compilada de 1662, não a atesta.)
  - **PAR-0099** — o baptismo do filho Gaspar de Souto Maior (P-0131), São Sebastião, 23 de dezembro de 1657, que a nomeia "mariana Fag.des". *Primária.* [Acrescentado em 2026-10-10.]
  - **PUB-0004** — Mendes Forjaz, *Genealogias da Ilha Terceira*, Vol. IV, FAGUNDES § 6º, pp. 312–313: os pais, a data de óbito, o casamento e os irmãos. *Secundária, compilada — e, quanto à filiação em concreto, agora corroborada pelo PAR-0086 ao nível primário.*
  - **PUB-0005** — a mesma compilação, Vol. IX, SOUTO-MAIOR § 1º, pp. 257–261: o casamento de 1650 pelo lado do marido e a lista completa dos filhos. Os dois volumes remetem um para o outro neste casamento, e é por isso que a identidade do casal é firme mesmo onde a imagem não é.

  ## Contexto regional e migratório

  **Santa Bárbara das Nove Ribeiras [CONTEXTUAL].** A freguesia de origem fica no lado ocidental da Terceira, rural, no distrito de Angra, numa economia insular de trigo, vinho, *pastel* e madeira de construção naval, com a própria Angra — cidade desde 1534, sede do bispado dos Açores — a servir de porto de escala do Atlântico médio para as armadas da Índia e do Brasil no regresso.

  **Uma infância na Restauração [CONTEXTUAL].** Se nasceu por volta de 1625–1632, atravessou toda a crise em criança ou rapariga: a ruptura de Portugal com Espanha em dezembro de 1640, a adesão imediata da Terceira e o cerco de onze meses à guarnição castelhana do Castelo de São Filipe, sobre Angra, que capitulou a 4 de março de 1642. A força sitiante saiu das *ordenanças* da Terceira e das outras ilhas — a mesma milícia em que o avô é creditado com uma companhia de 79 homens **[COMPILED]** e em que o futuro marido tinha patente de alferes **[PROVEN]**. O casamento, em 1650, deu-se oito anos depois de restaurado o reino.

  **A partida como hábito familiar [COMPILED + CONTEXTUAL].** A emigração açoriana costuma contar-se como história do século XVIII — o ouro das Minas a partir de 1697, o controlo de passaportes de 1720. Mas um dos seus irmãos está registado a deixar a Terceira ainda no século XVII, sem destino indicado. Os factores de pressão já existiam no tempo dela: ilha finita, bens vinculados a passar intactos aos primogénitos e choque sísmico recorrente. Se a tradição familiar se confirmar, a mudança de um neto para as Minas Gerais é a mesma pressão a encontrar escoadouro maior **[LEAD]**. O programa dos **casais açorianos** (1748–1756, dirigido ao sul do Brasil) é posterior e alheio ao caminho desta família.

  ## Onde ir hoje

  - **Igreja de Santa Bárbara, Santa Bárbara (Angra do Heroísmo), Terceira** — a sua freguesia de origem, onde casou a 26 de setembro de 1650 e onde o baptismo terá sido quase de certeza registado num livro ainda não digitalizado. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20de%20Santa%20B%C3%A1rbara%2C%20Terceira%2C%20A%C3%A7ores)
  - **Igreja Matriz de São Sebastião (Nossa Senhora da Graça), São Sebastião, Angra do Heroísmo, Terceira** — onde baptizou os filhos entre 1651 e 1666 e onde foi sepultada dentro da igreja, em 1684. [RESOLVIDO — freguesia] · [Mapa](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20S%C3%A3o%20Sebasti%C3%A3o%2C%20Terceira%2C%20A%C3%A7ores)
  - **Biblioteca Pública e Arquivo Regional de Angra do Heroísmo (BPAR)** — o lugar onde pedir o livro de baptismos de Santa Bárbara de 1610–1650 que falta no CDN da Culturacores, e uma cópia em maior resolução do assento de casamento de 1650. · [Mapa](https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20e%20Arquivo%20Regional%20de%20Angra%20do%20Hero%C3%ADsmo)
