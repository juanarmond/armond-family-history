notes:
- text: >-
    Mariana Fagundes: died 7 July 1684, S. Sebastião, Terceira (PAR-0089, PUB-0004). Married
    Belchior da Ponte Cardoso at Santa Bárbara, 26 September 1650 (PAR-0086, PUB-0004,
    PUB-0005). Daughter of António Martins Fagundes (P-0127) × Catarina Machado de Faria
    (P-0128), family F-0064 — [PROVEN, PAR-0086]: her own marriage act names her "filha do
    [illegible] Ant.º Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada". Her own birth date
    and place are not given in the compilation and no baptism is located; she died before her
    husband Belchior (d.26.6.1687). The couple's son Gaspar de Souto-Maior (P-0092) was born
    [corrected 2026-10-09: baptised — Vol. IX prints "b.", its abbreviation for baptised]
    23.2.1657. [Corrected 2026-10-10: Gaspar de Souto Maior is P-0131, not P-0092 — his
    identification with Gaspar Ferreira (P-0092) of Vila Rica is rejected (owner's decision);
    his own baptism, PAR-0099, is dated 23 December 1657 and names "mariana Fag.des" as his
    mother.]
- text: >-
    PARENTAGE PROVED, 2026-09-24 — supersedes the earlier "[COMPILED] / parentage unconfirmed"
    standing carried in this file. The filiation clause of PAR-0086 (Santa Bárbara casamentos,
    image 0072, held since 2026-09-22) was re-read under magnification and is legible:
    "…com Mariana Fagunda filha do [illegible] Ant.º Machado e de sua m[ulhe]r C.ta
    [Cat(arin)a] Machada de…". No new record was acquired. The earlier transcription's
    "Ant[ó]nio medado[?]" was a misreading of "Ant.º Machado", and the statement that her
    mother was "not visible in this image" was wrong. Mendes Forjaz Vol. IV § 6º is therefore
    CONFIRMED AT PRIMARY LEVEL for her parentage — confirmed, not replaced: the compiled
    fuller forms "António Martins Fagundes ou Machado Fagundes" and "Catarina Machado de
    Faria" name the same two people the register calls "Ant.º Machado" and "C.ta Machada".
    Everything the compilation adds beyond the parentage (his rank, his 1664 death, her LEMOS
    descent, her siblings) stays [COMPILED].
- text: >-
