profile_pt: >-
  ## Fatos interessantes

  - **[COMPILED]** Mariana Fagundes casou com Belchior da Ponte Cardoso em 26 de setembro de
  1650 na Igreja de Santa Bárbara — casamento confirmado por uma imagem primária paroquial
  (PAR-0086) e referências cruzadas bilaterais na compilação de Mendes Forjaz (PUB-0004, PUB-0005).

  - **[COMPILED]** Faleceu a 7 de julho de 1684 em S. Sebastião — cerca de três anos antes do
  marido Belchior (f.26.6.1687).

  - **[COMPILED]** Seu pai, António Martins Fagundes, era Capitão de ordenanças; o avô, Pedro
  Lourenço Machado, liderou 79 homens no assalto ao Castelo de S. Filipe, Angra, em 1642 —
  família com tradição militar documentada por duas gerações.

  ## Identidade

  **Mariana Fagundes** [COMPILED, nome via PUB-0004 e PUB-0005; confirmado em PAR-0086] —
  falecida a 7 de julho de 1684, S. Sebastião, Terceira. Filha de António Martins Fagundes
  (P-0127) × Catarina Machado de Faria (P-0128), família F-0064. Casou com Belchior da Ponte
  Cardoso (P-0123) a 26 de setembro de 1650 em Santa Bárbara; família F-0062.

