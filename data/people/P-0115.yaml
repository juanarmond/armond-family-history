profile: >-
  ## Interesting facts

  - **[PROVEN]** He is known from one word in one act: "defunto". His son's 1829 Nova Friburgo
  marriage names the groom "filho legitimo do **defunto** Joze Geggendorn e de sua mulher Maria
  Lutz" — so he was already dead on 20 July 1829, and that is the only fact about him that a
  held record supplies. (PAR-0073)

  - **[PROVEN]** The same act gives the family's origin, though through his son rather than
  through him: the groom was "nascido e baptizado na Freguezia de São Lucas [St. Lukas —
  uncertain], Cantão de Soleure". The household was Solothurn; where José Sr himself was born,
  the record does not say.

  - **[PROVEN]** Father and son carried the same name, which is why this entity is entered with
  the suffix "Sr". They are a genuine namesake pair in consecutive generations, not a duplicate
  — a distinction worth holding onto in a set of records that also spell the surname Geggendorn,
  Eggendorn, Eggendora, Heggendorn and Eckdorn.

  - **[LEAD]** A Nova Friburgo genealogy blog gives this couple as Joseph Heggendorn, born 21
  September 1765 at Grindel in Canton Solothurn, arrived on the *Heureux Voyage* in 1819 with
  house 71 / lot 92, and died on 2 April 1829 at Cabeceiras do Macaé. The April 1829 death would
  sit neatly three months before the marriage act calls him "defunto" — a good fit, and still an
  unverified blog attribution. Note also that its Grindel origin does not match the record's São
  Lucas.

  ## Identity

  **José Eggendorn Sr**, written **"Joze Geggendorn"** — the deceased father of the groom in the
  1829 Nova Friburgo marriage of José Eggendorn (P-0101). Iris Bohrer Muniz's (P-0007)
  3×-great-grandfather, by the chain José Eggendorn → Maria Thecla Regina Eggendorn (P-0071) →
  Valentim Martinho Bohrer (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN that he is named;
  degree derived from the family links]

  - **Named in one record:** PAR-0073, 20 July 1829, as the late husband of Maria Lutz and
  father of the groom; family F-0058. [PROVEN]

  - **Death:** before 20 July 1829. The blog date of 2 April 1829 at Cabeceiras do Macaé is a
  lead. [PROVEN for the bracket; LEAD for the date]

  - **Birth, origin, nationality:** not stated. The family's parish is given only through his
  son; his own origin is not separately recorded, so nationality is deliberately left unset.
  [OPEN by decision]

  ## Standing and profession

  Nothing whatever. He is named only as a dead man, a husband and a father. No occupation, no
  colonist status, no property, no signature. The 1829 act does not even say where he died.

  ## Family and social network

  The one relationship any held source gives him is the couple: José Eggendorn Sr and Maria Lutz
  (P-0116), parents of the José Eggendorn who married Anna Maria Frees at Nova Friburgo on 20
  July 1829. His wife is named in the same clause and is *not* marked deceased, so she outlived
  him — she was apparently alive when her son married. [PROVEN — PAR-0073]

  ## What we can extrapolate

  - **[CONTEXTUAL]** If the family came out of Canton Solothurn in the 1819–20 cohort — which
  the son's stated origin makes reasonable and no record confirms for the father — they left a
  small, land-constrained, mostly Catholic agricultural canton at the worst possible moment: the
  1816–17 harvest failures that followed the Tambora eruption, on top of post-Napoleonic
  impoverishment and too many heirs for too little arable land.

  - **[CONTEXTUAL]** Roughly a quarter of the 1819 emigrants died on the journey, of typhus and
  scurvy, and mortality stayed high in the colony's first years on stony highland lots with
  inadequate support. A first-generation colonist dead before his son's 1829 wedding is entirely
  ordinary. Saying more than that — that he died of the crossing, or on a lot, or at Cabeceiras
  do Macaé — would be filling a silence with a blog.

  - **[INFERRED]** His main value to this tree is structural: he is the point at which the
  Eggendorn line reaches a Swiss parish name at all. Resolving whether "São Lucas" is a real
  Solothurn parish, or a mishearing of something else, is what would turn this generation from a
  name into an origin.

  ## Open questions

  - His own birth, marriage, death and origin — nothing held beyond the single 1829 mention.
  [OPEN]

  - The conflict between the record's "São Lucas, Cantão de Soleure" and the blog's "Grindel,
  Soleure". Both cannot be right, and the record has priority; but "São Lucas" has not yet been
  matched to any Solothurn parish. [OPEN]

  - Whether the *Heureux Voyage* arrival and house 71 / lot 92 belong to this man. The colonist
  transcription for this surname records two Joseph Heggendorn households, and neither has been
  tied to this family. [LEAD]

  - His nationality, left unset on purpose because no held record states where he was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0073** — his son José Eggendorn's 1829 Nova Friburgo marriage to Anna Maria Frees; the
  sole held record naming him, as the deceased father of the groom and husband of Maria Lutz.

  ## Regional and migration context

  Canton Solothurn in north-west Switzerland was a small, predominantly Catholic,
  German-speaking agricultural canton whose Jura villages were poor and short of land.
  [CONTEXTUAL] Its people joined the Nova Friburgo emigration of 1819 under Dom João VI's decree
  of 16 May 1818 — a scheme nominally for 100 Fribourg families that ended up carrying some
  261–265 families from several cantons — travelling from Estavayer-le-Lac on 4 July 1819 via
  Basel and Rotterdam to the North Sea ports and on to Rio; the colony was raised to Vila de
  Nova Friburgo on 3 January 1820. [CONTEXTUAL] The family's presence there is established by
  the son, who was resident in the parish and married in it in 1829. [PROVEN]

  ## Where to go today

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where his
  son married in July 1829 and the only place any record connects to him. The present cathedral
  dates from 1869; the act belongs to the earlier church on the same site. [RESOLVED]

  - **Canton Solothurn — parish unresolved.** The record's "São Lucas" has not been matched to a
  Solothurn parish; the competing lead names Grindel, whose Kath. Pfarrkirche St. Stephan still
  stands at 4247 Grindel · [Maps](https://maps.google.com/?q=47.3833,7.5042). Visit it as the
  lead's candidate, not as a documented origin. [UNLOCATED]

  - **Cabeceiras do Macaé, Nova Friburgo district, RJ** — the reported place of his death in
  April 1829, on the blog attribution only. No held record places him there and no site can be
  fixed. [UNLOCATED]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele é conhecido por uma palavra num único ato: "defunto". O casamento do filho,
  em 1829, em Nova Friburgo, nomeia o noivo "filho legitimo do **defunto** Joze Geggendorn e de
  sua mulher Maria Lutz" — portanto já estava morto em 20 de julho de 1829, e esse é o único
  fato a seu respeito que um documento retido fornece. (PAR-0073)

  - **[PROVEN]** O mesmo ato dá a origem da família, ainda que pelo filho e não por ele: o noivo
  era "nascido e baptizado na Freguezia de São Lucas [St. Lukas — incerto], Cantão de Soleure".
  O domicílio era de Solothurn; onde nasceu o próprio José Sr, o registro não diz.

  - **[PROVEN]** Pai e filho levavam o mesmo nome, razão pela qual esta entidade é registrada
  com o sufixo "Sr". São um par de homônimos genuíno em gerações consecutivas, não uma duplicata
  — distinção que vale manter num conjunto de documentos que também grafa o sobrenome como
  Geggendorn, Eggendorn, Eggendora, Heggendorn e Eckdorn.

  - **[LEAD]** Um blog genealógico de Nova Friburgo identifica este casal como Joseph
  Heggendorn, nascido em 21 de setembro de 1765 em Grindel, no Cantão de Solothurn, chegado no
  *Heureux Voyage* em 1819 com casa 71 / lote 92, e falecido em 2 de abril de 1829 em Cabeceiras
  do Macaé. A morte em abril de 1829 cairia bem três meses antes de o assento de casamento
  chamá-lo "defunto" — bom encaixe, e ainda assim atribuição de blog não verificada. Note-se
  também que sua origem em Grindel não coincide com o São Lucas do registro.

  ## Identidade

  **José Eggendorn Sr**, grafado **"Joze Geggendorn"** — o pai falecido do noivo no casamento de
  1829, em Nova Friburgo, de José Eggendorn (P-0101). Tetravô de Iris Bohrer Muniz (P-0007),
  pela cadeia José Eggendorn → Maria Thecla Regina Eggendorn (P-0071) → Valentim Martinho Bohrer
  (P-0028) → João Gonçalves Bohrer (P-0014). [PROVEN que é nomeado; grau derivado dos vínculos
  familiares]

  - **Nomeado em um registro:** PAR-0073, 20 de julho de 1829, como falecido marido de Maria
  Lutz e pai do noivo; família F-0058. [PROVEN]

  - **Óbito:** antes de 20 de julho de 1829. A data de 2 de abril de 1829, em Cabeceiras do
  Macaé, do blog, é pista. [PROVEN quanto ao intervalo; LEAD quanto à data]

  - **Nascimento, origem e nacionalidade:** não declarados. A freguesia da família é dada apenas
  pelo filho; a origem dele próprio não é registrada em separado, de modo que a nacionalidade é
  deliberadamente deixada em aberto. [OPEN por decisão]

  ## Posição social e profissão

  Absolutamente nada. Ele é nomeado apenas como morto, marido e pai. Nenhuma ocupação, nenhum
  estatuto de colono, nenhuma propriedade, nenhuma assinatura. O assento de 1829 não diz sequer
  onde ele morreu.

  ## Família e rede social

  A única relação que alguma fonte retida lhe dá é o casal: José Eggendorn Sr e Maria Lutz
  (P-0116), pais do José Eggendorn que se casou com Anna Maria Frees em Nova Friburgo, em 20 de
  julho de 1829. Sua esposa é nomeada na mesma cláusula e *não* é marcada como falecida —
  portanto o sobreviveu e estava, ao que tudo indica, viva quando o filho se casou. [PROVEN —
  PAR-0073]

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** Se a família saiu do Cantão de Solothurn na coorte de 1819–20 — o que a
  origem declarada do filho torna razoável e nenhum registro confirma quanto ao pai —, deixou um
  cantão agrícola pequeno, de terra escassa e majoritariamente católico no pior momento
  possível: as quebras de safra de 1816–17 que se seguiram à erupção do Tambora, somadas ao
  empobrecimento pós-napoleônico e a herdeiros demais para pouca terra arável.

  - **[CONTEXTUAL]** Cerca de um quarto dos emigrantes de 1819 morreu na viagem, de tifo e
  escorbuto, e a mortalidade seguiu alta nos primeiros anos da colônia, em lotes serranos
  pedregosos e com apoio insuficiente. Um colono de primeira geração morto antes do casamento do
  filho, em 1829, é coisa inteiramente ordinária. Dizer mais do que isso — que morreu da
  travessia, ou num lote, ou em Cabeceiras do Macaé — seria preencher um silêncio com um blog.

  - **[INFERRED]** Seu principal valor para esta árvore é estrutural: é o ponto em que a linha
  Eggendorn alcança um nome de freguesia suíça. Resolver se "São Lucas" é uma paróquia real de
  Solothurn, ou a deformação auditiva de outra coisa, é o que transformaria esta geração de nome
  em origem.

  ## Questões em aberto

  - Seu próprio nascimento, casamento, óbito e origem — nada disponível além da única menção de
  1829. [OPEN]

  - O conflito entre o "São Lucas, Cantão de Soleure" do registro e o "Grindel, Soleure" do
  blog. Os dois não podem estar certos, e o registro tem prioridade; mas "São Lucas" ainda não
  foi identificado com nenhuma paróquia de Solothurn. [OPEN]

  - Se a chegada no *Heureux Voyage* e a casa 71 / lote 92 pertencem a este homem. A transcrição
  de colonos para este sobrenome registra dois domicílios Joseph Heggendorn, e nenhum foi
  vinculado a esta família. [LEAD]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0073** — casamento de 1829, em Nova Friburgo, do filho José Eggendorn com Anna Maria
  Frees; o único documento retido que o nomeia, como pai falecido do noivo e marido de Maria
  Lutz.

  ## Contexto regional e migratório

  O Cantão de Solothurn, no noroeste suíço, era um cantão agrícola pequeno, predominantemente
  católico e germanófono, cujas aldeias do Jura eram pobres e carentes de terra. [CONTEXTUAL]
  Sua gente aderiu à emigração para Nova Friburgo de 1819, sob o decreto de Dom João VI de 16 de
  maio de 1818 — programa nominalmente para 100 famílias friburguesas que acabou levando cerca
  de 261–265 famílias de vários cantões —, viajando de Estavayer-le-Lac em 4 de julho de 1819,
  via Basileia e Roterdã, rumo aos portos do Mar do Norte e daí ao Rio; a colônia foi elevada a
  Vila de Nova Friburgo em 3 de janeiro de 1820. [CONTEXTUAL] A presença da família ali é
  estabelecida pelo filho, morador da freguesia e nela casado em 1829. [PROVEN]

  ## Onde ir hoje

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde o
  filho se casou em julho de 1829, e o único lugar que algum documento conecta a ele. A catedral
  atual é de 1869; o ato pertence à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Cantão de Solothurn — freguesia não resolvida.** O "São Lucas" do registro não foi
  identificado com nenhuma paróquia de Solothurn; a pista concorrente nomeia Grindel, cuja Kath.
  Pfarrkirche St. Stephan continua de pé em 4247 Grindel ·
  [Mapa](https://maps.google.com/?q=47.3833,7.5042). Visite-a como candidata da pista, não como
  origem documentada. [UNLOCATED]

  - **Cabeceiras do Macaé, distrito de Nova Friburgo, RJ** — o lugar relatado de sua morte, em
  abril de 1829, apenas por atribuição de blog. Nenhum documento retido o situa ali e nenhum
  sítio pode ser fixado. [UNLOCATED]
