- text: >-
    Father of José Eggendorn (P-0101); named as the deceased "defunto Joze Geggendorn", husband of
    Maria Lutz, in his son's 1829 Nova Friburgo marriage (PAR-0073). His son was "nascido e
    baptizado na Freguezia de São Lucas [St. Lukas — uncertain], Cantão de Soleure" (Solothurn,
    Switzerland), so the family is of that Swiss parish; José Sr's own origin is not separately
    stated, so nationality is left unset. Already deceased by 1829. He shares the given name
    "José Eggendorn" with his son (P-0101); the preferred name here carries the "Sr" suffix to
    distinguish father from son — this is a genuine namesake, not a duplicate entity. The record
    spelling of the father is "Geggendorn" (the "Heggendorn" form is a blog spelling, below).
