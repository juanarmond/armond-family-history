profile: >-
  ## Identity

  **José Eggendorn** (also recorded Geggendorn) — known only as the deceased father of the groom
  in his son's 1829 Nova Friburgo marriage act. Named "defunto Joze Geggendorn," husband of Maria
  Lutz, already dead by July 1829 (PAR-0073, family F-0058). [STRONG-EVIDENCE] His son was born
  and baptised in the Freguesia de São Lucas, Cantão de Soleure (Solothurn, Switzerland),
  indicating a Solothurn family; his own origin is not separately stated in the record, so
  nationality is left unset.

  A Nova Friburgo genealogy blog (Raibert, Blogspot 2012) gives this couple as Joseph Heggendorn,
  born 21 September 1765 in Grindel, Cantão de Soleure, died 2 April 1829, arrived on the ship
  *Heureux Voyage* (1819), house 71 / lote 92. [LEAD — not promoted; birth and death dates
  unconfirmed by any held record]

  ## Open questions

  - His own birth, marriage, death, and origin records (no held primary — only his son's 1829
  marriage act names him). [OPEN]

  ## Sources held (this repository)

  - PAR-0073 (his son's 1829 Nova Friburgo marriage — the sole held record naming him, as the
  deceased father of the groom).
profile_pt: >-
  ## Identidade

  **José Eggendorn** (também registrado como Geggendorn) — conhecido apenas como pai falecido
  do noivo no assento de casamento de 1829 de Nova Friburgo. Nomeado "defunto Joze Geggendorn,"
  marido de Maria Lutz, já falecido em julho de 1829 (PAR-0073, família F-0058).
  [STRONG-EVIDENCE] Seu filho nasceu e foi baptizado na Freguesia de São Lucas, Cantão de Soleure
  (Solothurn, Suíça), indicando uma família de Solothurn; a própria origem de José Sr não é
  declarada separadamente no registo, pelo que a nacionalidade não é atribuída.

  Um blog genealógico de Nova Friburgo (Raibert, Blogspot 2012) identifica este casal como
  Joseph Heggendorn, nascido a 21 de setembro de 1765 em Grindel, Cantão de Soleure, falecido a
  2 de abril de 1829, chegado no navio *Heureux Voyage* (1819), casa 71 / lote 92. [LEAD — não
  promovido; datas de nascimento e óbito não confirmadas por nenhum documento retido]

  ## Questões em aberto

  - Seus registros de nascimento, casamento, óbito e origem (nenhuma fonte primária retida —
  apenas o assento de casamento do filho de 1829 o nomeia). [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0073 (casamento de 1829 do seu filho em Nova Friburgo — o único documento retido que
  o nomeia, como pai falecido do noivo).
