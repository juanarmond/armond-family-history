profile: >-
  ## Interesting facts

  - **[PROVEN]** She is named "anna Maria Borer" as the mother of Elisabetha in the 1760
  Erschwil baptism register (PAR-0028, church book #68) — the earliest dated woman on this
  Swiss branch, known from a single entry.

  - **[PROVEN]** She carries the same surname as her husband. Whether that is because she was
  born a Borer or because the clerk wrote her under her husband's name is **not determinable
  from the act**, and the profile does not resolve it. Either way it places the couple inside
  a very narrow marriage pool.

  - **[CONTEXTUAL]** Borer, Wehrli and Probst are the handful of surnames that recycle through
  the Thierstein Jura parishes generation after generation — endogamy that is itself a signal
  of land scarcity, since a closed marriage pool is what a district produces when nobody can
  afford to look further afield.

  - **[INFERRED]** Several women called "Anna Maria Borer" appear as mothers and godmothers on
  adjacent Erschwil and Grindel register pages in the same period. The name stock was as
  narrow as the marriage pool, which is why her identification rests entirely on the single
  entry naming her as Elisabetha's mother.

  - **[CONTEXTUAL]** She remained in Switzerland. It was her daughter Elisabetha's married
  line, via Johann Jacob Wehrli of Grindel, that reached Brazil in the 1819 Nova Friburgo
  recruitment — the ordinary generational split of that emigration, with parents staying and
  children crossing.

  ## Identity

  **Anna Maria Borer** (recorded *anna Maria Borer*). Of Erschwil (Erischwyg), Soleure
  (Solothurn), Switzerland; the earliest named Borer woman on this branch. Swiss.

  - **Marriage:** wife of Joseph Borer (P-0076) — [PROVEN] as the couple named at their
  daughter's 1760 baptism (PAR-0028, church book #68; family F-0037). **Her maiden surname is
  unknown**: she may have been born a Borer, making this a Borer × Borer union, or she may
  simply be recorded under her husband's name. [OPEN] No marriage record located.

  - **Birth, death, own parents:** not documented; no record held. [OPEN]

  ## Standing and profession

  Nothing is documented — no occupation, property, office, title or literacy. Unlike her
  husband, whose name carries the undeciphered "*fusemnistr*" tag, she is entered with no
  designation at all. That asymmetry within a single line of a single register is the whole of
  what the record says about the difference between a man's and a woman's recorded standing in
  this parish. [PROVEN for the marriage and the child; everything else OPEN]

  ## Family and social network

  - **Child (documented):** Elisabetha Borer (P-0073, b. 17 June 1760), who married Johann
  Jacob Wehrli at Grindel in 1782 and became the Wehrli matriarch of the Nova Friburgo line —
  so she is the great-grandmother of the immigrant matriarch Anna Maria Werhly (P-0069).
  [PROVEN — PAR-0028] A FamilySearch collaborative tree instead gives Elisabetha's mother as
  Elisabeth Borer (father Joannes Borer) — contradicted by the held baptism, which prevails;
  the tree pair is a navigation lead, not adopted [LEAD/contradicted].

  - **The godmother at her daughter's baptism** was "Mari Elisabth Borr" — another Borer
  woman, on a page where the godfather and both parents are Borers too. [PROVEN — PAR-0028]

  - **Namesake caution:** several women named Anna Maria Borer appear across the Grindel and
  Erschwil registers around 1760 as mothers and godmothers; our identification rests solely on
  the entry naming her as Elisabetha's mother. [PROVEN for that entry only]

  - She **did not emigrate**.

  ## What we can extrapolate

  - **The endogamy is the datum, and it points at scarcity [INFERRED / CONTEXTUAL].** Her
  probable Borer × Borer marriage, the Borer godparents on the same act, and the swarm of
  same-name Borer women across the neighbouring registers describe a small, heavily endogamous
  Catholic community in Erschwil. That is suggestive — not proof — that the Borer surname
  pervading this tree traces to one Solothurn stock. It is also an economic reading, not
  merely a genealogical one: marriage pools close when holdings are small and dowries are
  nothing, and the Thierstein Jura's subdivided smallholdings are exactly that condition.

  - **Standing: inherited position in a poor parish, with nothing attached [INFERRED].** She
  acquired nothing by office (women held none), nothing by trade, and nothing measurable by
  marriage — she married a man of the same surname and the same rung, whose own status marker
  is an unpaid village duty nobody has yet been able to read. Against the family's Armond
  line, where a bride could carry a landed inheritance quota into a marriage, this union
  transferred no capital in either direction.

  - **Partible division runs through her household in both directions [CONTEXTUAL].** Whatever
  the Erschwil holding was, Jura practice divided it among all heirs; and her daughter married
  into a Grindel farm subject to the same rule, which is the standing explanation for why that
  household emigrated in 1819 with nothing to carry. She is two generations above the
  emigration and already inside the mechanism that caused it.

  - **The record's silence about her is the class fact [INFERRED].** One line, as somebody's
  mother, with no designation where her husband has one: that is what an 18th-century Jura
  peasant woman leaves behind. Building more than this out of it would be invention, and the
  profile stops here deliberately.

  - **She is the Old-World floor of the line [CONTEXTUAL / INFERRED].** A Catholic Erschwil
  Borer household, never elite, with no fortune to lose — the bottom rung from which the whole
  Borer/Bohrer arc departs, and the structural mirror image of the family's Armond line, which
  began at an office-and-marriage elite and fell. Every later rise or fall on this side
  belongs to her descendants' generations, not hers.

  ## Open questions

  - Her **own parents and her marriage record** — the Erschwil registers (church book #68) and
  the Thierstein *Inventar- und Teilungen*, which would also determine whether her maiden
  surname really was Borer and might disambiguate the several Anna Maria Borers of the period.
  [OPEN]

  - Her **birth and burial** — unlocated; the same Erschwil books are the target. [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil Catholic baptism register, church book #68 — her daughter Elisabetha's
  1760 baptism, naming her as mother "anna Maria Borer"; sources event E-0069).

  ## Regional and migration context

  An Erschwil Borer of the Catholic Solothurn Jura — the Schwarzbubenland of the Thierstein
  district, poor, land-constrained farming country whose smallholdings were divided among
  heirs until the shares would not feed a household. [CONTEXTUAL] She stayed at the origin end
  of the branch; the family's emigration to Nova Friburgo belongs to a later generation
  (1819), driven by the 1816 "Year Without a Summer" famine and post-Napoleonic poverty and
  carried out under Dom João VI's *Decreto de 16 de maio de 1818* for 100 Swiss **Catholic**
  families. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (named as mother in the 1760 Erschwil baptism of her daughter Elisabetha;
  she did not emigrate):** Kath. Pfarrkirche St. Peter und Paul, 4228 Erschwil, Kt. Solothurn,
  Switzerland (GPS 47.3736, 7.5431) — still standing [RESOLVED as a place; her own records
  OPEN] · [Maps](https://maps.google.com/?q=47.3736,7.5431)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** É nomeada "anna Maria Borer" como mãe de Elisabetha no livro de batismos de
  Erschwil de 1760 (PAR-0028, livro paroquial nº 68) — a mulher datada mais antiga deste ramo
  suíço, conhecida por um único assento.

  - **[PROVEN]** Carrega o mesmo sobrenome do marido. Se isso se deve a ter nascido Borer ou a
  o escrivão a ter lançado sob o nome do marido **não é determinável pelo ato**, e o perfil
  não resolve a questão. De todo modo, situa o casal dentro de um repertório matrimonial muito
  estreito.

  - **[CONTEXTUAL]** Borer, Wehrli e Probst são o punhado de sobrenomes que se reciclam pelas
  paróquias do Jura de Thierstein geração após geração — endogamia que é, ela própria, sinal
  de escassez de terra, já que um repertório matrimonial fechado é o que um distrito produz
  quando ninguém pode se dar ao luxo de procurar mais longe.

  - **[INFERRED]** Várias mulheres chamadas "Anna Maria Borer" aparecem como mães e madrinhas
  em páginas vizinhas dos livros de Erschwil e de Grindel no mesmo período. O repertório de
  nomes era tão estreito quanto o matrimonial, razão pela qual sua identificação assenta
  inteiramente no único assento que a nomeia mãe de Elisabetha.

  - **[CONTEXTUAL]** Permaneceu na Suíça. Foi a linha casada de sua filha Elisabetha, via
  Johann Jacob Wehrli, de Grindel, que chegou ao Brasil no recrutamento de Nova Friburgo de
  1819 — a divisão geracional corriqueira daquela emigração, com pais ficando e filhos
  atravessando.

  ## Identidade

  **Anna Maria Borer** (registrada *anna Maria Borer*). De Erschwil (Erischwyg), Soleure
  (Solothurn), Suíça; a Borer nomeada mais antiga deste ramo. Suíça.

  - **Casamento:** esposa de Joseph Borer (P-0076) — [PROVEN] como o casal nomeado no batismo
  da filha, em 1760 (PAR-0028, livro paroquial nº 68; família F-0037). **Seu sobrenome de
  solteira é desconhecido**: pode ter nascido Borer, o que faria desta uma união Borer ×
  Borer, ou pode simplesmente estar registrada sob o nome do marido. [OPEN] Nenhum registro de
  casamento localizado.

  - **Nascimento, óbito, próprios pais:** não documentados; nenhum registro disponível. [OPEN]

  ## Posição social e profissão

  Nada está documentado — nenhuma ocupação, propriedade, cargo, título ou alfabetização.
  Diferentemente do marido, cujo nome carrega a etiqueta não decifrada "*fusemnistr*", ela é
  lançada sem designação alguma. Essa assimetria dentro de uma única linha de um único
  registro é tudo o que o documento diz sobre a diferença entre a posição registrada de um
  homem e a de uma mulher nesta paróquia. [PROVEN quanto ao casamento e à filha; todo o resto
  OPEN]

  ## Família e rede social

  - **Filha (documentada):** Elisabetha Borer (P-0073, n. 17 de junho de 1760), que se casou
  com Johann Jacob Wehrli em Grindel, em 1782, e se tornou a matriarca Wehrli da linha de Nova
  Friburgo — logo, é bisavó da matriarca imigrante Anna Maria Werhly (P-0069). [PROVEN —
  PAR-0028] Uma árvore colaborativa do FamilySearch dá, em vez disso, a mãe de Elisabetha como
  Elisabeth Borer (pai Joannes Borer) — contradito pelo batismo disponível, que prevalece; o
  par da árvore é pista de navegação, não adotado [LEAD/contradicted].

  - **A madrinha do batismo de sua filha** foi "Mari Elisabth Borr" — outra mulher Borer, numa
  página em que o padrinho e os dois pais também são Borer. [PROVEN — PAR-0028]

  - **Cautela com homônimas:** várias mulheres chamadas Anna Maria Borer aparecem nos livros
  de Grindel e de Erschwil por volta de 1760 como mães e madrinhas; nossa identificação
  assenta exclusivamente no assento que a nomeia mãe de Elisabetha. [PROVEN apenas para esse
  assento]

  - Ela **não emigrou**.

  ## O que podemos extrapolar

  - **A endogamia é o dado, e ela aponta para escassez [INFERRED / CONTEXTUAL].** Seu provável
  casamento Borer × Borer, os padrinhos Borer do mesmo ato e o enxame de mulheres Borer
  homônimas nos livros vizinhos descrevem uma comunidade católica pequena e fortemente
  endogâmica em Erschwil. Isso é sugestivo — não prova — de que o sobrenome Borer que permeia
  esta árvore remonta a um único tronco de Solothurn. É também uma leitura econômica, e não
  apenas genealógica: repertórios matrimoniais se fecham quando as posses são pequenas e os
  dotes são nada, e os minifúndios subdivididos do Jura de Thierstein são exatamente essa
  condição.

  - **Posição: lugar herdado numa paróquia pobre, sem nada anexo [INFERRED].** Não adquiriu
  nada por cargo (mulheres não os tinham), nada por ofício e nada mensurável por casamento —
  casou-se com um homem do mesmo sobrenome e do mesmo degrau, cujo próprio marcador de posição
  é um dever de aldeia não remunerado que ninguém conseguiu ainda ler. Contra a linha Armond
  da família, em que uma noiva podia levar ao casamento um quinhão de herança em terra, esta
  união não transferiu capital em direção alguma.

  - **A divisão partível atravessa seu domicílio nos dois sentidos [CONTEXTUAL].** Fosse qual
  fosse a posse de Erschwil, a prática do Jura a dividia entre todos os herdeiros; e sua filha
  casou-se numa lavoura de Grindel sujeita à mesma regra, que é a explicação corrente para
  aquele domicílio ter emigrado em 1819 sem nada a levar. Ela está duas gerações acima da
  emigração e já dentro do mecanismo que a causou.

  - **O silêncio do registro sobre ela é o fato de classe [INFERRED].** Uma linha, como mãe de
  alguém, sem designação onde o marido tem uma: é o que deixa atrás de si uma camponesa do
  Jura do século XVIII. Construir mais do que isso a partir daí seria invenção, e o perfil
  para aqui deliberadamente.

  - **Ela é o piso do Velho Mundo da linha [CONTEXTUAL / INFERRED].** Um domicílio Borer
  católico de Erschwil, nunca de elite, sem fortuna a perder — o degrau de base de onde parte
  todo o arco Borer/Bohrer, e a imagem espelhada estrutural da linha Armond da família, que
  partiu de uma elite de cargo e casamento e caiu. Toda subida ou queda posterior deste lado
  pertence às gerações de seus descendentes, não à dela.

  ## Questões em aberto

  - Seus **próprios pais e seu registro de casamento** — os livros de Erschwil (livro
  paroquial nº 68) e o *Inventar- und Teilungen* de Thierstein, que também determinariam se
  seu sobrenome de solteira era mesmo Borer e poderiam desambiguar as várias Anna Maria Borer
  do período. [OPEN]

  - Seu **nascimento e sepultamento** — não localizados; os mesmos livros de Erschwil são o
  alvo. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (livro de batismos católico de Erschwil, livro paroquial nº 68 — o batismo de
  1760 de sua filha Elisabetha, que a nomeia como mãe, "anna Maria Borer"; fundamenta o evento
  E-0069).

  ## Contexto regional e migratório

  Uma Borer de Erschwil, do Jura católico de Solothurn — o Schwarzbubenland do distrito de
  Thierstein, terra agrícola pobre e limitada, cujos minifúndios eram divididos entre
  herdeiros até os quinhões não alimentarem um domicílio. [CONTEXTUAL] Permaneceu na ponta de
  origem do ramo; a emigração da família para Nova Friburgo pertence a uma geração posterior
  (1819), impelida pela fome do "Ano Sem Verão" de 1816 e pela pobreza pós-napoleônica e
  realizada sob o *Decreto de 16 de maio de 1818* de Dom João VI para 100 famílias suíças
  **católicas**. [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia de origem (nomeada como mãe no batismo de 1760, em Erschwil, de sua filha
  Elisabetha; não emigrou):** Kath. Pfarrkirche St. Peter und Paul, 4228 Erschwil, Kt.
  Solothurn, Suíça (GPS 47.3736, 7.5431) — ainda de pé [RESOLVED quanto ao lugar; seus
  próprios registros OPEN] · [Maps](https://maps.google.com/?q=47.3736,7.5431)
