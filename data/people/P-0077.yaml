notes:
- text: >-
    Mother of Elisabetha Borer (P-0073). Confirmed as wife of Joseph Borer
    (P-0076) in the Erschwil Catholic parish baptism register (PAR-0028, church
    book #68). Her maiden surname is unknown — she may have been born a Borer
    (sharing the surname of her husband as well as the wider Borer kin network
    in the Solothurn district) or may have taken her husband's name in the record.
    No further biographical data is known.
  text_pt: >-
    Mãe de Elisabetha Borer (P-0073). Confirmada como esposa de Joseph Borer
    (P-0076) no registro de batismo da paróquia católica de Erschwil (PAR-0028,
    livro da igreja nº 68). Seu sobrenome de solteira é desconhecido — ela pode
    ter nascido Borer (compartilhando o sobrenome do marido, bem como a rede de
    parentes Borer mais ampla no distrito de Solothurn) ou pode ter assumido o
    nome do marido no registro. Nenhum outro dado biográfico é conhecido.
