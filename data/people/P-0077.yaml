profile: >-
  ## Identity

  **Anna Maria Borer** (recorded *anna Maria Borer*). Of Erschwil (Erischwyg), Soleure
  (Solothurn), Switzerland; the earliest named Borer woman on this branch. Swiss.

  - **Marriage:** wife of Joseph Borer (P-0076) — [PROVEN] as the couple named at their
  daughter's 1760 baptism (PAR-0028, church book #68; family F-0037). Her maiden surname
  is unknown: she may have been born a Borer (a Borer×Borer union) or been recorded under
  her husband's name. [OPEN] No marriage record located.

  - **Birth, death, own parents:** not documented; no record held. [OPEN]

  ## Family and social network

  - **Child (documented):** Elisabetha Borer (P-0073, b. 17 June 1760), the Wehrli
  matriarch of the Nova Friburgo line. [PROVEN] (PAR-0028)

  - **Namesake caution:** several "Anna Maria Borer" appear across the Grindel/Erschwil
  registers c.1760 as mothers and godmothers; our identification rests solely on the
  entry naming her as Elisabetha's mother. [PROVEN for that entry only]

  - She **did not emigrate**.

  ## What we can extrapolate

  - **[INFERRED]** Her (probable) Borer×Borer marriage and the swarm of same-name Borer
  women on the register reinforce a picture of a small, heavily endogamous Borer
  community in Erschwil — suggestive, not proof, that the Borer surname pervading the
  tree traces to one Solothurn stock.

  ## Open questions

  - Her own parents and marriage record would come from the Erschwil registers (church
  book #68) and the Thierstein *Inventar- und Teilungen*, which might disambiguate the
  several Anna Maria Borers. [OPEN]

  ## Sources held (this repository)

  - PAR-0028 (Erschwil baptism register, church book #68 — her daughter Elisabetha's
  1760 baptism, naming her as mother).

  ## Regional and migration context

  An Erschwil Borer of the Catholic Solothurn Jura; she stayed at the origin end of the
  branch, the family's emigration to Nova Friburgo belonging to a later generation
  (1819). [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Anna Maria Borer** (registrada *anna Maria Borer*). De Erschwil (Erischwyg), Soleure
  (Solothurn), Suíça; a Borer nomeada mais antiga deste ramo. Suíça.

  - **Casamento:** esposa de Joseph Borer (P-0076) — [PROVEN] como o casal nomeado no
  batismo de 1760 de sua filha (PAR-0028, livro paroquial nº 68; família F-0037). Seu
  sobrenome de solteira é desconhecido: pode ter nascido Borer (uma união Borer×Borer) ou
  ter sido registrada sob o nome do marido. [OPEN] Nenhum registro de casamento
  localizado.

  - **Nascimento, óbito, próprios pais:** não documentados; nenhum registro em mãos.
  [OPEN]

  ## Família e rede social

  - **Filha (documentada):** Elisabetha Borer (P-0073, n. 17 de junho de 1760), a
  matriarca Wehrli da linha de Nova Friburgo. [PROVEN] (PAR-0028)

  - **Cautela com homônimos:** várias "Anna Maria Borer" aparecem nos registros de
  Grindel/Erschwil por volta de 1760 como mães e madrinhas; nossa identificação apoia-se
  unicamente no assento que a nomeia como mãe de Elisabetha. [PROVEN apenas para aquele
  assento]

  - Ela **não emigrou**.

  ## O que podemos extrapolar

  - **[INFERRED]** Seu (provável) casamento Borer×Borer e o enxame de mulheres Borer de
  mesmo nome no registro reforçam a imagem de uma comunidade Borer pequena e fortemente
  endogâmica em Erschwil — sugestivo, não prova, de que o sobrenome Borer que permeia a
  árvore remonta a um único tronco de Solothurn.

  ## Questões em aberto

  - Seus próprios pais e seu registro de casamento viriam dos registros de Erschwil
  (livro paroquial nº 68) e do *Inventar- und Teilungen* de Thierstein, que poderiam
  desambiguar as várias Anna Maria Borer. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0028 (registro de batismo de Erschwil, livro paroquial nº 68 — o batismo de 1760
  de sua filha Elisabetha, que a nomeia como mãe).

  ## Contexto regional e migratório

  Uma Borer de Erschwil, no Jura católico de Solothurn; ela permaneceu na ponta de origem
  do ramo, pertencendo a emigração da família para Nova Friburgo a uma geração posterior
  (1819). [CONTEXTUAL]
