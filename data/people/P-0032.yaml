profile: >-
  ## Identity

  **Antonio Engracio de Souza** (the elder) [PROVEN] — paternal grandfather of Cidalia
  (P-0005), father of Antonio Engracio Filho (P-0010).

  - **Spouse:** Luzia Pinheiro da Conceição (P-0033) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Child (in our line):** Antonio Engracio Filho (P-0010, b. 1894, a negociante) — the
  two shared the name, distinguished by the *de Souza / Filho / Neto* suffix chain.

  - **Death:** already deceased by his son's death in 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN]

  ## Note on evidence

  He is named as the deceased father of Antonio Engracio Filho in the 1964 civil death
  (CIV-0017) and as Cidalia's paternal grandfather in her 1930 birth (CIV-0022, there
  "Antonio Engracio de Souza"). One record names him in his own right — the 1898 senatorial
  electoral act of São Francisco da Glória, Carangola (GOV-0008), which lists him among the
  admitted voters, corroborating that he was alive, a qualified (literate) voter, and resident
  in that MG parish in 1898 [CONTEXTUAL]. No vital record of his own (birth, marriage or death)
  is held.

  ## What we can extrapolate

  The Engracio-Souza household was a Minas Gerais (Carangola-area) family before the line's
  20th-century move to Rio de Janeiro — his son and grandchildren are all MG-born
  [INFERRED]. His **Brazilian nationality is documented, not merely inferred**: he was an
  admitted elector in the 1898 federal senatorial election (GOV-0008), and under the 1891
  Constitution the franchise was restricted to Brazilian citizens, so the record attests he
  was a Brazilian citizen [PROVEN — GOV-0008]. That is *citizenship*, not birthplace: it does
  not distinguish native-born from naturalised, and his own place of birth is still not held
  [OPEN] — so it does not by itself close the "where was he born" question.

  On the socioeconomic read, he is the obscure trunk of what became a commercial branch.
  [INFERRED / CONTEXTUAL — origin OPEN] Nothing documents his own standing, but the branch's
  downstream shape is commercial-urban rather than landed — his son (P-0010) was a *negociante*
  who "não deixou bens" and his grandson is recorded in commerce — which hints that the
  Engrácio-Souza were a small-town or commercial Carangola-region family rather than a
  landholding one. This is inference from the descendants; his own occupation, property and
  origin are entirely undocumented, so the class of his generation is genuinely open. That the
  name *Antônio Engrácio* runs three generations deep signals a family that deliberately carried
  the patronym.

  ## Open questions

  - His birth, marriage (pre-1895) and death (pre-1964) records — likely in the Carangola
  registers — would name his own parents, the next generation up. [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death — names him as deceased father) ·
  CIV-0022 (granddaughter Cidalia's 1930 birth — names him as paternal grandfather).

  ## Where to go today

  - **Region anchor (no place of his own documented):** Carangola, MG [UNLOCATED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Identidade

  **Antonio Engracio de Souza** (o velho) [PROVEN] — avô paterno de Cidalia (P-0005), pai
  de Antonio Engracio Filho (P-0010).

  - **Cônjuge:** Luzia Pinheiro da Conceição (P-0033) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filho (em nossa linha):** Antonio Engracio Filho (P-0010, n. 1894, negociante) — os
  dois compartilhavam o nome, distinguidos pela cadeia de sufixos *de Souza / Filho / Neto*.

  - **Óbito:** já falecido ao tempo do óbito de seu filho em 1964 (CIV-0017) [PROVEN quanto
  ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ele é nomeado como pai falecido de Antonio Engracio Filho no óbito civil de 1964 (CIV-0017)
  e como avô paterno de Cidalia em seu nascimento de 1930 (CIV-0022, ali "Antonio Engracio de
  Souza"). Um registro o nomeia em nome próprio — a ata da eleição para Senador de 1898 da
  Freguesia de São Francisco da Glória, Carangola (GOV-0008), que o arrola entre os eleitores
  admitidos, corroborando que estava vivo, era eleitor habilitado (alfabetizado) e residente
  naquela freguesia de MG em 1898 [CONTEXTUAL]. Nenhum registro vital próprio dele (nascimento,
  casamento ou óbito) foi obtido.

  ## O que podemos extrapolar

  O lar Engracio-Souza era uma família de Minas Gerais (região de Carangola) antes da
  mudança da linha para o Rio de Janeiro no século XX — seu filho e seus netos são todos
  nascidos em MG [INFERRED]. Sua **nacionalidade brasileira é documentada, não apenas
  inferida**: ele foi eleitor admitido na eleição federal para Senador de 1898 (GOV-0008), e
  pela Constituição de 1891 o sufrágio era restrito a cidadãos brasileiros, de modo que o
  registro atesta que era cidadão brasileiro [PROVEN — GOV-0008]. Isso é *cidadania*, não local
  de nascimento: não distingue nativo de naturalizado, e seu próprio local de nascimento ainda
  não foi obtido [OPEN] — logo não fecha, por si só, a questão de "onde ele nasceu".

  Na leitura socioeconômica, ele é o tronco obscuro do que veio a ser um ramo comercial.
  [INFERRED / CONTEXTUAL — origem OPEN] Nada documenta sua própria posição, mas a forma a jusante
  do ramo é comercial-urbana, e não fundiária — seu filho (P-0010) foi um *negociante* que "não
  deixou bens" e seu neto é registrado no comércio —, o que sugere que os Engrácio-Souza eram uma
  família de pequena cidade ou comercial da região de Carangola, e não uma proprietária de
  terras. Trata-se de inferência a partir dos descendentes; sua própria ocupação, propriedade e
  origem são inteiramente não documentadas, de modo que a classe de sua geração é genuinamente
  aberta. Que o nome *Antônio Engrácio* atravesse três gerações sinaliza uma família que
  carregou deliberadamente o patronímico.

  ## Questões em aberto

  - Seus registros de nascimento, casamento (anterior a 1895) e óbito (anterior a 1964) —
  provavelmente nos cartórios de Carangola — nomeariam seus próprios pais, a geração
  seguinte acima. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - CIV-0017 (óbito de 1964 do filho Antonio Engracio Filho — o nomeia como pai falecido) ·
  CIV-0022 (nascimento de 1930 da neta Cidalia — o nomeia como avô paterno).

