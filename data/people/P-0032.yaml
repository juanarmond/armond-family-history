profile: >-
  ## Interesting facts

  - **[PROVEN]** He appears in his own right in only one record: the 1898 senatorial electoral roll for the parish of São Francisco da Glória, Carangola (GOV-0008), which lists him as an admitted voter — documenting that he was alive, literate (the 1891 Constitution restricted the franchise to literates) and resident in that Zona da Mata parish in 1898.

  - **[PROVEN]** The 1891 Republican Constitution restricted voting to adult literate male Brazilian citizens; being admitted as a voter in the 1898 federal senatorial election therefore implies he was literate. This is independently corroborated: a 1917 procuração at São Francisco do Glória records him signing his own name as a witness, directly attesting literacy [PROVEN — 1917 procuração; FAN witness role, no image held as source]. He was literate, placing him above the rural illiteracy that characterised other families of his milieu.

  - **[INFERRED]** The name Antonio Engrácio runs three successive generations deep in this family (he, his son Antonio Engrácio Filho, and his grandson Antonio Engrácio Neto), signalling a deliberate family patronym — an identity strategy more common in families with at least some social standing to assert.

  - **[CONTEXTUAL]** The Carangola region in 1898 was in the declining phase of the Zona da Mata coffee economy: abolition of slavery (1888) had disrupted the labour supply, and global overproduction was beginning to undermine coffee prices. Families who could not hold land were already beginning the migrations that would eventually reach Volta Redonda.

  - **[INFERRED]** His son Antonio Engrácio Filho (P-0010) died in 1964 "sem deixar bens" (leaving no property), and both are absent from probate and land registers — consistent with a small-town or commercial Carangola family rather than a landholding one, whose economic base was trade rather than inherited land.

  ## Identity

  **Antonio Engracio de Souza** (the elder) [PROVEN] — paternal grandfather of Cidalia
  (P-0005), father of Antonio Engracio Filho (P-0010).

  - **Spouse:** Luzia Pinheiro da Conceição (P-0033) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Children (documented minimum three):** Antonio Engracio Filho (P-0010, b. 1894, a
  negociante) — the two shared the name, distinguished by the *de Souza / Filho / Neto*
  suffix chain. Additionally identified by their own death records: Teodolina Engracia de
  Souza (b. c.1902 MG, d. 25 December 1962, Itaperuna RJ — doméstica, widow of Abesterman
  Pinheiro) [PROVEN — her Itaperuna death record names 'filha legítima de Antonio Engracio
  e Luzia Pinheiro'] and Hermogenes Engrácio de Souza (b. c.1906 MG, d. 19 November 1971,
  Rio de Janeiro — lavrador, married Maria Dutra de Souza, three adult children) [PROVEN —
  his 1971 RJ death record names both parents]. No total child count is fixed; these three
  are the documented minimum.

  - **Death:** already deceased by his son's death in 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN]

  ## Note on evidence

  He is named as the deceased father of Antonio Engracio Filho in the 1964 civil death
  (CIV-0017) and as Cidalia's paternal grandfather in her 1930 birth (CIV-0022, there
  "Antonio Engracio de Souza"). Three records name him in his own right: (1) the 1898
  senatorial electoral act of São Francisco da Glória, Carangola (GOV-0008), which lists
  him among the admitted voters, corroborating that he was alive, a qualified (literate)
  voter, and resident in that MG parish in 1898 [CONTEXTUAL]; (2) a 1917 procuração at São
  Francisco do Glória where he signed his own name as a witness — directly attesting his
  literacy [PROVEN — FAN witness role; no image held as source]; (3) context-only records
  (FAN roles, no images held as sources) as creditor in a Muriaé probate (1903) and property
  partition (1909), confirming him as an active, propertied citizen of the area in 1898–1917
  [CONTEXTUAL]. No vital record of his own (birth, marriage or death) is held.

  ## What we can extrapolate

  The Engracio-Souza household was a Minas Gerais (Carangola-area) family before the line's
  20th-century move to Rio de Janeiro — his son and grandchildren are all MG-born
  [INFERRED]. His **Brazilian citizenship is a documented inference, not a surname guess**:
  he was an admitted elector in the 1898 federal senatorial election (GOV-0008), and under
  the 1891 Constitution the franchise was restricted to Brazilian citizens, so being an
  admitted voter implies he was one [INFERRED — GOV-0008]. GOV-0008 is a context-only record
  that attests no vital event, birthplace or parentage, so this is a legal inference (voter ⇒
  citizen), not a stated fact. And it is *citizenship*, not birthplace: it does not
  distinguish native-born from naturalised, and his own place of birth is still not held
  [OPEN].

  Be precise about what the franchise does and does not prove. [CONTEXTUAL] The 1891
  Constitution abolished the old income qualification of the 1881 Saraiva Law but kept the
  literacy bar, so admission as an elector in 1898 proves he was an adult male citizen **who
  could read and write** — and proves nothing at all about property. That is a real finding
  and a real limit: literacy in a Zona da Mata parish in 1898 put him in a distinct minority,
  but it does not make him a landowner, and no held record shows him owning anything.

  His literacy is corroborated, and one act shows exactly what it was worth locally. [PROVEN
  — per the 1917 procuração reading; the image is not held as a source] In a 1917 procuração
  at São Francisco do Glória he signed his own name as a witness, in the same instrument in
  which the grantor "declarou não saber ler nem escrever". Being the man who signs for the
  man who cannot is a small but exact measure of position: not wealth, but the functional
  literacy that made him useful, trusted and present in the paperwork of the parish.

  The wealth-form the record hints at is credit, not land — and credit does not descend.
  [INFERRED / CONTEXTUAL; the underlying records are full-text OCR hits, no images held —
  LEAD] He appears as a *credor* in a Muriaé probate of 1903 and in a property partition of
  1909. If those readings hold, he had liquid money to lend rather than a fazenda to work: a
  small local creditor, the same structurally fragile position the Armond exemplar identifies
  in Simplício. Loans are recovered, spent or written off; they leave no title and no
  inventário, which is consistent with a man who is visible in other people's probates and in
  none of his own. Nothing in the archive shows him holding land at any point. [OPEN]

  Three documented children, three different landings. [PROVEN — the deaths; INFERRED — the
  reading] Antônio Filho became a *negociante* in Rio (Pavuna) and died with "não deixou
  bens"; Hermogenes remained a *lavrador* and died at Rio de Janeiro, resident in a numbered
  lot in Duque de Caxias, also with no goods; Teodolina died a widowed *doméstica* at
  Itaperuna. That fan is the signature of a household with no heritable base: three children
  who each had to find their own footing, and who ended in three different corners of the Rio
  metropolitan and interior region. Brazilian partible succession had nothing to divide here
  — the fragmentation happened before any estate existed, in the absence of one.

  What the branch did transmit was literacy and a place in trade. [INFERRED / CONTEXTUAL] He
  could sign in 1917; his son ran a shop and had to be numerate to do it; his grandson is
  recorded in commerce. Schooling in that period was a purchased, class-linked privilege that
  had to be re-bought each generation, so the persistence of functional literacy across three
  Engrácio-Souza generations is itself the branch's inheritance — a competence carried for a
  role, not a property carried in a title. Set against the Carvalho-Guimarães side of the
  eventual marriage, where the *lavrador* sons lost literacy within a generation (see
  P-0021), that difference is the single clearest advantage the Engrácio-Souza line brought
  into the union.

  On his own class, the honest answer remains open. [INFERRED / CONTEXTUAL — origin OPEN]
  Nothing documents his occupation, and the commercial-urban shape of the branch is inferred
  from his descendants, not from him. What is documented is narrow and consistent: a
  literate, enfranchised, locally-trusted man of São Francisco do Glória between 1898 and
  1917, with money moving through other people's estates and no property of his own on
  record. That the name *Antônio Engrácio* runs three generations deep signals a family that
  deliberately carried the patronym — a claim to continuity made in the absence of an estate
  to anchor it.

  ## Open questions

  - His birth, marriage (pre-1895) and death (pre-1964) records — likely in the Carangola
  registers — would name his own parents, the next generation up. [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death — names him as deceased father) ·
  CIV-0022 (granddaughter Cidalia's 1930 birth — names him as paternal grandfather) · GOV-0008
  (1898 senatorial electoral act, São Francisco da Glória, Carangola — names him as an admitted
  voter; context-only, attests no vital event, birthplace or parentage).

  ## Where to go today

  - **Region anchor (no place of his own documented):** Carangola, MG [UNLOCATED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele aparece em nome próprio em apenas um registro: a lista eleitoral senatorial de 1898 da freguesia de São Francisco da Glória, Carangola (GOV-0008), que o lista como eleitor admitido — documentando que estava vivo, alfabetizado (a Constituição de 1891 restringia o sufrágio a alfabetizados) e residente naquela freguesia da Zona da Mata em 1898.

  - **[PROVEN]** A Constituição republicana de 1891 restringia o voto a cidadãos brasileiros homens adultos e alfabetizados; ser admitido como eleitor na eleição federal senatorial de 1898 implica que era alfabetizado. Isso é independentemente corroborado por uma procuração de 1917 em São Francisco do Glória na qual assinou seu próprio nome como testemunha, atestando diretamente a alfabetização [PROVEN — procuração de 1917; papel de FAN testemunha, sem imagem disponível como fonte]. Era, portanto, alfabetizado — acima do analfabetismo rural que caracterizava outros de seu meio.

  - **[INFERRED]** O nome Antonio Engrácio perpassa três gerações sucessivas dessa família (ele, seu filho Antonio Engrácio Filho e seu neto Antonio Engrácio Neto), sinalizando um patronímico familiar deliberado — estratégia de identidade mais comum em famílias com ao menos algum prestígio social a afirmar.

  - **[CONTEXTUAL]** A região de Carangola em 1898 vivia a fase de declínio da economia cafeeira da Zona da Mata: a abolição da escravidão (1888) havia perturbado a oferta de mão de obra, e a superprodução global começava a corroer os preços do café. As famílias que não conseguiam manter terras já iniciavam as migrações que eventualmente alcançariam Volta Redonda.

  - **[INFERRED]** Seu filho Antonio Engrácio Filho (P-0010) faleceu em 1964 "sem deixar bens" e ambos estão ausentes dos registros de inventários e terras — coerente com uma família de pequena cidade ou comercial de Carangola, e não uma proprietária de terras, cuja base econômica era o comércio e não a terra herdada.

  ## Identidade

  **Antonio Engracio de Souza** (o velho) [PROVEN] — avô paterno de Cidalia (P-0005), pai
  de Antonio Engracio Filho (P-0010).

  - **Cônjuge:** Luzia Pinheiro da Conceição (P-0033) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filhos (mínimo documentado de três):** Antonio Engracio Filho (P-0010, n. 1894,
  negociante) — os dois compartilhavam o nome, distinguidos pela cadeia de sufixos *de
  Souza / Filho / Neto*. Identificados adicionalmente por seus próprios registros de óbito:
  Teodolina Engracia de Souza (n. c.1902 MG, f. 25 de dezembro de 1962, Itaperuna RJ —
  doméstica, viúva de Abesterman Pinheiro) [PROVEN — óbito de Itaperuna nomeia 'filha
  legítima de Antonio Engracio e Luzia Pinheiro'] e Hermogenes Engrácio de Souza (n.
  c.1906 MG, f. 19 de novembro de 1971, Rio de Janeiro — lavrador, casado com Maria Dutra
  de Souza, três filhos adultos) [PROVEN — óbito de 1971 no RJ nomeia ambos os pais]. O
  total de filhos não está fixado; esses três são o mínimo documentado.

  - **Óbito:** já falecido ao tempo do óbito de seu filho em 1964 (CIV-0017) [PROVEN quanto
  ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ele é nomeado como pai falecido de Antonio Engracio Filho no óbito civil de 1964 (CIV-0017)
  e como avô paterno de Cidalia em seu nascimento de 1930 (CIV-0022, ali "Antonio Engracio de
  Souza"). Três registros o nomeiam em nome próprio: (1) a ata eleitoral senatorial de 1898 da
  Freguesia de São Francisco da Glória, Carangola (GOV-0008), que o arrola entre os eleitores
  admitidos [CONTEXTUAL]; (2) uma procuração de 1917 em São Francisco do Glória na qual
  assinou seu próprio nome como testemunha, atestando diretamente a alfabetização [PROVEN —
  papel de FAN testemunha; sem imagem disponível como fonte]; (3) registros apenas de contexto
  (papéis de FAN, sem imagens disponíveis como fontes) como credor num inventário de Muriaé
  (1903) e numa partilha de imóvel (1909), confirmando-o como cidadão ativo e com bens na área
  em 1898–1917 [CONTEXTUAL]. Nenhum registro vital próprio dele (nascimento, casamento ou
  óbito) foi obtido.

  ## O que podemos extrapolar

  O lar Engracio-Souza era uma família de Minas Gerais (região de Carangola) antes da mudança
  da linha para o Rio de Janeiro no século XX — seu filho e seus netos são todos nascidos em
  MG [INFERRED]. Sua **cidadania brasileira é uma inferência documentada, não um palpite pelo
  sobrenome**: ele foi eleitor admitido na eleição federal para Senador de 1898 (GOV-0008), e
  pela Constituição de 1891 o sufrágio era restrito a cidadãos brasileiros, de modo que ser
  eleitor admitido implica que o era [INFERRED — GOV-0008]. GOV-0008 é um registro apenas de
  contexto, que não atesta nenhum evento vital, local de nascimento ou filiação, de modo que
  se trata de uma inferência jurídica (eleitor ⇒ cidadão), não de um fato declarado. E é
  *cidadania*, não local de nascimento: não distingue nativo de naturalizado, e seu próprio
  local de nascimento ainda não foi obtido [OPEN].

  Sejamos precisos sobre o que o sufrágio prova e o que não prova. [CONTEXTUAL] A
  Constituição de 1891 aboliu a antiga qualificação por renda da Lei Saraiva de 1881, mas
  manteve a barreira da alfabetização — de modo que a admissão como eleitor em 1898 prova que
  era cidadão, homem, adulto **e que sabia ler e escrever**, e não prova absolutamente nada
  sobre bens. É um achado real e um limite real: ser alfabetizado numa freguesia da Zona da
  Mata em 1898 o colocava numa minoria nítida, mas não faz dele proprietário de terras, e
  nenhum registro disponível o mostra possuindo coisa alguma.

  Sua alfabetização é corroborada, e um ato mostra exatamente quanto ela valia localmente.
  [PROVEN — conforme a leitura da procuração de 1917; a imagem não é mantida como fonte] Numa
  procuração de 1917 em São Francisco do Glória ele assinou o próprio nome como testemunha, no
  mesmo instrumento em que o outorgante "declarou não saber ler nem escrever". Ser o homem que
  assina pelo homem que não sabe é uma medida pequena, porém exata, de posição: não riqueza,
  mas a alfabetização funcional que o tornava útil, confiável e presente na papelada da
  freguesia.

  A forma de riqueza que o registro sugere é o crédito, não a terra — e crédito não desce.
  [INFERRED / CONTEXTUAL; os registros de base são achados de OCR de texto integral, sem
  imagens disponíveis — LEAD] Ele aparece como *credor* num inventário de Muriaé de 1903 e
  numa partilha de imóvel de 1909. Se essas leituras se sustentarem, ele tinha dinheiro
  líquido a emprestar, e não uma fazenda a trabalhar: um pequeno credor local, a mesma posição
  estruturalmente frágil que o exemplar Armond identifica em Simplício. Empréstimos são
  recebidos, gastos ou perdidos; não deixam título nem inventário — o que é coerente com um
  homem visível nos inventários alheios e em nenhum próprio. Nada no arquivo o mostra detendo
  terra em momento algum. [OPEN]

  Três filhos documentados, três aterrissagens diferentes. [PROVEN — os óbitos; INFERRED — a
  leitura] Antônio Filho tornou-se *negociante* no Rio (Pavuna) e morreu com "não deixou
  bens"; Hermogenes permaneceu *lavrador* e morreu no Rio de Janeiro, residente num lote
  numerado em Duque de Caxias, também sem bens; Teodolina morreu *doméstica* viúva em
  Itaperuna. Esse leque é a assinatura de uma casa sem base herdável: três filhos que tiveram
  cada um de achar o próprio apoio e que terminaram em três cantos diferentes da região
  metropolitana e do interior fluminense. A sucessão partível brasileira não teve aqui o que
  dividir — a fragmentação ocorreu antes de existir espólio, na ausência de um.

  O que o ramo de fato transmitiu foi alfabetização e um lugar no comércio. [INFERRED /
  CONTEXTUAL] Ele sabia assinar em 1917; seu filho tocava uma loja e precisava saber contas
  para isso; seu neto está registrado no comércio. A escolarização daquele período era um
  privilégio comprado e ligado à classe, que precisava ser recomprado a cada geração, de modo
  que a persistência da alfabetização funcional por três gerações Engrácio-Souza é, ela
  própria, a herança do ramo — uma competência carregada por um papel, não uma propriedade
  carregada por um título. Confrontada com o lado Carvalho-Guimarães do casamento futuro, onde
  os filhos *lavradores* perderam a alfabetização em uma geração (ver P-0021), essa diferença
  é a vantagem mais nítida que a linha Engrácio-Souza trouxe para a união.

  Sobre a classe dele próprio, a resposta honesta segue em aberto. [INFERRED / CONTEXTUAL —
  origem OPEN] Nada documenta sua ocupação, e o formato comercial-urbano do ramo é inferido de
  seus descendentes, não dele. O que está documentado é estreito e coerente: um homem
  alfabetizado, eleitor e localmente confiável de São Francisco do Glória entre 1898 e 1917,
  com dinheiro circulando pelos espólios alheios e nenhuma propriedade própria registrada. Que
  o nome *Antônio Engrácio* atravesse três gerações sinaliza uma família que carregou
  deliberadamente o patronímico — uma reivindicação de continuidade feita na ausência de um
  patrimônio que a ancorasse.

  ## Questões em aberto

  - Seus registros de nascimento, casamento (anterior a 1895) e óbito (anterior a 1964) —
  provavelmente nos cartórios de Carangola — nomeariam seus próprios pais, a geração
  seguinte acima. [OPEN]

