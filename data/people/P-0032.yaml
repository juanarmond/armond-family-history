  ## Contexto regional e migratório

  Seu único lugar documentado é a Freguesia de São Francisco da Glória, no município de
  Carangola, onde era eleitor residente em agosto de 1898 (GOV-0008). Os óbitos de seus
  filhos traçam a dispersão do ramo a partir dessa freguesia: Antonio Filho para Pavuna, Rio
  de Janeiro (CIV-0017), Hermogenes para a região de Duque de Caxias (CIV-0026) e Teodolina
  para Itaperuna, no noroeste fluminense (CIV-0043) — cada um registrado como natural de Minas
  Gerais. [PROVEN — os lugares] Seu próprio local de nascimento e sua origem não estão
  documentados, de modo que nenhuma mudança pode ser afirmada para ele. [OPEN] O interior
  cafeeiro da Zona da Mata onde a família se enraizou foi aberto pela virada para o trabalho
  livre pós-1850 — a Lei Eusébio de Queirós (Lei nº 581, de 4 de setembro de 1850), que
  encerrou o tráfico de escravizados, e a Lei Áurea (nº 3.353, de 13 de maio de 1888), que
  aboliu a escravidão —, que atraiu pequenos lavradores e pequenos comerciantes para a
  região. [CONTEXTUAL]

