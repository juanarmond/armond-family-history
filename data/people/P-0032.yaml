profile: >-
  ## Interesting facts

  - **[PROVEN]** He appears in his own right in only one record held here: the act of the 6 August 1898 senatorial election for the parish of São Francisco da Glória, Carangola (GOV-0008), which lists him among the admitted voters — documenting that he was alive, a qualified elector (the 1891 Constitution excluded illiterates from the franchise) and resident in that Zona da Mata parish in 1898.

  - **[INFERRED — GOV-0008]** The 1891 Republican Constitution excluded illiterates from the franchise, so his admission as a voter in the 1898 senatorial election implies he could read and write. **[LEAD]** The retrieval research reports a corroboration this repository does not hold: a 1917 procuração at São Francisco do Glória, read from a FamilySearch full-text image, in which he signed his own name as a witness for a grantor who "declarou não saber ler nem escrever" (a FAN witness role; not catalogued here). On the held evidence he was very probably literate, which would place him above the rural illiteracy of much of his milieu.

  - **[INFERRED]** The name Antonio Engrácio runs at least two generations deep in this family — he and his son Antonio Engrácio Filho are both written "Antonio Engracio de Souza" in his granddaughter's 1930 birth act (CIV-0022) — and the retrieval research reports a grandson Antonio Engrácio Neto [LEAD; no held record names him]. That signals a deliberate family patronym — an identity strategy more common in families with at least some social standing to assert.

  - **[CONTEXTUAL]** The Carangola region in 1898 was in the declining phase of the Zona da Mata coffee economy: abolition of slavery (1888) had disrupted the labour supply, and global overproduction was beginning to undermine coffee prices. Families who could not hold land were already beginning the migrations that would eventually reach Volta Redonda.

  - **[INFERRED]** His son Antonio Engrácio Filho (P-0010) died in 1964 and "não deixou bens" (left no property) (CIV-0017), and the retrieval research reports no "Engrácio" party at all in the COARPE/APM inventário indexes of the Muriaé, Carangola, São Francisco do Glória and Tombos comarcas [LEAD — an index search, not proof of absence] — consistent with a small-town or commercial Carangola family rather than a landholding one, whose economic base was trade rather than inherited land.

  ## Identity

  **Antonio Engracio de Souza** (the elder) [PROVEN] — paternal grandfather of Cidalia
  (P-0005), father of Antonio Engracio Filho (P-0010).

  - **Spouse:** Luzia Pinheiro da Conceição (P-0033) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Children (documented minimum three):** Antonio Engracio Filho (P-0010, b. 15 June
  1894 as stated in CIV-0002, a negociante) — the two shared the name, distinguished by the
  *de Souza / Filho* suffix. Additionally identified by their own death records: Teodolina
  Engracia de Souza (b. c.1902 MG, d. 25 December 1962, Itaperuna RJ — doméstica, widow of
  Abesterman Pinheiro) [PROVEN — CIV-0043, 'filha legítima de Antonio Engracio e Luzia
  Pinheiro'] and Hermogenes Engrácio de Souza (native of Minas Gerais, d. 19 November at Rio
  de Janeiro aged 65 — lavrador, married to Maria Dutra de Souza, leaving three adult
  daughters) [PROVEN — CIV-0026 names both parents]. The year of Hermogenes' death is in
  conflict: CIV-0026 as catalogued reads 1961 (→ b. c.1896), while the register image
  appears to read "setenta e um" (1971 → b. c.1906), as the retrieval research also reports
  after a zoomed re-read; the catalogue entry is flagged for correction. No total child
  count is fixed; these three are the documented minimum.

  - **Death:** already deceased by his son's death in June 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN] He was alive in August 1898
  (GOV-0008) and, if the reported 1917 procuração is his, in January 1917 [LEAD]. A
  FamilySearch tree estimate of birth c.1860 is unverified [LEAD].

  ## Note on evidence

  He is named as the deceased father of Antonio Engracio Filho in the 1964 civil death
  (CIV-0017), as Cidalia's paternal grandfather in her 1930 birth (CIV-0022, there
  "Antonio Engracio de Souza"), and as father in the death records of his children
  Teodolina (1962, CIV-0043, "Antonio Engracio") and Hermogenes (CIV-0026). One held record
  names him in his own right: the 1898 senatorial electoral act of São Francisco da Glória,
  Carangola (GOV-0008), which lists him among the admitted voters, corroborating that he was
  alive, a qualified voter and resident in that MG parish in 1898 [CONTEXTUAL — a
  context-only record]. The same act names a Ramiro José de Carvalho Guimarães on the
  electoral board and an Alaerino José de Carvalho Guimarães among the voters — the surname
  of the family his son later married into — but no record links those men to Cidalia's
  maternal line [uncertain]. The retrieval research reports three further appearances, none
  catalogued here [LEAD]: a 1917 procuração at São Francisco do Glória in which he signed as
  a witness, and creditor roles in a Muriaé probate (1903) and a property partition (1909),
  read from FamilySearch full-text OCR. If they hold, they show an active local creditor,
  not a property-holder: no property of his own is on record. No vital record of his own
  (birth, marriage or death) is held.

  ## What we can extrapolate

  The Engracio-Souza household was a Minas Gerais (Carangola-area) family before the line's
  20th-century move to Rio de Janeiro — his son and grandchildren are all MG-born
  [INFERRED]. His **Brazilian citizenship is a documented inference, not a surname guess**:
  he was an admitted elector in the 1898 federal senatorial election (GOV-0008), and under
  the 1891 Constitution the franchise was restricted to Brazilian citizens, so being an
  admitted voter implies he was one [INFERRED — GOV-0008]. GOV-0008 is a context-only record
  that attests no vital event, birthplace or parentage, so this is a legal inference (voter ⇒
  citizen), not a stated fact. And it is *citizenship*, not birthplace: it does not
  distinguish native-born from naturalised, and his own place of birth is still not held
  [OPEN].

  Be precise about what the franchise does and does not prove. [CONTEXTUAL] The 1891
  Constitution abolished the old income qualification of the 1881 Saraiva Law but kept the
  literacy bar, so admission as an elector in 1898 proves he was an adult male citizen **who
  could read and write** — and proves nothing at all about property. That is a real finding
  and a real limit: literacy in a Zona da Mata parish in 1898 put him in a distinct minority,
  but it does not make him a landowner, and no held record shows him owning anything.

  His literacy may be corroborated, and one act would show exactly what it was worth locally.
  [LEAD — per the retrieval research's reading of the 1917 procuração; not catalogued here] In a 1917 procuração
  at São Francisco do Glória he signed his own name as a witness, in the same instrument in
  which the grantor "declarou não saber ler nem escrever". Being the man who signs for the
  man who cannot is a small but exact measure of position: not wealth, but the functional
  literacy that made him useful, trusted and present in the paperwork of the parish.

  The wealth-form the record hints at is credit, not land — and credit does not descend.
  [INFERRED / CONTEXTUAL; the underlying records are full-text OCR hits, no images held —
  LEAD] He appears as a *credor* in a Muriaé probate of 1903 and in a property partition of
  1909. If those readings hold, he had liquid money to lend rather than a fazenda to work: a
  small local creditor, the same structurally fragile position the Armond exemplar identifies
  in Simplício. Loans are recovered, spent or written off; they leave no title and no
  inventário, which is consistent with a man who is visible in other people's probates and in
  none of his own. Nothing in the archive shows him holding land at any point. [OPEN]

  Three documented children, three different landings. [PROVEN — the deaths, CIV-0017, CIV-0026, CIV-0043; INFERRED — the
  reading] Antônio Filho became a *negociante* in Rio (Pavuna) and died with "não deixou
  bens"; Hermogenes remained a *lavrador* and died at Rio de Janeiro, resident in a numbered
  lot in Duque de Caxias, also with no goods; Teodolina died a widowed *doméstica* at
  Itaperuna. That fan is the signature of a household with no heritable base: three children
  who each had to find their own footing, and who ended in three different corners of the Rio
  metropolitan and interior region. Brazilian partible succession had nothing to divide here
  — the fragmentation happened before any estate existed, in the absence of one.

  What the branch did transmit was literacy and a place in trade. [INFERRED / CONTEXTUAL] He
  was an admitted voter in 1898 and reportedly signed in 1917 [LEAD]; his son ran a shop and had to be numerate to do it; his grandson is
  recorded in commerce. Schooling in that period was a purchased, class-linked privilege that
  had to be re-bought each generation, so the persistence of functional literacy across three
  Engrácio-Souza generations is itself the branch's inheritance — a competence carried for a
  role, not a property carried in a title. Set against the Carvalho-Guimarães side of the
  eventual marriage, where the *lavrador* sons lost literacy within a generation (see
  P-0021), that difference is the single clearest advantage the Engrácio-Souza line brought
  into the union.

  On his own class, the honest answer remains open. [INFERRED / CONTEXTUAL — origin OPEN]
  Nothing documents his occupation, and the commercial-urban shape of the branch is inferred
  from his descendants, not from him. What is documented is narrow and consistent: an
  enfranchised man of São Francisco do Glória in 1898 (GOV-0008) — and, on the reported
  1903–1917 leads [LEAD], a literate, locally-trusted one with money moving through other
  people's estates — with no property of his own on record. That the name *Antônio Engrácio*
  runs across at least two generations signals a family that
  deliberately carried the patronym — a claim to continuity made in the absence of an estate
  to anchor it.

  ## Open questions

  - His birth, marriage and death (pre-1964) records would name his own parents, the next
  generation up. His marriage to Luzia most likely predates their son's birth in June 1894
  (CIV-0002) [INFERRED]. The retrieval research reports Carangola baptisms 1871–1884 searched
  without a family entry, and so points the search at São Francisco do Glória and
  neighbouring Zona da Mata parishes rather than Carangola itself [LEAD]. [OPEN]

  - Searches reported by the retrieval research, all negative and none proof of absence
  [LEAD]: no baptism, marriage or death of his own on the FamilySearch index (his tree node's
  only sources are his sons' death records); no "Engrácio" party in the COARPE/APM inventário
  indexes of the Muriaé, Carangola, São Francisco do Glória and Tombos comarcas; and no other
  Engrácio and no Pinheiro among his co-voters on the full 1898 roll, so no enfranchised
  father or brother voted beside him.

  - Cheapest remaining probe: his son Antonio Engracio Filho's own 1894 birth or baptism
  (São Francisco do Glória / Carangola area), which would name the couple and might state
  his age or birthplace. [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death — names him as deceased father) ·
  CIV-0022 (granddaughter Cidalia's 1930 birth — names him as paternal grandfather) · GOV-0008
  (1898 senatorial electoral act, São Francisco da Glória, Carangola — names him as an admitted
  voter; context-only, attests no vital event, birthplace or parentage).

  - CIV-0043 (daughter Teodolina's 1962 Itaperuna death — names him as father) · CIV-0026
  (son Hermogenes' Rio de Janeiro death — names him as father; death year 1961/1971 in
  conflict, see Identity).

  ## Regional and migration context

  His one documented place is the Freguesia de São Francisco da Glória, in the município of
  Carangola, where he was a resident voter in August 1898 (GOV-0008). His children's deaths
  trace the branch's dispersal out of that parish: Antonio Filho to Pavuna, Rio de Janeiro
  (CIV-0017), Hermogenes to the Duque de Caxias area (CIV-0026) and Teodolina to Itaperuna,
  in north-western Rio de Janeiro state (CIV-0043) — each recorded as a native of Minas
  Gerais. [PROVEN — the places] His own birthplace and origin are undocumented, so no move
  can be stated for him. [OPEN] The Zona da Mata coffee interior in which the family rooted
  was opened by the post-1850 free-labour pivot — the Lei Eusébio de Queirós (Lei nº 581, 4
  September 1850) ending the slave trade and the Lei Áurea (nº 3.353, 13 May 1888) abolition
  — which drew smallholders and small merchants into the region. [CONTEXTUAL]

  ## Where to go today

  - **Residence (1898):** São Francisco do Glória, MG — the parish where he voted in 1898 (GOV-0008); its parish and civil registers are the concrete targets for his marriage and death [DOCUMENTED] · [Maps](https://www.google.com/maps/search/?api=1&query=S%C3%A3o+Francisco+do+Gl%C3%B3ria%2C+MG)

  - **Region anchor (birthplace unlocated):** Carangola, MG [UNLOCATED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja+Matriz+de+Santa+Luzia%2C+Carangola%2C+MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele aparece em nome próprio em apenas um registro disponível aqui: a ata da eleição senatorial de 6 de agosto de 1898 da freguesia de São Francisco da Glória, Carangola (GOV-0008), que o arrola entre os eleitores admitidos — documentando que estava vivo, era eleitor habilitado (a Constituição de 1891 excluía os analfabetos do sufrágio) e residia naquela freguesia da Zona da Mata em 1898.

  - **[INFERRED — GOV-0008]** A Constituição republicana de 1891 excluía os analfabetos do sufrágio, de modo que sua admissão como eleitor na eleição senatorial de 1898 implica que sabia ler e escrever. **[LEAD]** A pesquisa de recuperação informa uma corroboração que este repositório não detém: uma procuração de 1917 em São Francisco do Glória, lida numa imagem de texto integral do FamilySearch, na qual ele assinou o próprio nome como testemunha por um outorgante que "declarou não saber ler nem escrever" (papel de FAN testemunha; não catalogada aqui). Pelas evidências disponíveis, era muito provavelmente alfabetizado, o que o colocaria acima do analfabetismo rural de boa parte de seu meio.

  - **[INFERRED]** O nome Antonio Engrácio perpassa ao menos duas gerações dessa família — ele e seu filho Antonio Engrácio Filho aparecem ambos como "Antonio Engracio de Souza" no ato de nascimento de 1930 de sua neta (CIV-0022) —, e a pesquisa de recuperação informa um neto Antonio Engrácio Neto [LEAD; nenhum registro disponível o nomeia]. Isso sinaliza um patronímico familiar deliberado — estratégia de identidade mais comum em famílias com ao menos algum prestígio social a afirmar.

  - **[CONTEXTUAL]** A região de Carangola em 1898 vivia a fase de declínio da economia cafeeira da Zona da Mata: a abolição da escravidão (1888) havia perturbado a oferta de mão de obra, e a superprodução global começava a corroer os preços do café. As famílias que não conseguiam manter terras já iniciavam as migrações que eventualmente alcançariam Volta Redonda.

  - **[INFERRED]** Seu filho Antonio Engrácio Filho (P-0010) faleceu em 1964 e "não deixou bens" (CIV-0017), e a pesquisa de recuperação informa nenhuma parte "Engrácio" nos índices de inventários COARPE/APM das comarcas de Muriaé, Carangola, São Francisco do Glória e Tombos [LEAD — uma busca em índice, não prova de ausência] — coerente com uma família de pequena cidade ou comercial de Carangola, e não uma proprietária de terras, cuja base econômica era o comércio e não a terra herdada.

  ## Identidade

  **Antonio Engracio de Souza** (o velho) [PROVEN] — avô paterno de Cidalia (P-0005), pai
  de Antonio Engracio Filho (P-0010).

  - **Cônjuge:** Luzia Pinheiro da Conceição (P-0033) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filhos (mínimo documentado de três):** Antonio Engracio Filho (P-0010, n. 15 de junho
  de 1894 conforme declarado em CIV-0002, negociante) — os dois compartilhavam o nome,
  distinguidos pelo sufixo *de Souza / Filho*. Identificados adicionalmente por seus próprios
  registros de óbito: Teodolina Engracia de Souza (n. c.1902 MG, f. 25 de dezembro de 1962,
  Itaperuna RJ — doméstica, viúva de Abesterman Pinheiro) [PROVEN — CIV-0043, 'filha
  legítima de Antonio Engracio e Luzia Pinheiro'] e Hermogenes Engrácio de Souza (natural de
  Minas Gerais, f. em 19 de novembro no Rio de Janeiro, aos 65 anos — lavrador, casado com
  Maria Dutra de Souza, deixando três filhas maiores) [PROVEN — CIV-0026 nomeia ambos os
  pais]. O ano do óbito de Hermogenes está em conflito: CIV-0026, tal como catalogado, lê
  1961 (→ n. c.1896), ao passo que a imagem do livro parece ler "setenta e um" (1971 → n.
  c.1906), como também informa a pesquisa de recuperação após releitura ampliada; a entrada
  do catálogo está sinalizada para correção. O total de filhos não está fixado; esses três
  são o mínimo documentado.

  - **Óbito:** já falecido ao tempo do óbito de seu filho em junho de 1964 (CIV-0017) [PROVEN
  quanto ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN] Estava vivo em
  agosto de 1898 (GOV-0008) e, se a procuração de 1917 informada for dele, em janeiro de 1917
  [LEAD]. Uma estimativa de nascimento c.1860 na árvore do FamilySearch não está verificada
  [LEAD].

  ## Nota sobre a evidência

  Ele é nomeado como pai falecido de Antonio Engracio Filho no óbito civil de 1964 (CIV-0017),
  como avô paterno de Cidalia em seu nascimento de 1930 (CIV-0022, ali "Antonio Engracio de
  Souza") e como pai nos registros de óbito de seus filhos Teodolina (1962, CIV-0043,
  "Antonio Engracio") e Hermogenes (CIV-0026). Um registro disponível o nomeia em nome
  próprio: a ata eleitoral senatorial de 1898 da Freguesia de São Francisco da Glória,
  Carangola (GOV-0008), que o arrola entre os eleitores admitidos, corroborando que estava
  vivo, era eleitor habilitado e residia naquela freguesia mineira em 1898 [CONTEXTUAL — um
  registro apenas de contexto]. A mesma ata nomeia um Ramiro José de Carvalho Guimarães na
  mesa eleitoral e um Alaerino José de Carvalho Guimarães entre os eleitores — o sobrenome da
  família com a qual seu filho viria a se casar —, mas nenhum registro liga esses homens à
  linha materna de Cidalia [uncertain]. A pesquisa de recuperação informa mais três
  aparições, nenhuma catalogada aqui [LEAD]: uma procuração de 1917 em São Francisco do
  Glória na qual assinou como testemunha, e papéis de credor num inventário de Muriaé (1903)
  e numa partilha de imóvel (1909), lidos em OCR de texto integral do FamilySearch. Se se
  confirmarem, mostram um credor local ativo, não um proprietário: nenhuma propriedade dele
  está registrada. Nenhum registro vital próprio dele (nascimento, casamento ou óbito) foi
  obtido.

  ## O que podemos extrapolar

  O lar Engracio-Souza era uma família de Minas Gerais (região de Carangola) antes da mudança
  da linha para o Rio de Janeiro no século XX — seu filho e seus netos são todos nascidos em
  MG [INFERRED]. Sua **cidadania brasileira é uma inferência documentada, não um palpite pelo
  sobrenome**: ele foi eleitor admitido na eleição federal para Senador de 1898 (GOV-0008), e
  pela Constituição de 1891 o sufrágio era restrito a cidadãos brasileiros, de modo que ser
  eleitor admitido implica que o era [INFERRED — GOV-0008]. GOV-0008 é um registro apenas de
  contexto, que não atesta nenhum evento vital, local de nascimento ou filiação, de modo que
  se trata de uma inferência jurídica (eleitor ⇒ cidadão), não de um fato declarado. E é
  *cidadania*, não local de nascimento: não distingue nativo de naturalizado, e seu próprio
  local de nascimento ainda não foi obtido [OPEN].

  Sejamos precisos sobre o que o sufrágio prova e o que não prova. [CONTEXTUAL] A
  Constituição de 1891 aboliu a antiga qualificação por renda da Lei Saraiva de 1881, mas
  manteve a barreira da alfabetização — de modo que a admissão como eleitor em 1898 prova que
  era cidadão, homem, adulto **e que sabia ler e escrever**, e não prova absolutamente nada
  sobre bens. É um achado real e um limite real: ser alfabetizado numa freguesia da Zona da
  Mata em 1898 o colocava numa minoria nítida, mas não faz dele proprietário de terras, e
  nenhum registro disponível o mostra possuindo coisa alguma.

  Sua alfabetização pode estar corroborada, e um ato mostraria exatamente quanto ela valia
  localmente. [LEAD — conforme a leitura da procuração de 1917 pela pesquisa de recuperação;
  não catalogada aqui] Numa
  procuração de 1917 em São Francisco do Glória ele assinou o próprio nome como testemunha, no
  mesmo instrumento em que o outorgante "declarou não saber ler nem escrever". Ser o homem que
  assina pelo homem que não sabe é uma medida pequena, porém exata, de posição: não riqueza,
  mas a alfabetização funcional que o tornava útil, confiável e presente na papelada da
  freguesia.

  A forma de riqueza que o registro sugere é o crédito, não a terra — e crédito não desce.
  [INFERRED / CONTEXTUAL; os registros de base são achados de OCR de texto integral, sem
  imagens disponíveis — LEAD] Ele aparece como *credor* num inventário de Muriaé de 1903 e
  numa partilha de imóvel de 1909. Se essas leituras se sustentarem, ele tinha dinheiro
  líquido a emprestar, e não uma fazenda a trabalhar: um pequeno credor local, a mesma posição
  estruturalmente frágil que o exemplar Armond identifica em Simplício. Empréstimos são
  recebidos, gastos ou perdidos; não deixam título nem inventário — o que é coerente com um
  homem visível nos inventários alheios e em nenhum próprio. Nada no arquivo o mostra detendo
  terra em momento algum. [OPEN]

  Três filhos documentados, três aterrissagens diferentes. [PROVEN — os óbitos, CIV-0017, CIV-0026, CIV-0043; INFERRED — a
  leitura] Antônio Filho tornou-se *negociante* no Rio (Pavuna) e morreu com "não deixou
  bens"; Hermogenes permaneceu *lavrador* e morreu no Rio de Janeiro, residente num lote
  numerado em Duque de Caxias, também sem bens; Teodolina morreu *doméstica* viúva em
  Itaperuna. Esse leque é a assinatura de uma casa sem base herdável: três filhos que tiveram
  cada um de achar o próprio apoio e que terminaram em três cantos diferentes da região
  metropolitana e do interior fluminense. A sucessão partível brasileira não teve aqui o que
  dividir — a fragmentação ocorreu antes de existir espólio, na ausência de um.

  O que o ramo de fato transmitiu foi alfabetização e um lugar no comércio. [INFERRED /
  CONTEXTUAL] Ele foi eleitor admitido em 1898 e teria assinado em 1917 [LEAD]; seu filho tocava uma loja e precisava saber contas
  para isso; seu neto está registrado no comércio. A escolarização daquele período era um
  privilégio comprado e ligado à classe, que precisava ser recomprado a cada geração, de modo
  que a persistência da alfabetização funcional por três gerações Engrácio-Souza é, ela
  própria, a herança do ramo — uma competência carregada por um papel, não uma propriedade
  carregada por um título. Confrontada com o lado Carvalho-Guimarães do casamento futuro, onde
  os filhos *lavradores* perderam a alfabetização em uma geração (ver P-0021), essa diferença
  é a vantagem mais nítida que a linha Engrácio-Souza trouxe para a união.

  Sobre a classe dele próprio, a resposta honesta segue em aberto. [INFERRED / CONTEXTUAL —
  origem OPEN] Nada documenta sua ocupação, e o formato comercial-urbano do ramo é inferido de
  seus descendentes, não dele. O que está documentado é estreito e coerente: um
  eleitor de São Francisco do Glória em 1898 (GOV-0008) — e, pelas pistas informadas de
  1903–1917 [LEAD], um homem alfabetizado, localmente confiável e com dinheiro circulando
  pelos espólios alheios —, sem nenhuma propriedade própria registrada. Que
  o nome *Antônio Engrácio* atravesse ao menos duas gerações sinaliza uma família que carregou
  deliberadamente o patronímico — uma reivindicação de continuidade feita na ausência de um
  patrimônio que a ancorasse.

  ## Questões em aberto

  - Seus registros de nascimento, casamento e óbito (anterior a 1964) nomeariam seus
  próprios pais, a geração seguinte acima. Seu casamento com Luzia provavelmente antecede o
  nascimento do filho em junho de 1894 (CIV-0002) [INFERRED]. A pesquisa de recuperação
  informa que os batismos de Carangola de 1871–1884 foram examinados sem entrada da família
  e, por isso, aponta a busca para São Francisco do Glória e freguesias vizinhas da Zona da
  Mata, e não para a própria Carangola [LEAD]. [OPEN]

  - Buscas informadas pela pesquisa de recuperação, todas negativas e nenhuma prova de
  ausência [LEAD]: nenhum batismo, casamento ou óbito próprio dele no índice do FamilySearch
  (as únicas fontes de seu nó na árvore são os óbitos dos filhos); nenhuma parte "Engrácio"
  nos índices de inventários COARPE/APM das comarcas de Muriaé, Carangola, São Francisco do
  Glória e Tombos; e nenhum outro Engrácio e nenhum Pinheiro entre seus covotantes na lista
  completa de 1898, de modo que nenhum pai ou irmão eleitor votou a seu lado.

  - Sondagem mais barata restante: o nascimento ou batismo de 1894 de seu filho Antonio
  Engracio Filho (região de São Francisco do Glória / Carangola), que nomearia o casal e
  poderia declarar sua idade ou naturalidade. [OPEN]

