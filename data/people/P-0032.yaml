profile: >-
  ## Interesting facts

  - **[PROVEN]** He appears in his own right in only one record: the 1898 senatorial electoral roll for the parish of São Francisco da Glória, Carangola (GOV-0008), which lists him as an admitted voter — documenting that he was alive, literate (the 1891 Constitution restricted the franchise to literates) and resident in that Zona da Mata parish in 1898.

  - **[PROVEN]** The 1891 Republican Constitution restricted voting to adult literate male Brazilian citizens; being admitted as a voter in the 1898 federal senatorial election therefore implies he was literate. This is independently corroborated: a 1917 procuração at São Francisco do Glória records him signing his own name as a witness, directly attesting literacy [PROVEN — 1917 procuração; FAN witness role, no image held as source]. He was literate, placing him above the rural illiteracy that characterised other families of his milieu.

  - **[INFERRED]** The name Antonio Engrácio runs three successive generations deep in this family (he, his son Antonio Engrácio Filho, and his grandson Antonio Engrácio Neto), signalling a deliberate family patronym — an identity strategy more common in families with at least some social standing to assert.

  - **[CONTEXTUAL]** The Carangola region in 1898 was in the declining phase of the Zona da Mata coffee economy: abolition of slavery (1888) had disrupted the labour supply, and global overproduction was beginning to undermine coffee prices. Families who could not hold land were already beginning the migrations that would eventually reach Volta Redonda.

  - **[INFERRED]** His son Antonio Engrácio Filho (P-0010) died in 1964 "sem deixar bens" (leaving no property), and both are absent from probate and land registers — consistent with a small-town or commercial Carangola family rather than a landholding one, whose economic base was trade rather than inherited land.

  ## Identity

  **Antonio Engracio de Souza** (the elder) [PROVEN] — paternal grandfather of Cidalia
  (P-0005), father of Antonio Engracio Filho (P-0010).

  - **Spouse:** Luzia Pinheiro da Conceição (P-0033) [PROVEN as reported] (CIV-0017,
  CIV-0022).

  - **Children (documented minimum three):** Antonio Engracio Filho (P-0010, b. 1894, a
  negociante) — the two shared the name, distinguished by the *de Souza / Filho / Neto*
  suffix chain. Additionally identified by their own death records: Teodolina Engracia de
  Souza (b. c.1902 MG, d. 25 December 1962, Itaperuna RJ — doméstica, widow of Abesterman
  Pinheiro) [PROVEN — her Itaperuna death record names 'filha legítima de Antonio Engracio
  e Luzia Pinheiro'] and Hermogenes Engrácio de Souza (b. c.1906 MG, d. 19 November 1971,
  Rio de Janeiro — lavrador, married Maria Dutra de Souza, three adult children) [PROVEN —
  his 1971 RJ death record names both parents]. No total child count is fixed; these three
  are the documented minimum.

  - **Death:** already deceased by his son's death in 1964 (CIV-0017) [PROVEN of the
  bound]; birth, death dates and parents not held. [OPEN]

  ## Note on evidence

  He is named as the deceased father of Antonio Engracio Filho in the 1964 civil death
  (CIV-0017) and as Cidalia's paternal grandfather in her 1930 birth (CIV-0022, there
  "Antonio Engracio de Souza"). Three records name him in his own right: (1) the 1898
  senatorial electoral act of São Francisco da Glória, Carangola (GOV-0008), which lists
  him among the admitted voters, corroborating that he was alive, a qualified (literate)
  voter, and resident in that MG parish in 1898 [CONTEXTUAL]; (2) a 1917 procuração at São
  Francisco do Glória where he signed his own name as a witness — directly attesting his
  literacy [PROVEN — FAN witness role; no image held as source]; (3) context-only records
  (FAN roles, no images held as sources) as creditor in a Muriaé probate (1903) and property
  partition (1909), confirming him as an active, propertied citizen of the area in 1898–1917
  [CONTEXTUAL]. No vital record of his own (birth, marriage or death) is held.

  ## What we can extrapolate

  The Engracio-Souza household was a Minas Gerais (Carangola-area) family before the line's
  20th-century move to Rio de Janeiro — his son and grandchildren are all MG-born
  [INFERRED]. His **Brazilian citizenship is a documented inference, not a surname guess**: he
  was an admitted elector in the 1898 federal senatorial election (GOV-0008), and under the 1891
  Constitution the franchise was restricted to Brazilian citizens, so being an admitted voter
  implies he was a citizen [INFERRED — GOV-0008]. GOV-0008 is a context-only record that attests
  no vital event, birthplace or parentage, so this is a legal inference (voter ⇒ citizen), not a
  stated fact. And that is *citizenship*, not birthplace: it does not distinguish native-born
  from naturalised, and his own place of birth is still not held [OPEN] — so it does not by
  itself close the "where was he born" question.

  On the socioeconomic read, he is the obscure trunk of what became a commercial branch.
  [INFERRED / CONTEXTUAL — origin OPEN] Nothing documents his own standing, but the branch's
  downstream shape is commercial-urban rather than landed — his son (P-0010) was a *negociante*
  who "não deixou bens" and his grandson is recorded in commerce — which hints that the
  Engrácio-Souza were a small-town or commercial Carangola-region family rather than a
  landholding one. This is inference from the descendants; his own occupation, property and
  origin are entirely undocumented, so the class of his generation is genuinely open. That the
  name *Antônio Engrácio* runs three generations deep signals a family that deliberately carried
  the patronym.

  ## Open questions

  - His birth, marriage (pre-1895) and death (pre-1964) records — likely in the Carangola
  registers — would name his own parents, the next generation up. [OPEN]

  ## Sources held (this repository)

  - CIV-0017 (son Antonio Engracio Filho's 1964 death — names him as deceased father) ·
  CIV-0022 (granddaughter Cidalia's 1930 birth — names him as paternal grandfather) · GOV-0008
  (1898 senatorial electoral act, São Francisco da Glória, Carangola — names him as an admitted
  voter; context-only, attests no vital event, birthplace or parentage).

