profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele aparece em nome próprio em apenas um registro: a lista eleitoral senatorial de 1898 da freguesia de São Francisco da Glória, Carangola (GOV-0008), que o lista como eleitor admitido — documentando que estava vivo, alfabetizado (a Constituição de 1891 restringia o sufrágio a alfabetizados) e residente naquela freguesia da Zona da Mata em 1898.

  - **[PROVEN]** A Constituição republicana de 1891 restringia o voto a cidadãos brasileiros homens adultos e alfabetizados; ser admitido como eleitor na eleição federal senatorial de 1898 implica que era alfabetizado. Isso é independentemente corroborado por uma procuração de 1917 em São Francisco do Glória na qual assinou seu próprio nome como testemunha, atestando diretamente a alfabetização [PROVEN — procuração de 1917; papel de FAN testemunha, sem imagem disponível como fonte]. Era, portanto, alfabetizado — acima do analfabetismo rural que caracterizava outros de seu meio.

  - **[INFERRED]** O nome Antonio Engrácio perpassa três gerações sucessivas dessa família (ele, seu filho Antonio Engrácio Filho e seu neto Antonio Engrácio Neto), sinalizando um patronímico familiar deliberado — estratégia de identidade mais comum em famílias com ao menos algum prestígio social a afirmar.

  - **[CONTEXTUAL]** A região de Carangola em 1898 vivia a fase de declínio da economia cafeeira da Zona da Mata: a abolição da escravidão (1888) havia perturbado a oferta de mão de obra, e a superprodução global começava a corroer os preços do café. As famílias que não conseguiam manter terras já iniciavam as migrações que eventualmente alcançariam Volta Redonda.

  - **[INFERRED]** Seu filho Antonio Engrácio Filho (P-0010) faleceu em 1964 "sem deixar bens" e ambos estão ausentes dos registros de inventários e terras — coerente com uma família de pequena cidade ou comercial de Carangola, e não uma proprietária de terras, cuja base econômica era o comércio e não a terra herdada.

  ## Identidade

  **Antonio Engracio de Souza** (o velho) [PROVEN] — avô paterno de Cidalia (P-0005), pai
  de Antonio Engracio Filho (P-0010).

  - **Cônjuge:** Luzia Pinheiro da Conceição (P-0033) [PROVEN conforme declarado] (CIV-0017,
  CIV-0022).

  - **Filhos (mínimo documentado de três):** Antonio Engracio Filho (P-0010, n. 1894,
  negociante) — os dois compartilhavam o nome, distinguidos pela cadeia de sufixos *de
  Souza / Filho / Neto*. Identificados adicionalmente por seus próprios registros de óbito:
  Teodolina Engracia de Souza (n. c.1902 MG, f. 25 de dezembro de 1962, Itaperuna RJ —
  doméstica, viúva de Abesterman Pinheiro) [PROVEN — óbito de Itaperuna nomeia 'filha
  legítima de Antonio Engracio e Luzia Pinheiro'] e Hermogenes Engrácio de Souza (n.
  c.1906 MG, f. 19 de novembro de 1971, Rio de Janeiro — lavrador, casado com Maria Dutra
  de Souza, três filhos adultos) [PROVEN — óbito de 1971 no RJ nomeia ambos os pais]. O
  total de filhos não está fixado; esses três são o mínimo documentado.

  - **Óbito:** já falecido ao tempo do óbito de seu filho em 1964 (CIV-0017) [PROVEN quanto
  ao limite]; datas de nascimento e óbito e pais não obtidos. [OPEN]

  ## Nota sobre a evidência

  Ele é nomeado como pai falecido de Antonio Engracio Filho no óbito civil de 1964 (CIV-0017)
  e como avô paterno de Cidalia em seu nascimento de 1930 (CIV-0022, ali "Antonio Engracio de
  Souza"). Três registros o nomeiam em nome próprio: (1) a ata eleitoral senatorial de 1898 da
  Freguesia de São Francisco da Glória, Carangola (GOV-0008), que o arrola entre os eleitores
  admitidos [CONTEXTUAL]; (2) uma procuração de 1917 em São Francisco do Glória na qual
  assinou seu próprio nome como testemunha, atestando diretamente a alfabetização [PROVEN —
  papel de FAN testemunha; sem imagem disponível como fonte]; (3) registros apenas de contexto
  (papéis de FAN, sem imagens disponíveis como fontes) como credor num inventário de Muriaé
  (1903) e numa partilha de imóvel (1909), confirmando-o como cidadão ativo e com bens na área
  em 1898–1917 [CONTEXTUAL]. Nenhum registro vital próprio dele (nascimento, casamento ou
  óbito) foi obtido.

  ## O que podemos extrapolar

  O lar Engracio-Souza era uma família de Minas Gerais (região de Carangola) antes da
  mudança da linha para o Rio de Janeiro no século XX — seu filho e seus netos são todos
  nascidos em MG [INFERRED]. Sua **cidadania brasileira é uma inferência documentada, não um
  palpite pelo sobrenome**: ele foi eleitor admitido na eleição federal para Senador de 1898
  (GOV-0008), e pela Constituição de 1891 o sufrágio era restrito a cidadãos brasileiros, de
  modo que ser eleitor admitido implica que era cidadão [INFERRED — GOV-0008]. GOV-0008 é um
  registro apenas de contexto, que não atesta nenhum evento vital, local de nascimento ou
  filiação, de modo que se trata de uma inferência jurídica (eleitor ⇒ cidadão), não de um fato
  declarado. E isso é *cidadania*, não local de nascimento: não distingue nativo de
  naturalizado, e seu próprio local de nascimento ainda não foi obtido [OPEN] — logo não fecha,
  por si só, a questão de "onde ele nasceu".

  Na leitura socioeconômica, ele é o tronco obscuro do que veio a ser um ramo comercial.
  [INFERRED / CONTEXTUAL — origem OPEN] Nada documenta sua própria posição, mas a forma a jusante
  do ramo é comercial-urbana, e não fundiária — seu filho (P-0010) foi um *negociante* que "não
  deixou bens" e seu neto é registrado no comércio —, o que sugere que os Engrácio-Souza eram uma
  família de pequena cidade ou comercial da região de Carangola, e não uma proprietária de
  terras. Trata-se de inferência a partir dos descendentes; sua própria ocupação, propriedade e
  origem são inteiramente não documentadas, de modo que a classe de sua geração é genuinamente
  aberta. Que o nome *Antônio Engrácio* atravesse três gerações sinaliza uma família que
  carregou deliberadamente o patronímico.

  ## Questões em aberto

  - Seus registros de nascimento, casamento (anterior a 1895) e óbito (anterior a 1964) —
  provavelmente nos cartórios de Carangola — nomeariam seus próprios pais, a geração
  seguinte acima. [OPEN]

