  ## Contexto regional e migratório

  [CONTEXTUAL] Sua vida abrange a mudança **Sapucaia (RJ) → Carangola (MG)** que levou
  a família para fora do antigo vale cafeeiro do Paraíba do Sul rumo à Zona da Mata
  Mineira, ainda fértil e servida por ferrovia. Nascido em Sapucaia em 1892, estava
  casado e lavrando em Carangola em 1916; suas irmãs Joventina e Mercedes, nascidas na
  freguesia de Carangola por volta de 1898–1899 (PAR-0013, PAR-0014), datam a mudança
  da família para cerca de 1892–1899. A origem da linhagem anterior a Sapucaia está agora
  documentada no lado Muniz: seu pai João Muniz Bittencourt (P-0019) nasceu na Ilha de São
  Miguel, Açores (seu próprio batismo de 1845 em Povoação, PAR-0022, e seu óbito de 1915 em
  Carangola, "natural da Ilha de São Miguel", PAR-0007), filho do proprietário micaelense
  Manoel Muniz Bytancourt (P-0042, PAR-0015) — uma origem açoriana documentada, não uma
  inferência a partir do sobrenome.

