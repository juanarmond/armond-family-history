profile: >-
  ## Interesting facts

  - **[PROVEN]** He and his sister Joventina married on the same day — 21 October 1916 — at the same church (Igreja de Santa Luzia de Carangola), in adjacent acts numbered 34 and 35 (PAR-0012, PAR-0013). A brother and sister marrying the same day in the same church is a strong marker of a kin-group moving and anchoring itself as a unit.

  - **[PROVEN]** His 1916 marriage certificate (CIV-0006) records a documented literacy divide: he signed his own name, while his bride Luiza (P-0013) could not read or write and was signed for by proxy. In that era, literacy was a purchased, class-linked privilege — the exact boundary between the Muniz smallholder world and the propertyless Azevedo household she came from.

  - **[CONTEXTUAL]** He was born at Sapucaia, Rio de Janeiro (1892), and his baptism (PAR-0004) is the primary record that settles his father's name as "João" — resolving an earlier error in which an 1882 provisão had recorded "José." His Azorean grandfather João emigrated from São Miguel; Deocleciano was the first generation born in Brazil.

  - **[INFERRED]** The family's RJ → MG move can be dated by his sisters' birthplaces: Deocleciano was born at Sapucaia (1892), but his sisters Joventina and Mercedes were born in the Carangola parish (~1898–1899, PAR-0013, PAR-0014). The whole kin-cluster moved from the Paraíba do Sul coffee valley to the Zona da Mata Mineira between 1892 and ~1899.

  - **[CONTEXTUAL]** His father João Muniz Bittencourt emigrated from the Ilha de São Miguel, Açores (PAR-0007), where his own father Manoel had drowned at sea in 1866 (PAR-0015). Deocleciano was a third-generation descendant of a proprietário Azorean family that had lost its patriarch to the Atlantic and its small landholding to partible inheritance.

  - **[INFERRED]** His death record is not held: he disappears from the archive after his son Aristides' 1922 baptism (PAR-0003) and is referenced only as a named parent thereafter. The death of a rural farmer with no estate leaves almost no paper trail — this absence of a final record is itself class information.

  ## Identity

  **Deocleciano Muniz Bittencourt** [PROVEN] — the form in his 1916 civil marriage
  (CIV-0001) and his own 1892 baptism (PAR-0004); the shorter "Deocleciano Muniz"
  appears in his son Antenor's 1949 marriage (CIV-0004). The surname is also written
  *Bitencourt* in the register hand.

  - **Birth:** about **June 1892** at **Santo Antônio de Sapucaia, Rio de Janeiro**
  [PROVEN month and year] — his baptism records him "nascido a [um] deste mez"; the
  day is an uncertain read while the month and year are clear (PAR-0004), corroborated
  by his stated age 24 at his 1916 marriage (CIV-0001).

  - **Baptism:** **25 June 1892** at the Igreja de Santo Antônio de Sapucaia [PROVEN]
  (PAR-0004), by Pe. Francisco Antônio Pinto Pereira da Veiga; godparents João de
  Souza Freitas and [Anna] Rita Brandão (given name an uncertain read), the latter a
  maternal Brandão relative.

  - **Parents:** **João Muniz Bittencourt** (P-0019) and **Susanna Rita Brandão**
  (P-0020) [PROVEN] — named in his baptism (PAR-0004); João was "já fallecido neste
  districto" (Carangola) by 1916 (CIV-0006, PAR-0012). The baptism settles the
  father's given name as "João" (a superseded 1882 record's "José" was an error).

  - **Marriage:** married **Luiza Fernandes de Azevedo** (P-0013) at **Carangola,
  Minas Gerais, on 21 October 1916** [PROVEN] — civil (CIV-0001; full-content
  CIV-0006: livro 8-B, fl. 118, termo 62; before Juiz de Paz Major Américo de
  Lacerda; regime of comunhão de bens) and the same-day religious act (PAR-0012, acto
  nº 35 at the Igreja de Santa Luzia de Carangola, Pe. João Coutinho). Witnesses
  Justino Ribeiro Rodrigues and Antonio Theodoro de Souza.

  - **Children:** his son **Antenor Muniz** (P-0006, b. 1923) and the documented child
  **Aristides** (bapt. 1922, PAR-0003). Further children circulate on collaborative
  trees [LEAD].

  - **Death:** not documented in this repository [OPEN].

  ## Standing and profession

  - **Lavrador (farmer)** [PROVEN] (CIV-0006).

  - **Literate** [PROVEN] — he signed his own 1916 marriage act, whereas his bride
  signed by proxy for not being able to read or write (CIV-0006).

  ## Family and social network

  Born into the Muniz Bittencourt / Brandão kin-group at Sapucaia (RJ). His
  **sisters** are documented at Carangola/Sapucaia: **Ritta** (b. 15 January 1890,
  Sapucaia — her birth act names both parents and all four grandparents, CIV-0041),
  **Anna** (b. 1884, Sapucaia, PAR-0006; d. 1950 Guaçuí-ES as Ana dos Santos Ferreira,
  CIV-0042), **Joventina** (married 21 October 1916 — the same day and church as
  Deocleciano, adjacent acts nº 34 and nº 35, PAR-0013) and **Mercedes Maria** (married
  1917, PAR-0014). He married into the **Azevedo** line (Luiza, daughter of José
  Secundino de Azevedo P-0038 and Thereza Fernandes de Azevedo P-0039).

  ## What we can extrapolate

  *Deocleciano is the flat bottom of the arc — the generation holding neither the island
  land his great-grandfather owned nor the urban trade his son would learn.*

  **1. He is the generational hinge, and his siblings date the move [PROVEN].** He was born
  and baptised at Sapucaia, Rio de Janeiro, in 1892 (PAR-0004); his sisters Mercedes and
  Joventina were born and baptised in the Carangola parish about 1898–1899 (PAR-0014,
  PAR-0013). **[INFERRED]** The family therefore crossed from the exhausted Paraíba do Sul
  valley onto the younger Zona da Mata Mineira coffee frontier **between 1892 and about
  1899** — a second migration one generation after the Atlantic one, and for the same
  reason: the land where they were did not support the household they had.

  **2. He inherited nothing, and the arithmetic says why [PROVEN / INFERRED].** His father
  João is nowhere documented as owning land in Brazil, and died in 1915 leaving **eleven
  children** (PAR-0007). **[INFERRED]** Whatever the household had at Carrego do Boa Vista,
  Deocleciano's claim on it was one-eleventh — the same partible arithmetic that had emptied
  the Povoação smallholding two generations earlier (P-0042), reproduced at larger scale on
  the other side of the Atlantic. His standing was not inherited, not married-in, not
  office-earned and not self-made; there was simply nothing to acquire.

  **3. His only documented asset is a signature — and it is now a two-generation chain, not
  a one-off [PROVEN / corrects an earlier reading].** He signed his own 1916 marriage act
  while the bride was signed for by proxy, **"por aquella não saber ler nem escrever"**
  (CIV-0006). The earlier profile read this as the line's first and isolated literacy. It is
  not: his father João had already signed his daughter's civil birth registration at
  Sapucaia in 1890 (CIV-0041). **[INFERRED]** Practical letters therefore ran father-to-son
  across the immigrant generation. What they did **not** do is compound. Deocleciano
  remained a *lavrador* (CIV-0006), and his own son Antenor is recorded "da lavoura" at his
  1949 marriage (CIV-0004). **[CONTEXTUAL]** In early-twentieth-century rural Minas,
  schooling was a purchased, class-linked privilege re-bought each generation; a signature
  acquired for use is competence, not capital, and it opened no door by itself.

  **4. The literacy gap is also a marriage-market fact [PROVEN / INFERRED].** He could sign;
  his eighteen-year-old bride could not. Both were fatherless — his father João "já
  fallecido neste districto", hers "já fallecido" too (CIV-0006). **[INFERRED]** Two
  headless households joining, with the groom marginally the more literate party, is not a
  match that brought property, connection or schooling into the family. It brought people.
  The marriage regime was *comunhão de bens*, but that is the legal default of the period
  and carries no information about what either side owned.

  **5. The compadrio pattern holds for a fourth documented generation — and never once
  reaches upward [PROVEN pattern / INFERRED reading].** At his son Aristides's 1922 baptism
  the godparents were **Antonio dos Santos Ferreira and Anna Muniz Bittencourt** (PAR-0003)
  — his own sister, standing with the man whose surname she bore as a widow in 1950
  (CIV-0042), so almost certainly her husband. Set that beside the Povoação baptisms of the
  1830s, where one neighbour couple sponsored six children in a row (P-0042), and the 1885
  Sapucaia baptism sponsored by his mother's own parents (PAR-0006). **[INFERRED]** Across
  roughly ninety years, four generations and one ocean, this family's godparents are always
  kin or immediate neighbours and never a patron — no captain, no priest, no landowner.
  Baptismal sponsorship was the standard Luso-Brazilian instrument for attaching a household
  to someone more powerful; that this line never used it that way is the most consistent
  single measure of where it stood.

  **6. What did improve was the environment, not his position [PROVEN / INFERRED].** His
  1916 witnesses were Justino Ribeiro Rodrigues, 44, married, *lavrador*, and Antonio
  Theodoro de Souza, 30, *lavrador* — and both signed (CIV-0006). Four generations earlier,
  the witnesses to the family's own acts at Povoação signed with crosses (PAR-0024,
  PAR-0038, PAR-0040, PAR-0046). **[INFERRED]** A literate smallholder circle in 1916
  Carangola is a better world than an illiterate one in 1840s Povoação; it did not make
  Deocleciano anything other than a farmer among farmers.

  **7. He leaves no estate and therefore almost no paper [PROVEN absence / INFERRED].**
  After his son's 1922 baptism he appears only as a named parent. No death act, no
  inventário, no probate is held or indexed for him. **[INFERRED]** That silence is itself
  class information: probate exists to divide property, and a man with none generates none.
  Contrast the other side of the owner's tree, where Mathilde Maria de Jesus's death
  produced a seven-year inventory process and thousands of folios (P-0027). The archive
  records the propertied far more thickly than it records anyone else.

  **Synthesis — the trough.** Deocleciano holds the family's position steady and that is all
  he does, which in this arc is the point. Above him the line still remembers owning ground
  in the Açores; below him it will own a house in Volta Redonda bought with a plumber's wage
  (P-0006). He himself has neither: a *lavrador* with a signature, eleven-way inheritance
  prospects, a kin-network instead of connections, and no mechanism of any kind to rise.
  **[INFERRED]** He is the clearest single frame of this family's class DNA — capital in the
  form of land-and-labour, status in the form of practical literacy and dense kinship, and
  no office, title, commerce or purchased schooling anywhere. That base reproduced
  faithfully across an ocean and two frontiers, which is exactly why it never moved.

  ## Open questions

  - His death record — where and when — is not held. [OPEN]

  - The exact day of his June 1892 birth (an uncertain read in the register). [OPEN]

  ## Sources held (this repository)

  - PAR-0004 (his 1892 Sapucaia baptism — birth, parents, settles the father as
  "João") · CIV-0001 (1916 civil marriage — names, ages, birthplaces, parents) ·
  CIV-0006 (full-content 1916 marriage — lavrador, his signature/literacy, civil venue
  and officials) · PAR-0012 (1916 parish marriage — acto nº 35, corroborates parents
  and birthplaces).

  - CIV-0004 (1949 — names him "Deocleciano Muniz" as Antenor's father) · PAR-0003
  (1922 baptism of his son Aristides).

  - PAR-0006 (sister Anna, b. 1884) · PAR-0013 (sister Joventina, married the same
  day) · PAR-0014 (sister Mercedes, married 1917) — collateral siblings on his birth
  family.

  - REC-0001 (owner's direct-ancestor roster).

  ## Regional and migration context

  [CONTEXTUAL] His life spans the **Sapucaia (RJ) → Carangola (MG)** move that carried
  the family off the older Paraíba do Sul coffee valley and onto the still-fertile,
  rail-linked Zona da Mata Mineira. Born at Sapucaia in 1892, he was married and
  farming at Carangola by 1916; his sisters Joventina and Mercedes, born in the
  Carangola parish about 1898–1899 (PAR-0013, PAR-0014), date the family's move to
  roughly 1892–1899. The line's origin earlier than Sapucaia is now documented on the Muniz
  side: his father João Muniz Bittencourt (P-0019) was born on the Ilha de São Miguel, Açores
  (his own 1845 Povoação baptism PAR-0022 and his 1915 Carangola death "natural da Ilha de São
  Miguel", PAR-0007), son of the São Miguel proprietário Manoel Muniz Bytancourt (P-0042,
  PAR-0015) — a documented Azorean origin, not a surname inference.

  ## Where to go today

  - **Baptism (1892):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro, CEP 25880-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Marriage to Luiza (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele e sua irmã Joventina casaram-se no mesmo dia — 21 de outubro de 1916 — na mesma igreja (Igreja de Santa Luzia de Carangola), em atos adjacentes de números 34 e 35 (PAR-0012, PAR-0013). Um irmão e uma irmã casando-se no mesmo dia na mesma igreja é um marcador forte de um grupo de parentesco que se movia e se ancorava como uma unidade.

  - **[PROVEN]** Sua certidão de casamento de 1916 (CIV-0006) registra um contraste documentado de letramento: ele assinou o próprio nome, enquanto sua noiva Luiza (P-0013) não sabia ler nem escrever e foi assinada por procuração. Naquela época, o letramento era um privilégio comprado e ligado à classe — a fronteira exata entre o mundo dos lavradores proprietários Muniz e o lar sem bens Azevedo de onde ela vinha.

  - **[CONTEXTUAL]** Nasceu em Sapucaia, Rio de Janeiro (1892), e seu batismo (PAR-0004) é o registro primário que estabelece o nome do pai como "João" — resolvendo um erro anterior em que uma provisão de 1882 havia registrado "José". Seu avô açoriano João emigrou de São Miguel; Deocleciano foi a primeira geração nascida no Brasil.

  - **[INFERRED]** A mudança da família do RJ para o MG pode ser datada pelos locais de nascimento de suas irmãs: Deocleciano nasceu em Sapucaia (1892), mas suas irmãs Joventina e Mercedes nasceram na freguesia de Carangola (~1898–1899, PAR-0013, PAR-0014). Todo o grupo de parentesco mudou-se do vale cafeeiro do Paraíba do Sul para a Zona da Mata Mineira entre 1892 e ~1899.

  - **[CONTEXTUAL]** Seu pai João Muniz Bittencourt emigrou da Ilha de São Miguel, Açores (PAR-0007), onde seu próprio pai Manoel havia se afogado no mar em 1866 (PAR-0015). Deocleciano era um descendente de terceira geração de uma família de proprietários açorianos que havia perdido o patriarca para o Atlântico e a pequena propriedade para a herança partível.

  - **[INFERRED]** Seu registro de óbito não está disponível: ele desaparece do arquivo após o batismo de seu filho Aristides em 1922 (PAR-0003) e é referenciado apenas como pai nomeado depois disso. A morte de um lavrador rural sem espólio quase não deixa rastro documental — essa ausência de um registro final é, em si, informação de classe.

  ## Identidade

  **Deocleciano Muniz Bittencourt** [PROVEN] — a forma em seu casamento civil de 1916
  (CIV-0001) e em seu próprio batismo de 1892 (PAR-0004); a forma mais curta
  "Deocleciano Muniz" aparece no casamento de 1949 de seu filho Antenor (CIV-0004). O
  sobrenome também é grafado *Bitencourt* na letra do registro.

  - **Nascimento:** por volta de **junho de 1892**, em **Santo Antônio de Sapucaia,
  Rio de Janeiro** [PROVEN month and year] — seu batismo o registra "nascido a [um]
  deste mez"; o dia é uma leitura incerta, enquanto o mês e o ano são claros
  (PAR-0004), corroborados por sua idade declarada de 24 anos em seu casamento de 1916
  (CIV-0001).

  - **Batismo:** **25 de junho de 1892**, na Igreja de Santo Antônio de Sapucaia
  [PROVEN] (PAR-0004), por Pe. Francisco Antônio Pinto Pereira da Veiga; padrinhos João
  de Souza Freitas e [Anna] Rita Brandão (prenome de leitura incerta), esta última uma
  parenta materna Brandão.

  - **Pais:** **João Muniz Bittencourt** (P-0019) e **Susanna Rita Brandão** (P-0020)
  [PROVEN] — nomeados em seu batismo (PAR-0004); João estava "já fallecido neste
  districto" (Carangola) em 1916 (CIV-0006, PAR-0012). O batismo estabelece o prenome
  do pai como "João" (o "José" de um registro superado de 1882 foi um erro).

  - **Casamento:** casou-se com **Luiza Fernandes de Azevedo** (P-0013) em
  **Carangola, Minas Gerais, em 21 de outubro de 1916** [PROVEN] — civil (CIV-0001;
  inteiro teor CIV-0006: livro 8-B, fl. 118, termo 62; perante o Juiz de Paz Major
  Américo de Lacerda; regime de comunhão de bens) e o ato religioso do mesmo dia
  (PAR-0012, acto nº 35 na Igreja de Santa Luzia de Carangola, Pe. João Coutinho).
  Testemunhas Justino Ribeiro Rodrigues e Antonio Theodoro de Souza.

  - **Filhos:** seu filho **Antenor Muniz** (P-0006, n. 1923) e o filho documentado
  **Aristides** (bat. 1922, PAR-0003). Outros filhos circulam em árvores colaborativas
  [LEAD].

  - **Óbito:** não documentado neste repositório [OPEN].

  ## Posição social e profissão

  - **Lavrador** [PROVEN] (CIV-0006).

  - **Letrado** [PROVEN] — assinou seu próprio assento de casamento de 1916, enquanto
  sua noiva assinou por procuração por não saber ler nem escrever (CIV-0006).

  ## Família e rede social

  Nasceu no grupo de parentesco Muniz Bittencourt / Brandão em Sapucaia (RJ). Suas
  **irmãs** estão documentadas em Carangola/Sapucaia: **Ritta** (n. 15 de janeiro de
  1890, Sapucaia — seu assento de nascimento nomeia ambos os pais e os quatro avós,
  CIV-0041), **Anna** (n. 1884, Sapucaia, PAR-0006; f. 1950 em Guaçuí-ES como Ana dos
  Santos Ferreira, CIV-0042), **Joventina** (casada em 21 de outubro de 1916 — no mesmo
  dia e igreja que Deocleciano, atos adjacentes nº 34 e nº 35, PAR-0013) e **Mercedes
  Maria** (casada em
  1917, PAR-0014). Casou-se com a linha **Azevedo** (Luiza, filha de José Secundino de
  Azevedo P-0038 e Thereza Fernandes de Azevedo P-0039).

  ## O que podemos extrapolar

  *Deocleciano é o fundo plano do arco — a geração que não detém nem a terra insular que seu
  bisavô possuiu nem o ofício urbano que seu filho aprenderia.*

  **1. Ele é a dobradiça geracional, e seus irmãos datam a mudança [PROVEN].** Nasceu e foi
  batizado em Sapucaia, Rio de Janeiro, em 1892 (PAR-0004); suas irmãs Mercedes e Joventina
  nasceram e foram batizadas na freguesia de Carangola por volta de 1898–1899 (PAR-0014,
  PAR-0013). **[INFERRED]** A família, portanto, passou do vale exaurido do Paraíba do Sul
  para a fronteira cafeeira mais nova da Zona da Mata Mineira **entre 1892 e cerca de 1899**
  — uma segunda migração uma geração depois da atlântica, e pelo mesmo motivo: a terra onde
  estavam não sustentava a casa que tinham.

  **2. Ele não herdou nada, e a aritmética diz por quê [PROVEN / INFERRED].** Seu pai João
  em parte alguma é documentado como proprietário de terras no Brasil, e morreu em 1915
  deixando **onze filhos** (PAR-0007). **[INFERRED]** Fosse o que fosse que a casa tivesse
  no Carrego do Boa Vista, o quinhão de Deocleciano era um onze avos — a mesma aritmética
  partilhável que esvaziara a pequena propriedade da Povoação duas gerações antes (P-0042),
  reproduzida em escala maior do outro lado do Atlântico. Sua posição não foi herdada, nem
  trazida pelo casamento, nem conquistada por cargo, nem construída por si; simplesmente não
  havia o que adquirir.

  **3. Seu único bem documentado é uma assinatura — e agora é uma cadeia de duas gerações,
  não um caso isolado [PROVEN / corrige leitura anterior].** Ele assinou o próprio ato de
  casamento de 1916, enquanto a noiva foi assinada a rogo, **"por aquella não saber ler nem
  escrever"** (CIV-0006). O perfil anterior lia isso como a primeira e isolada alfabetização
  da linhagem. Não é: seu pai João já havia assinado o registro civil de nascimento da filha
  em Sapucaia, em 1890 (CIV-0041). **[INFERRED]** Letras práticas, portanto, correram de pai
  para filho através da geração imigrante. O que elas **não** fizeram foi capitalizar-se.
  Deocleciano permaneceu *lavrador* (CIV-0006), e seu próprio filho Antenor é registrado "da
  lavoura" em seu casamento de 1949 (CIV-0004). **[CONTEXTUAL]** Nas Minas rurais do início
  do século XX, a escolarização era um privilégio comprado e ligado à classe, recomprado a
  cada geração; uma assinatura adquirida para uso é competência, não capital, e por si só
  não abriu porta alguma.

  **4. O fosso de alfabetização é também um fato do mercado matrimonial [PROVEN /
  INFERRED].** Ele sabia assinar; sua noiva de dezoito anos, não. Ambos eram órfãos de pai —
  o dele, João, "já fallecido neste districto", o dela também "já fallecido" (CIV-0006).
  **[INFERRED]** Duas casas sem chefe unindo-se, com o noivo marginalmente mais letrado, não
  é um enlace que tenha trazido à família patrimônio, relações ou instrução. Trouxe pessoas.
  O regime foi o de *comunhão de bens*, mas esse era o regime legal supletivo do período e
  nada informa sobre o que qualquer dos lados possuía.

  **5. O padrão de compadrio se mantém por uma quarta geração documentada — e nenhuma vez
  alcança para cima [PROVEN no padrão / INFERRED na leitura].** No batismo de 1922 de seu
  filho Aristides, os padrinhos foram **Antonio dos Santos Ferreira e Anna Muniz
  Bittencourt** (PAR-0003) — sua própria irmã, ao lado do homem cujo sobrenome ela usava
  como viúva em 1950 (CIV-0042), portanto quase certamente seu marido. Ponha-se isso ao lado
  dos batismos da Povoação na década de 1830, em que um casal de vizinhos apadrinhou seis
  filhos seguidos (P-0042), e do batismo de 1885 em Sapucaia, apadrinhado pelos próprios
  pais de sua mãe (PAR-0006). **[INFERRED]** Ao longo de cerca de noventa anos, quatro
  gerações e um oceano, os padrinhos desta família são sempre parentes ou vizinhos
  imediatos, e nunca um patrono — nenhum capitão, nenhum sacerdote, nenhum senhor de terras.
  O apadrinhamento batismal era o instrumento luso-brasileiro padrão para atar uma casa a
  alguém mais poderoso; que esta linhagem nunca o tenha usado assim é a medida mais
  constante de onde ela estava.

  **6. O que melhorou foi o ambiente, não a posição dele [PROVEN / INFERRED].** Suas
  testemunhas de 1916 foram Justino Ribeiro Rodrigues, 44 anos, casado, *lavrador*, e
  Antonio Theodoro de Souza, 30 anos, *lavrador* — e ambos assinaram (CIV-0006). Quatro
  gerações antes, as testemunhas dos próprios atos da família na Povoação assinavam de cruz
  (PAR-0024, PAR-0038, PAR-0040, PAR-0046). **[INFERRED]** Um círculo de pequenos lavradores
  alfabetizados na Carangola de 1916 é um mundo melhor que um círculo analfabeto na Povoação
  da década de 1840; não fez de Deocleciano outra coisa senão um lavrador entre lavradores.

  **7. Ele não deixa espólio e, por isso, quase não deixa papel [PROVEN na ausência /
  INFERRED].** Depois do batismo do filho em 1922, ele aparece apenas como pai nomeado.
  Nenhum assento de óbito, nenhum inventário, nenhum processo sucessório consta em nossas
  mãos ou nos índices. **[INFERRED]** Esse silêncio é, ele próprio, informação de classe: o
  inventário existe para dividir bens, e quem não os tem não gera nenhum. Compare-se o outro
  lado da árvore do proprietário do repositório, em que a morte de Mathilde Maria de Jesus
  produziu um processo de inventário de sete anos e milhares de fólios (P-0027). O arquivo
  registra os proprietários muito mais densamente do que registra qualquer outra pessoa.

  **Síntese — o fundo.** Deocleciano mantém estável a posição da família, e é só o que faz —
  o que, neste arco, é justamente o ponto. Acima dele a linhagem ainda se lembra de ter
  possuído chão nos Açores; abaixo dele possuirá uma casa em Volta Redonda, comprada com
  salário de bombeiro hidráulico (P-0006). Ele próprio não tem nem uma coisa nem outra: um
  *lavrador* com assinatura, expectativas hereditárias divididas por onze, uma rede de
  parentesco no lugar de relações e nenhum mecanismo de qualquer espécie para subir.
  **[INFERRED]** É o retrato mais nítido do DNA de classe desta família — capital sob a
  forma de terra-e-trabalho, posição sob a forma de alfabetização prática e parentesco
  denso, e nenhum cargo, título, comércio ou instrução comprada em lugar algum. Essa base se
  reproduziu fielmente através de um oceano e de duas fronteiras, e é exatamente por isso
  que nunca se moveu.

