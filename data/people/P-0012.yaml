profile: >-
  ## Interesting facts

  - **[PROVEN]** He and his sister Joventina married on the same day — 21 October 1916 — at the same church (Igreja de Santa Luzia de Carangola), in adjacent acts numbered 34 and 35 (PAR-0012, PAR-0013). A brother and sister marrying the same day in the same church is a strong marker of a kin-group moving and anchoring itself as a unit.

  - **[PROVEN]** His 1916 marriage certificate (CIV-0006) records a documented literacy divide: he signed his own name, while his bride Luiza (P-0013) could not read or write and was signed for by proxy. In that era, literacy was a purchased, class-linked privilege — the exact boundary between the Muniz smallholder world and the propertyless Azevedo household she came from.

  - **[CONTEXTUAL]** He was born at Sapucaia, Rio de Janeiro (1892), and his baptism (PAR-0004) is the primary record that settles his father's name as "João" — resolving an earlier error in which an 1882 provisão had recorded "José." His Azorean grandfather João emigrated from São Miguel; Deocleciano was the first generation born in Brazil.

  - **[INFERRED]** The family's RJ → MG move can be dated by his sisters' birthplaces: Deocleciano was born at Sapucaia (1892), but his sisters Joventina and Mercedes were born in the Carangola parish (~1898–1899, PAR-0013, PAR-0014). The whole kin-cluster moved from the Paraíba do Sul coffee valley to the Zona da Mata Mineira between 1892 and ~1899.

  - **[CONTEXTUAL]** His father João Muniz Bittencourt emigrated from the Ilha de São Miguel, Açores (PAR-0007), where his own father Manoel had drowned at sea in 1866 (PAR-0015). Deocleciano was a third-generation descendant of a proprietário Azorean family that had lost its patriarch to the Atlantic and its small landholding to partible inheritance.

  - **[INFERRED]** His death record is not held: he disappears from the archive after his son Aristides' 1922 baptism (PAR-0003) and is referenced only as a named parent thereafter. The death of a rural farmer with no estate leaves almost no paper trail — this absence of a final record is itself class information.

  ## Identity

  **Deocleciano Muniz Bittencourt** [PROVEN] — the form in his 1916 civil marriage
  (CIV-0001) and his own 1892 baptism (PAR-0004); the shorter "Deocleciano Muniz"
  appears in his son Antenor's 1949 marriage (CIV-0004). The surname is also written
  *Bitencourt* in the register hand.

  - **Birth:** about **June 1892** at **Santo Antônio de Sapucaia, Rio de Janeiro**
  [PROVEN month and year] — his baptism records him "nascido a [um] deste mez"; the
  day is an uncertain read while the month and year are clear (PAR-0004), corroborated
  by his stated age 24 at his 1916 marriage (CIV-0001).

  - **Baptism:** **25 June 1892** at the Igreja de Santo Antônio de Sapucaia [PROVEN]
  (PAR-0004), by Pe. Francisco Antônio Pinto Pereira da Veiga; godparents João de
  Souza Freitas and [Anna] Rita Brandão (given name an uncertain read), the latter a
  maternal Brandão relative.

  - **Parents:** **João Muniz Bittencourt** (P-0019) and **Susanna Rita Brandão**
  (P-0020) [PROVEN] — named in his baptism (PAR-0004); João was "já fallecido neste
  districto" (Carangola) by 1916 (CIV-0006, PAR-0012). The baptism settles the
  father's given name as "João" (a superseded 1882 record's "José" was an error).

  - **Marriage:** married **Luiza Fernandes de Azevedo** (P-0013) at **Carangola,
  Minas Gerais, on 21 October 1916** [PROVEN] — civil (CIV-0001; full-content
  CIV-0006: livro 8-B, fl. 118, termo 62; before Juiz de Paz Major Américo de
  Lacerda; regime of comunhão de bens) and the same-day religious act (PAR-0012, acto
  nº 35 at the Igreja de Santa Luzia de Carangola, Pe. João Coutinho). Witnesses
  Justino Ribeiro Rodrigues and Antonio Theodoro de Souza.

  - **Children:** his son **Antenor Muniz** (P-0006, b. 1923) and the documented child
  **Aristides** (bapt. 1922, PAR-0003). Further children circulate on collaborative
  trees [LEAD].

  - **Death:** not documented in this repository [OPEN].

  ## Standing and profession

  - **Lavrador (farmer)** [PROVEN] (CIV-0006).

  - **Literate** [PROVEN] — he signed his own 1916 marriage act, whereas his bride
  signed by proxy for not being able to read or write (CIV-0006).

  ## Family and social network

  Born into the Muniz Bittencourt / Brandão kin-group at Sapucaia (RJ). His
  **sisters** are documented at Carangola/Sapucaia: **Ritta** (b. 15 January 1890,
  Sapucaia — her birth act names both parents and all four grandparents, CIV-0041),
  **Anna** (b. 1884, Sapucaia, PAR-0006; d. 1950 Guaçuí-ES as Ana dos Santos Ferreira,
  CIV-0042), **Joventina** (married 21 October 1916 — the same day and church as
  Deocleciano, adjacent acts nº 34 and nº 35, PAR-0013) and **Mercedes Maria** (married
  1917, PAR-0014). He married into the **Azevedo** line (Luiza, daughter of José
  Secundino de Azevedo P-0038 and Thereza Fernandes de Azevedo P-0039).

  ## What we can extrapolate

  [INFERRED] Deocleciano is the **generational hinge**: the earliest of this line born
  at Sapucaia (RJ) and the first documented as a Carangola (MG) farmer. His literacy
  (rare enough that his own wife signed by proxy) and the same-day double wedding with
  his sister Joventina show an established kin-group moving and marrying together as it
  crossed from Rio de Janeiro into the Zona da Mata Mineira.

  [INFERRED] His literacy is the family's one status marker — and it reads as
  *practical*, not elite. He signs his own name at the 1916 act while his bride signs by
  proxy (CIV-0006), a real documented gap; but he is a *lavrador*, his immigrant father
  João (P-0019) shows no literacy, and his own son Antenor (P-0006) is again simply "da
  lavoura". In a peasant-agrarian line, letters acquired for practical use are a thin,
  non-compounding acquisition — they did not become a lever into a new class and were not
  reliably transmitted to the next generation.

  [INFERRED] His capital was kinship, not property. Every documented asset in his story
  is a relationship rather than a holding: the same-day double wedding with his sister
  Joventina (PAR-0013), a Brandão (his mother's family) as his baptismal godparent
  (PAR-0004), his sisters documented marrying into the same Carangola parish (PAR-0006,
  PAR-0014). This is the immigrant strategy of his father João carried one generation on
  — a land-poor family that moved and married as a tight kin-cluster, pooling people
  because it had little land to pool.

  [INFERRED] He held the family's class position steady — neither an officer-rank climb
  nor an urban fall. Born in the Sapucaia immigrant colony, he settled as a Carangola
  *lavrador*, the same agrarian smallholder rung as his father, on newer coffee-frontier
  land. He is the stable middle of the arc: the line at rest on the land, before the next
  generation's reported move off it.

  [CONTEXTUAL] His *lavrador* living was subsistence off his own plot, not a wage — the
  São Miguel *proprietário* → Zona da Mata cultivator baseline, land held as a living
  rather than accumulating capital: the bottom of the family tree's economic range, the
  opposite end from the top-of-range Toledo slaveholding coffee fazenda on the Armond
  side.

  [INFERRED] Deocleciano is thus the clearest single frame of the Muniz class DNA: an
  agrarian smallholder whose wealth was land-and-labour and whose "status" was a practical
  signature and a dense kin-network — no office, title, commerce or purchased schooling.
  That base reproduced across the Atlantic and the RJ→MG frontier, but it carried no
  mechanism to rise.

  ## Open questions

  - His death record — where and when — is not held. [OPEN]

  - The exact day of his June 1892 birth (an uncertain read in the register). [OPEN]

  ## Sources held (this repository)

  - PAR-0004 (his 1892 Sapucaia baptism — birth, parents, settles the father as
  "João") · CIV-0001 (1916 civil marriage — names, ages, birthplaces, parents) ·
  CIV-0006 (full-content 1916 marriage — lavrador, his signature/literacy, civil venue
  and officials) · PAR-0012 (1916 parish marriage — acto nº 35, corroborates parents
  and birthplaces).

  - CIV-0004 (1949 — names him "Deocleciano Muniz" as Antenor's father) · PAR-0003
  (1922 baptism of his son Aristides).

  - PAR-0006 (sister Anna, b. 1884) · PAR-0013 (sister Joventina, married the same
  day) · PAR-0014 (sister Mercedes, married 1917) — collateral siblings on his birth
  family.

  - REC-0001 (owner's direct-ancestor roster).

  ## Regional and migration context

  [CONTEXTUAL] His life spans the **Sapucaia (RJ) → Carangola (MG)** move that carried
  the family off the older Paraíba do Sul coffee valley and onto the still-fertile,
  rail-linked Zona da Mata Mineira. Born at Sapucaia in 1892, he was married and
  farming at Carangola by 1916; his sisters Joventina and Mercedes, born in the
  Carangola parish about 1898–1899 (PAR-0013, PAR-0014), date the family's move to
  roughly 1892–1899. The line's origin earlier than Sapucaia is now documented on the Muniz
  side: his father João Muniz Bittencourt (P-0019) was born on the Ilha de São Miguel, Açores
  (his own 1845 Povoação baptism PAR-0022 and his 1915 Carangola death "natural da Ilha de São
  Miguel", PAR-0007), son of the São Miguel proprietário Manoel Muniz Bytancourt (P-0042,
  PAR-0015) — a documented Azorean origin, not a surname inference.

  ## Where to go today

  - **Baptism (1892):** Igreja Matriz de Santo Antônio de Sapucaia, RJ (Praça Miguel Couto Filho, Centro, CEP 25880-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Pra%C3%A7a%20Miguel%20Couto%20Filho%2C%20Sapucaia%20-%20RJ)

  - **Marriage to Luiza (1916):** Igreja Matriz de Santa Luzia de Carangola, MG (Praça Cel. Maximiano 138, CEP 36800-000) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santa%20Luzia%2C%20Pra%C3%A7a%20Cel.%20Maximiano%20138%2C%20Carangola%20-%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele e sua irmã Joventina casaram-se no mesmo dia — 21 de outubro de 1916 — na mesma igreja (Igreja de Santa Luzia de Carangola), em atos adjacentes de números 34 e 35 (PAR-0012, PAR-0013). Um irmão e uma irmã casando-se no mesmo dia na mesma igreja é um marcador forte de um grupo de parentesco que se movia e se ancorava como uma unidade.

  - **[PROVEN]** Sua certidão de casamento de 1916 (CIV-0006) registra um contraste documentado de letramento: ele assinou o próprio nome, enquanto sua noiva Luiza (P-0013) não sabia ler nem escrever e foi assinada por procuração. Naquela época, o letramento era um privilégio comprado e ligado à classe — a fronteira exata entre o mundo dos lavradores proprietários Muniz e o lar sem bens Azevedo de onde ela vinha.

  - **[CONTEXTUAL]** Nasceu em Sapucaia, Rio de Janeiro (1892), e seu batismo (PAR-0004) é o registro primário que estabelece o nome do pai como "João" — resolvendo um erro anterior em que uma provisão de 1882 havia registrado "José". Seu avô açoriano João emigrou de São Miguel; Deocleciano foi a primeira geração nascida no Brasil.

  - **[INFERRED]** A mudança da família do RJ para o MG pode ser datada pelos locais de nascimento de suas irmãs: Deocleciano nasceu em Sapucaia (1892), mas suas irmãs Joventina e Mercedes nasceram na freguesia de Carangola (~1898–1899, PAR-0013, PAR-0014). Todo o grupo de parentesco mudou-se do vale cafeeiro do Paraíba do Sul para a Zona da Mata Mineira entre 1892 e ~1899.

  - **[CONTEXTUAL]** Seu pai João Muniz Bittencourt emigrou da Ilha de São Miguel, Açores (PAR-0007), onde seu próprio pai Manoel havia se afogado no mar em 1866 (PAR-0015). Deocleciano era um descendente de terceira geração de uma família de proprietários açorianos que havia perdido o patriarca para o Atlântico e a pequena propriedade para a herança partível.

  - **[INFERRED]** Seu registro de óbito não está disponível: ele desaparece do arquivo após o batismo de seu filho Aristides em 1922 (PAR-0003) e é referenciado apenas como pai nomeado depois disso. A morte de um lavrador rural sem espólio quase não deixa rastro documental — essa ausência de um registro final é, em si, informação de classe.

  ## Identidade

  **Deocleciano Muniz Bittencourt** [PROVEN] — a forma em seu casamento civil de 1916
  (CIV-0001) e em seu próprio batismo de 1892 (PAR-0004); a forma mais curta
  "Deocleciano Muniz" aparece no casamento de 1949 de seu filho Antenor (CIV-0004). O
  sobrenome também é grafado *Bitencourt* na letra do registro.

  - **Nascimento:** por volta de **junho de 1892**, em **Santo Antônio de Sapucaia,
  Rio de Janeiro** [PROVEN month and year] — seu batismo o registra "nascido a [um]
  deste mez"; o dia é uma leitura incerta, enquanto o mês e o ano são claros
  (PAR-0004), corroborados por sua idade declarada de 24 anos em seu casamento de 1916
  (CIV-0001).

  - **Batismo:** **25 de junho de 1892**, na Igreja de Santo Antônio de Sapucaia
  [PROVEN] (PAR-0004), por Pe. Francisco Antônio Pinto Pereira da Veiga; padrinhos João
  de Souza Freitas e [Anna] Rita Brandão (prenome de leitura incerta), esta última uma
  parenta materna Brandão.

  - **Pais:** **João Muniz Bittencourt** (P-0019) e **Susanna Rita Brandão** (P-0020)
  [PROVEN] — nomeados em seu batismo (PAR-0004); João estava "já fallecido neste
  districto" (Carangola) em 1916 (CIV-0006, PAR-0012). O batismo estabelece o prenome
  do pai como "João" (o "José" de um registro superado de 1882 foi um erro).

  - **Casamento:** casou-se com **Luiza Fernandes de Azevedo** (P-0013) em
  **Carangola, Minas Gerais, em 21 de outubro de 1916** [PROVEN] — civil (CIV-0001;
  inteiro teor CIV-0006: livro 8-B, fl. 118, termo 62; perante o Juiz de Paz Major
  Américo de Lacerda; regime de comunhão de bens) e o ato religioso do mesmo dia
  (PAR-0012, acto nº 35 na Igreja de Santa Luzia de Carangola, Pe. João Coutinho).
  Testemunhas Justino Ribeiro Rodrigues e Antonio Theodoro de Souza.

  - **Filhos:** seu filho **Antenor Muniz** (P-0006, n. 1923) e o filho documentado
  **Aristides** (bat. 1922, PAR-0003). Outros filhos circulam em árvores colaborativas
  [LEAD].

  - **Óbito:** não documentado neste repositório [OPEN].

  ## Posição social e profissão

  - **Lavrador** [PROVEN] (CIV-0006).

  - **Letrado** [PROVEN] — assinou seu próprio assento de casamento de 1916, enquanto
  sua noiva assinou por procuração por não saber ler nem escrever (CIV-0006).

  ## Família e rede social

  Nasceu no grupo de parentesco Muniz Bittencourt / Brandão em Sapucaia (RJ). Suas
  **irmãs** estão documentadas em Carangola/Sapucaia: **Ritta** (n. 15 de janeiro de
  1890, Sapucaia — seu assento de nascimento nomeia ambos os pais e os quatro avós,
  CIV-0041), **Anna** (n. 1884, Sapucaia, PAR-0006; f. 1950 em Guaçuí-ES como Ana dos
  Santos Ferreira, CIV-0042), **Joventina** (casada em 21 de outubro de 1916 — no mesmo
  dia e igreja que Deocleciano, atos adjacentes nº 34 e nº 35, PAR-0013) e **Mercedes
  Maria** (casada em
  1917, PAR-0014). Casou-se com a linha **Azevedo** (Luiza, filha de José Secundino de
  Azevedo P-0038 e Thereza Fernandes de Azevedo P-0039).

  ## O que podemos extrapolar

  [INFERRED] Deocleciano é a **dobradiça geracional**: o mais antigo desta linha
  nascido em Sapucaia (RJ) e o primeiro documentado como lavrador em Carangola (MG).
  Sua alfabetização (rara o bastante para que a própria esposa assinasse por
  procuração) e o casamento duplo, no mesmo dia, com sua irmã Joventina mostram um
  grupo de parentesco estabelecido migrando e casando junto ao cruzar do Rio de Janeiro
  para a Zona da Mata Mineira.

  [INFERRED] Sua alfabetização é o único marcador de status da família — e lê-se como
  *prática*, não de elite. Ele assina o próprio nome no ato de 1916 enquanto a noiva
  assina por procuração (CIV-0006), uma lacuna real e documentada; mas ele é *lavrador*,
  seu pai imigrante João (P-0019) não mostra alfabetização, e seu próprio filho Antenor
  (P-0006) é de novo simplesmente "da lavoura". Numa linhagem camponesa-agrária, letras
  adquiridas para uso prático são uma aquisição tênue e não cumulativa — não se tornaram
  uma alavanca para uma nova classe e não foram transmitidas de forma confiável à geração
  seguinte.

  [INFERRED] Seu capital era o parentesco, não a propriedade. Todo bem documentado em sua
  história é uma relação, e não um patrimônio: o casamento duplo, no mesmo dia, com sua
  irmã Joventina (PAR-0013), um Brandão (a família de sua mãe) como padrinho de seu
  batismo (PAR-0004), suas irmãs documentadas casando na mesma freguesia de Carangola
  (PAR-0006, PAR-0014). É a estratégia imigrante de seu pai João levada uma geração adiante
  — uma família pobre em terra que migrava e casava como um grupo de parentesco coeso,
  reunindo pessoas por ter pouca terra a reunir.

  [INFERRED] Ele manteve a posição de classe da família estável — nem a ascensão a patente
  de oficial, nem a queda urbana. Nascido na colônia imigrante de Sapucaia, fixou-se como
  *lavrador* em Carangola, o mesmo degrau de pequeno agricultor de seu pai, em terra mais
  nova de fronteira cafeeira. Ele é o meio estável do arco: a linhagem em repouso sobre a
  terra, antes da relatada mudança da geração seguinte para fora dela.

  [CONTEXTUAL] Seu sustento de *lavrador* era subsistência do próprio lote, não um salário
  — a linha de base do cultivador *proprietário* de São Miguel → Zona da Mata, terra
  tomada como meio de vida e não como capital acumulável: a extremidade inferior da faixa
  econômica da árvore familiar, o polo oposto ao topo, a fazenda de café escravista dos
  Toledo, no lado Armond.

  [INFERRED] Deocleciano é, assim, o quadro isolado mais claro do DNA de classe dos Muniz:
  um pequeno agricultor cuja riqueza era terra-e-trabalho e cujo "status" era uma
  assinatura prática e uma densa rede de parentesco — sem cargo, título, comércio ou
  instrução comprada. Essa base reproduziu-se através do Atlântico e da fronteira RJ→MG,
  mas não carregava mecanismo algum para subir.

  ## Questões em aberto

  - Seu registro de óbito — onde e quando — não é conservado. [OPEN]

  - O dia exato de seu nascimento em junho de 1892 (uma leitura incerta no registro).
  [OPEN]

