profile: >-
  ## Identity

  **Manoel Muniz Bytancourt** (also *Byttancourt*; Brazilianised by his son to
  *Bittencourt*). [PROVEN] His son João's 1915 Carangola óbito miswrote the father as
  "Manoel Luiz Bittencourt" (PAR-0007); his own 1866 Povoação death gives the true name,
  Manoel MUNIZ Bytancourt (PAR-0015).

  - **Born:** about 1820, Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — aged 46 at death; Portuguese (Açorean). [PROVEN place/age; nationality strong,
  as his parents are "naturaes desta freguesia" and his son João "natural da Ilha de São
  Miguel"]

  - **Occupation:** proprietário (landowner), resident at Lomba do Botão in the parish
  (PAR-0015). [PROVEN]

  - **Marriage:** Francisca Roza do Espirito Santo (P-0047), 17 February 1842 at N.S. Mãe de
  Deus, Povoação (PAR-0024, folio 32r), dispensed from a 4th-degree consanguinity impediment.
  [PROVEN] The act legibly names both spouses' parents — his own (F-0023) and Francisca's,
  Manoel de Motta [var. Mello] × Anna de Souza (F-0042). (Earlier read as 1 February 1845
  from a mis-identified folio-73r image of a different couple; corrected 11 August 2026 — see
  PAR-0024.)

  - **Parents:** João Muniz Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049),
  both natural of the parish (family F-0023), named in his 1866 death (PAR-0015). [PROVEN]

  - **Children:** he left eight children (PAR-0015); one, João Muniz Bittencourt (P-0019),
  the future immigrant to Brazil, was baptised in 1845 (PAR-0022) in a joint baptism with
  a sibling Manoel. [PROVEN eight children; João individually attested]

  - **Death:** 24 July 1866, about 1 p.m., "na bahia, fóra do Garajau" (at sea off the
  Garajau) of the parish, without the sacraments, intestate (PAR-0015). [PROVEN] The
  circumstances read as a drowning. [INFERRED]

  ## Standing and profession

  A propertied man of Lomba do Botão, Povoação — a landowner (proprietário), the same
  status held by his father (PAR-0015). His sudden death at sea in July 1866, without
  sacraments and intestate, left eight children. [PROVEN standing]

  ## Family and social network

  Husband of Francisca Roza do Espirito Santo (P-0047) and son of the Mãe de Deus landowner
  João Muniz Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049). Through his son
  João he is the ancestor at whom the line crosses the Atlantic; his own generation and his
  parents' are all rooted in Povoação, São Miguel.

  ## What we can extrapolate

  His 1866 death at sea is probably the emigration trigger. [INFERRED] Losing their
  propertied father, his sons João (P-0019) and José crossed to Sapucaia (RJ) about
  1866–1870, into the post-1850 current of Azorean and Portuguese labour reaching the Rio de
  Janeiro interior.

  [INFERRED / CONTEXTUAL] His standing was small landed capital — heritable, but the
  smallest kind. As a *proprietário* at Lomba do Botão (PAR-0015) the family's wealth took
  the one heritable form, land (unlike office income or a trade, which die with the man);
  but on São Miguel land was scarce and locked, the *morgadio* entail passing estates
  largely intact to the firstborn and shutting younger sons out (the *morgadios* were
  abolished in Portugal only in 1863). Holding land at all places the family among the
  small proprietors — a rung above the landless tenants beneath them, but far below any
  island elite: a Povoação smallholding, not an estate. His status was inherited, not
  office-earned or married-in, which is why it was real but modest and fully exposed to
  the next mechanism.

  [INFERRED / CONTEXTUAL] His marriage to Francisca Roza (P-0047), dispensed for a
  4th-degree consanguinity impediment (PAR-0024), reads as land-and-kin consolidation
  rather than romance. On a land-scarce island, cousin-marriage was the standard way
  peasant-proprietor families kept fragmenting plots inside the kin group — the same
  endogamy visible throughout the Mãe de Deus registers. His marriage is a symptom of a
  closed, endogamous small-proprietor world, pooling people because it could not pool
  land.

  [CONTEXTUAL] Partible inheritance plus eight children is the deeper emigration driver,
  beneath the drowning: Portuguese and Brazilian law split estates equally among all
  children, so eight heirs on one Povoação smallholding meant each son's share was a
  fraction too small to live on — the structural arithmetic that pushed younger Azorean
  sons off the island for a century. [INFERRED] Even had Manoel lived, his sons faced a
  near-landless future at home; the fragmentation had already made departure likely, and
  his July-1866 drowning is the pivot that *released* an emigration the arithmetic had
  already loaded — the mechanism is economic, not merely tragic.

  [CONTEXTUAL] A São Miguel *proprietário* drew no wage — his "pay" was subsistence off
  his own plot, plus the coastal fishing that literally took him (drowned off the Garajau,
  1866). Land held as a living, not accumulating capital: the bottom of the family tree's
  economic range, the exact opposite of the top-of-range Toledo slaveholding coffee fazenda
  on the Armond side.

  [INFERRED] Manoel is thus the baseline the Muniz line never rose above or fell below —
  the last generation rooted on the land: a small Azorean proprietor whose capital was
  heritable but too little to divide eight ways, in a *morgadio*-squeezed, endogamous
  island economy caught in the 1860s orange-export collapse. The line that leaves him is
  not falling from elite status — there was none to lose — but a land-poor
  peasant-proprietor family exporting its surplus sons, the textbook Azorean pattern.

  ## Open questions

  - His own baptism (about 1820, Mãe de Deus) — the pre-1818 books are not digitised online.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0015 (his own 1866 Povoação death — age, occupation, residence, wife, parents,
  eight children; the primary record for him).

  - PAR-0024 (his 1842 marriage to Francisca Roza — names both spouses' parents) · PAR-0022
  (his son João's 1845 baptism) · PAR-0007 (son João's 1915 Carangola death — the erroneous
  "Manoel Luiz Bittencourt").

  ## Regional and migration context

  He is the last generation of the line born and settled in the Açores — a Nossa Senhora
  Mãe de Deus (Povoação) landowner on São Miguel's sea-exposed southeastern coast, where the
  livelihood mixed cereal farming with coastal fishing. [CONTEXTUAL] His 1866 drowning,
  against the island's structural poverty and the 1860s collapse of the orange-export
  economy, is the pivot that sent his orphaned sons to Brazil.

  ## Where to go today

  - **Baptism, marriage and death (1821, 1842, 1866):** Igreja Matriz de Nossa Senhora da
  Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (Largo da Matriz; coords
  37.74891, -25.24372) — he lived at Lomba do Botão in this parish [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Identidade

  **Manoel Muniz Bytancourt** (também *Byttancourt*; abrasileirado pelo filho para
  *Bittencourt*). [PROVEN] O óbito de 1915 em Carangola de seu filho João grafou
  erroneamente o pai como "Manoel Luiz Bittencourt" (PAR-0007); seu próprio óbito de 1866 em
  Povoação fornece o nome verdadeiro, Manoel MUNIZ Bytancourt (PAR-0015).

  - **Nascimento:** por volta de 1820, Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de
  São Miguel (Açores) — 46 anos ao falecer; português (açoriano). [PROVEN local/idade;
  nacionalidade forte, pois seus pais são "naturaes desta freguesia" e seu filho João
  "natural da Ilha de São Miguel"]

  - **Ocupação:** proprietário, residente na Lomba do Botão, na freguesia (PAR-0015).
  [PROVEN]

  - **Casamento:** Francisca Roza do Espirito Santo (P-0047), em 17 de fevereiro de 1842, em
  N.S. Mãe de Deus, Povoação (PAR-0024, fólio 32r), dispensados de um impedimento de
  consanguinidade de 4º grau. [PROVEN] O ato nomeia legivelmente os pais de ambos os cônjuges
  — os dele (F-0023) e os de Francisca, Manoel de Motta [var. Mello] × Anna de Souza (F-0042).
  (Antes lido como 1º de fevereiro de 1845, a partir de uma imagem mal identificada do fólio
  73r de um casal diferente; corrigido em 11 de agosto de 2026 — ver PAR-0024.)

  - **Pais:** João Muniz Bytancourt (P-0048) e Maria Jacintha de Medeiros (P-0049), ambos
  naturais da freguesia (família F-0023), nomeados em seu óbito de 1866 (PAR-0015). [PROVEN]

  - **Filhos:** deixou oito filhos (PAR-0015); um deles, João Muniz Bittencourt (P-0019), o
  futuro imigrante para o Brasil, foi batizado em 1845 (PAR-0022) em um batismo conjunto com
  um irmão, Manoel. [PROVEN oito filhos; João atestado individualmente]

  - **Óbito:** 24 de julho de 1866, por volta de uma hora da tarde, "na bahia, fóra do
  Garajau" da freguesia, sem os sacramentos, intestado (PAR-0015). [PROVEN] As circunstâncias
  sugerem afogamento. [INFERRED]

  ## Posição social e profissão

  Um homem com bens da Lomba do Botão, Povoação — um proprietário, a mesma condição de seu
  pai (PAR-0015). Sua morte súbita no mar, em julho de 1866, sem sacramentos e intestado,
  deixou oito filhos. [PROVEN, a condição]

  ## Família e rede social

  Marido de Francisca Roza do Espirito Santo (P-0047) e filho do proprietário de Mãe de Deus
  João Muniz Bytancourt (P-0048) e de Maria Jacintha de Medeiros (P-0049). Por meio de seu
  filho João, é o ancestral em quem a linha cruza o Atlântico; sua própria geração e a de
  seus pais estão todas enraizadas em Povoação, São Miguel.

  ## O que podemos extrapolar

  Sua morte no mar em 1866 é provavelmente o gatilho da emigração. [INFERRED] Perdendo o pai
  proprietário, seus filhos João (P-0019) e José cruzaram para Sapucaia (RJ) por volta de
  1866–1870, na corrente pós-1850 de mão de obra açoriana e portuguesa que chegava ao
  interior do Rio de Janeiro.

  [INFERRED / CONTEXTUAL] Sua condição era pequeno capital fundiário — herdável, mas do
  menor tipo. Como *proprietário* na Lomba do Botão (PAR-0015), a riqueza da família tomava
  a única forma herdável, a terra (ao contrário da renda de cargo ou de um ofício, que
  morrem com o homem); mas em São Miguel a terra era escassa e travada, com o *morgadio*
  passando as propriedades em grande parte intactas ao primogênito e excluindo os filhos
  mais novos (os *morgadios* só foram abolidos em Portugal em 1863). Deter terra já situa a
  família entre os pequenos proprietários — um degrau acima dos rendeiros sem terra abaixo
  deles, mas muito abaixo de qualquer elite insular: um minifúndio de Povoação, não uma
  propriedade. Sua condição era herdada, não conquistada por cargo nem obtida pelo
  casamento, razão pela qual era real mas modesta e plenamente exposta ao mecanismo
  seguinte.

  [INFERRED / CONTEXTUAL] Seu casamento com Francisca Roza (P-0047), dispensado de um
  impedimento de consanguinidade de 4º grau (PAR-0024), lê-se como consolidação de
  terra-e-parentesco, não como romance. Numa ilha escassa em terra, o casamento entre
  primos era a maneira padrão de as famílias de pequenos proprietários-camponeses manterem
  lotes fragmentados dentro do grupo de parentesco — a mesma endogamia visível por todos os
  registros de Mãe de Deus. Seu casamento é um sintoma de um mundo de pequenos
  proprietários fechado e endogâmico, reunindo pessoas por não poder reunir terra.

  [CONTEXTUAL] A herança partível somada a oito filhos é o motor mais profundo da
  emigração, por baixo do afogamento: a lei portuguesa e brasileira dividia as heranças
  igualmente entre todos os filhos, de modo que oito herdeiros num minifúndio de Povoação
  faziam de cada quinhão uma fração pequena demais para viver — a aritmética estrutural que
  empurrou os filhos açorianos mais novos para fora da ilha por um século. [INFERRED] Mesmo
  que Manoel tivesse vivido, seus filhos enfrentariam um futuro quase sem terra em casa; a
  fragmentação já tornara provável a partida, e seu afogamento em julho de 1866 é o eixo que
  *liberou* uma emigração que a aritmética já havia carregado — o mecanismo é econômico, não
  meramente trágico.

  [CONTEXTUAL] Um *proprietário* de São Miguel não recebia salário — seu "pagamento" era
  subsistência do próprio lote, mais a pesca costeira que literalmente o levou (afogado ao
  largo do Garajau, 1866). Terra tomada como meio de vida, não como capital acumulável: a
  extremidade inferior da faixa econômica da árvore familiar, o exato oposto ao topo, a
  fazenda de café escravista dos Toledo, no lado Armond.

  [INFERRED] Manoel é, assim, a linha de base que os Muniz nunca superaram nem à qual
  caíram abaixo — a última geração enraizada na terra: um pequeno proprietário açoriano cujo
  capital era herdável mas pequeno demais para dividir por oito, numa economia insular
  espremida pelo *morgadio* e endogâmica, apanhada no colapso da exportação de laranja da
  década de 1860. A linhagem que parte dele não está caindo de uma posição de elite — não
  havia nenhuma a perder — mas é uma família de pequenos proprietários-camponeses, pobre em
  terra, exportando seus filhos excedentes, o padrão açoriano clássico.

  ## Questões em aberto

  - Seu próprio batismo (por volta de 1820, Mãe de Deus) — os livros anteriores a 1818 não
  estão digitalizados online. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0015 (seu próprio óbito de 1866 em Povoação — idade, ocupação, residência, esposa,
  pais, oito filhos; o registro primário sobre ele).

  - PAR-0024 (seu casamento de 1842 com Francisca Roza — nomeia os pais de ambos os cônjuges)
  · PAR-0022 (o batismo de 1845 de seu filho João) · PAR-0007 (o óbito de 1915 em Carangola do
  filho João — o errôneo "Manoel Luiz
  Bittencourt").

  ## Contexto regional e migratório

  Ele é a última geração da linha nascida e estabelecida nos Açores — um proprietário de Nossa
  Senhora Mãe de Deus (Povoação), no litoral sudeste exposto de São Miguel, onde o sustento
  misturava a lavoura de cereais com a pesca costeira. [CONTEXTUAL] Seu afogamento em 1866,
  diante da pobreza estrutural da ilha e do colapso da economia de exportação da laranja na
  década de 1860, é o eixo que enviou seus filhos órfãos ao Brasil.

  ## Onde ir hoje

  - **Batismo, casamento e óbito (1821, 1842, 1866):** Igreja Matriz de Nossa Senhora da
  Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (Largo da Matriz; coords
  37.74891, -25.24372) — morava na Lomba do Botão, nesta freguesia [RESOLVED] ·
