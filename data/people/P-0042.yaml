notes:
- text: >-
    Father of João Muniz Bittencourt (P-0019); hence Antenor Muniz's Azorean
    great-great-grandfather. His own 1866 Povoação death (PAR-0015 → events E-0047,
    E-0048) is the primary record for him: a landowner (proprietário) of Nossa
    Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal), resident
    at Lomba do Botão, who drowned at sea off the Garajau on 24 July 1866 aged 46
    (born c.1820), intestate, leaving eight children. It names his wife Francisca
    Roza do Espirito Santo (P-0047, family F-0020) and his parents João Muniz
    Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049, family F-0023).
  text_pt: >-
    Pai de João Muniz Bittencourt (P-0019); portanto, o trisavô açoriano de
    Antenor Muniz. Seu próprio óbito de 1866 em Povoação (PAR-0015 → eventos
    E-0047, E-0048) é o registro primário sobre ele: um proprietário de Nossa
    Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores, Portugal),
    residente na Lomba do Botão, que morreu afogado no mar defronte ao Garajau
    em 24 de julho de 1866, aos 46 anos (nascido por volta de 1820), intestado,
    deixando oito filhos. O registro nomeia sua esposa Francisca Roza do Espirito
    Santo (P-0047, família F-0020) e seus pais João Muniz Bytancourt (P-0048) e
    Maria Jacintha de Medeiros (P-0049, família F-0023).
- text: >-
