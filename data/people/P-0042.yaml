  (6). O conselho de família nomearia um tio paterno, João Moniz Bettencourt, e um tio
  materno, Antonio da Motta Madeira. **Isto conflita com o rol acima e não é adotado até
  que as imagens sejam lidas aqui:** a lista de herdeiros omite a Maria nascida em 29 de
