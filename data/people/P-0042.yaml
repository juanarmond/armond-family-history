profile: >-
  ## Interesting facts

  - **[PROVEN]** He drowned on 24 July 1866 "na bahia, fóra do Garajau" — at sea off the Garajau point of his parish — without the sacraments, intestate, leaving a wife and eight children (PAR-0015). A sudden death at sea rather than a deliberate decision to emigrate was the event that sent his orphaned sons to Brazil.

  - **[PROVEN]** His 1842 marriage to Francisca Roza do Espirito Santo was dispensed from a 4th-degree consanguinity impediment (PAR-0024) — they were blood relatives. Cousin-marriage was the standard tool in the endogamous, land-poor Azorean peasant-proprietor community of Povoação for keeping fragmenting plots inside the kin group.

  - **[CONTEXTUAL]** He was a proprietário (landowner) at Lomba do Botão in the Mãe de Deus parish — a documented smallholder in an island economy where land was scarce and controlled by the morgadio entail system. Holding land placed him above the landless; but eight children on a Povoação smallholding made partible inheritance the mechanism that would fragment that land irreversibly.

  - **[INFERRED]** Partible inheritance (both Portuguese and Brazilian law split estates equally among all heirs) plus eight children means each child's share of a small Azorean smallholding was too little to live on — the structural arithmetic that made emigration necessary even before his drowning. His death in 1866 simply released an emigration that was already loaded.

  - **[CONTEXTUAL]** The 1860s Azores were caught in an economic crisis: the orange export trade that had sustained the island economy for decades collapsed in the 1850s–1860s due to disease. With both the land and the export economy failing, the generation of the late 1860s–1870s was under simultaneous pressure to leave — the context that sent his son João to Brazil.

  - **[INFERRED]** The name "Manoel Muniz Bytancourt" became "Manoel Luiz Bittencourt" in his son João's 1915 Carangola death record (PAR-0007) — the kind of garbling that happens across an Atlantic crossing and 50 years of oral transmission. His own Povoação death record (PAR-0015) preserves the correct form.

  ## Identity

  **Manoel Muniz Bytancourt** (also *Byttancourt*; Brazilianised by his son to
  *Bittencourt*). [PROVEN] His son João's 1915 Carangola óbito miswrote the father as
  "Manoel Luiz Bittencourt" (PAR-0007); his own 1866 Povoação death gives the true name,
  Manoel MUNIZ Bytancourt (PAR-0015).

  - **Born:** 12 June 1822, baptised 17 June 1822 at the Matriz of Nossa Senhora Mãe de
  Deus, Povoação, Ilha de São Miguel (Açores), legitimate son of João Muniz and Maria
  Jac[i]nta, "ambos naturaes e freguezes" of the parish (PAR-0051; events E-0048, E-0080).
  [PROVEN] This replaces the earlier "about 1820", which was derived from his age at death:
  his 1866 death gives him 46 years (PAR-0015), about two more than the baptism implies
  — **[INFERRED]** an ordinary informant approximation. The retrieval research reads the
  baptism year as 1821; the register as read here says "mil oito centos e vinte dous", and
  1822 stands. Portuguese (Açorean) [PROVEN — his 1842 marriage records both spouses as
  natives of the parish, baptised there (PAR-0024)].

  - **Occupation:** proprietário (landowner), resident at Lomba do Botão in the parish
  (PAR-0015). [PROVEN]

  - **Marriage:** Francisca Roza do Espirito Santo (P-0047), 17 February 1842 at N.S. Mãe de
  Deus, Povoação (PAR-0024, folio 32r), dispensed from a 4th-degree consanguinity impediment.
  [PROVEN] The act legibly names both spouses' parents — his own (F-0023) and Francisca's,
  Manoel de Motta [var. Mello] × Anna de Souza (F-0042). It was celebrated before the
  Vigário Julião Francisco Tavares and the Cura José Antonio Barbosa, with the witnesses
  José Jacintho Botelho and Estevão Manoel, the latter signing with a cross. The act writes
  his mother as "Maria Euginia [Eugenia] de Medeiros" — the same woman recorded as Maria
  Jacintha in his baptism and death (PAR-0051, PAR-0015); **[INFERRED]** the slip most
  likely borrows the name of her own mother, Maria Eugenia (PAR-0037). (Earlier read as 1 February 1845
  from a mis-identified folio-73r image of a different couple; corrected 11 August 2026 — see
  PAR-0024.)

  - **Parents:** João Muniz Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049),
  both natural of the parish (family F-0023), named in his 1822 baptism (PAR-0051) and his
  1866 death (PAR-0015). [PROVEN] Their own marriage, on 7 October 1819 at Mãe de Deus,
  gives his father in full as João Francisco Muniz Bitancourt (PAR-0037).

  - **Grandparents:** paternal, Manoel Muniz Bitancourt (P-0082) and Tereza do Amaral
  (P-0083, already dead in 1819); maternal, João de Medeiros Brandão (P-0084) and Maria
  Eugenia (P-0085) — all named in his parents' 1819 marriage act (PAR-0037). [PROVEN]

  - **Children:** his 1866 óbito states that he left eight children (PAR-0015) [PROVEN — the
  count]. Eight candidate names are attested, but the roster is **not** fully proven
  [Corrected 2026-10-08: earlier "all 8 surviving children are now individually PROVEN"]:

  - *Proven children of the couple, alive after 1866:* the future immigrant João Muniz
  Bittencourt (P-0019, b. 1845; PAR-0022; d. 1915); Maria (b. 26 December 1842; PAR-0045,
  whose margin note records a death about April 1931); **Claudina Muniz Bettencourt** (b.
  ~1856; her 1872 Mãe de Deus marriage, PAR-0084, names the parents and records Manoel
  already deceased); and **Anna Maria Byttancourt** (b. ~1855; her 1878 Mãe de Deus marriage
  names her "filha legitima de Manoel Muniz Byttancourt e de Francisca Roza do Espirito
  Santo", PAR-0083) [PROVEN].

  - *Proven births, survival to 1866 not shown:* Francisca (b. 31 August 1849; PAR-0046) and
  Maria (b. 29 November 1851; PAR-0047) — baptisms only [PROVEN birth; survival OPEN].

  - *Lead:* the sibling co-baptised with João in 1845 (PAR-0022), identified as a brother
  Manoel only by the retrieval research [LEAD].

  - *Probable, possibly a duplicate:* **Maria José Bittencourt** (d. 8 November 1943 Rio de
  Janeiro, aged 85, so b. ~1858), whose civil death register (CIV-0034) names Manoel Muniz
  Bittencourt and Francisca Rosa Bittencourt as parents and records her as "natural de
  Portugal" — not a parish or island; informant a non-relative. She may be a distinct child
  or the same person as the 1851 Maria (PAR-0047); the identity is open [PROBABLE].

  - A ninth birth — infant **Claudina** (b. ~May 1854, d. 24 September 1854, PAR-0085) —
  predeceased Manoel and is not counted in the "8 filhos" [PROVEN].

  The eight names match the stated count only if the co-baptised brother is real, Maria José
  is distinct from the 1851 Maria, and Francisca and the 1851 Maria survived to 1866.

  - **Death:** 24 July 1866, about 1 p.m., "na bahia, fóra do Garajau" (at sea off the
  Garajau) of the parish, without the sacraments, intestate (PAR-0015). [PROVEN] The
  circumstances read as a drowning. [INFERRED]

  ## Standing and profession

  A propertied man of Lomba do Botão, Povoação — a landowner (proprietário), the same
  status held by his father (PAR-0015). His sudden death at sea in July 1866, without
  sacraments and intestate, left eight children. [PROVEN standing]

  ## Family and social network

  Husband of Francisca Roza do Espirito Santo (P-0047) and son of the Mãe de Deus landowner
  João Muniz Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049); a documented
  brother, Agostinho (b. 1843), is named with the same parents in PAR-0044. Six more
  children of his parents are baptised at Mãe de Deus between 1831 and 1841 — a son whose
  given name is illegible (1831), Michaelina (1833), Rosa (1834), Damaso (1836), Francisco
  (1839) and José (1841) (PAR-0038 to PAR-0043); José later stood godfather to two of
  Manoel's daughters (PAR-0045, PAR-0046). **[LEAD]** The retrieval research also reports
  two earlier siblings, João (b. 3 February 1823) and Maria (b. 1 November 1825), from
  baptisms not held here; and the Ponta Delgada passport register reportedly records 1880
  passports for two brothers, António Moniz Bettencourt and Dâmaso Moniz, each "filho de
  João Moniz Bettencourt e Maria Jacinta" (transcription only, not catalogued — see the
  PAR-0015 notes). Through his son João he is the ancestor at whom the line crosses the
  Atlantic; his own generation and his parents' are all rooted in Povoação, São Miguel.

  His godparents in 1822 were Antonio de Medeiros Brandão and his wife Anna de Souza
  (PAR-0051); Antonio had witnessed his parents' wedding three years earlier (PAR-0037).
  This Anna de Souza is not equated with his future mother-in-law of the same name
  (P-0087), wife of Manoel da Motta Junior.

  **Namesake cautions.** His aunt, married in 1818 to Manoel Cabral, bore exactly his
  mother's name, Maria Jacintha de Medeiros, but she was a daughter of Manoel Muniz and
  Tereza do Amaral (PAR-0048) — a different woman, never to be merged with P-0049.
  **[LEAD]** The retrieval research also flags a different Manoel Muniz Bitancourt, son of
  Francisco Moniz de Medeiros, who married Anna Francisca do Amaral in the same parish about
  January 1842; identity here rests on the parent couple, not the name.

  ## What we can extrapolate

  *Manoel is the pivot of the whole line, so his §4 carries the cluster arc: he is the last
  Muniz Bytancourt documented holding land, and his death is the hinge on which the family
  leaves the Açores.*

  **1. Standing: inherited, landed, and the smallest heritable kind [PROVEN base / INFERRED
  reading].** His 1866 óbito calls him *proprietário* and his father João (P-0048)
  *proprietário* too (PAR-0015) — two documented generations living off land they owned at
  Lomba do Botão, in the seat parish of Nossa Senhora Mãe de Deus. That matters for how
  status transmits: land is heritable capital, unlike an office (which ends with the
  appointment) or a trade (which ends with the man). But it was land at the small end.
  **[CONTEXTUAL]** On São Miguel the cultivable surface was scarce and largely locked: the
  *morgadio* entail passed estates intact to a firstborn and shut younger sons out, and it
  was abolished in Portugal only in 1863, when Manoel was about 40. Holding any land at all
  set the family a rung above the landless jornaleiros and *caseiros* beneath them; it set
  them nowhere near an island elite.

  **2. The registers themselves price his rank [PROVEN / INFERRED].** The Povoação books are
  not sparing with honorifics — they style a marriage witness *Capitão* (Luis Antonio de
  Almeida, PAR-0048), the parish priests *Reverendo*, the district official *Ouvidor*. In
  none of the ten-odd acts held for this family does a Muniz Bytancourt receive one, and no
  wife of the line is written *Dona*. **[INFERRED]** That consistent omission, in books that
  grant the title freely to others of the same parish, is a status reading rather than an
  archival accident: *proprietário* was the whole of his description. Set against the other
  side of the owner's tree — where Mathilde Maria de Jesus (P-0027) is *Dona* throughout,
  her father an *Alferes* and her father-in-law a *Capitão* — the calibration is exact.

  **3. The marriage was kin-consolidation, not a reach [PROVEN act / INFERRED reading].**
  His 1842 marriage to Francisca Roza do Espirito Santo (P-0047) required an apostolic
  dispensation from an impediment of the **fourth degree of consanguinity** (PAR-0024): they
  were blood kin. **[CONTEXTUAL]** On a land-scarce island, cousin-marriage was the ordinary
  way peasant-proprietor families kept fragmenting plots inside the kin group, and the Mãe
  de Deus registers are dense with the same handful of surnames — Medeiros, Botelho, Muniz,
  Motta. The alliance shows in the compadrio immediately: in April 1843, fourteen months
  after the wedding, Manoel's new parents-in-law **Manoel da Motta Junior and Anna de
  Souza** stood godparents to his infant brother Agostinho (PAR-0044). Two families bound
  themselves to each other because neither had anything larger to bind to.

  **4. The godparent choices are the clearest class marker we hold [PROVEN pattern /
  INFERRED reading].** Across six consecutive baptisms of Manoel's own siblings between 1831
  and 1841, one couple — Manoel José da Costa and his wife Victoria de Medeiros — stood
  godparents every time (PAR-0038, PAR-0039, PAR-0040, PAR-0041, PAR-0042, PAR-0043). When
  Manoel's own children were baptised, the godparents were his brother José and his
  sister-in-law Claudina, a daughter of his wife's parents (PAR-0045, PAR-0046).
  **[CONTEXTUAL]** Baptismal sponsorship in the Portuguese Atlantic world was the standard
  instrument for attaching a household to a patron — a captain, a priest, a *morgado*.
  **[INFERRED]** This family never once used it that way. Its compadrio runs sideways and
  inward, binding kin to kin; there is no patron anywhere in the record. A family that does
  not reach upward through godparenthood is usually a family with no one to reach.

  **5. Partible succession plus intestacy plus eight children is the arithmetic that emptied
  the holding [PROVEN facts / CONTEXTUAL mechanism].** His death act states two things that
  decide the line's future: he **"não fez testamento"** and he **"deixou oito filhos"**
  (PAR-0015). Portuguese law reserved the bulk of an estate for the forced heirs in equal
  shares, and dying intestate at 46 removed even the narrow discretion a will allowed. One
  Povoação smallholding, divided eight ways, leaves each child a fraction no one could farm.
  **[INFERRED]** The drowning is the trigger, but the mechanism is arithmetic: the
  fragmentation had already loaded the departure, and 24 July 1866 released it.

  **6. And we can watch the arithmetic bite, inside the Açores, before anyone emigrates
  [PROVEN].** Manoel was a landowner. Six years after his death his daughter Claudina, aged
  sixteen, married **Manoel Soares de Lima, *sapateiro*** (PAR-0084, which records her
  father "já defunto"); six years after that his daughter Anna Maria, aged twenty-three,
  married **Manoel Cabral de Mello, *official de pedreiro*** (PAR-0083). **[INFERRED]** A
  proprietor's daughters marrying a shoemaker and a mason within twelve years of his
  intestate death is the fragmentation made visible: by the 1870s the household had no
  land-portion to match a daughter to a landholder, and the family's marriage market had
  shifted from proprietors to artisans. The emigration of the sons is the same fact seen
  from the other side.

  **7. No education lever, and the record shows why [PROVEN / CONTEXTUAL].** Nothing in the
  held acts records Manoel's own literacy either way — the Povoação form has the officiant
  and witnesses sign, not the principals. What the acts do record is the literacy of the
  circle he chose: Estevão Manoel signed his 1842 marriage with a cross (PAR-0024), and in
  his siblings' baptisms Manoel Cabral, Antonio de Medeiros Brandão, Bento Pacheco, Manoel
  da Silva and Francisco da Silva all signed by cross (PAR-0038, PAR-0039, PAR-0040,
  PAR-0046). The confident signatures on these pages belong to the clergy. **[CONTEXTUAL]**
  Schooling in the nineteenth-century Azores was a purchased, class-linked privilege with no
  public provision in a rural freguesia; it had to be bought afresh every generation, and
  this family never bought it. The line's first documented signature is his grandson
  Deocleciano's, in Brazil, seventy-four years later (CIV-0006).

  **8. What he lived on had no wage under it [CONTEXTUAL].** A Povoação *proprietário* drew
  no salary: his income was subsistence off his own ground, supplemented by the coastal
  economy that finally killed him — he died in the bay off the Garajau, without the
  sacraments, on a July afternoon (PAR-0015). Land held as a living rather than as
  accumulating capital is the bottom of this family tree's economic range, and the exact
  inverse of the Toledo slaveholding coffee fazenda at the top of it (P-0027).

  **Synthesis — the baseline, and the turning point.** Manoel is the last generation of the
  line rooted on ground it owned. Everything about that base was real and none of it was
  durable: inherited rather than earned, landed rather than salaried, modest rather than
  elite, held in a *morgadio*-squeezed island economy, and legally guaranteed to split eight
  ways the moment he died intestate. **[INFERRED]** The family that leaves him is not
  falling from status — there was none to lose — it is a land-poor proprietor household
  exporting its surplus sons, the textbook Azorean pattern, with the daughters' artisan
  marriages as the domestic half of the same process. Read against the owner's other line,
  the contrast is the point: the Armonds begin high on office and married-in land and fall;
  the Muniz begin here, at the floor, and the rest of their arc is a slow, four-generation
  climb back to owning anything at all (P-0006).

  ## Open questions

  - His own baptism — **held** (PAR-0051): born 12 June 1822, baptised 17 June 1822 at Mãe
  de Deus. [RESOLVED]

  - **His 1867 inventário — located, images not held here.** [LEAD — reported by the
  retrieval research from the 1867 inventário; images not held here] The Biblioteca
  Pública e Arquivo Regional de Ponta Delgada holds the "Autos de Inventario entre menores"
  of Manuel Moniz Bettencourt (PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00214, Juízo Ordinário /
  Tribunal da Comarca da Povoação), opened about 3–4 April 1867 with his widow as
  inventariante. The retrieval read reports that he died intestate on 24 July 1866, a net
  estate value of 1:[8?]32$940 réis [uncertain digit], and eight heirs: Maria (married to
  Antonio Moniz Bettencourt); Manoel Jacinto (single, absent); João (single, 20 — his 1845
  baptism would make him 22); Francisca Isabel (married to Francisco Soares Brandão); Anna
  (13); Claudina Roza (10); Maria José (8); and Maria Isabel (6). The family council
  reportedly names a paternal uncle, João Moniz Bettencourt, and a maternal uncle, Antonio
  da Motta Madeira. **This conflicts with the roster above and is not adopted until the
  images are read here:** the heir list omits the Maria born 29 November 1851 (PAR-0047) —
  perhaps dead before April 1867 — and adds a Maria Isabel born about 1860–61 who is not
  otherwise documented; and João, not yet "ausente", would have emigrated after April
  1867. The candidate roster above is unchanged pending that read. [OPEN]

  ## Sources held (this repository)

  - PAR-0015 (his own 1866 Povoação death — age, occupation, residence, wife, parents,
  eight children; the primary record for him).

  - PAR-0051 (his own 1822 baptism — birth date, parents, godparents).

  - PAR-0037 (his parents' 1819 marriage — names all four of his grandparents) · PAR-0038 to
  PAR-0044 (1831–1843 baptisms of seven siblings) · PAR-0048 (1818 marriage of his aunt and
  namesake of his mother, Maria Jacintha de Medeiros).

  - PAR-0024 (his 1842 marriage to Francisca Roza — names both spouses' parents) · PAR-0022
  (his son João's 1845 baptism) · PAR-0045 / PAR-0046 / PAR-0047 (1843, 1849 and 1851
  baptisms of three daughters — Maria, Francisca and Maria — each naming him as father) ·
  PAR-0083 (1878 marriage of daughter Anna Maria Byttancourt — names him as her father) ·
  PAR-0084 (1872 marriage of daughter Claudina Muniz Bettencourt — names him already
  deceased) · PAR-0085 (1854 Mãe de Deus death of infant daughter Claudina) · CIV-0034
  (1943 civil death of daughter Maria José Bittencourt, Rio de Janeiro) · PAR-0007 (son
  João's 1915 Carangola death — the erroneous "Manoel Luiz Bittencourt").

  ## Regional and migration context

  He is the last generation of the line born and settled in the Açores — a Nossa Senhora
  Mãe de Deus (Povoação) landowner on São Miguel's sea-exposed southeastern coast, where the
  livelihood mixed cereal farming with coastal fishing. [CONTEXTUAL] His 1866 drowning,
  against the island's structural poverty and the 1860s collapse of the orange-export
  economy, is the pivot that sent his orphaned sons to Brazil.

  ## Where to go today

  - **Baptism, marriage and death (1822, 1842, 1866):** Igreja Matriz de Nossa Senhora da
  Mãe de Deus, Vila da Povoação, São Miguel, Açores, Portugal (Largo da Matriz; coords
  37.74891, -25.24372) — he lived at Lomba do Botão in this parish [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)

  - **Home village:** Lomba do Botão, freguesia and concelho da Povoação, São Miguel — his
  residence at death (PAR-0015), still an inhabited village today; the family's exact plot
  or house is not located [RESOLVED as a village] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Lomba%20do%20Bot%C3%A3o%2C%20Povoa%C3%A7%C3%A3o%2C%20S%C3%A3o%20Miguel%2C%20A%C3%A7ores)

  - **Inventário (1867):** Biblioteca Pública e Arquivo Regional de Ponta Delgada, ref.
  PT/BPARPD/JUD/TCPVÇ/1ªSEC/082/00214 — not digitised; reported to describe the estate
  [LEAD]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Ele se afogou em 24 de julho de 1866 "na bahia, fóra do Garajau" — no mar ao largo da ponta do Garajau de sua freguesia — sem os sacramentos, intestado, deixando esposa e oito filhos (PAR-0015). Uma morte súbita no mar, e não uma decisão deliberada de emigrar, foi o evento que enviou seus filhos órfãos ao Brasil.

  - **[PROVEN]** Seu casamento de 1842 com Francisca Roza do Espirito Santo foi dispensado de um impedimento de consanguinidade de 4º grau (PAR-0024) — eram parentes de sangue. O casamento entre primos era o instrumento padrão na comunidade endogâmica e pobre em terra de pequenos proprietários camponeses de Povoação para manter lotes em fragmentação dentro do grupo de parentesco.

  - **[CONTEXTUAL]** Era proprietário na Lomba do Botão, na freguesia de Mãe de Deus — um minifundiário documentado numa economia insular onde a terra era escassa e controlada pelo sistema de morgadio. Deter terra alguma o situava acima dos sem-terra; mas ter oito filhos num minifúndio de Povoação tornava a herança partível o mecanismo que fragmentaria irreversivelmente essa terra.

  - **[INFERRED]** A herança partível (tanto a lei portuguesa quanto a brasileira dividiam o espólio igualmente entre todos os herdeiros), somada a oito filhos, significa que a parte de cada filho num pequeno minifúndio açoriano era pequena demais para viver — a aritmética estrutural que tornava a emigração necessária mesmo antes de seu afogamento. Sua morte em 1866 simplesmente liberou uma emigração que já estava carregada.

  - **[CONTEXTUAL]** Os Açores da década de 1860 viviam uma crise econômica: o comércio exportador de laranjas que sustentara a economia insular por décadas colapsou nas décadas de 1850–1860 devido a uma doença fúngica. Com tanto a terra quanto a economia exportadora falhando, a geração do final das décadas de 1860–1870 estava sob pressão simultânea para partir — o contexto que enviou seu filho João ao Brasil.

  - **[INFERRED]** O nome "Manoel Muniz Bytancourt" tornou-se "Manoel Luiz Bittencourt" no registro de óbito de 1915 de seu filho João em Carangola (PAR-0007) — o tipo de deformação que ocorre após uma travessia atlântica e 50 anos de transmissão oral. Seu próprio registro de óbito em Povoação (PAR-0015) preserva a forma correta.

  ## Identidade

  **Manoel Muniz Bytancourt** (também *Byttancourt*; abrasileirado pelo filho para
  *Bittencourt*). [PROVEN] O óbito de 1915 em Carangola de seu filho João grafou
  erroneamente o pai como "Manoel Luiz Bittencourt" (PAR-0007); seu próprio óbito de 1866 em
  Povoação fornece o nome verdadeiro, Manoel MUNIZ Bytancourt (PAR-0015).

  - **Nascimento:** 12 de junho de 1822, batizado em 17 de junho de 1822 na Matriz de Nossa
  Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores), filho legítimo de João Muniz
  e Maria Jac[i]nta, "ambos naturaes e freguezes" da freguesia (PAR-0051; eventos E-0048,
  E-0080). [PROVEN] Isto substitui o antigo "por volta de 1820", derivado da idade ao
  falecer: seu óbito de 1866 lhe dá 46 anos (PAR-0015), cerca de dois a mais do que o
  batismo implica — **[INFERRED]** uma aproximação comum do declarante. A pesquisa de
  recuperação lê o ano do batismo como 1821; o registro, tal como lido aqui, diz "mil oito
  centos e vinte dous", e 1822 prevalece. Português (açoriano) [PROVEN — seu casamento de
  1842 registra ambos os cônjuges como naturais da freguesia, ali batizados (PAR-0024)].

  - **Ocupação:** proprietário, residente na Lomba do Botão, na freguesia (PAR-0015).
  [PROVEN]

  - **Casamento:** Francisca Roza do Espirito Santo (P-0047), em 17 de fevereiro de 1842, em
  N.S. Mãe de Deus, Povoação (PAR-0024, fólio 32r), dispensados de um impedimento de
  consanguinidade de 4º grau. [PROVEN] O ato nomeia legivelmente os pais de ambos os cônjuges
  — os dele (F-0023) e os de Francisca, Manoel de Motta [var. Mello] × Anna de Souza (F-0042).
  Foi celebrado perante o Vigário Julião Francisco Tavares e o Cura José Antonio Barbosa,
  com as testemunhas José Jacintho Botelho e Estevão Manoel, este assinando de cruz. O ato
  escreve sua mãe como "Maria Euginia [Eugenia] de Medeiros" — a mesma mulher registrada
  como Maria Jacintha em seu batismo e em seu óbito (PAR-0051, PAR-0015); **[INFERRED]** o
  lapso muito provavelmente toma o nome da mãe dela, Maria Eugenia (PAR-0037).
  (Antes lido como 1º de fevereiro de 1845, a partir de uma imagem mal identificada do fólio
  73r de um casal diferente; corrigido em 11 de agosto de 2026 — ver PAR-0024.)

  - **Pais:** João Muniz Bytancourt (P-0048) e Maria Jacintha de Medeiros (P-0049), ambos
  naturais da freguesia (família F-0023), nomeados em seu batismo de 1822 (PAR-0051) e em
  seu óbito de 1866 (PAR-0015). [PROVEN] O casamento deles, em 7 de outubro de 1819 em Mãe
  de Deus, dá o pai por extenso como João Francisco Muniz Bitancourt (PAR-0037).

  - **Avós:** paternos, Manoel Muniz Bitancourt (P-0082) e Tereza do Amaral (P-0083, já
  falecida em 1819); maternos, João de Medeiros Brandão (P-0084) e Maria Eugenia (P-0085)
  — todos nomeados no ato de casamento de seus pais, de 1819 (PAR-0037). [PROVEN]

  - **Filhos:** seu óbito de 1866 declara que deixou oito filhos (PAR-0015) [PROVEN — a
  contagem]. Oito nomes candidatos estão atestados, mas o rol **não** está inteiramente
  provado [Corrigido em 2026-10-08: antes "todos os 8 filhos sobreviventes estão agora
  individualmente PROVADOS"]:

  - *Filhos provados do casal, vivos depois de 1866:* o futuro imigrante João Muniz
  Bittencourt (P-0019, n. 1845; PAR-0022; f. 1915); Maria (n. 26 de dezembro de 1842;
  PAR-0045, cuja nota marginal registra um óbito por volta de abril de 1931); **Claudina
  Muniz Bettencourt** (n. ~1856; seu casamento de 1872 em Mãe de Deus, PAR-0084, nomeia os
  pais e registra Manoel já falecido); e **Anna Maria Byttancourt** (n. ~1855; seu
  casamento de 1878 em Mãe de Deus nomeia-a "filha legitima de Manoel Muniz Byttancourt e de
  Francisca Roza do Espirito Santo", PAR-0083) [PROVEN].

  - *Nascimentos provados, sobrevivência até 1866 não demonstrada:* Francisca (n. 31 de
  agosto de 1849; PAR-0046) e Maria (n. 29 de novembro de 1851; PAR-0047) — apenas os
  batismos [PROVEN o nascimento; sobrevivência OPEN].

  - *Pista:* o irmão batizado com João em 1845 (PAR-0022), identificado como Manoel apenas
  pela pesquisa de recuperação [LEAD].

  - *Provável, possivelmente duplicada:* **Maria José Bittencourt** (f. 8 de novembro de
  1943 no Rio de Janeiro, aos 85 anos, logo n. ~1858), cujo registro civil de óbito
  (CIV-0034) nomeia Manoel Muniz Bittencourt e Francisca Rosa Bittencourt como pais e a
  registra como "natural de Portugal" — sem freguesia nem ilha; declarante não parente. Pode
  ser uma filha distinta ou a mesma pessoa que a Maria de 1851 (PAR-0047); a identidade está
  em aberto [PROBABLE].

  - Um nono nascimento — a infante **Claudina** (n. ~maio de 1854, f. 24 de setembro de
  1854, PAR-0085) — premorreu a Manoel e não é contada entre os "8 filhos" [PROVEN].

  Os oito nomes só coincidem com a contagem declarada se o irmão batizado em conjunto for
  real, se Maria José for distinta da Maria de 1851 e se Francisca e a Maria de 1851
  sobreviveram até 1866.

  - **Óbito:** 24 de julho de 1866, por volta de uma hora da tarde, "na bahia, fóra do
  Garajau" da freguesia, sem os sacramentos, intestado (PAR-0015). [PROVEN] As circunstâncias
  sugerem afogamento. [INFERRED]

  ## Posição social e profissão

  Um homem com bens da Lomba do Botão, Povoação — um proprietário, a mesma condição de seu
  pai (PAR-0015). Sua morte súbita no mar, em julho de 1866, sem sacramentos e intestado,
  deixou oito filhos. [PROVEN, a condição]

  ## Família e rede social

  Marido de Francisca Roza do Espirito Santo (P-0047) e filho do proprietário de Mãe de Deus
  João Muniz Bytancourt (P-0048) e de Maria Jacintha de Medeiros (P-0049); um irmão documentado,
  Agostinho (n. 1843), é nomeado com os mesmos pais em PAR-0044. Outros seis filhos de seus
  pais foram batizados em Mãe de Deus entre 1831 e 1841 — um filho de prenome ilegível
  (1831), Michaelina (1833), Rosa (1834), Damaso (1836), Francisco (1839) e José (1841)
  (PAR-0038 a PAR-0043); José foi depois padrinho de duas filhas de Manoel (PAR-0045,
  PAR-0046). **[LEAD]** A pesquisa de recuperação informa ainda dois irmãos mais velhos,
  João (n. 3 de fevereiro de 1823) e Maria (n. 1º de novembro de 1825), por batismos não
  conservados aqui; e o registro de passaportes de Ponta Delgada registraria passaportes
  de 1880 de dois irmãos, António Moniz Bettencourt e Dâmaso Moniz, cada um "filho de João
  Moniz Bettencourt e Maria Jacinta" (apenas transcrição, não catalogada — ver as notas de
  PAR-0015). Por meio de seu filho João, é o ancestral em quem a linha cruza o Atlântico;
  sua própria geração e a de seus pais estão todas enraizadas em Povoação, São Miguel.

  Seus padrinhos em 1822 foram Antonio de Medeiros Brandão e sua mulher Anna de Souza
  (PAR-0051); Antonio havia sido testemunha do casamento de seus pais três anos antes
  (PAR-0037). Esta Anna de Souza não é identificada com sua futura sogra homônima (P-0087),
  mulher de Manoel da Motta Junior.

  **Cuidados com homônimos.** Sua tia, casada em 1818 com Manoel Cabral, tinha exatamente o
  nome de sua mãe, Maria Jacintha de Medeiros, mas era filha de Manoel Muniz e Tereza do
  Amaral (PAR-0048) — outra mulher, que nunca deve ser fundida com P-0049. **[LEAD]** A
  pesquisa de recuperação aponta também um outro Manoel Muniz Bitancourt, filho de
  Francisco Moniz de Medeiros, que se casou com Anna Francisca do Amaral na mesma freguesia
  por volta de janeiro de 1842; a identidade aqui se apoia no casal de pais, não no nome.

  ## O que podemos extrapolar

  *Manoel é o pivô de toda a linhagem, de modo que sua §4 carrega o arco do conjunto: é o
  último Muniz Bytancourt documentado como possuidor de terra, e sua morte é a dobradiça
  pela qual a família deixa os Açores.*

  **1. Posição social: herdada, fundiária e da menor espécie herdável [PROVEN na base /
  INFERRED na leitura].** Seu óbito de 1866 o chama *proprietário* e chama também
  *proprietário* seu pai João (P-0048) (PAR-0015) — duas gerações documentadas vivendo de
  terra própria na Lomba do Botão, na freguesia-sede de Nossa Senhora Mãe de Deus. Isso
  importa para o modo como a posição se transmite: terra é capital herdável, ao contrário de
  um cargo (que termina com a nomeação) ou de um ofício (que termina com o homem). Mas era
  terra na ponta pequena. **[CONTEXTUAL]** Em São Miguel a superfície cultivável era escassa
  e em grande parte travada: o *morgadio* passava as propriedades íntegras ao primogênito e
  excluía os filhos segundos do patrimônio, e só foi abolido em Portugal em 1863, quando
  Manoel tinha uns 40 anos. Possuir terra, qualquer que fosse, colocava a família um degrau
  acima dos jornaleiros e caseiros sem terra; não a colocava em parte alguma perto de uma
  elite insular.

  **2. Os próprios registros precificam sua posição [PROVEN / INFERRED].** Os livros da
  Povoação não são avaros em tratamentos honoríficos — chamam uma testemunha de casamento de
  *Capitão* (Luis Antonio de Almeida, PAR-0048), os párocos de *Reverendo*, o oficial do
  distrito de *Ouvidor*. Em nenhum dos cerca de dez atos que temos desta família um Muniz
  Bytancourt recebe um deles, e nenhuma esposa da linhagem é escrita *Dona*. **[INFERRED]**
  Essa omissão constante, em livros que concedem o tratamento com liberalidade a outros da
  mesma freguesia, é uma leitura de posição social, não um acidente de arquivo:
  *proprietário* era toda a sua descrição. Comparada ao outro lado da árvore do proprietário
  do repositório — em que Mathilde Maria de Jesus (P-0027) é *Dona* em todo lugar, seu pai
  um *Alferes* e seu sogro um *Capitão* — a calibragem é exata.

  **3. O casamento foi consolidação de parentela, não um salto [PROVEN no ato / INFERRED na
  leitura].** Seu casamento de 1842 com Francisca Roza do Espirito Santo (P-0047) exigiu
  dispensa apostólica de impedimento de **quarto grau de consanguinidade** (PAR-0024): eram
  parentes de sangue. **[CONTEXTUAL]** Numa ilha com pouca terra, o casamento entre primos
  era a via ordinária pela qual famílias de camponeses-proprietários mantinham dentro da
  parentela lotes que se fragmentavam, e os registros de Mãe de Deus são densos nos mesmos
  poucos sobrenomes — Medeiros, Botelho, Muniz, Motta. A aliança aparece de imediato no
  compadrio: em abril de 1843, catorze meses depois do casamento, os novos sogros de Manoel,
  **Manoel da Motta Junior e Anna de Souza**, foram padrinhos de seu irmão recém-nascido
  Agostinho (PAR-0044). Duas famílias se ligaram uma à outra porque nenhuma tinha coisa
  maior a que se ligar.

  **4. A escolha dos padrinhos é o marcador de classe mais claro que temos [PROVEN no padrão
  / INFERRED na leitura].** Em seis batismos consecutivos de irmãos de Manoel entre 1831 e
  1841, um mesmo casal — Manoel José da Costa e sua mulher Victoria de Medeiros — foi
  padrinho de todos (PAR-0038, PAR-0039, PAR-0040, PAR-0041, PAR-0042, PAR-0043). Quando os
  próprios filhos de Manoel foram batizados, os padrinhos foram seu irmão José e sua cunhada
  Claudina, filha dos pais de sua mulher (PAR-0045, PAR-0046). **[CONTEXTUAL]** O
  apadrinhamento batismal no mundo atlântico português era o instrumento padrão para atar
  uma casa a um patrono — um capitão, um sacerdote, um morgado. **[INFERRED]** Esta família
  nunca o usou assim. Seu compadrio corre de lado e para dentro, ligando parentes a
  parentes; não há patrono algum no registro. Uma família que não alcança para cima pelo
  apadrinhamento costuma ser uma família sem ninguém a quem alcançar.

  **5. Sucessão partilhável mais intestabilidade mais oito filhos é a aritmética que
  esvaziou a propriedade [PROVEN nos fatos / CONTEXTUAL no mecanismo].** Seu assento de
  óbito declara duas coisas que decidem o futuro da linhagem: ele **"não fez testamento"** e
  **"deixou oito filhos"** (PAR-0015). A lei portuguesa reservava a maior parte da herança
  aos herdeiros legitimários em quinhões iguais, e morrer intestado aos 46 anos retirava até
  a estreita discricionariedade que um testamento permitia. Uma pequena propriedade da
  Povoação, dividida em oito, deixa a cada filho uma fração que ninguém poderia lavrar.
  **[INFERRED]** O afogamento é o gatilho, mas o mecanismo é aritmético: a fragmentação já
  havia carregado a partida, e o 24 de julho de 1866 a disparou.

  **6. E é possível ver a aritmética morder, dentro dos Açores, antes que alguém emigre
  [PROVEN].** Manoel era proprietário de terras. Seis anos depois de sua morte, sua filha
  Claudina, de dezesseis anos, casou-se com **Manoel Soares de Lima, *sapateiro***
  (PAR-0084, que registra o pai "já defunto"); seis anos mais tarde, sua filha Anna Maria,
  de vinte e três anos, casou-se com **Manoel Cabral de Mello, *official de pedreiro***
  (PAR-0083). **[INFERRED]** Filhas de um proprietário casando-se com um sapateiro e um
  pedreiro em doze anos a contar de sua morte intestada é a fragmentação tornada visível:
  pela década de 1870 a casa já não tinha quinhão de terra que emparelhasse uma filha a um
  lavrador com terra, e o mercado matrimonial da família havia deslizado de proprietários
  para artesãos. A emigração dos filhos é o mesmo fato visto do outro lado.

  **7. Nenhuma alavanca de instrução, e o registro mostra por quê [PROVEN / CONTEXTUAL].**
  Nada nos atos que temos registra a alfabetização do próprio Manoel, em um sentido ou no
  outro — a fórmula da Povoação faz assinar o celebrante e as testemunhas, não os nubentes.
  O que os atos registram é a alfabetização do círculo que ele escolheu: Estevão Manoel
  assinou seu casamento de 1842 com uma cruz (PAR-0024), e nos batismos de seus irmãos
  Manoel Cabral, Antonio de Medeiros Brandão, Bento Pacheco, Manoel da Silva e Francisco da
  Silva assinaram todos de cruz (PAR-0038, PAR-0039, PAR-0040, PAR-0046). As assinaturas
  firmes dessas páginas pertencem ao clero. **[CONTEXTUAL]** A instrução nos Açores
  oitocentistas era um privilégio comprado e ligado à classe, sem oferta pública numa
  freguesia rural; tinha de ser comprada de novo a cada geração, e esta família nunca a
  comprou. A primeira assinatura documentada da linhagem é a de seu neto Deocleciano, no
  Brasil, setenta e quatro anos depois (CIV-0006).

  **8. Aquilo de que vivia não tinha salário por baixo [CONTEXTUAL].** Um *proprietário* da
  Povoação não tirava ordenado: sua renda era a subsistência do próprio chão, somada à
  economia costeira que afinal o matou — morreu na baía, fora do Garajau, sem os
  sacramentos, numa tarde de julho (PAR-0015). Terra tomada como sustento, e não como
  capital que acumula, é o fundo da faixa econômica desta árvore familiar, e o inverso exato
  da fazenda cafeeira escravista dos Toledo, no topo dela (P-0027).

  **Síntese — a linha de base e o ponto de virada.** Manoel é a última geração da linhagem
  enraizada em chão próprio. Tudo nessa base era real e nada dela era durável: herdada e não
  conquistada, fundiária e não assalariada, modesta e não de elite, mantida numa economia
  insular comprimida pelo *morgadio* e legalmente garantida a partir-se em oito no instante
  em que ele morresse intestado. **[INFERRED]** A família que o deixa não está caindo de uma
  posição — não havia posição a perder — é uma casa de proprietários pobres de terra
  exportando seus filhos excedentes, o padrão açoriano de manual, tendo os casamentos
  artesãos das filhas como a metade doméstica do mesmo processo. Lida contra a outra
  linhagem do proprietário do repositório, o contraste é o ponto: os Armond começam no alto,
  sobre cargo e terra vinda pelo casamento, e caem; os Muniz começam aqui, no piso, e o
  resto de seu arco é uma escalada lenta, de quatro gerações, de volta a possuir qualquer
  coisa que seja (P-0006).

