notes:
- text: >-
    Fourth child of Ladisláo Egídio Ferreira de Toledo (P-0056) and Mathilde Maria
    de Jesus (P-0027), family F-0027. Confirmed by PRB-0009 (1867 Ladisláo inventário,
    gen1), where he appears as item 4 in the título de herdeiros: "Francisco Liocadio
    de Tolledo, [vivo/viúvo] casado que foi com Maria [Joa?]quina de Jesus, falleceu
    antes da morte da inventariado." In this formula, "falleceu antes da morte da
    inventariado" refers to his WIFE Maria Joaquina de Jesus, who predeceased Ladisláo
    — not to Francisco himself. He was alive as a widower in 1867. He appears as
    herdeiro #2 (alive, direct heir) in Mathilde's 1879 inventário (PRB-0006, Film 2
    triage 2026-08-07), confirming he survived both Ladisláo (d. before 1862) and
    Matilde (d. by 1879). He was married to Maria Joaquina de Jesus (P-0062), family
    F-0030; she predeceased him and Ladisláo.
- text: >-
    CORRECTION (7 August 2026): earlier repository notes stated Francisco Leocádio
    predeceased Ladisláo based on a misread of PRB-0009 item 4. The phrase "falleceu
    antes da morte da inventariado" modifies "Maria Joaquina de Jesus" (the wife), not
    Francisco. He was alive as herdeiro #2 in Matilde's 1879 inventário; his death date
    is unknown but post-1879.
- text: >-
    MATERIAL CONFLICT (2026-08-08, conflict #15): the 1882 embargos judgment transcript
    (ladislao-1867-part05-pp309-387.md, p.383) reads "D. Maria Joaquina de Jesus,
    mulher de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Eygidio
    Ferreira de Toledo" — placing Maria Joaquina as Ladisláo's DAUGHTER and Francisco
    Leocádio as her husband (son-in-law of Ladisláo), not his direct child. This
    contradicts PRB-0009-gen1 which lists FL as child #4. Do NOT restructure F-0027
    or P-0061 until the p.383 image is verified against this transcript reading.
- text: >-
    Landholder at the Fazenda da Concórdia: the 1856 Lei de Terras registry (GOV-0003,
    entry Nº 144, event E-0073) records him as a co-possessor within the Concórdia,
    confirming him alive in April 1856. This does not bear on the child-vs-son-in-law
    conflict above.
