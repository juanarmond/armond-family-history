notes:
- text: >-
    Fourth child of Ladisláo Egídio Ferreira de Toledo (P-0056) and Mathilde Maria
    de Jesus (P-0027), family F-0027. Confirmed by PRB-0009 (1867 Ladisláo inventário,
    gen1), where he appears as item 4 in the título de herdeiros: "Francisco Liocadio
    de Tolledo, [vivo/viúvo] casado que foi com Maria [Joa?]quina de Jesus, falleceu
    antes da morte da inventariado." In this formula, "falleceu antes da morte da
    inventariado" refers to his WIFE Maria Joaquina de Jesus, who predeceased Ladisláo
    — not to Francisco himself. He was alive as a widower in 1867. He appears as
    herdeiro #2 (alive, direct heir) in Mathilde's 1879 inventário (PRB-0006, Film 2
    triage 2026-08-07), confirming he survived both Ladisláo (d. before 1862) and
    Matilde (d. by 1879). He was married to Maria Joaquina de Jesus (P-0062), family
    F-0030; she predeceased him and Ladisláo.
  text_pt: >-
    Quarto filho de Ladisláo Egídio Ferreira de Toledo (P-0056) e Mathilde Maria
    de Jesus (P-0027), família F-0027. Confirmado por PRB-0009 (inventário de
    Ladisláo de 1867, gen1), onde ele aparece como item 4 no título de herdeiros:
    "Francisco Liocadio de Tolledo, [vivo/viúvo] casado que foi com Maria
    [Joa?]quina de Jesus, falleceu antes da morte da inventariado." Nessa fórmula,
    "falleceu antes da morte da inventariado" refere-se à sua ESPOSA Maria
    Joaquina de Jesus, que faleceu antes de Ladisláo — não a Francisco em si. Ele
    estava vivo como viúvo em 1867. Ele aparece como herdeiro nº 2 (vivo, herdeiro
    direto) no inventário de Mathilde de 1879 (PRB-0006, triagem do Film 2 em
    2026-08-07), confirmando que sobreviveu tanto a Ladisláo (f. antes de 1862)
    quanto a Matilde (f. até 1879). Era casado com Maria Joaquina de Jesus
    (P-0062), família F-0030; ela faleceu antes dele e de Ladisláo.
- text: >-
    CORRECTION (7 August 2026): earlier repository notes stated Francisco Leocádio
    predeceased Ladisláo based on a misread of PRB-0009 item 4. The phrase "falleceu
    antes da morte da inventariado" modifies "Maria Joaquina de Jesus" (the wife), not
    Francisco. He was alive as herdeiro #2 in Matilde's 1879 inventário; his death date
    is unknown but post-1879.
  text_pt: >-
    CORREÇÃO (7 de agosto de 2026): notas anteriores do repositório afirmavam que
    Francisco Leocádio faleceu antes de Ladisláo, com base em uma leitura
    equivocada do item 4 de PRB-0009. A frase "falleceu antes da morte da
    inventariado" modifica "Maria Joaquina de Jesus" (a esposa), não Francisco.
    Ele estava vivo como herdeiro nº 2 no inventário de Matilde de 1879; sua data
    de óbito é desconhecida, mas posterior a 1879.
- text: >-
    MATERIAL CONFLICT (2026-08-08, conflict #15): the 1882 embargos judgment transcript
    (ladislao-1867-part05-pp309-387.md, p.383) reads "D. Maria Joaquina de Jesus,
    mulher de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Eygidio
    Ferreira de Toledo" — placing Maria Joaquina as Ladisláo's DAUGHTER and Francisco
    Leocádio as her husband (son-in-law of Ladisláo), not his direct child. This
    contradicts PRB-0009-gen1 which lists FL as child #4. Do NOT restructure F-0027
    or P-0061 until the p.383 image is verified against this transcript reading.
  text_pt: >-
    CONFLITO MATERIAL (2026-08-08, conflito nº 15): a transcrição do julgamento
    dos embargos de 1882 (ladislao-1867-part05-pp309-387.md, p.383) diz "D. Maria
    Joaquina de Jesus, mulher de Francisco Leocadio de Toledo, sobreviveu ao seu
    pai Ladislão Eygidio Ferreira de Toledo" — situando Maria Joaquina como FILHA
    de Ladisláo e Francisco Leocádio como seu marido (genro de Ladisláo), não como
    filho direto dele. Isso contradiz PRB-0009-gen1, que lista FL como filho nº 4.
    NÃO reestruturar F-0027 ou P-0061 até que a imagem da p.383 seja verificada
    contra essa leitura da transcrição.
- text: >-
    Landholder at the Fazenda da Concórdia: the 1856 Lei de Terras registry (GOV-0003,
    entry Nº 144, event E-0073) records him as a co-possessor within the Concórdia,
    confirming him alive in April 1856. This does not bear on the child-vs-son-in-law
    conflict above.
  text_pt: >-
    Proprietário de terras na Fazenda da Concórdia: o registro da Lei de Terras
    de 1856 (GOV-0003, entrada Nº 144, evento E-0073) o registra como copossuidor
    dentro da Concórdia, confirmando que estava vivo em abril de 1856. Isso não
    afeta o conflito entre filho e genro mencionado acima.
