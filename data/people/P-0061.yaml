profile: >-
  ## Identity

  **Francisco Leocádio de Toledo** (source spellings *Francisco Liocadio de Tolledo*,
  PRB-0009; *Francisco Leocadio de Toledo*, GOV-0003) [PROVEN]. Recorded as the fourth
  child of Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027),
  family F-0027 — a brother of the direct-line José Cezário (P-0054); a collateral, not a
  direct ancestor.

  - **Marriage:** ⚭ Maria Joaquina de Jesus (P-0062), family F-0030.

  - **Life span:** alive as a widower in 1867 (PRB-0009, child #4) and again as an heir in
  Mathilde's 1879 inventário; he died after 1879 [PROVEN]. He was a Concórdia co-possessor
  in April 1856 (GOV-0003, entry Nº 144, event E-0073). Nationality Brazilian.

  ## Material conflict [OPEN]

  An 1882 embargos judgment transcript (p.383) reads "D. Maria Joaquina de Jesus, mulher de
  Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Egydio Ferreira de Toledo" —
  which would make Maria Joaquina Ladisláo's DAUGHTER and Francisco Leocádio his son-in-law,
  not his direct child. This contradicts PRB-0009 (child #4). The p.383 image is not yet
  verified, and F-0027 / P-0061 are NOT restructured pending it (conflict #15, 2026-08-08).
  A prior repository note wrongly held that Francisco Leocádio predeceased Ladisláo; that
  read of PRB-0009 item 4 ("falleceu antes da morte da inventariado") in fact refers to his
  wife Maria Joaquina, corrected 7 August 2026.

  ## What we can extrapolate

  Whatever his exact tie, he is a landed member of the Concórdia Toledo circle — a
  co-possessor in the 1856 Lei de Terras registry and an heir in the family's estate
  proceedings. [INFERRED]

  ## Open questions

  - Whether he was Ladisláo's son or son-in-law (conflict #15), pending verification of the
  1882 embargos image. [OPEN]

  - His death date (after 1879) and any children. [OPEN]

  ## Sources held (this repository)

  - PRB-0009 (1867 Ladisláo inventário — listed as child #4, ⚭ Maria Joaquina de Jesus) ·
  GOV-0003 (1856 Lei de Terras, entry Nº 144 — Concórdia co-possessor, alive April 1856).
  He also appears as an heir in the 1879 Matilde inventário (PRB-0006).

  ## Regional and migration context

  A Toledo co-possessor of the Fazenda da Concórdia in the Rio Pardo / Leopoldina zona da
  mata — the family's coffee-frontier seat. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Francisco Leocádio de Toledo** (grafias de fonte *Francisco Liocadio de Tolledo*,
  PRB-0009; *Francisco Leocadio de Toledo*, GOV-0003) [PROVEN]. Registrado como o quarto
  filho de Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027),
  família F-0027 — um irmão do José Cezário da linha direta (P-0054); um colateral, não um
  ancestral direto.

  - **Casamento:** ⚭ Maria Joaquina de Jesus (P-0062), família F-0030.

  - **Período de vida:** vivo como viúvo em 1867 (PRB-0009, filho nº 4) e novamente como
  herdeiro no inventário de Mathilde de 1879; faleceu depois de 1879 [PROVEN]. Foi
  copossuidor da Concórdia em abril de 1856 (GOV-0003, entrada Nº 144, evento E-0073).
  Nacionalidade brasileira.

  ## Conflito material [OPEN]

  A transcrição do julgamento dos embargos de 1882 (p.383) diz "D. Maria Joaquina de Jesus,
  mulher de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Egydio Ferreira de
  Toledo" — o que faria de Maria Joaquina FILHA de Ladisláo e de Francisco Leocádio seu
  genro, não filho direto. Isso contradiz PRB-0009 (filho nº 4). A imagem da p.383 ainda não
  foi verificada, e F-0027 / P-0061 NÃO são reestruturados enquanto isso não ocorrer
  (conflito nº 15, 2026-08-08). Uma nota anterior do repositório afirmava erroneamente que
  Francisco Leocádio faleceu antes de Ladisláo; aquela leitura de PRB-0009 item 4 ("falleceu
  antes da morte da inventariado") refere-se, na verdade, à sua esposa Maria Joaquina,
  corrigida em 7 de agosto de 2026.

  ## O que podemos extrapolar

  Qualquer que seja seu vínculo exato, é um membro proprietário do círculo Toledo da
  Concórdia — copossuidor no registro da Lei de Terras de 1856 e herdeiro nos autos do
  espólio da família. [INFERRED]

  ## Questões em aberto

  - Se era filho ou genro de Ladisláo (conflito nº 15), pendente de verificação da imagem
  dos embargos de 1882. [OPEN]

  - Sua data de óbito (depois de 1879) e eventuais filhos. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PRB-0009 (inventário de Ladisláo de 1867 — listado como filho nº 4, ⚭ Maria Joaquina de
  Jesus) · GOV-0003 (Lei de Terras de 1856, entrada Nº 144 — copossuidor da Concórdia, vivo
  em abril de 1856). Ele também figura como herdeiro no inventário de Mathilde de 1879
  (PRB-0006).

  ## Contexto regional e migratório

  Um copossuidor Toledo da Fazenda da Concórdia na zona da mata do Rio Pardo / Leopoldina —
  a sede da família na fronteira cafeeira. [CONTEXTUAL]
