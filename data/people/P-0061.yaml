profile: >-
  ## Interesting facts

  - **[PROVEN]** In April 1856 he registered only a small co-possession inside the Fazenda
  da Concórdia (GOV-0003, Nº 144; the alqueire figure is an uncertain read), while his
  relative José Cezário declared the whole 200 alqueires for the household in the adjacent
  entry Nº 145. Eleven years later it is *his* house that holds the mortgage over José
  Cezário's entire estate.

  - **[PROVEN]** The debt the widow Claudina declared on oath in 1867 — 3:885$000 at one
  per cent a month, running since September 1859 — was owed to him (PRB-0008 fl.8r). He
  was his own family's creditor, and had been for seven and a half years.

  - **[CONTEXTUAL]** The Fazenda da Concórdia where he held land sat in the Leopoldina
  coffee-frontier zone — a district that by 1883 held the second-largest enslaved
  population in Minas Gerais, a measure of how deep the coffee economy ran there before
  abolition.

  - **[PROVEN]** He outlived almost everyone around him: Ladisláo (dead by 1862), his own
  wife Maria Joaquina, José Cezário (1866), Claudina (by 1879) and Mathilde (1879). He is
  still a living direct heir, herdeiro #2, in Mathilde's 1879 inventário.

  - **[CONTEXTUAL]** The 1850 Lei de Terras required existing landholders to declare their
  possession or face expropriation. Without that law the GOV-0003 entries would not exist,
  and his documented presence at the Concórdia would be unattested — he would be visible
  only as a name in other people's probate.

  - **[INFERRED]** The interpretive conflict placing him as either Ladisláo's son or
  son-in-law illustrates a common genealogical trap: near-identical family structures can
  shift a whole inheritance chain if misread. His exact generational position remains a
  documented uncertainty, not a settled conclusion.

  ## Identity

  **Francisco Leocádio de Toledo** (source spellings *Francisco Liocadio de Tolledo*,
  PRB-0009; *Francisco Leocadio de Toledo*, GOV-0003) [PROVEN]. Recorded as the fourth
  child of Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027),
  family F-0027 — a brother of the direct-line José Cezário (P-0054) and so an uncle of
  Eliza Balbina de Toledo (P-0017); a collateral, not a direct ancestor. That parentage is
  held at strong-evidence, not confirmed, because of the open conflict below.

  - **Marriage:** ⚭ Maria Joaquina de Jesus (P-0062), family F-0030; she predeceased him
  and, on the PRB-0009 reading, predeceased Ladisláo.

  - **Life span:** a Concórdia co-possessor in April 1856 (GOV-0003, entry Nº 144, event
  E-0073); alive as a widower in 1867 (PRB-0009, child #4); alive again as herdeiro #2 in
  Mathilde's 1879 inventário; he died after 1879 [PROVEN]. A retrieval reading places his
  death in September 1883 [LEAD — not verified]. Nationality Brazilian.

  ## Standing and profession

  - **A small landholder, and a large creditor** [PROVEN]. The two roles do not match in
  scale, and that is the point. His 1856 declaration covers a modest share held *em
  commum* within the Concórdia; his 1867 appearance is as the holder of a 3:885$000
  hypothec over the whole of his relative's estate, at one per cent a month. Retrieval
  research names the lender as the "Casa Francisco Leocádio de Toledo", a commercial house
  [LEAD — the held record names only him and the debt].

  - No office, rank or title is recorded for him in any held source.

  ## Family and social network

  - Parents (per PRB-0009 gen1): Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde
  Maria de Jesus (P-0027), family F-0027 — subject to the conflict below. Brothers and
  sisters include José Cezário (P-0054), António Ladislão (P-0063), Aureliano de Sales
  Toledo, Cezário José de Toledo, Maria Perpétua, Ignez Umbelina and Carolina Leopoldina.

  - Wife: Maria Joaquina de Jesus (P-0062), family F-0030. No children of the couple are
  named in the catalogued pages of PRB-0009.

  - His creditor relationship ran to his brother's household (PRB-0008); his brother
  Aureliano served as curador of that same brother's orphaned children in the same 1867
  proceedings. The estate's money and the estate's guardianship were both supplied from
  inside the family.

  ## Material conflict [OPEN]

  An 1882 embargos judgment transcript (p.383) reads "D. Maria Joaquina de Jesus, mulher
  de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Egydio Ferreira de
  Toledo" — which would make Maria Joaquina Ladisláo's DAUGHTER and Francisco Leocádio his
  son-in-law, not his direct child. This contradicts PRB-0009 (child #4). The p.383 image
  is not yet verified, and F-0027 / P-0061 are NOT restructured pending it (conflict #15,
  2026-08-08). A prior repository note wrongly held that Francisco Leocádio predeceased
  Ladisláo; that reading of PRB-0009 item 4 ("falleceu antes da morte da inventariado") in
  fact refers to his wife Maria Joaquina, corrected 7 August 2026.

  ## What we can extrapolate

  - **He is the family's counter-example: the Toledo who held credit rather than land, and
  outlasted those who held land** [PROVEN facts / INFERRED reading]. Every analysis of
  this line turns on heritable land worked by enslaved labour. He is the branch that did
  the opposite. In 1856 his stake in the family's flagship property is small enough that
  the register does not clearly record its size; by 1867 he is the single largest creditor
  of the household that held the rest of it, at a compounding rate; by 1879 he is still
  standing while the men who held the land are dead and their estates are in litigation.
  Within one landed clan, the branch that converted its position into **credit and
  commerce** proved more durable than the branch that kept it in **land and enslaved
  people**.

  - **What that credit was worth** [INFERRED arithmetic]. At one per cent a month from
  September 1859, a 3:885$000 principal accrues roughly its own value again in premium by
  the March 1867 inventory — so the claim against José Cezário's estate plausibly
  approached seven contos, against a total appraised estate of about nineteen and a half.
  (If the declared figure already includes accrued premium, the original advance was about
  half; either way it is one of the largest single items in the estate.) One Toledo branch
  had a lien over roughly a third of another Toledo branch's entire wealth. [PROVEN base
  figures — PRB-0008 fl.8r; the interest treatment is not stated in the held folios]

  - **Credit inside a family is a different instrument from credit outside one**
  [CONTEXTUAL]. Nineteenth-century rural Minas had no local banking network to speak of;
  agricultural credit came from commission houses, merchants and relatives. Lending to kin
  at a stated monthly premium is not charity and was not read as such: it is the standard
  mechanism by which liquid capital inside an extended family moved toward whoever had
  cash and away from whoever had only crops. It also means the family's internal accounts
  were not separable from its internal politics — which is part of why the same clan spent
  1880 to 1889 litigating its own partitions.

  - **His survival is itself evidence about risk** [INFERRED]. Land in this economy was
  illiquid, mortgageable, seizable, divisible among many heirs and, in its largest
  component, about to be abolished. A credit claim was none of those things: it was a
  fixed nominal sum owed to one named person, and it survived the debtor. That is an
  unglamorous but decisive difference in the mechanics of nineteenth-century wealth, and
  this family contains both halves of the experiment.

  - **The unresolved conflict changes the reading materially, and should not be quietly
  closed** [OPEN]. If he was Ladisláo's son, he is a landed heir who diversified into
  commerce. If he was Ladisláo's son-in-law, he is an outsider who married into the clan
  and then became its creditor — a different and sharper story about how capital entered
  and left this family. The held records support the first; the unverified 1882 judgment
  supports the second. Nothing decides it, and nothing here should be written as if
  something did.

  ## Open questions

  - Whether he was Ladisláo's son or son-in-law (conflict #15), pending verification of
  the 1882 embargos image. [OPEN]

  - His death date — after 1879; a retrieval reading gives September 1883 [LEAD] — and his
  own inventário, which would size the commercial house and show whether the José Cezário
  mortgage was ever paid or offset against a co-ownership share. [OPEN]

  - Any children of his marriage to Maria Joaquina de Jesus. [OPEN]

  - The nature and scale of the "Casa Francisco Leocádio de Toledo" — whether it was a
  general store, a coffee commission house or simply the style used for his personal
  lending. [OPEN]

  ## Sources held (this repository)

  - PRB-0009 (1867 Ladisláo inventário — listed as child #4, ⚭ Maria Joaquina de Jesus;
  also carries the 1881 embargos supplement in the same autos) · GOV-0003 (1856 Lei de
  Terras, entry Nº 144 — Concórdia co-possessor, alive April 1856) · PRB-0008 (1867 José
  Cezário inventário — the widow's sworn declaration names him as the estate's hypothecary
  creditor) · PRB-0004, PRB-0006, PRB-0007, PRB-0010 (the wider Concórdia and Barbacena
  Toledo succession, in which he appears as heir #2 in Mathilde's 1879 estate).

  ## Regional and migration context

  A Toledo co-possessor of the Fazenda da Concórdia in the Rio Pardo / Leopoldina zona da
  mata — the family's coffee-frontier seat, in a district whose economy ran on enslaved
  labour until 1888. No move of his own is documented; his whole recorded life is inside
  the Concórdia cluster. [CONTEXTUAL]

  ## Where to go today

  - **Landholding (1856) and family seat:** Fazenda da Concórdia, distrito de Tebas
  (Leopoldina), MG [APPROX] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Tebas%2C%20Leopoldina%2C%20MG)

  - **The estates in which he appears (1867–1879):** Fórum da Comarca de Leopoldina, MG
  (Rua Geraldo Campana 200) [RESOLVED] ·
  [Maps](https://www.google.com/maps/search/?api=1&query=Rua%20Geraldo%20Campana%20200%2C%20Leopoldina%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Em abril de 1856 registrou apenas uma pequena copossessão dentro da
  Fazenda da Concórdia (GOV-0003, Nº 144; a cifra de alqueires é leitura incerta),
  enquanto seu parente José Cezário declarou os 200 alqueires inteiros pela casa na
  entrada vizinha, Nº 145. Onze anos depois, é a casa *dele* que detém a hipoteca sobre
  todo o espólio de José Cezário.

  - **[PROVEN]** A dívida que a viúva Claudina declarou sob juramento em 1867 — 3:885$000
  a um por cento ao mês, corrente desde setembro de 1859 — era devida a ele (PRB-0008
  fl.8r). Era o credor da própria família, e havia sete anos e meio.

  - **[CONTEXTUAL]** A Fazenda da Concórdia, onde detinha terras, situava-se na zona de
  fronteira cafeeira de Leopoldina — distrito que em 1883 tinha a segunda maior população
  escravizada de Minas Gerais, medida da profundidade da economia cafeeira ali antes da
  abolição.

  - **[PROVEN]** Sobreviveu a quase todos à sua volta: Ladisláo (morto até 1862), sua
  própria esposa Maria Joaquina, José Cezário (1866), Claudina (até 1879) e Mathilde
  (1879). Ainda é herdeiro direto vivo, herdeiro nº 2, no inventário de Mathilde de 1879.

  - **[CONTEXTUAL]** A Lei de Terras de 1850 obrigava os possuidores existentes a declarar
  sua posse sob pena de expropriação. Sem essa lei, as entradas de GOV-0003 não
  existiriam, e sua presença documentada na Concórdia ficaria sem atestação — ele seria
  visível apenas como um nome em inventários alheios.

  - **[INFERRED]** O conflito interpretativo que o coloca como filho ou como genro de
  Ladisláo ilustra uma armadilha genealógica comum: estruturas familiares quase idênticas
  podem deslocar toda uma cadeia hereditária se mal lidas. Sua posição geracional exata
  permanece incerteza documentada, não conclusão estabelecida.

  ## Identidade

  **Francisco Leocádio de Toledo** (grafias de fonte *Francisco Liocadio de Tolledo*,
  PRB-0009; *Francisco Leocadio de Toledo*, GOV-0003) [PROVEN]. Registrado como o quarto
  filho de Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde Maria de Jesus (P-0027),
  família F-0027 — irmão do José Cezário da linha direta (P-0054) e, portanto, tio de
  Eliza Balbina de Toledo (P-0017); um colateral, não ancestral direto. Essa filiação é
  mantida como evidência forte, não confirmada, por causa do conflito aberto abaixo.

  - **Casamento:** ⚭ Maria Joaquina de Jesus (P-0062), família F-0030; ela faleceu antes
  dele e, na leitura de PRB-0009, antes de Ladisláo.

  - **Período de vida:** copossuidor na Concórdia em abril de 1856 (GOV-0003, entrada Nº
  144, evento E-0073); vivo como viúvo em 1867 (PRB-0009, filho nº 4); vivo de novo como
  herdeiro nº 2 no inventário de Mathilde de 1879; faleceu depois de 1879 [PROVEN]. Uma
  leitura da recuperação situa sua morte em setembro de 1883 [LEAD — não verificado].
  Nacionalidade brasileira.

  ## Posição social e profissão

  - **Pequeno proprietário e grande credor** [PROVEN]. Os dois papéis não têm a mesma
  escala, e é esse o ponto. Sua declaração de 1856 cobre uma parte modesta detida *em
  commum* dentro da Concórdia; sua aparição em 1867 é como detentor de uma hipoteca de
  3:885$000 sobre todo o espólio de seu parente, a um por cento ao mês. A pesquisa de
  recuperação nomeia o credor como a "Casa Francisco Leocádio de Toledo", uma casa
  comercial [LEAD — o registro disponível nomeia apenas ele e a dívida].

  - Nenhum cargo, posto ou título lhe é registrado em qualquer fonte disponível.

  ## Família e rede social

  - Pais (conforme PRB-0009 gen1): Ladisláo Egídio Ferreira de Toledo (P-0056) × Mathilde
  Maria de Jesus (P-0027), família F-0027 — sujeito ao conflito abaixo. Entre irmãos e
  irmãs: José Cezário (P-0054), António Ladislão (P-0063), Aureliano de Sales Toledo,
  Cezário José de Toledo, Maria Perpétua, Ignez Umbelina e Carolina Leopoldina.

  - Esposa: Maria Joaquina de Jesus (P-0062), família F-0030. Nenhum filho do casal é
  nomeado nas páginas catalogadas de PRB-0009.

  - Sua relação de crédito corria para a casa de seu irmão (PRB-0008); seu irmão Aureliano
  serviu como curador dos filhos órfãos desse mesmo irmão nos autos de 1867. O dinheiro do
  espólio e a tutela do espólio foram ambos fornecidos de dentro da família.

  ## Conflito material [OPEN]

  A transcrição do julgamento dos embargos de 1882 (p.383) diz "D. Maria Joaquina de
  Jesus, mulher de Francisco Leocadio de Toledo, sobreviveu ao seu pai Ladislão Egydio
  Ferreira de Toledo" — o que faria de Maria Joaquina FILHA de Ladisláo e de Francisco
  Leocádio seu genro, não filho direto. Isso contradiz PRB-0009 (filho nº 4). A imagem da
  p.383 ainda não foi verificada, e F-0027 / P-0061 NÃO são reestruturados enquanto isso
  não ocorrer (conflito nº 15, 2026-08-08). Uma nota anterior do repositório afirmava
  erroneamente que Francisco Leocádio faleceu antes de Ladisláo; aquela leitura de
  PRB-0009 item 4 ("falleceu antes da morte da inventariado") refere-se, na verdade, à sua
  esposa Maria Joaquina, corrigida em 7 de agosto de 2026.

  ## O que podemos extrapolar

  - **Ele é o contraexemplo da família: o Toledo que deteve crédito em vez de terra, e
  sobreviveu aos que detiveram terra** [PROVEN os fatos / INFERRED a leitura]. Toda
  análise desta linha gira em torno de terra hereditária trabalhada por pessoas
  escravizadas. Ele é o ramo que fez o contrário. Em 1856 sua parte na
  propriedade-carro-chefe da família é pequena o bastante para que o registro não anote
  com clareza seu tamanho; em 1867 é o maior credor isolado da casa que detinha o resto
  dela, a juros compostos; em 1879 continua de pé, enquanto os homens que detinham a terra
  estão mortos e seus espólios em litígio. Dentro de um mesmo clã fundiário, o ramo que
  converteu sua posição em **crédito e comércio** mostrou-se mais durável do que o ramo
  que a manteve em **terra e pessoas escravizadas**.

  - **Quanto valia esse crédito** [INFERRED aritmética]. A um por cento ao mês desde
  setembro de 1859, um principal de 3:885$000 acumula em prêmio algo próximo do próprio
  valor até o inventário de março de 1867 — de modo que o crédito contra o espólio de José
  Cezário plausivelmente beirava sete contos, contra um espólio total avaliado em cerca de
  dezenove e meio. (Se a cifra declarada já incluir o prêmio acumulado, o adiantamento
  original foi cerca de metade; de qualquer modo, é um dos maiores itens isolados do
  espólio.) Um ramo Toledo tinha garantia sobre cerca de um terço de toda a riqueza de
  outro ramo Toledo. [PROVEN os valores de base — PRB-0008 fl.8r; o tratamento dos juros
  não consta dos fólios disponíveis]

  - **Crédito dentro de uma família é instrumento diferente de crédito fora dela**
  [CONTEXTUAL]. As Minas rurais do século XIX não tinham rede bancária local digna do
  nome; o crédito agrícola vinha de casas comissárias, comerciantes e parentes. Emprestar
  a parentes a um prêmio mensal declarado não é caridade e não era lido como tal: é o
  mecanismo padrão pelo qual o capital líquido dentro de uma família extensa se movia em
  direção a quem tinha dinheiro e para longe de quem só tinha safra. Significa também que
  as contas internas da família não eram separáveis de sua política interna — parte da
  razão pela qual o mesmo clã passou de 1880 a 1889 litigando as próprias partilhas.

  - **Sua sobrevivência é, ela mesma, evidência sobre risco** [INFERRED]. A terra nesta
  economia era ilíquida, hipotecável, penhorável, divisível entre muitos herdeiros e, em
  seu maior componente, prestes a ser abolida. Um crédito não era nada disso: era uma soma
  nominal fixa devida a uma pessoa nomeada, e sobreviveu ao devedor. É uma diferença sem
  glamour, mas decisiva, na mecânica da riqueza oitocentista — e esta família contém as
  duas metades do experimento.

  - **O conflito não resolvido altera a leitura de modo material e não deve ser encerrado
  em silêncio** [OPEN]. Se era filho de Ladisláo, é um herdeiro fundiário que diversificou
  para o comércio. Se era genro de Ladisláo, é um estranho que se casou dentro do clã e
  depois se tornou seu credor — história diferente e mais aguda sobre como o capital
  entrou e saiu desta família. Os registros disponíveis apoiam a primeira; a sentença não
  verificada de 1882 apoia a segunda. Nada decide a questão, e nada aqui deve ser escrito
  como se algo decidisse.

  ## Questões em aberto

  - Se era filho ou genro de Ladisláo (conflito nº 15), pendente de verificação da imagem
  dos embargos de 1882. [OPEN]

  - Sua data de óbito — depois de 1879; uma leitura da recuperação dá setembro de 1883
  [LEAD] — e seu próprio inventário, que dimensionaria a casa comercial e mostraria se a
  hipoteca de José Cezário foi alguma vez paga ou compensada contra uma quota de
  copropriedade. [OPEN]

  - Eventuais filhos de seu casamento com Maria Joaquina de Jesus. [OPEN]

  - A natureza e a escala da "Casa Francisco Leocádio de Toledo" — se era venda, casa
  comissária de café ou apenas a forma usada para seus empréstimos pessoais. [OPEN]

