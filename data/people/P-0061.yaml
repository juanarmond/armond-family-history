  ## Contexto regional e migratório

  Um copossuidor Toledo da Fazenda da Concórdia, na zona da mata do Rio Pardo / Leopoldina
  — a sede da família na fronteira cafeeira, em distrito cuja economia funcionou com
  trabalho escravizado até 1888. Nenhum deslocamento próprio está documentado; toda a sua
  vida registrada transcorre dentro do núcleo da Concórdia. [CONTEXTUAL]

