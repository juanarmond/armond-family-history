profile: >-
  ## Interesting facts

  - **[PROVEN]** He was recorded as a proprietário ("landowner") at Mãe de Deus, Povoação — and his son Manoel (P-0042) held the same proprietário status in the same parish. Two successive generations of Azorean smallholders in the same Mãe de Deus parish, the same small plot supporting father and then son until partible inheritance and emigration broke the continuity (PAR-0015).

  - **[PROVEN]** His 1819 marriage record (PAR-0037) gives his fuller name "João Francisco Muniz Bitancourt" and names his parents — Manoel Muniz Bitancourt (P-0082) × Tereza do Amaral (P-0083) — extending the documented line one generation above him on the Azorean side.

  - **[CONTEXTUAL]** His marriage in 1819 coincided exactly with the founding of the Nova Friburgo colony in Brazil — the same year Dom João VI was recruiting Swiss colonists for the Serra Fluminense highlands. While Jacob Borer (P-0050) was crossing the Atlantic to start a new life in Brazil, João Muniz was marrying and settling into his father's São Miguel smallholding.

  - **[INFERRED]** Secondary sources give approximate dates of birth 1806 and death 1876 — but a man born in 1806 cannot father a son born about 1820, showing that secondary-source circulation on this person needs critical scrutiny. PAR-0015 establishes only his existence, proprietário status and Povoação naturalidade; the exact dates are not primary-confirmed.

  - **[CONTEXTUAL]** The Mãe de Deus parish at Povoação was the seat parish of the municipality, on São Miguel's southeastern coast — one of the most exposed and economically marginal parts of the island, where the mix of farming and coastal fishing was the same combination that killed his son Manoel in 1866.

  ## Identity

  **João Muniz Bytancourt** (fuller form "João Francisco Muniz Bitancourt" in his own 1819
  marriage, PAR-0037; Brazilianised variant "João Moniz Bettencourt"). [PROVEN]

  - **Parents:** Manoel Muniz Bitancourt (P-0082) × Tereza do Amaral (P-0083, deceased by
  1819), family F-0040 — named in his 7 October 1819 marriage (PAR-0037). [PROVEN]

  - **Origin:** native of Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); Portuguese (Açorean). [PROVEN]

  - **Occupation:** proprietário (landowner) at Mãe de Deus. [PROVEN via PAR-0015]

  - **Spouse:** Maria Jacintha de Medeiros (P-0049; family F-0023), also of the parish;
  married 7 October 1819 at N.S. Mãe de Deus (PAR-0037). [PROVEN]

  - **Child:** Manoel Muniz Bytancourt (P-0042), through whom he is the paternal grandfather
  of the immigrant João Muniz Bittencourt (P-0019). [PROVEN]

  - **Birth and death:** undocumented. Secondary sources circulate "b. 1806, d. 1876", but
  those are leads only and are not asserted — a man born 1806 could not father a son born
  about 1820; PAR-0015 establishes only his existence, landowner status and Povoação
  origin. [LEAD]

  ## Standing and profession

  - **Proprietário (landowner)** [PROVEN] — so named in his son Manoel's 1866 death act,
  which describes him as "João Muniz Bytancourt, proprietario", *natural desta freguesia*
  (PAR-0015). The same act records his son as a *proprietário* too, so the family lived off
  land it owned at Mãe de Deus across two documented generations.

  - **No office, title or honorific** [PROVEN absence] — in none of the held acts naming him
  is he given a rank or a *Dom*, in registers that style a marriage witness *Capitão* and
  the clergy *Reverendo* without hesitation (PAR-0037, PAR-0048). The omission is consistent
  across every act and is recorded here as deliberate, not as a gap.

  - **Literacy not recorded** [OPEN] — the Povoação marriage and baptism formularies have
  the officiant and witnesses sign, not the principals, so no signature of his survives in
  the held images.

  ## Family and social network

  Father of Manoel (P-0042) and husband of Maria Jacintha de Medeiros (P-0049) — a Mãe de
  Deus couple documented as the paternal grandparents in the 1845 baptism of Manoel's
  children (PAR-0022) and named in Manoel's 1866 death (PAR-0015). A further son, Agostinho
  (b. 13 April 1843, bapt. 23 April 1843), is documented by his own 1843 Mãe de Deus baptism
  (PAR-0044), which uniquely names both grandparent couples and so independently corroborates
  this couple's parentage. His grandsons' 1880 Ponta Delgada emigration passports style them
  "filho de João Moniz Bettencourt e Maria Jacinta" — a secondary corroboration held as a
  lead only. [LEAD]

  ## What we can extrapolate

  *João Sr is where the compound arithmetic starts: the first of two consecutive documented
  generations to divide one Povoação holding eight ways.*

  **1. His standing was inherited land, and the smallest heritable kind [PROVEN /
  INFERRED].** His son's 1866 óbito names him *proprietário* and his son *proprietário* in
  turn (PAR-0015) — two generations living off ground they owned at Mãe de Deus.
  **[CONTEXTUAL]** Land is heritable capital, unlike office or trade; but on São Miguel it
  was scarce, and the *morgadio* entail — abolished in Portugal only in 1863 — passed
  estates largely intact to firstborn sons and shut the others out. Owning any of it put the
  family a rung above the landless; it put them nowhere near an island elite, and the
  registers confirm the reading: across the acts held for this family no member is ever
  given an honorific, in books that style a marriage witness *Capitão* without hesitation
  (PAR-0048).

  **2. He is the first documented eight-way split — and his son repeats it [PROVEN /
  INFERRED].** At least eight children of his are documented by name or act: Manoel (1822,
  PAR-0051), an unnamed son (1831, PAR-0038), Michaelina (1833), Rosa (1834), Damaso (1836),
  Francisco (1839), José (1841) and Agostinho (1843) (PAR-0039 to PAR-0044). His son Manoel
  then died intestate in 1866 leaving eight surviving children of his own (PAR-0015).
  **[INFERRED]** Partible succession applied twice in succession reduces a single holding to
  something on the order of a sixty-fourth per heir. That compounding, not any single
  misfortune, is the mechanism that emptied the family's land base and sent the third
  generation to Brazil.

  **3. His compadrio is the family's clearest social self-portrait [PROVEN pattern /
  INFERRED reading].** For six consecutive baptisms between 1831 and 1841 the godparents
  were the same couple — **Manoel José da Costa and his wife Victoria de Medeiros**
  (PAR-0038, PAR-0039, PAR-0040, PAR-0041, PAR-0042, PAR-0043). **[CONTEXTUAL]** Baptismal
  sponsorship in the Portuguese Atlantic was the standard way a household attached itself to
  a patron. **[INFERRED]** He used it instead to deepen one horizontal tie with a neighbour
  couple, over and over. There is no captain, priest or *morgado* anywhere in his children's
  godparent list; a family that never reaches upward through godparenthood is usually a
  family with nobody above it to reach.

  **4. The circle around him was illiterate, and so, probably, was he [PROVEN of the circle
  / INFERRED of the man].** Nothing records his own literacy — the Povoação form has the
  officiant and witnesses sign, not the principals. But the witnesses he and his family
  chose signed with crosses: Antonio de Medeiros Brandão (a witness at his own 1819
  marriage) signs with a cross at his daughter Michaelina's 1833 baptism, as do Manoel
  Cabral (1831) and Bento Pacheco (1834) (PAR-0037, PAR-0038, PAR-0039, PAR-0040).
  **[CONTEXTUAL]** Schooling in the nineteenth-century Azores was a purchased privilege with
  no public provision in a rural freguesia, re-bought each generation. This family never
  bought it; the line's first documented signature belongs to his great-grandson in Brazil
  in 1890 (CIV-0041).

  **5. What he transmitted was belonging, and it did not travel [INFERRED].** He and his
  wife are recorded *naturaes e freguezes desta Parochial* — born, married, parenting and
  dying inside one parish (PAR-0037, PAR-0015). **[INFERRED]** Being a native landholding
  household of the seat parish carried a local respectability that cost nothing and was
  real. It was also completely non-portable: it is exactly what his great-grandson João
  (P-0019) had to rebuild from scratch in Brazil by marrying into the Rego Brandão
  household. What this man had for free is what the Atlantic crossing cost the line two
  generations down.

  ## Open questions

  - His own baptism and death (Mãe de Deus) — would fix his dates; his 1819 marriage and his
  parents are now documented (PAR-0037). The pre-1818 baptism books are not digitised online.
  [OPEN]

  ## Sources held (this repository)

  - PAR-0037 (his own 7 October 1819 Mãe de Deus marriage — names him "João Francisco Muniz
  Bitancourt" and his parents) · PAR-0015 (his son Manoel's 1866 Povoação death — names him
  proprietário, "natural desta freguesia") · PAR-0022 (the 1845 baptism of Manoel's children
  — paternal grandparents) · PAR-0044 (his son Agostinho's 1843 baptism — names him the
  father and both grandparent couples).

  ## Regional and migration context

  The São Miguel origin end of the Muniz Byttancourt trunk — a propertied native of the
  Povoação seat parish, with no move documented. [CONTEXTUAL] The Atlantic crossing is two
  generations below him, when his grandsons left for Brazil between 1866 and 1882 (most
  plausibly near 1880; see P-0019).

  ## Where to go today

  - **Marriage (1819) & children's baptisms:** Igreja Matriz de N.S. da Mãe de Deus, Vila da Povoação, São Miguel, Açores, PT (coords 37.74891, −25.24372) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=37.74891,-25.24372)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Foi registrado como proprietário em Mãe de Deus, Povoação — e seu filho Manoel (P-0042) deteve a mesma condição de proprietário na mesma freguesia. Duas gerações sucessivas de minifundiários açorianos na mesma freguesia de Mãe de Deus, o mesmo pequeno lote sustentando pai e depois filho, até que a herança partível e a emigração romperam a continuidade (PAR-0015).

  - **[PROVEN]** Seu registro de casamento de 1819 (PAR-0037) fornece seu nome mais completo "João Francisco Muniz Bitancourt" e nomeia seus pais — Manoel Muniz Bitancourt (P-0082) × Tereza do Amaral (P-0083) — estendendo a linha documentada uma geração acima dele no lado açoriano.

  - **[CONTEXTUAL]** Seu casamento em 1819 coincidiu exatamente com a fundação da colônia de Nova Friburgo no Brasil — o mesmo ano em que Dom João VI recrutava colonos suíços para os altos da Serra Fluminense. Enquanto Jacob Borer (P-0050) cruzava o Atlântico para iniciar uma nova vida no Brasil, João Muniz se casava e se estabelecia no minifúndio de seu pai em São Miguel.

  - **[INFERRED]** Fontes secundárias fornecem datas aproximadas de nascimento em 1806 e óbito em 1876 — mas um homem nascido em 1806 não poderia ser pai de um filho nascido por volta de 1820, mostrando que a circulação de fontes secundárias sobre esta pessoa precisa de escrutínio crítico. PAR-0015 estabelece apenas sua existência, condição de proprietário e naturalidade em Povoação; as datas exatas não estão confirmadas por fonte primária.

  - **[CONTEXTUAL]** A freguesia de Mãe de Deus, em Povoação, era a freguesia-sede do município, no litoral sudeste de São Miguel — uma das partes mais expostas e economicamente marginais da ilha, onde a mistura de agricultura e pesca costeira era a mesma combinação que matou seu filho Manoel em 1866.

  ## Identidade

  **João Muniz Bytancourt** (forma mais completa "João Francisco Muniz Bitancourt" em seu
  próprio casamento de 1819, PAR-0037; variante abrasileirada "João Moniz Bettencourt").
  [PROVEN]

  - **Pais:** Manoel Muniz Bitancourt (P-0082) × Tereza do Amaral (P-0083, falecida até
  1819), família F-0040 — nomeados em seu casamento de 7 de outubro de 1819 (PAR-0037). [PROVEN]

  - **Origem:** natural de Nossa Senhora Mãe de Deus, Villa da Povoação, Ilha de São Miguel
  (Açores) — "natural desta freguesia" (PAR-0015); português (açoriano). [PROVEN]

  - **Ocupação:** proprietário em Mãe de Deus. [PROVEN via PAR-0015]

  - **Cônjuge:** Maria Jacintha de Medeiros (P-0049; família F-0023), também da freguesia;
  casaram-se em 7 de outubro de 1819, em N.S. Mãe de Deus (PAR-0037). [PROVEN]

  - **Filho:** Manoel Muniz Bytancourt (P-0042), por meio de quem é o avô paterno do
  imigrante João Muniz Bittencourt (P-0019). [PROVEN]

  - **Nascimento e óbito:** não documentados. Fontes secundárias fazem circular "n. 1806, f.
  1876", mas são apenas pistas e não são afirmadas — um homem nascido em 1806 não poderia ser
  pai de um filho nascido por volta de 1820; PAR-0015 estabelece apenas sua existência, sua
  condição de proprietário e a origem em Povoação. [LEAD]

  ## Posição social e profissão

  - **Proprietário** [PROVEN] — assim nomeado no assento de óbito de 1866 de seu filho
  Manoel, que o descreve como "João Muniz Bytancourt, proprietario", *natural desta
  freguesia* (PAR-0015). O mesmo ato registra o filho também como *proprietário*, de modo
  que a família viveu de terra própria em Mãe de Deus ao longo de duas gerações
  documentadas.

  - **Nenhum cargo, título ou tratamento honorífico** [PROVEN na ausência] — em nenhum dos
  atos que o nomeiam recebe patente ou *Dom*, em registros que chamam de *Capitão* uma
  testemunha de casamento e de *Reverendo* o clero sem hesitação (PAR-0037, PAR-0048). A
  omissão é constante em todos os atos e fica aqui registrada como deliberada, não como
  lacuna.

  - **Alfabetização não registrada** [OPEN] — os formulários de casamento e de batismo da
  Povoação fazem assinar o celebrante e as testemunhas, não os nubentes ou os pais, de modo
  que nenhuma assinatura sua sobrevive nas imagens que temos.

  ## Família e rede social

  Pai de Manoel (P-0042) e marido de Maria Jacintha de Medeiros (P-0049) — um casal de Mãe de
  Deus documentado como os avós paternos no batismo de 1845 dos filhos de Manoel (PAR-0022) e
  nomeado no óbito de 1866 de Manoel (PAR-0015). Um outro filho, Agostinho (n. 13 de abril de
  1843, bat. 23 de abril de 1843), está documentado por seu próprio batismo de 1843 em Mãe de
  Deus (PAR-0044), que, de modo único, nomeia ambos os casais de avós e assim corrobora
  independentemente a filiação deste casal. Os passaportes de emigração de 1880 de Ponta
  Delgada de seus netos os descrevem como "filho de João Moniz Bettencourt e Maria Jacinta" —
  uma corroboração secundária mantida apenas como pista. [LEAD]

  ## O que podemos extrapolar

  *João Sr é onde começa a aritmética composta: o primeiro de duas gerações documentadas
  consecutivas a dividir em oito uma mesma propriedade da Povoação.*

  **1. Sua posição era terra herdada, e da menor espécie herdável [PROVEN / INFERRED].** O
  óbito de 1866 de seu filho o nomeia *proprietário* e nomeia o filho, por sua vez,
  *proprietário* (PAR-0015) — duas gerações vivendo de chão próprio em Mãe de Deus.
  **[CONTEXTUAL]** Terra é capital herdável, ao contrário de cargo ou de ofício; mas em São
  Miguel era escassa, e o *morgadio* — abolido em Portugal apenas em 1863 — passava as
  propriedades quase íntegras aos primogênitos e excluía os demais. Possuir alguma punha a
  família um degrau acima dos sem-terra; não a punha em parte alguma perto de uma elite
  insular, e os registros confirmam a leitura: em todos os atos que temos desta família
  nenhum membro recebe tratamento honorífico, em livros que chamam de *Capitão* uma
  testemunha de casamento sem hesitação (PAR-0048).

  **2. Ele é a primeira partilha em oito documentada — e seu filho a repete [PROVEN /
  INFERRED].** Pelo menos oito filhos seus estão documentados por nome ou ato: Manoel (1822,
  PAR-0051), um filho sem nome legível (1831, PAR-0038), Michaelina (1833), Rosa (1834),
  Damaso (1836), Francisco (1839), José (1841) e Agostinho (1843) (PAR-0039 a PAR-0044). Seu
  filho Manoel morreu depois intestado, em 1866, deixando oito filhos vivos próprios
  (PAR-0015). **[INFERRED]** A sucessão partilhável aplicada duas vezes seguidas reduz uma
  única propriedade a algo da ordem de um sessenta e quatro avos por herdeiro. Essa
  composição, e não qualquer infortúnio isolado, é o mecanismo que esvaziou a base fundiária
  da família e mandou a terceira geração ao Brasil.

  **3. Seu compadrio é o autorretrato social mais claro da família [PROVEN no padrão /
  INFERRED na leitura].** Em seis batismos consecutivos entre 1831 e 1841, os padrinhos
  foram o mesmo casal — **Manoel José da Costa e sua mulher Victoria de Medeiros**
  (PAR-0038, PAR-0039, PAR-0040, PAR-0041, PAR-0042, PAR-0043). **[CONTEXTUAL]** O
  apadrinhamento batismal no Atlântico português era a via padrão pela qual uma casa se
  atava a um patrono. **[INFERRED]** Ele o usou, em vez disso, para aprofundar um único laço
  horizontal com um casal de vizinhos, vez após vez. Não há capitão, sacerdote ou morgado
  algum na lista de padrinhos de seus filhos; uma família que nunca alcança para cima pelo
  apadrinhamento costuma ser uma família sem ninguém acima a quem alcançar.

  **4. O círculo à sua volta era analfabeto, e provavelmente ele também [PROVEN quanto ao
  círculo / INFERRED quanto ao homem].** Nada registra sua própria alfabetização — a fórmula
  da Povoação faz assinar o celebrante e as testemunhas, não os nubentes. Mas as testemunhas
  que ele e sua família escolheram assinavam de cruz: Antonio de Medeiros Brandão
  (testemunha de seu próprio casamento de 1819) assina de cruz no batismo de 1833 de sua
  filha Michaelina, assim como Manoel Cabral (1831) e Bento Pacheco (1834) (PAR-0037,
  PAR-0038, PAR-0039, PAR-0040). **[CONTEXTUAL]** A instrução nos Açores oitocentistas era
  privilégio comprado, sem oferta pública numa freguesia rural, recomprado a cada geração.
  Esta família nunca a comprou; a primeira assinatura documentada da linhagem pertence a seu
  bisneto, no Brasil, em 1890 (CIV-0041).

  **5. O que ele transmitiu foi pertencimento, e isso não viajou [INFERRED].** Ele e a
  mulher são registrados *naturaes e freguezes desta Parochial* — nascidos, casados, criando
  filhos e morrendo dentro de uma só freguesia (PAR-0037, PAR-0015). **[INFERRED]** Ser uma
  casa nativa e com terras da freguesia-sede trazia uma respeitabilidade local que nada
  custava e era real. Era também completamente intransportável: é exatamente o que seu
  bisneto João (P-0019) teve de reconstruir do zero no Brasil, casando-se com a casa dos
  Rego Brandão. O que este homem tinha de graça é o que a travessia atlântica custou à
  linhagem duas gerações abaixo.

  ## Questões em aberto

  - Seu próprio batismo e óbito (Mãe de Deus) — fixariam suas datas; seu casamento de 1819 e
  seus pais estão agora documentados (PAR-0037). Os livros de batismo anteriores a 1818 não
  estão digitalizados online. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0037 (seu próprio casamento de 7 de outubro de 1819 em Mãe de Deus — nomeia-o "João
  Francisco Muniz Bitancourt" e a seus pais) · PAR-0015 (o óbito de 1866 em Povoação de seu
  filho Manoel — nomeia-o proprietário, "natural desta freguesia") · PAR-0022 (o batismo de
  1845 dos filhos de Manoel — avós paternos) · PAR-0044 (o batismo de 1843 de seu filho
  Agostinho — nomeia-o como pai e ambos os casais de avós).

  ## Contexto regional e migratório

  A ponta de origem, em São Miguel, do tronco Muniz Byttancourt — um nativo com bens da
  freguesia-sede de Povoação, sem mudança documentada. [CONTEXTUAL] A travessia atlântica
  está duas gerações abaixo dele, quando seus netos partiram para o Brasil entre 1866 e 1882
  (mais plausivelmente por volta de 1880; ver P-0019).

  ## Onde ir hoje

