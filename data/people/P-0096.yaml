profile: >-
  ## Interesting facts

  - **[PROVEN]** He is known from exactly one document, and it is a Brazilian one: his son
  Jacob's 1825 Nova Friburgo marriage register, which names the groom "filho legitimo de João
  Bohrer e da sua mulher Barbara Probst" (PAR-0059). A Swiss father entered in a colonial
  parish book six years after the colony was founded, by a priest who never met him.

  - **[PROVEN / CORRECTION 2026-09-23]** The parish that record gives — "Erswill" — was long
  read as Erschwil. It is **Beinwil**, another Canton Solothurn parish. The Staatsarchiv
  Solothurn (archivist Gasche Erich, correspondence C-011) searched the Erschwil Catholic
  holdings in full and found no baptism for this Borer family: a bounded negative. Erschwil is
  therefore closed, and Beinwil is the unsearched target.

  - **[INFERRED]** He did not emigrate. A "João Probst" — a probable kinsman of his wife —
  appears as a witness at the same 1825 wedding, so the Probst side had people in the colony
  while the Borer parents did not.

  - **[CONTEXTUAL]** The Solothurn Jura his generation stayed in was poor, Catholic,
  German-speaking upland where holdings were divided among heirs until there was too little
  arable land for too many people. That structural land hunger, sharpened by the 1816 "Year
  Without a Summer" famine, is why Dom João VI's recruiters found takers there — and it is
  what his son left.

  ## Identity

  **João Borer** (as the Portuguese-language register writes him; "João Bohrer" in the same
  act). A Swiss man of the Canton of Solothurn, known solely as the father of the Nova
  Friburgo immigrant Jacob Bohrer (P-0050). [PROVEN]

  - **Identification:** named in his son Jacob's 1825 Nova Friburgo marriage as the husband of
  Barbara Probst and father of the groom, "filho legitimo de João Bohrer e da sua mulher
  Barbara Probst … naturaes e baptizado na freg.a de Erswill … do Cantão de Soleure" [PROVEN —
  PAR-0059].

  - **Home parish:** **Beinwil**, Canton Solothurn — the register's "Erswill" read through the
  2026-09-23 archival correction (C-011), which closed Erschwil as a bounded negative. The
  Beinwil registers themselves are unsearched, so nothing beyond the canton is yet at primary
  level. [PROVEN for the canton; the Beinwil resolution rests on that correction, not on a
  held Beinwil record]

  - **Birth, marriage, death, own parents:** none held. [OPEN] A Nova Friburgo colonist
  compilation reports that both he and Barbara Probst were already dead in Switzerland before
  the 1819 departure [LEAD] — which would mean his son emigrated an orphan.

  ## Standing and profession

  Nothing is documented: no occupation, property, office, title or literacy appears in the one
  record that names him. The only social fact the act carries is that his son's marriage was
  recorded as legitimate, so the couple's own marriage was a church marriage. [PROVEN for the
  legitimacy; everything else OPEN]

  ## Family and social network

  - **Wife:** Barbara Probst (P-0097); family F-0047. They are the deepest generation reached
  on this branch, attested together in a single primary record. [PROVEN — PAR-0059]

  - **Son:** Jacob Bohrer (P-0050), who emigrated to Nova Friburgo in the 1819 Swiss wave and
  married Catharina Moser there in 1825. No other children are known.

  - **The Probst connection crossed and the Borer one did not:** a "João Probst" stood as a
  witness at Jacob's 1825 wedding — probably a kinsman on Barbara's side — while no Borer of
  the parental generation appears anywhere in the colony records. [PROVEN that a Probst
  witnessed; the exact relationship OPEN]

  ## What we can extrapolate

  - **A household with nothing to transmit, in a system built to divide [CONTEXTUAL /
  INFERRED].** Nothing in the record gives him land, office or rank, and the Solothurn Jura of
  his generation divided what holdings there were among all heirs. A Beinwil or Erschwil
  smallholding split that way leaves a son with a share too small to live on and nothing
  portable — which is the precondition, not the consequence, of emigration. Whatever his
  household was worth, it stayed in Switzerland and reached his son as nothing.

  - **His son left with no inheritance and no parents [INFERRED; LEAD for the deaths].** If
  the compilation is right that both parents had died before 1819, Jacob boarded as an
  unattached young man — the lowest position inside the recruitment, with no family group to
  pool labour or absorb a loss. That reading is consistent with the colony record, in which
  the Borer parental generation is simply absent while his wife's Probst relatives are
  present.

  - **He marks the branch point, not the movement [INFERRED].** João is the last Borer of this
  line to live and die entirely in Switzerland. Everything the family's later trajectory turns
  on — the colony lot, the Brazilian partible division of it, the shift from land to town
  trade and letters — happens on the far side of him. His significance is that he is the floor
  the arc is measured from: a Catholic Jura smallholding household, never elite, with no
  fortune for his descendants to lose.

  ## Open questions

  - **The Beinwil parish registers** (Kantonsarchiv / Staatsarchiv Solothurn) — his marriage
  to Barbara Probst, his son Jacob's baptism, and his own baptism and burial. This is the
  single open action for the whole Erschwil/Beinwil couple. **Do not re-search Erschwil**:
  closed bounded negative, C-011, 2026-09-23. [OPEN]

  - **His and Barbara's deaths** — a Beinwil burial register would test the compilation's
  claim that both died before the 1819 emigration. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of his son Jacob Bohrer — names João Borer and
  Barbara Probst as Jacob's legitimate parents, of the Cantão de Soleure, parish written
  "Erswill" and now read as Beinwil).

  ## Regional and migration context

  He belongs to the Catholic, German-speaking Solothurn Jura — the Schwarzbubenland of the
  Thierstein district and its neighbouring parishes — poor upland farming country whose
  smallholdings were divided among heirs generation after generation. [CONTEXTUAL] The 1815
  Tambora eruption and the 1816 "Year Without a Summer" famine fell on a region already
  impoverished by the Napoleonic wars, and Dom João VI's *Decreto de 16 de maio de 1818*
  offered a passage and a land grant at Nova Friburgo to 100 Swiss **Catholic** families.
  Recruitment overshot to some 261–265 families, about a quarter of whom died at sea. João
  stayed; his son went. [CONTEXTUAL]

  ## Where to go today

  - **Home parish (all records unsearched):** the Catholic parish of **Beinwil (SO), Canton
  Solothurn, Switzerland** — the corrected target after the Erschwil bounded negative. [OPEN]
  · [Maps](https://maps.google.com/?q=Beinwil+SO+Switzerland)

  - **Where he is named:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — the parish whose 1825
  marriage book records him [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Conhece-se dele exatamente um documento, e é brasileiro: o registro de
  casamento de seu filho Jacob, em Nova Friburgo, em 1825, que nomeia o noivo "filho legitimo
  de João Bohrer e da sua mulher Barbara Probst" (PAR-0059). Um pai suíço lançado num livro
  paroquial colonial seis anos após a fundação da colônia, por um padre que nunca o conheceu.

  - **[PROVEN / CORREÇÃO 2026-09-23]** A freguesia que esse registro dá — "Erswill" — foi por
  muito tempo lida como Erschwil. É **Beinwil**, outra freguesia do Cantão de Solothurn. O
  Staatsarchiv Solothurn (arquivista Gasche Erich, correspondência C-011) buscou integralmente
  no acervo católico de Erschwil e não encontrou batismo desta família Borer: negativa
  delimitada. Erschwil está, portanto, encerrada, e Beinwil é o alvo ainda não buscado.

  - **[INFERRED]** Ele não emigrou. Um "João Probst" — provável parente da esposa — figura
  como testemunha no mesmo casamento de 1825, de modo que o lado Probst tinha gente na
  colônia, e os pais Borer, não.

  - **[CONTEXTUAL]** O Jura de Solothurn em que sua geração permaneceu era planalto pobre,
  católico e germanófono, onde as posses eram divididas entre herdeiros até restar pouca terra
  arável para gente demais. Essa fome estrutural de terra, agravada pela fome do "Ano Sem
  Verão" de 1816, é a razão pela qual os recrutadores de Dom João VI encontraram interessados
  ali — e é o que seu filho deixou para trás.

  ## Identidade

  **João Borer** (como o registro em português o grafa; "João Bohrer" no mesmo ato). Homem
  suíço do Cantão de Soleure (Solothurn), conhecido exclusivamente como pai do imigrante de
  Nova Friburgo Jacob Bohrer (P-0050). [PROVEN]

  - **Identificação:** nomeado no casamento de 1825 de seu filho Jacob, em Nova Friburgo, como
  marido de Barbara Probst e pai do noivo, "filho legitimo de João Bohrer e da sua mulher
  Barbara Probst … naturaes e baptizado na freg.a de Erswill … do Cantão de Soleure" [PROVEN —
  PAR-0059].

  - **Freguesia de origem:** **Beinwil**, Cantão de Solothurn — o "Erswill" do registro lido à
  luz da correção arquivística de 2026-09-23 (C-011), que encerrou Erschwil como negativa
  delimitada. Os próprios livros de Beinwil não foram buscados, de modo que nada além do
  cantão está ainda em nível primário. [PROVEN quanto ao cantão; a resolução Beinwil apoia-se
  nessa correção, não em registro de Beinwil retido]

  - **Nascimento, casamento, óbito, pais:** nenhum disponível. [OPEN] Uma compilação de
  colonos de Nova Friburgo relata que tanto ele quanto Barbara Probst já estavam mortos na
  Suíça antes da partida de 1819 [LEAD] — o que significaria que o filho emigrou órfão.

  ## Posição social e profissão

  Nada está documentado: nenhuma ocupação, propriedade, cargo, título ou alfabetização aparece
  no único registro que o nomeia. O único fato social que o ato carrega é que o casamento do
  filho foi lançado como legítimo, logo o casamento do próprio casal foi um casamento
  religioso. [PROVEN quanto à legitimidade; todo o resto OPEN]

  ## Família e rede social

  - **Esposa:** Barbara Probst (P-0097); família F-0047. São a geração mais profunda alcançada
  neste ramo, atestados juntos num único registro primário. [PROVEN — PAR-0059]

  - **Filho:** Jacob Bohrer (P-0050), que emigrou para Nova Friburgo na leva suíça de 1819 e
  ali se casou com Catharina Moser em 1825. Nenhum outro filho é conhecido.

  - **A ligação Probst atravessou o Atlântico, a Borer não:** um "João Probst" foi testemunha
  no casamento de Jacob em 1825 — provável parente do lado de Barbara —, ao passo que nenhum
  Borer da geração dos pais aparece em qualquer registro da colônia. [PROVEN que um Probst
  testemunhou; a relação exata OPEN]

  ## O que podemos extrapolar

  - **Um domicílio sem nada a transmitir, dentro de um sistema feito para dividir [CONTEXTUAL
  / INFERRED].** Nada no registro lhe dá terra, cargo ou patente, e o Jura de Solothurn de sua
  geração dividia entre todos os herdeiros as posses existentes. Um minifúndio de Beinwil ou
  Erschwil assim repartido deixa a um filho um quinhão pequeno demais para viver e nada
  portátil — o que é a precondição da emigração, não a sua consequência. Fosse quanto fosse o
  valor do domicílio, ficou na Suíça e chegou ao filho como nada.

  - **O filho partiu sem herança e sem pais [INFERRED; LEAD quanto às mortes].** Se a
  compilação estiver certa quanto à morte de ambos os pais antes de 1819, Jacob embarcou como
  jovem desacompanhado — a posição mais baixa dentro do recrutamento, sem grupo familiar para
  juntar trabalho ou absorver uma perda. Essa leitura é coerente com o registro colonial, em
  que a geração parental Borer simplesmente não aparece, enquanto os parentes Probst da esposa
  aparecem.

  - **Ele marca o ponto de ramificação, não o movimento [INFERRED].** João é o último Borer
  desta linha a viver e morrer inteiramente na Suíça. Tudo em que a trajetória posterior da
  família se decide — o lote colonial, a divisão partível brasileira dele, a passagem da terra
  ao comércio e às letras da vila — acontece do outro lado dele. Sua importância é ser o piso
  a partir do qual se mede o arco: um domicílio de pequenos lavradores católicos do Jura,
  nunca de elite, sem fortuna alguma que seus descendentes pudessem perder.

  ## Questões em aberto

  - **Os livros paroquiais de Beinwil** (Kantonsarchiv / Staatsarchiv Solothurn) — seu
  casamento com Barbara Probst, o batismo do filho Jacob e seu próprio batismo e sepultamento.
  É a única ação em aberto para todo o casal. **Não rebuscar Erschwil**: negativa delimitada
  encerrada, C-011, 2026-09-23. [OPEN]

  - **Os óbitos dele e de Barbara** — um livro de sepultamentos de Beinwil testaria a alegação
  da compilação de que ambos morreram antes da emigração de 1819. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, do filho Jacob Bohrer — nomeia João Borer e
  Barbara Probst como pais legítimos de Jacob, do Cantão de Soleure, freguesia grafada
  "Erswill" e hoje lida como Beinwil).

  ## Contexto regional e migratório

  Pertence ao Jura católico e germanófono de Solothurn — o Schwarzbubenland do distrito de
  Thierstein e as freguesias vizinhas —, terra pobre de lavoura de planalto cujos minifúndios
  eram divididos entre herdeiros geração após geração. [CONTEXTUAL] A erupção do Tambora em
  1815 e a fome do "Ano Sem Verão" de 1816 caíram sobre uma região já empobrecida pelas
  guerras napoleônicas, e o *Decreto de 16 de maio de 1818* de Dom João VI ofereceu passagem e
  concessão de terra em Nova Friburgo a 100 famílias suíças **católicas**. O recrutamento
  excedeu para cerca de 261–265 famílias, das quais cerca de um quarto morreu no mar. João
  ficou; o filho foi. [CONTEXTUAL]

  ## Onde ir hoje

  - **Freguesia de origem (todos os registros por buscar):** a paróquia católica de **Beinwil
  (SO), Cantão de Solothurn, Suíça** — o alvo corrigido após a negativa delimitada de
  Erschwil. [OPEN] · [Maps](https://maps.google.com/?q=Beinwil+SO+Switzerland)

  - **Onde ele é nomeado:** Catedral Diocesana / Igreja Matriz de São João Batista, Rua
  Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ — a paróquia cujo livro de
  casamentos de 1825 o registra [RESOLVED] ·
  [Maps](https://maps.google.com/?q=-22.28159,-42.53085)
