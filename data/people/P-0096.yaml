profile: >-
  ## Interesting facts

  - **[PROVEN]** Named "João Bohrer" of Erschwil, Canton Solothurn, in his son Jacob's 1825 Nova Friburgo marriage register (PAR-0059) — a Swiss father documented in a Brazilian colonial church six years after the colony's founding, known from a single entry.

  - **[CONTEXTUAL]** He stayed in Switzerland while his son Jacob emigrated in the 1818–1820 Swiss recruitment wave organised by Dom João VI — the standard pattern of a surviving parent recorded in the colony through an emigrant child's marriage, placed by a Brazilian clerk in a Brazilian parish book.

  - **[INFERRED]** The Probst surname of his wife (Barbara Probst) and the appearance of a "João Probst" as a marriage witness in the same 1825 Nova Friburgo register suggest both families had community connections — possibly arriving in the same wave from Erschwil/Solothurn or maintaining contact through the tightly-networked Swiss settler community.

  - **[CONTEXTUAL]** Erschwil in Canton Solothurn was exactly the milieu Dom João VI's recruiters targeted: a poor, Catholic, land-constrained farming community in the Schwarzbubenland (Thierstein Jura), where surplus sons had no inheritance to wait for and the colonial offer of land grants was a genuine alternative.

  ## Identity

  **João Borer** — a Swiss man of Erschwil, Canton Solothurn, known solely as the father of
  the Nova Friburgo immigrant Jacob Bohrer (P-0050). [PROVEN]

  - **Identification:** named in his son Jacob's 1825 Nova Friburgo marriage register as "João
  Bohrer," husband of Barbara Probst, with Jacob described as "naturaes e baptizado na freg.a de
  Erswill [Erschwil]" and "filho legitimo" of both parents (PAR-0059). [PROVEN]

  ## Family

  He and Barbara Probst (P-0097; family F-0047) are the deepest reached generation on the Bohrer
  maternal line, attested together in a single primary record — their son's 1825 Nova Friburgo
  marriage. [PROVEN — PAR-0059] His subsequent life and death are undocumented; he presumably
  remained in Switzerland. [INFERRED/CONTEXTUAL]

  ## Open questions

  - Birth, marriage and death dates; his own parentage — all unreached. The Erschwil Catholic
  parish registers (Thierstein district; FS catalog 544541, freely accessible online) are the
  primary target. [OPEN]

  ## Sources held (this repository)

  - PAR-0059 (1825 Nova Friburgo marriage of son Jacob Bohrer — names João Borer and Barbara
  Probst as Jacob's legitimate parents of Erschwil, Canton Solothurn).
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Nomeado "João Bohrer" de Erschwil, Cantão de Soleure (Solothurn), no registro de casamento de Nova Friburgo de 1825 de seu filho Jacob (PAR-0059) — um pai suíço documentado em uma igreja colonial brasileira seis anos após a fundação da colônia, conhecido por um único assento.

  - **[CONTEXTUAL]** Permaneceu na Suíça enquanto seu filho Jacob emigrou na onda de recrutamento suíço de 1818–1820 organizada por Dom João VI — o padrão típico de um pai sobrevivente registrado na colônia pelo casamento de um filho emigrante, colocado por um escrivão brasileiro em um livro paroquial brasileiro.

  - **[INFERRED]** O sobrenome Probst de sua esposa (Barbara Probst) e o aparecimento de um "João Probst" como testemunha no mesmo registro de casamento de Nova Friburgo de 1825 sugerem que as duas famílias tinham conexões comunitárias — possivelmente chegando na mesma onda de Erschwil/Solothurn ou mantendo contato por meio da comunidade suíça assentada.

  - **[CONTEXTUAL]** Erschwil no Cantão de Solothurn era exatamente o meio que os recrutadores de Dom João VI visavam: uma comunidade agrícola pobre, católica e restrita em terra no Schwarzbubenland (Jura de Thierstein), onde filhos excedentes não tinham herança a esperar e a oferta colonial de concessões de terra era uma alternativa real.

  ## Identidade

  **João Borer** — homem suíço de Erschwil, Cantão de Soleure (Solothurn), conhecido
  exclusivamente como pai do imigrante de Nova Friburgo Jacob Bohrer (P-0050). [PROVEN]

  - **Identificação:** nomeado no registro de casamento de 1825 de seu filho Jacob, em Nova
  Friburgo, como "João Bohrer," marido de Barbara Probst, com Jacob descrito como "naturaes e
  baptizado na freg.a de Erswill [Erschwil]" e "filho legitimo" de ambos os pais (PAR-0059).
  [PROVEN]

  ## Família

  Ele e Barbara Probst (P-0097; família F-0047) são a geração mais profunda alcançada na linha
  materna Bohrer, atestados juntos em um único registro primário — o casamento de 1825 de seu filho
  em Nova Friburgo. [PROVEN — PAR-0059] Sua vida posterior e falecimento são indocumentados;
  presumivelmente permaneceu na Suíça. [INFERRED/CONTEXTUAL]

  ## Questões em aberto

  - Datas de nascimento, casamento e falecimento; própria filiação — todas não alcançadas. Os
  registros paroquiais católicos de Erschwil (distrito de Thierstein; catálogo FS 544541,
  livremente acessível online) são o principal alvo de pesquisa. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0059 (casamento de 1825, em Nova Friburgo, do filho Jacob Bohrer — nomeia João Borer e
  Barbara Probst como pais legítimos de Jacob, de Erschwil, Cantão de Soleure).
