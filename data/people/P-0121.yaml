profile: >-
  ## Interesting facts

  - **[PROVEN]** Recorded as "Tiago Storck" in his daughter's 1840 Nova Friburgo marriage — the Portuguese "Tiago" being the standard rendering of the German/Latin "Jacobus/Jacob," settling the earlier archival uncertainty between "Jacob" and "Joannes Jacobus Storck" in favour of Jacob. (PAR-0076)

  - **[CONTEXTUAL]** His daughter was "nascida e baptizada na Allemanha" — consistent with a secondary source placing the Storck household aboard the ship *Caroline*, arriving in Nova Friburgo on 3 May 1824 from Blödesheim, Osthofen, Hessen-Darmstadt. If accurate, Jacob Storck arrived with the German immigration wave that supplemented the Swiss founders.

  - **[INFERRED]** Not described as deceased in his daughter's 1840 marriage act, he was apparently still alive at that date — meaning he may have lived into his 60s or 70s in the colony, surviving long enough to see his daughter married to a Swiss colonist from Canton Fribourg.

  - **[CONTEXTUAL]** As the patriarch of a German Hessian family in a colony named for Swiss Canton Fribourg, his household exemplifies the mixed Swiss-German character of Nova Friburgo: from 1824 onward, "Swiss" and "German" settlers lived side by side in the same land-grant system and eventually intermarried.

  ## Identity

  **Jacob Storck** — recorded as "Tiago Storck" (Tiago = Jacobus/Jacob), the father of
  Elisabeth/Isabel Storck (P-0110); named in his daughter's 1840 Nova Friburgo marriage (PAR-0076,
  family F-0061). [STRONG-EVIDENCE] This settles the earlier "Jacob vs Joannes Jacobus Storck"
  question in favour of Jacob. A direct ancestor of Iris Bohrer Muniz (P-0007) five generations up
  (a 3×-great-grandfather), via Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda
  (P-0031) → Celina (P-0015).

  His daughter was "nascida e baptizada na Allemanha" (Germany), so the family is German; his own
  birthplace is not separately stated, so his nationality is left unset. [CONTEXTUAL]

  ## Open questions

  - His own birth, death and origin records — no held primary. [OPEN]

  ## Sources held (this repository)

  - PAR-0076 (his daughter Elisabeth's 1840 Nova Friburgo marriage — the sole held record naming
  him, as "Tiago Storck").
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Registrado como "Tiago Storck" no casamento de sua filha em 1840 em Nova Friburgo — o português "Tiago" sendo a transcrição padrão do alemão/latim "Jacobus/Jacob," resolvendo a incerteza arquivística anterior entre "Jacob" e "Joannes Jacobus Storck" em favor de Jacob. (PAR-0076)

  - **[CONTEXTUAL]** Sua filha foi "nascida e baptizada na Allemanha" — compatível com uma fonte secundária que situa a família Storck no navio *Caroline*, chegando a Nova Friburgo em 3 de maio de 1824 a partir de Blödesheim, Osthofen, Hessen-Darmstadt. Se correto, Jacob Storck chegou com a leva de imigração alemã que complementou os fundadores suíços.

  - **[INFERRED]** Não é descrito como falecido no assento de casamento da filha em 1840, sugerindo que ainda estava vivo àquela data — o que significa que pode ter vivido até os sessenta ou setenta anos na colônia, sobrevivendo o suficiente para ver sua filha se casar com um colono suíço do Cantão de Friburgo.

  - **[CONTEXTUAL]** Como patriarca de uma família alemã de Hessen numa colônia cujo nome homenageia o Cantão suíço de Friburgo, seu grupo familiar exemplifica o caráter misto suíço-alemão de Nova Friburgo: a partir de 1824, colonos "suíços" e "alemães" viveram lado a lado no mesmo sistema de concessão de terras e eventualmente se intercruzaram pelo casamento.

  ## Identidade

  **Jacob Storck** — registrado como "Tiago Storck" (Tiago = Jacobus/Jacob), pai de
  Elisabeth/Isabel Storck (P-0110); nomeado no casamento de 1840 da filha em Nova Friburgo
  (PAR-0076, família F-0061). [STRONG-EVIDENCE] Isso resolve a antiga dúvida "Jacob vs Joannes
  Jacobus Storck" em favor de Jacob. Um ancestral direto de Iris Bohrer Muniz (P-0007) cinco
  gerações acima (3×-bisavô), por Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda
  (P-0031) → Celina (P-0015).

  A filha foi "nascida e baptizada na Allemanha" (Alemanha), portanto a família é alemã; o próprio
  local de nascimento dele não é declarado, de modo que sua nacionalidade fica em branco.
  [CONTEXTUAL]

