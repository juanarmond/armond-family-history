  Elisabeth/Isabel Storck (P-0110); named in his daughter's 1840 Nova Friburgo marriage (PAR-0076,
  family F-0061). [STRONG-EVIDENCE] This settles the earlier "Jacob vs Joannes Jacobus Storck"
  question in favour of Jacob. A direct ancestor of Iris Bohrer Muniz (P-0007) five generations up
  (a 3×-great-grandfather), via Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda
  (P-0031) → Celina (P-0015).

  His daughter was "nascida e baptizada na Allemanha" (Germany), so the family is German; his own
  birthplace is not separately stated, so his nationality is left unset. [CONTEXTUAL]

