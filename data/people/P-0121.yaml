    Father of Elisabeth/Isabel Storck (P-0110); named "Tiago Storck" (Tiago = Jacobus/Jacob) in his daughter's 1840 Nova Friburgo marriage (PAR-0076), family F-0061. This settles the earlier "Jacob vs Joannes Jacobus Storck" question in favour of Jacob. The daughter was "nascida e baptizada na Allemanha" (Germany), so the family is German; his own birthplace is not separately stated, so nationality is left unset. Not marked deceased in 1840; clearly deceased now.
profile: >-
  ## Interesting facts

  - **[PROVEN]** One word in his daughter's 1840 marriage act settled a long-standing identity
  question. The register calls him "**Tiago Storck**", and "Tiago" is the standard Portuguese
  rendering of Jacobus/Jacob — which fixes his name as Jacob and reconciles it with the expanded
  "Joannes Jacobus Storck" circulating in collaborative trees. (PAR-0076)

  - **[PROVEN]** He was apparently alive when his daughter married in June 1840: the clerk
  marked his wife "já fallecida" and gave him no such qualifier. He outlived her, and gave a
  daughter in marriage as a widower.

  - **[PROVEN]** The same act states his daughter was "nascida e baptizada na **Allemanha**" —
  Germany, at country level and no further. That is the only origin any held record gives this
  family, and it is real evidence, not an inference from the surname Storck.

  - **[LEAD]** A secondary transcription of the Nova Friburgo colony records places the Storck
  household on the ship *Caroline*, arriving on 3 May 1824 and assigned Casa 72 / Lote 78, from
  Blödesheim (Osthofen) in Hessen-Darmstadt — and shows Jacob himself as the household head, not
  merely as the father of an emigrant. If confirmed, he emigrated in person.

  ## Identity

  **Jacob Storck**, recorded as **"Tiago Storck"** — the father of Elisabeth (Isabel) Storck
  (P-0110), named once, in his daughter's 1840 Nova Friburgo marriage act. Iris Bohrer Muniz's
  (P-0007) 3×-great-grandfather, by the chain Elisabeth Storck → Maria Joanna Rutschmann
  (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer (P-0015). [PROVEN that he is
  named; degree derived from the family links]

  - **Named in one record:** PAR-0076, 23 June 1840, as the father of the bride and husband of
  "Anna Clara já fallecida"; family F-0061. [PROVEN]

  - **Name:** Jacob, via the Portuguese "Tiago" (= Jacobus). This settles the earlier "Jacob vs
  Joannes Jacobus" question in favour of Jacob; the collaborative tree's "Joannes Jacobus
  Storck, b. 1773, d. 1852" is an expanded Latinised form of the same name, and its dates remain
  unconfirmed. [PROVEN for the name; the dates are a LEAD]

  - **Apparently living:** 23 June 1840. Clearly deceased now. [INFERRED from PAR-0076]

  - **Origin and nationality:** his own birthplace is not stated. His daughter's is given as
  Germany, so the family is German; nationality is nonetheless left unset for him personally.
  [OPEN by decision]

  ## Standing and profession

  Nothing is recorded. The act gives him no occupation, property, residence or signature — only
  a name, a dead wife and a daughter. The reported colony grant of Casa 72 / Lote 78 would, if
  confirmed, make him a grant-holding colonist; it is not in any held record.

  ## Family and social network

  His documented family is one couple and one daughter: Jacob Storck and Anna Clara (P-0122),
  who was dead by June 1840, and their daughter Elisabeth, who married the Swiss immigrant João
  José Rutschmann at the Matriz de São João Baptista, Nova Friburgo, on 23 June 1840 before the
  coadjutor João José Vivianno, with João Balmat and Maria Fabre as witnesses. [PROVEN —
  PAR-0076]

  That marriage is worth noting for what it crosses: a German-born daughter married to a man
  born at Bulle in Switzerland, in the Catholic parish church rather than the German Lutheran
  congregation founded by the 1824 arrivals. The record does not explain the choice.

  ## What we can extrapolate

  - **[CONTEXTUAL]** The German families at Nova Friburgo came in a separate, later scheme.
  After Brazilian independence the agent Georg Anton Schäffer recruited in the German states,
  and some eighty families arrived on 3–4 May 1824 — five years after the Swiss founding cohort,
  out of a Rhineland and Hessen countryside impoverished by the Napoleonic wars, the failed
  harvests of 1816–17 and the fragmentation of smallholdings.

  - **[INFERRED]** A daughter born in Germany and marrying at Nova Friburgo in 1840 puts the
  family's arrival somewhere between her birth and that date, and the 1824 intake is the obvious
  candidate. That is arithmetic plus cohort history — good reasoning, not a documented arrival.

  - **[CONTEXTUAL / INFERRED]** If the *Caroline* transcription is right and he was the
  household head, then he, rather than his daughter alone, made the decision to emigrate — which
  puts him among the adults who gambled on the colony and matters for reading the family's
  position. The distinction between "the emigrant" and "the father of an emigrant" is exactly
  the kind of thing that gets blurred in family trees, and the lead is what would resolve it
  here.

  ## Open questions

  - His own birth, marriage and death. The Evangelical register of Blödesheim (today Hochborn)
  would test the family's German origin and his daughter's 1812 baptism. [OPEN]

  - Whether the *Caroline* passage of 3 May 1824 and Casa 72 / Lote 78 are his, at primary
  level. [LEAD]

  - Whether the collaborative-tree dates of 1773–1852 for "Joannes Jacobus Storck" belong to
  this man. [LEAD]

  - His wife's maiden surname, which the 1840 act omits. [OPEN]

  - His nationality, left unset on purpose because no held record states where he was born.
  [OPEN by decision]

  ## Sources held (this repository)

  - **PAR-0076** — his daughter Elisabeth's 1840 Nova Friburgo marriage act to João José
  Rutschmann; the sole held record naming him, as "Tiago Storck", husband of the late Anna
  Clara.

  ## Regional and migration context

  Nova Friburgo was decreed a Swiss Catholic colony in May 1818 and settled from late 1819, but
  within six years it was a mixed town: the German families recruited by Schäffer arrived in May
  1824 and founded the Igreja Luterana, while the Catholic Matriz continued to serve the Swiss.
  [CONTEXTUAL] Both intakes received the same poor highland land, and both were pushed out of
  Europe by the same combination of harvest failure, post-Napoleonic poverty and land shortage.
  [CONTEXTUAL] Of this family, what a record establishes is narrow: a daughter born and baptised
  in Germany, resident in the parish of São João Baptista, married there in June 1840 with her
  father named and her mother dead. [PROVEN]

  ## Where to go today

  - **Evangelische Laurentiuskirche, Hochborn (historic Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Rheinhessen, Germany · [Maps](https://maps.google.com/?q=49.7239,8.2008). The
  reported Storck origin parish; the village was renamed Hochborn in 1971 and the church still
  stands. His daughter's baptism here would name both parents and confirm the whole lead.
  [APPROX — the Blödesheim origin is a LEAD]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Maps](https://maps.google.com/?q=-22.28159,-42.53085). Where his
  daughter married in June 1840, in the act that names him. The present cathedral dates from
  1869; the act belongs to the earlier church on the same site. [RESOLVED]

  - **Historic colony core, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval Barbosa
  Moreira, Centro · [Maps](https://maps.google.com/?q=-22.28035,-42.53284). Where the colony's
  house and lot numbers were laid out, including the reported Casa 72 / Lote 78 of the Storck
  household. [APPROX]
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Uma palavra no assento de casamento de sua filha, em 1840, resolveu uma velha
  questão de identidade. O registro o chama "**Tiago Storck**", e "Tiago" é a forma portuguesa
  corrente de Jacobus/Jacob — o que fixa seu nome como Jacob e o reconcilia com o "Joannes
  Jacobus Storck" expandido que circula em árvores colaborativas. (PAR-0076)

  - **[PROVEN]** Aparentemente estava vivo quando a filha se casou, em junho de 1840: o escrivão
  marcou a esposa como "já fallecida" e não lhe deu qualificador algum. Sobreviveu a ela e
  entregou uma filha em casamento como viúvo.

  - **[PROVEN]** O mesmo ato declara que a filha era "nascida e baptizada na **Allemanha**" —
  Alemanha, em nível de país e nada mais. É a única origem que algum documento retido dá a esta
  família, e é evidência real, não inferência a partir do sobrenome Storck.

  - **[LEAD]** Uma transcrição secundária dos registros da colônia de Nova Friburgo situa o
  domicílio Storck no navio *Caroline*, chegado em 3 de maio de 1824 e com a Casa 72 / Lote 78
  atribuída, vindo de Blödesheim (Osthofen), em Hessen-Darmstadt — e mostra o próprio Jacob como
  chefe do domicílio, não apenas como pai de uma emigrante. Se confirmado, ele emigrou em
  pessoa.

  ## Identidade

  **Jacob Storck**, registrado como **"Tiago Storck"** — pai de Elisabeth (Isabel) Storck
  (P-0110), nomeado uma única vez, no assento de casamento da filha, em 1840, em Nova Friburgo.
  Tetravô de Iris Bohrer Muniz (P-0007), pela cadeia Elisabeth Storck → Maria Joanna Rutschmann
  (P-0037) → Lucinda Ferreira da Silva (P-0031) → Celina Bohrer (P-0015). [PROVEN que é nomeado;
  grau derivado dos vínculos familiares]

  - **Nomeado em um registro:** PAR-0076, 23 de junho de 1840, como pai da noiva e marido de
  "Anna Clara já fallecida"; família F-0061. [PROVEN]

  - **Nome:** Jacob, pelo português "Tiago" (= Jacobus). Isso resolve a antiga questão "Jacob vs
  Joannes Jacobus" em favor de Jacob; o "Joannes Jacobus Storck, n. 1773, f. 1852" da árvore
  colaborativa é a forma latinizada expandida do mesmo nome, e suas datas continuam não
  confirmadas. [PROVEN quanto ao nome; as datas são LEAD]

  - **Aparentemente vivo:** em 23 de junho de 1840. Claramente falecido hoje. [INFERRED a partir
  de PAR-0076]

  - **Origem e nacionalidade:** seu próprio local de nascimento não é declarado. O da filha é
  dado como Alemanha, de modo que a família é alemã; ainda assim, a nacionalidade dele é deixada
  em aberto. [OPEN por decisão]

  ## Posição social e profissão

  Nada está registrado. O ato não lhe dá ocupação, propriedade, residência ou assinatura —
  apenas um nome, uma esposa morta e uma filha. A relatada concessão colonial da Casa 72 / Lote
  78 faria dele, se confirmada, um colono beneficiário de concessão; ela não consta de nenhum
  documento retido.

  ## Família e rede social

  Sua família documentada é um casal e uma filha: Jacob Storck e Anna Clara (P-0122), morta
  antes de junho de 1840, e a filha Elisabeth, que se casou com o imigrante suíço João José
  Rutschmann na Matriz de São João Baptista, em Nova Friburgo, em 23 de junho de 1840, perante o
  coadjutor João José Vivianno, tendo João Balmat e Maria Fabre como testemunhas. [PROVEN —
  PAR-0076]

  Esse casamento merece nota pelo que atravessa: uma filha nascida na Alemanha casada com um
  homem nascido em Bulle, na Suíça, na igreja paroquial católica, e não na congregação luterana
  alemã fundada pelos chegados de 1824. O registro não explica a escolha.

  ## O que podemos extrapolar

  - **[CONTEXTUAL]** As famílias alemãs de Nova Friburgo vieram por um programa distinto e
  posterior. Depois da independência do Brasil, o agente Georg Anton Schäffer recrutou nos
  estados alemães, e cerca de oitenta famílias chegaram em 3–4 de maio de 1824 — cinco anos após
  a coorte fundadora suíça, saídas de um campo renano e hessiano empobrecido pelas guerras
  napoleônicas, pelas colheitas perdidas de 1816–17 e pela fragmentação das pequenas
  propriedades.

  - **[INFERRED]** Uma filha nascida na Alemanha e casada em Nova Friburgo em 1840 situa a
  chegada da família em algum ponto entre o nascimento dela e essa data, e a entrada de 1824 é a
  candidata óbvia. É aritmética somada à história da coorte — bom raciocínio, não chegada
  documentada.

  - **[CONTEXTUAL / INFERRED]** Se a transcrição do *Caroline* estiver certa e ele era o chefe
  do domicílio, então foi ele, e não apenas a filha, quem decidiu emigrar — o que o coloca entre
  os adultos que apostaram na colônia e importa para ler a posição da família. A distinção entre
  "o emigrante" e "o pai de uma emigrante" é exatamente o tipo de coisa que se borra nas árvores
  genealógicas, e a pista é o que a resolveria aqui.

  ## Questões em aberto

  - Seu próprio nascimento, casamento e óbito. O livro evangélico de Blödesheim (hoje Hochborn)
  testaria a origem alemã da família e o batismo da filha, em 1812. [OPEN]

  - Se a travessia do *Caroline*, em 3 de maio de 1824, e a Casa 72 / Lote 78 são dele, em nível
  primário. [LEAD]

  - Se as datas de árvore colaborativa 1773–1852, para "Joannes Jacobus Storck", pertencem a
  este homem. [LEAD]

  - O sobrenome de solteira da esposa, que o ato de 1840 omite. [OPEN]

  - Sua nacionalidade, deixada em aberto de propósito porque nenhum documento retido declara
  onde nasceu. [OPEN por decisão]

  ## Fontes disponíveis (neste repositório)

  - **PAR-0076** — assento de casamento de 1840, em Nova Friburgo, da filha Elisabeth com João
  José Rutschmann; o único documento retido que o nomeia, como "Tiago Storck", marido da
  falecida Anna Clara.

  ## Contexto regional e migratório

  Nova Friburgo foi decretada colônia católica suíça em maio de 1818 e povoada a partir do fim
  de 1819, mas em seis anos era uma vila mista: as famílias alemãs recrutadas por Schäffer
  chegaram em maio de 1824 e fundaram a Igreja Luterana, enquanto a Matriz católica continuava a
  servir os suíços. [CONTEXTUAL] As duas entradas receberam a mesma terra serrana pobre, e ambas
  foram empurradas para fora da Europa pela mesma combinação de quebra de safra, pobreza
  pós-napoleônica e escassez de terra. [CONTEXTUAL] Desta família, o que um documento estabelece
  é estreito: uma filha nascida e batizada na Alemanha, moradora da freguesia de São João
  Baptista, ali casada em junho de 1840, com o pai nomeado e a mãe morta. [PROVEN]

  ## Onde ir hoje

  - **Evangelische Laurentiuskirche, Hochborn (a histórica Blödesheim)** — 55234 Hochborn, LK
  Alzey-Worms, Renânia-Hessiana, Alemanha · [Mapa](https://maps.google.com/?q=49.7239,8.2008). A
  freguesia de origem relatada dos Storck; a aldeia foi rebatizada Hochborn em 1971 e a igreja
  continua de pé. O batismo da filha ali nomearia ambos os pais e confirmaria toda a pista.
  [APPROX — a origem em Blödesheim é LEAD]

  - **Igreja Matriz / Catedral de São João Batista** — Rua Monsenhor José Antônio Teixeira 23,
  Centro, Nova Friburgo, RJ · [Mapa](https://maps.google.com/?q=-22.28159,-42.53085). Onde a
  filha se casou em junho de 1840, no ato que o nomeia. A catedral atual é de 1869; o ato
  pertence à igreja anterior, no mesmo sítio. [RESOLVED]

  - **Núcleo histórico da colônia, Nova Friburgo** — Praça Getúlio Vargas / Praça Dermerval
  Barbosa Moreira, Centro · [Mapa](https://maps.google.com/?q=-22.28035,-42.53284). Onde foram
  demarcados os números de casa e lote da colônia, entre eles a relatada Casa 72 / Lote 78 do
  domicílio Storck. [APPROX]
