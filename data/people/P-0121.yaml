profile_pt: >-
  ## Identidade

  **Jacob Storck** — registrado como "Tiago Storck" (Tiago = Jacobus/Jacob), pai de
  Elisabeth/Isabel Storck (P-0110); nomeado no casamento de 1840 da filha em Nova Friburgo
  (PAR-0076, família F-0061). [STRONG-EVIDENCE] Isso resolve a antiga dúvida "Jacob vs Joannes
  Jacobus Storck" em favor de Jacob. Um ancestral direto de Iris Bohrer Muniz (P-0007) cinco
  gerações acima (3×-bisavô), por Elisabeth Storck → Maria Joanna Rutschmann (P-0037) → Lucinda
  (P-0031) → Celina (P-0015).

  A filha foi "nascida e baptizada na Allemanha" (Alemanha), portanto a família é alemã; o próprio
  local de nascimento dele não é declarado, de modo que sua nacionalidade fica em branco.
  [CONTEXTUAL]

