profile: >-
  ## Interesting facts

  - **[PROVEN]** Her own baptism (PAR-0072) gives her full name as **Maria Thecla Regina** and
  her birth as **23 September 1844**, correcting the widely circulated collaborative-tree date
  of 23 November 1844 by two months — a case where a held primary act overturns a secondary
  one outright.

  - **[PROVEN]** She was baptised on 2 June 1845, more than eight months after birth, in a
  collective session — the normal rhythm of a rural colony parish where a priest reached the
  outlying districts in batches rather than within days of a birth.

  - **[PROVEN]** Her father José Eggendorn stood as a **witness at her own 1864 wedding**
  (PAR-0062), and her Eggendorn relatives — João and Elisabeth Eggendorn, Pedro and Regina
  Freese — appear as godparents across her baptism and her daughter's. Every named figure in
  her documented social circle is a Solothurn- or Hessen-descended colonist.

  - **[INFERRED]** Her sister Bibiana Heggendorn married Vicente's brother José Borer: two
  sisters to two brothers, the same sibling-pair pattern the Wehrli daughters had produced one
  generation earlier. The colony's marriage pool was narrow enough that families paired off in
  blocks.

  - **[PROVEN]** She is named as Valentim Martinho Bohrer's mother in both his 1868 baptism
  and his 1890 marriage (PAR-0063, PAR-0064), the marriage act confirming the "Regina" element
  of her name — so her maternity of the direct line rests on two independent primary acts.

  - **[CONTEXTUAL]** Born in 1844, she lived through the 1888 abolition and the 1889 Republic,
  which reached even the Nova Friburgo serra: labour arrangements changed and civil
  registration moved from the parish to the cartório — which is why her children's records
  shift from parish books to civil ones within her lifetime.

  ## Identity

  **Maria Heggendorn** — recorded in full as **Maria Thecla Regina** in her own baptism; the
  Eggendorn-line wife of Vicente Borer (P-0070). Surname variants across the acts: *Hegendorn
  / Heggendorf / Eggendorn / Eckdorn / Hech[t]forme [uncertain] / Haggendorn*.

  - **Birth:** 23 September 1844 at Nova Friburgo, baptised 2 June 1845 [PROVEN — PAR-0072;
  event E-0096], the act naming her "Maria Thecla Regina" and correcting the blog and tree
  date of 23 November 1844.

  - **Parents:** José Eggendorn (P-0101) and Maria — Anna Maria — Freese (P-0102), colonists
  of the Nova Friburgo settlement (family F-0050) [PROVEN — PAR-0072, and their own 1829
  marriage PAR-0073, which reaches one generation further to the Eggendorn Sr × Lutz and Frees
  couples].

  - **Nationality:** Brazilian — born in the colony, a granddaughter of immigrants on both
  sides.

  - **Marriage:** married Vicente Borer (P-0070) on 11 April 1864 at Nova Friburgo, aged 20 to
  his 35, before the vicar João José Viviand; her father was one of the two witnesses [PROVEN
  — PAR-0062; event E-0063].

  - **Death:** not established from any held record. [OPEN] She was alive and named as a
  living parent in her son Valentim's 1890 marriage act (PAR-0064) and is named again, without
  any indication of death, in the 1891 and 1913 civil records of her grandchildren and
  children (CIV-0045, CIV-0048).

  ## Standing and profession

  No occupation, property, office, title or literacy is documented for her. As with her
  mother-in-law's generation, every record names her in a relational position — daughter,
  bride, mother, grandmother — and that absence is the standard shape of a colonist woman's
  documentary life rather than a gap peculiar to her. The household's class is documented
  through the men around her: her husband's occupation is entered as "desconhecida"
  (PUB-0003), and her sons appear as *lavradores* at São José do Ribeirão and Barra Alegre
  (CIV-0045, CIV-0048).

  ## Family and social network

  - **Husband:** Vicente Borer (P-0070), married 1864; family F-0034.

  - **Children:** the Borer children on F-0034 — José Domingos (1864), Maria Elisabeth (b. 15
  December 1866, baptised 10 February 1867, PAR-0081), the modelled **Valentim Martinho
  Bohrer** (P-0028, 1868), Vicente the younger (1871) and José Maria Bocher (b. ~1886, married
  1913 at Bom Jardim, CIV-0048). She is named as Valentim's mother in his 1868 baptism ("Maria
  [Eugenia — uncertain] Eggendorn", PAR-0063) and his 1890 marriage ("Maria Regina Eggendorn /
  Eckdorn", PAR-0064) [PROVEN].

  - **Her sister Bibiana Heggendorn** married Vicente's brother José Borer (PUB-0003) — two
  Heggendorn sisters to two Borer brothers, cementing the tie between the two households.

  - **An Eggendorn circle around every act:** her own godparents were Pedro and Regina Freese
  (her mother's kin); her daughter Maria Elizabeth's were João and Elisabeth Eggendorn (her
  own kin); her father witnessed her wedding. The Eggendorn and Freese families are the whole
  of her documented network.

  ## What we can extrapolate

  - **She married across the colony, not out of it [INFERRED].** Her parents were colonists
  and so were her husband's; her sister married her husband's brother; her godparents and her
  children's godparents came from the same two surnames. Nothing in her record touches a
  Brazilian landed family, a town merchant or an office-holder. That is a marriage strategy of
  consolidation rather than advancement — cheap, safe, and structurally incapable of adding
  capital, because everyone in the pool held the same thing: a share of a poor colony lot.

  - **Her standing was inherited, and what she inherited was a position with no property
  attached [INFERRED].** She brought to the 1864 marriage the same kind of asset her
  mother-in-law had brought in 1820: kin, labour and a recognised place, not land. Against the
  family's Armond line, where a bride like Eliza Balbina de Toledo carried an inheritance
  quota into the marriage, the Borer–Heggendorn union transferred nothing heritable in either
  direction.

  - **Partible succession worked on her twice [CONTEXTUAL].** She was one child of an
  Eggendorn colonist household and married into a Borer household of eleven or twelve
  siblings; both estates divided equally among all children under Brazilian law. Whatever
  either family had, her own household's share of it was a fraction of a fraction. This is why
  no property appears in any act naming her, despite two colonist-landholding grandparent
  couples standing behind her.

  - **Education: the loss is documented inside her own household [CONTEXTUAL / INFERRED].**
  Schooling in Imperial Brazil was a purchased, class-linked privilege with no free rural
  alternative; it had to be re-bought each generation, and it tracked money. Her parents'
  generation arrived carrying German parish-school literacy; her son Valentim had to have his
  daughter's 1891 birth registered *a rogo*, "por não saber escrever" (CIV-0045). She is the
  mother in the household where that transmission failed — not through any decision of hers,
  but because a *lavrador* family on fragmented serra land had nothing to spend on it.

  - **Her documentary life maps the shift from parish to state [PROVEN for the records;
  CONTEXTUAL for the meaning].** She is baptised in a parish book in 1845, married in a parish
  book in 1864, named as a mother in a parish book in 1868 and 1890 — and then named as a
  grandmother in a **civil** register in 1891 and as a mother in a **civil** marriage in 1913.
  The 1889 Republic's secularisation of registration is visible inside one woman's family
  file, and it is also why her own death, if it falls after 1889, should be sought in a
  cartório rather than a church.

  - **The arc, named [INFERRED].** Colonist's daughter born on the serra (1844) → married at
  20 into an equally land-poor colonist household (1864) → mother of children who left the
  original lot for farm work at São José do Ribeirão and Bom Jardim → grandmother in a
  household recorded as illiterate. Flat, like the branch she married into, and for the same
  reasons: too many heirs, too little land, no purchasable schooling. The recovery belongs to
  a later generation, and to the city.

  ## Open questions

  - Her **death record** — the one substantial gap; her birth, name and parentage are all
  settled by PAR-0072. Given the branch's move, search Nova Friburgo, São José do Ribeirão and
  Bom Jardim, and (for a post-1889 death) the civil registries as well as the parish books.
  [OPEN]

  - Her **sister Bibiana's** marriage to José Borer at primary level would confirm the
  two-sisters-two-brothers reading, which currently rests on the compilation alone. [OPEN]

  ## Sources held (this repository)

  - PAR-0072 (her own 1844/45 Nova Friburgo baptism — fixes her name "Maria Thecla Regina",
  her birth on 23 September 1844 and her parents; godparents Pedro and Regina Freese; sources
  event E-0096).

  - PAR-0062 (her own 1864 Nova Friburgo marriage to Vicente Borer — her age 20, her parents
  named, her father a witness; sources event E-0063).

  - PAR-0081 (her daughter Maria Elizabeth's 1867 Nova Friburgo baptism — names her as mother
  "Maria Eggendorn").

  - PAR-0063 (her son Valentim's 1868 Nova Friburgo baptism — names her as mother, "Maria
  [Eugenia?] Eggendorn") · PAR-0064 (Valentim's 1890 Nova Friburgo marriage — names her "Maria
  Regina Eggendorn", confirming the "Regina" element).

  - CIV-0045 (her granddaughter Maria Felomena's 1891 civil birth at São José do Ribeirão —
  names her as paternal grandmother, surname written "Hech[t]forme" [uncertain]).

  - CIV-0048 (her son José Maria Bocher's 1913 civil marriage at Barra Alegre, Bom Jardim —
  names her as his mother, "Maria [Regina] Haggendorn").

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER II entry 1.1.7) — secondary source naming
  her, her marriage and her parents, and her sister Bibiana's marriage to José Borer.

  ## Regional and migration context

  A Brazil-born daughter of the Heggendorn immigrant family, she married into the Borer trunk
  inside the tight, endogamous pool of transplanted Grindel and Solothurn colonist households
  at Nova Friburgo. [CONTEXTUAL] The colony her parents had been settled in was created by Dom
  João VI's *Decreto de 16 de maio de 1818* for 100 Swiss **Catholic** families on the Fazenda
  do Morro Queimado; its lots proved poor, stony and undersized, and by her own generation the
  families were spreading out over the surrounding fluminense highlands — which is where her
  children's records place her household, at São José do Ribeirão and Barra Alegre in Bom
  Jardim. [CONTEXTUAL]

  ## Where to go today

  - **Birth and baptism (1844/45), marriage (1864):** Catedral Diocesana / Igreja Matriz de
  São João Batista, Rua Monsenhor José Antônio Teixeira 23, Centro, Nova Friburgo, RJ
  [RESOLVED] · [Maps](https://maps.google.com/?q=-22.28159,-42.53085)

  - **The household's later ground, and where to search for her death:** São José do Ribeirão
  and Barra Alegre / Maravilhas, Bom Jardim, RJ — parish books and, for any death after 1889,
  the civil registry [OPEN] · [Maps](https://maps.google.com/?q=-22.205,-42.3981)

  - **Heggendorn ancestral origin parish:** Kath. Pfarrkirche St. Stephan, 4247 Grindel, Kt.
  Solothurn, Switzerland [RESOLVED] · [Maps](https://maps.google.com/?q=47.3833,7.5042)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Seu próprio batismo (PAR-0072) dá seu nome completo como **Maria Thecla
  Regina** e seu nascimento como **23 de setembro de 1844**, corrigindo em dois meses a data
  amplamente difundida de 23 de novembro de 1844, vinda de árvore colaborativa — caso em que
  um ato primário disponível derruba de vez um secundário.

  - **[PROVEN]** Foi batizada em 2 de junho de 1845, mais de oito meses após o nascimento,
  numa sessão coletiva — o ritmo normal de uma paróquia colonial rural, em que o padre
  alcançava os distritos afastados em lotes, e não poucos dias após cada nascimento.

  - **[PROVEN]** Seu pai, José Eggendorn, foi **testemunha de seu próprio casamento, em 1864**
  (PAR-0062), e seus parentes Eggendorn — João e Elisabeth Eggendorn, Pedro e Regina Freese —
  aparecem como padrinhos em seu batismo e no da filha. Toda figura nomeada em seu círculo
  social documentado é colona descendente de Solothurn ou de Hessen.

  - **[INFERRED]** Sua irmã Bibiana Heggendorn casou-se com José Borer, irmão de Vicente: duas
  irmãs para dois irmãos, o mesmo padrão de pares de irmãos que as filhas Wehrli haviam
  produzido uma geração antes. O repertório matrimonial da colônia era estreito o bastante
  para que as famílias se emparelhassem em blocos.

  - **[PROVEN]** É nomeada como mãe de Valentim Martinho Bohrer tanto em seu batismo de 1868
  quanto em seu casamento de 1890 (PAR-0063, PAR-0064), com o ato de casamento confirmando o
  elemento "Regina" de seu nome — de modo que sua maternidade da linha direta assenta em dois
  atos primários independentes.

  - **[CONTEXTUAL]** Nascida em 1844, viveu a abolição de 1888 e a República de 1889, que
  alcançaram até a serra de Nova Friburgo: os arranjos de trabalho mudaram e o registro civil
  passou da paróquia ao cartório — razão pela qual os registros de seus filhos migram dos
  livros paroquiais para os civis ainda em vida dela.

  ## Identidade

  **Maria Heggendorn** — registrada por extenso como **Maria Thecla Regina** em seu próprio
  batismo; a esposa da linha Eggendorn de Vicente Borer (P-0070). Variantes do sobrenome nos
  atos: *Hegendorn / Heggendorf / Eggendorn / Eckdorn / Hech[t]forme [incerto] / Haggendorn*.

  - **Nascimento:** 23 de setembro de 1844, em Nova Friburgo, batizada em 2 de junho de 1845
  [PROVEN — PAR-0072; evento E-0096], com o ato nomeando-a "Maria Thecla Regina" e corrigindo
  a data de 23 de novembro de 1844 de blogs e árvores.

  - **Pais:** José Eggendorn (P-0101) e Maria — Anna Maria — Freese (P-0102), colonos do
  assentamento de Nova Friburgo (família F-0050) [PROVEN — PAR-0072 e o casamento deles, de
  1829, PAR-0073, que alcança uma geração adiante, até os casais Eggendorn Sr × Lutz e Frees].

  - **Nacionalidade:** brasileira — nascida na colônia, neta de imigrantes pelos dois lados.

  - **Casamento:** casou-se com Vicente Borer (P-0070) em 11 de abril de 1864, em Nova
  Friburgo, aos 20 anos contra os 35 dele, perante o vigário João José Viviand; seu pai foi
  uma das duas testemunhas [PROVEN — PAR-0062; evento E-0063].

  - **Óbito:** não estabelecido por nenhum registro disponível. [OPEN] Estava viva e é nomeada
  como mãe viva no ato de casamento de seu filho Valentim, em 1890 (PAR-0064), e é nomeada
  outra vez, sem indicação de falecimento, nos registros civis de 1891 e 1913 de sua neta e de
  seu filho (CIV-0045, CIV-0048).

  ## Posição social e profissão

  Nenhuma ocupação, propriedade, cargo, título ou alfabetização está documentada para ela.
  Como na geração de sua sogra, todo registro a nomeia numa posição relacional — filha, noiva,
  mãe, avó —, e essa ausência é o formato padrão da vida documental de uma mulher colona, não
  uma lacuna peculiar a ela. A classe do domicílio está documentada pelos homens à sua volta:
  a ocupação do marido é lançada como "desconhecida" (PUB-0003), e seus filhos aparecem como
  *lavradores* em São José do Ribeirão e Barra Alegre (CIV-0045, CIV-0048).

  ## Família e rede social

  - **Marido:** Vicente Borer (P-0070), casados em 1864; família F-0034.

  - **Filhos:** os filhos Borer em F-0034 — José Domingos (1864), Maria Elisabeth (n. 15 de
  dezembro de 1866, batizada em 10 de fevereiro de 1867, PAR-0081), o modelado **Valentim
  Martinho Bohrer** (P-0028, 1868), Vicente, o moço (1871), e José Maria Bocher (n. ~1886,
  casado em 1913 no Bom Jardim, CIV-0048). É nomeada como mãe de Valentim em seu batismo de
  1868 ("Maria [Eugenia — incerto] Eggendorn", PAR-0063) e em seu casamento de 1890 ("Maria
  Regina Eggendorn / Eckdorn", PAR-0064) [PROVEN].

  - **Sua irmã Bibiana Heggendorn** casou-se com José Borer, irmão de Vicente (PUB-0003) —
  duas irmãs Heggendorn para dois irmãos Borer, cimentando o laço entre os dois domicílios.

  - **Um círculo Eggendorn em torno de cada ato:** seus padrinhos foram Pedro e Regina Freese
  (parentes maternos); os da filha Maria Elizabeth foram João e Elisabeth Eggendorn (parentes
  dela própria); o pai testemunhou seu casamento. As famílias Eggendorn e Freese são toda a
  sua rede documentada.

  ## O que podemos extrapolar

  - **Ela casou-se atravessando a colônia, não saindo dela [INFERRED].** Seus pais eram
  colonos e os do marido também; sua irmã casou-se com o irmão do marido; seus padrinhos e os
  padrinhos de seus filhos vieram dos mesmos dois sobrenomes. Nada em seu registro toca uma
  família brasileira proprietária, um comerciante urbano ou um detentor de cargo. É uma
  estratégia matrimonial de consolidação, não de ascensão — barata, segura e estruturalmente
  incapaz de acrescentar capital, porque todos no repertório tinham a mesma coisa: um quinhão
  de um lote colonial pobre.

  - **Sua posição foi herdada, e o que herdou foi uma posição sem propriedade anexa
  [INFERRED].** Levou ao casamento de 1864 o mesmo tipo de ativo que sua sogra levara em 1820:
  parentela, trabalho e um lugar reconhecido, não terra. Contra a linha Armond da família, em
  que uma noiva como Eliza Balbina de Toledo levava um quinhão de herança ao casamento, a
  união Borer–Heggendorn não transferiu nada herdável em direção alguma.

  - **A sucessão partível agiu sobre ela duas vezes [CONTEXTUAL].** Era filha de um domicílio
  colono Eggendorn e casou-se num domicílio Borer de onze ou doze irmãos; ambos os espólios
  dividiam-se igualmente entre todos os filhos pela lei brasileira. Fosse o que fosse que cada
  família tivesse, a parte de seu próprio domicílio era fração de fração. É por isso que
  nenhuma propriedade aparece em ato algum que a nomeie, apesar de dois casais de avós colonos
  com terra atrás dela.

  - **Educação: a perda está documentada dentro do próprio domicílio dela [CONTEXTUAL /
  INFERRED].** A escolarização no Brasil imperial era privilégio comprado e ligado à classe,
  sem alternativa rural gratuita; precisava ser recomprada a cada geração e acompanhava o
  dinheiro. A geração de seus pais chegou trazendo alfabetização de escola paroquial alemã;
  seu filho Valentim precisou registrar o nascimento da filha, em 1891, *a rogo*, "por não
  saber escrever" (CIV-0045). Ela é a mãe do domicílio em que essa transmissão falhou — não
  por decisão sua, mas porque uma família de *lavradores* em terra serrana fragmentada nada
  tinha para gastar com isso.

  - **Sua vida documental mapeia a passagem da paróquia ao Estado [PROVEN quanto aos
  registros; CONTEXTUAL quanto ao sentido].** É batizada num livro paroquial em 1845, casa-se
  num livro paroquial em 1864, é nomeada mãe em livros paroquiais em 1868 e 1890 — e depois
  nomeada avó num registro **civil** em 1891 e mãe num casamento **civil** em 1913. A
  secularização do registro pela República de 1889 é visível dentro do dossiê de uma única
  mulher, e é também por isso que seu próprio óbito, se posterior a 1889, deve ser buscado em
  cartório, e não em igreja.

  - **O arco, nomeado [INFERRED].** Filha de colonos nascida na serra (1844) → casada aos 20
  num domicílio colono igualmente pobre em terra (1864) → mãe de filhos que deixaram o lote
  original para trabalho agrícola em São José do Ribeirão e no Bom Jardim → avó num domicílio
  registrado como analfabeto. Plano, como o ramo em que se casou, e pelas mesmas razões:
  herdeiros demais, terra de menos, nenhuma escolarização comprável. A recuperação pertence a
  uma geração posterior, e à cidade.

  ## Questões em aberto

  - Seu **registro de óbito** — a única lacuna substancial; nascimento, nome e filiação estão
  todos resolvidos por PAR-0072. Dada a mudança do ramo, buscar em Nova Friburgo, São José do
  Ribeirão e Bom Jardim e, para um óbito posterior a 1889, também nos cartórios, além dos
  livros paroquiais. [OPEN]

  - O casamento de sua **irmã Bibiana** com José Borer, em nível primário, confirmaria a
  leitura das duas irmãs com dois irmãos, que hoje se apoia apenas na compilação. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0072 (seu próprio batismo de 1844/45 em Nova Friburgo — fixa seu nome "Maria Thecla
  Regina", seu nascimento em 23 de setembro de 1844 e seus pais; padrinhos Pedro e Regina
  Freese; fundamenta o evento E-0096).

  - PAR-0062 (seu próprio casamento de 1864 em Nova Friburgo com Vicente Borer — sua idade de
  20 anos, seus pais nomeados, seu pai testemunha; fundamenta o evento E-0063).

  - PAR-0081 (batismo de 1867, em Nova Friburgo, da filha Maria Elizabeth — a nomeia como mãe,
  "Maria Eggendorn").

  - PAR-0063 (batismo de 1868, em Nova Friburgo, do filho Valentim — a nomeia como mãe, "Maria
  [Eugenia?] Eggendorn") · PAR-0064 (casamento de 1890, em Nova Friburgo, de Valentim — a
  nomeia "Maria Regina Eggendorn", confirmando o elemento "Regina").

  - CIV-0045 (nascimento civil de 1891 da neta Maria Felomena, em São José do Ribeirão — a
  nomeia como avó paterna, sobrenome grafado "Hech[t]forme" [incerto]).

  - CIV-0048 (casamento civil de 1913 do filho José Maria Bocher, em Barra Alegre, Bom Jardim
  — a nomeia como mãe dele, "Maria [Regina] Haggendorn").

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER II, entrada 1.1.7) — fonte secundária que a
  nomeia, bem como seu casamento, seus pais e o casamento da irmã Bibiana com José Borer.

  ## Contexto regional e migratório

  Filha nascida no Brasil da família imigrante Heggendorn, casou-se no tronco Borer dentro do
  estreito repertório endogâmico dos domicílios colonos transplantados de Grindel e de
  Solothurn em Nova Friburgo. [CONTEXTUAL] A colônia em que seus pais haviam sido assentados
  foi criada pelo *Decreto de 16 de maio de 1818* de Dom João VI para 100 famílias suíças
  **católicas** na Fazenda do Morro Queimado; seus lotes revelaram-se pobres, pedregosos e
  subdimensionados e, já na geração dela, as famílias se espalhavam pelas serras fluminenses
  vizinhas — que é onde os registros de seus filhos situam seu domicílio, em São José do
  Ribeirão e em Barra Alegre, no Bom Jardim. [CONTEXTUAL]

