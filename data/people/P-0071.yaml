profile: >-
  ## Identity

  **Maria Heggendorn** — the only form given by the record-citing compilation; the
  fuller "Maria Thecla Regina Heggendorn" and the birth date "23 November 1844" appear
  only in blogs and are not confirmed here. [LEAD] Surname variants: *Hegendorn /
  Heggendorf*.

  - **Marriage:** married Vicente Borer (P-0070) on 11 April 1864 (PUB-0003,
  strong-evidence; E-0063).

  - **Parents:** daughter of Joseph Heggendorn × Maria (Maria Amélia?) Freese (PUB-0003,
  p.301) — a Grindel/Solothurn colonist couple, not modelled here. [LEAD for the
  mother's exact name]

  - **Birth and death:** not established from a held record; born, by context, at Nova
  Friburgo to the immigrant Heggendorn family. [OPEN]

  ## Family and social network

  - **Children:** the four Borer children listed on F-0034 — José Domingos (1864), Maria
  Elisabeth (1866), the modelled Valentim Martinho Bohrer (P-0028, 1868) and Vicente the
  younger (1871).

  - **Her sister Bibiana Heggendorn** married Vicente's brother José Borer (PUB-0003) —
  two Heggendorn sisters married two Borer brothers, cementing the Borer–Heggendorn tie.

  ## What we can extrapolate

  - **[INFERRED]** The Heggendorn double-marriage into the Borer family repeats the
  endogamous sibling-pair pattern seen one generation earlier with the Wehrlis — the same
  small set of transplanted Solothurn families recombining at Nova Friburgo.

  - **A node in the flat, land-poor colonist floor [CONTEXTUAL / INFERRED].** As a
  Brazil-born daughter of the Heggendorn colonists married into the Borer branch, Maria
  belongs to the same tight, endogamous pool of transplanted Grindel/Solothurn families
  consolidating thin subsistence means among themselves rather than marrying up. No
  property or office attaches to her; she sits in the never-elite colonist band from which
  the family's modest 20th-century urban stabilisation eventually rose — the opposite
  starting point to the decline of the family's Armond line.

  ## Open questions

  - Her **birth (name and date) and death** would come from the Nova Friburgo
  parish/civil registers; only they can confirm or reject the blog-only "Thecla Regina,
  1844". [OPEN]

  ## Sources held (this repository)

  - PUB-0003 (*Imigrantes de Nova Friburgo*, BORER II tree entry 1.1.7) — the sole
  record-citing source naming her, her marriage and her parents.

  ## Regional and migration context

  A Brazil-born daughter of the Heggendorn immigrant family, she married into the Borer
  trunk inside the tight, endogamous transplanted Grindel/Solothurn colonist pool at Nova
  Friburgo. [CONTEXTUAL]
profile_pt: >-
  ## Identidade

  **Maria Heggendorn** — a única forma dada pela compilação que cita registros; a forma
  mais completa "Maria Thecla Regina Heggendorn" e a data de nascimento "23 de novembro
  de 1844" aparecem apenas em blogs e não são confirmadas aqui. [LEAD] Variantes do
  sobrenome: *Hegendorn / Heggendorf*.

  - **Casamento:** casou-se com Vicente Borer (P-0070) em 11 de abril de 1864 (PUB-0003,
  evidência forte; E-0063).

  - **Pais:** filha de Joseph Heggendorn × Maria (Maria Amélia?) Freese (PUB-0003, p.301)
  — um casal colono de Grindel/Solothurn, não modelado aqui. [LEAD para o nome exato da
  mãe]

  - **Nascimento e óbito:** não estabelecidos a partir de registro em mãos; nascida, pelo
  contexto, em Nova Friburgo, na família imigrante Heggendorn. [OPEN]

  ## Família e rede social

  - **Filhos:** os quatro filhos Borer listados em F-0034 — José Domingos (1864), Maria
  Elisabeth (1866), o modelado Valentim Martinho Bohrer (P-0028, 1868) e Vicente, o mais
  novo (1871).

  - **Sua irmã Bibiana Heggendorn** casou-se com o irmão de Vicente, José Borer
  (PUB-0003) — duas irmãs Heggendorn casaram-se com dois irmãos Borer, cimentando o laço
  Borer–Heggendorn.

  ## O que podemos extrapolar

  - **[INFERRED]** O casamento duplo Heggendorn na família Borer repete o padrão
  endogâmico de pares de irmãos visto uma geração antes com os Wehrli — o mesmo pequeno
  conjunto de famílias de Solothurn transplantadas se recombinando em Nova Friburgo.

  - **Um nó no piso colono plano e pobre em terra [CONTEXTUAL / INFERRED].** Como filha
  nascida no Brasil dos colonos Heggendorn, casada com o ramo Borer, Maria pertence ao
  mesmo conjunto restrito e endogâmico de famílias transplantadas de Grindel/Solothurn
  que consolidavam meios de subsistência escassos entre si em vez de casar para cima.
  Nenhuma propriedade ou ofício lhe é atribuído; ela se situa na faixa colona nunca-elite
  a partir da qual a modesta estabilização urbana da família no século XX acabou por
  surgir — o ponto de partida oposto ao do declínio da linha Armond da família.

  ## Questões em aberto

  - Seu **nascimento (nome e data) e óbito** viriam dos registros paroquiais/civis de
  Nova Friburgo; apenas eles podem confirmar ou rejeitar o "Thecla Regina, 1844" que só
  aparece em blogs. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PUB-0003 (*Imigrantes de Nova Friburgo*, entrada 1.1.7 da árvore BORER II) — a única
  fonte que cita registros e a nomeia, com seu casamento e seus pais.

  ## Contexto regional e migratório

  Filha nascida no Brasil da família imigrante Heggendorn, casou-se com o tronco Borer
  dentro do conjunto colono restrito e endogâmico de Grindel/Solothurn transplantado em
  Nova Friburgo. [CONTEXTUAL]
