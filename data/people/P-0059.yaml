profile: >-
  ## Interesting facts

  - **[PROVEN]** Two records twenty-eight years apart catch him mid-career: his daughter's 1810 marriage styles him **Alferes** (PAR-0023); his granddaughter's 1838 baptism styles him **Capitão** (PAR-0026). The same two acts catch his son Cezário climbing in parallel — *Furriel* in 1810, *Capitão* by 1838 — so father and son were rising on the militia ladder in the same window. [INFERRED] The 1838 styling does not prove he was still alive: a baptism names grandparents at their final rank, living or dead.

  - **[PROVEN]** His daughter Mathilde's 1810 wedding was witnessed by a **Tenente Coronel** (Caetano José de Almeida), and the same Tenente Coronel stood godfather to her first son three years later (PAR-0050, 1813). The district's senior militia officer appearing twice at this family's key acts is a documented, sustained patron relationship, not a casual acquaintance.

  - **[CONTEXTUAL]** The colonial Companhias de Ordenanças in which those ranks sat were *forças militares não remuneradas* — unpaid. The rank bought precedence and local authority, never a salary.

  - **[CONTEXTUAL]** His documented origin — "natural da freguesia de Nossa Senhora do Rio de Meia Ponte, comarca do Goyas" — places his birth in what is today Pirenópolis, Goiás: a matriz erected in 1728 at the heart of the 18th-century gold-and-cattle frontier west of Minas Gerais.

  - **[INFERRED]** The origin conflict — "natural de Meia Ponte" (PAR-0025, 1777) against "naturais e batizados da Freguesia de Barbacena" (PAR-0023, 1810) — reads best as the later act describing thirty-odd years of Barbacena domicile rather than a birthplace. Both readings are kept.

  ## Identity

  **Amaro da Silva Xavier**, a militia officer — styled **Alferes** in his daughter Mathilde's 1810 marriage (PAR-0023) and **Capitão** by 1838 in his granddaughter Carolina's baptism (PAR-0026) [PROVEN]. Father of Mathilde Maria de Jesus (P-0027), hence great-grandfather of Eliza Balbina de Toledo (P-0017) on her father's maternal line (the degree is read off the chain Eliza < José Cezário de Toledo Lima < Mathilde < Amaro).

  - **Origin — a material conflict, both preserved:** PAR-0025 (1777, the earlier and more specific source) states him "natural da freguesia de Nossa Senhora do Rio de Meia Ponte, comarca do Goyas" (today Pirenópolis, GO); PAR-0023 (1810) describes both him and Ignez as "naturais e batizados da Freguesia de Barbacena" — most plausibly a long-term domicile. [PROVEN for both statements; conflict flagged, not resolved]

  - **Marriage:** ⚭ Ignez Francisca de Lima (P-0060), family F-0029; the marriage act is not held.

  - **Parents:** Amaro da Silva Barreto (P-0064, of Guimarães, Arcebispado de Braga, Portugal) × Perpétua da Silva (P-0065, of the Cidade de São Paulo), confirmed by PAR-0025 (family F-0031).

  - **Death:** after 1810, when he is named as Mathilde's father at her marriage [INFERRED]; his own baptism and death are not located. Nationality Brazilian.

  ## Standing and profession

  - **Alferes rising to Capitão** [PROVEN across PAR-0023 and PAR-0026]. The household's militia standing rose across three generations: his father carried an abbreviated and uncertain rank ("[Sargento / Tenente?]", PAR-0025), he himself was Alferes then Capitão, and his son Cezário went from Furriel (1810) to Capitão (1838).

  - **Literacy — [INFERRED — office]:** an Alferes's commission, muster rolls and correspondence presuppose letters, but no autograph and no *a rogo* formula survives for him in the held records, so the verdict stays inferential.

  - **No occupation beyond the militia rank is stated in any held record** — no fazenda, no trade, no office of profit. What the records show is rank; what they do not show is what paid for it. [OPEN]

  ## Family and social network

  - **Wife:** Ignez Francisca de Lima (P-0060).

  - **Documented children:** **Maria**, baptised 23 August 1777 at Minas do Piracatu (Manga parish) — the held transcription reads her born on the *twelfth* of the month, while a retrieval re-read gave the sixteenth; the discrepancy is unresolved (PAR-0025). **Cezário José da Silva Lima** — *Furriel* and a witness at his sister's 1810 marriage, *Capitão* by 1838, ⚭ Joanna Umbelina de Jesus, whose daughter Carolina's 1838 baptism names Amaro × Ignez as paternal grandparents (PAR-0026; a documented child of F-0029). **Mathilde Maria de Jesus** (P-0027), our line, who married Ladisláo Egídio Ferreira de Toledo at São João del Rei in 1810.

  - **The FAN network is the standing.** At Mathilde's 1810 marriage the two witnesses were Tenente Coronel Caetano José de Almeida and her own brother the Furriel Cezário (PAR-0023); at her son's 1813 baptism the godparents were that same Tenente Coronel and a "Dona Anna Francisca de Lima" (PAR-0050) — a *de Lima* woman, described *solteira*, who may be a further daughter or a niece of this couple. [LEAD]

  - **The groom's side was a peer, not a patron:** Ladisláo was the son of **Capitão** Joaquim José Ferreira de Toledo (PAR-0023). Alferes's daughter married Capitão's son — the two houses matched.

  ## What we can extrapolate

  - **His standing was EARNED, not inherited — and earned in the one place where it could be** [INFERRED / CONTEXTUAL]. The rank ladder runs father (an uncertain sergeant-grade) → Alferes → Capitão → son Capitão. A rank *climbing* across three generations is the signature of a family building standing rather than holding it, and the Goiás/Paracatú gold-and-cattle frontier was precisely where military-administrative office, land and free-white status could still be assembled by a newcomer's son. Its payoff is measurable in one act: the 1810 marriage, where his daughter married a Capitão's son as a social equal.

  - **The rank paid nothing, so the money was elsewhere — and it was in people and land** [CONTEXTUAL on the wage; PROVEN on the capital]. Ordenanças and, later, Guarda Nacional officers served *gratuitamente*. What made this family solvent is visible downstream rather than in his own papers: an **enslaved woman, Martinha, donated into Mathilde's dowry** by the Capitão Manoel Rodrigues de Lima "para ajuda de seu dote" (the certidão embedded in PRB-0006), and Mathilde herself **buying the Fazenda da Concórdia as a widow in 1862** (PRB-0007). That is heritable capital — land and enslaved labour — which is the decisive contrast with the Armond paternal side, whose equally-unpaid police offices rested on no land and so transmitted status and nothing else.

  - **Partible inheritance then did its arithmetic, and here it is documented rather than assumed** [PROVEN arithmetic / CONTEXTUAL law]. Brazilian succession split an estate equally among all children. Mathilde's 1879 inventário (PRB-0006) lists **eight heirs**; the share of heir nº 4 alone was then divided among **eight representantes** — so a fazenda-scale estate reached Amaro's great-grandchildren at roughly **one sixty-fourth** apiece. His own estate is unlocated, but the same law governed it, and he had at least three children.

  - **Letters tracked office and sex, not wealth** [PROVEN for Mathilde; INFERRED for him]. He was literate by office. His daughter Mathilde — of the same house, an owner of land and of enslaved people — signed **a rogo** in 1870, an explicit attestation of illiteracy. Schooling in this period was a purchased, class-linked privilege that had to be re-bought each generation, and it was bought for the men who needed it to hold a commission. Property agency bought this family's women nothing in letters.

  - **Migration here was accumulation, not flight** [INFERRED]. Meia Ponte (Goiás) → Paracatú / Manga by 1777 → Barbacena by the 1790s → São João del Rei by 1810: each move traded raw frontier opportunity for a place in settled society, and the family arrived with rank intact. This is the opposite of the later Armond arc, where movement to the city meant arriving with no land at all.

  - **The generational arc across his own line is upward, and he is its hinge** [INFERRED]. An immigrant father from Guimarães with a barely-legible rank, a São-Paulo-born mother, a son (himself) who made Alferes and then Capitão, a daughter who married into the landed Toledos and died owning a fazenda. The turning point is the 1810 marriage; everything after it belongs to the Toledo and Armond profiles, where the same estate is fragmented and the descendants urbanise.

  ## Open questions

  - His own baptism/marriage (Meia Ponte, Goiás, ~1750s), to primary-confirm his birth. [OPEN] Not reachable on FamilySearch, which holds no microfilmed colonial church records for Goiás; an on-site or archive-request target at the Diocese de Goiás / Paróquia N.S. do Rosário de Meia Ponte (Pirenópolis). [bounded-negative, 2026-08-13]

  - Resolving the Meia Ponte vs Barbacena origin. [OPEN]

  - What the militia standing actually rested on: no inventário, sesmaria or deed in his name is held. No land grant is catalogued for him, his father, or the bare Silva Xavier / Silva Barreto surnames in the Plataforma SILB (checked 2026-08-13, 0 grantees) — consistent with the under-digitisation of colonial Goiás / Paracatú land records, so absence there is not absence of the record; any grant would sit off-SILB (Arquivo Público Mineiro / Arquivo do Estado de SP). [bounded-negative]

  - Whether he was alive in 1838, when the certidão styles him Capitão. [OPEN]

  ## Sources held (this repository)

  - PAR-0023 (1810 São João del Rei marriage of his daughter Mathilde — "Alferes Amaro da Silva Xavier", parent of the bride; names the witnesses) · PAR-0025 (1777 Piracatu baptism of his daughter Maria — names him, his Meia Ponte origin and all four grandparents) · PAR-0026 (1838 São José del-Rei baptism of his granddaughter Carolina — "Capitão Amaro da Silva Xavier" as paternal grandparent, via his son Cezário).

  - Downstream context, not records about him: PAR-0050 (1813 baptism of his grandson José Cezário) · PRB-0006 and PRB-0007 (his daughter Mathilde's 1879 inventário and her 1862 Concórdia purchase).

  ## Regional and migration context

  Meia Ponte (Goiás) → Paracatú / Manga, where his daughter Maria was baptised in 1777 → Barbacena, where Mathilde was raised → São João del Rei, where she married: a mobile militia-officer family riding the 18th-century gold-and-cattle frontier from the São Paulo captaincy inland and then into the Minas heartland. His parents embodied the two feeder streams — a Minho (Guimarães) immigrant father and a São Paulo-born mother. [CONTEXTUAL] The branch rides the broader 18th-century Minho → colonial São Paulo → Minas/Goiás-frontier current: the Minho was Europe's densest rural minifúndio (~96 inhabitants/km² by 1801) and the single greatest source of Portuguese emigration to Brazil; movement to the goldfields ran under the Provisão de 20 de março de 1720 (D. João V) passport regime, and frontier land under the colonial sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Origin parish (baptism, ~1750s):** Igreja Matriz de Nossa Senhora do Rosário, Pirenópolis, GO (ex-Meia Ponte; colonial matriz from 1728; coords -15.852778, -48.958889) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-15.852778,-48.958889)

  - **Where his daughter Maria was baptised (1777):** Igreja Matriz de Santo Antônio, Paracatu, MG (leading candidate for the Paracatú/Manga parish) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Barbacena seat (his daughter Mathilde's 1795 baptism):** Catedral Basílica Nossa Senhora da Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Fatos interessantes

  - **[PROVEN]** Dois registros separados por vinte e oito anos o flagram em meio de carreira: o casamento de sua filha em 1810 o trata por **Alferes** (PAR-0023); o batismo de sua neta em 1838 o trata por **Capitão** (PAR-0026). Os mesmos dois atos flagram seu filho Cezário subindo em paralelo — *Furriel* em 1810, *Capitão* em 1838 —, de modo que pai e filho galgavam a escala miliciana na mesma janela. [INFERRED] O tratamento de 1838 não prova que ele ainda vivesse: um batismo nomeia os avós pela patente final, vivos ou mortos.

  - **[PROVEN]** O casamento de sua filha Mathilde em 1810 teve por testemunha um **Tenente Coronel** (Caetano José de Almeida), e o mesmo Tenente Coronel foi padrinho do primeiro filho dela três anos depois (PAR-0050, 1813). O oficial miliciano mais graduado do distrito comparecendo duas vezes aos atos-chave desta família é uma relação de patrocínio documentada e duradoura, não um conhecimento casual.

  - **[CONTEXTUAL]** As Companhias de Ordenanças coloniais em que essas patentes se inseriam eram *forças militares não remuneradas*. A patente comprava precedência e autoridade local, nunca salário.

  - **[CONTEXTUAL]** Sua origem documentada — "natural da freguesia de Nossa Senhora do Rio de Meia Ponte, comarca do Goyas" — situa seu nascimento na atual Pirenópolis (GO): matriz erigida em 1728 no coração da fronteira setecentista do ouro e do gado a oeste de Minas Gerais.

  - **[INFERRED]** O conflito de origem — "natural de Meia Ponte" (PAR-0025, 1777) contra "naturais e batizados da Freguesia de Barbacena" (PAR-0023, 1810) — lê-se melhor como o ato posterior descrevendo trinta e tantos anos de domicílio em Barbacena, e não um local de nascimento. As duas leituras ficam preservadas.

  ## Identidade

  **Amaro da Silva Xavier**, oficial de milícia — tratado por **Alferes** no casamento de sua filha Mathilde em 1810 (PAR-0023) e por **Capitão** em 1838 no batismo de sua neta Carolina (PAR-0026) [PROVEN]. Pai de Mathilde Maria de Jesus (P-0027) e, portanto, bisavô de Eliza Balbina de Toledo (P-0017) na linha materna do pai dela (o grau é lido na cadeia Eliza < José Cezário de Toledo Lima < Mathilde < Amaro).

  - **Origem — conflito material, ambas as versões preservadas:** PAR-0025 (1777, a fonte mais antiga e mais específica) o declara "natural da freguesia de Nossa Senhora do Rio de Meia Ponte, comarca do Goyas" (hoje Pirenópolis, GO); PAR-0023 (1810) descreve tanto ele quanto Ignez como "naturais e batizados da Freguesia de Barbacena" — mais plausivelmente um domicílio de longa data. [PROVEN para as duas declarações; conflito sinalizado, não resolvido]

  - **Casamento:** ⚭ Ignez Francisca de Lima (P-0060), família F-0029; o assento de casamento não está disponível.

  - **Pais:** Amaro da Silva Barreto (P-0064, de Guimarães, Arcebispado de Braga, Portugal) × Perpétua da Silva (P-0065, da Cidade de São Paulo), confirmados por PAR-0025 (família F-0031).

  - **Óbito:** depois de 1810, quando é nomeado pai de Mathilde no casamento dela [INFERRED]; seu batismo e seu óbito não foram localizados. Nacionalidade brasileira.

  ## Posição social e profissão

  - **Alferes que chega a Capitão** [PROVEN, por PAR-0023 e PAR-0026]. A posição miliciana da casa subiu ao longo de três gerações: seu pai carregava uma patente abreviada e incerta ("[Sargento / Tenente?]", PAR-0025), ele próprio foi Alferes e depois Capitão, e seu filho Cezário passou de Furriel (1810) a Capitão (1838).

  - **Alfabetização — [INFERRED — ofício]:** a patente de Alferes, com suas provisões, mostras e correspondência, pressupõe letras, mas não sobrevive nos registros disponíveis nem autógrafo nem fórmula *a rogo* em seu nome, de modo que o veredito permanece inferencial.

  - **Nenhum registro disponível lhe atribui ocupação além da patente** — nenhuma fazenda, nenhum ofício de rendimento. Os registros mostram a patente; não mostram o que a sustentava. [OPEN]

  ## Família e rede social

  - **Esposa:** Ignez Francisca de Lima (P-0060).

  - **Filhos documentados:** **Maria**, batizada em 23 de agosto de 1777 nas Minas do Piracatu (freguesia da Manga) — a transcrição disponível a lê nascida no dia *doze* do mês, ao passo que uma releitura da recuperação deu dia dezesseis; a discrepância permanece sem solução (PAR-0025). **Cezário José da Silva Lima** — *Furriel* e testemunha no casamento da irmã em 1810, *Capitão* em 1838, ⚭ Joanna Umbelina de Jesus, cuja filha Carolina, no batismo de 1838, tem Amaro × Ignez nomeados como avós paternos (PAR-0026; filho documentado de F-0029). **Mathilde Maria de Jesus** (P-0027), nossa linha, casada com Ladisláo Egídio Ferreira de Toledo em São João del Rei em 1810.

  - **A rede FAN é a própria posição social.** No casamento de Mathilde em 1810 as duas testemunhas foram o Tenente Coronel Caetano José de Almeida e o próprio irmão dela, o Furriel Cezário (PAR-0023); no batismo do filho dela em 1813 os padrinhos foram esse mesmo Tenente Coronel e uma "Dona Anna Francisca de Lima" (PAR-0050) — uma mulher *de Lima*, descrita solteira, que pode ser outra filha ou sobrinha deste casal. [LEAD]

  - **O lado do noivo era par, não patrono:** Ladisláo era filho do **Capitão** Joaquim José Ferreira de Toledo (PAR-0023). Filha de Alferes casou com filho de Capitão — as duas casas se equivaliam.

  ## O que podemos extrapolar

  - **Sua posição social foi CONQUISTADA, não herdada — e conquistada no único lugar onde isso era possível** [INFERRED / CONTEXTUAL]. A escala de patentes corre do pai (grau de sargento, incerto) ao Alferes, ao Capitão, ao filho Capitão. Uma patente que *sobe* ao longo de três gerações é a assinatura de uma família que constrói posição em vez de mantê-la, e a fronteira do ouro e do gado de Goiás/Paracatú era exatamente onde ofício militar-administrativo, terra e condição de branco livre ainda podiam ser reunidos pelo filho de um recém-chegado. O retorno é mensurável em um único ato: o casamento de 1810, em que sua filha se casou com o filho de um Capitão como igual social.

  - **A patente não pagava nada, logo o dinheiro estava em outro lugar — e estava em pessoas e em terra** [CONTEXTUAL quanto ao salário; PROVEN quanto ao capital]. Oficiais das Ordenanças e, depois, da Guarda Nacional serviam *gratuitamente*. O que tornava esta família solvente aparece a jusante, não em seus próprios papéis: uma **mulher escravizada, Martinha, doada ao dote de Mathilde** pelo Capitão Manoel Rodrigues de Lima "para ajuda de seu dote" (a certidão embutida em PRB-0006), e a própria Mathilde **comprando a Fazenda da Concórdia como viúva em 1862** (PRB-0007). Isso é capital transmissível — terra e trabalho escravizado —, e é o contraste decisivo com o lado paterno Armond, cujos ofícios de polícia, igualmente não remunerados, não se assentavam sobre terra alguma e por isso transmitiam status e nada mais.

  - **A sucessão partível fez então sua aritmética, e aqui ela é documentada, não suposta** [aritmética PROVEN / lei CONTEXTUAL]. O direito sucessório brasileiro dividia o espólio igualmente entre todos os filhos. O inventário de Mathilde de 1879 (PRB-0006) arrola **oito herdeiros**; a cota do herdeiro nº 4 foi então repartida entre **oito representantes** — de modo que um patrimônio de escala de fazenda chegou aos bisnetos de Amaro a cerca de **um sessenta e quatro avos** cada. O espólio dele próprio não foi localizado, mas a mesma lei o regia, e ele teve ao menos três filhos.

  - **As letras acompanhavam o ofício e o sexo, não a riqueza** [PROVEN quanto a Mathilde; INFERRED quanto a ele]. Ele era alfabetizado por ofício. Sua filha Mathilde — da mesma casa, proprietária de terra e de pessoas escravizadas — assinou **a rogo** em 1870, atestação explícita de analfabetismo. A escolarização, nesse período, era privilégio comprado e ligado à classe, que precisava ser recomprado a cada geração, e foi comprado para os homens que dele precisavam para exercer uma patente. A capacidade patrimonial não comprou letra alguma às mulheres desta família.

  - **Aqui a migração foi acumulação, não fuga** [INFERRED]. Meia Ponte (Goiás) → Paracatú / Manga em 1777 → Barbacena nos anos 1790 → São João del Rei em 1810: cada deslocamento trocou oportunidade bruta de fronteira por lugar na sociedade estabelecida, e a família chegou com a patente intacta. É o oposto do arco Armond posterior, em que a mudança para a cidade significou chegar sem terra nenhuma.

  - **O arco geracional em sua própria linha é ascendente, e ele é a dobradiça** [INFERRED]. Um pai imigrante de Guimarães com patente mal legível, uma mãe nascida em São Paulo, um filho (ele mesmo) que fez Alferes e depois Capitão, uma filha que casou com os Toledo proprietários e morreu dona de uma fazenda. O ponto de virada é o casamento de 1810; tudo o que vem depois pertence aos perfis Toledo e Armond, onde o mesmo patrimônio se fragmenta e os descendentes se urbanizam.

  ## Questões em aberto

  - Seu próprio batismo/casamento (Meia Ponte, Goiás, anos 1750), para confirmar o nascimento por fonte primária. [OPEN] Inalcançável no FamilySearch, que não tem registros eclesiásticos coloniais de Goiás microfilmados; alvo de visita presencial ou pedido ao arquivo, na Diocese de Goiás / Paróquia N.S. do Rosário de Meia Ponte (Pirenópolis). [negativo delimitado, 2026-08-13]

  - Resolver a origem Meia Ponte vs Barbacena. [OPEN]

  - Sobre o que, de fato, se assentava a posição miliciana: não há inventário, sesmaria ou escritura em seu nome entre as fontes disponíveis. Nenhuma concessão de terra está catalogada para ele, para seu pai ou para os sobrenomes Silva Xavier / Silva Barreto na Plataforma SILB (verificado em 2026-08-13, 0 sesmeiros) — coerente com a subdigitalização dos registros fundiários coloniais de Goiás / Paracatú, de modo que a ausência ali não é ausência do registro; qualquer concessão estaria fora do SILB (Arquivo Público Mineiro / Arquivo do Estado de SP). [negativo delimitado]

  - Se ele estava vivo em 1838, quando a certidão o trata por Capitão. [OPEN]

  ## Fontes disponíveis (neste repositório)

  - PAR-0023 (casamento de sua filha Mathilde em São João del Rei, 1810 — "Alferes Amaro da Silva Xavier", pai da noiva; nomeia as testemunhas) · PAR-0025 (batismo de sua filha Maria no Piracatu, 1777 — nomeia-o, dá sua origem em Meia Ponte e os quatro avós) · PAR-0026 (batismo de sua neta Carolina em São José del-Rei, 1838 — "Capitão Amaro da Silva Xavier" como avô paterno, pelo filho Cezário).

  - Contexto a jusante, não registros sobre ele: PAR-0050 (batismo de seu neto José Cezário, 1813) · PRB-0006 e PRB-0007 (o inventário de 1879 de sua filha Mathilde e a compra da Concórdia por ela em 1862).

  ## Contexto regional e migratório

  Meia Ponte (Goiás) → Paracatú / Manga, onde sua filha Maria foi batizada em 1777 → Barbacena, onde Mathilde cresceu → São João del Rei, onde ela se casou: uma família móvel de oficiais milicianos acompanhando a fronteira setecentista do ouro e do gado, da capitania de São Paulo para o interior e daí para o coração de Minas. Seus pais encarnavam as duas correntes de origem — um pai imigrante do Minho (Guimarães) e uma mãe nascida em São Paulo. [CONTEXTUAL] O ramo acompanha a corrente maior do século XVIII, Minho → São Paulo colonial → fronteira de Minas/Goiás: o Minho era o minifúndio rural mais denso da Europa (~96 habitantes/km² em 1801) e a maior fonte isolada da emigração portuguesa para o Brasil; o deslocamento para as minas corria sob o regime de passaportes da Provisão de 20 de março de 1720 (D. João V), e a terra de fronteira sob o sistema colonial de sesmarias. [CONTEXTUAL]

