profile: >-
  ## Identity

  **Amaro da Silva Xavier**, a militia officer — styled **Alferes** in his daughter
  Mathilde's 1810 marriage (PAR-0023) and **Capitão** by 1838 in his granddaughter
  Carolina's baptism (PAR-0026) [PROVEN]. He is the father of Mathilde Maria de Jesus
  (P-0027), hence a direct-line ancestor — Eliza Balbina de Toledo's great-grandfather
  on her father's maternal line.

  - **Origin — a material conflict, both preserved:** PAR-0025 (1777, the earlier and more
  specific source) states him "natural da freguesia de Nossa Senhora do Rio de Meia Ponte,
  comarca do Goyas" (today Pirenópolis, GO); PAR-0023 (1810) describes both him and Ignez
  as "naturais e batizados da Freguesia de Barbacena" — most likely a long-term Barbacena
  domicile. [PROVEN for both; conflict flagged]

  - **Marriage:** ⚭ Ignez Francisca de Lima (P-0060), family F-0029; the marriage act is
  not held.

  - **Parents:** Amaro da Silva Barreto (P-0064, of Guimarães, Arcebispado de Braga,
  Portugal) × Perpétua da Silva (P-0065, of the Cidade de São Paulo), confirmed by PAR-0025
  (family F-0031).

  - **Death:** after 1810 (named as Mathilde's living father at her marriage) [INFERRED];
  his own baptism and death are not located. Nationality Brazilian.

  ## Standing and profession

  - **Alferes rising to Capitão** [PROVEN] — the family's militia standing rose across
  three generations: his father a sergeant (rank uncertain in the source), himself an
  Alferes then Capitão, and his son Cezário a Capitão.

  - **Literacy — [INFERRED — office]:** as an Alferes on that rising Sargento → Alferes →
  Capitão ladder, his office presupposes literacy, but no autograph or *a rogo* signature
  survives in the held records to confirm it.

  ## Family and social network

  - Wife: Ignez Francisca de Lima (P-0060). Documented children: Maria (baptised 23 August
  1777, born 16 August 1777, Piracatu / Manga parish, PAR-0025); Cezário José da Silva Lima
  (Capitão, ⚭ Joanna Umbelina de Jesus, whose 1838 daughter's baptism PAR-0026 names Amaro ×
  Ignez — a documented child of F-0029); and Mathilde Maria de Jesus (P-0027, our line, baptised
  at Barbacena, via PAR-0023). A "Dona Anna Francisca de Lima" appears as an unmarried godmother
  at grandson José Cesário's 1813 baptism — possibly a further daughter or a niece. [LEAD]

  ## What we can extrapolate

  A frontier militia-officer lineage: an Alferes son of a Portuguese-immigrant father from
  Guimarães (Braga) and a São Paulo-born mother, whose daughters and grandchildren married
  into the Barbacena Toledo elite. The origin conflict (Goiás vs Barbacena) fits a mobile
  officer family moving south-east from the Goiás / Paracatú frontier into the Minas
  heartland. [INFERRED]

  - **Status earned on a rising three-generation militia ladder** [INFERRED / CONTEXTUAL] —
  sergeant-rank father → Alferes (himself) → Capitão (his son Cezário). A rank climbing across
  three generations is the signature of a family *building* standing on the 18th-century
  gold-and-cattle frontier, where military-administrative office, land and free-white status
  reinforced one another; it is what let his daughter Mathilde marry the Capitão-descended
  Toledo Ladisláo as a social peer.

  - **The militia ladder itself paid no wage — its worth was privilege atop transmissible land**
  [CONTEXTUAL — role-based]. The colonial Companhias de Ordenanças were unremunerated ("forças
  militares não remuneradas") and the Guarda Nacional that succeeded them served gratuitously;
  the rising rank *certified* free-white, propertied, locally-authoritative standing but added no
  salary. Its economic value was privilege sitting on top of a land base (the Toledo /
  Silva-Xavier fazendas and enslaved labour), so the standing was heritable — the precise
  contrast with the Armond paternal side, whose equally-unpaid police offices stood on no land
  and so left only status once the office ended.

  ## Open questions

  - His own baptism/marriage (Meia Ponte, Goiás, ~1750s) to primary-confirm his birth.
  [OPEN] — not reachable on FamilySearch (which holds no microfilmed colonial church records for
  Goiás); an on-site / archive-request target at the Diocese de Goiás / Paróquia N.S. do Rosário
  de Meia Ponte (Pirenópolis). [bounded-negative, 2026-08-13]

  - Resolving the Meia Ponte vs Barbacena origin. [OPEN]

  - No land grant (sesmaria) is catalogued for him, his father, or the bare Silva Xavier /
  Silva Barreto surnames in the Plataforma SILB (checked 2026-08-13, 0 grantees) — consistent
  with the under-digitisation of colonial Goiás / Paracatú land records, so absence there is not
  absence of the underlying record; any grant would sit off-SILB (Arquivo Público Mineiro /
  Arquivo do Estado de SP). [bounded-negative]

  ## Sources held (this repository)

  - PAR-0023 (1810 São João del Rei marriage of daughter Mathilde — "Alferes Amaro da Silva
  Xavier", parent of the bride) · PAR-0025 (1777 Piracatu baptism of daughter Maria — names
  him, his Meia Ponte origin, and all four grandparents) · PAR-0026 (1838 São João del Rei
  baptism of granddaughter Carolina — "Capitão Amaro da Silva Xavier" as paternal
  grandparent, via son Cezário).

  ## Regional and migration context

  Meia Ponte (Goiás) → Paracatú / Manga (daughter Maria baptised there 1777) → Barbacena
  (daughter Mathilde) — a mobile militia-officer family riding the 18th-century
  gold-and-cattle frontier from the São Paulo captaincy inland and into the Minas
  heartland, where his daughter married the Toledo Ladisláo. His parents embodied the two
  feeder streams: a Minho (Guimarães) immigrant father and a São Paulo-born mother.
  [CONTEXTUAL] The branch rides the broader 18th-century Minho → colonial São Paulo →
  Minas/Goiás-frontier stream: the Minho was Europe's densest rural minifúndio (~96
  inhabitants/km² by 1801) and the single greatest source of Portuguese emigration to Brazil;
  movement to the goldfields ran under the Provisão de 20 de março de 1720 (D. João V) passport
  regime, and frontier land under the colonial sesmaria system. [CONTEXTUAL]

  ## Where to go today

  - **Origin parish (baptism, ~1750s):** Igreja Matriz de Nossa Senhora do Rosário, Pirenópolis, GO
  (ex-Meia Ponte; colonial matriz from 1728; coords -15.852778, -48.958889) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-15.852778,-48.958889)

  - **Family seat (daughter Maria's 1777 baptism):** Igreja Matriz de Santo Antônio, Paracatu, MG
  (leading candidate for the Paracatú/Manga parish) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Barbacena seat (daughter Matilde's 1795 baptism):** Catedral Basílica Nossa Senhora da Piedade,
  Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
profile_pt: >-
  ## Identidade

  **Amaro da Silva Xavier**, um oficial de milícia — tratado por **Alferes** no casamento
  de 1810 de sua filha Mathilde (PAR-0023) e por **Capitão** em 1838 no batismo de sua neta
  Carolina (PAR-0026) [PROVEN]. É o pai de Mathilde Maria de Jesus (P-0027) e, portanto, um
  ancestral da linha direta — bisavô de Eliza Balbina de Toledo na linha materna de seu pai.

  - **Origem — um conflito material, ambas as versões preservadas:** PAR-0025 (1777, a
  fonte mais antiga e mais específica) o declara "natural da freguesia de Nossa Senhora do
  Rio de Meia Ponte, comarca do Goyas" (hoje Pirenópolis, GO); PAR-0023 (1810) descreve
  tanto ele quanto Ignez como "naturais e batizados da Freguesia de Barbacena" — muito
  provavelmente um domicílio de longa data em Barbacena. [PROVEN para ambas; conflito
  sinalizado]

  - **Casamento:** ⚭ Ignez Francisca de Lima (P-0060), família F-0029; o assento de
  casamento não está disponível.

  - **Pais:** Amaro da Silva Barreto (P-0064, de Guimarães, Arcebispado de Braga, Portugal)
  × Perpétua da Silva (P-0065, da Cidade de São Paulo), confirmados por PAR-0025 (família
  F-0031).

  - **Óbito:** depois de 1810 (nomeado como pai vivo de Mathilde em seu casamento)
  [INFERRED]; seu próprio batismo e óbito não estão localizados. Nacionalidade brasileira.

  ## Posição social e profissão

  - **Alferes que ascende a Capitão** [PROVEN] — o prestígio de milícia da família subiu ao
  longo de três gerações: seu pai um sargento (patente incerta na fonte), ele próprio
  Alferes e depois Capitão, e seu filho Cezário um Capitão.

  - **Alfabetização — [INFERRED — cargo]:** como Alferes naquela escada ascendente Sargento →
  Alferes → Capitão, seu cargo pressupõe alfabetização, mas nenhuma assinatura autógrafa ou
  *a rogo* sobrevive nos registros disponíveis para confirmá-la.

  ## Família e rede social

  - Esposa: Ignez Francisca de Lima (P-0060). Filhos documentados: Maria (bat. 23 de agosto
  de 1777, nascida em 16 de agosto de 1777, freguesia de Piracatú / Manga, PAR-0025); Cezário
  José da Silva Lima (Capitão, ⚭ Joanna Umbelina de Jesus, cujo batismo da filha em 1838 —
  PAR-0026 — nomeia Amaro × Ignez, um filho documentado de F-0029); e Mathilde Maria de Jesus
  (P-0027, nossa linha, batizada em Barbacena, via PAR-0023). Uma "Dona Anna Francisca de Lima"
  aparece como madrinha solteira no batismo de 1813 do neto José Cesário — possivelmente uma
  outra filha ou uma sobrinha. [LEAD]

  ## O que podemos extrapolar

  Uma linhagem de oficial de milícia de fronteira: um Alferes filho de um pai imigrante
  português de Guimarães (Braga) e de uma mãe nascida em São Paulo, cujas filhas e netos se
  casaram com a elite Toledo de Barbacena. O conflito de origem (Goiás vs Barbacena) condiz
  com uma família de oficial móvel deslocando-se para sudeste, da fronteira de Goiás /
  Paracatú para o coração de Minas. [INFERRED]

  - **Prestígio conquistado numa escada de milícia ascendente ao longo de três gerações**
  [INFERRED / CONTEXTUAL] — pai com patente de sargento → Alferes (ele próprio) → Capitão (seu
  filho Cezário). Uma patente que sobe ao longo de três gerações é a assinatura de uma família
  que *constrói* prestígio na fronteira do ouro e do gado do século XVIII, onde ofício
  militar-administrativo, terra e a condição de branco livre se reforçavam mutuamente; foi o que
  permitiu à sua filha Mathilde casar-se com o Toledo Ladisláo, descendente de Capitão, como
  igual social.

  - **A própria escada de milícia não pagava salário — seu valor era o privilégio assentado
  sobre terra transmissível** [CONTEXTUAL — baseado no cargo]. As coloniais Companhias de
  Ordenanças eram não remuneradas ("forças militares não remuneradas") e a Guarda Nacional que as
  sucedeu servia gratuitamente; a patente ascendente *certificava* a condição de branco livre,
  proprietário e com autoridade local, mas não acrescentava salário. Seu valor econômico era o
  privilégio assentado sobre uma base de terra (as fazendas Toledo / Silva-Xavier e o trabalho
  escravizado), de modo que o prestígio era herdável — o contraste exato com o lado paterno
  Armond, cujos cargos policiais igualmente não remunerados não se assentavam sobre terra alguma
  e, por isso, deixavam apenas status quando o cargo terminava.

  ## Questões em aberto

  - Seu próprio batismo/casamento (Meia Ponte, Goiás, ~1750s) para confirmar por registro
  primário seu nascimento. [OPEN] — não acessível no FamilySearch (que não possui registros
  eclesiásticos coloniais microfilmados de Goiás); é um alvo presencial / de solicitação a
  arquivo, na Diocese de Goiás / Paróquia N.S. do Rosário de Meia Ponte (Pirenópolis).
  [bounded-negative, 2026-08-13]

  - Resolver a origem Meia Ponte vs Barbacena. [OPEN]

  - Nenhuma sesmaria está catalogada para ele, seu pai ou os sobrenomes puros Silva Xavier /
  Silva Barreto na Plataforma SILB (verificada em 2026-08-13, 0 sesmeiros) — consistente com a
  subdigitalização dos registros fundiários coloniais de Goiás / Paracatú, de modo que essa
  ausência não é ausência do registro subjacente; qualquer sesmaria estaria fora do SILB
  (Arquivo Público Mineiro / Arquivo do Estado de SP). [bounded-negative]

  ## Fontes disponíveis (neste repositório)

  - PAR-0023 (casamento de 1810 em São João del Rei da filha Mathilde — "Alferes Amaro da
  Silva Xavier", pai da noiva) · PAR-0025 (batismo de 1777 em Piracatu da filha Maria — o
  nomeia, sua origem em Meia Ponte, e todos os quatro avós) · PAR-0026 (batismo de 1838 em
  São João del Rei da neta Carolina — "Capitão Amaro da Silva Xavier" como avô paterno, via
  o filho Cezário).

  ## Contexto regional e migratório

  Meia Ponte (Goiás) → Paracatú / Manga (filha Maria batizada ali em 1777) → Barbacena
  (filha Mathilde) — uma família de oficial de milícia móvel, cavalgando a fronteira do
  ouro e do gado do século XVIII, da capitania de São Paulo para o interior e para o
  coração de Minas, onde sua filha se casou com o Toledo Ladisláo. Seus pais encarnavam as
  duas correntes de origem: um pai imigrante do Minho (Guimarães) e uma mãe nascida em São
  Paulo. [CONTEXTUAL] O ramo acompanha a corrente mais ampla do século XVIII, do Minho → São
  Paulo colonial → fronteira de Minas/Goiás: o Minho era o minifúndio rural mais denso da Europa
  (~96 habitantes/km² por volta de 1801) e a maior fonte isolada de emigração portuguesa para o
  Brasil; o deslocamento para as minas de ouro corria sob o regime de passaportes da Provisão de
  20 de março de 1720 (D. João V), e a terra de fronteira sob o sistema colonial de sesmarias.
  [CONTEXTUAL]

  ## Onde ir hoje

  - **Paróquia de origem (batismo, ~1750s):** Igreja Matriz de Nossa Senhora do Rosário, Pirenópolis,
  GO (ex-Meia Ponte; matriz colonial desde 1728; coordenadas -15.852778, -48.958889) [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=-15.852778,-48.958889)

  - **Sede da família (batismo de 1777 da filha Maria):** Igreja Matriz de Santo Antônio, Paracatu, MG
  (principal candidata para a paróquia de Paracatú/Manga) [APPROX] · [Maps](https://www.google.com/maps/search/?api=1&query=Igreja%20Matriz%20de%20Santo%20Ant%C3%B4nio%2C%20Paracatu%2C%20MG)

  - **Sede em Barbacena (batismo de 1795 da filha Matilde):** Catedral Basílica Nossa Senhora da
  Piedade, Barbacena, MG [RESOLVED] · [Maps](https://www.google.com/maps/search/?api=1&query=Catedral%20Bas%C3%ADlica%20Nossa%20Senhora%20da%20Piedade%2C%20Barbacena%2C%20MG)
