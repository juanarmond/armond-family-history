    Eliza Balbina de Toledo (P-0017) on her father's maternal line. He is named in
    his daughter's 1810 São João del Rei marriage record (PAR-0023) as "Alferes Amaro
    da Silva Xavier." In the 1777 Piracatu baptism of his daughter Maria (PAR-0025) he
    is stated as "natural da frequesia de Nossa Senhora do Rio de Meia Ponte, comarca
