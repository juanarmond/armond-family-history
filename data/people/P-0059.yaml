notes:
- text: >-
    Father of Mathilde Maria de Jesus (P-0027); hence great-great-grandfather of
    Eliza Balbina de Toledo (P-0017) on her maternal-paternal line. He is named in
    his daughter's 1810 São João del Rei marriage record (PAR-0023) as "Alferes Amaro
    da Silva Xavier." In the 1777 Piracatu baptism of his daughter Maria (PAR-0025) he
    is stated as "natural da frequesia de Nossa Senhora do Rio de Meia Ponte, comarca
    do Goyas, Bispado do Rio de Janeiro" — native of today's Pirenópolis (GO). His
    parents are confirmed by PAR-0025 as Amaro da Silva Barreto (P-0064, from
    Guimarães, Portugal) × Perpétua da Silva (P-0065, from the city of São Paulo).
    Material conflict: PAR-0023 (1810) states both he and Ignez as "naturais e
    batizados da Freguesia de Barbacena," while PAR-0025 (1777) names him as native
    of Meia Ponte (Goiás). The 1777 record is the earlier and more specific source;
    the 1810 description likely reflects long-term Barbacena domicile. Both versions
    preserved. His own baptism and death records have not been located.
  text_pt: >-
    Pai de Mathilde Maria de Jesus (P-0027); portanto, trisavô de Eliza Balbina
    de Toledo (P-0017) em sua linha materna-paterna. Ele é nomeado no registro de
    casamento de 1810 de sua filha em São João del Rei (PAR-0023) como "Alferes
    Amaro da Silva Xavier." No batismo de 1777 de sua filha Maria em Piracatu
    (PAR-0025) ele é declarado como "natural da frequesia de Nossa Senhora do Rio
    de Meia Ponte, comarca do Goyas, Bispado do Rio de Janeiro" — natural da atual
    Pirenópolis (GO). Seus pais são confirmados por PAR-0025 como Amaro da Silva
    Barreto (P-0064, de Guimarães, Portugal) × Perpétua da Silva (P-0065, da
    cidade de São Paulo). Conflito material: PAR-0023 (1810) declara tanto ele
    quanto Ignez como "naturais e batizados da Freguesia de Barbacena", enquanto
    PAR-0025 (1777) o nomeia como natural de Meia Ponte (Goiás). O registro de
    1777 é a fonte mais antiga e mais específica; a descrição de 1810
    provavelmente reflete um domicílio de longa data em Barbacena. Ambas as
    versões preservadas. Seus próprios registros de batismo e óbito não foram
    localizados.
