schema_version: 1
id: PL-0005
preferred_name: Santo Antônio de Sapucaia, Rio de Janeiro, Brazil
name_variants:
- value: Curato de Santo Antônio de Sapucaia
  source_ids:
  - PAR-0001
  note: Source-language jurisdictional form (destination parish) in the 1882 provision.
place_type: parish
historical_jurisdiction: >-
  Roman Catholic curato/freguesia of Santo Antônio de Sapucaia (a parish from
  1871), in the interior of the province of Rio de Janeiro, Empire of Brazil,
  named as the intended marriage parish in the 23 December 1882 provision
  issued at the Court of Rio de Janeiro.
current_equivalent: Sapucaia, Rio de Janeiro, Brazil
source_ids:
- PAR-0001
notes:
- text: >-
    Corrected on 28 July 2026. An earlier record modelled this place as the
    Espírito Santo parish of the Court of Rio de Janeiro; re-examination of the
    PAR-0001 image shows that wording belongs to the adjacent José Pereira
    Mendes provision, and this couple's destination is Santo Antônio de
    Sapucaia. The surviving Sapucaia marriage-book series remains to be
    identified before a manual ceremony-entry search.
