abstract: >-
  A certified derivative of the subject's Brazilian civil birth registration
  (10th District of Rio de Janeiro, livro A-350, folha 98, número de ordem
  24241) reports his birth at 03:45 on 22 June 1982 in the Hospital Carmela
  Dutra, Rio de Janeiro; parents Luis Carlos Igracio Armond and Lucinea
  Aparecida Muniz Armond; and grandparents Geraldo Paz Armond, Cidalia Igracio
  Armond, Antenor Muniz and Iris Bohrer Muniz. The father was the declarant.
