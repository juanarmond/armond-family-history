transcription: >-
  [Livro de Baptismos, Nova Friburgo, fólio 19, nº 179, 1899; Cônego José Silvestre Alves de
  Miranda.] "179 — Celina. Aos vinte sete dias do mes de Setembro de mil oito centos e noventa
  e nove baptisei solemnemente a Celina, nascida á treze de Maio do dito anno, filha legitima
  de Joaquim José Bos[b]ere e Lucinda Ferreira Bor[b]er. Forão padrinhos José da Silva Ferreira
  e Maria da Gloria da Silva Ferreira. Para constar fiz este assento, que assigno. O Vigario
  Conego José Silvestre Alves de Miranda." [surnames inked "Bos[b]ere" / "Bor[b]er", variants
  of Bohrer.]
abstract: >-
  Parish baptism of Celina Bohrer (P-0015) — Iris Bohrer Muniz's mother — born 13 May 1899,
  baptised 27 September 1899 at São João Baptista, Nova Friburgo, legitimate daughter of Joaquim
  José Bohrer (P-0030) × Lucinda Ferreira (P-0031). A primary act that CORRECTS her birth to 13
  May 1899 (previously inferred ~1900 from her 1977 death age) and confirms her parentage;
  upgrades that link secondary→primary. Godparents José and Maria da Gloria da Silva Ferreira
  (maternal kin).
abstract_pt: >-
  Batismo paroquial de Celina Bohrer (P-0015) — mãe de Iris Bohrer Muniz — nascida em 13 de maio
  de 1899, batizada em 27 de setembro de 1899 em São João Baptista, Nova Friburgo, filha legítima
  de Joaquim José Bohrer (P-0030) × Lucinda Ferreira (P-0031). Ato primário que CORRIGE seu
  nascimento para 13 de maio de 1899 (antes inferido ~1900 pela idade em seu óbito de 1977) e
  confirma sua filiação; eleva esse vínculo de secundário para primário. Padrinhos José e Maria
  da Gloria da Silva Ferreira (parentela materna).
