transcription: >-
  [Trauregister, Nova Friburgo, S.9, 1847, Nr. 1.] "Den 3ten Febr[uar] wurden Conrad Schenkel,
  ehel[icher] leibl[icher] Sohn von dem [Bürger?] Heinrich Schenkel, mit Louisa [St]offel,
  ehel[iche] ledige Tochter von dem Schweizer Colonisten Joseph [St]offel, copuliert. Zeugen waren
  ihr Gustav Lenenroth, Handelsmann [wohnhaft?], und Paul Lenenroth, ebenfalls Handelsmann. —
  Gustav Lenenroth, Pastor."
transcription_pt: >-
  [Registro de casamentos, Nova Friburgo, p.9, 1847, nº 1.] "No dia 3 de fevereiro casaram-se
  Conrad Schenkel, filho legítimo do [cidadão?] Heinrich Schenkel, com Louisa [St]offel, filha
  legítima solteira do colono suíço Joseph [St]offel. Foram testemunhas Gustav Lenenroth,
  comerciante, e Paul Lenenroth, igualmente comerciante. — Gustav Lenenroth, Pastor."
abstract: >-
  Lutheran marriage of Conrad Schenkel (P-0107) and Louisa — i.e. Maria Luiza — Stoffel (P-0108),
  Iris Bohrer Muniz's Swiss-colony 4×-great-grandparents on the Schenkel line, on 3 February 1847
  at Nova Friburgo. NAMES BOTH FATHERS: Conrad is a son of Heinrich Schenkel; Louisa is a daughter
  of the Swiss colonist ("Schweizer Colonist") Joseph Stoffel. Source for the marriage event E-0091
  and the parent family F-0053 (new). Their daughter Maria Luisa Schenkel (P-0104) married Jakob
  Klein in 1872 (PAR-0068).
abstract_pt: >-
  Casamento luterano de Conrad Schenkel (P-0107) e Louisa — ou seja, Maria Luiza — Stoffel
  (P-0108), tetravós de linhagem suíça de Iris Bohrer Muniz na linha Schenkel, em 3 de fevereiro de
  1847, em Nova Friburgo. NOMEIA OS DOIS PAIS: Conrad é filho de Heinrich Schenkel; Louisa é filha
  do colono suíço ("Schweizer Colonist") Joseph Stoffel. Fonte do evento de casamento E-0091 e da
  família de pais F-0053 (nova). A filha Maria Luisa Schenkel (P-0104) casou-se com Jakob Klein em
  1872 (PAR-0068).
