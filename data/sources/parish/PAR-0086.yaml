transcription: >-
  [Image p2 (0072) — the marriage act, 26 September 1650, Santa Bárbara. Re-read under
  magnification on 2026-09-24. The leaf is torn and ink-damaged and the outer margin is lost,
  but the filiation clause — previously reported here as not visible — is legible. Unreadable
  passages are marked; nothing is supplied by conjecture.]

  [Right-margin heading, same hand, torn at the outer edge, reading downwards:]
  "Melchior / de Ponte / Cardo[so] / viuvo [de] / Barbora / G[a]tta / com Ma / riana / Fagund[a]"

  [Body:]
  "Em os vinte e seis dias do mes de Setembro de
  mil seis centos e sincoenta a[n]nos, por mandado
  do [...] Prouisor [...] in facie eclesi[a]e [...] e por mim
  Sacrist[ão] [...] a Melchior de Ponte Cardoso viuvo
  de Barbara Gata, fregues da villa de S. Sebas-
  tião, com Mariana Fagunda filha do [one word illegible]
  Ant.º Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada de
  [...]tia, freg[uese]s desta freguesia. Foraõ t[estemunh]as pre-
  sentes o Capitão Andre Coelho [...]
  [...] e Balthesar Henriques [...]
  [...] da villa, e M[ari]a [...] mulher do Capitão [...]
  [...] Barbara Dias[uncertain] m[ulhe]r do Alferes [...]
  [...] [signature, illegible]"

  ⚠ Reading notes. (a) The filiation clause is the evidentiary core and is secure for the
  two names: "Mariana Fagunda filha do [illegible] Ant.º Machado e de sua m[ulhe]r
  C.ta Machada". (b) The word between "filha do" and "Ant.º" is a single faded word, very
  probably a militia or civil style, and is NOT readable at the held resolution — it is left
  as [illegible] rather than guessed. (c) The mother's given name is written abbreviated,
  a capital C with a superscript "ta"; it is expanded here as Cat(arin)a. (d) The place
  following "Machada de" runs onto the next line, whose opening is destroyed by the tear;
  it is left unread. (e) The witness block is only partly legible; the names given above
  are read directly from the image and the uncertain one is marked.

  [Context page p1 (0071): prior entries, partially legible, different marriages]
  [Context page p3 (0073): margin "Ant.º gli na Com.ª 1651 / Fren Fern.do Com[p]s[...]na de
  Costa" — a different 1651 marriage entry on the following page]
transcription_pt: >-
  [Imagem p2 (0072) — assento de casamento, 26 de setembro de 1650, Santa Bárbara. Relido com
  ampliação a 2026-09-24. A folha está rasgada e com perda de tinta e a margem exterior perdeu-se,
  mas a cláusula de filiação — que aqui se dava como não visível — está legível. As passagens
  ilegíveis vão assinaladas; nada é suprido por conjectura.]

  [Cabeçalho da margem direita, mesma mão, rasgado na borda exterior, a ler de cima para baixo:]
  "Melchior / de Ponte / Cardo[so] / viuvo [de] / Barbora / G[a]tta / com Ma / riana / Fagund[a]"

  [Corpo:]
  "Em os vinte e seis dias do mes de Setembro de
  mil seis centos e sincoenta a[n]nos, por mandado
  do [...] Prouisor [...] in facie eclesi[a]e [...] e por mim
  Sacrist[ão] [...] a Melchior de Ponte Cardoso viuvo
  de Barbara Gata, fregues da villa de S. Sebas-
  tião, com Mariana Fagunda filha do [uma palavra ilegível]
  Ant.º Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada de
  [...]tia, freg[uese]s desta freguesia. Foraõ t[estemunh]as pre-
  sentes o Capitão Andre Coelho [...]
  [...] e Balthesar Henriques [...]
  [...] da villa, e M[ari]a [...] mulher do Capitão [...]
  [...] Barbara Dias[leitura incerta] m[ulhe]r do Alferes [...]
  [...] [assinatura ilegível]"

  ⚠ Notas de leitura. (a) A cláusula de filiação é o núcleo probatório e é segura quanto aos
  dois nomes: "Mariana Fagunda filha do [ilegível] Ant.º Machado e de sua m[ulhe]r
  C.ta Machada". (b) A palavra entre "filha do" e "Ant.º" é uma única palavra esbatida, muito
  provavelmente uma patente ou um tratamento, e NÃO é legível na resolução disponível — fica
  como [ilegível] e não é adivinhada. (c) O nome próprio da mãe está abreviado, um C maiúsculo
  com "ta" sobrescrito; expande-se aqui como Cat(arin)a. (d) O lugar que segue "Machada de"
  passa para a linha seguinte, cujo início está destruído pelo rasgão; fica por ler. (e) O bloco
  das testemunhas é só parcialmente legível; os nomes acima são lidos directamente da imagem e
  o incerto vai assinalado.
abstract: >-
  Primary parish marriage record for Belchior da Ponte Cardoso × Mariana Fagundes, Santa
  Bárbara, Terceira, 26 September 1650. Image p2 (casamentos-0072) carries the act, headed
  in the right margin "Melchior de Ponte Cardo[so] viuvo [de] Barbora G[a]tta com Mariana
  Fagund[a]". The act states that the groom was a widower of Bárbara Gata and a parishioner
  of the villa de São Sebastião, and — this is the evidentiary addition of the 2026-09-24
  magnified re-read — it **names the bride's parents**: "Mariana Fagunda filha do [illegible]
  Ant.º Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada". The record therefore establishes
  at primary level both the marriage (date, place, parties) and Mariana Fagundes's parentage,
  which until now rested on Mendes Forjaz Vol. IV (PUB-0004) alone. The compiled forms
  "António Martins Fagundes ou Machado Fagundes" and "Catarina Machado de Faria" are
  confirmed by, not replaced by, the register's shorter "Ant.º Machado" and "C.ta Machada".
  Image quality is limited (511×702 px) and the leaf is torn; several passages remain unread.
abstract_pt: >-
  Registo paroquial primário do casamento de Belchior da Ponte Cardoso × Mariana Fagundes,
  Santa Bárbara, Terceira, 26 de setembro de 1650. A imagem p2 (casamentos-0072) traz o
  assento, encabeçado na margem direita por "Melchior de Ponte Cardo[so] viuvo [de] Barbora
  G[a]tta com Mariana Fagund[a]". O assento declara que o noivo era viúvo de Bárbara Gata e
  freguês da villa de São Sebastião e — e este é o acréscimo probatório da releitura ampliada
  de 2026-09-24 — **nomeia os pais da noiva**: "Mariana Fagunda filha do [ilegível] Ant.º
  Machado e de sua m[ulhe]r C.ta [Cat(arin)a] Machada". O registo estabelece, portanto, ao
  nível primário, tanto o casamento (data, lugar, nubentes) como a filiação de Mariana
  Fagundes, que até agora assentava apenas em Mendes Forjaz, Vol. IV (PUB-0004). As formas
  compiladas "António Martins Fagundes ou Machado Fagundes" e "Catarina Machado de Faria"
  são confirmadas — e não substituídas — pelas formas curtas do livro, "Ant.º Machado" e
  "C.ta Machada". A qualidade da imagem é limitada (511×702 px) e a folha está rasgada;
  várias passagens ficam por ler.
reliability:
  assessment: >-
    Primary source (original parish register), contemporary with the event and written by
    the officiating clergy. The right-margin heading on p2 names both parties; the body gives
    the date in words, the groom's widowed status and parish, and the bride's filiation.
    On 2026-09-24 the act was re-read under magnification and the filiation clause proved
    legible: "Mariana Fagunda filha do [illegible] Ant.º Machado e de sua m[ulhe]r C.ta
    [Cat(arin)a] Machada". That clause is direct, primary evidence of Mariana Fagundes's
    parentage and is independent of the Mendes Forjaz compilation, which it confirms.
    The father's name is unambiguous in the hand; the mother's surname is unambiguous and her
    given name is written as the standard abbreviation (capital C with superscript "ta"),
    expanded as Cat(arin)a. Evidence quality is "confirmed" for the marriage and for the
    bride's parentage. Image resolution is limited (511×702 pixels per page) and the leaf is
    torn, so the officiant's formula, one word before the father's name, the place-name after
    "Machada de" and most of the witness list remain unread; a higher-resolution rescan would
    recover those, but it is no longer needed to establish the parentage.
  informant: Parish priest officiating the 1650 Santa Bárbara marriage ceremony
  limitations: >-
    Limited image resolution (511×702 px) and physical damage to the register prevent a full
    verbatim transcription. Specifically unread: the officiant's formula and title in lines
    3–4; the single word between "filha do" and "Ant.º Machado" (probably a style or militia
    rank, left as [illegible] rather than guessed); the place-name that begins after "C.ta
    Machada de" and runs into the torn opening of the next line; and most of the witness
    block, of which only "o Capitão Andre Coelho", "Balthesar Henriques" and a partly
    uncertain "Barbara Dias[uncertain], m[ulhe]r do Alferes" can be read. The exact folio/act
    number within the register is not established from the delivered images. The act names
    the bride's parents but says nothing about their own births, deaths or parentage.
    Image p1 (0071) and p3 (0073) are context pages — before and after the marriage act —
    showing other families' entries.
