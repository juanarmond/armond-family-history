transcription: >-
  [Image p2 — marriage act, 26 Sep 1650, Santa Bárbara]
  [Margin annotation, later index hand: "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes"]
  [Main text, partially legible due to damage and ink deterioration:]
  "... mil seis centos e sincoenta ... por marido de forma da Igr[eja] em face d[a] Par[ó]q[uia]
  ... a Belchior [da] Ponte Cardoso alias [Souto-Maior?] ...
  ... de Bárbara Gato [viúvo?] ... Mariana Fagundes filha de [António?] ...
  ... Ant[ó]nio medado[?] e de [Catarina?] nat[urais] de [Santa Bárbara?] ...
  ... [witnesses listed] Rodrigues ... [signatures] ..."
  [Context page p1 (0071): prior entries, partially legible, different marriages]
  [Context page p3 (0073): margin "Ant.º gli na Com.ª 1651 / Fren Fern.do Com[p]s[...]na de
  Costa" — a different 1651 marriage entry on the following page]

  ⚠ Transcription is partial: the original is damaged with ink loss and deterioration.
  The names "Belchior [da Ponte Cardoso]" and "Mariana Fagundes" are legible in the margin
  annotation (p2); the body text confirms the date 1650 and both parties' names but full
  verbatim transcription is not possible from the delivered image quality.
