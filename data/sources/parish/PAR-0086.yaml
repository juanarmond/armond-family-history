abstract: >-
  Primary parish marriage record for Belchior da Ponte Cardoso × Mariana Fagundes, Santa
  Bárbara, Terceira, 26 September 1650. Image p2 (casamentos-0072) shows the marriage entry
  with marginal index annotation naming both parties. The record confirms the marriage date
  and location, consistent with Vol. IV (PUB-0004) and Vol. IX (PUB-0005) of the Mendes
  Forjaz compilation. Image quality is limited due to physical damage to the register.
abstract_pt: >-
  Registo paroquial primário do casamento de Belchior da Ponte Cardoso × Mariana Fagundes,
  Santa Bárbara, Terceira, 26 de setembro de 1650. A imagem p2 (casamentos-0072) mostra
  o assento de casamento com anotação marginal de índice nomeando ambas as partes.
  O registo confirma a data e local do casamento, em consonância com os vols. IV e IX da
  compilação de Mendes Forjaz (PUB-0004, PUB-0005). A qualidade da imagem é limitada pela
  deterioração física do livro.
reliability:
  assessment: >-
    Primary source (original parish register). The marginal index annotation in p2 legibly
    names "Belchior [da Ponte Cardoso]" and "Mariana Fagundes"; the main body text is
    partially legible and confirms the 1650 date and the names. The confirmation of the
    26 September 1650 date is consistent with the cross-references in PUB-0004 and PUB-0005.
    Image resolution is limited (511×702 pixels per page), which constrains full verbatim
    transcription. Evidence quality is therefore "confirmed" for the marriage event itself
    (both parties' names and approximate date visible in the primary image), with partial
    transcription status flagged. A higher-resolution rescan would support a complete transcript.
  informant: Parish priest officiating the 1650 Santa Bárbara marriage ceremony
  limitations: >-
    Limited image resolution (511×702 px) and physical damage to the register prevent full
    verbatim transcription. The witnesses' names are not clearly legible. The exact folio/act
    number within the register is not established from the delivered images. Catarina Machado
    de Faria's parentage of Mariana is from PUB-0004, not visible in this image.
    Image p1 (0071) and p3 (0073) are context pages — before and after the marriage act —
    showing other families' entries.
