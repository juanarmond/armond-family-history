notes:
- text: >-
    The page designated "p1" in this source record is image 0071 (the preceding page in the
    register), "p2" is image 0072 (the Belchior × Mariana marriage act itself, confirmed by
    the marginal annotation), and "p3" is image 0073 (the following 1651 entry). The marriage
    act itself is on image 0072 (p2); images 0071 and 0073 provide register context.
- text: >-
    A higher-resolution rescan of this register (BPAR Angra) would still add value — the
    officiating priest's formula, the witness list and the act number remain unread, as does
    one word before the bride's father's name and the place-name after her mother's. It is,
    however, no longer needed to establish Mariana Fagundes's parentage; that is settled from
    the held image.
- text: >-
    CORRECTION, 2026-09-24. Both the earlier transcription here and the correspondence sent to
    BPAR Angra stated that the filiation lines of this act were not legible, and this record's
    limitations field said that Mariana's parentage was "from PUB-0004, not visible in this
    image". That was wrong. Under magnification of the already-held image
    (rec-armond-belchior-mariana-santa-barbara-1650-casamentos-0072.jpg, downloaded 2026-09-22)
    the clause reads "Mariana Fagunda filha do [illegible] Ant.º Machado e de sua m[ulhe]r
    C.ta [Cat(arin)a] Machada". No new acquisition was involved. The earlier reading
    "Ant[ó]nio medado[?]" was a misread of "Ant.º Machado". Any onward request to BPAR whose
    stated justification was to establish this filiation — including the testamento de Maria
    Fagundes (1642) request — should be re-justified or withdrawn before payment.
- text: >-
    Naming. The register gives the bride's parents in their short forms, "Ant.º Machado" and
    "C.ta Machada" (the feminine concord of the same surname, normal in this period). Mendes
    Forjaz Vol. IV § 6º gives them as "António Martins Fagundes (ou Machado Fagundes)" and
    "Catarina Machado de Faria". The register confirms the compiled identification at primary
    level for the fact it states — that these two were Mariana's parents — and nothing beyond
    that: the additional compiled elements (Martins, Fagundes, de Faria), his captaincy and
    his 1664 death remain [COMPILED] on PUB-0004 alone. "Machado", "Fagundes" and "de Faria"
    carry no implication of rank or origin.
- text: >-
    This is the only primary image held for the Belchior × Mariana marriage. It upgrades the
    evidence_quality for E-0128 from strong-evidence (compiled-only) to confirmed (primary
    image held showing both names and date).
