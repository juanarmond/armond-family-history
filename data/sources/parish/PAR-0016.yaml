notes:
- text: >-
    Resolves the earlier "weakened" doubt over Rosa's Itaboraí parentage: the
    apparent 8-year gap (1831→1841) in the couple's children was an indexing
    artifact — the 1832-1838 baptisms are unindexed (browse-only). Rosa's siblings
    Manoel (1831), Maria (1832), Anna (1834), Thomaz (1836), Polidoro (1838) and
    João/Maria (1841) were found in the same register (images held, not yet
    individually catalogued); the will's Candido Pereira de Lemos is a further
    (older, unlocated) brother.
