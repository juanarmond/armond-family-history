notes:
- text: >-
    Resolves the earlier "weakened" doubt over Rosa's Itaboraí parentage: the
    apparent 8-year gap (1831→1841) in the couple's children was an indexing
    artifact — the 1832-1838 baptisms are unindexed (browse-only). Rosa's siblings
    Manoel (1831), Maria (1832), Anna (1834), Thomaz (1836), Polidoro (1838) and
    João/Maria (1841) were found in the same register (images held, not yet
    individually catalogued); the will's Candido Pereira de Lemos is a further
    (older, unlocated) brother.
- text: >-
    [corrected 2026-10-10 from the image: re-read at full resolution after the
    retrieval agent's native-resolution reading disagreed with ours. (1) The day is
    "doze" — a four-letter word, the same form as "Aos doze" in the next entry
    (Eufrasia) and unlike the three-letter "dez" of the entry above — so the
    baptism is 12 October 1835, not "[dez]" / month-only. (2) The godmother is
    "Ro[z]a de Maria da Con.ção", not "Flor de Maria da Conceição": her initial is
    the looped "R" of the child's "Roza" and of "Reverendo", not this page's "F".
    (3) The text reads "baptizou e pos os Santos Oleos o Reverendo Vigario"; there
    is no "[coadjunto?]". (4) The father is written plain "Manoel de Lemos" here —
    confirmed; "Pereira" is supplied in brackets from the 1832, 1834 and 1838
    sibling entries (PAR-0030, PAR-0031, PAR-0033). "nascida a dez mezes" is
    confirmed (born about December 1834). The superseded transcription read: "Aos
    [dez] dias ... baptizou pelos Santos Oleos o Reverendo Vigario [coadjunto?] ...;
    Padrinho Manoel José da Silva e Flor de Maria da Conceição ... O Vigario
    Francisco R.[el] Pin[a][?]." The earlier marginal "Roza" belongs to the first
    entry on the page (the other Roza).]
  text_pt: >-
    [corrigido em 2026-10-10 a partir da imagem: relido em resolução plena depois que
    a leitura do agente de recuperação, em resolução nativa, divergiu da nossa. (1) O
    dia é "doze" — palavra de quatro letras, a mesma forma de "Aos doze" no assento
    seguinte (Eufrasia) e diferente do "dez" de três letras do assento anterior —, de
    modo que o batismo é de 12 de outubro de 1835, não "[dez]" / só o mês. (2) A
    madrinha é "Ro[z]a de Maria da Con.ção", não "Flor de Maria da Conceição": sua
    inicial é o "R" laçado de "Roza" (a batizanda) e de "Reverendo", não o "F" desta
    página. (3) O texto diz "baptizou e pos os Santos Oleos o Reverendo Vigario"; não
    há "[coadjunto?]". (4) O pai está escrito apenas "Manoel de Lemos" aqui —
    confirmado; "Pereira" é suprido entre colchetes a partir dos assentos dos irmãos
    de 1832, 1834 e 1838 (PAR-0030, PAR-0031, PAR-0033). "nascida a dez mezes" é
    confirmado (nascida por volta de dezembro de 1834). A transcrição superada dizia:
    "Aos [dez] dias ... baptizou pelos Santos Oleos o Reverendo Vigario
    [coadjunto?] ...; Padrinho Manoel José da Silva e Flor de Maria da Conceição ...
    O Vigario Francisco R.[el] Pin[a][?]." A margem "Roza" antes citada pertence à
    primeira entrada da página (a outra Roza).]
