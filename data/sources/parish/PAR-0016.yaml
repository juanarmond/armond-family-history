transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos, 1832-1838, imagem 197
  (volume em mau estado, páginas rasgadas). Entrada do meio da coluna esquerda;
  margem lateral "Roza". Na mesma página há uma segunda "Roza", filha de José Nunes
  e Luiza Maria da Conceição — pessoa distinta.] "Aos [dez] dias do mez de Outubro
  de mil oito centos trinta e cinco, nesta Matriz baptizou pelos Santos Oleos o
  Reverendo Vigario [coadjunto?] a innocente Roza, nascida a dez mezes, filha
  legitima de Manoel de Lemos e Maria Thereza de Jesus, naturaes desta freguezia;
  Padrinho Manoel José da Silva e Flor de Maria da Conceição. E para constar mandei
  fazer este assento que assigno. O Vigario Francisco R.[el] Pin[a][?]."
abstract: >-
  The 1835 Itaboraí baptism of a girl "Roza", legitimate daughter of Manoel de
  Lemos [Pereira] (P-0052) and Maria Thereza de Jesus (P-0053), both natural of the
  parish; godparents Manoel José da Silva and Flor de Maria da Conceição. Taken to
  be the baptism of Rosa Eugenia de Lemos (P-0035), wife of Francisco José Bohrer:
  she is the only "Roza" of this exact couple across the browsed 1832-1838 Itaboraí
  baptisms, in the parish where her 1879 marriage justification was held (PAR-0002,
  "em casa do pai de José Antunes de Lemos") and matching the Lemos-Itaboraí family
  named as her brother "Candido Pereira de Lemos" in her husband's 1888 will
  (PRB-0005). The register wrote only the forename "Roza"; the identity is therefore
  a strong indirect match, not a direct statement of "Eugenia de Lemos".
reliability:
  assessment: >-
    Direct primary parish evidence of a Roza baptised in 1835 at Itaboraí to Manoel
    de Lemos and Maria Thereza de Jesus. For the identification of this child as
    Rosa Eugenia de Lemos (P-0035) the evidence is strong but indirect (forename
    only), resting on the unique couple/parish/date match and the corroborating
    Itaboraí Lemos links in PAR-0002 and PRB-0005.
  informant: The recording vigário of São João Batista de Itaboraí (1835).
  limitations: >-
    Torn, water-damaged register; the exact day, the vigário's surname and one or
    two words are uncertain reads. The act records only the forename "Roza", so the
    tie to Rosa Eugenia de Lemos is inferential. A second, unrelated "Roza" (dau. of
    José Nunes and Luiza Maria da Conceição) appears on the same page.
