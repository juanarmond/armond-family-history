transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos, 1832-1838, imagem 197
  (volume em mau estado, páginas rasgadas). Terceira entrada da página esquerda; a
  margem lateral desta entrada não é legível na imagem. A primeira entrada da mesma
  página é de outra "Roza", filha de José Nunes e Luiza Maria da Conceição — pessoa
  distinta. Relida na imagem em 2026-10-10.] "Aos doze dias do mez de Outubro de mil
  oito centos e trinta e cinco nesta matriz baptizou e pos os Santos Oleos o
  Reverendo Viga-rio, a innocente Roza nascida a dez mezes filha legitima de Manoel
  de Lemos, e Maria Thereza de Jesus naturaes desta freguezia Padrinhos Manoel Jozé
  da Silva, e Ro[z]a de Maria da Con.ção, e para constar mandey fazer este asento que
  assigney. O Vig.rº Fran.co R.os Pena." [O nome da madrinha começa pela mesma
  maiúscula "R" laçada de "Roza" (a batizanda) e de "Reverendo"; o "F" desta página
  (em "Fran.co") tem outra forma. As letras após "Ro" estão comprimidas.]
abstract: >-
  The 12 October 1835 Itaboraí baptism of a girl "Roza", "nascida a dez mezes"
  (born about December 1834), legitimate daughter of Manoel de Lemos [Pereira]
  (P-0052) and Maria Thereza de Jesus (P-0053), both natural of the parish;
  godparents Manoel José da Silva and Ro[z]a de Maria da Conceição. Taken to
  be the baptism of Rosa Eugenia de Lemos (P-0035), wife of Francisco José Bohrer:
  she is the only "Roza" of this exact couple across the browsed 1832-1838 Itaboraí
  baptisms, in the parish where her 1879 marriage justification was held (PAR-0002,
  "em casa do pai de José Antunes de Lemos") and matching the Lemos-Itaboraí family
  named as her brother "Candido Pereira de Lemos" in her husband's 1888 will
  (PRB-0005). The register wrote only the forename "Roza"; the identity is therefore
  a strong indirect match, not a direct statement of "Eugenia de Lemos".
abstract_pt: >-
  O batismo, em Itaboraí em 12 de outubro de 1835, de uma menina "Roza", "nascida a
  dez mezes" (nascida por volta de dezembro de 1834), filha legítima de Manoel de
  Lemos [Pereira] (P-0052) e Maria Thereza de Jesus (P-0053), ambos naturais da
  freguesia; padrinhos Manoel José da Silva e Ro[z]a de Maria da Conceição. Tida
  como o batismo de Rosa Eugenia de Lemos (P-0035), esposa de Francisco José
  Bohrer: ela é a única "Roza" desse casal exato em todos os batismos de Itaboraí
  de 1832-1838 examinados, na freguesia onde se realizou sua justificação de
  casamento de 1879 (PAR-0002, "em casa do pai de José Antunes de Lemos") e
  correspondendo à família Lemos-Itaboraí nomeada como seu irmão "Candido Pereira
  de Lemos" no testamento de 1888 de seu marido (PRB-0005). O assento registrou
  apenas o prenome "Roza"; a identidade é, portanto, uma forte correspondência
  indireta, não uma declaração direta de "Eugenia de Lemos".
reliability:
  assessment: >-
    Direct primary parish evidence of a Roza baptised in 1835 at Itaboraí to Manoel
    de Lemos and Maria Thereza de Jesus. For the identification of this child as
    Rosa Eugenia de Lemos (P-0035) the evidence is strong but indirect (forename
    only), resting on the unique couple/parish/date match and the corroborating
    Itaboraí Lemos links in PAR-0002 and PRB-0005.
  informant: >-
    The recording vigário of São João Batista de Itaboraí (1835), Francisco R.os
    Pena, who signs the entry (written in the third person: "baptizou ... o
    Reverendo Vigario").
  limitations: >-
    Torn, water-damaged register, but this entry's text is legible at full
    resolution (re-read 2026-10-10: day "doze", godmother "Ro[z]a de Maria da
    Con.ção"); its marginal name is not legible on the image. The act records only
    the forename "Roza", so the tie to Rosa Eugenia de Lemos is inferential. A
    second, unrelated "Roza" (dau. of José Nunes and Luiza Maria da Conceição)
    appears on the same page.
