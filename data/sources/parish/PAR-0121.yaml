transcription: |-
  [Whole opening — São Romão da Ucha marriages, DGS 004670018 image 490: two entries on the left page (the start of 1866, Nº 1 and Nº 2) and two on the right page, fl. 127 (the end of Nº 2, the target Nº 3 and the start of Nº 4). Every entry is written and signed by the Abbade Antonio Joze Correia. Read from the native image (3876×2820) in strips at 1–5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written. This hand writes the tilde over the final o ("Romaõ", "comparecerão"); it is rendered "ão" throughout.]

  [left page, heading "Anno de 1866"; entry Nº 1 — 10 February 1866: Domingos Fernandes, widower of Roza Gonsalves, of the lugar de Medella of this parish, with Jozefa de [uncertain: Agueira], solteira, 36, daughter of Luis de [uncertain: Agueira] and Anna Joaquina, of the freguezia of Santo [uncertain: Adrião] de Padim da Graça; witnesses João Ribeiro de Souza Braga, "comigo morador", and Francisco Domingues, lavrador, of the same lugar de Medella; signed "Do Nubente + Domingos Frz" and "João Ribeiro de Souza Braga". A Domingos Fernandes of Medella, not of Quintão; nothing ties him to this family.]

  [left page, entry Nº 2 — 23 May 1866: Francisco Domingues, solteiro, 27, baptised in this church, son of Pedro Domingues, oleiro, and Thereza Maria Dias de Affonceca, of the lugar de Bairros, with Anna Velloso, solteira, 21, baptised at Santa Eullalia de Cabanellas, daughter of João Antonio Velloso and Maria Roza de Oliveira, naturaes of Cabanellas, concelho de Villa Verde; witnesses Manoel Joze da Costa, cazado, and his son Antonio Joze da Costa, solteiro, lavradores, moradores no Assento of this parish. The entry ends at the top of fl. 127 with the signatures "O Abb.e Antonio Joze Corr.a", "Manoel Joze da Costa" and "Antonio Joze da Costa". Not this family.]

  [p1 — evidence/parish/PAR-0121-marriage-bento-maria-da-costa-1866-ucha.jpg; fl. 127, entry Nº 3 — TARGET]
  [Left margin:] Nº 3 / Dia 2 / Mez Ag.to / Anno 1866
  [Right margin:] Bento Frz / Mª da Costa
  Aos dous dias do mez de Agosto do anno de mil oito centos [uncertain: secenta] e seis
  nesta Igreja Parochial de São Romão da Ucha concelho de Barcellos Di-
  ocese de Braga na minha prezença comparecerão os Nubentes
  Bento Fernandes, e Maria da Costa os quaes sei serem os proprios
  com todos os papeis do estillo correntes, e sem impedimento
  algum Civil, ou Canonico para o cazamento elle solteiro bapti-
  zado nesta freguezia de idade de vinte, e dous annos filho legitimo
  de Bento Fernandes, e de Joaquina Roza esta natural da freguezia
  da Pouza deste julgado, e aquelle natural desta freguezia, e ella tam-
  bem solteira baptizada nesta Igreja de idade de dezasette annos filha
  legitima de Manoel Joze da Costa natural da freguezia de Santa Chris-
  tina de Longos [uncertain: Julgo] de [uncertain: Guimarães], e de Anna Maria natural
  da freguezia de São Miguel de Frossos julgado de Braga os que-
  aes Nubentes se receberão por marido, e mulher, e os uni em Ma-
  trimonio procedendo em todo este acto conforme o Rito da Santa
  Madre Igreja Chatolica, e Appostolica Romana. Forão testemu-
  nhas prezentes que conheço serem os proprios o Padre Manoel
  de Oliveira cura de São Salvador de [uncertain: Cervães], e Domingos Ro-
  drigues solteiro Carpinteiro do lugar de Bairros desta freguezia
  de que para constar lavrei em duplicado este assento que depois
  de ser lido, e conferido perante os Nubentes, e testemunhas estas
  comigo asignarão, e não asignarão os Nubentes por não saberem
  escrever, Era ut supra.          O Abb.e Antonio Joze Corr.a [rubric]
  [Signatures of the witnesses:] O P.e Manoel de Olliveira.
                                 Dom.os Roiz
  [Expansions and readings: Ag.to = Agosto; Frz = Fernandes; Mª = Maria; "secenta" — the scribe's cramped form of "sessenta", read so; the year is certain from the margin "Anno 1866"; do estillo = customary; Chatolica and Appostolica are written so; Julgo — the word after "Longos" is written "Julgo" (or an abbreviation of "julgado"), whereas "julgado" is written in full in the next line; Abb.e = Abbade; Corr.a = Correia; P.e = Padre; Dom.os Roiz = Domingos Rodrigues.]

  [fl. 127, entry Nº 4 — 15 December 1866: Joze Luiz do Rego and Maria de Macedo, married with a dispensation from an impediment of the second degree of affinity on one side and of the third and fourth degrees of consanguinity on the other; the entry continues on the next page, which is not part of this record. Not this family.]
reading_reliability: complete
abstract: >-
  Original marriage entry, 1866 Nº 3, on fl. 127 of the São Romão da Ucha (Barcelos) marriage
  book. On 2 August 1866, in the parish church, the Abbade Antonio Joze Correia married Bento
  Fernandes, solteiro, aged 22, baptised in this parish, legitimate son of Bento Fernandes,
  natural of this parish, and of Joaquina Roza, natural of the parish of Pousa, to Maria da
  Costa, solteira, aged 17, baptised in this church, legitimate daughter of Manoel Joze da
  Costa, natural of Santa Christina de Longos (Guimarães), and of Anna Maria, natural of São
  Miguel de Frossos (Braga). The witnesses were the Padre Manoel de Oliveira, cura of São
  Salvador de Cervães, and Domingos Rodrigues, solteiro, carpenter, of the lugar de Bairros; the
  couple could not write and did not sign. The groom is a collateral: a younger brother of
  Manoel João Fernandes da Cruz (P-0139), son of Bento José Fernandes (P-0141) and Joaquina Rosa
  Lopes (P-0142), family F-0071. The entry states the naturalidade of both of his parents.
abstract_pt: >-
  Assento original de casamento, 1866 Nº 3, na fl. 127 do livro de casamentos de São Romão da
  Ucha (Barcelos). Em 2 de agosto de 1866, na igreja paroquial, o Abade Antonio Joze Correia
  casou Bento Fernandes, solteiro, de 22 anos, batizado nesta freguesia, filho legítimo de Bento
  Fernandes, natural desta freguesia, e de Joaquina Roza, natural da freguesia de Pousa, com
  Maria da Costa, solteira, de 17 anos, batizada nesta igreja, filha legítima de Manoel Joze da
  Costa, natural de Santa Christina de Longos (Guimarães), e de Anna Maria, natural de São Miguel
  de Frossos (Braga). Foram testemunhas o Padre Manoel de Oliveira, cura de São Salvador de
  Cervães, e Domingos Rodrigues, solteiro, carpinteiro, do lugar de Bairros; os noivos não
  sabiam escrever e não assinaram. O noivo é um colateral: irmão mais novo de Manoel João
  Fernandes da Cruz (P-0139), filho de Bento José Fernandes (P-0141) e de Joaquina Rosa Lopes
  (P-0142), família F-0071. O assento declara a naturalidade de ambos os pais dele.
reliability:
  assessment: >-
    Original and direct. It is primary for the marriage, its date and place, the parties, the
    witnesses and the officiant: the Abbade assisted at the marriage and wrote the entry, and the
    two witnesses signed it. The ages and the parents' names and naturalidades were declared to
    him and are secondary information. Every core fact is legible: the date (also in the margin),
    both parties, their ages and both sets of parents. The inline uncertain marks fall only on
    the cramped numeral word "secenta", on the julgado word after "Longos" and on the spelling of
    two place-names.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio Joze Correia, who assisted at the marriage; the
    ages and parentage were presumably declared by the parties. The two witnesses signed; the
    parties did not.
  limitations: >-
    The groom has no lugar of residence, and his parents are given no lugar either; the entry
    does not say whether his father was living or dead. No grandparents are named. The groom's
    surname "Fernandes" and his father's name "Bento Fernandes" are common in the parish (a
    Domingos Fernandes of Medella marries on the same opening).
