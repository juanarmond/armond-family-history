notes:
- text: >-
    Identification. The groom's parents are identified with Bento José Fernandes (P-0141) and
    Joaquina Rosa Lopes (P-0142): the same names ("Bento Fernandes" and "Joaquina Roza"), the same
    parish, the father "natural desta freguezia" and the mother "natural da freguezia da Pouza",
    as her own records give her. The groom's age, 22 on 2 August 1866, puts his birth between
    August 1843 and August 1844; it fits the Bento baptised in Ucha in December 1843 as a son of
    Bento Fernandes and Joaquina Roza of Quintão (PAR-0120, per the retrieval side's reading).
    This entry gives no lugar, so the identification rests on the names, the parish, the stated
    naturalidades and the age; it is strong, not proven.
  text_pt: >-
    Identificação. Os pais do noivo são identificados com Bento José Fernandes (P-0141) e
    Joaquina Rosa Lopes (P-0142): os mesmos nomes ("Bento Fernandes" e "Joaquina Roza"), a mesma
    freguesia, o pai "natural desta freguezia" e a mãe "natural da freguezia da Pouza", como os
    registros dela a dão. A idade do noivo, 22 anos em 2 de agosto de 1866, situa o nascimento
    entre agosto de 1843 e agosto de 1844; isso combina com o Bento batizado na Ucha em dezembro
    de 1843 como filho de Bento Fernandes e Joaquina Roza, de Quintão (PAR-0120, segundo a
    leitura da pesquisa de recuperação). Este assento não dá lugar, de modo que a identificação
    se apoia nos nomes, na freguesia, nas naturalidades declaradas e na idade; é forte, não
    provada.
- text: >-
    What the record adds. It is the only record of this batch that states the naturalidade of
    both of the groom's parents: Bento Fernandes "natural desta freguezia" (Ucha) and Joaquina
    Roza "natural da freguezia da Pouza deste julgado". The groom, Bento, was solteiro, 22, and
    baptised in Ucha; he could not write. His bride's family came from outside Ucha (her father
    from Santa Christina de Longos, Guimarães; her mother from São Miguel de Frossos, Braga),
    though she was baptised in Ucha. The entry is silent on whether Bento the father was alive in
    1866 (the retrieval side holds a probable death of 1860, E-0148). Bento the groom is a
    collateral of F-0071 and can be recorded there as a documented child with this source.
  text_pt: >-
    O que o registro acrescenta. É o único registro deste lote que declara a naturalidade de
    ambos os pais do noivo: Bento Fernandes "natural desta freguezia" (Ucha) e Joaquina Roza
    "natural da freguezia da Pouza deste julgado". O noivo, Bento, era solteiro, tinha 22 anos e
    foi batizado na Ucha; não sabia escrever. A família da noiva vinha de fora da Ucha (o pai, de
    Santa Christina de Longos, Guimarães; a mãe, de São Miguel de Frossos, Braga), embora ela
    tenha sido batizada na Ucha. O assento não diz se Bento, o pai, estava vivo em 1866 (a
    pesquisa de recuperação tem um provável óbito de 1860, E-0148). Bento, o noivo, é um colateral
    da F-0071 e pode ser registrado ali como filho documentado, com esta fonte.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.5, T2). The
    wording is confirmed. On the image the numeral word reads "secenta" (draft "sessenta"); the
    father of the bride is "Manoel Joze da Costa" (draft "José"); the word after "Longos" is
    written "Julgo", not "julgado"; "Algum Civil, ou Canonico" has capitals; the line break is
    "Domingos Ro- / drigues" (draft "Rodri- / gues"); and the witness's signature is "O P.e Manoel
    de Olliveira." with a double l (draft "O Pe Manoel de Oliveira."). The place-names "Cervães"
    and "Guimarães" are cramped at the ending and are marked uncertain in spelling only.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.5, T2). O texto foi confirmado. Na imagem, o numeral lê-se
    "secenta" (rascunho "sessenta"); o pai da noiva é "Manoel Joze da Costa" (rascunho "José"); a
    palavra depois de "Longos" está escrita "Julgo", e não "julgado"; "Algum Civil, ou Canonico"
    tem maiúsculas; a quebra de linha é "Domingos Ro- / drigues" (rascunho "Rodri- / gues"); e a
    assinatura da testemunha é "O P.e Manoel de Olliveira.", com l duplo (rascunho "O Pe Manoel de
    Oliveira."). Os topônimos "Cervães" e "Guimarães" estão apertados no final e ficam marcados
    como incertos apenas na grafia.
- text: >-
    Neighbouring names, not identified with the family. The witnesses of the previous entry (Nº 2,
    23 May 1866) are "Manoel Joze da Costa, cazado" and his son Antonio Joze da Costa, lavradores
    of the Assento in Ucha; the bride of Nº 3 is a daughter of a Manoel Joze da Costa. The entry
    does not say that they are the same man. The witness Domingos Rodrigues, solteiro, of
    Bairros, witnesses João Fernandes's marriage of 1868 too (PAR-0122).
  text_pt: >-
    Nomes vizinhos, não identificados com a família. As testemunhas do assento anterior (Nº 2, 23
    de maio de 1866) são "Manoel Joze da Costa, cazado" e seu filho Antonio Joze da Costa,
    lavradores do Assento, na Ucha; a noiva do Nº 3 é filha de um Manoel Joze da Costa. O assento
    não diz que se trate do mesmo homem. A testemunha Domingos Rodrigues, solteiro, de Bairros,
    testemunha também o casamento de João Fernandes em 1868 (PAR-0122).
