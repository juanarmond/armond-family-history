notes:
- text: >-
    Corrects the óbito conflict on João's father's name: João's 1915 Carangola death
    (PAR-0007) recorded the father as "Manoel Luiz Bittencourt", but this primary
    Povoação death shows the true name is Manoel MUNIZ Bytancourt. It also settles
    the previously open identity of João's mother (Francisca Roza do Espirito Santo)
    and promotes the grandparent couple (João Muniz Bytancourt and Maria Jacintha de
    Medeiros) from tree-lead to primary. João Muniz Bittencourt (P-0019, b. c.1847)
    is one of the "oito filhos" but is not individually named here.
- text: >-
    Independent (non-catalogued) corroboration of the grandparent couple, held as a
    lead only: the Ponta Delgada emigration-passport register (BPAR/Archeevo,
    GCPDL/P) records two 1880 passports of João's brothers — António Moniz
    Bettencourt (ref …/02217) and Dâmaso Moniz (ref …/02203) — each "filho de João
    Moniz Bettencourt e Maria Jacinta", Povoação. Transcription only; no image was
    delivered, so it is not catalogued as a source.
