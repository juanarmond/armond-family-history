transcription: >-
  [Paróquia de Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel; livro de
  óbitos, 1866. Margem: "N.º 70 / Manoel Muniz Bytancourt cazado com Francisca Roza
  do Espirito Santo". Página no alto: "15 / Barão".] "Aos vinte quatro dias do mez de
  Julho do anno de mil oito centos sessenta e seis, por uma hora da tarde, na bahia,
  fóra do Garajau desta freguesia de Nossa Senhora Mãe de Deus, Concelho da Villa da
  Povoação, Diocese d'Angra, falleceu, sem receber os Sacramentos da Santa Madre
  Egreja, um individuo do sexo Masculino, de nome Manoel Muniz Bytancourt, de idade
  de quarenta e seis annos, proprietario, cazado com Francisca Roza do Espirito
  Santo, natural desta freguesia, e morador na Lomba do Botão da mesma; filho
  legitimo de João Muniz Bytancourt, proprietario, e de Maria Jacintha de Medeiros,
  d'occupação domestica, naturaes desta freguesia; não fez testamento, e deixou oito
  filhos. E para constar lavrei em duplicado este assento que assigno. Era ut supra.
  O Cura Julio Cesar Augusto[?] [assinatura; sobrenome uncertain]."
abstract: >-
  The original 1866 death register entry (N.S. Mãe de Deus, Povoação, Ilha de São
  Miguel) of Manoel Muniz Bytancourt (P-0042), father of João Muniz Bittencourt
  (P-0019): drowned at sea off the Garajau on 24 July 1866, aged 46 (so born
  c.1820), a landowner resident at Lomba do Botão, without the sacraments and
  intestate. It names his wife Francisca Roza do Espirito Santo (P-0047), his
  parents João Muniz Bytancourt (P-0048) and Maria Jacintha de Medeiros (P-0049) —
  both natural of the parish — and states he left eight children. This is the
  primary record that fixes João's Azorean parentage two generations deep and
  corrects the "Manoel Luiz Bittencourt" of João's 1915 Carangola óbito (PAR-0007):
  the true name is Manoel MUNIZ Bytancourt.
abstract_pt: >-
  O assento original de óbito de 1866 (N.S. Mãe de Deus, Povoação, Ilha de São
  Miguel) de Manoel Muniz Bytancourt (P-0042), pai de João Muniz Bittencourt
  (P-0019): afogado no mar, ao largo do Garajau, em 24 de julho de 1866, aos 46
  anos (portanto nascido por volta de 1820), proprietário residente na Lomba do
  Botão, sem os sacramentos e intestado. Nomeia sua esposa Francisca Roza do
  Espirito Santo (P-0047), seus pais João Muniz Bytancourt (P-0048) e Maria
  Jacintha de Medeiros (P-0049) — ambos naturais da freguesia — e declara que
  deixou oito filhos. É o registro primário que fixa a ascendência açoriana de
  João em duas gerações e corrige o "Manoel Luiz Bittencourt" do óbito de João
  de 1915 em Carangola (PAR-0007): o nome verdadeiro é Manoel MUNIZ Bytancourt.
reliability:
  assessment: >-
    Direct primary parish evidence for Manoel's death, approximate birth year, São
    Miguel (Povoação) residence, marriage to Francisca Roza do Espirito Santo, and
    his own parentage (João Muniz Bytancourt and Maria Jacintha de Medeiros).
  informant: The recording cura of N.S. Mãe de Deus, Povoação (1866).
  limitations: >-
    Handwritten register; the officiating cura's surname is an uncertain read.
    Manoel's own naturalidade is not stated explicitly, but his parents are
    "naturaes desta freguesia" and he was resident and buried there. The eight
    children are not individually named in this act.
