abstract: >-
  Parish baptism of Maria Thecla Regina Eggendorn (P-0071) — Iris Bohrer Muniz's great-grandmother
  on the Bohrer/Eggendorn line and wife of Vicente Borer (P-0070) — born 23 September 1844 and
  baptised 2 June 1845 at the Matriz de São João Baptista, Nova Friburgo. NAMES HER PARENTS: José
  Eggendora (Eggendorn, P-0101) and Maria Freese (Anna Maria Frees, P-0102). This is her own
  baptism; it upgrades the F-0050 couple link to primary and is the source for the birth event
  E-0096. Godparents Pedro and Regina Freese.
abstract_pt: >-
  Batismo paroquial de Maria Thecla Regina Eggendorn (P-0071) — bisavó de Iris Bohrer Muniz na
  linha Bohrer/Eggendorn e esposa de Vicente Borer (P-0070) — nascida em 23 de setembro de 1844 e
  baptizada em 2 de junho de 1845, na Matriz de São João Baptista, Nova Friburgo. NOMEIA SEUS PAIS:
  José Eggendora (Eggendorn, P-0101) e Maria Freese (Anna Maria Frees, P-0102). É o próprio batismo
  dela; eleva o vínculo da família F-0050 a primário e é a fonte do evento de nascimento E-0096.
  Padrinhos Pedro e Regina Freese.
