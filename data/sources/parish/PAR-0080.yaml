transcription: >-
  [Livro de Baptismos, Lumiar de Nova Friburgo, fl.79-80, 1900. One continuous
  record of two consecutive baptism entries for the twin sisters.]
  "[786 / Adelaide] Aos vinte dias do mez de Setembro de mil e novecentos,
  baptisei solemnemente em Lumiar de Nova Friburgo a Adelaide, nascida a dezenove
  de Julho de mil e oito centos e noventa e nove, filha legitima de Valentim
  Martinho Bohrer e Carolina Klein Bohrer. Forão padrinhos João Maria Bohrer e
  Luiz Bohrer. Para constar fiz este assento que assigno. P. Alberto Teixeira
  Pequeno, pro-Parocho. [Diz a entrelinha: João Maria Bohrer e Luiz Bohrer —
  validada pelo pároco.]"
  "[787 / Carolina] Aos vinte dias do mez de Setembro de mil e novecentos,
  baptisei solemnemente em Lumiar de Nova Friburgo a Carolina, nascida em dezenove
  de Julho de mil e oito centos e noventa e nove, filha legitima de Valentim
  Martinho Bohrer e Carolina Klein Bohrer. Forão padrinhos Jacob Klein e Maria
  Luiza Schewele [Schenck? — uncertain]. Para constar fiz [fl.80:] este assento
  que assigno. Padre Alberto Teixeira Pequeno, pro-Parocho."
abstract: >-
  Parish baptism of the twin sisters Adelaide and Carolina Bohrer, both born 19
  July 1899 and both baptised 20 September 1900 at Lumiar de Nova Friburgo
  (fl. 79-80, entries 786 and 787), legitimate daughters of Valentim Martinho
  Bohrer (P-0028) and Carolina Klein (P-0029) — i.e. younger siblings of the
  direct ancestor João Gonçalves Bohrer (P-0014). Recorded as two documented
  children on family F-0013. Both parents are named on both entries. Carolina's
  godparents are her maternal grandparents Jacob Klein and Maria Luiza [Schenck?].
  This is a distinct record from the previously-rejected 1900 crop
  (which belonged to the collateral Vicente Bohrer Jr × Hortencia Heckdorn
  branch). PROVEN. Not modelled as person entities; no events created.
abstract_pt: >-
  Batismo paroquial das irmãs gêmeas Adelaide e Carolina Bohrer, ambas nascidas
  em 19 de julho de 1899 e ambas baptizadas em 20 de setembro de 1900 em Lumiar
  de Nova Friburgo (fl. 79-80, assentos 786 e 787), filhas legítimas de Valentim
  Martinho Bohrer (P-0028) e Carolina Klein (P-0029) — ou seja, irmãs mais novas
  do ancestral direto João Gonçalves Bohrer (P-0014). Registradas como duas
  filhas documentadas na família F-0013. Ambos os pais são nomeados nos dois
  assentos. Os padrinhos de Carolina são seus avós maternos Jacob Klein e Maria
  Luiza [Schenck?] (F-0037). Este é um registro distinto do recorte de 1900
  anteriormente rejeitado (que pertencia ao ramo colateral Vicente Bohrer Junior
  × Hortencia Heckdorn). PROVADO. Não modeladas como entidades pessoa; sem
  eventos criados.
reliability:
  assessment: >-
    Primary parish baptism entries — direct primary for the twins' birth/baptism
    and their filiation to Valentim Martinho Bohrer and Carolina Klein. Both
    entries independently name both parents.
  informant: The pro-Pároco Padre Alberto Teixeira Pequeno (Lumiar).
  limitations: >-
    Carolina's godmother surname reads "Schewele" (likely Schenck — uncertain).
    Adelaide's godparents were interlineated and validated by the priest. The
    twins were born 1899 but baptised 1900 (a delayed baptism). No grandparents
    are named beyond Carolina's Klein godparents.
