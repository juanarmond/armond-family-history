transcription: >-
  [Livro de Casamentos, Nova Friburgo, p.50, 1825; Vigário Jacob Joye.] "Aos oito dias do mes de
  Agosto do anno de mil oito cent[os] e vinte e cinco... receberam-se em face de Igreja n'esta
  Matriz solemnemente por palavras, Jacob Bohrer filho legitimo de João Bohrer e da sua mulher
  Barbara Probst naturaes e baptizado na freg.a de Erswill [Erschwil], com Catharina Moser filha
  legitima de Jose Moser e de sua mulher Maria Veisse [Weiss], natural e baptizada na freguezia
  d'Eggendorf [Hägendorf — uncertain], ambos do Cantão de Soleure [Solothurn], colonos suiços e
  moradores n'esta freg.a... O Vigario Jacob Joye." [Testemunhas: João Probst; Isabel Sch[oser —
  uncertain]. Padre coadjutor presente: Rodrigo de Souza Sabia.]
abstract: >-
  Parish marriage of Jacob Bohrer (P-0050) and Catharina Moser (P-0051) — Iris Bohrer Muniz's
  Swiss-immigrant great-great-grandparents on the Bohrer maternal line — on 8 August 1825 at Nova
  Friburgo. NAMES BOTH DEEPER-GENERATION COUPLES: Jacob is a legitimate son of João Bohrer ×
  Barbara Probst of Erschwil (Erswill), and Catharina of José Moser × Maria Weiss (Veisse) of
  Hägendorf — all of Canton Solothurn. Source for the marriage event E-0087; adds the parent
  families F-0047 (Jacob's parents, new) and F-0048 (Catharina's parents, new).
abstract_pt: >-
  Casamento paroquial de Jacob Bohrer (P-0050) e Catharina Moser (P-0051) — trisavós imigrantes
  suíços de Iris Bohrer Muniz na linha materna Bohrer — em 8 de agosto de 1825, em Nova Friburgo.
  NOMEIA OS DOIS CASAIS DA GERAÇÃO MAIS PROFUNDA: Jacob é filho legítimo de João Bohrer × Barbara
  Probst, de Erschwil, e Catharina de José Moser × Maria Weiss (Veisse), de Hägendorf — todos do
  Cantão de Soleure. Fonte do evento de casamento E-0087; adiciona as famílias de pais F-0047 e
  F-0048 (novas).
reliability:
  assessment: >-
    Primary parish marriage entry — direct primary for the marriage and, as declared by the
    spouses, for both filiations and their Swiss parish origins.
  informant: The contracting parties before the vicar Jacob Joye.
  limitations: >-
    Delivered via the Fundação D. João VI digitisation (C-009). Bride's baptism-parish "Eggendorf"
    (likely Hägendorf) and one witness surname are [uncertain]. This Jacob (of Erschwil) is
    distinct from Laurent Borer's father Jacob Borer of Grindel (P-0100) — separate Borer families.
