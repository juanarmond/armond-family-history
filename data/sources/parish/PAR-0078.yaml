transcription: >-
  [Livro de Baptismos, Nova Friburgo, fl.73, 1896. Margem: "870 / Joaquim
  Carlos".] "Aos vinte tres dias do mes de Setembro de mil oito centos e noventa
  e seis baptisei solemnemente a Joaquim Carlos, nascido á seis de Janeiro do
  dito anno, filho legitimo de Joaquim José Borber [Bohrer] e Lucinda Ferreira
  Borber. Forão padrinhos João Berbert e Luiza Berbert. Para constar fiz este
  assento, que assigno. O Vigario Conego José Silvestre Alves de Miranda."
abstract: >-
  Parish baptism of Joaquim Carlos Bohrer, born 6 January 1896 and baptised 23
  September 1896 at Nova Friburgo (fl. 73, entry 870), legitimate son of Joaquim
  José Bohrer (P-0030) and Lucinda Ferreira da Silva (P-0031) — i.e. a younger
  sibling of the direct ancestor Celina Bohrer (P-0015). Recorded as a documented
  child on family F-0014. Both parents are named; the surname is written "Borber"
  (a scribal variant of Bohrer). PROVEN. Not modelled as a person entity; no
  event created.
abstract_pt: >-
  Batismo paroquial de Joaquim Carlos Bohrer, nascido em 6 de janeiro de 1896 e
  baptizado em 23 de setembro de 1896 em Nova Friburgo (fl. 73, assento 870),
  filho legítimo de Joaquim José Bohrer (P-0030) e Lucinda Ferreira da Silva
  (P-0031) — ou seja, um irmão mais novo da ancestral direta Celina Bohrer
  (P-0015). Registrado como filho documentado na família F-0014. Ambos os pais
  são nomeados; o sobrenome está escrito "Borber" (variante do escrivão para
  Bohrer). PROVADO. Não modelado como entidade pessoa; sem evento criado.
