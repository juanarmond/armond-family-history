notes:
- text: >-
    Identification. The parents are identified with P-0139 and P-0140: "Manoel João Fernandes" and
    "Anna Exposta", of the lugar do Souto in Pousa, "recebidos na freguezia de S. Romão da Ucha"
    (where Manoel João married "Joanna Maria Esposta" in January 1855, PAR-0107), with paternal
    grandparents Bento Fernandes and Joaquina Lopes. The same couple appears in the earlier Pousa
    baptisms (PAR-0124 to PAR-0126) and in Thereza's baptism of 1864 (PAR-0108). The
    identification is strong, not proven.
  text_pt: >-
    Identificação. Os pais são identificados com P-0139 e P-0140: "Manoel João Fernandes" e "Anna
    Exposta", do lugar do Souto, em Pousa, "recebidos na freguezia de S. Romão da Ucha" (onde
    Manoel João se casou com "Joanna Maria Esposta" em janeiro de 1855, PAR-0107), com avós paternos
    Bento Fernandes e Joaquina Lopes. O mesmo casal aparece nos batismos anteriores de Pousa
    (PAR-0124 a PAR-0126) e no batismo de Thereza em 1864 (PAR-0108). A identificação é forte, não
    provada.
- text: >-
    The mother's name as written: "Anna Exposta" in the body and "Anna / Exposta" in the margin.
    The 1855 marriage has "Joanna Maria / Esposta" (PAR-0107); the baptisms of 1855, 1858 and 1859
    have "Anna Maria" (PAR-0124, PAR-0125, PAR-0126). This entry is the first held to state her
    status as a foundling in a baptism of her children, and for the maternal grandparents it says
    "ignora-se este ponto — por [ser] a mae da criança Exposta", not "incognitos" as the earlier
    entries do.
  text_pt: >-
    O nome da mãe como está escrito: "Anna Exposta" no corpo e "Anna / Exposta" na margem. O
    casamento de 1855 traz "Joanna Maria / Esposta" (PAR-0107); os batismos de 1855, 1858 e 1859
    trazem "Anna Maria" (PAR-0124, PAR-0125, PAR-0126). Este assento é o primeiro dos que temos a
    declarar a condição de exposta dela num batismo dos filhos, e quanto aos avós maternos diz
    "ignora-se este ponto — por [ser] a mae da criança Exposta", e não "incognitos", como os
    assentos anteriores.
- text: >-
    What the record adds. Manoel João Fernandes was an alfaiate (tailor) by January 1862. The
    couple were "recebidos" (married) in the parish of S. Romão da Ucha, were parishioners of
    Pousa and lived in the lugar do Souto. Antonio Joaquim was born at 3 a.m. on 4 January 1862
    and baptised at 1 p.m. on 8 January 1862. The godparents were Antonio Joaquim Martins,
    casado, oleiro, and Thereza de Jesus, casada, of the lugar da Cachadinha; a July 1859 entry
    names "Antonio Joaquim Martins e sua mulher Thereza de Jesus" as godparents (PAR-0126), so they
    were probably a married couple. This married Thereza de Jesus is not Manoel João's sister of
    the same name, who was solteira until 1869 (PAR-0123). The child bears the godfather's
    forenames. Antonio Joaquim can be recorded as a documented child of F-0070; the retrieval side
    reports his death at Pousa in 1864 (PAR-0128).
  text_pt: >-
    O que o registro acrescenta. Manoel João Fernandes era alfaiate em janeiro de 1862. O casal foi
    "recebido" (casado) na freguesia de S. Romão da Ucha, era paroquiano de Pousa e morava no lugar
    do Souto. Antonio Joaquim nasceu às 3 da manhã de 4 de janeiro de 1862 e foi batizado à 1 da
    tarde de 8 de janeiro de 1862. Os padrinhos foram Antonio Joaquim Martins, casado, oleiro, e
    Thereza de Jesus, casada, do lugar da Cachadinha; um assento de julho de 1859 nomeia "Antonio
    Joaquim Martins e sua mulher Thereza de Jesus" como padrinhos (PAR-0126), de modo que eram
    provavelmente um casal. Esta Thereza de Jesus casada não é a irmã homônima de Manoel João, que
    era solteira até 1869 (PAR-0123). A criança tem os prenomes do padrinho. Antonio Joaquim pode
    ser registrado como filho documentado da F-0070; a pesquisa de recuperação refere o óbito dele
    em Pousa em 1864 (PAR-0128).
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.3, entry 4).
    The wording is confirmed, with these readings: the word after "S. Romão da" is cramped and is
    marked uncertain, although the parish is not in doubt; "a mae" has no visible tilde (draft
    "a mãe"); the line turn is "bapti- / mo" (draft "bapti- / smo"); and the godfather's
    proxy signs "Joze Gomes de Miranda" (draft "José"). The draft's "[ser?]" for the blotted word is
    kept as uncertain. The margin, the dates and hours, the father's trade and the signatures are
    as in the draft.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.3, assento 4). O texto foi confirmado, com estas leituras:
    a palavra depois de "S. Romão da" está apertada e fica marcada como incerta, embora a freguesia
    não esteja em dúvida; "a mae" não tem til visível (rascunho "a mãe"); a quebra de linha é
    "bapti- / mo" (rascunho "bapti- / smo"); e quem assina a rogo do padrinho é "Joze Gomes de
    Miranda" (rascunho "José"). O "[ser?]" do rascunho para a palavra borrada fica como incerto. A
    margem, as datas e horas, o ofício do pai e as assinaturas estão como no rascunho.
