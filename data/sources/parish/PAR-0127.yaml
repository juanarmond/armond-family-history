transcription: |-
  [Whole opening — Pousa baptisms, DGS 004668983 image 103: the end of 1862 Nº 1 and the target Nº 2 on the left page (fl. 8v); the signatures of Nº 2 and the whole of Nº 3 on the right page (fl. 9). Every entry is written and signed by the Abbade Manoel José d'Oliveira Guimarães, in the new, fuller form of the 1860s ("lavrei em duplicado"). Read from the native image (3640×2920) in strips at 1–3.5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [fl. 8v, top — the end of 1862 Nº 1, which begins on the previous page: a daughter, "primeira do nome", of Antonio Martins, lavrador, and Thereza Loureira, of the lugar do Outeiro, Pousa; paternal grandparents Joaquim Martins and Izabel Martins, maternal grandparents Domingos Villas-boas and Maria Loureira; "Padrinho Bento Rodrigues, solteiro, lavrador, do logar do Outeiro, e Madrinha Joaquina Roza, solteira, do logar do Outeiro"; signed "Padrinhos Bento Rodrigues", "A rogo da Madrinha José Joaquim [uncertain: Loureira]" and "O Abbade Manoel José d'Oliveira Guimarães". The godmother, a Joaquina Roza, solteira, of Outeiro, is a namesake of P-0142 (married, of Ucha) and is not identified with her.]

  [p1 — evidence/parish/PAR-0127-baptism-antonio-joaquim-1862-pousa.jpg; fl. 8v, entry Nº 2 — TARGET]
  [Left margin:] Nº 2 [the numeral is inked heavily over another figure] / Dia 8 / Mez-Janeiro / Anno-1862 / Antonio / Joaquim, / filho legi- / timo de / Manoel João / Fernandes / e Anna / Exposta, / do logar / do Souto.
  Aos oito dias do mez de Janeiro do anno de mil oito centos e sessenta
  e dois, pela uma hora da tarde, na Igreja Parochial da
  Pousa, Concelho e Districto Ecclesiastico de Barcellos, Arcebispado
  de Braga: Eu o Presbitero Manoel José d'Oliveira Guimarães,
  Abbade da referida freguezia, baptizei solemnemente e
  pus os Santos Oleos a uma criança do sexo masculino,
  a que dei o nome de Antonio Joaquim, que nasceu ás
  tres horas da manhan do dia quatro do mez de Janeiro
  do anno de mil oito centos e sessenta e dois, filho legitimo
  de Manoel João Fernandes, alfaiate, e de Anna Exposta,
  recebidos na freguezia de S. Romão da [uncertain: Ucha], e parochia-
  nos da Pousa, moradores no logar do Souto, neto pater-
  no de Bento Fernandes e de Joaquina Lopes e materno =
  (ignora-se este ponto — por [uncertain: ser] a mae da criança Exposta) Padri-
  nho Antonio Joaquim Martins, casado, oleiro, do logar da
  Cachadinha e Madrinha Thereza de Jesus, casada, do mes-
  mo logar, aos quaes todos conheço e dou fé serem os proprios.
  E para constar lavrei em duplicado o presente assento de bapti-
  mo, que depois de ser lido e conferido perante os padrinhos
  comigo o assignaram. Era ut supra. Padrinhos [a short word, struck through]
  [a line-filling flourish across the foot of the page]
  [fl. 9, top of the right page — the signatures of Nº 2:]
  Padrinhos. A rogo do Padrinho Joze Gomes de Miranda
  A rogo da Madrinha Antonio J.e d'Oliveira Guim.es
  O Abbade Manoel José d'Oliveira Guimarães
  [Expansions and readings: manhan = manhã; "da Ucha" — the word is cramped and its first letters are unclear, but "S. Romão" fixes the parish; "por [ser]" — the word after "por" is blotted, and "ser" is the reading that its strokes and the sense allow; "mae" is written without a visible tilde; "bapti- / mo" is written so at the line turn; J.e = José; Guim.es = Guimarães; "A rogo do / da" = signed at the request of the godfather / godmother, who could not write.]

  [fl. 9, entry Nº 3 — 9 January 1862: Antonio, legitimate son, "unico do nome", of Antonio da Silva do Campo, lavrador, and Maria Magdalena, of the lugar de Sobre-Outeiro; paternal grandparents Antonio da Silva do Campo and Andreza Maria do Campo, maternal grandparents Antonio José Ferreira and Josefa Maria Rodrigues; "Padrinho Antonio José Ferreira, casado, lavrador, do logar do Souto e Madrinha Andreza Maria do Campo, casada, do logar de Sobre-Outeiro"; signed "Padrinhos Antonio José Ferr.a", "A rogo da Madrinha Antonio J.e d'Oliveira Guim.es" and the Abbade. Not this family.]
reading_reliability: complete
abstract: >-
  Original baptism entry, 1862 Nº 2, on fl. 8v of the Pousa (Barcelos) baptism book, with its
  signatures at the top of fl. 9. On 8 January 1862, at one in the afternoon, in the parish church
  of Pousa, the Abbade Manoel José d'Oliveira Guimarães baptised and anointed Antonio Joaquim,
  born at three in the morning of 4 January 1862, legitimate son of Manoel João Fernandes,
  alfaiate (tailor), and of Anna Exposta, "recebidos na freguezia de S. Romão da Ucha" (married at
  Ucha), parishioners of Pousa, living in the lugar do Souto. The paternal grandparents are named
  as Bento Fernandes and Joaquina Lopes; of the maternal grandparents the entry says "ignora-se
  este ponto", because the child's mother was a foundling. The godparents were Antonio Joaquim
  Martins, casado, oleiro (potter), and Thereza de Jesus, casada, both of the lugar da Cachadinha;
  neither could write, and others signed at their request. The parents are Manoel João Fernandes
  da Cruz (P-0139) and Anna Maria Fernandes (P-0140); Antonio Joaquim is a collateral child of
  their family F-0070.
abstract_pt: >-
  Assento original de batismo, 1862 Nº 2, na fl. 8v do livro de batismos de Pousa (Barcelos),
  com as assinaturas no alto da fl. 9. Em 8 de janeiro de 1862, à uma hora da tarde, na igreja
  paroquial de Pousa, o Abade Manoel José d'Oliveira Guimarães batizou e ungiu Antonio Joaquim,
  nascido às três horas da manhã de 4 de janeiro de 1862, filho legítimo de Manoel João Fernandes,
  alfaiate, e de Anna Exposta, "recebidos na freguezia de S. Romão da Ucha" (casados na Ucha),
  paroquianos de Pousa, moradores no lugar do Souto. Os avós paternos são nomeados como Bento
  Fernandes e Joaquina Lopes; quanto aos avós maternos, o assento diz "ignora-se este ponto",
  porque a mãe da criança era exposta. Foram padrinhos Antonio Joaquim Martins, casado, oleiro, e
  Thereza de Jesus, casada, ambos do lugar da Cachadinha; nenhum dos dois sabia escrever, e outros
  assinaram a rogo deles. Os pais são Manoel João Fernandes da Cruz (P-0139) e Anna Maria Fernandes
  (P-0140); Antonio Joaquim é um filho colateral da família F-0070.
reliability:
  assessment: >-
    Original and direct. It is primary for the baptism, its date, hour and place, the child, the
    parents as named, the godparents and the officiant: the Abbade baptised, wrote the entry,
    read it to the godparents and signed it. The birth date and hour, the father's trade, the
    parents' place of marriage, the grandparents and the mother's status were declared to him
    and are secondary information. Every core fact is legible. The inline uncertain marks fall
    only on the cramped word "Ucha" (the parish is fixed by "S. Romão") and on a blotted word in
    the parenthesis about the maternal grandparents.
  informant: >-
    The Abbade of Pousa, Manoel José d'Oliveira Guimarães, who baptised and signed, and who
    "knew all of them and gave faith that they were the persons named"; the facts of birth and
    kinship were presumably declared by the family or the godparents, who did not write.
  limitations: >-
    The mother is named only "Anna Exposta"; neither her naturalidade nor her foster family is
    given. The paternal grandparents have no lugar here. The entry says that the parents were
    married at Ucha but not when.
