abstract: >-
  Primary parish death record for Manuel da Ponte Cardoso (P-0125), died 19 August 1652 in
  São Sebastião, Terceira. The act names him "m.el de Ponte Cardozo" — the register spelling
  of his surname is **Cardozo**, not "Valadão"; the "Valadão" form comes only from the
  compiled genealogy Mendes Forjaz Vol. IX (PUB-0005, p.259), which itself offers "ou Manuel
  da Ponte Cardoso" as an alternative. He died with all the sacraments of the Church and was
  buried inside the parish church, in his own grave beside the arch of the chancel
  ("sepultura sua junto ao arco da cape[la mor]"). The death date is an exact match with
  PUB-0005. A three-line marginal annotation in the same hand reads "M.el de Pon / te Cardozo
  / meu pai" — a first-person note by the officiating priest identifying the deceased as his
  own father. The act is signed "o Vig.º So[u]tomaior"; the neighbouring 1652 entries on the
  same page are signed "o Vig.º Ant.º Coelho Sotto[ma]yor". This primary image upgrades
  E-0129 from strong-evidence to confirmed and raises P-0125 from compiled-only to primary
  documentation.
abstract_pt: >-
  Registo paroquial primário do óbito de Manuel da Ponte Cardoso (P-0125), falecido a 19 de
  agosto de 1652 em São Sebastião, Terceira. O assento nomeia-o "m.el de Ponte Cardozo" — a
  grafia do apelido no registo é **Cardozo**, e não "Valadão"; a forma "Valadão" vem apenas
  da genealogia compilada Mendes Forjaz Vol. IX (PUB-0005, p.259), que por sua vez oferece
  "ou Manuel da Ponte Cardoso" como alternativa. Morreu com todos os sacramentos da Igreja e
  foi sepultado dentro da igreja paroquial, em sepultura sua junto ao arco da capela-mor
  ("sepultura sua junto ao arco da cape[la mor]"). A data de óbito corresponde exactamente a
  PUB-0005. Uma anotação marginal de três linhas, na mesma mão, lê "M.el de Pon / te Cardozo
  / meu pai" — nota em primeira pessoa do sacerdote officiante, identificando o defunto como
  seu próprio pai. O assento é assinado "o Vig.º So[u]tomaior"; os assentos vizinhos de 1652,
  na mesma página, são assinados "o Vig.º Ant.º Coelho Sotto[ma]yor". Esta imagem primária
  actualiza E-0129 de strong-evidence para confirmed e eleva P-0125 de documentação apenas
  compilada a documentação primária.
reliability:
  assessment: >-
    Primary source (original parish death register), read from the native-maximum CDN image
    at magnification. The subject's name, the day, month and year, the mention of the
    sacraments, the burial inside the church and the marginal "meu pai" annotation are all
    legible. The date matches PUB-0005 exactly, and the surname as written ("Cardozo")
    matches the son's surname in PAR-0087/PAR-0088 ("Ponte Cardoso"). Evidence quality:
    confirmed for the death date, place, burial and the register form of the name.
  informant: >-
    The officiating vicar of São Sebastião, who signs "o Vig.º So[u]tomaior" and annotates
    the margin "meu pai" — i.e. a son of the deceased, writing in 1652
  limitations: >-
    One word at the start of the burial clause could not be read (possibly "matriz") and is
    marked [illegible]; the formula "[por ser ver]dade" is a reconstructed expansion of a
    partly-abraded line. The signature on this act gives no forename, only "o Vig.º
    So[u]tomaior", so the annotator's identity is established by inference from the
    neighbouring signatures and from PUB-0005 rather than stated here (see notes).
    Whole-spread image; the act is one of four entries on the right-hand page. Resolution
    1239×944 px — this is the CDN's published maximum for the page, not a processing loss.
