notes:
- text: >-
    NAME CORRECTION. This act is the primary evidence for the repository's preferred name
    "Manuel da Ponte Cardoso" (P-0125). The register writes "m.el de Ponte Cardozo"; the
    surname "Valadão" does not appear in it. "Manuel da Ponte Valadão" is retained as a
    name variant sourced to the compiled genealogy PUB-0005 (Vol. IX, p.259), which derives
    the Valadão element from his mother Catarina Valadão and itself records the alternative
    "ou Manuel da Ponte Cardoso". PUB-0005 is not altered — it legitimately records what
    the compilation says.
- text: >-
    The three-line marginal annotation "M.el de Pon / te Cardozo / meu pai" is a first-person
    statement by the priest keeping the book: the deceased was his father. Taken with the
    same priest's first-person entry for Maria da Costa Leonardes in 1654 ("minha mãi …
    molher de M.el de Ponte Cardoso meu pai", PAR-0098), it proves that the officiating
    vicar of São Sebastião was a son of this couple.
- text: >-
    IDENTIFICATION OF THE VICAR — divergence from the retrieval agent's handoff note. The
    retrieval plan named the vicar "Manoel Coelho Souto Maior". The image does not support
    that reading: this act is signed only "o Vig.º So[u]tomaior" (no forename), while the
    neighbouring 1652 entries on the same page are signed "o Vig.º Ant.º Coelho
    Sotto[ma]yor" [uncertain expansion], and PAR-0089 (1684, same book) gives the vicar as
    "Antônio Coelho Sotomayor". PUB-0005 (Vol. IX, p.259) lists exactly one priest among
    this couple's children — António Coelho Souto-Maior, b. 13 February 1619, d. 17 July
    1686, padre vigário of the Matriz de São Sebastião — and no son named Manoel. The
    officiating son is therefore identified as António Coelho Souto-Maior. "M.el" in the
    margin is the deceased's own forename (Manoel), not the annotator's; that is the likely
    origin of the handoff's error.
- text: >-
    Book context: this is the same register that yielded PAR-0088 (Belchior da Ponte
    Cardoso, 1687) and PAR-0089 (Mariana Fagundes, 1684), and PAR-0098 (Maria da Costa
    Leonardes, 1654) two images later.
