notes:
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.6), checked
    word by word on the image. (1) The mother's forename is read "Rosa" (the letter after "Ro"
    has the form of an s), where the draft has "Roza". (2) The lugar is twice "de Quintaã" (line
    2 and "do sobredicto lugar de Quintaã"), where the draft has "da Quintãa"; the tilde is
    written over the end of the word. (3) The tildes are kept where the priest put them: "Manoel
    Joaõ", "Sam Romaõ", "imposiçaõ", "Joaõ Lopes". Everything else in the draft is confirmed,
    including "irmaã do Pai do Baptizado" and the officiant's signature. The draft's two doubtful
    readings stay doubtful: the maternal grandparents' lugar ("Anjeyrôa") and the godfather's
    wife ("Luzia").
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.6), conferido palavra por palavra na imagem. (1) O
    prenome da mãe é lido "Rosa" (a letra depois de "Ro" tem a forma de um s), onde o rascunho
    tem "Roza". (2) O lugar aparece duas vezes como "de Quintaã" (linha 2 e "do sobredicto lugar
    de Quintaã"), onde o rascunho tem "da Quintãa"; o til está escrito sobre o fim da palavra.
    (3) Os tis foram mantidos onde o padre os pôs: "Manoel Joaõ", "Sam Romaõ", "imposiçaõ",
    "Joaõ Lopes". Todo o resto do rascunho foi confirmado, incluindo "irmaã do Pai do Baptizado"
    e a assinatura do oficiante. As duas leituras duvidosas do rascunho continuam duvidosas: o
    lugar dos avós maternos ("Anjeyrôa") e a mulher do padrinho ("Luzia").
- text: >-
    Identification. The child is identified with Manoel João Fernandes da Cruz (P-0139) because
    the parents named here, Bento José Fernandes and Joaquina Rosa of Quintã, Ucha, are the
    parents named at his 1855 marriage (PAR-0107: "Manoel João filho legitimo de Bento Fernandes,
    e de Joaquina Roza do lugar de Quintão"), and his children's Pousa baptisms name the same
    couple as their paternal grandparents (PAR-0108 for Thereza). Thereza's 1864 baptism also
    calls him a native of São Romão da Ucha. The retrieval side's sweep of this baptism book
    reports him as the only Manoel João among the couple's eight children baptised there
    (1829–1843).
  text_pt: >-
    Identificação. A criança é identificada com Manoel João Fernandes da Cruz (P-0139) porque os
    pais aqui nomeados, Bento José Fernandes e Joaquina Rosa, de Quintã, Ucha, são os pais
    nomeados no casamento dele em 1855 (PAR-0107: "Manoel João filho legitimo de Bento Fernandes,
    e de Joaquina Roza do lugar de Quintão"), e os batismos dos filhos dele em Pousa nomeiam o
    mesmo casal como avós paternos (PAR-0108, de Thereza). O batismo de Thereza em 1864 também o
    diz natural de São Romão da Ucha. A varredura deste livro de batismos feita pela pesquisa de
    recuperação o aponta como o único Manoel João entre os oito filhos do casal ali batizados
    (1829–1843).
- text: >-
    Name forms recorded here, for the name variants: the father is "Bento José Fernandes"; the
    mother "Joaquina Rosa" (no Lopes); the paternal grandparents "Manoel Fernandes" and "Jozefa
    Maria", both "do mesmo lugar" (Quintã, Ucha); the maternal grandparents "Ignacio José Lopes"
    and "Marianna da Silva", of Santa Christina da Pouza. Other records give the maternal
    grandfather as "Ignacio Lopes", "Ignacio Francisco Lopes" and "Joze Lopes", and the maternal
    grandmother as "Marianna Luiza da Silva" and "Marianna Francisca da Silva" (per the retrieval
    side's reading of the siblings' baptisms; not read here).
  text_pt: >-
    Formas de nome registradas aqui, para as variantes: o pai é "Bento José Fernandes"; a mãe
    "Joaquina Rosa" (sem Lopes); os avós paternos "Manoel Fernandes" e "Jozefa Maria", ambos "do
    mesmo lugar" (Quintã, Ucha); os avós maternos "Ignacio José Lopes" e "Marianna da Silva", da
    freguesia de Santa Christina da Pouza. Outros registros dão o avô materno como "Ignacio
    Lopes", "Ignacio Francisco Lopes" e "Joze Lopes", e a avó materna como "Marianna Luiza da
    Silva" e "Marianna Francisca da Silva" (segundo a leitura da pesquisa de recuperação dos
    batismos dos irmãos; não lidos aqui).
- text: >-
    The godparents, and what bears on modelling. The godfather João Lopes, of the lugar de
    Gondomar, Salvador da Lama, was married to [Luzia, uncertain], who the entry calls "irmaã do
    Pai do Baptizado", a sister of Bento José Fernandes. She is therefore a documented daughter
    of Manoel Fernandes and Jozefa Maria (F-0072). Her forename is uncertain, so any
    documented_children entry should carry the uncertainty. The godmother was Maria Thereza, wife
    of André Domingues de Macedo, of the lugar de Quintã in Ucha. This André Domingues de Macedo
    is not to be merged with André Domingues (P-0149), Bento's maternal grandfather in the 1807
    baptism (PAR-0109): that man was of Salvador da Lama and a generation older. A kinship
    between them is possible but nothing here states it.
  text_pt: >-
    Os padrinhos, e o que interessa à modelagem. O padrinho João Lopes, do lugar de Gondomar,
    Salvador da Lama, era casado com [Luzia, incerto], que o assento chama "irmaã do Pai do
    Baptizado", ou seja, uma irmã de Bento José Fernandes. Ela é, portanto, uma filha documentada
    de Manoel Fernandes e Jozefa Maria (F-0072). O prenome dela é incerto, e uma eventual entrada
    em documented_children deve levar essa incerteza. A madrinha foi Maria Thereza, mulher de
    André Domingues de Macedo, do lugar de Quintã, na Ucha. Este André Domingues de Macedo não
    deve ser fundido com André Domingues (P-0149), avô materno de Bento no batismo de 1807
    (PAR-0109): aquele era do Salvador da Lama e uma geração mais velho. Um parentesco entre eles
    é possível, mas nada aqui o afirma.
- text: >-
    Places and dates. Birth 25 April 1833 and baptism 30 April 1833, both stated. The parents
    and the paternal grandparents lived at the lugar de Quintã, São Romão da Ucha. The maternal
    grandparents were of Santa Cristina de Pousa (Barcelos); their lugar is not securely read. No
    occupations and no ages are given.
  text_pt: >-
    Lugares e datas. Nascimento em 25 de abril de 1833 e batismo em 30 de abril de 1833, ambos
    declarados. Os pais e os avós paternos moravam no lugar de Quintã, São Romão da Ucha. Os avós
    maternos eram da freguesia de Santa Cristina de Pousa (Barcelos); o lugar deles não tem
    leitura segura. Não se declaram profissões nem idades.
