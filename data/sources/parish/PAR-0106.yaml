transcription: |-
  [Whole opening — São Romão da Ucha baptisms, DGS 004669216 image 566: the left page (fl. 29v) holds three entries, the right page (fl. 30) three more, all of 1833, every one written and signed by the Abbade Antonio José da Costa e Silva. Read from the native image (4320×2929) in strips at 1–3.5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals, accents and abbreviations are kept as written. The target entry opens the left page; the entry before it, on fl. 29, is not on this image.]

  [p1 — evidence/parish/PAR-0106-baptism-manoel-joao-1833-ucha.jpg; fl. 29v, entry 1 — TARGET]
  [No margin note beside this entry.]
  Manoel Joaõ, filho legitimo de Bento José Fernandes, e de Joaquina
  Rosa do lugar de Quintaã desta freguesia de Sam Romaõ da Ucha,
  neto paterno de Manoel Fernandes, e de sua mulher Jozefa Maria do
  mesmo lugar, e materno de Ignacio José Lopes, e de sua mulher Ma-
  rianna da Silva do lugar [an ink blot over the end of "lugar"] da [uncertain: Anjeyrôa] da freguesia de Sancta Chris-
  tina da Pouza, nasceo em o [the "em o" written over a correction] dia vinte, e cinco do mez de Abril de
  mil, e oito centos, e trinta, e tres, e no dia trinta do mesmo foi
  por mim solemnemente baptizado com imposiçaõ dos Sanctos
  Oleos na Igreja desta freguesia sendo padrinhos Joaõ Lopes caza-
  do com [uncertain: Luzia] irmaã do Pai [the words "Pai do" lie under an ink blot; the capital P, the a and the dotted i are visible] do Baptizado do lugar de Gondomar
  da freguesia do Salvador da Lama, e Maria Thereza, mulher de An-
  dré Domingues de Macedo do sobredicto lugar de Quintaã desta mes-
  ma freguesia. E para constar, fiz este assento era ut supra.
                    O Abb.e Antonio José da Costa e Silva [rubric]
  [Expansions and readings: Joaõ = João; Romaõ = Romão; Quintaã = Quintã (the tilde is written over the end of the word); Ucha — the U is formed with two loops, so the word can look like "Ulha"; Pouza = Pousa; Abb.e = Abbade (parish priest); era ut supra = in the year written above.]

  [fl. 29v, entry 2 — Maria Casimira, daughter of Manoel Martins and Justa Maria, of the lugar da Quintaã; paternal grandparents Bento Martins and Angela Fernandes, of the lugar da Gôrra [uncertain], Santo André de [illegible]; maternal grandparents João Gonçalves and Marianna Domingues; born 2 May, baptised 6 May 1833 by the cura Padre Bento José da Silva de [illegible]; godparents Luis Martins, casado, paternal uncle, and Thereza de Jesus, solteira, of the lugar da Quintaã, maternal aunt, standing as proxy for Maria Casimira de Azevedo e Magalhaens of the city of Braga. Not this family.]

  [fl. 29v, entry 3 — Maria José, daughter of Manoel José Vilaça [uncertain] and Jozefa Maria Loureira, of the lugar de Macedo; born 20 July, baptised 22 July 1833; godparents José Caetano and his wife Maria José, residents of the city of Braga. Not this family.]

  [fl. 30, entry 1 — Thereza de Jesus, daughter of Domingos Martins and Maria da Silva; born 26 July, baptised 29 July 1833; godparents Cypriano José Martins, of the lugar da Torre, paternal uncle, and Thereza Maria, solteira, daughter of João da Costa and Anna Maria Martins, of Santa Maria de Martim. Not this family.]

  [fl. 30, entry 2 — Manoel, son of Pedro Domingues and Thereza Maria de Affonseca, of the lugar de Bairro [uncertain]; born 6 August 1833 and baptised the next day; margin "morreo". Not this family.]

  [fl. 30, entry 3 — Maria Rosa, daughter of Manoel José Francisco Novo and Maria da Cunha, of the lugar de Medêla [uncertain], living at Parada de Gatim; born 9 September, baptised 12 September 1833. Not this family.]
reading_reliability: complete
abstract: >-
  Original baptism entry of Manoel João (written "Manoel Joaõ", without a surname), the first
  entry on fl. 29v of the São Romão da Ucha (Barcelos) baptism book. He was born on 25 April 1833
  and baptised on 30 April 1833 in the parish church by the Abbade Antonio José da Costa e Silva,
  who wrote and signed the entry. He was the legitimate son of Bento José Fernandes and Joaquina
  Rosa, of the lugar de Quintaã in Ucha. His paternal grandparents were Manoel Fernandes and his
  wife Jozefa Maria, of the same lugar. His maternal grandparents were Ignacio José Lopes and his
  wife Marianna da Silva, of a lugar [read as "Anjeyrôa", uncertain] in Santa Christina da Pouza.
  The godparents were João Lopes, of the lugar de Gondomar in Salvador da Lama, married to
  [Luzia, uncertain], "irmaã do Pai do Baptizado" (a sister of the child's father), and Maria
  Thereza, wife of André Domingues de Macedo, of the lugar de Quintaã. This is the baptism of
  Manoel João Fernandes da Cruz (P-0139). It names three generations of the line: his parents
  (F-0071) and both sets of grandparents (F-0072, F-0073).
abstract_pt: >-
  Assento original de batismo de Manoel João (escrito "Manoel Joaõ", sem sobrenome), o primeiro
  assento da fl. 29v do livro de batismos de São Romão da Ucha (Barcelos). Ele nasceu em 25 de
  abril de 1833 e foi batizado em 30 de abril de 1833 na igreja paroquial pelo Abade Antonio José
  da Costa e Silva, que escreveu e assinou o assento. Era filho legítimo de Bento José Fernandes e
  de Joaquina Rosa, do lugar de Quintaã, na Ucha. Os avós paternos eram Manoel Fernandes e sua
  mulher Jozefa Maria, do mesmo lugar. Os avós maternos eram Ignacio José Lopes e sua mulher
  Marianna da Silva, de um lugar [lido como "Anjeyrôa", incerto] da freguesia de Santa Christina
  da Pouza. Os padrinhos foram João Lopes, do lugar de Gondomar, freguesia do Salvador da Lama,
  casado com [Luzia, incerto], "irmaã do Pai do Baptizado" (uma irmã do pai da criança), e Maria
  Thereza, mulher de André Domingues de Macedo, do lugar de Quintaã. É o batismo de Manoel João
  Fernandes da Cruz (P-0139). Nomeia três gerações da linha: os pais (F-0071) e os dois pares de
  avós (F-0072, F-0073).
reliability:
  assessment: >-
    Original and direct. It is primary for the birth and baptism dates, the child's name, the
    parents and the godparents: the Abbade officiated in person ("foi por mim solemnemente
    baptizado") and wrote and signed the entry. The statements about the grandparents and their
    lugares are secondary, from the family or from the priest's knowledge of his parishioners;
    hence mixed. Every core fact is legible: the date, the child, both parents and all four
    grandparents. The uncertain readings fall only on the maternal grandparents' lugar in Pousa
    and on the forename of the godfather's wife.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio José da Costa e Silva, who baptised the child and
    signed the entry; the family details were presumably supplied by the parents or godparents.
  limitations: >-
    The child is written "Manoel Joaõ" with no surname; the later "Fernandes da Cruz" is not
    here. The mother is "Joaquina Rosa" without "Lopes". The maternal grandfather is "Ignacio
    José Lopes" here, whereas Joaquina's 1890 death entry (PAR-0111) calls her father "Joze
    Lopes". An ink blot covers the end of "lugar" in the maternal grandparents' line and the
    words "Pai do" in the godfather's line.
