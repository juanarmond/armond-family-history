transcription: >-
  [Livro de Casamentos, Nova Friburgo, p.234, 1864; Vigário João José Viviand.] "Aos onze de Abril
  de mil oitocentos sessenta e quatro, feitas as tres publicações canonicas, em minha presença e das
  testemunhas José Eggendorn e Anna Maria Bohrer, casarão-se solemnemente Vicente Bohrer, de trinta e
  cinco annos, filho legitimo de Lourenço Bohrer e de Anna Maria Verly, e Maria Eggendorn, de vinte
  annos, filha legitima de José Eggendorn e de Maria Freese, ambos nascidos, baptizados e moradores
  nesta freguezia. O Vigario João José Viviand."
abstract: >-
  Parish marriage of Vicente Borer (P-0070), 35 (b. ~1829), and Maria (Thecla Regina) Eggendorn
  (P-0071), 20 (b. ~1844), on 11 April 1864 at Nova Friburgo. Upgrades the marriage event E-0063 to
  confirmed and NAMES Maria's parents José Eggendorn (P-0101) × Maria Freese (P-0102) — new family
  F-0050. The bride's father José Eggendorn was also a witness. Confirms Vicente's parents (Laurent ×
  Anna Maria).
abstract_pt: >-
  Casamento paroquial de Vicente Borer (P-0070), 35 anos (n. ~1829), e Maria (Thecla Regina)
  Eggendorn (P-0071), 20 anos (n. ~1844), em 11 de abril de 1864, em Nova Friburgo. Eleva o evento de
  casamento E-0063 para confirmado e NOMEIA os pais de Maria, José Eggendorn (P-0101) × Maria Freese
  (P-0102) — nova família F-0050. O pai da noiva, José Eggendorn, foi também testemunha. Confirma os
  pais de Vicente (Laurent × Anna Maria).
reliability:
  assessment: Primary parish marriage entry — direct primary for the marriage, both ages and both filiations.
  informant: The contracting parties before the vicar João José Viviand.
  limitations: Delivered via the Fundação D. João VI digitisation (C-009). The bride's given name is read "Maria/Maria Eugenia/Maria Regina" across records; "Maria Thecla Regina" from her 1844 baptism governs.
