transcription: >-
  [Taufregister, Nova Friburgo, S.22, 1844, Nr. 22.] "Den 16ten 9br [November] wurde dem Colonisten
  Joh. Klein, und seiner Ehefrau Anna Margar[etha], née geborene [Neis — uncertain], ein Söhnchen
  geboren, den 4ten März getauft und Jacob genannt. Taufzeugen waren: Jacob Schneider, und
  Elisabeth, Tochter von Jacob Klein, [Küster] daselbst."
transcription_pt: >-
  [Registro de batismos, Nova Friburgo, p.22, 1844, nº 22.] "No dia 16 de novembro nasceu, ao
  colono Joh[ann] Klein e à sua esposa Anna Margar[etha], nascida [Neis — incerto], um menino,
  baptizado em 4 de março e chamado Jacob. Foram padrinhos: Jacob Schneider e Elisabeth, filha de
  Jacob Klein, [sacristão] no mesmo lugar."
abstract: >-
  Lutheran baptism of Jacob Klein (P-0103) — Iris Bohrer Muniz's Swiss-colony great-grandfather
  on the Klein line — born 16 November 1844 and baptised 4 March 1845 at Nova Friburgo. NAMES HIS
  PARENTS: the colonist Johannes (Joh.) Klein (P-0105) and Anna Margaretha née [Neis — uncertain]
  (P-0106). Source for the birth event E-0090 and the parent family F-0052 (new).
abstract_pt: >-
  Batismo luterano de Jacob Klein (P-0103) — bisavô de linhagem suíça de Iris Bohrer Muniz na
  linha Klein — nascido em 16 de novembro de 1844 e baptizado em 4 de março de 1845, em Nova
  Friburgo. NOMEIA SEUS PAIS: o colono Johannes (Joh.) Klein (P-0105) e Anna Margaretha, nascida
  [Neis — incerto] (P-0106). Fonte do evento de nascimento E-0090 e da família de pais F-0052
  (nova).
