transcription: >-
  [Batismo — Livro de batismos, Matriz de N.S. da Piedade da Borda do Campo
  (Barbacena); Capela de São José do Ribeirão. A two-page termo held across both
  digital images: it begins at the foot of the right-hand page in
  PAR-0049-…-p1.jpg (folio 9) and completes at the head of the left-hand page in
  PAR-0049-…-p2.jpg (folio 9v, margin note "Ritta"). Read from the register images
  2026-08-12; the paternal- and maternal-grandparent clauses are ink-damaged and
  read only tentatively, and the celebrant's surname and the exact baptism-day word
  are also uncertain.]

  [p1, folio 9 — foot of page:] "Aos [nove] dias do mes de Março de mil e sete
  centos e sessenta e quatro annos, na Capella de São José do Ribeirão, filial desta
  Matriz de Nossa Senhora da Piedade da Borda do Campo, o Padre Manoel
  [Ferreira Cortez?] de licença minha batizou solenemente e pôs os santos
  [p2, folio 9v — head of page continues:] óleos a Ritta, filha de João Roiz
  [Rodrigues] Valle, natural da freguesia de São Martinho de Ruivães, Arcebispado
  de Braga, e de sua
  mulher Isabel Ribeira, natural desta freguesia. Foi [avós] por parte paterna João
  Roiz [da Cunha?] e sua mulher Joanna [Angela?], naturais da dita freguesia de
  [Ruivães]; e pela materna, [Man]uel Pestana, natural da freguesia de Nossa Senhora
  do Rosário da Ilha de São Jorge, Bispado de Angra [dos Açores], e de sua mulher
  Anna Francisca [uncertain], natural [da freguesia de São Jorge]. Foram padrinhos
  Silvestre de Lima, solteiro, e Maria, filha de José Lopes de Oliveira, todos desta
  freguesia. Nasceu no dia três de Março do dito anno, de que fiz este assento. O
  Vigario Feliciano Pitta de Castro."
abstract: >-
  The 1764 Barbacena baptism of Ritta Angélica Rodrigues (P-0058): born 3 March
  1764, baptized 9 March 1764 at the Capela de São José do Ribeirão (filial of the
  Matriz de N.S. da Piedade da Borda do Campo, Barbacena). She is named daughter of
  João Rodrigues (Roiz) Valle (P-0078) — "natural da freguesia de São Martinho de
  Ruivães, Arcebispado de Braga" — and Isabel Ribeira / Ribeiro de Lima (P-0079),
  "natural desta freguesia". This is the PRIMARY confirmation of her parentage
  (family F-0038, previously strong-evidence inferred from her marriage) and resolves
  the earlier low-legibility "José vs João" doubt on her father's forename in favour
  of João; it also primary-confirms the Ruivães (Braga) origin of the Rodrigues Valle
  line. The ink-damaged grandparent clauses — paternal João Roiz × Joanna of Ruivães;
  maternal a Pestana couple of Nossa Senhora do Rosário, Ilha de São Jorge (Açores),
  "[Man]uel Pestana × Anna Francisca" — are recorded as leads only, pending a clearer
  image or corroborating record. Godparents Silvestre de Lima and Maria (daughter of
  José Lopes de Oliveira); vigário Feliciano Pitta de Castro.
abstract_pt: >-
  O batismo de 1764, em Barbacena, de Ritta Angélica Rodrigues (P-0058): nascida em
  3 de março de 1764, batizada em 9 de março de 1764 na Capela de São José do
  Ribeirão (filial da Matriz de N.S. da Piedade da Borda do Campo, Barbacena).
  Nomeada filha de João Rodrigues (Roiz) Valle (P-0078) — "natural da freguesia de
  São Martinho de Ruivães, Arcebispado de Braga" — e de Isabel Ribeira / Ribeiro de
  Lima (P-0079), "natural desta freguesia". É a confirmação PRIMÁRIA de sua filiação
  (família F-0038, antes evidência forte inferida de seu casamento) e resolve a
  dúvida anterior, de baixa legibilidade, sobre o prenome do pai ("José vs João") em
  favor de João; confirma também, por registro primário, a origem em Ruivães (Braga)
  da linha Rodrigues Valle. As cláusulas dos avós, danificadas por tinta — paternos
  João Roiz × Joanna, de Ruivães; maternos um casal Pestana de Nossa Senhora do
  Rosário, Ilha de São Jorge (Açores), "[Man]uel Pestana × Anna Francisca" — ficam
  registradas apenas como pistas, até uma imagem mais nítida ou registro
  corroborante. Padrinhos Silvestre de Lima e Maria (filha de José Lopes de
  Oliveira); vigário Feliciano Pitta de Castro.
reliability:
  assessment: >-
    An original parish baptism register entry; primary, direct evidence for Ritta
    Angélica's birth (3 March 1764), baptism (9 March 1764) and parentage. It upgrades
    the F-0038 parent edge from strong-evidence (a name-match from her marriage) to
    primary, and settles the "José vs João" forename doubt in favour of João.
  informant: >-
    The vigário Feliciano Pitta de Castro of N.S. da Piedade da Borda do Campo,
    recording the baptism performed by Padre Manoel [Ferreira Cortez?] under licence.
  limitations: >-
    The grandparent clauses are ink-damaged and read only tentatively (marked
    [uncertain]); the celebrant's surname and the exact baptism-day word ("nove"=9,
    vs the FamilySearch index's "12") carry minor uncertainty. Identity is not in
    doubt (parents, place and the 3-March birth are legible).
