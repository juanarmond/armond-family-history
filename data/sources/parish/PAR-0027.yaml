transcription: >-
  [Catholic parish baptism register, Grindel, Solothurn. Page 571.
  Column headers: Date | Parentes | Infantes | Patrini (Godparents).
  Two entries for the Johannes Wehrli × Barbara Alleman family are transcribed;
  other entries on the page are omitted.]

  Row 2 — 17 Januar. 1751:
    Parents: Gofannef [Johannis] Whroli [Wehrli] / Barbara Allman [Alleman]
    Infant: Gofannef Jacobif [Johannem Jacobum, i.e. Johann Jacob]
    Godparents: Hans Jacob Heggendorn / Anna [surname illegible]

  Row 6 — 23 Junij 1752:
    Parents: Gofannef [Johannis] Whroli [Wehrli] / Barbara Allman [Alleman]
    Infant: Gofannef Johef [Johannem Josephum, i.e. Johann Joseph]
    Godparents: Johef [Josephus] Whroli [Wehrli] / Anna [surname illegible]

  [Spelling note: "Gofannef" is the German cursive rendering of "Johannis/Johannes"
  (Gothic J→G, h→f); "Whroli/Alroli" is the cursive rendering of "Wehrli."
  Row 2 shows "Alroli" which on comparison with Row 6 "Whroli" is the same name
  in variant scribal spelling. "Allman/Alleman" is the consistent maternal surname.]
