notes:
- text: >-
    The same register page contains several other entries for Jacob Born/Borer families
    (5 April 1752, 7 November 1752, 3 March 1753) and a Heggendorn couple. These
    are not transcribed as they are unrelated to the direct genealogical line.
- text: >-
    The godfather at Johann Jacob Wehrli's 1751 baptism is "Hans Jacob Heggendorn."
    The same Heggendorn surname appears in the 1781–1784 Grindel register as Catharina
    Heggendorn, wife of Jacob Borer (a lead for Laurent Borer's parents). The Grindel
    community was small and these families are likely neighbours or kin.
- text: >-
    Basis for "Catholic" (documented inference, not a surname guess): the register is
    kept in ecclesiastical Latin with "Patrini" (godparents) — a Roman Catholic
    sacramental form; contemporary Swiss Reformed registers were kept in German without
    patrini. Grindel (church of St. Stephan) lies in Bezirk Thierstein / Schwarzbubenland,
    canton of Solothurn, under the Roman Catholic Diocese of Basel (Bistum Basel-Solothurn);
    the Schwarzbubenland reverted to Catholic in the 17th century and was Catholic by the
    1751/1752 dates of these entries. The confession is thus established by liturgical
    language and ecclesiastical jurisdiction, not by the family surnames.
