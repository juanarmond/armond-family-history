transcription: >-
  [Casamento — Livro SMG-PV-MAEDEDEUS-C-1841-1854, N.S. Mãe de Deus, Povoação;
  folio 73r (scan image 74, right page). Transcription partial — parent names
  not clearly legible at scan resolution.]

  Como primeiro dia de Fevereiro de mil oitocentos quarenta e cinco... [texto do
  acto contendo] Manoel [Muniz] Byttancourt, filho de [ilegível] e de [ilegível];
  e Francisca Roza [do Espírito Santo], filha de [ilegível] e de [ilegível]...
  [Cura?] José Pires [Loreto?].

  [Nota: anotação de margem na página: "Roza d[o Espírito Santo?]" — o apelido
  marital da nubente usado como índice de margem.]
  [Nota: página p2 (folio 73v, scan image 75) é um acto diferente do mesmo dia
  1 de Fevereiro de 1845 para um outro casal (Francisco × Francisca) — NÃO é
  continuação do nosso acto, que está contido integralmente no folio 73r.]
abstract: >-
  Marriage on 1 February 1845 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of Manoel Muniz Byttancourt (P-0042) and Francisca Roza do Espírito Santo
  (P-0047). The marriage date is exactly nine months before their son João's
  birth on 24 October 1845 (PAR-0022), consistent with timing. Both spouses'
  parents are present in folio 73r but not legible at current scan resolution.
  The bride's father initial tentatively reads "J" (consistent with José
  Pacheco, the working hypothesis from PAR-0022 context indicators), and a
  witness signature reads "António [José?] Pacheco." The marriage act is
  fully contained in folio 73r; folio 73v (p2) is a second, unrelated marriage
  also dated 1 February 1845.
reliability:
  assessment: >-
    An original parish register entry, primary evidence for the marriage date and
    the identity of the couple. The marriage itself is confirmed; the parents of
    both spouses are present in the act but illegible at current scan resolution
    and must not be promoted until the full-resolution image or a paleographer
    reading confirms the names.
  informant: >-
    The parish priest or cura of N.S. Mãe de Deus, Povoação, recording the
    marriage as an officer of the church.
  limitations: >-
    Parent names of both spouses are illegible at scan resolution. A higher-
    resolution image or in-person reading at BPARPD Ponta Delgada is required to
    confirm the Pacheco hypothesis or the FS Tree alternative for Francisca Roza's
    parents. Do not promote either hypothesis to a person entity until the folio
    73r body text is legibly read.
