notes:
  - text: >-
      CORRECTION (11 August 2026): PAR-0024 previously pointed to folio 73r of the
      same book and was dated 1 February 1845, with the parents illegible under a
      BPARPD watermark. Re-reading the book on the Culturacores CDN showed that
      folio 73r is a different couple entirely — a late-1845 "Manoel × Roza de
      Jesus" whose groom's father is "António" — i.e. a namesake mis-identification.
      The true marriage of Manoel Muniz Bitancourt × Francisca Roza do Espírito
      Santo is folio 32r, 17 February 1842, where both parent couples are legible
      and the groom's parents match F-0023. The scan and event date were corrected
      accordingly; the earlier folio-73r reading is superseded, not evidence about
      this family.
  - text: >-
      Reconciled with the BPARPD Ponta Delgada archive reply SE/2026/1583e (proc.
      16.04.01/2026/221), which independently transcribes this 1842 act and the
      1819 grandparents' marriage (PAR-0037). The couple's own child João's 1845
      baptism (PAR-0022) remains the direct attestation of João's parentage; this
      marriage now anchors both spouses' parents.
