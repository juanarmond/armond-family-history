abstract: >-
  Marriage on 1 February 1845 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of Manoel Muniz Byttancourt (P-0042) and Francisca Roza do Espírito Santo
  (P-0047). The marriage date is exactly nine months before their son João's
  birth on 24 October 1845 (PAR-0022), consistent with timing. Re-read 2026-08-07
  from enhanced image crops: the groom's father tentatively reads as "António
  [surname illegible]"; the bride's father tentatively reads as "Manuel Joaquim
  [surname illegible]" — revising the earlier hypothesis of "J" initial / "José
  Pacheco" for the bride's father. A witness signature reads "M.to António José
  [Pacheco?]". Parent surnames remain unconfirmed; the BPARPD watermark obscures
  the body text. The act is fully contained in folio 73r; folio 73v is a second
  unrelated marriage of the same date.
abstract_pt: >-
  Casamento em 1 de fevereiro de 1845 em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de Manoel Muniz Byttancourt (P-0042) e Francisca Roza do Espírito Santo
  (P-0047). A data do casamento é exatamente nove meses anterior ao nascimento do
  filho do casal, João, em 24 de outubro de 1845 (PAR-0022), coerente com a
  cronologia. Releitura em 2026-08-07 a partir de recortes de imagem realçados: o
  pai do noivo lê-se tentativamente como "António [sobrenome ilegível]"; o pai da
  noiva lê-se tentativamente como "Manuel Joaquim [sobrenome ilegível]" — revisando
  a hipótese anterior de inicial "J" / "José Pacheco" para o pai da noiva. Uma
  assinatura de testemunha lê-se "M.to António José [Pacheco?]". Os sobrenomes dos
  pais permanecem não confirmados; a marca d'água do BPARPD obscurece o corpo do
  texto. O ato está integralmente contido no fólio 73r; o fólio 73v é um segundo
  casamento, não relacionado, da mesma data.
reliability:
  assessment: >-
    An original parish register entry, primary evidence for the marriage date and
    the identity of the couple. The marriage itself is confirmed; the parents of
    both spouses are present in the act but illegible at current scan resolution
    and must not be promoted until the full-resolution image or a paleographer
    reading confirms the names.
  informant: >-
    The parish priest or cura of N.S. Mãe de Deus, Povoação, recording the
    marriage as an officer of the church.
  limitations: >-
    Parent surnames of both spouses remain illegible at current scan resolution.
    A higher-resolution image or in-person reading at BPARPD Ponta Delgada is
    required to confirm the tentative first-name reads ("António" for groom's
    father; "Manuel Joaquim" for bride's father) and resolve the surnames. The
    BPARPD watermark overlay obscures a strip through the body text. Do not
    promote any parent to a person entity until the folio 73r body text is
    legibly confirmed. The earlier "J initial / José Pacheco" hypothesis for the
    bride's father is now contradicted by the re-read and should not be pursued
    without further evidence.
