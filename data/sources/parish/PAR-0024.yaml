transcription: >-
  [Casamento — Livro SMG-PV-MAEDEDEUS-C-1841-1854, N.S. Mãe de Deus, Povoação;
  folio 73r (scan image 74, right page). Re-read 2026-08-07 from enhanced crops
  of the evidence scan. The BPARPD watermark overlays the centre of the page and
  partially obscures the body text; parent surnames remain uncertain.]

  [Cabeçalho de margem: "M.el" (Manoel) | "Roza" | "de Jezus" (ou "Jesus") —
  índices marginais do acto.]

  "Como primeiro dia de Fevereiro de mil oitocentos quarenta e cinco" [1845-02-01]
  [procedural text: solenidade, proclamas, ausência de impedimentos, na Paróquia de
  N.S. Mãe de Deus desta Freguesia de Povoação]...

  [Partes:] "Manuel [Muniz? / Ferreira?] filho de António [uncertain surname] e de
  [Antónia?] de Jesus"; e "[Francisca] Rosa [do Espírito Santo?] filha de Manuel
  Joaquim [uncertain surname] [e de (mother name illegible)]".

  [Nota: o nome do pai do noivo começa por "António" — leitura tentativa do corpo
  do acto; o apelido permanece ilegível devido à resolução da digitalização e à
  sobreposição da marca de água BPARPD. O nome do pai da noiva lê-se tentativamemente
  como "Manuel Joaquim [?]", contrariando a hipótese de trabalho "José Pacheco" que
  constava da versão anterior desta transcrição.]

  [Assinaturas:] "O [Cura?] José António [Brandão? / Botton?]" [rubrica] /
  "O Cura José [P.] [Lopes?] [Simão? / Silvano?]" [rubrica — provavelmente o pároco
  celebrante] / "M.to António José [Pacheco?]" [testemunha] /
  "[J.s?] [?] [?] Sant'António" [quarta assinatura — ilegível]

  [Anotação de margem posterior:] "25 de Janeiro de 1866" [data de uma certificação
  ou publicação posterior, não genealógica]

  [Nota: página p2 (folio 73v, scan image 75) é um acto diferente do mesmo dia
  1 de Fevereiro de 1845 para um outro casal — NÃO é continuação deste acto, que
  está contido integralmente no folio 73r.]
