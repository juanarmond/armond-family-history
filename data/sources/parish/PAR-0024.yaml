transcription: >-
  [Casamento — Livro SMG-PV-MAEDEDEUS-C-1841-1854, N.S. Mãe de Deus, Povoação;
  folio 32 recto (viewer p33). Read from the register image 2026-08-11.]

  "Em os de[z] e sette dias do mez de Fevereiro de mil oito centos quarenta e
  dois, nesta Parochial Igreja de Nossa Senhora Mãe de Deus da Villa da Povoação,
  depois de feitas as tres denunciações canonicas nesta dita Parochial e na
  Ermida de Santa Barbara, filial da mesma, sem se descobrir impedimento algum
  além do quarto grão de consanguinidade em que forão dispensados [por Dispensa
  Apostolica], por mandado do Muito Reverendo Ouvidor deste Districto José Tavares
  de Medeiros, em presença do Vigario proprio della e das testemunhas José
  Jacintho Botelho e Estevão Manoel e de outras muitas pessoas que presentes
  estavão, se receberão solenemente por palavras de presente in facie Ecclesiae
  Manoel [Munis] Bitancourt, filho do dito João Munis Bitancourt e de Maria
  Euginia [Eugenia] de Medeiros, e Francisca Roza do Espirito Santo, filha de
  Manoel de Motta mancebo e de Anna de Souza, ambos naturaes e freguezes desta
  [Parochial onde forão baptizados] ... O Cura José Antonio Barbosa. [O Vigario]
  Julião Francisco [Tavares]. José Jacintho Botelho. Estevão [+] Manoel."
abstract: >-
  Marriage on 17 February 1842 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of Manoel Muniz Bitancourt (P-0042) and Francisca Roza do Espírito Santo
  (P-0047), dispensed from an impediment of the fourth degree of consanguinity.
  The act legibly names both parent couples: the groom is son of João Muniz
  Bitancourt (P-0048) and Maria Eugenia [= Jacintha] de Medeiros (P-0049) — a
  second primary confirmation of family F-0023 — and the bride is daughter of
  Manoel de Motta [var. Mello] mancebo (P-0086) and Anna de Souza (P-0087), family
  F-0042. Witnesses José Jacintho Botelho and Estevão Manoel; officiant Cura José
  Antonio Barbosa under Vigário Julião Francisco Tavares. CORRECTION: this
  supersedes the earlier binding of PAR-0024 to folio 73r (a late-1845 marriage of
  a different "Manoel × Roza de Jesus" couple, groom's father "António"), which was
  a namesake mis-identification; the true act of this couple is folio 32r (1842).
abstract_pt: >-
  Casamento em 17 de fevereiro de 1842, em Nossa Senhora Mãe de Deus, Povoação,
  São Miguel, de Manoel Muniz Bitancourt (P-0042) e Francisca Roza do Espírito
  Santo (P-0047), dispensados de um impedimento de quarto grau de consanguinidade.
  O ato nomeia legivelmente os dois casais de pais: o noivo é filho de João Muniz
  Bitancourt (P-0048) e Maria Eugenia [= Jacintha] de Medeiros (P-0049) — uma
  segunda confirmação primária da família F-0023 — e a noiva é filha de Manoel de
  Motta [var. Mello] mancebo (P-0086) e Anna de Souza (P-0087), família F-0042.
  Testemunhas José Jacintho Botelho e Estevão Manoel; celebrante o Cura José
  Antonio Barbosa sob o Vigário Julião Francisco Tavares. CORREÇÃO: isto supera a
  ligação anterior de PAR-0024 ao fólio 73r (um casamento de fins de 1845 de um
  casal "Manoel × Roza de Jesus" diferente, com o pai do noivo "António"), que foi
  uma identificação equivocada por homonímia; o ato verdadeiro deste casal é o
  fólio 32r (1842).
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the marriage
    date, the couple's identity and both parent couples, all legible on the image.
    The consanguinity dispensation (fourth degree) confirms the two families were
    already related.
  informant: >-
    The Cura José Antonio Barbosa of N.S. Mãe de Deus, Povoação, recording the
    marriage as an officer of the church under the parish vicar.
  limitations: >-
    A few procedural words are abbreviated or worn; the groom's surname is written
    "Munis" (variant of Muniz) and the groom's mother appears as "Euginia/Eugenia"
    (the same woman recorded "Jacintha" in five other acts — see F-0023). The
    exact day reads "de[z] e sette" (17); confirmed by BPARPD reply SE/2026/1583e.
