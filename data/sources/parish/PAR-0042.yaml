transcription: >-
  [Baptismo — Livro SMG-PV-MAEDEDEUS-B-1835-1839, N.S. Mãe de Deus, Povoação;
  left-hand act of the opening whose facing recto bears folio 237. Read from the
  register image 2026-08-12. À margem, em mão posterior:
  "[uncertain: fis certidão] em 22 de Fev.º [uncertain: Fevereiro] de 1857. O
  Cura Pacheco."]

  "Francisco filho legitimo de João Muniz Bitancourt, e de sua mulher Maria
  Jacinta, naturaes, e freguez[es] desta Parochial de Nossa Senhora Mãe de Deos
  do Lugar da Povoação, nasceo em quinze de Abril de mil oito centos trinta e
  nove, e foi baptizado a vinte e hum do dito mez, e Era, nesta referida
  Parochial por mim Antonio José Pacheco, Vigario d'Ella; e foraõ Padrinhos
  Manoel José da Costa, e sua mulher Victoria de Medeiros, testemunhas Francisco
  Jacinto Botelho, e Antonio Muniz Pacheco, e para constar lavrei este termo dia,
  mez, e Era ut supra. O Vigario Antonio José Pacheco."
abstract: >-
  Baptism on 21 April 1839 at Nossa Senhora Mãe de Deus, Povoação, São Miguel, of
  Francisco, born 15 April 1839, legitimate son of João [Francisco] Muniz
  Bitancourt (P-0048) and his wife Maria Jacinta [de Medeiros] (P-0049), family
  F-0023 — a collateral sibling of the modelled Manoel Muniz Bytancourt (P-0042),
  another child of the same couple. Officiant Vigário Antonio José Pacheco;
  godparents Manoel José da Costa and his wife Victoria de Medeiros (this couple's
  recurring compadrio); witnesses Francisco Jacinto Botelho and Antonio Muniz
  Pacheco. A later marginal annotation dated 22 [February] 1857 and signed "O
  Cura Pacheco" records a subsequent act/certificate.
abstract_pt: >-
  Baptismo em 21 de abril de 1839, em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de Francisco, nascido em 15 de abril de 1839, filho legítimo de João
  [Francisco] Muniz Bitancourt (P-0048) e de sua mulher Maria Jacinta [de
  Medeiros] (P-0049), família F-0023 — irmão colateral do modelado Manoel Muniz
  Bytancourt (P-0042), outro filho do mesmo casal. Celebrante o Vigário Antonio
  José Pacheco; padrinhos Manoel José da Costa e sua mulher Victoria de Medeiros
  (o compadrio recorrente deste casal); testemunhas Francisco Jacinto Botelho e
  Antonio Muniz Pacheco. Uma anotação marginal posterior, datada de 22 de
  [fevereiro] de 1857 e assinada "O Cura Pacheco", regista um ato/certidão
  posterior.
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the baptism
    of Francisco and his parentage (father João Muniz Bitancourt, mother Maria
    Jacinta), all legible on the image. The parents match family F-0023, and the
    godparent couple Manoel José da Costa × Victoria de Medeiros is the recurring
    compadrio also present at this couple's 1831/1833/1834/1836/1841 children,
    locking the identification.
  informant: >-
    The Vigário Antonio José Pacheco of N.S. Mãe de Deus, Povoação, recording the
    baptism ex officio.
  limitations: >-
    The entry names the father as "João Muniz Bitancourt" (without the "Francisco"
    of his 1819 marriage act, PAR-0037) and the mother as "Maria Jacinta" with no
    surname; identity rests on the parents' names plus the recurring godparent
    couple. A later marginal annotation (22 [February] 1857, "O Cura Pacheco") is
    only partly legible.
