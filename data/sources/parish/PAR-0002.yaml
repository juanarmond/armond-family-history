transcription: >-
  "...Ao primeiro dia do mez de Agosto de mil oito centos e setenta e nove, nesta
  Matriz me foi apresentada a certidão de sentença do theor seguinte: 'Haja por
  justificado o casamento do justificante Francisco José Bohrer com a justificada
  Rosa Eugenia de Lemos, o qual foi celebrado em casa do pai de José Antunes de
  Lemos em presença do Reverendo Rufino José Alves, Coadjuctor da Freguezia de
  Itaborahy, e das testemunhas José Antunes de Lemos, José Antonio da Costa,
  Genoveva Campbell da Costa [uncertain: e mais de vinte annos], segundo
  [uncertain: depuseram] as testemunhas de folhas, o que julgo por sentença.
  Portanto se dê instrumento para a vista d'elle e Reverendo Parocho respectivo
  abrir assentamento no livro da parochia. Rio, trinta de Junho de 1879. Monsenhor
  Felix d'Albuquerque.' Nada mais se continha na dita certidão de sentença que fica
  archivada; de que fiz este assento. [assinatura] O Vigário J.º Mariano de Castro
  [uncertain]."
abstract: >-
  An 1879 parish record at the Nova Friburgo Matriz registering the judicial
  justification (justificação de casamento) of the marriage of Francisco José
  Bohrer (P-0034) and Rosa Eugenia de Lemos (P-0035) — the parents of Joaquim José
  Bohrer (P-0030), hence Celina's paternal grandparents. The marriage had been
  celebrated earlier before the coadjutor of the Freguesia de Itaboraí, at the
  house of José Antunes de Lemos's father, with José Antunes de Lemos among the
  witnesses (a lead to Rosa's Lemos family).
abstract_pt: >-
  Um assento paroquial de 1879 na Matriz de Nova Friburgo registrando a
  justificação judicial (justificação de casamento) do casamento de Francisco
  José Bohrer (P-0034) e Rosa Eugenia de Lemos (P-0035) — os pais de Joaquim José
  Bohrer (P-0030), portanto os avós paternos de Celina. O casamento havia sido
  celebrado anteriormente perante o coadjutor da Freguesia de Itaboraí, na casa
  do pai de José Antunes de Lemos, tendo José Antunes de Lemos entre as
  testemunhas (uma pista para a família Lemos de Rosa).
reliability:
  assessment: >-
    Original parish-register evidence directly attesting the marriage of the two
    named people, though it is a retroactive judicial justification resting on
    witness testimony rather than the original ceremony act.
  informant: >-
    Judicial sentence (Monsenhor Felix d'Albuquerque, Rio, 30 June 1879) based on
    witnesses, registered by the parish.
  limitations: >-
    A justificação, not the original marriage act; the ceremony date is not stated
    (only that it predated the 1879 justification). The page carries several
    unrelated marriage entries of other families.
