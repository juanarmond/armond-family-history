  legível nesta imagem.]


  "[illegible] filho legitimo de João Muniz, e de Maria Jacinta, naturais e
  freguezes desta Parochial Igreja de Nossa Senhora May de Deos do lugar da
  Povoação, nasceo em o primeiro dia do mes de Agosto de mil oito centos trinta e
  hum, e foi baptizado aos quatorze do dito mes e anno nesta dita Parochial pelo
  Reverendo Vig.o della Julião Francisco Tavares; forão Padrinhos Manoel José e
  sua mulher Victoria de Medeiros, e testemunhas [uncertain: Manoel] Cabral e
  Francisco Muniz, todos freguezes desta mesma Parochial, e para constar fis este
  assento. Era ut supra. O Cura Fran.co Muniz Furtado. O Julião Fran.co Tavares.
  Manoel [+ signal de cruz] Cabral. Francisco Muniz."
abstract: >-
  Baptism on 14 August 1831 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of a legitimate son — his given name is not legibly recoverable from this image
  — of João [Francisco] Muniz Bitancourt (P-0048) and his wife Maria Jacinta [de
  Medeiros] (P-0049), family F-0023 — a collateral sibling of the modelled Manoel
  Muniz Bytancourt (P-0042), another child of the same couple. The boy was born
  on 1 August 1831. Officiant the Reverendo Vigário Julião Francisco Tavares (the
  act is also written and signed by the Cura Francisco Muniz Furtado); godparents
  Manoel José and his wife Victoria de Medeiros (this couple's recurring
  compadrio); witnesses Manoel Cabral and Francisco Muniz.
abstract_pt: >-
  Baptismo em 14 de agosto de 1831, em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de um filho legítimo — cujo nome próprio não é legível nesta imagem —
  de João [Francisco] Muniz Bitancourt (P-0048) e de sua mulher Maria Jacinta [de
  Medeiros] (P-0049), família F-0023 — irmão colateral do modelado Manoel Muniz
  Bytancourt (P-0042), outro filho do mesmo casal. O menino nasceu em 1 de agosto
  de 1831. Celebrante o Reverendo Vigário Julião Francisco Tavares (o assento é
  também redigido e assinado pelo Cura Francisco Muniz Furtado); padrinhos Manoel
  José e sua mulher Victoria de Medeiros (o compadrio recorrente deste casal);
  testemunhas Manoel Cabral e Francisco Muniz.
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the birth (1
    August 1831) and baptism (14 August 1831) of a son of João Muniz and Maria
    Jacinta, and for his parentage. The parents match family F-0023, and the
    godparent couple Manoel José × Victoria de Medeiros is the recurring compadrio
    also present at this couple's 1833/1834/1836/1839 children, locking the
    identification even though the child's given name is illegible.
  informant: >-
    The Reverendo Vigário Julião Francisco Tavares of N.S. Mãe de Deus, Povoação,
    recording the baptism ex officio; the act was written and co-signed by the
    Cura Francisco Muniz Furtado.
  limitations: >-
    The child's given name is not legibly recoverable from this image; the
    retrieval synthesis likewise records only an unnamed "son 1831". The entry
    names the father as "João Muniz" (without the "Francisco … Bitancourt" of his
    1819 marriage act, PAR-0037) and the mother as "Maria Jacinta" with no
    surname; identity rests on the parents' given names plus the recurring
    godparent couple. The first witness's forename is read only tentatively
    (signed "Manoel [+ mark] Cabral").
