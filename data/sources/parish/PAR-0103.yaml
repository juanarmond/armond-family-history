notes:
- text: >-
    Identification. The child of this act is the bride of 2 October 1690 (PAR-0104): that act
    names "D. Margarida", daughter of "Fr.co Fer.a de Ermonde ja defunto" and "sua m.er D.
    Anna" — the same father, by the same three-part name, and the same mother, in the same
    parish. She is therefore D. Margarida Machado, first wife of Gaspar de Souto Maior (P-0131)
    in Mendes Forjaz Vol. IX (PUB-0005, p.261). That she is also the "Margarida das Candeyas"
    whom the 1751 will of Francisco Ferreira Armonde, as quoted by Lacerda (PUB-0002 f. 55),
    names as his mother is a lead, but a pointed one: Lacerda's footnote 74, after an online
    mailing-list post, gives that Margarida's baptism as 29 May 1667 at São Sebastião — this
    act's exact date and parish [LEAD — the post and the will are not held].
  text_pt: >-
    Identificação. A criança deste assento é a noiva de 2 de outubro de 1690 (PAR-0104): esse
    assento nomeia "D. Margarida", filha de "Fr.co Fer.a de Ermonde ja defunto" e de "sua m.er D.
    Anna" — o mesmo pai, com o mesmo nome em três partes, e a mesma mãe, na mesma freguesia. É,
    portanto, a D. Margarida Machado, primeira mulher de Gaspar de Souto Maior (P-0131) no Vol. IX
    de Mendes Forjaz (PUB-0005, p.261). Que seja também a "Margarida das Candeyas" que o
    testamento de 1751 de Francisco Ferreira Armonde, citado por Lacerda (PUB-0002, f. 55), nomeia
    como sua mãe é uma pista, mas certeira: a nota 74 de Lacerda, a partir de uma mensagem de
    lista de discussão on-line, dá o baptismo dessa Margarida a 29 de maio de 1667 em São
    Sebastião — a data e a freguesia exactas deste assento [LEAD — nem a mensagem nem o
    testamento estão guardados].
- text: >-
    The surname. "Ermonde" here (and "de Ermonde" in PAR-0104) is the earliest form of the name
    held in this repository; the Barbacena line wrote "Armonde" and later "Armond". The
    repository draws no conclusion about the origin of the name from its form.
  text_pt: >-
    O apelido. "Ermonde" aqui (e "de Ermonde" no PAR-0104) é a forma mais antiga do nome guardada
    neste repositório; a linha de Barbacena escreveu "Armonde" e depois "Armond". O repositório
    não tira conclusão nenhuma sobre a origem do nome a partir da sua forma.
- text: >-
    The first entry on the page is signed "Ant.º Coelho Sotto major" — the vicar António Coelho
    Souto-Maior, the paternal uncle of Margarida's future husband (see PAR-0099 and P-0123). The
    other three entries are by the cura Domingos Cardoso Froes, who also wrote and signed her 1690
    marriage act (PAR-0104).
  text_pt: >-
    O primeiro assento da página é assinado "Ant.º Coelho Sotto major" — o vigário António Coelho
    Souto-Maior, tio paterno do futuro marido de Margarida (ver PAR-0099 e P-0123). Os outros três
    assentos são do cura Domingos Cardoso Froes, que também escreveu e assinou o assento do
    casamento dela em 1690 (PAR-0104).
