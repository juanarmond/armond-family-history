transcription: >-
  [Diocese de Caratinga, Paróquia Santa Luzia. Livro 14, fl. 143, nº 1168 de
  batizados.] "Aos vinte de setembro de mil novecentos e vinte e dois, nesta Matriz
  de Santa Luzia do Carangola, baptisei solennemente ARISTIDES nascido a vinte e
  dois de julho findo, filho legítimo de Deoclecino [Deocleciano] Muniz Bittencourt
  e de Luiza Secundina de Azevedo. Neto paterno de João Muniz Bittencourt e de
  Susana Ritta Brandão e materno de Jose Secundino de Azevedo e de Thereza
  Fernandes de Azevedo. Foram padrinhos Antonio dos Santos Ferreira e Anna Muniz
  Bittencourt. Para constar fiz este assento. Pe. Joaquim Martins Pereira." Copy
  certified Carangola, 17 April 2019.
abstract: >-
  A 2019 certified copy of the 1922 baptism of Aristides (born 22 July 1922,
  baptized 20 September 1922 at the Matriz de Santa Luzia do Carangola, MG), a
  legitimate son of Deocleciano Muniz Bittencourt (P-0012) and Luiza Secundina de
  Azevedo (P-0013) — hence a brother of Antenor Muniz (P-0006). It names the
  paternal grandparents João Muniz Bittencourt (P-0019) and Susana Ritta Brandão
  (P-0020) and the maternal grandparents José Secundino de Azevedo (P-0038) and
  Thereza Fernandes de Azevedo (P-0039), which fixes the family's Carangola (MG)
  origin and establishes Luiza's parents.
reliability:
  assessment: >-
    Direct derivative parish evidence: a modern certified transcription of the 1922
    baptism act. Direct for Aristides's birth/baptism and parentage; it names the
    grandparents as reported to the parish in 1922.
  informant: The 1922 baptising priest (Pe. Joaquim Martins Pereira) recorded the family data.
  limitations: >-
    A 2019 certified copy, not the original register image. Aristides (the subject)
    is a collateral sibling of Antenor and is not modelled as a person entity.
