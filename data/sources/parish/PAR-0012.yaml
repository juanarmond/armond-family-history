transcription: >-
  [Paróquia de Santa Luzia de Carangola, MG; livro de casamentos, acto nº 35. Margem:
  "Deocleciano Muniz Bittencourt e Luiza Fernandes de Azevedo".] "Aos vinte e um de
  Outubro de mil novecentos e dezeseis, nesta Egreja de Santa Luzia, receberam-se em
  Matrimonio Deocleciano Muniz Bittencourt e D. Luiza Fernandes de Azevedo, ambos
  solteiros e residentes nesta Freguesia. O orador com vinte e quatro annos de edade,
  nascido e baptizado em Sapucaya, Estado do Rio, filho legítimo de João Muniz
  Bittencourt [escrito "João [uncertain: Luiz] Bittencourt"] e D. Suzana Rita Brandão;
  a oradora com dezoito annos de edade, nascida e baptizada em Bom Jesus de Cachoeira
  Alegre, filha legítima de Secundino Maria de Azevedo e D. Thereza Fernandes de
  Azevedo. Foram testemunhas: Justino Ribeiro Rodrigues e Antonio Theodoro de Souza. E
  para constar mandei lavrar este assentamento que assigno. O Vigario P.e João Coutinho."
abstract: >-
  The original 1916 parish (religious) marriage of Deocleciano Muniz Bittencourt
  (P-0012) and Luiza Fernandes de Azevedo (P-0013) at Santa Luzia de Carangola, 21
  October 1916 — the same union as the civil record (CIV-0001, same date). It names
  Deocleciano (24, born and baptized in Sapucaia RJ; son of João Muniz Bittencourt
  P-0019 and Suzana Rita Brandão P-0020) and Luiza (18, born and baptized in Bom Jesus
  de Cachoeira Alegre; daughter of Secundino Maria de Azevedo P-0038 and Thereza
  Fernandes de Azevedo P-0039). Primary confirmation of Luiza's parents, and it settles
  the flagged CIV-0006 "Sebastião" misread — her father is Secundino (Maria) de Azevedo.
abstract_pt: >-
  O casamento paroquial (religioso) original de 1916 de Deocleciano Muniz
  Bittencourt (P-0012) e Luiza Fernandes de Azevedo (P-0013) em Santa Luzia de
  Carangola, 21 de outubro de 1916 — a mesma união do registro civil (CIV-0001,
  mesma data). Nomeia Deocleciano (24 anos, nascido e batizado em Sapucaia RJ;
  filho de João Muniz Bittencourt P-0019 e Suzana Rita Brandão P-0020) e Luiza
  (18 anos, nascida e batizada em Bom Jesus de Cachoeira Alegre; filha de
  Secundino Maria de Azevedo P-0038 e Thereza Fernandes de Azevedo P-0039).
  Confirmação primária dos pais de Luiza, e resolve a leitura equivocada
  "Sebastião" sinalizada em CIV-0006 — seu pai é Secundino (Maria) de Azevedo.
reliability:
  assessment: >-
    Direct primary parish evidence for the marriage and for both spouses' parentage,
    ages and birthplaces. Corroborates the civil marriage (CIV-0001) and the baptism
    PAR-0003.
  informant: The officiating vigário, Pe. João Coutinho (1916).
  limitations: >-
    Handwritten register; the groom's father's middle name is written ambiguously
    ("João [Luiz/Muniz] Bittencourt") — the Muniz/Luiz cursive variant also seen in
    João's óbito (PAR-0007).
