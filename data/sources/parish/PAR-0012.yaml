notes:
- text: >-
    The religious counterpart of the civil 1916 marriage (CIV-0001), sourcing the same
    event E-0001. Primary-confirms Luiza's parents (P-0038/P-0039) — RESOLVES STATUS
    conflict 12: her father is Secundino (Maria) de Azevedo, not the CIV-0006 "Sebastião"
    misread. Gives the birthplaces: Deocleciano born/baptized Sapucaia (RJ), Luiza
    born/baptized Bom Jesus de Cachoeira Alegre. His sisters Joventina and Mercedes
    married in the same 1916-17 Carangola cluster (PAR-0013/PAR-0014).
