notes:
- text: >-
    Establishes João Rodrigues Valle (P-0078) × Isabel Ribeiro (P-0079), the parents
    of Ritta Angélica Rodrigues (P-0058, named in her own c.1786 marriage PAR-0018 as
    "filha legitima de João Rodrigues [do Valle] e de Izabel Ribeira"). Same names,
    same Borda do Campo parish, and a consistent timeline (a daughter marrying c.1786
    from a 1751 marriage) support the identification as strong-evidence.
- text: >-
    The marginal correction "h.em de Ruvans do Arceb.o de Braga" fixes João Rodrigues
    Valle's origin as Ruivais (São Martinho de Ruivais), Archbishopric of Braga,
    Portugal — corroborated by his 1728 Ruivais baptism (PAR-0035) and his parents'
    1716 Ruivais marriage (PAR-0036).
