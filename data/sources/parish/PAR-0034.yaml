transcription: >-
  [Certidão de Casamento — Arquivo Eclesiástico da Arquidiocese de Mariana "Dom
  Oscar de Oliveira"; Arcebispado de Mariana. Cabeçalho:] "O Chanceler da
  Arquidiocese de Mariana, in fine assinado, certifica que no Livro de Casamentos
  de Barbacena Período de 1737-1751, mantido em custódia no Arquivo da Arquidiocese
  de Mariana (Livro D 10 nas Páginas 234/234v) pode-se ler o registro do teor
  seguinte:" [Margem: "Matriz"; nomes "João Riz Vale" / "Izabel Ribeyo".] "Aos
  vinte, dous dias do mês de Fevereyro de mil sete centos cincoenta, hum anos pelo
  meyo dia pouco mais ou menos nesta Matriz de Nossa Senhora da Piedade da Borda do
  Campo, feitas as denunciaçoens, e mais deligencias na forma do Sagrado Concilio
  Tridentino, e Constituiçoens sem se descobrir impedimento e por Provizão do M.
  R.do D.or Joseph Sobral e Sousa, Vigar.o da Vara desta, Comarca do Rio das Mortes,
  em minha presença e das testemunhas abaixo assignados o Coronel Joseph Lopes de
  Oliveira e Ignacio Rodrigues Guimaraens se casarão por palavras de presente João
  Rodrigues Valle natural e baptizado nesta mesma freguezia filho legitimo de João
  Rodrigues, e Joanna Gonçalves e Isabel Ribeyro natural, e baptizada nesta
  freguesia filha legitima de Manoel Nado Pestana e de Anna Francisca, e depois de
  Recebidos lhes dei as bençoens tudo na forma do Ritual Romano. E por verdade fis
  este assento que assigney com as testemunhas Joseph Lopes de Oliveira e Ignacio
  Rodrigues Guimaraens, estando presente outras muitas pessoas, era ut Supra. Foi
  equivocação do R.do Vigar.o dizer que João Roiz Valle h.[om]em desta freg.a pois
  h.[om]em de Ruvans do Arceb.o de Braga."
abstract: >-
  Modern certified transcript from the Arquivo da Arquidiocese de Mariana of the
  22 February 1751 marriage at the Matriz de Nossa Senhora da Piedade da Borda do
  Campo (Barbacena) of João Rodrigues Valle (P-0078) and Isabel Ribeiro (P-0079).
  Names the groom's parents João Rodrigues and Joanna Gonçalves (P-0080, P-0081)
  and the bride's parents Manoel Nado Pestana and Anna Francisca (named only, not
  modelled). The closing correction states that João Roiz Valle was not native to
  Borda do Campo but "de Ruvans [Ruivais] do Arcebispado de Braga" (Portugal),
  consistent with his 1728 Ruivais baptism (PAR-0035). This couple are the parents
  of Ritta Angélica Rodrigues (P-0058), extending the maternal Toledo line.
abstract_pt: >-
  Traslado certificado moderno, do Arquivo da Arquidiocese de Mariana, do casamento
  em 22 de fevereiro de 1751 na Matriz de Nossa Senhora da Piedade da Borda do Campo
  (Barbacena) de João Rodrigues Valle (P-0078) e Isabel Ribeiro (P-0079). Nomeia os
  pais do noivo, João Rodrigues e Joanna Gonçalves (P-0080, P-0081), e os pais da
  noiva, Manoel Nado Pestana e Anna Francisca (apenas nomeados, não modelados). A
  correção final declara que João Roiz Valle não era natural da Borda do Campo, mas
  "de Ruvans [Ruivais] do Arcebispado de Braga" (Portugal), consistente com seu
  batismo em Ruivais em 1728 (PAR-0035). Este casal é o dos pais de Ritta Angélica
  Rodrigues (P-0058), estendendo a linha materna Toledo.
reliability:
  assessment: >-
    Direct primary information transcribed in a modern certified archival copy.
    The register entry directly states the marriage, both spouses' parentage, and
    (via the marginal correction) João Rodrigues Valle's Portuguese origin. The
    certidão is a derivative in form (a modern certified transcript, not the
    original register image), but faithfully reproduces the primary 1751 entry.
  informant: >-
    The officiating vigário, Matriz de Nossa Senhora da Piedade da Borda do Campo
    (Barbacena), 1751; transcribed by the Chanceler da Arquidiocese de Mariana.
  limitations: >-
    A modern transcript, not the original register scan; spellings follow the
    certidão. Isabel Ribeiro's parents (Manoel Nado Pestana × Anna Francisca) are
    named but not otherwise documented.
