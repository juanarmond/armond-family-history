notes:
- text: >-
    The child's full name "António Coelho Souto-Maior" incorporates the Coelho surname
    (godfather's family) and Souto-Maior (the ancestral maternal line of the Ponte Cardoso
    kindred — see PAR-0088 note). The vicar at Mariana's death (PAR-0089) was "Antônio
    Coelho Sotomayor", suggesting a kin connection between the vicar's family and this
    child's naming.
