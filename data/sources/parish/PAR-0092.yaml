abstract: >-
  Primary parish baptism record for António Coelho Souto-Maior, son of Belchior da Ponte
  Cardoso (P-0123) × Mariana Fagundes (P-0124), baptised 12 March 1654 in São Sebastião,
  Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0298). The act names both parents as
  "Belchior da Ponte × mariAna Faguedes". Vol. IX (PUB-0005) notes António Coelho
  Souto-Maior "que segue in Vol. IX § 1º", meaning he continued a separate line documented
  by Mendes Forjaz. The child's compound surname (Coelho Souto-Maior) likely reflects the
  name of his godfather's family. Status: confirmed.
abstract_pt: >-
  Registo paroquial primário do baptismo de António Coelho Souto-Maior, filho de Belchior
  da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizado a 12 de março de 1654
  em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0298). O assento nomeia
  ambos os pais como "Belchior da Ponte × mariAna Faguedes". O Vol. IX (PUB-0005) refere
  António Coelho Souto-Maior como "que segue in Vol. IX § 1º", indicando que continuou uma
  linha separada documentada por Mendes Forjaz. O apelido composto (Coelho Souto-Maior) do
  filho reflecte provavelmente o nome da família do padrinho. Estado: confirmado.
