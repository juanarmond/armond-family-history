transcription: >-
  [Image p1 — baptism act, p.0298, S. Sebastião batismos 1611–1687]
  [Re-read from the image 2026-10-08; margin "Ant.º":] "Em os doze dias do mes de março
  de mil e seissentos e cinquoenta e quatro annos baptizei nesta igr.ª matriz a Ant.º
  filho do Alferes belchior de Ponte e de sua molher mari-ana Fagundes foi padrinho Fr.co
  Cardozo de Ponte por verdade me asinei dia mes era ut supra Vig.º Ant.º Coelho
  Sottomajor"
  Parents: "Alferes belchior de Ponte × mariana Fagundes"
  Child: Ant.º [António; the fuller "António Coelho Souto-Maior" is PUB-0005's form, not
  written in this act]
  Padrinho: Fr.co [Francisco] Cardozo de Ponte
  [Earlier transcribed "Belchior da Ponte × mariAna Faguedes" and padrinho "[?] Cardos
  da Ponte": the mother is "mari-ana Fagundes" (split across the line) and the godfather
  is Fr.co Cardozo de Ponte.]
  Date: 12 March 1654
  [Image p2 — context/facing page of the register]
