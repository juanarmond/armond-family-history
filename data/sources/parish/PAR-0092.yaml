abstract: >-
  Primary parish baptism record for António Coelho Souto-Maior, son of Belchior da Ponte
  Cardoso (P-0123) × Mariana Fagundes (P-0124), baptised 12 March 1654 in São Sebastião,
  Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0298). The act names both parents as
  "Alferes belchior de Ponte" and "mari-ana Fagundes"; the child is written only "Ant.º".
  Vol. IX (PUB-0005) notes António Coelho Souto-Maior "que segue in Vol. IX § 1º",
  meaning he continued a separate line documented by Mendes Forjaz. The godfather was Fr.co
  Cardozo de Ponte and the baptising vicar Ant.º Coelho Sottomajor — the same name as the
  compiled form of the child's name. Status: confirmed. [Corrected 2026-10-08: earlier
  read "mariAna Faguedes" and padrinho "[?] Cardos da Ponte", and attributed the Coelho
  Souto-Maior name to the godfather's family.]
abstract_pt: >-
  Registo paroquial primário do baptismo de António Coelho Souto-Maior, filho de Belchior
  da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizado a 12 de março de 1654
  em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0298). O assento nomeia
  os pais como "Alferes belchior de Ponte" e "mari-ana Fagundes"; a criança vem escrita
  apenas "Ant.º". O Vol. IX (PUB-0005) refere António Coelho Souto-Maior como "que segue
  in Vol. IX § 1º", indicando que continuou uma linha separada documentada por Mendes
  Forjaz. O padrinho foi Fr.co Cardozo de Ponte e o vigário que baptizou, Ant.º Coelho
  Sottomajor — o mesmo nome da forma compilada do nome da criança. Estado: confirmado.
  [Corrigido em 2026-10-08: antes lido "mariAna Faguedes" e padrinho "[?] Cardos da
  Ponte", e o nome Coelho Souto-Maior atribuído à família do padrinho.]
