transcription: >-
  [Image p1 — p.0352, S. Sebastião batismos 1611–1687; re-read from the image 2026-10-08
  at 383×527 px.] [Top entry, margin "Izabel": baptism of Isabel, daughter of [?] Machado
  Fagun[des?] and his wife M.ª [?], [21?] May 1662 — not a child of Belchior × Mariana; not
  fully transcribed.] [Second entry, margin "Ant.º":] "Em os doze dias
  do mes de Junho de mil e seis sentos e sessenta e dous annos bautizou o R.do P.e P.º
  Borges [?] … nesta Matriz da villa de S. Sebastião a Ant.º f.º de Gregorio Cardozo e de
  [?] … forão padrinhos … [?] Cardoza m.er de … Henrique … por verdade fiz este termo dia
  mes e era ut supra. Domingos Cardozo Fr[?]" [several words illegible]
  [Image p2 — facing page.] [Entry with margin "M[?]" (read as "Mª" or "M.el" — uncertain),
  dated [?] 1662:] [illegible — heavy bleed-through at this resolution; neither the child's
  name nor the parents can be read.]
  [Corrected 2026-10-08: an earlier transcription took the "Ant.º" margin as a possible
  form of the child Maria and read "maio … sessenta e dous … da Ponte Cardogo" as this
  family's act. The "Ant.º" entry is António, son of Gregório Cardozo, 12 June 1662; no
  legible entry on either page names Belchior da Ponte Cardoso or Mariana Fagundes.]
transcription_pt: >-
  [Imagem p1 — p.0352, S. Sebastião baptismos 1611–1687; relida na imagem em 2026-10-08 a
  383×527 px.] [Assento superior, margem "Izabel": baptismo de Isabel, filha de [?] Machado
  Fagun[des?] e de sua mulher M.ª [?], [21?] de maio de 1662 — não é filha de Belchior ×
  Mariana; não transcrito por inteiro.] [Segundo assento, margem "Ant.º":] "Em
  os doze dias do mes de Junho de mil e seis sentos e sessenta e dous annos bautizou o
  R.do P.e P.º Borges [?] … nesta Matriz da villa de S. Sebastião a Ant.º f.º de Gregorio
  Cardozo e de [?] … forão padrinhos … [?] Cardoza m.er de … Henrique … por verdade fiz
  este termo dia mes e era ut supra. Domingos Cardozo Fr[?]" [várias palavras ilegíveis]
  [Imagem p2 — página fronteira.] [Assento com margem "M[?]" (lida como "Mª" ou "M.el" —
  incerta), datado de [?] 1662:] [ilegível — forte repasse de tinta a esta resolução; nem
  o nome da criança nem os pais podem ser lidos.]
  [Corrigido em 2026-10-08: uma transcrição anterior tomou a margem "Ant.º" como possível
  forma da criança Maria e leu "maio … sessenta e dous … da Ponte Cardogo" como o assento
  desta família. O assento "Ant.º" é de António, filho de Gregório Cardozo, 12 de junho
  de 1662; nenhum assento legível de nenhuma das páginas nomeia Belchior da Ponte Cardoso
  ou Mariana Fagundes.]
abstract: >-
  Two register pages (p.0352 and its facing page) of TER-AH-SAOSEBASTIAO-B-1611-1687,
  downloaded as the candidate baptism of the Maria (b.~18 May 1662) whom Vol. IX (PUB-0005)
  lists as a daughter of Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124).
  Re-read from the images on 8 October 2026, they do not attest her: the "Ant.º" entry is
  the baptism of António, son of Gregório Cardozo, on 12 June 1662, and the only other
  candidate, a "M[?]" entry on the facing page, is illegible at 383×527 px. The Maria of
  1662 therefore rests on PUB-0005 alone. Retained as an inconclusive search result for
  the couple; a higher-resolution rescan of the facing page is the only route to test the
  "M[?]" entry. [Corrected 2026-10-08: earlier catalogued as this couple's 1662 baptism of
  a child "probably" Maria, at strong-evidence.]
abstract_pt: >-
  Duas páginas do livro (p.0352 e a fronteira) de TER-AH-SAOSEBASTIAO-B-1611-1687,
  descarregadas como o baptismo candidato da Maria (n.~18 de maio de 1662) que o Vol. IX
  (PUB-0005) lista como filha de Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes
  (P-0124). Relidas nas imagens a 8 de outubro de 2026, não a atestam: o assento "Ant.º" é
  o baptismo de António, filho de Gregório Cardozo, a 12 de junho de 1662, e o único outro
  candidato, um assento "M[?]" na página fronteira, é ilegível a 383×527 px. A Maria de
  1662 assenta, portanto, apenas no PUB-0005. Mantido como resultado de pesquisa
  inconclusivo para o casal; uma digitalização em maior resolução da página fronteira é a
  única via para testar o assento "M[?]". [Corrigido em 2026-10-08: antes catalogado como o
  baptismo de 1662, deste casal, de uma criança "provavelmente" Maria, como
  strong-evidence.]
reliability:
  assessment: >-
    Primary register images, but they carry no legible evidence for Belchior × Mariana's
    family: the legible "Ant.º" entry (12 June 1662) names Gregório Cardozo as father, and
    the facing-page "M[?]" entry is illegible. Not evidence for the Maria of 1662 or for
    any child of this couple. [Corrected 2026-10-08 from "strong-evidence — probable
    match".]
  informant: Parish clergy of São Sebastião, Terceira, recording baptisms in 1662
  limitations: >-
    Reduced CDN resolution (383×527 px) and heavy bleed-through on the facing page. Only a
    higher-resolution scan from BPAR Angra could show whether the "M[?]" entry is a child
    of Belchior × Mariana.
