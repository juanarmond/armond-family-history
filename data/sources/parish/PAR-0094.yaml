abstract: >-
  Primary parish baptism record for a child of Belchior da Ponte Cardoso (P-0123) ×
  Mariana Fagundes (P-0124), located at p.0352 of TER-AH-SAOSEBASTIAO-B-1611-1687.
  The parents are identifiable as "da Ponte Cardogo" and the approximate date (~18 May
  1662) matches Vol. IX (PUB-0005). However, the child's name is uncertain at the CDN
  image resolution (383×527 px): the margin annotation reads "Anto" rather than "Maria",
  creating an unresolved discrepancy with PUB-0005's listing of a "Maria" for this date.
  Status: strong-evidence (parentage and approximate date confirmed, child name uncertain —
  [PROBABLE] match). A higher-resolution rescan would resolve the name discrepancy.
abstract_pt: >-
  Registo paroquial primário do baptismo de uma criança de Belchior da Ponte Cardoso
  (P-0123) × Mariana Fagundes (P-0124), localizado na p.0352 de TER-AH-SAOSEBASTIAO-B-1611-1687.
  Os pais identificam-se como "da Ponte Cardogo" e a data aproximada (~18 de maio de 1662)
  corresponde ao Vol. IX (PUB-0005). Porém, o nome da criança é incerto à resolução CDN
  (383×527 px): a anotação marginal lê "Anto" em vez de "Maria", criando uma discrepância
  não resolvida com o registo de uma "Maria" para esta data em PUB-0005. Estado:
  strong-evidence (filiação e data aproximada confirmadas, nome da criança incerto —
  [PROBABLE]). Um rescan de maior resolução resolveria a discrepância.
reliability:
  assessment: >-
    Primary source (original parish baptism register). Parentage ("da Ponte Cardogo") and
    approximate date (May 1662) are legible. The child's name is uncertain at the delivered
    image resolution: margin reads "Anto" vs. PUB-0005's "Maria". Assessment: probable
    match for the Maria (b.~18.5.1662) in the compiled source, but name cannot be confirmed
    from this image. Evidence quality: strong-evidence.
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1662
  limitations: >-
    Reduced CDN resolution (383×527 px) limits legibility. The child's name is uncertain —
    "Anto" in the margin may be António or truncated. A higher-resolution scan from BPAR
    Angra is needed to confirm the child's name. Image p2 is a context page only.
