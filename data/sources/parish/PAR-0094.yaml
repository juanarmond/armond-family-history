notes:
- text: >-
    Reclassified 2026-10-08 (usage evidence → context_only; evidence_type direct →
    undetermined; reading_reliability partial). The page was catalogued as the baptism of
    Maria, daughter of Belchior da Ponte Cardoso (P-0123) and Mariana Fagundes (P-0124), but
    its readable entry is António, son of Gregório Cardozo (12 June 1662), and the "M[?]" entry
    on page 2 is illegible. It is kept, linked to P-0123, P-0124 and F-0062, only as the page
    on which the compiled Maria of ~1662 (PUB-0005) would be expected: inconclusive, neither
    evidence for her nor a negative.
