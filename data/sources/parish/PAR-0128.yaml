notes:
- text: >-
    Comparison with the producer's draft (manoel-joao-fernandes-da-cruz.md §8.4): the image
    agrees with the draft in substance. Small differences only: the scribe writes "Sexo",
    "Sepultado" and "Semiterio" with a large initial S (the draft has lower case), and the line
    ends are given as on the page. The father's parish is written "São Romão da Ucha" in this
    entry; the form "Ulha" occurs only in the 1870 deaths (PAR-0132, PAR-0134).
  text_pt: >-
    Comparação com o rascunho do produtor (manoel-joao-fernandes-da-cruz.md §8.4): a imagem
    confere com o rascunho no essencial. Só pequenas diferenças: o escrivão escreve "Sexo",
    "Sepultado" e "Semiterio" com S inicial grande (o rascunho usa minúscula), e as quebras de
    linha seguem a página. A freguesia do pai está escrita "São Romão da Ucha" neste assento; a
    forma "Ulha" só aparece nos óbitos de 1870 (PAR-0132, PAR-0134).
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    naturalidade at São Romão da Ucha and the mother's description as a foundling, all as in
    the couple's other Pousa records. The child's age, two years and eight months on 3
    September 1864, matches exactly the Antonio Joaquim born 4 January 1862 (PAR-0127). The
    identification is strong, not proven: the entry does not cite the baptism.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, a naturalidade do pai
    em São Romão da Ucha e a descrição da mãe como exposta, tudo como nos demais registros do
    casal em Pousa. A idade da criança, dois anos e oito meses em 3 de setembro de 1864,
    confere exatamente com o Antonio Joaquim nascido em 4 de janeiro de 1862 (PAR-0127). A
    identificação é forte, não provada: o assento não cita o batismo.
- text: >-
    What it adds: the death and burial of Antonio Joaquim, one of the couple's children who
    died young, consistent with the 1890 will's "nove filhos, achando-se vivos presentemente
    apenas cinco" (PRB-0013). It states the father natural of São Romão da Ucha and both
    parents resident in Pousa. It names no trade, godparent or grandparent. As a collateral
    record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: o óbito e o sepultamento de Antonio Joaquim, um dos filhos do casal
    mortos em criança, coerente com o testamento de 1890, "nove filhos, achando-se vivos
    presentemente apenas cinco" (PRB-0013). Declara o pai natural de São Romão da Ucha e ambos
    os pais residentes em Pousa. Não nomeia ofício, padrinho nem avós. Como registro colateral,
    não se liga a nenhum evento; linked_events fica vazio de propósito.
- text: >-
    The officiant signs "O Parocho Encommendado José Lopes", as on the neighbouring entries.
    The same name and rubric sign as "Coadjutor" in March 1866 (PAR-0129) and as "Cura" in
    1866–1868 (PAR-0130, PAR-0131) in this book.
  text_pt: >-
    O oficiante assina "O Parocho Encommendado José Lopes", como nos assentos vizinhos. O mesmo
    nome e rubrica assinam como "Coadjutor" em março de 1866 (PAR-0129) e como "Cura" em
    1866–1868 (PAR-0130, PAR-0131) neste livro.
