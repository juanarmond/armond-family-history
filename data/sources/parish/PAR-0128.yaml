  Aos tres dias do mez de Septembro do anno de mil oito centos sessenta e quatro,
  pelas seis horas da tarde, no logar do Souto, desta freguesia da Pousa, con-
  celho de Barcellos, Diocese de Braga, falleceo um individuo do Sexo
  masculino por nome Antonio Joaquim de dous annos e oito mezes de-
