reading_reliability: complete
abstract: >-
  Original death entry Nº 10 of 1864 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. At six in the evening of 3 September 1864, at the logar do Souto, died Antonio
  Joaquim, aged two years and eight months, born in Pousa, legitimate son of Manoel João
  Fernandes, natural of the parish of São Romão da Ucha (Barcelos), and of Anna Exposta (a
  foundling), both resident in Pousa. He was buried inside the parish church, "por não haver
  Semiterio", at seven in the evening of the 4th. The priest in charge, José Lopes, wrote and
  signed the entry. The parents are Manoel João Fernandes (P-0139) and Anna Maria, "Anna
  Exposta" (P-0140); the child is very probably the Antonio Joaquim born 4 January 1862 and
  baptised at Pousa on 8 January 1862 (PAR-0127), whose age this entry matches exactly.
abstract_pt: >-
  Assento original de óbito nº 10 de 1864 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. Às seis da tarde de 3 de setembro de 1864, no lugar do Souto, faleceu Antonio
  Joaquim, de dois anos e oito meses, natural de Pousa, filho legítimo de Manoel João
  Fernandes, natural da freguesia de São Romão da Ucha (Barcelos), e de Anna Exposta (uma
  enjeitada), ambos residentes em Pousa. Foi sepultado dentro da igreja paroquial, "por não
  haver Semiterio", às sete da tarde do dia 4. O pároco encomendado José Lopes redigiu e
  assinou o assento. Os pais são Manoel João Fernandes (P-0139) e Anna Maria, "Anna Exposta"
  (P-0140); a criança é muito provavelmente o Antonio Joaquim nascido em 4 de janeiro de 1862
  e batizado em Pousa em 8 de janeiro de 1862 (PAR-0127), cuja idade este assento confere
  exatamente.
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating priest at the burial. It is
    primary for the death, its date, hour and place, the burial and the parents as named, and
    secondary for the child's age and the father's naturalidade, which came from an unnamed
    informant; hence mixed. Every core fact is legible on the image (the subject, the date,
    the place and both parents), so reading_reliability is complete; the only uncertain mark
    falls on the rubric at the head of the right page.
  informant: >-
    Not named. The entry was written and signed by the priest in charge (Parocho
    Encommendado) José Lopes.
  limitations: >-
    The entry gives neither parent's trade, no grandparents and no reference to the baptism.
    Tying the child to the 1862 baptism (PAR-0127) rests on the same name, the same parents
    and lugar, and the age; it is strong, not proven.
