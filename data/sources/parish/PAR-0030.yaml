- text: >-
    [corrected 2026-10-10 from the image: re-read at full resolution after the
    retrieval agent's native-resolution reading disagreed with ours. The father is
    "Manoel de Lemos Perei-ra" (the capital matches this hand's "P" in "Padrinho"),
    not "[Ferreira]"; the mother is "Maria [Th]ereza", not "Maria [Nunes de Jesus]";
    the godfather is "o Capitão Joze Custodio Vieira", not "[Felício?] José Custódio
    Vieira"; the text reads "baptizei, e puz os Santos Oleos", not "batizei que os
    Santos Óleos". The superseded transcription read: "... filha legítima de Manoel
    de Lemos [Ferreira] e da Maria [Nunes de Jesus], naturais desta Freguesia; foram
    Padrinhos [Felício?] José Custódio Vieira ...". The "Maria Nunes de Jesus" form
    and the scribal-inconsistency / two-women reasoning built on it (P-0053, F-0025)
    rested on that misreading and are retired.]
  text_pt: >-
    [corrigido em 2026-10-10 a partir da imagem: relido em resolução plena depois que
    a leitura do agente de recuperação, em resolução nativa, divergiu da nossa. O pai
    é "Manoel de Lemos Perei-ra" (a maiúscula coincide com o "P" desta mão em
    "Padrinho"), não "[Ferreira]"; a mãe é "Maria [Th]ereza", não "Maria [Nunes de
    Jesus]"; o padrinho é "o Capitão Joze Custodio Vieira", não "[Felício?] José
    Custódio Vieira"; o texto diz "baptizei, e puz os Santos Oleos", não "batizei que
    os Santos Óleos". A transcrição superada dizia: "... filha legítima de Manoel de
    Lemos [Ferreira] e da Maria [Nunes de Jesus], naturais desta Freguesia; foram
    Padrinhos [Felício?] José Custódio Vieira ...". A forma "Maria Nunes de Jesus" e
    o raciocínio de inconsistência de escrivão / duas mulheres construído sobre ela
    (P-0053, F-0025) apoiavam-se nessa leitura errada e ficam aposentados.]
