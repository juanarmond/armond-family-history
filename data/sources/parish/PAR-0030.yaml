transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Entrada
  do lado esquerdo, a segunda da página, margem lateral "Maria". Relida na imagem
  em 2026-10-10.] "Aos quatorze dias do mez de Julho de mil oitocentos e trinta e
  dous annos nesta Matriz de Itaborahy baptizei, e puz os Santos Oleos á innocente
  Maria, filha legitima de Manoel de Lemos Perei-ra, e de Maria [Th]ereza, naturaes
  desta Freguezia; foi Padrinho o Capitão Joze Custodio Vieira, do que mandei fazer
  este assen-to, que assigney. O Vig.rº Fran.co R.os la Pena." [A inicial do
  segundo nome da mãe é uma maiúscula laçada — a mesma forma que esta mão usa em
  "Maria [Th]ereza de Jezus" no assento de Anna, 1834 (PAR-0031); lida "Thereza".
  Não se escreve "de Jesus" neste assento.]
abstract: >-
  The 14 July 1832 Itaboraí baptism of Maria, legitimate daughter of Manoel de
  Lemos Pereira (P-0052) and Maria Thereza (P-0053), both natural of the parish;
  godfather Capitão José Custodio Vieira, who also stood godfather to her brother
  Thomaz in 1836 (PAR-0032). This Maria is an older sister of Rosa Eugenia de Lemos
  (P-0035): same parents, parish and register as PAR-0016. Corrected 2026-10-10
  from the image: the father is written "Pereira", not "Ferreira", and the mother
  "Maria [Th]ereza", not "Maria Nunes [de Jesus]" — so her name agrees with the
  1834, 1835, 1836 and 1838 entries.
abstract_pt: >-
  O batismo, em Itaboraí em 14 de julho de 1832, de Maria, filha legítima de Manoel
  de Lemos Pereira (P-0052) e de Maria Thereza (P-0053), ambos naturais da
  freguesia; padrinho o Capitão José Custodio Vieira, que também foi padrinho de seu
  irmão Thomaz em 1836 (PAR-0032). Esta Maria é irmã mais velha de Rosa Eugenia de
  Lemos (P-0035): mesmos pais, freguesia e livro de PAR-0016. Corrigido em
  2026-10-10 a partir da imagem: o pai está escrito "Pereira", não "Ferreira", e a
  mãe "Maria [Th]ereza", não "Maria Nunes [de Jesus]" — de modo que o nome dela
  concorda com os assentos de 1834, 1835, 1836 e 1838.
reliability:
  assessment: >-
    Direct primary parish evidence, clearly legible: a Maria baptised 14 July 1832
    at Itaboraí to Manoel de Lemos Pereira and Maria [Th]ereza, both natural of the
    parish. Parents, parish and register match Rosa Eugenia de Lemos's 1835 baptism
    (PAR-0016) and the 1834, 1836 and 1838 sibling entries (PAR-0031, PAR-0032,
    PAR-0033).
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1832).
  limitations: >-
    Volume in poor condition, but this entry is intact. The initial of the mother's
    second name is an unusual looped capital, read "Th" by comparison with the same
    hand's "Maria [Th]ereza de Jezus" in PAR-0031; no "de Jesus" is written here.
