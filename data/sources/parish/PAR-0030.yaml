transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Entrada
  do lado esquerdo, margem lateral "Maria".] "Aos quatorze dias do mês de Julho
  de mil oitocentos e trinta e dois anos nesta Matriz de Itaborahy, batizei que
  os Santos Óleos a inocente Maria, filha legítima de Manoel de Lemos [Ferreira] e
  da Maria [Nunes de Jesus], naturais desta Freguesia; foram Padrinhos [Felício?]
  José Custódio Vieira, dos que mandei fazer este assento que assinei. O Vigário
  Fr.° R.s La Pena."
abstract: >-
  The 1832 Itaboraí baptism of Maria, legitimate daughter of Manoel de Lemos
  [Ferreira] (P-0052) and Maria [Nunes de Jesus] (P-0053), both natural of the
  parish; godfather [Felício?] José Custódio Vieira. This Maria is Rosa Eugenia de
  Lemos's (P-0035) older sister, confirmed by the same father name and parish as
  PAR-0016. ⚠️ Mother recorded here as "Maria Nunes [de Jesus]"; Rosa's 1835
  baptism (PAR-0016) records the mother as "Maria Thereza de Jesus" — the name
  discrepancy is preserved; same woman recorded inconsistently by the vigário.
reliability:
  assessment: >-
    Direct primary parish evidence of a Maria baptised 14 July 1832 at Itaboraí
    to Manoel de Lemos [Ferreira] and Maria Nunes de Jesus. The father's name
    cluster and parish match Rosa Eugenia de Lemos's 1835 baptism (PAR-0016),
    strongly identifying this as her sibling. The mother-name variant (Nunes vs.
    Thereza) is a scribal inconsistency rather than a different person.
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1832).
  limitations: >-
    Volume in poor condition. The godfather's given name is uncertain ([Felício?]).
    Mother recorded as "Maria Nunes [de Jesus]" here vs "Maria Thereza de Jesus"
    in PAR-0016 — the discrepancy is unexplained but assessed as the same woman.
