transcription: >-
  [Batismo — Livro de batismos, Matriz de N.S. do Pilar (São João del Rei);
  folio 54, right-hand page, margin name "Jose". The page is faded with heavy
  ink bleed-through; read from the register image (and processed crops) on
  2026-08-13. The core facts — child, both parents, date and parish — are
  legible; the godparents' and officiant's names are only partly legible and
  are marked [uncertain].]


  "Aos dez de Março de mil oito centos e treze nesta Matriz de São João d'El Rey
  bap[tizei], e pus os Santos Oleos a Jose f[i]lho legi[ti]mo de Ladislau Egidio
  Ferreira e Dona Mathildes Maria de Jesus foraõ padrinhos o Tenente Coronel
  Caetano [uncertain: José] de Almeida [uncertain: Casado / casado], e Dona Anna
  Francisca de Lima [uncertain: Silveira / solteira] todos desta freguesia. O
  [uncertain: Coadjutor] P.e Manoel Ant.o de Castro."
abstract: >-
  The 1813 baptism register entry (Matriz de Nossa Senhora do Pilar, São João
  del Rei) of the child "José", baptised 10 March 1813, recorded as the
  legitimate son of Ladislau Egídio Ferreira (P-0056, register short form of
  Ladisláo Egydio Ferreira de Toledo) and Dona Mathildes Maria de Jesus
  (P-0027). This is the baptism of José Cezário de Toledo Lima (P-0054): the
  child is entered under the single given name "José", and the identification
  rests on the exact double-parent match (both names in the distinctive
  register forms already attested for this couple), the parish (São João del
  Rei, where the parents had married on 8 May 1810, PAR-0023), and the 10 March
  1813 date consistent with his inferred 1810s birth and adult-with-teenage
  children by 1867. His earliest vital record; it primary-confirms his parentage
  (family F-0027) and fixes his birth to on or shortly before 10 March 1813.
  Officiant Pe. Manoel Antônio de Castro; godparents a Tenente Coronel Caetano
  [José?] de Almeida and Dona Anna Francisca de Lima (both partly legible). A
  distinct entry lower on the same page baptises another "José" on 14 March
  1813, son of the enslaved woman Silvana — not this person.
abstract_pt: >-
  O assento de batismo de 1813 (Matriz de Nossa Senhora do Pilar, São João del
  Rei) da criança "José", batizada em 10 de março de 1813, registrada como filho
  legítimo de Ladislau Egídio Ferreira (P-0056, forma curta de registro de
  Ladisláo Egydio Ferreira de Toledo) e Dona Mathildes Maria de Jesus (P-0027).
  É o batismo de José Cezário de Toledo Lima (P-0054): a criança é lançada sob o
  único prenome "José", e a identificação assenta-se na correspondência exata dos
  dois pais (ambos os nomes nas formas de registro já atestadas para este casal),
  na paróquia (São João del Rei, onde os pais se casaram em 8 de maio de 1810,
  PAR-0023) e na data de 10 de março de 1813, coerente com o nascimento inferido
  na década de 1810 e com filhos adultos e adolescentes em 1867. É o seu registro
  vital mais antigo; confirma por fonte primária sua filiação (família F-0027) e
  fixa seu nascimento em, ou pouco antes de, 10 de março de 1813. Celebrante
  Pe. Manoel Antônio de Castro; padrinhos um Tenente Coronel Caetano [José?] de
  Almeida e Dona Anna Francisca de Lima (ambos parcialmente legíveis). Um assento
  distinto, mais abaixo na mesma página, batiza outro "José" em 14 de março de
  1813, filho da escravizada Silvana — não é esta pessoa.
reliability:
  assessment: >-
    An original parish baptism register entry; primary, direct evidence for
    José Cezário de Toledo Lima's baptism (10 March 1813) and parentage. It is
    his earliest vital record and upgrades his birth/baptism from a retrieval
    lead to a primary-confirmed fact.
  informant: >-
    The officiating priest, Pe. Manoel Antônio de Castro, of the Matriz de
    N.S. do Pilar, São João del Rei (1813).
  limitations: >-
    The page is faded with heavy ink bleed-through. The child's given name,
    both parents' names, the 10 March 1813 date and the parish are legible, so
    identity is secure; but the godparents' names (a Tenente Coronel Caetano
    [José?] de Almeida; Dona Anna Francisca de Lima [Silveira / solteira?]) and
    the officiant's title are only partly legible and are marked [uncertain].
    The child is entered under the single given name "José"; the "Cezário de
    Toledo Lima" style is a later accretion, so the identification rests on the
    double-parent match, the parish and the date rather than on the child's
    recorded name.
