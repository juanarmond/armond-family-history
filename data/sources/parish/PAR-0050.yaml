notes:
  - text: >-
      Catalogued 13 August 2026 from the FamilySearch register image (coll
      2177275, i=54, ARK 3:1:939N-GCWJ-Z) delivered via the
      research/from-retrieval/ sync. Confirms José Cezário de Toledo Lima's
      (P-0054) baptism on 10 March 1813 and his parentage by Ladisláo Egydio
      Ferreira de Toledo (P-0056) and Mathildes Maria de Jesus (P-0027), family
      F-0027 — his earliest vital record. Core facts read directly from the
      (faded) image; the retrieval agent's transcript agreed on the core facts
      but is a lead only. The godparent Anna Francisca "de Lima" reinforces the
      maternal Lima kin-cluster around this São João del Rei family (see P-0027,
      P-0060).
