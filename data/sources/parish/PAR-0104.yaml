reading_reliability: partial
abstract: >-
  Original marriage act of Gaspar de Souto Maior (P-0131) and Margarida (P-0136), the first
  entry on the left page of image p.0036 of the São Sebastião (Terceira) marriage book
  TER-AH-SAOSEBASTIAO-C-1673-1766, held as a reduced-resolution copy (1299×974 px) from the open
  Culturacores CDN. On 2 October 1690, in the "Igreja de N. S.ra da Graça", with the licence of
  the provisor, the beneficed priest Ant.º Cardoso married "Gaspar de Souto", son of "the
  Alferes Belchior de Ponte" (P-0123) and "his wife Mariana" (P-0124), "ja defuntos", to "D.
  Margarida", daughter of "Fr.co Fer.a de Ermonde ja defunto" (P-0137) and "his wife D. Anna"
  (P-0138), all of this parish; witnesses included M.el de Andrade and the Capitão Ant.º
  Cardoso. Written and signed by Domingos Cardoso Froes. The groom's parents are those of
  P-0131's own baptism (PAR-0099) and the bride's those of P-0136's baptism (PAR-0103), so the
  act ties the two held baptisms together as husband and wife (family F-0069). It confirms the
  marriage date that Mendes Forjaz Vol. IX (PUB-0005) prints, and adds what Vol. IX does not
  say: by 1690 both of Gaspar's parents and Margarida's father were dead.
abstract_pt: >-
  Assento original do casamento de Gaspar de Souto Maior (P-0131) e de Margarida (P-0136), o
  primeiro da página esquerda da imagem p.0036 do livro de casamentos de São Sebastião (Terceira)
  TER-AH-SAOSEBASTIAO-C-1673-1766, guardado como cópia de resolução reduzida (1299×974 px) do CDN
  aberto do Culturacores. A 2 de outubro de 1690, na "Igreja de N. S.ra da Graça", com licença do
  provisor, o padre beneficiado Ant.º Cardoso casou "Gaspar de Souto", filho "do Alferes Belchior
  de Ponte" (P-0123) e "de sua m.er Mariana" (P-0124), "ja defuntos", com "D. Margarida", filha de
  "Fr.co Fer.a de Ermonde ja defunto" (P-0137) e "de sua m.er D. Anna" (P-0138), todos desta
  freguesia; entre as testemunhas, M.el de Andrade e o Capitão Ant.º Cardoso. Escrito e
  assinado por Domingos Cardoso Froes. Os pais do noivo são os do baptismo do P-0131 (PAR-0099)
  e os da noiva os do baptismo da P-0136 (PAR-0103), pelo que o assento une os dois baptismos
  guardados como marido e mulher (família F-0069). Confirma a data de casamento impressa no Vol.
  IX de Mendes Forjaz (PUB-0005) e acrescenta o que o Vol. IX não diz: em 1690 os dois pais de
  Gaspar e o pai de Margarida já tinham morrido.
reliability:
  assessment: >-
    Primary, original and direct for the marriage, its date, the two parties, their parents
    and the parents' being dead or alive ("ja defuntos" for the groom's parents, "ja defunto"
    for the bride's father): the act was written and signed at the time by the clergyman of
    the parish. Legible on this copy: the date written out ("dous dias do mes de outubro de mil
    e seis sentos e noventa Annos"), the church ("na Igreja de N. S.ra da Graça"), the groom
    ("Gaspar de So-/uto"; margin "G.par de Souto"), his father ("Alferes Belchior de Ponte"),
    his mother's forename ("Mariana"), the bride ("D. Margarida"), her father ("Fr.co Fer.a de
    Ermonde ja defunto") and her mother's forename ("D. Anna"). reading_reliability is
    nevertheless partial: the bride's own surname (an abbreviation read "M.da"), her mother's
    (read "M.do") and the groom's mother's (read "F.es"/"Fag.es") cannot be read with certainty
    at this size, nor can the word after the church name that would fix where the church stood
    (read "su-/fraganea a esta Matriz" with an [uncertain] mark). Because the surname "Machado"
    is exactly the point on which the bride is equated with Vol. IX's "D. Margarida Machado",
    it is treated as a core fact not securely read. Identity of the parties: the groom's
    parents, Alferes Belchior and Mariana, are those named in P-0131's baptism (PAR-0099), and
    "ja defuntos" agrees with their held deaths (1687 and 1684, E-0127 and E-0136); the bride's
    parents, Fr.co Fer.a (de) Ermonde and D. Anna, are those named in P-0136's baptism
    (PAR-0103).
  informant: >-
    Not named; written and signed by Domingos Cardoso Froes ("por verdade me assignei"), the
    cura who also wrote PAR-0103
  limitations: >-
    This is a REDUCED-RESOLUTION copy from the open Culturacores / DRaC-BPARAH CDN (1299×974 px
    for the whole two-page spread, watermarked across the middle of both pages), not a scan of
    the original. In the target entry the three abbreviated surnames, the qualifier after the
    church name, the licensing and officiant lines (lines 3–8) and part of the witness list
    are marked [uncertain] or [illegible]; the watermark leaves entries 2 and 4 largely
    illegible in their middle lines. A 300-dpi scan of the original can be ordered from BPAR
    Angra do Heroísmo (the route used for PAR-0099 and PAR-0105, Requisição nº 101); it would
    settle the bride's surname and the church. The page number p.0036 is the retrieval side's
    image number; the folio number on the right page is read 38 [uncertain]. The words "o
    [illegible] Gaspar de Souto" in the witness line are not interpreted: they may be the groom
    signing or another man of the name (the godfather of PAR-0099 was a namesake cousin).
