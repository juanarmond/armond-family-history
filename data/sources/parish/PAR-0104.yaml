  middle of both pages and a round stamp of the Arquivo Distrital (Angra) on each page. Four
  entries, 2 October – 20 November 1690; entry 3 begins at the foot of the left page and ends at
  the head of the right page. Entries 1, 2 and 4 are signed by Domingos Cardoso Froes, entry 3 by
  the cura Fran.co [de] Aguiar. The watermark covers the middle lines of entries 2 and 4, which
  are only partly legible. " / " marks a line break of the original; spelling and abbreviations
  as written, expansions in a separate bracket. Read 2026-10-10.]


