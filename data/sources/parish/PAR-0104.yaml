notes:
- text: >-
    Place. The act puts the marriage "na Igreja de N. S.ra da Graça", followed by a word read
    "su-/fraganea a esta Matriz da villa de S. Bas.am" [uncertain]. Mendes Forjaz Vol. IX
    (PUB-0005, p.261) prints "na Igreja do Convento da Graça em Angra (reg. S. Sebastião)". The
    two are not necessarily the same church: if "sufraganea a esta Matriz" is the right
    reading, the church was one subordinate to the São Sebastião mother church, and Vol. IX
    itself, on p.260, records another marriage "na Ermida de Nª Srª da Graça (reg. S.
    Sebastião)" in 1678 [INFERRED — the 1690 church may be that parish ermida rather than the
    Angra convent]. The act's wording governs; which building it was is left open. E-0138's
    place_text gives the act's form.
  text_pt: >-
    Local. O assento situa o casamento "na Igreja de N. S.ra da Graça", seguido de uma palavra
    lida "su-/fraganea a esta Matriz da villa de S. Bas.am" [incerto]. O Vol. IX de Mendes Forjaz
    (PUB-0005, p.261) imprime "na Igreja do Convento da Graça em Angra (reg. S. Sebastião)". As
    duas não são forçosamente a mesma igreja: se "sufraganea a esta Matriz" for a leitura certa,
    a igreja era uma das subordinadas à matriz de São Sebastião, e o próprio Vol. IX, na p.260,
    regista outro casamento "na Ermida de Nª Srª da Graça (reg. S. Sebastião)" em 1678 [INFERRED
    — a igreja de 1690 pode ser essa ermida da freguesia e não o convento de Angra]. Prevalece a
    redacção do assento; fica em aberto qual era o edifício. O place_text do E-0138 dá a forma do
    assento.
- text: >-
    Names. The groom is "Gaspar de So-/uto" (margin "G.par de Souto"), possibly followed by
    "Mayor" [uncertain]; his father is "o Alferes Belchior de Ponte" (without "Cardoso" as far
    as can be read — a blot follows). The bride is "D. Margarida" with an abbreviated surname;
    the style "Dona" is given to her and to her mother, as in PAR-0103 and PAR-0105. Her father
    is "Fr.co Fer.a de Ermonde" — the PAR-0103 form with "de". The retrieval side (2026-09-01)
    read the same names, the mother as "D. Ana Machado".
  text_pt: >-
    Nomes. O noivo é "Gaspar de So-/uto" (margem "G.par de Souto"), possivelmente seguido de
    "Mayor" [incerto]; o pai é "o Alferes Belchior de Ponte" (sem "Cardoso", tanto quanto se lê
    — segue-se um borrão). A noiva é "D. Margarida", com um apelido abreviado; o tratamento de
    "Dona" é dado a ela e à mãe, como no PAR-0103 e no PAR-0105. O pai é "Fr.co Fer.a de Ermonde"
    — a forma do PAR-0103 com "de". A pesquisa de recuperação (2026-09-01) leu os mesmos nomes, e
    a mãe como "D. Ana Machado".
- text: >-
    What the act adds. "ja defuntos" places the deaths of Belchior (26 June 1687, E-0127) and
    Mariana (7 July 1684, E-0136) before the wedding, consistent with the held death acts.
    "Fr.co Fer.a de Ermonde ja defunto" proves that Margarida's father was dead by 2 October
    1690 [PROVEN]; the retrieval side's date of death, 22 August 1672, and Lacerda's (1672) are
    leads. The mother, D. Anna, is not called "defunta" [INFERRED — she was probably still living,
    but the omission alone does not prove it].
  text_pt: >-
    O que o assento acrescenta. "ja defuntos" situa as mortes de Belchior (26 de junho de 1687,
    E-0127) e de Mariana (7 de julho de 1684, E-0136) antes do casamento, de acordo com os assentos
    de óbito guardados. "Fr.co Fer.a de Ermonde ja defunto" prova que o pai de Margarida já tinha
    morrido a 2 de outubro de 1690 [PROVEN]; a data de óbito da pesquisa de recuperação, 22 de
    agosto de 1672, e a de Lacerda (1672) são pistas. A mãe, D. Anna, não é dita "defunta"
    [INFERRED — provavelmente ainda vivia, mas a omissão por si só não o prova].
- text: >-
