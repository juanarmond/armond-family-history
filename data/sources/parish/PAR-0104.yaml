  Alferes Belchior de Ponte [blot, illegible] e de sua / m.er Mariana [uncertain: an abbreviated
  surname, F.es or Fag.es] ja defuntos freguezes q. forão / desta dita Matriz Com D. Margarida
  [uncertain: M.da — an abbreviated surname] f.a de Fr.co / Fer.a de Ermonde ja defunto e de sua
  m.er D. Anna / M.do [uncertain: M.do — an abbreviated surname] [illegible] freguezes da dita
