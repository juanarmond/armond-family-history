transcription: >-
  [Livro de Baptismos, Nova Friburgo, ~p.174, 1868; Vigário João José Viviand. Faded page.] "A[os]
  vinte e cinco de Novembro de mil oito centos e sessenta e oito baptizei a Valentim
  Martinho, nascido a quatorze de Novembro, filho legitimo de Vicente Bohrer, e de Maria
  [Regina? — uncertain] Eggendorn; forão padrinhos Valentim Freize [uncertain] e Anna Maria Bohrer."
  [Valentim is entry no. 1 of twelve children entered under the single baptism act of 25 November 1868.]
abstract: >-
  Parish baptism of Valentim Martinho Bohrer (P-0028) — João Gonçalves Bohrer's father (Iris Bohrer
  Muniz's paternal grandfather-line) — in 1868, legitimate son of Vicente Bohrer (P-0070) × Maria
  (Thecla) Eggendorn (P-0071). CONFIRMS his birth event E-0064 at 14 November 1868, baptised eleven
  days later on 25 November. An earlier reading of both months as "Setembro" was an error, corrected
  2026-09-24 against the image: the register reads "Novembro" in both places, Valentim heads a batch
  of twelve children baptised under the one 25 November act, and PUB-0003 independently gives
  14/11/1868. The 1868 year is further corroborated by his 1890 marriage (age 22) and 1948 death
  (age 80).
abstract_pt: >-
  Batismo paroquial de Valentim Martinho Bohrer (P-0028) — pai de João Gonçalves Bohrer (linha do avô
  paterno de Iris) — em 1868, filho legítimo de Vicente Bohrer (P-0070) × Maria (Thecla) Eggendorn
  (P-0071). CONFIRMA seu evento de nascimento E-0064 em 14 de novembro de 1868, batizado onze dias
  depois, em 25 de novembro. A leitura anterior de ambos os meses como "Setembro" era um erro,
  corrigido em 2026-09-24 contra a imagem: o registro lê "Novembro" nos dois lugares, Valentim encabeça
  um grupo de doze crianças batizadas sob o mesmo ato de 25 de novembro, e PUB-0003 dá
  independentemente 14/11/1868. O ano de 1868 é ainda corroborado por seu casamento de 1890 (22 anos)
  e óbito de 1948 (80 anos).
reliability:
  assessment: >-
    Primary parish baptism entry; the core facts (Valentim Martinho, born 14 November 1868, baptised
    25 November, son of Vicente Bohrer × Maria Eggendorn) are legible. The mother's middle name
    remains faded.
  informant: The officiating vicar (João José Viviand).
  limitations: >-
    Rubbed page (djoaovi digitisation, C-009). The mother's middle name is [uncertain] — it reads
    closer to "Regina" than to the "Eugenia" recorded in an earlier pass, and other records give
    "Thecla"; her identity as P-0071 rests on those other records, not on this one. The birth and
    baptism dates, previously read as September, are legible as November (corrected 2026-09-24).
