transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ.] "Aos vinte e quatro dias de
  Novembro, de mil oito centos e oitenta e dous, nos foi apresentada a certidão
  seguinte: Aos vinte e dous dias do Março, de mil oito centos e sessenta e seis,
  o Reverendo João Gonçalves Dias Galvão baptizou solenizmente, a
  innocente Suzana, nascida a vinte de Agosto de mil oito centos sessenta e cinco;
  filha legítima, de José do Rego Brandão, e de Rita Ignacia de Jesus; sendo
  padrinhos, Antonio [uncertain: Castro/Caetano] Machado, avô materno, e Luiza Maria da Conceição. Do que para eu conste, faço este assentamento, que
  assigino. O Vigario — Lourenço Gomes de Lima."
abstract: >-
  The Santo Antônio de Sapucaia (RJ) parish register's 1882 transcript of the
  1866 baptism of Susanna (Suzana) Rita Brandão (P-0020): born 20 August 1865,
  baptized 22 March 1866, filha legítima of José do Rego Brandão (P-0040) and
  Rita Ignacia de Jesus (P-0041). The godfather Antonio [uncertain: Castro/Caetano] Machado is named
  as her "avô materno" (maternal grandfather = Rita Ignacia's father). Presented
  24 November 1882, the same year as the couple's marriage provision (PAR-0001).
  Note: the decade reads "sessenta" (1865/1866); a 7 August 2026 edit had wrongly
  read "setenta" (1875/1876) — impossible against her 1882 marriage (PAR-0001) and
  her daughter Anna's 1884 birth (PAR-0006). Corrected 11 August 2026 on image re-read.
abstract_pt: >-
  A transcrição, de 1882, feita pelo livro paroquial de Santo Antônio de
  Sapucaia (RJ), do batismo de 1866 de Susanna (Suzana) Rita Brandão (P-0020):
  nascida em 20 de agosto de 1865, batizada em 22 de março de 1866, filha
  legítima de José do Rego Brandão (P-0040) e Rita Ignacia de Jesus (P-0041). O
  padrinho Antonio [uncertain: Castro/Caetano] Machado é nomeado como seu "avô
  materno" (avô materno = pai de Rita Ignacia). Apresentada em 24 de novembro de
  1882, o mesmo ano da provisão de casamento do casal (PAR-0001). Nota: a década
  lê-se "sessenta" (1865/1866); uma edição de 7 de agosto de 2026 leu erroneamente
  "setenta" (1875/1876) — impossível diante de seu casamento de 1882 (PAR-0001) e
  do nascimento de sua filha Anna em 1884 (PAR-0006). Corrigido em 11 de agosto de
  2026 em nova leitura da imagem.
reliability:
  assessment: >-
    Direct primary parish evidence for Susanna's birth, baptism and parentage:
    it names both parents and a maternal grandfather. A derivative — the 1882
    register transcript of the original 1866 certidão.
  informant: >-
    The transcribing vicar Lourenço Gomes de Lima (1882), copying the 1866
    baptism performed by Rev. João Gonçalves Dias.
  limitations: >-
    A register transcript, not the original 1866 baptism book; a few given names
    are uncertain in the cursive.
