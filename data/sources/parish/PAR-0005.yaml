notes:
- text: >-
    Establishes Susanna Rita Brandão's parents = José do Rego Brandão (P-0040) +
    Rita Ignacia de Jesus (P-0041), family F-0019 — settling it over the earlier
    "Manoel Soares Brandão" lead. The padrinho named "avô materno" (= Rita Ignacia's
    father) is Antonio Caetano Machado, now modelled as P-0045 (family F-0022); the
    baptism's cursive left the name ambiguous between "Castro" and "Caetano", resolved
    to Caetano by his 1868 óbito (PAR-0010) and his widow Ignacia's 1878 óbito
    (PAR-0011).
