abstract: >-
  Primary parish death record for Maria da Costa Leonardes (P-0126), died 27 December 1654
  in São Sebastião, Terceira. The act is written in the FIRST PERSON by the officiating
  priest: "faleceo maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu
  pai" — my mother, wife of Manuel da Ponte Cardoso my father. It confirms in a primary hand
  the full name that had until now rested only on the compiled genealogy PUB-0005, records
  that she died with all the sacraments of Holy Mother Church, and places her burial inside
  the parish church: "está sepultada nesta Igreja matriz da Villa de sam Sebastiam em
  sepultura sua junto ao arco da capela mor." The death date is an exact match with
  PUB-0005; the act itself was signed the following January (1655). The record also gives
  her husband's surname in a primary hand as "Ponte Cardoso" — not "Valadão". Signed
  "o Vig.º So[u]tomaior". This primary image upgrades E-0130 from strong-evidence to
  confirmed and raises P-0126 from compiled-only to primary documentation.
abstract_pt: >-
  Registo paroquial primário do óbito de Maria da Costa Leonardes (P-0126), falecida a 27 de
  dezembro de 1654 em São Sebastião, Terceira. O assento está escrito na PRIMEIRA PESSOA
  pelo sacerdote officiante: "faleceo maria da Costa Leonardes minha mai, molher de M.el de
  Ponte Cardoso meu pai". Confirma em mão primária o nome completo que até aqui assentava
  apenas na genealogia compilada PUB-0005, regista que morreu com todos os sacramentos da
  Sancta Madre Igreja e situa a sepultura dentro da igreja paroquial: "está sepultada nesta
  Igreja matriz da Villa de sam Sebastiam em sepultura sua junto ao arco da capela mor." A
  data de óbito corresponde exactamente a PUB-0005; o assento foi assinado no mês de janeiro
  seguinte (1655). O registo dá também, em mão primária, o apelido do marido como "Ponte
  Cardoso" — e não "Valadão". Assinado "o Vig.º So[u]tomaior". Esta imagem primária actualiza
  E-0130 de strong-evidence para confirmed e eleva P-0126 de documentação apenas compilada a
  documentação primária.
reliability:
  assessment: >-
    Primary source (original parish death register), read from the native-maximum CDN image
    at magnification. Her full name, the first-person kinship clause ("minha mai … meu pai"),
    her husband's name, the day, month and year, the sacraments and the burial place inside
    the matriz beside the chancel arch are all legible. The date matches PUB-0005 exactly.
    Evidence quality: confirmed for the death date, the burial, her full name and her
    marriage to P-0125; and confirmed for the fact that the officiating priest was her son.
  informant: >-
    The officiating vicar of São Sebastião, a son of the deceased, who signs
    "o Vig.º So[u]tomaior" and writes of her in the first person, January 1655
  limitations: >-
    The marginal index annotation is faint; read as "m.ª da Cos[t]a" and marked uncertain.
    The exact day of the January 1655 signing is not legible, so only the month and year of
    the signature are asserted. The signature gives no forename, so the son's identity is
    established by inference from the neighbouring signatures in the same book and from
    PUB-0005 rather than stated in this act (see notes). Whole-spread image; the act is the
    first of four entries on the left-hand page. Resolution 1239×944 px — the CDN's
    published maximum for the page, not a processing loss.
