notes:
- text: >-
    FIRST-PERSON ATTESTATION. The body of the act states the officiating priest's own
    parentage: "maria da Costa Leonardes minha mai, molher de M.el de Ponte Cardoso meu
    pai". Read against the marginal note in PAR-0097 ("M.el de Pon / te Cardozo / meu pai"),
    this gives two independent first-person statements in the same book that the vicar of
    São Sebastião was a son of Manuel da Ponte Cardoso × Maria da Costa Leonardes (F-0063)
    — and therefore a brother of Belchior da Ponte Cardoso (P-0123).
- text: >-
    IDENTIFICATION OF THE SON — divergence from the retrieval agent's handoff note. The
    handoff named the priest "Manoel Coelho Souto Maior"; the image does not support it.
    This act and PAR-0097 are signed only "o Vig.º So[u]tomaior", without a forename; the
    neighbouring 1652 entries in the same book are signed "o Vig.º Ant.º Coelho
    Sotto[ma]yor" [uncertain expansion], and PAR-0089 (1684, same book) records the vicar as
    "Antônio Coelho Sotomayor". PUB-0005 (Vol. IX, p.259) names exactly one priest among
    this couple's children — António Coelho Souto-Maior (b. 13 February 1619, d. 17 July
    1686, padre vigário of the Matriz de São Sebastião) — and no son named Manoel. The
    officiating son is therefore identified as António Coelho Souto-Maior, whose sonship
    moves from [COMPILED] to [PROVEN] on these two acts.
- text: >-
    Do not confuse this António Coelho Souto-Maior (b.1619, the couple's son) with his
    namesake nephew, António Coelho Souto-Maior baptised 12 March 1654, son of Belchior da
    Ponte Cardoso × Mariana Fagundes (PAR-0092). The 1654 nephew was an infant when this
    act was written.
- text: >-
    NAME EVIDENCE for P-0125. This act gives her husband's name in a primary hand as
    "M.el de Ponte Cardoso" — the second independent register attestation (with PAR-0097)
    that his surname was Ponte Cardoso, not "Valadão". The Valadão form survives only as a
    compiled-genealogy variant (PUB-0005).
- text: >-
    Book context: the same register yielded PAR-0088 (Belchior da Ponte Cardoso, 1687),
    PAR-0089 (Mariana Fagundes, 1684) and PAR-0097 (Manuel da Ponte Cardoso, 1652, two CDN
    images earlier).
