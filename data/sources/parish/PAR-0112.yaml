notes:
- text: >-
    Identity of the child: a hypothesis only. That this Manoel is Manoel Fernandes (P-0143),
    Bento's father, rests on three points. His parents, Constantino Fernandes and Roza Maria of
    Quintam, are named as Bento's paternal grandparents in 1807 (PAR-0109). The lugar is the same.
    The retrieval side reports no other son named Manoel of this couple in the Ucha baptisms
    1745–1844. Against a firmer conclusion: no marriage of a Manoel Fernandes to Jozefa Maria has
    been found, and no record names this Manoel as an adult. P-0143 is listed in linked_people as
    the hypothesised subject only. The baptism must not be used as P-0143's birth event, and
    linked_events is empty on purpose. Drop P-0143 from linked_people if the integration policy
    allows only stated persons.
  text_pt: >-
    Identidade da criança: apenas uma hipótese. Que este Manoel seja Manoel Fernandes (P-0143),
    pai de Bento, assenta em três pontos. Os pais dele, Constantino Fernandes e Roza Maria, de
    Quintam, são nomeados como avós paternos de Bento em 1807 (PAR-0109). O lugar é o mesmo. A
    pesquisa de recuperação não encontrou outro filho chamado Manoel deste casal nos batismos da
    Ucha de 1745–1844. Contra uma conclusão mais firme: não se encontrou casamento de um Manoel
    Fernandes com Jozefa Maria, e nenhum registro nomeia este Manoel adulto. O P-0143 está em
    linked_people apenas como sujeito hipotético. O batismo não deve ser usado como evento de
    nascimento do P-0143, e linked_events fica vazio de propósito. Retirar o P-0143 de
    linked_people se a política de integração só admitir pessoas declaradas.
- text: >-
    Identification of the parents with P-0147 and P-0148. "Custantantino Fernandes de Oliveira"
    and "Roza Maria sua mulher do lugar de Quintam" match the "Constantino Fernandes, e sua
    mulher Roza Maria" of Quintam named in 1807 (PAR-0109), apart from the scribal slip and the
    added "de Oliveira". Two couples of the same names in the same lugar are possible but not
    indicated. The identification is strong, not proven. This record adds four persons of the
    generation above Constantino and Roza (Manoel Fernandes × Maria de Oliveira, of Santa
    Marinha de Oleiros; Antonio Joze Ferreira × Mariana Lopes, of Santa Eulália de Oliveira).
    They are not modelled here, and should be modelled only if P-0147 and P-0148 are accepted
    as these parents.
  text_pt: >-
    Identificação dos pais com P-0147 e P-0148. "Custantantino Fernandes de Oliveira" e "Roza
    Maria sua mulher do lugar de Quintam" coincidem com o "Constantino Fernandes, e sua mulher Roza
    Maria", de Quintam, nomeados em 1807 (PAR-0109), salvo o lapso do escrivão e o acréscimo "de
    Oliveira". Dois casais com os mesmos nomes no mesmo lugar são possíveis, mas não há indício
    disso. A identificação é forte, não provada. Este registro acrescenta quatro pessoas da geração
    acima de Constantino e Roza (Manoel Fernandes × Maria de Oliveira, de Santa Marinha de
    Oleiros; Antonio Joze Ferreira × Mariana Lopes, de Santa Eulália de Oliveira). Elas não são
    modeladas aqui, e só devem ser modeladas se P-0147 e P-0148 forem aceitos como estes pais.
- text: >-
    Differences from the retrieval side's draft (bento-jose-fernandes.md §7.6, G2). The draft is
    confirmed throughout, with two refinements. (1) "Naceo aos noue dias": the "a" of "aos" is
    present on the image; the draft's "[a]os" supplied it as missing. (2) The officiant's
    signature: the draft gives "Manoel Mz de Affonseca"; the abbreviation is read here as "M.z",
    and is expanded "Martins" on the evidence of the next entry and of fl. 77. The interlined
    word above "Angelica" stays uncertain; it is read as "Lopes" (the draft suggested "Lopes?" or
    "Leonor?"). Note also that the child was born on 9 October and baptised on 13 October 1771;
    "9 October" is the birth date, not the baptism date.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação (bento-jose-fernandes.md §7.6,
    G2). O rascunho foi confirmado em tudo, com dois refinamentos. (1) "Naceo aos noue dias": o "a"
    de "aos" está na imagem; o rascunho o supria como ausente ("[a]os"). (2) A assinatura do
    oficiante: o rascunho dá "Manoel Mz de Affonseca"; a abreviatura é lida aqui como "M.z" e
    desdobrada como "Martins", com base no assento seguinte e na fl. 77. A palavra entrelinhada
    acima de "Angelica" continua incerta; é lida como "Lopes" (o rascunho sugeria "Lopes?" ou
    "Leonor?"). Note-se também que a criança nasceu em 9 de outubro e foi batizada em 13 de outubro
    de 1771; "9 de outubro" é a data de nascimento, não a do batismo.
- text: >-
    What the record adds. The father's full name in 1771 is "Custantantino Fernandes de Oliveira"
    (a variant of P-0147's name). The couple lived at the lugar de Quintam, Ucha, in 1771. The
    paternal family came from Santa Marinha de Oleiros and the maternal family from Santa Eulália
    de Oliveira, by the record's statement. The godparents, Manoel de Oliveira and his wife
    Angelica, were also of Quintam; the record gives them no kinship to the child.
  text_pt: >-
    O que o registro acrescenta. O nome completo do pai em 1771 é "Custantantino Fernandes de
    Oliveira" (variante do nome do P-0147). O casal morava no lugar de Quintam, Ucha, em 1771. A
    família paterna vinha de Santa Marinha de Oleiros e a materna de Santa Eulália de Oliveira,
    segundo o registro. Os padrinhos, Manoel de Oliveira e sua mulher Angelica, eram também de
    Quintam; o registro não lhes dá parentesco com a criança.
