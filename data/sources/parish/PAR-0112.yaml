transcription: |-
  [Whole opening — São Romão da Ucha baptisms, DGS 004669216 image 409: three entries on the left page (fl. 76v) and three on the right page (fl. 77), of October 1771 to March 1772. Read from the native image (4288×2772) in strips at 1–2.5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [fl. 76v, entry 1 — the end of an entry whose beginning is on the previous image: a child of [illegible] and of Mathias Fernandes and Mariana Francisca, of the lugar de Macedo; godmother Luiza [uncertain: Ribeira], daughter of Domingos Fernandes and Custodia Domingues, of the lugar dos [uncertain: Fontes]; signed by the Abbade Manoel M.z de Affonseca. Not this family as far as it is read.]

  [p1 — evidence/parish/PAR-0112-baptism-manoel-son-of-constantino-1771-ucha.jpg; fl. 76v, entry 2 — TARGET]
  [No margin name; the entry opens with a large flourished initial "E".]
  E Manoel filho Legitimo de [uncertain: C]ustantantino Fernandes
  de Oliveira, e de Roza Maria sua mulher do lugar de Quin-
  tam desta freiguezia de Sam Romaõ da Ucha neto pela
  parte paterna de Manoel Fernandes, e de Maria de Oli-
  veira da freiguezia de Santa Marinha de Oleiros, e pela ma-
  terna de Antonio Joze Ferreira e de Mariana Lopes da frei-
  guezia de Santa Eulalia de Oliveira. Naceo aos noue dias
  do mes de outubro do anno de mil, e sete Centos e setenta [an ink blot]
  e hum, e foi por mim Baptizado em os treze dias do dito mes
  e anno e lhe pus os Santos Oleos, e foraõ padrinhos Manoel de
  Oliveira, e sua mulher Angelica [interlined above: [uncertain: Lopes]] do lugar de Quintam desta
  freiguezia, e para Constar fiz este asento que asigno era ut
  supra
                    O Abb.e Manoel M.z de Affonseca [rubric]
  [Expansions and readings: "Custantantino" — a scribal slip, with a repeated syllable, for Custantino / Constantino; the first letter is a flourished capital that could also be taken for a T. "Ucha" — the U has a leading loop. noue = nove (nine). M.z = Martins: the next entry names the Abbade as "Manoel Martins da Fonceca", and the last entry on fl. 77 is signed "Manoel Martins de Affonseca". Abb.e = Abbade.]

  [fl. 76v, entry 3, continuing at the top of fl. 77 — Manoel, legitimate son of Manoel José and Anna Domingues, of the lugar da Torre; paternal grandparents Bertolomeo Manoel and Maria Francisca, of the lugar da Torre; maternal grandparents Manoel Domingues and Francisca Gonçalves, of the lugar de Macedo; born 24 December 1771, baptised 29 December 1771 by Padre Bento Pereyra da Cunha with the licence of the Abbade Manoel Martins da Fonceca; godparents Manoel, solteiro, son of Dominga Gonçalves, widow, and Jozefa Thereza, wife of Francisco Manoel, of the lugar do [uncertain: Carquejozo], parish of Lama. Not this family.]

  [fl. 77, entry 2 — Thereza Maria, daughter of João de Macedo and Maria Fernandes, of the lugar do Cabo; born 26 February 1772 [uncertain], baptised by the cura Padre Pedro Francisco. Not this family as far as the entry states.]

  [fl. 77, entry 3 — Thereza Maria, daughter of Manoel José de Faria and Maria Thereza da Costa, of the lugar de Quintam; born 28 March 1772 [uncertain]; signed by the Abbade Manoel Martins de Affonseca. Not this family as far as the entry states.]
reading_reliability: complete
abstract: >-
  Original baptism entry, the second on fl. 76v of the São Romão da Ucha (Barcelos) baptism book.
  Manoel was born on 9 October 1771 and baptised on 13 October 1771 by the Abbade Manoel Martins
  de Affonseca, who wrote and signed the entry. He was the legitimate son of "Custantantino"
  (Constantino) Fernandes de Oliveira and his wife Roza Maria, of the lugar de Quintam in Ucha.
  His paternal grandparents were Manoel Fernandes and Maria de Oliveira, of Santa Marinha de
  Oleiros; his maternal grandparents were Antonio Joze Ferreira and Mariana Lopes, of Santa
  Eulália de Oliveira. The godparents were Manoel de Oliveira and his wife Angelica [Lopes,
  uncertain], of the lugar de Quintam. The parents are the Constantino Fernandes and Roza Maria
  of Quintam (P-0147, P-0148) named as Bento's paternal grandparents in 1807 (PAR-0109). Whether
  this Manoel is Bento's father Manoel Fernandes (P-0143) is a hypothesis only.
abstract_pt: >-
  Assento original de batismo, o segundo da fl. 76v do livro de batismos de São Romão da Ucha
  (Barcelos). Manoel nasceu em 9 de outubro de 1771 e foi batizado em 13 de outubro de 1771 pelo
  Abade Manoel Martins de Affonseca, que escreveu e assinou o assento. Era filho legítimo de
  "Custantantino" (Constantino) Fernandes de Oliveira e de sua mulher Roza Maria, do lugar de
  Quintam, na Ucha. Os avós paternos eram Manoel Fernandes e Maria de Oliveira, da freguesia de
  Santa Marinha de Oleiros; os avós maternos eram Antonio Joze Ferreira e Mariana Lopes, da
  freguesia de Santa Eulália de Oliveira. Foram padrinhos Manoel de Oliveira e sua mulher Angelica
  [Lopes, incerto], do lugar de Quintam. Os pais são o Constantino Fernandes e a Roza Maria de
  Quintam (P-0147, P-0148) nomeados como avós paternos de Bento em 1807 (PAR-0109). Que este
  Manoel seja o pai de Bento, Manoel Fernandes (P-0143), é apenas uma hipótese.
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating Abbade. It is primary for the
    birth and baptism dates, the child, the parents and the godparents; the grandparents and their
    parishes are secondary statements, hence mixed. Every core fact is legible: the dates, the
    child, both parents and all four grandparents. The uncertain readings are peripheral: the
    first letter of the scribal slip "Custantantino", and the small word interlined above the
    godmother's name.
  informant: >-
    The Abbade of São Romão da Ucha, Manoel Martins de Affonseca, who baptised and signed; the
    family details were presumably given by the parents.
  limitations: >-
    The record is clear; its use for this line is not. It does not name the child's later wife,
    and no marriage of a Manoel Fernandes to a Jozefa Maria has been found, so the record cannot
    show that this Manoel is the father of Bento (PAR-0109). The child is "Manoel", with no
    surname.
