notes:
- text: >-
    Identification with Bento José Fernandes (P-0141): strong, not proven. For it: the lugar
    (Quintão, Ucha), the forename and surname, a living wife named Joaquina and surviving
    children all fit. The death of his son Francisco, alfaiate, drowned in the Cávado in November
    1859, names him as "filho de Bento Fernandes, e de Joaquina Maria do lugar de Quintão", and a
    Francisco was baptised at Ucha in 1837 as a son of Bento Fernandes and Joaquina Roza of
    Quintã (both per the retrieval side's reading; not read here). Joaquina Roza Lopes was
    "viuva de Bento Fernandes" at her own death in 1890 (PAR-0111). The retrieval side reports no
    other Bento married to a Joaquina in the Ucha death book 1766–1885. Against it: the priest
    calls the wife "Joaquina Maria", not "Joaquina Rosa"; and the age of sixty points to about
    1800, not to the 1807 baptism.
  text_pt: >-
    Identificação com Bento José Fernandes (P-0141): forte, não provada. A favor: o lugar
    (Quintão, Ucha), o prenome e o sobrenome, uma mulher viva chamada Joaquina e filhos vivos,
    tudo coincide. O óbito do filho Francisco, alfaiate, afogado no Cávado em novembro de 1859,
    nomeia-o como "filho de Bento Fernandes, e de Joaquina Maria do lugar de Quintão", e um
    Francisco foi batizado na Ucha em 1837 como filho de Bento Fernandes e Joaquina Roza, de
    Quintã (ambos segundo a leitura da pesquisa de recuperação; não lidos aqui). Joaquina Roza
    Lopes era "viuva de Bento Fernandes" no seu próprio óbito, em 1890 (PAR-0111). A pesquisa de
    recuperação não encontrou outro Bento casado com uma Joaquina no livro de óbitos da Ucha de
    1766–1885. Contra: o padre chama a mulher de "Joaquina Maria", e não "Joaquina Rosa"; e a
    idade de sessenta anos aponta para cerca de 1800, não para o batismo de 1807.
- text: >-
    Differences from the retrieval side's draft (bento-jose-fernandes.md §7.5, "1860 No.2").
    The draft is confirmed in substance, but four readings differ on the image. (1) "recebio",
    not "recebeo". (2) "Não fes testamento, Deixou / filhos", with no "e" before "Deixou"; the
    draft has "Não fez testamento, e deixou filhos". (3) "do supra dito mez, e an- / no foi
    sepultado", where the draft has "co- / mo[?] foi sepultado"; the draft's doubtful word is
    "e anno". (4) "e se lhe fes hum Officio", where the draft has "e lhe fez". The signature is
    "O Abbade Antonio Joze Corr.a" (draft "Corr.as"). The lugar is written "Quintao" with no tilde
    visible at the zoom used.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação (bento-jose-fernandes.md §7.5,
    "1860 No.2"). O rascunho foi confirmado no essencial, mas quatro leituras diferem na imagem.
    (1) "recebio", e não "recebeo". (2) "Não fes testamento, Deixou / filhos", sem "e" antes de
    "Deixou"; o rascunho tem "Não fez testamento, e deixou filhos". (3) "do supra dito mez, e an-
    / no foi sepultado", onde o rascunho tem "co- / mo[?] foi sepultado"; a palavra duvidosa do
    rascunho é "e anno". (4) "e se lhe fes hum Officio", onde o rascunho tem "e lhe fez". A
    assinatura é "O Abbade Antonio Joze Corr.a" (rascunho "Corr.as"). O lugar está escrito
    "Quintao", sem til visível na ampliação usada.
- text: >-
    What the record adds. A death date (23 June 1860, two in the afternoon) and place (the lugar
    de Quintão), a burial date (24 June 1860, in the parish church), an occupation (lavrador), an
    age (sixty, so born about 1800 by this entry), and the facts that he was married, made no
    will and left children. Three funeral offices were said, of seven, ten and thirteen priests.
    If he is P-0141, this entry fixes his death, which his son Domingos's 1884 will and his
    widow's 1885 procuração place only before those dates.
  text_pt: >-
    O que o registro acrescenta. Uma data de óbito (23 de junho de 1860, duas horas da tarde) e um
    lugar (o lugar de Quintão), uma data de sepultura (24 de junho de 1860, na igreja paroquial),
    uma profissão (lavrador), uma idade (sessenta anos, portanto nascido por volta de 1800 segundo
    este assento), e o fato de ser casado, não ter feito testamento e ter deixado filhos.
    Rezaram-se três ofícios fúnebres, de sete, dez e treze padres. Se ele é o P-0141, este assento
    fixa a sua morte, que o testamento do filho Domingos (1884) e a procuração da viúva (1885) só
    situam antes dessas datas.
