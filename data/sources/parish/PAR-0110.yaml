reading_reliability: complete
abstract: >-
  Original death and burial entry Nº 2 of 1860 in the first death book of São Romão da Ucha
  (Barcelos). Bento Fernandes, "Labrador" (farmer), aged sixty, married to Joaquina Maria, a
  parishioner, died at two in the afternoon on 23 June 1860 at the lugar de Quintão in Ucha. He
  received all the sacraments, made no will and left children. He was buried in the parish church
  on 24 June 1860 with an office of corpo presente of seven priests; the margin adds a second
  office of ten priests and a third of thirteen. The Abbade Antonio Joze Correia wrote and signed
  the entry. No parents are named. The deceased is identified with Bento José Fernandes (P-0141),
  husband of Joaquina Rosa Lopes. The identification is strong, not proven: the name, lugar and
  occupation fit, but the wife is called "Joaquina Maria", and the age points to a birth about
  1800.
abstract_pt: >-
  Assento original de óbito e sepultura Nº 2 de 1860, no primeiro livro de óbitos de São Romão da
  Ucha (Barcelos). Bento Fernandes, "Labrador" (lavrador), de sessenta anos, casado com Joaquina
  Maria, paroquiano, faleceu às duas horas da tarde de 23 de junho de 1860 no lugar de Quintão, na
  Ucha. Recebeu todos os sacramentos, não fez testamento e deixou filhos. Foi sepultado na igreja
  paroquial em 24 de junho de 1860, com um ofício de corpo presente de sete padres; a margem
  acrescenta um segundo ofício de dez padres e um terceiro de treze. O Abade Antonio Joze Correia
  escreveu e assinou o assento. Não se nomeiam os pais. O falecido é identificado com Bento José
  Fernandes (P-0141), marido de Joaquina Rosa Lopes. A identificação é forte, não provada: o nome,
  o lugar e a profissão coincidem, mas a mulher é chamada "Joaquina Maria", e a idade aponta para
  um nascimento por volta de 1800.
reliability:
  assessment: >-
    Original and direct, written by the parish priest at the burial. It is primary for the death,
    its date, hour and place, the burial and the funeral offices. The age, occupation, marital
    status and wife's name are secondary statements, from an unnamed informant; hence mixed.
    Every word of the entry is legible.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio Joze Correia, who wrote and signed the entry; the
    person who gave him the age and the wife's name is not named.
  limitations: >-
    The entry names no parents and no children, so it cannot by itself tie this Bento Fernandes
    to the Bento José Fernandes of the baptisms. The wife is "Joaquina Maria", not "Joaquina
    Rosa" or "Lopes". The age of sixty may be a round figure; it points to a birth about 1800,
    against the 1807 baptism (PAR-0109) that is probably his.
