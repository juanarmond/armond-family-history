notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.5, image 00193): the month is
    written "Nobembro" (with b, like the writer's "travalhar" and "Cabado"), which the draft
    normalised to "Novembro"; the place near the river reads "da [Suiga]" — the draft gave
    "da Sega[?]"; both "Suiga" and the verb "[apareceo]" (draft "appareceo", the image shows a
    single p and a cramped middle) stay uncertain; "a vado" is clear (the draft marked it
    "[?]"); the two verbs are "se lhe fes" and "fes este assento", not "fez"; the signature is
    "O Abb.e Antonio J.e Corr.a". The draft's note "no age; no grandparents" is confirmed; no
    sacraments are mentioned either.
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.5, imagem 00193): o mês
    está escrito "Nobembro" (com b, como o "travalhar" e o "Cabado" do escrevente), que o
    rascunho normalizou para "Novembro"; o lugar junto ao rio lê-se "da [Suiga]" — o rascunho
    dava "da Sega[?]"; tanto "Suiga" como o verbo "[apareceo]" (rascunho "appareceo"; a imagem
    mostra um só p e o meio apertado) continuam incertos; "a vado" é claro (o rascunho marcava
    "[?]"); os dois verbos são "se lhe fes" e "fes este assento", não "fez"; a assinatura é "O
    Abb.e Antonio J.e Corr.a". A observação do rascunho "sem idade; sem avós" confirma-se; não
    se mencionam sacramentos.
- text: >-
    Identification. The parents "Bento Fernandes, e … Joaquina Maria do lugar de Quintão" are
    identified with P-0141 × P-0142 by the father's name, the mother's forename, the lugar and
    the parish, and by the father's own death entry of 23 June 1860 at Quintão, which also
    calls his wife "Joaquina Maria". The mother's second name differs from her other records
    ("Joaquina Roza", "Joaquina Lopes", "Joaquina Roza Lopes"), so the identification is
    strong, not proven. The identification of the deceased with Francisco baptised 29 March
    1837 (PAR-0116) is likewise strong, not proven: same father, same mother's forename, same
    lugar; no age is given.
  text_pt: >-
    Identificação. Os pais, "Bento Fernandes, e … Joaquina Maria do lugar de Quintão", são
    identificados com P-0141 × P-0142 pelo nome do pai, pelo prenome da mãe, pelo lugar e pela
    freguesia, e pelo próprio óbito do pai, de 23 de junho de 1860 no Quintão, que também chama
    a mulher "Joaquina Maria". O segundo nome da mãe difere dos seus outros registros
    ("Joaquina Roza", "Joaquina Lopes", "Joaquina Roza Lopes"), pelo que a identificação é
    forte, não provada. A identificação do falecido com o Francisco batizado em 29 de março de
    1837 (PAR-0116) é igualmente forte, não provada: mesmo pai, mesmo prenome da mãe, mesmo
    lugar; não se dá idade.
- text: >-
    What the record adds. Francisco was a tailor ("Alfaiate") who went to work in the parish
    of Pousa, his mother's native parish (per her 1890 death entry, not this record); "do lugar de Quintão" is attached to the parents'
    names and places the family at Quintão in 1859. Neither parent is called dead; the entry
    is silent on that, which does not prove that both were alive. "Joaquina Maria" is a
    further attested name form for P-0142. Francisco is a collateral needing no research of
    his own; he fits as a documented child of F-0071, with PAR-0116 and this record as
    sources.
  text_pt: >-
    O que o registro acrescenta. Francisco era alfaiate e ia trabalhar na freguesia da Pousa,
    freguesia natal da mãe (segundo o óbito dela de 1890, não este registro); "do lugar de Quintão" vem junto aos nomes dos pais e situa a
    família no Quintão em 1859. Nenhum dos pais é dado como morto; o assento é omisso quanto a
    isso, o que não prova que ambos estivessem vivos. "Joaquina Maria" é mais uma forma de
    nome atestada para P-0142. Francisco é um colateral que não precisa de pesquisa própria;
    cabe como filho documentado da F-0071, com o PAR-0116 e este registro como fontes.
