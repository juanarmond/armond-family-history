  [p1 — evidence/parish/PAR-0117-death-francisco-1859-ucha.jpg; fl. 96v (edge) and fl. 97]
  [fl. 96v, only the right-hand ends of the lines are in frame: earlier 1859 death entries,
  not transcribed.]
  [fl. 97, top right: a rubric and the folio number "97". Above the target, summarised: the
  end of an entry ("… e no dia vinte tres do mesmo sendo seu corpo amortalhado foi sepultado
  nesta Egreja …", signed by the abbot); the death on 31 July 1859 of Maria Thereza Gomes,
  "viuva que ficou de Antonio Gomes da Costa", of the lugar de Quintão (margin "Maria
  Thereza"), buried 2 August 1859; the death on 10 September 1859 of Manoel José Velloza, of
  the lugar de Macedo (margin "M.el J.e Velloza"). No modelled person is named.]

  [entry — TARGET: Francisco, son of Bento Fernandes and Joaquina Maria; last on fl. 97; no
  margin name or number]
  Francisco filho de Bento Fernandes, e de Joaquina Maria
  do lugar de Quintão desta freguezia de São Romão
  da Ucha tendo no dia des de Nobembro de mil oito
  centos sincoenta e nove travalhar no officio de
  Alfaiate para a freguezia da Pouza [uncertain: apareceo] no dia
  onze afogado no rio Cabado perto da [uncertain: Suiga]
  e se prezume que querendo atravessar o rio a vado
  se afogou, e no dia treze se lhe fes hum officio de corpo
  prezente de cinco Padres, e se sepultou nesta Igreja
  de que para constar fes este assento era ut supra
  [Signature:] O Abb.e Antonio J.e Corr.a [rubric]
  [Expansions: Abb.e = Abbade; J.e = José; Corr.a = Correia; des = dez; Nobembro = Novembro;
  travalhar = trabalhar (the b/v exchange is the writer's); Cabado = Cávado; Pouza = Pousa;
  "a vado" = by wading across; "officio de corpo prezente de cinco Padres" = a funeral
  office with the body present, sung by five priests.]
reading_reliability: complete
abstract: >-
  Original death entry, unnumbered, the last on fl. 97 of the first death book of São Romão
  da Ucha (Barcelos), written by the abbot Antonio José Corrêa. Francisco, "filho de Bento
  Fernandes, e de Joaquina Maria do lugar de Quintão", went on 10 November 1859 to work at his
  trade of tailor ("officio de Alfaiate") in the parish of Pousa; on the 11th he was found
  drowned in the river Cávado ("rio Cabado") near [Suiga], and it was presumed that he had
  drowned trying to wade across. On the 13th a funeral office with the body present was held
  by five priests, and he was buried in the parish church. No age, marital status or
  sacraments are given. He is very probably the Francisco baptised at Ucha on 29 March 1837,
  son of Bento Fernandes and Joaquina Roza of Quintãa (PAR-0116): a collateral, brother of
  Manoel João (P-0139), son of Bento José Fernandes (P-0141) and Joaquina Rosa Lopes
  (P-0142).
abstract_pt: >-
  Assento original de óbito, sem número, o último do fl. 97 do primeiro livro de óbitos de
  São Romão da Ucha (Barcelos), escrito pelo abade Antonio José Corrêa. Francisco, "filho de
  Bento Fernandes, e de Joaquina Maria do lugar de Quintão", foi em 10 de novembro de 1859
  trabalhar no seu ofício de alfaiate ("officio de Alfaiate") na freguesia da Pousa; no dia
  11 foi achado afogado no rio Cávado ("rio Cabado"), perto da [Suiga], e presumiu-se que se
  afogara ao tentar atravessar o rio a vau. No dia 13 fez-se um ofício de corpo presente com
  cinco padres, e ele foi sepultado na igreja paroquial. Não se dão idade, estado civil nem
  sacramentos. É muito provavelmente o Francisco batizado na Ucha em 29 de março de 1837,
  filho de Bento Fernandes e de Joaquina Roza, da Quintãa (PAR-0116): colateral, irmão de
  Manoel João (P-0139), filho de Bento José Fernandes (P-0141) e de Joaquina Rosa Lopes
  (P-0142).
reliability:
  assessment: >-
    Original entry written and signed by the abbot within days of the events: primary and
    direct for the finding of the body, the funeral and the burial, and for the deceased's
    trade and residence as the parish knew them. The parents' names are reported information
    (mixed). The cause and circumstances are the abbot's account, the crossing on foot
    explicitly a presumption ("se prezume"). Every core fact is legible — the deceased, both
    parents as named, the lugar, the dates and the drowning — so reading_reliability is
    complete; the [uncertain] marks fall on one verb form and on the place-name near the
    river.
  informant: >-
    The abbot of São Romão da Ucha, Antonio José Corrêa, who wrote and signed the entry; the
    informant for the circumstances is not named.
  limitations: >-
    The exact day of death is not stated (10 or 11 November 1859). No age is given, so the
    link to the 1837 baptism rests on names and lugar. The mother is written "Joaquina Maria",
    not "Joaquina Roza", as in Bento Fernandes's own death entry of 1860 ("cazado com
    Joaquina Maria"). The ink is pale but the text is complete.
