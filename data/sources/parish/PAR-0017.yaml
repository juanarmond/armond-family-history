transcription: >-
  [Freguesia de N.S. da Piedade da Borda do Campo (Barbacena), MG; livro de batismos,
  1821. Margem: "Carolina / Remedios". Ink bleed-through (tinta permeada).] "No dia
  vinte e um de Outubro de mil oito centos e vinte e um, na Capella dos Remedios, o
  Padre Francisco Antonio Ferreira Armonde baptizou solemnemente e pôs os Santos
  Oleos a Carolina, parvula, filha legitima de Ladislau E[gydio] Ferreira e de
  Matildes Maria: Foraõ Padrinhos Francisco Ferreira [de Assis?] e Anna Umbellina
  Gomes [de Assis?], estes da Itaverava, e aquella da Suplicaçaõ; e para constar
  mandei fazer este assento que assignei. O V.[igario] Jozé Joaquim Ferr[eira]
  Armonde."
abstract: >-
  The 1821 Barbacena baptism of Carolina, legitimate daughter of Ladisláo Egídio
  Ferreira (P-0056) and Matildes Maria [de Jesus] (P-0027). It places the couple —
  Eliza Balbina de Toledo's grandparents — in Barbacena (Piedade da Borda do Campo)
  in 1821 with a daughter, directly attesting their union and their Barbacena origin.
  The officiating priests are themselves Ferreira Armonde (the Barbacena Armond
  clergy), an incidental link between the two Barbacena-rooted lines.
abstract_pt: >-
  O batismo de 1821 em Barbacena de Carolina, filha legítima de Ladisláo Egídio
  Ferreira (P-0056) e Matildes Maria [de Jesus] (P-0027). Coloca o casal — os
  avós de Eliza Balbina de Toledo — em Barbacena (Piedade da Borda do Campo) em
  1821 com uma filha, atestando diretamente sua união e sua origem em Barbacena.
  Os sacerdotes celebrantes são eles próprios Ferreira Armonde (o clero Armond de
  Barbacena), um vínculo incidental entre as duas linhagens enraizadas em
  Barbacena.
reliability:
  assessment: >-
    Direct primary parish evidence that Ladisláo Egídio Ferreira and Matildes Maria
    were a couple in Barbacena in 1821 with a daughter Carolina — corroborating the
    F-0027 union (previously strong-evidence from a later deed) and fixing the
    couple's Barbacena locus.
  informant: The baptising priest, Barbacena (Piedade da Borda do Campo), 1821.
  limitations: >-
    Ink bleed-through; the godparents' surnames and a few words are uncertain reads.
    The father is written "Ladislau Egídio Ferreira" (without the later "de Toledo");
    identification with Ladisláo Egídio Ferreira de Toledo (P-0056) rests on the
    Barbacena locus, the exact given-name/surname and the couple match with Matildes
    Maria [de Jesus].
