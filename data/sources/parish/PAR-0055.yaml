transcription: >-
  [Livro de Óbitos, Nova Friburgo, fólio 237, nº 328, 1888; Cônego José Silvestre Alves de
  Miranda.] "328 — Francisco Bos[b]er. Aos seis dias do mez de Julho de mil oito centos e
  oitenta e oito foi encommendado e sepultado o cadaver de Francisco José Bos[b]er,
  brazileiro, casado com Roza Eugenia de Lemos Bos[b]er, de cincoenta e seis annos de edade e
  morador no logar Alto da Serra, n'esta freguezia. Falleceu de insufficiencia mitral e de
  dilatação aortica. Para constar fiz este assento, que assigno. O Vigario Conego José
  Silvestre Alves de Miranda." [surname inked "Bos[b]er", a variant of Bohrer/Borer.]
abstract: >-
  Parish death/burial of Francisco José Bohrer (P-0034), 6 July 1888 at Nova Friburgo (Alto da
  Serra), aged 56 (→ b. ~1832, corroborating his 1832 baptism PAR-0054), husband of Roza
  Eugenia de Lemos (P-0035); cause mitral insufficiency and aortic dilatation. Source for his
  death event E-0084. The register gives no parentage. Surname variant "Bos[b]er" noted.
abstract_pt: >-
  Óbito/sepultamento paroquial de Francisco José Bohrer (P-0034), 6 de julho de 1888, em Nova
  Friburgo (Alto da Serra), aos 56 anos (→ n. ~1832, corroborando seu batismo de 1832,
  PAR-0054), marido de Roza Eugenia de Lemos (P-0035); causa insuficiência mitral e dilatação
  aórtica. Fonte do evento de óbito E-0084. O registro não dá filiação. Variante de sobrenome
  "Bos[b]er" registrada.
