notes:
- text: >-
    The clearer of the two sisters' marriages (with PAR-0020): it plainly reads
    "Capitão João José Ferreira de Toledo", settling the father's forename as João (not
    the bled "Joaquim") and adding his Capitão title. Carolina Francelina recorded as a
    documented child on F-0028.
- text: >-
    The assisting priest is "Reverendo Padre José [Joaquim/João] Ferreira Armond /
    Armonde [de Lima?], coadjuncte da Vara" — an Armond/Armonde clergyman was the
    officiating minister at this Toledo family marriage. The 1812 PAR-0020 marriage is
    likewise officiated by the same Armonde priest. Combined with the 1821 Carolina
    baptism (PAR-0017), Armonde clergy served the Toledo family across 1812–1821 in the
    same Barbacena chapel. This is context for Simplício's later surname adoption, but
    the Armonde name appears ONLY in the clergy role — not as a lay witness.
    Note: FINDINGS.md's claim of "Benta José Ferr° Armonde" as a lay witness is a
    misread of the clergy line; re-read confirms no Armonde-surnamed witness at this act.
