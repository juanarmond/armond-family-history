transcription: >-
  [Freguesia de N.S. da Piedade da Borda do Campo (Barbacena), MG; livro de
  casamentos, 1816, fl. 102. Margem: "Vicente e Carolina Francelina".] "Aos vinte, e
  dois de Outubro de 1816, na Capella de Nossa Senhora dos Remedios, filial desta
  Matriz de Barbacena, com Provizão do M.R.D. [e do] Vigario da Vara desta Comarca, o
  Reverendo Padre José Joaquim Ferreira [Armond, coadjuncte] da Vara, [assisti] ao
  sacramento do Matrimonio dos Contrahentes Vicente José da Cunha, filho legitimo de
  Marcelino Salustino[?] e Thereza Maria de Jesus, natural e baptizado na Freguezia
  de Ouro Branco, e morador nesta Freguezia das [Lavras?] — D. Carolina Francelina de
  Toledo, filha legitima do Capitão João José Ferreira de Toledo e D. Ritta Angelica
  Roiz [Rodrigues], natural e baptizada nesta Freguezia de Barbacena, onde se tem
  morado[ra]; e sendo testemunhas João Eleuterio [Ferreira?] e [Antonio] Vicente
  Salustino, de que fiz este assento. [assina] O Vigario Marcelino Souza [de]
  Oliveira."
abstract: >-
  The 22 October 1816 Barbacena marriage of Carolina Francelina de Toledo — legitimate
  daughter of "Capitão João José Ferreira de Toledo" (P-0057) and D. Ritta Angélica
  Rodrigues (P-0058) — to Vicente José da Cunha (of Ouro Branco). Carolina Francelina
  is a sister of Ladisláo Egídio Ferreira de Toledo (P-0056); the record independently
  confirms the apical couple, clearly gives the father as "João José" and adds his
  militia title Capitão. Not to be confused with Carolina Ferreira de Toledo (b.1821,
  PAR-0017), Ladisláo × Matilde's daughter (a niece).
abstract_pt: >-
  O casamento, em Barbacena a 22 de outubro de 1816, de Carolina Francelina de
  Toledo — filha legítima do "Capitão João José Ferreira de Toledo" (P-0057) e de
  D. Ritta Angélica Rodrigues (P-0058) — com Vicente José da Cunha (de Ouro
  Branco). Carolina Francelina é irmã de Ladisláo Egídio Ferreira de Toledo
  (P-0056); o registro confirma de forma independente o casal apical, indica
  claramente o pai como "João José" e acrescenta seu título de milícia, Capitão.
  Não deve ser confundida com Carolina Ferreira de Toledo (n. 1821, PAR-0017),
  filha de Ladisláo × Matilde (uma sobrinha).
reliability:
  assessment: >-
    Direct primary parish evidence that Carolina Francelina de Toledo was a daughter
    of Capitão João José Ferreira de Toledo and Ritta Angélica Rodrigues — a sibling
    of Ladisláo (P-0056), corroborating the couple (F-0028) and establishing the
    "João José" form and the Capitão title of the father.
  informant: The officiating vigário, Barbacena (Borda do Campo), 1816.
  limitations: >-
    Tight binding and some fading; the groom's father's surname (Salustino) and a
    couple of place words are uncertain reads. The father is clearly "Capitão João
    José Ferreira de Toledo" here (cf. the ink-bled "Joaquim José" reads elsewhere).
