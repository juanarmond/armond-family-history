notes:
- text: >-
    The clearer of the two sisters' marriages (with PAR-0020): it plainly reads
    "Capitão João José Ferreira de Toledo", settling the father's forename as João (not
    the bled "Joaquim") and adding his Capitão title. Carolina Francelina recorded as a
    documented child on F-0028.
