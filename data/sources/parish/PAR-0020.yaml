transcription: >-
  [Freguesia de N.S. da Piedade da Borda do Campo (Barbacena), MG; livro de
  casamentos, 1812; entrada inferior da página. Encadernação apertada / margem
  aparada.] "Aos vinte [e dois?] de Julho de mil oitocentos e doze annos, depois de
  feitas as denunciações na forma do Concilio e Constituição, [sem] se descobrir
  impedimento algum, com Provizão do M.R.[everendo] Vigario da Vara da Comarca, na
  Capela [Curada] dos Remedios filial desta Matriz da Borda [do Campo], [assistindo] o
  Reverendo Vigario [José Joaquim Ferreira Armond?] ao [sacramento] do Matrimonio dos
  Contrahentes Antonio Dias, filho legitimo de João Dias [da Silva?] e de Maria [...],
  [baptizado] na Freguezia de Prados —— e Anna Belizaria de Toledo, filha legitima de
  João José [Ferreira] de Toledo e de Ritta [Angelica Rodrigues], [baptizada] nesta
  Freguezia; [testemunhas ...]; de que mandei fazer este assento. [assina] O Vigario
  José Joaquim Ferreira Armond."
abstract: >-
  The 1812 Barbacena marriage of Anna Belizaria de Toledo — legitimate daughter of
  João José Ferreira de Toledo (P-0057) and Ritta Angélica Rodrigues (P-0058) — to
  Antonio Dias (of the Freguesia de Prados). Anna Belizaria is a sister of Ladisláo
  Egídio Ferreira de Toledo (P-0056); the record independently confirms the apical
  couple (whose distinctive wife, Ritta Angélica Rodrigues, anchors the match) and
  gives the father's name as "João José" (see P-0057 on the João/Joaquim variant).
  The officiating vigário is the Armond priest José Joaquim Ferreira Armond.
abstract_pt: >-
  O casamento, em Barbacena em 1812, de Anna Belizaria de Toledo — filha legítima
  de João José Ferreira de Toledo (P-0057) e de Ritta Angélica Rodrigues (P-0058) —
  com Antonio Dias (da Freguesia de Prados). Anna Belizaria é irmã de Ladisláo
  Egídio Ferreira de Toledo (P-0056); o registro confirma de forma independente o
  casal apical (cuja esposa característica, Ritta Angélica Rodrigues, ancora a
  correspondência) e apresenta o nome do pai como "João José" (ver P-0057 quanto à
  variante João/Joaquim). O vigário celebrante é o padre Armond José Joaquim
  Ferreira Armond.
reliability:
  assessment: >-
    Direct primary parish evidence that Anna Belizaria de Toledo was a daughter of
    João José Ferreira de Toledo and Ritta Angélica Rodrigues — a sibling of Ladisláo
    (P-0056) and independent corroboration of the couple (F-0028).
  informant: The officiating vigário, Barbacena (Borda do Campo), 1812.
  limitations: >-
    Tight binding with margin loss and fading; the exact day, the groom's parents and
    some words are uncertain reads. The father is written "João José" here (cf. the
    ink-bled "Joaquim José" reads of PAR-0018/0019).
