transcription: >-
  Passou-se Provisão a 23 do corrente ao Rev.do Cura do Curato de Santo Antônio
  de Sapucaia para receber em matrimônio na sua matriz a [João/José — given
  name reading uncertain] Monis Bittencourt — com Susana Rita Brandão. Rio, 23
  de Dezembro de 1882. Cônego Cassiano.
abstract: >-
  On 23 December 1882 an ecclesiastical provision register of the Court of Rio
  de Janeiro recorded that a provision was issued for João Monis Bittencourt
  and Susanna Rita Brondão to marry in the mother church (matriz) of the Santo
  Antônio de Sapucaia parish. Sapucaia was an established freguesia from 1871,
  and this destination is consistent with their son Deocleciano being born in
  Sapucaia (CIV-0001). The entry establishes the intended couple and parish but
  does not state that the marriage ceremony had already occurred.
reliability:
  assessment: >-
    The original ecclesiastical register directly supports the issuance of the
    marriage provisions, the couple's source-record name forms, the date and
    the intended parish. It is indirect evidence for a completed marriage.
  informant: The issuing church office; individual declarants are not stated.
  limitations: >-
    The handwriting is abbreviated and the issuing cleric's title is not
    transcribed. FamilySearch labels the record as a marriage and its detail
    table currently displays an erroneous year of 1633, although the original
    entry and attached citation clearly state 23 December 1882. A separate
    ceremony entry has not yet been located.
