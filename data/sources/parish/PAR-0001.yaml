notes:
- text: >-
    The FamilySearch collaborative profiles and index normalise or alter the
    names in several ways. The repository preserves the forms read from the
    original image and records later variants separately.
- text: >-
    The authorised full-resolution download contains a complete two-page
    register spread with unrelated historical entries. It is retained as the
    primary preservation file; inspection crops are not repository evidence.
- text: >-
    Correction (28 July 2026): an earlier transcription attributed this
    provision to the Espírito Santo parish of the Court of Rio de Janeiro. On
    re-examination the "Espírito Santo desta corte" wording belongs to the
    immediately preceding provision on the same page (José Pereira Mendes Jr
    with Maria Siqueira); this couple's destination is the Curato de Santo
    Antônio de Sapucaia. The superseded interpretation is preserved here, not
    deleted. The groom's given name reads closer to "José" than "João" in this
    entry, and the bride's surname reads "Brandão" (matching CIV-0001) rather
    than the preferred "Brondão"; both remain variants pending a fuller record.
