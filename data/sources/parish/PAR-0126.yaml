transcription: |-
  [Two consecutive openings — Pousa baptisms, DGS 004668983 images 80 and 81. The target entry begins at the foot of fl. 4 (image 80, right page) and ends at the top of fl. 4v (image 81, left page). The entries of these openings are signed by the Abbade Lucio Antonio da Costa and by the coadjutor Domingos Fernandes Cardeira. Read from the native images (3736×3000 each) in strips at 1–2× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [image 80, left page — the end of an entry, then the baptisms of Felicidade, daughter of Domingos de Souza and Maria Thereza [uncertain: Peixoto], and of Maria Thereza, daughter of João Lopes Leal and Thereza Maria (July 1859). The latter ends at the top of fl. 4: "Forão Padrinhos Antonio Joaquim Martins e sua mulher Thereza de Jesus do lugar da Pousa freguesia deste no- / me". Not this family; on the godparents, see the notes.]

  [image 80, fl. 4, entry 2 — the baptism of Joaquina Rosa, daughter of Manoel [uncertain: Peixoto] and [illegible] da Silva, born 8 August 1859, with a marginal cross-reference note. Not this family.]

  [p1 — evidence/parish/PAR-0126-baptism-maria-jose-1859-pousa-p01.jpg; image 80, fl. 4, last entry — TARGET (no margin note)]
  Maria José, filha legitima de Manoel João Fernandes
  e Anna Maria do lugar do Souto desta freguesia; neta
  paterna de Bento José Fernandes e Joaquina Lopes
  do lugar da Quintãa, freguesia de São Romão da Ucha

  [p2 — evidence/parish/PAR-0126-baptism-maria-jose-1859-pousa-p02.jpg; image 81, fl. 4v, first entry]
  Ucha; e materna de Avós incognitos; nasceo no dia
  primeiro de Outubro do anno de mil oito centos cincoen-
  ta e nove; foi baptisada solemnemente com imposi-
  ção dos Santos Oleos na pia baptismal desta Igreja
  aos cinco dias do dito mez e anno pelo Presbitero
  Domingos Fernandes Cardeira, Coadjutor nesta
  freguesia. Forão Padrinhos Manuel Loureiro sol-
  teiro filho de José Joaquim Loureiro do lugar d'Am-
  proã, e Maria José da Silva solteira do lugar
  do Paço, ambos desta freguesia. E para cons-
  tar se fez este termo que vai assignado pelo
  Abbade e seu Cura —
  O Abbade Lucio Antonio da Costa
  O Coadjutor Domingos Fernandes Cardeira.
  [Readings: "Ucha" is written at the end of image 80 and again at the head of image 81, as a catchword; Quintãa is written with the tilde on the first a; "d'Am- / proã" is written with the tilde on the final a.]

  [image 81, fl. 4v, entries 2 and 3 — the baptisms of Luiza, natural daughter of Andreza Maria (born 17 October 1859), and of Maria, daughter of Manoel Gonçalves [uncertain: Lassa] and Maria Josefa Rodrigues. Not this family.]

  [image 81, fl. 5 — the end of an entry (born 6 November 1859); the baptism of Joaquina Rosa, daughter of Antonio José Ferreira and Josefa Maria Rodrigues, of the lugar do Souto (November 1859); and the beginning of the baptism of Antonio Joaquim, son of Joaquim Luiz Lopes Leal and Anna Maria Gomes, of the lugar da Pousa, "neto paterno de Antonio Lopes Leal e Leonarda Carneiro, e materno de Feliciano Gomes, e Andreza Maria Lopes todos do dito lugar" (continued on the next image, not part of this record). On Andreza Maria Lopes, see the notes.]
reading_reliability: complete
abstract: >-
  Original baptism entry beginning at the foot of fl. 4 and ending at the top of fl. 4v of the
  Pousa (Barcelos) baptism book. Maria José, legitimate daughter of Manoel João Fernandes and Anna
  Maria, of the lugar do Souto in Pousa, was born on 1 October 1859 and was solemnly baptised,
  with the holy oils, in the parish church on 5 October 1859 by the presbyter Domingos Fernandes
  Cardeira, coadjutor. The paternal grandparents are named as Bento José Fernandes and Joaquina
  Lopes, of the lugar da Quintãa in São Romão da Ucha; the maternal grandparents are "Avós
  incognitos". The godparents were Manuel Loureiro, solteiro, son of José Joaquim Loureiro, of
  the lugar d'Amproã, and Maria José da Silva, solteira, of the lugar do Paço, both of Pousa. The
  entry is signed by the Abbade Lucio Antonio da Costa and by the coadjutor. The parents are
  Manoel João Fernandes da Cruz (P-0139) and Anna Maria Fernandes (P-0140); Maria José is a
  collateral child of their family F-0070.
abstract_pt: >-
  Assento original de batismo que começa no pé da fl. 4 e termina no alto da fl. 4v do livro de
  batismos de Pousa (Barcelos). Maria José, filha legítima de Manoel João Fernandes e de Anna
  Maria, do lugar do Souto, em Pousa, nasceu em 1º de outubro de 1859 e foi batizada solenemente,
  com os santos óleos, na igreja paroquial em 5 de outubro de 1859 pelo presbítero Domingos
  Fernandes Cardeira, coadjutor. Os avós paternos são nomeados como Bento José Fernandes e
  Joaquina Lopes, do lugar da Quintãa, em São Romão da Ucha; os avós maternos são "Avós
  incognitos". Foram padrinhos Manuel Loureiro, solteiro, filho de José Joaquim Loureiro, do lugar
  d'Amproã, e Maria José da Silva, solteira, do lugar do Paço, ambos de Pousa. O assento é assinado
  pelo Abade Lucio Antonio da Costa e pelo coadjutor. Os pais são Manoel João Fernandes da Cruz
  (P-0139) e Anna Maria Fernandes (P-0140); Maria José é uma filha colateral da família F-0070.
reliability:
  assessment: >-
    Original and direct. It is primary for the baptism, its date and place, the child, the
    parents as named, the godparents and the officiant: the coadjutor baptised, and he and the
    Abbade signed. The birth date and the grandparents were declared to them and are secondary
    information. Every word of the entry is legible on the two images, including the page turn.
  informant: >-
    The coadjutor of Pousa, Domingos Fernandes Cardeira, who baptised, and the Abbade Lucio
    Antonio da Costa; both signed. The facts of birth and kinship were presumably declared by the
    family or the godparents.
  limitations: >-
    The mother is "Anna Maria" without a surname or any statement that she was a foundling,
    though the maternal grandparents are unknown. The entry gives no occupation for the father.
    The coadjutor's surname "Fernandes" is not a kinship.
