notes:
- text: >-
    Identification. The parents are identified with P-0139 and P-0140: "Manoel João Fernandes" and
    "Anna Maria", of the lugar do Souto in Pousa, with paternal grandparents Bento José Fernandes
    and Joaquina Lopes "do lugar da Quintãa, freguesia de São Romão da Ucha" (the lugar of
    P-0141 and P-0142) and unknown maternal grandparents. The retrieval side identifies this Maria
    José with the daughter of the same name who was an heir of Manoel João in Brazil in 1898; that
    rests on the name and is not stated here. The identification of the parents is strong, not
    proven.
  text_pt: >-
    Identificação. Os pais são identificados com P-0139 e P-0140: "Manoel João Fernandes" e "Anna
    Maria", do lugar do Souto, em Pousa, com avós paternos Bento José Fernandes e Joaquina Lopes
    "do lugar da Quintãa, freguesia de São Romão da Ucha" (o lugar de P-0141 e P-0142) e avós
    maternos desconhecidos. A pesquisa de recuperação identifica esta Maria José com a filha do
    mesmo nome que foi herdeira de Manoel João no Brasil em 1898; isso se apoia no nome e não está
    declarado aqui. A identificação dos pais é forte, não provada.
- text: >-
    What the record adds. It is the first of these baptisms to give the father a surname,
    "Manoel João Fernandes", to write "filha legitima" in full (the 1858 entry may abbreviate
    it), to name the grandparents' lugar ("Quintãa") and to call the paternal grandmother
    "Joaquina Lopes" rather than "Joaquinna Roza". The couple still lived in the lugar do Souto in October 1859. A new Abbade, Lucio
    Antonio da Costa, signs. Maria José can be recorded as a documented child of F-0070.
  text_pt: >-
    O que o registro acrescenta. É o primeiro destes batismos a dar apelido ao pai, "Manoel João
    Fernandes", a escrever "filha legitima" por extenso (o assento de 1858 talvez o abrevie), a
    nomear o lugar dos avós ("Quintãa") e a chamar a avó paterna de "Joaquina Lopes", e não
    "Joaquinna Roza". O casal ainda morava no lugar do
    Souto em outubro de 1859. Assina um novo Abade, Lucio Antonio da Costa. Maria José pode ser
    registrada como filha documentada da F-0070.
- text: >-
    Neighbouring entries with names that recur. (1) In July 1859 the godparents of Maria Thereza,
    daughter of João Lopes Leal, were "Antonio Joaquim Martins e sua mulher Thereza de Jesus do
    lugar da Pousa"; a Padrinho Antonio Joaquim Martins, casado, oleiro, and a Madrinha Thereza de
    Jesus, casada, of the lugar da Cachadinha, are the godparents of Manoel João and Anna's son
    Antonio Joaquim in 1862 (PAR-0127). This married Thereza de Jesus is not Manoel João's sister Thereza
    de Jesus, who was solteira until 1869 (PAR-0123). (2) On fl. 5 an Antonio Joaquim, son of
    Joaquim Luiz Lopes Leal and Anna Maria Gomes, has a maternal grandmother "Andreza Maria
    Lopes", of the lugar da Pousa. The retrieval side treats an Andreza Lopes, wife of Feliciano
    Gomes, as a probable sister of Joaquina Rosa Lopes; this entry pairs Andreza Maria Lopes with
    Feliciano Gomes but states no kinship with Joaquina, so the sisterhood remains unproven.
  text_pt: >-
    Assentos vizinhos com nomes que se repetem. (1) Em julho de 1859 os padrinhos de Maria Thereza,
    filha de João Lopes Leal, foram "Antonio Joaquim Martins e sua mulher Thereza de Jesus do lugar
    da Pousa"; um padrinho Antonio Joaquim Martins, casado, oleiro, e uma madrinha Thereza de Jesus,
    casada, do lugar da Cachadinha, são os padrinhos de Antonio Joaquim, filho de Manoel João e de
    Anna, em 1862 (PAR-0127). Esta Thereza de Jesus casada não é a irmã de Manoel João, Thereza de Jesus, que era
    solteira até 1869 (PAR-0123). (2) Na fl. 5, um Antonio Joaquim, filho de Joaquim Luiz Lopes
    Leal e de Anna Maria Gomes, tem como avó materna "Andreza Maria Lopes", do lugar da Pousa. A
    pesquisa de recuperação trata uma Andreza Lopes, mulher de Feliciano Gomes, como provável irmã
    de Joaquina Rosa Lopes; este assento junta Andreza Maria Lopes a Feliciano Gomes, mas não
    declara parentesco com Joaquina, de modo que o vínculo de irmãs continua não provado.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.3, entry 3).
    The wording is confirmed, with these readings: the godfather is written "Manuel Loureiro"
    (draft "Manoel"); the lugar is "d'Am- / proã", with the tilde on the final a (draft
    "d'Am- / prôa"). The repetition of "Ucha" across the page turn is on the images, as the draft
    shows. The draft's dates (born 1 October, baptised 5 October 1859) and folios (fl. 4 to fl. 4v)
    are confirmed.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.3, assento 3). O texto foi confirmado, com estas leituras:
    o padrinho está escrito "Manuel Loureiro" (rascunho "Manoel"); o lugar é "d'Am- / proã", com o
    til sobre o a final (rascunho "d'Am- / prôa"). A repetição de "Ucha" na mudança de página está
    nas imagens, como mostra o rascunho. As datas do rascunho (nascida em 1º de outubro, batizada em
    5 de outubro de 1859) e os fólios (fl. 4 a fl. 4v) estão confirmados.
