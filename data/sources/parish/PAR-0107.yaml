  desta freguezia de São Romaõ da Ucha com Joanna Maria
  Esposta rezidente na freguezia de Santa Christina d'Al-
  gozo da Pouza aujo Matrimonio assisti em prezença
  das testemunhas Antonio Joze Correia viuvo, e Joze Au-
