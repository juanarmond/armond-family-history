  [Expansions and readings: Mª = Maria; Joaõ = João; Romaõ = Romão; Quintaõ = Quintão; denunciaçoens = the banns; do Estillo = customary; Esposta = Exposta, a foundling; d'Algozo = de Algozo, part of the parish name as written here; aujo = a cujo; fis = fiz; Abb.e = Abbade; Corr.a = Correia. "sencoenta" is written so; it is the scribe's form of "cincoenta", and the entry above (5 November 1854) writes the same word the same way.]
reading_reliability: complete
abstract: >-
  Original marriage entry, the second on fl. 109 of the São Romão da Ucha (Barcelos) marriage
  book. On 10 January 1855, in the parish church, after the three banns and with the licence of
  the Doutor Juiz dos Cazamentos, the Abbade Antonio Joze Correia married Manoel João,
  legitimate son of Bento Fernandes and of Joaquina Roza, of the lugar de Quintão in Ucha, to
  Joanna Maria, "Esposta" (a foundling), resident in the parish of Santa Christina d'Algozo da
  Pouza. The witnesses were Antonio Joze Correia, a widower, and Joze Augusto Correia, son of
  Domingos Joze Correia, both of the lugar da Ponte in São Paio de Merelim, who signed. The groom
  is Manoel João Fernandes da Cruz (P-0139). The bride is identified with Anna Maria Fernandes
  (P-0140), called "Anna Exposta" in her children's baptisms, although this entry names her
  "Joanna Maria" (in the margin "Joanna Mª"). This is the couple's marriage (F-0070).
abstract_pt: >-
  Assento original de casamento, o segundo da fl. 109 do livro de casamentos de São Romão da
  Ucha (Barcelos). Em 10 de janeiro de 1855, na igreja paroquial, depois dos três proclamas e com
  licença do Doutor Juiz dos Casamentos, o Abade Antonio Joze Correia casou Manoel João, filho
  legítimo de Bento Fernandes e de Joaquina Roza, do lugar de Quintão, na Ucha, com Joanna Maria,
  "Esposta" (exposta, isto é, enjeitada), residente na freguesia de Santa Christina d'Algozo da
  Pouza. Foram testemunhas Antonio Joze Correia, viúvo, e Joze Augusto Correia, filho de Domingos
  Joze Correia, ambos do lugar da Ponte, freguesia de São Paio de Merelim, que assinaram. O noivo
  é Manoel João Fernandes da Cruz (P-0139). A noiva é identificada com Anna Maria Fernandes
  (P-0140), chamada "Anna Exposta" nos batismos dos filhos, embora este assento a nomeie "Joanna
  Maria" (na margem "Joanna Mª"). É o casamento do casal (F-0070).
reliability:
  assessment: >-
    Original and direct. It is primary for the marriage, its date and place, the parties as
    named, the bride's status as a foundling and her residence, and the witnesses: the Abbade
    assisted at the marriage and wrote the entry, and the two witnesses signed it. The groom's
    parents are stated as the parties declared them. Every word of the entry is legible.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio Joze Correia, who assisted at the marriage; the two
    witnesses signed the entry. The parties did not sign.
  limitations: >-
    No ages, occupations or naturalidades are given for either party. The groom has no surname
    ("Manoel Joaõ"). The bride is "Joanna Maria", with no surname and no foster parents, place of
    exposure or roda named; the later records call her "Anna Maria" or "Anna Exposta", and this
    entry does not explain the difference. The groom's grandparents are not named.
