transcription: |-
  [Whole opening — São Romão da Ucha marriages, DGS 004670018 image 472: two entries on the left page (September and October 1854) and two on the right page, fl. 109 (November 1854 and the target of 10 January 1855). Every entry is written and signed by the Abbade Antonio Joze Corr.a. Read from the native image (3814×2836) in strips at 1–2× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [left page, entry 1 — 17 September 1854: Pedro Gomes, natural son of Anna Gomes, solteira, with Maria Roza de Azevedo, daughter of João Luis Brazile [uncertain], deceased, and Maria Roza Coelho, of the lugar da Bouça; the marriage assisted by Padre Bento Joze da Silva of Cabanellas under licence; witnesses Padre João Rodrigues, of the lugar de Bairros, and Bento Fernandes, "do d.o [lugar] de Medella", both of this parish, who sign "Bento Fernandes" and "P.e João Rodrigues". This witness is a Bento Fernandes of the lugar de Medella, not of Quintão; nothing ties him to this family.]

  [left page, entry 2 — [uncertain: dous] (2) October 1854: Manoel Domingues, son of Manoel Domingues and Domingas Fernandes, of Santa Eulalia de Cabanellas, with Anna Joaquina de Macedo, daughter of Domingos Jozé de Macedo and Roza da Conceição, of the lugar de Medella; witnesses Padre Bento Joze da Silva, of Cabanellas, and Manoel Luis, of the lugar de Quintaõ of this parish. Not this family.]

  [fl. 109, entry 1 — 5 November 1854: Joze de Araujo, exposto, and Felicidade Roza, also exposta, both resident in this parish, married by licence of the Doutor Juiz dos Cazamentos; witnesses Padre Bento Joze da Silva, of Cabanellas, and Joze Joaquim da Costa, solteiro, of the lugar do Sobreiro of this parish. Not this family.]

  [p1 — evidence/parish/PAR-0107-marriage-manoel-joao-joanna-maria-1855-ucha.jpg; fl. 109, entry 2 — TARGET]
  [Margin:] Manoel Joaõ / e Joanna Mª
  Aos dez dias do mez de Janeiro de mil oito centos sencoenta e cinco
