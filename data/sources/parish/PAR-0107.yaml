notes:
- text: >-
    The bride's name exactly as written: in the body "Joanna Maria / Esposta"; in the margin
    "Joanna Mª". The name is not "Anna Maria" anywhere in this entry. "Esposta" is the scribe's
    spelling of "Exposta" (a foundling). Her later name "Anna Maria" / "Anna Exposta" must be
    kept as a variant, and the difference as an open conflict. This record does not resolve it.
  text_pt: >-
    O nome da noiva exatamente como escrito: no corpo "Joanna Maria / Esposta"; na margem
    "Joanna Mª". O nome não é "Anna Maria" em parte alguma deste assento. "Esposta" é a grafia do
    escrivão para "Exposta" (enjeitada). O nome posterior "Anna Maria" / "Anna Exposta" deve ser
    mantido como variante, e a diferença como conflito em aberto. Este registro não a resolve.
- text: >-
    Identification. The groom is Manoel João Fernandes da Cruz (P-0139): the same forenames, the
    same parents (Bento Fernandes and Joaquina Roza, of Quintão, Ucha) as his 1833 baptism
    (PAR-0106), and the same parish. The bride is identified with P-0140 because she is a
    foundling resident at Pousa; the couple's first child was born at Pousa in December 1855,
    eleven months later (per the retrieval side's reading of the Pousa baptisms); and Thereza's
    1864 baptism (PAR-0108) says her parents were "recebidos" (married) in São Romão da Ucha and
    calls the mother "Anna Exposta". The identification is strong, not proven, because of the
    different forename.
  text_pt: >-
    Identificação. O noivo é Manoel João Fernandes da Cruz (P-0139): os mesmos prenomes, os
    mesmos pais (Bento Fernandes e Joaquina Roza, de Quintão, Ucha) do batismo de 1833 (PAR-0106)
    e a mesma freguesia. A noiva é identificada com P-0140 porque é uma exposta residente em
    Pousa; o primeiro filho do casal nasceu em Pousa em dezembro de 1855, onze meses depois
    (segundo a leitura dos batismos de Pousa pela pesquisa de recuperação); e o batismo de
    Thereza em 1864 (PAR-0108) diz que os pais foram "recebidos" (casados) em São Romão da Ucha e
    chama a mãe de "Anna Exposta". A identificação é forte, não provada, por causa do prenome
    diferente.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.5, T1). The
    draft's wording is confirmed, but its line breaks are not those of the page, and it
    normalises some forms. On the image: "sencoenta" (draft "cincoenta"); "Joze" in the body for
    all three Correias (draft "José"); "Quintaõ", "Romaõ", "Joaõ", "receberaõ", "Constituiçaõ"
    with the tilde on the o. The officiant's signature is "O Abb.e Antonio Joze Corr.a" (draft
    "O Abbe Antonio José Corrª"). The draft's "aujo [sic, = a cujo]" is confirmed; the same
    contraction occurs in the other entries on the opening.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.5, T1). O texto do rascunho foi confirmado, mas as
    mudanças de linha não são as da página, e algumas formas foram normalizadas. Na imagem:
    "sencoenta" (rascunho "cincoenta"); "Joze" no corpo para os três Correias (rascunho "José");
    "Quintaõ", "Romaõ", "Joaõ", "receberaõ", "Constituiçaõ", com o til sobre o o. A assinatura do
    oficiante é "O Abb.e Antonio Joze Corr.a" (rascunho "O Abbe Antonio José Corrª"). O "aujo
    [sic, = a cujo]" do rascunho foi confirmado; a mesma contração aparece nos outros assentos da
    abertura.
- text: >-
    What the record adds. In January 1855 the groom's parents were of the lugar de Quintão, Ucha,
    and the bride lived in the parish of Pousa ("Santa Christina d'Algozo da Pouza"). The
    marriage was made with the licence of the "Doutor Juiz dos Cazamentos"; the entry does not
    say why it was needed. Both witnesses came from the lugar da Ponte in São Paio de Merelim, outside
    Ucha. Neither party signed. The groom's father is "Bento Fernandes" here, without "José".
    On the same opening, a Bento Fernandes "do [lugar] de Medella" witnessed and signed a
    marriage on 17 September 1854. He is a namesake of another lugar and is not identified with
    P-0141.
  text_pt: >-
    O que o registro acrescenta. Em janeiro de 1855 os pais do noivo eram do lugar de Quintão,
    Ucha, e a noiva morava na freguesia de Pousa ("Santa Christina d'Algozo da Pouza"). O
    casamento foi feito com licença do "Doutor Juiz dos Cazamentos"; o assento não diz por que ela
    foi necessária. As duas testemunhas vinham do lugar da Ponte, em São Paio
    de Merelim, fora da Ucha. Nenhum dos noivos assinou. O pai do noivo é aqui "Bento Fernandes",
    sem "José". Na mesma abertura, um Bento Fernandes "do [lugar] de Medella" testemunhou e
    assinou um casamento em 17 de setembro de 1854. É um homônimo de outro lugar e não é
    identificado com P-0141.
