transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, baptism section. FamilySearch DGS 004670017, images 00039 and 00040: the openings fl. 34v–35 and fl. 35v–36. The target entry begins at the foot of fl. 35 and ends at the head of fl. 35v. Read from the native images on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0131-baptism-joao-1868-pousa-p01.jpg; DGS 004670017 image 00039; opening fl. 34v–35; entry Nº 8 begins at the foot of fl. 35]

  [Right page head (fl. 35): the folio number "35" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 34v, top — the closing lines of entry Nº 4: the mother Maria Thereza Peixoto, costureira; godfather "eu Baptizante José Lopes", godmother Maria Alvina Peixoto, solteira, who signs.]

  [fl. 34v, Nº 5 — Antonio, son of José Alves, jornaleiro, and Antonia Ferreira, tecedeira, of the logar do Souto; baptised 16 February 1868. In the margin, a later annotation dated Barcelos, 1954, [illegible in part].]

  [fl. 34v foot, continued on fl. 35 — Nº 6, Domingos, son of Manoel Gonçalves Leça and Josefa Rodrigues, of the logar da Cruzinha; baptised 17 February 1868.]

  [fl. 35, Nº 7 — Anna, daughter of João Lopes and Maria Josefa de Carvalho, of the [uncertain: Quinta de Curros]; baptised 24 February 1868.]

  [fl. 35, Nº 8 — TARGET]
  [Margin:]
  N.º 8.º
  João filho legiti-
  mo de Manoel Jo-
  ão Fernandes, e-
  Anna Exposta
  do logar do-
  Souto.
  [Body, fl. 35:]
  Aos vinte e oito dias do mez de Fevereiro do anno de mil oito centos Sessenta e oito,
  nesta Egreja Parochial da Pouza, concelho de Barcellos Diocese de Braga,
  Eu o Presbitero José Lopes Cura desta freguesia Baptizei Solemnemen-
  te e puz os Santos Oleos, á um individuo do Sexo masculino, a quem dei o no-
  me de João, e que nasceo nesta freguesia ás trez horas da manham do dia Vin-
  te e sete dos referidos mez e anno, filho legitimo Segundo do nome de Mano-
  el João Fernandes, Alfaiate, natural da freguesia de São Romão da ucha,
  deste concelho e Diocese, e de Anna Exposta, Costureira, cuja naturalidade se ignora,

  [p2 — evidence/parish/PAR-0131-baptism-joao-1868-pousa-p02.jpg; DGS 004670017 image 00040; opening fl. 35v–36; the end of entry Nº 8 at the head of fl. 35v]

  [Body, fl. 35v:]
  Recebidos na dita freguesia de São Romão da ucha parochianos desta da Pou-
  za e moradores no logar do Souto, neto paterno de Bento Fernandes e Joaquina
  Lopes e materno de avós incognitos. Foi padrinho João Gomes, Solteiro,
  Alfaiate, e madrinha Maria Corrêa Solteira, lavradeira, os quaes todos
  Sei Serem os proprios. E para Constar lavrei em duplicado este assento que,
  depois de Ser lido e conferido perante os padrinhos, comigo o não assignão
  por declararem não Sabião escrever. Era ut Supra. O Cura O Pres-
  bitero José Lopes [rubric]
  [Glosses: Alfaiate = tailor; lavradeira = woman farmer; recebidos = married; Exposta = foundling.]

  [Right page head (fl. 36): the folio number "36" and the same rubric.]

  [fl. 35v, Nº 9 — Manoel, son of Luiz Lopes Leal and Anna Joaquina Oleira, of the logar da Pouza; baptised 10 April 1868.]

  [fl. 35v foot, continued on fl. 36 — Nº 10, João, son of Custodio Gonçalves de Oliveira and Guiteria Martins da Motta, of the logar da Deveza; baptised 5 May 1868.]

  [fl. 36, Nº 11 — Antonio, son of Joaquim José Ferreira, lavrador, and Thereza de Jezus Abreu, natural of the freguesia da Graça, of the logar da Pouza; baptised 6 May 1868; paternal grandparents José Ferreira and Maria Guiteria, maternal "Bento José de Abreu e Joaquina Rosa". Not the target family: the forenames Bento José and Joaquina Rosa recur, but with the surname Abreu and a mother from Graça.]

  [fl. 36, Nº 12 — Francisco, son of João Lopes Leal and Thereza Maria, of the logar da Cachadinha; baptised 19 June 1868 (the entry continues beyond this image).]
reading_reliability: complete
abstract: >-
  Original baptism entry Nº 8 of 1868 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877, beginning at the foot of fl. 35 and ending at the head of fl. 35v. On 28 February
  1868, in the parish church of Pousa, the curate José Lopes solemnly baptised João, born in
  Pousa at three in the morning of 27 February 1868, legitimate son, "Segundo do nome", of
  Manoel João Fernandes, tailor, natural of São Romão da Ucha, and of Anna Exposta,
  seamstress, "cuja naturalidade se ignora"; the parents were married at São Romão da Ucha and
  lived at the logar do Souto in Pousa. Paternal grandparents Bento Fernandes and Joaquina
  Lopes; maternal grandparents unknown. Godparents João Gomes, single, tailor, and Maria
  Corrêa, single, woman farmer, neither of whom could write. The parents are Manoel João
  Fernandes (P-0139) and Anna Maria, "Anna Exposta" (P-0140); the grandparents are Bento José
  Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142). "Segundo do nome" reflects the death of
  the first João in 1866 (PAR-0129).
abstract_pt: >-
  Assento original de batismo nº 8 de 1868 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877, que começa no pé da fl. 35 e termina no alto da fl. 35v. Em 28 de fevereiro de
  1868, na igreja paroquial de Pousa, o cura José Lopes batizou solenemente João, nascido em
  Pousa às três da madrugada de 27 de fevereiro de 1868, filho legítimo, "Segundo do nome", de
  Manoel João Fernandes, alfaiate, natural de São Romão da Ucha, e de Anna Exposta,
  costureira, "cuja naturalidade se ignora"; os pais casaram-se em São Romão da Ucha e moravam
  no lugar do Souto, em Pousa. Avós paternos Bento Fernandes e Joaquina Lopes; avós maternos
  incógnitos. Padrinhos João Gomes, solteiro, alfaiate, e Maria Corrêa, solteira, lavradeira,
  nenhum dos quais sabia escrever. Os pais são Manoel João Fernandes (P-0139) e Anna Maria,
  "Anna Exposta" (P-0140); os avós são Bento José Fernandes (P-0141) e Joaquina Rosa Lopes
  (P-0142). O "Segundo do nome" reflete a morte do primeiro João em 1866 (PAR-0129).
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating curate, who certifies that he
    knew all the parties. It is primary for the baptism, its date and place, the child's name,
    the parents and the godparents, and secondary for the birth date and hour, the parents'
    trades and origins, their marriage parish and the grandparents; hence mixed. Both pages
    are legible and every core fact reads clearly, so reading_reliability is complete; the
    uncertain marks fall only on a lugar in a neighbouring entry and on the page rubric.
  informant: >-
    Not named. The entry was written and signed by the curate José Lopes; the godparents heard
    it read and could not sign.
  limitations: >-
    The grandparents appear as "Bento Fernandes" and "Joaquina Lopes", without the "José" and
    "Rosa" of their other records. The godparents' kinship, if any, is not stated.
