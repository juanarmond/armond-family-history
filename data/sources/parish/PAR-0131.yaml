notes:
- text: >-
    Comparison with the producer's draft (§8.4): the draft is confirmed on both pages. The
    differences are of letter form only: the scribe writes "Segundo", "Sei Serem", "Ser",
    "Constar" and "Sabião" with large initials, and "da ucha" with a small u (the draft
    normalises these). The draft did not cover the neighbouring entries.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): o rascunho confirma-se nas duas páginas. As
    diferenças são só de forma de letra: o escrivão escreve "Segundo", "Sei Serem", "Ser",
    "Constar" e "Sabião" com iniciais grandes, e "da ucha" com u minúsculo (o rascunho
    normaliza-as). O rascunho não tratou dos assentos vizinhos.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and naturalidade, the mother as a foundling of unknown origin, and the marriage at
    São Romão da Ucha (E-0142). The paternal grandparents "Bento Fernandes e Joaquina Lopes"
    are identified with Bento José Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142) through
    the father's identity and the matching names; strong, not proven. This João is very
    probably the child who died on 9 September 1870 aged two years and seven months, "segundo
    do nome" (PAR-0132).
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a
    naturalidade do pai, a mãe como exposta de origem ignorada e o casamento em São Romão da
    Ucha (E-0142). Os avós paternos "Bento Fernandes e Joaquina Lopes" são identificados com
    Bento José Fernandes (P-0141) e Joaquina Rosa Lopes (P-0142) pela identidade do pai e pelos
    nomes coincidentes; forte, não provada. Este João é muito provavelmente a criança falecida
    em 9 de setembro de 1870 com dois anos e sete meses, "segundo do nome" (PAR-0132).
- text: >-
    What it adds: the birth and baptism of the second João; the father a tailor and the mother
    a seamstress in 1868; a godfather, João Gomes, single, tailor, who is godfather again in
    1871, when he is stated natural and resident of São Romão da Ucha (PAR-0135). The record
    states no kinship for him. As a collateral record it links no event; linked_events is
    empty on purpose.
  text_pt: >-
    O que acrescenta: o nascimento e o batismo do segundo João; o pai alfaiate e a mãe
    costureira em 1868; um padrinho, João Gomes, solteiro, alfaiate, que volta a ser padrinho
    em 1871, quando se declara natural e residente de São Romão da Ucha (PAR-0135). O registro
    não declara parentesco dele. Como registro colateral, não se liga a nenhum evento;
    linked_events fica vazio de propósito.
- text: >-
    Near-namesake on the facing page: entry Nº 11 (6 May 1868) names maternal grandparents
    "Bento José de Abreu e Joaquina Rosa", the parents of Thereza de Jezus Abreu, natural of
    Graça. The forenames echo P-0141 × P-0142, but the surname and parish differ; it is not
    this family and must not be linked to it.
  text_pt: >-
    Quase homônimo na página em frente: o assento nº 11 (6 de maio de 1868) nomeia avós
    maternos "Bento José de Abreu e Joaquina Rosa", pais de Thereza de Jezus Abreu, natural da
    Graça. Os prenomes lembram P-0141 × P-0142, mas o sobrenome e a freguesia diferem; não é
    esta família e não deve ser ligado a ela.
