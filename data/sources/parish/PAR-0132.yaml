  [Body, fl. 158v:]
  Aos nove dias do mez de setembro do anno de mil oito centos setenta,
  pelas nove horas da manhan, no logar do Souto desta freguesia
  da Pousa, concelho de Barcellos, diocese de Braga, falleceo um individuo
  do sexo masculino por nome João, de dous annos e sete meses de edade,
  natural e morador nesta freguesia, filho legitimo, segundo do nome,
  de Manoel João Fernandes, alfaiate, natural da freguesia de São
  Romão da Ulha, concelho de Barcellos, diocese de Braga e Anna
  Esposta, cuja naturalidade se ignora, costureira, parochianos
  desta freguesia e moradores no logar do Souto da mesma, o qual
  foi sepultado dentro da Egreja Parochial, por não haver cemiterio, ás
  [Body, fl. 159, head of the right page:]
  ás dez horas da manhan do dia dez dos referidos mez e anno. E
  para constar lavrei em duplicado este assento que assigno. Era ut
  supra. O Abbade Manoel José d'Oliveira Guimarães
  [Reading notes: "Ulha" is written plainly with an "l"; the father's other records give the same parish as São Romão da Ucha. "Esposta" = exposta, foundling; its second letter, in the body and in the margin, is a small looped form, read "s" as in the draft (the scribe's x in "sexo" is formed differently); in the margin the letter is less certain. "ás" is repeated at the turn of the page. Glosses: manhan = manhã; Abbade = the title of the parish rector.]

  [fl. 159, Nº 19 — José, aged six months, "exposto da Roda de Braga", of the logar da Tapada; died 9 September 1870.]

  [fl. 159, Nº 20 — Maria Rosa, aged twenty-three months, daughter of Antonio José Gomes and Luiza Thereza Ferreira, of the logar d'Amproa; died 10 September 1870.]

  [fl. 159, Nº 21 — Maria, a legitimate daughter (her parents are named beyond this image); died 13 September 1870.]
reading_reliability: complete
abstract: >-
  Original death entry Nº 18 of 1870 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877, running from the foot of fl. 158v to the head of fl. 159. At nine in the morning
  of 9 September 1870, at the logar do Souto, died João, aged two years and seven months, born
  and living in Pousa, legitimate son, "segundo do nome", of Manoel João Fernandes, tailor,
  natural of the parish of "São Romão da Ulha" (Barcelos), and of Anna Esposta (a foundling),
  "cuja naturalidade se ignora", seamstress, parishioners of Pousa living at the logar do
  Souto. He was buried inside the parish church, for want of a cemetery, at ten in the morning
  of the 10th. The Abbade Manoel José d'Oliveira Guimarães wrote and signed the entry. The
  parents are Manoel João Fernandes (P-0139) and Anna Maria, "Anna Exposta" (P-0140); the
  child is very probably the second João, born 27 February 1868 (PAR-0131).
abstract_pt: >-
  Assento original de óbito nº 18 de 1870 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877, que vai do pé da fl. 158v ao alto da fl. 159. Às nove da manhã de 9 de setembro
  de 1870, no lugar do Souto, faleceu João, de dois anos e sete meses, natural e morador em
  Pousa, filho legítimo, "segundo do nome", de Manoel João Fernandes, alfaiate, natural da
  freguesia de "São Romão da Ulha" (Barcelos), e de Anna Esposta (uma enjeitada), "cuja
  naturalidade se ignora", costureira, paroquianos de Pousa moradores no lugar do Souto. Foi
  sepultado dentro da igreja paroquial, por falta de cemitério, às dez da manhã do dia 10. O
  abade Manoel José d'Oliveira Guimarães redigiu e assinou o assento. Os pais são Manoel João
  Fernandes (P-0139) e Anna Maria, "Anna Exposta" (P-0140); a criança é muito provavelmente o
  segundo João, nascido em 27 de fevereiro de 1868 (PAR-0131).
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating rector. It is primary for the
    death, its date, hour and place, the burial and the parents as named, and secondary for
    the child's age and the parents' trades and origins, which came from an unnamed informant;
    hence mixed. Every core fact is legible, so reading_reliability is complete; the uncertain
    marks fall only on one letter of the mother's descriptor in the margin and on the page
    rubric.
  informant: >-
    Not named. The entry was written and signed by the Abbade Manoel José d'Oliveira
    Guimarães.
  limitations: >-
    "Ulha" is a scribal form of the father's parish, written as Ucha in his other records. The
    stated age of two years and seven months is a round figure: from the 1868 birth the child
    was two years, six months and about thirteen days old. The entry names no grandparent and
    does not cite the baptism; tying it to PAR-0131 is strong, not proven.
