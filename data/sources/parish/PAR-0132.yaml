notes:
- text: >-
    Comparison with the producer's draft (§8.4): the image confirms "segundo do nome", "São
    Romão da Ulha", "Anna Esposta" and the burial at ten in the morning of the 10th. Differences:
    the age is written "sete meses" (draft "mezes"); the second letter of "Esposta" in the
    margin cannot be told with certainty from the scribe's x and is marked uncertain.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): a imagem confirma "segundo do nome", "São
    Romão da Ulha", "Anna Esposta" e o sepultamento às dez da manhã do dia 10. Diferenças: a
    idade está escrita "sete meses" (rascunho "mezes"); a segunda letra de "Esposta" na margem
    não se distingue com certeza do x do escrivão e fica marcada como incerta.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and parish (Ulha for Ucha) and the mother as a foundling of unknown origin. "Segundo
    do nome" and the age tie the child to the João born 27 February 1868 and baptised "Segundo
    do nome" (PAR-0131); the first João had died in 1866 (PAR-0129). Strong, not proven.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a freguesia
    do pai (Ulha por Ucha) e a mãe como exposta de origem ignorada. O "segundo do nome" e a
    idade ligam a criança ao João nascido em 27 de fevereiro de 1868 e batizado "Segundo do
    nome" (PAR-0131); o primeiro João morrera em 1866 (PAR-0129). Forte, não provada.
- text: >-
    What it adds: the death of the second João at two and a half; the father a tailor and the
    mother a seamstress in 1870; the family still at the logar do Souto. It is one of two
    deaths in the family within eight days in September 1870 (see PAR-0134). As a collateral
    record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: a morte do segundo João, com dois anos e meio; o pai alfaiate e a mãe
    costureira em 1870; a família ainda no lugar do Souto. É uma de duas mortes na família em
    oito dias, em setembro de 1870 (ver PAR-0134). Como registro colateral, não se liga a
    nenhum evento; linked_events fica vazio de propósito.
