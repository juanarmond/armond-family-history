transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, death section. FamilySearch DGS 004670017, image 00163: the opening fl. 158v (left) – fl. 159 (right). The target entry begins at the foot of fl. 158v and ends at the head of fl. 159, on the same image. Read from the native image on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0132-death-joao-1870-pousa.jpg; DGS 004670017 image 00163; fl. 158v–159, 1870 entry Nº 18]

  [Right page head (fl. 159): the folio number "159" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 158v, top — the end of entry Nº 16: Agostinho, "exposto da Roda de Braga", aged 24, criado de lavoura, solteiro, of the logar da Egreja, raised by Anna Rosa Maria, solteira, costureira; buried on the 7th; signed by the Abbade Manoel José d'Oliveira Guimarães.]

  [fl. 158v, Nº 17 — Luiza, aged five months, daughter of Joaquim Lopes Corrêa and Anna Joaquina, of the logar da Deveza; died 6 September 1870.]

  [fl. 158v, Nº 18 — TARGET]
  [Margin:]
  N.º 18
