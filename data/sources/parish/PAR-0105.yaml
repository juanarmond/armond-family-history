transcription: >-
  [Whole page — São Sebastião baptisms, book TER-AH-SAOSEBASTIAO-B-1611-1687, p.0349 per the
  retrieval side; BPAR 300-dpi scan of the original, Requisição nº 101, image 2. Three entries,
  24 December 1661 – 5 January 1662. Entry 1 is signed by the cura Domingos Cardoso Froes,
  entries 2 and 3 by the vicar António Coelho Sotto major. The paper is stained and the ink of
  the verso shows through, without hiding the words of entry 2. " / " marks a line break of the
  original. Spelling, capitals and abbreviations are kept as written; expansions follow each
  entry in a separate bracket. Read from the TIFF 2026-10-10.]

  [Page head: a small mark at the top centre; a faint round stamp at the top left. No folio
  number was read.]

  [entry 1 of 3 — Ant.º, son of Ant.º Pir.z and Esperança Rebela; 24 December 1661]
  [Margin:] Ant.º
  "Em os vinte e coatro dias do mes de dezem- / bro do anno de mil e seis sentos e / sesenta e
  hu annos baptizei a Ant.º / f.º de Ant.º Pir.z [uncertain: Pir.z] e de sua molher /
  Esperança Rebela forão padrinhos / o R.do p.e Vig.ro desta Matriz da vi- / lla de S. Bastião
  Ant.º Coelho Sotto ma- / jor e Margarida [uncertain: Margarida] [illegible] de S.
  [uncertain: Pablo] f.a / do Cap.am João Coelho [illegible] [an interlinear word, illegible] /
  [illegible] assignei dia mes e era / ut supra o Cura"
  [Signature:] Domingos Cardoso Froes
  [Expansions: Ant.º = António; f.º / f.a = filho / filha; Pir.z = Pires (if so read); R.do p.e
  Vig.ro = Reverendo padre vigário; Cap.am = Capitão.]

  [entry 2 of 3 — TARGET: Manuel, son of Fr.co Fer.ra and Dona Anna M.da; 27 December 1661]
  [Margin:] M.el [and, lower in the margin, a small cross mark]
  "Em os vinte e sete dias do mes de dez.ro de / mil seis [uncertain: seis — the word is
  cramped] sentos sesenta e hu annos / baptizei a manuel filho de Fr.co Fer.ra / e de sua mulher
  Dona Anna M.da [the "da" written above the line, over the end of the "M"] forão pa- / drinhos
  pedro [uncertain: de] Sotto e Izabel [uncertain: Alvres] / mulher de B.to pacheco por verdade
  / me assignei em dia mes e era ut supra"
  [Signature:] Vig.ro Ant.º Coelho Sotto major
  [Expansions: dez.ro = dezembro; hu = hum; Fr.co = Francisco; Fer.ra = Ferreira; M.da — an
  abbreviated surname, consistent with "Machada" (the same abbreviation as "D. Anna M.da" in
  PAR-0103), not written out; B.to = Bento; Vig.ro = Vigário.]

  [entry 3 of 3 — Beatris, daughter of [uncertain: Pedro] machado and maria da Silva; 5 January
  1662]
  [Margin:] Beatris
  "Em os cinco dias do mes de jan.ro de mil seis sentos e se- / senta e dous annos baptizei a
  Beatris filha / de [uncertain: Pedro] machado e de sua mulher maria / da Silva foi padrinho
  [illegible] [interlinear, illegible] [illegible] Ferreira / [illegible]dade me assignei"
  [Signature:] Vig.ro Sotto major
  [Expansions: jan.ro = janeiro.]
transcription_pt: >-
  [Página inteira — baptismos de São Sebastião, livro TER-AH-SAOSEBASTIAO-B-1611-1687, p.0349
  segundo a pesquisa de recuperação; digitalização a 300 dpi do original pelo BPAR, Requisição nº
  101, imagem 2. Três assentos, de 24 de dezembro de 1661 a 5 de janeiro de 1662. O assento 1 é
  assinado pelo cura Domingos Cardoso Froes, os assentos 2 e 3 pelo vigário António Coelho Sotto
  major. O papel está manchado e a tinta do verso transparece, sem esconder as palavras do
  assento 2. " / " marca uma mudança de linha do original. Ortografia, maiúsculas e abreviaturas
  como estão escritas; os desdobramentos vêm a seguir a cada assento, entre parênteses retos à
  parte. Lido no TIFF em 2026-10-10.]

  [Cabeçalho: um pequeno sinal ao centro, no alto; um carimbo redondo, apagado, no canto superior
  esquerdo. Não se leu número de fólio.]

  [assento 1 de 3 — Ant.º, filho de Ant.º Pir.z e de Esperança Rebela; 24 de dezembro de 1661]
  [Margem:] Ant.º
  "Em os vinte e coatro dias do mes de dezem- / bro do anno de mil e seis sentos e / sesenta e
  hu annos baptizei a Ant.º / f.º de Ant.º Pir.z [incerto: Pir.z] e de sua molher / Esperança
  Rebela forão padrinhos / o R.do p.e Vig.ro desta Matriz da vi- / lla de S. Bastião Ant.º
  Coelho Sotto ma- / jor e Margarida [incerto: Margarida] [ilegível] de S. [incerto: Pablo] f.a
  / do Cap.am João Coelho [ilegível] [uma palavra entrelinhada, ilegível] / [ilegível] assignei
  dia mes e era / ut supra o Cura"
  [Assinatura:] Domingos Cardoso Froes
  [Desdobramentos: Ant.º = António; f.º / f.a = filho / filha; Pir.z = Pires (se assim se ler);
  R.do p.e Vig.ro = Reverendo padre vigário; Cap.am = Capitão.]

  [assento 2 de 3 — ALVO: Manuel, filho de Fr.co Fer.ra e de Dona Anna M.da; 27 de dezembro de
  1661]
  [Margem:] M.el [e, mais abaixo na margem, uma pequena cruz]
  "Em os vinte e sete dias do mes de dez.ro de / mil seis [incerto: seis — palavra apertada]
  sentos sesenta e hu annos / baptizei a manuel filho de Fr.co Fer.ra / e de sua mulher Dona
  Anna M.da [o "da" escrito por cima da linha, sobre o fim do "M"] forão pa- / drinhos pedro
  [incerto: de] Sotto e Izabel [incerto: Alvres] / mulher de B.to pacheco por verdade / me
  assignei em dia mes e era ut supra"
  [Assinatura:] Vig.ro Ant.º Coelho Sotto major
  [Desdobramentos: dez.ro = dezembro; hu = hum; Fr.co = Francisco; Fer.ra = Ferreira; M.da —
  apelido abreviado, compatível com "Machada" (a mesma abreviatura de "D. Anna M.da" no
  PAR-0103), não escrito por extenso; B.to = Bento; Vig.ro = Vigário.]

  [assento 3 de 3 — Beatris, filha de [incerto: Pedro] machado e de maria da Silva; 5 de janeiro
  de 1662]
  [Margem:] Beatris
  "Em os cinco dias do mes de jan.ro de mil seis sentos e se- / senta e dous annos baptizei a
  Beatris filha / de [incerto: Pedro] machado e de sua mulher maria / da Silva foi padrinho
  [ilegível] [entrelinhado, ilegível] [ilegível] Ferreira / [ilegível]dade me assignei"
  [Assinatura:] Vig.ro Sotto major
  [Desdobramentos: jan.ro = janeiro.]
reading_reliability: complete
abstract: >-
  Original baptism act of Manuel, the second of three entries on a page of the São Sebastião
  (Terceira) baptism book TER-AH-SAOSEBASTIAO-B-1611-1687 (p.0349 per the retrieval side), read
  from a 300-dpi scan that BPAR Angra do Heroísmo made of the original for the owner
  (Requisição nº 101, image 2). On 27 December 1661 the vicar António Coelho Sotto major
  baptised "manuel", son of "Fr.co Fer.ra" and "his wife Dona Anna M.da"; the godparents were
  pedro [de] Sotto and Izabel, wife of Bento pacheco. The parents are very probably Francisco
  Ferreira Ermonde (P-0137) and D. Ana M[achada] (P-0138), the parents of Margarida baptised in
  the same church in 1667 (PAR-0103): same forenames, the same abbreviated surname "M.da" for
  the mother, and the same style "Dona" for her. The father's "Ermonde" is not written here, so
  the identification is strong, not proven, and Manuel is recorded as a documented child of
  family F-0068 rather than as a person entity.
abstract_pt: >-
  Assento original de baptismo de Manuel, o segundo de três assentos de uma página do livro de
  baptismos de São Sebastião (Terceira) TER-AH-SAOSEBASTIAO-B-1611-1687 (p.0349 segundo a
  pesquisa de recuperação), lido numa digitalização a 300 dpi feita pelo BPAR de Angra do
  Heroísmo a partir do original, a pedido do proprietário (Requisição nº 101, imagem 2). A 27 de
  dezembro de 1661 o vigário António Coelho Sotto major baptizou "manuel", filho de "Fr.co
  Fer.ra" e "de sua mulher Dona Anna M.da"; foram padrinhos pedro [de] Sotto e Izabel, mulher de
  Bento pacheco. Os pais são muito provavelmente Francisco Ferreira Ermonde (P-0137) e D. Ana
  M[achada] (P-0138), pais da Margarida baptizada na mesma igreja em 1667 (PAR-0103): os mesmos
  prenomes, o mesmo apelido abreviado "M.da" para a mãe e o mesmo tratamento de "Dona" para ela.
  O "Ermonde" do pai não está escrito aqui, pelo que a identificação é forte, não provada, e
  Manuel fica registado como filho documentado da família F-0068, e não como pessoa modelada.
reliability:
  assessment: >-
    Primary, original and direct for the baptism, its date, the child's forename, both parents
    as named and the godparents: the act was written and signed by the officiating vicar at the
    time. At 300 dpi every core fact of entry 2 is legible — the date ("vinte e sete dias do mes
    de dez.ro de mil seis sentos sesenta e hu annos"; the month and year also follow from the
    neighbouring entries of 24 December 1661 and 5 January 1662), the child ("manuel", margin
    "M.el"), the father ("Fr.co Fer.ra") and the mother ("sua mulher Dona Anna M.da") — so
    reading_reliability is complete. The inline [uncertain] marks in this entry fall only on a
    cramped numeral word whose value is fixed by the neighbouring entries and on the godparents'
    names. Identity is the limit, not legibility: the act gives the father as "Fr.co Fer.ra"
    without "Ermonde", and the mother's surname only as "M.da". Tying this couple to Francisco
    Ferreira Ermonde and D. Ana M.da of PAR-0103 rests on the matching names and style in the
    same parish six years apart; no record held names Manuel in a context that also says
    "Ermonde".
  informant: >-
    The vicar of São Sebastião, António Coelho Sotto major, who officiated and signed
  limitations: >-
    The father's surname "Ermonde" is not written; "Ferreira" was a common surname in the
    parish (PAR-0099 names a "Gasp.ar Fer.ra do porto judeu"), so the identification with
    P-0137 is strong, not proven. The mother's surname is an abbreviation. Peripheral uncertain
    reads remain in the godparents' names and in entries 1 and 3. Stains and show-through from
    the verso cross the page but do not hide entry 2. No folio number was read; p.0349 is the
    retrieval side's Culturacores image number for the same leaf.
