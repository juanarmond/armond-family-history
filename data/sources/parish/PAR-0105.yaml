notes:
- text: >-
    Not modelled as an event. Manuel is recorded as a documented child of F-0068 (with this
    source), not as a person entity, so no baptism event is created and linked_events is empty
    on purpose. If a later record ties him to "Ermonde" — the retrieval side reports a
    collaborative-tree profile "Alferes Manoel Machado Ermonde" (1661–1704), said to have
    witnessed Gaspar's 1694 marriage [LEAD — tree profile, not a record] — he could be modelled
    and this act given an event.
  text_pt: >-
    Não modelado como evento. Manuel fica registado como filho documentado da F-0068 (com esta
    fonte), e não como pessoa modelada, pelo que não se cria evento de baptismo e linked_events
    fica vazio de propósito. Se um registo posterior o ligar a "Ermonde" — a pesquisa de
    recuperação refere um perfil de árvore colaborativa "Alferes Manoel Machado Ermonde"
    (1661–1704), dado como testemunha do casamento de Gaspar em 1694 [LEAD — perfil de árvore,
    não registo] —, poderá ser modelado e este assento ganhar um evento.
- text: >-
    The officiant signs entries 2 and 3 "Vig.ro Ant.º Coelho Sotto major" / "Vig.ro Sotto
    major" — the vicar António Coelho Souto-Maior, who in 1657 baptised Gaspar (PAR-0099), the
    future husband of Manuel's probable sister Margarida. Entry 1 names the same vicar as a
    godfather.
  text_pt: >-
    O oficiante assina os assentos 2 e 3 "Vig.ro Ant.º Coelho Sotto major" / "Vig.ro Sotto major"
    — o vigário António Coelho Souto-Maior, que em 1657 baptizou Gaspar (PAR-0099), futuro marido
    de Margarida, provável irmã de Manuel. O assento 1 nomeia o mesmo vigário como padrinho.
