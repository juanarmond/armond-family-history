  [Matriz de São João Baptista da Lagoa, Corte/Rio de Janeiro, baptismos folio 87, 1863; Vigário
  Braz Martins do Monte.] "Aos dezeseis de Março de mil oitocentos e sessenta e tres, nesta [Matriz
