abstract: >-
  Parish baptism of Lucinda (Ferreira da Silva, P-0031) — born 10 August 1862, baptised 16 March
  1863 at the Matriz de São João Baptista da Lagoa (Corte/Rio de Janeiro), legitimate daughter of
  Antonio da Silva Ferreira (P-0036) × Maria Joanna da Silva [Ferreira] (P-0037). Source for her
  baptism event E-0124 and for the correction of her birth (E-0105): she was born in RIO, not Nova
  Friburgo — correcting the informant-reported "natural desta Freguezia [NF]" of CIV-0019 and
  corroborating her 1884 NF marriage's claim that she was "nascida e baptisada na freg. de S. João
  Baptista da Lagoa, na Corte." Confirms the Silva-Ferreira family was in Rio in 1862-63.
abstract_pt: >-
  Batismo paroquial de Lucinda (Ferreira da Silva, P-0031) — nascida em 10 de agosto de 1862,
  baptizada em 16 de março de 1863 na Matriz de São João Baptista da Lagoa (Corte/Rio de Janeiro),
  filha legítima de Antonio da Silva Ferreira (P-0036) × Maria Joanna da Silva [Ferreira] (P-0037).
  Fonte de seu batismo (E-0124) e da correção de seu nascimento (E-0105): nasceu no RIO, não em Nova
  Friburgo — corrigindo o "natural desta Freguezia [NF]" informado em CIV-0019 e corroborando a
  declaração de seu casamento de 1884 (NF) de que era "nascida e baptisada na freg. de S. João
  Baptista da Lagoa, na Corte". Confirma que a família Silva-Ferreira estava no Rio em 1862-63.
