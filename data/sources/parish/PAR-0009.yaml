transcription: >-
  [Paróquia de Santa Luzia de Carangola, MG; livro de óbitos. Margem: "Rita".] "Aos 4
  de Janeiro de 1898 faleceu de morte natural Rita do Rego Brandão, de 51 annos de
  idade, casada com José do Rego Brandão. Não procuraram Confissão. No dia 5 foi
  solemnemente encommendada nesta Egreja e Acompanhada ao Cemeterio, aonde foi
  sepultada. Conego [Francisco] Sabino."
abstract: >-
  The original 1898 death register entry (Santa Luzia de Carangola, MG) of Rita do
  Rego Brandão — the married name of Rita Ignacia de Jesus (P-0041) — died 4 January
  1898, aged 51 (so born c.1847), wife of José do Rego Brandão (P-0040). Identified as
  P-0041 by the married-name and husband match (José's own 1912 óbito names him "viuvo
  de Rita do Rego Brandão").
abstract_pt: >-
  O assento original de óbito de 1898 (Santa Luzia de Carangola, MG) de Rita do
  Rego Brandão — o nome de casada de Rita Ignacia de Jesus (P-0041) — falecida em
  4 de janeiro de 1898, aos 51 anos (portanto nascida por volta de 1847), esposa
  de José do Rego Brandão (P-0040). Identificada como P-0041 pela correspondência
  do nome de casada e do marido (o próprio óbito de José, de 1912, o nomeia
  "viuvo de Rita do Rego Brandão").
reliability:
  assessment: >-
    Direct primary parish evidence for the death and approximate birth year of Rita
    (P-0041), identified by her husband's name.
  informant: The Conego [Francisco] Sabino of Santa Luzia de Carangola (1898).
  limitations: >-
    The act records her married name "Rita do Rego Brandão", not the "Rita Ignacia de
    Jesus" of her daughter Susanna's 1866 baptism; the identification rests on the
    husband (José do Rego Brandão) match. A separate 1906 Carangola death of a
    different "Rita Brandão" (wife of João de Souza Freitas, died in childbirth at 32)
    is NOT this person.
