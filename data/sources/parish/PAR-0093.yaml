abstract: >-
  Primary parish baptism record for Manuel, second son of that name born to Belchior da
  Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptised 16 January 1656 in São
  Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0313). The act names the father
  as "Belchior [da Ponte] Cardoso" and the mother is rendered as "morsarana" (a phonetic
  scribal variant of Mariana). Consistent with Vol. IX (PUB-0005, p.260), which records him
  as dying solteiro (unmarried). Status: confirmed.
abstract_pt: >-
  Registo paroquial primário do baptismo de Manuel, segundo filho com esse nome nascido de
  Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizado a 16 de janeiro
  de 1656 em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0313). O assento
  nomeia o pai como "Belchior [da Ponte] Cardoso" e a mãe é registada como "morsarana"
  (variante scribal fonética de Mariana). Consistente com o Vol. IX (PUB-0005, p.260), que
  o regista como falecido solteiro. Estado: confirmado.
reliability:
  assessment: >-
    Primary source (original parish baptism register). Father's name is legible. The
    mother's name "morsarana" is a scribal phonetic rendering of Mariana; this is
    consistent with other São Sebastião register idiosyncrasies and is not an uncertainty
    about the person's identity. Evidence quality: confirmed.
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1656
  limitations: >-
    Mother's name rendered phonetically as "morsarana"; confirmed as Mariana by context
    (same parents across multiple register entries). Image p2 is a context page only.
    Resolution: 612×842 px per page.
