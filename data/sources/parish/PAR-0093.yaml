notes:
- text: >-
    This is the second child named Manuel (b.16.1.1656); the first Manuel was born
    13.10.1652 (PAR-0091). The earlier Manuel may have died in infancy (no óbito record
    held), prompting the name reuse. Vol. IX (PUB-0005) records this Manuel as dying
