transcription: >-
  [Livro de Óbitos, Nova Friburgo, fl.139, 1860.] "Aos vinte e dois dias do mez de Julho, pelas
  oito horas e meia da noite, do anno de 1860, falleceu da vida presente, n'esta Villa da Nova
  Friburgo, João José Rocheman, de idade de cincoenta e nove annos, dez mezes e vinte e dois dias,
  cazado com Isabel Stork, natural e baptizado na Freguezia de Bulle, Cantão de Fribourg, na Suíça,
  Brasileiro naturalizado; foi encommendado, acompanhado, e sepultado no dia seguinte no Cemiterio
  d'esta Villa; e para constar fiz este assento que por ser verdade assignei. O Vigario Jacob Joye."
abstract: >-
  Parish burial record of João José Rocheman (Rutschmann, P-0109) — Iris Bohrer Muniz's
  great-great-grandfather on the Rutschmann line — who died at 8.30 p.m. on 22 July 1860 at Nova
  Friburgo, aged 59 years, 10 months and 22 days (→ born ~30 August 1800), husband of Isabel
  (Elisabeth) Stork (P-0110). STATES HIS SWISS ORIGIN: natural and baptised in the parish of Bulle,
  Canton Fribourg, Switzerland, a naturalised Brazilian. Source for the death event E-0095.
abstract_pt: >-
  Registro de óbito de João José Rocheman (Rutschmann, P-0109) — trisavô de Iris Bohrer Muniz na
  linha Rutschmann — falecido às 20h30 de 22 de julho de 1860 em Nova Friburgo, com 59 anos, 10
  meses e 22 dias (→ nascido ~30 de agosto de 1800), marido de Isabel (Elisabeth) Stork (P-0110).
  DECLARA SUA ORIGEM SUÍÇA: natural e baptizado na Freguezia de Bulle, Cantão de Fribourg, Suíça,
  brasileiro naturalizado. Fonte do evento de óbito E-0095.
