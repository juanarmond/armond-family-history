transcription: >-
  [Livro de Óbitos, Nova Friburgo, fólio 152, nº 162, 1948.] "Aos vinte e tres dias do mes de
  Setembro de mil novecentos e quarenta e oito na Igreja Matriz o R.do Coadjutor S. Caetano Trielli
  encommendou e depois foi sepultado no cemiterio publico o cadaver de Valentim Martins Bohrer de
  oitenta annos, casado com Carolina Bohrer, faleceu do coração. Para constar mandei fazer este
  assento e o assino. O [Vigario — signature illegible]."
abstract: >-
  Parish death/burial of Valentim Martins [Martinho] Bohrer (P-0028), commended and buried 23
  September 1948 at Nova Friburgo, aged 80 (→ b. ~1868, matching PAR-0063/PAR-0064), husband of
  Carolina (Klein) Bohrer (P-0029); died of heart failure. Source for his death event E-0089. This
  1948 death is the true one; the earlier FamilySearch-tree "d. 1893" is a namesake, excluded.
abstract_pt: >-
  Óbito/sepultamento paroquial de Valentim Martins [Martinho] Bohrer (P-0028), encomendado e
  sepultado em 23 de setembro de 1948, em Nova Friburgo, aos 80 anos (→ n. ~1868, coincidindo com
  PAR-0063/PAR-0064), marido de Carolina (Klein) Bohrer (P-0029); faleceu do coração. Fonte de seu
  evento de óbito E-0089. Este óbito de 1948 é o verdadeiro; o "d. 1893" da árvore do FamilySearch é
  um homônimo, excluído.
