transcription: >-
  [Livro de Casamentos, Nova Friburgo, fl.209, 1859.] "Aos tres dias do mez de Março de mil
  oitocentos e cincoenta e nove, feitas as tres publicações Canonicas n'esta Igreja parochial de
  São João Baptista da Villa da Nova Friburgo, onde os contrahentes são fregueses, na forma do
  Sagrado Concilio Tridentino, sem se discubrir impedimento algum, em presença do Reverendo Padre
  João José [Arbiard? — uncertain] com licença minha passada em 24 de Janeiro 1859, e sendo
  presentes como testimunhas Domingos Baptista Bittencourt e Luiz Mathias Pinheiro, pessoas
  conhecidas, se casarão solemnemente por palavras em face da Igreja, Antonio da Silva Ferreira
  filho legitimo de Justino da Silva e de Maria Angelica, natural e baptizado na Freguezia de
  [Guenfães? — uncertain] em Portugal, e Maria Joanna Rocheman filha legitima de João José Rocheman
  e de Isabel Stork, natural e baptizada n'esta Freguezia de São João Baptista, donde ambos são de
  presente moradores; sendo o noivo de idade de [em branco] annos, e a noiva de 18 annos; e logo
  lhes forão dadas as bencões na forma do ritual romano e Constituições do Bispado; e para constar
  fiz este assento que por ser verdade assignei. O Vigario Jacob Joye."
abstract: >-
  Parish marriage of Antonio da Silva Ferreira (P-0036) and Maria Joanna Rocheman (Rutschmann,
  P-0037), 18 — Iris Bohrer Muniz's Silva Ferreira / Rutschmann ancestors — on 3 March 1859 at the
  Matriz de São João Baptista, Nova Friburgo. NAMES BOTH PARENT COUPLES: Antonio is a legitimate
  son of Justino da Silva (P-0111) and Maria Angelica (P-0112), natural and baptised in the parish
  of [Guenfães — uncertain], Portugal; Maria Joanna a legitimate daughter of João José Rocheman
  (P-0109) and Isabel Stork (P-0110), of Nova Friburgo. The groom's age was left blank. Source for
  the marriage event E-0094 and the parent families F-0055 (Silva, new) and F-0054 (Rutschmann).
abstract_pt: >-
  Casamento paroquial de Antonio da Silva Ferreira (P-0036) e Maria Joanna Rocheman (Rutschmann,
  P-0037), 18 anos — ancestrais de Iris Bohrer Muniz na linha Silva Ferreira / Rutschmann — em 3 de
  março de 1859, na Matriz de São João Baptista, Nova Friburgo. NOMEIA OS DOIS CASAIS DE PAIS:
  Antonio é filho legítimo de Justino da Silva (P-0111) e Maria Angelica (P-0112), natural e
  baptizado na Freguezia de [Guenfães — incerto], em Portugal; Maria Joanna é filha legítima de
  João José Rocheman (P-0109) e Isabel Stork (P-0110), de Nova Friburgo. A idade do noivo ficou em
  branco. Fonte do evento de casamento E-0094 e das famílias de pais F-0055 (Silva, nova) e F-0054
  (Rutschmann).
