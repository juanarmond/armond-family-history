transcription: >-
  [Livro de Casamentos, N.S. Mãe de Deos, Povoação (São Miguel), fl.13, termo nº
  23, 1872. Margem: "Manoel Soares de Lima e Claudina Muniz Betencourt".] "Aos
  vinte dois dias do mez de Setembro do anno de mil oito centos setenta e dois
  nesta Egreja Parochial de Nossa Senhora Mãe de Deos concelho da Villa da
  Povoação, Diocese de Angra na minha presença compareceram os nubentes Manoel
  Soares de Lima e Claudina Muniz Bettencourt, os quaes sei serem os proprios com
  todos os papeis do estillo correntes sem impedimento algum canonico ou civil
  para o casamento, elle de vinte quatro annos de idade solteiro sapateiro
  natural baptisado e morador nesta freguesia, filho legitimo de Manoel Soares de
  Lima natural da mesma e de Maria Joaquina de Jesus natural da freguesia de
  Santa Anna do Lugar das Furnas do dito concelho e Diocese; e ella de dezeseis
  annos de idade solteira d'ocupação domestica natural baptisada e moradora nesta
  freguesia, filha legitima de Manoel Muniz Bettencourt já defunto e de Francisca
  Roza [do] Espirito Santo naturaes da mesma; os quaes nubentes se receberão por
  marido e mulher, e os uni em Matrimonio procedendo em tudo este acto conforme o
  Rito da Santa Madre Igreja Catholica Apostolica Romana. Forão dispensados dos
  proclamas Legaes e a nubente obteve o consenso materno como consta do Mandado do
  Illustrissimo e Reverendissimo Senhor Ouvidor Geral Delegado de Sua Excellencia
  Reverendissima em Ponta Delgada o qual fica archivado; e forão testemunhas
  presentes que sei serem os proprios o Reverendo Julio Cesar Augusto Cura
  [uncertain] da dita Parochial e Francisco Soares Brandão casado proprietario
  naturaes e moradores nesta freguezia. E para constar lavrei em duplicado este
  assento, que depois
  de ser lido e conferido perante os Conjuges e testemunhas comigo o não assignão os
  Conjuges e a segunda testemunha por não saberem escrever. Era ut supra. Padre
  Julio Cesar Augusto / O Cura Manoel Ignacio Ferreira." [Corrected 2026-10-08 from
  the image: the earlier transcription omitted the nuptial-blessing clause, the
  maternal-consent mandate and the closing formula, compressed the witness clause
  (the witnesses are "naturaes e moradores", not one "morador"), and misread the
  sign-off — the officiating Cura who wrote and signed the act is Manoel Ignacio
  Ferreira; Padre Julio Cesar Augusto signed as first witness.]
abstract: >-
  Parish marriage of Claudina Muniz Bettencourt, aged 16 (born ~1856), a domestic
  worker of N.S. Mãe de Deus (Povoação, São Miguel, Azores), to Manoel Soares de
  Lima (24, shoemaker of the same parish) on 22 September 1872. It names her
  parents Manoel Muniz Bettencourt (P-0042), stated "já defunto" (already
  deceased by 22 September 1872), and Francisca Roza do Espírito Santo (P-0047) —
  hence Claudina is a sister of the emigrant João Muniz Bittencourt (P-0019).
  The bride, a minor, obtained her mother's consent ("consenso materno"), recorded
  by mandate of the Ouvidor Geral at Ponta Delgada — so Francisca was presumably
  living when that consent was given in 1872 [INFERRED]. The proclamations were
  dispensed. Recorded as a documented child on family F-0020. This bride Claudina (b. ~1856)
  is a distinct person from the couple's infant daughter of the same name who
  died in 1854 (PAR-0085) — a reused given name. PROVEN. Not modelled as a person
  entity; no event created.
abstract_pt: >-
  Casamento paroquial de Claudina Muniz Bettencourt, de 16 anos (nascida ~1856),
  de ocupação doméstica de N.S. Mãe de Deus (Povoação, São Miguel, Açores), com
  Manoel Soares de Lima (24 anos, sapateiro da mesma freguesia) em 22 de setembro
  de 1872. Nomeia seus pais Manoel Muniz Bettencourt (P-0042), declarado "já
  defunto" (já falecido em 22 de setembro de 1872), e Francisca Roza do Espírito
  Santo (P-0047) — portanto Claudina é irmã do emigrante João Muniz Bittencourt
  (P-0019). A noiva, menor, obteve o consentimento materno ("consenso materno"),
  registrado por mandado do Ouvidor Geral em Ponta Delgada — portanto Francisca
  presumivelmente estava viva quando esse consentimento foi dado em 1872 [INFERRED].
  Os proclamas foram dispensados. Registrada como filha documentada na família
  F-0020. Esta noiva
  Claudina (n. ~1856) é pessoa distinta da filha bebê homônima do casal, falecida
  em 1854 (PAR-0085) — nome reutilizado. PROVADO. Não modelada como entidade
  pessoa; sem evento criado.
reliability:
  assessment: >-
    Primary parish marriage entry — direct primary for the marriage and for the
    bride's filiation to Manoel Muniz Bettencourt and Francisca Roza do Espírito
    Santo; it also establishes that her father Manoel was already deceased by 22
    September 1872.
  informant: >-
    The officiating Cura Manoel Ignacio Ferreira, who wrote and signed the act
    ("comigo"); Padre Julio Cesar Augusto signed as first witness. The spouses and
    the second witness (Francisco Soares Brandão) did not sign, not knowing how to
    write. [Corrected 2026-10-08 from the image: previously given as "the Cura Julio
    Cesar Augusto".]
  limitations: >-
    The Ouvidor Geral's mandate granting the maternal consent is stated to be filed
    ("fica archivado") but is not held. One word in the closing is uncertain — the
    descriptor "Cura" after Julio Cesar Augusto's name in the witness clause; it does not
    affect a genealogical fact. (The closing verb reads "lavrei", confirmed on the image
    2026-10-08.) Claudina is
    a collateral (a sister of João P-0019) recorded as a documented child, not
    modelled.
