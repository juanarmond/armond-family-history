transcription: >-
  [Casamento — Livro de casamentos, Matriz de São João del Rei, folio 252;
  FamilySearch ARK 3:1:939N-GW99-VX (M5FX-MNT, img 238/260). Transcribed from
  the published genealogy "João Pereira Themudo" Cap. 2º (secondary source),
  confirmed field-by-field against the original image — zero discrepancies.]

  Aos 8 de Maio de mil oito centos e dez na Matriz desta Vila se casaram por
  palavras de presente com licença do Reverendíssimo Vigário da Vara desta
  Comarca, sem impedimento algum depois de proclamados no tempo costumado,
  Ladislau Egídio Ferreira de Toledo, filho legítimo do Capitão Joaquim José
  Ferreira de Toledo e de D. Rita Angélica Rodrigues, com D. Mathildes Maria de
  Jesus, filha legítima do Alferes Amaro da Silva Xavier e de Ignez Francisca de
  Lima, naturais e batizados da Freguesia de Barbacena. Testemunhas: Tenente
  Coronel Caetano José de Almeida e Furriel Cezário José da Silva (alias Cezário
  José da Silva Lima). [cláusula final: ...? primos ... na Ermida da Senhora dos
  Dory desta Vila — a palavra antes de "na Ermida" é de leitura incerta; pode
  ler-se "primos", o que implicaria uma dispensação de consanguinidade.]
