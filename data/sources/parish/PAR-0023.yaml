abstract: >-
  Marriage on 8 May 1810 at the São João del Rei matriz of Ladisláo Egídio
  Ferreira de Toledo (P-0056), son of Cap. Joaquim José Ferreira de Toledo
  (P-0057) and D. Ritta Angélica Rodrigues (P-0058), with Mathilde Maria de
  Jesus (P-0027), daughter of Alferes Amaro da Silva Xavier (P-0059) and Ignez
  Francisca de Lima (P-0060). Both spouses are stated to be born and baptised in
  the Freguesia de Barbacena (naturais e batizados). This record is the primary
  source for Matilde's parentage and the primary confirmation of this marriage;
  it also supplies a second attestation of Ladisláo's parentage (already
  confirmed by his 1787 baptism, PAR-0019). The negative result in the Barbacena
  Piedade marriage books (1793–1826) is explained by the couple marrying at São
  João del Rei rather than in either spouse's home parish.
abstract_pt: >-
  Casamento em 8 de maio de 1810 na matriz de São João del Rei de Ladisláo Egídio
  Ferreira de Toledo (P-0056), filho do Cap. Joaquim José Ferreira de Toledo
  (P-0057) e de D. Ritta Angélica Rodrigues (P-0058), com Mathilde Maria de Jesus
  (P-0027), filha do Alferes Amaro da Silva Xavier (P-0059) e de Ignez Francisca
  de Lima (P-0060). Declara-se que ambos os cônjuges nasceram e foram batizados na
  Freguesia de Barbacena (naturais e batizados). Este registro é a fonte primária
  da filiação de Matilde e a confirmação primária deste casamento; fornece também
  uma segunda atestação da filiação de Ladisláo (já confirmada por seu batismo de
  1787, PAR-0019). O resultado negativo nos livros de casamentos de Barbacena
  (Piedade, 1793–1826) explica-se pelo fato de o casal ter se casado em São João
  del Rei, e não na freguesia de origem de nenhum dos cônjuges.
reliability:
  assessment: >-
    An original parish register entry, primary information for both spouses'
    parentage and the marriage date and place. The Themudo transcription (published
    genealogy, secondary source) was confirmed against all legible fields of the
    original image with zero discrepancies. One word in the closing clause is
    uncertain ("primos"?) and should be verified against a higher-resolution
    scan or in-person inspection.
  informant: >-
    The parish priest or vicar of the São João del Rei matriz recording the
    marriage as an officer of the church.
  limitations: >-
    One uncertain word in the closing clause (possible consanguinity dispensation).
    Transcription confirmed via secondary source (Themudo); a complete independent
    transcription from the original is desirable.
