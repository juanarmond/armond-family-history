notes:
- text: >-
    Differences from the retrieval side's draft (joaquina-rosa-lopes.md §7.4), checked word by
    word on the image. The draft is confirmed throughout, including "Quintaõ", "se se achar",
    "alienada" (read here without doubt), "Joze Lopes", "escriptura dotal" and "seu filho João".
    Three readings differ: (1) "do concelho de Barcello" (draft "Barcellos"); (2)
    "Extrema-Uncçaõ" (draft "Extrema-Uncaõ"); (3) "fez disposiçaõ do [bem, uncertain] d'alma"
    (draft "dos bens d'alma"). On the image the article is "do" and the noun has the form of
    "bem", singular; the sense is the same.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação (joaquina-rosa-lopes.md §7.4),
    conferido palavra por palavra na imagem. O rascunho foi confirmado em tudo, incluindo
    "Quintaõ", "se se achar", "alienada" (lida aqui sem dúvida), "Joze Lopes", "escriptura dotal"
    e "seu filho João". Três leituras diferem: (1) "do concelho de Barcello" (rascunho
    "Barcellos"); (2) "Extrema-Uncçaõ" (rascunho "Extrema-Uncaõ"); (3) "fez disposiçaõ do [bem,
    incerto] d'alma" (rascunho "dos bens d'alma"). Na imagem o artigo é "do" e o substantivo tem
    a forma de "bem", no singular; o sentido é o mesmo.
- text: >-
    Identification with Joaquina Rosa Lopes (P-0142). The name "Joaquina Roza Lopes", the
    husband Bento Fernandes, the lugar de Quintão in Ucha, the birthplace Pousa and the mother
    Marianna da Silva all match: her children's baptisms name "Joaquina Roza" (or "Joaquina
    Lopes") of Quintã, daughter of Ignacio … Lopes and Marianna … da Silva of Pousa (PAR-0106);
    her son Bento's 1866 marriage calls her "natural da freguezia da Pouza" (per the retrieval
    side); and her 1885 procuração gives her as "viuva que ficou de Bento José Fernandes",
    living at Quintã (per the retrieval side). Only the father's forename differs.
  text_pt: >-
    Identificação com Joaquina Rosa Lopes (P-0142). O nome "Joaquina Roza Lopes", o marido Bento
    Fernandes, o lugar de Quintão na Ucha, a naturalidade Pousa e a mãe Marianna da Silva
    coincidem: os batismos dos filhos nomeiam "Joaquina Roza" (ou "Joaquina Lopes"), de Quintã,
    filha de Ignacio … Lopes e de Marianna … da Silva, da Pousa (PAR-0106); o casamento do filho
    Bento em 1866 a diz "natural da freguezia da Pouza" (segundo a pesquisa de recuperação); e a
    procuração de 1885 a dá como "viuva que ficou de Bento José Fernandes", moradora em Quintã
    (segundo a pesquisa de recuperação). Só o prenome do pai difere.
- text: >-
    What the record adds. Her death (25 May 1890, five in the morning, at Quintão), her burial
    in the parish's public cemetery, her age (eighty, so born about 1810), her occupation
    (lavradeira), her widowhood, her birthplace (Pousa), her parents' names and their occupation
    and birthplace (lavradores, natives of Pousa), and a son João who received a dowry deed from
    her and was charged with the provision for her soul. She had become "alienada" before her
    death. The entry does not say whether this João is Manoel João (P-0139), then in Brazil, or
    another son; the retrieval side reads him as another son, but the entry does not settle it.
  text_pt: >-
    O que o registro acrescenta. O óbito (25 de maio de 1890, cinco da manhã, em Quintão), a
    sepultura no cemitério público da freguesia, a idade (oitenta anos, portanto nascida por volta
    de 1810), a profissão (lavradeira), a viuvez, a naturalidade (Pousa), os nomes dos pais e a
    profissão e naturalidade deles (lavradores, naturais da Pousa), e um filho João que recebeu
    dela uma escritura dotal e ficou encarregado do bem da sua alma. Ela estava "alienada" antes
    de morrer. O assento não diz se este João é Manoel João (P-0139), então no Brasil, ou outro
    filho; a pesquisa de recuperação o lê como outro filho, mas o assento não o resolve.
- text: >-
    Lead on the same opening. The entry that ends at the top of the left page (its beginning, with
    the deceased's and the father's names, is on the previous image, not held) names the mother
    as "Thereza de Jezus Fernandes, natural desta freguezia", the father being "natural da
    freguezia da Lama", both jornaleiros. Manoel João had a sister Thereza de Jezus, baptised at
    Ucha in 1841 and married at Ucha in 1869 to a José Ferreira (per the retrieval side). This
    Thereza could be she, but nothing on this image says so. The previous image (DGS 005252910,
    image 15) would show the whole entry.
  text_pt: >-
    Pista na mesma abertura. O assento que termina no alto da página esquerda (o início, com os
    nomes do falecido e do pai, está na imagem anterior, que não temos) nomeia a mãe como "Thereza
    de Jezus Fernandes, natural desta freguezia", sendo o pai "natural da freguezia da Lama", ambos
    jornaleiros. Manoel João tinha uma irmã Thereza de Jezus, batizada na Ucha em 1841 e casada na
    Ucha em 1869 com um José Ferreira (segundo a pesquisa de recuperação). Esta Thereza pode ser
    ela, mas nada nesta imagem o diz. A imagem anterior (DGS 005252910, imagem 15) mostraria o
    assento inteiro.
