transcription: |-
  [Whole opening — São Romão da Ucha deaths of 1890, DGS 005252910 image 16: the left page holds the end of an entry whose beginning is on the previous image, then Nºs 7, 8 and the beginning of 9; the right page (fl. 14) holds the end of Nº 9, the target Nº 10, Nº 11 and the beginning of Nº 12. Every entry is written and signed by the Abbade Joaquim Antonio de Miranda. Read from the native image (6653×4845) in strips at 0.5–2× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals, accents and abbreviations are kept as written.]

  [left page, top — the end of an entry whose beginning is on the previous image. Transcribed, because it names a Thereza de Jezus Fernandes of this parish:]
  natural da freguezia da Lama, deste concelho e de Thereza de
  Jezus Fernandes, natural desta freguezia, jornaleiros, a qual foi
  sepultado no cemiterio publico desta freguezia. E para constar
  lavrei em duplicado este assento, que assigno. Era ut supra.
                    O Abb.e Joaquim Antonio de Miranda
  [The name of the deceased and of the father are on the previous image, which is not held.]

  [left page, Nº 7 — Manoel, aged three, of the lugar de Macedo, legitimate son of Manoel Joaquim d'Oliveira, natural of the freguezia d'Oliveira, and Thereza de Macedo, natural of this parish, oleiros; died 20 March 1890. Not this family.]

  [left page, Nº 8 — Eugenio, aged one, of the lugar de Macedo, son of the same Manoel Joaquim d'Oliveira and Thereza de Macedo; died 26 March 1890. Not this family.]

  [left page and fl. 14, Nº 9 — Manoel Serafim, aged eighteen, jornaleiro, solteiro, of the lugar da Paranheira [uncertain], natural son of Maria Serafim, solteira, jornaleira; died 19 May 1890. Not this family.]

  [p1 — evidence/parish/PAR-0111-death-joaquina-rosa-lopes-1890-ucha.jpg; fl. 14, entry Nº 10 — TARGET]
  [Margin:] N.º 10 / Joaquina / Roza Lopes [underlined] / Dia, 25 / Mez, Maio / Anno, 1890
  Aos vinte e cinco dias, do mez de Maio, do anno de mil oito centos
  e noventa, ás cinco horas da manhã, no lugar de Quintaõ, desta
  freguezia de Sam Romaõ da Ucha, do concelho de Barcello, e diocese de
  Braga, falleceu tendo recebido o sacramento da Extrema-Uncçaõ, só por
  se se achar alienada, um individuo do sexo feminino, por nome Joa-
  quina Roza Lopes, de idade de oitenta annos, lavradeira, viuva de Ben-
  to Fernandes, natural da freguezia da Pouza, deste concelho, mora-
  dora no dito lugar de Quintaõ, filha legitima de Joze Lopes e de
  Marianna da Silva, lavradores, naturaes da freguezia da Pouza, deste con-
  celho, a qual fez disposiçaõ do [uncertain: bem] d'alma em escriptura dotal a
  seu filho Joaõ, deixou filhos e foi sepultada no cemiterio publico
  desta freguezia. E para constar lavrei em duplicado este assen-
  to, que assigno. Era ut supra.
                    O Abb.e Joaquim Antonio de Miranda [signature with flourish]
  [Expansions and readings: Quintaõ = Quintão; Romaõ = Romão; Barcello = Barcellos; "se se achar" — "se" is written twice; alienada = not of sound mind; Pouza = Pousa; "fez disposiçaõ do bem d'alma em escriptura dotal a seu filho Joaõ" = she had made provision for the good of her soul (the funeral and suffrages) in a dowry deed in favour of her son João; Abb.e = Abbade.]

  [fl. 14, Nº 11 — Maria Alvina, aged three days, of the lugar d'Atraiora [uncertain], legitimate daughter of Antonio Fernandes, natural of the freguezia d'Oliveira, pedreiro, and Maria Joaquina da Silva, natural of Cervães, concelho de Villa Verde, jornaleira; died 28 May 1890. Not this family as far as the entry states.]

  [fl. 14, Nº 12 — Olivia [uncertain], died 1 June 1890 at the lugar do Sobreiro; only the first two lines are on this image. Not this family.]
reading_reliability: complete
abstract: >-
  Original death entry Nº 10 of 1890 in the São Romão da Ucha (Barcelos) death register, on fl.
  14. Joaquina Roza Lopes died at five in the morning on 25 May 1890 at the lugar de Quintão in
  Ucha, having received only Extreme Unction "só por se se achar alienada" (because she was not
  of sound mind). She was eighty, a lavradeira, the widow of Bento Fernandes, native of the
  parish of Pousa, living at Quintão. She was the legitimate daughter of Joze Lopes and Marianna
  da Silva, lavradores, natives of Pousa. She had made provision for her soul in a dowry deed
  ("escriptura dotal") to her son João, and she left children. She was buried in the parish's
  public cemetery. The Abbade Joaquim Antonio de Miranda wrote and signed the entry. This is the
  death of Joaquina Rosa Lopes (P-0142), widow of Bento José Fernandes (P-0141).
abstract_pt: >-
  Assento original de óbito Nº 10 de 1890 do registro de óbitos de São Romão da Ucha (Barcelos),
  na fl. 14. Joaquina Roza Lopes faleceu às cinco horas da manhã de 25 de maio de 1890 no lugar de
  Quintão, na Ucha, tendo recebido só a Extrema-Unção, "só por se se achar alienada" (por não
  estar em seu juízo). Tinha oitenta anos, era lavradeira, viúva de Bento Fernandes, natural da
  freguesia da Pousa e moradora em Quintão. Era filha legítima de Joze Lopes e de Marianna da
  Silva, lavradores, naturais da Pousa. Tinha disposto do bem da sua alma em escritura dotal a seu
  filho João, e deixou filhos. Foi sepultada no cemitério público da freguesia. O Abade Joaquim
  Antonio de Miranda escreveu e assinou o assento. É o óbito de Joaquina Rosa Lopes (P-0142),
  viúva de Bento José Fernandes (P-0141).
reliability:
  assessment: >-
    Original and direct, written by the parish priest at the time. It is primary for the death,
    its date, hour and place, the sacrament and the burial. Her age, birthplace, parents and
    their birthplace and occupation are secondary statements from an unnamed informant, given
    sixty years or more after her birth; hence mixed. Every core fact is legible: the date, the
    place, her name, her husband and both parents. The one uncertain word, "bem" in "do bem
    d'alma", is peripheral.
  informant: >-
    The Abbade of São Romão da Ucha, Joaquim Antonio de Miranda, who wrote and signed the entry;
    the person who supplied her age and parentage is not named.
  limitations: >-
    Her father is "Joze Lopes" here, whereas her children's baptisms of 1829–1843 call him
    "Ignacio Lopes", "Ignacio Francisco Lopes" and "Ignacio José Lopes" (PAR-0106; the others per
    the retrieval side). The contemporary baptisms are closer to the source and should be
    preferred; this entry's form is kept as a variant. The age of eighty is a round figure and
    gives only an approximate birth about 1810. Her husband is "Bento Fernandes", without
    "José".
