notes:
- text: >-
    Identification. The parents are identified with P-0139 and P-0140 on the same grounds as in
    the 1855 baptism (PAR-0124): "Manoel João" and "Anna Maria", of the lugar do Souto in Pousa,
    with paternal grandparents Bento José Fernandes and Joaquinna Roza of Ucha and unknown
    maternal grandparents. The retrieval side identifies this Maria de Jesus with the daughter of
    the same name who was an heir of Manoel João in Brazil in 1898; that rests on the name and is
    not stated here. The identification of the parents is strong, not proven.
  text_pt: >-
    Identificação. Os pais são identificados com P-0139 e P-0140 pelos mesmos motivos do batismo
    de 1855 (PAR-0124): "Manoel João" e "Anna Maria", do lugar do Souto, em Pousa, com avós
    paternos Bento José Fernandes e Joaquinna Roza, da Ucha, e avós maternos desconhecidos. A
    pesquisa de recuperação identifica esta Maria de Jesus com a filha do mesmo nome que foi
    herdeira de Manoel João no Brasil em 1898; isso se apoia no nome e não está declarado aqui. A
    identificação dos pais é forte, não provada.
- text: >-
    What the record adds. The couple were still of the lugar do Souto, Pousa, in April 1858. The
    mother is again "Anna Maria" (not "Joanna", not "Exposta"). The paternal grandmother is again
    "Joaquinna Roza". The godparents, Antonio José Ferreira and Maria Thereza Ribeiro of the lugar
    da Deveza, are not stated to be kin. The coadjutor Padre José Lopes shares a name with the
    "Joze Lopes" given as Joaquina's father in her 1890 death entry; nothing in this record ties
    him to the family. Maria de Jesus can be recorded as a documented child of F-0070.
  text_pt: >-
    O que o registro acrescenta. O casal ainda era do lugar do Souto, em Pousa, em abril de 1858. A
    mãe é de novo "Anna Maria" (nem "Joanna", nem "Exposta"). A avó paterna é de novo "Joaquinna
    Roza". Os padrinhos, Antonio José Ferreira e Maria Thereza Ribeiro, do lugar da Deveza, não são
    ditos parentes. O coadjutor, Padre José Lopes, tem o mesmo nome do "Joze Lopes" dado como pai
    de Joaquina no assento de óbito dela de 1890; nada neste registro o liga à família. Maria de
    Jesus pode ser registrada como filha documentada da F-0070.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.3, entry 2).
    The wording is confirmed, with these readings: "nepta pa- / terna" (draft "neta pa- /
    terna"); "Fernandes e Joaquinna" without a comma; and a second signature that the draft
    omits, "O Cura o P.e José Lopes", below the Abbade's. The abbreviation after "f.ª" stays
    doubtful, as in the draft ("[l.ma?]"). The draft's dates (born 10 April, baptised 12 April
    1858) are confirmed.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.3, assento 2). O texto foi confirmado, com estas
    leituras: "nepta pa- / terna" (rascunho "neta pa- / terna"); "Fernandes e Joaquinna", sem
    vírgula; e uma segunda assinatura que o rascunho omite, "O Cura o P.e José Lopes", abaixo da do
    Abade. A abreviatura depois de "f.ª" continua duvidosa, como no rascunho ("[l.ma?]"). As datas
    do rascunho (nascida em 10 de abril, batizada em 12 de abril de 1858) estão confirmadas.
