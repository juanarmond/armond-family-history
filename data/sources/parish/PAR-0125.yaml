reading_reliability: complete
abstract: >-
  Original baptism entry, the first on the left page of an opening of the Pousa (Barcelos)
  baptism book. Maria de Jesus, daughter of Manoel João and Anna Maria, of the lugar do Souto in
  Pousa, was born on 10 April 1858 and was solemnly baptised on 12 April 1858 by the Padre José
  Lopes, coadjutor; the margin records that the Abbade Antonio Martins Villaça applied the holy
  oils. The paternal grandparents are named as Bento José Fernandes and Joaquinna Roza, of the
  parish of Sam Romão da Ucha; the maternal grandparents are "Avós incognitos". The godparents
  were Antonio José Ferreira and Maria Thereza Ribeiro, of the lugar da Deveza in Pousa. The entry
  is signed by the Abbade and by "O Cura o P.e José Lopes". The parents are Manoel João Fernandes
  da Cruz (P-0139) and Anna Maria Fernandes (P-0140); Maria de Jesus is a collateral child of
  their family F-0070.
abstract_pt: >-
  Assento original de batismo, o primeiro da página da esquerda de uma abertura do livro de
  batismos de Pousa (Barcelos). Maria de Jesus, filha de Manoel João e de Anna Maria, do lugar do
  Souto, em Pousa, nasceu em 10 de abril de 1858 e foi batizada solenemente em 12 de abril de 1858
  pelo Padre José Lopes, coadjutor; a margem registra que o Abade Antonio Martins Villaça lhe pôs
  os santos óleos. Os avós paternos são nomeados como Bento José Fernandes e Joaquinna Roza, da
  freguesia de Sam Romão da Ucha; os avós maternos são "Avós incognitos". Foram padrinhos Antonio
  José Ferreira e Maria Thereza Ribeiro, do lugar da Deveza, em Pousa. O assento é assinado pelo
  Abade e por "O Cura o P.e José Lopes". Os pais são Manoel João Fernandes da Cruz (P-0139) e
  Anna Maria Fernandes (P-0140); Maria de Jesus é uma filha colateral da família F-0070.
reliability:
  assessment: >-
    Original and direct. It is primary for the baptism, its date and place, the child, the
    parents as named, the godparents and the officiants: the coadjutor baptised, the Abbade
    applied the oils, and both signed. The birth date and the grandparents were declared to them
    and are secondary information. Every core fact is legible: the child, both parents, their
    lugar, the birth and baptism dates and the paternal grandparents. The only uncertain mark is
    on the abbreviation after "f.ª".
  informant: >-
    The Abbade of Pousa, Antonio Martins Villaça, who wrote the entry and applied the oils, and
    the coadjutor, Padre José Lopes, who baptised; both signed. The facts of birth and kinship
    were presumably declared by the family or the godparents.
  limitations: >-
    The father is written "Manoel João" without a surname, and the mother "Anna Maria" without a
    surname or any statement that she was a foundling. The grandparents have no lugar beyond the
    parish of Ucha. No folio number is visible on the image.
