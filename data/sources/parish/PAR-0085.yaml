transcription: >-
  [Livro de Óbitos, N.S. Mãe de Deos, Povoação (São Miguel), fl.528, 1854.
  Margem: "Claudina".] "Em os vinte quatro de Setembro de mil oito centos
  cincoenta e quatro nesta Parochial de Nossa Senhora Mãe de Deos da Villa da
  Povoação faleceo de idade de quatro mezes Claudina filha de Manoel Muniz de
  Bitancourt e de Francisca Roza freguezes desta Parochial, seu corpo foi
  encommendado em caza e acompanhado até ao cemiterio. E por mim Bernardo
  Antonio Pacheco de Rezende cura della do que lancei este termo em o dia mez e
  anno ut supra. O Cura Bernardo Antonio Pacheco de Rezende."
abstract: >-
  Parish death/burial entry of the infant Claudina, aged four months (born ~May
  1854), who died 24 September 1854 at N.S. Mãe de Deus (Povoação, São Miguel,
  Azores), daughter of Manoel Muniz de Bitancourt (P-0042) and Francisca Roza
  (P-0047) — hence an infant sister of the emigrant João Muniz Bittencourt
  (P-0019). Recorded as a documented child on family F-0020. She is a distinct
  person from the couple's later daughter Claudina (b. ~1856) who married in
  1872 (PAR-0084) — the given name was reused after the infant's death. PROVEN.
  Not modelled as a person entity; no event created.
abstract_pt: >-
  Assento de óbito/sepultamento da menina Claudina, de quatro meses (nascida
  ~maio de 1854), falecida em 24 de setembro de 1854 em N.S. Mãe de Deus
  (Povoação, São Miguel, Açores), filha de Manoel Muniz de Bitancourt (P-0042) e
  Francisca Roza (P-0047) — portanto irmã bebê do emigrante João Muniz
  Bittencourt (P-0019). Registrada como filha documentada na família F-0020. É
  pessoa distinta da filha posterior do casal, Claudina (n. ~1856), que se casou
  em 1872 (PAR-0084) — o nome foi reutilizado após a morte da bebê. PROVADO. Não
  modelada como entidade pessoa; sem evento criado.
