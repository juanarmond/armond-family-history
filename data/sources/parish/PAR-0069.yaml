  [Livro de Baptismos, Nova Friburgo, fl.142, 1842.] "Aos vinte de Fevereiro de mil oitocentos
  quarenta e dois baptisei e puz os S[antos] Olios a D[ona] Maria Joanna, nascida a dois de Maio do
