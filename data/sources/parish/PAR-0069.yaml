abstract: >-
  Parish baptism of Maria Joanna Rutschmann (P-0037) — Iris Bohrer Muniz's 3×-great-grandmother on
  the Silva Ferreira / Rutschmann line — born 2 May 1841 and baptised 20 February 1842 at the
  Matriz de São João Baptista, Nova Friburgo. NAMES HER PARENTS: João José Rocheman (Rutschmann,
  P-0109) and Elisabeth (Isabel) Storck (P-0110). Source for the birth event E-0093 and the parent
  family F-0054 (new). Godparents João Balineat and Maria Fabre.
abstract_pt: >-
  Batismo paroquial de Maria Joanna Rutschmann (P-0037) — trisavó de Iris Bohrer Muniz na linha
  Silva Ferreira / Rutschmann — nascida em 2 de maio de 1841 e baptizada em 20 de fevereiro de
  1842, na Matriz de São João Baptista, Nova Friburgo. NOMEIA SEUS PAIS: João José Rocheman
  (Rutschmann, P-0109) e Elisabeth (Isabel) Storck (P-0110). Fonte do evento de nascimento E-0093 e
  da família de pais F-0054 (nova). Padrinhos João Balineat e Maria Fabre.
