  4 de Outubro deste anno de mil novecentos e doze encommendei a José, fallecido
  hontem, 3 deste mez, filho [legítimo] de José do Rego Brandão e de Maria de
  Mendonça, viuvo de Rita do Rego Brandão, brasileiro, cath[olico], sem sacramentos,
