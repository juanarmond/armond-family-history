abstract: >-
  The original 1912 death register entry (Santa Luzia de Carangola, MG) of José do
  Rego Brandão (P-0040): died 3 October 1912, aged 79 (so born c.1833), a Brazilian
  Catholic, already a widower of Rita do Rego Brandão (P-0041). It names his parents
  José do Rego Brandão [Sr] (P-0043) and Maria de Mendonça (P-0044), extending the
  Brandão line up a generation.
abstract_pt: >-
  O assento original de óbito de 1912 (Santa Luzia de Carangola, MG) de José do
  Rego Brandão (P-0040): falecido em 3 de outubro de 1912, aos 79 anos (portanto
  nascido por volta de 1833), católico brasileiro, já viúvo de Rita do Rego
  Brandão (P-0041). Nomeia seus pais José do Rego Brandão [Sr] (P-0043) e Maria
  de Mendonça (P-0044), estendendo a linhagem Brandão uma geração acima.
reliability:
  assessment: >-
    Direct primary parish evidence for José do Rego Brandão's death, approximate birth
    year, widower status and his own parentage.
  informant: The vigário Antonio Affonso [Laurson] of Santa Luzia de Carangola (1912).
  limitations: >-
    Handwritten register; the vigário's surname is an uncertain read. "Viuvo de Rita
    do Rego Brandão" corroborates that his wife (P-0041) predeceased him.
