transcription: >-
  [Casamento — Livro SMG-PV-MAEDEDEUS-C-1801-1822, N.S. Mãe de Deus, Povoação;
  folio 161v (viewer p163). Read from the register image 2026-08-11. Margin:
  "João Muniz | M.a Jacinta".]

  "Aos sette de Setembro digo aos sette de Outubro de mil oito centos e dezanove
  annos, de manhã, nesta Parochial Igreja de Nossa Senhora Mãe de Deus do Lugar da
  Povoação, precedidas as denunciações do estilo, sem impedimento, como consta do
  Mandado do Reverendo Ouvidor deste Districto Manoel Joaquim Machado, perante mim
  José Duarte de Medeiros, Vigario proprio desta dita Igreja, em presença das
  testemunhas abaixo assignadas João Rodrigues Alves [Carneiro] e Antonio de
  Medeiros Brandão e de muitas mais pessoas que presentes estavão, se ligarão o
  sacramento do Matrimonio em face da Igreja por palavras de presente na forma do
  Sagrado Concilio Tridentino, João Francisco Muniz Bitancourt, filho de Manoel
  Muniz Bitancourt e de Tereza do Amaral já defunta, e Maria Jacintha de Medeiros,
  filha de João de Medeiros Brandão e de Maria Eugenia, ambos naturaes e freguezes
  desta dita Igreja aonde forão baptizados ... e logo receberão as bençãos.
  [Assinado] O Vigario José Duarte de Medeiros. João Rodrigues Alves Carneiro. De
  Antonio de Medeiros Brandão."
abstract: >-
  Marriage on 7 October 1819 (the scribe first wrote "Setembro", then corrected
  to "Outubro") at Nossa Senhora Mãe de Deus, Povoação, São Miguel, of João
  Francisco Muniz Bitancourt (P-0048) and Maria Jacintha de Medeiros (P-0049) —
  the grandparents of the emigrant João Muniz Bittencourt (P-0019). The act names
  the groom as son of Manoel Muniz Bitancourt (P-0082) and Tereza do Amaral
  (P-0083, already deceased), family F-0040, and the bride as daughter of João de
  Medeiros Brandão (P-0084) and Maria Eugenia (P-0085), family F-0041 — extending
  the Muniz Bittencourt line one further Azorean generation. Officiant Vigário
  José Duarte de Medeiros; witnesses João Rodrigues Alves Carneiro and Antonio de
  Medeiros Brandão.
abstract_pt: >-
  Casamento em 7 de outubro de 1819 (o escrivão escreveu primeiro "Setembro" e
  corrigiu para "Outubro"), em Nossa Senhora Mãe de Deus, Povoação, São Miguel, de
  João Francisco Muniz Bitancourt (P-0048) e Maria Jacintha de Medeiros (P-0049) —
  os avós do emigrante João Muniz Bittencourt (P-0019). O ato nomeia o noivo como
  filho de Manoel Muniz Bitancourt (P-0082) e Tereza do Amaral (P-0083, já
  falecida), família F-0040, e a noiva como filha de João de Medeiros Brandão
  (P-0084) e Maria Eugenia (P-0085), família F-0041 — estendendo a linha Muniz
  Bittencourt mais uma geração açoriana. Celebrante o Vigário José Duarte de
  Medeiros; testemunhas João Rodrigues Alves Carneiro e Antonio de Medeiros
  Brandão.
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the marriage
    date, the couple's identity and both parent couples, all legible on the image.
    It gives João Francisco Muniz Bitancourt's fuller forename ("João Francisco")
    and independently supports the F-0023 couple recorded in the 1842 (PAR-0024)
    and 1866 (PAR-0015) acts.
  informant: >-
    The Vigário José Duarte de Medeiros of N.S. Mãe de Deus, Povoação, recording
    the marriage as an officer of the church.
  limitations: >-
    The date carries the scribe's own correction (September → October); the year
    "dezanove" (1819) and the parent couples are clear. The facing page (folio
    162r) is an unrelated marriage of another couple.
