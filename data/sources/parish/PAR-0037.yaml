notes:
  - text: >-
      Catalogued 11 August 2026 from the Culturacores CDN image, reconciled with
      BPARPD Ponta Delgada reply SE/2026/1583e. This is the marriage that anchors
      family F-0023 (previously attested only indirectly, via the "filho legitimo"
      statement in Manoel's 1866 death PAR-0015) and adds the two parent couples
      F-0040 and F-0041. Tereza do Amaral is recorded "já defunta" (already
      deceased) in 1819.
