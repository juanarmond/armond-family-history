notes:
- text: >-
    Comparison with the producer's draft (§8.4): the image confirms the draft's "dez annos, e
    dous mezes" and "Alfaate". Differences: the eighth line begins "do Egreja Parochial"
    (draft "da Egreja"); the burial day under the ink blot is read only as [uncertain: nove]
    (draft "no[ve?]"); the line break is "Barce- / llos" (draft "Barcel- / los"); "da ucha" is
    written with a small u; there is no comma after "Diocese de Braga". The draft did not
    mention the archpriest's visitation note of 26 February 1866 on the facing page.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): a imagem confirma o "dez annos, e dous mezes"
    e o "Alfaate" do rascunho. Diferenças: a oitava linha começa "do Egreja Parochial"
    (rascunho "da Egreja"); o dia do sepultamento sob a mancha de tinta só se lê como
    [incerto: nove] (rascunho "no[ve?]"); a quebra de linha é "Barce- / llos" (rascunho
    "Barcel- / los"); "da ucha" está escrito com u minúsculo; não há vírgula depois de "Diocese
    de Braga". O rascunho não mencionou o visto do arcipreste de 26 de fevereiro de 1866 na
    página em frente.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and naturalidade, and the mother's description as a foundling. The age of ten years
    and two months on 7 March 1866 fits the João born 22 December 1855 (PAR-0124: ten years,
    two months and about two weeks). The 1868 baptism of a second João calls him "segundo do
    nome" (PAR-0131), consistent with this death. The identification is strong, not proven.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a
    naturalidade do pai e a descrição da mãe como exposta. A idade de dez anos e dois meses em
    7 de março de 1866 confere com o João nascido em 22 de dezembro de 1855 (PAR-0124: dez anos,
    dois meses e cerca de duas semanas). O batismo de um segundo João em 1868 chama-o "segundo
    do nome" (PAR-0131), coerente com este óbito. A identificação é forte, não provada.
- text: >-
    What it adds: the death of the eldest child, João (b. 1855), at ten; the father's trade,
    tailor ("Alfaate"), in 1866; the family's residence at the logar do Souto. It names no
    grandparent. As a collateral record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: o óbito do filho mais velho, João (n. 1855), aos dez anos; o ofício do
    pai, alfaiate ("Alfaate"), em 1866; a residência da família no lugar do Souto. Não nomeia
    avós. Como registro colateral, não se liga a nenhum evento; linked_events fica vazio de
    propósito.
