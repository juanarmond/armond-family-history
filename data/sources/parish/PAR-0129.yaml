reading_reliability: complete
abstract: >-
  Original death entry Nº 3 of 1866 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. At five in the afternoon of 7 March 1866, at the logar do Souto, died João, aged
  ten years and two months, born in Pousa, legitimate son of Manoel João Fernandes, tailor
  ("Alfaate"), natural of the parish of São Romão da Ucha (Barcelos), and of Anna Exposta (a
  foundling), resident in Pousa at the logar do Souto. He was buried inside the parish church,
  for want of a cemetery, at nine in the morning, very probably on the 9th (an ink blot covers
  the day). The assistant priest José Lopes wrote and signed the entry. The parents are Manoel
  João Fernandes (P-0139) and Anna Maria, "Anna Exposta" (P-0140); the child is very probably
  the João born 22 December 1855 and baptised at Pousa on 24 December 1855 (PAR-0124), whose
  age this entry matches.
abstract_pt: >-
  Assento original de óbito nº 3 de 1866 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. Às cinco da tarde de 7 de março de 1866, no lugar do Souto, faleceu João, de dez
  anos e dois meses, natural de Pousa, filho legítimo de Manoel João Fernandes, alfaiate
  ("Alfaate"), natural da freguesia de São Romão da Ucha (Barcelos), e de Anna Exposta (uma
  enjeitada), residentes em Pousa no lugar do Souto. Foi sepultado dentro da igreja paroquial,
  por falta de cemitério, às nove da manhã, muito provavelmente do dia 9 (uma mancha de tinta
  cobre o dia). O coadjutor José Lopes redigiu e assinou o assento. Os pais são Manoel João
  Fernandes (P-0139) e Anna Maria, "Anna Exposta" (P-0140); a criança é muito provavelmente o
  João nascido em 22 de dezembro de 1855 e batizado em Pousa em 24 de dezembro de 1855
  (PAR-0124), cuja idade este assento confere.
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating priest. It is primary for the
    death, its date, hour and place, the burial and the parents as named, and secondary for
    the child's age, the father's trade and his naturalidade, which came from an unnamed
    informant; hence mixed. Every core fact is legible (the subject, the date, the place and
    both parents), so reading_reliability is complete; the uncertain marks fall only on the
    burial day under an ink blot and on the page rubric.
  informant: >-
    Not named. The entry was written and signed by the assistant priest (Coadjutor) José
    Lopes.
  limitations: >-
    An ink blot hides most of the burial day. The entry gives no grandparents and does not cite
    the baptism. Tying this João to the one born in December 1855 (PAR-0124) rests on the same
    name, the same parents and lugar, and the age; it is strong, not proven.
