transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ; livro de batismos, fl. 314. The act
  spans the page break: its opening date line sits at the foot of folio 314 (…-p1.jpg)
  and the body naming the child and parents is at the head of the following image
  (…-p2.jpg, the primary scan).]

  [Page 1 (…-p1.jpg) — foot of folio 314, opening date line of the entry (right margin
  frayed; the entry continues on the next image):] "Aos vinte cinco de Junho de mil
  oitocentos noventa e dois …"

  [Page 2 (…-p2.jpg) — head of the following image, the continuation naming the child
  and parents:] "… baptizei o innocente Deocleciano [register hand appears to read
  "Diocleciano"] nascido a [uncertain: um] d'este mez, filho legítimo de João Muniz
  Bitencourt e Suzana Rita Brandão. Foi padrinho João de Souza Freitas e [uncertain:
  Lina] Rita Brandão, de que fiz este termo que assigno. P.e Franc.co Ant.o Pinto P.ra
  da Veiga[s]."
abstract: >-
  The original 1892 baptism register entry (Igreja de Santo Antônio de Sapucaia,
  RJ) of Deocleciano Muniz Bittencourt (P-0012): baptized 25 June 1892, born
  about June 1892, a legitimate son of João Muniz Bittencourt (P-0019) and
  Susanna (Suzana) Rita Brandão (P-0020). His earliest vital record; it settles
  the father's given name as "João" (the 1882 provisão's "José" was an error) and
  upgrades his parentage to confirmed. Godparents João de Souza Freitas and
  Lina Rita Brandão (corrected from an earlier "Anna" misreading; the image reads "Lina").
abstract_pt: >-
  O assento original de batismo de 1892 (Igreja de Santo Antônio de Sapucaia, RJ)
  de Deocleciano Muniz Bittencourt (P-0012): batizado em 25 de junho de 1892,
  nascido por volta de junho de 1892, filho legítimo de João Muniz Bittencourt
  (P-0019) e Susanna (Suzana) Rita Brandão (P-0020). É o seu registro vital mais
  antigo; fixa o prenome do pai como "João" (o "José" da provisão de 1882 foi um
  erro) e eleva sua filiação a confirmada. Padrinhos João de Souza Freitas e
  Lina Rita Brandão (corrected from an earlier "Anna" misreading; the image reads "Lina").
reliability:
  assessment: >-
    Direct primary parish evidence for Deocleciano's baptism, approximate birth
    and parentage — the original register act.
  informant: The baptising priest, Pe. Francisco Antônio Pinto Pereira da Veiga (1892).
  limitations: >-
    Handwritten register; the birth day ("a [um] deste mez") and one godparent's
    given name are uncertain reads. The act spans two page images: the 25 June
    1892 date line at the foot of folio 314 (…-p1.jpg) and the subject's name and
    parents on the next image (…-p2.jpg, the primary scan).
