transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ; livro de batismos, fl. 314.] "[Aos
  vinte e cinco de Junho de mil oitocentos noventa e dois] baptizei o innocente
  Deocleciano nascido a [uncertain: um] deste mez, filho legítimo de João Muniz
  Bitencourt e Suzana Rita Brandão. Foi padrinho João de Souza Freitas e
  [uncertain: Anna] Rita Brandão, de que fiz este termo que assigno. P.e
  Franc.co Ant.o Pinto P.ra da Veiga[s]."
abstract: >-
  The original 1892 baptism register entry (Igreja de Santo Antônio de Sapucaia,
  RJ) of Deocleciano Muniz Bittencourt (P-0012): baptized 25 June 1892, born
  about June 1892, a legitimate son of João Muniz Bittencourt (P-0019) and
  Susanna (Suzana) Rita Brandão (P-0020). His earliest vital record; it settles
  the father's given name as "João" (the 1882 provisão's "José" was an error) and
  upgrades his parentage to confirmed. Godparents João de Souza Freitas and
  [Anna] Rita Brandão.
reliability:
  assessment: >-
    Direct primary parish evidence for Deocleciano's baptism, approximate birth
    and parentage — the original register act.
  informant: The baptising priest, Pe. Francisco Antônio Pinto Pereira da Veiga (1892).
  limitations: >-
    Handwritten register; the birth day ("a [um] deste mez") and one godparent's
    given name are uncertain reads. The act spans two page images: the 25 June
    1892 date line at the foot of folio 314 (…-p1.jpg) and the subject's name and
    parents on the next image (…-p2.jpg, the primary scan).
