notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T2): the godfather's father is
    "do lugar do [Ofreiral] do Salvador da Lama" — the image has "do Salvador", not "de
    Salvador"; the lugar itself looks like "Ofeiral" or "Ofreiral" and stays uncertain. The
    letters before "sento" in the closing formula are under an ink blot; "este as" is the
    expected text and is marked uncertain, as in the draft. Everything else was confirmed word
    by word.
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T2): o pai do padrinho é
    "do lugar do [Ofreiral] do Salvador da Lama" — a imagem tem "do Salvador", não "de
    Salvador"; o próprio lugar parece "Ofeiral" ou "Ofreiral" e continua incerto. As letras
    antes de "sento" na fórmula final estão sob um borrão de tinta; "este as" é o texto
    esperado e fica marcado como incerto, como no rascunho. Tudo o mais foi conferido palavra
    por palavra.
- text: >-
    Identification. "Bento Fernandes, e … Joaquina Lopes" of Quintãa, Ucha, are identified
    with P-0141 × P-0142 by the matching names, lugar and parish and by the paternal
    grandparents Manoel Fernandes × Jozefa Maria, the same as in PAR-0113 and PAR-0115 to
    PAR-0120. The maternal grandparents, of Santa Christina da Pousa, match P-0145 × P-0146.
    The identification is strong, not proven.
  text_pt: >-
    Identificação. "Bento Fernandes, e … Joaquina Lopes", da Quintãa, Ucha, são
    identificados com P-0141 × P-0142 pelos nomes, lugar e freguesia coincidentes e pelos avós
    paternos Manoel Fernandes × Jozefa Maria, os mesmos do PAR-0113 e do PAR-0115 ao PAR-0120.
    Os avós maternos, de Santa Christina da Pousa, coincidem com P-0145 × P-0146. A
    identificação é forte, não provada.
- text: >-
    What the record adds. Of the seven children's baptisms PAR-0113 to PAR-0120, it is the
    only one that writes the paternal grandmother as "Jozefa Maria Domingues" — the surname that ties her to André Domingues of
    Salvador da Lama (P-0149), named as her father in the 1807 baptism of Bento — and the
    godfather is a "parente da Baptizada" from Salvador da Lama. It gives the mother as
    "Joaquina Lopes" and the maternal grandparents as "Ignacio Francisco Lopes" and
    "Marianna Francisca da Silva", whose residence is "do lugar, e freguesia de Sancta
    Christina da Pouza". No grandparent is called deceased. The godmother Anna, solteira,
    daughter of Francisco Fernandes of Quintãa, is not identified with any modelled person.
  text_pt: >-
    O que o registro acrescenta. Dos sete batismos de filhos PAR-0113 a PAR-0120, é o único que
    escreve a avó paterna como
    "Jozefa Maria Domingues" — o sobrenome que a liga a André Domingues, do Salvador da Lama
    (P-0149), dado como pai dela no batismo de Bento de 1807 — e o padrinho é um "parente da
    Baptizada" do Salvador da Lama. Dá a mãe como "Joaquina Lopes" e os avós maternos como
    "Ignacio Francisco Lopes" e "Marianna Francisca da Silva", com residência "do lugar, e
    freguesia de Sancta Christina da Pouza". Nenhum avô é dado como falecido. A madrinha Anna,
    solteira, filha de Francisco Fernandes, da Quintãa, não é identificada com nenhuma pessoa
    modelada.
