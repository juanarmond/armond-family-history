reading_reliability: complete
abstract: >-
  Original baptism entry of Anna, the third entry on fl. 23 of the second baptism book of
  São Romão da Ucha (Barcelos). On 22 December 1830 the abbot Antonio José da Costa e Silva
  baptised "Anna, filha legitima de Bento Fernandes, e de Joaquina Lopes" of the lugar da
  Quintãa, born 15 December 1830. The paternal grandparents are "Manoel Fernandes, e … Jozefa
  Maria Domingues" of the same lugar; the maternal grandparents are "Ignacio Francisco Lopes,
  e … Marianna Francisca da Silva" of Santa Christina da Pousa. The godparents were João
  Domingues, "parente da Baptizada", son of João Domingues of Salvador da Lama, and Anna,
  solteira, daughter of Francisco Fernandes of Quintãa. It is the record that gives the
  paternal grandmother's surname, Domingues, and the mother's surname, Lopes. Anna is a
  collateral: a sister of Manoel João (P-0139), daughter of Bento José Fernandes (P-0141)
  and Joaquina Rosa Lopes (P-0142).
abstract_pt: >-
  Assento original de batismo de Anna, o terceiro do fl. 23 do segundo livro de batismos de
  São Romão da Ucha (Barcelos). Em 22 de dezembro de 1830 o abade Antonio José da Costa e
  Silva batizou "Anna, filha legitima de Bento Fernandes, e de Joaquina Lopes", do lugar da
  Quintãa, nascida em 15 de dezembro de 1830. Os avós paternos são "Manoel Fernandes, e …
  Jozefa Maria Domingues", do mesmo lugar; os maternos, "Ignacio Francisco Lopes, e …
  Marianna Francisca da Silva", de Santa Christina da Pousa. Foram padrinhos João Domingues,
  "parente da Baptizada", filho de João Domingues, do Salvador da Lama, e Anna, solteira,
  filha de Francisco Fernandes, da Quintãa. É o registro que dá o sobrenome da avó paterna,
  Domingues, e o da mãe, Lopes. Anna é colateral: irmã de Manoel João (P-0139), filha de
  Bento José Fernandes (P-0141) e de Joaquina Rosa Lopes (P-0142).
reliability:
  assessment: >-
    Original, written and signed by the officiating abbot at the time: primary and direct for
    the baptism, its date, the birth date, the child, the parents as named and the
    godparents; the grandparents' names are reported by the family and are secondary in
    principle. Every core fact is clearly legible — the dates, the child, both parents, all
    four grandparents and the lugar — so reading_reliability is complete. The [uncertain]
    marks fall only on the godfather's lugar in Lama and on letters under an ink blot in the
    closing formula.
  informant: >-
    The abbot of São Romão da Ucha, Antonio José da Costa e Silva, who officiated and signed;
    the grandparents' names were presumably supplied by the family.
  limitations: >-
    The forms "Ignacio Francisco Lopes" and "Marianna Francisca da Silva" are this entry's
    own; other baptisms of the same couple's children give "Ignacio Lopes", "Ignacio José
    Lopes" and "Marianna Luiza da Silva" / "Marianna da Silva". No grandparent is called
    deceased.
