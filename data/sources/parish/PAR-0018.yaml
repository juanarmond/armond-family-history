abstract: >-
  The c.1786 Barbacena marriage of Joaquim José Ferreira de Toledo (P-0057) and
  Ritta Angélica Rodrigues (P-0058). It names both couples of their parents: Joaquim
  José is son of Gaspar Ferreira and Gertrudes Maria [de Toledo] (of Vila Rica — the
  apparent origin of the "Ferreira"+"de Toledo" surname), and Ritta is daughter of
  João Rodrigues [do Valle] and Izabel Ribeira of the Freguesia da Borda do Campo.
  Joaquim José × Ritta are taken to be the parents of Ladisláo Egídio Ferreira de
  Toledo (P-0056) — Eliza's grandfather — on strong (not direct) evidence; see
  F-0028 for the identity reasoning.
abstract_pt: >-
  O casamento de c.1786 em Barbacena de Joaquim José Ferreira de Toledo (P-0057)
  e Ritta Angélica Rodrigues (P-0058). Nomeia os dois casais de seus pais:
  Joaquim José é filho de Gaspar Ferreira e Gertrudes Maria [de Toledo] (de Vila
  Rica — a aparente origem do sobrenome "Ferreira"+"de Toledo"), e Ritta é filha
  de João Rodrigues [do Valle] e Izabel Ribeira da Freguesia da Borda do Campo.
  Joaquim José × Ritta são tidos como os pais de Ladisláo Egídio Ferreira de
  Toledo (P-0056) — avô de Eliza — com base em evidência forte (não direta);
  ver F-0028 para o raciocínio de identidade.
reliability:
  assessment: >-
    Direct primary parish evidence for the marriage of Joaquim José Ferreira de
    Toledo and Ritta Angélica Rodrigues and for both of their parent couples (Gaspar
    Ferreira × Gertrudes Maria; João Rodrigues [do Valle] × Izabel Ribeira). It does
    NOT itself name their son Ladisláo — the tie of this couple to P-0056 is indirect
    (see F-0028).
  informant: The officiating vigário, Barbacena (Piedade da Borda do Campo), c.1786.
  limitations: >-
    Ink bleed-through and tight binding; the year, Gertrudes's surname, "do Valle",
    "Izabel", the witnesses and the officiant's surname are uncertain reads. The
    record concerns Joaquim José's own marriage, so it does not mention Ladisláo.
