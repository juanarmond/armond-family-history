notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T7): the grandparents' lugar is
    divided "d'Am- / proa" — the second line begins with only four letters, "proa", which fits
    "Amproa" better than the draft's "d'An- / jeiroa [?]"; it stays uncertain. The godfather's
    lugar, which the draft gave as "[?]rio [?]" split across a line break, is a single word at
    the head of a line, "[Rio]" (uncertain). The priest writes "Solenemente", not
    "solemnemente". Everything else was confirmed word by word, including "do de Quintão".
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T7): o lugar dos avós
    está dividido "d'Am- / proa" — a segunda linha começa com apenas quatro letras, "proa", o
    que se ajusta melhor a "Amproa" do que ao "d'An- / jeiroa [?]" do rascunho; continua
    incerto. O lugar do padrinho, que o rascunho dava como "[?]rio [?]" partido entre duas
    linhas, é uma só palavra no início de linha, "[Rio]" (incerto). O padre escreve
    "Solenemente", não "solemnemente". Tudo o mais foi conferido palavra por palavra,
    inclusive "do de Quintão".
- text: >-
    Identification and what the record adds. The parents "Bento Fernandes, e Joaquina Roza" of
    Quintão are identified with P-0141 × P-0142, and the grandparents with P-0143 × P-0144 and
    P-0145 × P-0146, by the matching names, lugar and parish, as in the couple's other
    children's baptisms; the identification is strong, not proven. The entry gives the lugar
    as "Quintão" (the form of the 1859–1890 death entries) and the godparents João Joaquim
    Correia of Lama and Benta Coelho, wife of João Pereira of Quintão — the parents of the
    Antonio and Maria Thereza baptised in 1837 and 1830 were a João Pereira and Benta Maria of
    Quintãa (PAR-0116's and PAR-0114's images), possibly the same household. Thereza de Jezus
    is very probably the daughter Thereza de Jesus who married José Ferreira at Ucha in 1869
    (a lead from the retrieval side's marriage sweep, not shown here). She can be recorded as
    a documented child of F-0071 with this source.
  text_pt: >-
    Identificação e o que o registro acrescenta. Os pais, "Bento Fernandes, e Joaquina Roza",
    do Quintão, são identificados com P-0141 × P-0142, e os avós com P-0143 × P-0144 e
    P-0145 × P-0146, pelos nomes, lugar e freguesia coincidentes, como nos batismos dos outros
    filhos do casal; a identificação é forte, não provada. O assento dá o lugar como "Quintão"
    (a forma dos óbitos de 1859–1890) e os padrinhos João Joaquim Correia, da Lama, e Benta
    Coelho, mulher de João Pereira, do Quintão — os pais do Antonio e da Maria Thereza
    batizados em 1837 e 1830 eram um João Pereira e uma Benta Maria, da Quintãa (imagens do
    PAR-0116 e do PAR-0114), possivelmente a mesma casa. Thereza de Jezus é muito
    provavelmente a filha Thereza de Jesus que se casou com José Ferreira na Ucha em 1869
    (pista da varredura de casamentos da pesquisa de recuperação, que este registro não
    mostra). Pode ser registrada como filha documentada da F-0071 com esta fonte.
