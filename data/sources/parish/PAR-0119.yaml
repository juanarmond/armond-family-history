reading_reliability: complete
abstract: >-
  Original baptism entry of Thereza de Jezus, the last entry on fl. 51v of the second baptism
  book of São Romão da Ucha (Barcelos). On 18 August 1841 the priest Antonio José Corrêa
  baptised "Thereza de Jezus filha legitima de Bento Fernandes, e Joaquina Roza" of the lugar
  de Quintão, born 14 August 1841. The paternal grandparents are "Manoel Fernandes, e Jozefa
  Maria" of the same lugar; the maternal grandparents are "Ignacio Lopes, e Marianna da Silva"
  of the lugar d'Am[proa], parish of Pousa. The godparents were João Joaquim Correia, of the
  lugar do [Rio], parish of Lama, and Benta Coelho, wife of João Pereira of Quintão. Thereza
  de Jezus is a collateral: a sister of Manoel João (P-0139), daughter of Bento José Fernandes
  (P-0141) and Joaquina Rosa Lopes (P-0142); she shares her name with her niece Thereza de
  Jesus (P-0039, b. 1864).
abstract_pt: >-
  Assento original de batismo de Thereza de Jezus, o último do fl. 51v do segundo livro de
  batismos de São Romão da Ucha (Barcelos). Em 18 de agosto de 1841 o padre Antonio José
  Corrêa batizou "Thereza de Jezus filha legitima de Bento Fernandes, e Joaquina Roza", do
  lugar de Quintão, nascida em 14 de agosto de 1841. Os avós paternos são "Manoel Fernandes, e
  Jozefa Maria", do mesmo lugar; os maternos, "Ignacio Lopes, e Marianna da Silva", do lugar
  d'Am[proa], freguesia da Pousa. Foram padrinhos João Joaquim Correia, do lugar do [Rio],
  freguesia da Lama, e Benta Coelho, mulher de João Pereira, do Quintão. Thereza de Jezus é
  colateral: irmã de Manoel João (P-0139), filha de Bento José Fernandes (P-0141) e de
  Joaquina Rosa Lopes (P-0142); tem o mesmo nome da sobrinha, Thereza de Jesus (P-0039, n.
  1864).
reliability:
  assessment: >-
    Original, written and signed by the officiating priest at the time: primary and direct for
    the baptism, its date, the birth date, the child, the parents as named and the
    godparents; the grandparents' names are reported by the family and are secondary in
    principle. Every core fact is clearly legible — the dates, the child, both parents, all
    four grandparents and the lugar — so reading_reliability is complete. The [uncertain]
    marks fall only on the grandparents' lugar in Pousa and the godfather's lugar in Lama.
  informant: >-
    The priest of São Romão da Ucha, Antonio José Corrêa, who officiated and signed; the
    grandparents' names were presumably supplied by the family.
  limitations: >-
    The grandparents' lugar in Pousa is split across a line break ("d'Am- / proa") and its
    reading is uncertain. No grandparent is called deceased here, although the baptism of 29
    March 1837 (PAR-0116) calls all four dead.
