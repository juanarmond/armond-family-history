  da / fabrica junto a [illegible] não fes testa- / m.to [illegible] p.ª constar [illegible]
  este termo q. assignei"
  [Signature:] o Vig.º Manoel Teixeira [uncertain: Forte]
  [Expansions: Jan.ro = Janeiro; p.nte = presente; M.da = Machada (probable); v.ª = viuva;
  Igr.a = Igreja; p.ª = para; q. = que; Vig.º = Vigário.]


  [entry 4 of 5 — Beatriz R.z, wife of M.el Camelo; 25 January 1728]
  [Margin:] Beatriz R.z m.er / de M.el [illegible] Camelo
  "Em os vinte e sinco dias do mes de Janeiro do / anno de mil e sete Centos e vinte e outo
  fale- / ceo da vida p.nte Beatriz R.z molher de [uncertain: M.el] / [illegible] Camello
  [illegible] digo Camelo de idade de / setenta e sinco annos pouco mais ou menos / Recebeo
