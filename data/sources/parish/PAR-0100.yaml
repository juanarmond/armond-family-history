  fabri- / ca junto a porta Principal [uncertain: porta Principal] de q. p.ª constar / fiz
  [illegible] este termo q. assignei"
  [Signature:] o Vig.º Manoel Teixeira [uncertain: Forte]
  [Expansions: R.z = Rodriguez (probable); m.er = molher; M.el = Manoel.]


  [entry 5 of 5 — M.el Camelo Leonardes, widower; 10 March 1728]
  [Margin:] M.el Camelo Leonar- / [des] v.º de [illegible]
  [Right margin:] Pobre
  "Em os des dias do mes de M.ço [uncertain: M.ço] do anno de mil e sete sen- / tos e vinte e
  outo faleceo da vida p.nte M.el Camelo / Leonardes v.º de [illegible] freguez [illegible]
