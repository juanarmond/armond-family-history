  [Year head:] 1728


  [entry 2 of 5 — Antonio Dias, husband of Antonia teixeira; 5 January 1728]
  [Margin:] Antonio / Dias Caza- / do Com Ã- / tonia tei- / xeira
  [Right margin:] Pobre
  "Em os sinco dias do mes de Janeiro do anno / de mil e sete Centos e vinte e outo annos /
  faleceo da vida prezente Antonio / Dias Cazado Com Ãtonia [uncertain: Ãtonia] teixeira ella
