  annos pouco mais ou menos Recebeo todos os divinos / Sacram.tos foi sepultado em huma
  sepultura da / fabrica não fez testamento sg.º [uncertain: sg.º] o R.do Confessor / Lavrei
  este termo die et mẽse, et anno ut supra"
  [Signature:] o Cura Manoel Fernandes
  [Expansions: digo = "I mean" (the scribe's own correction of the year); M.ª = Maria; S.
  Seb.am = São Sebastião; Sacram.tos = Sacramentos; sg.º = segundo (if so read); R.do =
