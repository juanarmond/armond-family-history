notes:
- text: >-
    Identification. "Casado com Maria Mendes" is what ties this entry to P-0131 rather than to
    his namesake cousin: Mendes Forjaz Vol. IX (PUB-0005, p.261) gives Gaspar de Souto-Maior,
    baptised 1657, a second marriage at São Sebastião on 8.2.1694 to Maria Mendes de Borba, and
    "f. a 2.12.1727" — the same day as this act; the cousin Gaspar de Souto-Maior (p.260, son of
    Baltazar Gonçalves Leonardes) married D. Ana de Sousa at Porto Judeu in 1687 and was S.g.
    "Setenta annos pouco mais ou menos" fits a man baptised on 23 December 1657 (PAR-0099), who
    would have been just under 70. The marriage to Maria Mendes is known here only from Vol. IX;
    the retrieval side reports reading the 1694 act itself (C-1673-1766 p.0044), which is not
    held here.
  text_pt: >-
    Identificação. "Cazado com Maria Mendes" é o que liga este assento ao P-0131 e não ao primo
    homónimo: o Vol. IX de Mendes Forjaz (PUB-0005, p.261) dá a Gaspar de Souto-Maior, baptizado
    em 1657, um segundo casamento em São Sebastião a 8.2.1694 com Maria Mendes de Borba, e "f. a
    2.12.1727" — o mesmo dia deste assento; o primo Gaspar de Souto-Maior (p.260, filho de
    Baltazar Gonçalves Leonardes) casou com D. Ana de Sousa no Porto Judeu em 1687 e foi S.g.
    "Setenta annos pouco mais ou menos" condiz com um homem baptizado a 23 de dezembro de 1657
    (PAR-0099), que teria pouco menos de 70 anos. O casamento com Maria Mendes só é conhecido
    aqui pelo Vol. IX; a pesquisa de recuperação diz ter lido o próprio assento de 1694
    (C-1673-1766 p.0044), que não está guardado aqui.
- text: >-
    Consequence. This act places Gaspar's death — undated as to place in Vol. IX — in his home
    parish of São Sebastião, Terceira. A man who died on Terceira in 1727, still married to
    Maria Mendes, cannot be Gaspar Ferreira (P-0092), the father of Joaquim José Ferreira de
    Toledo, who was born and baptised at Villa Rica, Minas Gerais, and married in 1783 (PAR-0018).
    That is why the two were separated on 2026-10-10 and this source is linked to P-0131 only.
  text_pt: >-
    Consequência. Este assento situa a morte de Gaspar — sem local no Vol. IX — na sua freguesia
    natal de São Sebastião, Terceira. Um homem que morreu na Terceira em 1727, ainda casado com
    Maria Mendes, não pode ser Gaspar Ferreira (P-0092), pai de Joaquim José Ferreira de Toledo,
    nascido e baptizado em Villa Rica, Minas Gerais, e casado em 1783 (PAR-0018). Por isso os dois
    foram separados a 2026-10-10 e esta fonte liga-se apenas ao P-0131.
- text: >-
    Year correction. The scribe first wrote "vinte e dois" and corrected himself in the line:
    "vinte e dois, digo vinte e sete". The cancelled word has the same letter forms as the "dois"
    of the date in the first line ("Em os dois dias"). The page head (1727) and the next entry (5
    January 1728) confirm 1727.
  text_pt: >-
    Correcção do ano. O escrivão escreveu primeiro "vinte e dois" e corrigiu-se na própria
    linha: "vinte e dois, digo vinte e sete". A palavra emendada tem as mesmas formas de letra
    que o "dois" da data na primeira linha ("Em os dois dias"). O cabeçalho da página (1727) e o
    assento seguinte (5 de janeiro de 1728) confirmam 1727.
