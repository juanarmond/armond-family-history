  RIGHT PAGE


  [Year head:] 1728   [Folio number, top right:] 97


  [entry 3 of 5 — Barbora M.da, widow of Fernando de Aguiar; 12 January 1728]
  [Margin:] Barbora M.da / v.ª de Fernando / Aguiar
  [Right margin:] Pobre
  "Em os doze dias do mes de Jan.ro do anno de [a flourished word, illegible] / mil e sete
  Centos vinte e outo faleceo da / vida p.nte Barbora M.da viuva de Fernando de / Aguiar de
  idade de setenta annos pouco mais / ou menos Recebeo todos os divinos Sacramentos / foi
