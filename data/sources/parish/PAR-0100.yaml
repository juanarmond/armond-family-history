reading_reliability: complete
abstract: >-
  Original death act of Gaspar de Souto Maior (P-0131), the first entry under the year head
  1727 on image p.0099 of the São Sebastião (Terceira) death book TER-AH-SAOSEBASTIAO-O-1696-1762,
  held as a reduced-resolution copy (1269×1004 px) from the open Culturacores CDN. On 2 December
  1727 "Gaspar de Souto", "Cazado Com Maria Mendes", native and parishioner of "this Matriz of
  S. Seb[astião]", died aged "setenta annos pouco mais ou menos", having received the
  sacraments; he was buried in a grave belonging to the church fabric and made no will. The
  entry is written and signed by the cura Manoel Fernandes; the margin repeats "Gaspar de Souto
  cazado com M.ª Mendes". The wife and the age identify him: Mendes Forjaz Vol. IX (PUB-0005)
  gives the Gaspar baptised in 1657 a second marriage on 8.2.1694 to Maria Mendes de Borba and
  a death "a 2.12.1727" with no place, while his namesake cousin married D. Ana de Sousa and
  left no issue; seventy years fits a December 1657 baptism (PAR-0099). The act places his
  death on Terceira.
abstract_pt: >-
  Assento original de óbito de Gaspar de Souto Maior (P-0131), o primeiro sob o ano 1727 na
  imagem p.0099 do livro de óbitos de São Sebastião (Terceira) TER-AH-SAOSEBASTIAO-O-1696-1762,
  guardado como cópia de resolução reduzida (1269×1004 px) do CDN aberto do Culturacores. A 2 de
  dezembro de 1727 faleceu "Gaspar de Souto", "Cazado Com Maria Mendes", natural e freguês
  "desta Matriz de S. Seb[astião]", com "setenta annos pouco mais ou menos", tendo recebido os
  sacramentos; foi sepultado numa sepultura da fábrica da igreja e não fez testamento. O assento
  é escrito e assinado pelo cura Manoel Fernandes; a margem repete "Gaspar de Souto cazado com
  M.ª Mendes". A mulher e a idade identificam-no: o Vol. IX de Mendes Forjaz (PUB-0005) dá ao
  Gaspar baptizado em 1657 um segundo casamento, a 8.2.1694, com Maria Mendes de Borba, e um
  óbito "a 2.12.1727" sem local, ao passo que o primo homónimo casou com D. Ana de Sousa e não
  deixou geração; setenta anos condizem com um baptismo de dezembro de 1657 (PAR-0099). O
  assento situa a morte dele na Terceira.
reliability:
  assessment: >-
    Primary, original and direct for the death, its date and place, the deceased's name, his
    marital status and wife, his approximate age, his receiving the sacraments, his burial in a
    fabric grave and his dying intestate: the act was written by the cura of the parish at the
    time. Every core fact of the target entry is legible on this copy — the date (with the
    scribe's own correction "vinte e dois, digo vinte e sete" and the page head 1727), the name
    "Gaspar de Souto" (body and margin), the wife "Maria Mendes" (body and margin) and the age
    "setenta annos" — so reading_reliability is complete; the inline [uncertain] marks in this
    entry fall only on a formula word ("sg.º") and on the spelling of the parish abbreviation,
    whose meaning is fixed by the book itself. The information on age and origin came from an
    unnamed informant and is approximate ("pouco mais ou menos"). The act states no parents, so
    the identification with the man baptised on 23 December 1657 (PAR-0099) is indirect: it
    rests on the name, the age (~70 in 1727), the wife Maria Mendes (whom Vol. IX gives as the
    second wife of Gaspar b. 1657, by a marriage of 8.2.1694 not held here) and the exact
    agreement with Vol. IX's death date 2.12.1727.
  informant: >-
    Not named; the cura Manoel Fernandes wrote and signed the act ("Lavrei este termo")
  limitations: >-
    This is a REDUCED-RESOLUTION copy from the open Culturacores / DRaC-BPARAH CDN (1269×1004
    px for the whole two-page spread, watermarked), not a scan of the original. It is legible
    for the core facts of the target entry, but several words of the four other entries — and
    the vicar's surname on the right page — could not be read at this size and are marked
    [illegible] or [uncertain]. A 300-dpi scan of the original can be ordered from BPAR Angra do
    Heroísmo (the route used for PAR-0099, Requisição nº 101) if a fuller reading is ever
    needed. The page number p.0099 is the retrieval side's image number; the written folio on
    the right page reads 97. The burial date is not stated separately.
