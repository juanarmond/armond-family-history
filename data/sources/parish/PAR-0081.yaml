transcription: >-
  [Livro de Baptismos, Nova Friburgo, 1867. Sessão de baptismos coletivos; o
  sujeito é a entrada "1.ª". Margem: "M.ª Elisab. Bohrer" (abreviado, leitura
  incerta).] "A dez de Fevereiro de mil oitocentos sessenta e sete baptizei a
  1.ª Maria Elizabeth, nascida a quinze de Dezembro, filha leg.ma de Vicente
  Bohrer e de Maria Eggendorn, forão padrinhos João Eggendorn e Elisabeth
  Eggendorn." [A entrada seguinte, "2.ª Maria Luiza … filha leg.ma de Antonio
  Eggendorn e de Maria Catharina Ritter", é um baptismo separado e não
  relacionado.] "O Vigario João José Viviani."
abstract: >-
  Parish baptism of Maria Elizabeth Bohrer, born 15 December 1866 and baptised
  10 February 1867 at Nova Friburgo, legitimate daughter of Vicente Bohrer
  (P-0070) and Maria Eggendorn (P-0071, "Maria Thecla Regina Eggendorn"; here
  written only "Maria Eggendorn") — i.e. an elder sister of Valentim Martinho
  Bohrer (P-0028). This is a PRIMARY parish baptism confirming the documented
  child previously held only on the secondary Imigrantes compilation (PUB-0003)
  on family F-0034. Godparents João Eggendorn and Elisabeth Eggendorn
  (maternal-side kin). PROVEN. Not modelled as a person entity; no event
  created.
abstract_pt: >-
  Batismo paroquial de Maria Elizabeth Bohrer, nascida em 15 de dezembro de 1866
  e baptizada em 10 de fevereiro de 1867 em Nova Friburgo, filha legítima de
  Vicente Bohrer (P-0070) e Maria Eggendorn (P-0071, "Maria Thecla Regina
  Eggendorn"; aqui grafada apenas "Maria Eggendorn") — ou seja, irmã mais velha
  de Valentim Martinho Bohrer (P-0028). É um batismo paroquial PRIMÁRIO que
  confirma a filha documentada antes apoiada apenas na compilação secundária dos
  Imigrantes (PUB-0003) na família F-0034. Padrinhos João Eggendorn e Elisabeth
  Eggendorn (parentes do lado materno). PROVADO. Não modelada como entidade
  pessoa; sem evento criado.
reliability:
