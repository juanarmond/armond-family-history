notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T4): the grandparents' lugar
    is written "Anjeirôa" (with i, not y — the draft has "Anjeyrôa"); it stays uncertain.
    "Cabreiros" is legible in full (the draft gave "Cabreir[o]s"). Everything else was
    confirmed word by word, including "Ignacio Francisco Lopes" for the grandfather and
    "Ignacio José Lopes tio da Mãi" for the godmother's father.
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T4): o lugar dos avós
    está escrito "Anjeirôa" (com i, não y — o rascunho tem "Anjeyrôa"); continua incerto.
    "Cabreiros" é legível por inteiro (o rascunho dava "Cabreir[o]s"). Tudo o mais foi
    conferido palavra por palavra, inclusive "Ignacio Francisco Lopes" para o avô e "Ignacio
    José Lopes tio da Mãi" para o pai da madrinha.
- text: >-
    The two Ignacios. In this entry the maternal grandfather is "Ignacio Francisco Lopes",
    and the godmother is "Maria solteira, filha de Ignacio José Lopes tio da Mãi do
    Baptizado, da freguesia de Sam Miguel de Cabreiros". Read literally, Ignacio José Lopes of
    Cabreiros is the mother's uncle and a different man from her father. Other baptisms of the
    couple's children call the grandfather "Ignacio Lopes" (1829, 1839, 1841), "Inacio Lopes"
    (1837) and "Ignacio Joze Lopes" (1843). So either the 1843 entry (and the retrieval side's
    1833 one) borrowed the uncle's middle name, or the priest's "tio" here is loose. P-0145's
    alias "Ignacio José Lopes" should therefore be held with care; the uncle is not modelled.
  text_pt: >-
    Os dois Ignacios. Neste assento o avô materno é "Ignacio Francisco Lopes", e a madrinha é
    "Maria solteira, filha de Ignacio José Lopes tio da Mãi do Baptizado, da freguesia de Sam
    Miguel de Cabreiros". Lido à letra, Ignacio José Lopes, de Cabreiros, é tio da mãe e um
    homem diferente do pai dela. Outros batismos dos filhos do casal chamam o avô "Ignacio
    Lopes" (1829, 1839, 1841), "Inacio Lopes" (1837) e "Ignacio Joze Lopes" (1843). Assim, ou o
    assento de 1843 (e o de 1833, segundo a pesquisa de recuperação) tomou o nome do meio do
    tio, ou o "tio" do padre aqui é impreciso. O alias "Ignacio José Lopes" de P-0145 deve,
    portanto, ser tratado com cuidado; o tio não é modelado.
- text: >-
    Identification and what the record adds. The parents and the lugar are identified with
    P-0141 × P-0142 and the grandparents with P-0143 × P-0144 and P-0145 × P-0146 by the
    matching names, as in the couple's other children's baptisms (PAR-0113 to PAR-0120); the
    identification is strong, not proven. The entry adds a maternal relative — Ignacio José
    Lopes, the mother's uncle, of São Miguel de Cabreiros, with an unmarried daughter Maria —
    and the godfather Domingos Joaquim de Azevedo of Quintãa. No grandparent is called
    deceased. The identification of this Domingos with Domingos José Fernandes (d. 1885,
    Brazil) is strong, not proven: same parents and parish, and no other Domingos of this
    couple was found in the book (which ends in 1844).
  text_pt: >-
    Identificação e o que o registro acrescenta. Os pais e o lugar são identificados com
    P-0141 × P-0142 e os avós com P-0143 × P-0144 e P-0145 × P-0146 pelos nomes coincidentes,
    como nos batismos dos outros filhos do casal (PAR-0113 a PAR-0120); a identificação é
    forte, não provada. O assento acrescenta um parente materno — Ignacio José Lopes, tio da
    mãe, de São Miguel de Cabreiros, com uma filha solteira, Maria — e o padrinho Domingos
    Joaquim de Azevedo, da Quintãa. Nenhum avô é dado como falecido. A identificação deste
    Domingos com Domingos José Fernandes (f. 1885, Brasil) é forte, não provada: mesmos pais e
    freguesia, e nenhum outro Domingos deste casal foi achado no livro (que termina em 1844).
