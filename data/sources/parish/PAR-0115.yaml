reading_reliability: complete
abstract: >-
  Original baptism entry of Domingos, the first entry on fl. 35 of the second baptism book of
  São Romão da Ucha (Barcelos). On 20 March 1835 the abbot Antonio José da Costa e Silva
  baptised "Domingos, filho legitimo de Bento Fernandes e de Joaquina Lopes" of the lugar
  da Quintãa, born 16 March 1835. The paternal grandparents are "Manoel Fernandes, e …
  Jozefa Maria" of the same lugar; the maternal grandparents are "Ignacio Francisco Lopes,
  e … Marianna Luiza da Silva" of the lugar da [Anjeirôa], Santa Christina da Pousa. The
  godparents were Domingos Joaquim de Azevedo of Quintãa and "Maria solteira, filha de
  Ignacio José Lopes tio da Mãi do Baptizado", of São Miguel de Cabreiros. This Domingos is
  very probably the Domingos José Fernandes who died in Brazil in 1885, whose will names his
  parents as Bento José Fernandes and Joaquina Roza Lopes of São Romão da Ucha. He is a
  collateral: a brother of Manoel João (P-0139), son of P-0141 and P-0142.
abstract_pt: >-
  Assento original de batismo de Domingos, o primeiro do fl. 35 do segundo livro de batismos
  de São Romão da Ucha (Barcelos). Em 20 de março de 1835 o abade Antonio José da Costa e
  Silva batizou "Domingos, filho legitimo de Bento Fernandes e de Joaquina Lopes", do lugar
  da Quintãa, nascido em 16 de março de 1835. Os avós paternos são "Manoel Fernandes, e …
  Jozefa Maria", do mesmo lugar; os maternos, "Ignacio Francisco Lopes, e … Marianna Luiza
  da Silva", do lugar da [Anjeirôa], Santa Christina da Pousa. Foram padrinhos Domingos
  Joaquim de Azevedo, da Quintãa, e "Maria solteira, filha de Ignacio José Lopes tio da Mãi
  do Baptizado", de São Miguel de Cabreiros. Este Domingos é muito provavelmente o Domingos
  José Fernandes falecido no Brasil em 1885, cujo testamento dá como pais Bento José
  Fernandes e Joaquina Roza Lopes, de São Romão da Ucha. É colateral: irmão de Manoel João
  (P-0139), filho de P-0141 e P-0142.
reliability:
  assessment: >-
    Original, written and signed by the officiating abbot at the time: primary and direct for
    the baptism, its date, the birth date, the child, the parents as named and the
    godparents; the grandparents' names are reported by the family and are secondary in
    principle. Every core fact is clearly legible — the dates, the child, both parents, all
    four grandparents and the lugar — so reading_reliability is complete. The only
    [uncertain] mark falls on the grandparents' lugar in Pousa.
  informant: >-
    The abbot of São Romão da Ucha, Antonio José da Costa e Silva, who officiated and signed;
    the grandparents' names and the godmother's kinship were presumably supplied by the
    family.
  limitations: >-
    The child is named only "Domingos"; "José" is not written, so the identification with
    Domingos José Fernandes of Brazil rests on the parents' names and the parish, not on this
    entry alone. The kinship phrase "Ignacio José Lopes tio da Mãi" sits beside a maternal
    grandfather called "Ignacio Francisco Lopes" in the same entry (see notes).
