transcription: >-
  [Livro de Baptismos, Nova Friburgo, fl.214, 1902.] "2245. Aos deseseis dias do mes de Outubro de
  mil novecentos e dois baptisei solemnemente a Etelvina, nascida á deseseis de Maio de mil
  novecentos, filha legitima de Joaquim José Borber [Bohrer] e Lucinda da Silva Borber [Bohrer].
  Forão padrinhos Antonio Auverney Sobrinho e Maria Orich Marchon. Para constar fiz este assento,
  que assigno. O Vigario José Silvestre Alves de Miranda."
abstract: >-
  Parish baptism of Etelvina Bohrer, born 16 May 1900 and baptised (late) 16 October 1902 at Nova
  Friburgo, legitimate daughter of Joaquim José Bohrer (P-0030) and Lucinda Ferreira da Silva
  (P-0031) — i.e. a sibling of the direct ancestor Celina Bohrer (P-0015). Recorded as a documented
  child on family F-0014. Godparents Antonio Auverney Sobrinho and Maria Orich Marchon.
abstract_pt: >-
  Batismo paroquial de Etelvina Bohrer, nascida em 16 de maio de 1900 e baptizada (tardiamente) em
  16 de outubro de 1902 em Nova Friburgo, filha legítima de Joaquim José Bohrer (P-0030) e Lucinda
  Ferreira da Silva (P-0031) — ou seja, uma irmã da ancestral direta Celina Bohrer (P-0015).
  Registrada como filha documentada na família F-0014. Padrinhos Antonio Auverney Sobrinho e Maria
  Orich Marchon.
