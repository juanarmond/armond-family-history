transcription: |-
  [Two images of the Pousa baptism book for 1864. Image 15: the left page (fl. 10v) holds the end of an entry and entry Nº 5; the right page (fl. 11) holds the end of Nº 5, Nº 6 and the beginning of the target, Nº 7. Image 16: the left page (fl. 11v) holds the end of Nº 7, Nº 8 and the beginning of Nº 9; the right page (fl. 12) holds the end of Nº 9, Nº 10 and the beginning of Nº 11. Read from the native images (3845×2992 and 3863×2994) in strips at 1–2.5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals, accents and abbreviations are kept as written.]

  [image 15, left page — the end of an entry whose beginning is on the previous image: a child of a father whose name ends "…Cachadinha" on this page and Thereza Maria, oleira; paternal grandparents Antonio Lopes Leal and Leonarda Carneiro, maternal grandparents [uncertain: Sebaz] José and Ursula Lopes; godparents Antonio da Motta, moleiro, casado, and Anna da Costa, casada; signed by the Abbade Manoel José d'Oliveira Guimarães. Later civil-registry annotations in the margin. Not this family.]

  [image 15, Nº 5 — Maria Joaquina, daughter of José Antonio Lopes and Jozefa da Motta, tecedeira, of the lugar de Brunhaes; baptised 30 March 1864 by the Presbitero José Lopes, Encommendado; godparents José da Motta, moleiro, casado, and Maria Thereza, casada; signed by the Abbade. A later marginal note of her death in 1955. Not this family.]

  [image 15, Nº 6 — João, son of João José Lopes, oleiro, of Pousa, and Anna de Araujo, oleira, of São Thiago de Encourados; born 5 April, baptised 10 April 1864 by the Abbade Manoel José de Oliveira Guimarães; godparents João Pereira, casado, lavrador, and Theresa de Jesus, casada; signed "O Parocho Encommendado José Lopes". This godmother is a married Theresa de Jesus, not the unmarried godmother of Nº 7. Not this family.]

  [p1 — evidence/parish/PAR-0108-baptism-thereza-de-jesus-1864-pousa-p01.jpg; fl. 11, entry Nº 7 — TARGET]
  [Margin:]
  N.º 7
  Thereza
  de Jezus fi-
  lha legitima
  de Manoel
  João Ferna-
  ndes, e de
  Anna Ex-
  posta do lo-
  gar do Souto
  [Body:]
  Aos seis dias do mez de maio do anno de mil oito centos
  sessenta e quatro, nesta Egreja Parochial da Pouza, Con-
  celho de Barcellos, Diocese de Braga, baptisou o Presbitero
  José Lopes, Encommendado desta Egreja, um individuo
  do sexo feminino a quem deu o nome de Thereza de
  Jesus e que nasceu nesta freguezia ás quatro horas
  do dia tres dos ditos mez e anno, filha legitima de
  Manoel João Fernandes e primeira do nome, alfai-
  ate, natural da freguezia de São Romão da Ucha, Con-
  celho de Barcellos, Diocese de Braga, e de Anna
  Exposta, costureira, cuja naturalidade é ignorada, re-
  [p2 — evidence/parish/PAR-0108-baptism-thereza-de-jesus-1864-pousa-p02.jpg; fl. 11v, top]
  cebidos na dita freguezia de São Romão da
  Ucha, parochianos desta da Pouza e moradores no
  logar do Souto da mesma, neta paterna de Bento
  Fernandes e de Joaquina Lopes e materna de
  avós incognitos. Foi padrinho João Ferreira,
  lavrador, solteiro, e madrinha Thereza de Jesus
  solteira, os quaes todos sei serem os proprios.
  E para constar lavrei em duplicado este as-
  sento que, depois de ser lido e conferido pe-
  rante os padrinhos com elle somente o
  assigno por a madrinha declarar não
  saber escrever. Era ut supra. Padrinho
  João Ferr.a          Abbade Manoel José d'Oliveira Guimarães.
  [Expansions and readings: Ferr.a = Ferreira; Encommendado = the priest provisionally in charge of the parish; "Ucha" — in both places the capital U is written with a leading loop, which makes the word look like "Ulha"; "primeira do nome" refers to the child, the first daughter so named; "recebidos" = married; "avós incognitos" = unknown grandparents; era ut supra = in the year written above.]

  [image 16, Nº 8 — José Joaquim, son of Luiz Loureiro, oleiro, and Maria Benta Martins, of the lugar de Brunhaes; born 28 June [uncertain], baptised 29 June 1864 by the Presbitero José Lopes, Encommendado. Not this family.]

  [image 16, Nº 9 — Maria das Dores, daughter of Luiz de Araujo and Anna Joaquina, lavradores, of the lugar do Dobrigo; baptised 4 July 1864 by the Presbitero Manoel José de Carvalho, parish priest of Encourados, who was also the godfather. Not this family.]

  [image 16, Nº 10 — Manoel, son of Antonio Gonçalves Leça, moleiro, and Maria Joaquina Rodrigues, of the lugar da [uncertain: Amprôa]; born 7 July, baptised 9 July 1864. Not this family.]

  [image 16, Nº 11 — Thereza, baptised 10 July 1864; only the first two lines are on this image. Not this family as far as it is read.]
reading_reliability: complete
abstract: >-
  Original baptism entry Nº 7 of 1864 in the Pousa (Santa Cristina, Barcelos) baptism book,
  running from fl. 11 to fl. 11v. Thereza de Jesus was born in the parish at four o'clock on 3
  May 1864 and baptised in the parish church on 6 May 1864 by the Presbitero José Lopes,
  Encommendado. She was the legitimate daughter, and the first so named, of Manoel João
  Fernandes, a tailor (alfaiate), native of the parish of São Romão da Ucha, and of Anna
  Exposta, a seamstress (costureira), "whose birthplace is unknown". Her parents had married
  ("recebidos") at São Romão da Ucha and were parishioners of Pousa, living at the lugar do
  Souto. Her paternal grandparents were Bento Fernandes and Joaquina Lopes; her maternal
  grandparents are "avós incognitos" (unknown). The godparents were João Ferreira, lavrador,
  solteiro, who signed, and Thereza de Jesus, solteira, who could not write. The Abbade Manoel
  José d'Oliveira Guimarães signed the entry. This is the baptism of Thereza Fernandes de
  Azevedo (P-0039).
abstract_pt: >-
  Assento original de batismo Nº 7 de 1864 do livro de batismos de Pousa (Santa Cristina,
  Barcelos), que corre da fl. 11 para a fl. 11v. Thereza de Jesus nasceu na freguesia às quatro
  horas do dia 3 de maio de 1864 e foi batizada na igreja paroquial em 6 de maio de 1864 pelo
  Presbítero José Lopes, Encomendado. Era filha legítima, e a primeira com esse nome, de Manoel
  João Fernandes, alfaiate, natural da freguesia de São Romão da Ucha, e de Anna Exposta,
  costureira, "cuja naturalidade é ignorada". Os pais tinham casado ("recebidos") em São Romão da
  Ucha e eram paroquianos de Pousa, moradores no lugar do Souto. Os avós paternos eram Bento
  Fernandes e Joaquina Lopes; os avós maternos são "avós incognitos" (desconhecidos). Foram
  padrinhos João Ferreira, lavrador, solteiro, que assinou, e Thereza de Jesus, solteira, que não
  sabia escrever. O Abade Manoel José d'Oliveira Guimarães assinou o assento. É o batismo de
  Thereza Fernandes de Azevedo (P-0039).
reliability:
  assessment: >-
    Original and direct, written in the year of the event and read before the godparents. It is
    primary for the baptism, the birth date and hour, the child's name, the parents, their
    occupations and residence, and the godparents. The father's birthplace, the place of the
    parents' marriage and the grandparents are secondary statements, presumably from the parents;
    hence mixed. Every core fact is legible on both pages; there are no gaps.
  informant: >-
    The Pousa clergy: the Presbitero José Lopes, Encommendado, who baptised, and the Abbade
    Manoel José d'Oliveira Guimarães, who signed. The godfather João Ferreira also signed. The
    family details were presumably given by the parents.
  limitations: >-
    The entry names the baptising priest (José Lopes) and the signing priest (the Abbade) as two
    different men; the neighbouring entries show the same pattern, so it is the register's
    practice, not an error in this entry. The hour of birth is "ás quatro horas" without morning
    or afternoon. The paternal grandparents are named without saying whether they were living;
    the probable death of Bento in 1860 (PAR-0110) is not mentioned.
