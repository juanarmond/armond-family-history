notes:
- text: >-
    Differences from the retrieval side's draft (thereza-fernandes-de-azevedo.md §8), checked
    word by word on both images. The draft is confirmed throughout, including the margin, "e
    primeira do nome", "com elle somente o assigno" and both signatures. One reading differs: the
    draft has "São Romão da Ulha" twice. The word is read here as "Ucha": the capital U is formed
    with a leading loop, the same letter form found in the Ucha registers (PAR-0106, PAR-0107).
    No other parish named Ulha is in question; this is a letter form, not a different place.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (thereza-fernandes-de-azevedo.md §8), conferido palavra por palavra nas duas imagens. O
    rascunho foi confirmado em tudo, incluindo a margem, "e primeira do nome", "com elle somente
    o assigno" e as duas assinaturas. Uma leitura difere: o rascunho tem duas vezes "São Romão da
    Ulha". A palavra é lida aqui como "Ucha": o U maiúsculo é feito com uma laçada inicial, a
    mesma forma de letra dos registros da Ucha (PAR-0106, PAR-0107). Nenhuma outra freguesia
    chamada Ulha está em causa; trata-se de forma de letra, não de outro lugar.
- text: >-
    Identification. The child is identified with Thereza Fernandes de Azevedo (P-0039) because
    her father's 1890 will and 1898 inventário name a daughter "Thereza" / "D. Thereza de Jesus",
    married to Secundino de Azevedo (per the retrieval side's transcription of those records),
    and this is the only Thereza among the couple's children baptised at Pousa in 1855–1871 that
    the retrieval side found. The parents are identified with P-0139 and P-0140 by the father's
    name and birthplace, the foundling mother and the marriage at Ucha, which match his baptism
    (PAR-0106) and marriage (PAR-0107).
  text_pt: >-
    Identificação. A criança é identificada com Thereza Fernandes de Azevedo (P-0039) porque o
    testamento do pai (1890) e o inventário (1898) nomeiam uma filha "Thereza" / "D. Thereza de
    Jesus", casada com Secundino de Azevedo (segundo a transcrição desses registros pela pesquisa
    de recuperação), e esta é a única Thereza entre os filhos do casal batizados em Pousa em
    1855–1871 encontrada pela pesquisa de recuperação. Os pais são identificados com P-0139 e
    P-0140 pelo nome e naturalidade do pai, pela mãe exposta e pelo casamento na Ucha, que
    coincidem com o batismo (PAR-0106) e o casamento (PAR-0107) dele.
- text: >-
    What the record adds. The father, Manoel João Fernandes, was a tailor (alfaiate) in 1864, and
    a native of São Romão da Ucha. The mother is "Anna Exposta", a seamstress (costureira), whose
    birthplace is unknown and whose parents are "avós incognitos". That is a foundling, the same
    status as "Joanna Maria Esposta" of the 1855 marriage. The parents were married at Ucha and
    lived at the lugar do Souto in Pousa. The paternal grandparents are "Bento Fernandes" and
    "Joaquina Lopes". Thereza was born on 3 May 1864 at four o'clock and baptised on 6 May 1864.
  text_pt: >-
    O que o registro acrescenta. O pai, Manoel João Fernandes, era alfaiate em 1864 e natural de
    São Romão da Ucha. A mãe é "Anna Exposta", costureira, de naturalidade ignorada e com "avós
    incognitos": uma exposta, a mesma condição de "Joanna Maria Esposta" no casamento de 1855. Os
    pais casaram na Ucha e moravam no lugar do Souto, em Pousa. Os avós paternos são "Bento
    Fernandes" e "Joaquina Lopes". Thereza nasceu em 3 de maio de 1864, às quatro horas, e foi
    batizada em 6 de maio de 1864.
- text: >-
    The godparents were João Ferreira, lavrador, solteiro, who signed "João Ferr.a", and Thereza
    de Jesus, solteira, who declared that she could not write. The record gives no kinship for
    either of them. Manoel João had a sister Thereza de Jezus, baptised at Ucha in 1841 and
    married in 1869 to a José Ferreira (per the retrieval side's reading of those records, not
    read here). She could be this unmarried godmother, but the entry does not say so and the
    name is common. Do not model the godmother as the aunt without a record that ties them.
  text_pt: >-
    Os padrinhos foram João Ferreira, lavrador, solteiro, que assinou "João Ferr.a", e Thereza de
    Jesus, solteira, que declarou não saber escrever. O registro não dá parentesco para nenhum
    dos dois. Manoel João tinha uma irmã Thereza de Jezus, batizada na Ucha em 1841 e casada em
    1869 com um José Ferreira (segundo a leitura desses registros pela pesquisa de recuperação,
    não lidos aqui). Ela pode ser esta madrinha solteira, mas o assento não o diz e o nome é
    comum. Não modelar a madrinha como a tia sem um registro que as ligue.
- text: >-
    Place-name lead for PAR-0106. Entry Nº 10 on image 16 places a family "no logar da
    [Amprôa, uncertain]" in Pousa. The uncertain lugar of Manoel João's maternal grandparents in
    Pousa in his 1833 baptism ("Anjeyrôa", uncertain) may be the same name. This is a lead for
    reading that word, not a reading of it.
  text_pt: >-
    Pista de topônimo para o PAR-0106. O assento Nº 10 da imagem 16 situa uma família "no logar
    da [Amprôa, incerto]", em Pousa. O lugar incerto dos avós maternos de Manoel João em Pousa no
    batismo dele em 1833 ("Anjeyrôa", incerto) pode ser o mesmo nome. É uma pista para a leitura
    dessa palavra, não uma leitura dela.
