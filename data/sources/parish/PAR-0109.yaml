transcription: |-
  [Two images of the São Romão da Ucha baptism book for 1807. Image 493: the left page (fl. 160v) and the right page (fl. 161), entries of June–October 1807; the target is the last entry on fl. 161. Image 494: the left page (fl. 161v) opens with the end of the target, followed by entries of October–November 1807; the right page (fl. 162) runs into January 1808. Every entry is in the hand of the Abbade Domingos Ribeiro Soares and signed by him. Read from the native images (4269×2809 and 4288×2900) in strips at 1–3× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [image 493, fl. 160v — the end of an entry whose beginning is on the previous image, with proxies of the lugar do Cabo and of the city of Braga; then: Mariana, daughter of Francisco de Azevedo and Maria Pereyra, of the lugar da Torre, born 17 June and baptised 21 June 1807, godparents Francisco Fernandes and Marianna Domingues, wife of João Gonçalves, "ambos do Lugar de Quintam"; Maria Thereza, daughter of João José de Oliveira and Anna Maria, of the lugar de Quintam, maternal grandparents André Luis and Maria Domingues, of the same lugar, born 26 June and baptised 28 June 1807; Antonio José, son of Manoel Domingues, of the lugar de Macedo, born 30 July 1807. None of these entries names Bento's parents.]

  [image 493, fl. 161 — José Joaquim, son of Bento Gonçalves and Roza da Silva, born 8 August 1807; Anna Luiza, born 15 August 1807; Manoel Joaquim, son of [illegible] Gonçalves and Joanna Thereza, of the lugar da Gandra, born 16 October 1807, godmother Anna, solteira, daughter of Manoel Pereyra, widower, of Salvador da Lama. Not this family.]

  [p1 — evidence/parish/PAR-0109-baptism-bento-jose-1807-ucha-p01.jpg; fl. 161, last entry — TARGET]
  [Margin:] Bento / p.
                                          anno de mil oito centos e sette [interlined above the first line]
  Aos vinte dias do mez de Outubro nasceo Bento
  Jose f.o legitimo de Manoel Fernandes, e Jozefa Maria do Lu-
  gar de Quintam desta freguezia de S. Romaõ da Ucha, netto
  paterno de Constantino Fernandes, e sua mulher Roza Maria
                                                              do [catchword]
  [p2 — evidence/parish/PAR-0109-baptism-bento-jose-1807-ucha-p02.jpg; fl. 161v, top]
  do mesmo Lugar, e materno de André Domingues, e sua mu-
  lher Maria Luiza da freguezia do Salvador da Lama Couto
  de Azevedo, e foi solemnemente baptizado com imposiçaõ
  dos Santos Oleos pelo Padre Joaõ Gonçalves Cura desta
  freguezia aos vinte, e hum do d.o mez, e anno, foraõ Padri-
  nhos Bento Gonçalves, e Benta solteyra thia materna do
  baptizado ambos da sobreditta freguezia da Lama, e pa-
  ra constar fiz este assento era ut supra
  [Signatures:] O P.e Joaõ Gonçalves          O Abb.e Domingos Rib.ro Soares
  [Expansions and readings: "Jose" — the word is cramped against "f.o" at the start of the line; at 3× zoom it reads J-o-s-e, a forename, followed by the abbreviation f.o; the margin gives only "Bento"; f.o = filho; S. = São; Romaõ = Romão; d.o = dito; thia materna = maternal aunt; P.e = Padre; Abb.e = Abbade; Rib.ro = Ribeiro. The cura's signature is in a lighter ink than the Abbade's.]

  [image 494, fl. 161v, after the target — Maria Thereza, daughter of Joze Peixoto and Gracia Maria, of the lugar de Gandra, born 26 October 1807; Maria Thereza, daughter of Manoel Fernandes and Andreza Maria, of the lugar da Torre, paternal grandparents Francisco Fernandes and Maria Francisca, of the same lugar, born 25 October and baptised 29 October 1807, godparents Francisco Domingues, solteiro, and Maria Thereza, daughter of Pedro Fernandes, all of the lugar da Torre; Antonio José, son of João Gonçalves and Marianna Domingues, of the lugar de Quintam, born 21 November 1807. None of these names Bento's parents; the Manoel Fernandes of the lugar da Torre, married to Andreza Maria, is a different man from Bento's father.]

  [image 494, fl. 162 — the end of Antonio José's entry, then Roza Maria, Miguel and Maria José, January 1808. Not this family.]
reading_reliability: complete
abstract: >-
  Original baptism entry, the last on fl. 161 of the São Romão da Ucha (Barcelos) baptism book,
  ending at the top of fl. 161v. Bento (in the body "Bento / Jose", in the margin "Bento") was
  born on 20 October 1807 and baptised on 21 October 1807 by the Padre João Gonçalves, cura of
  the parish. He was the legitimate son of Manoel Fernandes and Jozefa Maria, of the lugar de
  Quintam in Ucha. His paternal grandparents were Constantino Fernandes and his wife Roza Maria,
  of the same lugar. His maternal grandparents were André Domingues and his wife Maria Luiza, of
  the parish of Salvador da Lama, Couto de Azevedo. The godparents were Bento Gonçalves and
  Benta, solteira, the child's maternal aunt, both of Lama. The entry is in the hand of the
  Abbade Domingos Ribeiro Soares and signed by him and by the cura. It is identified with the
  baptism of Bento José Fernandes (P-0141). The identification is strong, not proven: the
  parents and lugar match those named in his children's baptisms, but his 1860 death entry gives
  an age that points to about 1800.
abstract_pt: >-
  Assento original de batismo, o último da fl. 161 do livro de batismos de São Romão da Ucha
  (Barcelos), que termina no alto da fl. 161v. Bento (no corpo "Bento / Jose", na margem
  "Bento") nasceu em 20 de outubro de 1807 e foi batizado em 21 de outubro de 1807 pelo Padre
  João Gonçalves, cura da freguesia. Era filho legítimo de Manoel Fernandes e de Jozefa Maria, do
  lugar de Quintam, na Ucha. Os avós paternos eram Constantino Fernandes e sua mulher Roza Maria,
  do mesmo lugar. Os avós maternos eram André Domingues e sua mulher Maria Luiza, da freguesia do
  Salvador da Lama, Couto de Azevedo. Foram padrinhos Bento Gonçalves e Benta, solteira, tia
  materna da criança, ambos da Lama. O assento é da mão do Abade Domingos Ribeiro Soares e
  assinado por ele e pelo cura. É identificado com o batismo de Bento José Fernandes (P-0141). A
  identificação é forte, não provada: os pais e o lugar coincidem com os nomeados nos batismos
  dos filhos dele, mas o assento de óbito de 1860 dá uma idade que aponta para cerca de 1800.
reliability:
  assessment: >-
    Original and direct, written at the time. It is primary for the birth and baptism dates, the
    child, the parents and the godparents; the grandparents and their places are secondary
    statements, hence mixed. Every core fact is legible on both pages: the date (the year is
    interlined above the first line and also follows from the neighbouring entries of 1807), the
    child, both parents and all four grandparents. The word "Jose" after "Bento" is cramped but
    legible.
  informant: >-
    The parish clergy of Ucha: the cura Padre João Gonçalves, who baptised, and the Abbade
    Domingos Ribeiro Soares, in whose hand the entry is written; both signed. The family details
    were presumably given by the parents.
  limitations: >-
    The record itself is clear; the limit is identity. The child is "Bento" (and "Jose" in the
    body), with no surname. Bento José Fernandes's own later records do not name his parents
    except through his children's baptisms (1829–1843), which give Manoel Fernandes and Jozefa
    Maria of Quintã. His probable death entry (PAR-0110, 1860) gives his age as sixty, which
    points to a birth about 1800, seven years before this baptism.
