notes:
- text: >-
    Identification with Bento José Fernandes (P-0141): strong, not proven. For it: the parents
    here, Manoel Fernandes and Jozefa Maria of the lugar de Quintam, are the paternal
    grandparents named in the baptisms of Bento José Fernandes's children at Ucha in 1829–1843
    (per the retrieval side; for Manoel João, PAR-0106). The lugar is the same. The body of the
    entry gives the name "Bento Jose", matching the "Bento José Fernandes" of the 1833 baptism.
    The maternal family is of Salvador da Lama, and in 1833 a sister of Bento José was married
    at Gondomar in Lama (PAR-0106). A birth in 1807 also fits a first child in 1829 and a wife
    born about 1810. Against it: the probable death entry of 1860 (PAR-0110) gives his age as
    sixty, which points to about 1800, and that entry is itself only probably his. No record
    states both his parentage and his identity as the husband of Joaquina Rosa Lopes.
  text_pt: >-
    Identificação com Bento José Fernandes (P-0141): forte, não provada. A favor: os pais aqui,
    Manoel Fernandes e Jozefa Maria, do lugar de Quintam, são os avós paternos nomeados nos
    batismos dos filhos de Bento José Fernandes na Ucha em 1829–1843 (segundo a pesquisa de
    recuperação; para Manoel João, PAR-0106). O lugar é o mesmo. O corpo do assento dá o nome
    "Bento Jose", que coincide com o "Bento José Fernandes" do batismo de 1833. A família materna é
    do Salvador da Lama, e em 1833 uma irmã de Bento José estava casada em Gondomar, na Lama
    (PAR-0106). Um nascimento em 1807 também condiz com um primeiro filho em 1829 e uma mulher
    nascida por volta de 1810. Contra: o provável assento de óbito de 1860 (PAR-0110) dá sessenta
    anos, o que aponta para cerca de 1800, e esse assento só provavelmente é dele. Nenhum registro
    declara ao mesmo tempo a filiação dele e a identidade de marido de Joaquina Rosa Lopes.
- text: >-
    The child's name. The margin has only "Bento". The body runs "nasceo Bento / Jose f.o
    legitimo"; at 3× zoom the first word of the second line reads J-o-s-e, a forename, followed
    by the abbreviation "f.o" (filho). The retrieval side's draft gave it as "José [?]" and
    suggested it might be a mis-written "filho"; since "f.o" follows it immediately, that reading
    is unlikely. The child's name in this entry is therefore "Bento Jose", not just "Bento".
  text_pt: >-
    O nome da criança. A margem tem apenas "Bento". O corpo diz "nasceo Bento / Jose f.o
    legitimo"; com ampliação de 3×, a primeira palavra da segunda linha lê-se J-o-s-e, um
    prenome, seguido da abreviatura "f.o" (filho). O rascunho da pesquisa de recuperação a dava
    como "José [?]" e sugeria que fosse um "filho" mal escrito; como "f.o" vem logo a seguir, essa
    leitura é improvável. O nome da criança neste assento é, portanto, "Bento Jose", e não só
    "Bento".
- text: >-
    Differences from the retrieval side's draft (bento-jose-fernandes.md §7.6, B1). The draft is
    confirmed throughout, including the interlined year, the catchword "do", both signatures and
    "thia materna". The tildes are kept as the Abbade wrote them ("Romaõ", "imposiçaõ", "Joaõ",
    "foraõ"). The draft's line 3 has "de São Romão da Ucha"; the image has "de S. Romaõ da Ucha".
    The draft's doubtful "José [?]" is read here as "Jose", unaccented.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação (bento-jose-fernandes.md §7.6,
    B1). O rascunho foi confirmado em tudo, incluindo o ano entrelinhado, o reclamo "do", as duas
    assinaturas e "thia materna". Os tis foram mantidos como o Abade os escreveu ("Romaõ",
    "imposiçaõ", "Joaõ", "foraõ"). A linha 3 do rascunho tem "de São Romão da Ucha"; a imagem tem
    "de S. Romaõ da Ucha". O duvidoso "José [?]" do rascunho é lido aqui como "Jose", sem acento.
- text: >-
    What the record adds, for modelling. It names Bento's parents (F-0072) and both pairs of
    grandparents: Constantino Fernandes and Roza Maria, of Quintam, Ucha (F-0074), and André
    Domingues and Maria Luiza, of Salvador da Lama, Couto de Azevedo (F-0075). The godmother
    Benta, solteira, is the child's "thia materna", that is, a daughter of André Domingues and
    Maria Luiza; she can be a documented child of F-0075. The godfather Bento Gonçalves, of Lama,
    is given no kinship. The mother is "Jozefa Maria" here, without "Domingues"; the surname
    Domingues for her comes from other records. On the following page a different Manoel
    Fernandes, of the lugar da Torre, married to Andreza Maria and son of Francisco Fernandes,
    had a daughter baptised on 29 October 1807. He is not Bento's father.
  text_pt: >-
    O que o registro acrescenta, para a modelagem. Nomeia os pais de Bento (F-0072) e os dois
    pares de avós: Constantino Fernandes e Roza Maria, de Quintam, Ucha (F-0074), e André
    Domingues e Maria Luiza, do Salvador da Lama, Couto de Azevedo (F-0075). A madrinha Benta,
    solteira, é "thia materna" da criança, isto é, filha de André Domingues e Maria Luiza; pode ser
    filha documentada da F-0075. O padrinho Bento Gonçalves, da Lama, não tem parentesco
    declarado. A mãe é aqui "Jozefa Maria", sem "Domingues"; o sobrenome Domingues para ela vem de
    outros registros. Na página seguinte, outro Manoel Fernandes, do lugar da Torre, casado com
    Andreza Maria e filho de Francisco Fernandes, batizou uma filha em 29 de outubro de 1807. Ele
    não é o pai de Bento.
