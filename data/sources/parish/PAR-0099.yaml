notes:
- text: >-
    This act supersedes the published dates for Gaspar's baptism. E-0135 was dated 23 February
    1657 from Mendes Forjaz Vol. IX alone; the original reads 23 December 1657, and Lacerda
    (PUB-0002, n.74, after an online mailing-list post) gives 23 September 1657. All three agree
    on the day (23) and the year; only the month differs. Nothing here explains the printed
    months, so no transcription error is asserted for either book.
  text_pt: >-
    Este assento substitui as datas publicadas do baptismo de Gaspar. O E-0135 estava datado de
    23 de fevereiro de 1657 só pelo Vol. IX de Mendes Forjaz; o original lê 23 de dezembro de
    1657, e Lacerda (PUB-0002, n.74, a partir de uma mensagem de lista de discussão on-line) dá
    23 de setembro de 1657. As três concordam no dia (23) e no ano; só o mês difere. Nada aqui
    explica os meses impressos, pelo que não se afirma erro de transcrição em nenhum dos livros.
- text: >-
    Namesakes on this one page. The godfather of entry 4 is another Gaspar de Souto mayor, son
    of Ba[…]z leonardes — Vol. IX's cousin (p.260), not P-0131. Entry 3 names a third namesake,
    "Gasp.ar Fer.ra do porto judeu", husband of the godmother Anna nunes. Neither is connected
    here to Gaspar Ferreira (P-0092) of the Toledo line, and none should be: the page shows how
    common the forename was in this kindred and parish.
  text_pt: >-
    Homónimos nesta mesma página. O padrinho do assento 4 é outro Gaspar de Souto mayor, filho
    de Ba[…]z leonardes — o primo do Vol. IX (p.260), não o P-0131. O assento 3 nomeia um
    terceiro homónimo, "Gasp.ar Fer.ra do porto judeu", marido da madrinha Anna nunes. Nenhum
    deles é aqui ligado a Gaspar Ferreira (P-0092), da linha Toledo, nem deve ser: a página
    mostra quão comum era o prenome nesta parentela e freguesia.
- text: >-
    The officiant signs entries 2–4 "Vig.ro Ant.º Coelho Soto mayor" (entry 1 "Vig.ro Soto
    mayor", entry 5 "Ant.º Coelho Sotto mayor"). This is the vicar António Coelho Souto-Maior,
    Belchior's brother (see P-0123 and PAR-0097/PAR-0098), so the child was baptised by his
    paternal uncle. That the parish vicar was a son of Belchior's parents is proven by the
    first-person burial acts of 1652 and 1654 (PAR-0097, PAR-0098); that the vicar was António
    rests on this signature and its neighbours [PROVEN] and on Vol. IX's filiation of him
    [COMPILED].
  text_pt: >-
    O oficiante assina os assentos 2 a 4 "Vig.ro Ant.º Coelho Soto mayor" (o assento 1 "Vig.ro
    Soto mayor", o assento 5 "Ant.º Coelho Sotto mayor"). É o vigário António Coelho
    Souto-Maior, irmão de Belchior (ver P-0123 e PAR-0097/PAR-0098); a criança foi, portanto,
    baptizada pelo tio paterno. Que o vigário da freguesia era filho dos pais de Belchior
    prova-se pelos assentos de óbito de 1652 e 1654, escritos em primeira pessoa (PAR-0097,
    PAR-0098); que o vigário era António assenta nesta assinatura e nas vizinhas [PROVEN] e na
    filiação que o Vol. IX lhe dá [COMPILED].
