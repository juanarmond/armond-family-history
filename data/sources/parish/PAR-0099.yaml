  [assento 5 de 5 — Joam, filho de lourenço [?] e de D. Izabel [?]; 23 de dezembro de 1657]
  [Margem:] Joam [e um sinal de visto por baixo]
  "Em vinte e tres dias do mes de dez.bro de mil seissentos e sinq- / enta e sete annos
  baptizei a Joam f.º de lourenço [entrelinhado, incerto: Cardozo] [borrão, ilegível]
  Gom[incerto: Gomes] / e de sua mulher D. Izabel me[ilegível]ans foram padrinhos [incerto:
  Christovão] / [ilegível] pimentel e luiza pacheca por verdade me assinei"
  [Assinatura:] Ant.º Coelho Sotto mayor
  [Desdobramentos: dez.bro = dezembro; D. = Dona. A margem direita deste assento entra numa
  dobra da folha.]
reading_reliability: complete
abstract: >-
  Original baptism act of Gaspar de Souto Maior (P-0131), the fourth of five entries on p.0324
  of the São Sebastião (Terceira) baptism book TER-AH-SAOSEBASTIAO-B-1611-1687, read from a
  300-dpi scan that BPAR Angra do Heroísmo made of the original for the owner (Requisição nº
  101, image 1). On 23 December 1657 the vicar baptised "Gasp.ar", son of "the Alferes
  belchior da ponte cardozo" (P-0123) and "his wife mariana Fag.des" (P-0124), family F-0062.
  The godparents were Gaspar de Souto mayor, son of Ba[…]z leonardes — a namesake cousin, not
  this child — and Anna machada, daughter of Sebastião Roiz pacheco. The act is signed by the
  vicar António Coelho Soto mayor, the child's paternal uncle. The register's 23 December 1657
  overrides the 23.2.1657 printed by Mendes Forjaz Vol. IX (PUB-0005) and the 23 September 1657
  given in Lacerda's thesis (PUB-0002, n.74). It is the first record held here that names this
  Gaspar's parents, and it shows Belchior already styled Alferes in 1657.
abstract_pt: >-
  Assento original de baptismo de Gaspar de Souto Maior (P-0131), o quarto de cinco assentos da
  p.0324 do livro de baptismos de São Sebastião (Terceira) TER-AH-SAOSEBASTIAO-B-1611-1687, lido
  numa digitalização a 300 dpi feita pelo BPAR de Angra do Heroísmo a partir do original, a
  pedido do proprietário (Requisição nº 101, imagem 1). A 23 de dezembro de 1657 o vigário
  baptizou "Gasp.ar", filho "do Alferes belchior da ponte cardozo" (P-0123) e "de sua molher
  mariana Fag.des" (P-0124), família F-0062. Foram padrinhos Gaspar de Souto mayor, filho de
  Ba[…]z leonardes — um primo homónimo, não esta criança — e Anna machada, filha de Sebastião
  Roiz pacheco. O assento é assinado pelo vigário António Coelho Soto mayor, tio paterno da
  criança. O 23 de dezembro de 1657 do registo prevalece sobre o 23.2.1657 impresso no Vol. IX
  de Mendes Forjaz (PUB-0005) e sobre o 23 de setembro de 1657 dado na tese de Lacerda (PUB-0002,
  n.74). É o primeiro registo aqui guardado que nomeia os pais deste Gaspar, e mostra Belchior
  já com o posto de Alferes em 1657.
reliability:
  assessment: >-
    Primary, original and direct for the baptism, its date, the child's forename, both parents
    and the godparents: the act was written and signed by the officiating vicar at the time. At
    300 dpi every core fact of entry 4 is legible — date (written out: "vinte e tres dias do mes
    de dezembro de seis sentos sinquenta e sete annos"), child ("Gasp.ar"), father ("do Alferes
    belchior da ponte cardozo"), mother ("sua molher mariana Fag.des") — so reading_reliability
    is complete. Date conflict: the original reads 23 DECEMBER 1657; Mendes Forjaz Vol. IX
    (PUB-0005, p.261) prints "b. em S. Sebastião a 23.2.1657" and Lacerda's thesis footnote 74
    (PUB-0002) "23 de setembro de 1657". The register governs; the two printed dates are
    recorded as variants, not averaged. Identity: the child is named only "Gaspar" here; "de
    Souto Maior" is supplied by Vol. IX and by his later records, and the identification with
    the man who died on 2 December 1727 (PAR-0100) rests on the age at death and the wife named
    there (see E-0137).
  informant: >-
    The vicar of São Sebastião, António Coelho Soto mayor (the child's paternal uncle), who
    officiated and signed
  limitations: >-
    The child's surname is not written. The godfather is a DIFFERENT Gaspar de Souto Maior,
    "f.º de Ba[…]z leonardes" — the cousin listed in Vol. IX p.260 as son of Águeda Simões
    Cardoso and Baltazar Gonçalves Leonardes (Capitão de ordenanças, married D. Ana de Sousa at
    Porto Judeu in 1687, S.g.) — precisely the namesake confusion this repository is correcting;
    his father's abbreviated name is not legible letter by letter. Peripheral uncertain reads
    remain in the other four entries (two surnames read "nunes", parts of entry 5 at a fold).
    The page header is torn. The leaf is paper with show-through from the verso, which does not
    obscure entry 4.
