  [assento 2 de 5 — Maria, filha de Izabel nunes, pai não sabido; 13 de dezembro de 1657]
  [Margem:] [Ma]ria [as primeiras letras apagadas]
  "Em os treze dias do mes de dezembro de mil e seissentos e cin- / quenta e sete annos
  baptizei Maria filha de Izabel / nunes [incerto: nunes] pai não sabido foi padrinho o R.do
  P.e Pedro / Borges pacheco por verdade me assinei"
  [Assinatura:] Vig.ro Ant.º Coelho Soto mayor
  [Desdobramentos: R.do P.e = Reverendo Padre.]

  [assento 3 de 5 — Ant.ª, filha de manoel m.iz e de Izabel de matos; 20 de dezembro de 1657]
  [Margem:] An.ta
  "Em os vinte de dezembro de seis sentos e sinquenta / e sete annos baptizei Ant.ª filha de
  manoel m.iz e de / sua molher Izabel de matos foram padrinhos Ant.º / machado f.º de
  sebastião gato valadão e Anna / nunes [incerto: nunes] m.er de Gasp.ar Fer.ra do porto
  judeu por verdade / me assinei"
  [Assinatura:] Vig.ro Ant.º Coelho Soto mayor
  [Desdobramentos: Ant.ª / An.ta = Antónia; m.iz = Martins; f.º = filho; Gasp.ar Fer.ra =
