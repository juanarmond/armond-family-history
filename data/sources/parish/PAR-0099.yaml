transcription: >-
  [Whole page — São Sebastião baptisms, book TER-AH-SAOSEBASTIAO-B-1611-1687, p.0324; BPAR
  300-dpi scan of the original, Requisição nº 101, image 1. Five entries, 26 November – 23
  December 1657, each signed by the vicar. " / " marks a line break of the original. Spelling,
  capitals and abbreviations are kept as written; expansions follow each entry in a separate
  bracket. Read from the TIFF 2026-10-10.]

  [Page head: a header at the top right, torn and repaired — illegible. A small pen mark at the
  top centre.]

  [entry 1 of 5 — Ant.º, son of Ant.º machado de faria; 26 November 1657]
  [Margin:] [A]nt.º [uncertain — the first letter is in the binding]
  "Em os vinte e seis dias do mes de 9.bro [uncertain: 9.bro] de seis sentos / sinquenta e sete
  annos baptizei a Ant.º filho de / Ant.º machado de faria e de sua m.er M.ª pache- / ca foi
  padrinho joão Coelho filho do Ca- / pitão joão Coelho por verdade me assinei"
  [Signature:] Vig.ro Soto mayor
  [Expansions: 9.bro = novembro; Ant.º = António; m.er = molher; M.ª = Maria; Vig.ro =
  vigário.]

  [entry 2 of 5 — Maria, daughter of Izabel nunes, father not known; 13 December 1657]
  [Margin:] [Ma]ria [the first letters faded]
  "Em os treze dias do mes de dezembro de mil e seissentos e cin- / quenta e sete annos
  baptizei Maria filha de Izabel / nunes [uncertain: nunes] pai não sabido foi padrinho o R.do
  P.e Pedro / Borges pacheco por verdade me assinei"
  [Signature:] Vig.ro Ant.º Coelho Soto mayor
  [Expansions: R.do P.e = Reverendo Padre.]

  [entry 3 of 5 — Ant.ª, daughter of manoel m.iz and Izabel de matos; 20 December 1657]
  [Margin:] An.ta
  "Em os vinte de dezembro de seis sentos e sinquenta / e sete annos baptizei Ant.ª filha de
  manoel m.iz e de / sua molher Izabel de matos foram padrinhos Ant.º / machado f.º de
  sebastião gato valadão e Anna / nunes [uncertain: nunes] m.er de Gasp.ar Fer.ra do porto
  judeu por verdade / me assinei"
  [Signature:] Vig.ro Ant.º Coelho Soto mayor
  [Expansions: Ant.ª / An.ta = Antónia; m.iz = Martins; f.º = filho; Gasp.ar Fer.ra = Gaspar
  Ferreira.]

  [entry 4 of 5 — TARGET: Gaspar, son of the Alferes belchior da ponte cardozo and mariana
  Fag.des; 23 December 1657]
  [Margin:] Gasp.ar
  "Em os vinte e tres dias do mes de dezembro de seis sen- / tos sinquenta e sete annos
  baptizei a Gasp.ar filho / do Alferes belchior da ponte cardozo e de sua / molher mariana
  Fag.des foram padrinhos Gasp.ar / de Souto mayor f.º de Ba[uncertain: abbreviated forename
  and patronymic, read "bar" followed by a looped "-yz"/"-gz" group]z leonardes e Anna /
  machada filha de sebastião Roiz pacheco por / verdade me assinei"
  [Signature:] Vig.ro Ant.º Coelho Soto mayor
  [Expansions: Gasp.ar = Gaspar; Fag.des = Fagundes; f.º = filho; Roiz = Rodrigues. The
  godfather's father is written in an abbreviation that is not legible letter by letter; it is
  consistent with "Ba[ltazar] G[onça]l[ve]z", the Baltazar Gonçalves Leonardes of Mendes
  Forjaz Vol. IX p.259, but that expansion is an inference, not a reading.]

  [entry 5 of 5 — Joam, son of lourenço [?] and D. Izabel [?]; 23 December 1657]
  [Margin:] Joam [and a tick mark below]
  "Em vinte e tres dias do mes de dez.bro de mil seissentos e sinq- / enta e sete annos
  baptizei a Joam f.º de lourenço [interlinear, uncertain: Cardozo] [blot, illegible]
  Gom[uncertain: Gomes] / e de sua mulher D. Izabel me[illegible]ans foram padrinhos
  [uncertain: Christovão] / [illegible] pimentel e luiza pacheca por verdade me assinei"
  [Signature:] Ant.º Coelho Sotto mayor
  [Expansions: dez.bro = dezembro; D. = Dona. The right edge of this entry runs into a fold of
  the leaf.]
