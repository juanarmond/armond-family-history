  [assento 4 de 5 — ALVO: Gaspar, filho do Alferes belchior da ponte cardozo e de mariana
  Fag.des; 23 de dezembro de 1657]
  [Margem:] Gasp.ar
  "Em os vinte e tres dias do mes de dezembro de seis sen- / tos sinquenta e sete annos
  baptizei a Gasp.ar filho / do Alferes belchior da ponte cardozo e de sua / molher mariana
  Fag.des foram padrinhos Gasp.ar / de Souto mayor f.º de Ba[incerto: prenome e patronímico
  abreviados, lidos "bar" seguido de um grupo em laçada "-yz"/"-gz"]z leonardes e Anna /
  machada filha de sebastião Roiz pacheco por / verdade me assinei"
  [Assinatura:] Vig.ro Ant.º Coelho Soto mayor
  [Desdobramentos: Gasp.ar = Gaspar; Fag.des = Fagundes; f.º = filho; Roiz = Rodrigues. O pai
  do padrinho está escrito numa abreviatura que não se lê letra a letra; é compatível com
  "Ba[ltazar] G[onça]l[ve]z", o Baltazar Gonçalves Leonardes do Vol. IX de Mendes Forjaz,
