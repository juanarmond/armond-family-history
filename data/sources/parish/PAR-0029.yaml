abstract: >-
  Grindel (Solothurn) Catholic parish marriage register, page 71, entry 4,
  records the marriage of Jacobus Wehrli [Johann Jacob Wehrli, P-0072] and
  Elisabetha Borer (P-0073) on 27 January 1782, both described as being from
  Grindel, Erischwyg (Erschwil). Witnesses were Heinricus Werli (= Henri Wehrli,
  probably Johann Jacob's brother) and Catharina Borer (possibly Elisabetha's
  sister or other kin). This is PRIMARY evidence for the marriage of P-0072 × P-0073,
  upgrading event E-0065 from strong-evidence to confirmed. This source is held
  in a FamilySearch FHC-restricted collection (ARK 3:1:3Q9M-CSVK-NSXR-C).
abstract_pt: >-
  O livro de casamentos da paróquia católica de Grindel (Solothurn), página 71,
  assento 4, registra o casamento de Jacobus Wehrli [Johann Jacob Wehrli, P-0072] e
