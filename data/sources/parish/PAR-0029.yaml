transcription: >-
  [Catholic parish marriage register, Grindel, Solothurn. Page 71, entry 4.
  Full Latin transcription of the entry:]

  Die 27ma Januarii 1782 ego [officiating priest name, not fully legible]
  matrimonio junxi Jacobum Wehrlia[m] et Elisabetham Borer ambo ex Grindel,
  Erischwyg. Testes fuerunt Heinricus Werli et Catharina Borer.

  [Translation: "On the 27th day of January 1782 I [officiating priest]
  joined in matrimony Jacobus Wehrlia[m] [= Johann Jacob Wehrli] and
  Elisabetha Borer, both from Grindel, Erischwyg. The witnesses were
  Heinricus Werli [= Heinrich/Henri Wehrli] and Catharina Borer."]
