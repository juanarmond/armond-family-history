notes:
- text: >-
    Witness Heinricus Werli is likely Johann Jacob Wehrli's brother Henri — a
    separate birth record for a "Heinricus" son of Jacoby Wehrli × Elisabetha
    Borer appears in the Grindel 1781–1784 baptism register (1 November 1783),
    placing Henri's birth after the marriage, consistent with Henri being a son of
    this couple rather than a pre-existing brother. The witness role at the marriage
    may instead be a brother or cousin of the groom named Heinrich/Heinricus Wehrli.
- text: >-
    Catharina Borer, the second witness, is probably Elisabetha's sister or a close
    Borer kinswoman — the Borer surname was common in Erschwil and the Grindel area.
- text: >-
    Basis for "Catholic" — EXPLICIT in the record, not merely inferred (verified
    against the image 2026-08-10): the page's own section heading reads "Catalogus.
    Eorum qui juxta normam S. Concilii Tridentini Sacro Matrimonii Vinculo juncti
    sunt … 1780" — a register of marriages performed "according to the norm of the
    Holy Council of Trent." The Council of Trent (Tridentine decree Tametsi, 1563) is
    the defining Roman Catholic authority that created parish marriage registers;
    Protestant/Reformed churches rejected it. This is corroborated by the ecclesiastical
    Latin throughout, the parish priest (Parochus) Ursus Victor Grütz, and the
    jurisdiction — Grindel, Bezirk Thierstein / Schwarzbubenland, canton of Solothurn,
    under the Roman Catholic Diocese of Basel (Bistum Basel-Solothurn). The family's
    Catholic confession is therefore documented, not a surname inference.
