transcription: >-
  [Catholic parish marriage register, Grindel, Solothurn. Page 71. The section
  heading reads: "Catalogus. Eorum qui juxta normam S. Concilii Tridentini Sacro
  Matrimonii Vinculo juncti sunt. Incipiendo ab Anno Domini d.ni J. Chr. 1780" —
  i.e. a register of marriages contracted according to the norm of the (Roman
  Catholic) Council of Trent, begun in 1780. The Jacobus Werly × Elisabetha Borer
  entry is the fourth on the page:]

  Die 27ma Januarii 1782. In facie Ecclesiae fidem Matrimonialem Spoponderunt
  Honestus Juvenis Jacobus Werly et Elisabetha Borer ambo ex Grindel[-Erschwyl].
  Testes fuerunt Heinricus Werly et Catharina Borer.

  [Translation: "On the 27th day of January 1782, in the face of the Church, the
  honourable youth Jacobus Werly [= Johann Jacob Wehrli] and Elisabetha Borer,
  both of Grindel[-Erschwyl], pledged the marital bond. The witnesses were
  Heinricus Werly [= Heinrich/Henri Wehrli] and Catharina Borer."]
  [Correction 2026-08-10: the earlier stored reading "ego … matrimonio junxi
  Jacobum Wehrliam …" was a paraphrase; the register's actual formula is "In facie
  Ecclesiae fidem Matrimonialem Spoponderunt …", verified against the image. Nearby
  entries name the parish priest (Parochus) Ursus Victor Grütz and use the same
  Tridentine formulae (denuntiationes/banns, in facie Ecclesiae, testes).]
transcription_pt: >-
  [Livro de casamentos da paróquia católica de Grindel, Solothurn. Página 71. O
  cabeçalho da seção diz: "Catalogus. Eorum qui juxta normam S. Concilii Tridentini
  Sacro Matrimonii Vinculo juncti sunt. Incipiendo ab Anno Domini d.ni J. Chr. 1780"
  — ou seja, um registro de casamentos contraídos segundo a norma do Concílio de
  Trento (católico romano), iniciado em 1780. O assento de Jacobus Werly × Elisabetha
  Borer é o quarto da página:]

  Die 27ma Januarii 1782. In facie Ecclesiae fidem Matrimonialem Spoponderunt
  Honestus Juvenis Jacobus Werly et Elisabetha Borer ambo ex Grindel[-Erschwyl].
  Testes fuerunt Heinricus Werly et Catharina Borer.

  [Tradução: "No dia 27 de janeiro de 1782, na presença da Igreja, o honrado jovem
  Jacobus Werly [= Johann Jacob Wehrli] e Elisabetha Borer, ambos de Grindel[-Erschwyl],
  prometeram o vínculo matrimonial. As testemunhas foram Heinricus Werly [=
  Heinrich/Henri Wehrli] e Catharina Borer."]
  [Correção de 2026-08-10: a leitura antes armazenada, "ego … matrimonio junxi
  Jacobum Wehrliam …", era uma paráfrase; a fórmula real do registro é "In facie
  Ecclesiae fidem Matrimonialem Spoponderunt …", conferida na imagem. Os assentos
  vizinhos nomeiam o pároco (Parochus) Ursus Victor Grütz e usam as mesmas fórmulas
  tridentinas (denuntiationes/proclamas, in facie Ecclesiae, testes).]
abstract: >-
  Grindel (Solothurn) Catholic parish marriage register, page 71, entry 4,
  records the marriage of Jacobus Wehrli [Johann Jacob Wehrli, P-0072] and
  Elisabetha Borer (P-0073) on 27 January 1782, both described as being from
  Grindel, Erischwyg (Erschwil). Witnesses were Heinricus Werli (= Henri Wehrli,
  probably Johann Jacob's brother) and Catharina Borer (possibly Elisabetha's
  sister or other kin). This is PRIMARY evidence for the marriage of P-0072 × P-0073,
  upgrading event E-0065 from strong-evidence to confirmed. This source is held
  in a FamilySearch FHC-restricted collection (ARK 3:1:3Q9M-CSVK-NSXR-C).
abstract_pt: >-
  O livro de casamentos da paróquia católica de Grindel (Solothurn), página 71,
  assento 4, registra o casamento de Jacobus Wehrli [Johann Jacob Wehrli, P-0072] e
  Elisabetha Borer (P-0073) em 27 de janeiro de 1782, ambos descritos como sendo de
  Grindel, Erischwyg (Erschwil). As testemunhas foram Heinricus Werli (= Henri
  Wehrli, provavelmente irmão de Johann Jacob) e Catharina Borer (possivelmente irmã
  de Elisabetha ou outra parente). É evidência PRIMÁRIA do casamento de P-0072 ×
  P-0073, elevando o evento E-0065 de strong-evidence a confirmed. Esta fonte está
  em uma coleção do FamilySearch de acesso restrito a FHC (ARK
  3:1:3Q9M-CSVK-NSXR-C).
reliability:
  assessment: >-
    Original contemporaneous Catholic parish marriage register entry. The parties
    are identified by name and parish (Grindel, Erischwyg/Erschwil). The witness
    Heinricus Werli (same family name as the groom) is consistent with the Casa
    Suíça DB record of a son "Henri" born to this couple (PUB-0003 confirmed by
    the 1783 Grindel baptism register entry for "Heinricus" son of Jacoby Werl ×
    Elisabetha Borer in the 1781–1784 register). The image delivers the full marriage
    register entry. FHC-restricted access means verification requires FamilySearch
    Family History Center access.
  informant: >-
