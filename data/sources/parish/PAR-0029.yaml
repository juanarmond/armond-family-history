  Grindel, Erischwyg (Erschwil). As testemunhas foram Heinricus Werli (= Henri
  Wehrli, provavelmente irmão de Johann Jacob) e Catharina Borer (possivelmente irmã
  de Elisabetha ou outra parente). É evidência PRIMÁRIA do casamento de P-0072 ×
  P-0073, elevando o evento E-0065 de strong-evidence a confirmed. Esta fonte está
  em uma coleção do FamilySearch de acesso restrito a FHC (ARK
  3:1:3Q9M-CSVK-NSXR-C).
reliability:
  assessment: >-
    Original contemporaneous Catholic parish marriage register entry. The parties
    are identified by name and parish (Grindel, Erischwyg/Erschwil). The witness
    Heinricus Werli (same family name as the groom) is consistent with the Casa
    Suíça DB record of a son "Henri" born to this couple (PUB-0003 confirmed by
    the 1783 Grindel baptism register entry for "Heinricus" son of Jacoby Werl ×
    Elisabetha Borer in the 1781–1784 register). The image delivers the full marriage
    register entry. FHC-restricted access means verification requires FamilySearch
    Family History Center access.
  informant: >-
    The recording priest of the Grindel Catholic parish at the time of the marriage,
    27 January 1782.
  limitations: >-
    FHC-restricted access (ARK 3:1:3Q9M-CSVK-NSXR-C); available only at a
    FamilySearch Family History Center. The officiating priest's name is not
    fully legible in the retrieved image.
