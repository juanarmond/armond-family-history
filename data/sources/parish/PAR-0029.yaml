notes:
- text: >-
    Witness Heinricus Werli is likely Johann Jacob Wehrli's brother Henri — a
    separate birth record for a "Heinricus" son of Jacoby Wehrli × Elisabetha
    Borer appears in the Grindel 1781–1784 baptism register (1 November 1783),
    placing Henri's birth after the marriage, consistent with Henri being a son of
    this couple rather than a pre-existing brother. The witness role at the marriage
    may instead be a brother or cousin of the groom named Heinrich/Heinricus Wehrli.
- text: >-
    Catharina Borer, the second witness, is probably Elisabetha's sister or a close
    Borer kinswoman — the Borer surname was common in Erschwil and the Grindel area.
- text: >-
    Basis for "Catholic" (documented inference, not a surname guess): this entry is
    written in ecclesiastical Latin ("Die 27ma Januarii 1782 ego … matrimonio junxi …
    Testes fuerunt"), the Roman Catholic sacramental form; contemporary Swiss Reformed
    marriage registers were kept in German. Grindel is in Bezirk Thierstein /
    Schwarzbubenland, canton of Solothurn, under the Roman Catholic Diocese of Basel
    (Bistum Basel-Solothurn). The confession is established by liturgical language and
    ecclesiastical jurisdiction, not by the family surnames.
