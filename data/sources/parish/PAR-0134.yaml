notes:
- text: >-
    Comparison with the producer's draft (§8.4): the draft is confirmed word for word,
    including "de dez horas de edade", "São Romão da Ulha", "Anna Esposta" and the burial at
    five in the afternoon of the 18th ("desoito"). The only change is that the second letter
    of "Esposta" in the margin is marked uncertain.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): o rascunho confirma-se palavra por palavra,
    inclusive "de dez horas de edade", "São Romão da Ulha", "Anna Esposta" e o sepultamento às
    cinco da tarde do dia 18 ("desoito"). A única mudança é que a segunda letra de "Esposta" na
    margem fica marcada como incerta.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and parish (Ulha for Ucha) and the mother as a foundling of unknown origin. Same
    parents, same day and an age of hours tie this Maria to the girl born at noon on 17
    September 1870 and baptised at home "por perigo de Vida" (PAR-0133). Strong, not proven.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a freguesia
    do pai (Ulha por Ucha) e a mãe como exposta de origem ignorada. Os mesmos pais, o mesmo dia
    e uma idade de horas ligam esta Maria à menina nascida ao meio-dia de 17 de setembro de
    1870 e batizada em casa "por perigo de Vida" (PAR-0133). Forte, não provada.
- text: >-
    What it adds: the death of the third Maria on the day of her birth, eight days after the
    death of her brother João (PAR-0132); the father a tailor and the mother a seamstress in
    1870. As a collateral record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: a morte da terceira Maria no dia do seu nascimento, oito dias depois da
    morte do irmão João (PAR-0132); o pai alfaiate e a mãe costureira em 1870. Como registro
    colateral, não se liga a nenhum evento; linked_events fica vazio de propósito.
- text: >-
    The last entry on the page, Nº 26 (Luiza, died 26 September 1870 at the logar do Souto),
    names her parents only on the next leaf, which is not held. Nothing on this image ties her
    to the family; the will's count of nine children is already met without her.
  text_pt: >-
    O último assento da página, nº 26 (Luiza, falecida em 26 de setembro de 1870 no lugar do
    Souto), só nomeia os pais na folha seguinte, que não está disponível. Nada nesta imagem a
    liga à família; a contagem de nove filhos do testamento já se cumpre sem ela.
