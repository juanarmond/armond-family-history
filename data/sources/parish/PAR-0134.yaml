transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, death section. FamilySearch DGS 004670017, image 00164: the opening fl. 159v (left) – fl. 160 (right). Read from the native image on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0134-death-maria-1870-pousa.jpg; DGS 004670017 image 00164; fl. 160, 1870 entry Nº 24]

  [Right page head (fl. 160): the folio number "160" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 159v, top — the end of entry Nº 21: Maria, aged four months, daughter of Antonio da Silva and Maria Magdalena, lavradores, of the logar do Sobreouteiro; buried on the 14th; signed by the Abbade Manoel José d'Oliveira Guimarães.]

  [fl. 159v, Nº 22 — Rosa, aged twenty-five months, daughter of Antonio Loureiro do Monte and Maria Thereza Dias, of the logar da Devesa; died 16 September 1870.]

  [fl. 159v, Nº 23 — Antonio, aged five months, son of José Joaquim de Macedo and Antonia Loureiro, of the logar d'Amproa; died 17 September 1870.]

  [fl. 160, Nº 24 — TARGET]
  [Margin:]
  N.º 24
  Maria,
