  [Body:]
  Aos dezesete dias do mez de setembro do anno de mil oito centos setenta,
  pelas onze horas da noute, no logar do Souto desta freguesia da Pousa,
  concelho de Barcellos, diocese de Braga, falleceo um individuo do sexo fe-
  minino por nome Maria, de dez horas de edade, natural e morado-
  ra nesta freguesia, filha legitima de Manoel João Fernandes,
  alfaiate, natural da freguesia de São Romão da Ulha, con-
  celho de Barcellos, diocese de Braga, e Anna Esposta, cuja na-
  turalidade se ignora, costureira, parochianos desta freguesia,
  e moradores no logar do Souto da mesma, a qual foi sepul-
  tada dentro da Egreja Parochial, por não haver cemiterio,
  ás cinco horas da tarde do dia desoito dos referidos mez
  e anno. E para constar lavrei em duplicado este assento
  que assigno. Era ut supra. O Abbade Manoel José d'Oliveira Guimarães
  [Reading notes: "Ulha" is written plainly with an "l"; the father's other records give São Romão da Ucha. "Esposta" = exposta, foundling; in the body the second letter reads "s"; in the margin it is a looped form that could be the scribe's x and is marked uncertain. Gloss: noute = noite.]

  [fl. 160, Nº 25 — João, aged three, son of Antonio Martins, pedreiro, natural of Alheira, and Luiza Maria da Silva, jornaleira, natural of São Vicente d'Areas, of the logar de Penedella; died 21 September 1870.]

  [fl. 160 foot — Nº 26, Luiza, died 26 September 1870 at the logar do Souto; her parents are named beyond this image, which is not held.]
reading_reliability: complete
abstract: >-
  Original death entry Nº 24 of 1870 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. At eleven at night on 17 September 1870, at the logar do Souto, died Maria, aged
  ten hours, born and living in Pousa, legitimate daughter of Manoel João Fernandes, tailor,
  natural of the parish of "São Romão da Ulha" (Barcelos), and of Anna Esposta (a foundling),
  "cuja naturalidade se ignora", seamstress, parishioners of Pousa living at the logar do
  Souto. She was buried inside the parish church, for want of a cemetery, at five in the
  afternoon of the 18th. The Abbade Manoel José d'Oliveira Guimarães wrote and signed the
  entry. The parents are Manoel João Fernandes (P-0139) and Anna Maria, "Anna Exposta"
  (P-0140); the child is very probably the Maria born at noon that day and baptised at home in
  danger of death (PAR-0133).
abstract_pt: >-
  Assento original de óbito nº 24 de 1870 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. Às onze da noite de 17 de setembro de 1870, no lugar do Souto, faleceu Maria, de
  dez horas de idade, natural e moradora em Pousa, filha legítima de Manoel João Fernandes,
  alfaiate, natural da freguesia de "São Romão da Ulha" (Barcelos), e de Anna Esposta (uma
  enjeitada), "cuja naturalidade se ignora", costureira, paroquianos de Pousa moradores no
  lugar do Souto. Foi sepultada dentro da igreja paroquial, por falta de cemitério, às cinco
  da tarde do dia 18. O abade Manoel José d'Oliveira Guimarães redigiu e assinou o assento. Os
  pais são Manoel João Fernandes (P-0139) e Anna Maria, "Anna Exposta" (P-0140); a criança é
  muito provavelmente a Maria nascida ao meio-dia desse dia e batizada em casa em perigo de
  vida (PAR-0133).
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating rector. It is primary for the
    death, its date, hour and place, the burial and the parents as named, and secondary for
    the child's age and the parents' trades and origins; hence mixed. Every core fact is
    legible, so reading_reliability is complete; the uncertain marks fall only on one letter
    of the mother's descriptor in the margin and on the page rubric.
  informant: >-
    Not named. The entry was written and signed by the Abbade Manoel José d'Oliveira
    Guimarães.
  limitations: >-
    "Ulha" is a scribal form of the father's parish, written as Ucha in his other records. The
    stated age of ten hours is approximate: from the birth at noon (PAR-0133) to the death at
    eleven at night is about eleven hours. The entry names no grandparent and does not cite the
    baptism; tying it to PAR-0133 is strong, not proven.
