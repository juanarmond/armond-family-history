- text: >-
    Basis for "Catholic" — documented, not a surname guess: Erschwil lies in Bezirk
    Thierstein / Schwarzbubenland, canton of Solothurn, under the Roman Catholic Diocese
    of Basel (Bistum Basel-Solothurn), and had a Catholic parish by the 18th century. The
    companion Grindel register in the same series carries explicit Roman Catholic markers
    verified against the image 2026-08-10: the marriage register (PAR-0029) is headed
    "juxta normam S. Concilii Tridentini" (according to the norm of the Council of Trent),
    and the baptism register (PAR-0027) uses the Latin sacramental headers Parentes /
    Infantes / Patrini (godparents). The confession is established by ecclesiastical
    jurisdiction and liturgical practice, not by the family surnames.
