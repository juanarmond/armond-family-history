abstract: >-
  Erschwil (Erischwyg, Solothurn) Catholic parish baptism register, church
  book #68, records the baptism of "Ecisabeth" [Elisabetha] Borer on 17 June
  1760. Her parents are named as "Joseph Borer fusemnistr" (P-0076) and
  "anna Maria Borer" (P-0077). This is PRIMARY evidence for the birth date and
  parentage of Elisabetha Borer (P-0073), who later married Johann Jacob Wehrli
  (P-0072) in Grindel on 27 January 1782. The godfather is "Joseph Borer gmüpl"
  and godmother "Mari Elisabth Borr fallend" — likely kin within the Borer
  family network of the Solothurn district.
reliability:
  assessment: >-
    Original contemporaneous Catholic parish register entry made by the officiating
    priest at baptism — primary information. The image delivers the full register
    page. The child's name "Ecisabeth" is a scribal variant of "Elisabetha," consistent
    with the name recorded in the Grindel marriage register of 1782 (PAR-0029).
    The parental surname "Borer" appears throughout the page, consistent with the
    known Borer family cluster in the Erschwil/Grindel area.
  informant: >-
    The recording priest of the Erschwil Catholic parish at the time of baptism,
    17 June 1760.
  limitations: >-
    The abbreviated titles "fusemnistr" and "gmüpl" for Joseph Borer's role/office
    are not fully deciphered. A duplicate crop of this same page was also received
    (rec-bohrer-borer-parish-register-grindel-c1760.jpg, misnamed "grindel") —
    both are identical in content.
