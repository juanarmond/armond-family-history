abstract: >-
  Primary parish death record for Belchior da Ponte Cardoso (P-0123), died 26 June 1687
  in São Sebastião, Terceira. The marginal index annotation reads "Balchior / de Ponte"
  (= Belchior da Ponte) and the main text records: "Em os vinte e seis dias do mes de Junho
  de mil e seis sentos e oitenta e sete annos faleceo o Alferes [B]elchior de Ponte
  Cardozo." [Corrected 2026-10-08: earlier read "Balchios".] His military rank Alferes de ordenanças is noted. The death date 26 June 1687 is an exact
  match for Vol. IX (PUB-0005). This primary image upgrades E-0127 from strong-evidence to
  confirmed. Officiating vicar was Domingos Cardoso Fora.
abstract_pt: >-
  Registo paroquial primário do óbito de Belchior da Ponte Cardoso (P-0123), falecido
  a 26 de junho de 1687 em São Sebastião, Terceira. A anotação marginal de índice lê
  "Balchior / de Ponte" (= Belchior da Ponte) e o texto principal regista: "Em os vinte e
  seis dias do mes de Junho de mil e seis sentos e oitenta e sete annos faleceo o Alferes
  [B]elchior de Ponte Cardozo." [Corrigido em 2026-10-08: antes lido "Balchios".] A
  patente militar de Alferes de ordenanças está anotada. A data de
  óbito 26 de junho de 1687 corresponde exactamente ao Vol. IX (PUB-0005). Esta imagem
  primária actualiza E-0127 de strong-evidence para confirmed. O vigário officiante foi
  Domingos Cardoso Fora.
reliability:
  assessment: >-
    Primary source (original parish death register). The marginal index annotation names
    "Balchior de Ponte" and the main entry reads the day (26), month (June) and year (1687)
    in full — exact match with PUB-0005. The main text names him "o Alferes [B]elchior de
    Ponte Cardozo"; the margin's "Balchior" is a period orthographic variant of Belchior.
    (An earlier transcription read both as "Balchios"; corrected 2026-10-08.) The Alferes de ordenanças rank is
    consistent with PUB-0005 and PAR-0086. Evidence quality: confirmed.
  informant: Vicar Domingos Cardoso Fora, São Sebastião, Terceira, recording the death in 1687
  limitations: >-
    Some text is partially legible (indicated by square brackets). Single image page held;
    no context page. Resolution: 1299×944 px.
