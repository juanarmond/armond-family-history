notes:
- text: >-
    Vol. IX (PUB-0005) footnote 9 notes that Belchior "Deve ter morrido de repente pois é
    ele que assina o registo de óbito anterior, lavrado a 6 de Junho" — he had signed the
    previous death register entry (20 days before his own death), suggesting sudden death.
    This primary image confirms the death date and the Alferes de ordenanças rank.
- text: >-
    The name variant "Balchios" / "Balchion" appears in the São Sebastião óbito registers
    as the local scribal orthography for "Belchior". See also PAR-0089 (Mariana's death
    record, which refers to her husband as "M° Balchion de Ponte").
