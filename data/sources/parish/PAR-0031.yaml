transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Entrada
  do lado esquerdo, primeira da página, margem lateral "Anna".] "Aos doze dias do
  mês de Fevereiro de mil oitocentos e trinta e quatro anos nesta Matriz de
  Itaborahy, de licença, eu batizei os Santos Óleos a inocente Anna, filha
  legítima de Manoel de Lemos Ferreira e da Maria Nunes de Jesus, naturais da
  Freguesia; foram Padrinhos José Antonio e Anna Roza de Guimarães, dos que
  mandei fazer este assento que assinei. Regist[rei]. Fr.° R.s Pena."
abstract: >-
  The 1834 Itaboraí baptism of Anna, legitimate daughter of Manoel de Lemos
  Ferreira (P-0052) and Maria Nunes de Jesus (P-0053), both natural of the
  parish; godparents José Antonio and Anna Roza de Guimarães. This Anna is Rosa
  Eugenia de Lemos's (P-0035) older sister, confirmed by the same parents and
  parish as PAR-0016. ⚠️ Mother recorded as "Maria Nunes de Jesus" here vs.
  "Maria Thereza de Jesus" in PAR-0016 (1835) — scribal inconsistency, same woman.
  Also on this page: a baptism of José, son of Castro Guimarães × Leonora Maria
  Correa de Oliveira, whose paternal grandparents were from Vizela de Brito, Bispado
  de Braga, Portugal — different family but the Guimarães surname is notable.
abstract_pt: >-
  O batismo, em Itaboraí em 1834, de Anna, filha legítima de Manoel de Lemos
  Ferreira (P-0052) e de Maria Nunes de Jesus (P-0053), ambos naturais da
  freguesia; padrinhos José Antonio e Anna Roza de Guimarães. Esta Anna é irmã mais
  velha de Rosa Eugenia de Lemos (P-0035), confirmada pelos mesmos pais e pela mesma
  freguesia de PAR-0016. ⚠️ A mãe é aqui registrada como "Maria Nunes de Jesus", em
  contraste com "Maria Thereza de Jesus" em PAR-0016 (1835) — inconsistência de
  escrivão, a mesma mulher. Também nesta página: um batismo de José, filho de Castro
  Guimarães × Leonora Maria Correa de Oliveira, cujos avós paternos eram de Vizela
  de Brito, Bispado de Braga, Portugal — família diferente, mas o sobrenome
  Guimarães é digno de nota.
reliability:
  assessment: >-
    Direct primary parish evidence. Father's exact surname "de Lemos Ferreira" and
    mother's name clearly legible; parent pair matches F-0025. The "Ferreira" vs.
    "Pereira" variant of the father's middle name (Ferreira here; Pereira in
    PAR-0016) is assessed as a scribal variant of the same person.
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1834).
  limitations: >-
    Volume in poor condition. The Ferreira/Pereira variant in the father's surname
    across entries is unresolved at primary level.
