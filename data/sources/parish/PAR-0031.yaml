notes:
- text: >-
    Sibling of Rosa Eugenia de Lemos (P-0035): baptised 12 February 1834, 1.5 years
    before Rosa (PAR-0016, Oct 1835). Godmother Anna Roza de Guimarães is a notable
    Guimarães-Lemos link in Itaboraí (same surname as the Engrácio/Guimarães family
    branch, though the connection is coincidental at this remove). Added as
    documented_child on F-0025.
