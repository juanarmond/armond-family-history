transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Entrada
  do lado esquerdo, a primeira da página, margem lateral "Anna". Relida na imagem
  em 2026-10-10.] "Aos onze dias do mez de Fevereiro de mil oitocentos e trinta e
  quatro annos nesta Matriz de Itaborahy baptizei, e puz os Santos Oleos á
  innocente Anna filha legitima de Manoel de Lemos Pereira, e de Maria [Th]ereza de
  Jezus, naturaes des-ta Freguezia: forão Padrinhos João Joze Antunes, e Anna Roza
  da Encarnação, do que mandei fazer este assento que assigney. O Vig.rº Fran.co
  R.os Pena." [A inicial de "Thereza" é a mesma maiúscula laçada usada por esta mão
  no assento de Maria, 1832 (PAR-0030).]
abstract: >-
  The 11 February 1834 Itaboraí baptism of Anna, legitimate daughter of Manoel de
  Lemos Pereira (P-0052) and Maria Thereza de Jezus (P-0053), both natural of the
  parish; godparents João José Antunes and Anna Roza da Encarnação. This Anna is an
  older sister of Rosa Eugenia de Lemos (P-0035): same parents, parish and register
  as PAR-0016. Corrected 2026-10-10 from the image: the day is the 11th ("onze"),
  not the 12th; the father is "Pereira", not "Ferreira"; the mother is "Maria
  Thereza de Jezus", not "Maria Nunes de Jesus"; and the godparents are João José
  Antunes and Anna Roza da Encarnação, not "José Antonio and Anna Roza de
  Guimarães". Also on this page (10 February 1834) is the baptism of José, son of
  João Antonio de Castro Guimarães and D. Leonarda Maria Correa da Silveira, whose
  paternal grandparents José de Castro and Joanna Maria were "naturaes da
  Freguezia de Vizela do Arcebispado de Braga" — an unrelated family.
abstract_pt: >-
  O batismo, em Itaboraí em 11 de fevereiro de 1834, de Anna, filha legítima de
  Manoel de Lemos Pereira (P-0052) e de Maria Thereza de Jezus (P-0053), ambos
  naturais da freguesia; padrinhos João José Antunes e Anna Roza da Encarnação. Esta
  Anna é irmã mais velha de Rosa Eugenia de Lemos (P-0035): mesmos pais, freguesia e
  livro de PAR-0016. Corrigido em 2026-10-10 a partir da imagem: o dia é 11
  ("onze"), não 12; o pai é "Pereira", não "Ferreira"; a mãe é "Maria Thereza de
  Jezus", não "Maria Nunes de Jesus"; e os padrinhos são João José Antunes e Anna
  Roza da Encarnação, não "José Antonio e Anna Roza de Guimarães". Também nesta
  página (10 de fevereiro de 1834) está o batismo de José, filho de João Antonio de
  Castro Guimarães e D. Leonarda Maria Correa da Silveira, cujos avós paternos José
  de Castro e Joanna Maria eram "naturaes da Freguezia de Vizela do Arcebispado de
  Braga" — família sem relação.
reliability:
  assessment: >-
    Direct primary parish evidence, clearly legible. Father "Manoel de Lemos
    Pereira" and mother "Maria Thereza de Jezus", both natural of the parish — the
    same couple as Rosa's 1835 baptism (PAR-0016) and F-0025.
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1834).
  limitations: >-
    Volume in poor condition, but this entry is intact. The initial of "Thereza" is
    an unusual looped capital (the same form as in PAR-0030); the surname and "de
    Jezus" fix the reading.
