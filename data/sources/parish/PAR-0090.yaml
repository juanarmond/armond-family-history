abstract: >-
  Primary parish baptism record for Maria, eldest daughter of Belchior da Ponte Cardoso
  (P-0123) × Mariana Fagundes (P-0124), baptised 5 September 1651 in São Sebastião,
  Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0281). The act names both parents as
  "Belchior da Ponte Cardogo × Mariana Fagueda" — confirming parentage. Godfather was
  Asceto André Coelho. This is the earliest documented child of the couple after their
  1650 marriage. Status: confirmed (primary image, parents legibly named).
abstract_pt: >-
  Registo paroquial primário do baptismo de Maria, filha primogénita de Belchior da
  Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizada a 5 de setembro de 1651
  em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0281). O assento nomeia
  ambos os pais como "Belchior da Ponte Cardogo × Mariana Fagueda" — confirmando a
  filiação. Padrinho: Asceto André Coelho. Trata-se do primeiro filho documentado do
  casal após o casamento de 1650. Estado: confirmado (imagem primária, pais legíveis).
reliability:
