abstract: >-
  Primary parish baptism record for Manuel, son of Belchior da Ponte Cardoso (P-0123) ×
  Mariana Fagundes (P-0124), baptised 13 October 1652 in São Sebastião, Terceira
  (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0287). The act names both parents as "Belchior da
  Ponte Cardogo × marianna Faguedes", confirming parentage. Consistent with Vol. IX
  (PUB-0005, p.260). Status: confirmed.
abstract_pt: >-
  Registo paroquial primário do baptismo de Manuel, filho de Belchior da Ponte Cardoso
  (P-0123) × Mariana Fagundes (P-0124), baptizado a 13 de outubro de 1652 em São
  Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0287). O assento nomeia ambos
  os pais como "Belchior da Ponte Cardogo × marianna Faguedes", confirmando a filiação.
  Consistente com Vol. IX (PUB-0005, p.260). Estado: confirmado.
