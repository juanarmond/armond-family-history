transcription: >-
  [Livro de Baptismos, Nova Friburgo, fl.129, 1898. Margem: "1587 / Renato".]
  "Aos trinta e um dias do mes de Janeiro de mil oito centos e noventa e oito
  baptisei solemnemente a Renato, nascido á doze de Setembro de mil oito centos
  e noventa e sete, filho legitimo de Joaquim José Borber [Bohrer] e Lucinda da
  Silva Ferreira Berber. Forão padrinhos Bernardo Nunes [Pinto — uncertain] e
  Laura Borba Nunes [Pinto — uncertain]. Para constar fiz este assento, que
  assigno. O Vigario Conego José Silvestre Alves de Miranda."
abstract: >-
  Parish baptism of Renato Bohrer, born 12 September 1897 and baptised 31 January
  1898 at Nova Friburgo (fl. 129, entry 1587), legitimate son of Joaquim José
  Bohrer (P-0030) and Lucinda Ferreira da Silva (P-0031) — i.e. a younger sibling
  of the direct ancestor Celina Bohrer (P-0015). Recorded as a documented child
  on family F-0014. Both parents are named (the mother written "Lucinda da Silva
  Ferreira", the same woman as P-0031); the surname is written "Borber" (a scribal
  variant of Bohrer). PROVEN. Not modelled as a person entity; no event created.
abstract_pt: >-
  Batismo paroquial de Renato Bohrer, nascido em 12 de setembro de 1897 e
  baptizado em 31 de janeiro de 1898 em Nova Friburgo (fl. 129, assento 1587),
  filho legítimo de Joaquim José Bohrer (P-0030) e Lucinda Ferreira da Silva
  (P-0031) — ou seja, um irmão mais novo da ancestral direta Celina Bohrer
  (P-0015). Registrado como filho documentado na família F-0014. Ambos os pais
  são nomeados (a mãe grafada "Lucinda da Silva Ferreira", a mesma mulher que
  P-0031); o sobrenome está escrito "Borber" (variante do escrivão para Bohrer).
  PROVADO. Não modelado como entidade pessoa; sem evento criado.
