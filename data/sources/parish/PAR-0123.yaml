reading_reliability: complete
abstract: >-
  Original marriage entry, 1869 Nº 2, in the São Romão da Ucha (Barcelos) marriage book,
  beginning at the foot of the left page and ending at the top of the right page. On 27 May 1869,
  in the parish church, the Abbade Antonio Joze Correia married Joze Ferreira, solteiro, aged
  26, legitimate son of Ignacio Ferreira and Thereza Maria, of the lugar do Rio in the parish of
  Salvador da Lama, to Thereza de Jesus, solteira, aged 27, legitimate daughter of Bento
  Fernandes and Joaquina Roza, of the lugar de Quintão in Ucha. The witnesses were Joze Fernandes
  and Manoel de Oliveira, both solteiros, of the lugar de Quintão, who signed; the groom made a
  cross. The bride is a collateral: a sister of Manoel João Fernandes da Cruz (P-0139), daughter
  of Bento José Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142), family F-0071, and the
  namesake aunt of Thereza Fernandes de Azevedo (P-0039), who was baptised "Thereza de Jesus" at
  Pousa in 1864.
abstract_pt: >-
  Assento original de casamento, 1869 Nº 2, no livro de casamentos de São Romão da Ucha
  (Barcelos), que começa no pé da página da esquerda e termina no alto da página da direita. Em
  27 de maio de 1869, na igreja paroquial, o Abade Antonio Joze Correia casou Joze Ferreira,
  solteiro, de 26 anos, filho legítimo de Ignacio Ferreira e de Thereza Maria, do lugar do Rio,
  freguesia de Salvador da Lama, com Thereza de Jesus, solteira, de 27 anos, filha legítima de
  Bento Fernandes e de Joaquina Roza, do lugar de Quintão, na Ucha. Foram testemunhas Joze
  Fernandes e Manoel de Oliveira, ambos solteiros, do lugar de Quintão, que assinaram; o noivo
  fez cruz. A noiva é uma colateral: irmã de Manoel João Fernandes da Cruz (P-0139), filha de
  Bento José Fernandes (P-0141) e de Joaquina Rosa Lopes (P-0142), família F-0071, e tia homônima
  de Thereza Fernandes de Azevedo (P-0039), batizada "Thereza de Jesus" em Pousa em 1864.
reliability:
  assessment: >-
    Original and direct. It is primary for the marriage, its date and place, the parties, the
    witnesses and the officiant: the Abbade assisted, wrote the entry and signed it with the two
    witnesses. The ages and the parents' names and lugares were declared to him and are secondary
    information. Every core fact is legible: the date (also in the margin), both parties, their
    ages, both sets of parents and the lugar de Quintão. The inline uncertain marks fall only on
    the cramped numeral word, on two letters under the rubricator's mark, on the word "Cruz" of
    the signing formula and on a blotted witness signature.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio Joze Correia, who assisted at the marriage; the ages
    and parentage were presumably declared by the parties. The two witnesses signed; the groom
    made a cross; the bride is not mentioned as signing.
  limitations: >-
    No grandparents are named, and the entry does not say whether the bride's father was living.
    The right page is numbered "132" as read, the same number as read on the right page of image
    494 (see notes). Image 496, a second exposure of this opening according to the retrieval
    side, was not compared.
