notes:
- text: >-
    Identification. The bride's parents, "Bento Fernandes, e Joaquina Roza do lugar de Quintão
    desta freguezia", match P-0141 and P-0142 by names, lugar and parish. Her age, 27 on 27 May
    1869, puts her birth between May 1841 and May 1842; it fits the Thereza de Jezus born on 14
    August 1841 at Quintão, daughter of Bento Fernandes and Joaquina Roza (PAR-0119, per the
    retrieval side's reading). The identification is strong, not proven.
  text_pt: >-
    Identificação. Os pais da noiva, "Bento Fernandes, e Joaquina Roza do lugar de Quintão desta
    freguezia", correspondem a P-0141 e P-0142 pelos nomes, pelo lugar e pela freguesia. A idade
    dela, 27 anos em 27 de maio de 1869, situa o nascimento entre maio de 1841 e maio de 1842; isso
    combina com a Thereza de Jezus nascida em 14 de agosto de 1841 em Quintão, filha de Bento
    Fernandes e de Joaquina Roza (PAR-0119, segundo a leitura da pesquisa de recuperação). A
    identificação é forte, não provada.
- text: >-
    The witness "Joze Fernandes ... solteiro, do lugar de Quintão" is not identified with the
    bride's brother Joze Fernandes of Quintão. That brother had married Maria Forte on 20 July 1868
    (PAR-0122) and made a cross, whereas this witness is called solteiro in May 1869 and signs
    his name. He may be a namesake, or the entry may be loose; the record does not say. The
    witness Manoel de Oliveira, solteiro, of Quintão, is not the Padre Manoel de Oliveira of
    Cervães who witnessed in 1866 (PAR-0121).
  text_pt: >-
    A testemunha "Joze Fernandes ... solteiro, do lugar de Quintão" não é identificada com o irmão
    da noiva, Joze Fernandes, de Quintão. Esse irmão tinha se casado com Maria Forte em 20 de julho
    de 1868 (PAR-0122) e fizera cruz, ao passo que esta testemunha é dita solteira em maio de 1869
    e assina o nome. Pode ser um homônimo, ou o assento pode ser impreciso; o registro não o diz. A
    testemunha Manoel de Oliveira, solteiro, de Quintão, não é o Padre Manoel de Oliveira, de
    Cervães, que testemunhou em 1866 (PAR-0121).
- text: >-
    What the record adds. Thereza de Jesus, sister of Manoel João, was solteira until 1869 and
    married Joze Ferreira, of the lugar do Rio, Salvador da Lama, on 27 May 1869. She can be
    recorded as a documented child of F-0071 with this source. In May 1869 her parents were still
    described as "do lugar de Quintão". Salvador da Lama is also the parish of André Domingues
    (P-0149), the father of Jozefa Maria Domingues; this record states no kinship between the
    families.
  text_pt: >-
    O que o registro acrescenta. Thereza de Jesus, irmã de Manoel João, era solteira até 1869 e
    casou-se com Joze Ferreira, do lugar do Rio, Salvador da Lama, em 27 de maio de 1869. Pode ser
    registrada como filha documentada da F-0071, com esta fonte. Em maio de 1869 os pais dela ainda
    eram ditos "do lugar de Quintão". Salvador da Lama é também a freguesia de André Domingues
    (P-0149), pai de Jozefa Maria Domingues; este registro não declara parentesco entre as
    famílias.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.5, T5). The
    wording is confirmed. On the image: "Joze Ferreira" and "Joze Fernandes" (draft "José"); the
    numeral word reads "secenta" (draft "sessenta"); "comparecerão os Nubentes Joze Ferreira e
    Thereza de Jesus" has no comma before "e"; the line division at the top of the right page is
    "se rece- / [be]rão" (draft "se recebe- / rão"), the letters being under the rubricator's
    mark; the signing formula reads "de Cruz" (draft "de cruz [?]"). The margin reads "J.e Ferr.a /
    e Thereza de / Jesus". The right page carries the number "132" as the draft says, but the same
    number is read on the right page of image 494 (PAR-0122).
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.5, T5). O texto foi confirmado. Na imagem: "Joze
    Ferreira" e "Joze Fernandes" (rascunho "José"); o numeral lê-se "secenta" (rascunho
    "sessenta"); "comparecerão os Nubentes Joze Ferreira e Thereza de Jesus" não tem vírgula antes
    do "e"; a divisão de linha no alto da página da direita é "se rece- / [be]rão" (rascunho "se
    recebe- / rão"), pois as letras ficam sob o sinal do rubricador; a fórmula de assinatura lê-se
    "de Cruz" (rascunho "de cruz [?]"). A margem lê-se "J.e Ferr.a / e Thereza de / Jesus". A
    página da direita traz o número "132", como diz o rascunho, mas o mesmo número se lê na página
    da direita da imagem 494 (PAR-0122).
