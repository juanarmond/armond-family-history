transcription: |-
  [Whole opening — São Romão da Ucha marriages, DGS 004670018 image 495: the end of the last entry of 1868 and two entries of 1869 on the left page, and on the right page the end of the target entry and two more entries of 1869. Every entry is written and signed by the Abbade Antonio Joze Correia. Read from the native image (3876×2804) in strips at 1–4× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written. This hand writes the tilde over the final o ("Romaõ", "comparecerão"); it is rendered "ão" throughout.]

  [left page, top — the end of the last entry of 1868, with the signatures "O Abb.e Antonio Joze Corr.a", "Joaquim Manoel da Silva" and "Josefa Maria d'Oliveira Gomes"; a slip of paper at the top left corner reads "E.T. Nº 1". Not this family.]

  [left page, heading "Anno de 1869"; entry Nº 1 — 16 May 1869: Henrique Raimundo Pereira and Luiza da Silva Forte; signed "O Abb.e Antonio Joze Corr.a", "Domingos Joze [uncertain: Maia]", "Do Nubente a rogo d'elle [uncertain]" and "João Joaquim Gomes". Not this family; the bride bears the surname "da Silva Forte", like the father of Maria Forte who married Joze Fernandes in 1868 (PAR-0122), but the entry is not read for kinship.]

  [p1 — evidence/parish/PAR-0123-marriage-thereza-de-jesus-jose-ferreira-1869-ucha.jpg; left page, entry Nº 2 — TARGET]
  [Left margin:] Nº 2 / Dia 27 / Mez Maio / Anno 1869
  [Right margin:] J.e Ferr.a / e Thereza de / Jesus
  Aos vinte, e sette dias do mez de Maio do anno de mil oito centos
  [uncertain: secenta] e nove nesta Igreja Parochial de São Romão da Ucha
  Concelho de Barcellos Diocese de Braga na minha prezença
  comparecerão os Nubentes Joze Ferreira e Thereza de Jesus
  com todos os papeis do Estillo correntes, e sem impedimen-
  to algum Civil, ou Canonico para o cazamento elle de ida-
  de de vinte e seis annos solteiro filho legitimo de Ignacio
  Ferreira, e Thereza Maria do lugar do Rio freguezia do Salva-
  dor da Lama, e ella de idade de vinte e sette annos solteira
  [right page, top]
  filha legitima de Bento Fernandes, e Joaquina Roza do lu-
  gar de Quintão desta freguezia os quaes Nubentes se rece-
  [uncertain: be]rão por marido, e mulher, e os uni em Matrimonio proce=
  dendo em todo este acto conforme o Rito da Santa Madre Igreja
  Chatolica, e Apostolica Romana. Forão testemunhas prezen-
  tes que conheço serem os proprios Joze Fernandes, e Manoel
  de Oliveira ambos solteiros, do lugar de Quintão desta fregue-
  zia de que para constar lavrei em duplicado este assento que
  depois de ser lido, e conferido perante os Nubentes, e testemunhas
  comigo asignarão as testemunhas, e asignou de [uncertain: Cruz] o Nuben-
  te por não saber Escrever; era ut supra                 Joze Fernandes
  O Abb.e Antonio Joze Corr.a [rubric]          Do Nubente
  [uncertain: Manoel de Oliveira]               Joze + Ferr.a
  [Expansions and readings: J.e = Joze; Ferr.a = Ferreira; "secenta" — the scribe's cramped form of "sessenta"; the year is certain from the margin "Anno 1869"; "se rece- / [be]rão" — the end of the line runs under the rubricator's mark "Mi.~ 132" and the letters "be" are not clear; Chatolica is written so; "de Cruz" — the capital is formed like this scribe's other capitals C, and "de Cruz" is the standard formula; Abb.e = Abbade; Corr.a = Correia. The signatures "Joze Fernandes" (right) and "Manoel de Oliveira" (lower left, blotted) are the two witnesses'; "Do Nubente / Joze + Ferr.a" is the groom's cross with his name written by the Abbade.]

  [right page, entry Nº 3 — 16 August 1869: Manoel Joaquim da Motta, solteiro, 46 [uncertain], son of Domingos da Motta and Maria Thereza, of the lugar de Quintão of this parish, with Anna Gonsalves, 33, daughter of Bento Gonsalves and Rita Maria, of Santa Eullalia de Cabanellas. A neighbouring family of Quintão; not this family.]

