transcription: >-
  [Livro de Casamentos, Nova Friburgo, p.79, nº 333, 1890; Cónego José Silvestre Alves de Miranda.]
  "Aos vinte sete dias do mes de Novembro de mil oito centos e noventa, ás onze horas e meia do dia,
  na Egreja Matriz, depois de canonicamente habilitados, tendo antes a nubente abjurado o
  protestantismo, fazendo a profissão de fé catholica e recebido o baptismo... se receberão em
  matrimonio: Valentim Martinho Bor[b]er e Carolina Klein, ambos nascidos, baptizados e moradores
  n'esta freguesia de Nova Friburgo; elle de vinte dois annos de edade e filho legitimo de Vicente
  Bor[b]er e Maria Regina Eckdorn [Eggendorn]; ella de desesete annos de edade, licenciada
  verbalmente por seu pae, e filha legitima de Jacob Klein e Maria Luiza Schenkel. Testemunhas: Jose
  Domingos Bor[b]er [uncertain], Ernesto Piller. O Vigario Conego Jose Silvestre Alves de Miranda."
abstract: >-
  Parish marriage of Valentim Martinho Bohrer (P-0028), 22 (b. ~1868), and Carolina Klein (P-0029),
  17 (b. ~1873), on 27 November 1890 at the Nova Friburgo Matriz. Source for the marriage event
  E-0088. NAMES Carolina's parents Jacob Klein (P-0103) × Maria Luiza Schenkel (P-0104) — new family
  F-0051 — and confirms Valentim's parents Vicente Bohrer × Maria (Regina) Eggendorn. The bride
  abjured Protestantism and was baptised Catholic just before the marriage (the Klein family were
  Lutheran).
abstract_pt: >-
  Casamento paroquial de Valentim Martinho Bohrer (P-0028), 22 anos (n. ~1868), e Carolina Klein
  (P-0029), 17 anos (n. ~1873), em 27 de novembro de 1890, na Matriz de Nova Friburgo. Fonte do evento
  de casamento E-0088. NOMEIA os pais de Carolina, Jacob Klein (P-0103) × Maria Luiza Schenkel
  (P-0104) — nova família F-0051 — e confirma os pais de Valentim, Vicente Bohrer × Maria (Regina)
  Eggendorn. A noiva abjurou o protestantismo e foi batizada católica pouco antes do casamento (a
  família Klein era luterana).
