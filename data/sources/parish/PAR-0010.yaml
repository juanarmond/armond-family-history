transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ; livro de óbitos. The burial act begins at
  the foot of one image (…-p1.jpg, the primary scan) and its closing formula and
  signature are at the head of the following image (…-p2.jpg, faded). Margem: "Antonio
  Caetano Machado".]

  [Page 1 (…-p1.jpg) — foot of the page, the entry:] "[Aos] vinte e sete dias do mez de
  Março de mil oito centos sessenta e oito, foi sepultado no Cemiterio deste Curato de
  Santo Antonio de Sapucaia, á Antonio Caetano Machado, casado, de idade de setenta
  annos, foi sacramentado com os Sacramentos;"

  [Page 2 (…-p2.jpg) — head of the following image, faded; the closing formula and
  signature:] "… [falleceu de] morte natural, foi encommendado e [uncertain:
  acompanhado]. E para constar faço este assento em que me assigno. [assina:] [uncertain:
  O Cura] Francisco José Pimenta." [The rest of …-p2.jpg carries later, unrelated burial
  entries (April 1868) and is not transcribed here. The act names no parents or wife.]
abstract: >-
  The original 1868 death/burial register entry (Santo Antônio de Sapucaia, RJ) of
  Antonio Caetano Machado (P-0045): buried 27 March 1868, married, aged 70 (so born
  c.1798), a natural death, sacramented. He is the maternal grandfather ("avô materno")
  named in Susanna Rita Brandão's 1866 baptism (PAR-0005) — i.e. the father of Rita
  Ignacia de Jesus (P-0041). The óbito confirms the "Caetano" reading.
abstract_pt: >-
  O assento original de óbito/sepultamento de 1868 (Santo Antônio de Sapucaia,
  RJ) de Antonio Caetano Machado (P-0045): sepultado em 27 de março de 1868,
  casado, aos 70 anos (portanto nascido por volta de 1798), morte natural,
  sacramentado. Ele é o avô materno ("avô materno") nomeado no batismo de 1866 de
  Susanna Rita Brandão (PAR-0005) — isto é, o pai de Rita Ignacia de Jesus
  (P-0041). O óbito confirma a leitura "Caetano".
reliability:
  assessment: >-
    Direct primary parish evidence for Antonio Caetano Machado's death, married status
    and approximate birth year, and (with PAR-0005) for his identity as Rita Ignacia de
    Jesus's father.
  informant: >-
    The officiating priest of the Curato de Santo Antônio de Sapucaia, subscribing the
    entry as Francisco José Pimenta (1868).
  limitations: >-
    The óbito does not name his parents or wife. His link to P-0041 as her father rests
    on Susanna's 1866 baptism (PAR-0005) naming him the "avô materno"; the name, parish
    and generation match. The second page (…-p2.jpg) is faded (closing formula only).
