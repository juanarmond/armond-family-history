notes:
- text: >-
    Comparison with the producer's draft (§8.4): the draft is confirmed word for word,
    including "terceira do nome", "ás doze horas" and the closing declaration on the mother's
    unknown naturalidade. The only addition is the small "P" written above "Pouza" twice,
    which the draft omits.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): o rascunho confirma-se palavra por palavra,
    inclusive "terceira do nome", "ás doze horas" e a declaração final sobre a naturalidade
    ignorada da mãe. O único acréscimo é o pequeno "P" escrito por cima de "Pouza" duas vezes,
    que o rascunho omite.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and naturalidade, the mother as a foundling of unknown origin, and the marriage at
    Ucha (E-0142). The paternal grandparents "Bento Fernandes, e Joaquina Lopes" are
    identified with P-0141 and P-0142 through the father's identity and the matching names;
    strong, not proven. "Terceira do nome" counts the earlier daughters Maria de Jesus (1858,
    PAR-0125) and Maria José (1859, PAR-0126).
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a
    naturalidade do pai, a mãe como exposta de origem ignorada e o casamento na Ucha (E-0142).
    Os avós paternos "Bento Fernandes, e Joaquina Lopes" são identificados com P-0141 e P-0142
    pela identidade do pai e pelos nomes coincidentes; forte, não provada. O "terceira do
    nome" conta as filhas anteriores Maria de Jesus (1858, PAR-0125) e Maria José (1859,
    PAR-0126).
- text: >-
    What it adds: the birth at noon and emergency home baptism of a third Maria on 17 September
    1870, the day of her death (PAR-0134); the father a tailor and the mother a seamstress;
    Josefa Loureiro of Souto as the lay baptiser. As a collateral record it links no event;
    linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: o nascimento ao meio-dia e o batismo de emergência em casa de uma
    terceira Maria em 17 de setembro de 1870, dia da sua morte (PAR-0134); o pai alfaiate e a
    mãe costureira; Josefa Loureiro, do Souto, como batizante leiga. Como registro colateral,
    não se liga a nenhum evento; linked_events fica vazio de propósito.
- text: >-
    Neighbouring entry Nº 27 names a "Constantino José Gomes" as paternal grandfather of a
    child of Amproa. He is not Constantino Fernandes (P-0147); nothing ties that entry to this
    family.
  text_pt: >-
    O assento vizinho nº 27 nomeia um "Constantino José Gomes" como avô paterno de uma criança
    de Amproa. Não é Constantino Fernandes (P-0147); nada liga esse assento a esta família.
