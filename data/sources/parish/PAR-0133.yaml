transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, baptism section. FamilySearch DGS 004670017, image 00058: the opening fl. 53v (left) – fl. 54 (right). Read from the native image on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0133-baptism-maria-1870-pousa.jpg; DGS 004670017 image 00058; fl. 54, entry Nº 26]

  [Right page head (fl. 54): the folio number "54" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 53v, top — the end of entry Nº 24: a girl whose paternal grandparents are José Exposto and Francisca da Silva and maternal Antonio da Silva and Andreza Loureira; godparents Manoel José Ribeiro, casado, ferreiro, and Maria Gomes, casada, of São Pedro de Martim; signed by the Abbade Manoel José d'Oliveira Guimarães.]

  [fl. 53v, Nº 25 — Rosa Maria, daughter of Antonio Martins, pedreiro, natural of Alheira, and Luiza Maria da Silva, jornaleira, natural of São Vicente d'Areas, of the logar de Penedellas; baptised 31 July 1870.]

  [fl. 54, Nº 26 — TARGET]
  [Margin:]
  N.º 26
  Maria,
  filha legi-
  tima de
  Manoel
  João Fer-
  nandes
  e Anna
  Exposta
  do logar
  do Souto
  [Body:]
  Aos dezacete dias do mes de Septembro do anno de mil oito
  centos, e setenta pela uma hora da tarde, no logar do Souto desta
  freguesia da Pouza, concelho de Barcellos Diocese de Braga,
  foi baptizado em caza por perigo de Vida por Josefa Lourei-
  ro, do mesmo logar, um individuo do Sexo femenino, a quem
  deo o nome de Maria, e que nasceo nesta freguesia ás doze
  horas do dia dezacete dos referidos mez e anno, filha legiti-
  ma terceira do nome, de Manoel João Fernandes Alfa-
  ate natural da freguesia de São Romão da Ucha, Conce-
  lho de Barcellos Diocese de Braga, e de Anna Exposta,
  Costureira, recebidos naquella, parochianos e moradores nes-
  ta da Pouza, e dito logar do Souto, neta paterna de Bento Fer-
  nandes, e Joaquina Lopes, e materna de Avós incognitos, os
  quaes todos Sei Serem os proprios. E para constar lavrei em
  duplicado este assento que assigno. Era ut Supra. declaro que
  é incognita a naturalidade da Mai da baptizada. Era ut
  Supra. O Abbade Manoel José d'Oliveira Guimarães
  [Reading notes: over "Pouza" in the third and the twelfth lines a small "P" is written above the line, apparently to make the initial letter clear. Glosses: baptizado em caza por perigo de Vida = baptised at home because the child was in danger of death; Alfaate = alfaiate, tailor; recebidos naquella = married in that parish (Ucha); Mai = mãe; Exposta = foundling.]

  [fl. 54, Nº 27 — Antonio, son of Antonio José Gomes and Luiza Thereza Ferreira, lavradores, of the logar d'Amproa; baptised 30 October 1870 by the cura Manoel Martins d'Abreu; paternal grandparents Constantino José Gomes and Maria Roza, maternal João d'Araujo and Maria Joaquina Ferreira (the entry continues beyond this image).]
reading_reliability: complete
abstract: >-
  Original baptism entry Nº 26 of 1870 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. At one in the afternoon of 17 September 1870, at the logar do Souto, Josefa
  Loureiro, of the same lugar, baptised at home "por perigo de Vida" a girl named Maria, born
  in Pousa at noon that day, legitimate daughter, "terceira do nome", of Manoel João Fernandes,
  tailor ("Alfaate"), natural of São Romão da Ucha, and of Anna Exposta, seamstress, married in
  that parish and living at the logar do Souto in Pousa. Paternal grandparents Bento Fernandes
  and Joaquina Lopes; maternal grandparents unknown; the rector adds that the mother's
  naturalidade is unknown. No godparents are named. The Abbade Manoel José d'Oliveira
  Guimarães wrote and signed the entry. The parents are Manoel João Fernandes (P-0139) and
  Anna Maria, "Anna Exposta" (P-0140); the grandparents are Bento José Fernandes (P-0141) and
  Joaquina Rosa Lopes (P-0142). The child died at eleven that night (PAR-0134).
abstract_pt: >-
  Assento original de batismo nº 26 de 1870 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. À uma da tarde de 17 de setembro de 1870, no lugar do Souto, Josefa Loureiro, do
  mesmo lugar, batizou em casa "por perigo de Vida" uma menina chamada Maria, nascida em Pousa
  ao meio-dia desse dia, filha legítima, "terceira do nome", de Manoel João Fernandes, alfaiate
  ("Alfaate"), natural de São Romão da Ucha, e de Anna Exposta, costureira, casados naquela
  freguesia e moradores no lugar do Souto, em Pousa. Avós paternos Bento Fernandes e Joaquina
  Lopes; avós maternos incógnitos; o abade acrescenta que a naturalidade da mãe é ignorada.
  Não se nomeiam padrinhos. O abade Manoel José d'Oliveira Guimarães redigiu e assinou o
  assento. Os pais são Manoel João Fernandes (P-0139) e Anna Maria, "Anna Exposta" (P-0140);
  os avós são Bento José Fernandes (P-0141) e Joaquina Rosa Lopes (P-0142). A criança morreu
  às onze da noite desse mesmo dia (PAR-0134).
reliability:
  assessment: >-
    Original and direct, written and signed by the rector, who records a baptism performed by
    a lay woman and certifies that he knew all the parties. It is primary for the baptism, its
    date and place, the child's name and the parents, and secondary for the birth hour, the
    parents' trades and origins, their marriage parish and the grandparents; hence mixed.
    Every core fact is legible, so reading_reliability is complete; the only uncertain mark
    falls on the page rubric.
  informant: >-
    Not named. The baptism was administered by Josefa Loureiro of the logar do Souto; the
    entry was written and signed by the Abbade Manoel José d'Oliveira Guimarães.
  limitations: >-
    An emergency baptism: no godparents and no later supply of the ceremonies is recorded.
    The grandparents appear as "Bento Fernandes" and "Joaquina Lopes", without the "José" and
    "Rosa" of their other records.
