transcription: >-
  [Freguesia de N.S. da Piedade da Borda do Campo (Barbacena), MG; livro de batismos,
  1787, pp. 310-311. Heavy ink bleed-through; the parents and date are clearly legible
  on the held scan, the child's given name is faded and read as "Ladisláo" partly from
  the index.] "Aos
  nove dias do mez de Setembro de mil sete centos e oitenta e sete, [n]esta Capela de
  Nossa Senhora da Piedade, filial da matriz da [Freguezia da] Borda do Campo, o Padre
  Antonio da Silva Souza, de licença minha, baptizou solennemente e por os Santos
  Oleos a Ladisláo[?], filho legitimo de [Joaquim] José Ferreira de Toledo e de Dona
  Ritta Angelica Rodriguez; foraõ padrinhos o Doutor Ignacio [Correa] de Almeida
  Peixoto [e outros?] que apresentaram José Pereira [Marinho?], o Vigario Gomez
  Ferreira, [Ribeiro?] filho de Francisco Gomez Ferreira, todos desta Freguezia [da
  Piedade] da Borda do Campo. De que fiz este assento. [assina] O Vigario Dom
  Agostinho [Botelho?] Pinto de Castro."
abstract: >-
  The 9 September 1787 Barbacena baptism of a child (read as Ladisláo) — legitimate
  son of [Joaquim] José Ferreira de Toledo (P-0057) and Dona Ritta Angélica Rodrigues
  (P-0058). This is the connecting record that establishes Ladisláo Egídio Ferreira de
  Toledo (P-0056) as their son, upgrading the F-0028 parentage edge from
  strong-evidence to confirmed. The parents and the 9 September 1787 date are clearly
  legible on the held scan; the child's own forename is faded and rests on
  the index identification (the couple's 9-Sep-1787 baptism) plus the corroborating
  1821 Barbacena baptism of Ladisláo × Matilde's daughter Carolina (PAR-0017).
abstract_pt: >-
  O batismo, em Barbacena a 9 de setembro de 1787, de uma criança (lida como
  Ladisláo) — filho legítimo de [Joaquim] José Ferreira de Toledo (P-0057) e de
  Dona Ritta Angélica Rodrigues (P-0058). Este é o registro de ligação que
  estabelece Ladisláo Egídio Ferreira de Toledo (P-0056) como filho deles,
  elevando a aresta de filiação F-0028 de strong-evidence a confirmed. Os pais e a
  data de 9 de setembro de 1787 são claramente legíveis na digitalização
  mantida; o próprio prenome da criança está
  esmaecido e apoia-se na identificação pelo índice (o batismo do casal em
  9-set-1787) e no batismo corroborante de 1821, em Barbacena, de Carolina, filha
  de Ladisláo × Matilde (PAR-0017).
reliability:
  assessment: >-
    Direct primary parish evidence that Joaquim José Ferreira de Toledo and Ritta
    Angélica Rodrigues baptised a child on 9 September 1787 at Barbacena. The parents
    and date are legible on the held scan; the child's given name is faded, so
    the identification of that child as Ladisláo Egídio Ferreira de Toledo rests on
    the FamilySearch index (this exact act) and the age/surname/parish convergence.
  informant: The baptising priest and the vigário, Barbacena (Borda do Campo), 1787.
  limitations: >-
    The held scan is from a volume with heavy ink bleed-through. The child's forename,
    the "Joaquim" prefix on the father, and the godparents' surnames are uncertain
    reads; the parents (José Ferreira de Toledo × Ritta Angélica Rodriguez) and the
    9 Sep 1787 date are clear.
