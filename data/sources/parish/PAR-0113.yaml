notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T1): the grandparents' lugar
    in Pousa reads "da Anjeirôa" (an "-ôa"/"-õa" ending), not "da Anjeira"; it stays
    uncertain. The mother's second name is marked [uncertain: Maria], as in the draft
    ("Joaquina Maria [?]"); on the image only "Joaquina" is certain. The draft's catchword
    "pa-" and the godfather's forename "João" are kept as uncertain. Everything else in the
    draft was confirmed word by word, including "Ignacio Lopes" (not José Lopes) and
    "Marianna Luiza da Silva".
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T1): o lugar dos avós
    na Pousa lê-se "da Anjeirôa" (terminação "-ôa"/"-õa"), não "da Anjeira"; continua
    incerto. O segundo nome da mãe fica marcado [uncertain: Maria], como no rascunho
    ("Joaquina Maria [?]"); na imagem só "Joaquina" é certo. O reclamo "pa-" e o prenome do
    padrinho, "João", ficam como incertos. Tudo o mais do rascunho foi conferido palavra por
    palavra, inclusive "Ignacio Lopes" (não José Lopes) e "Marianna Luiza da Silva".
- text: >-
    Identification. The father "Bento José Fernandes" of the lugar da Quintãa, Ucha, with the
    mother Joaquina, is identified with P-0141 × P-0142 by the matching names, lugar and
    parish, and by the same four grandparents named in the later baptisms of the couple's
    children (PAR-0114 to PAR-0120). The maternal grandparents Ignacio Lopes × Marianna Luiza
    da Silva of Pousa match P-0145 × P-0146 (Joaquina was a native of Pousa). The
    identification is strong, not proven: this entry gives the mother no surname, and its
    second name is uncertain.
  text_pt: >-
    Identificação. O pai, "Bento José Fernandes", do lugar da Quintãa, Ucha, com a mãe
    Joaquina, é identificado com P-0141 × P-0142 pelos nomes, lugar e freguesia coincidentes
    e pelos mesmos quatro avós nomeados nos batismos posteriores dos filhos do casal
    (PAR-0114 a PAR-0120). Os avós maternos Ignacio Lopes × Marianna Luiza da Silva, da
    Pousa, coincidem com P-0145 × P-0146 (Joaquina era natural da Pousa). A identificação é
    forte, não provada: este assento não dá sobrenome à mãe, e o segundo nome dela é incerto.
- text: >-
    What the record adds. The father is written "Bento José Fernandes"; the maternal
    grandfather "Ignacio Lopes" and grandmother "Marianna Luiza da Silva", of Santa Christina
    da Pousa; the paternal grandmother "Jozefa Maria" (no surname). The godmother "Anna Maria
    solteira tia paterna do Baptizado", of Quintãa, is an unmarried sister of Bento José,
    alive in 1829; the godfather was João José da Motta, married, of Quintãa. No grandparent
    is called deceased. João José is a collateral of the direct line; he is very probably the
    son João who married at Ucha in 1868 (a lead from the retrieval side's marriage sweep, not
    shown in this record).
  text_pt: >-
    O que o registro acrescenta. O pai está escrito "Bento José Fernandes"; o avô materno,
    "Ignacio Lopes", e a avó, "Marianna Luiza da Silva", de Santa Christina da Pousa; a avó
    paterna, "Jozefa Maria" (sem sobrenome). A madrinha, "Anna Maria solteira tia paterna do
    Baptizado", da Quintãa, é uma irmã solteira de Bento José, viva em 1829; o padrinho foi
    João José da Motta, casado, da Quintãa. Nenhum avô é dado como falecido. João José é um
    colateral da linha direta; é muito provavelmente o filho João que se casou na Ucha em 1868
    (pista da varredura de casamentos da pesquisa de recuperação, que este registro não
    mostra).
