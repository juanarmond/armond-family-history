reading_reliability: complete
abstract: >-
  Original baptism entry of João José, written across the foot of fl. 17 and the top of
  fl. 17v of the second baptism book of São Romão da Ucha (Barcelos). On 1 May 1829 the
  abbot Antonio José da Costa e Silva baptised "João José, filho legitimo de Bento José
  Fernandes, e de Joaquina [Maria]" of the lugar da Quintãa, born 29 April 1829. The
  paternal grandparents are "Manoel Fernandes, e … Jozefa Maria" of the same lugar; the
  maternal grandparents are "Ignacio Lopes, e … Marianna Luiza da Silva" of the lugar da
  [Anjeirôa], Santa Christina da Pousa. The godparents were João José da Motta, married, and
  "Anna Maria solteira tia paterna do Baptizado", both of Quintãa — a sister of Bento José.
  The child was baptised without the holy oils, not yet blessed that year; a margin note
  records that they were applied later. This is the earliest known child of Bento José
  Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142), a brother of Manoel João (P-0139).
abstract_pt: >-
  Assento original de batismo de João José, escrito no pé do fl. 17 e no alto do fl. 17v do
  segundo livro de batismos de São Romão da Ucha (Barcelos). Em 1º de maio de 1829 o abade
  Antonio José da Costa e Silva batizou "João José, filho legitimo de Bento José Fernandes,
  e de Joaquina [Maria]", do lugar da Quintãa, nascido em 29 de abril de 1829. Os avós
  paternos são "Manoel Fernandes, e … Jozefa Maria", do mesmo lugar; os maternos, "Ignacio
  Lopes, e … Marianna Luiza da Silva", do lugar da [Anjeirôa], Santa Christina da Pousa.
  Foram padrinhos João José da Motta, casado, e "Anna Maria solteira tia paterna do
  Baptizado", ambos da Quintãa — uma irmã de Bento José. A criança foi batizada sem os santos
  óleos, ainda não bentos naquele ano; uma nota na margem registra que foram aplicados
  depois. É o filho mais antigo conhecido de Bento José Fernandes (P-0141) e de Joaquina Rosa
  Lopes (P-0142), irmão de Manoel João (P-0139).
reliability:
  assessment: >-
    Original, written and signed by the officiating abbot at the time: primary and direct for
    the baptism, its date, the birth date, the child, the parents as named and the
    godparents; the grandparents' names are reported by the family and are secondary in
    principle. Every core fact is legible except the second name of the mother, which is
    faint and partly rubbed at the foot of fl. 17: "Joaquina" is clear, the next word looks
    like "Maria" but cannot be confirmed. The father ("Bento José Fernandes"), the child, the
    dates, all four grandparents and the lugar are clear, so reading_reliability is complete;
    the remaining [uncertain] marks fall on the mother's second name (a variant of an
    identified person), the grandparents' lugar in Pousa, a catchword and the godfather's
    first forename.
  informant: >-
    The abbot of São Romão da Ucha, Antonio José da Costa e Silva, who officiated and signed;
    the grandparents' names were presumably supplied by the family.
  limitations: >-
    The mother's second name is uncertain and no surname is written for her here. The
    grandparents' lugar in Pousa is an uncertain reading. The image is a two-page opening
    with show-through and a dark gutter, which does not hide the target entry.
