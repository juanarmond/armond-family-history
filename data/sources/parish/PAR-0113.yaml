transcription: |-
  [Two-page record — São Romão da Ucha baptisms, DGS 004669216, Book 2. The target entry
  begins with the last two lines of fl. 17 and continues as the first entry of fl. 17v.
  Each image is a two-page opening. Spelling, capitals and abbreviations as written; the
  line breaks of the register are kept; expansions follow in a separate bracket. The hand
  is that of the abbot Antonio José da Costa e Silva, whose final "s" is written in a
  z-like form ("Fernandez", "Lopez", "Oleoz"); it is transcribed as "s". Read from the
  images on 2026-10-12.]

  [p1 — evidence/parish/PAR-0113-baptism-joao-jose-1829-ucha-p01.jpg; opening fl. 16v–17;
  the target entry is the last on fl. 17]
  [fl. 16v, not the target, summarised: the end of an entry (… "filha de Jo.e Luiz ambos do
  lugar de Bairros"); Domingos, son of Joaquim Antonio Martins and Roza Margarida, of the
  lugar da [uncertain: Cudrachaira] (born 9 October 1828); Francisco, son of Pedro
  Domingues and Thereza Maria Dias d'Affonseca, of the lugar de Macedo (born 4 November
  1828); Antonio, son of Francisco José and Gracia Maria, of the lugar do Marco (born
  15 November 1828), continued on fl. 17. No modelled person is named.]
  [fl. 17, top right: folio number "17" and a rubric. Entries above the target, summarised:
  the end of the Antonio entry (godparents Antonio José da Costa and his wife Maria Thereza,
  of the lugar do Marco); Antonio, natural son of Thereza Maria, widow, of the lugar da Torre
  (born 2 March 1829); Maria, daughter of Pedro Martins and Benta Maria Domingues, of the
  lugar de Bairros (March 1829); Thereza, natural daughter of Maria do Carmo, of the lugar
  da Bouça (born 12 April 1829). No modelled person is named.]

  [entry — TARGET: João José, son of Bento José Fernandes and Joaquina [Maria]; fl. 17,
  last two lines]
  João José, filho legitimo de Bento José Fernandes, e de Joaquina [uncertain: Maria]
  do lugar da Quintãa desta freguesia de Sam Romão da Ucha, neto
  [catchword at the foot: [uncertain: pa-]]

  [p2 — evidence/parish/PAR-0113-baptism-joao-jose-1829-ucha-p02.jpg; opening fl. 17v–18;
  the target entry continues as the first entry on fl. 17v]
  [Left margin of fl. 17v, beside the entry:] Impuz- / lhe os San- / tos Oleos / Costa [rubric]
  paterno de Manoel Fernandes, e de sua mulher Jozefa Maria do
  mesmo lugar, e materno de Ignacio Lopes, e de sua mulher Mari-
  anna Luiza da Silva do lugar da [uncertain: Anjeirôa] da freguesia de
  Sancta Christina da Pouza, nasceo em o dia vinte, e nove do
  mez de Abril de mil, e oito centos, e vinte, e nove e no primei-
  ro de Maio do mesmo anno foi por mim solemnemente
  baptizado nesta Igreja sem imposição dos Sanctos Oleos, pelos
  não haver ainda benzidos neste anno, sendo padrinhos [uncertain: João]
  Joze da Motta cazado, e Anna Maria solteira tia paterna do
  Baptizado, e ambos do sobredicto lugar da Quintãa desta dicta
  freguesia. E para constar, fiz este assento era ut supra.
  [Signature:] O Abb.e Antonio José da Costa e Silva [rubric]
  [Expansions: Abb.e = Abbade; Sanctos Oleos = the holy oils, not yet blessed that year, so
  the child was baptised without them; the margin note "Impuz-lhe os Santos Oleos" records
