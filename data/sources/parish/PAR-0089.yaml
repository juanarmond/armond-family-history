notes:
- text: >-
    The death record identifies Mariana as "mulher de M° Balchion de Ponte", confirming
    her marriage to Belchior da Ponte Cardoso (P-0123). The vicar Antônio Coelho Sotomayor
    is noted — this name echoes the surname of the child António Coelho Souto-Maior
    (baptised 1654, PAR-0092), which Vol. IX notes was named after the family's kin
    connection to the Coelho Sotomayor line.
- text: >-
    Burial in the sepultura da fabrica (church fabric/building burial plot) is a detail
    absent from the compiled sources and confirms the family's standing in the parish.
