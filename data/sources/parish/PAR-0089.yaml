abstract: >-
  Primary parish death record for Mariana Fagundes (P-0124), died 7 July 1684 in São
  Sebastião, Terceira. The marginal index annotation reads "Mariana / Fags" (= Mariana
  Fagundes) and the main text records: "Em os sete dios do mes de julho de mil seis centos
  e oitenta e quatro anos fale Cao Mariana Fagundes [mulher] de M° Balchion de Ponte."
  The record identifies her as the wife of "M° Balchion de Ponte" (= Belchior da Ponte
  Cardoso, P-0123). She was buried in the sepultura da fabrica segunda fiada nona. The
  death date 7 July 1684 is an exact match for both PUB-0004 and PUB-0005. This primary
  image upgrades E-0136 from strong-evidence to confirmed. Officiating vicar was Antônio
  Coelho Sotomayor.
abstract_pt: >-
  Registo paroquial primário do óbito de Mariana Fagundes (P-0124), falecida a 7 de julho
  de 1684 em São Sebastião, Terceira. A anotação marginal de índice lê "Mariana / Fags"
  (= Mariana Fagundes) e o texto principal regista: "Em os sete dios do mes de julho de
  mil seis centos e oitenta e quatro anos fale Cao Mariana Fagundes [mulher] de M° Balchion
  de Ponte." O registo identifica-a como mulher de "M° Balchion de Ponte" (= Belchior da
  Ponte Cardoso, P-0123). Sepultada na sepultura da fabrica segunda fiada nona. A data de
  óbito 7 de julho de 1684 corresponde exactamente a PUB-0004 e PUB-0005. Esta imagem
  primária actualiza E-0136 de strong-evidence para confirmed. O vigário officiante foi
  Antônio Coelho Sotomayor.
reliability:
  assessment: >-
    Primary source (original parish death register). The marginal annotation names "Mariana
    Fags" and the main entry reads the day (7), month (July) and year (1684) in full —
    exact match with PUB-0004 and PUB-0005. The identification of Mariana as wife of
    "M° Balchion de Ponte" (a consistent scribal variant of Belchior da Ponte Cardoso)
    confirms the marriage relationship. The burial location (sepultura da fabrica) is new
    detail not provided by the compiled sources. Evidence quality: confirmed.
  informant: Vicar Antônio Coelho Sotomayor, São Sebastião, Terceira, recording the death in 1684
  limitations: >-
    Some text is partially legible (indicated by square brackets). Single image page held;
    no context page. The reference to "M° Balchion de Ponte" uses the scribal abbreviation
    "M°" (possibly "Marido°" = husband or simply an honorific/title abbreviation).
    Resolution: 1299×944 px.
