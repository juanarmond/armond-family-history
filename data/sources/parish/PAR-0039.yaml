transcription: >-
  [Baptismo — Livro de baptismos de N.S. Mãe de Deus, Povoação; acto da página
  esquerda (verso) da abertura cuja página direita (recto) tem o número de fólio
  114. Lido da imagem do registo 2026-08-12.]


  "Michaelina filha legitima de João Muniz Bitancourt e de Maria Jacintha,
  naturais e freguezes desta Parochial de Nossa Senhora Mai de Deos do Lugar da
  Povoação, nasceo aos tres dias do mez de Janeiro de mil oito centos trinta e
  tres annos, e foi baptizada aos troze dias do mesmo mez e anno por mim
  [uncertain] Francisco de Borja, Vigario da dita Parochial. Forão Padrinhos
  Manoel José da [uncertain: Costa] e Victoria de Medeiros, testemunhas Francisco
  José Soares de Mendonça e Antonio de Medeiros Brandão. E para constar fis este
  termo dia mez e era ut supra. O Vigario Fr. Francisco de Borja. Fran.co José
  Soares de M[endonça]. Antonio [+ signal de cruz] de Medeiros Brandão."
abstract: >-
  Baptism on 13 January 1833 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of Michaelina, born 3 January 1833, legitimate daughter of João Muniz
  Bitancourt (P-0048) and Maria Jacintha [de Medeiros] (P-0049), family F-0023 —
  a collateral sibling of the modelled Manoel Muniz Bytancourt (P-0042), another
  child of the same couple. Officiant the Vigário Francisco de Borja (signed "Fr.
  Francisco de Borja"); godparents Manoel José da Costa and Victoria de Medeiros
  (this couple's recurring compadrio); witnesses Francisco José Soares de
  Mendonça and Antonio de Medeiros Brandão.
abstract_pt: >-
  Baptismo em 13 de janeiro de 1833, em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de Michaelina, nascida em 3 de janeiro de 1833, filha legítima de João
  Muniz Bitancourt (P-0048) e de Maria Jacintha [de Medeiros] (P-0049), família
  F-0023 — irmã colateral do modelado Manoel Muniz Bytancourt (P-0042), outro
  filho do mesmo casal. Celebrante o Vigário Francisco de Borja (assinou "Fr.
  Francisco de Borja"); padrinhos Manoel José da Costa e Victoria de Medeiros (o
  compadrio recorrente deste casal); testemunhas Francisco José Soares de
  Mendonça e Antonio de Medeiros Brandão.
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the baptism
    of Michaelina and her parentage (father João Muniz Bitancourt, mother Maria
    Jacintha), legible on the image. The parents match family F-0023, and the
    godparent couple Manoel José da Costa × Victoria de Medeiros is the recurring
    compadrio also present at this couple's 1831/1834/1836/1839 children, locking
    the identification.
  informant: >-
    The Vigário Francisco de Borja of N.S. Mãe de Deus, Povoação, recording the
    baptism ex officio.
  limitations: >-
    The entry names the father as "João Muniz Bitancourt" (without the
    "Francisco" of his 1819 marriage act, PAR-0037) and the mother as "Maria
    Jacintha" with no surname; identity rests on the parents' names plus the
    recurring godparent couple. The officiant's forename and the godfather's
    byname ("da Costa") are read with mild uncertainty; the godfather is
    nonetheless the recurring compadre Manoel José da Costa.
