notes:
  - text: >-
      Catalogued 12 August 2026 from the Culturacores CDN image, read directly
      from the register. Michaelina is a collateral child of family F-0023 (João
      Francisco Muniz Bitancourt × Maria Jacintha de Medeiros); per policy no
      person entity is minted for her — she should be recorded as a
      documented_child on F-0023. This act records parents only (no
      grandparents), the parents-only style typical of these Mãe de Deus
      baptisms. The page bears folio 114; the precise Culturacores book-range code
      was not determined from the image and should be reconciled against the
      catalogue.
