transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ; livro de óbitos. Margem: "D. Ignacia
  Maria de Jesus".] "Aos vinte e dois dias do mez de Abril de mil oitocentos setenta e
  oito, foi sepultado no Cemiterio publico desta Villa de Santo Antonio da Sapucaia, o
  corpo de D. Ignacia Maria de Jesus, viuva de Antonio Caetano Machado, de sessenta e
  cinco annos de idade, a qual falleceu de Degeneração adiposa do coração, e foi
  encommendada e acompanhada ao Cemiterio; de que para constar fiz este assentamento
  que assigno. O Cura Francisco Rodrigues Lageira."
abstract: >-
  The original 1878 death/burial register entry (Santo Antônio de Sapucaia, RJ) of D.
  Ignacia Maria de Jesus (P-0046): buried 22 April 1878, widow of Antonio Caetano
  Machado (P-0045), aged 65 (so born c.1813), cause "degeneração adiposa do coração".
  A strong candidate for the mother of Rita Ignacia de Jesus (P-0041) — the wife of
  Antonio Caetano Machado and the source of the "Ignacia" in her daughter's name — and
  it independently corroborates the "Caetano" reading.
abstract_pt: >-
  O assento original de óbito/sepultamento de 1878 (Santo Antônio de Sapucaia,
  RJ) de D. Ignacia Maria de Jesus (P-0046): sepultada em 22 de abril de 1878,
  viúva de Antonio Caetano Machado (P-0045), aos 65 anos (portanto nascida por
  volta de 1813), causa "degeneração adiposa do coração". Uma forte candidata a
  mãe de Rita Ignacia de Jesus (P-0041) — a esposa de Antonio Caetano Machado e a
  origem do "Ignacia" no nome da filha — e corrobora de forma independente a
  leitura "Caetano".
reliability:
  assessment: >-
    Direct primary parish evidence for Ignacia Maria de Jesus's death, approximate
    birth year and her marriage to Antonio Caetano Machado.
  informant: The Cura Francisco Rodrigues Lageira of Santo Antônio de Sapucaia (1878).
  limitations: >-
    Proves she was Antonio Caetano Machado's widow; her identity as Rita Ignacia de
    Jesus's (P-0041) mother is inferred from that marriage plus the name pattern (Rita
    **Ignacia** ← **Ignacia** Maria de Jesus), not directly stated.
