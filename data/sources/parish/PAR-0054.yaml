transcription: >-
  [Livro de Baptismos, Nova Friburgo, fólio 223, 1832; Vigário Jacob Joyé.] "Aos dezenove
  d'agosto de mil oito centos e trinta e dous baptizei solenemente a Francisco Joze,
  nascido aos 9 de julho, filho legitimo de Jacob Bohrer e de sua mulher Catharina Moser,
  moradores n'esta freguezia: forão padri[nhos] Joze Moser e Maria Moser; e para constar
  fiz este a[ssen]to e por ser verd.e assignei. O Vigario Jacob Joyé."
abstract: >-
  Parish baptism of Francisco José Bohrer (P-0034) — Iris Bohrer Muniz's 3×-great-grandfather
  on the Bohrer maternal line — born 9 July 1832, baptised 19 August 1832 at São João
  Baptista, Nova Friburgo, legitimate son of Jacob Bohrer (P-0050) × Catharina Moser (P-0051).
  A primary act fixing his birth (was ~1832 inferred) and confirming his parentage; upgrades
  that link secondary→primary. Godparents José Moser and Maria Moser (maternal kin).
abstract_pt: >-
  Batismo paroquial de Francisco José Bohrer (P-0034) — trisavô de Iris Bohrer Muniz na linha
  materna Bohrer — nascido em 9 de julho de 1832, batizado em 19 de agosto de 1832 em São João
  Baptista, Nova Friburgo, filho legítimo de Jacob Bohrer (P-0050) × Catharina Moser (P-0051).
  Ato primário que fixa seu nascimento (antes inferido ~1832) e confirma sua filiação; eleva
  esse vínculo de secundário para primário. Padrinhos José Moser e Maria Moser (parentela
  materna).
