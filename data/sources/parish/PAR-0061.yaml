transcription: >-
  [Livro de Baptismos, Nova Friburgo, p.160, 1828; Vigário Jacob Joye.] "Aos treze dias de outubro
  de mil oito centos vinte oito baptizei no termo d'esta freguezia e pus os S. Oleos a Vicente
  nascido a seis de Setembro filho legitimo de Lourenço Bhorer e da sua mulher Anna Maria Verly
  [Wehrli] naturaes do cantão de Soleure. Forão padrinhos Vicente Jacond [uncertain] e Catharina
  Eggendorn e para constar fiz este assento... O Vigario Jacob Joye."
abstract: >-
  Parish baptism of Vicente Borer (P-0070), born 6 September 1828, baptised 13 October 1828 at Nova
  Friburgo, legitimate son of Laurent (Lourenço) Borer (P-0068) × Anna Maria Wehrli (P-0069).
  Confirms his birth event E-0062 (upgrade to confirmed). Godmother Catharina Eggendorn.
