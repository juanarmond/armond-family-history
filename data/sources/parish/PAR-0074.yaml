transcription: >-
  [Livro de Baptismos, Nova Friburgo, fl.207, 1902.] "2150. Aos quatorze dias do mes de Setembro de
  mil novecentos e dois baptisei solemnemente a Valentim Luciano, nascido á quatorze de Maio do
  dito anno, filho legitimo de Valentim Martinho Borker [Bohrer] e Carolina Klein. Forão padrinhos
  Vicente Borber Junior e Hortencia Heckdorn. Para constar fiz este assento, que assigno. O Vigario
  José Silvestre Alves de Miranda." [Na mesma folha, entry 2151: "Maria Yzaura, nascida á vinte
  cinco de Abril do dito anno, filha legitima de Vicente Borber Junior e Hortencia Heckdorn;
  padrinhos Valentim Martinho Borker e Carolina Klein" — colateral, não modelado.]
abstract: >-
  Parish baptism of Valentim Luciano Bohrer, born 14 May 1902 and baptised 14 September 1902 at
  Nova Friburgo, legitimate son of Valentim Martinho Bohrer (P-0028) and Carolina Klein (P-0029) —
  i.e. a younger sibling of the direct ancestor João Gonçalves Bohrer (P-0014). Recorded as a
  documented child on family F-0013. The same register page also baptises Maria Yzaura, daughter of
  Vicente Bohrer Junior × Hortencia Heckdorn (a collateral branch descending from Vicente Borer ×
  Maria Heggendorn, F-0034) — noted here but not modelled. The two brothers' households stand as
  godparents to each other's children.
abstract_pt: >-
  Batismo paroquial de Valentim Luciano Bohrer, nascido em 14 de maio de 1902 e baptizado em 14 de
  setembro de 1902 em Nova Friburgo, filho legítimo de Valentim Martinho Bohrer (P-0028) e Carolina
  Klein (P-0029) — ou seja, um irmão mais novo do ancestral direto João Gonçalves Bohrer (P-0014).
  Registrado como filho documentado na família F-0013. A mesma folha do registro também baptiza
  Maria Yzaura, filha de Vicente Bohrer Junior × Hortencia Heckdorn (ramo colateral descendente de
  Vicente Borer × Maria Heggendorn, F-0034) — mencionada aqui, mas não modelada. Os dois lares dos
  irmãos figuram como padrinhos dos filhos um do outro.
