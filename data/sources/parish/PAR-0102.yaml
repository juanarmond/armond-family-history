transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos "Batismos 1829,
  Out-1842, Jan". Two-page spread: an unnumbered left-hand page and fl. 384 (folio
  number and the rubric "Menezes" at its top right). The tail of an entry from the
  preceding page, then five entries of 24 January-9 March 1841, all in the hand of
  the coadjutor João Martins Gurgel do Amaral, each closed with a "#" mark. Every
  entry on the spread is transcribed below in reading order; the last one runs on
  to the next folio, which is not on this image. Read from the image 2026-10-10.
  TARGET entries: João (left page, fourth item, continuing at the head of fl. 384)
  and Maria (fl. 384, second item; margin "M.a").]


  [Left page, head — tail of an entry from the preceding page] "… fazer este termo,
  que assignei. O Coadjuctor João Martins Gurgel do Am.al"


  [Left page, entry 1; margin "Joquina" and, below, "#"] "Aos vinte quatro de
  Janeiro de mil oi-to centos, e quarenta, e hum nesta Matriz de Itaborahy de
  licença Parochial Baptisou, e poz os Santos Oleos o Reverendo José Antonio
  Ferreira Pacheco á innocente Joquina filha legitima de José Francisco Pereira, e de
  [uncertain: Tha-cina] Paulla: forão padrinhos Francisco Va[z] [uncertain] da Silva;
  de que fiz este que assignei. # O Coadjuctor João Martins Gurgel do Am.al"


  [Left page, entry 2; margin "Carolina"] "Aos tres de Fevereiro de mil oito digo
  aos tres de Março de mil oito centos, e quarenta, e hum nesta Matriz de Itaborahy
  Baptisei, e puz os Santos Oleos á innocente Carolina, filha legitima de Antonio
  Claudianno, e Ber-narda de tal: foi padrinho Francisco Nunes Vieira; do que mandei
  fazer este termo, que assignei. # O Coadjuctor João Martins Gurgel do Am.al"


  [Left page, entry 3, continued on fl. 384 — TARGET; margin "João"] "Aos quatro de
  Março de mil oito centos e quarenta e hum nesta Matriz de I-taborahy Baptisei, e
  puz os Santos Oleos ao innocente João nascido a dezaseis de Agosto de mil oito
  centos e trinta e nove filho legitimo de Manoel de Lemos Pereira, e de Maria
  Thereza de Jesus: neto paterno de José Henriques de Mattos, e Ma-ria digo, de Anna
  Maria da Conceição: mate- [foot of the left-hand page; fl. 384 begins:] materno de
  José Campello de Morais, todos naturaes desta Freguezia de Itabo-rahy, e
  Emmerencianna Maria de Jesus: fo-rão padrinhos o Reverendo José Antonio Ferreira
  Pacheco; do que mandei fazer este termo, que assignei. # O Coadjuctor João Martins
  Gurgel do Amaral" ["Maria digo" is a self-correction in the line, not a
  strike-through: the scribe began "Maria" and corrected it to "Anna Maria". The word
  "materno" is begun at the foot of the left page and written whole at the head of
  fl. 384. In "Emmerencianna" this hand runs the minims together; the doubled "m"
  is read by comparison with the 1821 form (PAR-0101).]


  [Fl. 384, entry 2 — TARGET; margin "M.a"] "Aos quatro de Março de mil oito centos,
  e quarenta e hum nesta Matriz de Itabo-rahy Baptisei, e puz os Santos Oleos á
  in-nocente Maria nascida a vinte quatro de Septembro de mil oito centos, e quarenta
  filha legitima de Manoel de Lemos Perei-ra, e de Maria Thereza de Jesus: neto
  pa-terno de José Henriques de Mattos, e An-na Maria da Conceição: materno de José
  Campello de Morais, e Emerencian-na Maria de Jesus; foi padrinho o Reve-rendo José
  Antonio Ferreira Pacheco; do que mandei fazer este termo, que assignei. # O
  Coadjuctor João Martins Gurgel do Amaral" ["neto" is written in the masculine for
  Maria. "Emerencian-na": the minims again run together; a single "m" is the better
  reading here.]


  [Fl. 384, entry 3; margin "Luiz"] "Aos nove de Março de mil oito centos, e
  qua-renta e hum nesta Matriz de Itaborahy Baptisei, e puz os Santos Oleos ao
  Innocen-te Luiz filho legitimo de Joaquim Marian-no dos Santos, e Maria Candida
  digo Antonia Candida de Santo Antonio: ignora-se o mais. Forão [continued on the
  next folio, not on this image]"
abstract: >-
  Two consecutive Itaboraí baptisms of 4 March 1841, by the coadjutor João Martins
  Gurgel do Amaral: João, born 16 August 1839, and Maria, born 24 September 1840,
  legitimate children of Manoel de Lemos Pereira (P-0052) and Maria Thereza de Jesus
  (P-0053), with the Reverendo José Antonio Ferreira Pacheco as godfather of both.
  Both entries name all four grandparents: paternal, José Henriques de Mattos
  (P-0132) and Anna Maria da Conceição (P-0133; "Maria digo, de Anna Maria" in João's
  entry — "Anna Joaquina" in 1821); maternal, José Campello de Morais (P-0134) and
  Emmerencianna/Emerencianna Maria de Jesus (P-0135). They are the youngest children
  of the couple held here, younger siblings of Rosa Eugenia de Lemos (P-0035), and
  they repeat the grandparents named twenty years earlier for their brother Antonio
  (PAR-0101). Three other entries of January-March 1841, and the tail of an earlier
  one, share the spread (unrelated families). The parents' identification with P-0052/P-0053 is strong evidence, not
  proven (see reliability).
abstract_pt: >-
  Dois batismos consecutivos em Itaboraí, de 4 de março de 1841, pelo coadjutor João
  Martins Gurgel do Amaral: João, nascido em 16 de agosto de 1839, e Maria, nascida em
  24 de setembro de 1840, filhos legítimos de Manoel de Lemos Pereira (P-0052) e de
  Maria Thereza de Jesus (P-0053), tendo o Reverendo José Antonio Ferreira Pacheco
  como padrinho de ambos. Os dois assentos nomeiam os quatro avós: paternos, José
  Henriques de Mattos (P-0132) e Anna Maria da Conceição (P-0133; "Maria digo, de Anna
  Maria" no assento de João — "Anna Joaquina" em 1821); maternos, José Campello de
  Morais (P-0134) e Emmerencianna/Emerencianna Maria de Jesus (P-0135). São os filhos
  mais novos do casal disponíveis aqui, irmãos mais novos de Rosa Eugenia de Lemos
  (P-0035), e repetem os avós nomeados vinte anos antes para seu irmão Antonio
  (PAR-0101). Outros três assentos de janeiro-março de 1841, e o final de um anterior,
  dividem a página dupla (famílias sem relação). A identificação dos pais com P-0052/P-0053 é evidência
  forte, não prova (ver reliability).
reliability:
  assessment: >-
    Direct primary parish evidence, clearly legible for every core fact: both
    children, their birth and baptism dates, the parents in the full form of the
    1830s entries ("Manoel de Lemos Pereira", "Maria Thereza de Jesus"), and all four
    grandparents. Their link to Rosa Eugenia de Lemos is strong evidence, not proven:
    it rests on identifying these parents with P-0052 × P-0053 — the same names in
    the same parish register series as Rosa's 1835 baptism (PAR-0016) and the 1832,
    1834, 1836 and 1838 sibling entries — and on the agreement with PAR-0101, which
    names the same grandparents for the same couple in 1821. The retrieval side
    reports no competing couple of these names in its sweep of the 1821-1842 books
    [LEAD — sweep not repeated here]. No held record states the identity outright.
  informant: >-
    Not stated. Baptised and entered by the coadjutor João Martins Gurgel do Amaral
    ("Baptisei … do que mandei fazer este termo, que assignei").
  limitations: >-
    The paternal grandmother is "Anna Maria da Conceição" in both entries (written
    after "Ma-ria digo," in João's), against "Anna Joaquina da Conceição" in 1821
    (PAR-0101): one woman by inference — the same husband and the same son's
    household — not by statement. In João's entry the formula "todos naturaes desta
    Freguezia de Itaborahy" stands directly after José Campello de Morais's name;
    read literally it would make him a native of Itaboraí, against the specific
    "natural do Porto" of 1821. The 1821 statement is specific and the 1841 formula
    is generic and misplaced (it also splits the couple), so the 1821 origin is
    preferred; the conflict is recorded, not resolved. Maria's entry gives no
    naturalidade. Neither entry states that the grandparents were married or living.
