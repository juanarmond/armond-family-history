notes:
- text: >-
    Siblings of Rosa Eugenia de Lemos (P-0035) [STRONG — through the parents'
    identification]: João (b. 16 August 1839) and Maria (b. 24 September 1840), both
    baptised 4 March 1841 — the youngest children of the couple held here, born when
    Rosa was about four and five. To be recorded as two documented_children on
    F-0025. This Maria is a second daughter of the name: an elder Maria was baptised
    14 July 1832 (PAR-0030), so the 1832 Maria had probably died by 1840 [INFERRED —
    no death held]. No events are created for these collaterals.
  text_pt: >-
    Irmãos de Rosa Eugenia de Lemos (P-0035) [STRONG — pela identificação dos pais]:
    João (n. 16 de agosto de 1839) e Maria (n. 24 de setembro de 1840), ambos batizados
    em 4 de março de 1841 — os filhos mais novos do casal disponíveis aqui, nascidos
    quando Rosa tinha cerca de quatro e cinco anos. A registrar como dois
    documented_children em F-0025. Esta Maria é uma segunda filha do nome: uma Maria
    mais velha foi batizada em 14 de julho de 1832 (PAR-0030), de modo que a Maria de
    1832 provavelmente já havia morrido em 1840 [INFERRED — nenhum óbito disponível].
    Nenhum evento é criado para estes colaterais.
- text: >-
    Reading checked against the retrieval side's claim (2026-10-10). Confirmed: João
    b. 16 August 1839 ("dezaseis de Agosto de mil oito centos e trinta e nove") and
    Maria b. 24 September 1840, both baptised 4 March 1841; "neto paterno de José
    Henriques de Mattos, e Ma-ria digo, de Anna Maria da Conceição: materno de José
    Campello de Mor[ais] … e Emmerencianna Maria de Jesus"; godfather the Reverendo
    José Antonio Ferreira Pacheco. Differs in detail: "Maria digo" is a written
    self-correction, not a struck word; the surname ends "-ais" ("Morais") in both
    1841 entries, against "Moraes" in 1821; and the elided words in the quoted claim
    are "todos naturaes desta Freguezia de Itaborahy", which here follow José
    Campello's name (see reliability). Maria's entry writes the grandmother "Anna
    Maria da Conceição" without the correction.
  text_pt: >-
    Leitura conferida com a afirmação da pesquisa de recuperação (2026-10-10).
    Confirmado: João n. 16 de agosto de 1839 ("dezaseis de Agosto de mil oito centos e
    trinta e nove") e Maria n. 24 de setembro de 1840, ambos batizados em 4 de março
    de 1841; "neto paterno de José Henriques de Mattos, e Ma-ria digo, de Anna Maria da
    Conceição: materno de José Campello de Mor[ais] … e Emmerencianna Maria de Jesus";
    padrinho o Reverendo José Antonio Ferreira Pacheco. Difere em detalhe: "Maria
    digo" é uma autocorreção escrita, não uma palavra riscada; o sobrenome termina em
    "-ais" ("Morais") nos dois assentos de 1841, contra "Moraes" em 1821; e as
    palavras omitidas na citação são "todos naturaes desta Freguezia de Itaborahy",
    que aqui vêm depois do nome de José Campello (ver reliability). O assento de Maria
    escreve a avó "Anna Maria da Conceição" sem a correção.
