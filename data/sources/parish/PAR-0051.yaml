transcription: >-
  [N. Sra. Mãe de Deus (Povoação, São Miguel) baptism register; right-hand entry, margin
  "Manoel".] "Manoel filho legitimo de João Muniz e Maria Jac[i]nta, ambos naturaes e
  freguezes desta Par[oquia]l Igr[eja] de N. S[enho]ra Mãe de Deos, do lugar da Povoação,
  nasceo aos doze de Junho de mil oito centos e vinte dous annos, e foi baptizado aos
  dezasete do dito mez, sendo nesta dita Igr[eja], pelo Rev[erendo] Padre José [Vieira?]
  cura da Igr[eja] de Santa Barbara anexa a esta Par[oquia]l. Foraõ padrinhos Ant[onio] de
  Medeiros Brandão e sua mulher Anna de Souza, ambos naturaes e freguezes desta dita
  Paroquial; foraõ testemunhas João Jacinto Botelho e André Luiz; e para constar fiz este
  assento em N. S[enho]ra…"
abstract: >-
  Parish baptism of Manoel Muniz Bytancourt (P-0042), born 12 June 1822 and baptised 17
  June 1822 at the Matriz de N. Sra. Mãe de Deus (Povoação, São Miguel), legitimate son of
  João Muniz (P-0048) and Maria Jac[i]nta [de Medeiros] (P-0049), both natives and
  parishioners there. Godparents: Antonio de Medeiros Brandão and his wife Anna de Souza
  (P-0087). This primary record fixes his birth date (previously inferred "about 1820" from
  his age at death) and directly confirms his parentage.
abstract_pt: >-
  Batismo paroquial de Manoel Muniz Bytancourt (P-0042), nascido em 12 de junho de 1822 e
  batizado em 17 de junho de 1822 na Matriz de N. Sra. Mãe de Deus (Povoação, São Miguel),
  filho legítimo de João Muniz (P-0048) e Maria Jac[i]nta [de Medeiros] (P-0049), ambos
  naturais e freguezes dali. Padrinhos: Antonio de Medeiros Brandão e sua mulher Anna de
  Souza (P-0087). Este registro primário fixa sua data de nascimento (antes inferida "por
  volta de 1820" pela idade ao falecer) e confirma diretamente sua filiação.
reliability:
  assessment: >-
    Primary contemporaneous parish baptism naming the child's legitimate parents — a
    direct-primary confirmation of parentage and an exact birth/baptism date.
  informant: Rev. Padre José [Vieira? — uncertain], cura of the Santa Barbara anexa.
  limitations: >-
    The officiant's surname and a few words are an uncertain read; the mother is written
    "Maria Jacinta" (her fuller form is Maria Jacintha de Medeiros, P-0049).
