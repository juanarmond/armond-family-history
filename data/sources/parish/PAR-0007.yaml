transcription: >-
  [Paróquia de Santa Luzia de Carangola, MG; livro de óbitos. Margem: "João 33".] "A
  doze de Setembro de mil novecentos e quinze, ás dez e meia da noite, no lugar
  denominado 'Carrego do Boa Vista' desta Freguezia, falleceu em casa de sua
  residencia João Muniz Bittencourt, natural da Ilha [de] S. Miguel, [Portugal], de
  idade sessenta e oito annos, casado com Suzana Rita Brandão, a qual deixa Onze
  [filhos], entre maiores e menores; de côr branca, filho legitimo de Manoel Luiz
  Bittencourt. Não recebeu nenhum Sacramento, por não [o] chamarem a [tempo]. Causa
  morte, cardi[opatia]. Depois de encommendado ás expensas de sua Familia, foi
  sepultado no Cemiterio desta Cidade. Para constar faço este assentamento. [assina]
  P.e João [Carvalho]."
abstract: >-
  The original 1915 death register entry (Santa Luzia de Carangola, MG) of João Muniz
  Bittencourt (P-0019): died 12 September 1915 at Carrego do Boa Vista, aged 68 (so
  born c.1847), married to Suzana Rita Brandão (P-0020), leaving eleven children. It
  states he was "natural da Ilha de São Miguel" (Açores, Portugal) — primary
  confirmation that he was the Azorean immigrant of the line — and names his father
  Manoel Luiz Bittencourt (P-0042); his mother is not named.
reliability:
  assessment: >-
    Direct primary parish evidence for João's death, approximate birth year, São
    Miguel (Azorean) origin, marriage and paternity.
  informant: The recording vigário of Santa Luzia de Carangola (1915).
  limitations: >-
    Handwritten register; the priest's surname and the exact cause word are uncertain
    reads. The mother is not named.
