notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T8): "do Penedo" is clear (the
    draft marked it "[?]"); the priest writes "Solenemente", not "solemnemente"; the word
    before "de Galiza" is cramped ("Rino"/"Reino") and is marked [uncertain: Reino]. The rest
    was confirmed word by word, including the dates (3 and 7 December 1843), "Joaquina Roza"
    and "Ignacio Joze Lopes".
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T8): "do Penedo" é claro
    (o rascunho o marcava "[?]"); o padre escreve "Solenemente", não "solemnemente"; a palavra
    antes de "de Galiza" é apertada ("Rino"/"Reino") e fica marcada [uncertain: Reino]. O
    restante foi conferido palavra por palavra, inclusive as datas (3 e 7 de dezembro de
    1843), "Joaquina Roza" e "Ignacio Joze Lopes".
- text: >-
    Identification and what the record adds. The parents "Bento Fernandes, e … Joaquina Roza"
    of Quintão are identified with P-0141 × P-0142, and the grandparents with P-0143 × P-0144
    and P-0145 × P-0146, by the matching names, lugar and parish, as in the couple's other
    children's baptisms; the identification is strong, not proven. The entry gives the
    maternal grandfather as "Ignacio Joze Lopes" (see PAR-0115 on the uncle of that name) and
    names the godparents Bento Martins, of Galicia, and Maria Thereza, daughter of Anna Maria,
    widow, of Penedo, Quintão (not identified with any modelled person). This Bento is very
    probably the son Bento who married Maria da Costa at Ucha in 1866, whose marriage gives
    his father as a native of Ucha and his mother as a native of Pousa (a lead from the
    retrieval side's marriage sweep, not shown here). He can be recorded as a documented child
    of F-0071 with this source; the namesake must be kept apart from P-0141.
  text_pt: >-
    Identificação e o que o registro acrescenta. Os pais, "Bento Fernandes, e … Joaquina Roza",
    do Quintão, são identificados com P-0141 × P-0142, e os avós com P-0143 × P-0144 e
    P-0145 × P-0146, pelos nomes, lugar e freguesia coincidentes, como nos batismos dos outros
    filhos do casal; a identificação é forte, não provada. O assento dá o avô materno como
    "Ignacio Joze Lopes" (ver o PAR-0115 sobre o tio desse nome) e nomeia os padrinhos Bento
    Martins, da Galiza, e Maria Thereza, filha de Anna Maria, viúva, do Penedo, Quintão (não
    identificados com pessoa modelada). Este Bento é muito provavelmente o filho Bento que se
    casou com Maria da Costa na Ucha em 1866, cujo casamento dá o pai como natural da Ucha e a
    mãe como natural da Pousa (pista da varredura de casamentos da pesquisa de recuperação,
    que este registro não mostra). Pode ser registrado como filho documentado da F-0071 com
    esta fonte; o homônimo deve ser mantido separado de P-0141.
- text: >-
    The fl. 58 entry. On 29 January 1844 José, son of Francisco de Oliveira and his wife
    Jozefa Fernandes of the lugar de Quintão, was baptised; his maternal grandparents are
    "Manoel Fernandes, e Jozefa Fernandes do sobredito lugar de Quintão". The parents are
    very probably the "Francisco d'Oliveira, e Jozefa Maria" of Quintão whose son Manoel was
    baptised on 16 March 1839 with "Manoel Fernandes avo materno" as godfather (fl. 45,
    transcribed in PAR-0118): the same father, the same paternal grandparents (Domingos José
    de Oliveira × Joanna Maria, of Salvador da Lama) and the same lugar. Here the grandmother
    is "Jozefa Fernandes", not "Jozefa Maria". Whether this Manoel Fernandes is P-0143 — which
    would make the mother a sister of Bento José and would put P-0143 alive in March 1839,
    against the "ja defuntos" of PAR-0116 — is not established by these records. Neither
    entry is evidence for a modelled person until the couple is identified.
  text_pt: >-
    O assento do fl. 58. Em 29 de janeiro de 1844 foi batizado José, filho de Francisco de
    Oliveira e de sua mulher Jozefa Fernandes, do lugar de Quintão; os avós maternos são
    "Manoel Fernandes, e Jozefa Fernandes do sobredito lugar de Quintão". Os pais são muito
    provavelmente o "Francisco d'Oliveira, e Jozefa Maria", do Quintão, cujo filho Manoel foi
    batizado em 16 de março de 1839 tendo por padrinho "Manoel Fernandes avo materno" (fl. 45,
    transcrito no PAR-0118): o mesmo pai, os mesmos avós paternos (Domingos José de Oliveira ×
    Joanna Maria, do Salvador da Lama) e o mesmo lugar. Aqui a avó é "Jozefa Fernandes", não
    "Jozefa Maria". Se este Manoel Fernandes é P-0143 — o que faria da mãe uma irmã de Bento
    José e poria P-0143 vivo em março de 1839, contra o "ja defuntos" do PAR-0116 — não fica
    estabelecido por estes registros. Nenhum dos dois assentos é prova para uma pessoa
    modelada enquanto o casal não for identificado.
