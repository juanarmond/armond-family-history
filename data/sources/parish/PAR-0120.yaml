transcription: |-
  [Single image — São Romão da Ucha baptisms, DGS 004669216, Book 2, opening fl. 57v–58. The
  target entry is the third on fl. 57v and complete on that page. The last entry on fl. 58
  names a "Manoel Fernandes, e Jozefa Fernandes" of Quintão and is transcribed in full below.
  Spelling, capitals and abbreviations as written; the line breaks of the register are kept;
  expansions follow in a separate bracket. Hand of the parish priest Antonio José Corrêa.
  Read from the image on 2026-10-12.]

