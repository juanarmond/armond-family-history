reading_reliability: complete
abstract: >-
  Original baptism entry of Bento, the third entry on fl. 57v of the second baptism book of
  São Romão da Ucha (Barcelos), the last of the couple's children in this book, which ends in
  1844. "Bento filho legitimo de Bento Fernandes, e de Joaquina Roza" of the lugar de Quintão
  was born on 3 December 1843 and baptised on the 7th by the Padre Manoel José da Costa, of
  the parish of Prado, with the licence of the parish priest Antonio José Corrêa, who signed.
  The paternal grandparents are "Manoel Fernandes, e Jozefa Maria" of the same lugar; the
  maternal grandparents are "Ignacio Joze Lopes, e Marianna da Silva" of the parish of
  Pousa. The godparents were Bento Martins, of the [Reino] de Galiza, and Maria Thereza,
  daughter of Anna Maria, widow, of Penedo, lugar de Quintão. This Bento is a son of Bento
  José Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142), a brother of Manoel João (P-0139),
  and must not be confused with his father.
abstract_pt: >-
  Assento original de batismo de Bento, o terceiro do fl. 57v do segundo livro de batismos de
  São Romão da Ucha (Barcelos), o último dos filhos do casal neste livro, que termina em 1844.
  "Bento filho legitimo de Bento Fernandes, e de Joaquina Roza", do lugar de Quintão, nasceu
  em 3 de dezembro de 1843 e foi batizado no dia 7 pelo padre Manoel José da Costa, da
  freguesia de Prado, com licença do pároco Antonio José Corrêa, que assinou. Os avós paternos
  são "Manoel Fernandes, e Jozefa Maria", do mesmo lugar; os maternos, "Ignacio Joze Lopes, e
  Marianna da Silva", da freguesia da Pousa. Foram padrinhos Bento Martins, do [Reino] de
  Galiza, e Maria Thereza, filha de Anna Maria, viúva, do Penedo, lugar de Quintão. Este
  Bento é filho de Bento José Fernandes (P-0141) e de Joaquina Rosa Lopes (P-0142), irmão de
  Manoel João (P-0139), e não deve ser confundido com o pai.
reliability:
  assessment: >-
    Original, written and signed by the parish priest at the time: primary and direct for the
    baptism, its date, the birth date, the child, the parents as named and the godparents;
    the grandparents' names are reported by the family and are secondary in principle. The
    baptism itself was performed by a visiting priest; the parish priest wrote and signed the
    entry. Every core fact is clearly legible — the dates, the child, both parents, all four
    grandparents and the lugar — so reading_reliability is complete. The only [uncertain]
    mark in the target falls on the word before "de Galiza" in the godfather's description.
  informant: >-
    The parish priest of São Romão da Ucha, Antonio José Corrêa, who wrote and signed; the
    baptism was performed by the Padre Manoel José da Costa of Prado; the grandparents' names
    were presumably supplied by the family.
  limitations: >-
    The maternal grandfather is "Ignacio Joze Lopes" here, against "Ignacio Lopes" and
    "Ignacio Francisco Lopes" in other entries and an "Ignacio José Lopes" called the mother's
    uncle in 1835 (PAR-0115). No grandparent is called deceased here, although the baptism of
    29 March 1837 (PAR-0116) calls all four dead.
