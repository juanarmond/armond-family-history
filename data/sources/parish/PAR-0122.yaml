reading_reliability: complete
abstract: >-
  Two original marriage entries in the São Romão da Ucha (Barcelos) marriage book, each written
  by the Abbade Antonio Joze Correia and each running over a page turn. On 21 March 1868 (Nº 3)
  he married João Fernandes, solteiro, aged 38, natural of the parish and baptised there,
  legitimate son of Bento Fernandes and Joaquina Roza, to Maria Villasboas, aged 28, legitimate
  daughter of João de Villasboas and Joanna da Silva, of the parish of São João de Villaboa in
  the same concelho; the witnesses were Joze Carlos de Azevedo, solteiro, lavrador, of the lugar
  da Torre, and Domingos Rodrigues, solteiro, of Bairros. The groom signed his name; the bride
  signed with a cross. On 20 July 1868 (Nº 7) he married Joze Fernandes, solteiro, aged 22,
  legitimate son of Bento Fernandes and Joaquina Roza, of the lugar de Quintão, to Maria Forte,
  solteira, aged 21, legitimate daughter of João Joze da Silva Forte and Maria Thereza, of the
  lugar da Bouça, both parties natural of and baptised in Ucha; the witnesses were João Joaquim
  de Oliveira, cazado, lavrador, of the lugar da Torre, who signed, and Joaquim da Silva, the
  Abbade's familiar. The groom and the second witness made crosses. Both grooms are collaterals:
  brothers of Manoel João Fernandes da Cruz (P-0139), sons of Bento José Fernandes (P-0141) and
  Joaquina Rosa Lopes (P-0142), family F-0071.
abstract_pt: >-
  Dois assentos originais de casamento no livro de casamentos de São Romão da Ucha (Barcelos),
  ambos escritos pelo Abade Antonio Joze Correia e ambos com mudança de página. Em 21 de março de
  1868 (Nº 3) ele casou João Fernandes, solteiro, de 38 anos, natural da freguesia e nela
  batizado, filho legítimo de Bento Fernandes e de Joaquina Roza, com Maria Villasboas, de 28
  anos, filha legítima de João de Villasboas e de Joanna da Silva, da freguesia de São João de
  Villaboa, do mesmo concelho; foram testemunhas Joze Carlos de Azevedo, solteiro, lavrador, do
  lugar da Torre, e Domingos Rodrigues, solteiro, de Bairros. O noivo assinou o próprio nome; a
  noiva assinou de cruz. Em 20 de julho de 1868 (Nº 7) ele casou Joze Fernandes, solteiro, de 22
  anos, filho legítimo de Bento Fernandes e de Joaquina Roza, do lugar de Quintão, com Maria
  Forte, solteira, de 21 anos, filha legítima de João Joze da Silva Forte e de Maria Thereza, do
  lugar da Bouça, ambos naturais da Ucha e nela batizados; foram testemunhas João Joaquim de
  Oliveira, casado, lavrador, do lugar da Torre, que assinou, e Joaquim da Silva, familiar do
  Abade. O noivo e a segunda testemunha fizeram cruz. Os dois noivos são colaterais: irmãos de
  Manoel João Fernandes da Cruz (P-0139), filhos de Bento José Fernandes (P-0141) e de Joaquina
  Rosa Lopes (P-0142), família F-0071.
reliability:
  assessment: >-
    Original and direct. Each entry is primary for its marriage, date, place, parties, witnesses
    and officiant: the Abbade assisted, wrote the entry and signed it with the witnesses who
    could write. The ages and the parents' names were declared to him and are secondary
    information. Every core fact of both entries is legible across the page turns: the dates
    (also in the margins), both grooms and brides, their ages and their parents. The inline
    uncertain marks fall only on the catchword at the foot of image 492, on the word "Cruz" of
    the signing formula, on one word and one signature of the first witness of Nº 7, and on the
    abbreviation of "Joze" in the margin of Nº 7.
  informant: >-
    The Abbade of São Romão da Ucha, Antonio Joze Correia, who assisted at both marriages; the
    ages and parentage were presumably declared by the parties. João Fernandes signed his own
    entry; Joze Fernandes made a cross.
  limitations: >-
    Nº 3 gives no lugar for João or his parents and no estado for the bride; Nº 7 gives the lugar
    de Quintão. Neither entry names grandparents or says whether the groom's father was living.
    The right page of image 494 is numbered "132" as read, although the text runs on without a
    gap from fl. 130 (see notes).
