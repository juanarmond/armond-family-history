transcription: |-
  [Three consecutive openings — São Romão da Ucha marriages, DGS 004670018 images 492, 493 and 494 — holding two entries about the family: 1868 Nº 3 (João Fernandes) and 1868 Nº 7 (Joze Fernandes). Every entry is written and signed by the Abbade Antonio Joze Correia. Read from the native images (3876×2820, 3820×2820, 3844×2820) in strips at 1–5× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written. This hand writes the tilde over the final o ("Romaõ", "comparecerão"); it is rendered "ão" throughout. The numeral word for "sessenta" is written in a cramped form, read "secenta".]

  [p1 — evidence/parish/PAR-0122-marriages-joao-and-jose-fernandes-1868-ucha-p01.jpg; image 492]

  [left page, entry Nº 4 of 1867 — 11 December 1867: Antonio Fernandes, solteiro, 22, natural and baptised in Santa Eullalia de Oliveira, son of Manoel Joze Fernandes and Maria de Macedo, with Rita Gomes, solteira, 19, natural of this parish, natural daughter of Maria Roza Gomes; witnesses Domingos Joze da Costa, carpinteiro, son of Manoel Joze da Costa of the lugar do Assento, and Joaquim da Silva, "meu familiar"; signed "Do Nubente Ant.o + Frz" and "Domingos Joze da Costa". An Antonio Fernandes of Santa Eulália de Oliveira; nothing ties him to this family.]

  [left page, heading "Anno de 1868"; entry Nº 1 — 3 February 1868: Antonio Rodrigues Valente, solteiro, 27, son of Manoel Rodrigues Valente, with Roza Domingues, solteira, 25, natural of this parish, daughter of Pedro Domingues and Thereza Maria de Affonceca; the entry ends at the top of fl. 129. Not this family.]

  [fl. 129, entry Nº 2 — 15 March 1868: Bento da Silva, solteiro, 24, natural of São Paio de [uncertain: Parada], concelho de Braga, son of Francisco da Silva and his wife Anna, with Roza Domingues, solteira, 25, natural of this parish, daughter of Joze Fernandes and Roza Domingues; witnesses Manoel Joze da Costa, cazado, lavrador, of the lugar do Assento, and Francisco Domingues, cazado, oleiro, of the lugar de [uncertain: Macedo]; the bride signed with a cross; signed "Manoel Joze da Costa". The bride's father is a Joze Fernandes; nothing in the entry ties him to the family of Bento Fernandes.]

