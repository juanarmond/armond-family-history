notes:
- text: >-
    One source, two marriages. The event_date is that of the first entry (21 March 1868, Nº 3,
    João Fernandes); the second entry is of 20 July 1868 (Nº 7, Joze Fernandes, original text "Aos
    vinte dias do mez de Julho do anno de mil oito centos secenta e oito"). Both entries are
    transcribed in full, each continuous across its page turn.
  text_pt: >-
    Uma fonte, dois casamentos. O event_date é o do primeiro assento (21 de março de 1868, Nº 3,
    João Fernandes); o segundo assento é de 20 de julho de 1868 (Nº 7, Joze Fernandes, texto
    original "Aos vinte dias do mez de Julho do anno de mil oito centos secenta e oito"). Os dois
    assentos estão transcritos por inteiro, cada um contínuo através da sua mudança de página.
- text: >-
    Identification. Both grooms are sons of "Bento Fernandes, e Joaquina Roza", the names under
    which P-0141 and P-0142 appear in the other Ucha records; Nº 7 adds their lugar, Quintão. João,
    38 on 21 March 1868, was born between March 1829 and March 1830; that fits João José,
    baptised in Ucha on 1 May 1829 as a son of Bento José Fernandes and Joaquina (PAR-0113, per
    the retrieval side's reading). Joze, 22 on 20 July 1868, was born between July 1845 and July
    1846. He cannot be the José baptised in 1839 (PAR-0118), whose baptism carries a note that he
    died on 1 April 1845 (per the retrieval side's reading); he is a later son, whose baptism
    falls after the end of the Ucha baptism book swept (1745–1844). The identifications rest on
    the parents' names, the parish, the lugar (for Nº 7) and the ages; they are strong, not
    proven.
  text_pt: >-
    Identificação. Os dois noivos são filhos de "Bento Fernandes, e Joaquina Roza", os nomes com
    que P-0141 e P-0142 aparecem nos outros registros da Ucha; o Nº 7 acrescenta o lugar deles,
    Quintão. João, com 38 anos em 21 de março de 1868, nasceu entre março de 1829 e março de 1830;
    isso combina com João José, batizado na Ucha em 1º de maio de 1829 como filho de Bento José
    Fernandes e de Joaquina (PAR-0113, segundo a leitura da pesquisa de recuperação). Joze, com 22
    anos em 20 de julho de 1868, nasceu entre julho de 1845 e julho de 1846. Não pode ser o José
    batizado em 1839 (PAR-0118), cujo batismo traz a nota de que morreu em 1º de abril de 1845
    (segundo a leitura da pesquisa de recuperação); é um filho posterior, cujo batismo cai depois
    do fim do livro de batismos da Ucha examinado (1745–1844). As identificações se apoiam nos
    nomes dos pais, na freguesia, no lugar (para o Nº 7) e nas idades; são fortes, não provadas.
- text: >-
    What the record adds for modelling. Two collateral children of F-0071: João Fernandes (b. c.
    1829–1830; married 1868 Maria Villasboas; he could sign his name) and Joze Fernandes (b. c.
    1845–1846; married 1868 Maria Forte, of the lugar da Bouça; he could not write). This Joze is
    a different child from the José of 1839 who died in 1845. In July 1868 the family was still
    "do lugar de Quintão". The witness Domingos Rodrigues of Bairros also witnessed Bento's
    marriage of 1866 (PAR-0121).
  text_pt: >-
    O que o registro acrescenta à modelagem. Dois filhos colaterais da F-0071: João Fernandes (n.
    c. 1829–1830; casou-se em 1868 com Maria Villasboas; sabia assinar o nome) e Joze Fernandes (n.
    c. 1845–1846; casou-se em 1868 com Maria Forte, do lugar da Bouça; não sabia escrever). Este
    Joze é um filho diferente do José de 1839, que morreu em 1845. Em julho de 1868 a família
    ainda era "do lugar de Quintão". A testemunha Domingos Rodrigues, de Bairros, testemunhou
    também o casamento de Bento em 1866 (PAR-0121).
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.5, T3 and T4).
    The wording is confirmed, with these corrections. The page turns: image 493 begins with the
    full word "filho" (draft "lho"), and image 494 with the full word "Forte" (draft "te"); the
    preceding pages end with the catchwords "fi" and "For". The draft's "José" is "Joze" on the
    image throughout (Joze Fernandes, Joze Carlos de Azevedo, Antonio Joze Corr.a). The numeral
    word reads "secenta" (draft "sessenta"). The signing formula reads "de Cruz" in both entries
    (draft "de cruz [?]"). In Nº 7 the word before "ca- / zado" is illegible on the image; the
    draft's "[solteiro?]" cannot be confirmed. The first witness's signature reads "Joze de
    Oliv.ra e S.a" [uncertain], not the draft's "João Joaqm de Oliveira [?]". The draft's
    "Chatolica" in Nº 7 is confirmed, and Nº 3 has it too.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.5, T3 e T4). O texto foi confirmado, com estas correções.
    As mudanças de página: a imagem 493 começa com a palavra inteira "filho" (rascunho "lho"), e a
    imagem 494 com a palavra inteira "Forte" (rascunho "te"); as páginas anteriores terminam com
    os reclamos "fi" e "For". O "José" do rascunho é "Joze" na imagem em todo o texto (Joze
    Fernandes, Joze Carlos de Azevedo, Antonio Joze Corr.a). O numeral lê-se "secenta" (rascunho
    "sessenta"). A fórmula de assinatura lê-se "de Cruz" nos dois assentos (rascunho "de cruz
    [?]"). No Nº 7, a palavra antes de "ca- / zado" está ilegível na imagem; o "[solteiro?]" do
    rascunho não pode ser confirmado. A assinatura da primeira testemunha lê-se "Joze de Oliv.ra
    e S.a" [incerto], e não "João Joaqm de Oliveira [?]", como no rascunho. O "Chatolica" do
    rascunho no Nº 7 foi confirmado, e o Nº 3 também o traz.
- text: >-
    Folio anomaly. The right pages of images 492 and 493 are numbered 129 and 130, and the right
    page of image 494 reads "132". The text of Nº 7 runs on from image 493 to image 494 without a
    gap (catchword "For" / "Forte"), so no leaf is missing; the numbering skips or the "132" is
    a slip. The right page of image 495 (PAR-0123) also reads "132". This should be checked on
    the original if a folio citation matters.
  text_pt: >-
    Anomalia de foliação. As páginas da direita das imagens 492 e 493 estão numeradas 129 e 130, e
    a página da direita da imagem 494 lê-se "132". O texto do Nº 7 continua da imagem 493 para a
    494 sem lacuna (reclamo "For" / "Forte"), portanto não falta folha; a numeração salta ou o
    "132" é um lapso. A página da direita da imagem 495 (PAR-0123) também se lê "132". Convém
    verificar no original se a citação do fólio for importante.
