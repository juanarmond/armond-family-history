  Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores). Seus pais são
  nomeados como Manoel [Muniz?] Byttancourt e Francisca Roza do Espirito Santo. O
  assento é um batismo conjunto ("foram baptizados em o mesmo dia"); o irmão
  batizado no mesmo dia é identificado pelo agente de recuperação como Manoel. Os
  avós paternos estão parcialmente legíveis no assento como João [?] e Maria [?]
  de [?], consistentes com P-0048 (João Muniz Bytancourt) e P-0049 (Maria Jacintha
  de Medeiros). Padrinhos: Antonio [?] Salinas e Claudino [?]. Assinado pelo
  pároco e por testemunhas, incluindo João Jacinto [Botelho?] de Bulhões e o Padre
  Augusto Pacheco [?].
reliability:
  assessment: >-
    An original parish register entry, primary evidence for the birth year 1845
    and the direct naming of both parents. The month of birth is illegible; the
    year 1845 is read from "oito[centos] quarenta e cinco". The entry confirms
    Francisca Roza do Espirito Santo as João's mother directly (upgrading her
    maternity from strong-evidence, based only on Manoel's 1866 death, to
    confirmed). The ink and script are typical of Azorean parish registers of the
    mid-nineteenth century; some passages are partially illegible due to fading.
  informant: >-
    The parish priest of N.S. Mãe de Deus, Povoação, recording the baptism as
    an officer of the church.
  limitations: >-
    Month of birth illegible. Some words in the body of the act are difficult to
    read (fading). The surname of the child and father is partially illegible (the
    "Byttancourt" spelling matches PAR-0015). Grandparents are partially legible
    but not fully transcribed.
