notes:
  - text: >-
      Retrieved 2026-08-05 by the external FamilySearch retrieval agent (DGS
      5228858, img 63). This is João Muniz Bittencourt's own baptism — the record
      sought since 2026-07-31, when the full Sapucaia baptism books were read and
      João was found to be Azorean-born. Birth year 1845 corrects both the FS
      profile (b.1864) and the ~c.1847 estimate from his death record age (PAR-0007).
      The earlier "bounded negative" for João's baptism in the 1846-49 Povoação
      browse (2026-08-01) is now explained: the image was found at img 63 (fol. 59),
      which is within the ~1843-46 range of that volume.
