abstract: >-
  Parish baptism entry Nº 5 for a child named João, born on the 24th of an
  illegible month of 1845 (day and year legible; month illegible), in the
  freguesia of Nossa Senhora Mãe de Deus, Povoação, Ilha de São Miguel (Açores).
  His parents are named as Manoel [Muniz?] Byttancourt and Francisca Roza do
  Espirito Santo. The entry is a joint baptism ("foram baptizados em o mesmo
  dia"); the sibling baptised on the same day is identified by the retrieval agent
  as Manoel. The paternal grandparents are partially legible in the entry as João
  [?] and Maria [?] de [?], consistent with P-0048 (João Muniz Bytancourt) and
  P-0049 (Maria Jacintha de Medeiros). Godparents: Antonio [?] Salinas and
  Claudino [?]. Signed by the vicar and witnesses including João Jacinto [Botelho?]
  de Bulhões and Padre Augusto Pacheco [?].
abstract_pt: >-
  Assento de batismo paroquial Nº 5 de uma criança de nome João, nascida no dia 24
