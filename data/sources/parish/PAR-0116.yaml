transcription: |-
  [Two-page record — São Romão da Ucha baptisms, DGS 004669216, Book 2. The target entry is
  the last on fl. 40 and ends in the first three lines of fl. 40v. Each image is a two-page
  opening. Spelling, capitals and abbreviations as written; the line breaks of the register
  are kept; expansions follow in a separate bracket. Hand of the encommendado Antonio José
  Corrêa, who writes "Solenemente". Read from the images on 2026-10-12.]

  [p1 — evidence/parish/PAR-0116-baptism-francisco-1837-ucha-p01.jpg; opening fl. 39v–40;
  the target entry is the last on fl. 40]
  [fl. 39v, summarised: the end of an entry (… "do lugar da Torre desta mesma freguezia",
  signed "Antonio José Abb."); Maria José, daughter of Domingos de Macedo and Roza Maria da
  Conceição, of the lugar de Medella (born 14 January 1837); Maria, daughter of Alexandre
  Francisco Velloso and Anna Gonsalves, of the lugar de Medella (January 1837), continued.
  No modelled person is named.]
  [fl. 40, top right: folio number "40" and a rubric. Above the target, summarised: the end
  of the Maria entry (signed "O Encommendado Antonio José Abb."); Antonio, son of João
  Pereira and Benta Maria, of the lugar da Quintãa, paternal grandparents Manoel Martins and
  Clara Maria, maternal Verissimo de Oliveira Goios and Thereza Maria Coelho (born 7 February
  1837); Custodio, son of Domingos José Martins and Maria da Silva, whose paternal
  grandparents Antonio Miguel Martins and Maria Dias and maternal grandparents Manoel José
  Forte and Maria Thereza da Silva are each called "ja defuntos" (born 3 March 1837). No
  modelled person is named.]

  [entry — TARGET: Francisco, son of Bento Fernandes and Joaquina Roza; fl. 40, last entry]
  [Left margin, beside the entry:] Francisco [written as the entry's first word, standing
  in the margin] / Pus os San- / tos Oleos / Correia [signature, encircled, with a rubric] /
  p.
  Francisco filho legitimo de Bento Fernandes, e Joaquina Roza do lugar
  de Quintãa desta freguezia de S. Romão d'Ucha neto paterno
  de Manoel Fernandes, e Jozefa Maria ja defuntos desta mesma
  freguezia, e materno de Inacio Lopes, e Marianna da Sil-
  va da freguezia da Pouza lugar d'[uncertain: Amproa] e tambem falecid[os — the
  last letters run into the edge of the leaf and are not visible]
  nasceo a vinte e seis de Março de mil oito centos trinta e
  sete, e vinte e nove do mesmo foi por mim Solenemente
  baptizado sem os Santos [uncertain: Olios] pelos não haver; Forão padri-
  nhos Francisco Gonsalves do lugar de Bairros, e Roza Maria

  [p2 — evidence/parish/PAR-0116-baptism-francisco-1837-ucha-p02.jpg; opening fl. 40v–41;
  the target entry ends in the first three lines of fl. 40v]
  Maria da Costa mulher de Lourenço Fernandes do lugar
  de Quintãa ambos desta freguezia de que fes este assento
  que asigno; Era ut supra
  [Signature:] O Encommendado Antonio J.e Corr.a [rubric]
  [Expansions: S. = São; d'Ucha = de Ucha; J.e = José; Corr.a = Correia; Pouza = Pousa;
  "ja defuntos" = already dead; "tambem falecid[os]" = also deceased. The godmother's name
