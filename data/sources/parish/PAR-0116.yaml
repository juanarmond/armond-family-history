notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T5): the maternal grandfather
    is written "Inacio Lopes" — the image has no "g" — not "Ignacio Lopes"; the parish is
    "S. Romão d'Ucha", not "de Ucha"; the word after "tambem" reads "falecid…" with its ending
    lost at the edge of the leaf (the draft gave "falecidos [?]"); the grandparents' lugar in
    Pousa looks like "d'Amproa" in this hand, against the draft's "d'Anjeiroa [?]", and stays
    uncertain; the oils are "Olios" rather than "Oleos" (uncertain); the priest writes
    "Solenemente", not "solemnemente". On fl. 40v the closing reads "de que fes este assento /
    que asigno", not "fiz … que assignei"; the margin reads "Pus os San- / tos Oleos", with no
    "-lhe" written. The rest was confirmed word by word, including "ja defuntos" and the
    godmother's doubled "Maria".
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T5): o avô materno está
    escrito "Inacio Lopes" — a imagem não tem "g" —, não "Ignacio Lopes"; a freguesia é "S.
    Romão d'Ucha", não "de Ucha"; a palavra depois de "tambem" lê-se "falecid…", com o final
    perdido na borda da folha (o rascunho dava "falecidos [?]"); o lugar dos avós na Pousa
    parece "d'Amproa" nesta letra, contra o "d'Anjeiroa [?]" do rascunho, e continua incerto;
    os óleos são "Olios" em vez de "Oleos" (incerto); o padre escreve "Solenemente", não
    "solemnemente". No fl. 40v o fecho diz "de que fes este assento / que asigno", não "fiz …
    que assignei"; a margem diz "Pus os San- / tos Oleos", sem "-lhe" escrito. O restante foi
    conferido palavra por palavra, inclusive "ja defuntos" e o "Maria" repetido da madrinha.
- text: >-
    Deceased grandparents. The entry says the paternal grandparents Manoel Fernandes (P-0143)
    and Jozefa Maria (P-0144) were "ja defuntos" on 29 March 1837, and that the maternal
    grandparents Inacio Lopes (P-0145) and Marianna da Silva (P-0146) were "tambem falecid[os]"
    — the plural ending is not visible but "tambem" ("also") ties the word to both. Each of the
    four deaths can be bounded "before 29 March 1837" from this record. The same priest uses
    the same formula ("ja defuntos", "tambem defuntos") in neighbouring entries on fl. 40 and
    fl. 40v. Caution for P-0143: on 16 March 1839 the same priest baptised Manoel, son of
    Francisco d'Oliveira and Jozefa Maria of Quintão, "neto … materno de Manoel Fernandes, e
    Jozefa Maria desta freguezia", with "Manoel Fernandes avo materno" as godfather (fl. 45,
    transcribed in PAR-0118). If that Manoel Fernandes is P-0143, he was alive in 1839 and this
    entry's "ja defuntos" is wrong for him; if he is another Manoel Fernandes (the retrieval
    side reports a second couple, Manoel Fernandes × Jozefa de Macedo, at Quintam), there is
    no conflict. The point is unresolved.
  text_pt: >-
    Avós falecidos. O assento diz que os avós paternos Manoel Fernandes (P-0143) e Jozefa Maria
    (P-0144) eram "ja defuntos" em 29 de março de 1837, e que os maternos Inacio Lopes (P-0145)
    e Marianna da Silva (P-0146) eram "tambem falecid[os]" — a terminação do plural não se vê,
    mas o "tambem" liga a palavra aos dois. Cada uma das quatro mortes pode ser limitada a
    "antes de 29 de março de 1837" por este registro. O mesmo padre usa a mesma fórmula ("ja
    defuntos", "tambem defuntos") em assentos vizinhos dos fls. 40 e 40v. Cautela quanto a
    P-0143: em 16 de março de 1839 o mesmo padre batizou Manoel, filho de Francisco d'Oliveira
    e de Jozefa Maria, do Quintão, "neto … materno de Manoel Fernandes, e Jozefa Maria desta
    freguezia", tendo por padrinho "Manoel Fernandes avo materno" (fl. 45, transcrito no
    PAR-0118). Se esse Manoel Fernandes é P-0143, ele estava vivo em 1839 e o "ja defuntos"
    deste assento está errado para ele; se é outro Manoel Fernandes (a pesquisa de
    recuperação aponta um segundo casal, Manoel Fernandes × Jozefa de Macedo, no Quintam), não
    há conflito. O ponto está em aberto.
- text: >-
    Identification and what the record adds. The parents and lugar are identified with
    P-0141 × P-0142, and the grandparents with P-0143 × P-0144 and P-0145 × P-0146, by the
    matching names, as in the couple's other children's baptisms; the identification is
    strong, not proven. The mother is written "Joaquina Roza", the form of her later records.
    The entry adds the death bound for all four grandparents and the godparents Francisco
    Gonsalves of Bairros and Roza Maria Maria da Costa, wife of Lourenço Fernandes of
    Quintãa (not identified with any modelled person). The identification of this Francisco
    with the Francisco of the 1859 death (PAR-0117) rests on the same father's name, the
    mother's forename and the lugar; it is strong, not proven.
  text_pt: >-
    Identificação e o que o registro acrescenta. Os pais e o lugar são identificados com
    P-0141 × P-0142, e os avós com P-0143 × P-0144 e P-0145 × P-0146, pelos nomes
    coincidentes, como nos batismos dos outros filhos do casal; a identificação é forte, não
    provada. A mãe está escrita "Joaquina Roza", a forma dos seus registros posteriores. O
    assento acrescenta o limite de morte para os quatro avós e os padrinhos Francisco
    Gonsalves, de Bairros, e Roza Maria Maria da Costa, mulher de Lourenço Fernandes, da
    Quintãa (não identificados com pessoa modelada). A identificação deste Francisco com o
    Francisco do óbito de 1859 (PAR-0117) assenta no mesmo nome do pai, no prenome da mãe e no
    lugar; é forte, não provada.
