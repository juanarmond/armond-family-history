reading_reliability: complete
abstract: >-
  Original baptism entry of Francisco, the last entry on fl. 40 of the second baptism book of
  São Romão da Ucha (Barcelos), ending on fl. 40v. On 29 March 1837 the encommendado
  Antonio José Corrêa baptised "Francisco filho legitimo de Bento Fernandes, e Joaquina
  Roza" of the lugar de Quintãa, born 26 March 1837. It names the paternal grandparents
  "Manoel Fernandes, e Jozefa Maria ja defuntos desta mesma freguezia" and the maternal
  grandparents "Inacio Lopes, e Marianna da Silva da freguezia da Pouza … e tambem
  falecid[os]". It is therefore the record that shows all four grandparents dead by 29 March
  1837. The godparents were Francisco Gonsalves of Bairros and Roza Maria Maria da Costa,
  wife of Lourenço Fernandes of Quintãa. This Francisco is very probably the tailor Francisco,
  son of Bento Fernandes and Joaquina Maria of Quintão, who drowned in the Cávado in November
  1859 (PAR-0117). He is a collateral: a brother of Manoel João (P-0139), son of P-0141 and
  P-0142.
abstract_pt: >-
  Assento original de batismo de Francisco, o último do fl. 40 do segundo livro de batismos
  de São Romão da Ucha (Barcelos), terminando no fl. 40v. Em 29 de março de 1837 o
  encomendado Antonio José Corrêa batizou "Francisco filho legitimo de Bento Fernandes, e
  Joaquina Roza", do lugar de Quintãa, nascido em 26 de março de 1837. Nomeia os avós paternos
  "Manoel Fernandes, e Jozefa Maria ja defuntos desta mesma freguezia" e os maternos "Inacio
  Lopes, e Marianna da Silva da freguezia da Pouza … e tambem falecid[os]". É, portanto, o
  registro que mostra os quatro avós mortos em 29 de março de 1837. Foram padrinhos Francisco
  Gonsalves, de Bairros, e Roza Maria Maria da Costa, mulher de Lourenço Fernandes, da
  Quintãa. Este Francisco é muito provavelmente o alfaiate Francisco, filho de Bento Fernandes
  e de Joaquina Maria, do Quintão, que se afogou no Cávado em novembro de 1859 (PAR-0117). É
  colateral: irmão de Manoel João (P-0139), filho de P-0141 e P-0142.
reliability:
  assessment: >-
    Original, written and signed by the officiating priest at the time: primary and direct
    for the baptism, its date, the birth date, the child, the parents as named and the
    godparents. The grandparents' names and the statement that they were dead are reported
    information, secondary in principle, but made by the parish priest within the parish
    where the paternal grandparents lived. Every core fact is legible — the dates, the child,
    both parents, all four grandparents, "ja defuntos" for the paternal pair and "tambem
    falecid…" for the maternal pair — so reading_reliability is complete. The [uncertain]
    marks fall on the grandparents' lugar in Pousa and on the spelling of "Olios"; the lost
    ending of "falecid[os]" is an inflection, not the fact.
  informant: >-
    The encommendado (priest in charge) of São Romão da Ucha, Antonio José Corrêa, who
    officiated and signed; the grandparents' details were presumably supplied by the family.
  limitations: >-
    The last letters of "falecid[os]" run into the edge of the leaf; the plural that the sense
    requires is not visible. The statement that Manoel Fernandes was dead by March 1837 sits
    uneasily with a baptism of 16 March 1839 in the same book (fl. 45, in PAR-0118's image)
    whose godfather is "Manoel Fernandes avo materno"; that may be another Manoel Fernandes
    (see notes).
