abstract: >-
  Typed 2019 ecclesiastical certified copy of the baptism (8 October 1838) of
  Carolina, born 28 February 1838, legitimate daughter of Capitão Cezário José da
  Silva Lima and Dona Joanna Umbelina de Jesus, at the Matriz de Santo Antônio da
  Villa de São José (São José del-Rei, today Tiradentes). The entry directly names
  "Capitão Amaro da Silva Xavier" (P-0059) and "Dona Ignez Francisca de Lima"
  (P-0060) as the paternal grandparents of Carolina, independently corroborating the
  Amaro × Ignez union (F-0029) established by PAR-0023 and PAR-0025. Capitão Cezário
  José da Silva Lima is a confirmed son of Amaro × Ignez (collateral; added as
  documented_child on F-0029). He is the same person who appears as a witness ("Furriel
  Cezário José da Silva Lima") at the 1810 Ladisláo × Mathilde marriage (PAR-0023).
abstract_pt: >-
  Cópia certificada eclesiástica, datilografada em 2019, do batismo (8 de outubro
  de 1838) de Carolina, nascida em 28 de fevereiro de 1838, filha legítima do
  Capitão Cezário José da Silva Lima e de Dona Joanna Umbelina de Jesus, na Matriz
  de Santo Antônio da Villa de São José (São José del-Rei, hoje Tiradentes). O
  assento nomeia diretamente "Capitão Amaro da Silva Xavier" (P-0059) e "Dona Ignez
  Francisca de Lima" (P-0060) como avós paternos de Carolina, corroborando de forma
  independente a união Amaro × Ignez (F-0029) estabelecida por PAR-0023 e PAR-0025.
  O Capitão Cezário José da Silva Lima é um filho confirmado de Amaro × Ignez
  (colateral; acrescentado como documented_child em F-0029). É a mesma pessoa que
  aparece como testemunha ("Furriel Cezário José da Silva Lima") no casamento de
  Ladisláo × Mathilde em 1810 (PAR-0023).
reliability:
  assessment: >-
    A 2019 certified ecclesiastical transcript from the Diocese de São João del-Rei;
    source form is derivative (typed copy), but the information it transmits was
    recorded contemporaneously by the 1838 officiating priest (primary information).
    Corroborates the Amaro × Ignez parentage independently from PAR-0023. Additional
    value: names Cezário as a second confirmed son of Amaro × Ignez and attests the
    couple's connection to the São José del-Rei area in the 1830s.
  informant: >-
    The 1838 recording was made by the officiating priest of the São José del-Rei
    matriz as a primary act of registration; the 2019 certidão was issued by the
    diocesan archivist from the original register.
  limitations: >-
    A typed 2019 transcript, not the original 1838 entry; transcription fidelity
    assumed but not independently verified. Maternal grandparents of Carolina are not
    fully deciphered from the delivered image. The certidão's own issuance date and
    the certifying archivist's name are not legible in the delivered image (1252×1241 px),
    affecting chain-of-custody documentation for this derivative source. The original
    1838 register entry may contain additional detail beyond what is transcribed.
