  Certifico que nos livros de batizados da extinta Paróquia de Santo Antônio do
  município de Tiradentes (antes São José del Rei), encontra-se a seguinte assentada:
  Aos oito dias do mês de Outubro de mil oitocentos e trinta e oito... batizei...
  Carolina, nascida aos vinte e oito de Fevereiro do dito ano [1838], filha legítima
  do Capitão Cezario Jose da Silva Lima e de Dona Joanna Umbelina de Jesus. Avós
  paternos: Capitão Amaro da Silva Xavier e Dona Ignez Francisca de Lima. Avós
  maternos: [not fully deciphered from the delivered image]. [Officiating priest and
  certidão issuance date not fully legible; certifying archivist name not deciphered.]
