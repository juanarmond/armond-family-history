transcription: >-
  [Image p1 — baptism act, p.0365, S. Sebastião batismos 1611–1687]
  [Re-read from the image 2026-10-08 (low resolution, 383×527 px); margin "Melchior":]
  "Em os vinte dias do mes de maio de mil e seis sentos e sesenta e quatro annos baptizei
  a Melchior filho do Alferes Melchior de Ponte e de sua molher mariana Fa-gundes foi
  padrinho Ant.º Cardozo por verdade me asignei Vig.º Ant.º Coelho Sottomajor" [then a
  visitation note: "foi visto em vizitação em 28 de maio de 664"]
  Parents: "Alferes Melchior de Ponte × mariana Fagundes" ["Melchior" is a variant of
  Belchior; the initial M is read at low resolution]
  Child: Melchior [= Belchior filho]
  Padrinho: Ant.º Cardozo
  Year notation in record: "sesenta e quatro annos" [1664]
  [Earlier transcribed "Belchior de Ponte Cardogo × marianna Faguedes": the act writes
  "Melchior de Ponte" (no "Cardozo") and the mother "mariana Fa-gundes".]
  Date: 20 May 1664
  [Image p2 — context/facing page of the register]
