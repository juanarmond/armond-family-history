abstract: >-
  Primary parish baptism record for Belchior (filho), son of Belchior da Ponte Cardoso
  (P-0123) × Mariana Fagundes (P-0124), baptised 20 May 1664 in São Sebastião, Terceira
  (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0365). The act names the parents as "Alferes
  Melchior de Ponte" (Melchior = Belchior) and "mariana Fagundes", the child as Melchior,
  and the padrinho as Ant.º Cardozo; the year "sesenta e quatro" (1664) is written out.
  [Corrected 2026-10-08: earlier read "Belchior de Ponte Cardogo × marianna Faguedes".] Consistent with Vol. IX (PUB-0005, p.260), which records him as
  Belchior da Ponte Cardoso (b.20.5.1664, m. Joana Baptista). Status: confirmed.
abstract_pt: >-
  Registo paroquial primário do baptismo de Belchior (filho), filho de Belchior da Ponte
  Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizado a 20 de maio de 1664 em São
  Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0365). O assento nomeia ambos
  os pais como "Alferes Melchior de Ponte" (Melchior = Belchior) e "mariana Fagundes", a
  criança como Melchior e o padrinho como Ant.º Cardozo; o ano "sesenta e quatro" (1664)
  vem por extenso. [Corrigido em 2026-10-08: antes lido "Belchior de Ponte Cardogo ×
  marianna Faguedes".] Consistente com o Vol. IX (PUB-0005, p.260),
  que o regista como Belchior da Ponte Cardoso (n.20.5.1664, c.c. Joana Baptista).
  Estado: confirmado.
reliability:
  assessment: >-
    Primary source (original parish baptism register). Both parents' names are legible
    at low resolution (father written "Melchior", a variant of Belchior). The year
    "sesenta e quatro annos" explicitly confirms 1664. The date 20 May
    1664 is consistent with PUB-0005. Evidence quality: confirmed.
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1664
  limitations: >-
    Reduced CDN resolution (383×527 px) — lower than p.0037 images but sufficient to
    read parents' names and year. Image p2 is a context page only.
