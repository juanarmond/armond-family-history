abstract: >-
  Original baptism entry of José, the last entry on fl. 44v of the second baptism book of São
  Romão da Ucha (Barcelos). On 20 February 1839 the priest Antonio José Corrêa baptised "Joze
  filho legitimo de Bento Joze Fernandes, e Joaquina Roza" of the lugar de Quintam, born 19
  February 1839. The paternal grandparents are "Manoel Fernandes, e Jozefa Maria" of the same
  lugar; the maternal grandparents are "Ignacio Lopes, e Marianna da Silva" of the lugar
  d'[Amproa], parish of Pousa. The godparents were José Gonsalves, solteiro, and Gracia,
  daughter of Antonio Martins and Maria Thereza, of this parish. A margin note by the same
  priest records that the child died on 1 April 1845, aged six; he is therefore not the José
  who married at Ucha in 1868. On the facing page (fl. 45) a baptism of 16 March 1839 names a
  maternal grandfather "Manoel Fernandes" who stood as godfather; it is transcribed here
  because it bears on the death of P-0143. José is a collateral: a brother of Manoel João
  (P-0139), son of P-0141 and P-0142.
abstract_pt: >-
  Assento original de batismo de José, o último do fl. 44v do segundo livro de batismos de
  São Romão da Ucha (Barcelos). Em 20 de fevereiro de 1839 o padre Antonio José Corrêa batizou
  "Joze filho legitimo de Bento Joze Fernandes, e Joaquina Roza", do lugar de Quintam,
  nascido em 19 de fevereiro de 1839. Os avós paternos são "Manoel Fernandes, e Jozefa Maria",
  do mesmo lugar; os maternos, "Ignacio Lopes, e Marianna da Silva", do lugar d'[Amproa],
  freguesia da Pousa. Foram padrinhos José Gonsalves, solteiro, e Gracia, filha de Antonio
  Martins e de Maria Thereza, desta freguesia. Uma nota na margem, do mesmo padre, registra
  que a criança morreu em 1º de abril de 1845, aos seis anos; não é, portanto, o José que se
  casou na Ucha em 1868. Na página em frente (fl. 45), um batismo de 16 de março de 1839 nomeia
  um avô materno "Manoel Fernandes" que foi padrinho; é transcrito aqui porque diz respeito à
  morte de P-0143. José é colateral: irmão de Manoel João (P-0139), filho de P-0141 e P-0142.
reliability:
  assessment: >-
    Original, written and signed by the officiating priest at the time: primary and direct for
    the baptism, its date, the birth date, the child, the parents as named and the
    godparents; the grandparents' names are reported by the family and are secondary in
    principle. The margin death note is a later annotation by the same priest, primary for
    the death date. Every core fact is clearly legible — the dates, the child, both parents,
    all four grandparents, the lugar and the margin death date — so reading_reliability is
    complete. The only [uncertain] mark in the target falls on the grandparents' lugar in
    Pousa.
  informant: >-
    The priest of São Romão da Ucha, Antonio José Corrêa, who officiated, signed and later
    annotated the margin; the grandparents' names were presumably supplied by the family.
  limitations: >-
    The grandparents' lugar in Pousa is uncertain. No grandparent is called deceased here,
    although the baptism of 29 March 1837 (PAR-0116) calls all four dead. The identity of the
    "Manoel Fernandes" of the fl. 45 entry with P-0143 is not established.
