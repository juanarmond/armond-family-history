  Joze filho legitimo de Bento Joze Fernandes, e Joaquina Roza
  do lugar de Quintam desta freguezia de Sam Romão d'Ucha
  neto paterno de Manoel Fernandes, e Jozefa Maria do mesmo
  lugar, e materno de Ignacio Lopes, e Marianna da Silva do lu-
