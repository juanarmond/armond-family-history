  ambos desta freguezia de que para constar fes este assento; era
  ut supra
  [Signature:] O Padre Antonio Joze Corr.a [rubric]
  [Expansions: Corr.a = Correia; d'Ucha = de Ucha; d'Abril = de Abril; Pouza = Pousa. The
