notes:
- text: >-
    Readings that differ from the retrieval side's draft (§7.6 T6): the parish is "Sam Romão
    d'Ucha", not "de Ucha"; the grandparents' lugar looks like "d'Amproa" in this hand, against
    the draft's "de Anjeiroa [?]", and stays uncertain; the priest writes "Solenemente", not
    "solemnemente"; the margin reads "meiro d'Abril". The draft's "Guintam" remark is
    confirmed: the capital Q is G-like, and the word is transcribed "Quintam". Everything else
    was confirmed word by word, including the margin death note "faleceo no primeiro d'Abril de
    1845".
  text_pt: >-
    Leituras que diferem do rascunho da pesquisa de recuperação (§7.6 T6): a freguesia é "Sam
    Romão d'Ucha", não "de Ucha"; o lugar dos avós parece "d'Amproa" nesta letra, contra o "de
    Anjeiroa [?]" do rascunho, e continua incerto; o padre escreve "Solenemente", não
    "solemnemente"; a margem diz "meiro d'Abril". A observação do rascunho sobre "Guintam"
    confirma-se: o Q maiúsculo tem forma de G, e a palavra é transcrita "Quintam". Tudo o mais
    foi conferido palavra por palavra, inclusive a nota de óbito na margem, "faleceo no
    primeiro d'Abril de 1845".
- text: >-
    Identification and what the record adds. The parents "Bento Joze Fernandes, e Joaquina
    Roza" of Quintam are identified with P-0141 × P-0142, and the grandparents with
    P-0143 × P-0144 and P-0145 × P-0146, by the matching names, lugar and parish, as in the
    couple's other children's baptisms; the identification is strong, not proven. The entry
    attests the father's full form "Bento Joze Fernandes" and the child's death on 1 April
    1845. Modelling: José (1839–1845) is a collateral who died in childhood; he can be recorded
    as a documented child of F-0071 with this source. He is not the son José who married at
    Ucha in 1868 (a lead from the retrieval side's marriage sweep), who must be a later child,
    born after this book ends in 1844.
  text_pt: >-
    Identificação e o que o registro acrescenta. Os pais, "Bento Joze Fernandes, e Joaquina
    Roza", do Quintam, são identificados com P-0141 × P-0142, e os avós com P-0143 × P-0144 e
    P-0145 × P-0146, pelos nomes, lugar e freguesia coincidentes, como nos batismos dos outros
    filhos do casal; a identificação é forte, não provada. O assento atesta a forma completa do
    pai, "Bento Joze Fernandes", e a morte da criança em 1º de abril de 1845. Modelagem: José
    (1839–1845) é um colateral morto na infância; pode ser registrado como filho documentado da
    F-0071 com esta fonte. Não é o filho José que se casou na Ucha em 1868 (pista da varredura
    de casamentos da pesquisa de recuperação), que deve ser um filho posterior, nascido depois
    de o livro terminar, em 1844.
- text: >-
    The fl. 45 entry and the death of P-0143. On 16 March 1839 the same priest baptised Manoel,
    son of Francisco d'Oliveira and Jozefa Maria of the lugar de Quintão, "neto … materno de
    Manoel Fernandes, e Jozefa Maria desta freguezia de Sam Romão", and the godfather was
    "Manoel Fernandes avo materno" — the maternal grandfather himself, apparently alive. The
    reading "avo materno" is clear. If this couple is P-0143 × P-0144, the mother Jozefa Maria
    is a sister of Bento José, and Manoel Fernandes was alive in March 1839, which contradicts
    the "ja defuntos" of the 29 March 1837 baptism (PAR-0116). If it is another Manoel
    Fernandes — the retrieval side reports a second couple at Quintam, Manoel Fernandes ×
    Jozefa de Macedo, and a baptism of 1844 on fl. 58 (in PAR-0120's image) writes this
    couple's grandparents as "Manoel Fernandes, e Jozefa Fernandes" — there is no conflict.
    The record does not settle it; P-0143's death bound should be held as "before 29 March
    1837, per PAR-0116", with this conflict noted. Nothing in the fl. 45 entry is evidence for
    a modelled person until the couple is identified.
  text_pt: >-
    O assento do fl. 45 e a morte de P-0143. Em 16 de março de 1839 o mesmo padre batizou
    Manoel, filho de Francisco d'Oliveira e de Jozefa Maria, do lugar de Quintão, "neto …
    materno de Manoel Fernandes, e Jozefa Maria desta freguezia de Sam Romão", e o padrinho
    foi "Manoel Fernandes avo materno" — o próprio avô materno, ao que parece vivo. A leitura
    "avo materno" é clara. Se esse casal é P-0143 × P-0144, a mãe, Jozefa Maria, é irmã de
    Bento José, e Manoel Fernandes estava vivo em março de 1839, o que contradiz o "ja
    defuntos" do batismo de 29 de março de 1837 (PAR-0116). Se é outro Manoel Fernandes — a
    pesquisa de recuperação aponta um segundo casal no Quintam, Manoel Fernandes × Jozefa de
    Macedo, e um batismo de 1844 no fl. 58 (na imagem do PAR-0120) escreve os avós deste casal
    como "Manoel Fernandes, e Jozefa Fernandes" —, não há conflito. O registro não resolve a
    questão; o limite de morte de P-0143 deve ficar como "antes de 29 de março de 1837,
    segundo o PAR-0116", com este conflito anotado. Nada no assento do fl. 45 é prova para uma
    pessoa modelada enquanto o casal não for identificado.
