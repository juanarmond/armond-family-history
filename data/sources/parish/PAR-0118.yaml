transcription: |-
  [Single image — São Romão da Ucha baptisms, DGS 004669216, Book 2, opening fl. 44v–45. The
  target entry is the last on fl. 44v and complete on that page. The second entry on fl. 45
  names a "Manoel Fernandes, e Jozefa Maria" of this parish and is transcribed in full below.
  Spelling, capitals and abbreviations as written; the line breaks of the register are kept;
  expansions follow in a separate bracket. Hand of the priest Antonio José Corrêa. Read from
  the image on 2026-10-12.]

  [p1 — evidence/parish/PAR-0118-baptism-jose-1839-ucha.jpg; opening fl. 44v–45]
