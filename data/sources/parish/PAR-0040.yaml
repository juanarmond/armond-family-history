notes:
  - text: >-
      Catalogued 12 August 2026 from the Culturacores CDN image, read directly
      from the register. Rosa is a collateral child of family F-0023 (João
      Francisco Muniz Bitancourt × Maria Jacintha de Medeiros); per policy no
      person entity is minted for her — she should be recorded as a
      documented_child on F-0023. VARIANT/CONFLICT preserved: this act writes the
      mother as "Maria Jacinta de Silveiros" (not "de Medeiros"); the father and
      the recurring godparent couple (Manoel José da Costa × Victoria de Medeiros)
      confirm the same F-0023 couple, so P-0049 is linked but the surname variant
      is recorded verbatim. This act records parents only (no grandparents). The
      page bears folio 204; the precise Culturacores book-range code was not
      determined from the image and should be reconciled against the catalogue.
