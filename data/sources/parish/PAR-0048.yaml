transcription: >-
  [Casamento — Livro SMG-PV-MAEDEDEUS-C-1801-1822, N.S. Mãe de Deus, Povoação;
  left-hand page facing folio 152 ("1819"). Read from the register image
  2026-08-12. Margin: "M.el Cabral | M.a Jacinta".]

  "Aos trinta de Dezembro de mil oito centos e dois digo dezoito annos, [de manhã]
  nesta Parochial de Nossa Senhora Mãe de Deos do Lugar da Povoação, [precedidas]
  as denunciações do estilo sem impedimento como consta do mandado do Reverendo
  Ouvidor deste Districto Francisco Garcia de Avranches, perante mim José Duarte de
  Medeiros Vigario proprio desta dita Igreja, e em presença das testemunhas abaixo
  assignadas o Capitão [Luis?] Antonio de Almeida e Joaquim Pedro de Mello e muitas
  mais pessoas que presentes estavão, se ligarão o Sacramento do Matrimonio em face
  da Igreja por palavras de presente como determina o Sagrado Concilio Tridentino,
  Manoel Cabral filho de Manoel Cabral e de [illegible: mãe do noivo], e Maria
  Jacintha de Medeiros filha de Manoel Muniz e de Tereza do Amaral, [ambos]
  naturaes e freguezes desta dita Igreja onde forão baptizados, e desobrigados [da
  quaresma] proxima passada. Não [se] celebrarão as bençãos por ser tempo ferial, e
  para constar fiz este assento, era ut supra. [Assinado] O Vigario José Duarte de
  Medeiros. Luis [Antonio] de Almeida. Joaquim Pedro de Mello. [Nota abaixo:
  "Receberão as bençãos em Campo [...] o Vigario Medeiros".]"
abstract: >-
  Marriage on 30 December 1818 at Nossa Senhora Mãe de Deus, Povoação, São Miguel,
  of Manoel Cabral (son of Manoel Cabral and an illegible mother) and Maria
  Jacintha de Medeiros, whom the act names as daughter of Manoel Muniz and Tereza
  do Amaral. Those parents are the modelled couple Manoel Muniz Bitancourt the
  elder (P-0082) and Tereza do Amaral (P-0083), family F-0040 — so this bride is a
  sister of João (Francisco) Muniz Bitancourt (P-0048) and therefore a great-aunt
  of the emigrant João Muniz Bittencourt (P-0019). NAMESAKE CAUTION: the bride
  bears the same name, "Maria Jacintha de Medeiros", as the spine ancestor P-0049,
  but she is a DIFFERENT woman — P-0049's parents are João de Medeiros Brandão and
  Maria Eugenia (per PAR-0037), whereas this bride's parents are Manoel Muniz and
  Tereza do Amaral. The two must never be merged. The blessing was deferred
  because the wedding fell in a ferial season. Officiant Vigário José Duarte de
  Medeiros; witnesses Capitão Luis Antonio de Almeida and Joaquim Pedro de Mello.
  The bride is a collateral relative: no person entity is minted for her; she is
  recorded as a documented daughter of family F-0040.
abstract_pt: >-
  Casamento em 30 de dezembro de 1818, em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de Manoel Cabral (filho de Manoel Cabral e de mãe ilegível) e Maria
  Jacintha de Medeiros, que o ato nomeia como filha de Manoel Muniz e Tereza do
  Amaral. Esses pais são o casal modelado Manoel Muniz Bitancourt, o velho
  (P-0082), e Tereza do Amaral (P-0083), família F-0040 — pelo que esta noiva é
  irmã de João (Francisco) Muniz Bitancourt (P-0048) e, portanto, tia-avó do
  emigrante João Muniz Bittencourt (P-0019). CAUTELA DE HOMONÍMIA: a noiva tem o
  mesmo nome, "Maria Jacintha de Medeiros", que a ancestral da linha principal
  P-0049, mas é uma mulher DIFERENTE — os pais de P-0049 são João de Medeiros
  Brandão e Maria Eugenia (conforme PAR-0037), ao passo que os pais desta noiva são
  Manoel Muniz e Tereza do Amaral. As duas nunca devem ser fundidas. A bênção foi
  diferida por o casamento ter caído em tempo ferial. Celebrante o Vigário José
  Duarte de Medeiros; testemunhas o Capitão Luis Antonio de Almeida e Joaquim Pedro
  de Mello. A noiva é uma parente colateral: não se cria entidade de pessoa para
  ela; fica registada como filha documentada da família F-0040.
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for the marriage
    date and both spouses, and — decisively — for the bride's parents "Manoel
    Muniz e Tereza do Amaral", which match family F-0040 and identify her as a
    sister of P-0048 rather than as the spine ancestor P-0049 of the same name.
  informant: >-
    The Vigário José Duarte de Medeiros of N.S. Mãe de Deus, Povoação, recording
    the marriage as an officer of the church (the same vicar who recorded the
    grandparents' marriage PAR-0037).
  limitations: >-
    The year carries the scribe's own correction ("dois" → "dezoito", i.e. 1818),
    confirmed by the "1819" heading on the very next (facing) folio; the day
    "trinta" (30) and December are clear. The groom's mother's name is illegible,
    and the first witness's forename ("Luis"?) and a few procedural words are worn
    and bracketed. The bride's given name is legibly "Maria Jacintha de Medeiros" —
    a genuine namesake of P-0049, distinguished only by her different parents.
