  - text: >-
      NAMESAKE TRAP: this bride is NOT the spine ancestor Maria Jacintha de
      Medeiros (P-0049). P-0049's parents are João de Medeiros Brandão and Maria
      Eugenia (PAR-0037); this bride's parents are Manoel Muniz and Tereza do
      Amaral. They are two distinct women who happen to share the name. Do not
      equate or merge them.
