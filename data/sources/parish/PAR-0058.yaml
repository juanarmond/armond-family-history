transcription: >-
  [Livro de Óbitos, Nova Friburgo, fólio 73, nº 501, 1919; Vigário José Silvestre Alves de
  Miranda.] "Aos dois dias do mez de Novembro de mil nove centos e desenove, na Egreja Matriz,
  encommendei e depois, com a Irmandade do Sacramento, em cujo cemiterio foi sepultado,
  acompanhei o cadaver de Roza Eugenia de Lemos Bohrer, de oitenta e seis annos de idade,
  natural da freguezia de Itaboraby, moradora nesta da Nova Friburgo, ambas neste bispado de
  Nictheroy, viuva de Francisco José Bohrer e filha legitima de Manoel Pereira Lemos e Maria
  Tereza Pereira de Lemos falecidos. Confessou-se, recebeu o Viatico, foi ungida e falleceu de
  [interito — uncertain] hoje de madrugada. Para constar fiz este assento e o assigno. O Vigario
  José Silvestre Alves de Miranda."
abstract: >-
  Parish death/burial of Roza Eugenia de Lemos Bohrer (P-0035), 2 November 1919 at Nova Friburgo,
  aged 86 (→ b. ~1833), natural de Itaboraí, widow of Francisco José Bohrer (P-0034). Source for
  her death event E-0086. NAME DIVERGENCE (preserved, not resolved): this death names her parents
  "Manoel Pereira Lemos" × "Maria Tereza Pereira de Lemos" (with "Pereira"), whereas her 1835
  baptism (PAR-0016, E-0049) reads "Manoel de Lemos" × "Maria Thereza de Jesus" (P-0052 × P-0053,
  without "Pereira"). The 1835 baptism form is kept; the 1919 divergent form is recorded as a
  variant. The stated age 86 implies b. ~1833 (the 1835 baptism governs the birth).
abstract_pt: >-
  Óbito/sepultamento paroquial de Roza Eugenia de Lemos Bohrer (P-0035), 2 de novembro de 1919,
  em Nova Friburgo, aos 86 anos (→ n. ~1833), natural de Itaboraí, viúva de Francisco José Bohrer
  (P-0034). Fonte de seu evento de óbito E-0086. DIVERGÊNCIA DE NOME (preservada, não resolvida):
  este óbito nomeia seus pais "Manoel Pereira Lemos" × "Maria Tereza Pereira de Lemos" (com
  "Pereira"), enquanto seu batismo de 1835 (PAR-0016, E-0049) diz "Manoel de Lemos" × "Maria
  Thereza de Jesus" (P-0052 × P-0053, sem "Pereira"). Mantém-se a forma do batismo de 1835; a
  forma divergente de 1919 é registrada como variante. A idade declarada 86 implica n. ~1833 (o
  batismo de 1835 governa o nascimento).
