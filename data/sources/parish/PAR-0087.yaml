notes:
- text: >-
    The baptism names Belchior's parents as "Manoell de Ponte" and "Maria da Cota",
    confirming their identities as Manuel da Ponte Valadão (P-0125) and Maria da Costa
    Leonardes (P-0126) — also attested in PUB-0005. "Maria da Cota" is a scribal
    abbreviation of "Maria da Costa".
- text: >-
    The one-day discrepancy (register ~9 Jan vs. PUB-0005 10 Jan 1615) is noted. The
    compiled date 10 January is preserved in E-0126 as the canonical date, with this
    discrepancy flagged. A higher-resolution rescan from BPAR Angra would resolve it.
