abstract: >-
  Primary parish baptism record for Belchior da Ponte Cardoso (P-0123), born in São
  Sebastião, Terceira. The act (p.0037 of TER-AH-SAOSEBASTIAO-B-1611-1687) names the
  child as "Belchior", son ("fo") of "Manoell de Ponte" (= Manuel da Ponte Valadão,
  P-0125) and "sua molher Maria da Cota" (= Maria da Costa Leonardes, P-0126), with
  godparents Baltezar and Ladeza. The register date reads approximately 9 January 1615,
  a one-day discrepancy from the 10 January 1615 stated in Mendes Forjaz Vol. IX
  (PUB-0005, p.260); the discrepancy is attributed to scribal convention. This primary
  image upgrades E-0126 from strong-evidence to confirmed.
abstract_pt: >-
  Registo paroquial primário do baptismo de Belchior da Ponte Cardoso (P-0123),
  nascido em São Sebastião, Terceira. O assento (p.0037 de TER-AH-SAOSEBASTIAO-B-1611-1687)
  nomeia a criança como "Belchior", filho ("fo") de "Manoell de Ponte" (= Manuel da Ponte
  Valadão, P-0125) e "sua molher Maria da Cota" (= Maria da Costa Leonardes, P-0126),
  com padrinhos Baltezar e Ladeza. A data no registo lê-se aproximadamente 9 de janeiro
  de 1615, com discrepância de um dia face ao 10 de janeiro de 1615 indicado nos Mendes
  Forjaz Vol. IX (PUB-0005, p.260); a discrepância é atribuída a convenção scribal.
  Esta imagem primária actualiza E-0126 de strong-evidence para confirmed.
reliability:
  assessment: >-
    Primary source (original parish baptism register). The act names the child (Belchior),
    his parents (Manuel da Ponte / Maria da Costa), and godparents (Baltezar + Ladeza).
    The one-day date discrepancy (primary reads ~9 Jan; PUB-0005 gives 10 Jan) is minor
    and consistent with scribal practices (recording the day after baptism). All principal
    facts — name, parentage, parish, approximate date — are legible from the primary image.
    Evidence quality: confirmed for parentage and approximate date.
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1615
  limitations: >-
    Godparents' surnames are not recorded in the extracted text. The exact day within
    January is ambiguous by one day (9 vs. 10 Jan). Image p2 is a context page only.
    Resolution is approximately 612×842 px per page.
