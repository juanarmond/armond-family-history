notes:
  - text: >-
      Catalogued 12 August 2026 from the Culturacores CDN image, read directly
      from the register. José is a collateral child of family F-0023 (João
      Francisco Muniz Bitancourt × Maria Jacintha de Medeiros); per policy no
      person entity is minted — he should be recorded as a documented_child on
      F-0023. This entry settles the "was there a José brother" question: a José
      son of the couple WAS baptized (born 23 May 1841). It is the concrete
      candidate for the Sapucaia immigrant José, but does not by itself prove that
      identity (a Sapucaia marriage/death act naming his parents, or a São Miguel
      óbito, would decide it). This act records parents only (no grandparents).
