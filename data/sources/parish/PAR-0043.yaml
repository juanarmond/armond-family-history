transcription: >-
  [Baptismo — Livro SMG-PV-MAEDEDEUS-B-1839-1842, N.S. Mãe de Deus, Povoação;
  left-hand act of the opening whose facing recto bears folio 147. Read from the
  register image 2026-08-12. Margin: "José".]

  "José filho legitimo de João Muniz Bitancourt, e de sua mulher Maria Jacintha,
  naturaes, freguezes desta Parochial de Nossa Senhora Mãe de Dios desta villa da
  Povoação, nasceo em os vinte tres dias do mez de Maio de mil oito centos
  quarenta e hum, e foi baptisado em os vinte e nove dias do mesmo mez, e Era,
  nesta referida Parochial por mim [uncertain: presente] Ignacio de Souza,
  [illegible] Cura da Ermida de Santa Barbara, [uncertain: por licença] desta
  mesma Parochial. Foraõ Padrinhos Manoel Jo[sé] [uncertain: da Costa], e sua
  mulher Victoria de Medeiros, naturaes, e freguezes desta [illegible] desta
  Parochial. Foraõ testemunhas José Jacintho Botelho, e [illegible] Manoel, e
  para constar lavrei este termo dia, mez, e Era ut supra. O Cura [uncertain:
  Joaquim] Ignacio de Souza [uncertain: Nunes]."
abstract: >-
  Baptism on 29 May 1841 at Nossa Senhora Mãe de Deus, Povoação, São Miguel, of
  José, born 23 May 1841, legitimate son of João [Francisco] Muniz Bitancourt
  (P-0048) and his wife Maria Jacintha [de Medeiros] (P-0049), family F-0023 — a
  collateral sibling of the modelled Manoel Muniz Bytancourt (P-0042), another
  child of the same couple. This act confirms that a son named José was born to
  the couple, born 23 May 1841; whether this José is the later Sapucaia immigrant
  José remains a separate, unproven hypothesis. Baptized by licence by Ignacio de
  Souza, Cura of the Ermida de Santa Barbara; godparents Manoel Jo[sé] [da Costa]
  and his wife Victoria de Medeiros (this couple's recurring compadrio).
abstract_pt: >-
  Baptismo em 29 de maio de 1841, em Nossa Senhora Mãe de Deus, Povoação, São
  Miguel, de José, nascido em 23 de maio de 1841, filho legítimo de João
  [Francisco] Muniz Bitancourt (P-0048) e de sua mulher Maria Jacintha [de
  Medeiros] (P-0049), família F-0023 — irmão colateral do modelado Manoel Muniz
  Bytancourt (P-0042), outro filho do mesmo casal. O ato confirma que nasceu ao
  casal um filho chamado José, em 23 de maio de 1841; se este José é o posterior
  imigrante José de Sapucaia permanece uma hipótese separada e não provada.
  Baptizado por licença por Ignacio de Souza, Cura da Ermida de Santa Barbara;
  padrinhos Manoel Jo[sé] [da Costa] e sua mulher Victoria de Medeiros (o
  compadrio recorrente deste casal).
reliability:
  assessment: >-
    An original parish register entry; primary, direct evidence for José's
    baptism and parentage. It documents that a son named José was born to João
    Muniz Bitancourt × Maria Jacintha on 23 May 1841 — settling the standing
    "was there a José son of this couple" question in the affirmative. Whether
    this José equals the Sapucaia immigrant José is a distinct hypothesis this
    record does not resolve.
  informant: >-
    The officiating priest — a Cura of the Ermida de Santa Barbara acting by
    licence of the parish (name read as Ignacio de Souza; fuller name uncertain)
    — recording the baptism ex officio.
  limitations: >-
    The father is recorded as "João Muniz Bitancourt" (without "Francisco") and
    the mother as "Maria Jacintha" with no surname; identity rests on the
    parents' names plus the recurring godmother Victoria de Medeiros (the
    godfather's surname "da Costa" is not fully legible). The officiant's fuller
    name and the second witness are only partly legible.
