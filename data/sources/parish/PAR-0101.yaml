transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos "Batismos 1821,
  Mar-1828, Jul". Two-page spread: seven entries, 21-27 October 1821, all entered and
  signed by the coadjutor Luiz Antonio Ferreira de Menezes. Every entry on the spread
  is transcribed below in reading order. The folio number at the top right of the
  right-hand page is damaged [illegible]. Insect damage and ink burn affect the foot
  of both pages. Read from the image 2026-10-10. TARGET entry: left page, first entry
  (margin "Antonio").]


  [Left page, entry 1 — TARGET; margin "Antonio"] "Aos vinte e hum dias do m[ez de]
  [Ou]tubro de mil e oito cen-tos e vinte e hum annos nesta Matriz de Itaborahy
  bapti-zou, e poz os Santos Oleos o Reverendo Vigario Francisco Xavier Pina ao
  innocente Antonio, filho legitimo de Manoel de Lemos Pereira, e de Maria Thereza de
  Jezus: neto pela parte paterna de Joze Henriques de Mattos, e Anna Joaquina da
  Conceição; e pela ma-terna de Joze Campello de Moraes, natural do Port[o], e de
  Emmerencianna Maria de Jezus, todos naturaes desta Freguezia: forão Padrinhos
  Antonio Joze da Fonceca, e Anna Maria das Dores; de que fiz este assento, que
  assigney. O Coad.or Luiz Ant.to Ferr.a de Menezes [rubrica]." [Letters in square
  brackets: "ez de" is faded and "Ou" worn at a small tear, the month read from the
  surviving "tubro" (the two following entries of the same day write "Outubro" in
  full); the last letter of "Port[o]" is cramped against the margin under an ink
  blot. The capital of "Pereira" is blotted by a heavy stroke; the following letters
  "ereira" are clear.]


  [Left page, entry 2; margin "Aurelia"] "Aos vinte e hum dias do mez de Outubro de
  mil oito centos e vinte e hum annos nesta Freguezia [interlinear insertion above
  "Freguezia", illegible] de Itabora[hy — damaged] de licença do Reverendo Vigario
  Francisco Xavier Pina baptizou e poz os Santos Oleos o Reverendo Manoel da Silva
  Chavaõ a innocente Aurelia, filha natural de Eulina [uncertain] Roza natural desta
  Freguezia: forão Padrinhos o Reverendo Joze Antonio de Caldas, e D. Bernardina
  Quintanilha de [struck through or heavily overwritten: Carvalho] por Procuração,
  que em seu nome apprezentou Joze Paulo [uncertain] [ink blot] [Pereira — uncertain]
  Sudré [uncertain]; de que fiz este assento, que assigney. O Coad.or Luiz Ant.to
  Ferr.a de Menezes [rubrica]."


  [Left page, entry 3; margin "Emiliana"] "Aos vinte e hum dias do mez de Outubro de
  mil e oito centos e vinte e hum annos nesta Matriz de Itaborahy baptizou e poz os
  Santos Oleos o Reverendo Vigario Francisco Xavier Pina a innocente Emilianna, filha
  legitima de Manoel [interlinear mark, illegible] Francisco da Silva, natural da
  Freguezia de S. Jozé do [R.]o de Janeiro, e de Maria Francisca digo, e de
  Fran-cisca de Paula, natural desta Freguezia: forão Pa-drinhos Antonio Joze [insect
  damage: da Fon]ceca, e Anna Maria das Dores; de [insect damage: que fiz este
  a]ssento, que assigney. O Coad.or [insect damage: Luiz Ant.to Ferr.a] de Menezes
  [rubrica]." [The bracketed godfather's name and signature are restored from the
  identical forms in entries 1 and 2; the damage leaves only their ends.]


  [Right page, entry 1; margin "Polucena"] "Aos vinte e dous [damaged: dias] do mez
  de Outubro de mil e oito centos e vinte e hum annos nesta Matriz de Itabo-rahy
  baptizou, e poz os Santos Oleos o Reverendo Vigario Francisco Xavier Pina a
  innocente Polucena crioula, filha natural de Albana Lu[c]iza [uncertain] do
  Sacramento, Crioula livre, natural desta Freguezia: foi Padri-nho Manoel Dias, pardo
  livre; de que fiz este assento, que assigney. O Coad.or Luiz Ant.to Ferr.a de
  Menezes [rubrica]."


  [Right page, entry 2; margin "Justini-anna"] "Aos vinte e seis dias do mez de
  Outubro de mil e oito centos e vinte e hum annos nesta Matriz de Itaborahy poz
  somente os Santos Oleos o Reverendo Vigario Francisco Xavier Pina a innocente
  Justinianna, baptizada in extremis pelo Reverendo João Gon-calves de Carva[lho —
  damaged], filha natural de Cy[pri]anna [uncertain — damaged] Maria de Jezus, natural
  desta Freguezia: assis-tio a este Sacramento João Machado de Miran-da; de que fiz
  este assento, que assigney. O Coad.or Luiz Ant.to Ferr.a de Menezes [rubrica]."


  [Right page, entry 3; margin "Ivo"] "Aos vinte e sete dias do mez de Outubro de mil
  e oito centos e vinte e hum annos nesta Freguezia de Itaborahy de li-cença do
  R[everendo — damaged] Vigario Francisco Xavier Pina baptizou, e poz os Santos Oleos
  o Reverendo João Lourenço [uncertain] Felgueiras a Ivo, filho natural de Thereza,
  Crioula, escrava do Tenente Coronel Anto-nio Rodrigues de Figueiredo, o qual disse
  dava liberdade ao dito innocente, [damaged: como] se livre nascesse do ventre
  materno, e se obrigava a faze-la boa em todo o tempo por sua pessoa e bens, e de
  como assim o disse assignou com o Reverendo [illegible — damaged]; e forão
  Padrinhos Antonio Pedro de Figueiredo, e Felicianna [illegible — insect damage]; de
  que fiz este [damaged: assento, que] assigney. O Coad.or [damaged: Luiz] Ant.to
  [damaged] de Menezes [rubrica]." [The foot of the right-hand page, where further
  signatures stood, is destroyed by insect damage — illegible.]
abstract: >-
  The 21 October 1821 Itaboraí baptism of Antonio, legitimate son of Manoel de Lemos
  Pereira (P-0052) and Maria Thereza de Jezus (P-0053) — the earliest record of the
  couple held here, fourteen years before their daughter Rosa Eugenia de Lemos
  (P-0035, PAR-0016). It names all four grandparents: paternal, Joze Henriques de
  Mattos (P-0132) and Anna Joaquina da Conceição (P-0133); maternal, Joze Campello de
  Moraes (P-0134), "natural do Porto", and Emmerencianna Maria de Jezus (P-0135),
  "todos naturaes desta Freguezia". Baptised by the vigário Francisco Xavier Pina;
  godparents Antonio Joze da Fonceca and Anna Maria das Dores; entered and signed by
  the coadjutor Luiz Antonio Ferreira de Menezes. Six other baptisms of 21-27 October
  1821 share the spread (unrelated families). The parents' identification with
  P-0052/P-0053, and so these grandparents' link to Rosa, is strong evidence, not
  proven (see reliability).
abstract_pt: >-
  O batismo, em Itaboraí em 21 de outubro de 1821, de Antonio, filho legítimo de
  Manoel de Lemos Pereira (P-0052) e de Maria Thereza de Jezus (P-0053) — o registro
  mais antigo do casal disponível aqui, catorze anos antes de sua filha Rosa Eugenia
  de Lemos (P-0035, PAR-0016). Nomeia os quatro avós: paternos, Joze Henriques de
  Mattos (P-0132) e Anna Joaquina da Conceição (P-0133); maternos, Joze Campello de
  Moraes (P-0134), "natural do Porto", e Emmerencianna Maria de Jezus (P-0135),
  "todos naturaes desta Freguezia". Batizado pelo vigário Francisco Xavier Pina;
  padrinhos Antonio Joze da Fonceca e Anna Maria das Dores; lançado e assinado pelo
  coadjutor Luiz Antonio Ferreira de Menezes. Outros seis batismos de 21 a 27 de
  outubro de 1821 dividem a página dupla (famílias sem relação). A identificação dos
  pais com P-0052/P-0053 e, portanto, o vínculo destes avós com Rosa é evidência
  forte, não prova (ver reliability).
reliability:
  assessment: >-
    Direct primary parish evidence, clearly legible for every core fact: the child,
    the day, the parents' names in the same full form as the couple's 1832, 1834 and
    1838 entries ("Manoel de Lemos Pereira", "Maria Thereza de Jezus"), and all four
    grandparents. As a record of this Antonio's parents and grandparents it is
    original and direct. Its link to Rosa Eugenia de Lemos is strong evidence, not
    proven: it rests on identifying these parents with P-0052 × P-0053 — the same two
    names, written the same way, in the same parish register series; the 1841 entry
    (PAR-0102) names the same grandparents for the same couple twenty years later, so
    the two records corroborate each other; and the retrieval side reports that its
    sweep of the 1821-1842 Itaboraí baptism books found no competing couple of these
    names [LEAD — sweep not repeated here]. No held record states the identity
    outright (a marriage of the couple, or a record of Rosa's naming these
    grandparents).
  informant: >-
    Not stated; the parents or godparents presumably declared the grandparents'
    names and origins. Entered by the coadjutor Luiz Antonio Ferreira de Menezes; the
    vigário Francisco Xavier Pina baptised.
  limitations: >-
    Volume in poor condition; the target entry is intact apart from a worn month word
    and a blotted capital (see the transcription). The grandparents are named as
    pairs; the entry does not state that either pair was married, nor whether they
    were then living. "todos naturaes desta Freguezia" follows a statement that Joze
    Campello was "natural do Porto"; the formula therefore cannot include him and is
    read as covering the other three grandparents (and the parents). The FamilySearch
    index reportedly dates this entry 23 October; the image reads 21 ("vinte e hum").
