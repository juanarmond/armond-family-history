transcription: >-
  [Livro de Óbitos, Nova Friburgo, p.139, 1860. Margem: "Isabel — 1 mez".] "Aos
  nove dias do mez de Junho do anno de 1860, falleceu da vida presente [illegible] nascida
  em 23 de Abril [do corrente anno], Isabel[?] filha legítima de Antonio da
  Silva Ferreira e de Maria Joanna Bock[e]man[?] [sobrenome germânico incerto];
  foi [acompanhada], encommendada e sepultada no [dia] seguinte no Cemiterio
  d'esta Villa; e para constar fiz este a[s]sento e por ser verdade assignei. O
  Vigario Jacob Joye [incerto]." [Vários termos ilegíveis pela caligrafia e
  tinta.]
abstract: >-
  Parish death/burial entry of the infant Isabel da Silva Ferreira, born 23
  April 1860 and died 9 June 1860 (aged about 1½ months) at Nova Friburgo,
  legitimate daughter of Antonio da Silva Ferreira (P-0036) and Maria Joanna
  Rocheman/Rutschmann (P-0037) — i.e. an infant sister of Lucinda Ferreira da
  Silva (P-0031). Recorded as a documented child on family F-0017. Both parents
  are named; the mother may carry an additional Germanic surname after "Maria
  Joanna" (uncertain), not asserted. PROVEN. Not modelled as a person entity; no
  event created.
abstract_pt: >-
  Assento de óbito/sepultamento da menina Isabel da Silva Ferreira, nascida em
  23 de abril de 1860 e falecida em 9 de junho de 1860 (com cerca de 1 mês e
  meio) em Nova Friburgo, filha legítima de Antonio da Silva Ferreira (P-0036) e
  Maria Joanna Rocheman/Rutschmann (P-0037) — ou seja, irmã bebê de Lucinda
  Ferreira da Silva (P-0031). Registrada como filha documentada na família
  F-0017. Ambos os pais são nomeados; a mãe pode ter um sobrenome germânico
  adicional após "Maria Joanna" (incerto), não afirmado. PROVADO. Não modelada
  como entidade pessoa; sem evento criado.
