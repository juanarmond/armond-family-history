transcription: >-
  [Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal; livro de
  batismos, fólio 93; entrada da coluna direita, anotação marginal "Ruiuais".]
  "Joam filho legitimo de Joam Rodrigues [Valle] e sua molher Joana Gonçalues desta
  Villa de Ruiuais, nasceo aos quinze dias [do mês] de Abril de mil sete centos, e
  vinte e oito annos, e foi baptiza[do, ministrando-lhe] os [Santos] Oleos pello
  padre Domingos [Pereira] de Valle Coadjutor desta igreja aos dezaseis dias do
  mesmo mês de Abril de mil sete centos, e vinte e oito annos. Foram seus padrinhos
  Francisco filho de Ana Bahia de quinta [de ?] e Mariana filha de [Philipe] de
  Matos desta Villa, estando testemunhas presentes desta freguesia, Domingos
  Rodrigues Valle, e Manoel Gonçalues, Domingos [Bahia de quinta?] que asignaram
  comigo dia era ut supra. [Assinaturas:] R.do Luiz Pirez dos [Santos]; Manoel [?];
  Francisco G.[onçalues]; Domingos [Bahia?]."
abstract: >-
  Original Ruivais (Braga, Portugal) baptism entry for João, legitimate son of João
  Rodrigues [Valle] (P-0080) and Joana Gonçalves (P-0081), born 15 April 1728 and
  baptized 16 April 1728. This João is João Rodrigues Valle (P-0078), who later
  emigrated to Minas Gerais and married Isabel Ribeiro at Borda do Campo in 1751
  (PAR-0034). Confirms the Portuguese origin corrected in the 1751 marriage certidão
  and the parent pair matching the 1716 Ruivais marriage (PAR-0036).
reliability:
  assessment: >-
    Direct primary parish baptism evidence. The child's name, both parents, the
    Ruivais parish and the 15/16 April 1728 dates are legible; the record is
    consistent with PAR-0034 (Portuguese origin) and PAR-0036 (parents' 1716
    marriage in the same parish).
  informant: >-
    Padre Domingos [Pereira] de Valle, coadjutor, São Martinho de Ruivais (1728).
  limitations: >-
    Dense early-18th-century Portuguese cursive; some godparent and witness
    surnames are uncertain (marked [?]). Identification of this João with the
    1751 groom rests on the corroborating records rather than an explicit link
    within this entry.
