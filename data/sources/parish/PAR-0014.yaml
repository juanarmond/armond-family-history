transcription: >-
  [Paróquia de Santa Luzia de Carangola, MG; livro de casamentos, acto nº 23. Margem:
  "João Monteiro e Mercedes Bittencourt".] "Aos dez de Setembro de mil novecentos e
  desesete, nesta Egreja de Santa Luzia de Carangola, recebi em Matrimonio João
  Monteiro de Azevedo e D. Mercedes Maria Bittencourt, ambos solteiros, e residentes
  nesta Freguesia. O orador com vinte e seis annos de edade, nascido na [dita] Freguesia
  de Sapucaya, Estado do Rio, filho legítimo de Joaquim Monteiro de Azevedo e D.
  Leopoldina Monteiro de Azevedo; e ella com dezenove annos de edade, nascida e
  baptisada nesta Freguesia, filha legítima de João Muniz Bittencourt e D. Suzana Rita
  Bittencourt. Foram testemunhas: Manoel Dias da Paixão e Felisberto de Carvalho Borges.
  E para constar mandei lavrar este assentamento que assigno. O Vigario P.e João Coutinho."
abstract: >-
  The original 1917 parish marriage of João Monteiro de Azevedo and Mercedes Maria
  Bittencourt at Santa Luzia de Carangola, 10 September 1917. Mercedes (19, born and
  baptized in the Carangola parish) is a legitimate daughter of João Muniz Bittencourt
  (P-0019) and Suzana Rita Brandão (P-0020, recorded here under her married surname
  "Bittencourt") — hence a sister of Deocleciano (P-0012), recorded as a documented
  child on F-0007.
abstract_pt: >-
  O casamento paroquial original de 1917 de João Monteiro de Azevedo e Mercedes
  Maria Bittencourt em Santa Luzia de Carangola, 10 de setembro de 1917. Mercedes
  (19 anos, nascida e batizada na freguesia de Carangola) é filha legítima de
  João Muniz Bittencourt (P-0019) e Suzana Rita Brandão (P-0020, aqui registrada
  sob o sobrenome de casada "Bittencourt") — portanto irmã de Deocleciano
  (P-0012), registrada como filha documentada em F-0007.
reliability:
  assessment: >-
    Direct primary parish evidence that Mercedes is a daughter of João Muniz Bittencourt
    and Suzana Rita Brandão (a sister of Deocleciano).
  informant: The officiating vigário, Pe. João Coutinho (1917).
  limitations: >-
    Handwritten register; the mother's surname is recorded as her married "Bittencourt".
    Mercedes is a collateral sibling recorded as a documented child, not modelled.
