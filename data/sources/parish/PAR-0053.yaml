  nascido em 24 de junho de 1910, é filho legítimo de Valentim Martinho Bohrer (P-0028) ×
  Carolina Klein (P-0029) — irmão de João Gonçalves Bohrer (P-0014), e portanto mais um
  primário para os avós paternos de Iris Bohrer Muniz. O sobrenome aparece grafado
  "Bor[b]er", variante de Bohrer/Borer. Registrado como documented_child em F-0013.
