transcription: >-
  [Livro de Batismos 13, folha 6, nº 53, Nova Friburgo.] "Aos vinte e dois dias do mês de
  Outubro de mil novecentos e dez, na Capela filial de São Pedro de Friburgo, baptisei
  solemnemente a Durval Baptista, nascido a vinte e quatro de Junho do dito ano [24 June
  1910], filho legítimo de Valentim Martinho Bor[b]er e Carolina Klein Bor[b]er. Foram
  padrinhos João Silverio Heisinger e Constancia Eulalia Martins Heisinger. Para constar
  fiz este assento e o assigno. O Vigário José Silvestre Alves de Miranda."
abstract: >-
  A 1910 parish baptism at the Capela de São Pedro, Nova Friburgo. Durval Baptista Bohrer,
  born 24 June 1910, is a legitimate son of Valentim Martinho Bohrer (P-0028) × Carolina
  Klein (P-0029) — a brother of João Gonçalves Bohrer (P-0014), and therefore a further
  primary for Iris Bohrer Muniz's paternal grandparents. The surname is inked "Bor[b]er", a
  variant of Bohrer/Borer. Recorded as a documented_child on F-0013.
abstract_pt: >-
