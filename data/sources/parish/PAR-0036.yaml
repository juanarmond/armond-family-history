transcription: >-
  [Freguesia de São Martinho de Ruivais, Arcebispado de Braga, Portugal; livro de
  casamentos; entrada da coluna inferior direita, anotação marginal "Ruiuay de
  quinta — João Roiz de Joanna G.[onçalues]".] "Aos treze dias do mês de Mayo de
  mil sete centos e dezaseis annos, dadas as denunciaçõis na forma do Sag.do
  Conc.[ilio] Trid.[entino], e não avendo impedimento algum, recebi eu o Padre
  Bento [Pereira?] de licença do Reverendo Reitor Luiz Pirez dos Santos a Joam
  Rodr.[igue]s filho de Gonçallo Roiz [Rodrigues] já defunto, e de sua Molher
  Elebia Francisca — moradores nesta villa de Ruivais, e se recebeo com Joanna
  Gonçalves filha de Domingos Gonçalves já defunto, e de sua Molher Maria Fernandes
  moradores no lugar da quinta, todos desta freguezia de São Martinho de Ruivais,
  estando por testemunhas Duarte Dias, e Domingos Afonso, e Gregorio do Rego Macedo
  e muitas mais testemunhas que estando prezentes todos desta dita freguezia que
  todos aqui [assignaram comigo, dia era ut supra]."
abstract: >-
  Original Ruivais (Braga, Portugal) marriage entry for the 13 May 1716 marriage of
  João Rodrigues (P-0080), son of Gonçalo Rodrigues (deceased) and Elebia Francisca,
  and Joanna Gonçalves (P-0081), daughter of Domingos Gonçalves (deceased) and Maria
  Fernandes — all of the freguesia de São Martinho de Ruivais. This couple are the
  parents of João Rodrigues Valle (P-0078, baptized here in 1728, PAR-0035), the
  Portuguese-born ancestor who married Isabel Ribeiro at Borda do Campo in 1751
  (PAR-0034).
abstract_pt: >-
  Assento original de casamento em Ruivais (Braga, Portugal) do casamento em 13 de
  maio de 1716 de João Rodrigues (P-0080), filho de Gonçalo Rodrigues (falecido) e
  de Elebia Francisca, com Joanna Gonçalves (P-0081), filha de Domingos Gonçalves
  (falecido) e de Maria Fernandes — todos da freguesia de São Martinho de Ruivais.
  Este casal é o dos pais de João Rodrigues Valle (P-0078, aqui batizado em 1728,
  PAR-0035), o ancestral nascido em Portugal que se casou com Isabel Ribeiro na
  Borda do Campo em 1751 (PAR-0034).
reliability:
  assessment: >-
    Direct primary parish marriage evidence. Both spouses, all four of their parents
    (both fathers already deceased in 1716), and the Ruivais parish are legible. The
    parent pair matches the 1728 Ruivais baptism of their son João Rodrigues Valle
    (PAR-0035).
  informant: >-
    Padre Bento [Pereira?], by licence of Reitor Luiz Pirez dos Santos, São Martinho
    de Ruivais (1716).
  limitations: >-
    Dense early-18th-century Portuguese cursive; the officiant's surname and Joanna
    Gonçalves's mother's forename ("Maria" Fernandes) carry some uncertainty. The
    named parents of the couple (Gonçalo Rodrigues × Elebia Francisca; Domingos
    Gonçalves × Maria Fernandes) were modelled 2026-08-13 as P-0088–P-0091 (families
    F-0043, F-0044). Gonçalo's clause reads "já defunto" here (parallel to the bride's
    father "Domingos Gonçalves já defunto"); the retrieval synthesis alternatively read
    it "de Frades" from a lower-resolution copy — "já defunto" is preferred and
    "de Frades" kept as a less-certain alternative on P-0088.
