abstract: >-
  Primary parish baptism record for Isabel de Souto-Maior, daughter of Belchior da Ponte
  Cardoso (P-0123) × Mariana Fagundes (P-0124), baptised 19 September 1666 in São
  Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0379). The act names the mother
  as "marianna Faguedes" and the child as Isabel de Souto-Maior, with godmother "Isabel de
  Souto[?]". The father's given name appears as "Mathias" rather than "Belchior" — all
  other identifiers (surname, mother, parish, date) are consistent with Belchior da Ponte
  Cardoso (P-0123); no "Mathias de Ponte Cardoso" is known in these records. The
  discrepancy is attributed to a scribal error or misread. Consistent with Vol. IX
  (PUB-0005, p.260): Isabel de Souto-Maior (b.19.9.1666). Status: confirmed (with caveat
  on the father's given name).
abstract_pt: >-
  Registo paroquial primário do baptismo de Isabel de Souto-Maior, filha de Belchior da
  Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizada a 19 de setembro de 1666
  em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0379). O assento nomeia
  a mãe como "marianna Faguedes" e a criança como Isabel de Souto-Maior, com madrinha
  "Isabel de Souto[?]". O nome próprio do pai aparece como "Mathias" em vez de "Belchior"
  — todos os outros identificadores (apelido, mãe, freguesia, data) são consistentes com
  Belchior da Ponte Cardoso (P-0123); nenhum "Mathias de Ponte Cardoso" é conhecido nestes
  registos. A discrepância é atribuída a erro scribal ou leitura equivocada. Consistente
  com Vol. IX (PUB-0005, p.260): Isabel de Souto-Maior (n.19.9.1666). Estado: confirmado
  (com ressalva sobre o nome próprio do pai).
reliability:
  assessment: >-
    Primary source (original parish baptism register). The mother's name ("marianna
    Faguedes"), child's name (Isabel de Souto-Maior), date (19 September 1666), and parish
    are all clearly legible and consistent with PUB-0005. The only discrepancy is the father's
    given name ("Mathias" instead of "Belchior"). Given that no other "Mathias de Ponte
    Cardoso" is known in S. Sebastião, and all other identifiers align, this is assessed as
    a scribal error or misread, not a different person. Evidence quality: confirmed (with
    noted caveat). A higher-resolution rescan would resolve the father's name definitively.
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1666
  limitations: >-
    Father's given name reads "Mathias" rather than "Belchior" — discrepancy unexplained;
    attributed to scribal error pending a higher-resolution rescan. Godmother's surname is
    partially legible. Resolution: 766×1053 px per page.
