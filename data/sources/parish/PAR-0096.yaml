abstract: >-
  Primary parish baptism record for Isabel de Souto-Maior, daughter of Belchior da Ponte
  Cardoso (P-0123) × Mariana Fagundes (P-0124), baptised 19 September 1666 in São
  Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0379). The act names the parents
  as the "Alferes melchior de Ponte Cardozo" (Melchior = Belchior) and "marianna
  Fagundes", the child as Izabel, and the godparents as the Alferes Pedro Lourenço of the
  Novas Ribeiras and Izabel de Souto. Consistent with Vol. IX (PUB-0005, p.260): Isabel de
  Souto-Maior (b.19.9.1666). Status: confirmed. [Corrected 2026-10-08: an earlier reading
  gave the father's forename as "Mathias" and the mother as "marianna Faguedes"; the image
  reads "melchior" and "Fagundes", so the former caveat on the father's name is
  withdrawn.]
abstract_pt: >-
  Registo paroquial primário do baptismo de Isabel de Souto-Maior, filha de Belchior da
  Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124), baptizada a 19 de setembro de 1666
  em São Sebastião, Terceira (TER-AH-SAOSEBASTIAO-B-1611-1687, p.0379). O assento nomeia
  os pais como o "Alferes melchior de Ponte Cardozo" (Melchior = Belchior) e "marianna
  Fagundes", a criança como Izabel e os padrinhos como o Alferes Pedro Lourenço, das Novas
  Ribeiras, e Izabel de Souto. Consistente com o Vol. IX (PUB-0005, p.260): Isabel de
  Souto-Maior (n.19.9.1666). Estado: confirmado. [Corrigido em 2026-10-08: uma leitura
  anterior dava o prenome do pai como "Mathias" e a mãe como "marianna Faguedes"; a imagem
  lê "melchior" e "Fagundes", pelo que a anterior ressalva sobre o nome do pai é
  retirada.]
reliability:
  assessment: >-
    Primary source (original parish baptism register). The father ("Alferes melchior de
    Ponte Cardozo"), mother ("marianna Fa-gundes"), child (Izabel), date (19 September
    1666) and parish are legible and consistent with PUB-0005. "Melchior" is a period
    variant of Belchior, also used in PAR-0095. Evidence quality: confirmed. [Corrected
    2026-10-08: the earlier "Mathias" reading and its caveat are withdrawn.]
  informant: Parish priest of São Sebastião, Terceira, recording the baptism in 1666
  limitations: >-
    The godmother's filiation ("filha da [?] Leonardo") is only partly legible.
    Resolution: 766×1053 px per page.
