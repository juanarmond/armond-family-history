notes:
- text: >-
    [Superseded 2026-10-08] An earlier note held that the father's given name read
    "Mathias", inconsistent with the couple's other baptisms, and called for a rescan. A
    direct image re-read shows "do Alferes melchior de Ponte Cardozo" — Melchior being a
    variant of Belchior (as in PAR-0095) — so there is no discrepancy and no rescan is
    needed for this point. The identification as Belchior da Ponte Cardoso (P-0123)
    stands.
- text: >-
    Isabel de Souto-Maior is a documented_child in F-0062. The surname "de Souto-Maior"
    reflects the Cardoso-Soto matriline of the Ponte Cardoso kindred (see PAR-0088 notes).
    The godmother "Izabel de Souto" (filiation partly legible) likely shares this family
    connection [INFERRED].
