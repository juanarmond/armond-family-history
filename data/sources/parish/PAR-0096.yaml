transcription: >-
  [Image p1 — baptism act, p.0379, S. Sebastião batismos 1611–1687]
  [Re-read from the image 2026-10-08; margin "Izabel":] "Em os dezanove dias do mes de
  setembro de mil e seis sentos e sesenta e seis annos baptizei a Izabel filha do Alferes
  melchior de Ponte Cardozo e de sua molher marianna Fa-gundes forão padrinhos o Alferes
  Pedro Lourenço m.or [morador] nas Novas Ribeiras e Izabel de Souto filha da [?]
  Leonardo [uncertain] por verdade me asignei Ant.º Coelho Sottomajor"
  Parents: "Alferes melchior de Ponte Cardozo × marianna Fagundes"
  Child: Izabel [Isabel; the surname "de Souto-Maior" is PUB-0005's, not written here]
  Padrinhos: the Alferes Pedro Lourenço, morador nas Novas Ribeiras, and Izabel de Souto,
  daughter of [illegible] Leonardo [uncertain]
  Date: 19 September 1666
  [Corrected 2026-10-08: earlier transcribed father "[Alferes Mathias/Belchior?] de Ponte
  Cardogo" and mother "marianna Faguedes". The father's forename is "melchior" — a variant
  of Belchior, as also written in PAR-0095 — not "Mathias"; there is no discrepancy with
  the other baptisms. The mother is "marianna Fa-gundes".]
  [Image p2 — context/facing page of the register]
