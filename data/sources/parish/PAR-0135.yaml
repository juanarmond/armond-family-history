notes:
- text: >-
    Comparison with the producer's draft (§8.4): the draft is confirmed, including the
    ordinal, which the image gives plainly as "filha legitima, primeira do nome". Differences:
    the seventh line reads "ridos mes, e anno" (draft "mez"); there is no comma after
    "alfaiate" in the eighth line, nor between "Maria" and "e que nas-"; the godmother's
    "solteira" is cramped and marked uncertain.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): o rascunho confirma-se, inclusive o ordinal,
    que a imagem dá com clareza como "filha legitima, primeira do nome". Diferenças: a sétima
    linha lê-se "ridos mes, e anno" (rascunho "mez"); não há vírgula depois de "alfaiate" na
    oitava linha, nem entre "Maria" e "e que nas-"; o "solteira" da madrinha está apertado e
    fica marcado como incerto.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and naturalidade, the mother as a foundling of unknown origin, and the marriage at
    São Romão da Ucha (E-0142). The paternal grandparents are identified with P-0141 and P-0142
    through the father's identity and the matching names; strong, not proven. The wrong
    ordinal does not weaken the identification, which rests on the names, lugar and
    grandparents.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a
    naturalidade do pai, a mãe como exposta de origem ignorada e o casamento em São Romão da
    Ucha (E-0142). Os avós paternos são identificados com P-0141 e P-0142 pela identidade do
    pai e pelos nomes coincidentes; forte, não provada. O ordinal errado não enfraquece a
    identificação, que assenta nos nomes, no lugar e nos avós.
- text: >-
    What it adds: the birth and baptism of the ninth and last child found at Pousa; the father
    a tailor and the mother a seamstress in 1871; the godfather João Gomes, single, tailor, now
    stated natural and resident of São Romão da Ucha (he was godfather in 1868 too, PAR-0131);
    the godmother Maria Ferreira, single, of Pousa. No kinship is stated for either. That this
    Maria is the heir "Maria Fernandes de Souza" of the 1898 inventário (PRB-0014) is the
    producer's inference by elimination; this record does not state it. As a collateral
    record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: o nascimento e o batismo da nona e última criança encontrada em Pousa; o
    pai alfaiate e a mãe costureira em 1871; o padrinho João Gomes, solteiro, alfaiate, agora
    declarado natural e residente de São Romão da Ucha (já fora padrinho em 1868, PAR-0131); a
    madrinha Maria Ferreira, solteira, de Pousa. Não se declara parentesco de nenhum dos dois.
    Que esta Maria seja a herdeira "Maria Fernandes de Souza" do inventário de 1898 (PRB-0014)
    é inferência do produtor por eliminação; este registro não o declara. Como registro
    colateral, não se liga a nenhum evento; linked_events fica vazio de propósito.
- text: >-
    The godmother of the neighbouring entry Nº 16 is also a "Maria Ferreira", but cazada and
    natural of Cabreiros; she is a different woman from this entry's godmother, who is single
    and natural of Pousa.
  text_pt: >-
    A madrinha do assento vizinho nº 16 também é uma "Maria Ferreira", mas cazada e natural de
    Cabreiros; é outra mulher, diferente da madrinha deste assento, que é solteira e natural de
    Pousa.
