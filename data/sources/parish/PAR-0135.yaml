transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, baptism section. FamilySearch DGS 004670017, image 00064: the opening fl. 59v (left) – fl. 60 (right). Read from the native image on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0135-baptism-maria-1871-pousa.jpg; DGS 004670017 image 00064; fl. 60, entry Nº 19]

  [Right page head (fl. 60): the folio number "60" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 59v, top — the end of entry Nº 16: the godfather [Sebastião] Luiz Ferreira, solteiro, pedreiro, natural of São Miguel de Cabreiros, and the godmother Maria Ferreira, cazada, natural of Cabreiros and resident in Pousa, lavradora; signed "O padrinho Sebastião Luiz Ferreira" and by the cura Manoel Martins d'Abreu.]

  [fl. 59v, Nº 17 — Roza Maria, filha natural of Maria Thereza da Motta, of the logar de Brunhaes; baptised 26 September 1871.]

  [fl. 59v foot, continued on fl. 60 — Nº 18, Antonio, son of João Rodrigues and Maria Rodrigues, of the logar do Outeiro; baptised 28 September 1871.]

  [fl. 60, Nº 19 — TARGET]
  [Margin:]
  N.º 19
  Maria
  filha legitima de
  Manoel João
  Fernandes, Anna
  exposta do logar
  do Souto –
  [Body:]
  Aos oito dias do mes d'Outubro do anno de mil oito centos se-
  tenta e um, n'esta egreja Parochial da Pouza Concelho de Barce-
  llos, diocese de Braga eu o Presbytero Manoel Martins d'Abreu, cura
  d'esta freguezia, baptizei solemnemente e puz os santos óleos a um
  individuo do sexo feminino, a quem dei o nome de Maria e que nas-
  ceu n'esta freguezia, ás sete horas da tarde do dia cinco dos refe-
  ridos mes, e anno, filha legitima, primeira do nome, de Manoel João
  Fernandes, alfaiate natural de Sam Romão da Ucha, d'este conce-
  lho, e diocese, e d'Anna exposta, costureira, cuja naturalidade se
  ignora, recebidos na sobredita freguezia de Sam Romão da Ucha,
  parochianos d'esta da Pouza, e moradores no logar do Souto, neta pa-
  terna de Bento Fernandes, e Joaquina Lopes, e materna d'avós incog-
  nitos. Foi padrinho João Gomes, solteiro, alfaiate, natural da freguezia
  de Sam Romão da Ucha, e nella residente, e madrinha Maria Ferreira,
  [uncertain: solteira], lavradora, natural d'esta freguezia, e n'ella residente, os quaes to-
  dos sei serem os proprios. E para constar, lavrei em duplicado este
  assento, que depois de ser lido, e conferido perante os padrinhos com
  elles o não assigno, por haverem declarado, que não sabião escrever.
  Era ut supra –        O Cura Manoel Martins d'Abreu –
  [Reading notes: the ordinal is written plainly "primeira do nome". The first word of the fifteenth line is cramped against the ruled margin; "s" and "teira" are visible and the word is read as "solteira", as in the draft. Glosses: alfaiate = tailor; recebidos = married; exposta = foundling.]

  [fl. 60 foot — Nº 20 begins "Aos doze dias do mes d'Outubro do anno de mil" (the entry continues beyond this image).]
reading_reliability: complete
abstract: >-
  Original baptism entry Nº 19 of 1871 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. On 8 October 1871, in the parish church of Pousa, the curate Manoel Martins
  d'Abreu solemnly baptised Maria, born in Pousa at seven in the evening of 5 October 1871,
  legitimate daughter, "primeira do nome", of Manoel João Fernandes, tailor, natural of São
  Romão da Ucha, and of Anna exposta, seamstress, "cuja naturalidade se ignora"; the parents
  were married at São Romão da Ucha and lived at the logar do Souto in Pousa. Paternal
  grandparents Bento Fernandes and Joaquina Lopes; maternal grandparents unknown. Godparents
  João Gomes, single, tailor, natural and resident of São Romão da Ucha, and Maria Ferreira,
  single, woman farmer, natural and resident of Pousa; neither could write. The parents are
  Manoel João Fernandes (P-0139) and Anna Maria, "Anna Exposta" (P-0140); the grandparents are
  Bento José Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142). The ordinal "primeira do
  nome" conflicts with the earlier Marias of the family and is a clerical inconsistency.
abstract_pt: >-
  Assento original de batismo nº 19 de 1871 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. Em 8 de outubro de 1871, na igreja paroquial de Pousa, o cura Manoel Martins
  d'Abreu batizou solenemente Maria, nascida em Pousa às sete da noite de 5 de outubro de
  1871, filha legítima, "primeira do nome", de Manoel João Fernandes, alfaiate, natural de São
  Romão da Ucha, e de Anna exposta, costureira, "cuja naturalidade se ignora"; os pais
  casaram-se em São Romão da Ucha e moravam no lugar do Souto, em Pousa. Avós paternos Bento
  Fernandes e Joaquina Lopes; avós maternos incógnitos. Padrinhos João Gomes, solteiro,
  alfaiate, natural e residente de São Romão da Ucha, e Maria Ferreira, solteira, lavradora,
  natural e residente de Pousa; nenhum sabia escrever. Os pais são Manoel João Fernandes
  (P-0139) e Anna Maria, "Anna Exposta" (P-0140); os avós são Bento José Fernandes (P-0141) e
  Joaquina Rosa Lopes (P-0142). O ordinal "primeira do nome" contradiz as Marias anteriores da
  família e é uma incoerência do escrivão.
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating curate, who certifies that he
    knew all the parties. It is primary for the baptism, its date and place, the child's name,
    the parents and the godparents, and secondary for the birth date and hour, the parents'
    trades and origins, their marriage parish and the grandparents; hence mixed. Every core
    fact is legible, so reading_reliability is complete; the uncertain marks fall only on the
    godmother's civil status and on the page rubric.
  informant: >-
    Not named. The entry was written and signed by the curate Manoel Martins d'Abreu; the
    godparents heard it read and could not sign.
  limitations: >-
    "Primeira do nome" is wrong on the family's own records: Maria de Jesus (1858, PAR-0125),
    Maria José (1859, PAR-0126) and the Maria of 1870, "terceira do nome" (PAR-0133), came
    before. The entry does not explain the count; it was written by a different officiant from
    the 1870 entry. The grandparents appear as "Bento Fernandes" and "Joaquina Lopes".
