transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Margem
  lateral "Polid[oro]". Página com danos significativos; nome da mãe ilegível.]
  "[Aos dez?] dias [do mês de Novembro?] de mil oitocentos e trinta e oito nesta
  Matriz batizei que os Santos Óleos o Reverendo [?] ao inocente Polídoro, filho
  legítimo de Manoel de Lemos [Ferreira] e [mãe: ilegível], naturais desta
  Freguesia; foram Padrinhos [ilegíveis]; para Constar [?]. O Vigário Fr.° R.s
  Pena."
abstract: >-
  The c.November 1838 Itaboraí baptism of Polídoro, legitimate son of Manoel de
  Lemos Ferreira (P-0052); mother's name is damaged and illegible. This Polidoro
  is Rosa Eugenia de Lemos's (P-0035) brother — the youngest confirmed sibling in
  the 1832-1838 register sweep. Father's name clearly legible ("de Lemos Ferreira"),
  consistent with PAR-0030/PAR-0031. Godparents illegible.
abstract_pt: >-
  O batismo, em Itaboraí por volta de novembro de 1838, de Polídoro, filho legítimo
  de Manoel de Lemos Ferreira (P-0052); o nome da mãe está danificado e ilegível.
  Este Polidoro é irmão de Rosa Eugenia de Lemos (P-0035) — o irmão mais novo
  confirmado na varredura do registro de 1832-1838. O nome do pai é claramente
  legível ("de Lemos Ferreira"), consistente com PAR-0030/PAR-0031. Padrinhos
  ilegíveis.
reliability:
  assessment: >-
    Direct primary parish evidence of a Polídoro baptised c.November 1838 at
    Itaboraí to Manoel de Lemos Ferreira. Father identification is certain; mother
    is unreadable due to page damage.
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1838).
  limitations: >-
    Significant page damage; mother's name, exact day, month (November inferred from
    surrounding entries), and godparents all illegible or uncertain. November 1838
    is the best read of the date.
