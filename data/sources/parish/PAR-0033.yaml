- text: >-
    [corrected 2026-10-10 from the image: the 2026-08-10 "date correction" above was
    itself a misreading and is superseded. Re-read at full resolution after the
    retrieval agent's native-resolution reading disagreed with ours, the entry
    reads "Aos desoito dias do mez de Março de mil oito Centos e trinta e Oito" —
    18 March 1838 (the retrieval agent's earlier "approximately 15 March 1838" had
    the month right). The child was "nascido a tres mezes" (born about December
    1837). The father is "Manoel de Lemos Pereira" (the capital matches this hand's
    "P" in "Padrinhos" and "Polidoro"), not "[Ferreira]"; the mother, recorded as
    illegible, is "Maria Thereza de Je-zus"; the godparents, recorded as illegible,
    are "He[r]menegildo Jozé de Mattos, e N. Senhora". reading_reliability raised
    from partial to complete accordingly. The superseded transcription read: "[Aos
    dez?] dias [do mês de Novembro?] de mil oitocentos e trinta e oito ... filho
    legítimo de Manoel de Lemos [Ferreira] e [mãe: ilegível] ...; foram Padrinhos
    [ilegíveis] ...". This entry therefore resolves, rather than leaves open, the
    mother's name.]
  text_pt: >-
    [corrigido em 2026-10-10 a partir da imagem: a "correção de data" de 2026-08-10
    acima era ela própria uma leitura errada e fica superada. Relido em resolução
    plena depois que a leitura do agente de recuperação, em resolução nativa,
    divergiu da nossa, o assento diz "Aos desoito dias do mez de Março de mil oito
    Centos e trinta e Oito" — 18 de março de 1838 (o "aproximadamente 15 de março de
    1838" anterior do agente de recuperação acertava o mês). A criança estava
    "nascido a tres mezes" (nascida por volta de dezembro de 1837). O pai é "Manoel
    de Lemos Pereira" (a maiúscula coincide com o "P" desta mão em "Padrinhos" e
    "Polidoro"), não "[Ferreira]"; a mãe, registrada como ilegível, é "Maria Thereza
    de Je-zus"; os padrinhos, registrados como ilegíveis, são "He[r]menegildo Jozé de
    Mattos, e N. Senhora". reading_reliability elevado de partial para complete. A
    transcrição superada dizia: "[Aos dez?] dias [do mês de Novembro?] de mil
    oitocentos e trinta e oito ... filho legítimo de Manoel de Lemos [Ferreira] e
    [mãe: ilegível] ...; foram Padrinhos [ilegíveis] ...". Este assento, portanto,
    resolve o nome da mãe, em vez de deixá-lo em aberto.]
