transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Página
  esquerda, terceira entrada; margem lateral "Polido-/ro / inn.e". Relida na imagem
  em 2026-10-10.] "Aos desoito dias do mez de Março de mil oito Centos e trinta e
  Oito nesta matriz baptizou e pos os Santos Oleos o Reveren-do Vigario, a
  innocente Polidoro nascido a tres mezes, filho Legitimo de Manoel de Lemos
  Pereira, e Maria Thereza de Je-zus natural desta freguezia, forão Padrinhos
  He[r]menegildo Jozé de Mattos, e N. Senhora; e para Constar mandey fazer este
  asento que assigney. O Vig.rº Fran.co R.os Pena." [O "r" de "Hermenegildo" não se
  distingue com clareza.]
abstract: >-
  The 18 March 1838 Itaboraí baptism of Polidoro, "nascido a tres mezes" (born
  about December 1837), legitimate son of Manoel de Lemos Pereira (P-0052) and
  Maria Thereza de Jezus (P-0053), natural of the parish; godparents Hermenegildo
  José de Mattos and "N. Senhora" (Nossa Senhora, the Virgin as devotional
  godmother). This Polidoro is a younger brother of Rosa Eugenia de Lemos (P-0035)
  and the youngest of the couple's children in the 1832-1838 register sweep.
  Corrected 2026-10-10 from the image: the date is 18 March 1838, not "c. November
  1838"; the father is "Pereira", not "Ferreira"; and the mother's name and the
  godparents, earlier recorded as illegible, are legible.
abstract_pt: >-
  O batismo, em Itaboraí em 18 de março de 1838, de Polidoro, "nascido a tres
  mezes" (nascido por volta de dezembro de 1837), filho legítimo de Manoel de Lemos
  Pereira (P-0052) e de Maria Thereza de Jezus (P-0053), natural da freguesia;
  padrinhos Hermenegildo José de Mattos e "N. Senhora" (Nossa Senhora, a Virgem como
  madrinha devocional). Este Polidoro é irmão mais novo de Rosa Eugenia de Lemos
  (P-0035) e o caçula dos filhos do casal na varredura do livro de 1832-1838.
  Corrigido em 2026-10-10 a partir da imagem: a data é 18 de março de 1838, não "c.
  novembro de 1838"; o pai é "Pereira", não "Ferreira"; e o nome da mãe e os
  padrinhos, antes registrados como ilegíveis, são legíveis.
