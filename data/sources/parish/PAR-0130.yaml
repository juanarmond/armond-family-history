transcription: |-
  [Pousa (Santa Cristina), concelho de Barcelos — parish register 1863–1877, baptism section. FamilySearch DGS 004670017, image 00028: the opening fl. 23v (left) – fl. 24 (right). Read from the native image on 2026-10-12. The target entry is transcribed in full, line by line as written, keeping the original spelling, capitals and abbreviations; each neighbouring entry is summarised in one bracketed line. Editorial matter is in square brackets.]

  [p1 — evidence/parish/PAR-0130-baptism-joaquim-1866-pousa.jpg; DGS 004670017 image 00028; fl. 23v, entry Nº 8]

  [Right page head (fl. 24): the folio number "24" and a rubric, [uncertain: Valle], that heads each right-hand leaf of the book.]

  [fl. 23v, top — the closing lines of entry Nº 7: "A madrinha declarar não Saber escrever. Era ut Supra. Padrinho [signature, illegible]   O Cura O Presbitero José Lopes".]

  [fl. 23v, Nº 8 — TARGET]
  [Margin:]
  N.º 8.º
  Joaquim
  filho legi-
  timo de Ma-
  noel João
  Fernandes,
  e Anna Ex-
  posta do-
  logar do
  Souto.
  [Body:]
  Aos quatro dias do mez de Maio do anno de mil oito centos Sessenta
  e seis, nesta Egreja Parochial da Pouza, concelho de Barcellos Dio-
  cese de Braga, O Presbitero José Lopes Cura desta freguesia,
  Baptizei Solemnemente, e puz os Santos Oleos a um individuo
  do Sexo masculino, a quem dei o nome de Joaquim, e que nasceo
  nesta freguesia ás dez horas da noite do dia dois dos referidos
  mez e anno, filho legitimo primeiro do nome de Manoel Jo-
  ão Fernandes, Alfaate natural da freguesia de Sam Ro-
  mão da Ucha, concelho de Barcellos Diocese de Braga, e de-
  Anna Exposta, Cu[uncertain: s]toreira, cuja naturalidade é ignorada,
  recebidos na dita freguesia de Sam Romão da Ucha, paro-
  chianos desta da Pouza, e moradores no logar do Souto da-
  mesma, neto paterno de Bento Fernandes, e Joaquina
  Lopes, e materno de avós incognitos. Foi padrinho Anto-
  nio Joaquim Martins, cazado, Oleiro, e madrinha The-
  reza de Jezus Lopes, cazada, Custoreira, os quaes todos Sei
  Serem os proprios. E para constar lavrei em duplicado
  este assento que, depois de ser lido e conferido perante os-
  padrinhos comigo o não assignão, por declararem não
  Saberem escrever. Era ut Supra. O Cura O Presbitero José Lopes [rubric]
  [Reading notes: an ink blot covers the third letter of the mother's trade in the tenth line; the godmother's trade six lines below is plainly "Custoreira". "Oleos" and "Oleiro" are written with a detached capital O ("O Leos", "O Leiro"). Glosses: Alfaate = alfaiate, tailor; Custoreira = costureira, seamstress; Oleiro = potter; recebidos = married; Exposta = foundling.]

  [fl. 23v foot, continued on fl. 24 — Nº 9, Joaquim, son of Antonio Fernandes, natural of São Julião de Passos, and Esperança Thereza, of the logar de [uncertain: Paimouro]; baptised 9 June 1866 by the Abbade Manoel José de Oliveira Guimarães; paternal grandparents Manoel Fernandes and Maria Rosa Martins, maternal José Joaquim Ferreira and Maria Joaquina Loureira; godparents Joaquim Soares and Rosa Fernandes. A different Fernandes family: none of the target family's names occurs.]

  [fl. 24, Nº 10 — Anna, daughter of Caetano Exposto and Maria Rodrigues, of the logar da Tapada; baptised 22 July 1866.]

  [fl. 24, Nº 11 — Joaquina Rosa, daughter of Luiz Antonio [illegible]; baptised 2 September 1866 by the Abbade (the entry continues beyond this image).]
reading_reliability: complete
abstract: >-
  Original baptism entry Nº 8 of 1866 in the Pousa (Santa Cristina, Barcelos) register
  1863–1877. On 4 May 1866, in the parish church of Pousa, the curate José Lopes solemnly
  baptised Joaquim, born in Pousa at ten at night on 2 May 1866, legitimate son, "primeiro do
  nome", of Manoel João Fernandes, tailor ("Alfaate"), natural of São Romão da Ucha (Barcelos),
  and of Anna Exposta, seamstress, "cuja naturalidade é ignorada"; the parents were married at
  São Romão da Ucha and lived at the logar do Souto in Pousa. Paternal grandparents Bento
  Fernandes and Joaquina Lopes; maternal grandparents unknown. Godparents Antonio Joaquim
  Martins, married, potter, and Thereza de Jezus Lopes, married, seamstress, neither of whom
  could write. The parents are Manoel João Fernandes (P-0139) and Anna Maria, "Anna Exposta"
  (P-0140); the grandparents are Bento José Fernandes (P-0141) and Joaquina Rosa Lopes
  (P-0142).
abstract_pt: >-
  Assento original de batismo nº 8 de 1866 do livro de Pousa (Santa Cristina, Barcelos)
  1863–1877. Em 4 de maio de 1866, na igreja paroquial de Pousa, o cura José Lopes batizou
  solenemente Joaquim, nascido em Pousa às dez da noite de 2 de maio de 1866, filho legítimo,
  "primeiro do nome", de Manoel João Fernandes, alfaiate ("Alfaate"), natural de São Romão da
  Ucha (Barcelos), e de Anna Exposta, costureira, "cuja naturalidade é ignorada"; os pais
  casaram-se em São Romão da Ucha e moravam no lugar do Souto, em Pousa. Avós paternos Bento
  Fernandes e Joaquina Lopes; avós maternos incógnitos. Padrinhos Antonio Joaquim Martins,
  casado, oleiro, e Thereza de Jezus Lopes, casada, costureira, nenhum dos quais sabia
  escrever. Os pais são Manoel João Fernandes (P-0139) e Anna Maria, "Anna Exposta" (P-0140);
  os avós são Bento José Fernandes (P-0141) e Joaquina Rosa Lopes (P-0142).
reliability:
  assessment: >-
    Original and direct, written and signed by the officiating curate, who certifies that he
    knew all the parties. It is primary for the baptism, its date and place, the child's name,
    the parents and the godparents, and secondary for the birth date and hour, the parents'
    trades and origins, their marriage parish and the grandparents; hence mixed. Every core
    fact is legible, so reading_reliability is complete; the uncertain marks fall only on one
    letter of the mother's trade, on a lugar and a name in the neighbouring entries, and on the
    page rubric.
  informant: >-
    Not named. The entry was written and signed by the curate José Lopes; the godparents heard
    it read and could not sign.
  limitations: >-
    The grandparents appear as "Bento Fernandes" and "Joaquina Lopes", without the "José" and
    "Rosa" of their other records. The godparents' kinship, if any, is not stated.
