notes:
- text: >-
    Comparison with the producer's draft (§8.4): the draft is confirmed word for word on the
    core facts. Differences: the mother's and the godmother's trade read "Custoreira" (draft
    "Costoreira"; in the mother's case an ink blot covers the third letter); there is no comma
    after "Alfaate"; the scribe writes "Baptizei Solemnemente", "Sei / Serem" and "Saberem"
    with large initials (draft lower case). The draft did not mention the godparent's
    signature at the top of the page or the neighbouring entries.
  text_pt: >-
    Comparação com o rascunho do produtor (§8.4): o rascunho confirma-se palavra por palavra
    nos fatos essenciais. Diferenças: o ofício da mãe e o da madrinha leem-se "Custoreira"
    (rascunho "Costoreira"; no caso da mãe, uma mancha de tinta cobre a terceira letra); não há
    vírgula depois de "Alfaate"; o escrivão escreve "Baptizei Solemnemente", "Sei / Serem" e
    "Saberem" com iniciais grandes (rascunho em minúscula). O rascunho não mencionou a
    assinatura do padrinho no alto da página nem os assentos vizinhos.
- text: >-
    Identification: the parents are identified with Manoel João Fernandes (P-0139) and Anna
    Maria, "Anna Exposta" (P-0140) by the same names, the same lugar do Souto, the father's
    trade and naturalidade, the mother as a foundling of unknown origin, and the marriage at
    São Romão da Ucha (E-0142). The paternal grandparents "Bento Fernandes, e Joaquina Lopes"
    are identified with Bento José Fernandes (P-0141) and Joaquina Rosa Lopes (P-0142) through
    the father's identity and the matching names; the identification is strong, not proven.
  text_pt: >-
    Identificação: os pais são identificados com Manoel João Fernandes (P-0139) e Anna Maria,
    "Anna Exposta" (P-0140) pelos mesmos nomes, o mesmo lugar do Souto, o ofício e a
    naturalidade do pai, a mãe como exposta de origem ignorada e o casamento em São Romão da
    Ucha (E-0142). Os avós paternos "Bento Fernandes, e Joaquina Lopes" são identificados com
    Bento José Fernandes (P-0141) e Joaquina Rosa Lopes (P-0142) pela identidade do pai e pelos
    nomes coincidentes; a identificação é forte, não provada.
- text: >-
    What it adds: the birth (2 May 1866, ten at night) and baptism of Joaquim, "primeiro do
    nome"; the father a tailor and the mother a seamstress; the parents married at Ucha and
    living at Souto. The godmother "Thereza de Jezus Lopes" is called cazada, so she is
    unlikely to be the child's paternal aunt Thereza de Jesus, whose marriage took place in
    1869 (PAR-0123); the entry states no kinship for either godparent. That this Joaquim is the
    "Joaquim José Fernandes" of the 1890 will and the 1898 inventário (PRB-0013, PRB-0014) is
    the producer's inference by elimination; this record does not state it. As a collateral
    record it links no event; linked_events is empty on purpose.
  text_pt: >-
    O que acrescenta: o nascimento (2 de maio de 1866, dez da noite) e o batismo de Joaquim,
    "primeiro do nome"; o pai alfaiate e a mãe costureira; os pais casados na Ucha e moradores
    no Souto. A madrinha "Thereza de Jezus Lopes" é dita cazada, pelo que dificilmente será a
    tia paterna da criança, Thereza de Jesus, cujo casamento se deu em 1869 (PAR-0123); o
    assento não declara parentesco de nenhum dos padrinhos. Que este Joaquim seja o "Joaquim
    José Fernandes" do testamento de 1890 e do inventário de 1898 (PRB-0013, PRB-0014) é
    inferência do produtor por eliminação; este registro não o declara. Como registro
    colateral, não se liga a nenhum evento; linked_events fica vazio de propósito.
- text: >-
    Neighbouring entry Nº 9 (9 June 1866) is a different Fernandes family: Antonio Fernandes,
    natural of São Julião de Passos, son of a Manoel Fernandes and Maria Rosa Martins. Neither
    name pair matches P-0143 × P-0144 (Manoel Fernandes × Jozefa Maria Domingues), and nothing
    ties it to this family.
  text_pt: >-
    O assento vizinho nº 9 (9 de junho de 1866) é de outra família Fernandes: Antonio
    Fernandes, natural de São Julião de Passos, filho de um Manoel Fernandes e de Maria Rosa
    Martins. Nenhum dos pares de nomes coincide com P-0143 × P-0144 (Manoel Fernandes × Jozefa
    Maria Domingues), e nada o liga a esta família.
