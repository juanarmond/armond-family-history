transcription: |-
  [Whole opening — Pousa baptisms, DGS 004668983 image 67: three entries on the left page (August–December 1855) and, on the right page, the target entry followed by the heading "1856" and three entries of early 1856. Every entry is written and signed by the Abbade Antonio Martins Villaça, in a fast, heavily abbreviated hand. Read from the native image (3512×2782) in strips at 1–3× zoom, 2026-10-12. Line breaks are kept as on the page; spelling, capitals and abbreviations are kept as written.]

  [left page, entry 1 — Maria, daughter of Manoel Bernardo and Anna Maria, of the lugar do Souto of this parish; paternal grandparents José Rodrigues and Maria Loureira, maternal grandparents João Francisco and Luiza [uncertain: Maria], of the freguezia da Graça; born in August 1855. Another couple of the lugar do Souto, with a mother named Anna Maria who has named parents (see notes); not this family.]

  [left page, entries 2 and 3 — two baptisms of November and December 1855; they do not name this family as far as read.]

  [p1 — evidence/parish/PAR-0124-baptism-joao-1855-pousa.jpg; right page, first entry — TARGET]
  João filho de Manoel João e Anna Maria do lugar do Souto desta=
  freguezia da Pouza nepto paterno de Bento José Fernandes, e
  Joaquinna Roza de S. Romão da Ucha materno de Avós inco-
  gnitos. Naceo no dia vinte e dous de Dezembro de mil e
  oito centos, e cincoenta e cinco e no dia vinte e quatro do
  mesmo mes foi solemnemente Baptizado p.r mim, logo
  lhe pus os Sanctos Oleos. forão Padrinhos João solteiro
  thio paterno do Baptizado, e Cecilia solteira filha de João
  de Cima desta freguezia; e para constar fis este assento
  era ut supra
                 O Abb.e Antonio Martins Villaça [rubric]
  [Expansions and readings: "Manoel João" — "João" is abbreviated with a raised ending; nepto = neto (written with a p, as "nepta" is in PAR-0125); Joaquinna is written with nn; inco- / gnitos = incógnitos; Naceo = nasceu; p.r mim = por mim (the Abbade); Sanctos Oleos = Santos Óleos; thio = tio; fis = fiz; Abb.e = Abbade. The "=" at the end of the first line is the scribe's line-end hyphen.]

  [right page, after the target — the heading "1856" and three baptisms of early 1856 (one entry carries a twentieth-century marginal note of a death in 1947); they do not name this family as far as read.]
reading_reliability: complete
abstract: >-
  Original baptism entry, the first on the right page of an opening of the Pousa (Barcelos)
  baptism book, written and signed by the Abbade Antonio Martins Villaça. João, son of Manoel
  João and Anna Maria, of the lugar do Souto in Pousa, was born on 22 December 1855 and was
  solemnly baptised by the Abbade on 24 December 1855, who also applied the holy oils. The
  paternal grandparents are named as Bento José Fernandes and Joaquinna Roza, "de S. Romão da
  Ucha"; the maternal grandparents are "Avós incognitos". The godparents were João, solteiro, the
  child's paternal uncle ("thio paterno do Baptizado"), and Cecilia, solteira, daughter of João
  de Cima, of Pousa. The parents are Manoel João Fernandes da Cruz (P-0139) and Anna Maria
  Fernandes (P-0140); João is a collateral child of their family F-0070, born eleven months
  after their marriage at Ucha (PAR-0107).
abstract_pt: >-
  Assento original de batismo, o primeiro da página da direita de uma abertura do livro de
  batismos de Pousa (Barcelos), escrito e assinado pelo Abade Antonio Martins Villaça. João,
  filho de Manoel João e de Anna Maria, do lugar do Souto, em Pousa, nasceu em 22 de dezembro de
  1855 e foi batizado solenemente pelo Abade em 24 de dezembro de 1855, que também lhe pôs os
  santos óleos. Os avós paternos são nomeados como Bento José Fernandes e Joaquinna Roza, "de S.
  Romão da Ucha"; os avós maternos são "Avós incognitos". Foram padrinhos João, solteiro, tio
  paterno da criança ("thio paterno do Baptizado"), e Cecilia, solteira, filha de João de Cima, de
  Pousa. Os pais são Manoel João Fernandes da Cruz (P-0139) e Anna Maria Fernandes (P-0140); João
  é um filho colateral da família F-0070, nascido onze meses depois do casamento dos pais na Ucha
  (PAR-0107).
reliability:
  assessment: >-
    Original and direct. It is primary for the baptism, its date and place, the child, the
    parents as named, the godparents and the officiant: the Abbade baptised the child and wrote
    and signed the entry. The birth date, the grandparents and the kinship of the godfather were
    declared to him and are secondary information. Every core fact is legible: the child, both
    parents, their lugar, the birth and baptism dates, and the paternal grandparents.
  informant: >-
    The Abbade of Pousa, Antonio Martins Villaça, who baptised the child and signed the entry;
    the facts of birth and kinship were presumably declared by the family or the godparents.
  limitations: >-
    The father is written "Manoel João" without a surname, and the mother "Anna Maria" without a
    surname or any statement that she was a foundling; the child is not called "legitimo". The
    grandparents are given without a lugar beyond "de S. Romão da Ucha". The godfather João is
    named by forename only. No folio number is visible on the image.
