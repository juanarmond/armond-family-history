notes:
- text: >-
    Identification. The parents are identified with P-0139 and P-0140: "Manoel João" with a wife
    "Anna Maria", of the lugar do Souto in Pousa, whose child's paternal grandparents are Bento
    José Fernandes and Joaquinna Roza of S. Romão da Ucha (the parents of the groom of the Ucha
    marriage of January 1855, PAR-0107), and whose maternal grandparents are unknown, as they
    would be for a foundling. The later Pousa baptisms of the couple's children name the same
    parents and grandparents (PAR-0125, PAR-0126, PAR-0127). The identification is strong, not
    proven.
  text_pt: >-
    Identificação. Os pais são identificados com P-0139 e P-0140: "Manoel João", casado com "Anna
    Maria", do lugar do Souto, em Pousa, cujo filho tem por avós paternos Bento José Fernandes e
    Joaquinna Roza, de S. Romão da Ucha (os pais do noivo do casamento da Ucha de janeiro de 1855,
    PAR-0107), e por avós maternos avós desconhecidos, como seria o caso de uma exposta. Os
    batismos posteriores dos filhos do casal em Pousa nomeiam os mesmos pais e avós (PAR-0125,
    PAR-0126, PAR-0127). A identificação é forte, não provada.
- text: >-
    The mother's name as written: "Anna Maria", with no surname and no mention of exposure. At
    the couple's marriage eleven months earlier she is "Joanna Maria / Esposta" (PAR-0107); in
    the 1862 baptism she is "Anna Exposta" (PAR-0127). This record supports the form "Anna Maria"
    and does not resolve the "Joanna" of the marriage entry.
  text_pt: >-
    O nome da mãe como está escrito: "Anna Maria", sem apelido e sem menção de exposição. No
    casamento do casal, onze meses antes, ela é "Joanna Maria / Esposta" (PAR-0107); no batismo de
    1862 ela é "Anna Exposta" (PAR-0127). Este registro apoia a forma "Anna Maria" e não resolve o
    "Joanna" do assento de casamento.
- text: >-
    What the record adds. The couple lived in the lugar do Souto, Pousa, by December 1855. Their
    son João was born on 22 December 1855 and baptised on 24 December 1855 (the date is
    confirmed: "no dia vinte e quatro do mesmo mes"). The godfather was "João solteiro thio
    paterno do Baptizado": a brother of Manoel João named João, still unmarried in 1855. That
    fits João Fernandes, who married in Ucha in 1868 aged 38 and solteiro (PAR-0122), but the
    record gives the godfather no surname, so the identification is strong, not proven. The
    godmother was Cecilia, solteira, daughter of João de Cima, of Pousa. João the child can be
    recorded as a documented child of F-0070; the retrieval side reports the death of a João, son
    of the couple, aged 10 years 2 months, at Pousa in 1866 (PAR-0129).
  text_pt: >-
    O que o registro acrescenta. O casal morava no lugar do Souto, em Pousa, em dezembro de 1855.
    O filho João nasceu em 22 de dezembro de 1855 e foi batizado em 24 de dezembro de 1855 (a data
    está confirmada: "no dia vinte e quatro do mesmo mes"). O padrinho foi "João solteiro thio
    paterno do Baptizado": um irmão de Manoel João chamado João, ainda solteiro em 1855. Isso
    combina com João Fernandes, que se casou na Ucha em 1868 com 38 anos e solteiro (PAR-0122), mas
    o registro não dá apelido ao padrinho, de modo que a identificação é forte, não provada. A
    madrinha foi Cecilia, solteira, filha de João de Cima, de Pousa. O menino João pode ser
    registrado como filho documentado da F-0070; a pesquisa de recuperação refere o óbito de um
    João, filho do casal, com 10 anos e 2 meses, em Pousa em 1866 (PAR-0129).
- text: >-
    Namesake on the same page. The first entry of the left page baptises Maria, daughter of
    Manoel Bernardo and Anna Maria, also "do lugar do Souto", in August 1855. That Anna Maria has
    named parents (João Francisco and Luiza, of the freguezia da Graça) and a husband named
    Manoel Bernardo; she is a different woman from P-0140, the foundling.
  text_pt: >-
    Homônima na mesma página. O primeiro assento da página da esquerda batiza Maria, filha de
    Manoel Bernardo e de Anna Maria, também "do lugar do Souto", em agosto de 1855. Essa Anna Maria
    tem pais nomeados (João Francisco e Luiza, da freguesia da Graça) e um marido chamado Manoel
    Bernardo; é uma mulher diferente de P-0140, a exposta.
- text: >-
    Differences from the retrieval side's draft (manoel-joao-fernandes-da-cruz.md §8.3, entry 1).
    The wording is confirmed, with these readings: "nepto paterno" (draft "neto paterno"); "oito
    centos, e cincoenta" with a comma; "Baptizado p.r mim" (draft "por mim[?]") — the words are
    clear, the abbreviation is written "p.r"; "de Cima" is legible (draft "de Cima[?]"); and the
    first line ends with the scribe's "=". The draft's dates (born 22 December, baptised 24
    December 1855) are confirmed.
  text_pt: >-
    Diferenças em relação ao rascunho da pesquisa de recuperação
    (manoel-joao-fernandes-da-cruz.md §8.3, assento 1). O texto foi confirmado, com estas leituras:
    "nepto paterno" (rascunho "neto paterno"); "oito centos, e cincoenta", com vírgula; "Baptizado
    p.r mim" (rascunho "por mim[?]") — as palavras são claras, e a abreviatura está escrita "p.r";
    "de Cima" é legível (rascunho "de Cima[?]"); e a primeira linha termina com o "=" do escrivão.
    As datas do rascunho (nascido em 22 de dezembro, batizado em 24 de dezembro de 1855) estão
    confirmadas.
