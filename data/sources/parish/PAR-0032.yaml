  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Margem
  lateral "Thomas". Página parcialmente danificada; dia exato e padrinhos
  ilegíveis.] "[Aos ?] dias do mês de Junho de mil oitocentos e trinta e [seis]
  anos nesta Matriz de Itaborahy, batizei que os Santos Óleos o Reverendo [?] ao
  inocente Thomas, filho legítimo de Manoel de Lemos [e] [?] Maria Thereza[?],
  naturais desta Freguesia; foram Padrinhos [?]; para Constar mandei fazer este
  assento que assinei. O Vigário Fr.° R.s Pena."
abstract: >-
  The c.1836 Itaboraí baptism of Thomas (Thomaz), legitimate son of Manoel de
  Lemos (P-0052) and Maria Thereza [de Jesus] (P-0053), natural of the parish.
  This Thomas is Rosa Eugenia de Lemos's (P-0035) brother, confirmed by parent pair
  and parish. ⚠️ Mother recorded here as "Maria Thereza" — matching PAR-0016
  (1835) but differing from the "Maria Nunes de Jesus" of PAR-0030 (1832) and
  PAR-0031 (1834); scribal inconsistency, same woman. Godparents illegible due to
  page damage.
reliability:
  assessment: >-
    Direct primary parish evidence. Father's name "Manoel de Lemos" and the mother's
    "Maria Thereza" form clearly support the F-0025 parent pair. The exact day is
    unclear from the damaged page.
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1836).
  limitations: >-
    Volume in poor condition; exact day, godparent names, and some text around the
    mother's name illegible or uncertain. June 1836 is secure from visible text.
