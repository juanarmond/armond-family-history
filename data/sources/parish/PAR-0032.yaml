- text: >-
    [corrected 2026-10-10 from the image: re-read at full resolution after the
    retrieval agent's native-resolution reading disagreed with ours. The day is
    "treze" (the same form as "Aos treze" in the Francisco entry immediately above,
    also of June 1836), so the baptism is 13 June 1836, not "c. June 1836". The
    entry states "nascido a tres mezes" (born about March 1836). The godparents are
    "o Cap.am Jozé Custodio Vieira, e N. Snr.a", not illegible; the father is plain
    "Manoel de Lemos" and the mother "Maria Thereza" (confirmed). The text reads
    "baptizou e pos os Santos Oleos o Reverendo Vigario", in the third person. The
    superseded transcription read: "[Aos ?] dias do mês de Junho ... batizei que os
    Santos Óleos o Reverendo [?] ao inocente Thomas, filho legítimo de Manoel de
    Lemos [e] [?] Maria Thereza[?] ...; foram Padrinhos [?] ...". The earlier note
    that Thomaz was baptised "~8 months after Rosa" stands (12 Oct 1835 → 13 Jun
    1836), but his stated birth about March 1836 puts the births about fifteen
    months apart.]
  text_pt: >-
    [corrigido em 2026-10-10 a partir da imagem: relido em resolução plena depois que
    a leitura do agente de recuperação, em resolução nativa, divergiu da nossa. O dia
    é "treze" (a mesma forma de "Aos treze" no assento de Francisco imediatamente
    acima, também de junho de 1836), de modo que o batismo é de 13 de junho de 1836,
    não "c. junho de 1836". O assento declara "nascido a tres mezes" (nascido por
    volta de março de 1836). Os padrinhos são "o Cap.am Jozé Custodio Vieira, e N.
    Snr.a", não ilegíveis; o pai é apenas "Manoel de Lemos" e a mãe "Maria Thereza"
    (confirmado). O texto diz "baptizou e pos os Santos Oleos o Reverendo Vigario",
    na terceira pessoa. A transcrição superada dizia: "[Aos ?] dias do mês de Junho
    ... batizei que os Santos Óleos o Reverendo [?] ao inocente Thomas, filho legítimo
    de Manoel de Lemos [e] [?] Maria Thereza[?] ...; foram Padrinhos [?] ...". A nota
    anterior de que Thomaz foi batizado "~8 meses depois de Rosa" mantém-se (12 out.
    1835 → 13 jun. 1836), mas seu nascimento declarado, por volta de março de 1836,
    põe os dois nascimentos cerca de quinze meses um do outro.]
