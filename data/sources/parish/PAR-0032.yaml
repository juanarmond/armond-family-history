transcription: >-
  [Matriz de São João Batista de Itaboraí; livro de batismos 1832-1838. Página
  direita, quarta entrada; margem lateral "Thomaz / inn.e". Relida na imagem em
  2026-10-10.] "Aos treze dias do mez de Junho de mil oito centos e trinta e seis
  nesta matriz baptizou e pos os Santos Oleos o Reveren-do Vigario, a innocente
  Thomaz nascido a tres me-zes filho legitimo de Manoel de Lemos, e Maria Thereza,
  naturaes desta freguezia forão Padrinhos o Cap.am Jozé Custodio Vieira, e N.
  Snr.a, e para Cons-tar mandey fazer este asento que assigney. O Vig.rº Fran.co
  R.os Pena."
abstract: >-
  The 13 June 1836 Itaboraí baptism of Thomaz, "nascido a tres mezes" (born about
  March 1836), legitimate son of Manoel de Lemos (P-0052) and Maria Thereza
  (P-0053), natural of the parish; godparents Capitão José Custodio Vieira — who
  had stood godfather to his sister Maria in 1832 (PAR-0030) — and "N. Snr.a"
  (Nossa Senhora, the Virgin as devotional godmother). This Thomaz is a younger
  brother of Rosa Eugenia de Lemos (P-0035): same parents, parish and register as
  PAR-0016. Corrected 2026-10-10 from the image: the day (13), the birth interval
  and the godparents, earlier read as illegible, are legible; the child's name is
  written "Thomaz".
abstract_pt: >-
  O batismo, em Itaboraí em 13 de junho de 1836, de Thomaz, "nascido a tres mezes"
  (nascido por volta de março de 1836), filho legítimo de Manoel de Lemos (P-0052)
  e de Maria Thereza (P-0053), naturais da freguesia; padrinhos o Capitão José
  Custodio Vieira — que fora padrinho de sua irmã Maria em 1832 (PAR-0030) — e "N.
  Snr.a" (Nossa Senhora, a Virgem como madrinha devocional). Este Thomaz é irmão
  mais novo de Rosa Eugenia de Lemos (P-0035): mesmos pais, freguesia e livro de
  PAR-0016. Corrigido em 2026-10-10 a partir da imagem: o dia (13), o intervalo de
  nascimento e os padrinhos, antes lidos como ilegíveis, são legíveis; o nome da
  criança está escrito "Thomaz".
reliability:
  assessment: >-
    Direct primary parish evidence, legible at full resolution. Father "Manoel de
    Lemos" and mother "Maria Thereza", natural of the parish — the F-0025 parent
    pair, as in Rosa's 1835 baptism (PAR-0016).
  informant: Vigário Francisco Ramos Pena, São João Batista de Itaboraí (1836).
  limitations: >-
    Volume in poor condition (torn upper edge), but this entry is intact. The
    mother is written "Maria Thereza" without "de Jesus".
