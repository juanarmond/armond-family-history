notes:
  - text: >-
      Material conflict: PAR-0025 (1777) names Amaro da Silva Xavier as "natural da
      frequesia de Nossa Senhora do Rio de Meia Ponte, comarca do Goyas, Bispado do
      Rio de Janeiro", while PAR-0023 (1810, São João del Rei marriage) describes both
      Amaro and Ignez as "naturais e batizados da Freguesia de Barbacena." The 1777
      record is the earlier and more specific source; the 1810 description may reflect
      long-term Barbacena domicile rather than actual birthplace. Both versions
      preserved; the conflict is flagged in P-0059's notes.
