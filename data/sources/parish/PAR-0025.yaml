transcription: >-
  [Parish baptism entry, Minas do Piracatu, Freguesia da Manga, 23 August 1777.
  Transcribed from the delivered image (rec-armond-maria-umbelina-da-silva-baptism-gen-1.jpg,
  1600×1120 px); 18th-century Portuguese cursive — some words and the
  military rank abbreviation are uncertain.]

  [Opening formula and priest's name not fully deciphered.] ...aos vinte e tres de
  Agosto de mil setecentos e setenta e sete... baptisei solenemente... [a] Maria...
  nascida aos doze [do corrente / de Agosto]... filha legítima de Amaro da Silva
  Xavier, natural da frequesia de Nossa Senhora do Rio de Meia Ponte, comarca do
  Goyas, Bispado do Rio de Janeiro, e de Ignez Francisca de Lima, natural [d]ora
  frequesias... neta legítima por parte paterna do [uncertain rank: Sargento /
  Tenente?] Amaro da Silva Barreto, natural da Villa de Guimaraes, Arcebispado de
  Braga, e de Perpétua da Silva, natural da Cidade de S. Paulo; e por parte materna
  de Joao Rodrigues de Mello, natural da Villa de Vianna, Arcebispado de Braga, e
  de Maria Francisca Cordeira, natural da Villa de Ouru [Ouro?], Bispado de S. Paulo.
  [Officiating priest, witnesses and closing formula not fully deciphered.]
abstract: >-
  Baptism on 23 August 1777 at the Minas do Piracatu (Manga parish, Bispado de
  Pernambuco) of Maria, born 12 August 1777, legitimate daughter of Amaro da Silva
  Xavier (P-0059) and Ignez Francisca de Lima (P-0060). The entry directly names all
  four grandparents: paternal — Amaro da Silva Barreto (P-0064), from Guimarães,
  Arcebispado de Braga (Portugal) × Perpétua da Silva (P-0065), from the Cidade de
  São Paulo; maternal — João Rodrigues de Mello (P-0066), from Viana, Arcebispado de
  Braga (Portugal) × Maria Francisca Cordeira (P-0067), from Villa de Ouro, Bispado
  de São Paulo. This is a primary source simultaneously establishing P-0059's and
  P-0060's parentage, extending both lines to Portugal (Braga archdiocese). Amaro da
  Silva Xavier (P-0059) is stated as native of the Freguesia de Nossa Senhora do Rio
  de Meia Ponte, Comarca do Goiás — conflicting with PAR-0023 (1810), which states
  both Amaro and Ignez as "naturais e batizados da Freguesia de Barbacena." The child
  in this entry is named "Maria" only; "Umbelina" does not appear in the visible text.
abstract_pt: >-
  Batismo em 23 de agosto de 1777 nas Minas do Piracatu (freguesia da Manga,
  Bispado de Pernambuco) de Maria, nascida em 12 de agosto de 1777, filha legítima
  de Amaro da Silva Xavier (P-0059) e de Ignez Francisca de Lima (P-0060). O
  assento nomeia diretamente os quatro avós: paternos — Amaro da Silva Barreto
  (P-0064), de Guimarães, Arcebispado de Braga (Portugal) × Perpétua da Silva
  (P-0065), da Cidade de São Paulo; maternos — João Rodrigues de Mello (P-0066), de
  Viana, Arcebispado de Braga (Portugal) × Maria Francisca Cordeira (P-0067), da
  Villa de Ouro, Bispado de São Paulo. É uma fonte primária que estabelece
  simultaneamente a filiação de P-0059 e de P-0060, estendendo ambas as linhas até
  Portugal (arquidiocese de Braga). Amaro da Silva Xavier (P-0059) é declarado
  natural da Freguesia de Nossa Senhora do Rio de Meia Ponte, Comarca do Goiás — em
  conflito com PAR-0023 (1810), que declara tanto Amaro quanto Ignez como "naturais
  e batizados da Freguesia de Barbacena". A criança neste assento tem apenas o nome
  "Maria"; "Umbelina" não aparece no texto visível.
reliability:
  assessment: >-
    An original 18th-century parish register entry; primary information for Amaro da
    Silva Xavier's and Ignez Francisca de Lima's parentage and places of origin. The
    image (1600×1120 px) is readable but the 18th-century cursive contains abbreviations
    and faded passages; several words are uncertain. Archival citation (film, folio,
    image number) requires confirmation against FamilySearch metadata.
  informant: >-
    The officiating priest of the Manga / Piracatu parish, recording the baptism as
    a primary act of registration.
  limitations: >-
    Several words uncertain or illegible; full archival citation not yet confirmed from
    film metadata. The military rank before Amaro da Silva Barreto's name is
    abbreviated and uncertain. Ignez Francisca de Lima's own birthplace is unclear
    ("[d]ora frequesias" — possibly "desta" or "d'outra"). The entry names the child
    "Maria" only; any link to "Umbelina" requires a separate source.
