notes:
- text: >-
    Anna Muniz Bittencourt (b. 19 Nov 1884, bapt. 25 Jul 1885) is recorded as a
    documented child on F-0007 (a sibling of Deocleciano), not modelled as a
    person. She is very likely the "Ana Muniz Bittencourt ⚭ Antonio dos Santos
    Ferreira" of the 1908 Carangola marriage (a lead) and the "Ana dos Santos
    Ferreira" who died 1950. The godparents José do Rego Brandão + Rita Ignacia de
    Jesus (P-0040/P-0041) are Susanna's parents, so this act also corroborates
    F-0019 (Susanna's parentage).
