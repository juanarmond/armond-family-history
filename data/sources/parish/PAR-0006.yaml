transcription: >-
  [Paróquia de Santo Antônio de Sapucaia, RJ; livro de batismos. Entry margin:
  "Anna".] "Aos vinte e cinco de Julho de mil oitocentos oitenta e cinco baptizei
  solemnemente a innocente Anna que nasceu a dezenove de Novembro de mil oitocentos
  oitenta e quatro, filha legítima de João Muniz Betencourt e Suzana Rita
  Brandão. Foram padrinhos José do Rego Brandão e Rita Ignacia de Jesus, de que
  fiz este assento que assigno. P.e Francisco Antonio Pinto Pereira da Veiga[s]."
  (Adjacent entries on the same folio are other families' baptisms — Maria, filha
  de Marcellino Teixeira Pinto e D. Leopoldina; Maria, filha de Manuel Pacheco do
  Amaral e Candida Roza d'Almeida; Porcina, filha de José Muniz Bettencourt e Anna
  Barbara de Jesus — and are not this record.)
abstract: >-
  The original 1885 baptism register entry (Igreja de Santo Antônio de Sapucaia,
  RJ) of Anna, born 19 November 1884, baptized 25 July 1885, a legitimate
  daughter of João Muniz Bittencourt (P-0019) and Susanna (Suzana) Rita Brandão
  (P-0020) — hence a sibling of Deocleciano (P-0012). Her godparents are José do
  Rego Brandão (P-0040) and Rita Ignacia de Jesus (P-0041), Susanna's own parents
  (F-0019), which corroborates that couple.
abstract_pt: >-
  O assento original de batismo de 1885 (Igreja de Santo Antônio de Sapucaia, RJ)
  de Anna, nascida em 19 de novembro de 1884, batizada em 25 de julho de 1885,
  filha legítima de João Muniz Bittencourt (P-0019) e Susanna (Suzana) Rita
  Brandão (P-0020) — portanto irmã de Deocleciano (P-0012). Seus padrinhos são
  José do Rego Brandão (P-0040) e Rita Ignacia de Jesus (P-0041), os próprios
  pais de Susanna (F-0019), o que corrobora esse casal.
reliability:
  assessment: >-
    Direct primary parish evidence that Anna is a legitimate daughter of João
    Muniz Bittencourt and Susanna Rita Brandão (a sibling of Deocleciano). It
    also names Susanna's parents as the godparents, corroborating F-0019.
  informant: The baptising priest, Pe. Francisco Antônio Pinto Pereira da Veiga (1885).
  limitations: >-
    Handwritten register; the officiant's surname and one or two given names are
    slightly uncertain in the cursive. Anna is a collateral (a sibling of
    Deocleciano) recorded as a documented child, not modelled as a person entity.
