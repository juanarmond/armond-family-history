transcription: >-
  Passaram-se Provisões a 23 do corrente [...] do Espírito Santo desta corte
  para receber em matrimonio na sua matriz a João Monis Bittencourt — com
  Susanna Rita Brondão. Rio, 23 de Dezembro de 1882. [Official's signature.]
abstract: >-
  On 23 December 1882 an ecclesiastical register recorded that provisions were
  issued for João Monis Bittencourt and Susanna Rita Brondão to marry in the
  mother church of the Espírito Santo parish in the Court of Rio de Janeiro.
  The entry establishes the intended couple and jurisdiction but does not state
  that the marriage ceremony had already occurred.
reliability:
  assessment: >-
    The original ecclesiastical register directly supports the issuance of the
    marriage provisions, the couple's source-record name forms, the date and
    the intended parish. It is indirect evidence for a completed marriage.
  informant: The issuing church office; individual declarants are not stated.
  limitations: >-
    The handwriting is abbreviated and the issuing cleric's title is not
    transcribed. FamilySearch labels the record as a marriage and its detail
    table currently displays an erroneous year of 1633, although the original
    entry and attached citation clearly state 23 December 1882. A separate
    ceremony entry has not yet been located.
