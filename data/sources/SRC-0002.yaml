notes:
  - text: >-
      FamilySearch stores three photographs of the same certificate as separate
      Memories. They are alternate views, not successive pages. The clearest
      view, uploaded as IMG_2211.JPG, is retained. The other two were reviewed
      but removed from the current tree after repository-owner review; they
      remain recoverable from Git commit 3dc9c5e.
  - text: >-
      This marriage record supports the 15 September 1930 birth-date variant
      for Cidalia but cannot resolve the conflict with 15 November. A birth
      registration remains necessary.
  - text: >-
      The certificate includes signatures. Retain the images only in this
      private repository and exclude them from public derivatives.
