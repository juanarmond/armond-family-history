transcription: >-
  CERTIFICO que, às fls. 21 [verso] do livro nº 13-B de registro de
  Casamentos, foi celebrado o matrimônio de GERALDO PAZ ARMOND e CIDALIA
  ENGRACIO GUIMARÃES. Ele, nascido em Limeira, aos 30 de janeiro de 1915,
  [profession and intervening text obscured], filho de [text partly obscured].
  Ela, nascida em Alvorada, aos 15 de setembro de 1930, profissão doméstica,
  filha de Antonio Engracio Filho e Maria Aurora Guimarães [parts of the
  parentage lines obscured]. A contraente passa a assinar-se "Cidalia Engracio
  Armond". Observações: O casamento realizou-se no dia 31 de maio de 1952
  [remaining text partly obscured].
abstract: >-
  A damaged civil marriage certificate records that Geraldo Paz Armond and
  Cidalia Engracio Guimarães married in Eugenópolis on 31 May 1952. It reports
  Geraldo as born in Limeira on 30 January 1915 and Cidalia as born in Alvorada
  on 15 September 1930. The certificate states that she would thereafter sign
  Cidalia Engracio Armond. The retained photograph is the clearest of three
  alternate views reviewed in FamilySearch.
reliability:
  assessment: >-
    Direct evidence for the marriage, the spouses' names and the married-name
    form. The stated birth facts are secondary information for those events.
  informant: The spouses' declarations as entered on the marriage certificate.
  limitations: >-
    The certificate is severely damaged and repaired with opaque tape. Several
    words, including portions of the parentage and certification text, cannot
    be read safely. The repository retains the originally uploaded JPEG for the
    clearest of the three reviewed photographs.
