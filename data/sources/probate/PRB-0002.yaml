transcription: >-
  [Fólio "321" no canto superior direito.] Ill.mo Snr. Dr. Juiz de Orphãos.

  [Despacho, lançado no alto da folha, leitura difícil:] Nos autos, [venha-me
  concluso?]. Leopoldina 15 de [Fevereiro] de 1884. J. [Felicio?]. [Seguem-se
  algumas linhas riscadas / decalque de tinta da folha oposta, ilegíveis.]

  [Petição, autógrafa:] Diz Simplicio Jozé Ferreira Armond herdeiro da fina[da]
  D. Mathilde Maria de Jezus que, tendo ella falle[-]cido a cerca de 4 annos, até
  hoje [não se?] [terem?] partilhados os bens por aquella [dita?] finada
  [deixados?]; e como isso não convem não só ao inte[-]resse do Supp.e como dos de
  mais herdeiros, vem pe[-]rante V. S.ª [requerer?] hoje [de ordenar?] q[ue],
  junta esta aos autos, [suba?] á conclusão de V. S.ª para verificar o motivo da
  demora e ordenar q[ue] em [um] praso q[ue] se digne marcar se faça a partilha.

  O Supp.e em attenção sómente a[o] [seu?] interesse [nada?] [requereria?], mas
  tem parentes colateraes em esta[-]do de indigencia aos quaes pode m.to minorar
  o mal q[ue] soffrem, o recebimento de seus [haveres?]. Assim pois

  [bloco alinhado à direita, leitura difícil:] [P.?] e E. de [M.cê?] [enérgicas?]
  pro[-]videncias a fim de q[ue] se não continue [no?] prote[-]lação.

  E. R. M.cê [leitura incerta]

  [junto ao sêllo impresso "Imperio do Brazil — 200 — Réis — Sello":] Leop.ª 12
  d[e] Fev.º d[e] 1884. Simplicio Joze Ferr.ª Armond [assinatura autógrafa].
abstract: >-
  A petition (12 February 1884, Leopoldina), written and signed by Simplício José
  Ferreira Armond in his own hand, asking the orphans' judge to complete the
  long-delayed partition of the estate of the late D. Mathilde Maria de Jezus, who
  had died about four years earlier (~1880). He petitions as her heir — in right
  of his wife Eliza Balbina de Toledo (per PRB-0001) — placing Mathilde Maria de
  Jezus on Eliza's (maternal) line.
abstract_pt: >-
  Uma petição (12 de fevereiro de 1884, Leopoldina), escrita e assinada de próprio
  punho por Simplício José Ferreira Armond, pedindo ao juiz de órfãos que conclua a
  há muito adiada partilha do espólio da finada D. Mathilde Maria de Jezus, que havia
  morrido cerca de quatro anos antes (~1880). Ele peticiona na condição de herdeiro
  dela — por direito de sua esposa Eliza Balbina de Toledo (conforme PRB-0001) —
  situando Mathilde Maria de Jezus na linha (materna) de Eliza.
reliability:
  assessment: >-
    Direct primary evidence, in Simplício's own hand, that he was an heir of the
    late D. Mathilde Maria de Jezus (d. ~1880) and that her estate (the PRB-0001
    heir list) was being partitioned at Leopoldina. Names the matriarch of Eliza's
    line; shows Simplício was literate and active at Leopoldina in 1884.
  informant: Simplício José Ferreira Armond (the petitioner).
  limitations: >-
    The petition establishes Simplício's heirship but not the exact relationship
    (Mathilde as Eliza's mother vs. grandmother), nor Simplício's own parentage.
    Read from a FamilySearch Full-Text preview image.
