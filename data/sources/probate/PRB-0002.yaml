transcription: >-
  Ill.mo Snr. Dr. Juiz de Orphãos. [...] Diz Simplicio José Ferreira Armond
  herdeiro da fina[da] D. Mathilde Maria de Jezus que, tendo ella fallecido
  a[cerca] de 4 annos, até hoje não se terem partilhado os bens por aquella
  finada deixados [...] vem perante V. Sa requerer [...] que se faça a partilha.
  O Supp.e [...] tem parentes colateraes em estado de indigencia [...]. Leopoldina
  12 de Fevereiro de 1884. Simplicio Joze Ferr.a Armond [assinatura autógrafa].
  [Despacho anterior:] Nos autos [...] Leopoldina 15 de Fevereiro de 1884. J.
  Felicio.
abstract: >-
  A petition (12 February 1884, Leopoldina), written and signed by Simplício José
  Ferreira Armond in his own hand, asking the orphans' judge to complete the
  long-delayed partition of the estate of the late D. Mathilde Maria de Jezus, who
  had died about four years earlier (~1880). He petitions as her heir — in right
  of his wife Eliza Balbina de Toledo (per PRB-0001) — placing Mathilde Maria de
  Jezus on Eliza's (maternal) line.
reliability:
  assessment: >-
    Direct primary evidence, in Simplício's own hand, that he was an heir of the
    late D. Mathilde Maria de Jezus (d. ~1880) and that her estate (the PRB-0001
    heir list) was being partitioned at Leopoldina. Names the matriarch of Eliza's
    line; shows Simplício was literate and active at Leopoldina in 1884.
  informant: Simplício José Ferreira Armond (the petitioner).
  limitations: >-
    The petition establishes Simplício's heirship but not the exact relationship
    (Mathilde as Eliza's mother vs. grandmother), nor Simplício's own parentage.
    Read from a FamilySearch Full-Text preview image.
