notes:
- text: >-
    IMPORTANT — TWO DISTINCT SIMPLÍCIOS: Item 6 in this inventory ("Simplicio José
    Ferrara [Ferreira] de Tolledo, Solteiro de quatorze annos") is JC's OWN SON with
    the TOLEDO surname, born ~1853, unmarried in 1867, who died before 1879 (absent
    from the 1879 Matilde inventário). He is a DIFFERENT person from our Simplício
    José Ferreira ARMOND (P-0016), who has the Armond surname and married Eliza
    Balbina de Toledo. A prior session (7 August 2026) misidentified the two and
    incorrectly concluded P-0016 was JC's son; corrected same day. Eliza (P-0017) is
    confirmed as JC's daughter via PRB-0006 Film 2 triage.
- text: >-
    This inventory does NOT list Eliza by name among the children visible on pp. 6-9;
    she may be the unknown item 5 on p7 (not catalogued) or may appear elsewhere.
    The 1879 Matilde inventário (PRB-0006) confirms her as representante #5 under heir
    #4 (JC × Claudina), consistent with birth after or around the date of this 1867
    inventory.
- text: >-
    PRB-0009 (Ladisláo inventário, 1867) independently confirms "Simplício de Toledo,
    solteiro, 14 anos" as item 6 among JC's representantes — the same JC's-son
    Simplício de Toledo, not our Simplício Armond.
- text: >-
    Claudina Brandina de Jesus: her full name is PRIMARY-CONFIRMED by the cover of
    this inventory ("Claudina Brandina de Jesus"); prior to this, the full name was
    inferred from her daughter's surname Bulandina/Brandina (PRB-0006). The cover
    is the first primary record to state the complete name.
