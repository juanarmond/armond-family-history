abstract: >-
  The 1867 Concórdia (Districto do Rio Pardo, MG) probate inventory of José Cesário
  de Toledo Lima (P-0054) and his wife Claudina Brandina de Jesus (P-0055), both
  deceased by the opening date of 4 March 1867. The título de herdeiros lists their
  children (herdeiros); the page catalogued as p8 shows item 6 as "Simplicio José
  Ferreira de Tolledo, Solteiro de quatorze annos" — direct primary evidence that
  Simplício José Ferreira Armond (P-0016) is a son of José Cesário de Toledo Lima
  and Claudina Brandina de Jesus, settling his parentage. Items 7–9 (Ladisláo,
  Geraldo and an unnamed female infant) are also listed. The cover (gen1) explicitly
  names both deceased spouses: "José Cesario de Tolledo Lima / Claudina Brandina de
  Jesus." The certification is dated 7 March 1867, signed by J. de Bastos Pacheco
  (Escrivão dos Órfãos), before the judge Dr. Mortimário de Sousa Lintz; Aureliano
  de Sales Toledo (a sibling of JC) served as Curador of the minor heirs.
abstract_pt: >-
  O inventário de 1867, em Concórdia (Districto do Rio Pardo, MG), de José Cesário
  de Toledo Lima (P-0054) e de sua esposa Claudina Brandina de Jesus (P-0055), ambos
  falecidos até a data de abertura, 4 de março de 1867. O título de herdeiros lista
  seus filhos (herdeiros); a página catalogada como p8 mostra o item 6 como
  "Simplicio José Ferreira de Tolledo, Solteiro de quatorze annos" — evidência
  primária direta de que Simplício José Ferreira Armond (P-0016) é filho de José
  Cesário de Toledo Lima e de Claudina Brandina de Jesus, resolvendo sua filiação. Os
  itens 7–9 (Ladisláo, Geraldo e uma menina de nome não indicado) também são
  arrolados. A capa (gen1) nomeia explicitamente ambos os cônjuges falecidos: "José
  Cesario de Tolledo Lima / Claudina Brandina de Jesus". A certidão é datada de 7 de
  março de 1867, assinada por J. de Bastos Pacheco (Escrivão dos Órfãos), perante o
  juiz Dr. Mortimário de Sousa Lintz; Aureliano de Sales Toledo (um irmão de JC)
  serviu como Curador dos herdeiros menores.
reliability:
  assessment: >-
    Direct primary evidence from a judicial estate inventory: names Simplício
    explicitly as a son of José Cesário de Toledo Lima, solteiro aged 14 in 1867.
    Independent of PRB-0006 (1879 Matilde inventário) which, through a different
    proceeding twelve years later, names the same children. Both records together
    constitute two independent primary confirmations of Simplício's parentage.
  informant: >-
    J. de Bastos Pacheco, Escrivão dos Órfãos, Concórdia, 1867; judicial process.
  limitations: >-
    All eight catalogued pages (cover/gen1, pp 2–5, 8, 9) are now transcribed.
    Pages 6, 7 and pages beyond p9 are NOT catalogued: p6 contains the continuation of
    Claudina's p5 declaration and the start of the herdeiros list (children items 1–5
    now readable from p6 transcription done 2026-08-07); p7 contains items 5 continuation
    through the unknown item 5 child. The p3 cover states "fallecido sem testamento"
    (JC died intestate); the p6 transcription fragment "de outubro do anno proximo passado
    [o] seu testamento" creates an apparent contradiction — possibly a misread or reference
    to a different clause; image comparison of the p5–p6 junction is needed to resolve it.
    Simplício's name in PRB-0008 p8 reads "Simplicio José Ferrara/Ferreira de Tolledo";
    PRB-0009 p4 reads "Simplicio Jaci Ferrura de Toledo" — middle name Jaci vs. José
    requires image comparison. The monte-mór, valuations and other procedural folios are
    not catalogued. Margin note on p2 "Marcheno/Marchano Christino de da Lima" is
    unidentified.
