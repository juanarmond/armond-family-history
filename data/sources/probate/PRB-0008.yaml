transcription: >-
  [Inventário de José Cesário de Toledo Lima e Claudina Brandina de Jesus, Concórdia,
  Districto do Rio Pardo, MG, 1867. Eight pages catalogued: cover (gen1), pp. 2–5,
  8, 9. Pages 6, 7 and pages beyond p9 not catalogued. Pages 2–4 catalogued but not
  yet transcribed (procedural content; lower genealogical priority).]


  [p5 — Termo de juramento e declaração de inventariante (7 March 1867):] "Aos sete
  dias do mez de Março do anno de mil oito centos sessenta e sete nesta Bairro do
  Concordia no Districto do Rio Pardo" — the judge "Doutor [Mor]timário de Sousa
  Lintz, Juiz Municipal" presides with the escrivão. Present: "Dona Claudina Brandini
  de Jesus" as inventariante (JC's widow, in person). She is sworn "aos Santos
  Evangelhos" and asked to declare the time and place of her husband's death, whether
  he left a will, how many heirs, their names and ages, and all goods — under penalty
  of perjury and double-value restitution. Her declaration: "E recebido por ella o
  juramento [A]claro que [seu marido] fallecera no dia dois de Setembro" [year cut
  off at page break; continues on p6, not catalogued].


  [gen1 — cover:] "INVENTÁRIO / José Cesario de Tolledo Lima / Claudina Brandina de
  Jesus" (date stamp: "04 / 03 / 1867"; archive stamp top-right: "[38403 268]"; shelf
  mark bottom-right: "A31")


  [p8 — children's list, continuation; items from a previous page are not visible
  here; numbering continues:] "a Tolledo casada com Manoel Marques Jorge" [end of item
  4, Maria Bulandina/Claudina de Toledo] — "Simplicio José Ferrara [Ferreira] de
  Tolledo / Solteiro de quatorze annos." [item 6, right margin "6"] — "Ladislao
  Egydio de Tolledo / Solteiro de doze annos" [item 7, right margin "7"] — "Geraldo,
  de dois annos de idade" [item 8, right margin "8"] — "Uma pha [filha] de seis meses
  de idade" [item 9, right margin "9"]


  [p8 — certification:] "Certidoes / Certifico que citei a successao a Tolledo para
  prestarem juramento de Curador dos menores seus sobrinhos Simplicio, Ladislao,
  Geraldo e Uma pha [filha] e dem phe [?] Concordia dia 7 de Março de 1867. Je de
  Bastos Paz [signature]."


  [p8 — oath heading:] "Juramento do Curador / Aos sete dias do mez de Marco do anno
  de mil oito centos e sessoenta e sete nesta su / dal da Concordia do Districto do
  Rio Ponde [Pardo] a onde se achava o Doutor Mortomaro [Mortimário] de Sousa [Lintz]
  Juiz Municipal e de Orfaos. Comigo Escrivao ao diante nomeado, e dundo a li
  presente [Marchiano] fidel..."


  [p9 — oath continuation:] "a Tolledo pelo dito Juiz the foi deposto juramento aos
  Santos Evangelhos em um livro delles e lhe Encarregou que procedesse com
  Consciencia, deles efectlmente, ecumprindo os deveres e obrigacões de Curador dos
  menores deste inventario, requeremos e preemovendo tudo quanto fosse a deos
  beneficios e louvandade sapprovando lavrador para a avaliacao dos bens. Recebido
  por elle o juramento a fim prometeo Cumprir. E para Constar lavrou este termo em
  que de a por asignado a pois [Joaquim de Bastos Pacheco] Escrivao dos Orfaos que
  assignou."


  [p9 — signatures:] "[Luiza/Lucio?] [Lima?]" [Curador signature] / "Aureliano de
  Sales Toledo"


  [p9 — second certification:] "Certifico que citei a turma aos herdeiros maiores e
  maiores e pelas Curador astes edes menores para de louvorin em avaliadores que
  avati em os bens deste inventario e den fi. Concordia 7 de Março 1867 / J. de
  Freitas Pacheco [or: de Bastos Pacheco]"
abstract: >-
  The 1867 Concórdia (Districto do Rio Pardo, MG) probate inventory of José Cesário
  de Toledo Lima (P-0054) and his wife Claudina Brandina de Jesus (P-0055), both
  deceased by the opening date of 4 March 1867. The título de herdeiros lists their
  children (herdeiros); the page catalogued as p8 shows item 6 as "Simplicio José
  Ferreira de Tolledo, Solteiro de quatorze annos" — direct primary evidence that
  Simplício José Ferreira Armond (P-0016) is a son of José Cesário de Toledo Lima
  and Claudina Brandina de Jesus, settling his parentage. Items 7–9 (Ladisláo,
  Geraldo and an unnamed female infant) are also listed. The cover (gen1) explicitly
  names both deceased spouses: "José Cesario de Tolledo Lima / Claudina Brandina de
  Jesus." The certification is dated 7 March 1867, signed by J. de Bastos Pacheco
  (Escrivão dos Órfãos), before the judge Dr. Mortimário de Sousa Lintz; Aureliano
  de Sales Toledo (a sibling of JC) served as Curador of the minor heirs.
reliability:
  assessment: >-
    Direct primary evidence from a judicial estate inventory: names Simplício
    explicitly as a son of José Cesário de Toledo Lima, solteiro aged 14 in 1867.
    Independent of PRB-0006 (1879 Matilde inventário) which, through a different
    proceeding twelve years later, names the same children. Both records together
    constitute two independent primary confirmations of Simplício's parentage.
  informant: >-
    J. de Bastos Pacheco, Escrivão dos Órfãos, Concórdia, 1867; judicial process.
  limitations: >-
    Pages 2–4 are catalogued but not transcribed (procedural text; lower genealogical
    priority). Pages 6, 7 and pages beyond p9 are not catalogued. Page 6 is the most
    important unread page: it contains the continuation of Claudina's p5 oath
    declaration including the year of JC's death (p5 breaks off after "dois de
    Setembro"; p6 would give the year, currently inferred as 1866 from context). Page 7
    contains item 5 of the children, whose content is unknown; the item-5 child visible
    in PRB-0006 (1879) at the same position is Josephina Christina (deceased by 1879
    with issue). Simplício's name in PRB-0008 p8 reads "Simplicio José Ferrara/Ferreira
    de Tolledo"; PRB-0009 p4 (the concurrent Ladisláo inventário) reads "Simplicio Jaci
    Ferrura de Toledo" — the middle name Jaci vs. José is a potential variant or cursive
    misread requiring image comparison. The monte-mór, valuations and other procedural
    folios are not catalogued.
