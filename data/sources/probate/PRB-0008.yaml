transcription: >-
  [Inventário de José Cesário de Toledo Lima e Claudina Brandina de Jesus, Concórdia,
  Districto do Rio Pardo, MG, 1867. Eight pages catalogued: cover (gen1), pp. 2–6,
  8, 9. All eight pages transcribed below. Pages 7 and pages beyond p9 are not
  catalogued. Pages 2–4 transcribed 2026-08-07. Page 6 transcribed 2026-08-07.]


  [p6 — Continuation of Claudina's declaration + Título de herdeiros (children list):]
  [Top — continuation of oath declaration from p5, beginning of statement about JC's testament:]
  "de outubro do anno proximo pas- / sado [o] seu testamento, deixando / nove filhos,
  dos quaes [os] nomes / idades e estados Declarará no / titulo [de] herdeiros, e que
  dará / a des[crever] todos os bens, direitos / e acções sem [occultar] nenhum /
  [illegible] das penas Comm[u]is / das. E para constar lavro este / termo [e assina]
  con[forme] / o Juiz [illegible] que foi lido por / mim [illegible] de [Strites?]
  [illegible] / [illegible] do [illegible] que [a]ssine / [ve?]."
  [Signature 1 — heavily stylized, possibly escrivão or Juiz; reads approximately:
  "Louça [uncertain] Lintz [uncertain]"]
  [Signature 2 — clear autograph:] "Claudina Brandina de Jesus"

  [p6 — Título de herdeiros — Cabeça de Casal: D. Claudina Brandina de Je[sus] — Filhos:]
  "1. Juci [uncertain: Juci / José] Augusto de [Toledo?] Lima / Sol[tei]ro de vinte e
  quatro annos"
  "2. D. Maria Ad[el]ina de [Toledo?] / Solteira de vinte dous annos"
  "3. Dona Mathildes Olympia de Pai- / xao Solteira de vinte annos"
  "4. D. Josefina Christino de Azevedo / casada com Aureliano Christino / da Silva Lima"
  "5. Dona Maria Claudina de [Toledo?]" [page ends; text continues on p7 — not catalogued]

  [Note: "de outubro do anno proximo passado" confirms JC made his testament in October
  1866 — consistent with death on 2 September 1866, as his testament predates the
  inventory by months. The text "Claudina...deixando nove filhos" confirms exactly nine
  children, consistent with PRB-0009. Children items 1–5 here correspond to items 1–5
  in PRB-0009 (José Augusto, Maria Dulcelina/Adelina, Mathildes Olympia, Josefina
  Cristina, Maria Claudina); items 6–9 (including Simplício) are on p7 and p8.]


  [p2 — Cover / Docket page:]
  [Archival stamp: "38 403 268"] [Docket: "M – 52 –"] [Year: "1864" — possibly a
  filing reference; context is 1867]
  "Juizo das Orfaos / da [Cidade?] [Municipal?] [Sena?]"
  [Case identification block:] "Defuncto / José Cesario de Tolledo Lima / Inventariante /
  D. Claudina Brandina / de Jesus  Sec. Pag°"
  [Right margin, possibly added later:] "[Marcheno / Marchano?] Christino de / da Lima"
  [Opening formula, beginning of Auto:] "Auto / Anno do Nascimento de Nos- / so Senhor
  Jesus Christo"
  [Lower two-thirds of page: large decorative pen flourish — no text]


  [p3 — Auto (court opening, 1 March 1867):]
  "Juizo das Orfaos   1867   fl. [1?] / da Cidade Leopoldina"
  [Case block:] "Defuncto / José Cesario de Toledo Lima, / fallecido sem testamento, de
  que fi- / cou viuva e é / Inventariante / Dona Claudina Brandina de Jesus /
  Dec° [Pacheco?]"
  "Auto / Anno do Nascimento de Nos- / so Senhor Jesus Christo de / mil oito Centos e
  sessenta e sete / [Quadragesimo?] [Quinto? / Sexto?] da [Inde-] / [pen]dencia e do
  Imperio, ao pri- / meiro dia do mês de Março do dito / anno nesta Cidade Leopoldina /
  em a Casa da residencia do / Doutor [Alberto?] Martins de Sousa / [Luntz?] Juiz
  Municipal e d'Or- / phãos [n]odita Cidade [e] [d]entes / no[,] aonde eu Escrivão ao
  diante nomeado vim [chamado?] / aí pelo dito Juiz [por orde-] / [novo?] que [de] ci
  [ta] [se] a / Claudina Brandina de Je[s]us / viuva por fallecimento de Jo- / [zé?]
  Cesario de Tolledo Lima que / deixou herdeiros menores, por / nov[o] sete do Corrente
  [foi?] [a?] / [in]ventario os bens que [ficou?] / citando também os mais proxi- / mos
  parente dos ditos menores / por na mesmo [a] aceços por- / to juramento de [Curador?]
  dos"


  [p4 — Continuation of Auto + Citation certificate:]
  "dos menores; a que prometia cumprir / [e?] [por?] Cuidado [tivera?] [em de?] auto /
  [tempo?] de a[pós?] que depois de / [ser?] [lido?] por mim Juiz [de Dis-?] / [tri?]to
  Pacheco Escrivão dos Or- / [phã?]os que a escreveu e assig[nou] / [Logo? / Lugo?]
  [Luntz?]" [signature flourish] "J. de Freitas Pag°"
  [Citation certificate:] "Certo peo [pelo?] que citei a Dona / Claudina Brandina de Jesus /
  para novos 7 do Corrente[,] por- / to jur[ou] de inventariante / ou [bens?] [a?] dita
  Casal e para / fazer as necessarias declara- / ções, e dar a [escripção? / descripção?]
  [Co-?] / [reques?] todos os bens sem / [a]scultar [ocultar] algum e de fé / Leopoldina
  4 de M[ar]ço de 1867 / J[.] [de Freitas?]" [signature abbreviated]
  "J. de Frutos [Porches? / Borches?]"

  [Note: p3 explicitly states "fallecido sem testamento" — JC died intestate. This is a
  procedural finding of the court. The apparent reference to a testament on p6 ("de outubro
  do anno proximo passado [o] seu testamento") may be a misread or reference to a different
  clause in Claudina's declaration; the apparent contradiction with p3's "sem testamento"
  requires image comparison of the p5–p6 junction text.]


  [p5 — Termo de juramento e declaração de inventariante (7 March 1867):] "Aos sete
  dias do mez de Março do anno de mil oito centos sessenta e sete nesta Bairro do
  Concordia no Districto do Rio Pardo" — the judge "Doutor [Mor]timário de Sousa
  Lintz, Juiz Municipal" presides with the escrivão. Present: "Dona Claudina Brandini
  de Jesus" as inventariante (JC's widow, in person). She is sworn "aos Santos
  Evangelhos" and asked to declare the time and place of her husband's death, whether
  he left a will, how many heirs, their names and ages, and all goods — under penalty
  of perjury and double-value restitution. Her declaration: "E recebido por ella o
  juramento [A]claro que [seu marido] fallecera no dia dois de Setembro" [year cut
  off at page break; continues on p6, not catalogued].


  [gen1 — cover:] "INVENTÁRIO / José Cesario de Tolledo Lima / Claudina Brandina de
  Jesus" (date stamp: "04 / 03 / 1867"; archive stamp top-right: "[38403 268]"; shelf
  mark bottom-right: "A31")


  [p8 — children's list, continuation; items from a previous page are not visible
