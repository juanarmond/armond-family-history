notes:
- text: >-
    This inventory directly contradicts the reading of PRB-0006 that placed Eliza
    (P-0017) as a child of JC: the 1867 JC inventário does NOT list Eliza among JC's
    children. Simplício (item 6, aged 14) is listed; the items before him (including
    the unknown item 5 on p7) are his siblings. Eliza's parentage is now a hypothesis
    requiring further evidence (see P-0017 notes and family F-0030).
- text: >-
    PRB-0009 (Ladisláo inventário, 1867) independently confirms Simplício as item 6
    among JC's representantes in a separate concurrent proceeding — two independent
    1867 primary records establish the same parentage.
- text: >-
    Claudina Brandina de Jesus: her full name is PRIMARY-CONFIRMED by the cover of
    this inventory ("Claudina Brandina de Jesus"); prior to this, the full name was
    inferred from her daughter's surname Bulandina/Brandina (PRB-0006). The cover
    is the first primary record to state the complete name.
