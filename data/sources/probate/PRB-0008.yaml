  --- HIGHER-RESOLUTION SCAN, avaliação/partilha-sequence folios (fl.4v–fl.10r),
  transcribed 2026-09-02; complements the opening auto/oath/título above. ---

  [fl.4v — closing signatures of the preceding termo + citation certificate + heading
  of the Juramento aos Louvados:] signatures of the widow and adult heirs/spouses —
  "Claudina Bulandina [Brandina de Jesus]", "Aureliano Christiano da S[ilv]a Lima",
  "Jozephina Christina de Azevedo Lima", "Manoel Marques [Jorge]", "Matildes Olimpia de
  Toledo", "a rogo de D. Maria Bulandina de Toledo", "Maria Dulcelina de Toledo", "O
  P[adr]e Joaquim Fidelis Marques", "Jozé Augusto de Toledo Lima". Then: "Certifico que
  citei os Louvados Cus[t]odio de [Vargas] Correia e Joaquim Jozé Barbosa para prestarem
  juramento e procederem na avaliação e do que dou fé. Concordia 7 de Março de 1867. J.
  de Freitas Pacheco." Heading "Juramento aos Louvados": "Aos sete dias do mes de Março
  do anno de mil oito centos e se[ss]enta e sete, nesta Fazenda da Concordia onde se
  achava o Doutor [Marti]niano de Sousa L[i]n[t]z Juis Municipal e [de Orphãos]…"
  [uncertain: the judge's name reads "Sousa Lintz" / "Mortimário de Sousa Lintz"].

  [fl.5r — end of the louvados' oath + start of the avaliação:] the appraisers Custodio de
  Vargas Correia and Joaquim Jozé Barbosa are sworn "de bem e fielmente desempenharem seus
  deveres, na avaliação dos bens deste inventario". Avaliação begins. "Ouro": "Um relogio
  de ouro com corrente, isto é com trancelim do dito, por duzentos e cincoenta mil reis"
  (250$000). "Prata": "Uma d[u]zia de garfos, facas e colheres de prata com outro trinchante,
  colher para tirar sopa, dita para tirar arroz, por cento e oitenta mil reis" (180$000).

  [fl.5v — avaliação continued (Cobre, arame e ferro; ferramentas; móveis):] bacia de arame
  10$000; tacha de cobre 20$000; [porro] de cobre [dez/dezaseis] mil reis [uncertain];
  tachinho pequeno 4$000; dito maior 10$000; almofariz de bronze com a mão 3$000; cinco
  panellas de ferro 10$000; uma dita de ferro 2$000; oito [foices/paios] usados 12$000; um
  apparelho de ferro 12$000; "um tronco para prisão, de ferro e al[g]emas por quatro mil
  reis" (4$000); quatro machados usados 2$000; dous [ferrolhos] 6$000; oito enxadas usadas
  7$000; quatro catres ordinarios 12$000; um dito de armação 4$000; uma meza 5$000; uma dita
  com gaveta 10$000; dous bancos 2$000; um armario já usado 4$000; um par de canastras 10$000.

  [fl.6r — avaliação continued (canoas + misc; then "Escravos"):] duas canoas 5$000; uma
  espingarda 10$000; um carro ferrado 85$000; um caixão grande 20$000; um lavador de café
  14$000. Heading "Escravos" — the ten enslaved people held in the estate, transcribed
  faithfully as written (origin: "de nação" = African-born; "crioulo/a" = Brazil-born):
  1. "Hum escravo de nome Lucas de nação de trinta e dous annos por hum conto e sete centos
  mil reis" — Lucas, de nação, 32 — 1:700$000.
  2. "Um dito de nome Pedro de nação de … trinta e tres annos por hum conto e cem mil reis"
  — Pedro, de nação, 33 (scribe corrected from 32) — 1:100$000.
  3. "Um dito de nome Miguel, Creoulo de quatorze annos, por oito centos mil reis" — Miguel,
  crioulo, 14 — 800$000.
  4. "Um dito de nome Thobias Creoulo de doze annos por hum conto e quatro centos mil reis"
  — Thobias, crioulo, 12 — 1:400$000.
  5. "Um dito de nome Benedicto Creoulo de nove annos por oito centos mil reis" — Benedicto,
  crioulo, 9 — 800$000.
  6. "Uma escrava de nome Faustina de nove annos, Creoula, por hum conto e cem mil reis" —
  Faustina, crioula, 9 — 1:100$000.
  7. "Uma escrava de nome Virgiliana de dés e sete annos, Creoula, por hum c[on]to e quatro
  centos mil reis" — Virgiliana, crioula, 17 — 1:400$000.
  8. "Uma escrava de nome Luiza de nação de trinta e [seis] annos por oito centos mil reis"
  — Luiza, de nação, 36 [uncertain: 36/32] — 800$000.

  [fl.6v — "Escravos" concluded + "Animaes muares e Cavallos" + "Benfeitorias":]
  9. "Uma escrava de nome Joana Crioula de quarenta annos por oito centos mil reis" — Joana,
  crioula, 40 — 800$000.
  10. "Um escravo de nome Eugenio Creoulo de quatorze annos por hum conto e quatro centos mil
  reis" — Eugenio, crioulo, 14 — 1:400$000.
  Animaes: cavallo Alazão velho 30$000; besta de sella "Pelintra" 120$000; besta de carga
  "Chi[mora]" 50$000; boi "Ballão" 40$000; boi "Mor[m]ello/Laranjo" 35$000; garrote 14$000;
  vaca "Nabuza" 25$000; vaca "Aruaça" 24$000. Benfeitorias: casa de morada térrea coberta de
  telhas 200$000; paiol 180$000; casa para café 60$000; casa de negócio na estrada 300$000;
  casa e acréscimo da casa do engenho 600$000; casa que serve de seca / chiqueiro de porcos
  15$000 [continues fl.7r].

  [fl.7r — close of the avaliação (café e terras) + juramento ao coherdeiro:] "[Nove] mil
  pés de Café no lugar denominado Timoteiro a duzentos réis cada pé por hum conto oito centos
  mil réis" (1:800$000); "Quinze mil pés de Café novo, a duzentos réis cada pé, por tres
  contos de réis" (3:000$000); "Oito mil pés de Café perto da casa de vivenda a cento e vinte
  réis cada pé por nove centos e [sessenta] mil réis" (960$000); "Terras: huma parte de terras
  compradas a [Mestra?] Joana [illegible] nesta [Fazenda] de Concordia … por setenta e cinco
  mil réis" (75$000). Then the "Juramento ao Coherdeiro Manoel Marques Jorge para conferir seu
  dote", "Concordia [dia] de Abril de 1867. José de Freitas Pacheco".

  [fl.7v — oath to the coheir + colação of an enslaved boy:] before "o Doutor [Marti]niano de
  Sacra Lint[z] Juiz Municipal e de Orphãos", the coheir Manoel Marques Jorge is sworn to
  "declarasse e cumprisse o seu dote". "E logo pelo dito Coherdeiro foi apresentado o escravo
  [Eugenio — fl.7v reads 'Virginio', a misread] Crioulo de quatorze annos que foi avaliado
  pelos Louvadores por hum conto e quatro centos mil reis (1:400$000) entrando agora para a
  Collação com a metade" (700$000) — i.e. the same Eugenio (crioulo, 14, 1:400$000) of the
  avaliação, collated at half value.

  [fl.8r — Termo de declaração da Inventariante (Claudina), the estate's debt:] "E logo pela
  Inventariante Claudina Brandina de Jesus foi dito ao Juiz que havia dado todos os bens do
  Cazal para serem avaliados… Que não dava agora as dividas activas e passivas por depender da
  liquidação… [somente] a descrever a divida que por hypotheca deve a [Casa/Francisco] Leocadio
  de Toledo já vencida de tres contos oito centos e oitenta e cinco mil reis (3:885$000) a
  premio de hum por cento ao mês [desde] doze de Setembro do anno de mil oito centos e cincoenta
  e nove [uncertain: 1859]." Signed by the Juiz and "Claudina B[r]a[n]dina de Jezus" (her own hand).

  [fl.8v — Termo de declaração dos Louvadores + selo:] the appraisers declare they appraised all
  the goods presented; signed by the Juiz, "Joa[qui]m José Barbosa de Miranda" and "Custodio de
  Vargas [Correia]". Selo/stamp-duty note 1$000, "O Escrivão P[achec]o", "14 de M[a]rço de 186[7]".

  [fl.9r — Termo de juntada:] "Aos quatorze dias do mez de Março de anno de mil oito centos e
  sessenta e sete, nesta Cidade de Leopoldina em meu Cartorio… junto a estes autos a Petição de
  Manoel Marques Jorge… Eu José de Freitas Pacheco Escrivão dos Orphãos que o escrevi."

  [fl.10r — Petição de desistência de herança (Manoel Marques Jorge):] "Ill[ustríssi]mo S[e]n[ho]r
  D[outo]r Juiz de Orphãos. Diz Manoel Marques Jorge, que sendo na qualidade de genro do finado
  José Cesario de Tolledo Lima, herdeiro em o inventario… que tendo recebido em dote na occazião
  em que se cazou com Maria Blandina de Tolledo, filha do mencionado José Cesario, hum escravo de
  nome Eugenio, crioulo de idade quatorze annos no vallor de hum conto e [quatro centos — fl.10r
  reads 'um/cem', but the avaliação fixes it at 1:400$000] mil réis, preço por que foi avalliado,
  como se vê do Titulo de dote… com o qual dote se satisfaz e por isso não quer figurar como
  herdeiro no mesmo inventario, e quer dezistir da herança que lhe compete de direito… E. R. Mercê.
  Manoel Marques Jorge." Dated 14 March 1867, Leopoldina.
abstract: >-
  The 1867 Concórdia (Districto do Rio Pardo, MG) probate inventory of José Cesário
  de Toledo Lima (P-0054) and his wife Claudina Brandina de Jesus (P-0055), both
  deceased by the opening date of 4 March 1867. The título de herdeiros lists their
  children (herdeiros); the page catalogued as p8 shows item 6 as "Simplicio José
  Ferreira de Tolledo, Solteiro de quatorze annos" — direct primary evidence that
  Simplício José Ferreira Armond (P-0016) is a son of José Cesário de Toledo Lima
  and Claudina Brandina de Jesus, settling his parentage. Items 7–9 (Ladisláo,
  Geraldo and an unnamed female infant) are also listed. The cover (gen1) explicitly
  names both deceased spouses: "José Cesario de Tolledo Lima / Claudina Brandina de
  Jesus." The certification is dated 7 March 1867, signed by J. de Bastos Pacheco
  (Escrivão dos Órfãos), before the judge Dr. Mortimário de Sousa Lintz; Aureliano
  de Sales Toledo (a sibling of JC) served as Curador of the minor heirs.
abstract_pt: >-
  O inventário de 1867, em Concórdia (Districto do Rio Pardo, MG), de José Cesário
  de Toledo Lima (P-0054) e de sua esposa Claudina Brandina de Jesus (P-0055), ambos
  falecidos até a data de abertura, 4 de março de 1867. O título de herdeiros lista
  seus filhos (herdeiros); a página catalogada como p8 mostra o item 6 como
  "Simplicio José Ferreira de Tolledo, Solteiro de quatorze annos" — evidência
  primária direta de que Simplício José Ferreira Armond (P-0016) é filho de José
  Cesário de Toledo Lima e de Claudina Brandina de Jesus, resolvendo sua filiação. Os
  itens 7–9 (Ladisláo, Geraldo e uma menina de nome não indicado) também são
  arrolados. A capa (gen1) nomeia explicitamente ambos os cônjuges falecidos: "José
  Cesario de Tolledo Lima / Claudina Brandina de Jesus". A certidão é datada de 7 de
  março de 1867, assinada por J. de Bastos Pacheco (Escrivão dos Órfãos), perante o
  juiz Dr. Mortimário de Sousa Lintz; Aureliano de Sales Toledo (um irmão de JC)
  serviu como Curador dos herdeiros menores.
reliability:
  assessment: >-
    Direct primary evidence from a judicial estate inventory: names Simplício
    explicitly as a son of José Cesário de Toledo Lima, solteiro aged 14 in 1867.
    Independent of PRB-0006 (1879 Matilde inventário) which, through a different
    proceeding twelve years later, names the same children. Both records together
    constitute two independent primary confirmations of Simplício's parentage.
  informant: >-
    J. de Bastos Pacheco, Escrivão dos Órfãos, Concórdia, 1867; judicial process.
  limitations: >-
    All eight catalogued pages (cover/gen1, pp 2–6, 8, 9) are now transcribed.
    Pages 7 and pages beyond p9 are NOT catalogued; p6 (catalogued and transcribed
    2026-08-07) contains the continuation of Claudina's p5 declaration and the start
    of the herdeiros list (children items 1–5); p7 contains items 5 continuation
    through the unknown item 5 child. The p3 cover states "fallecido sem testamento"
    (JC died intestate); the p6 transcription fragment "de outubro do anno proximo passado
    [o] seu testamento" creates an apparent contradiction — possibly a misread or reference
    to a different clause; image comparison of the p5–p6 junction is needed to resolve it.
    Simplício's name in PRB-0008 p8 reads "Simplicio José Ferrara/Ferreira de Tolledo";
    PRB-0009 p4 (re-read 2026-08-13) concordantly reads "Simplicio José Ferreira de
    Tolledo" — the earlier "Jaci" was a cursive misread of "José"; both now read José,
    surname de Toledo (no "Armond" in either record). The avaliação/valuation folios (fl.4v–fl.10r), including the itemised appraisal, the
    ten enslaved people, livestock and benfeitorias, the 3:885$000 hypothecary debt, and
    Manoel Marques Jorge's dowry-collation/desistência, are now catalogued from the
    higher-resolution scan and the complete-document PDF (added 2026-09-02). No monte-mór
    summation / partilha folio appears in the held scan (the estate was resolved amid many
    minor heirs; Eliza's own quota is documented in the 1879 Matilde estate, PRB-0006). Margin note on p2 "Marcheno/Marchano Christino de da Lima" is
    unidentified.
