notes:
- text: >-
    Readings that differ from the producer's draft transcription (retrieval profile of Manoel
    João Fernandes da Cruz, §8.1), each checked on the image: (1) p05 "e que finalmente era
    contente" — the draft has "firmemente [?]"; the letterforms are f-[i]-n-a-l-mente, with
    the tall l loop, and do not fit "firmemente". (2) p05 "que ficasse feixado" and p06 "será
    feixado" are spelled "feixado", and p05 line 2 reads "feichado" [uncertain]; the draft
    normalises all three to "fechado". (3) p05 "achei com effeito" is clear (draft "com [?]
    effeito"). (4) p06 writes "Do- / migos", without the n (draft "Do- / mingos"). (5) In the
    auto (p06) the witness's surname can be read Azevedo or Azeredo, because the fourth letter
    is ambiguous in this hand, and his signature abbreviates it "d'Az.do"; the draft gives
    Azevedo without comment. (6) p06 ends "que reconhece" and p07 begins "reconhecem" (the
    draft has "reconheço"). (7) The stamp impression on p04 shows a numeral beginning "2"
    and the word "REIS" (draft: value illegible). (8) The p08 note reads "Registrado no 6.º
    do 1.º Off.º"; the word "livro" that the draft supplies is not written. (9) "Itaverava"
    is read with fair confidence; there is no descender for an h or a y. (10) The fragments
    of mirror-image writing on p08 read "districto do Bom [uncertain] Jesus da [uncertain]
    Cachoeira [uncertain]", where the draft has "districto de São [ilegível]" (see the
    pages note). These draft readings were confirmed: "Pauzo", "Sauza", "tão bem casado"
    (the retrieval receipt's "tambem" is a normalisation), "Secundino de Azevedo," with no
    "Maia" after it (the next line begins "Maria Fernandes"), "Escrivão Pires" and "Cunha".
  text_pt: >-
    Leituras que diferem da transcrição-rascunho do produtor (perfil de Manoel João
    Fernandes da Cruz no lado da recuperação, §8.1), cada uma conferida na imagem: (1) p05
    "e que finalmente era contente" — o rascunho tem "firmemente [?]"; as letras são
    f-[i]-n-a-l-mente, com a alça alta do l, e não condizem com "firmemente". (2) p05 "que
    ficasse feixado" e p06 "será feixado" grafam "feixado", e a linha 2 da p05 lê "feichado"
    [incerto]; o rascunho normaliza as três para "fechado". (3) p05 "achei com effeito" está
    claro (rascunho "com [?] effeito"). (4) A p06 escreve "Do- / migos", sem o n (rascunho
    "Do- / mingos"). (5) No auto (p06) o sobrenome da testemunha pode ler-se Azevedo ou
    Azeredo, porque a quarta letra é ambígua nesta mão, e a sua assinatura o abrevia
    "d'Az.do"; o rascunho dá Azevedo sem comentário. (6) A p06 termina "que reconhece" e a
    p07 começa "reconhecem" (o rascunho tem "reconheço"). (7) A impressão de estampilha na
    p04 mostra um numeral que começa por "2" e a palavra "REIS" (rascunho: valor ilegível).
    (8) A nota da p08 lê "Registrado no 6.º do 1.º Off.º"; a palavra "livro" que o rascunho
    supre não está escrita. (9) "Itaverava" lê-se com razoável segurança; não há haste
    descendente de h ou de y. (10) Os fragmentos de escrita espelhada na p08 leem "districto
    do Bom [incerto] Jesus da [incerto] Cachoeira [incerto]", onde o rascunho tem "districto
    de São [ilegível]" (ver a nota sobre as páginas). Estas leituras do rascunho foram
    confirmadas: "Pauzo", "Sauza", "tão bem casado" (o "tambem" do recibo da recuperação é
    uma normalização), "Secundino de Azevedo," sem "Maia" depois (a linha seguinte começa
    "Maria Fernandes"), "Escrivão Pires" e "Cunha".
- text: >-
    The modern cover (p01) labels the testator "Manoel José Fernandes da Cruz". Every 1890 and
    1898 text in the record names him "Manoel João": the will ("Eu Manoel João Fernandes"),
    the autuação and the auto de approvação twice ("Man.el João Fernandes da Cruz"). The
    cover is a modern cataloguing slip and should not be recorded as a name variant. The
    will itself uses "Manoel João Fernandes"; "da Cruz" appears only in the tabellião's and
    the escrivão's texts. The bracketed number 43907322 on the cover and on fl. 1 is the
    archive's item number, given as the COARPE number in the retrieval side's receipt.
  text_pt: >-
    A capa moderna (p01) rotula o testador "Manoel José Fernandes da Cruz". Todos os textos de
    1890 e 1898 do registro o chamam "Manoel João": o testamento ("Eu Manoel João
    Fernandes"), a autuação e o auto de approvação duas vezes ("Man.el João Fernandes da
    Cruz"). A capa é um lapso de catalogação moderno e não deve ser registrada como variante
    de nome. O próprio testamento usa "Manoel João Fernandes"; "da Cruz" aparece só nos
    textos do tabelião e do escrivão. O número entre colchetes 43907322 na capa e na fl. 1 é
    o número de item do arquivo, dado como número COARPE no recibo do lado da recuperação.
- text: >-
    Identification. The testator is identified with P-0139 by his name (Manoel João
    Fernandes, "da Cruz" in the approval), his wife D. Anna Maria, and his children: nine
    born and five living in 1890, which matches the nine children baptised at Pousa in
    1855–1871 to Manoel João and Anna Maria, of whom four died young, and the five heirs of
    the 1898 inventário. The will states directly that his daughter Thereza was married to
    Secundino de Azevedo; that she is P-0039 and her husband P-0038 rests on the matching
    names of the couple and on the 1898 inventário's heir list ("D. Thereza de Jesus casada
    com Secundino de Azevedo"); it is strong, not proven by this record alone. The will
    names neither of the testator's parents, so it is not linked to P-0141, P-0142 or
    F-0071.
  text_pt: >-
    Identificação. O testador é identificado com P-0139 pelo nome (Manoel João Fernandes,
    "da Cruz" na aprovação), pela mulher D. Anna Maria e pelos filhos: nove nascidos e cinco
    vivos em 1890, o que condiz com os nove filhos de Manoel João e Anna Maria batizados na
    Pousa em 1855–1871, dos quais quatro morreram pequenos, e com os cinco herdeiros do
    inventário de 1898. O testamento afirma diretamente que a filha Thereza era casada com
    Secundino de Azevedo; que ela é P-0039 e o marido P-0038 apoia-se nos nomes coincidentes
    do casal e na lista de herdeiros do inventário de 1898 ("D. Thereza de Jesus casada com
    Secundino de Azevedo"); é forte, não provado por este registro sozinho. O testamento não
    nomeia nenhum dos pais do testador, por isso não é ligado a P-0141, P-0142 nem F-0071.
- text: >-
    Birthplace wording. The testator says he is "natural da freguesia de Santa Christina do
    Pauzo, em Braga, reino de Portugal". The parish is presumably Santa Cristina de Pousa,
    concelho de Barcelos, distrito de Braga [inferred from the patron saint and the name
    form; the will names no concelho]. His 1833 baptism places his birth at São Romão da
    Ucha, and two 1864 Pousa records call him natural of Ucha; Pousa is where his bride lived
    at their marriage, where their children were baptised, and the parish his mother was
    natural of. "Natural" here is therefore best read as his home parish before he emigrated
    [inferred]. The will is not evidence against the Ucha birth and should not be used to
    set his birthplace. Its stated foreign naturalidade ("reino de Portugal") does support a
    Portuguese nationality attribute cited to this source.
  text_pt: >-
    Redação do lugar de origem. O testador diz ser "natural da freguesia de Santa Christina
    do Pauzo, em Braga, reino de Portugal". A freguesia é presumivelmente Santa Cristina de
    Pousa, concelho de Barcelos, distrito de Braga [inferido do orago e da forma do nome; o
    testamento não nomeia o concelho]. O seu batismo de 1833 situa o nascimento em São Romão
    da Ucha, e dois registros da Pousa de 1864 o dizem natural da Ucha; a Pousa é onde a
    noiva residia ao casar, onde os filhos foram batizados, e a freguesia de que a mãe dele
    era natural. "Natural" deve aqui ler-se, portanto, como a sua freguesia de residência
    antes de emigrar [inferido]. O testamento não é evidência contra o nascimento na Ucha e
    não deve servir para fixar o seu lugar de nascimento. A naturalidade estrangeira
    declarada ("reino de Portugal") sustenta, sim, um atributo de nacionalidade portuguesa
    citado a esta fonte.
- text: >-
    What the record adds for modelling. (a) On 8 March 1890 he was alive and married in first
    nuptials to D. Anna Maria ("sou casado", present tense, so she was alive then
    [inferred]). (b) The five living children, with their spouses as written: Maria,
    "casada com André Teixeira Crespo"; Maria José, "casada com Francisco Joaquim da Silva";
    Thereza, "casada com Secundino de Azevedo"; Maria Fernandes, "casada com Balbino Alves de
    Souza" (written "Sauza"); and Joaquim, "tão bem casado", his wife not named. The four
    besides Thereza can be recorded as documented_children of F-0070 citing this source; the
    will gives only these forenames (Maria Fernandes apart), and their fuller names come
    from the 1898 inventário. (c) He could not write. (d) He was Catholic. (e) The terça goes
    to Joaquim, for "os serviços e extrema amizade" shown to his father and mother. (f) No
    testamenteiro is named. (g) No residence, occupation or age is stated.
  text_pt: >-
    O que o registro acrescenta à modelagem. (a) Em 8 de março de 1890 ele estava vivo e
    casado em primeiras núpcias com D. Anna Maria ("sou casado", no presente, logo ela
    estava viva então [inferido]). (b) Os cinco filhos vivos, com os cônjuges como escritos:
    Maria, "casada com André Teixeira Crespo"; Maria José, "casada com Francisco Joaquim da
    Silva"; Thereza, "casada com Secundino de Azevedo"; Maria Fernandes, "casada com Balbino
    Alves de Souza" (escrito "Sauza"); e Joaquim, "tão bem casado", sem nomear a mulher. Os
    quatro além de Thereza podem registrar-se como documented_children de F-0070 citando
    esta fonte; o testamento dá só estes prenomes (exceto Maria Fernandes), e os nomes mais
    completos vêm do inventário de 1898. (c) Ele não sabia escrever. (d) Era católico. (e) A
    terça vai para Joaquim, pelos "serviços e extrema amizade" prestados ao pai e à mãe.
    (f) Não se nomeia testamenteiro. (g) Não se declara residência, ocupação nem idade.
- text: >-
    Death and events. The will states no date of death. The autuação, the cumpra-se and the
    registration note are all dated 3 June 1898, which only implies that he had died by
    then. The date (30 May 1898) and place (districto do Bom Jesus) of his death come from
    the 1898 inventário, so the death event E-0143 is not linked here and the record links
    no event.
  text_pt: >-
    Morte e eventos. O testamento não declara data de morte. A autuação, o cumpra-se e a nota
    de registro têm todos a data de 3 de junho de 1898, o que só implica que ele já morrera
    então. A data (30 de maio de 1898) e o lugar (districto do Bom Jesus) da morte vêm do
    inventário de 1898; por isso o evento de morte E-0143 não é ligado aqui e o registro não
    liga nenhum evento.
- text: >-
    The 1898 certified copy of this will inside the inventário, as read in the producer's
    draft of that record (not checked here), differs from this original: "Santa Christina do
    Pesso[?]" for "do Pauzo"; "Secundino de Azevedo Maia[?]" for "Secundino de Azevedo,"
    (the original has no "Maia"; checked on p03 at full resolution); "Itaborahy" for
    "Itaverava"; "Arthur Cordeiro Monteiro da Silva" for the witness "Antonio Cardoso
    Monteiro e Silva", who is clearly so written in the text and in his own signature (p06,
    p07); "noventa e oito" for the approval's year (the original has 1890); "constituo" for
    "instituo". The original governs. The copy also records "uma estampilha de duzentos
    reis" after the will's signature, which fits the stamp impression on p04. That the
    copy's "Azevedo Maia" was carried over from the witness Domingos Affonso de Azevedo Maia,
    named in the same auto, is a possible explanation [inferred]; it is not evidence for
    Secundino's surname.
  text_pt: >-
    A certidão de 1898 deste testamento dentro do inventário, tal como lida no rascunho do
    produtor desse registro (não conferida aqui), difere deste original: "Santa Christina do
    Pesso[?]" por "do Pauzo"; "Secundino de Azevedo Maia[?]" por "Secundino de Azevedo," (o
    original não tem "Maia"; conferido na p03 em resolução plena); "Itaborahy" por
    "Itaverava"; "Arthur Cordeiro Monteiro da Silva" pela testemunha "Antonio Cardoso
    Monteiro e Silva", que está claramente assim escrita no texto e na sua própria
    assinatura (p06, p07); "noventa e oito" pelo ano da aprovação (o original tem 1890);
    "constituo" por "instituo". O original prevalece. A certidão também registra "uma
    estampilha de duzentos reis" depois da assinatura do testamento, o que condiz com a
    impressão de estampilha na p04. Que o "Azevedo Maia" da certidão tenha vindo da
    testemunha Domingos Affonso de Azevedo Maia, nomeada no mesmo auto, é uma explicação
    possível [inferido]; não é evidência do sobrenome de Secundino.
- text: >-
    Officials and witnesses, as written. The writer: Dr. Augusto Pinto Alves Pequeno. The
    tabellião (1890) and escrivão (1898): José [Theodoro, contracted; uncertain] Pires; the
    surname is certain ("meu appellido de Pires", the rubric on fl. 2, "Escrivão Pires"), and
    the same escrivão writes "José Theodoro Pires" in full in the 1898 inventário. The judge
    who signed the cumpra-se: "Cunha"; the inventário's Juiz de Direito, Dr. Edgardo Carlos
    da Cunha Pereira, signs the same way, so he is probably the same judge [inferred]. The
    five witnesses: Francisco Rodrigues Franco and Justino Bernardo da Fraga, "ambos
    negociantes", the first "natural de Caethé deste Estado", the second "da Cidade de
    Valença do Estado do Rio de Janeiro"; Tenente Coronel Romualdo Moreira de Albuquerque,
    "natural de Santo Antonio de Itaverava", "Escrivão de Orphãos" (the office follows his
    birthplace and is read as his by the pattern of the list); Antonio Cardoso Monteiro e
    Silva, "natural de Portugal, negociante nesta Cidade"; and Domingos Affonso de Azevedo
    [or Azeredo] Maia, who signs "Domingos Affonso d'Az.do Maya", "natural de Portugal
    tambem negociante nesta Cidade". None is modelled. Whether Domingos Affonso de Azevedo
    Maia was related to Secundino de Azevedo is unknown. The p08 note registers the will
    "no 6.º do 1.º Off.º", while the 1898 inventário styles Pires "Escrivão do 2.º Off.º";
    the discrepancy is noted, not resolved.
  text_pt: >-
    Oficiais e testemunhas, como escritos. O escritor: Dr. Augusto Pinto Alves Pequeno. O
    tabelião (1890) e escrivão (1898): José [Theodoro, abreviado; incerto] Pires; o sobrenome
    é certo ("meu appellido de Pires", a rubrica na fl. 2, "Escrivão Pires"), e o mesmo
    escrivão escreve "José Theodoro Pires" por extenso no inventário de 1898. O juiz que
    assinou o cumpra-se: "Cunha"; o Juiz de Direito do inventário, Dr. Edgardo Carlos da
    Cunha Pereira, assina do mesmo modo, logo é provavelmente o mesmo juiz [inferido]. As
    cinco testemunhas: Francisco Rodrigues Franco e Justino Bernardo da Fraga, "ambos
    negociantes", o primeiro "natural de Caethé deste Estado", o segundo "da Cidade de
    Valença do Estado do Rio de Janeiro"; o Tenente Coronel Romualdo Moreira de Albuquerque,
    "natural de Santo Antonio de Itaverava", "Escrivão de Orphãos" (o cargo segue a sua
    naturalidade e lê-se como dele pelo padrão da lista); Antonio Cardoso Monteiro e Silva,
    "natural de Portugal, negociante nesta Cidade"; e Domingos Affonso de Azevedo [ou
    Azeredo] Maia, que assina "Domingos Affonso d'Az.do Maya", "natural de Portugal tambem
    negociante nesta Cidade". Nenhum está modelado. Não se sabe se Domingos Affonso de
    Azevedo Maia era parente de Secundino de Azevedo. A nota da p08 registra o testamento
    "no 6.º do 1.º Off.º", enquanto o inventário de 1898 chama Pires "Escrivão do 2.º
    Off.º"; a discrepância fica anotada, não resolvida.
- text: >-
    Pages. p01 is a modern cover; p02 is fl. 1 (the autuação); p03–p07 are fl. 2–4 and run
    without a gap, each page continuing the sentence of the one before ("a meu / meu rogo",
    "ás minhas / minhas me foi dado", "escripto / escripto", "que reconhece / reconhecem").
    The will is "em lauda e meia de papel", which matches p03 and the top of p04. fl. 1v was
    not photographed, which shows that blank pages were skipped. Image 229, between p07 and
    p08, is access-restricted on FamilySearch and is not held. p08 is an unnumbered verso
    that carries only the registration note; its faint mirror-image writing is the
    show-through or offset of a page that is not held, probably the termo of presentation
    and opening of the closed will (June 1898), perhaps the page on image 229 [inferred].
    Read by mirroring the image, its fragments include "mil oito centos noventa e oito
    n'este districto do Bom [uncertain] Jesus da [uncertain] Cachoeira [uncertain] …", "…
    de São Paulo do Muriahé Estado de Minas Geraes em cartorio prezente o juiz de paz em
    exercicio …", "ahi prezente Francisco [illegible] da S[uncertain] …", "por elle foi
    aprezentado … para ser aberto", "… Manoel João Fernandes da Cruz …", "… escrivão para o
    remetter ao Doutor Juiz de Direito da Comarca", "E para constar lavro este termo" and a
    clerk "… Martins [uncertain: Chaves] … escrivão" (possibly Luciano Martins Chaves, the
    escrivão de paz at Bom Jesus in the 1898 inventário [inferred]). These fragments are a
    lead for image 229, not a reading of a held page; they show no death date.
  text_pt: >-
    Páginas. A p01 é uma capa moderna; a p02 é a fl. 1 (a autuação); as p03–p07 são as fl.
    2–4 e correm sem lacuna, cada página continuando a frase da anterior ("a meu / meu
    rogo", "ás minhas / minhas me foi dado", "escripto / escripto", "que reconhece /
    reconhecem"). O testamento está "em lauda e meia de papel", o que condiz com a p03 e o
    alto da p04. A fl. 1v não foi fotografada, o que mostra que as páginas em branco foram
    puladas. A imagem 229, entre a p07 e a p08, tem acesso restrito no FamilySearch e não
    está disponível. A p08 é um verso sem número que traz só a nota de registro; a sua
    escrita espelhada e tênue é transparência ou decalque de uma página não disponível,
    provavelmente o termo de apresentação e abertura do testamento cerrado (junho de 1898),
    talvez a página da imagem 229 [inferido]. Lidos espelhando a imagem, os fragmentos
    incluem "mil oito centos noventa e oito n'este districto do Bom [incerto] Jesus da
    [incerto] Cachoeira [incerto] …", "… de São Paulo do Muriahé Estado de Minas Geraes em
    cartorio prezente o juiz de paz em exercicio …", "ahi prezente Francisco [ilegível] da
    S[incerto] …", "por elle foi aprezentado … para ser aberto", "… Manoel João Fernandes da
    Cruz …", "… escrivão para o remetter ao Doutor Juiz de Direito da Comarca", "E para
    constar lavro este termo" e um escrivão "… Martins [incerto: Chaves] … escrivão"
    (possivelmente Luciano Martins Chaves, o escrivão de paz do Bom Jesus no inventário de
    1898 [inferido]). Estes fragmentos são uma pista para a imagem 229, não a leitura de uma
    página disponível; não mostram data de morte.
