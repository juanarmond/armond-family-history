id: PRB-0013
title: >-
  Closed will of Manoel João Fernandes da Cruz, written and approved at São Paulo do Muriahé
  on 8 March 1890 and ordered to be fulfilled on 3 June 1898 (Juízo de Direito do Muriahé):
  he declares himself natural of Santa Christina do Pauzo, Braga, married to D. Anna Maria,
  with five living children of nine, among them Thereza, wife of Secundino de Azevedo, and
  leaves his terça to his son Joaquim
title_pt: >-
  Testamento cerrado de Manoel João Fernandes da Cruz, escrito e aprovado em São Paulo do
  Muriahé em 8 de março de 1890 e mandado cumprir em 3 de junho de 1898 (Juízo de Direito do
  Muriahé): declara-se natural de Santa Christina do Pauzo, Braga, casado com D. Anna Maria,
  com cinco filhos vivos de nove, entre eles Thereza, mulher de Secundino de Azevedo, e deixa
  a sua terça ao filho Joaquim
record_type: >-
