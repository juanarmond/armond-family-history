abstract: >-
  The closed will of Manoel João Fernandes (P-0139), called Manoel João Fernandes da Cruz in
  the auto de approvação and the 1898 court acts, made at the Cidade de São Paulo do Muriahé
  on 8 March 1890. He had it written and signed at his request by Dr. Augusto Pinto Alves
  Pequeno, "por eu não saber escrever"; the same day the tabellião José [Theodoro] Pires
  approved it in his cartório before five witnesses, and it was closed, sewn and sealed with
  "tres pingos de lacre por banda". The testator declares himself Catholic, "natural da
  freguesia de Santa Christina do Pauzo, em Braga, reino de Portugal", "casado em primeiras
  nupcias com D. Anna Maria" (P-0140), with nine children "achando-se vivos presentemente
  apenas cinco": Maria, wife of André Teixeira Crespo; Maria José, wife of Francisco Joaquim
  da Silva; Thereza (P-0039), wife of Secundino de Azevedo (P-0038); Maria Fernandes, wife of
  Balbino Alves de Souza; and Joaquim, "tão bem casado". For the services and friendship
  Joaquim had shown him and his mother, he makes Joaquim heir of his terça. The will names
  no testamenteiro and does not name the testator's parents. On 3 June 1898 the escrivão
  Pires filed it in the Juízo de Direito do Muriahé, the judge (signing "Cunha") ordered
  "Cumpra-se, registre-se, archive-se", and it was registered the same day. Direct primary
  evidence of his marriage to Anna Maria, of his five surviving children and their marriages
  in 1890, and of Thereza's marriage to Secundino de Azevedo by 8 March 1890. The will
  states no death date or residence; his death on 30 May 1898 comes from the inventário.
abstract_pt: >-
  O testamento cerrado de Manoel João Fernandes (P-0139), chamado Manoel João Fernandes da
  Cruz no auto de approvação e nos atos judiciais de 1898, feito na Cidade de São Paulo do
  Muriahé em 8 de março de 1890. Mandou-o escrever e assinar a seu rogo pelo Dr. Augusto
  Pinto Alves Pequeno, "por eu não saber escrever"; no mesmo dia o tabelião José [Theodoro]
  Pires aprovou-o em seu cartório perante cinco testemunhas, e foi fechado, cosido e lacrado
  com "tres pingos de lacre por banda". O testador declara-se católico, "natural da
  freguesia de Santa Christina do Pauzo, em Braga, reino de Portugal", "casado em primeiras
  nupcias com D. Anna Maria" (P-0140), com nove filhos, "achando-se vivos presentemente
  apenas cinco": Maria, mulher de André Teixeira Crespo; Maria José, mulher de Francisco
  Joaquim da Silva; Thereza (P-0039), mulher de Secundino de Azevedo (P-0038); Maria
  Fernandes, mulher de Balbino Alves de Souza; e Joaquim, "tão bem casado". Pelos serviços e
  amizade que Joaquim prestara a ele e à mãe, institui Joaquim herdeiro da sua terça. O
  testamento não nomeia testamenteiro nem os pais do testador. Em 3 de junho de 1898 o
  escrivão Pires autuou-o no Juízo de Direito do Muriahé, o juiz (que assina "Cunha")
  mandou "Cumpra-se, registre-se, archive-se", e foi registrado no mesmo dia. Evidência
  primária direta do seu casamento com Anna Maria, dos cinco filhos vivos e dos seus
  casamentos em 1890, e do casamento de Thereza com Secundino de Azevedo antes de 8 de março
  de 1890. O testamento não declara data de morte nem residência; a morte em 30 de maio de
  1898 vem do inventário.
reliability:
  assessment: >-
    Original will and auto de approvação, written on the day (8 March 1890) by the writer the
    testator chose and by the tabellião, with the court's original acts of 3 June 1898: direct
    primary evidence of what the testator declared about his marriage, his living children,
    their marriages and his bequest, and of the approval and the 1898 order to fulfil and
    register the will. His statement of his naturalidade is his own later statement about
    his origin, not firsthand knowledge of his birth, and it names a different parish from
    his 1833 baptism (São Romão da Ucha); it is best read as his home parish before he
    emigrated [inferred].
  informant: >-
    Manoel João Fernandes himself, through his writer Dr. Augusto Pinto Alves Pequeno, who
    wrote and signed the will for him; the tabellião José [Theodoro] Pires for the auto de
    approvação, before five witnesses who signed; the escrivão Pires and the judge "Cunha"
    for the 1898 autuação, cumpra-se and registration.
  limitations: >-
    Image 229 of the film, between p07 and p08, is access-restricted on FamilySearch and not
    held; it most likely held the termo of presentation and opening of the closed will
    (June 1898), which would name the presenter and perhaps the date of death [inferred].
    fl. 1v, and probably fl. 4v, were not photographed (blank pages were skipped). The will
    states no residence, occupation or age for the testator and no death date; the 1898
    acts only imply that he had died by 3 June 1898. Peripheral readings are uncertain: the
    tabellião's contracted given name (Theodoro) and a possible "da"; the witness surname
    Azevedo / Azeredo; the vowel in "Pauzo" (Pouzo possible) and in "Sauza" (Souza); a few
    words of the approval formula; the marks on the cover and fl. 1. The modern cover calls
    the testator "Manoel José", a cataloguing slip.
