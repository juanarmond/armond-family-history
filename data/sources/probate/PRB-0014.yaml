transcription: |-
  [Juízo de Direito do Muriahé, 2º Ofício: the opening of the inventário of Manoel João Fernandes da Cruz, 22–26 November 1898, fl. 1–7. Fifteen page images: a modern wrapper (p01), fl. 1–7 (p02–p14) and a blank sheet (p15). Spelling, capitals and abbreviations as written; " / " marks a line break; ‹ › encloses handwriting filled into a printed form; ^ ^ encloses an interlinear insertion; expansions and editorial remarks are in square brackets. In the certidão of the will (p06–p10) the clerk repeats the last word of each page at the head of the next ("extrema", "compareceu", "aberto", "fé"); the repetitions are kept as written.]

  [p01 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p01.jpg; modern archival wrapper, no folio]

  [Modern hand, not of 1898. Top left:] 21/11/1898 [top right:] [43906283]
  [Centre:] INVENTÁRIO / Joaquim José Fernandes / Anna Maria Fernandes da Cruz
  [Bottom right:] A3/5 [uncertain]

  [p02 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p02.jpg; fl. 1 (no folio number visible) — the heirs' petition, with the distribution note and the judge's despacho at the head]

  [Left margin: torn stubs of another sheet caught in the binding, with a large pencil number "108" and fragments of another hand ("Ma…", "fo…", "…oito,", "lo d…"); not part of this record.]
  [Distribution note, top:] N.º 350 do Segundo Officio Mur.é / 26 de Novembro de 1898 // Pg 2000 [uncertain: 2$000] / Cunha [rubric]
  [Boxed pencil number:] 43906283
  [Address:] Ill.mo [a flourish] Juiz de Direito
  [The judge's despacho, in the head space; it continues on fl. 1v:] Como requerem. Nomeio a pessoa indicada, / que prestará juramento e assignará o respectivo
  [Petition:] Dizem D. Anna Maria Fernandes, Joaquim / José Fernandes, D. Maria José da Conceição e seu / marido Francisco Joaquim da Silva, D. Thereza de / Jesus e seu marido Secundino de Azevedo, D. Maria / Fernandes de Souza e seu marido Balbino Alves / de Souza, viuva, filhos [uncertain: filhas] e genros de Manoel João / Fernandes, que em 30 de Maio do corrente anno, / falleceo no districto do Bom Jesus, o dito Ma-/noel João Fernandes, deixando o testamento constante / da certidão junta, e como legitimos successores os / supp.es e uma filha D. Maria Jesus [sic: no "de" is written] da Conceição, / casada com André Teixeira Crespo, tambem mo-/radores n'aquelle districto, e como seja preciso pro-/ceder-se ao inventario e partilha dos bens do [a colon-like mark at the line end] / do casal e cumprir as disposições do testamento, / os supp.es requerem a V. S.ª se digne nomear in-/ventariante o herdeiro Joaquim José Fernandes, / que está na posse dos bens, deferir-lhe o respecti-/vo juramento, e, tomadas as declarações do estylo / para o bom andamento do processo, ordenar que se-/jão citados o herdeiro André Teixeira Crespo, como

  [Expansions: Mur.é = Muriahé; supp.es = supplicantes; V. S.ª = Vossa Senhoria.]

  [p03 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p03.jpg; fl. 1v — end of the despacho and of the petition]

  [Despacho, concluded:] termo, tomando-se as necessarias declarações. / Muriahé, 25 - 9br.º 1898 - / Cunha [underlined rubric]
  [Petition, concluded:] cabeça do seu casal, o Collector Estadual e o Dr. Pro-/motor de Justiça, para na 1.ª audiencia deste / juizo verem se louvar com os supp.es em / avaliadores que procedão a avaliação dos / bens que forem dados á descripção, ficando / de logo citados para os demais termos e / actos do processo do inventario e partilha / até final, sob pena de revelia. / P. deferimento, visto ser de L. [uncertain] / E. R. M.cê / Muriahé [day hidden under the stamp] Novembro de 1898 / P.r / Augusto [hidden under the stamp] Alv.s Pequeno
  [One revenue stamp, "Estado de Minas Geraes — Secretaria das Finanças — Sello — 300 Reis", over the dating line and the signature. A small hole at the right edge takes no text; the rest of the page is blank.]

  [Expansions: 9br.º = Novembro; P. = Pede; E. R. M.cê = E Receberá Mercê.]

  [p04 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p04.jpg; fl. 2 (pencil "2") — printed form: the first traslado of the procuração of 22 November 1898]

  [Printed arms: "Estados Unidos do Brazil — 15 de Novembro de 1889".] Fls. ‹70› / ‹1.º Traslado› / Procuração bastante que fazem ‹D. Anna M.ª Fern.des, J.m J.e Fern.des, D. M.ª J.e da Conceição e / marido Fran.co J.m da S.ª, D. Thereza de J.s e seu marido Secundino d'Az.º, / D. M.ª Fern.des de S.za e seu marido Balbino Alves de S.za ao Dr. / Augusto Pinto Alves Pequeno.›
  Saibam quantos este publico instrumento de procuração bastante virem, que no Anno do Nascimento de Nosso Senhor Jesus Christo, de mil oitocentos e ‹noventa e oito› aos ‹vinte e dous› dias do mez de ‹No-/vembro do dito anno em meu cartorio› perante mim Tabellião, comparece‹rão› como Outorgante‹s Dona Anna Maria Fernan-/des, Joaquim Jozé Fernandes, Dona Maria Jozé da Conceição e seu ma-/rido Francisco Joaquim da Silva, Dona Thereza de Jesus e seu marido / Secundino d'Azevedo, Dona Maria Fernandes de Souza e seu / marido Balbino Alves de Souza, viuva filho [uncertain: filhos] e genros de / Manoel João Fernandes ^da Cruz^ todos moradores neste / destricto pessoas› reconhecido‹s› pelo‹s› proprio‹s de mim escrivão de paz e› das suas testemunhas abaixo assignadas, do que dou fé; perante as quaes por elle‹s› [uncertain] foi dito que, por este Publico Instrumento nomea … e constitue … seu bastante Procurador ‹ao Doutor Augusto Pinto Alves P-/queno para requerer e proceder o inventario / e partilha dos bens do dito finado Manoel João / Fernandes ^da Cruz^, com poderes especiaes para jura-/mento, louvação, confissão e substabelecimento, / e ratificão mais os impressos que se segue.›
  [Fourteen ruled lines below are filled with cancelling strokes (inutilização); no text.]

  [Expansions: M.ª = Maria; Fern.des = Fernandes; J.m = Joaquim; J.e = José; Fran.co = Francisco; S.ª = Silva; J.s = Jesus; Az.º = Azevedo; S.za = Souza.]

  [p05 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p05.jpg; fl. 2v — the printed powers, the closing of the procuração and the escrivão de paz's certificate of the copy]

  concede todos os seus poderes, em direito, permittidos, para que em nome delle‹s› Outorgante‹s›, como se presente fosse‹m›, possa em Juizo ou fóra delle, requerer, allegar. defender todo o seu direito e justiça, em quaesquer causas, ou demandas, civeis ou crimes, movidas ou por mover, em que elle‹s› Outorgante‹s› for‹em› Autor‹es› ou Réo‹s›, em um e outro fôro; fazendo citar, offerecer acções, libellos, excepções, embargos, suspeições e outros quaesquer artigos, contrariar, produzir, e inquirir, reperguntar testemunhas, dar de suspeito a quem lh'o fôr; jurar decisoria e suppletoriamente n'alma delle‹s› Outorgante‹s›; fazer dar taes juramentos a quem convier; assistir aos termos de Inventario e Partilhas, com as citações para elles; assignar autos, requerimentos, protestos, contra-protestos, e termos, ainda os de confissão, negação, louvação, desistencia; appellar, aggravar ou embargar qualquer sentença ou despacho, e seguir estes recursos até maior alçada; fazer extrahir sentenças, requerer a execução d'ellas, sequestros: assistir aos actos de concilliação para os quaes lhe concede poderes illimitados: pedir Precatorias; tomar posse, vir com embargos de terceiro senhor e possuidor; juntar documentos e tornal-os a receber; variar de acções e tentar outras de novo: podendo substalecer esta em um ou mais procuradores, e os substabelecidos em outros, ficando-lhes os mesmos poderes em seu vigor e revogal-os, querendo: seguindo suas cartas de ordens e avisos particulares, que sendo preciso, serão considerados como parte desta. E que tudo quanto assim for feito pelo dito seu procurador ou Substabelecido, promette haver, por valioso e firme, reservando para sua pessoa toda a nova citação. Assim o disse do que dou fé, e me pedi‹rão› este Instrumento, que lhe li aceit‹arão› e assign‹ão› com as testemunhas abaixo reconhecidas de mim. ‹Escrivão›
  ‹Assignando arrogo de Dona Anna Maria Fernan-/des por dizer que não sabe escrever Henrique / Christino da Silva assignando os demais her-/deiros por si e suas mulheres por não saberem / escrever e as testemunhas Francisco Luis / da Costa e Emilio Oscar d'Assis este lavra-/dor e aquelle negociante moradores nesta / Povoação. Eu Luciano Martins Chaves / escrivão, que escrevi e assigno. Luciano / Martins Chaves, Henrique Christino da Sil-/va, Joaquim Jozé Fernandes, Francisco Joa-/quim da Silva, Secundino d'Azevedo e Balbi-/no [uncertain: the second b resembles a t] Alves de Souza. Era o que continha na di-/ta procuração, que copiei, conferi e li, o referido / é verdade, do que dou fé. / Bom Jesus do Caxoeira Alegre, 22 de No-/vembro de 1898. Eu Luciano / Martins Chaves escrivão, que escre-/vi e assigno em publico e razo.›
  [sinal público: a flourished line reading approximately "Em test.º … da verd.e" — uncertain]
  Luciano Martins Chaves
  [Right, below, the same hand:] Vai á collectoria pa-/gar o sello por falta / de estampilha. / Chaves
  [Lower left, written across one revenue stamp, "Estado de Minas Geraes — Secretaria das Finanças — Sello — 300 Reis":] S. P[hidden under the stamp] M.é / em [day hidden under the stamp] 9br.º / Pe[hidden under the stamp] Collector / [rubric] [the collector's note is partly illegible]

  [p06 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p06.jpg; fl. 3 (top right "3." / "1" / rubric "Pires") — certidão of the will by the escrivão of the 2º Ofício]

  José Theodoro Pires, Escrivão / do 2.º Off.º da Comarca do Muriahé & / Certifico que revendo os autos de / testamentaria, do fallecido Manoel / João Fernandes da Cruz, e delles a fo-/lhas duas a folha quatro deparei com / o testamento, cujo theor é o seguinte: / Em nome de Deus. Amen. Eu / Manoel João Fernandes, em meu / perfeito juizo, e temendo á morte / cujo dia é incerto; determinei fa-/zer este meu testamento, para / dispôr da terça dos meus bens, / como adeante declaro. Sou Catho-/lico, apostolico Romano em / cuja fé protesto viver e morrer; / natural da Freguezia de Santa / Christina do Pesso [uncertain] em Braga, / reino de Portugal, e sou casado / em primeiras nupcias com Dona / Anna Maria, de cujo consorcio / tivemos nove filhos, achando-/se vivos presentemente apenas / cinco a saber, Maria, casada / com André Teixeira Crespo, Maria / José, casada com Francisco Joa-/quim da Silva, Thereza casada / com Secundino de Azevedo Maia / Maria Fernandes, casada com Bal-/bino Alves de Souza e Joaquim / tambem casado. Em conside-/rações dos serviços e extrema

  [p07 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p07.jpg; fl. 3v]

  extrema amizade que o dito meu / filho Joaquim me tem dispensa-/do e a sua mãe minha espo-/sa, o constituo herdeiro da / minha terça. Faço este testa-/mento muito de minha / livre vontade, e sem constran-/gimento ou induzimento de / pessoa alguma, mandei o Dou-/tor Augusto Pinto Alves Pequeno / escrever, por eu não saber / [uncertain: ler or bem] escrever e que feito o as-/signasse a meu rogo; peço / as justiças do Paiz o cumprão / e mandem cumprir como / nelle se contem. São Paulo de / Muriahé oito de Março de mil / oito centos e noventa. Augusto / Pinto Alves Pequeno assigna [uncertain: assigno] arogo / do testador por não saber elle / escrever o [uncertain] testamento e o assig-/nasse Augusto Pinto Alves Pequeno / Estava uma estampilha de duzen-/tos reis, inutilizada na forma / da lei. Auto de Approvação. Sai-/bam quantos este publico instru-/mento de Auto de Approvação virem / que no Anno do Nascimento de Nos-/so Senhor Jesus Christo de mil oi-/to centos e noventa aos oito dias / do mez de Março do dito Anno nes-/ta Cidade de São Paulo do Muriahé / em meu cartorio compareceu
  [A hole at the right edge takes no text.]

  [p08 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p08.jpg; fl. 4 (top right "4" / "2" / rubric "Pires")]

  compareceu Manoel João Fernandes / da Cruz, que reconheço pelo pro-/prio e que se acha em seu perfeito / juizo e entendimento segundo o / meu parecer e das testemunhas que / presentes estavão, e positivamente / forão convocadas, perante as quaes / por elle testador de suas mãos / ás minhas me foi dado este / papel feixado, dizendo-me que / era o seu testamento que o / Doutor Augusto Pinto Alves Pequeno / lh'o fizera a seu rogo e o as-/signasse por não saber elle / o escrever, e que queria eu / lh'o approvasse; o qual papel / eu aceitei e achei em effei-/to ser o testamento do sobre-/dito testador Manoel João Fer-/nandes da Cruz [a flourish] escripto / em lauda e meia de papel, / o qual vi e não li, e não / achando em todo elle borrão, / riscado ou entrelinha, nem / cousa que duvida faça, lhe / fiz as perguntas da lei em / presença das testemunhas abai-/xo assignadas, a que respon-/deu que este era o seu testa-/mento e ultima vontade, / e que finalmente era contente / que ficasse feixado, cosido e / lacrado, que não fosse aberto

  [p09 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p09.jpg; fl. 4v]

  aberto se não depois do seu / fallecimento; e por não ter cousa / que duvida fizesse rubriquei a / lauda em que o mesmo se acha-/va escripto com o meu appellido / de Pires e lh'o approvei, e houve / por approvado na forma da / lei e do meu regimento com / todas as solemnidades de direito, / e sera feixado cosido e lacrado / com tres pingos de lacre por / banda, e para constar fiz este / auto de approvação que assig-/nou arrogo do testador por / por não saber ler nem escrever / o Doutor Augusto Pinto Alves Pequeno / do que dou fé; sendo testemu-/nhas presentes Francisco Rodrigues / Franco, Justino Bernardo da Fraga / ambos negociantes, aquelle natu-/ral de Caethé deste Estado e este / da Cidade de Valença do Estado do / Rio de Janeiro, Tenente Coronel / Romualdo Moreira de Albuquerque / natural de São Antonio de Itaverava [uncertain] / Escrivão de Orphãos. [uncertain: Antonio, possibly Arthur] Cardoso [uncertain: or Cordeiro] / Monteiro da Silva, natural de / Portugal, negociante nesta Ci-/dade e Domingos Affonso de / Azevedo Maia natural de Por-/tugal negociante nesta Cidade / que reconhecem ser o dito testa-/dor o proprio do que tudo dou fé

  [p10 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p10.jpg; fl. 5 (top right "5" / "3" / rubric "Pires")]

  fé; e assignarão depois de lhes ser li-/do por mim Tabellião este auto / de approvação. Eu José Theodoro Pires / Tabellião que o escrevi e assigno em / publico e raso. Em testemunho / de verdade (estava o signal publico) / Muriahé oito de Março de mil / oito centos e noventa e oito. / José Theodoro Pires. Augusto / Pinto Alves Pequeno. Domingos Affon-/so de Azevedo Maia. [uncertain: Antonio, possibly Arthur] Cardoso / Monteiro da Silva. Justino Berna-/do da Fraga. Romualdo Moreira de / Albuquerque. Francisco Rodrigues / Franco. Era o que se continha / em o dito testamento que / por certidão me foi pedi-/do, e ao seu original nos pro-/prios autos em meu poder / e guarda me reporto, dou / fé. Eu José Theodoro Pires, / Escrivão que a subscrevi, da-/to e assigno. São Paulo do Mu-/riahé [day and month hidden under the stamps; "…bro" visible] de 1898 / O Escrivão José [hidden under the stamps] Pires [signature with flourish]
  [Three revenue stamps, "Estado de Minas Geraes — Secretaria das Finanças — Sello — 300 Reis", over the dating line and the signature.]
  [Costs, right margin:] B 2000 / C 2000 / R 3750 / S. 900 / [underlined total:] 8650 [prefix uncertain] / [rubric: R. Pires, uncertain]
  [The lower part of the page is blank.]

  [p11 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p11.jpg; fl. 5v — certidão of intimação of the inventariante]

  Certidão / Certifico que intimei o inventariante / Joaquim José Fernandes para hoje pres-/tar juramento do que ficou scien-/te. Dou fé. Muriahé 25 de Novembro / de 1898. O Escrivão José Theodoro Pires [rubric]
  [The rest of the page is blank: ink show-through, the shadows of the stamps on the recto, an ink blot and a hole at the right edge.]

  [p12 — evidence/probate/PRB-0014-inventario-manoel-joao-fernandes-da-cruz-1898-muriae-p12.jpg; fl. 6 ("6") — termo de juramento, 25 November 1898]

  Termo de Juramento. / Aos vinte cinco de Novembro de mil oito-/centos e noventa e oito, nesta Cidade de / São Paulo do Muriahé, em casa / da residencia do Juiz de Direito Doutor / Edgardo Carlos da Cunha Pereira, com-/migo escrivão de seu cargo, ahi / presente Joaquim José Fernandes, / o Juiz deferiu-lhe juramento dos / Santos Evangelhos, mediante o qual / lhe encarregou de servir de in-/ventariante dos bens de seu finado / pai Manoel Jo[uncertain: the forename is abbreviated and reads like "Jos."] Fernandes da / Cruz e de testamenteiro do mesmo / com a obrigação de fazer todas / as declarações e promover todos / os actos e termos, o respectivo / inventario, e bem cumprir o tes-/tamento, e recebido por elle / o juramento assim o prometteu / declarando que seu pai falle-/ceu em trinta de Maio do corren-/te anno, com testamento, / deixando os filhos que adeante / vão descriptos, e prometteu

