notes:
- text: >-
    Scope. The fifteen images hold only the opening of the inventário: a modern wrapper (p01), fl.
    1–7 (p02–p14) and a blank sheet (p15). Every page break runs on mid-sentence, so nothing is
    missing between fl. 1 and fl. 7. The file stops with the certidão of intimação of 25 November
    1898 (fl. 7), before any description of goods, valuation, partilha or sentence. The petition
    says only that Joaquim José Fernandes "está na posse dos bens". This record does not show
    whether the process went further. The retrieval side reports that the following images on the
    film belong to other processes; that report was not checked here.
  text_pt: >-
    Alcance. As quinze imagens contêm apenas a abertura do inventário: uma capa moderna (p01), as
    fl. 1–7 (p02–p14) e uma folha em branco (p15). Cada mudança de página continua no meio da
    frase, de modo que nada falta entre a fl. 1 e a fl. 7. O processo para na certidão de intimação
    de 25 de novembro de 1898 (fl. 7), antes de qualquer descrição de bens, avaliação, partilha ou
    sentença. A petição diz apenas que Joaquim José Fernandes "está na posse dos bens". Este
    registro não mostra se o processo prosseguiu. O lado da recuperação informa que as imagens
    seguintes do filme pertencem a outros processos; essa informação não foi verificada aqui.
- text: >-
    The death. The petition states: "que em 30 de Maio do corrente anno, falleceo no districto do
    Bom Jesus, o dito Manoel João Fernandes, deixando o testamento constante da certidão junta". In
    the termo de juramento of 25 November 1898, Joaquim José Fernandes declared under oath "que seu
    pai falleceu em trinta de Maio do corrente anno, com testamento". "Corrente anno" is 1898 in
    both. The place of death is written only as "districto do Bom Jesus". The petition adds that the
    heir André Teixeira Crespo and his wife are "tambem moradores n'aquelle districto", and the
    título de herdeiros places all the heirs "no Districto do Bom Jesus da Cachoeira Alegre", so the
    district is Bom Jesus da Cachoeira Alegre [inferred from the same record; strong].
  text_pt: >-
    O óbito. A petição declara: "que em 30 de Maio do corrente anno, falleceo no districto do Bom
    Jesus, o dito Manoel João Fernandes, deixando o testamento constante da certidão junta". No termo
    de juramento de 25 de novembro de 1898, Joaquim José Fernandes declarou sob juramento "que seu
    pai falleceu em trinta de Maio do corrente anno, com testamento". "Corrente anno" é 1898 nos
    dois casos. O lugar do óbito está escrito apenas como "districto do Bom Jesus". A petição
    acrescenta que o herdeiro André Teixeira Crespo e sua mulher são "tambem moradores n'aquelle
    districto", e o título de herdeiros situa todos os herdeiros "no Districto do Bom Jesus da
    Cachoeira Alegre"; o distrito é, portanto, Bom Jesus da Cachoeira Alegre [inferido do mesmo
    registro; forte].
- text: >-
    Identification. The deceased is "Manoel João Fernandes" in the petition and the will, and
    "Manoel João Fernandes da Cruz" in the procuração (where "da Cruz" is an interlinear
    insertion), the certidão, the approval of the will and the termo. His identification with
    P-0139 rests on the name, the wife Anna Maria, the five named children and spouses, and the
    will's statement that he was "natural da Freguezia de Santa Christina do Pesso [uncertain] em
    Braga"; the same will survives in the original (PRB-0013). "D. Anna Maria Fernandes", the
    widow, is P-0140. "D. Thereza de Jesus casada com Secundino de Azevedo" is identified with
    P-0039 and P-0038 on the matching names of wife and husband, her father's name and the
    residence in the district of Bom Jesus da Cachoeira Alegre. The identification is strong; it
    is not proven by this record alone.
  text_pt: >-
    Identificação. O falecido é "Manoel João Fernandes" na petição e no testamento, e "Manoel João
    Fernandes da Cruz" na procuração (onde "da Cruz" é uma inserção entrelinhada), na certidão, na
    aprovação do testamento e no termo. A identificação com P-0139 assenta no nome, na mulher Anna
    Maria, nos cinco filhos e cônjuges nomeados e na declaração do testamento de que era "natural da
    Freguezia de Santa Christina do Pesso [incerto] em Braga"; o mesmo testamento sobrevive no
    original (PRB-0013). "D. Anna Maria Fernandes", a viúva, é P-0140. "D. Thereza de Jesus casada
    com Secundino de Azevedo" é identificada com P-0039 e P-0038 pela correspondência dos nomes da
    mulher e do marido, pelo nome do pai e pela residência no distrito de Bom Jesus da Cachoeira
    Alegre. A identificação é forte; não está provada só por este registro.
- text: >-
    The heirs, as named in the título de herdeiros (fl. 6v–7). "Viuva: D. Anna Maria Fernandes".
    "Filhos": 1 "Joaquim José Fernandes, casado (inventariante)"; 2 "D. Maria José da Conceição,
    casada com Francisco Joaquim da Silva"; 3 "D. Thereza de Jesus casada com Secundino de
    Azevedo"; 4 "D. Maria Fernandes de Souza, casa[da] com Balbino Alves de Souza"; 5 "D. Maria de
    Jesus da Conceição casada com André Teixeira Crespo". All are "moradores no Districto do Bom
    Jesus da Cachoeira Alegre". The petition writes the fifth daughter "D. Maria Jesus da
    Conceição", with no "de". The list is not in birth order, and no ages are given. Joaquim is
    "casado", but his wife is not named. For modelling, the four siblings of Thereza are collateral
    children of F-0070, with their spouses as named here.
  text_pt: >-
    Os herdeiros, tal como nomeados no título de herdeiros (fl. 6v–7). "Viuva: D. Anna Maria
    Fernandes". "Filhos": 1 "Joaquim José Fernandes, casado (inventariante)"; 2 "D. Maria José da
    Conceição, casada com Francisco Joaquim da Silva"; 3 "D. Thereza de Jesus casada com Secundino
    de Azevedo"; 4 "D. Maria Fernandes de Souza, casa[da] com Balbino Alves de Souza"; 5 "D. Maria
    de Jesus da Conceição casada com André Teixeira Crespo". Todos são "moradores no Districto do
    Bom Jesus da Cachoeira Alegre". A petição escreve a quinta filha "D. Maria Jesus da Conceição",
    sem "de". A lista não segue a ordem de nascimento, e nenhuma idade é dada. Joaquim é "casado",
    mas a mulher não é nomeada. Para a modelagem, os quatro irmãos de Thereza são filhos colaterais
    de F-0070, com os cônjuges aqui nomeados.
- text: >-
    What else the record adds. The widow, D. Anna Maria Fernandes, was alive on 22 November 1898 and
    could not write: Henrique Christino da Silva signed the procuração for her "por dizer que não
    sabe escrever". The daughters who granted the procuração (Maria José, Thereza and Maria
    Fernandes) could not write either: their husbands signed "por si e suas mulheres por não
    saberem escrever". The signatures of Francisco Joaquim da Silva, "Secundino d'Azevedo" and
    Balbino Alves de Souza survive only in the escrivão de paz's copy, so they show that the men
    signed the original, not their hands. Joaquim José Fernandes signed the termo and the título
    himself (fl. 6v and 7). Maria de Jesus and André Teixeira Crespo did not grant the procuração;
    the petition asks that André be cited "como cabeça do seu casal". The procuração was made on 22
    November 1898 at Bom Jesus do Caxoeira Alegre, where the grantors are "todos moradores neste
    destricto". No occupation or property of the family is stated.
  text_pt: >-
    O que mais o registro acrescenta. A viúva, D. Anna Maria Fernandes, estava viva em 22 de novembro
    de 1898 e não sabia escrever: Henrique Christino da Silva assinou a procuração por ela "por dizer
    que não sabe escrever". As filhas que outorgaram a procuração (Maria José, Thereza e Maria
    Fernandes) também não sabiam escrever: os maridos assinaram "por si e suas mulheres por não
    saberem escrever". As assinaturas de Francisco Joaquim da Silva, "Secundino d'Azevedo" e Balbino
    Alves de Souza sobrevivem apenas na cópia do escrivão de paz; mostram que os homens assinaram o
    original, não a sua letra. Joaquim José Fernandes assinou ele próprio o termo e o título (fl. 6v
    e 7). Maria de Jesus e André Teixeira Crespo não outorgaram a procuração; a petição pede que
    André seja citado "como cabeça do seu casal". A procuração foi feita em 22 de novembro de 1898 em
    Bom Jesus do Caxoeira Alegre, onde os outorgantes são "todos moradores neste destricto". Nenhuma
    ocupação nem bem da família é declarado.
- text: >-
    The copy of the will (fl. 3–5) against the original (PRB-0013). The clerk's 1898 copy differs
    from the original in three material places, which are recorded here as copy variants: (1) the
    testator's parish is "Santa Christina do Pesso [uncertain]", where the original reads "do
    Pauzo"; (2) Thereza's husband is "Secundino de Azevedo Maia" ("Maia" is clearly four letters,
    with "Maria Fernandes" beginning the next line), where the original reads only "Secundino de
    Azevedo"; (3) the closing date of the approval is "oito de Março de mil oito centos e noventa e
    oito", where the original is dated 8 March 1890, and the copy itself twice writes "noventa"
    earlier. "Maia" is most probably contamination from the approval witness whom the copy names
    "Domingos Affonso de Azevedo Maia" (in the original, "Domingos Affonso de Azevedo [or
    Azeredo] Maia"), written further down the same copy. It is not evidence of Secundino's surname.
    Smaller copy variants: "o constituo herdeiro" (original "instituo"); "por eu não saber [ler or
    bem] escrever"; "escrever o testamento" in place of the original's longer clause; "e sera
    feixado". Two witness readings also differ. The witness the copy names "[Antonio, possibly
    Arthur] Cardoso Monteiro da Silva" is "Antonio Cardoso Monteiro e Silva" in the original, in
    the text and in his own signature. Romualdo Moreira de Albuquerque is "natural de São Antonio
    de Itaverava [uncertain]" in the copy and "natural de Santo Antonio de Itaverava" in the
    original. The original will states no death date, so the death date of 30 May 1898 rests on
    this inventário. The original governs throughout.
  text_pt: >-
    A cópia do testamento (fl. 3–5) comparada com o original (PRB-0013). A cópia de 1898 do escrivão
    difere do original em três pontos materiais, aqui registrados como variantes da cópia: (1) a
    freguesia do testador é "Santa Christina do Pesso [incerto]", onde o original lê "do Pauzo"; (2)
    o marido de Thereza é "Secundino de Azevedo Maia" ("Maia" tem claramente quatro letras, e "Maria
    Fernandes" começa a linha seguinte), onde o original lê apenas "Secundino de Azevedo"; (3) a data
    final da aprovação é "oito de Março de mil oito centos e noventa e oito", quando o original é
    datado de 8 de março de 1890, e a própria cópia escreve "noventa" duas vezes antes. "Maia" é
    muito provavelmente contaminação do nome da testemunha da aprovação que a cópia chama "Domingos
    Affonso de Azevedo Maia" (no original, "Domingos Affonso de Azevedo [ou Azeredo] Maia"), escrito
    mais abaixo na mesma cópia. Não é evidência do sobrenome de Secundino. Variantes menores da
    cópia: "o constituo herdeiro" (original "instituo"); "por eu não saber [ler ou bem] escrever";
    "escrever o testamento" em lugar da cláusula mais longa do original; "e sera feixado". Duas
    leituras de testemunhas também diferem. A testemunha que a cópia nomeia "[Antonio, talvez
    Arthur] Cardoso Monteiro da Silva" é "Antonio Cardoso Monteiro e Silva" no original, no texto e
    na sua própria assinatura. Romualdo Moreira de Albuquerque é "natural de São Antonio de
    Itaverava [incerto]" na cópia e "natural de Santo Antonio de Itaverava" no original. O
    testamento original não declara data de óbito; a data de 30 de maio de 1898 assenta, portanto,
    neste inventário. O original prevalece em tudo.
- text: >-
    Officials and other people named, none of them modelled. The Juiz de Direito is Dr. Edgardo
    Carlos da Cunha Pereira, who signs "Cunha". José Theodoro Pires is escrivão of the 2º Ofício of
    the comarca of Muriahé and, in 1890, the tabellião who approved the will. Luciano Martins Chaves
    is the escrivão de paz at Bom Jesus do Caxoeira Alegre. Dr. Augusto Pinto Alves Pequeno is the
    heirs' procurador; he also wrote the will and signed it for the testator. Henrique Christino da
    Silva signed for the widow. The witnesses to the procuração are Francisco Luis da Costa,
    negociante, and Emilio Oscar d'Assis, lavrador, both "moradores nesta Povoação". The will's
    approval witnesses, as copied, are Francisco Rodrigues Franco and Justino Bernardo da Fraga,
    negociantes, natural of Caethé (Minas Gerais) and of Valença (Rio de Janeiro); Tenente Coronel
    Romualdo Moreira de Albuquerque, natural of São Antonio de Itaverava [uncertain], Escrivão de
    Orphãos; [Antonio, possibly Arthur] Cardoso Monteiro da Silva and Domingos Affonso de Azevedo
    Maia, both natural of Portugal and negociantes in Muriahé. The Collector Estadual and the
    Promotor de Justiça were cited.
  text_pt: >-
    Funcionários e outras pessoas nomeadas, nenhuma modelada. O Juiz de Direito é o Dr. Edgardo
    Carlos da Cunha Pereira, que assina "Cunha". José Theodoro Pires é escrivão do 2º Ofício da
    comarca do Muriahé e, em 1890, o tabelião que aprovou o testamento. Luciano Martins Chaves é o
    escrivão de paz de Bom Jesus do Caxoeira Alegre. O Dr. Augusto Pinto Alves Pequeno é o procurador
    dos herdeiros; também escreveu o testamento e o assinou pelo testador. Henrique Christino da
    Silva assinou pela viúva. As testemunhas da procuração são Francisco Luis da Costa, negociante, e
    Emilio Oscar d'Assis, lavrador, ambos "moradores nesta Povoação". As testemunhas da aprovação do
    testamento, tal como copiadas, são Francisco Rodrigues Franco e Justino Bernardo da Fraga,
    negociantes, naturais de Caethé (Minas Gerais) e de Valença (Rio de Janeiro); o Tenente Coronel
    Romualdo Moreira de Albuquerque, natural de São Antonio de Itaverava [incerto], Escrivão de
    Orphãos; [Antonio, talvez Arthur] Cardoso Monteiro da Silva e Domingos Affonso de Azevedo Maia,
    ambos naturais de Portugal e negociantes no Muriahé. O Coletor Estadual e o Promotor de Justiça
    foram citados.
- text: >-
    Dates within the file. The procuração is dated Bom Jesus do Caxoeira Alegre, 22 November 1898.
    The petition is dated at Muriahé in November 1898, with the day hidden under a stamp. The
    despacho is dated 25 November 1898, as are the certidão of intimação of the inventariante, the
    termo de juramento and the certidão of intimação of the Promotor and the Collector. The
    distribution note reads "N.º 350 do Segundo Officio … 26 de Novembro de 1898", which is a day
    after the despacho, as written. The certidão of the will is dated São Paulo do Muriahé, 1898,
    with the day and month under the stamps. The modern pencil date on the wrapper, 21/11/1898, is
    earlier than any date in the text.
  text_pt: >-
    Datas no processo. A procuração é datada de Bom Jesus do Caxoeira Alegre, 22 de novembro de 1898.
    A petição é datada do Muriahé em novembro de 1898, com o dia oculto sob um selo. O despacho é de
    25 de novembro de 1898, assim como a certidão de intimação do inventariante, o termo de
    juramento e a certidão de intimação do Promotor e do Coletor. A nota de distribuição lê "N.º 350
    do Segundo Officio … 26 de Novembro de 1898", um dia depois do despacho, tal como escrito. A
    certidão do testamento é datada de São Paulo do Muriahé, 1898, com o dia e o mês sob os selos. A
    data moderna a lápis na capa, 21/11/1898, é anterior a qualquer data do texto.
- text: >-
    Readings that differ from the retrieval side's draft transcription. Fl. 1: the address reads
    "Ill.mo [flourish] Juiz de Direito" (the draft has "Ill.mo Snr. Dr."); "deferir-lhe o
    respectivo juramento" (draft "deferindo-lhe"); "viuva, filhos e genros", where the final vowel
    of "filhos" could be an a; "D. Maria Jesus da Conceição", with no "de" written (draft
    "[de]"). Fl. 2: Joaquim is abbreviated "J.m" (draft "Joaq.m"). Fl. 2v: "Assim o disse" has no
    handwritten ending (draft "disse‹rão›"); in "Balbi-/no" the second b resembles a t. Fl. 3v:
    "escrever, por eu não saber [ler or bem] escrever" (draft "escrevel-o … ler"); "assigna
    [uncertain: assigno]" (draft "assigno"). Fl. 4: "a que respondeu" (draft "ao que"). Fl. 4v: "e
    sera feixado" (draft "e sendo"); "São Antonio de Itaverava [uncertain]" (draft "Itaborahy"; the
    word ends in "-verava", as in the original will); "Escrivão de Orphãos" is clear; "que
    reconhecem" (draft "reconheço"). Fl. 4v and 5: the witness's surname reads "Cardoso" on fl. 5 and
    is ambiguous on fl. 4v, and his forename reads best as "Anton…" (draft "Arthur Cordeiro" in both
    places). Fl. 5: "(estava o signal publico)" is in parentheses; "Escrivão que a subscrevi". Fl.
    6v: item 4 reads "casa com", not "casada com". The draft's readings of the death date, the
    widow, the five heirs, their spouses and their residence are confirmed.
  text_pt: >-
    Leituras que diferem da transcrição-rascunho do lado da recuperação. Fl. 1: o vocativo lê "Ill.mo
    [floreio] Juiz de Direito" (o rascunho tem "Ill.mo Snr. Dr."); "deferir-lhe o respectivo
    juramento" (rascunho "deferindo-lhe"); "viuva, filhos e genros", em que a vogal final de "filhos"
    pode ser um a; "D. Maria Jesus da Conceição", sem "de" escrito (rascunho "[de]"). Fl. 2: Joaquim
    vem abreviado "J.m" (rascunho "Joaq.m"). Fl. 2v: "Assim o disse" não tem terminação manuscrita
    (rascunho "disse‹rão›"); em "Balbi-/no" o segundo b parece um t. Fl. 3v: "escrever, por eu não
    saber [ler ou bem] escrever" (rascunho "escrevel-o … ler"); "assigna [incerto: assigno]"
    (rascunho "assigno"). Fl. 4: "a que respondeu" (rascunho "ao que"). Fl. 4v: "e sera feixado"
    (rascunho "e sendo"); "São Antonio de Itaverava [incerto]" (rascunho "Itaborahy"; a palavra
    termina em "-verava", como no testamento original); "Escrivão de Orphãos" está claro; "que
    reconhecem" (rascunho "reconheço"). Fl. 4v e 5: o sobrenome da testemunha lê-se "Cardoso" na fl.
    5 e é ambíguo na fl. 4v, e o prenome lê-se melhor como "Anton…" (rascunho "Arthur Cordeiro" nos
    dois lugares). Fl. 5: "(estava o signal publico)" está entre parênteses; "Escrivão que a
    subscrevi". Fl. 6v: o item 4 lê "casa com", não "casada com". As leituras do rascunho para a data
    do óbito, a viúva, os cinco herdeiros, os seus cônjuges e a sua residência estão confirmadas.
