abstract: >-
  The opening of the inventário of Manoel João Fernandes [da Cruz] (P-0139) in the Juízo de
  Direito do Muriahé, 2º Ofício, 22–26 November 1898. The heirs' petition, signed by their
  procurador Dr. Augusto Pinto Alves Pequeno and distributed on 26 November as "N.º 350 do Segundo
  Officio", states that he died on 30 May 1898 "no districto do Bom Jesus", leaving a will, and
  names his widow D. Anna Maria Fernandes (P-0140) and his legitimate successors: Joaquim José
  Fernandes; D. Maria José da Conceição, wife of Francisco Joaquim da Silva; D. Thereza de Jesus,
  wife of Secundino de Azevedo (P-0039 and P-0038); D. Maria Fernandes de Souza, wife of Balbino
  Alves de Souza; and D. Maria Jesus da Conceição, wife of André Teixeira Crespo. On 25 November the
  Juiz de Direito, Dr. Edgardo Carlos da Cunha Pereira, granted the petition and named Joaquim
  inventariante. Filed with it are: a traslado of the procuração made on 22 November 1898 before
  the escrivão de paz of Bom Jesus do Caxoeira Alegre, in which the widow signs by proxy and the
  sons-in-law sign "por si e suas mulheres por não saberem escrever"; a certified copy of the will
  of 8 March 1890 made by the escrivão José Theodoro Pires; the termo de juramento of 25 November,
  in which Joaquim, sworn as inventariante and testamenteiro, declared that his father "falleceu em
  trinta de Maio do corrente anno, com testamento"; and the título de herdeiros, which lists the
  widow and the five children, all "moradores no Districto do Bom Jesus da Cachoeira Alegre". The
  file stops at fl. 7, before any description of goods, valuation or partilha.
abstract_pt: >-
  A abertura do inventário de Manoel João Fernandes [da Cruz] (P-0139) no Juízo de Direito do
  Muriahé, 2º Ofício, 22–26 de novembro de 1898. A petição dos herdeiros, assinada pelo procurador
  Dr. Augusto Pinto Alves Pequeno e distribuída em 26 de novembro como "N.º 350 do Segundo
  Officio", declara que ele faleceu em 30 de maio de 1898 "no districto do Bom Jesus", deixando
  testamento, e nomeia a viúva D. Anna Maria Fernandes (P-0140) e os sucessores legítimos: Joaquim
  José Fernandes; D. Maria José da Conceição, mulher de Francisco Joaquim da Silva; D. Thereza de
  Jesus, mulher de Secundino de Azevedo (P-0039 e P-0038); D. Maria Fernandes de Souza, mulher de
  Balbino Alves de Souza; e D. Maria Jesus da Conceição, mulher de André Teixeira Crespo. Em 25 de
  novembro o Juiz de Direito, Dr. Edgardo Carlos da Cunha Pereira, deferiu a petição e nomeou
  Joaquim inventariante. Estão juntos: um traslado da procuração feita em 22 de novembro de 1898
  perante o escrivão de paz de Bom Jesus do Caxoeira Alegre, na qual a viúva assina a rogo e os
  genros assinam "por si e suas mulheres por não saberem escrever"; uma certidão do testamento de 8
  de março de 1890, passada pelo escrivão José Theodoro Pires; o termo de juramento de 25 de
  novembro, no qual Joaquim, juramentado como inventariante e testamenteiro, declarou que seu pai
  "falleceu em trinta de Maio do corrente anno, com testamento"; e o título de herdeiros, que
  arrola a viúva e os cinco filhos, todos "moradores no Districto do Bom Jesus da Cachoeira
  Alegre". O processo para na fl. 7, antes de qualquer descrição de bens, avaliação ou partilha.
reliability:
  assessment: >-
    Original court proceedings written in the course of the case by the officials concerned. They
    are direct evidence of the heirs, of their marriages and residence, and of the widow being
    alive in November 1898. The death date is stated twice by the family: in the heirs' petition
    and, under oath, by the son Joaquim José Fernandes in the termo de juramento. The two
    statements agree, and they were made about six months after the death; for the death this is
    secondary information from close kin, not an eyewitness record. The will inside the file is a
    derivative: a clerk's certified copy of 1898. Where it differs from the original will (PRB-0013)
    the original governs.
  informant: >-
    The heirs, through their procurador Dr. Augusto Pinto Alves Pequeno (petition); Joaquim José
    Fernandes, under oath (termo de juramento: the death date, "com testamento", and the children
    listed); the escrivão José Theodoro Pires (certidão of the will, título de herdeiros, certidões
    of intimação); the escrivão de paz Luciano Martins Chaves (traslado of the procuração); and the
    judge, Dr. Edgardo Carlos da Cunha Pereira (despacho).
  limitations: >-
    Only the opening of the process is held (fl. 1–7): the petition, the procuração, the copy of
    the will, the oath, the título de herdeiros and two certidões of intimação. There is no
    description of goods, no valuation, no partilha and no sentence, and this record does not show
    whether the process went further. No ages, occupations or birthplaces are given for the heirs,
    and Joaquim's wife is not named. The place of death is given only as "districto do Bom Jesus";
    the fuller "Bom Jesus da Cachoeira Alegre" comes from the residence clause of the same record.
    The procuração is a copy (traslado) by the escrivão de paz, so the signatures in it are copied,
    not autographs; only Joaquim José Fernandes's signatures on fl. 6v and 7 are autograph. The will
    is a clerk's copy and differs from the original in places. Revenue stamps hide the day of two
    dating lines (fl. 1v and fl. 5) and the month of one (fl. 5). Peripheral readings are
    uncertain: the parish name "Pesso" in the will copy, one approval witness's forename and
    surname, the place "Itaverava", one abbreviated forename in the termo, and the collector's note
    on fl. 2v.
