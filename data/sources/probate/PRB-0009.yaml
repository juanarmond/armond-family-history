notes:
- text: >-
    Confirms the complete list of Ladisláo × Mathilde children (8 total) including
    the previously unmodelled Francisco Leocádio (item 4) and Cezário José de Toledo
    (item 6) — both now newly identified. Aureliano de Sales Toledo (item 5) appears
    here as Curador of JC's minor children; he also signed in the concurrent JC
    inventário (PRB-0008-p9).
- text: >-
    Francisco Leocádio de Toledo (item 4): "vivo casado que foi com Maria [Joa?]quina
    de Jesus, falleceu antes da morte da inventariado" — the "vivo" is ambiguous
    (alive at JC's death? or "viúvo" = widower?). What is certain: he predeceased
    Ladisláo and had been married to Maria Joaquina de Jesus. No children of Francisco
    Leocádio are named in pp 1–5; the curatorship of orphan minors on p4 (held by
    "Simplicio Jaci Ferreira de Toledo") suggests Francisco Leocádio left minor
    children, but their names do not appear
    in these pages. Eliza Balbina de Toledo (P-0017) is NOT mentioned in pp 3–5.
- text: >-
    The item 5 on PRB-0008-p8 (JC inventário children, missing from the p8 scan) was
    previously unknown; PRB-0009-p2 reveals item 5 in JC's representante list is
    "Dona Maria Claudina [or Bulandina] de Tolledo, casada com Manoel Marques Jorge"
    — the same person called "Maria Bulandina de Toledo" in PRB-0006 (1879). The name
    variation "Claudina/Bulandina" is preserved; she remains a documented_child on
    F-0026, not a structured entity.
- text: >-
    New leads from pp 3–5 (read 7 August 2026): (a) "Marciano Cesário José de Toledo"
    in the herdeiros citation list (p3) — an unrecognised adult heir with "Cesário"
    in the name; possibly JC's adult son not currently in the repository. (b)
    "Umbilina de Toledo" in the p5 proxy signatures — a distinct person from Eliza
    Balbina de Toledo; one of Ladisláo's heirs signed for by Narciso. (c) Mathilde
    Maria de Jesus (P-0027) signed the p5 Termo de Louvaçao in person — alive in
    March 1867 (consistent with her ~1880 death inferred from PRB-0001/0002). (d)
    Francisco Leocádio (P-0061) appears in the p3 herdeiros citation list — the
    19th-century scribal convention lists the original heir's name even when the share
    passes to that person's own heirs; his appearance does not contradict his having
    predeceased Ladisláo.
- text: >-
    TWO DISTINCT SIMPLÍCIOS in this document set (clarified 2026-08-07): (1) item 6
    in JC's representante list (PRB-0009 p2) = "Simplicio José Perrura [Ferreira] de
    TOLLEDO, Solteiro de quatorze annos" — JC's OWN SON with the Toledo surname, born
    ~1853, died before 1879 (absent from PRB-0006). (2) p4 curator = "Simplicio Jaci
    Ferrura [Ferreira] de TOLEDO" — a person with the Toledo surname who served as
    curator; their identity is uncertain (possibly a different Toledo relative, NOT
    confirmed to be P-0016). P-0016 (Simplício José Ferreira ARMOND) has the Armond
    surname and is Eliza's husband; he is different from both persons named above.
    P-0016 should remain in linked_people only to flag that he appears by implication
    (as Eliza's husband via PRB-0006) but the p4 curator link to P-0016 is unconfirmed.
