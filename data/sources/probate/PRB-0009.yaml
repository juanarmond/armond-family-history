transcription: >-
  [Inventário de Ladisláo Egídio Ferreira de Toledo, Concórdia, Districto do Rio
  Pardo, MG, 1867. Five pages catalogued: gen1 (título de herdeiros/cover), pp. 2–5.]


  [gen1 — título de herdeiros:] "Dona Mathildes Olympia da Paixão [inventariante or
  label — uncertain read] / [?] Titulo de Herdeiros / [P] Cabeça do Casal / D.
  Mathildes [?] Maria de Jesus. / Filhos" [children of Ladisláo × Mathilde follow:]
  "1 — Dona Maria Perpétua da Silva, casada com Antonio Zeferino de
  Tolledo" / "2 — Ignez Mettelina de Tolledo, casada com José Pedro da Silva" /
  "3 — D. Carolina Leopoldina Marques, casada com Narcísio Marques Braz." / "4 —
  Francisco Liocadio [Leocádio] de Tolledo, vi[vo/úvo] casado que foi com Maria
  Joaquina de Jesus, falleceu antes da morte da inventariado" [predeceased
  Ladisláo] / "5 — Aureliano de Sales Tolledo, casado com Marciana Espro[n?]de de
  Tolledo" / "6 — Cesario José de Tolledo, casado com Maria José de
  Jesus" / "7 — Antonio Ladislao de Tolledo, casado com Maria Eufrania de Jesus. Este
  é surdo e mudo." / "8 — Jose Cesario de Tolledo Lima, fallecido por quem
  representam seus filhos:" [JC's representantes listed below, continuing on p2]
  "1 — José Augusto de Tolledo Lima, Solteiro de Vinte quatro annos" / "2 — D. Maria
  Adulcelina de [Tolledo], Solteira de Vinte dois annos [casada?]..."


  [p2 — continuation of JC's representantes:] "3 — D. Mathildes Olympia da Paixão,
  Solteira de vinte annos" / "4 — D. Josefina Cristina de [Acevedo?/Azevedo?],
  casada com Aureliano Ce[lestino?/listino?] [?] Christino da [?]" / "5 — Dona Maria
  Claudina [or: Bulandina] de Tolledo, casada com Manoel Marques Jorge" / "6 —
  Simplicio José Perrura [Ferreira] de Tolledo, Solteiro de quatorze annos" / "7 —
  Ladislao Egidio de Tolledo, Solteiro de doze annos." / "8 — Geraldo, idade de dois
  annos" / "9 — Josefa, idade de seis meses"


  [p2 — declaration on Claudina:] "Declaro que a mae destes Dona Claudina Brandina
  de Jesus é viúva, cuja [morte do] marido falleceu depois do Inventariado." [Correct
  reading: JC (Claudina's husband) died after Ladisláo — statement about JC's death
  order, NOT a statement that Claudina was deceased. Claudina was alive 7 March 1867
  (PRB-0008 p5 confirms her physical presence taking the inventariante oath that day).]


  [p2 — certification:] "Certidoes / Certifico que citei a Sucessão de Sales Tolledo
  para adereun es Curador aos menores preten de aservido juramento eden fe. Concordia
  6 de Março de 1867 / Ja de Bastos Pacheco [signature]."


  [p2 — oath:] "Juramento do Curador / E logo pelo Doutor Morti[mário] de Sousa
  Lintz Juiz Municipal e de Orfaos foi deposto juramento ao Santos Evangelhos em um
  livro delles a Aureliano [de Sales Toledo]..." [text cut off at bottom]


  [p3 — curator appointment (continuation from p2):] Auxiliano de Salles Toledo is
  appointed as curator of minors and takes his oath, signing together with the judge
  and escrivão Jaci de Freitas Pacheco.

  [p3 — Certidão (herdeiros maiores citation list):] "Certifico que citei a [runa]
  inventariante aos herdeiros maiores quais [são]..." — certification of summons to
  adult heirs. List includes (among others): "Dona Maria Pu[rpura?] de Silva, Antônio
  Lefernio de Toledo, [d.?] Inês [?], José Pedro da Silva, [d.?]
  Claudina, Narciso Marques [Braz], Francisco Leocadio de Toledo, Auxiliano de Salles
  Toledo, [d.?] Marciano Cesário José de Toledo, Maria José de Jesus, Antônio Ladislao
  de Toledo [...]" [continues onto p4]. NOTE: "Marciano Cesário José de Toledo" is an
  unrecognised person with "Cesário" in the name, possibly an adult son of JC (P-0054)
  not currently in the repository; requires further investigation.


  [p4 — continuation of citation list:] Additional herdeiros: "Mathildes Aba[dia?],"
  "Josephina Christinada da Silva Lima e seu marido," and "Claudina de Toledo [com]
  morido." Key line: "Simplicio Jaci Ferrura [Ferreira] de Toledo e o curador dos
  orphãos" — a person named Simplício Jaci Ferreira de Toledo is curator of the
  orphaned minors ("orphaos menores") in Ladisláo's estate. CAUTION (2026-08-07):
  this person has the Toledo surname; P-0016 (Simplício José Ferreira ARMOND) was
  previously associated with this line, but the surname mismatch (Toledo vs. Armond)
  casts doubt on that identification — this may be a different Toledo family member.
  Requires image re-read to confirm. His curator role is consistent with Francisco
  Leocádio (item 4, predeceased) having left minor orphaned children. Certidão signed: "Concordia 6 de Março 1867 /
  J.a Freitas Pacheco" (escrivão).

  [p4 — Termo de Louvaçao:] Opens "Aos des dias do mez de Março do anno de mil oito
  centos e sessenta e sete" (10 March 1867). Present: the inventariante, the herdeiros
  maiores, and "o tutor [digo]: es Guarda dos Menores" (minor heirs under a guardian).


  [p5 — continuation of Termo de Louvaçao:] Two appraisers approved by the judge:
  "Custódio de [Langes?] Correa" and "Joaquim [?] Barbosa", sworn to assess the estate.
  Signed by escrivão Freitas Pacheco. Signatures of parties present include:
  "Mathildes Maria de Jesus" (signing herself — P-0027 alive in March 1867),
  "Auxiliano de Salles Toledo," "Narciso Marques Braz" (signing for himself and as
  proxy for multiple heirs), "Casimiro Jaci [?] Toledo," "José Pedro da [Silva?],"
  "Antônio Lefernio de Toledo," "Marianna [Eufrázia?] de Toledo." Narciso signs
  "pelos herdeiros" on behalf of a group including "Maria Perpetua da Silva,
  [Inês?], Umbilina de Toledo, Maria José de Jesus, Maria [Eufrásia?] de Jesus,
  e [sua?] mulher Carolina Leopoldina Marques." NOTE: "Umbilina de Toledo" is a
  distinct person, not Eliza Balbina de Toledo (P-0017). "Por Antônio Ladislao de
  Toledo": signed by Narciso Marques Braz as proxy (consistent with António Ladislão
  being deaf-mute, item 7 in the título de herdeiros).
transcription_pt: >-
  [Inventário de Ladisláo Egídio Ferreira de Toledo, Concórdia, Districto do Rio
  Pardo, MG, 1867. Cinco páginas catalogadas: gen1 (título de herdeiros/capa), pp. 2–5.]


  [gen1 — título de herdeiros:] "Dona Mathildes Olympia da Paixão [inventariante or
  label — uncertain read] / [?] Titulo de Herdeiros / [P] Cabeça do Casal / D.
  Mathildes [?] Maria de Jesus. / Filhos" [seguem os filhos de Ladisláo × Mathilde:]
  "1 — Dona Maria Perpétua da Silva, casada com Antonio Zeferino de
  Tolledo" / "2 — Ignez Mettelina de Tolledo, casada com José Pedro da Silva" /
  "3 — D. Carolina Leopoldina Marques, casada com Narcísio Marques Braz." / "4 —
  Francisco Liocadio [Leocádio] de Tolledo, vi[vo/úvo] casado que foi com Maria
  Joaquina de Jesus, falleceu antes da morte da inventariado" [faleceu antes de
  Ladisláo] / "5 — Aureliano de Sales Tolledo, casado com Marciana Espro[n?]de de
  Tolledo" / "6 — Cesario José de Tolledo, casado com Maria José de
  Jesus" / "7 — Antonio Ladislao de Tolledo, casado com Maria Eufrania de Jesus. Este
  é surdo e mudo." / "8 — Jose Cesario de Tolledo Lima, fallecido por quem
  representam seus filhos:" [representantes de JC listados abaixo, continuando na p2]
  "1 — José Augusto de Tolledo Lima, Solteiro de Vinte quatro annos" / "2 — D. Maria
  Adulcelina de [Tolledo], Solteira de Vinte dois annos [casada?]..."


  [p2 — continuação dos representantes de JC:] "3 — D. Mathildes Olympia da Paixão,
  Solteira de vinte annos" / "4 — D. Josefina Cristina de [Acevedo?/Azevedo?],
  casada com Aureliano Ce[lestino?/listino?] [?] Christino da [?]" / "5 — Dona Maria
  Claudina [or: Bulandina] de Tolledo, casada com Manoel Marques Jorge" / "6 —
  Simplicio José Perrura [Ferreira] de Tolledo, Solteiro de quatorze annos" / "7 —
  Ladislao Egidio de Tolledo, Solteiro de doze annos." / "8 — Geraldo, idade de dois
  annos" / "9 — Josefa, idade de seis meses"


  [p2 — declaração sobre Claudina:] "Declaro que a mae destes Dona Claudina Brandina
  de Jesus é viúva, cuja [morte do] marido falleceu depois do Inventariado." [Leitura
  correta: JC (marido de Claudina) morreu depois de Ladisláo — afirmação sobre a ordem
  das mortes de JC, NÃO uma afirmação de que Claudina estivesse falecida. Claudina
  estava viva em 7 de março de 1867 (PRB-0008 p5 confirma sua presença física prestando
  o juramento de inventariante naquele dia).]


  [p2 — certidão:] "Certidoes / Certifico que citei a Sucessão de Sales Tolledo
  para adereun es Curador aos menores preten de aservido juramento eden fe. Concordia
  6 de Março de 1867 / Ja de Bastos Pacheco [signature]."


  [p2 — juramento:] "Juramento do Curador / E logo pelo Doutor Morti[mário] de Sousa
  Lintz Juiz Municipal e de Orfaos foi deposto juramento ao Santos Evangelhos em um
  livro delles a Aureliano [de Sales Toledo]..." [texto cortado ao pé]


  [p3 — nomeação do curador (continuação da p2):] Auxiliano de Salles Toledo é
  nomeado curador dos menores e presta seu juramento, assinando juntamente com o juiz
  e o escrivão Jaci de Freitas Pacheco.

  [p3 — Certidão (lista de citação dos herdeiros maiores):] "Certifico que citei a [runa]
  inventariante aos herdeiros maiores quais [são]..." — certidão de intimação dos
  herdeiros maiores. A lista inclui (entre outros): "Dona Maria Pu[rpura?] de Silva, Antônio
  Lefernio de Toledo, [d.?] Inês [?], José Pedro da Silva, [d.?]
  Claudina, Narciso Marques [Braz], Francisco Leocadio de Toledo, Auxiliano de Salles
  Toledo, [d.?] Marciano Cesário José de Toledo, Maria José de Jesus, Antônio Ladislao
  de Toledo [...]" [continua na p4]. NOTA: "Marciano Cesário José de Toledo" é uma
  pessoa não reconhecida, com "Cesário" no nome, possivelmente um filho adulto de JC
  (P-0054) não presente atualmente no repositório; requer investigação adicional.


  [p4 — continuação da lista de citação:] Herdeiros adicionais: "Mathildes Aba[dia?],"
  "Josephina Christinada da Silva Lima e seu marido," e "Claudina de Toledo [com]
  morido." Linha-chave: "Simplicio Jaci Ferrura [Ferreira] de Toledo e o curador dos
  orphãos" — uma pessoa de nome Simplício Jaci Ferreira de Toledo é curador dos órfãos
  menores ("orphaos menores") no espólio de Ladisláo. CUIDADO (2026-08-07):
  essa pessoa tem o sobrenome Toledo; P-0016 (Simplício José Ferreira ARMOND) foi
  anteriormente associado a esta linha, mas a divergência de sobrenome (Toledo vs. Armond)
  lança dúvida sobre essa identificação — pode tratar-se de um membro diferente da
  família Toledo. Requer nova leitura da imagem para confirmar. Seu papel de curador é
  consistente com Francisco Leocádio (item 4, pré-falecido) ter deixado filhos órfãos
  menores. Certidão assinada: "Concordia 6 de Março 1867 /
  J.a Freitas Pacheco" (escrivão).

  [p4 — Termo de Louvaçao:] Abre com "Aos des dias do mez de Março do anno de mil oito
  centos e sessenta e sete" (10 de março de 1867). Presentes: o inventariante, os
  herdeiros maiores e "o tutor [digo]: es Guarda dos Menores" (herdeiros menores sob
  tutela).


  [p5 — continuação do Termo de Louvaçao:] Dois avaliadores aprovados pelo juiz:
  "Custódio de [Langes?] Correa" e "Joaquim [?] Barbosa", juramentados para avaliar o
  espólio. Assinado pelo escrivão Freitas Pacheco. As assinaturas das partes presentes
  incluem: "Mathildes Maria de Jesus" (assinando por si mesma — P-0027 viva em março de
  1867), "Auxiliano de Salles Toledo," "Narciso Marques Braz" (assinando por si e como
  procurador de vários herdeiros), "Casimiro Jaci [?] Toledo," "José Pedro da [Silva?],"
  "Antônio Lefernio de Toledo," "Marianna [Eufrázia?] de Toledo." Narciso assina
  "pelos herdeiros" em nome de um grupo que inclui "Maria Perpetua da Silva,
  [Inês?], Umbilina de Toledo, Maria José de Jesus, Maria [Eufrásia?] de Jesus,
  e [sua?] mulher Carolina Leopoldina Marques." NOTA: "Umbilina de Toledo" é uma
  pessoa distinta, não Eliza Balbina de Toledo (P-0017). "Por Antônio Ladislao de
  Toledo": assinado por Narciso Marques Braz como procurador (consistente com António
  Ladislão ser surdo-mudo, item 7 no título de herdeiros).
abstract: >-
  The 1867 Concórdia (Districto do Rio Pardo, MG) probate inventory of Ladisláo
  Egídio Ferreira de Toledo (P-0056). Its título de herdeiros (gen1) lists Ladisláo's
  eight children by Mathilde Maria de Jesus (P-0027), including: child #4 Francisco
  Leocádio de Toledo (P-0061), who predeceased Ladisláo and was married to Maria
  Joaquina de Jesus (P-0062); and child #8 José Cesário de Toledo Lima (P-0054,
  deceased), represented by his children. Page p2 continues with JC's nine
  representantes, listing a son named Simplício as item 6 ("Simplicio José Perrura
  [Ferreira] de Tolledo, Solteiro de quatorze annos") — independently corroborating
  PRB-0008 that JC had a son of this name. IMPORTANT: this Simplício is JC's OWN SON
  with the Toledo surname (b. ~1853, 14 years old and solteiro in 1867, dead before
  1879 when he does not appear in PRB-0006) — a DIFFERENT person from Simplício José
  Ferreira ARMOND (P-0016, Eliza's husband). Page p2 also declares: "a mae destes
  Dona Claudina Brandina de Jesus é viúva, cuja [morte do] marido falleceu depois do
  Inventariado" — correctly read as: JC (Claudina's husband) died after Ladisláo;
  Claudina was alive on 7 March 1867 (PRB-0008 p5 confirms her physical presence as
  inventariante). Pages 3–5 record the herdeiros citation list, the Termo de Louvaçao
  (10 March 1867), and signatures including Mathilde Maria de Jesus (alive March 1867)
  and Narciso Marques Braz as proxy for several heirs. A person named "Simplicio Jaci
  Ferrura [Ferreira] de Toledo" appears on p4 as curator of Ladisláo's minor orphan
  heirs — NOTE: this person has the Toledo surname, not Armond; whether this is P-0016
  or a different family member requires image verification (see limitations).
  The curator of JC's minor heirs was Aureliano de Sales Toledo (JC's sibling,
  item 5), before the same judge (Dr. Mortimário de Sousa Lintz) as PRB-0008.
abstract_pt: >-
  O inventário de 1867, em Concórdia (Districto do Rio Pardo, MG), de Ladisláo
  Egídio Ferreira de Toledo (P-0056). Seu título de herdeiros (gen1) lista os oito
  filhos de Ladisláo com Mathilde Maria de Jesus (P-0027), incluindo: o filho nº 4
  Francisco Leocádio de Toledo (P-0061), que faleceu antes de Ladisláo e era casado
  com Maria Joaquina de Jesus (P-0062); e o filho nº 8 José Cesário de Toledo Lima
  (P-0054, falecido), representado por seus filhos. A página p2 prossegue com os nove
  representantes de JC, listando um filho chamado Simplício como item 6 ("Simplicio
  José Perrura [Ferreira] de Tolledo, Solteiro de quatorze annos") — corroborando de
  forma independente PRB-0008 de que JC teve um filho com esse nome. IMPORTANTE: este
  Simplício é o PRÓPRIO FILHO de JC, com o sobrenome Toledo (n. ~1853, 14 anos e
  solteiro em 1867, morto antes de 1879, quando não aparece em PRB-0006) — uma pessoa
  DIFERENTE de Simplício José Ferreira ARMOND (P-0016, marido de Eliza). A página p2
  também declara: "a mae destes Dona Claudina Brandina de Jesus é viúva, cuja [morte
  do] marido falleceu depois do Inventariado" — corretamente lido como: JC (marido de
  Claudina) morreu depois de Ladisláo; Claudina estava viva em 7 de março de 1867
  (PRB-0008 p5 confirma sua presença física como inventariante). As páginas 3–5
  registram a lista de citação dos herdeiros, o Termo de Louvaçao (10 de março de
  1867) e assinaturas, incluindo Mathilde Maria de Jesus (viva em março de 1867) e
  Narciso Marques Braz como procurador de vários herdeiros. Uma pessoa chamada
  "Simplicio Jaci Ferrura [Ferreira] de Toledo" aparece na p4 como curador dos
  herdeiros órfãos menores de Ladisláo — NOTA: essa pessoa tem o sobrenome Toledo, não
  Armond; se é P-0016 ou um membro diferente da família requer verificação por imagem
  (ver limitations). O curador dos herdeiros menores de JC foi Aureliano de Sales
  Toledo (irmão de JC, item 5), perante o mesmo juiz (Dr. Mortimário de Sousa Lintz)
  de PRB-0008.
reliability:
  assessment: >-
    Direct primary judicial evidence for: (1) Ladisláo's eight children by Mathilde,
    including Francisco Leocádio and José Cesário; (2) Francisco Leocádio's wife
    Maria Joaquina de Jesus [uncertain name read] and his predeceasing Ladisláo;
    (3) Simplício as JC's child #6, aged 14, solteiro (independent of PRB-0008);
    (4) Claudina Brandina de Jesus surviving Ladisláo's death. Concurrent with
    PRB-0008; two independent probate processes confirming the same family structure.
  informant: >-
    J. de Bastos Pacheco, Escrivão dos Órfãos, Concórdia, 1867; judicial process
    before Dr. Mortimário de Sousa Lintz, Juiz Municipal e de Órfãos.
  limitations: >-
    Francisco Leocádio's wife's name "[Joa?]quina de Jesus" is an uncertain cursive
    read. The p3–p5 herdeiros citation list contains several uncertain name reads
    (ink and cursive). "Marciano Cesário José de Toledo" (p3 citation list) is
    unrecognised — possibly an adult son of JC not yet in the repository. No children
    are listed under Francisco Leocádio (item 4) in pp 1–5; his minor children
    appear on uncatalogued pages or their shares are managed via Simplício's
    curatorship. Pages p6–end not catalogued. IMPORTANT — surname discrepancy for
    the p4 curator: the image reads "Simplicio Jaci Ferrura [Ferreira] de Toledo"
    (Toledo surname), while P-0016 is Simplício José Ferreira ARMOND (Armond surname,
    per PRB-0006). The prior association of P-0016 with this curator line is unconfirmed;
    the person may be a different Toledo family member. Additionally, the concurrent
    PRB-0008 p8 reads "Simplicio José Ferrara [Ferreira] de Tolledo" for JC's own son
    (item 6) — the middle name Jaci vs. José may be a cursive misread, but these are
    two distinct named Simplícios in this same set of records, and P-0016 is neither
    of them without image verification.
