notes:
- text: >-
    The act spans two page images: the parentage, marriage and children are on
    …-p1.jpg (the primary scan, in digital_file); the executors, the masses for his
    parents and the closing are on …-p2.jpg.
    [Superseded 2026-10-10: the certidão runs to eight page images, …-p1.jpg to …-p8.jpg
    (case pages 3–10 of PRB-0012); p3–p8 carry the will's date, the auto de approvação,
    the 1888 opening, acceptance and registrations, and the certidão's own date.]
- text: >-
    Parents' surnames as written here are "Jacob Bahrer" and "Catharina Mayer".
    Secondary Nova Friburgo colonist-family compilations (a lead, not catalogued)
    give them as Jacob Borer (b. 1801 Erschwil, Soleure, Switzerland; d. 1843) and
    Catharina Moser (Hägendorf, Soleure) — the Swiss-immigrant reading of the line.
    The "Moser" surname and the Swiss origin are NOT asserted from this record; they
    remain a lead pending a primary Borer baptism/marriage or Jacob's c.1843 Nova
    Friburgo inventário.
    [2026-10-10: on re-reading the image, the father's surname is written with the same
    letterforms as the testator's and his wife's "Bohrer" on the same page and is now
    transcribed "Jacob Bohrer" ("Bahrer" possible, not secure). The reading "Jacob
    Borer (b. 1801 Erschwil…; d. 1843)" above is the compilation's; Erschwil has since
    been closed as a bounded negative (see P-0050) and Jacob Borer's inventário is
    reported on FamilySearch as of 1851–52 [LEAD].]
- text: >-
    Re-catalogued 2026-10-10 from the whole 1890 case (PRB-0012). What changed and why: (1)
    The earlier record held only 2 of the certidão's 8 pages (fl. 3–3v: the will up to "me
    assigno por estar conforme"). Its date, the auto de approvação, the opening, the
    acceptance, the registrations and the certidão's own date are on fl. 4–6v, now added as
    p3–p8, and the transcription now runs across all eight pages. (2) "1888" was the year of
    the will's opening (6 July) and registration (24 July), not of the will: the will and
    its approval are dated 27 June 1879, and the copy itself 27 January 1890. The former
    "auto de approvação, Nova Friburgo, 188[8], parcialmente legível" was a misreading of
    pages not then held; title, record_type, event_date (now the will, 1879-06-27),
    registration_date (1888-07-24), abstracts, reliability and repository were corrected
    accordingly. "Todos de menor idade" and "já fallecidos" therefore describe June 1879.
    The evidence file names keep "1888" because paths are stable. (3) The escrivão's surname
    reads "Zamith" [uncertain: the copperplate initial reads best as Z, possibly K; the
    retrieval side reads "Hamitt(h)"], not "Kramith": no "r" appears in any of its roughly
    fifteen occurrences in the case, in the copy or in his own signature. He is the same man
    as tabellião in 1879 and escrivão in 1888–90. (4) The father's surname on fl. 3 was
    checked on the image (crops enlarged 4–8×): its letterforms match the testator's own
    "Bohrer" and his wife's "Bohrer" on the same page, so it is transcribed "Bohrer";
    "Bahrer" is possible but not secure. (5) The wife is written "Rosa" in the will
    (formerly transcribed "Roza"); the surname is "Bohrer" in the will and "Borer" in the
    1879 approval and 1888 termos.
  text_pt: >-
    Recatalogado em 2026-10-10 a partir do processo completo de 1890 (PRB-0012). O que mudou
    e por quê: (1) O registro anterior tinha apenas 2 das 8 páginas da certidão (fl. 3–3v: o
    testamento até "me assigno por estar conforme"). A data, o auto de approvação, a
    abertura, a aceitação, os registros e a data da própria certidão estão nas fl. 4–6v,
    agora acrescentadas como p3–p8, e a transcrição passa a correr pelas oito páginas. (2)
    "1888" era o ano da abertura (6 de julho) e do registro (24 de julho), não do
    testamento: o testamento e sua aprovação são de 27 de junho de 1879, e a certidão de 27
    de janeiro de 1890. O antigo "auto de approvação, Nova Friburgo, 188[8], parcialmente
    legível" era leitura errada de páginas então não disponíveis; título, record_type,
    event_date (agora o testamento, 1879-06-27), registration_date (1888-07-24), resumos,
    confiabilidade e repositório foram corrigidos. "Todos de menor idade" e "já fallecidos"
    descrevem, portanto, junho de 1879. Os nomes dos arquivos de evidência mantêm "1888"
    porque os caminhos são estáveis. (3) O sobrenome do escrivão lê-se "Zamith" [incerto: a
    inicial caligráfica lê-se melhor como Z, talvez K; o lado da recuperação lê
    "Hamitt(h)"], não "Kramith": não há "r" em nenhuma de suas cerca de quinze ocorrências
    no processo, na cópia ou na assinatura dele. É o mesmo homem, tabelião em 1879 e
    escrivão em 1888–90. (4) O sobrenome do pai na fl. 3 foi conferido na imagem (recortes
    ampliados 4–8×): suas letras coincidem com o "Bohrer" do próprio testador e o da esposa
    na mesma página, e por isso é transcrito "Bohrer"; "Bahrer" é possível, mas não seguro.
    (5) A esposa é escrita "Rosa" no testamento (antes transcrito "Roza"); o sobrenome é
    "Bohrer" no testamento e "Borer" na aprovação de 1879 e nos termos de 1888.
- text: >-
    Previous catalogue reference, kept for history (1 August 2026): "FamilySearch DGS
    105875530, images ~867-869 (Provedoria de Nova Friburgo, Livro de Testamentos nº 9, fl.
    8v)" — it was taken then for the register book itself; it is the 1890 certidão copying
    it. The will itself does not date his death (an earlier P-0034 note said it dated it to
    c.1888); the opening on 6 July 1888 of "este testamento com que falleceu Francisco José
    Borer" agrees with his death act (PAR-0055).
