transcription: >-
  [Certidão do escrivão da Provedoria de Nova Friburgo. Duas imagens (…-p1.jpg,
  …-p2.jpg); no alto da p1 o fólio "3".]


  [p1] "O Capitão João José Kramith[?], Escrivão da Provedoria da Cidade de
  Nova-Friburgo. Certifico que revendo em meu cartorio o livro de Registro de
  testamentos numero nove, delle a folhas oito verso consta o Registro do theor
  seguinte: — Registro d'um testamento na forma abaixo. — Jesus, Maria, José. Em
  Nome da Santissima Trindade, Padre, Filho, Espirito Santo, em quem eu Francisco
  José Bohrer firmemente creio, em cuja fé protesto viver e morrer. Este é o meu
  testamento e ultima vontade. Declaro que sou natural deste termo, filho legitimo
  de Jacob Bahrer e de Catharina Mayer, já fallecidos. Declaro que sou casado á face
  da Igreja com Roza Eugenia de Lemos Bohrer, de cujo matrimonio tenho actualmente
  quatro filhos que são Joaquim, Laura, Guilherme e Fernando, todos de menor idade,
  os quaes são meus [p2] unicos e legitimos herdeiros. O meu enterro será feito á
  vontade de meu testamenteiro. Mando que por alma de meus paes se digão vinte
  missas. Deixo a quantia de cincoenta mil réis para obras ou conservação da Capella
  de Santo Antonio que se vae edificar no Suspiro nesta Villa, livre de imposto que
  será pago pelos meus bens. Nomeio para meus testamenteiros e tutores de meus
  filhos, na ordem em que se achão: em primeiro lugar a minha mulher Rosa Eugenia de
  Lemos Bohrer, em segundo lugar a meu cunhado Candido Pereira de Lemos, e em
  terceiro lugar ao meu amigo Samuel Antonio dos Santos. Esta é a minha ultima
  vontade e disposição para depois de minha morte, que pedi a João José Kramith que
  por mim escrevesse conforme lhe ditei, e no qual me assigno por estar conforme."
  [Segue o auto de approvação, Nova Friburgo, 188[8], parcialmente legível.]
abstract: >-
  Francisco José Bohrer's own registered will (Provedoria de Nova Friburgo, Livro de
  Testamentos nº 9, fl. 8v; registered 1888). He declares himself "natural deste
  termo" (born in the Nova Friburgo comarca) and "filho legitimo de Jacob Bahrer e
  de Catharina Mayer, já fallecidos" — primary evidence of his parents (P-0050,
  P-0051), the Bohrer line's immigrant boundary. He names his wife Rosa Eugenia de
  Lemos Bohrer (P-0035) and their four children Joaquim (P-0030), Laura, Guilherme
  and Fernando as sole heirs, and his brother-in-law Candido Pereira de Lemos as an
  executor. Resolves the previously open question of whether Francisco José was
  himself an immigrant: he was Brazilian-born (Nova Friburgo), and the immigrant
  generation is his parents.
abstract_pt: >-
  O próprio testamento registrado de Francisco José Bohrer (Provedoria de Nova
  Friburgo, Livro de Testamentos nº 9, fl. 8v; registrado em 1888). Ele se declara
  "natural deste termo" (nascido na comarca de Nova Friburgo) e "filho legitimo de
  Jacob Bahrer e de Catharina Mayer, já fallecidos" — evidência primária de seus
  pais (P-0050, P-0051), o limite imigrante da linha Bohrer. Ele nomeia sua esposa
  Rosa Eugenia de Lemos Bohrer (P-0035) e seus quatro filhos Joaquim (P-0030), Laura,
  Guilherme e Fernando como únicos herdeiros, e seu cunhado Candido Pereira de Lemos
  como testamenteiro. Resolve a questão até então em aberto sobre se o próprio
  Francisco José era imigrante: ele nasceu no Brasil (Nova Friburgo), e a geração
  imigrante é a de seus pais.
reliability:
  assessment: >-
    Direct primary evidence (the testator's own sworn declaration) of Francisco
    José Bohrer's parentage, his Nova Friburgo birth, his marriage to Rosa Eugenia
    de Lemos, and his four children.
  informant: >-
    Francisco José Bohrer himself (testator), dictated to and written by the
    escrivão João José Kramith.
  limitations: >-
    A certified register copy, not the autograph will; the escrivão's surname
    (Kramith) and the exact registration day/month are uncertain/partly legible
    reads. The parents' surnames are written "Bahrer" and "Mayer"; Nova Friburgo
    colonist-family compilations (secondary) give the mother's surname as Moser —
    recorded as a variant/lead, not overwriting the primary "Mayer".
