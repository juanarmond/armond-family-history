transcription: >-
  [Certified copy (certidão) made on 27 January 1890 by the escrivão of the Provedoria de
  Nova Friburgo from the Livro de Registro de Testamentos nº 9, fl. 8v: the closed will of
  Francisco José Bohrer dated 27 June 1879, its auto de approvação of the same day, its
  opening on 6 July 1888, the order to comply and register (7 July 1888), the summons and
  acceptance of the first testamenteira and the registrations (24 July 1888). Eight page
  images, …-p1.jpg to …-p8.jpg = pp. 3–10 (fl. 3–6v) of the 1890 contas testamentárias case,
  PRB-0012. Running transcription: the scribe's line breaks are not kept and words he split
  across lines are joined; spelling as written; expansions only in square brackets. The copy
  is in a clerk's round hand; only the closing subscription on p8 is in the escrivão's own
  cursive. The escrivão's surname is read "Zamith" throughout [uncertain: the copperplate
  initial reads best as Z, possibly K or H; no "r" appears in any occurrence — see notes].]

  [p1 = case p03 — fl. 3]

  "O Capitão João José Zamith Escrivão da Provedoria da Cidade de Nova-Friburgo. Certifico
  que revendo em meu cartorio o livro de Registro de testamentos numero nove delle a folhas
  oito verso consta o Registro do theor seguinte: Registro de um testamento na fórma abaixo.
  Jesuz, Maria, José. Em Nome da Santissima Trindade, Padre, Filho, Espirito Santo em quem
  eu Francisco José Bohrer firmemente creio e em cuja fé protesto viver e morrer. Este é o
  meu testamento, e ultima vontade. Declaro que sou natural deste termo, filho legitimo de
  Jacob Bohrer [uncertain: second letter o/a — it is formed like the "o" of the two other
  "Bohrer" on this page; earlier catalogued as "Bahrer"] e de Catharina Mayer, já
  fallecidos, Declaro que sou casado á face da Igreja com Rosa Eugenia de Lemos Bohrer, de
  cujo matrimonio tenho actualmente quatro filhos que são Joaquim, Laura, Guilherme e
  Fernando todos de menor idade os quaes são meus

  [p2 = case p04 — fl. 3v]

  unicos e legitimos herdeiros. O meu enterro será feito á vontade de meu testamenteiro.
  Mando que por alma de meus paes se digão vinte missas. Deixo a quantia de cincoenta mil
  réis para obras ou conservação da Capella de Santo Antonio que se vae edificar no Suspiro
  nesta Villa, livre de imposto que será pago pelos meus bens. Nomeio para meus
  testamenteiros e tutores de meus filhos, na ordem em que se achão em primeiro lugar a
  minha mulher Rosa Eugenia de Lemos Bohrer, em segundo lugar a meu cunhado Candido Pereira
  de Lemos e em terceiro lugar ao meu amigo Samuel Antonio dos Santos. Esta é a minha ultima
  vontade e disposição para depois de minha morte, que pedi a João José Zamith que por mim
  escrevesse conforme lhe ditei e no qual me assigno por estar conforme.

  [p3 = case p05 — fl. 4]

  Nova-Friburgo, vinte e sete de Junho de mil oitocentos e setenta e nove. Francisco José
  Bohrer. João José Zamith. Testemunha que este fiz. Auto de approvação. Saibão quantos este
  publico Instrumento virem que no anno do Nascimento de Nosso Senhor Jesus Christo de mil
  oitocentos e setenta e nove, nesta Villa de Nova-Friburgo aos vinte e sete dias do mez de
  Junho em meu cartorio compareceu Francisco José Borer, que reconheço pelo proprio e em seu
  perfeito juiso e entendimento segundo o meu parecer e das testemunhas que presentes
  estavão e positivamente forão convocadas, perante as quaes por elle testador das suas mãos
  ás minhas me foi dado uma folha de papel fechado e cosido, dizendo-me que era o seu
  testamento que lhe fizera a seu rogo eu Tabellião conforme o havia ditado e por

  [p4 = case p06 — fl. 4v]

  elle assignado e que queria eu lho approvasse, cujo papel eu aceitei e achei com effeito
  ser o testamento do sobredicto testador Francisco José Borer escripto em duas laudas de
  papel que findão retro, o qual vi e não li, e não achando em todo elle, borrão, riscado ou
  entrelinha, nem cousa que duvida faça e lhe fiz as perguntas da lei em presença das
  testemunhas abaixo assignadas, o que respondendo que este era o seu testamento e ultima
  vontade, escripto por mim Tabellião e por elle dictado e assignado, que rogara ás Justiças
  de Sua Magestade Imperial lhe dessem cumprimento de Justiça e que se não valesse como
  testamento, valesse como cedula ou codicillo e finalmente que era contente que ficasse
  fechado, cosido e lacrado com cinco pingos de lacre digo cosido e lacrado e que não fosse
  aberto senão depois de seu

  [p5 = case p07 — fl. 5]

  fallecimento, o qual por não ter cousa que duvida fizesse, rubriquei em todas as suas
  folhas em que se acha escripto o testamento com o meu appellido de Zamith e lh'o approvei
  e houve por approvado na fórma da lei e do seu regimento com todas as solemnidades de
  direito e fica fechado, cosido e lacrado com cinco pingos de lacre por lauda e para
  constar fiz este auto de approvação de testamento que assigna o testador sendo testemunhas
  presentes Antonio Rodrigues Teixeira, José Ribeiro Ramalho. Francisco Paulo Marcello
  Leglaye [uncertain]. Rodrigo Joaquim da Silva. Samuel Antonio dos Santos, moradores nesta
  Villa que reconhecem [uncertain] ser o dito testador o proprio do que dou fé e assignárão
  depois de lhes ser lido este auto por mim Tabellião. Eu João José Zamith Tabellião que o
  escrevi e assigno em publico e raso. Em testemunho de verdade. (O signal

  [p6 = case p08 — fl. 5v]

  publico.) João José Zamith. Francisco José Borer. Antonio Rodrigues Teixeira. José Ribeiro
  Ramalho. Samuel Antonio dos Santos. Francisco Paulo Marcello Leglaye [uncertain]. Rodrigo
  Joaquim da Silva. Apresentação. Aos seis dias do mez de Julho de mil oitocentos e oitenta
  e oito nesta Villa de Nova-Friburgo em casa do Juiz da Provedoria Doutor Carlos Marques de
  Sá onde eu Escrivão vim ahi compareceu Samuel Antonio dos Santos que apresentou este
  testamento com que falleceu Francisco José Borer e pelo Juiz foi o mesmo aberto, mandando
  lavrar este termo que assigna com o apresentante. Eu João José Zamith o escrevi. Carlos
  Marques de Sá. Samuel Antonio dos Santos. Conclusão. E faço este testamento concluso ao
  Juiz da Provedoria Doutor Carlos Marques de Sá e faço este termo. Eu João José Zamith o
  escrevi. Em sete de Julho de mil oito

  [p7 = case p09 — fl. 6]

  centos e oitenta e oito. Cumpra-se e registre-se. Nova Friburgo sete de Julho de mil
  oitocentos e oitenta e oito. Marques de Sá. Data. No [uncertain: No/Ao] mesmo dia, mez e
  anno e lugar supra declarado em casa do Juiz Provedor Doutor Carlos Marques de Sá me forão
  entregues estes autos com o despacho supra e faço este termo. Eu João José Zamith o
  escrevi. Certidão. Certifico que intimei a primeira testamenteira para vir acceitar a
  testamentaria do que dou fé. Nova Friburgo vinte e quatro de Julho de mil oitocentos e
  oitenta e oito. João José Zamith. Termo de acceitação. Aos vinte e quatro dias do mez de
  Julho de mil oitocentos e oitenta e oito nesta Villa de Nova Friburgo em meu cartorio
  compareceu Dona Rosa Eugenia de Lemos Borer e por ella foi dito que aceitara a presente
  testamentaria. Assim o disse do que dou fé e assigna a seu rogo por dizer não

  [p8 = case p10 — fl. 6v]

  saber escrever o Doutor Candido da Silveira Rodrigues. Eu João José Zamith o escrevi.
  Candido da Silveira Rodrigues. Numero cento e vinte e dois. Registrado a folhas dez do
  livro competente de Registros. Collectoria Provincial de Nova-Friburgo vinte e quatro de
  Julho de mil oitocentos e oitenta e oito. Cunha Valle. O Escrivão Gonzaga. Nada mais se
  continha em o dito testamento que aqui registei aos vinte e quatro de Julho de mil
  oitocentos e oitenta e oito Eu João José Zamith o escrevi e assigno João José Zamith. Nada
  mais se continha em o dito testamento que aqui fiz extrahir do proprio livro ao qual me
  reporto nesta Cidade de Nova-Friburgo aos vinte sete dias do mez de Janeiro de mil
  oitocentos e noventa. [From here in the escrivão's own cursive hand:] Eu João José Zamith
  o subscrevi e assignei [uncertain: assignei/assigno]. [Signature with flourish:] João José
  Zamith [a small mark above the surname — illegible]"
abstract: >-
  Certified copy, made by the escrivão of the Provedoria de Nova Friburgo on 27 January
  1890, of the entry in the Livro de Registro de Testamentos nº 9, fl. 8v: Francisco José
  Bohrer's (P-0034) closed will, dated Nova Friburgo 27 June 1879, written at his dictation
  by the tabellião João José Zamith [uncertain] and signed by him; its auto de approvação
  the same day before five witnesses (Antonio Rodrigues Teixeira, José Ribeiro Ramalho,
  Francisco Paulo Marcello Leglaye [uncertain], Rodrigo Joaquim da Silva, Samuel Antonio dos
  Santos); its presentation by Samuel Antonio dos Santos and opening by the Juiz da
  Provedoria Dr. Carlos Marques de Sá on 6 July 1888, "este testamento com que falleceu
  Francisco José Borer"; the order "Cumpra-se e registre-se" of 7 July 1888; and, on 24 July
  1888, the summons and acceptance of the first testamenteira, his widow Rosa Eugenia de
  Lemos (P-0035), signed for her "a seu rogo por dizer não saber escrever" by Dr. Candido da
  Silveira Rodrigues, and the registrations. In the will he declares himself "natural deste
  termo" and "filho legitimo de Jacob Bohrer e de Catharina Mayer, já fallecidos" (parents
  P-0050, P-0051, dead before 27 June 1879); married "á face da Igreja" to Rosa Eugenia de
  Lemos Bohrer, with "actualmente quatro filhos que são Joaquim, Laura, Guilherme e Fernando
  todos de menor idade" (Joaquim = P-0030) as his sole heirs; he orders twenty masses for
  his parents, leaves 50$000 to the chapel of Santo Antonio "que se vae edificar no
  Suspiro", and names as testamenteiros and tutors of his children, in order, his wife, his
  brother-in-law Candido Pereira de Lemos and his friend Samuel Antonio dos Santos. The
  children were minors in 1879, not 1888. Primary evidence of his parentage and Nova
  Friburgo birth: he was Brazilian-born, and the immigrant generation is his parents.
abstract_pt: >-
  Certidão, passada pelo escrivão da Provedoria de Nova Friburgo em 27 de janeiro de 1890,
  do assento do Livro de Registro de Testamentos nº 9, fl. 8v: o testamento cerrado de
  Francisco José Bohrer (P-0034), datado de Nova Friburgo, 27 de junho de 1879, escrito a
  seu ditado pelo tabelião João José Zamith [incerto] e por ele assinado; o auto de
  approvação do mesmo dia, perante cinco testemunhas (Antonio Rodrigues Teixeira, José
  Ribeiro Ramalho, Francisco Paulo Marcello Leglaye [incerto], Rodrigo Joaquim da Silva,
  Samuel Antonio dos Santos); a apresentação por Samuel Antonio dos Santos e a abertura pelo
  Juiz da Provedoria Dr. Carlos Marques de Sá em 6 de julho de 1888, "este testamento com
  que falleceu Francisco José Borer"; o despacho "Cumpra-se e registre-se" de 7 de julho de
  1888; e, em 24 de julho de 1888, a intimação e o termo de acceitação da primeira
  testamenteira, sua viúva Rosa Eugenia de Lemos (P-0035), assinado por ela "a seu rogo por
  dizer não saber escrever" pelo Dr. Candido da Silveira Rodrigues, e os registros. No
  testamento ele se declara "natural deste termo" e "filho legitimo de Jacob Bohrer e de
  Catharina Mayer, já fallecidos" (pais P-0050, P-0051, mortos antes de 27 de junho de
  1879); casado "á face da Igreja" com Rosa Eugenia de Lemos Bohrer, com "actualmente quatro
  filhos que são Joaquim, Laura, Guilherme e Fernando todos de menor idade" (Joaquim =
  P-0030) como únicos herdeiros; manda dizer vinte missas pelos pais, deixa 50$000 à capela
  de Santo Antonio "que se vae edificar no Suspiro" e nomeia testamenteiros e tutores dos
  filhos, nesta ordem, a esposa, o cunhado Candido Pereira de Lemos e o amigo Samuel Antonio
  dos Santos. Os filhos eram menores em 1879, não em 1888. Evidência primária de sua
  filiação e de seu nascimento em Nova Friburgo: ele nasceu no Brasil, e a geração imigrante
  é a de seus pais.
reliability:
  assessment: >-
    Direct primary evidence (the testator's own declaration, in a will he dictated and
    signed in 1879) of Francisco José Bohrer's parentage, his Nova Friburgo birth, his
    marriage to Rosa Eugenia de Lemos and his four children; and direct evidence, from the
    court's own termos of 1888, of the will's opening on the day of his death and of Rosa's
    acceptance of the testamentaria.
  informant: >-
    Francisco José Bohrer himself (testator), dictated to and written by the tabellião João
    José Zamith [uncertain]; the 1888 termos by the same man as escrivão of the Provedoria.
  limitations: >-
    A certified copy (1890) of the register copy (1888) of the closed will, not the
    autograph: the signatures are copied, so it attests that he signed but shows no
    autograph. Uncertain peripheral readings: the escrivão's surname (Zamith / Kamith /
    Hamith), the witness Leglaye, and the second letter of the father's surname (Bohrer,
    possibly Bahrer). The mother's surname is written "Mayer"; her own 1825 marriage
    (PAR-0059) and her son's 1832 baptism (PAR-0054) write "Moser", which this repository
    prefers.
