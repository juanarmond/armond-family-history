title: >-
  Certified copy (27 January 1890) of the registered closed will of Francisco José Bohrer,
  made 27 June 1879 and opened at his death on 6 July 1888 (Provedoria de Nova Friburgo,
  Livro de Registro de Testamentos nº 9, fl. 8v), declaring his parents Jacob Bohrer and
  Catharina Mayer, his wife and his four minor children
title_pt: >-
