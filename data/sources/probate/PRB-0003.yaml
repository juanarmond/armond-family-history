transcription: >-
  [Página 1 de 2 (imagem 1). No alto: "= 2 =", um "N.º", e o fólio "159"
  (repetido à direita). Nota de margem lateral, na vertical, de leitura parcial:
  "[...] Antonio Belizandro dos Reis Meirelles [...] 25 de Maio de 18[7]7";
  demais anotações de arquivo à margem direita, ilegíveis.]

  Livro 6 Folhas 27, 28, 29 e 30.

  Primeiro tras[-]lado de escriptura de venda que fazem Mano[-]el Marques Jorge,
  sua mulher D. Maria Blandina de Jezus, Baldoino Rodrigues de Almeida Montes e
  sua mulher D. Josepha Olimpia Rodrigues d'Almeida, Dona Maria Porcelina de
  Toledo, D. Matildes Olimpia da Paixão, Geraldo Augusto de Toledo, Ladisláo
  Egydio Ferreira de Toledo ao Ca[-]pitão Antonio Belizandro dos Reis
  Mei[-]relles na forma abaixo =

  Saibão quan[-]tos este publico instrumento virem que no anno do Nascimento de
  Nosso Senhor Jezus Christo de mil oito centos e setenta e sete aos vinte e
  cinco dias do mez de Maio nesta Freguezia de Santo Antonio dos [Aribas?]
  Ter[-]mo da Leopoldina Provincia de Minas Geraes em o meu Cartorio compareceram
  partes justas e contractadas a saber: como outor[-]gantes vendedores Manoel
  Marques Jorge e sua mulher Dona Maria Blandina de Jezus, Baldoino Rodrigues
  d'Almeida Mon[-]tes e sua mulher Dona Josepha Olimpia Rodrigues d'Almeida, Dona
  Maria Por[-]celina de Toledo, Dona Matildes Olimpia da Paixão, Geraldo Augusto
  de Toledo e Ladisláo Egydio Ferreira de Toledo e como outorgado Comprador o
  Capitão Antonio Belizandro dos Reis Meirelles, aquelles moradores nesta
  Freguezia e este morador na Freguezia do Rio Pardo ambas deste [...]

  [Página 2 de 2 (imagem 2). Nota de margem lateral, na vertical: "Concordia".]

  [...] de Lima Coelho de Moura, [Cezario?] Chris[-]tino da Silva Lima e sua
  mulher Dona Adelaide da Fonseca Lima, re[-]prezentados por seu bastante
  Procu[-]rador Ladisláo Egydio Ferreira de Toledo, pelos poderes das Procurações
  que exhibio e abaixo vão transcriptas; e de outro lado como Outorgado
  compra[-]dor o Capitão Antonio Belizandro dos Reis Meirelles, os primeiros
  residentes em São João d'El Rei, os segundos resi[-]dentes no Rio de Janeiro, e
  o outor[-]gado residente no Districto do Rio Pardo d'este Termo, reconhecidos
  por mim Escrivão e pelas testemunhas abaixo assignadas, do que dou fé; perante
  as quaes pelos Outorgantes por seu Procurador, foi dito que são Senhores e
  possuidores de duas Sortes de ter[-]ras de cultura em commum na Fazenda da
  Concordia e que houve[-]rão por herança no inventario os bens de sua finada avó
  Dona Ma[-]thildes Maria de Jezus, pela ma[-]neira seguinte: Parte nos tres mil
  [...]
abstract: >-
  A notarial deed of sale registered at Santo Antônio [dos Aribas?], Termo de
  Leopoldina, MG, on 25 May 1877, in which a set of Toledo-family grandchildren —
  Maria Bulandina de Jesus (wife of Manoel Marques Jorge), Josepha Olímpia, Maria
  [Perpétua/Porcelina] de Toledo, Matildes Olímpia da Paixão, Geraldo Augusto de
  Toledo and Ladisláo Egydio Ferreira de Toledo — sell to Capitão Antonio
  Belizandro dos Reis Meirelles two shares of cultivated land in the Fazenda da
  Concórdia that they inherited from their deceased grandmother (avó) Dona
  Mathildes Maria de Jesus. Same grandchild set and estate matriarch as the 1881
  partilha (PRB-0001, which lists Eliza Balbina de Toledo among the "Primeiros
  Nettos") and the 1884 petition (PRB-0002).
abstract_pt: >-
  Uma escritura notarial de venda registrada em Santo Antônio [dos Aribas?], Termo
  de Leopoldina, MG, em 25 de maio de 1877, na qual um conjunto de netos da família
  Toledo — Maria Bulandina de Jesus (esposa de Manoel Marques Jorge), Josepha
  Olímpia, Maria [Perpétua/Porcelina] de Toledo, Matildes Olímpia da Paixão, Geraldo
  Augusto de Toledo e Ladisláo Egydio Ferreira de Toledo — vendem ao Capitão Antonio
  Belizandro dos Reis Meirelles duas sortes de terras de cultura na Fazenda da
  Concórdia que herdaram de sua falecida avó Dona Mathildes Maria de Jesus. Mesmo
  conjunto de netos e mesma matriarca do espólio da partilha de 1881 (PRB-0001, que
  lista Eliza Balbina de Toledo entre os "Primeiros Nettos") e da petição de 1884
  (PRB-0002).
reliability:
  assessment: >-
    Original notarial deed directly stating that the named Toledo grandchildren
    inherited from their grandmother Mathilde Maria de Jesus at the Fazenda da
    Concórdia. It fixes Mathilde as the grandmother — not the mother — of Eliza
    Balbina de Toledo's (P-0017) Toledo line, resolving the open question flagged
    on PRB-0001 and corroborating PRB-0001/PRB-0002.
  informant: >-
    The notary's register (escrivão), recording the parties' own declaration of
    how they acquired the land.
  limitations: >-
    Eliza Balbina de Toledo is not herself a named party to this deed; she is
    documented as a co-grandchild in PRB-0001. The intervening generation —
    Mathilde's child, who is Eliza's parent — is not named here. Read from a
    FamilySearch Full-Text preview image; some readings are uncertain (the
    freguesia "Aribas"; Maria "Perpétua/Porcelina"). The deed occupies four
    folios (Livro 6, fls. 27–30); only two images are in evidence (fls. 27–28).
    The transcription above is complete for the available images; the deed body
    cuts off mid-sentence ("Parte nos tres mil [...]") at the bottom of fl. 28;
    the remainder (property description and price) is on fls. 29–30, which are
    not digitised.
