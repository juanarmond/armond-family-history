- text: >-
    Establishes Mathilde Maria de Jesus (P-0027) as the grandmother of the
    Toledo grandchildren, hence of Eliza Balbina de Toledo (P-0017). The
    intervening parent is still undocumented, so Mathilde's tie to P-0017 is
    recorded in prose, not yet as a structured relationship.
