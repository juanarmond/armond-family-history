- text: >-
    Newly named, not yet modelled as entities pending resolution of the generations:
    the grandfather Ladisláo Egydio Ferreira de Toledo (husband of Mathilde Maria de
    Jesus, P-0027) and the parent couple Antonio Zeferino de Toledo and Dona Maria
    Perpétua. Whether this Antonio Zeferino × Maria Perpétua couple is specifically
    the intervening generation between Mathilde and Eliza Balbina de Toledo (P-0017)
    is not established here — they are the parents of this deed's (unnamed) grantors,
    who are grandchildren of Mathilde, as Eliza is. The full Concórdia inventory is
    required to place the couples and resolve the two-Ladisláo conflict flagged in
    the reliability limitations before any parent-child edges are created.
- text: >-
    Only P-0027 (Mathilde, named in the document) is linked. Eliza Balbina de Toledo
    (P-0017) is not named on this fragment; her tie to this record runs through the
    still-undocumented intervening generation and is kept in prose, not as a link.
