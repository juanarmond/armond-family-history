abstract: >-
  A mid-deed continuation folio of a Toledo-family notarial sale of land in the
  Fazenda da Concórdia and adjoining Ribeirão de São Bento, Termo de Leopoldina,
  MG. The grantors declare they hold the land by inheritance from their deceased
  grandparents (avós) Dona Mathilde Maria de Jesus and Ladisláo Egydio Ferreira de
  Toledo and from their parents and parents-in-law (paes e sogros) Antonio Zeferino
  de Toledo and Dona Maria Perpétua, whose inventory and partition were adjudicated
  at the city of Leopoldina. It is part of the same Concórdia succession as PRB-0003
  (1877 sale deed) and PRB-0001 (1881 partilha).
reliability:
  assessment: >-
    Original notarial deed page directly stating a three-generation Toledo descent
    for the Concórdia land: grandparents Mathilde Maria de Jesus (P-0027) and
    Ladisláo Egydio Ferreira de Toledo; parents Antonio Zeferino de Toledo and
    Maria Perpétua; and the grantor grandchildren (not named on this fragment). It
    materially extends the maternal Toledo line of Eliza Balbina de Toledo (P-0017)
    above her documented grandmother Mathilde.
  informant: >-
    The notary's register (escrivão), recording the grantors' own declaration of
    how they acquired the land.
  limitations: >-
    Only a single mid-deed continuation folio was located; the grantors' names, the
    date and the notary are on adjacent folios not yet retrieved. It raises a
    conflict with PRB-0003 that is not yet resolved: in the 1877 deed a living
    "Ladisláo Egydio Ferreira de Toledo" is a grantor grandchild, whereas here a
    "Ladisláo Egydio Ferreira de Toledo" is a deceased grandfather — most likely two
    same-named men (elder grandfather and a grandson named after him), but this must
    be confirmed from the full Concórdia inventory before the intervening generations
    are modelled as entities. Read from a FamilySearch Full-Text preview image; some
    readings are uncertain.
