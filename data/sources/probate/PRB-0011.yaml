transcription: >-
  [Partilha — folha de pagamento a herdeiro; página única retida, manuscrita, sem
  cabeçalho, data ou nome do inventariado nesta folha. Anotação marginal: "Pagamento
  ao herdeiro Simplicio José Ferreira Armond". Read from the image 2026-08-13.]

  "...vê-se o pagamento, ao herdeiro Simplicio José Ferreira Armond, casado com Dona
  Eliza Baldoina [Balbina] de Tollêdo, ao qual foram dadas as seguintes verbas: Na
  casa de morada, sómente setenta e dous mil novecentos e dez reis (72$910); no
  paiol, sómente nove mil cento e treze reis (9$113); no moinho, sómente três mil
  seiscentos e quarenta e cinco reis (3$645); nas metades dos engenho e ventilador,
  sómente quatorze mil quinhentos e oitenta e dous reis (14$582); nos três mil
  trescentos e oitenta e oito ares de terras em matta virgem, sómente cincoenta
  e um mil e trinta e sete reis (51$037); nos quarenta e cinco mil e doze ares
  de terras, em capoeiras, sómente quinhentos e [oito] mil quinhentos e quarenta e
  seis reis [uncertain: 50$546 / 508$546]; nos nove mil seiscentos e oitenta ares
  de terras..." [a folha continua / the folio continues off-page]
abstract: >-
  A single manuscript "pagamento ao herdeiro" folio from a Leopoldina (MG) Toledo
  estate-division (partilha), allotting to the heir Simplício José Ferreira Armond
  (P-0016), expressly "casado com Dona Eliza Balbina de Toledo" (P-0017), his shares
  of a fazenda: the dwelling house, the paiol (grain store), the mill, halves of the
  engenho and ventilador, and tracts of virgin forest (mata virgem) and secondary
  growth (capoeiras). Simplício inherits in right of his wife Eliza — so this is
  apparently a Toledo (maternal, in-law) estate rather than his own family's, though the
  decedent is off-page (see limitations). It independently corroborates
  his standing as a Toledo heir by marriage (previously cited only from the 1881 heir
  list PRB-0001 and the 1884 petition PRB-0002) and — if the retrieval agent's dating
  to 1919 holds — extends his documented presence from "after 1902" (NWS-0003) to c.1919.
  It does NOT name Simplício's own Armond parents, so the parentage keystone stays open.
abstract_pt: >-
  Uma única folha manuscrita de "pagamento ao herdeiro" de uma partilha de espólio
  Toledo em Leopoldina (MG), destinando ao herdeiro Simplício José Ferreira Armond
  (P-0016), expressamente "casado com Dona Eliza Balbina de Toledo" (P-0017), as suas
  quotas de uma fazenda: a casa de morada, o paiol, o moinho, as metades do engenho e
  do ventilador, e terras em matta virgem e em capoeiras. Simplício herda em direito de
  sua mulher Eliza, ou seja, trata-se de um espólio Toledo (materno, por afinidade), não
  de sua própria família. Corrobora de forma independente sua condição de herdeiro
  Toledo por casamento (antes citada apenas na lista de herdeiros de 1881, PRB-0001, e
  na petição de 1884, PRB-0002) e — se a datação de 1919 do agente de recuperação se
  confirmar — estende sua presença documentada de "depois de 1902" (NWS-0003) para
  c.1919. NÃO nomeia os pais Armond do próprio Simplício, de modo que a lacuna-chave da
  filiação permanece em aberto.
reliability:
  assessment: >-
    Direct primary evidence that Simplício José Ferreira Armond, husband of Eliza
    Balbina de Toledo, was a named heir in a Toledo estate and was allotted a share of
    a fazenda (dwelling, paiol, mill, engenho/ventilador halves, forest and capoeira
    lands). Corroborates F-0006 (the couple) and his heir-by-marriage standing.
  informant: >-
    The partidor / escrivão drawing up the folha de pagamento in the estate autos
    (Leopoldina).
  limitations: >-
    Only the single "pagamento ao herdeiro" folio is retained: the cover, opening,
    DATE, PLACE and the DECEDENT's identity are all off-page. The "1919" date and the
    "Leopoldina" place are the retrieval agent's identification of this partilha, NOT
    written on this folio, and are recorded as such. Whether Simplício was living at the
    payment date, or the share was paid to a since-deceased heir's representation, is not
    determinable from this folio alone; the "ao qual foram dadas" wording reads as a
    living named heir but is not conclusive. Several monetary figures (esp. the capoeiras
    verba) are worn and marked uncertain; the land-unit token reads "ares" (worn).
