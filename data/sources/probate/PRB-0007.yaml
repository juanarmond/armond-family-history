notes:
  - text: >-
      Retrieved 2026-08-05 as FamilySearch Full-Text image ARK 3:1:3QHJ-RQWY-RZLV
      (classified in the retrieval CSV as "Property Partition, 1876" — both
      characterisations are wrong; the image is a purchase deed dated 1862, not a
      partition, not 1876). The genealogical significance is the tighter death bound
      for Ladisláo: the previous lower bound was "before 1877" (named as "finado" in
      the 1877 Concórdia deed PRB-0004). This deed places his death before
      2 August 1862, fifteen years earlier.
  - text: >-
      Sellers are from Espírito Santo (Cachoeiro de Itapemirim comarca), not
      Toledo/Armond family members — this is a third-party sale, not an
      inter-family transfer. The Fazenda da Concórdia that Matilde acquired in
      1862 is the same estate later documented in the 1877 deed cluster
      (PRB-0003/PRB-0004) and in Matilde's 1879 estate inventory (PRB-0006).
