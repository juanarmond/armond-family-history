transcription: >-
  [Traslado da Escritura de venda — Lº 11 de Notas do 2º Off.º f. 51;
  FamilySearch ARK 3:1:3QHJ-RQWY-RZLV.]

  Traslado da Escritura de venda de uma Fazenda que Felippe Barbosa Castro e
  sua mulher fizão a Dona Mathilde Maria de Jesus e seus filhos como abaixo se
  declara:

  Escritura de venda de uma Fazenda denominada Concordia, que Felippe Barbosa
  Castro e sua mulher fazem a Dona Mathilde Maria de Jesus, viúva de Ladisláo
  Egídio Ferreira de Toledo, por si como meeira, e também como inventariante e
  cabeça do casal, em nome de todos seus filhos, pela quantia de seis contos de
  réis. Saibam quantos esta virem que no anno do Nascimento de Nosso Senhor Jesus
  Christo de mil oitocentos setenta e dois [leitura: "se tenta e dois" no original,
  consistente com 1862] aos dois dias do mez de Agosto, nesta Fazenda denominada
  Concordia, no Districto do Rio Pardo, e Serra da Cidade Leopoldina, Comarca de
  Rio Novo, Mineiras [sic], aonde foi chamado, perante mim Tabellião... vendedores:
  Felippe Barbosa Castro e sua mulher Dona Maria Francisca da [uncertain:
  Misericórdia / Apresentação / Assumpção],
  moradores na Freguesia do Alegre, da Villa de São Pedro do Cachoeiro de
  Itapemirim, sendo da Comarca do mesmo nome e Província do Espírito Santo,
  representados por seu bastante procurador José Antonio Oliveira, morador neste
  Districto... e como compradora Dona Mathilde Maria de Jesus, viúva de Ladisláo
  Egídio Ferreira [de Toledo]...

  [Nota: o manuscrito escreve "mil oitocentos se tenta e dois" que se lê como
  1862; a nota de margem no original também indica "1862 — 2 de Agosto".]
abstract: >-
  Certified copy (traslado) of the deed of sale by which Felippe Barbosa Castro
  and his wife Dona Maria Francisca da [uncertain: Misericórdia / Apresentação /
  Assumpção] (from the Comarca of
  Cachoeiro de Itapemirim, Espírito Santo) sold the Fazenda da Concórdia in the
  Districto do Rio Pardo (Leopoldina, Comarca de Rio Novo, Minas Gerais) to Dona
  Mathilde Maria de Jesus, acting as widow, estate administrator (inventariante)
  and head of the conjugal estate, on behalf of all her children, for the sum of
  six contos de réis, on 2 August 1862. Matilde is explicitly identified as the
  widow (viúva) of Ladisláo Egídio Ferreira de Toledo, establishing that Ladisláo
  died before 2 August 1862.
reliability:
  assessment: >-
    A certified copy of an original notarial deed, primary information for the
    facts it attests: the purchase date (2 August 1862), the parties, and
    Matilde's status as Ladisláo's widow. The 1862 date is confirmed by both the
    text and the margin annotation on the image. This tightens the previously
    known death bound for Ladisláo from "before 1877" (PRB-0004) to
    "before 2 August 1862."
  informant: >-
    The Tabelião (notary) of the 2º Ofício, Leopoldina, recording the deed and
    certifying the traslado.
  limitations: >-
    The year as written ("se tenta e dois") could theoretically be read as 1872,
    but the margin annotation "1862" and the chronology (Matilde already deceased
    by 1879 per PRB-0006) confirm 1862. The deed is a traslado (copy), not the
    original; the Provedoria/Juízo book location would be the original.
