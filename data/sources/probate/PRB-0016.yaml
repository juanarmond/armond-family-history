  SAIBÃO OS QUE ESTE PUBLICO INSTRUMENTO DE PROCURAÇÃO BASTANTE VIREM,
  que no anno do Nascimento de Nosso Senhor Jesus Christo de mil oitocentos {oitenta e cinco}
  aos {nove ———} dias do mez de {Junho do dito anno, nesta Cidade de
  Braga, largo de São Francisco, em meu Cartorio compareceo presente Joa-
  quina Rosa Lopes, Viuva que ficou de Bento José Fernandes, mo-
  radora no lugar de Quintaã freguezia de São Romão da Ucha, da
  Comarca de Barcellos, a qual é reconhecida das testemunhas abaixo
  nomeadas e assignadas que me afirmaram ser a propria, estas são
  reconhecidas de mim Tabellião do que dou fé. E por ella Ou-
  torgante foi dito na minha presença e das mesmas testemunhas}
  [three blank ruled lines, closed off with a pen stroke]
  {E} disse que fazia {–} seu bastante procurador {a seu filho Manoel João Fernandes
  da Cruz, Caz.do, Lavrador, morador a São João do Laranjal Provincia
  de Minas do Imperio do Brazil com poderes de substabelecer}
  [one blank ruled line]
  a quem dá poder quanto em direito se requer, para em nome d'ell{a} outorgante ,como se presen-
  te fosse , possa em qualquer tribunal d'este reino, e em todas as suas causas movidas, e por
  mover, tanto civeis como crimes em que fôr [small pen tick] author{a} ou ré , defender, e requerer toda a
  sua justiça, fasendo citar, demandar, penhorar, offerecer acções, libellos, embargos, desembargos,
  excepções, contrariar, dar provas, pôr contradictas, e suspeições, dar testemunhas, contradictar as
  das partes, jurar na sua alma todo o licito juramento, e de calumnia, decisorio, e suppletorio, e
  deixal-o na alma das partes, parecendo-lhe; assignar os termos, e autos necessarios, e de desis-
  tencia, protestos, contraprotestos, e requerimentos, nomear louvados, juizes, arbitros, e partido-
  res, desistir da intervenção do jury nos casos que julgar conveniente, assignar termos de respon-
  sabilidade, e de identidade de pessoa, de manifestos de quaesquer quantias, registo de hypothe-
  cas, e distractes das mesmas, e ratificação nas habilitações de processado em quaesquer autos,
  que d'isso careçam; appellar, aggravar, embargar, e tudo seguir até maior alçada; esta substabe-
  lecer em um ou mais procuradores, e estes em outros, e d'ella usar, assignar termos de negativa,
  louvações, tirar sentenças, dál-as á execução, receber suas competentes custas, assignar de as re-
  ceberonde [sic, run together in the print] convenha, requerer prisões, sequestros, e ar rematações [sic]; adjudicações, habilitações, jus-
  tificações, lançar nos bens dos devedores, na falta de lançador, e d'elles tomar posse; requerer
  precatorios, e mandados, e assignar de como os recebe; vir com embargos de terceiro senhor, e
  possuidor, e jural-os; variar de acções, desistir d'ellas, intentar outras de novo, assignar termos
  judiciaes nas causas crimes, ajuntar documentos, e recebel-os, reservando a nova citação, {espe-
  cialmente para receber a herança que lhe foi deixada por seu filho
  Domingos Fernandes falecido no dito lugar de São João do Laranjal
  passando recibos de tudo o que receber e uzando de todos os poderes con-}

