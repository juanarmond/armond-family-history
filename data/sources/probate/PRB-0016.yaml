schema_version: 1
id: PRB-0016
title: >-
  Amicable partilha of the estate of Domingos José Fernandes (2º Ofício of Cataguases, 4 December
  1885; sentence at Leopoldina, 12 February 1886; cumpra-se 1 March 1886): his mother Joaquina
  Rosa Lopes, resident in Portugal, acting through her son and attorney Manoel João Fernandes da
  Cruz, and his widow Maria de Jesus Crespo divide his estate of 5:691$000 in halves; with
  Joaquina's procuração made at Braga on 9 June 1885 and its Brazilian consular legalization
title_pt: >-
  Partilha amigável do espólio de Domingos José Fernandes (2º Ofício de Cataguases, 4 de dezembro
  de 1885; sentença em Leopoldina, 12 de fevereiro de 1886; cumpra-se em 1º de março de 1886): sua
  mãe Joaquina Rosa Lopes, residente em Portugal, representada por seu filho e procurador Manoel
  João Fernandes da Cruz, e sua viúva Maria de Jesus Crespo dividem ao meio o espólio de
  5:691$000; com a procuração de Joaquina lavrada em Braga em 9 de junho de 1885 e a sua
  legalização consular brasileira
record_type: >-
  Probate court proceedings — amicable partilha (partilha amigável): petition, the louvados'
  valuation list, the Renda Provincial receipt for the inheritance tax, termos of the escrivães,
  the Juiz de Direito's sentence and the cumpra-se; with the grantor's notarial procuração
  (Braga, 1885), its Porto recognition and Brazilian consular legalization, filed in the autos
record_category: court_or_probate
source_form: original
information_quality: mixed
evidence_type: direct
usage: evidence
event_date:
  kind: exact
  value: "1885-12-04"
  original_text: >-
    The petition of partilha is dated "Cataguazes, 4 de Dezembro 1885" (fl. 3v) and was
    distributed and despatched the same day ("D. ao 2.º Off.º Catag.s 4 de Dbr.º de 1885";
    "C.s, 4 de Dbr.º de 1885", fl. 2). The valuation it rests on is dated "11 de Novembro de
    1885" (fl. 4); the sentence "Leopoldina, 12 de Fevereiro de 1886" (fl. 9v); the cumpra-se
    "C.s 1º de Março 1886" (fl. 10v). The value given is the date of the petition, the act in
    which the two heirs made the division; the judicial sentence that confirmed it is 12
    February 1886. The procuração filed in the autos is dated 9 June 1885.
