transcription: |-
  [Court file of the 2º Ofício of Cataguazes: amicable partilha of the estate of Domingos José Fernandes, 4 December 1885 – 1 March 1886, with the sentence of the Juiz de Direito at Leopoldina, 12 February 1886. Fifteen page images in film order, p01–p15 = FamilySearch DGS 113082992 images 3–17 = fl. 2, 2v, 3, 3v, 4, 5, 5v, 6, 7, 7v, 8, 9, 9v, 10, 10v; the folio numbers written on the pages run in the same order as the film. Fl. 5–6 (p06–p08) are Joaquina Rosa Lopes's procuração (Braga, 9 June 1885), written in European Portuguese on a Portuguese printed form, with its Porto recognition and the Brazilian consul's legalization; they are filed in these autos between the louvados' list and the escrivão's termos. Not held: fl. 1 (the autuação, images 1–2) and image 18, access-restricted on FamilySearch; the film has no image of fl. 4v, 6v or 8v. Conventions: line breaks, spelling, capitals, accents and abbreviations as written; "=" or "-" at a line end is the scribe's hyphen; {…} marks handwriting on a printed form; "[margin: …]" gives a figure written in the margin beside that line. Expansions follow in a separate bracket at the end.]

