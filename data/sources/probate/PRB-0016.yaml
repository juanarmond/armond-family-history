abstract: >-
  Court file of the 2º Ofício of Cataguazes, Minas Gerais. By a petition dated 4 December 1885,
  "Joaquina Rosa Lopes, residente em Portugal, por seu procurador abaixo assignado, e Maria de
  Jesus Crespo residente na Freg.a de Laranjal d'este Termo, por seu marido André Teixeira Crespo
  como cabeça de casal" state that Domingos José Fernandes, "filho da primeira Supp.e e marido
  da segunda em primeiras nupcias", died on 31 January 1885 in the Freguezia de Laranjal, "lugar
  denominado S. João", "sem deixar testamento e nem herdeiros alem das Supp.es", and that they
  had agreed to divide his goods amicably. Two neighbours, Joaquim Machado dos Santos and José
  Alves Bittencourt, valued the estate on 11 November 1885 at 5:691$000 (moveis 91$000,
  semoventes 60$000, bens de raiz 5:540$000: land, coffee trees, houses, a mill, a cane
  engine); each petitioner took a meação of 2:845$500, item by item. The petition is signed "A
  rogo do procurador M.el João Fernandes da Cruz, p.r não saber escrever. Augusto de Souza
  Lobo", and for André Teixeira Crespo, who also could not write, by Francisco Antonio [or
  Antunes] Guimarães. The widow paid the half per cent inheritance tax (14$227); the Juiz de
  Direito Joaquim Canuto de Figueiredo confirmed the partilha by sentence at Leopoldina on 12
  February 1886, and the Juiz Municipal Supplente ordered it fulfilled at Cataguazes on 1 March
  1886. Filed in the autos (fl. 5–6) is Joaquina's procuração, made in the notary's cartório at
  Braga, Largo de São Francisco, on 9 June 1885: she appeared in person as "Viuva que ficou de
  Bento José Fernandes, moradora no lugar de Quintaã freguezia de São Romão da Ucha, da Comarca
  de Barcellos", identified by two witnesses, and named as her attorney "seu filho Manoel João
  Fernandes da Cruz, Caz.do, Lavrador, morador a São João do Laranjal Provincia de Minas do
  Imperio do Brazil", "especialmente para receber a herança que lhe foi deixada por seu filho
  Domingos Fernandes falecido no dito lugar de São João do Laranjal". Being unable to write, she
  had José Alexandre da Conceição sign for her. The notary's signature was recognised at Porto on
  11 June 1885, the Brazilian consul general at Porto legalized it the same day, and the
  Ministério dos Negócios Estrangeiros in Rio de Janeiro recognised the consul's signature on 19
  August 1885. The record gives no age for Joaquina.
abstract_pt: >-
  Autos do 2º Ofício de Cataguazes, Minas Gerais. Por petição datada de 4 de dezembro de 1885,
  "Joaquina Rosa Lopes, residente em Portugal, por seu procurador abaixo assignado, e Maria de
  Jesus Crespo residente na Freg.a de Laranjal d'este Termo, por seu marido André Teixeira Crespo
  como cabeça de casal" declaram que Domingos José Fernandes, "filho da primeira Supp.e e marido
  da segunda em primeiras nupcias", faleceu em 31 de janeiro de 1885 na Freguezia de Laranjal,
  "lugar denominado S. João", "sem deixar testamento e nem herdeiros alem das Supp.es", e que
  haviam acordado partilhar amigavelmente os seus bens. Dois vizinhos, Joaquim Machado dos Santos
  e José Alves Bittencourt, avaliaram o espólio em 11 de novembro de 1885 em 5:691$000 (móveis
  91$000, semoventes 60$000, bens de raiz 5:540$000: terras, pés de café, casas, um moinho, um
  engenho de cana); cada suplicante recebeu uma meação de 2:845$500, item por item. A petição é
  assinada "A rogo do procurador M.el João Fernandes da Cruz, p.r não saber escrever. Augusto de
  Souza Lobo", e, por André Teixeira Crespo, que também não sabia escrever, por Francisco Antonio
  [ou Antunes] Guimarães. A viúva pagou o imposto de meio por cento sobre o quinhão (14$227); o
  Juiz de Direito Joaquim Canuto de Figueiredo julgou a partilha por sentença em Leopoldina, em
  12 de fevereiro de 1886, e o Juiz Municipal Suplente mandou cumpri-la em Cataguazes, em 1º de
  março de 1886. Juntada aos autos (fl. 5–6) está a procuração de Joaquina, lavrada no cartório
  do tabelião em Braga, Largo de São Francisco, em 9 de junho de 1885: ela compareceu
  pessoalmente como "Viuva que ficou de Bento José Fernandes, moradora no lugar de Quintaã
  freguezia de São Romão da Ucha, da Comarca de Barcellos", reconhecida por duas testemunhas, e
  constituiu procurador "seu filho Manoel João Fernandes da Cruz, Caz.do, Lavrador, morador a São
  João do Laranjal Provincia de Minas do Imperio do Brazil", "especialmente para receber a herança
  que lhe foi deixada por seu filho Domingos Fernandes falecido no dito lugar de São João do
  Laranjal". Não sabendo escrever, fez assinar a seu rogo José Alexandre da Conceição. A
  assinatura do tabelião foi reconhecida no Porto em 11 de junho de 1885, o cônsul-geral do
  Brasil no Porto legalizou-a no mesmo dia, e o Ministério dos Negócios Estrangeiros, no Rio de
  Janeiro, reconheceu a assinatura do cônsul em 19 de agosto de 1885. O registro não dá a idade
  de Joaquina.
reliability:
  assessment: >-
    Original court autos written in the course of the case by the escrivães, the judges and the
    Collectoria: direct primary evidence of the partilha, the valuation, the shares, the tax and
    the sentence. The petition's statements of kinship and of Domingos's death (date, place,
    intestacy, sole heirs) are made by his mother, through her attorney, and by his widow,
    through her husband, ten months after the death; they are close-kin statements in a court
    filing, not a death register. The procuração is an original Portuguese notarial instrument:
    direct primary evidence that Joaquina Rosa Lopes, widow of Bento José Fernandes, appeared in
    person at Braga on 9 June 1885, of her lugar and parish, and of her naming her son Manoel
    João as attorney; what it says of Manoel João's status and Brazilian residence was supplied
    by her, from a distance.
  informant: >-
    The petitioners Joaquina Rosa Lopes (through her son and attorney Manoel João Fernandes da
    Cruz, who signed a rogo by Augusto de Souza Lobo) and Maria de Jesus Crespo (through her
    husband André Teixeira Crespo, signed a rogo by Francisco Antonio/Antunes Guimarães); the
    louvados Joaquim Machado dos Santos and José Alves Bittencourt; the escrivães Antonio
    Januario de Miranda Carneiro (Cataguazes) and José Francisco Bernhauss (Leopoldina); the
    Collectoria Municipal; the judges. For the procuração: Joaquina herself, before the Braga
    tabelião José Luiz d'Oliveira Pessa [uncertain], identified by the witnesses Manoel José
    Rodrigues de Macedo and Domingos José Loureiro.
  limitations: >-
    Fl. 1 (the autuação, images 1–2) and image 18 are access-restricted and unread; the film holds
    no image of fl. 4v, 6v or 8v. No age is given for Joaquina or anyone else, and no parents of
    Domingos other than his mother are named. The petition's "sem deixar testamento" stands
    against the will Domingos made in 1884 (a separate record, reported annulled by the court
    on 24 September 1885). The tax receipt garbles the widow's name ("D.a Maria Joaquina [?]
    Jesus Crespo"), and the petition miswrites two items (house "des=zentos"; "onze mil" coffee
    trees for 14,000). Peripheral readings are uncertain: the distribuidor's note, the
    despacho's rubric, a proxy's surname (Antonio / Antunes), the louvados' place-name
    (Lorangel), the Collectoria officers, the witness Loureiro's lugar and parish, the notary's
    forename and surname, and the Supplente's signature (Medina).
