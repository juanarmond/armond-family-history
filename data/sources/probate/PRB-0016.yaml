notes:
- text: >-
    Page order. The fifteen images are catalogued in film order (DGS 113082992 images 3–17), and
    the folio numbers written on the pages run in the same order: fl. 2 (p01), 3 (p03), 4 (p05),
    5 (p06, beside the pencil "Vieira e Leão"), 6 (p08), 7 (p09), 8 (p11), 9 (p12) and 10 (p14),
    with unnumbered versos between. The procuração (p06–p08) is therefore fl. 5–6 of these autos,
    between the louvados' list (fl. 4) and the escrivão's note of 4 December 1885 (fl. 7); it
    was presumably filed with the petition as one of "os documentos que a acompanhão"
    [inferred]. The retrieval side's three procuração files are images 8–10 of the same film.
    Not held: fl. 1 (images 1–2, the autuação) and image 18, both access-restricted; the film
    has no image of fl. 4v, 6v or 8v.
  text_pt: >-
    Ordem das páginas. As quinze imagens estão catalogadas na ordem do filme (DGS 113082992,
    imagens 3–17), e os números de folha escritos nas páginas seguem a mesma ordem: fl. 2 (p01),
    3 (p03), 4 (p05), 5 (p06, ao lado do lápis "Vieira e Leão"), 6 (p08), 7 (p09), 8 (p11), 9
    (p12) e 10 (p14), com versos sem número entre elas. A procuração (p06–p08) é, portanto, as
    fl. 5–6 destes autos, entre a lista dos louvados (fl. 4) e a cota do escrivão de 4 de
    dezembro de 1885 (fl. 7); foi presumivelmente juntada com a petição como um dos "documentos
    que a acompanhão" [inferido]. Os três arquivos da procuração do lado da recuperação são as
    imagens 8–10 do mesmo filme. Não disponíveis: a fl. 1 (imagens 1–2, a autuação) e a imagem
    18, ambas de acesso restrito; o filme não tem imagem das fl. 4v, 6v ou 8v.
- text: >-
    Language. The court acts (fl. 2–4 and 7–10v) are in Brazilian Portuguese. The procuração (fl.
    5–5v) is a Portuguese notarial instrument in European Portuguese, on a printed form of the
    Portuguese stamp-tax ("IMPOSTO DO SELLO · 60 REIS") with a Porto recognition; fl. 6 is a
    printed form of the Brazilian consulate general at Porto, with a manuscript note of the
    Ministério dos Negócios Estrangeiros at Rio de Janeiro.
  text_pt: >-
    Idioma. Os atos judiciais (fl. 2–4 e 7–10v) estão em português do Brasil. A procuração (fl.
    5–5v) é um instrumento notarial português, em português europeu, num formulário impresso do
    imposto do selo português ("IMPOSTO DO SELLO · 60 REIS"), com reconhecimento no Porto; a fl.
    6 é um formulário impresso do consulado-geral do Brasil no Porto, com uma nota manuscrita do
    Ministério dos Negócios Estrangeiros no Rio de Janeiro.
- text: >-
    The lugar is written exactly "Quintaã" (fl. 5, line 6: "moradora no lugar de Quintaã
    freguezia de São Romão da Ucha"): two a's, with the tilde on the second, i.e. Quintã. It was
    read at about 3× zoom. Other records of the family write the same lugar Quintã / Quintãa /
    Quintam / Quintão / Quintaõ; this one supports the Quintã form.
  text_pt: >-
    O lugar está escrito exatamente "Quintaã" (fl. 5, linha 6: "moradora no lugar de Quintaã
    freguezia de São Romão da Ucha"): dois "a", com o til sobre o segundo, isto é, Quintã. Foi
    lido com ampliação de cerca de 3×. Outros registros da família escrevem o mesmo lugar Quintã
    / Quintãa / Quintam / Quintão / Quintaõ; este sustenta a forma Quintã.
- text: >-
    Identification. Joaquina Rosa Lopes is P-0142: the procuração names her as the widow of Bento
    José Fernandes (P-0141), of the lugar de Quintã, São Romão da Ucha, Comarca de Barcellos, and
    as the mother of Manoel João Fernandes da Cruz (P-0139) and of Domingos. The match rests on
    the names of husband and son together with the lugar and parish, and it is strong, not
    proven. Manoel João Fernandes da Cruz is P-0139 by his full name, his being her son, and his
    residence at São João do Laranjal, Minas. The partilha itself names Joaquina only as
    "residente em Portugal" and mother of Domingos; the link to Ucha comes from the procuração
    filed in the same autos. Bento appears only as her late husband.
  text_pt: >-
    Identificação. Joaquina Rosa Lopes é P-0142: a procuração a nomeia viúva de Bento José
    Fernandes (P-0141), do lugar de Quintã, São Romão da Ucha, Comarca de Barcellos, e mãe de
    Manoel João Fernandes da Cruz (P-0139) e de Domingos. A identificação assenta nos nomes do
    marido e do filho, junto com o lugar e a freguesia; é forte, não provada. Manoel João
    Fernandes da Cruz é P-0139 pelo nome completo, por ser filho dela e pela residência em São
    João do Laranjal, Minas. A partilha em si nomeia Joaquina apenas como "residente em
    Portugal" e mãe de Domingos; o vínculo com Ucha vem da procuração juntada aos mesmos autos.
    Bento aparece apenas como seu falecido marido.
- text: >-
    What the record adds. (1) Bento José Fernandes was dead by 9 June 1885 ("Viuva que ficou de
    Bento José Fernandes"), and his full name is attested. (2) Joaquina was alive and appeared in
    person at Braga on 9 June 1885; she lived at the lugar de Quintã, São Romão da Ucha, and
    could not write. No age is stated. (3) Manoel João Fernandes da Cruz was married, a lavrador,
    and living at São João do Laranjal, Minas, by June 1885 (his mother's statement); he could
    not write (fl. 3v). (4) Domingos José Fernandes ("Domingos Fernandes" in the procuração),
    Joaquina's son, died on 31 January 1885 at the lugar of S. João, Freguezia de Laranjal, Termo
    de Cataguazes; the only heirs were his mother and his widow, so he left no surviving issue
    [inferred from "nem herdeiros alem das Supp.es"]. He is a collateral of the direct line and
    could be recorded as a documented child of F-0071 citing this source. (5) His widow was
    Maria de Jesus Crespo. She was married again by December 1885, to André Teixeira Crespo, who
    acts "como cabeça de casal" [inferred from "marido da segunda em primeiras nupcias"]. (6) The
    estate and its division, given in the abstract. (7) Domingos's estate went half to his mother
    by law; the procuração's "herança que lhe foi deixada" does not say whether by will or by law.
  text_pt: >-
    O que o registro acrescenta. (1) Bento José Fernandes já era falecido em 9 de junho de 1885
    ("Viuva que ficou de Bento José Fernandes"), e o seu nome completo fica atestado. (2) Joaquina
    estava viva e compareceu pessoalmente em Braga em 9 de junho de 1885; morava no lugar de
    Quintã, São Romão da Ucha, e não sabia escrever. A idade não é declarada. (3) Manoel João
    Fernandes da Cruz era casado, lavrador, e morava em São João do Laranjal, Minas, em junho de
    1885 (declaração de sua mãe); não sabia escrever (fl. 3v). (4) Domingos José Fernandes
    ("Domingos Fernandes" na procuração), filho de Joaquina, faleceu em 31 de janeiro de 1885 no
    lugar de S. João, Freguezia de Laranjal, Termo de Cataguazes; os únicos herdeiros eram a mãe
    e a viúva, de modo que não deixou descendência viva [inferido de "nem herdeiros alem das
    Supp.es"]. É um colateral da linha direta e pode ser registrado como filho documentado de
    F-0071, citando esta fonte. (5) A viúva era Maria de Jesus Crespo. Em dezembro de 1885 já
    estava casada de novo, com André Teixeira Crespo, que age "como cabeça de casal" [inferido de
    "marido da segunda em primeiras nupcias"]. (6) O espólio e a sua divisão, dados no resumo.
    (7) Metade do espólio de Domingos foi para a mãe por lei; a "herança que lhe foi deixada" da
    procuração não diz se por testamento ou por lei.
- text: >-
    Differences from the retrieval side's draft (joaquina-rosa-lopes.md §7.1–7.3), checked on the
    images. (a) The louvados' list (fl. 4) is dated "Sam João de Lorangel" [uncertain], not
    "Sorongol": the place-name's initial has the same looped form as this writer's L in "Lista"
    and "Louvados", and the word is evidently São João do Laranjal spelt by ear [inferred].
    (b) §7.2 says the "retro" signature recognised by the consul is on a page "not in this set";
    it is fl. 5v (p07), where Eduardo Augusto [Domingues], tabellião interino at Porto, signed the
    recognition of 11 June 1885. (c) The scribe's slip on fl. 2v is "des=zentos", not
    "dez=zentos". (d) "enginho de canas" on fl. 2v reads "engenho" or "ingenho" [uncertain]. (e)
    The heading of fl. 4 reads "Lista Da Bens deixados pelo falecido", not "Lista do Bens …
    fallecido". (f) The first margin fee on fl. 7 reads 300, not 200 [uncertain]. (g) The proxy
    signs "Fran.co [Antonio or Antunes] Guim.es"; the forename-like reading Antonio fits the
    letters at least as well as Antunes. (h) The receipt's officers read "Rufino / Delfino" and
    "Quintas / Freitas", all uncertain. Otherwise the draft is confirmed, including the
    attorney's description, the amounts, the dates and the a rogo signature on fl. 3v.
  text_pt: >-
    Diferenças em relação ao rascunho do lado da recuperação (joaquina-rosa-lopes.md §7.1–7.3),
    conferidas nas imagens. (a) A lista dos louvados (fl. 4) é datada "Sam João de Lorangel"
    [incerto], não "Sorongol": a inicial do topônimo tem a mesma forma laçada do L deste
    escrevente em "Lista" e "Louvados", e a palavra é evidentemente São João do Laranjal escrito
    de ouvido [inferido]. (b) O §7.2 diz que a assinatura "retro" reconhecida pelo cônsul está
    numa página "fora deste conjunto"; está na fl. 5v (p07), onde Eduardo Augusto [Domingues],
    tabelião interino no Porto, assinou o reconhecimento de 11 de junho de 1885. (c) O lapso do
    escrevente na fl. 2v é "des=zentos", não "dez=zentos". (d) O "enginho de canas" da fl. 2v
    lê-se "engenho" ou "ingenho" [incerto]. (e) O cabeçalho da fl. 4 diz "Lista Da Bens deixados
    pelo falecido", não "Lista do Bens … fallecido". (f) O primeiro emolumento na margem da fl. 7
    lê-se 300, não 200 [incerto]. (g) O procurador a rogo assina "Fran.co [Antonio ou Antunes]
    Guim.es"; a leitura Antonio, como prenome, cabe nas letras pelo menos tão bem quanto
    Antunes. (h) Os funcionários do recibo leem-se "Rufino / Delfino" e "Quintas / Freitas",
    todos incertos. No mais, o rascunho se confirma, inclusive a descrição do procurador, os
    valores, as datas e a assinatura a rogo da fl. 3v.
- text: >-
    Conflicts and slips kept as written. The petition's "sem deixar testamento" (fl. 2) stands
    against the will Domingos made at Monte Alegre in 1884; the retrieval side reports, from that
    will's own autos (a separate record, not held here), that the court declared it null on 24
    September 1885 for passing over his living mother as forced heir. The receipt (fl. 8) writes
    the payer "D.a Maria Joaquina [a / e / de] Jesus Crespo", evidently the widow Maria de Jesus
    Crespo with "Joaquina" intruded [inferred]. The conclusão on fl. 10v is dated "Ao primeiro de
    Fevereiro de 1886", but it follows the data of 24 February and precedes the cumpra-se of 1
    March, so it is a slip for March [inferred].
  text_pt: >-
    Conflitos e lapsos mantidos como escritos. O "sem deixar testamento" da petição (fl. 2)
    contraria o testamento que Domingos fez em Monte Alegre em 1884; o lado da recuperação
    relata, a partir dos próprios autos desse testamento (registro à parte, não incluído aqui),
    que o juízo o declarou nulo em 24 de setembro de 1885 por ter preterido a mãe viva, herdeira
    forçada. O recibo (fl. 8) escreve a pagadora "D.a Maria Joaquina [a / e / de] Jesus Crespo",
    evidentemente a viúva Maria de Jesus Crespo, com "Joaquina" intrometido [inferido]. A
    conclusão da fl. 10v é datada "Ao primeiro de Fevereiro de 1886", mas vem depois da data de
    24 de fevereiro e antes do cumpra-se de 1º de março, de modo que é um lapso por março
    [inferido].
- text: >-
    Not stated here, and not to be modelled from this record. The retrieval side suggests that the
    widow Maria de Jesus Crespo is Manoel João's daughter "D. Maria de Jesus da Conceição casada
    com André Teixeira Crespo" of the 1898 Muriaé inventário, so that Domingos married his niece.
    This record gives no parentage for her; the identification is a lead to test, not a fact. The
    appraiser José Alves Bittencourt ("Joze Alves Bitencourt" on fl. 4) is called only a
    neighbour; no kinship to the Muniz Bittencourt line is stated, and none should be inferred
    from the surname.
  text_pt: >-
    Não declarado aqui, e não deve ser modelado a partir deste registro. O lado da recuperação
    sugere que a viúva Maria de Jesus Crespo seja a filha de Manoel João "D. Maria de Jesus da
    Conceição casada com André Teixeira Crespo" do inventário de Muriaé de 1898, de modo que
    Domingos teria se casado com a sobrinha. Este registro não dá a filiação dela; a
    identificação é uma pista a testar, não um fato. O avaliador José Alves Bittencourt ("Joze
    Alves Bitencourt" na fl. 4) é dito apenas vizinho; nenhum parentesco com a linha Muniz
    Bittencourt é declarado, e nenhum deve ser inferido do sobrenome.
