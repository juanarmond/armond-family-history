notes:
- text: >-
    The act spans several images; the parentage rests on two folios — folio 8 (the
    heir #4 header "José Cezario de Tolledo Lima ⚭ D. Claudina … seus reprezentantes")
    and folio 9 (the ELIZA page, "5º Simplicio José Ferreira Armond, cazado com D.
    Eliza Balbina de Tolledo"). folio 6 (juramento) establishes the deceased is
    Mathilde and the inventariante is her son Cezário José de Toledo — a person
    distinct from heir #4 José Cezário de Toledo Lima (the near-identical names are a
    documented trap). The whole título de herdeiros is now held under this ID as one
    continuous run — folios 6, 7, 7v, 8, 8v, 9, 9v and 10 (files …-folio6-…, …-folio7-…,
    …-folio7v-…, …-folio8-…, …-folio8v-…, …-folio9-…, …-folio9v-…, …-folio10-…).
- text: >-
    PRB-0004 (1877 deed) had left open a hypothesis that Eliza's parents were Antonio
    Zeferino de Toledo × Maria Perpétua. This inventory shows that couple is heir #3
    (folio 8 header "de M.a Perpetua nº 3") — they are NOT Eliza's parents. The
    document also resolves the two same-named Ladisláo Egydio Ferreira de Toledo: the
    elder is Mathilde's husband (P-0056); the "solteiro de 23 annos" on folio 9 is
    heir #4's son — Eliza's brother, not a separate person.
- text: >-
    p5b data (now catalogued as evidence page folio 9v,
    PRB-0006-matilde-toledo-inventario-1879-leopoldina-folio9v-heir5-6.jpg; read
    2026-08-07, re-confirmed 2026-08-12 and folded into the transcription): heir #5 =
    D. Carolina Leopoldina Marques (already deceased at the time, notation "Palleceo" in
    the margin), wife of Narciso Marques Braz. Her six named representantes are: 1º D.
    Maria da Gloria Marques, cazada com Antonio Marques
    Pereira; 2º Herculano Ernesto Marques, solteiro, de 26 anos; 3º Octaviano
    Marques Braz, cazado com D. Amelia Baldoina de Tolledo; 4º Alda Clothilde
    Marques, cazada com Aurelio Ferreira Pinto; 5º D. Sophia Olympia Marques,
    cazada com Joaquim Dias de Medeiros; 6º D. Hortencia Cecilia Marques, solteira,
    de 15 anos. — Heir #6 = Aureliano de Salles Tolledo, "cazado que foi com D.
    Marianna Euphragia de Tolledo, já fallecida"; resident at S. Sebastião dos
    Aflitos, termo de Santa Rita do Turvo. CONFLICT: the F-0027 documented_child
    entry for Aureliano reads "married Marciana Espro[n?]de de Toledo" (sourced from
    PRB-0009). P5b gives "Marianna Euphragia de Tolledo" as the wife name — a
    primary source reading from this very inventory. The PRB-0009 read may have been
    a misread or the two could name different marriages (Aureliano widowed and
    remarried); requires checking PRB-0009 again directly. Flagged for resolution.
- text: >-
    Capitão Manoel Rodrigues de Lima (São José d'El Rei) relationship (2026-08-08,
    from matilde-1879-part01-pp001-092.md transcript, pp.154–155): a certidão at
    those pages records the Capitão donating the enslaved woman Martinha to "minha
    sobrinha Mathilde Maria de Jesus" — making Mathilde his niece. The Capitão states
    he bought Martinha from "minha [irmã?] Dona Francisca de Lima"; if "irmã" (sister)
    is the correct reading, Francisca de Lima is his sister and Mathilde's mother,
    corroborating Ignez Francisca de Lima (P-0060) as Mathilde's mother (F-0029).
    The "[maã?/irmã?]" word is uncertain in the transcript; image verification required.
- text: >-
    Drop-page reconciliation (sha256 audit, 2026-08-12): the título-de-herdeiros scan
    set rec-toledo-matilde-inventario-1879-titulo-herdeiros-p0…p6 was reconciled against
    this source. Pages p1 (folio 7), p2 (folio 7v), p4 (folio 8v), p5b (folio 9v, a
    higher-resolution recapture of the heir #5–6 folio) and p6 (folio 10) were
    substantive and added; p3 and p5-ELIZA were already linked (folio 8 and folio 9).
    Page p0 was reviewed and EXCLUDED: it is a near-blank verso (only faint
    bleed-through from the other side, no recto text), not a document folio.
