transcription: >-
  [Inventário de Dona Mathilde Maria de Jesus, Leopoldina (MG), 1879; título de
  herdeiros. Os folios do título de herdeiros estão agora catalogados de ponta a ponta
  e transcritos em ordem de leitura: folio 6 (juramento do inventariante) → folio 7
  (conclusão do juramento e assinatura do inventariante; abertura do "Título de
  herdeiros"; herdeiros nº 1–2) → folio 7v (herdeiro nº 2 concluído; cabeçalho do
  herdeiro nº 3) → folio 8 (representantes do nº 3 ao topo; cabeçalho do nº 4 ao pé) →
  folio 8v (representantes do nº 4, 1º–3º) → folio 9 (representantes do nº 4, 4º–8º,
  entre eles Eliza; cabeçalho do nº 5) → folio 9v (representantes do nº 5; herdeiro nº 6)
  → folio 10 (herdeiros nº 7–8; Conclusão; Data, 30 Abril 1879). O inventariante é
  [uncertain: Cazario / Cezario] José de Tolledo, filho da finada e ele próprio o
  herdeiro nº 7 — pessoa DISTINTA do herdeiro nº 4 "José Cezário de Toledo Lima". Folios
  6, 8 e 9 lidos e promovidos em ago. 2026; folios 7, 7v, 8v, 9v e 10 reconciliados do
  drop (auditoria sha256) e acrescentados em 2026-08-12.]


  [folio 6 — Juramento ao inventariante (28 April 1879):] "Aos vinte oito dias do mez
  de Abril de mil oitocentos e setenta e nove, n'esta Cidade Leopoldina, em a rezidencia
  do Doutor Fernando Pinheiro de Souza Tavares, Juiz dos orfãos do Termo, sendo ahi
  compareceo [uncertain: Cazario / Cezario] José de Tolledo, a quem o Juiz deferio o
  juramento dos Santos Evangelhos na forma da Lei, encarregando-lhe de bem e fielmente
  servir o Cargo de inventariante dos bens deixados por sua finada mãe Dona Mathilde —
  digo — Maria de Jesus, fazendo todas as declarações legaes, e dando a descrição,
  [uncertain: carregação / arrecadação] e avaliação todos os bens deixados sem occultar
  nenhum, debaixo das penas de perjurio e de perder o dobro do valor dos que por ventura
  sonega; e recebido por elle o juramento assim" [a fórmula do juramento termina ao pé do
  folio 6; a conclusão e a assinatura do inventariante seguem no folio 7.]


  [folio 7 — conclusão do juramento:] "...os bens deixados são os que hia dar á
  descripção, e que promettia, debaixo do juramento prestado, apresentar todos elles; e
  de como assim o disse, abaixo assigna-se. Eu, Francisco Fortes de Bustamante,
  Escrevente juramentado, que o escrevi. E eu, Antonio [Carlos] da Costa Carvalho,
  Escrivão, [o subs]crevi." [Assinatura do inventariante:] "Cezario Joze de Toledo".


  [folio 7 — abertura do "Título de herdeiros":] "Título de herdeiros. Inventariante —
  nomeado pelo Juizo — Cezario José de Tolledo. Herdeiros: 1º D. Ignez Umbelina de
  Tolledo, cazada com José Pedro da Silva, que se acha auzente, rezidindo no Termo da
  Cidade do Bom-Fim; 2º Francisco [Leocadio] [continua no folio 7v]".


  [folio 7v — herdeiro nº 2 concluído e cabeçalho do herdeiro nº 3:] "[Francisco]
  Leocadio de Tolledo, viuvo que é da finada D. Maria Joaquina de Jezus. [3º] D. Maria
  Perpetua da Silva, cazada que foi com Antonio Zeferino de Tolledo, ambos fallecidos,
  dos quaes são seos reprezentantes os seguintes filhos: 1º Neto — D. Maria Carolina de
  Tolledo, fallecida e cazada que era com João Guilherme da Silva, sendo seos
  reprezentantes: 1º [à margem: Falleceo] D. Maria Perpetua da Silva, cazada com Joaquim
  Manoel Pedroza, rezidente em Entre-Folhas; 2º D. Anna Candida da Silva, cazada com
  Joaquim Francisco de Oliveira; 3º D. Eudoxia Engracia da Silva, solteira, de 14 annos
  de idade [continua no folio 8]".


  [folio 8 recto, ao topo — sob o cabeçalho "de M.ª Perpetua nº 3", a continuação
  dos reprezentantes do herdeiro nº 3 (o casal Antonio Zeferino de Toledo × Maria
  Perpétua), numerados 2º–6º:] "2º D. Marianna Claudina de Tolledo, cazada que foi
  com Francisco Mendes Ferreira, já fallecido; 3º Carolina Baldoina de Tolledo,
  cazada com Severino Ignacio Monteiro; 4º Antonio Augusto de Tolledo, cazado com
  Philomena Euphrazia de Jezus; 5º D. Francisca Emilia de Tolledo, cazada com José
  Mendes Ferreira Junior; 6º D. Josephina [uncertain: Gueralina / Guerulina] de
  Tolledo, cazada com Manoel Joaquim da Silva." [Segue, ao pé do mesmo folio, o
  cabeçalho do herdeiro nº 4:]


  [folio 8, ao pé, cabeçalho do herdeiro nº 4:] "4º José Cezario de Tolledo Lima,
  fallecido, cazado que foi com D. Claudina, tambem fallecida, dos quaes são seus
  reprezentantes:" — [folio 8v] "1º D. Maria Dulcelina de Toledo, solteira, de trinta
  e tantos annos; 2º D. Mathildes Olympia da Paixão, viuva do finado Manoel Antonio
  Caza[nna?]; 3º D. Josephina Christina da Silva Lima, fallecida, cazada que foi com
  Aureliano Christino da Silva Lima, que ainda vive e mora no Termo do Rio Novo, no
  lugar denominado Piau, sendo seus filhos 1º Cezario da Silva Lima, de 10 annos, 2º
  D. Joanna da Silva Lima, de 8 annos [...]; [folio 9] 4º Maria Bulandina de Toledo,
  cazada com Manoel Marques Jorge; 5º Simplicio José Ferreira Armond, cazado com D.
  Eliza Balbina de Tolledo; 6º Ladisláo Egydio Ferreira de Tolledo, solteiro, de 23
  annos; 7º Geraldo Augusto de Tolledo Lima, solteiro, de 15 annos, residente na
  côrte, empregado em uma caza de negocio sita á rua do Visconde de Itaúna nº 74; 8º
  Josepha Olympia da Paixão, solteira, de 12 annos de idade." — [segue, ao pé do folio 9,
  o cabeçalho do herdeiro nº 5:] "5º D. Carolina Leopoldina Marques, cazada com Narciso
  Marques Braz, sendo a mesma já fallecida, sendo seus reprezentantes: 1º D. Maria
  [continua no folio 9v]".


  [folio 9v — representantes do herdeiro nº 5 e cabeçalho do herdeiro nº 6:] "[1º D.
  Maria] da Gloria Marques, cazada com Antonio Marques Pereira; 2º [à margem: Falleceo]
  Herculano Ernesto Marques, solteiro, de 26 annos; 3º Octaviano Marques Braz, cazado com
  D. Amelia Baldoina de Tolledo; 4º Alda Clothilde Marques, cazada com Aurelio Ferreira
  Pinto; 5º D. Sophia Olympia Marques, cazada com Joaquim Dias de Medeiros; 6º D.
  Hortencia Cecilia Marques, solteira, de 15 annos. [herdeiro nº 6:] 6º Aureliano de
  Salles Tolledo, cazado que foi com D. Marianna [uncertain: Euphrazia] de Tolledo, já
  fallecida, [residente em] S. Sebastião dos Aflictos, termo de Santa Rita do Turvo."


  [folio 10 — herdeiros nº 7 e nº 8; Conclusão; Data:] "7º Cezario José de Tolledo,
  cazado com D. Maria José de Jezus [— o próprio inventariante]; 8º Antonio Ladislão de
  Tolledo, cazado que foi com D. Maria Euphrazia de Jezus, já fallecida [uncertain:
  'Mudo']." [Conclusão:] "E logo faço estes autos conclusos ao Meritíssimo Dr. Juiz dos
  orfãos do Termo. Eu, Antonio Carlos da Costa Carvalho, Escrivão, o escrevi." [Data:]
  "Aos trinta dias do mez de Abril de mil oitocentos e setenta e nove, forão-me entregues
  estes autos com despacho, por se achar o Meritíssimo Senhor Doutor Juiz dos orfãos em
  pleno exercício da vara de Direito; e faço este termo. Eu [...]."
abstract: >-
  Mathilde Maria de Jesus's 1879 Leopoldina estate inventory (título de herdeiros).
  Heir #4 is her deceased son José Cezário de Toledo Lima (P-0054) × Claudina
  (P-0055); their eight representantes (children) are listed at folios 8–9. Item 5
  reads "5º Simplicio José Ferreira Armond, cazado com D. Eliza Balbina de Tolledo."
  Per 19th-century Brazilian inheritance law, a married woman appeared in estate
  proceedings through her husband as legal representative; Simplício is named first as
  Eliza's legal actor — Eliza Balbina de Toledo (P-0017) is the actual heir, confirmed
  as JC's daughter by the Film 2 triage of the 919-page FOCUSED PDF (2026-08-07).
  Corrects the pre-August 2026 hypothesis that Eliza's parents were Antonio Zeferino
  de Toledo × Maria Perpétua (PRB-0004): that couple is heir #3 ("de M.a Perpetua
  nº 3") — Eliza's uncle/aunt, not her parents. NOTE: the "Simplício José Ferreira de
  Toledo, solteiro, 14 anos" in the two 1867 inventários (PRB-0008, PRB-0009, item 6)
  is JC's OWN SON with the Toledo surname — a DIFFERENT person from our Simplício
  Armond (who has the Armond surname and is Eliza's husband, not JC's child).
  A prior session (7 August 2026) misread item 5 as naming Simplício Armond as heir
  (wrongly concluding P-0016 = JC's son and Eliza's parentage as unresolved);
  that error is corrected here.
abstract_pt: >-
  O inventário de bens de Mathilde Maria de Jesus, em Leopoldina em 1879 (título de
  herdeiros). O herdeiro nº 4 é seu filho falecido José Cezário de Toledo Lima
  (P-0054) × Claudina (P-0055); seus oito representantes (filhos) estão arrolados nos
  fólios 8–9. O item 5 diz "5º Simplicio José Ferreira Armond, cazado com D. Eliza
  Balbina de Tolledo". Segundo o direito sucessório brasileiro do século XIX, uma
  mulher casada figurava nos autos por meio do marido como representante legal;
  Simplício é nomeado primeiro como o agente legal de Eliza — Eliza Balbina de Toledo
  (P-0017) é a herdeira de fato, confirmada como filha de JC pela triagem do Film 2 do
  PDF FOCUSED de 919 páginas (2026-08-07). Corrige a hipótese anterior a agosto de
  2026 de que os pais de Eliza eram Antonio Zeferino de Toledo × Maria Perpétua
  (PRB-0004): esse casal é o herdeiro nº 3 ("de M.a Perpetua nº 3") — tio/tia de
  Eliza, não seus pais. NOTA: o "Simplício José Ferreira de Toledo, solteiro, 14 anos"
  nos dois inventários de 1867 (PRB-0008, PRB-0009, item 6) é o PRÓPRIO FILHO de JC,
  com o sobrenome Toledo — uma pessoa DIFERENTE do nosso Simplício Armond (que tem o
  sobrenome Armond e é o marido de Eliza, não filho de JC). Uma sessão anterior (7 de
  agosto de 2026) leu erroneamente o item 5 como nomeando Simplício Armond como
  herdeiro (concluindo equivocadamente que P-0016 = filho de JC e que a filiação de
  Eliza estava em aberto); esse erro é corrigido aqui.
reliability:
  assessment: >-
    Direct primary evidence (a judicial estate inventory) confirming Eliza Balbina
    de Toledo (P-0017) as a daughter of JC × Claudina, and Simplício José Ferreira
    Armond (P-0016) as her husband. Resolves the two-Ladisláo ambiguity (elder
    Ladisláo Egydio Ferreira de Toledo is Mathilde's husband; namesake grandson aged
    23 is heir #4's son). The 1867 inventários (PRB-0008, PRB-0009) confirm JC had a
    SON also named "Simplício de Toledo" (item 6, solteiro, 14 anos) who died before
    1879 — this person is DISTINCT from our Simplício Armond.
  informant: >-
    The inventariante Cezário José de Toledo (Mathilde's son) and the court, 1879
    (a distinct person from heir #4 José Cezário de Toledo Lima).
  limitations: >-
    Multi-folio handwritten process; some collateral names are uncertain reads (e.g.
    "Bulandina/Brandina", "Cazanna", Aureliano's late wife "Marianna [Euphrazia] de
    Toledo"). The full título de herdeiros — folios 6–10 — is now catalogued (the
    juramento's conclusion and the inventariante's signature, which folio 6 leaves
    mid-oath, are on folio 7), and Mathilde's eight heirs (nº 1 Ignez Umbelina; nº 2
    Francisco Leocádio, alive; nº 3 Maria Perpétua × Antonio Zeferino; nº 4 José Cezário
    de Toledo Lima × Claudina; nº 5 Carolina Leopoldina Marques; nº 6 Aureliano de Salles
    Toledo; nº 7 the inventariante Cezário José de Toledo; nº 8 Antonio Ladislão de
    Toledo) are all transcribed here. The full monte-mór and per-heir shares remain
    elsewhere in the 919-page process. The legal-representative pattern (husband named
    first for a married female heir) must be read in context of 19th-century Brazilian
    law; the Film 2 triage of the full 919-page FOCUSED PDF confirmed Eliza as the heir
    in item 5.
