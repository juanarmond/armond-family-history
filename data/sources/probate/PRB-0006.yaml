transcription: >-
  [Inventário de Dona Mathilde Maria de Jesus, Leopoldina (MG), 1879; título de
  herdeiros. Três imagens catalogadas: folio 6 (juramento do inventariante), folio 8
  (cabeçalho do herdeiro nº 4) e folio 9 (os herdeiros de JC). O inventariante é
  [uncertain: Cazario / Cezario] José de Tolledo, filho da finada — pessoa DISTINTA do
  herdeiro nº 4 "José Cezário de Toledo Lima". Folio 6 transcribed 2026-08-07 from
  direct image read (PRB-0006-matilde-toledo-inventario-1879-leopoldina-folio6-juramento.jpg).]


  [folio 6 — Juramento ao inventariante (28 April 1879):] "Aos vinte oito dias do mez
  de Abril de mil oitocentos e setenta e nove, n'esta Cidade Leopoldina, em a rezidencia
  do Doutor Fernando Pinheiro de Souza Tavares, Juiz dos orfãos do Termo, sendo ahi
  compareceo [uncertain: Cazario / Cezario] José de Tolledo, a quem o Juiz deferio o
  juramento dos Santos Evangelhos na forma da Lei, encarregando-lhe de bem e fielmente
  servir o Cargo de inventariante dos bens deixados por sua finada mãe Dona Mathilde —
  digo — Maria de Jesus, fazendo todas as declarações legaes, e dando a descrição,
  [uncertain: carregação / arrecadação] e avaliação todos os bens deixados sem occultar
  nenhum, debaixo das penas de perjurio e de perder o dobro do valor dos que por ventura
  sonega; e recebido por elle o juramento assim" [oath formula ends mid-sentence at bottom
  of folio; conclusion and inventariante's signature are on folio 7, which is not catalogued.]


  [folio 8, ao pé, cabeçalho do herdeiro nº 4:] "4º José Cezario de Tolledo Lima,
  fallecido, cazado que foi com D. Claudina, tambem fallecida, dos quaes são seus
  reprezentantes:" — [folio 8v] "1º D. Maria Dulcelina de Toledo, solteira, de trinta
  e tantos annos; 2º D. Mathildes Olympia da Paixão, viuva do finado Manoel Antonio
  Caza[nna?]; 3º D. Josephina Christina da Silva Lima, fallecida, cazada que foi com
  Aureliano Christino da Silva Lima, que ainda vive e mora no Termo do Rio Novo, no
  lugar denominado Piau, sendo seus filhos 1º Cezario da Silva Lima, de 10 annos, 2º
  D. Joanna da Silva Lima, de 8 annos [...]; [folio 9] 4º Maria Bulandina de Toledo,
  cazada com Manoel Marques Jorge; 5º Simplicio José Ferreira Armond, cazado com D.
  Eliza Balbina de Tolledo; 6º Ladisláo Egydio Ferreira de Tolledo, solteiro, de 23
  annos; 7º Geraldo Augusto de Tolledo Lima, solteiro, de 15 annos, residente na
  côrte, empregado em uma caza de negocio sita á rua do Visconde de Itaúna nº 74; 8º
  Josepha Olympia da Paixão, solteira, de 12 annos de idade." — [segue] "5º D.
  Carolina Leopoldina Marques, cazada com Narciso Marques Braz, sendo a mesma já
  fallecida, sendo seus herdeiros [...]".
abstract: >-
  Mathilde Maria de Jesus's 1879 Leopoldina estate inventory (título de herdeiros).
  Its heir #4 is her deceased son "José Cezário de Toledo Lima" (P-0054), married to
  the also deceased "D. Claudina" (P-0055), whose eight representantes (children) are
  listed. Item 5 reads: "Simplicio José Ferreira Armond, cazado com D. Eliza Balbina
  de Tolledo" — naming Eliza only as Simplício's wife, not as a representante/child
  in her own right. Eliza's parentage is not stated in this document. This record
  establishes: (1) Simplício Jaci Ferreira de Toledo (P-0016) is confirmed as a son
  of JC × Claudina; (2) Eliza Balbina de Toledo (P-0017) is confirmed as Simplício's
  wife. Corrects the earlier misreading that treated Eliza as JC's daughter: the
  transcription shows she is identified only as a spouse in item 5, not as one of the
  listed heirs. Also corrects the pre-August 2026 hypothesis that Eliza's parents
  were Antonio Zeferino de Toledo × Maria Perpétua (PRB-0004): that couple appears
  as heir #3 — Eliza's uncle/aunt, not her parents — but Eliza's actual parents
  remain unresolved from primary sources.
reliability:
  assessment: >-
    Direct primary evidence (a judicial estate inventory) confirming that Simplício
    Jaci Ferreira de Toledo (P-0016) is a son of JC × Claudina, and that Eliza
    Balbina de Toledo (P-0017) is Simplício's wife. Does NOT state Eliza's parentage.
    Resolves the two-Ladisláo ambiguity (the elder Ladisláo Egydio Ferreira de Toledo
    is Mathilde's husband; a namesake grandson aged 23 is heir #4's son). The
    two independent 1867 inventários (PRB-0008, PRB-0009) confirm the same parentage
    for Simplício and list JC's children without Eliza — excluding her as JC's daughter.
  informant: >-
    The inventariante Cezário José de Toledo (Mathilde's son) and the court, 1879
    (a distinct person from heir #4 José Cezário de Toledo Lima).
  limitations: >-
    Multi-folio handwritten process; some collateral names are uncertain reads
    (e.g. "Bulandina/Brandina", "Cazanna"). The mother is recorded only as "D.
    Claudina"; her fuller name "Claudina Brandina de Jesus" is inferred (see P-0055).
    Only three folios are catalogued (6, 8, 9); the full monte-mór and per-heir shares
    are elsewhere in the process. Folio 6 (juramento) ends mid-oath at the bottom of the
    image; the oath conclusion and the inventariante's signature are on folio 7, which is
    not catalogued. Folio 8 likely has additional folios of the herdeiros list; only the
    portion naming heir #4's representantes is in evidence. Eliza's parentage remains
    unresolved from primary sources.
