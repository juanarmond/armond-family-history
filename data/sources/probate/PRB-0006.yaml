transcription: >-
  [Inventário de Dona Mathilde Maria de Jesus, Leopoldina (MG), 1879; título de
  herdeiros. Três imagens catalogadas: folio 6 (juramento do inventariante), folio 8
  (cabeçalho do herdeiro nº 4) e folio 9 (a filha Eliza). O inventariante é Cezário
  José de Toledo, filho da finada — pessoa DISTINTA do herdeiro nº 4 "José Cezário de
  Toledo Lima".]


  [folio 8, ao pé, cabeçalho do herdeiro nº 4:] "4º José Cezario de Tolledo Lima,
  fallecido, cazado que foi com D. Claudina, tambem fallecida, dos quaes são seus
  reprezentantes:" — [folio 8v] "1º D. Maria Dulcelina de Toledo, solteira, de trinta
  e tantos annos; 2º D. Mathildes Olympia da Paixão, viuva do finado Manoel Antonio
  Caza[nna?]; 3º D. Josephina Christina da Silva Lima, fallecida, cazada que foi com
  Aureliano Christino da Silva Lima, que ainda vive e mora no Termo do Rio Novo, no
  lugar denominado Piau, sendo seus filhos 1º Cezario da Silva Lima, de 10 annos, 2º
  D. Joanna da Silva Lima, de 8 annos [...]; [folio 9] 4º Maria Bulandina de Toledo,
  cazada com Manoel Marques Jorge; 5º Simplicio José Ferreira Armond, cazado com D.
  Eliza Balbina de Tolledo; 6º Ladisláo Egydio Ferreira de Tolledo, solteiro, de 23
  annos; 7º Geraldo Augusto de Tolledo Lima, solteiro, de 15 annos, residente na
  côrte, empregado em uma caza de negocio sita á rua do Visconde de Itaúna nº 74; 8º
  Josepha Olympia da Paixão, solteira, de 12 annos de idade." — [segue] "5º D.
  Carolina Leopoldina Marques, cazada com Narciso Marques Braz, sendo a mesma já
  fallecida, sendo seus herdeiros [...]".
abstract: >-
  Mathilde Maria de Jesus's 1879 Leopoldina estate inventory (título de herdeiros).
  Its heir #4 is her deceased son "José Cezário de Toledo Lima", married to the also
  deceased "D. Claudina", whose eight representantes (children) are listed — the
  fifth being "Simplicio José Ferreira Armond, cazado com D. Eliza Balbina de
  Tolledo". This is primary evidence that Eliza Balbina de Toledo (P-0017) was the
  daughter of José Cezário de Toledo Lima (P-0054) and Claudina (P-0055), and the
  granddaughter of Mathilde Maria de Jesus (P-0027) — extending the Toledo maternal
  line and resolving Mathilde's grandmother link into a structured edge. It also
  corrects the earlier hypothesis: Antonio Zeferino de Toledo × Maria Perpétua are
  heir #3 (Eliza's uncle/aunt), NOT her parents.
reliability:
  assessment: >-
    Direct primary evidence (a judicial estate inventory) that Eliza Balbina de
    Toledo is a daughter/representante of the deceased heir José Cezário de Toledo
    Lima ⚭ D. Claudina, themselves children/heirs of the deceased Mathilde Maria de
    Jesus. Resolves the two-Ladisláo ambiguity (the elder Ladisláo Egydio Ferreira
    de Toledo is Mathilde's husband; a namesake grandson aged 23 is heir #4's son).
  informant: >-
    The inventariante Cezário José de Toledo (Mathilde's son) and the court, 1879
    (a distinct person from heir #4 José Cezário de Toledo Lima).
  limitations: >-
    Multi-folio handwritten process; some collateral names are uncertain reads
    (e.g. "Bulandina/Brandina", "Cazanna"). The mother is recorded only as "D.
    Claudina"; her fuller name "Claudina Brandina de Jesus" is inferred (see P-0055).
    Only the folios naming the direct line (6, 8, 9) are catalogued here; the full
    monte-mór and per-heir shares are elsewhere in the process.
