notes:
- text: >-
    The act spans several images; the parentage rests on two folios — folio 8 (the
    heir #4 header "José Cezario de Tolledo Lima ⚭ D. Claudina … seus reprezentantes")
    and folio 9 (the ELIZA page, "5º Simplicio José Ferreira Armond, cazado com D.
    Eliza Balbina de Tolledo"). folio 6 (juramento) establishes the deceased is
    Mathilde and the inventariante is her son Cezário José de Toledo — a person
    distinct from heir #4 José Cezário de Toledo Lima (the near-identical names are a
    documented trap). All three pages are held under this ID (…-folio6-…, …-folio8-…,
    …-folio9-…).
- text: >-
    Resolves the Toledo parentage conflict: PRB-0004 (1877 deed) had left open a
    hypothesis that Eliza's parents were Antonio Zeferino de Toledo × Maria Perpétua.
    This inventory shows that couple is heir #3 (folio 8 header "de M.a Perpetua nº
    3") — Eliza's uncle and aunt — while her actual parents are heir #4 José Cezário
    de Toledo Lima × Claudina. It also resolves the two same-named Ladisláo Egydio
    Ferreira de Toledo: the elder is Mathilde's husband (P-0056); the "solteiro de 23
    annos" on folio 9 is heir #4's son, Eliza's brother.
