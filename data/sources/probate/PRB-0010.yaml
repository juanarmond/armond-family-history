notes:
  - text: >-
      Recovered from the imigracaoegenealogia blog (six-page scan) and delivered via
      the research/from-retrieval/ sync. All six scan pages are now catalogued and
      transcribed in reading order [p.1]–[p.6]: the modern cover sheet (p.1), the
      identification folio recto (p.2) and verso (p.3), the oath term / juramento (p.4),
      and the two-page heir declaration (p.5–p.6, folio 3 recto + verso). Heir images
      read 2026-08-11; cover, opening verso and oath reconciled from the drop and added
      2026-08-12 (sha256 drop-page audit). No blog page was excluded — none is a blank
      verso or a duplicate. The 1833 inventory is the record the retrieval FINDINGS
      cited for "all thirteen children of Cap. Joaquim José × Rita Angélica"; it does
      NOT name Joaquim José's own parents (Gaspar Ferreira × Gertrudes Maria), which
      remain an unmodelled lead.
