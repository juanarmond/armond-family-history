transcription: >-
  [Inventário — Caixa 49 Ordem 09 Doc 09, Juízo dos Órfãos, Villa de Barbacena.
  Full six-page imigracaoegenealogia blog scan, catalogued and transcribed here in
  reading order [p.1]–[p.6]. Register images read 2026-08-11 (heir declaration) and
  2026-08-12 (cover, opening verso, oath).]

  [p.1 — modern archival cover sheet, a pencil finding-aid slip (not an original
  folio):] "Caixa nº 49 / Ordem nº 09. Doc.to nº: 09. Data: 1833. Local: Villa de
  Barbacena, Comarca do Rio Parahibuna. Documento / Tipo: Inventário. Inventariante:
  Joaquim José Ferreira [de Toledo]. Inventariada: D. Rita Angélica Rodrigues.
  Of.[ício dos] Órfãos."

  [p.2 — fl. de identificação, recto; legenda de rosto no alto:] "[Orf.ãos, M.º 1]
  N.º 21 — 1833 — [fl.] 81. Inventario da finada D. Rita Angelica Ro[drigue]z., de
  quem ficou vivo e Inventariante o Cap.m Joaquim José Ferreira de Toledo. E [ao]
  Escr.[ivão José] Gomes e S[ouza]." (à margem, o número 10.)

  [Abertura, fl. de identificação (p.2):] "Anno do Nascimento de Nosso Senhor Jesus
  Christo de mil oito centos trinta e tres e décimo segundo da Independência do
  Império, ao primeiro dia do mês de Julho do dito anno, nesta Nobre e mui Leal Villa
  de Barbacena, Minas e Comarca do Rio Parahibuna, em o meu Cartório, sendo ahi por
  parte do Capitão Joaquim José Ferreira de Toledo, viúvo da falecida Dona Rita
  Angélica Rodrigues, me foi apresentada huma sua petição, despachada pelo Ajudante
  Manoel José Pacheco Pena, actual Juiz dos Órfãos desta mesma Villa e seu Termo, na
  forma da Ley, em a qual requeria a elle Juiz que, tendo-se procedido a Inventário
  nos bens do seu casal e nas partilhas, [seguindo-se emendas e riscos — passagem de
  leitura incerta], requeria outro Inventário com os mesmos louvados ou com aquelles
  que elle Juiz no[measse] [o texto da petição continua na fl. verso, p.3]."

  [p.3 — fl. de identificação, verso; conclusão da petição e do despacho:]
  "...[no]meando e marcando para esse fim dia; pois elle Supplicante estava prompto a
  satisfazer, pela sua vez, as contas que no presente Inventário se fizerem, afim de
  não prejudicar aos Órfãos; em cuja petição despachou o dito Juiz que marcava o dia
  quinze de Julho do corrente, e approvava o louvado nomeado, [e] nomeava o [uncertain:
  Tenente] Domingos Jaime Ferreira de Castro, cuja petição e despacho lhe aqui ao
  diante se seguem, para constar; e em razão do meu Officio a[c]eitei [...] tanto quanto
  posso, devo e sou obrigado; e eu José Gomes [de … e] Souza, Escrivão dos Órfãos, que
  os escrevi."

  [p.4 — Juramento (termo do juramento ao inventariante e aos louvados); rubrica de
  topo "Juramento":] "Aos quinze dias do mês de Julho do anno de mil oito centos e
  trinta e tres, nesta Fazenda denominada Cascalhaes, Termo da Nobre e mui Leal Villa
  de Barbacena, Minas e Comarca do Rio das Mortes, aonde foi vindo o actual Juiz dos
  Órfãos da dita Villa e seu Termo, Manoel José Pacheco Pena, comigo Escrivão ao diante
  nomeado, para o fim de proceder ao presente Inventário; sendo ahi presente o
  Inventariante Capitam Joaquim José Ferreira de Toledo, viúvo que ficou da falecida
  Dona Rita Angélica Rodrigues, ao qual o mesmo Juiz diferio o juramento dos Santos
  Evangelhos em hum livro delles em que poz sua mão direita, sob cargo do qual lhe
  encarregou jurasse em sua alma que bem e verdadeiramente havia de dar a descrever no
  presente Inventário todos os bens que ficaram por morte da dita sua mulher, sem
  reserva de alguns, com a pena da Ley; e recebido por elle viúvo o dito juramento,
  debaixo do encargo do mesmo assim prometteu cumprir. E estando presentes os louvados
  nomeados e approvados na petição e despacho retro, o Capitam Simião Ferreira da Silva
  e o Alferes Domingos Jaime Ferreira de Castro, o mesmo Juiz lhes diferio o juramento
  dos Santos Evangelhos em hum livro delles em que os mesmos poz cada hum sua mão
  direita, sob cargo do qual lhe encarregou [continua no topo da fl. 3, p.5]".

  [p.5 — fl. 3 recto; conclusão do termo de juramento:] "...[encarregou-]lhes o mesmo
  Juiz que bem e verdadeiramente avaliassem todos os bens que pelo viúvo fossem
  apresentados, como em suas consciências entendessem, sem dolo, malícia, calumnia ou
  affeição a alguns dos herdeiros; e recebido por elles louvados o dito juramento,
  debaixo do encargo do mesmo, assim prometteram cumprir; e para constar mandou o mesmo
  Juiz fazer este termo, em que assigna com o dito viúvo e louvados, depois de lido por
  mim José Gomes [de … e] Souza, Escrivão dos Órfãos, que os escrevi." [Assinaturas:]
  "[uncertain: Pacheco] Pena" (o Juiz); "Joaq.m Jozé Ferr.a de Toledo" (o viúvo e
  inventariante); "Simião Ferr.a da S[ilva]" e "Domingos Jaime Ferr.a de Castro" (os
  louvados).

  [Declaração de herdeiros, fl. 3 (p.5), abaixo das assinaturas:] "E logo, neste mesmo
  auto, sendo pelo dito Juiz determinado ao mesmo viúvo e Inventariante que declarasse
  o dia, mês e anno em que falecera a dita sua mulher, se com testamento ou sem elle,
  quantos herdeiros ficaram desse casal, seus nomes, idades e estados; e satisfazendo,
  disse que sua falecida mulher Dona Rita Angélica Rodrigues havia falecido a nove do
  mês de Fevereiro do anno passado de mil oito centos e trinta e dois, sem testamento,
  e que desse consórcio ficaram os filhos e herdeiros abaixo declarados. Filhos: 1.º
  Ladisláo Egídio Ferreira, casado; 2.º Maria, casada com M.el Per.a de A[ndrade?]; 3.º
  Joaquim [Neuterio?], casado; 4.º Lauriana, casada com Fran.co Per.a do Vale; 5.º Anna,
  casada com An.to Dias Ladeira; [continua na fl. 3v, p.6]".

  [p.6 — fl. 3 verso; continuação dos herdeiros:] "6.º Candida, falecida, casada que
  foi com Vicente José de Ab[reu?], deixou filhos; 7.º Rita, casada com Patricio
  Barroso; 8.º Francisco, casado; 9.º José [An]astácio, casado; 10.º Antonio Zeferino,
  casado; 11.º João Rodrigues, casado; 12.º Venancio do Nascimento, casado; 13.º Manoel
  Joaquim, casado. Netos, filhos da falecida [filha] Candida: 1 Maria, de idade 13
  annos; 2 Anna, 10; 3 José, 9; 4 Francisco, 7; 5 Thereza, 6; 6 Simpliciano, 4; 7
  Candida, 3."

  [Bens, fl. 3v (p.6), início da avaliação — rubrica "Bens":] "Declarou elle viúvo e
  Inventariante ficar por falecimento de sua mulher os bens seguintes: tres tachos de
  cobre velhos com peso de cincoenta e duas libras, a quatrocentos réis cada libra,
  avaliados na quantia de vinte mil e oitocentos réis (20$800); item hum caldeirão de
  ferro avaliado na quantia de oito mil réis (8$000); item huma balança de pezar
  avaliada na quantia de dois mil e quinhentos réis (2$500); item hum tacho de ferro
  usado avaliado na quantia de dois mil seiscentos e oitenta réis (2$680); item dez
  foices usadas a novecentos réis cada huma, avaliadas na quantia de nove mil réis
  (9$000); item nove enxadas usadas [...]." [À margem, os valores parciais 20$800,
  8$000, 2$500, 2$680 e 9$000, e a soma parcial 42$980; a avaliação continua nos folios
  seguintes, não retidos no acervo digitalizado.]
abstract: >-
  The 1833 Barbacena Juízo dos Órfãos inventory of the deceased Dona Rita Angélica
  Rodrigues (P-0058), opened 1 July 1833; her widower and inventariante is Capitão
  Joaquim José Ferreira de Toledo (P-0057), confirming him alive and a captain in
  1833. It records that Rita died 9 February 1832, intestate, and lists all thirteen
  children of the couple, headed by 1.º Ladisláo Egídio Ferreira (P-0056), our
  direct ancestor — a direct, primary attestation of Ladisláo's parentage (previously
  strong-evidence). Siblings #9 José Anastácio and #10 Antonio Zeferino, and the
  others (Maria, Joaquim, Lauriana, Anna [⚭ Antonio Dias Ladeira, = Anna Belizaria],
  Candida [deceased, ⚭ Vicente José de Ab[reu?]], Rita, Francisco, João Rodrigues,
  Venancio do Nascimento, Manoel Joaquim), are recorded as documented children on
  F-0028. The deceased daughter Candida's seven children (ages 3–13) appear as
  representantes. Assets were at the Fazenda Cascalhaes; louvados the Capitão Simião
  Ferreira da Silva and Alferes Domingos Jaime Ferreira de Castro.
abstract_pt: >-
  O inventário de 1833 do Juízo dos Órfãos de Barbacena da falecida Dona Rita
  Angélica Rodrigues (P-0058), aberto em 1 de julho de 1833; seu viúvo e
  inventariante é o Capitão Joaquim José Ferreira de Toledo (P-0057), o que o
  confirma vivo e capitão em 1833. Registra que Rita faleceu em 9 de fevereiro de
  1832, sem testamento, e lista todos os treze filhos do casal, encabeçados por 1.º
  Ladisláo Egídio Ferreira (P-0056), nosso ancestral direto — uma atestação direta e
  primária da filiação de Ladisláo (antes apenas evidência forte). Os irmãos #9 José
  Anastácio e #10 Antonio Zeferino, e os demais (Maria, Joaquim, Lauriana, Anna [⚭
  Antonio Dias Ladeira, = Anna Belizaria], Candida [falecida, ⚭ Vicente José de
  Ab[reu?]], Rita, Francisco, João Rodrigues, Venancio do Nascimento, Manoel
  Joaquim), ficam registrados como filhos documentados em F-0028. Os sete filhos da
  falecida filha Candida (de 3 a 13 anos) aparecem como representantes. Os bens
  estavam na Fazenda Cascalhaes; louvados o Capitão Simião Ferreira da Silva e o
  Alferes Domingos Jaime Ferreira de Castro.
reliability:
  assessment: >-
    An original judicial estate inventory; primary, direct evidence for Rita
    Angélica's death (9 February 1832, intestate), for her widower Joaquim José
    Ferreira de Toledo's survival and captaincy in 1833, and — decisively — for the
    complete list of the couple's thirteen children, which names Ladisláo Egídio
    Ferreira (P-0056) as child #1. This directly confirms the F-0028 parent edge that
    was previously strong-evidence (inferred from Ladisláo's 1787 baptism).
  informant: >-
    The widower and inventariante Capitão Joaquim José Ferreira de Toledo, declaring
    the heirs on oath before the Juiz dos Órfãos of Barbacena.
  limitations: >-
    All six pages of the blog scan are now catalogued (cover sheet, identification
    recto + verso, oath term, and the two-page heir declaration); the further appraisal
    of assets and the partilha, beyond the opening of the "Bens" list, were not part of
    the digitised set. The opening petition on the identification folio (why a fresh
    inventory was sought, amid emendas e riscos) is worn and only partly legible; a few
    children's spouse surnames and one forename ("Joaquim [Neuterio?]", daughter
    Candida's husband "Vicente José de Ab[reu?]"), and the second louvado's rank on p.3
    ("[uncertain: Tenente]" vs "Alferes" on p.4/p.5), are abbreviated or worn and marked
    uncertain. None of these touch the core facts (parties, death date, the thirteen
    children). The reconciliation of the 1833 first-name list with the daughters named
    in their own 1812/1816 marriage acts (Anna Belizaria = "Anna ⚭ Antonio Dias";
    Carolina Francelina) is noted on F-0028.
