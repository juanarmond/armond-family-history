abstract: >-
  The closed will of Domingos José Fernandes and the autos of its opening in the Juízo da
  Provedoria de Cataguases, Minas Gerais. In the will, dated "Monte Alegre 14 de Abril de
  1884" and written and signed a rogo by Alferes Manoel Alves Bitancort Vasconcellos, the
  testator declares himself "natural do Reino de Portugal Fregezia de S. Romaõ da uxa, Termo
  de Barcellos [e] Bispado de Braga Primas", "Filho legetimo de Bento Jozé Fernandes já
  Falecido e de Joaquina Roza Lopes", married to D. Maria de Jezus Fernandes "p.r Carta de
  Metade e sem Contrato algum", with no children "athe esta data". He names his wife his heir
  and first testamenteira and Manoel Alves Bitancort Vasconcellos second testamenteiro, orders
  masses (one for "alma de meu Paj"), leaves "minha Maĩ" "Coatro centos mil r.s p.a ajuda de
  Sua [Substencia]" (400$000, reverting to his wife after her), and leaves 600$000 to "uma
  menina de nome Martiniana" living in his household. On 5 August 1884, in the freguezia da
  Cachoeira Alegre, termo e comarca de São Paulo do Muriahé, the escrivão do Juízo de Paz
  approved it before five witnesses; the testator was "doente" but of sound mind and could not
  write. On 4 February 1885 Joaquim José Fernandes presented the will to the judge, Dr.
  Joaquim Moreira de Barros Oliveira Lima, declaring that he had received it from the widow
  and that the testator, "casado, natural de Portugal, filho de Bento José Fernandes, já
  fallecido, e de Joaquina Rosa Lopes, domiciliado na Freguezia do Laranjal deste termo", died
  on 31 January 1885 "na casa de sua residencia". The widow, who could not write, accepted the
  testamentaria on 12 February 1885. The promotor dos resíduos ad hoc, Dr. Eduardo Ernesto da
  Gama Cerqueira, held the will formally regular (21 April 1885) but added that instituting the
  wife as heir "não encontra apoio em nossa lei" when the testator has "mãe viva, que é
  herdeira necessaria". On 24 September 1885 the judge ruled the will "inexequivel por falta de
  solemnidades internas", since the testator, "tendo … mãi viva, sua herdeira forçada,
  preteriu-a", so that it was "nullo desde seu principio", and declined to order it carried
  out. The record is the testator's own statement of his birthplace and parents; it shows that
  Bento José Fernandes (P-0141) was dead by 14 April 1884 and that Joaquina Rosa Lopes (P-0142)
  was treated as living in 1884 and by the court in 1885. Domingos is a collateral child of
  family F-0071.
abstract_pt: >-
  O testamento cerrado de Domingos José Fernandes e os autos da sua abertura no Juízo da
  Provedoria de Cataguases, Minas Gerais. No testamento, datado "Monte Alegre 14 de Abril de
  1884" e escrito e assinado a rogo pelo Alferes Manoel Alves Bitancort Vasconcellos, o
  testador declara-se "natural do Reino de Portugal Fregezia de S. Romaõ da uxa, Termo de
  Barcellos [e] Bispado de Braga Primas", "Filho legetimo de Bento Jozé Fernandes já Falecido
  e de Joaquina Roza Lopes", casado com D. Maria de Jezus Fernandes "p.r Carta de Metade e sem
  Contrato algum", sem filhos "athe esta data". Institui a mulher sua herdeira e primeira
  testamenteira e Manoel Alves Bitancort Vasconcellos segundo testamenteiro, manda dizer missas
  (uma pela "alma de meu Paj"), deixa à "minha Maĩ" "Coatro centos mil r.s p.a ajuda de Sua
  [Substencia]" (400$000, que revertem à mulher depois dela) e deixa 600$000 a "uma menina de
  nome Martiniana" que vive em seu poder. Em 5 de agosto de 1884, na freguesia da Cachoeira
  Alegre, termo e comarca de São Paulo do Muriahé, o escrivão do Juízo de Paz o aprovou perante
  cinco testemunhas; o testador estava "doente", mas em perfeito juízo, e não sabia escrever.
  Em 4 de fevereiro de 1885 Joaquim José Fernandes apresentou o testamento ao juiz, Dr.
  Joaquim Moreira de Barros Oliveira Lima, declarando que o recebera da viúva e que o
  testador, "casado, natural de Portugal, filho de Bento José Fernandes, já fallecido, e de
  Joaquina Rosa Lopes, domiciliado na Freguezia do Laranjal deste termo", falecera em 31 de
  janeiro de 1885 "na casa de sua residencia". A viúva, que não sabia escrever, aceitou a
  testamentaria em 12 de fevereiro de 1885. O promotor dos resíduos ad hoc, Dr. Eduardo
  Ernesto da Gama Cerqueira, julgou o testamento formalmente regular (21 de abril de 1885), mas
  acrescentou que a instituição da mulher como herdeira "não encontra apoio em nossa lei"
  quando o testador tem "mãe viva, que é herdeira necessaria". Em 24 de setembro de 1885 o juiz
  julgou o testamento "inexequivel por falta de solemnidades internas", porque o testador,
  "tendo … mãi viva, sua herdeira forçada, preteriu-a", sendo por isso "nullo desde seu
  principio", e deixou de mandar cumpri-lo. O registro é a declaração do próprio testador
  sobre a sua naturalidade e os seus pais; mostra que Bento José Fernandes (P-0141) já era
  falecido em 14 de abril de 1884 e que Joaquina Rosa Lopes (P-0142) era tida por viva em 1884
  e, pelo juízo, em 1885. Domingos é filho colateral da família F-0071.
reliability:
  assessment: >-
    Original will and original court autos, written in the course of the events by the
    persons concerned. The will is direct evidence, from the testator himself, of his
    birthplace, his parents' names, his father's death before 14 April 1884, his marriage, his
    lack of children and his dispositions; the approval is the escrivão's first-hand
    attestation of the testator's identity, illness and illiteracy on 5 August 1884. The
    termo de abertura records the presenter's declaration of the death (31 January 1885), the
    deceased's residence and his parentage, which is second-hand and agrees with the will;
    the later termos and the decision are first-hand records of the court's own acts. Every
    core fact is legible, so reading_reliability is complete; the inline [uncertain] marks fall
    on words of the mass and reversion clauses, on witness and official names, and on one word
    of the promotor's opinion.
  informant: >-
    The testator, through the scribe Manoel Alves Bitancort Vasconcellos (the will); the
    escrivão do Juízo de Paz of Cachoeira Alegre, [Ygnaz] Antonio Lima e Silva (the approval);
    the presenter Joaquim José Fernandes, whose relationship to the deceased is not stated
    (the death, residence and parentage in the termo de abertura); the Provedoria escrivão
    Antonio Delfim Silva, the judge Dr. Joaquim Moreira de Barros Oliveira Lima and the
    promotor Dr. Eduardo Ernesto da Gama Cerqueira (the autos)
  limitations: >-
    The mother's residence is not stated anywhere in these pages, and her survival is asserted
    by the promotor and the judge rather than proved here: the promotor's own words make it
    something still to be "averiguada". The death date and place come from the presenter's
    declaration, not from a death record. "uxa" for Ucha is the scribe's spelling. Several
    words of the will are doubtful (the fourth mass, the reversion clause, the girl's name and
    the word after it), as are the second will-witness's surname, the approving escrivão's
    first name and one acceptance witness's surname. The leaf before fl. 2 and image 17 are
    not held, so whether the autos continue (the ordered copy, a partilha) is not shown here.
