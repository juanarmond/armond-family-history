transcription: |-
  [Testamento cerrado of Domingos José Fernandes and the Provedoria autos of its opening,
  Cataguases, 1884–1885: thirteen page images, fl. 2 to fl. 8, in film order (FS DGS
  113202032 images 4–16). The will (fl. 2–2v) is written by Manoel Alves Bitancort
  Vasconcellos and signed by him a rogo of the testator; the approval (fl. 2v–3) is in the
  hand of the escrivão do Juízo de Paz of Cachoeira Alegre; the autos (fl. 3v–8) are in the
  hand of the Provedoria escrivão Antonio Delfim Silva, with the judge's despachos in his own
  hand and the promotor's opinion in his. Lines as written; spelling, capitals and
  abbreviations as written; expansions only in the bracket at the end. In Delfim Silva's hand
  a medial s looks like r ("casa" reads like "cara"); it is read as s throughout, and it
  differs from his z (as in "doze").]

  [p01 — evidence/probate/PRB-0015-testamento-domingos-jose-fernandes-1884-1885-cataguases-p01.jpg; FS DGS 113202032 image 4; fl. 2 — the will]
  [top right, folio number:] 2 [with a small paraph under it]
                    J. M. J.
  Em nome da Santissima Trindade, Padre Filho
  Espirito Santo em quem eu Domingo Jozé Fernande[s] [the last letter is lost at the page edge]
  firmemente Creio e em Cuja fé protesto viver e
  mórer. Este é o meu testamento e ultima vonta-
  de, de Claro que sou natural do Reino de Por-
  tugal Fregezia de S. Romaõ da uxa, Termo de
  Barcellos [uncertain: e] Bispado de Braga Primas, sou Filho
  legetimo de Bento Jozé Fernandes já Falecido
  e de Joaquina Roza Lopes; sou Cazado Com
  D. Maria de Jezus Fernandes athe esta data
  naõ temos tido Filhos, Cazei-me p.r Carta
  de Metade e sem Contrato algum e pello Cos-
  tume geral deste Imperio naõ avendo filhos
  athe esta data de Claro q. Será minha Erdei-
  ra e testamenteira minha Mulher, e Seraõ
  Comprridos meus legados, Seri enterado donde
  melhor Convier, este enterro Será feita a vontade
  da testamenteira Será ditos de Corpo prezente uma
  miça Será dita a outra no Setimo dia, e outra a tri-
  gezimo dia, e [uncertain: demaĩ] [uncertain: 1] unica p.r alma de meu Paj,
  de Claro q. deixo p.r minha Maĩ a quantia de
  Coatro centos mil r.s p.a ajuda de Sua [uncertain: Substencia]
  e [uncertain: nofarto] della revertera tanto esta q.ta Como a que
  mais [uncertain: ouver] p.r erança da parte della [uncertain: á mĩa mão]
  minha Mulher, de Claro mais q. deixo a uma
  menina de nome [uncertain: Martiniana] [uncertain: Caja] vive em meu
  poder a quantia de Seicentos mil reis q. Será-lhe en-
  trege q.do esta estija em mancipado, e [uncertain: nafarta] des-
  ta Será a mesma q.ta revertida a minha Mulher
  sendo q. esta não chege a tomar Conta, de Claro
  [rest of the page blank; diagonal ink show-through from the verso]

