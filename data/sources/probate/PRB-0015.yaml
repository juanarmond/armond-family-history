  do corrente anno, na casa de sua resi-
  dencia, o qual era casado, natural
  de Portugal, filho de Bento Jose Fernan-
  des, já fallecido, e de Joaquina Rosa Lopes,
  domiciliado na Freguezia do Laranjal
  deste termo. E logo pelo Juiz sendo recebido
  o testamento, achou que estava intacto,
  cosido com cinco pontos de linha preta,
  com lacre encarnado por cima dos mes-
  mos pontos, os quaes estavão em perfeito
  estado. Certificando-se da morte do testa-
