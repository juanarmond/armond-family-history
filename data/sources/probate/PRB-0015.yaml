  [top left: a small ink mark, possibly a "2" or a paraph]
  de Claro mais fica Sendo Segundo testamenteiro
  o S.r Alferes Manoel Alves Bitancort Vas.cos q. este
  p.r mim [uncertain: feis] e a Signou em prezença dos teste-
  munhas q. abaxo asignaõ o S.r Manoel Fortu-
  nato Alves Bitancort e o S.r Janoario [uncertain: Corga] dos
  Reis e q. Será Fexado Com o Sinal Segin-
  te tres Pingos de lacre e amorado Com
  linha branca, e p.r todo o referido Ser
