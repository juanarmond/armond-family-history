  q.ta = quantia; q.do = quando; S.r = Senhor; Vas.cos = Vasconcellos; T.ta, T.a =
  testemunha; M.el = Manoel; Ant.o = Antonio; S.tos = Santos; Joaq.m = Joaquim; Frz. =
  Fernandes; Em tt.o … de Verd.e = Em testemunho … de verdade; Mor.a = Moreira; Cl.m =
  Conclusão; Cl.os = Conclusos; Catag.s, Cat.s = Cataguases; fev.o = fevereiro; Escr.m,
  escr.am = escrivão; S.a = Silva; D.r, D.or = Doutor; testam.to = testamento; G. Cerq.ra =
  Gama Cerqueira; fl., fls = folha(s); 3.a = terceira; septbr.o = setembro; Gouv. Pinto, Tract.
  dos test., ed. de Teix. de Frit. = Gouveia Pinto, Tratado dos testamentos, edição de
  Teixeira de Freitas [editorial expansion]. Sense of the doubtful words of the will, an
  editorial reading only: "e [demaĩ] [1] unica" probably "e de mais uma única [missa]"; "e
  [nofarto] della" and "e [nafarta] desta" probably "e na falta della / desta"; "[á mĩa mão]
  minha Mulher" — the sum reverts to his wife; "[Caja] vive" perhaps "que já vive"; "mórer"
  = morrer; "Seri enterado" = serei enterrado; "Fexado" = fechado; "Segin-te" = seguinte;
  "amorado" = amarrado; "[Substencia]" = subsistência; "em mancipado" = emancipada. "uxa" is
  written so, with no h; that it designates São Romão da Ucha is an editorial identification.]
