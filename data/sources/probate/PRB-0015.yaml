notes:
- text: >-
    Readings that differ from the retrieval side's draft transcription (bento-jose-fernandes.md
    §7.1–7.3). The most material is on fl. 7 (p11): the promotor's addendum reads "reputa o
    Curador [insustenta-/vel] a disposição", not "incontesta-/vel". The letters after "in" show
    no closed "o", and "insustentável" (untenable) is the reading that fits his preceding
    sentence, that instituting the wife as heir "não encontra apoio em nossa lei"; the draft's
    "incontestável" would invert his opinion. The word is kept [uncertain]. In the will (p01):
    "mórer" (draft "morrer"); "testamento e ultima vontade" (the draft omits "e"); "Sua
    [Substencia]" — the letters read "Substencia", not the draft's normalised "Subsistencia",
    with the same sense; "em mancipado" (draft "emmancipado"); the fourth-mass phrase reads "e
    [demaĩ] [1] unica" (draft "e demaçe[?] 1[?] unica"); the girl's name may also read
    "Martinianna". On p02: "p.r mim [feis]" (draft "fiz"); "deste emperio" (draft "Imperio").
    On p03: "o qual eu fiz, e perante" (the draft omits "e"); "valiozo" (draft "valioso");
    the escrivão's first name reads "Ygnaz" (draft "Ignaz"). In the autos: "Cataguases" in
    the escrivão's hand on p04, p06, p07, p09 and p12 (the draft has "Cataguazes" from p06
    on), since his letter there is his s, not his z; the promotor's own "Cataguazes" (p10) is
    kept; "acceitação" and "acceita" (p06, double c; draft single); "Intime-se," (comma);
    "O Escr.m" (p06, draft "O Escr.am"); "sugeitava" (p07, draft "sujeitava"); the conclusão
    headings on p08 and p12 read "Cl.m", not "Cl.os"; "Jose" without a visible accent in the
    body of p04 and p07.
  text_pt: >-
    Leituras que diferem da transcrição-rascunho da pesquisa de recuperação
    (bento-jose-fernandes.md §7.1–7.3). A mais relevante está na fl. 7 (p11): o aditamento do
    promotor lê-se "reputa o Curador [insustenta-/vel] a disposição", e não "incontesta-/vel".
    As letras depois de "in" não mostram nenhum "o" fechado, e "insustentável" é a leitura que
    condiz com a frase anterior, de que a instituição da mulher como herdeira "não encontra
    apoio em nossa lei"; o "incontestável" do rascunho inverteria o seu parecer. A palavra fica
    [incerta]. No testamento (p01): "mórer" (rascunho "morrer"); "testamento e ultima vontade"
    (o rascunho omite o "e"); "Sua [Substencia]" — as letras dão "Substencia", e não o
    "Subsistencia" normalizado do rascunho, com o mesmo sentido; "em mancipado" (rascunho
    "emmancipado"); a frase da quarta missa lê-se "e [demaĩ] [1] unica" (rascunho "e
    demaçe[?] 1[?] unica"); o nome da menina pode ler-se também "Martinianna". Na p02: "p.r mim
    [feis]" (rascunho "fiz"); "deste emperio" (rascunho "Imperio"). Na p03: "o qual eu fiz, e
    perante" (o rascunho omite o "e"); "valiozo" (rascunho "valioso"); o prenome do escrivão
    lê-se "Ygnaz" (rascunho "Ignaz"). Nos autos: "Cataguases" na letra do escrivão nas p04,
    p06, p07, p09 e p12 (o rascunho tem "Cataguazes" a partir da p06), porque a letra é o seu
    s, e não o seu z; mantém-se o "Cataguazes" do próprio promotor (p10); "acceitação" e
    "acceita" (p06, com cc; rascunho com c simples); "Intime-se," (com vírgula); "O Escr.m"
    (p06, rascunho "O Escr.am"); "sugeitava" (p07, rascunho "sujeitava"); os cabeçalhos de
    conclusão das p08 e p12 leem-se "Cl.m", e não "Cl.os"; "Jose" sem acento visível no corpo
    das p04 e p07.
- text: >-
    Readings of the draft confirmed on the image: "natural do Reino de Portugal Fregezia de S.
    Romaõ da uxa, Termo de Barcellos [e] Bispado de Braga Primas, sou Filho legetimo de Bento
    Jozé Fernandes já Falecido e de Joaquina Roza Lopes" (the linking word before "Bispado" is
    still doubtful, "e" or "do"; "uxa" is clearly written with no h); "sou Cazado Com D. Maria
    de Jezus Fernandes athe esta data naõ temos tido Filhos"; "deixo p.r minha Maĩ a quantia de
    Coatro centos mil r.s p.a ajuda de Sua [Substencia]"; "Será minha Erdeira e testamenteira
    minha Mulher" — no other heir is named, so "sole heir" describes the will's effect rather
    than its words; the 600$000 legacy to Martiniana; the will's date "14 de Abril de 1884";
    the death "no dia trinta e hum de Janeiro do corrente anno"; and the decision dated "Cat.s,
    24 de septbr.o de 1885". Strictly, the judge did not pass a contested sentence of
    annulment: he declared the will "inexequivel" and "nullo desde seu principio", declined to
    order it carried out ("deixo de mandar cumprir o mesmo testam.to") and ordered the
    escrivão to send him a copy.
  text_pt: >-
    Leituras do rascunho confirmadas na imagem: "natural do Reino de Portugal Fregezia de S.
    Romaõ da uxa, Termo de Barcellos [e] Bispado de Braga Primas, sou Filho legetimo de Bento
    Jozé Fernandes já Falecido e de Joaquina Roza Lopes" (a palavra de ligação antes de
    "Bispado" continua duvidosa, "e" ou "do"; "uxa" está claramente escrito, sem h); "sou
    Cazado Com D. Maria de Jezus Fernandes athe esta data naõ temos tido Filhos"; "deixo p.r
    minha Maĩ a quantia de Coatro centos mil r.s p.a ajuda de Sua [Substencia]"; "Será minha
    Erdeira e testamenteira minha Mulher" — nenhum outro herdeiro é nomeado, de modo que
    "herdeira única" descreve o efeito do testamento, e não as suas palavras; o legado de
    600$000 a Martiniana; a data do testamento "14 de Abril de 1884"; o falecimento "no dia
    trinta e hum de Janeiro do corrente anno"; e a decisão datada "Cat.s, 24 de septbr.o de
    1885". A rigor, o juiz não proferiu uma sentença de anulação em processo contencioso:
    declarou o testamento "inexequivel" e "nullo desde seu principio", deixou de mandar
    cumpri-lo ("deixo de mandar cumprir o mesmo testam.to") e mandou o escrivão remeter-lhe
    uma cópia.
- text: >-
    Identification. The testator names his parents as Bento Jozé Fernandes, already dead, and
    Joaquina Roza Lopes, and his parish as "S. Romaõ da uxa, Termo de Barcellos", Braga; the
    termo de abertura repeats the parents as Bento José Fernandes, "já fallecido", and Joaquina
    Rosa Lopes. The identification of this couple with Bento José Fernandes (P-0141) and
    Joaquina Rosa Lopes (P-0142) of São Romão da Ucha rests on both parents' full names and the
    parish; it is strong, not proven. That "uxa" designates Ucha is an editorial reading of the
    scribe's spelling, supported by "Termo de Barcellos" and "Bispado de Braga". The record does
    not give the testator's age or birth date, so tying him to a particular Ucha baptism (for
    example a Domingos son of Bento Fernandes and Joaquina Lopes baptised in 1835, if
    catalogued) needs that baptism's own evidence. Manoel João Fernandes da Cruz (P-0139) is not
    named anywhere in these pages, nor is any sibling of the testator.
  text_pt: >-
    Identificação. O testador nomeia os pais como Bento Jozé Fernandes, já falecido, e Joaquina
    Roza Lopes, e a sua freguesia como "S. Romaõ da uxa, Termo de Barcellos", Braga; o termo de
    abertura repete os pais como Bento José Fernandes, "já fallecido", e Joaquina Rosa Lopes. A
    identificação deste casal com Bento José Fernandes (P-0141) e Joaquina Rosa Lopes (P-0142)
    de São Romão da Ucha assenta nos nomes completos de ambos os pais e na freguesia; é forte,
    não provada. Que "uxa" designa Ucha é uma leitura editorial da grafia do escrevente,
    apoiada em "Termo de Barcellos" e "Bispado de Braga". O registro não dá a idade nem a data
    de nascimento do testador, de modo que ligá-lo a um baptismo concreto da Ucha (por exemplo,
    um Domingos filho de Bento Fernandes e Joaquina Lopes baptizado em 1835, se catalogado)
    depende da evidência desse próprio baptismo. Manoel João Fernandes da Cruz (P-0139) não é
    nomeado em nenhuma destas páginas, nem qualquer irmão do testador.
- text: >-
    What the record adds. For Bento José Fernandes (P-0141): he was dead by 14 April 1884 ("já
    Falecido" in the will), consistent with, but not proof of, the 1860 Ucha burial. For
    Joaquina Rosa Lopes (P-0142): the will provides for her subsistence and is not written of
    a dead woman, so she was taken to be alive on 14 April 1884; the termo de abertura (4
    February 1885) marks only Bento as dead; the promotor and the judge treat her as alive in
    1885 ("ter mãe viva"; "tendo o testador mãi viva, sua herdeira forçada"). Her residence is
    not stated in any of these pages; her survival after January 1885 rests better on her own
    procuração of 9 June 1885, catalogued separately. For Domingos: natural of São Romão da
    Ucha; married to D. Maria de Jezus (Jesus) Fernandes by carta de metade, without a marriage
    contract; no children by April 1884; ill on 5 August 1884; unable to write (the will and
    its approval are signed a rogo, "por elle dizer que não sabia escrever"); domiciled in the
    Freguezia do Laranjal, termo de Cataguases; died on 31 January 1885 in his own house (the
    presenter's declaration). The record says "Freguezia do Laranjal deste termo", not "São
    João do Laranjal". The widow could not write either; Tenente Fortunato Gomes da Silva signed
    her acceptance for her. Martiniana is "uma menina" living in his household; her relationship
    to him is not stated. The presenter Joaquim José Fernandes's relationship to the deceased
    is not stated and must not be inferred from the surname.
  text_pt: >-
    O que o registro acrescenta. Para Bento José Fernandes (P-0141): já era falecido em 14 de
    abril de 1884 ("já Falecido" no testamento), o que condiz com o sepultamento de 1860 na
    Ucha, sem o provar. Para Joaquina Rosa Lopes (P-0142): o testamento provê à sua
    subsistência e não fala de uma mulher morta, de modo que ela era tida por viva em 14 de
    abril de 1884; o termo de abertura (4 de fevereiro de 1885) só marca Bento como falecido; o
    promotor e o juiz tratam-na como viva em 1885 ("ter mãe viva"; "tendo o testador mãi viva,
    sua herdeira forçada"). A sua residência não é declarada em nenhuma destas páginas; a sua
    sobrevivência depois de janeiro de 1885 assenta melhor na sua própria procuração de 9 de
    junho de 1885, catalogada à parte. Para Domingos: natural de São Romão da Ucha; casado com
    D. Maria de Jezus (Jesus) Fernandes por carta de metade, sem contrato antenupcial; sem
    filhos em abril de 1884; doente em 5 de agosto de 1884; não sabia escrever (o testamento e a
    aprovação são assinados a rogo, "por elle dizer que não sabia escrever"); domiciliado na
    Freguezia do Laranjal, termo de Cataguases; falecido em 31 de janeiro de 1885 na sua própria
    casa (declaração do apresentante). O registro diz "Freguezia do Laranjal deste termo", e não
    "São João do Laranjal". A viúva também não sabia escrever; o Tenente Fortunato Gomes da
    Silva assinou por ela a aceitação. Martiniana é "uma menina" que vive em seu poder; o seu
    parentesco com ele não é declarado. O parentesco do apresentante Joaquim José Fernandes com
    o falecido não é declarado e não deve ser inferido do sobrenome.
- text: >-
    Parties and officials. The will: scribe, signatory a rogo and second testamenteiro Alferes
    Manoel Alves Bitancort Vasconcellos; witnesses Manoel Fortunato Alves Bitancort (signing
    "Bittencourt") and Janoario [Corga] dos Reis. The approval (5 August 1884): [Ygnaz] Antonio
    Lima e Silva, escrivão do Juízo de Paz of the freguezia da Cachoeira Alegre; witnesses
    Antonio Affonso dos Santos Lages, José Lages Affonso, Candido Joaquim Fernandes Fraga,
    Manoel Martiniano da Silva and Lucindo Henriques da Costa, who signed a rogo of the
    testator. The opening and autos: the Juiz da Provedoria, Dr. Joaquim Moreira de Barros
    Oliveira Lima ("Mor.a Lima"); the escrivão da Provedoria, Antonio Delfim Silva; the
    presenter Joaquim José Fernandes; witnesses Horacio Alves Ferreira and Alfredo José
    d'Oliveira (opening) and Antonio Januario da Sil[veira] and Horacio Alves Ferreira
    (acceptance); the promotor dos resíduos ad hoc, Dr. Eduardo Ernesto da Gama Cerqueira, a
    lawyer of the foro, named on 13 February and sworn on 16 March 1885 "na casa da Camara".
    The Bittencourt namesakes are leads only; no kinship to the owner's Muniz Bittencourt line
    is shown here.
  text_pt: >-
    Partes e oficiais. O testamento: escrevente, assinante a rogo e segundo testamenteiro, o
    Alferes Manoel Alves Bitancort Vasconcellos; testemunhas Manoel Fortunato Alves Bitancort
    (que assina "Bittencourt") e Janoario [Corga] dos Reis. A aprovação (5 de agosto de 1884):
    [Ygnaz] Antonio Lima e Silva, escrivão do Juízo de Paz da freguesia da Cachoeira Alegre;
    testemunhas Antonio Affonso dos Santos Lages, José Lages Affonso, Candido Joaquim Fernandes
    Fraga, Manoel Martiniano da Silva e Lucindo Henriques da Costa, que assinou a rogo do
    testador. A abertura e os autos: o Juiz da Provedoria, Dr. Joaquim Moreira de Barros
    Oliveira Lima ("Mor.a Lima"); o escrivão da Provedoria, Antonio Delfim Silva; o apresentante
    Joaquim José Fernandes; as testemunhas Horacio Alves Ferreira e Alfredo José d'Oliveira (na
    abertura) e Antonio Januario da Sil[veira] e Horacio Alves Ferreira (na aceitação); o
    promotor dos resíduos ad hoc, Dr. Eduardo Ernesto da Gama Cerqueira, advogado do foro,
    nomeado em 13 de fevereiro e juramentado em 16 de março de 1885 "na casa da Camara". Os
    homônimos Bittencourt são apenas pistas; nenhum parentesco com a linha Muniz Bittencourt do
    proprietário é mostrado aqui.
- text: >-
    Page order and completeness. The film order (images 4–16) is the reading order: the folio
    numbers run 2, [2v], 3, [3v], 4, [4v], 5, [5v], 6, [6v], 7, [7v], 8, and every page break
    continues mid-sentence or mid-act into the next ("Sil-/va", "testa-/mentaria",
    "desem-/penhar", "maio/do anno", "ed. de/Teix. de Frit."). The will (fl. 2–3) is filed
    before its termo de abertura (fl. 3v–4), as the retrieval side reports. The leaf before fl.
    2 and image 17 are not held. A small discrepancy is recorded as written: the will says it
    would be closed with "tres Pingos de lacre e amorado Com linha branca", while the judge
    found it "cosido com cinco pontos de linha preta, com lacre encarnado"; the closing was
    presumably done at the approval, but the record does not say so.
  text_pt: >-
    Ordem das páginas e completude. A ordem do filme (imagens 4–16) é a ordem de leitura: os
    números de folha seguem 2, [2v], 3, [3v], 4, [4v], 5, [5v], 6, [6v], 7, [7v], 8, e cada
    quebra de página continua a meio de frase ou de ato na seguinte ("Sil-/va",
    "testa-/mentaria", "desem-/penhar", "maio/do anno", "ed. de/Teix. de Frit."). O testamento
    (fl. 2–3) vem antes do seu termo de abertura (fl. 3v–4), como relata a pesquisa de
    recuperação. A folha anterior à fl. 2 e a imagem 17 não estão disponíveis. Regista-se uma
    pequena discrepância, tal como escrita: o testamento diz que seria fechado com "tres Pingos
    de lacre e amorado Com linha branca", ao passo que o juiz o encontrou "cosido com cinco
    pontos de linha preta, com lacre encarnado"; o fechamento foi presumivelmente feito na
    aprovação, mas o registro não o diz.
- text: >-
    Modelling. This is a collateral record: Domingos José Fernandes (d. 31 January 1885) is a
    clearly deceased child of Bento José Fernandes and Joaquina Rosa Lopes and can be recorded
    as a documented_children entry on F-0071 citing this source, rather than as a person
    entity. It links the parents and their family and no event. The retrieval side's inference
    that the widow D. Maria de Jesus Fernandes was Manoel João's daughter Maria, later wife of
    André Teixeira Crespo, is neither supported nor contradicted by these pages, which name her
    only as "D. Maria de Jezus Fernandes" / "D. Maria de Jesus Fernandes".
  text_pt: >-
    Modelagem. Este é um registro colateral: Domingos José Fernandes (f. 31 de janeiro de 1885)
    é filho claramente falecido de Bento José Fernandes e de Joaquina Rosa Lopes e pode ser
    registrado como entrada de documented_children na F-0071, citando esta fonte, em vez de
    pessoa modelada. Liga os pais e a sua família e nenhum evento. A inferência da pesquisa de
    recuperação de que a viúva, D. Maria de Jesus Fernandes, era a filha Maria de Manoel João,
    depois mulher de André Teixeira Crespo, não é apoiada nem contrariada por estas páginas, que
    a nomeiam apenas como "D. Maria de Jezus Fernandes" / "D. Maria de Jesus Fernandes".
