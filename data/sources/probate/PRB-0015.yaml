schema_version: 1
id: PRB-0015
title: >-
  Testamento cerrado of Domingos José Fernandes (Monte Alegre, 14 April 1884; approved in the
  freguezia da Cachoeira Alegre, 5 August 1884), natural of São Romão da Ucha, Barcelos, and
  son of Bento José Fernandes and Joaquina Rosa Lopes, with the autos of its opening in the
  Juízo da Provedoria de Cataguases (4 February – 25 September 1885), ending in the judge's
  ruling that the will is null because it passed over his living mother, a forced heir
title_pt: >-
  Testamento cerrado de Domingos José Fernandes (Monte Alegre, 14 de abril de 1884; aprovado
  na freguesia da Cachoeira Alegre, 5 de agosto de 1884), natural de São Romão da Ucha,
  Barcelos, e filho de Bento José Fernandes e de Joaquina Rosa Lopes, com os autos da sua
  abertura no Juízo da Provedoria de Cataguases (4 de fevereiro – 25 de setembro de 1885),
  que terminam com a decisão do juiz de que o testamento é nulo por ter preterido a mãe viva,
  herdeira forçada
record_type: >-
  Closed will (testamento cerrado) with its instrumento de approvação, and the Provedoria
  autos of its opening (termo de abertura), the widow's acceptance of the testamentaria, the
  opinion of the promotor dos resíduos ad hoc and the judge's decision
record_category: court_or_probate
source_form: original
information_quality: mixed
evidence_type: direct
usage: evidence
event_date:
  kind: exact
  value: "1884-04-14"
  original_text: >-
    The will is dated "Monte Alegre 14 de Abril de 1884" (fl. 2v); its instrumento de
    approvação "aos cinco dias do mez de Agosto" 1884, "nesta freguezia da Cachoeira Alegre";
    the termo de abertura "Aos quatro dias do mez de fevereiro, do anno de mil oito centos e
    oitenta e cinco, nesta Cidade de Cataguases"; the judge's decision "Cat.s, 24 de
    septbr.o de 1885"; the last termo "Aos vinte cinco dias do mez de Setembro" 1885. The
    value given is the date of the will, because the testator's own statements of his origin,
    parentage, marriage and heirs are the record's core; the opening date carries the death.
event_place_text: >-
  Monte Alegre (the will); freguezia da Cachoeira Alegre, termo e comarca de São Paulo do
  Muriahé (the approval); Cidade de Cataguases (the opening and the autos); Minas Gerais,
  Brazil
