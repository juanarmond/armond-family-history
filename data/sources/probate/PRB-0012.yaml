transcription: >-
  [Juízo da Provedoria de Nova Friburgo, 2º Ofício: notificação to the testamenteira to
  render the accounts of Francisco José Bohrer's testamentaria, 4 August – 16 September
  1890. Fifteen page images: case pp. 1–2 and 11–23 (fl. 1–2 and 7–12v, plus one blank
  leaf); case pp. 3–10 (fl. 3–6v) are catalogued as PRB-0005. Running transcription: line
  breaks are not kept and words split across lines are joined; spelling as written;
  expansions only in square brackets. The Provedoria escrivão's surname is read "Zamith"
  [uncertain throughout: the copperplate initial reads best as Z, possibly K or H; where it
  stands only in his cursive signature it is marked as such].]

  [p01 — fl. 1 — autuação (case cover), 7 August 1890]

  [top left, small:] Fr [uncertain] [very large archival pencil number:] 96 / 1890 [top
  right:] f. 1 [uncertain] / Nova Friburgo / Juizo da Provedoria / 2º Officio — Escrivão
  Zamith / Roza Eugenia de Lemos Borer — Testam.ª [Testamenteira] / Francisco Joze Borer —
  Testador / Notificação / "Anno do Nascimento de Nosso Senhor Jesus Christo de mil oito
  centos e noventa nesta Cidade de Nova Friburgo em meu cartorio aos sete dias do mez de
  Agosto autuei o officio e certidão que se seguem e faço esta autuação. Eu João José Zamith
  o escrevi." [closing flourish] [bottom left, pencil:] 443

  [p02 — fl. 2 — the escrivão's officio to the Juiz da Provedoria, 4 August 1890, with the
  judge's despacho at the head]

  [top right:] 2. "Ill.mo Snr." [Despacho of the judge in the head space:] "A. [Autuado /
  Autue-se] Intime-se para no praso de 5 dias vir á juizo prestar as contas referidas. Nova
  Friburgo 7 de julho de 1890. [sic: "julho" is clearly written, but the officio it answers
  is dated 4 August and the autuação 7 August 1890] Silva Campos" [Officio:] "Apresento a V.
  S.ª a certidão do testamento com que falleceu Francisco José Borer pela qual verá V. S.ª
  que a testamenteira está no caso de prestar as contas da testamentaria. Saude e
  fraternidade N. Friburgo 4 de Agosto de 1890 [Ill.mo — in the binding gutter] Snr. Dr.
  José Luiz Alves da S.ª [Silva] Campos [Ju — in the gutter]iz da Provedoria de Nova
  Friburgo. P. M.do Snr. [uncertain] 8 [uncertain] de Agosto de 1890 Zamith [rubric] O
  Escrivão João J.e [José] Zamith" [signature with flourish]

  [Here follow case pp. 3–10 (fl. 3–6v): the escrivão's certidão of 27 January 1890 copying
  the Livro de Registro de Testamentos nº 9, fl. 8v — the will of 27 June 1879, its
  approval, its opening on 6 July 1888 and its registration on 24 July 1888. They are
  catalogued and transcribed as PRB-0005.]

  [p11 — fl. 7 — termo de juntada of a petition and document, 12 September 1890]

  [top right:] 7. "Juntada. Aos doze dias do mez de Setembro de mil oitocentos e noventa
  nesta Cidade de Nova Friburgo em meu cartorio ajunto a estes autos a petição e documento
  que se segue e faço este Termo. Eu João José Zamith o escrevi." [A large wavy stroke
  cancels the rest of the page.]

  [p12 — fl. 7v]

  [blank] [Faint show-through from the recto only; at the right edge the start of fl. 8
  recto (p13) is partly visible.]

  [p13 — fl. 8 — petition of the testamenteira, 9 September 1890, with the judge's despacho
  of 12 September 1890; 200-réis stamp]

  [top right:] 8. "Ill[ustrissi]mo Snr. D[outo]r Juiz Provedor" [Despacho in the upper
  space, another hand:] "Venha nos autos. Nova Friburgo 12 de septembro de 1890. Silva
  Campos" [Petition:] "Diz Rosa Eugenia de Lemos Bohrer testamenteira de Francisco José
  Bohrer que tendo procedido a inventario dos bens de seu cazal forão os mesmos
  insufficientes para pagamento dos credores como prova com o documento junto pelo que não
  póde a Supp[licant]e dar cumprimento do testamento pelo que vem requerer a V. S[enhori]a
  se digne consideral-a não obrigada a prestação das contas. P[ede] a V. S[enhori]a
  deferimento E. R. J[ustiç]a [E Receberá Justiça]. Nova Friburgo 9 de Setembro de 1890 A
  rogo de D. Roza Eugenia de Lemos Bohrer Samuel Antonio dos Santos" [Revenue stamp across
  the date and signature, "THESOURO NACIONAL — 200 — REIS — E. U. DO BRAZIL", cancelled by
  the writing over it. Rest of the page blank.]

  [p14 — fl. 8v]

  [blank] [Ink show-through from fl. 8 recto; the edge of fl. 9 recto (p15) shows at the
  right.]

  [p15 — fl. 9 — certidão of the escrivão of the Juízo de Órfãos, 9 September 1890 (the
  petition's "documento junto"; the sentence's "doc. á fls 9"); 200-réis stamp]

  [top right:] 9. "José da Costa Rodrigues, Escrivão do Juizo de Orphãos do termo de Nova
  Friburgo &. Certifico que revendo em meu Cartorio os Autos de Inventario de que é
  inventariante Dona Rosa Eugenia de Lemos Bohrer e inventariado Francisco José Bohrer
  delles consta que os bens descriptos, avaliados e vendidos em praça publica foram rateados
  para pagamento de credores do mesmo inventario, e consequentemente, absorvidos para taes
  pagamentos. O referido é verdade, do que dou fé, e passo o presente por me ser pedido.
  Nova Friburgo, 9 de Setembro de 1890. Eu, José da Costa Rodrigues o escrevi e assignei.
  José da Costa Rodrigues" [Revenue stamp across the date and closing lines, "THESOURO
  NACIONAL — 200 — REIS — E. U. DO BRAZIL", cancelled by the writing over it.]

  [p16 — fl. 9v]

  [blank] [Show-through only; the edge of fl. 10 recto (p17) shows at the right.]

  [p17 — fl. 10 — termo de juntada of the mandado, 12 September 1890]

  [top right:] 10. "Juntada. Aos doze dias do mez de Setembro de mil oito centos e noventa
  nesta Cidade de Nova Friburgo em meu Cartorio ajunto a estes autos o mandado que se segue
  e faço este termo. Eu João José [Zamith — cursive signature, surname uncertain] o escrevi
  [uncertain]." [A long flourish cancels the rest of the page.]

  [p18 — fl. 10v]

  [blank] [The edge of fl. 11 recto (p19) shows at the right.]

  [p19 — fl. 11 — mandado of the Juiz da Provedoria, 8 August 1890, and the oficial de
  justiça's certificate of service, September 1890]

  [top right:] 11. [Mandado:] "O Doutor José Luiz Alvares [uncertain] da Silva Campos Juiz
  da Provedoria nesta Cidade de Nova Friburgo. Manda a qualquer official de Justiça que
  visto este por mim assignado intime[m?] a Roza Eugenia de Lemos Borer para no prazo de 5
  dias vir a Juizo prestar contas da testamentaria do fallecido Francisco José Borer sob
  pena de remoção, sequestro, perda de premio e [illegible]. O que cumpra. Nova Friburgo 8
  de Agosto de 1890. Eu João José [Zamith — cursive signature, surname uncertain] o escrevi
  [uncertain]. Silva Campos" [Certificate of the oficial de justiça, another hand:]
  "Certifico que em cumprimento do mandado supra e sua assignatura intimei nesta Cidade a
  Roza Eugenia de Lemos Borer por todo o contheudo do prezente mandado J. 2oao [uncertain —
  written at the line end; does not fit the sentence] e em sua propria pessoa do que ficou —
  Nazario [uncertain — written at the line end] bem sciente. O referido é verdade e dou
  [fé]. Nova Friburgo 1[0 or 6 — uncertain] de Setembro de 1890 —" [continues overleaf]

  [p20 — fl. 11v — signature closing the certificate]

  "O official de justiça Nazario Luiz Antonio Telles [uncertain: Telles / Stelles /
  Thelles]" [The rest of the page is cancelled with a long wavy stroke; show-through of fl.
  11 recto only.]

  [p21 — fl. [12] (no folio number visible) — conclusão, 12 September 1890; the judge's
  sentence, 16 September 1890; termo de publicação]

  [Conclusão, escrivão's hand:] "Conclusão [illegible] faço conclusos ao Juiz Provedor
  Doutor José Luiz Alvares da Silva Campos e faço este termo. Eu João José [Zamith — cursive
  signature, surname uncertain] escrevy Em 12 de 7bro [Setembro] de 1890" [Sentence, the
  judge's own hand:] "Em vista do doc. á fls 9, julgo por sentença a testamenteira Roza
  Eugenia de Lemos Boher exonerada da prestação de contas de sua testamentaria. Custas ex
  causa, publique-se em cartorio, intime-se. Nova Friburgo 16 de setembro de 1890. J. Luiz
  Alvares da Silva Campos." [Termo de publicação, escrivão's hand:] "Publicação No mesmo dia
  mez e anno e logar supra declarado em meu Cartorio me foram entregues estes autos com a
  sentença supra e faço este termo. Eu João José [Zamith — cursive signature, surname
  uncertain] o

  [p22 — fl. [12v] — end of the termo de publicação; two revenue stamps]

  escrevy N. Friburgo 1[6 — uncertain] de 7bro [Setembro] 1890" [signature of the escrivão
  João José, surname uncertain — the same cursive signature as above] [Two revenue stamps
  side by side, cancelled by the date and signature written across them: "THESOURO NACIONAL
  — 200 [last digit partly covered] — REIS — E. U. DO BRAZIL" and "THESOURO NACIONAL — 100 —
  REIS — E. U. DO BRAZIL". Rest of the page blank.]

  [p23 — unnumbered leaf]

  [blank] [Blank ruled leaf; no folio number.]
abstract: >-
  Proceedings of the Juízo da Provedoria de Nova Friburgo (2º Ofício) on the testamentaria
  of Francisco José Bohrer (P-0034, d. 6 July 1888). On 4 August 1890 the escrivão João José
  Zamith [uncertain] presented to the judge, Dr. José Luiz Alvares da Silva Campos, the
  certidão of the registered will (PRB-0005), showing that "a testamenteira está no caso de
  prestar as contas da testamentaria". The judge ordered her summoned to render the accounts
  within 5 days; the mandado of 8 August 1890 threatened "remoção, sequestro, perda de
  premio", and the oficial de justiça served it on Rosa Eugenia de Lemos Borer (P-0035) "em
  sua propria pessoa" in Nova Friburgo in September 1890. By a petition of 9 September 1890,
  signed "a rogo" by Samuel Antonio dos Santos, Rosa, the first testamenteira, answered that
  the inventory of the couple's goods ("os bens de seu cazal") had not sufficed to pay the
  creditors, so she could not "dar cumprimento do testamento", and asked to be declared not
  obliged to render accounts. She attached a certidão of the same day by José da Costa
  Rodrigues, escrivão of the Juízo de Órfãos: in the inventário (inventariante Rosa,
  inventariado Francisco José Bohrer) the goods were described, appraised, sold at public
  auction, prorated among the creditors and "consequentemente, absorvidos para taes
  pagamentos". By sentence of 16 September 1890 the judge, "em vista do doc. á fls 9",
  declared her "exonerada da prestação de contas de sua testamentaria", costs ex causa.
  Direct primary evidence of Rosa's executorship and of the outcome, and (through the
  certidão) that the estate was insolvent, so that nothing of it can have passed to the
  heirs or paid the will's legacies [inferred from "absorvidos"]; Rosa was alive in Nova
  Friburgo in September 1890.
abstract_pt: >-
  Autos do Juízo da Provedoria de Nova Friburgo (2º Ofício) sobre a testamentaria de
  Francisco José Bohrer (P-0034, f. 6 de julho de 1888). Em 4 de agosto de 1890 o escrivão
  João José Zamith [incerto] apresentou ao juiz, Dr. José Luiz Alvares da Silva Campos, a
  certidão do testamento registrado (PRB-0005), pela qual "a testamenteira está no caso de
  prestar as contas da testamentaria". O juiz mandou intimá-la a prestar as contas em 5
  dias; o mandado de 8 de agosto de 1890 cominava "remoção, sequestro, perda de premio", e o
  oficial de justiça intimou Rosa Eugenia de Lemos Borer (P-0035) "em sua propria pessoa" em
  Nova Friburgo, em setembro de 1890. Por petição de 9 de setembro de 1890, assinada "a
  rogo" por Samuel Antonio dos Santos, Rosa, primeira testamenteira, respondeu que o
  inventário dos bens do casal ("os bens de seu cazal") não bastara para pagar os credores,
  de modo que não podia "dar cumprimento do testamento", e pediu para ser considerada não
  obrigada à prestação de contas. Juntou certidão do mesmo dia de José da Costa Rodrigues,
  escrivão do Juízo de Órfãos: no inventário (inventariante Rosa, inventariado Francisco
  José Bohrer) os bens foram descritos, avaliados, vendidos em praça pública, rateados entre
  os credores e "consequentemente, absorvidos para taes pagamentos". Por sentença de 16 de
  setembro de 1890 o juiz, "em vista do doc. á fls 9", julgou-a "exonerada da prestação de
  contas de sua testamentaria", custas ex causa. Evidência primária direta da testamentaria
  de Rosa e do desfecho, e (pela certidão) de que o espólio era insolvente, de modo que nada
  dele pode ter passado aos herdeiros ou pago os legados do testamento [inferido de
  "absorvidos"]; Rosa estava viva em Nova Friburgo em setembro de 1890.
reliability:
  assessment: >-
    Original court proceedings written in the course of the case by the officials concerned:
    direct primary evidence of Rosa Eugenia de Lemos's executorship, of the summons and its
    service, of her petition and of the sentence of 16 September 1890; the insolvency of the
    estate is certified from the inventário by the escrivão of the Juízo de Órfãos.
  informant: >-
    The escrivão of the Provedoria (officio, termos), the judge (despachos, mandado,
    sentence), the oficial de justiça (certificate of service), José da Costa Rodrigues,
    escrivão of the Juízo de Órfãos (certidão drawn from the inventário), and Rosa Eugenia
    de Lemos through her petition, written and signed a rogo.
  limitations: >-
    The insolvency is certified at second hand from the inventário, which is not held: no
    property list, debts, creditors, heirs' ages or amounts appear here (the only sums are
    revenue stamps). Peripheral readings are uncertain: the escrivão's surname (Zamith /
    Kamith / Hamitt), the officer's surname (Telles), one word of the penalty clause and the
    first word of the conclusão (illegible), and the day of service (10 or 16 September).
    The judge's despacho on fl. 2 is dated "julho" for August.
