notes:
- text: >-
    The judge's despacho at the head of fl. 2 (p02) is dated "Nova Friburgo 7 de julho de
    1890" — "julho" is clearly written — but it answers the escrivão's officio of 4 August
    1890 and precedes the autuação of 7 August and the mandado of 8 August, so it is
    evidently a slip for 7 August [inferred]. The uncertain marginal note "P. M.do Snr. … 8
    de Agosto de 1890" on the same page fits that sequence.
  text_pt: >-
    O despacho do juiz no alto da fl. 2 (p02) está datado "Nova Friburgo 7 de julho de 1890"
    — "julho" está claramente escrito —, mas responde ao ofício do escrivão de 4 de agosto
    de 1890 e precede a autuação de 7 de agosto e o mandado de 8 de agosto; é, portanto,
    evidentemente um lapso por 7 de agosto [inferido]. A nota marginal incerta "P. M.do Snr.
    … 8 de Agosto de 1890" na mesma página condiz com essa sequência.
- text: >-
    The escrivão's surname. On the cover and in the termos written by the copyist it reads
    "Zamith" (the copperplate initial reads best as Z, possibly K); in his own cursive
    signature (pp. 17, 19, 21, 22) it reads approximately "Zamiz" / "Kram[m]iz" / "Lamiz".
    The retrieval side reads "Hamitt(h)", and PRB-0005 formerly read "Kramith[?]". No "r"
    appears in any copied occurrence, so "Kramith" is not supported. The same man was
    tabellião in 1879 (he wrote and approved the will) and escrivão of the Provedoria in
    1888–90, styled "Capitão" in the 1890 certidão. The form is kept [uncertain] pending a
    clearer exemplar.
  text_pt: >-
    O sobrenome do escrivão. Na capa e nos termos escritos pelo copista lê-se "Zamith" (a
    inicial caligráfica lê-se melhor como Z, talvez K); na sua própria assinatura cursiva
    (pp. 17, 19, 21, 22) lê-se aproximadamente "Zamiz" / "Kram[m]iz" / "Lamiz". O lado da
    recuperação lê "Hamitt(h)", e PRB-0005 lia antes "Kramith[?]". Não há "r" em nenhuma
    ocorrência copiada, de modo que "Kramith" não se sustenta. O mesmo homem foi tabelião em
    1879 (escreveu e aprovou o testamento) e escrivão da Provedoria em 1888–90, chamado
    "Capitão" na certidão de 1890. A forma fica [incerta] até um exemplar mais claro.
- text: >-
    Other readings. The judge is addressed "Dr. José Luiz Alves da S.ª Campos" on fl. 2 but
    signs his sentence "J. Luiz Alvares da Silva Campos" (p21), the clearest form. The day
    of service on p19 reads 1[0] or 1[6] September; 10 September fits the juntada of the
    mandado on 12 September [inferred]. Surname forms: Bohrer (pp. 13, 15), Borer (cover,
    pp. 2, 19), Boher (p21); Rosa / Roza; Joze (cover). Rosa's petition is signed "A rogo de
    D. Roza Eugenia de Lemos Bohrer — Samuel Antonio dos Santos", consistent with her termo
    de acceitação of 24 July 1888, signed for her "por dizer não saber escrever" (PRB-0005);
    Samuel Antonio dos Santos was the will's third testamenteiro.
  text_pt: >-
    Outras leituras. O juiz é tratado por "Dr. José Luiz Alves da S.ª Campos" na fl. 2, mas
    assina a sentença "J. Luiz Alvares da Silva Campos" (p21), a forma mais clara. O dia da
    intimação na p19 lê-se 1[0] ou 1[6] de setembro; 10 de setembro condiz com a juntada do
    mandado em 12 de setembro [inferido]. Formas do sobrenome: Bohrer (pp. 13, 15), Borer
    (capa, pp. 2, 19), Boher (p21); Rosa / Roza; Joze (capa). A petição de Rosa é assinada
    "A rogo de D. Roza Eugenia de Lemos Bohrer — Samuel Antonio dos Santos", coerente com o
    seu termo de acceitação de 24 de julho de 1888, assinado por ela "por dizer não saber
    escrever" (PRB-0005); Samuel Antonio dos Santos era o terceiro testamenteiro do
    testamento.
- text: >-
    Pages. The case runs to 23 images; this source holds pp. 1–2 and 11–23, and PRB-0005
    holds pp. 3–10 (the escrivão's certidão of 27 January 1890, which he filed with his
    officio of 4 August 1890 — the "officio e certidão" of the autuação). Pp. 12, 14, 16, 18
    and 23 are blank and are kept so that the case is catalogued whole. The inventário
    itself (Juízo de Órfãos de Nova Friburgo, 1888–90) is not held; the retrieval side
    reports it located on FamilySearch (DGS 105875671, about 300 images) [LEAD].
