title: >-
  Contas testamentárias of the estate of Francisco José Bohrer (Juízo da Provedoria de Nova
  Friburgo, 1890): his widow and executrix Rosa Eugenia de Lemos is summoned to render the
  executor's accounts and is exonerated, the inventoried estate having been sold at auction
  and absorbed by the creditors
title_pt: >-
  Contas testamentárias do espólio de Francisco José Bohrer (Juízo da Provedoria de Nova
  Friburgo, 1890): sua viúva e testamenteira Rosa Eugenia de Lemos é intimada a prestar as
  contas da testamentaria e é exonerada, porque os bens inventariados foram vendidos em
  praça e absorvidos pelos credores
