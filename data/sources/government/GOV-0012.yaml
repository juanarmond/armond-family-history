notes:
  - text: >-
      BOUNDED NEGATIVE, worded to the pages actually searched. All 26 pages of this
      list, left sheet and right sheet separately, were swept for Armond by sound
      rather than by spelling (ARMOND, ARMONDE, ARMENDE, ARMENDES, ERMONDE, ORMONDE,
      ARMANDE, ALMENDES, DRUMMOND, FERREIRA ARMENDES) and no occurrence was found;
      neither was any Souto Maior, nor any Ponte Cardoso compound, nor any Alferes,
      Capitão, Coronel, Tenente or Sargento in the district. TWO EXACT QUALIFICATIONS,
      so that the negative is not overstated: (a) "no Fagundes" holds for every legible
      cell, but ONE is not legible — the head of fogo 33 (page 12, right sheet) reads
      "José F[…]des da Costa", equally consistent with Fernandes or Fagundes and faded
      past reading at this scan's resolution; it is left unresolved rather than counted
      either way, and is in no case an Armond; (b) "no Ponte Cardoso" means no compound
      with "Ponte": two bare Cardozos do occur, José Paulo Cardozo (fogo 99) and a
      six-year-old Francisco Cardozo (fogo 115). VERIFICATION: the sweep was re-run
      independently inside this repository on 2026-09-24, over all 26 pages and all 52
      sheets, before this bounded negative was written down; no sheet went unread, and
      the result agreed with the retrieval agent's. What this proves is that no such
      name was written on these 26 pages of the Juiz de Fora district list for 1831,
      subject to qualification (a). It does NOT prove
      absence from any other district, from any other year, or from any unindexed
      register. In particular it says nothing about the Serra de Ibitipoca, about Santa
      Rita do Meia Pataca, or about Barbacena's own parish books, which remain the
      live targets. Do not re-run this search on this document.
    text_pt: >-
      NEGATIVO DELIMITADO, formulado às páginas efectivamente pesquisadas. As 26 páginas
      desta relação, folha esquerda e folha direita separadamente, foram varridas em
      busca de Armond por som e não por grafia (ARMOND, ARMONDE, ARMENDE, ARMENDES,
      ERMONDE, ORMONDE, ARMANDE, ALMENDES, DRUMMOND, FERREIRA ARMENDES) sem qualquer
      ocorrência; também não há Souto Maior, nem qualquer composto com Ponte Cardoso,
      nem Alferes, Capitão, Coronel, Tenente ou Sargento no distrito. DUAS RESSALVAS
      EXACTAS, para que o negativo não seja exagerado: (a) "sem Fagundes" vale para
      todas as células legíveis, mas UMA não é legível — o chefe do fogo 33 (pág. 12,
      folha direita) lê-se "José F[…]des da Costa", igualmente compatível com Fernandes
      ou Fagundes e desvanecido para além da leitura nesta digitalização; fica por
      resolver em vez de contado para um dos lados, e em caso algum é um Armond; (b)
      "sem Ponte Cardoso" significa sem composto com "Ponte": há dois Cardozo isolados,
      José Paulo Cardozo (fogo 99) e um Francisco Cardozo de seis anos (fogo 115).
      VERIFICAÇÃO: o varrimento foi repetido de forma independente dentro deste
      repositório a 2026-09-24, sobre as 26 páginas e as 52 folhas, antes de este
      negativo delimitado ser escrito; nenhuma folha ficou por ler e o resultado
      coincidiu com o do agente de recolha. O que isto prova é que nenhum desses nomes
      foi escrito nestas 26 páginas da relação do districto do Juiz de Fora de 1831,
      com a ressalva (a). NÃO
      prova ausência de qualquer outro distrito, de qualquer outro ano, ou de qualquer
      registo não indexado. Em particular, nada diz sobre a Serra de Ibitipoca, sobre
      Santa Rita do Meia Pataca, ou sobre os livros paroquiais da própria Barbacena, que
      continuam a ser os alvos vivos. Não repetir esta busca neste documento.
  - text: >-
      [LEAD — NOT AN ANCESTOR] The two Toledo households. Toledo reaches this line
      through Eliza Balbina de Toledo (P-0017), wife of Simplício José Ferreira Armond
      (P-0016), so a Toledo in the right termo in 1831 is worth recording. José Antonio
      de Toledo (fogo 109, white, 54, so b. ~1777, married, roceiro) is NOT the father
      of José Cesário de Toledo Lima: that filiation is documented as Ladisláo Egídio
      Ferreira de Toledo × Matilde Maria de Jesus (m. 1810 São João del Rei; José
      Cesário bapt. 1813). The live and untested possibility is that José Antonio was
      Ladisláo's BROTHER, which would make him Eliza Balbina's great-uncle —
      chronologically viable and nothing more. Note also that these Toledos are of
      modest means (roceiros, no enslaved people in fogo 109, and the fogo 110 Manoel
      lodging inside another man's household), a different profile from the propertied
      Toledos of the 1867 and 1879 partilhas. Same surname in the right termo is not
      the same family. Test it through José Antonio's own baptism or marriage naming
      his parents; do not model either man as a person until then.
    text_pt: >-
      [PISTA — NÃO É ANTEPASSADO] Os dois fogos Toledo. Os Toledo chegam a esta linha
      através de Eliza Balbina de Toledo (P-0017), mulher de Simplício José Ferreira
      Armond (P-0016), pelo que um Toledo no termo certo em 1831 merece registo. José
      Antonio de Toledo (fogo 109, branco, 54, logo n. ~1777, casado, roceiro) NÃO é o
      pai de José Cesário de Toledo Lima: essa filiação está documentada como Ladisláo
      Egídio Ferreira de Toledo × Matilde Maria de Jesus (cas. 1810, São João del Rei;
      José Cesário bapt. 1813). A possibilidade viva e por testar é que José Antonio
      fosse IRMÃO de Ladisláo, o que faria dele tio-avô de Eliza Balbina —
      cronologicamente viável e nada mais. Note-se ainda que estes Toledo são de meios
      modestos (roceiros, sem pessoas escravizadas no fogo 109, e o Manoel do fogo 110
      alojado no fogo de outro homem), perfil diferente do dos Toledo proprietários das
      partilhas de 1867 e 1879. O mesmo apelido no termo certo não é a mesma família.
      Testar pelo baptismo ou casamento do próprio José Antonio, que nomeie os seus pais;
      até lá, não modelar nenhum dos dois como pessoa.
  - text: >-
      CORRECTED TOTALS — supersedes every earlier figure. 118 fogos · 586 livres · 833
      captivos · 1,419 habitantes, certified 18 February 1831. The original writes the
      total "1:419", using the colon as a thousands separator in the nineteenth-century
      Brazilian convention also used for réis amounts (3:885$000). Two earlier readings
      of this same certification were wrong — one took "1:419" for the number of free
      people (419), the other assumed a total of 1,449 and derived 616 free. Neither is
      a palaeographic error; both are errors of numeric convention. The correct reading
      validates itself: 586 + 833 = 1,419. Watch for this notation in any Brazilian
      document of the period.
    text_pt: >-
      TOTAIS CORRIGIDOS — substituem todos os números anteriores. 118 fogos · 586 livres
      · 833 captivos · 1 419 habitantes, certificados a 18 de Fevereiro de 1831. O
      original escreve o total "1:419", usando os dois pontos como separador de milhares
      na convenção brasileira oitocentista que também servia para os valores em réis
      (3:885$000). Duas leituras anteriores desta mesma certificação estavam erradas —
      uma tomou "1:419" pelo número de livres (419), a outra presumiu um total de 1 449 e
      derivou 616 livres. Nenhum dos erros é de paleografia; ambos são de convenção
      numérica. A leitura correcta valida-se por si: 586 + 833 = 1 419. Atenção a esta
      notação em qualquer documento brasileiro do período.
  - text: >-
      Two false Armond positives, recorded so that nobody re-finds them. (a) The fogo 3
      name that an initial sweep read as "Rosa Joanna do Valle ARMADA" was read on
      re-examination as "do Valle AMADA", without the r. The two readings differ on that
      one letter and neither is an Armond variant: "armada" and "amada" are ordinary
      Portuguese words and the surname there is do Valle. (b) The same initial sweep,
      made over the still-rotated scans, read fogo 77 (page 18) as "d'Armanda"; with the
      rotation corrected it reads unambiguously "Silverio da Silva BRANDAÕ, Pardo, 38,
      Cazado, Jornaleiro", with Anna Antonia, crioula, 26, and Francisco Silverio,
      crioulo, 8 — a cursive capital B followed by "randaõ", with no apostrophe and no
      leading A. This was re-confirmed at magnification on 2026-09-24. Rotation turned
      Brandão into a false Armond and could as easily have turned a real Armond into a
      miss, which is why the uncorrected sweep was discarded.
    text_pt: >-
      Dois falsos positivos de Armond, registados para que ninguém os volte a
      "descobrir". (a) O nome do fogo 3 que um varrimento inicial leu como "Rosa Joanna
      do Valle ARMADA" foi relido como "do Valle AMADA", sem o r. As duas leituras
      divergem nessa única letra e nenhuma é variante de Armond: "armada" e "amada" são
      palavras portuguesas correntes e o apelido ali é do Valle. (b) O mesmo varrimento
      inicial, feito sobre as digitalizações ainda rodadas, leu o fogo 77 (pág. 18) como
      "d'Armanda"; corrigida a rotação, lê-se sem ambiguidade "Silverio da Silva BRANDAÕ,
      Pardo, 38, Cazado, Jornaleiro", com Anna Antonia, crioula, 26, e Francisco
      Silverio, crioulo, 8 — um B maiúsculo cursivo seguido de "randaõ", sem apóstrofo e
      sem A inicial. Releitura confirmada com ampliação a 2026-09-24. A rotação
      transformou Brandão num falso Armond e poderia com a mesma facilidade ter
      transformado um Armond verdadeiro numa omissão, razão pela qual o varrimento não
      corrigido foi descartado.
  - text: >-
      Scope of this transcription, stated so that nobody mistakes it for the whole. The
      `transcription` field holds an extract: the closing certification, fogos 109 and
      110, the last fogo, and the negative result — the passages this archive relies on,
      each read directly from the page image. The remaining 115 households, and the 833
      enslaved people the list names, are NOT transcribed here; all 26 pages are
      catalogued and held, so the full text is available in the images themselves. A
      1,827-line fogo-by-fogo working transcription of the whole corpus was produced by
      the external retrieval agent and lives outside this repository; it is unverified
      derivative work and was deliberately not folded in as though it were a read of the
      record. Anyone needing a specific household should read that household's page.
    text_pt: >-
      Âmbito desta transcrição, declarado para que ninguém a tome pelo todo. O campo
      `transcription` contém um extracto: a certificação final, os fogos 109 e 110, o
      último fogo e o resultado negativo — as passagens de que este arquivo depende, cada
      uma lida directamente da imagem da página. Os restantes 115 fogos, e as 833 pessoas
      escravizadas que a relação nomeia, NÃO estão aqui transcritos; as 26 páginas estão
      catalogadas e guardadas, pelo que o texto integral está disponível nas próprias
      imagens. Uma transcrição de trabalho, fogo a fogo, com 1 827 linhas, foi produzida
      pelo agente externo de recolha e vive fora deste repositório; é trabalho derivado
      não verificado e foi deliberadamente não incorporado como se fosse uma leitura do
      documento. Quem precisar de um fogo concreto deve ler a página desse fogo.
  - text: >-
      Handling note, technical. The 26 PDFs held here are the owner's
      ROTATION-CORRECTED set and render landscape; do NOT rotate them again. The
      as-received originals had the rotation baked into the image content while
      pdfinfo reported rot=0 on every page, so there was no metadata signal and the
      fault could only be seen by eye; an automated projection-profile orientation
      detector was tried and failed, because the long horizontal rules of this table
      swamp the text-line periodicity the method depends on. If another APM census
      turns up in this state, correct it by eye. The as-received files remain only in
      the retrieval drop, which is gitignored and overwritten on each sync.
    text_pt: >-
      Nota técnica de manuseamento. Os 26 PDFs aqui guardados são o conjunto CORRIGIDO
      DE ROTAÇÃO pelo proprietário e apresentam-se em paisagem; NÃO os voltar a rodar. Os
      originais tal como recebidos tinham a rotação incorporada no próprio conteúdo da
      imagem, enquanto o pdfinfo indicava rot=0 em todas as páginas, pelo que não havia
      sinal nos metadados e a falha só se detectava a olho; tentou-se um detector
      automático de orientação por perfil de projecção, que falhou, porque as longas
      pautas horizontais desta tabela abafam a periodicidade das linhas de texto de que o
      método depende. Se outro censo do APM surgir neste estado, corrigi-lo a olho. Os
      ficheiros tal como recebidos permanecem apenas na entrega de recolha, que está
      gitignored e é sobrescrita a cada sincronização.
  - text: >-
      The enslaved population is part of this record and is not to be omitted. The list
      enumerates 833 enslaved people by given name, with the enumerator's terms for
      colour and condition (Africano, Crioulo, Cabra, Pardo; Captivo/Captiva), against
      586 free inhabitants — 58.7 per cent of the district. The largest holding is fogo
      102 (Antonio Dias Portes, a coffee estate, 80+ enslaved people). Any count,
      summary or transcription drawn from this source must include them.
    text_pt: >-
      A população escravizada faz parte deste documento e não deve ser omitida. A relação
      arrola 833 pessoas escravizadas pelo nome próprio, com os termos que o recenseador
      usou para cor e condição (Africano, Crioulo, Cabra, Pardo; Captivo/Captiva), contra
      586 habitantes livres — 58,7 % do distrito. A maior posse é a do fogo 102 (Antonio
      Dias Portes, propriedade cafeeira, mais de 80 pessoas escravizadas). Qualquer
      contagem, resumo ou transcrição feita a partir desta fonte tem de as incluir.
  - text: >-
      Why the district matters at all, and what the negative is worth. In 1831 Juiz de
      Fora fell within the Termo de Barbacena, the Ferreira Armond jurisdiction, which
      is why the list was searched. Its social profile — smallholding roceiros and
      jornaleiros, overwhelmingly pardo and crioulo, with a single large coffee estate
      and not one military title — is markedly unlike the titled, propertied Ferreira
      Armond of Barbacena. That is context, not argument: the absence of the name is the
      finding, and the demographic contrast merely makes it unsurprising. Nilza
      Cantoni's separate statement that the Ferreira Armond lived in the SERRA DE
      IBITIPOCA is a lead this negative leaves standing.
    text_pt: >-
      Por que importa o distrito, e quanto vale o negativo. Em 1831 o Juiz de Fora
      estava dentro do Termo de Barbacena, a jurisdição dos Ferreira Armond, razão pela
      qual a relação foi pesquisada. O seu perfil social — roceiros e jornaleiros de
      pequena posse, esmagadoramente pardos e crioulos, com uma única grande propriedade
      cafeeira e nenhum título militar — é bastante diferente do dos Ferreira Armond de
      Barbacena, titulados e proprietários. Isso é contexto, não argumento: o achado é a
      ausência do nome, e o contraste demográfico apenas a torna pouco surpreendente. A
      afirmação separada de Nilza Cantoni de que os Ferreira Armond viveram na SERRA DE
      IBITIPOCA é uma pista que este negativo deixa de pé.
