transcription: >-
  [Extracto transcrito do Mapa de População de Santo Antonio do Juiz de Fora, 1831
  (APM, Cx 07, Doc 04), 26 páginas. As três passagens abaixo — a certificação final, o
  fogo 109 e o fogo 110 — foram lidas directamente das imagens a 200 dpi a 24 de
  Setembro de 2026. Este campo NÃO é a transcrição integral dos 118 fogos: ver a nota
  "Scope of this transcription" abaixo. Colunas do original: Habitantes · Qualidade ·
  Condição · Idade · Estado · Ocupações. A página 01 é folha única (rosto + fogo 1);
  cada uma das páginas 02–26 é um SPREAD DE DUAS FOLHAS fotografadas lado a lado, cada
  uma com o seu conjunto completo de colunas, e a numeração dos fogos corre através das
  duas.]


  [CERTIFICAÇÃO FINAL — pé da página 26, leitura directa:] "Districto de Santo Antonio
  de Juiz de Fora 18 de Fev.º de 1831 / José Bastos Pinto — Fogos — 118 / Habit.es
  ——— 1:419 / Livres ————— 586 ⎫ 1:419 / Captivos ———— 833 ⎭".

  [Nota de leitura numérica:] o documento escreve o total como "1:419", usando os dois
  pontos como SEPARADOR DE MILHARES (convenção brasileira oitocentista, a mesma dos
  valores em réis). Significa 1 419, e a leitura valida-se por si: 586 + 833 = 1 419.
  Leituras anteriores de 616 livres, de 419 habitantes e de um total de 1 449 são
  ERRADAS e não devem ser repetidas. Assim, 833 dos 1 419 habitantes do distrito — 58,7
  % — eram pessoas escravizadas.


  [FOGO 109 — página 24, folha direita; leitura directa:] Jose Antonio de Tolledo ·
  Branco · [livre] · 54 · Cazado · Rosseiro; Jenovefa [Genovefa] Maria · dito · 36 ·
  Cazada; Narcizo genro [genro = son-in-law] · dito · 30 · Cazado · Rosseiro; Maria de
  Tolledo · dito · 20 · Cazada; Joaquina de Oliveira · dito · 7; Antonio de Oliveira ·
  dito · 5; Francisca de Olivi.ª [Oliveira] · dito · 3. A coluna "Condição" está em
  branco em todas as linhas (pessoas livres) e o fogo NÃO regista nenhuma pessoa
  escravizada.


  [FOGO 110 — página 25, folha esquerda; leitura directa:] Joaquim Coelho · Pardo ·
  [livre] · 40 · Cazado · Roceiro; Maria Jacinta · dito · 36 · Cazada; Manoel Coelho ·
  dito · 15 · Solteiro; [linha em branco;] Manoel de Tolledo · dito · 30 · Cazado ·
  Roceiro; Gertrudes Maria · dito · 20 · Cazada. Manoel de Tolledo NÃO é o chefe do
  fogo 110: a coluna do número do fogo está EM BRANCO nas suas duas linhas (o número
  110 está lançado contra Joaquim Coelho, e o número seguinte, 111, contra Venancio de
  Lima Rocha), pelo que ele e a mulher são agregados alojados no fogo de Joaquim
  Coelho, cada um com a sua qualidade, idade e estado, e ele com ocupação própria.

  [Grafia:] o escrivão escreve "Tolledo", com duplo l, nas três ocorrências (fogos 109
  e 110); a esta resolução não se pode excluir de todo um "Toledo" de l simples
  [uncertain].


  [ÚLTIMO FOGO — página 26, folha direita:] José Albino · Pardo · Livre · 24 · Cazado ·
  Rosseiro; Francisca Antonia · dito · 24 · Cazada; Domingos · dito · 2.


  [RESULTADO NEGATIVO — Armond:] varrimento das 26 páginas, folha esquerda e folha
  direita separadamente, procurando POR SOM e não por grafia: ARMOND · ARMONDE ·
  ARMENDE · ARMENDES · ERMONDE · ORMONDE · ARMANDE · ALMENDES · DRUMMOND · FERREIRA
  ARMENDES. NENHUMA ocorrência em nenhuma das 52 folhas. Nenhuma folha ficou por ler.
  O apelido FERREIRA ocorre isolado ou noutros compostos, nunca ligado a um elemento
  Armond. Nenhum ALFERES, CAPITÃO, CORONEL, TENENTE ou SARGENTO em todo o distrito.

  [Apelidos-alvo, com as ressalvas exactas:] SOUTO MAIOR — ausente. PONTE
  CARDOSO/CARDOZO — nenhum composto com "Ponte"; há dois "Cardozo" isolados, José Paulo
  Cardozo (fogo 99) e Francisco Cardozo (criança de 6 anos, fogo 115). FAGUNDES —
  nenhuma ocorrência lida, com UMA célula por resolver: o chefe do fogo 33 (pág. 12,
  folha direita) lê-se "José F[…]des da Costa" (Branco, 32, cazado, roceiro; mulher
  Josefa Maria, 22; filha Maria Josefa, 3), compatível tanto com Fernandes como com
  Fagundes, e desvanecido para além da leitura. Fica registado como POR RESOLVER em vez
  de contado para um dos lados; em caso algum é um Armond.

  [Falsos positivos a não voltar a "descobrir":] (1) o nome da fogo 3 lido pelo
  varrimento inicial como "Rosa Joanna do Valle ARMADA" foi relido como "do Valle
  AMADA" (sem r); as duas leituras divergem nessa letra e nenhuma delas é variante de
  Armond — "armada"/"amada" são palavras portuguesas correntes e o apelido ali é do
  Valle. (2) Um varrimento inicial, feito sobre as digitalizações ainda rodadas, leu o
  fogo 77 (pág. 18) como "d'Armanda"; corrigida a rotação, lê-se sem ambiguidade
  "Silverio da Silva BRANDAÕ · Pardo · 38 · Cazado · Jornaleiro" (com Anna Antonia,
  crioula, 26, e Francisco Silverio, crioulo, 8) — capital B cursivo seguido de
  "randaõ", sem apóstrofo e sem A inicial. A rotação transformou Brandão num falso
  Armond — e pode igualmente transformar um Armond verdadeiro numa omissão.

  [Duas armadilhas de leitura da palavra "Capitão":] (1) "Captivo" repete-se por toda a
  coluna Condição, muitas vezes abreviado, e à primeira vista assemelha-se a "Capitão";
  é a condição de cativo, não uma patente. (2) Na pág. 25, folha direita, o rol do fogo
  113 traz um homem escravizado chamado "Jose Capitão" (Africano, cativo, 25, solteiro)
  — alcunha na coluna dos Habitantes, não um posto militar. A assinatura de fecho da
  pág. 26, "José Bastos Pinto", não traz patente alguma.
abstract: >-
  The complete 26-page manuscript population map of the district of Santo Antonio do
  Juiz de Fora, then within the Termo de Barbacena — the same jurisdiction as the
  Ferreira Armond of Barbacena — certified on 18 February 1831 by the district
  official José Bastos Pinto, himself fogo 1. It enumerates 118 households: 586 free
  people and 833 enslaved people, 1,419 inhabitants in all, so 58.7 per cent of the
  district was enslaved. Its value to this archive is chiefly negative: no Armond in
  any spelling appears anywhere in it, nor any Souto Maior, nor any Ponte Cardoso
  compound, nor any military title, nor — with one illegible cell at fogo 33 left
  expressly open — any Fagundes. It also yields two Toledo households — José
  Antonio de Toledo (fogo 109, white, 54, married, roceiro) and Manoel de Toledo (fogo
  110, pardo, 30, married, roceiro, lodging in Joaquim Coelho's household) — recorded
  here as leads only.
abstract_pt: >-
  O mapa de população manuscrito completo, em 26 páginas, do districto de Santo
  Antonio do Juiz de Fora, então dentro do Termo de Barbacena — a mesma jurisdição dos
  Ferreira Armond de Barbacena —, certificado a 18 de Fevereiro de 1831 pelo oficial do
  distrito José Bastos Pinto, ele próprio o fogo 1. Arrola 118 fogos: 586 pessoas livres
  e 833 pessoas escravizadas, 1 419 habitantes ao todo, ou seja 58,7 % do distrito em
  cativeiro. O seu valor para este arquivo é sobretudo negativo: nenhum Armond, em
  grafia alguma, aparece em parte alguma do documento, nem qualquer Souto Maior, nem
  qualquer composto com Ponte Cardoso, nem qualquer título militar, nem — deixando
  expressamente em aberto uma célula ilegível no fogo 33 — qualquer Fagundes. Revela
  também dois
  fogos Toledo — José Antonio de Toledo (fogo 109, branco, 54, casado, roceiro) e Manoel
  de Toledo (fogo 110, pardo, 30, casado, roceiro, alojado no fogo de Joaquim Coelho) —
  aqui registados apenas como pistas.
reliability:
  assessment: >-
    A contemporary official enumeration, held as photographs of the APM manuscript
    itself, so both the form and the information are primary. The three passages
    transcribed above — the certification, fogo 109 and fogo 110 — were read directly
    from the page images and are reliable. The document is filed as context_only
    because it names no person identified with this repository's line: its
    genealogical work is to exclude a district and to raise a lead.
  informant: >-
    José Bastos Pinto, the district official who compiled, certified and signed the
    list on 18 February 1831 and who is himself enumerated as fogo 1. Supplied to the
    owner by the genealogist Nilza Cantoni on 2026-09-24, from her own March 2018
    capture of the APM image viewer.
  limitations: >-
    (1) The negative result is bounded to this document. It shows only that no Armond
    variant was written on these 26 pages of this one district list for this one year.
    It says nothing about the neighbouring districts, about the Serra de Ibitipoca,
    about Santa Rita do Meia Pataca, or about any register the family may appear in
    elsewhere or later. Do not restate it as "the family was not in the region". (2)
    The PDFs held are the owner's rotation-corrected set, not the as-received files;
    25 of the 26 as-received pages had rotation baked into the image content while
    reporting rot=0, which is invisible to metadata and defeated an automated
    orientation detector (ruled tables break projection-profile methods). Rotation is
    not cosmetic here: uncorrected, it produced a false Armond hit at fogo 77. Do not
    re-rotate these files. (3) Each of pages 02–26 is a two-sheet spread; a sweep that
    treats a page as one sheet undercounts by roughly half. (4) Resolution ceiling:
    each PDF embeds a single 1233×1754 px image at 150 ppi, so each of the two sheets
    on a spread is only about 870 px wide, and rendering at 400 or 800 dpi upsamples
    without adding detail. That ceiling, not effort, is why two readings stay open —
    whether the enumerator wrote "Tolledo" or "Toledo", and whether the head of fogo 33
    is a Fernandes or a Fagundes. (5) A handful of other individual surnames and
    occupations across the corpus remain uncertain reads; none of them is an Armond
    candidate.
