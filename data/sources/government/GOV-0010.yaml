transcription: >-
  [Full verbatim transcription of all seven page images, re-read from the scans on 2026-10-10; it
  replaces an earlier summary. Line breaks are shown as " / "; spelling and abbreviations are kept
  as written, with expansions only in square brackets; [rubric] marks a flourished rubric. p3 is a
  second exposure of the same leaf as p2. The registered carta de sesmaria and the justification of
  witnesses are not among these images.]


  [p1 — APM archival cover sheet (printed form, typed entries); 6 lines:] ARQUIVO PÚBLICO MINEIRO /
  SG / (documentos não encadernados) / CAIXA Nº : 0 2 3 / DOCUMENTO Nº: 0 0 5 / DATA: 1792 / 07 / 23


  [p2 — the leaf carrying the supplicant's declaration, the governor's despachos of 23 July 1792, 11
  September 1792 and 15 March 1794, and the informação of 12 March 1794; 35 lines in ink, read top
  to bottom. Heading at top right, written before the despacho that runs round it:] Ill.mo Ex.mo Sr


  [p2, despacho across the full width, 6 lines:] Inf.e [Informe] a Camara conforme as Ordens de Sua
  Mag.de / á vista da declaraçaõ do Supp.te ouvindo taõ bem o Comd.e do / Destrito, e averiguando se
  as Terras que o Supp.te pertende estaõ ja povoadas, ou / cultivadas por outros, se confrontaõ com
  Sismarias concedidas, e demarcadas, e se / da concessaõ dellas rezultará prejuizo, ou
  inconveniente contra a Real Fazenda. / V.a R.a 23 de Julho de 1792. [rubric]


  [p2, left column, despacho, 5 lines:] Inf.e o D.or Juiz dos / Feitos da Real Fazd.a / ouvindo o
  D.or Proc.or da / Coroa. V.a R.a 11 de Se- / tembro de 1792. [rubric]


  [p2, right column, despacho, 4 lines:] P. Carta de Sisma- / ria na forma das Ordens / de S. Mag.e
  V.a R.a 15 / de M.co de 1794. [rubric]


  [p2, the supplicant's declaration, right two-thirds of the page, 6 lines:] Respondo obedecendo a
  V. Ex.a q. a Sis- / maria que pede Mariano Joze Ferr.a Armonde / fica distante da estrada do R.o
  de Jan.ro duas / Legoas, da V.a de Barbacena muito distante / da Mantiq.ra V. Ex.a lhe defira com
  a Costuma- / da Just.a


  [p2, heading at left, 1 line; then the informação, left two-thirds, 10 lines:] Ill.mo e Ex.mo Snr.
  / A vista da informaçaõ da Camara, inquiriçaõ / de test.as, que produzio o Supp.e Mariano Joze /
  Ferreira Armonde, resposta do D.r Proc.or da / Coroa, e juramento que prestou o d.o Supp.e por /
  seu procurador, que pede a Sesmaria, de que / se tracta, para a cultivar por si, e seus es- /
  cravos, e sem animo de a alienar, ou vender / a 3.o: me persuado, q. se acha nas circunstancias /
  de merecer a graça, q. pertende. V. Ex.a decidirá / o que for mais justo. V.a R.a 12 de Março de
  179[4 — last digit under the E. R. M. flourish; uncertain]


  [p2, large flourished closing at the foot right:] E. R. M.


  [p2, foot — left:] Reg.da [centre:] Antonio Ramos da Silva Nogueira


  [p2, modern pencil archival label in the right margin, 4 lines:] SG / CX23 / DOC05 / (1) [and, in
  the left margin, a faint pencil numeral, "29" or "59" — uncertain]


  [p3 — a second, lighter exposure of the same leaf as p2: the same text, rubrics, ink blot and
  pencil label "SG / CX23 / DOC05 / (1)". Its text is identical line for line to p2 above and is not
  repeated.]


  [p4 — the opening of the bifolium. Left half: the blank verso of the p2 leaf, showing only
  mirror-image show-through of p2's text; no writing of its own. Right half: the petition, 26 lines
  in ink, with the first despacho above it. Despacho at top, 3 lines:] Declare o Supp.te a distancia
  em que se achaõ / p.a cá da Serra da Mantiqueira, e da Estrada geral as / Terras que pertende. V.a
  R.a 19 de Julho de 1792. [rubric]


  [p4 right, heading at top right:] Ill.mo e Ex.mo Sr


  [p4 right, petition, 16 lines:] Diz Marianno Joze Ferr.a [Ferreira] Armonde, m.or [morador] na
  freg.a [freguesia] da / Borda do Campo, Termo da Villa de Barbacena, Comarca do / Rio das Mortes,
  q. elle se acha com Escravos sufficientes / e naõ tem terras em que os empregue p.a Cultivar; e /
  porque na paragem chamada o Sitio do Moinho [uncertain], se / achaõ terras devolutas, que constaõ
  de Capoeiras, e / Campos, p. donde segue a Estrada Real, q. vai p. / S. Joaõ del Rey; as quaes
  terras partem pela parte / do poente com Joze Rodriguez de Souza, e Jacinto Glz. [Gonçalves]; e /
  pela parte do Nascente com a Sismaria que pede Fran.co / Antonio Ferr.a [Ferreira], e pelado
  Norte, com Manoel Balleiro [uncertain: Balleiro or Balteiro]; / e pelado Sul com Joze Ferreira
  Armonde, e M.el F.[?] [uncertain — the abbreviation after M.el is unclear] / da Roza: Requer a V.
  Ex.a seja servido concederlhe / a dita S[?]maria [uncertain: Sesmaria] de meya Legoa de terra em
  quadra, na / paragem confrontada, fazendo piaõ, onde mais con- / veniente for, sem prejuizo dos
  vezinhos. //


  [p4 right, closing, 5 lines:] P. a V. Ex.a seja servido conceder- / lhe Sismaria a dita meya Legoa
  / de terra em quadra, na forma ex- / posta. // / E. R. M.


  [p4 right, foot left:] Reg.da


  [p4 right, modern pencil archival label, 4 lines:] SG / CX23 / DOC05 / (2)


  [p5 — left half: the Câmara of Barbacena's informação, 16 lines in ink; right half blank apart
  from show-through of the p4 despacho at the top. Heading, 1 line; informação, 11 lines:] Ill.mo e
  Ex.mo S.or / As terras, q. o Supp.e pede, naõ saõ cituadas em arias / prohibidas, nem por ellas
  passa Rio navegavel, e estaõ / cultivadas pelo Pay do Supp.e; sem tt.o [titulo] de Sesm.a e
  confron- / taõ com as Sesmarias de Joze Roiz [Rodrigues] de Souza e com a de / Manoel Fran.co
  Roza, e mais confrontantes q. o Supp.e / declara nenhum delles tem tt.o de Sesm.a; e ficaõ / p.a
  ca da serra da Mantiqueira Cinco legoas, e distante / da Estrada Real duas legoas. Da concessaõ da
  m.ma [uncertain] naõ / rezulta prejuizo, ou inconveniente a Real Fazd.a, segundo / nos informou o
  Comd.e do Destricto. Barbacena em Ca- / mara de 22 de Agosto de 1792


  [p5 left, signatures, 4 lines:] Joze de Souza [e — uncertain] Barreto / Domingos Ant.o de Az.do
  [uncertain] / Domingos Diaz Per.a / Joaquim Roiz d'Araujo


  [p5, a faint oval mark mid-page on the left half, no legible text; modern pencil archival label at
  right, 4 lines:] SG / CX23 / DOC05 / (3)


  [p6 — left half blank but for a small mark at the gutter [illegible]. Right half: despachos in two
  columns, 8 lines in ink. Left column, 6 lines:] Haja vista ao D.r Proc.or da / Coroa e Real
  Fazenda. / S.a [Silva] Nogueira [rubric] / Justif.e citado o D.r Proc.or / da Coroa e Real Faz.da
  / S.a Nogueira [rubric]


  [p6 right, right column, 2 lines:] Deve o Supp.te justificar os requizitos / necessarios na f.ma
  das Ordens [rubric]


  [p6, lower centre: faint show-through and a few stray ink strokes, not text of this page; modern
  pencil archival label at right, 4 lines:] SG / CX23 / DOC05 / (4)


  [p7 — the outer docket. Left half blank apart from faint offset of signatures and rubrics from the
  facing leaf. Right half, 3 lines:] 1794 / P. Sismaria em 17 de / Março do dito anno.


  [Editorial notes, 2026-10-10 — not part of the record text.]


  [1. Sequence, from the dated entries: petition (undated) → despacho of 19 July 1792 asking how far
  the land lies from the Serra da Mantiqueira and the Estrada geral → the supplicant's declaration →
  despacho of 23 July 1792 to the Câmara → the Câmara's informação of 22 August 1792 → despacho of
  11 September 1792 to the Juiz dos Feitos da Real Fazenda, hearing the Procurador da Coroa → p6:
  "Haja vista" to the Procurador; the reply "Deve o Supp.te justificar os requizitos" (probably the
  Procurador's — inferred); "Justif.e citado o D.r Proc.or" → justification of witnesses (cited on
  p2, not among the images) → Nogueira's favourable informação of 12 March 1794 → the governor's
  despacho "P. Carta de Sismaria" of 15 March 1794 → docket "P. Sismaria em 17 de Março" 1794.]


  [2. Distances: the declaration puts the land two leagues from the Rio de Janeiro road and very far
  from the Vila de Barbacena; the Câmara puts it five leagues this side of the Serra da Mantiqueira
  and two leagues from the Estrada Real.]


  [3. The petitioner states he has enslaved workers enough and no land to employ them on; Nogueira
  records that he swore, through his procurador, to cultivate the land himself with his slaves and
  not to sell it to a third party.]


  [4. Southern boundary: the petition reads "Joze Ferreira Armonde, e M.el F.[?] da Roza". The
  Câmara names the sesmaria of "Manoel Fran.co Roza" among the confrontations, which suggests
  (inferred) that the second southern neighbour is Manoel Francisco [da] Roza.]


  [5. The Câmara reports the land "cultivadas pelo Pay do Supp.e; sem tt.o de Sesm.a": the
  petitioner's father, who is not named, was farming it in 1792 without a sesmaria title.]


  [6. António Ramos da Silva Nogueira: the despacho of 11 September 1792 sends the case to the "D.or
  Juiz dos Feitos da Real Fazd.a" to hear the "D.or Proc.or da Coroa"; "S.a Nogueira" then orders
  the Procurador heard, and his informação of 12 March 1794 cites the Procurador's reply as a
  separate act. He was therefore acting as the Juiz dos Feitos (inferred), not as the Procurador.]
