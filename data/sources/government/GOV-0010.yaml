abstract: >-
  Colonial sesmaria dossier (APM, Secretaria de Governo, SG-Cx.23-Doc.05) of Marianno José Ferreira
  Armonde, "m.or na freg.a da Borda do Campo, Termo da Villa de Barbacena, Comarca do Rio das
  Mortes", who says he has enslaved workers enough and no land to employ them on, and asks for half
  a league square of vacant land (capoeiras and campos) at the place called the Sitio do Moinho
  [uncertain reading], by the Estrada Real to São João del Rei. He names his neighbours: west José
  Rodrigues de Souza and Jacinto Gonçalves; east the sesmaria being sought by Francisco Antonio
  Ferreira; north Manoel Balleiro [uncertain]; south José Ferreira Armonde and Manoel F.[?] da Roza.
  The Câmara of Barbacena (22 August 1792) reports the land five leagues this side of the Serra da
  Mantiqueira and two from the Estrada Real, outside the forbidden areas, bordering the sesmarias of
  José Rodrigues de Souza and Manoel Francisco Roza — and already "cultivadas pelo Pay do Supp.e;
  sem tt.o de Sesm.a", cultivated by the petitioner's unnamed father without a sesmaria title. After
  the Procurador da Coroa was heard and a justification of witnesses produced (not among the
  images), António Ramos da Silva Nogueira gave a favourable opinion (12 March 1794), the governor
  ordered the carta (15 March 1794), and the docket records "P. Sismaria em 17 de Março" 1794; the
  carta itself is not among the seven images. The document places Mariano at Borda do Campo in 1792
  with a living father farming there, and names a José Ferreira Armonde — the name of the 1791
  grantee of GOV-0009; identity not stated — as his southern neighbour. It names neither man's
  parents. Identifying this Mariano with the "Mariano José Ferreira Armonde – casado, deixou filhos"
  whom PUB-0002 reports as a child of Francisco Ferreira Armonde × Felizarda who died before his
  mother (1845 inventário) remains a lead; his relation to P-0016 is unresolved. Usage:
  context_only. [Re-read in full from the images 2026-10-10: the earlier "Escolástico Armonde"
  southern neighbour was a misreading — see notes.]
abstract_pt: >-
  Processo colonial de sesmaria (APM, Secretaria de Governo, SG-Cx.23-Doc.05) de Marianno José
  Ferreira Armonde, "m.or na freg.a da Borda do Campo, Termo da Villa de Barbacena, Comarca do Rio
  das Mortes", que declara ter escravos suficientes e não ter terras em que os empregar, e pede meia
  légua em quadra de terras devolutas (capoeiras e campos) na paragem chamada Sitio do Moinho
  [leitura incerta], junto à Estrada Real para São João del-Rei. Nomeia os confrontantes: a poente
  José Rodrigues de Souza e Jacinto Gonçalves; a nascente a sesmaria que pede Francisco Antonio
  Ferreira; ao norte Manoel Balleiro [incerto]; ao sul José Ferreira Armonde e Manoel F.[?] da Roza.
  A Câmara de Barbacena (22 de agosto de 1792) situa as terras a cinco léguas aquém da Serra da
  Mantiqueira e a duas da Estrada Real, fora das áreas proibidas, confrontando com as sesmarias de
  José Rodrigues de Souza e Manoel Francisco Roza — e já "cultivadas pelo Pay do Supp.e; sem tt.o de
  Sesm.a", cultivadas pelo pai do suplicante, não nomeado, sem título de sesmaria. Ouvido o
  Procurador da Coroa e produzida uma justificação de testemunhas (ausente das imagens), António
  Ramos da Silva Nogueira deu parecer favorável (12 de março de 1794), o governador mandou passar a
  carta (15 de março de 1794) e o rótulo registra "P. Sismaria em 17 de Março" de 1794; a carta em
  si não está entre as sete imagens. O documento situa Mariano na Borda do Campo em 1792, com o pai
  vivo cultivando ali, e nomeia um José Ferreira Armonde — nome do sesmeiro de 1791 da GOV-0009; a
  identidade não é declarada — como confrontante ao sul. Não nomeia os pais de nenhum dos dois. A
  identificação deste Mariano com o "Mariano José Ferreira Armonde – casado, deixou filhos" que a
  PUB-0002 dá como filho de Francisco Ferreira Armonde × Felizarda falecido antes da mãe (inventário
  de 1845) continua uma pista; sua relação com P-0016 não está resolvida. Uso: apenas contexto.
  [Relido integralmente das imagens em 2026-10-10: o confrontante ao sul "Escolástico Armonde" era
  um erro de leitura — ver notas.]
reliability:
  assessment: >-
    Primary colonial government record: the original petition with its despachos, the supplicant's
    declaration and the Câmara of Barbacena's informação (APM, Secretaria de Governo, unbound
    documents). Direct evidence for (1) Marianno José Ferreira Armonde's residence ("m.or") in the
    Freguesia da Borda do Campo, Termo da Villa de Barbacena, by July 1792; (2) his stated enslaved
    workforce; (3) the stated neighbours, including José Ferreira Armonde to the south; (4) the
    Câmara's statement that his father (unnamed) was cultivating the land without a sesmaria title;
    (5) the procedural dates from 19 July 1792 to the governor's order of the carta on 15 March 1794
    and the docket of 17 March 1794. Re-read in full from the seven images 2026-10-10; the earlier
    summary had misread the boundary names (see notes). Identifying this Mariano with the Mariano
    José of the 1845 inventário reported by PUB-0002 is a contextual lead, not stated here.
  informant: >-
    Marianno José Ferreira Armonde (petition and declaration); the Câmara of Barbacena (signed Joze
    de Souza [e — uncertain] Barreto, Domingos Ant.o de Az.do [uncertain], Domingos Diaz Per.a and
    Joaquim Roiz d'Araujo), relying on the Comandante do Destricto; António Ramos da Silva Nogueira
    (informação of 12 March 1794, acting as Juiz dos Feitos da Real Fazenda — inferred from the
    despacho of 11 September 1792); the governor's despachos (rubrics only). No witness depositions
    are among the images.
  limitations: >-
    The carta de sesmaria itself and the justification of witnesses are not among the images (p3
    duplicates p2), so the carta's boundary wording cannot be checked here. Uncertain reads:
    "Moinho"; the northern neighbour's surname (Balleiro or Balteiro); the abbreviation in the
    second southern neighbour's name ("M.el F.[?] da Roza"); the last digit of Nogueira's 1794 date
    (under the E. R. M. flourish); one word of the Câmara text ("da m.ma"); two Câmara signatures.
    The record names neither the petitioner's father nor any kinship between Mariano and José
    Ferreira Armonde. The "Escolástico Armonde" of the earlier summary does not occur in the record.
