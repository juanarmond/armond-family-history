transcription: >-
  [Sesmaria petition and grant, SG-Cx.23-Doc.05, APM, 1792/1794. Seven page images: petition, land
  description, boundary witness declarations, Procurador recommendation, grant notation.]


  [Petition summary:] Marianno José Ferreira Armonde, resident of Freguesia da Borda do Campo, Termo
  da cidade de Barbacena, Comarca de Rio das Mortes, petitions for a sesmaria grant of meia légua em
  quadra at "Sítio de Mointe[?]" near Serra da Mantiqueira and the Estrada Real to São João de El Rey.
  Government note: "8 légoas de [Rio de São João], muito distante de V.ª de Barbacena" — Mariano lives
  in Barbacena but seeks frontier land. States he will cultivate the land with his enslaved workers.


  [Stated borders:] Poente = Dr. Rodrigues da Lima; Nascente = sesmaria of Francisco António Brito[?];
  Norte = Manuel Balteiro; Sul = Escolástico Armonde e Manuel Rodrigues da Rosa.


  [Procurador da Fazenda, António Ramos da Silva Nogueira:] Recommends the grant.


  [Grant notation:] Grant issued 17 March 1794 ("B. Sesmaria em 17 de Março de 1794").
transcription_pt: >-
  [Petição e concessão de sesmaria colonial, SG-Cx.23-Doc.05, APM, 1792/1794. Sete imagens de
  página: petição, descrição das terras, declarações dos confrontantes/testemunhas, recomendação do
  Procurador, anotação da concessão.]


  [Resumo da petição:] Marianno José Ferreira Armonde, residente na Freguesia da Borda do Campo,
  Termo da cidade de Barbacena, Comarca de Rio das Mortes, peticiona pela concessão de uma sesmaria
  de meia légua em quadra no "Sítio de Mointe[?]", junto à Serra da Mantiqueira e à Estrada Real para
  São João de El Rey. Nota do governo: "8 légoas de [Rio de São João], muito distante de V.ª de
  Barbacena" — Mariano reside em Barbacena mas busca terras de fronteira. Declara que cultivará as
  terras com seus escravos.


  [Confrontações declaradas:] Poente = Dr. Rodrigues da Lima; Nascente = sesmaria de Francisco
  António Brito[?]; Norte = Manuel Balteiro; Sul = Escolástico Armonde e Manuel Rodrigues da Rosa.


  [Procurador da Fazenda, António Ramos da Silva Nogueira:] Recomenda a concessão.


  [Anotação da concessão:] Concessão emitida em 17 de março de 1794 ("B. Sesmaria em 17 de Março
  de 1794").
abstract: >-
  Colonial sesmaria petition and grant (SG-Cx.23-Doc.05, APM) for Marianno José Ferreira Armonde,
  resident of Freguesia da Borda do Campo, Barbacena — the ancestral parish of elder Francisco
  Ferreira Armonde (d.1751). The southern boundary neighbor is "Escolástico Armonde e Manuel
  Rodrigues da Rosa" — introducing a previously undocumented Armonde (Escolástico) active in the
  same region. Mariano's name and Borda do Campo residence are a strong match for the "predeceased
  Mariano José" listed as a child of Alferes Francisco × Felizarda de Assis in the 1845 Honório
  inventário, corroborating that he is a son of Alferes Francisco and a brother (or half-brother) of
  elder Simplício (P-0016's grandfather). The 1792–1794 date confirms the ancestral Borda do Campo
  seat persisted into the second generation. Usage: context_only — documents a probable brother of
  P-0016's direct ancestor, providing structural context for the Armonde landholding network in
  Barbacena / Borda do Campo / Serra da Mantiqueira.
abstract_pt: >-
  Petição e concessão de sesmaria colonial (SG-Cx.23-Doc.05, APM) para Marianno José Ferreira
  Armonde, residente na Freguesia da Borda do Campo, Barbacena — a freguesia ancestral do mais velho
  Francisco Ferreira Armonde (†1751). O confrontante ao sul é "Escolástico Armonde e Manuel Rodrigues
  da Rosa" — introduzindo um Armonde anteriormente não documentado (Escolástico) ativo na mesma região.
  O nome de Mariano e sua residência em Borda do Campo são uma forte correspondência com o "Mariano
  José prefalecido" listado como filho do Alferes Francisco × Felizarda de Assis no inventário de
  Honório de 1845, corroborando que ele é filho do Alferes Francisco e irmão (ou meio-irmão) do mais
  velho Simplício (avô de P-0016). A data de 1792–1794 confirma que a sede ancestral de Borda do
  Campo persistiu na segunda geração. Uso: apenas contexto — documenta um provável irmão do ancestral
  direto de P-0016, fornecendo contexto estrutural para a rede de propriedades dos Armonde em
  Barbacena / Borda do Campo / Serra da Mantiqueira.
reliability:
  assessment: >-
    Primary colonial government record (original sesmaria petition and grant, APM Secretaria de
    Governo series). Direct evidence for: (1) Mariano José Ferreira Armonde's residence at Borda do
    Campo, Barbacena, 1792; (2) the boundary relationship (Escolástico Armonde as southern neighbor);
    (3) Mariano's enslaved workforce and landholding ambitions at the Serra da Mantiqueira frontier.
    The identification of this Mariano José with the "predeceased Mariano José" of the Honório
    inventário is a strong contextual lead, not a primary-record fact stated in this document.
  informant: >-
    Marianno José Ferreira Armonde (petitioner); boundary witnesses (names not individually listed
    in the summary above); Procurador da Fazenda António Ramos da Silva Nogueira.
  limitations: >-
    Some place and name reads are uncertain cursive ("Mointe[?]", "Brito[?]"). The identification
    of this Mariano with the Honório inventário "Mariano José" is inferential (strong contextual
    match only). The Escolástico Armonde boundary relationship (brother? cousin?) is a new lead,
    not resolved here.
