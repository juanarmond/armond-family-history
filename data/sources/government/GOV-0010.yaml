notes:
- text: >-
    Context only: documents a probable collateral ancestor of P-0016 (Simplício's line descends from
    Alferes Francisco; Mariano José is most likely a brother or half-brother of elder Simplício,
    both sons of Alferes Francisco × Felizarda). Provides geographic and structural context for the
    Armonde family's Borda do Campo seat in the second generation. [Corrected 2026-10-10: this
    record names no parent of Mariano — the Câmara calls his father only "o Pay do Supp.e" — and
    P-0016's own profile treats the elder Simplício of Barbacena as a namesake, with P-0016's
    parentage unresolved; PUB-0002 also has the elder Simplício dying "solteiro". That P-0016's line
    descends from Alferes Francisco, and that Mariano is a collateral ancestor of P-0016, is
    therefore not established. Mariano as a son of Francisco × Felizarda remains a lead from
    PUB-0002's report of the 1845 inventário.]
  text_pt: >-
    Apenas contexto: documenta um provável ancestral colateral de P-0016 (a linha de Simplício
    descende do Alferes Francisco; Mariano José é muito provavelmente irmão ou meio-irmão do
    Simplício mais velho, ambos filhos do Alferes Francisco × Felizarda). Fornece contexto
    geográfico e estrutural para a sede dos Armonde na Borda do Campo na segunda geração. [Corrigido
    em 2026-10-10: este documento não nomeia nenhum dos pais de Mariano — a Câmara chama o pai
    apenas de "o Pay do Supp.e" — e o próprio perfil de P-0016 trata o Simplício mais velho de
    Barbacena como homônimo, com a filiação de P-0016 não resolvida; a PUB-0002 também dá o
    Simplício mais velho como falecido "solteiro". Que a linha de P-0016 descenda do Alferes
    Francisco, e que Mariano seja ancestral colateral de P-0016, não está, portanto, estabelecido.
    Mariano como filho de Francisco × Felizarda continua uma pista, a partir do relato da PUB-0002
    sobre o inventário de 1845.]
- text: >-
    NEW LEAD — Escolástico Armonde: a southern boundary neighbor of Mariano's sesmaria, the only
    mention of this name in any held source. May be a sibling or cousin of Mariano. Search:
    Barbacena parish registers + inventários for Escolástico Ferreira Armonde / Escolástico Armonde,
    c.1760–1820. [Corrected 2026-10-10 from the image: p4 reads "e pelado Sul com Joze Ferreira
    Armonde, e M.el F.[?] da Roza" — the name "Escolástico" does not occur anywhere in the seven
    images, and the earlier "Manuel Rodrigues da Rosa" is likewise unsupported. The lead is
    withdrawn; there is nothing to search. Kept as research history.]
  text_pt: >-
    PISTA NOVA — Escolástico Armonde: confrontante ao sul da sesmaria de Mariano, única menção deste
    nome em qualquer fonte guardada. Pode ser irmão ou primo de Mariano. Pesquisar: registros
    paroquiais e inventários de Barbacena por Escolástico Ferreira Armonde / Escolástico Armonde,
    c.1760–1820. [Corrigido em 2026-10-10 a partir da imagem: a p4 diz "e pelado Sul com Joze
    Ferreira Armonde, e M.el F.[?] da Roza" — o nome "Escolástico" não ocorre em nenhuma das sete
    imagens, e o anterior "Manuel Rodrigues da Rosa" tampouco tem apoio. A pista fica retirada; não
    há o que pesquisar. Mantida como histórico de pesquisa.]
- text: >-
    Re-read in full from the seven images on 2026-10-10; the verbatim transcription replaced the
    earlier summary. Corrections to the summary, old → new: southern boundary "Escolástico Armonde e
    Manuel Rodrigues da Rosa" → "Joze Ferreira Armonde, e M.el F.[?] da Roza" (p4); western "Dr.
    Rodrigues da Lima" → "Joze Rodriguez de Souza, e Jacinto Glz." (p4); eastern "sesmaria of
    Francisco António Brito[?]" → "a Sismaria que pede Fran.co Antonio Ferr.a", the sesmaria
    Francisco Antonio Ferreira was himself requesting (p4; "Ferr.a" is written exactly as in the
    petitioner's own name); northern "Manuel Balteiro" → "Manoel Balleiro" [uncertain: Balleiro or
    Balteiro]; "Termo da cidade de Barbacena" → "Termo da Villa de Barbacena"; "Sítio de Mointe[?]"
    → "Sitio do Moinho" [uncertain]; "8 légoas de [Rio de São João], muito distante de V.ª de
    Barbacena" → "fica distante da estrada do R.o de Jan.ro duas Legoas, da V.a de Barbacena muito
    distante" (p2); "Procurador da Fazenda António Ramos da Silva Nogueira recommends" → Nogueira's
    informação of 12 March 1794 cites the Procurador da Coroa's reply as a separate act, so he was
    acting as Juiz dos Feitos da Real Fazenda (inferred); grant notation "B. Sesmaria em 17 de Março
    de 1794" → docket "1794 / P. Sismaria em 17 de / Março do dito anno." (p7), with the governor's
    despacho "P. Carta de Sismaria na forma das Ordens de S. Mag.e" of 15 March 1794 (p2); "petition
    dated 23 July 1792" → the petition is undated, its first despacho is 19 July 1792, and 23 July
    1792 (the APM cover date) is the despacho to the Câmara; the page list "petition, land
    description, boundary witness declarations, Procurador recommendation, grant notation" → p1
    archival cover, p2 declaration + despachos + informação, p3 a duplicate exposure of p2, p4
    petition, p5 the Câmara's informação, p6 despachos, p7 docket — no witness declarations are
    among the images. Newly read and absent from the summary: the Câmara's statement that the land
    was "cultivadas pelo Pay do Supp.e; sem tt.o de Sesm.a", and its naming of the sesmarias of Joze
    Roiz de Souza and Manoel Fran.co Roza as the land's confrontations. event_date.text was
    corrected to match; its earliest/latest bounds are unchanged.
  text_pt: >-
    Relido integralmente das sete imagens em 2026-10-10; a transcrição literal substituiu o resumo
    anterior. Correções ao resumo, antigo → novo: confrontação sul "Escolástico Armonde e Manuel
    Rodrigues da Rosa" → "Joze Ferreira Armonde, e M.el F.[?] da Roza" (p4); poente "Dr. Rodrigues
    da Lima" → "Joze Rodriguez de Souza, e Jacinto Glz." (p4); nascente "sesmaria de Francisco
    António Brito[?]" → "a Sismaria que pede Fran.co Antonio Ferr.a", a sesmaria que o próprio
    Francisco Antonio Ferreira pedia (p4; "Ferr.a" está escrito exatamente como no nome do
    suplicante); norte "Manuel Balteiro" → "Manoel Balleiro" [incerto: Balleiro ou Balteiro]; "Termo
    da cidade de Barbacena" → "Termo da Villa de Barbacena"; "Sítio de Mointe[?]" → "Sitio do
    Moinho" [incerto]; "8 légoas de [Rio de São João], muito distante de V.ª de Barbacena" → "fica
    distante da estrada do R.o de Jan.ro duas Legoas, da V.a de Barbacena muito distante" (p2); "o
    Procurador da Fazenda António Ramos da Silva Nogueira recomenda" → a informação de Nogueira de
    12 de março de 1794 cita a resposta do Procurador da Coroa como ato distinto, logo ele agia como
    Juiz dos Feitos da Real Fazenda (inferência); anotação "B. Sesmaria em 17 de Março de 1794" →
    rótulo "1794 / P. Sismaria em 17 de / Março do dito anno." (p7), com o despacho do governador
    "P. Carta de Sismaria na forma das Ordens de S. Mag.e" de 15 de março de 1794 (p2); "petição
    datada de 23 de julho de 1792" → a petição não tem data, seu primeiro despacho é de 19 de julho
    de 1792, e 23 de julho de 1792 (a data da capa do APM) é o despacho à Câmara; a lista de páginas
    "petição, descrição das terras, declarações dos confrontantes/testemunhas, recomendação do
    Procurador, anotação da concessão" → p1 capa arquivística, p2 declaração + despachos +
    informação, p3 exposição duplicada da p2, p4 petição, p5 informação da Câmara, p6 despachos, p7
    rótulo — não há declarações de testemunhas entre as imagens. Lido agora e ausente do resumo: a
    afirmação da Câmara de que as terras estavam "cultivadas pelo Pay do Supp.e; sem tt.o de
    Sesm.a", e a menção das sesmarias de Joze Roiz de Souza e Manoel Fran.co Roza como confrontações
    das terras. O event_date.text foi corrigido em conformidade; os limites earliest/latest não
    mudaram.
- text: >-
    The carta (grant) is not among the seven images: p2 holds the governor's order "P. Carta de
    Sismaria na forma das Ordens de S. Mag.e" (15 March 1794) and p7 the docket "P. Sismaria em 17
    de Março do dito anno", but not the carta text. The retrieval agent reports the registered carta
    (APM SC-256 f.241v) as reading "pela parte do Sul com Joze Ferreira Armonde, e Manoel Francisco
    Pires[?]" and "Nascente com Francisco Antonio Ferreira"; neither can be checked from these
    images. José Ferreira Armonde and Francisco Antonio Ferreira agree with the petition. For the
    second southern neighbour the petition has "M.el F.[?] da Roza" and the Câmara's informação
    names the sesmaria of "Manoel Fran.co Roza", so the agent's "Pires[?]" is probably a misreading
    of "Roza" [inferred — confirm on the carta image before citing it].
  text_pt: >-
    A carta (concessão) não está entre as sete imagens: a p2 traz a ordem do governador "P. Carta de
    Sismaria na forma das Ordens de S. Mag.e" (15 de março de 1794) e a p7 o rótulo "P. Sismaria em
    17 de Março do dito anno", mas não o texto da carta. O agente de recuperação informa que a carta
    registrada (APM SC-256 f.241v) diz "pela parte do Sul com Joze Ferreira Armonde, e Manoel
    Francisco Pires[?]" e "Nascente com Francisco Antonio Ferreira"; nenhuma das duas leituras pode
    ser conferida nestas imagens. José Ferreira Armonde e Francisco Antonio Ferreira concordam com a
    petição. Para o segundo confrontante ao sul, a petição tem "M.el F.[?] da Roza" e a informação
    da Câmara nomeia a sesmaria de "Manoel Fran.co Roza", de modo que o "Pires[?]" do agente é
    provavelmente erro de leitura de "Roza" [inferência — confirmar na imagem da carta antes de
    citá-la].
- text: >-
    New fact, 2026-10-10: the Câmara of Barbacena (22 August 1792) reports the land "cultivadas pelo
    Pay do Supp.e; sem tt.o de Sesm.a" — Mariano's father was alive and farming it in 1792, without
    a sesmaria title. The father is not named. [CONTEXTUAL] PUB-0002 places Felizarda's death in
    1845 at the "fazenda dos Moinhos", where the family had lived since settling in Minas; the
    petition's "Sitio do Moinho" [uncertain reading] is consistent with that, but the published work
    is a lead, not evidence that the father was Francisco Ferreira Armonde.
  text_pt: >-
    Fato novo, 2026-10-10: a Câmara de Barbacena (22 de agosto de 1792) informa que as terras estão
    "cultivadas pelo Pay do Supp.e; sem tt.o de Sesm.a" — o pai de Mariano estava vivo e as
    cultivava em 1792, sem título de sesmaria. O pai não é nomeado. [CONTEXTUAL] A PUB-0002 situa a
    morte de Felizarda, em 1845, na "fazenda dos Moinhos", onde a família vivia desde que se
    estabeleceu em Minas; o "Sitio do Moinho" da petição [leitura incerta] é compatível com isso,
    mas a obra publicada é uma pista, não prova de que o pai fosse Francisco Ferreira Armonde.
