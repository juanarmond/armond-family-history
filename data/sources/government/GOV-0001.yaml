transcription: >-
  [Secretaria de Segurança Pública do Estado da Guanabara — Departamento de
  Trânsito. Divisão de Habilitação — "Relação Alfabética dos Prontuários". Pág.
  27159, março de 1973. Column headings: NOME / NASCIMENTO / NACIONALIDADE /
  OBSERVAÇÃO / IDENTIDADE / NOME DO PAI / COD.LOGRAD. / COD.BAIRRO / PRONTUARIO /
  CATEGORIA / RUA / NOME DA MÃE / NUMERO / APTO / COMP.END. / REVALIDACAO.]
  Subject entry, verbatim: "JOSE OLAVO ARMOND — 25/09/26 — BRASIL — IDENTIDADE
  FP00002587226 — NOME DO PAI ARISTAC FERREIRA ARMOND [printed thus; i.e. Aristão
  Ferreira Armond] — COD.LOGRAD. 001134 — COD.BAIRRO 056 — PRONTUARIO 0610367 —
  CATEGORIA AMADOR — NOME DA MAE LILIOSA PAZ ARMOND — REVALIDACAO 01/71." The RUA
  / NUMERO / APTO / COMP.END. address fields are blank for this entry. The
  numerous unrelated drivers' entries on the same index page are not transcribed.
abstract: >-
  A March 1973 Guanabara government driver-dossier index lists José Olavo
  Armond, born 25 September 1926 in Brazil, and names his father as "Aristac
  Ferreira Armond" and his mother as Liliosa Paz Armond. The father's given
  name appears to be a typographical corruption of Aristão, but the source
  form is preserved rather than silently corrected.
abstract_pt: >-
  Um índice de prontuário de motorista do governo da Guanabara de março de 1973
  lista José Olavo Armond, nascido em 25 de setembro de 1926 no Brasil, e nomeia
  seu pai como "Aristac Ferreira Armond" e sua mãe como Liliosa Paz Armond. O
  prenome do pai parece ser uma corrupção tipográfica de Aristão, mas a forma da
  fonte é preservada em vez de corrigida silenciosamente.
reliability:
  assessment: >-
    The original government index directly reports José Olavo's name, birth
    date, nationality and parent fields. The parent information is secondary
    because it was recorded decades after his birth, but the unusual surname
    combination and exact maternal name provide independent evidence for the
    family relationship.
  informant: Not stated on the index page.
  limitations: >-
    The index does not state José Olavo's birthplace or identify the underlying
    evidence used for the parent fields. It prints the father's given name as
    "Aristac", not "Aristão". The page contains identity and driver-dossier
    details for numerous unrelated people and must remain private.
