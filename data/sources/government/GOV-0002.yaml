abstract: >-
  The 1831 household enumeration (fogos) of the district of N. Sra. do Rosário
  do Curral Novo, Termo de Barbacena, transcribed by Projeto Compartilhar from
  the Arquivo Público Mineiro manuscript. It records the widow Felizarda Maria
  Francisca de Assis heading a large Ferreira household of six unmarried adult
  sons (including Simplício José Ferreira, 46, solteiro) with 66 enslaved
  people, and is signed by Simplício José Ferreira Armond as district Juiz de
  Paz.
abstract_pt: >-
  O recenseamento domiciliar (fogos) de 1831 do distrito de N. Sra. do Rosário
  do Curral Novo, Termo de Barbacena, transcrito pelo Projeto Compartilhar a
  partir do manuscrito do Arquivo Público Mineiro. Registra a viúva Felizarda
  Maria Francisca de Assis à frente de um grande domicílio Ferreira com seis
  filhos adultos solteiros (incluindo Simplício José Ferreira, 46, solteiro) e
  66 pessoas escravizadas, e é assinado por Simplício José Ferreira Armond como
  Juiz de Paz do distrito.
reliability:
  assessment: >-
    A contemporary (1831) primary population list, but held here only as a
    third-party online transcription (derivative); verify against the APM
    manuscript before relying on any single reading. Concerns the historical
    Barbacena Ferreira Armonde family — context, not proof of this line's
    descent.
  informant: >-
    The 1831 district enumeration signed by the Juiz de Paz Simplício José
    Ferreira Armond; transcribed by Valderez Rosa Garcia for Projeto
    Compartilhar.
  limitations: >-
    A transcription with a flagged risk of reading errors ("possíveis erros de
    interpretação da escrita"). It supports the anti-merge — the Gen-2
    Simplício was 46 and single in 1831, so not Aristão's father — but does NOT
    connect the Barbacena family to this repository's Simplício (P-0016); the
    shared surname alone is not evidence of descent. A second, MARRIED Armond
    household (Manoel Antonio de Armond) in the neighbouring 1831 João Gomes
    list remains an uncatalogued lead.
