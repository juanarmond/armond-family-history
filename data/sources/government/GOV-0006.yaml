transcription: >-
  [Minas Geraes — Órgão Official dos Poderes do Estado, Anno XI, N.235,
  quinta-feira 11 de setembro de 1902, Bello Horizonte, p.1, "GOVERNO DO ESTADO",
  sob "SECRETARIA DA POLICIA — AUCTORIDADES POLICIAES". Página completa retida;
  transcreve-se apenas o trecho que nomeia o membro da família. Este é o ato
  oficial primário reproduzido na notícia de O Pharol de 13 de setembro de 1902
  (NWS-0003).] "Por acto de hontem, foram nomeados 1.º, 2.º e 3.º supplentes do
  delegado de Policia, de S. Paulo do Muriahé os cidadãos Antonio Lourenço Dias,
  Marciano de Souza Lopes e Simplicio José Ferreira Armond." [Assim, Simplício é
  o 3.º suplente do delegado de polícia de São Paulo do Muriaé.]
abstract: >-
  The Minas Geraes state official gazette of 11 September 1902 publishes the
  State President's act appointing Simplicio José Ferreira Armond (P-0016) 3rd
  substitute (3º suplente) of the delegado de polícia of São Paulo do Muriaé,
  Minas Gerais. It is the primary official record of the appointment that O Pharol
  reproduced on 13 September 1902 (NWS-0003).
abstract_pt: >-
  A gazeta oficial Minas Geraes de 11 de setembro de 1902 publica o ato do
  Presidente do Estado nomeando Simplicio José Ferreira Armond (P-0016) 3º
  suplente do delegado de polícia de São Paulo do Muriaé, Minas Gerais. É o
  registro oficial primário da nomeação que O Pharol reproduziu em 13 de setembro
  de 1902 (NWS-0003).
reliability:
  assessment: >-
    Original, contemporaneous official act published in the State's official
    organ — the direct primary source for Simplício's 1902 substitute-delegado
    appointment, upgrading the O Pharol newspaper reproduction (NWS-0003) to its
    official primary.
  informant: The State Government of Minas Gerais (official gazette).
  limitations: >-
    The page carries many unrelated official acts, not transcribed. The office is
    an honorary/unpaid substitute police authority.
