transcription: >-
  [Transcrição do fólio 16 do Mapa de População de Santa Rita do Meia Pataca, 1831,
  feita directamente da imagem fotográfica (960×1280 px) a 24 de Setembro de 2026,
  cotejada com a transcrição registada em C-013 no logs/correspondence-log.md.
  Colunas do original: Nº do fogo | Habitantes | Cor/Qualidade | Condição | Idade |
  Estado | Ocupações. A coluna "Condição" fica em branco para as pessoas livres. As
  designações de cor e a condição de cativo são transcritas tal como o original as
  escreve. Leituras incertas marcadas [uncertain]; ilegíveis, [illegible].]


  [Fogo 65:] José Luis d'Azevedo · Branco · 30 · Cazado · Lavrador; Marianna Josefa ·
  Branca · 21 · Cazada · Fiandeira; Maria · Branca · 6; Anna · Branca · 4;
  Florentina · Branca · 1.


  [Fogo 66:] Dom.os M[…]a de Souza [uncertain — o segundo elemento está abreviado e
  não se resolve; lê-se como "Mar.a"/"Mart.s", provavelmente Martins ou Marques] ·
  Branco · 30 · Cazado · Lavrador; Anna Ferr.a Gomes [Anna Ferreira Gomes] · Branca ·
  25 · Cazada · Fiandeira; Maria · B. · 8; Josefa · B. · 4; Joaquinna · B. · 1; José ·
  Branco · 5; José An.to de Souza · Branco · 15 · Cazado; Josefa Maria · Branca · 60 ·
  Cazada.


  [Fogo 67:] José Luis da Ro[cha?] [uncertain] · Branco · 30 [uncertain — lido como
  "30"; a transcrição de C-013 leu "36"] · Viuvo · Lavrador; Manoel Luis · B. · 12 ·
  Roceiro; Francisca Luis · B. · 11; Joaquim Luis · B. · 10; Dom.os [Domingos] Luis ·
  B. · 9; José · B. · 8; Custodio · B. · 6; José · B. · 4; Maria Luiza · B. · 17 ·
  Solteira · Fiandeira; Anna Luiza · B. · 16 · Solteira · Fiandeira; Luiza · B. · 3;
  Tito · B. · 2.

  [Fogo 67 — pessoas escravizadas, seis, tal como o original as regista:] Vicente
  [uncertain] · Preto · Cativo · 30 · Solteiro · Roceiro; Antonio · Preto · Cativo ·
  35 · Solteiro · Roceiro; José · Preto · Cativo · 30 · Solteiro · Roceiro; José ·
  Preto · Cativo · 26 [uncertain] · Solteiro · Roceiro; Manoel · Preto · Cativo · 27
  [uncertain] · Solteiro · Roceiro; Maria · Preto [assim no original] · Cativo · 30 ·
  Solteira · Cozinheira.


  [Fogo 68 — ao pé da página:] An.to Ferr.a A[…]ndes [SOBRENOME NÃO RESOLVIDO —
  ver abaixo] · Branco · 23 · Cazado · Lavrador; H[e]ngelica Maria [uncertain — a
  inicial lê-se como "H" ou "A"; o nome é Angélica] · Branco · 24 · Cazada ·
  Fiandeira.


  [NOTA DE LEITURA SOBRE O Nº 68 — o ponto decisivo deste documento.] Os dois
  primeiros elementos do nome do chefe do fogo 68 lêem-se com confiança como as
  abreviaturas correntes "An.to" (António) e "Ferr.a" (Ferreira). O TERCEIRO elemento
  — o sobrenome — NÃO se resolve nesta imagem de 960×1280 px: a palavra ocupa cerca de
  60 px para oito ou mais letras, ou seja ~7 px por letra, abaixo do limite de leitura.
  O que se distingue é uma maiúscula com laçada ascendente, um grupo de hastes
  indistintas e uma terminação em "-ndes"/"-ndez". NÃO é possível decidir entre
  "Armendes", "Almendes" e "Armonde(s)": a letra que separaria "Ar-" de "Al-" não está
  legível. Ampliações a 7×, 9×, 14× e 16× (LANCZOS e vizinho-mais-próximo, com
  autocontraste e máscara de nitidez) foram tentadas a 24 de Setembro de 2026 e
  nenhuma resolveu a palavra. É necessário um recorte em maior resolução ou a consulta
  ao original.


  [Continuação:] Uma linha horizontal fecha o fogo 68 ao pé do fólio, no mesmo estilo
  das que separam os fogos 65/66/67, mas a folha termina imediatamente a seguir. Não é
  possível determinar por esta imagem se o fogo 68 se completa aqui (apenas o casal) ou
  se continua no fólio 17. A transcrição de C-013 assumiu que continua; essa suposição
  fica por confirmar.
abstract: >-
  A single photographed folio (fls. 16) of the 1831 population map of the district of
  Santa Rita do Meia Pataca, recording households 65 to 68 with each inhabitant's
  colour, condition (free or enslaved), age, marital state and occupation. Household
  67 includes six enslaved people, named and enumerated here as the original does.
  The folio matters to this archive only for its last entry, no. 68, a white married
  lavrador of 23 whose given names read as "An.to Ferr.a" (António Ferreira) and
  whose SURNAME CANNOT BE READ at the resolution held, with his wife, a spinner of
  24. If — and only if — that surname is an Armonde variant, the entry would place a
  male Armonde born c.1808 in the Meia Pataca district in 1831; that is a [LEAD] for
  the parentage of Simplício José Ferreira Armond (P-0016), not evidence. The record
  is catalogued as context because its decisive fact is unread.
abstract_pt: >-
  Um único fólio fotografado (fls. 16) do Mapa de População de 1831 do distrito de
  Santa Rita do Meia Pataca, que regista os fogos 65 a 68 com a cor, a condição
  (livre ou cativa), a idade, o estado e a ocupação de cada habitante. O fogo 67
  inclui seis pessoas escravizadas, nomeadas e enumeradas aqui tal como o original o
  faz. O fólio importa a este arquivo apenas pelo último assento, o nº 68: um lavrador
  branco casado de 23 anos cujos nomes próprios se lêem "An.to Ferr.a" (António
  Ferreira) e cujo SOBRENOME NÃO SE CONSEGUE LER na resolução disponível, com a sua
  mulher, fiandeira de 24 anos. Se — e só se — esse sobrenome for uma variante de
  Armonde, o assento colocaria um Armonde varão nascido por volta de 1808 no distrito
  do Meia Pataca em 1831; isso é uma PISTA [LEAD] para a filiação de Simplício José
  Ferreira Armond (P-0016), não uma prova. O documento é catalogado como contexto
  precisamente porque o seu facto decisivo continua por ler.
reliability:
  assessment: >-
    A contemporary manuscript population map, held as a photographic copy of the
    original folio, so the information is primary in quality. Its genealogical value
    to this archive rests entirely on one word that cannot be read. Everything this
    folio is being kept for is therefore [LEAD]-grade, and the source is filed as
    context_only until the surname is resolved from a higher-resolution image or the
    original manuscript.
  informant: >-
    The unnamed 1831 district enumerator of Santa Rita do Meia Pataca (the
    certification and signature are not on this folio). The photographic copy was
    supplied by the genealogist Nilza Cantoni, who emailed it to the owner on 23
    September 2026 and herself pointed to entry no. 68 as a lead for the Ferreira
    Armond line (correspondence C-013).
  limitations: >-
    (1) The image is 960×1280 px — adequate for the columns and the common names, but
    BELOW the threshold needed for the entry that matters. The no. 68 surname has been
    read variously as "Almendes", "Armendes" and "Armonde"; none of those readings can
    be substantiated from this file, and the desirability of an "Armonde" reading must
    not be allowed to settle it. (2) Only one folio is held; the households before 65
    and after 68, and the closing certification with the district totals and the
    enumerator's name, are all absent, so nothing can be concluded about who else the
    district contained. (3) The archival reference (fundo, caixa, documento) is not
    established; APM is presumed, not confirmed. (4) No person in this folio is
    identified with any modelled person in this repository. The source is attached to
    P-0016 solely because it is a lead in the search for his parents.
