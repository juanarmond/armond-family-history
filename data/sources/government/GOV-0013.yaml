notes:
  - text: >-
      [LEAD — NOT EVIDENCE] Why entry no. 68 matters, stated conditionally. IF the
      surname is an Armonde variant, the entry would place a male Armonde born c.1808,
      a white married lavrador, in the Santa Rita do Meia Pataca district in 1831 —
      a generation sitting between the 1791/1805 José Ferreira Armonde of the Barbacena
      sesmaria documents (GOV-0009, GOV-0011) and the 1870 Leopoldina electoral-roll
      voter Francisco Ferreira Armonde of Meia Pataca, b. ~1842–45 (correspondence
      C-012). That would be a genuine lead on the ancestry of Simplício José Ferreira
      Armond (P-0016), whose parents are unknown. It is NOT a lead until the surname is
      read, and it would still not be evidence of descent even then: the record states
      a residence, an age, a colour, a marital state and an occupation, and nothing
      about anyone's parents. No person entity may be minted from this folio.
    text_pt: >-
      [PISTA — NÃO É PROVA] Por que importa o assento nº 68, dito condicionalmente. SE
      o sobrenome for uma variante de Armonde, o assento colocaria um Armonde varão
      nascido por volta de 1808, lavrador branco casado, no distrito de Santa Rita do
      Meia Pataca em 1831 — uma geração situada entre o José Ferreira Armonde das
      sesmarias de Barbacena de 1791/1805 (GOV-0009, GOV-0011) e o eleitor Francisco
      Ferreira Armonde do alistamento de Leopoldina de 1870, do Meia Pataca, n. ~1842–45
      (correspondência C-012). Seria uma pista verdadeira sobre a ascendência de
      Simplício José Ferreira Armond (P-0016), cujos pais se desconhecem. NÃO é pista
      enquanto o sobrenome não for lido, e mesmo então não seria prova de descendência:
      o assento declara uma residência, uma idade, uma cor, um estado e uma ocupação, e
      nada sobre os pais de ninguém. Nenhuma entidade-pessoa pode ser criada a partir
      deste fólio.
  - text: >-
      Reading discipline on the no. 68 surname. This is the failure mode the archive
      exists to avoid: a desirable reading being written down as a fact. What is
      legible is "An.to Ferr.a" plus a capital-A word ending in "-ndes". What is NOT
      legible is the letter or letters after that capital, which is exactly what
      distinguishes Armendes/Armonde from Almendes. The word is about 60 px wide for
      eight or more letters in a 960×1280 image; that is a hard optical limit, not a
      matter of effort. Exact next action: obtain from Nilza Cantoni a
      higher-resolution crop of entry no. 68 (and, separately, folio 17), or consult
      the original manuscript. Do not upgrade this source's usage, and do not create
      a person, on any re-reading of this same file.
    text_pt: >-
      Disciplina de leitura quanto ao sobrenome do nº 68. Este é precisamente o modo de
      falha que este arquivo existe para evitar: uma leitura desejável ser registada
      como facto. O que é legível é "An.to Ferr.a" mais uma palavra iniciada por A
      maiúsculo e terminada em "-ndes". O que NÃO é legível é a letra ou letras a
      seguir a essa maiúscula — exactamente o que distingue Armendes/Armonde de
      Almendes. A palavra mede cerca de 60 px para oito ou mais letras numa imagem de
      960×1280; é um limite óptico, não uma questão de esforço. Acção seguinte exacta:
      obter de Nilza Cantoni um recorte em maior resolução do assento nº 68 (e, à parte,
      o fólio 17), ou consultar o manuscrito original. Não elevar o uso desta fonte, nem
      criar qualquer pessoa, com base em nova leitura deste mesmo ficheiro.
  - text: >-
      Conflict with the C-013 transcription, preserved rather than silently corrected.
      C-013 (logs/correspondence-log.md), transcribed from the same emailed copy on
      2026-09-23, lists SEVEN enslaved people in household 67 and gives the head of
      household 67 as aged 36. The reading made from the image on 2026-09-24 and
      recorded above finds SIX enslaved people (Vicente [uncertain], Antonio, José,
      José, Manoel, Maria) and reads the head's age as 30. Neither reading is certain;
      both are recorded so that a later reader with a better image can settle it. The
      discrepancy does not touch entry no. 68.
    text_pt: >-
      Conflito com a transcrição de C-013, preservado em vez de corrigido em silêncio.
      C-013 (logs/correspondence-log.md), transcrito da mesma cópia enviada por email a
      2026-09-23, lista SETE pessoas escravizadas no fogo 67 e dá 36 anos ao chefe do
      fogo 67. A leitura feita a partir da imagem a 2026-09-24 e registada acima
      encontra SEIS pessoas escravizadas (Vicente [incerto], Antonio, José, José,
      Manoel, Maria) e lê 30 anos para o chefe do fogo. Nenhuma das leituras é certa;
      ambas ficam registadas para que um leitor futuro, com melhor imagem, as possa
      dirimir. A divergência não toca o assento nº 68.
  - text: >-
      Provenance and privacy. Received by email from Nilza Cantoni on 2026-09-23 and
      logged as correspondence C-013; the same image was later carried in the
      2026-09-24 retrieval drop. Every person named in this folio died long ago, so
      nothing here is privacy-restricted. The six enslaved people of household 67 are
      transcribed in full, with their names, ages and the colour and condition terms
      the enumerator used: omitting them would falsify the household and erase people
      the record does name.
    text_pt: >-
      Proveniência e privacidade. Recebido por email de Nilza Cantoni a 2026-09-23 e
      registado como correspondência C-013; a mesma imagem veio depois na entrega de
      2026-09-24. Todas as pessoas nomeadas neste fólio morreram há muito, pelo que nada
      aqui é restrito por privacidade. As seis pessoas escravizadas do fogo 67 são
      transcritas na íntegra, com os seus nomes, idades e os termos de cor e condição
      que o recenseador usou: omiti-las falsificaria o fogo e apagaria pessoas que o
      próprio documento nomeia.
