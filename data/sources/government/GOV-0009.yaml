transcription: >-
  [Sesmaria petition and grant, SG-Cx.21-Doc.08, APM, 1791. Seven page images: petition (p1–p2),
  boundary-witness declarations (p3–p5), Procurador recommendation (p6), grant notation (p7).]


  [Petition summary:] José Ferreira Armonde, resident at Ribeirão da Barra, Freguesia da Igreja Nova,
  Comarca de São João de El Rey, petitions for a sesmaria grant of meia légua em quadra of waste
  scrubland (capoeiras / matos devolutos). Stated borders: Norte = "terras e Sesmaria do Alferes
  Fran. Ferr.ª Armonde" [Alferes Francisco Ferreira Armonde]; Nascente = Coronel José Aires Gomes;
  Sul = herdeiros de José Francisco; Poente = José de Brito[?]. States that he holds enslaved workers
  ("visto ter escravatura pa isso") and has not previously held a sesmaria grant.


  [Boundary-witness declarations, sworn 7 April 1791, Vila de São João, before the
  Capitão-Comandante:] Four witnesses — Coronel José Aires Gomes, Alferes Francisco Ferreira
  Armonde, José de Acurdo[?], Francisco José Bóio[?] — all confirm that José Ferreira Armonde
  causes them no prejudice and has not previously held a sesmaria grant.


  [Procurador da Fazenda, António Ramos da Silva Nogueira, 10 June 1791:] Recommends the grant.


  [Grant notation:] "B. Sesmaria em 18 de Junho do dito anno" [granted 18 June 1791].
transcription_pt: >-
  [Petição e concessão de sesmaria, SG-Cx.21-Doc.08, APM, 1791. Sete imagens de página: petição
  (p1–p2), declarações de confrontantes/testemunhas (p3–p5), recomendação do Procurador (p6),
  anotação da concessão (p7).]


  [Resumo da petição:] José Ferreira Armonde, residente no Ribeirão da Barra, Freguesia da Igreja
  Nova, Comarca de São João de El Rey, peticiona pela concessão de uma sesmaria de meia légua em
  quadra de terras devolutas (capoeiras / matos devolutos). Confrontações declaradas: Norte = "terras
  e Sesmaria do Alferes Fran. Ferr.ª Armonde" [Alferes Francisco Ferreira Armonde]; Nascente =
  Coronel José Aires Gomes; Sul = herdeiros de José Francisco; Poente = José de Brito[?]. Declara
  possuir escravaria ("visto ter escravatura pa isso") e não ter recebido sesmaria anteriormente.


  [Declarações dos confrontantes/testemunhas, juramentadas em 7 de abril de 1791, Vila de São João,
  perante o Capitão-Comandante:] Quatro testemunhas — Coronel José Aires Gomes, Alferes Francisco
  Ferreira Armonde, José de Acurdo[?], Francisco José Bóio[?] — confirmam que José Ferreira Armonde
  não lhes causa prejuízo e não recebeu sesmaria anteriormente.


  [Procurador da Fazenda, António Ramos da Silva Nogueira, 10 de junho de 1791:] Recomenda a
  concessão.


  [Anotação da concessão:] "B. Sesmaria em 18 de Junho do dito anno" [concedida em 18 de junho de
  1791].
abstract: >-
  Colonial sesmaria petition and grant (SG-Cx.21-Doc.08, APM) for José Ferreira Armonde at Ribeirão
  da Barra, Freguesia da Igreja Nova, Comarca de São João de El Rey, 1791. The northern boundary is
  "terras e Sesmaria do Alferes Fran. Ferr.ª Armonde" — placing Alferes Francisco Ferreira Armonde
  as an adjacent landowner immediately north of José. Alferes Francisco also appears as a sworn
  boundary witness. This PRIMARY document PROVES that Francisco and José are two distinct individuals
  (Francisco ≠ José): Francisco holds his own sesmaria north of the Ribeirão da Barra; José holds
  a separate sesmaria at the same waterway. Both are most likely sons of elder Francisco Ferreira
  Armonde (d.1751, Borda do Campo, Barbacena). José has enslaved workers and is a man of means;
  Freguesia da Igreja Nova is the first documented Armonde foothold in the direction of the Zona da
  Mata. Usage: context_only — this source documents an ancestor-line collateral relative of P-0016
  (Simplício's line descends from Alferes Francisco, not from Capitão José), providing structural
  and geographic context.
abstract_pt: >-
  Petição e concessão de sesmaria colonial (SG-Cx.21-Doc.08, APM) para José Ferreira Armonde no
  Ribeirão da Barra, Freguesia da Igreja Nova, Comarca de São João de El Rey, 1791. A confrontação
  ao norte é "terras e Sesmaria do Alferes Fran. Ferr.ª Armonde" — situando o Alferes Francisco
  Ferreira Armonde como confrontante imediatamente ao norte de José. O Alferes Francisco também
  aparece como testemunha de confrontação juramentada. Este documento PRIMÁRIO PROVA que Francisco e
  José são dois indivíduos distintos (Francisco ≠ José): Francisco possui sua própria sesmaria ao
  norte do Ribeirão da Barra; José possui uma sesmaria separada junto ao mesmo curso d'água. Ambos
  são muito provavelmente filhos do mais velho Francisco Ferreira Armonde (†1751, Borda do Campo,
  Barbacena). José possui escravaria e é homem de posses; a Freguesia da Igreja Nova é o primeiro
  ponto de apoio documentado dos Armonde na direção da Zona da Mata. Uso: apenas contexto —
  esta fonte documenta um parente colateral da linha ancestral de P-0016 (a linha de Simplício
  descende do Alferes Francisco, não do Capitão José), fornecendo contexto estrutural e geográfico.
reliability:
  assessment: >-
    Primary colonial government record (original sesmaria petition and grant, APM Secretaria de
    Governo series). Direct evidence for: (1) José Ferreira Armonde's residence at Ribeirão da
    Barra, Freguesia da Igreja Nova, 1791; (2) the boundary relationship between José's and
    Alferes Francisco's holdings (Francisco is named as the NORTHERN neighbor, José holds land
    immediately south); (3) Alferes Francisco Ferreira Armonde as a physical presence and sworn
    witness, 7 April 1791; (4) José's enslaved workforce. The document PROVES Francisco ≠ José as
    a matter of primary record — they are separate landowners and witnesses in the same document.
  informant: >-
    José Ferreira Armonde (petitioner); four sworn boundary witnesses including Alferes Francisco
    Ferreira Armonde; Procurador da Fazenda António Ramos da Silva Nogueira; Capitão-Comandante
    (unnamed) at Vila de São João.
  limitations: >-
    José's relationship to Alferes Francisco (almost certainly brothers, sons of elder Francisco
    d.1751) is STRONG but not stated in the document — inferred from the surname cluster, adjacent
    holdings, and mutual witness status. Some witness name reads are uncertain cursive
    ("Acurdo[?]", "Bóio[?]"). This source is context_only for the data layer — it does not
    directly document P-0016 (Simplício), who descends from Alferes Francisco's line.
