notes:
- text: >-
    Context only (not evidence for a P-0016 conclusion): Simplício's direct ancestry runs through
    Alferes Francisco Ferreira Armonde, not through Capitão José. This source documents the Capitão
    José branch as a collateral line of the same family, providing geographic and structural context
    for the broader Armonde landholding network in Comarca de São João de El Rey / Igreja Nova, 1791.
    The primary significance is structural: it proves Francisco ≠ José in a single document.
- text: >-
    SILB bounded-negative CORRECTED (2026-09-19): the earlier SILB database search (2026-08-13)
    found zero Armond sesmaria grantees — correctly reflecting SILB's incomplete Minas Gerais
    coverage, not the absence of grants. This APM document (and GOV-0010/GOV-0011) are the primary
    evidence correcting that bounded-negative.
