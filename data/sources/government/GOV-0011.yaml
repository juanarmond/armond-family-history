transcription: >-
  [Government complaint, SG-Cx.65-Doc.49, APM, 17 July 1805. Three page images.]


  Letter from Juiz Ordinário António Macedo Costa, Vila de Barbacena, to the Governador de Minas
  Gerais, 17 July 1805. Subject: Capitão José Ferreira Armonde had ordered the arrest of soldier
  Miguel Luiz de Medeiros and directed his transport to the Barbacena jail. The Juiz, acting under
  a dispatch of the Governor (cited), released the prisoner following routine procedure. Capitão José
  filed a formal complaint (requerimento) claiming that the release disobeyed his military orders
  and undermined his authority. The Juiz defends his decision as consistent with established
  practice and requests the Governor's ruling.
transcription_pt: >-
  [Queixa ao governo, SG-Cx.65-Doc.49, APM, 17 de julho de 1805. Três imagens de página.]


  Carta do Juiz Ordinário António Macedo Costa, Vila de Barbacena, ao Governador de Minas Gerais,
  17 de julho de 1805. Assunto: o Capitão José Ferreira Armonde havia ordenado a prisão do soldado
  Miguel Luiz de Medeiros e sua condução à cadeia de Barbacena. O Juiz, agindo sob um despacho do
  Governador (citado), libertou o preso seguindo procedimento de rotina. O Capitão José apresentou
  uma queixa formal (requerimento) alegando que a soltura desobedeceu às suas ordens militares e
  comprometeu sua autoridade. O Juiz defende sua decisão como consistente com a prática estabelecida
  e solicita a decisão do Governador.
abstract: >-
  Government complaint letter (SG-Cx.65-Doc.49, APM, 17 July 1805): Juiz Ordinário António Macedo
  Costa, Barbacena, reports to the Governador de Minas Gerais that Capitão José Ferreira Armonde
  filed a complaint over the judicial release of a prisoner he had ordered detained. The document
  confirms that José Ferreira Armonde held the Capitão rank by 1805 — promoted from the "plain José"
  (no title) of the 1791 sesmaria (GOV-0009) — and that he remained in the Barbacena area through
  1805 (did not migrate to the Zona da Mata). This is consistent with the Lacerda thesis reference to
  "Capitão José" and distinguishes José from Alferes Francisco (who held a different rank and a
  different sesmaria location). Usage: context_only — José is a collateral relative of P-0016's
  direct ancestor line (Simplício's line descends from Alferes Francisco, not from Capitão José).
abstract_pt: >-
  Carta de queixa ao governo (SG-Cx.65-Doc.49, APM, 17 de julho de 1805): o Juiz Ordinário
  António Macedo Costa, Barbacena, informa ao Governador de Minas Gerais que o Capitão José Ferreira
  Armonde apresentou uma queixa pela soltura judicial de um preso que ele havia ordenado detido. O
  documento confirma que José Ferreira Armonde detinha o posto de Capitão em 1805 — promovido desde
  o "simples José" (sem título) da sesmaria de 1791 (GOV-0009) — e que permaneceu na área de
  Barbacena até 1805 (não migrou para a Zona da Mata). Isso é consistente com a referência da tese
  Lacerda ao "Capitão José" e distingue José do Alferes Francisco (que detinha posto diferente e
  localização de sesmaria diferente). Uso: apenas contexto — José é um parente colateral da linha
  ancestral direta de P-0016 (a linha de Simplício descende do Alferes Francisco, não do Capitão José).
reliability:
  assessment: >-
    Primary colonial government record (original letter, APM Secretaria de Governo series). Direct
    evidence for: (1) José Ferreira Armonde's Capitão rank by 1805; (2) his continued active presence
    in Barbacena through 1805; (3) his exercise of military command authority in the area.
  informant: >-
    Juiz Ordinário António Macedo Costa (letter author); Capitão José Ferreira Armonde (complainant).
  limitations: >-
    The document does not name José's wife, children, or parentage. The connection to Alferes
    Francisco (probable brothers) is inferential, supported by GOV-0009 but not stated here.
