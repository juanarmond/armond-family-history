notes:
- text: >-
    Context only: Capitão José is a collateral relative of P-0016 (Simplício's ancestor Alferes
    Francisco is a distinct person — proved by GOV-0009 where they appear as adjacent landowners).
    This document extends the portrait of Capitão José as a militarily active figure in Barbacena
    through 1805, consistent with the Lacerda thesis reference to "Capitão José Ferreira Armond"
    in the same area and period.
- text: >-
    Cross-reference with GOV-0009: In 1791, José held no military title; by 1805 he is "Capitão" —
    promoted in the 14-year interval. He stayed in Barbacena and did NOT migrate east to the Zona
    da Mata (unlike the trajectory that would apply to Alferes Francisco's sons). The "Anna Maria
    de Jesus" wife of Capitão José (from a separate FS full-text record: "José Ferreira Armond alias
    António Martins Barbosa, fled Barbacena 1809, parents = José Ferreira Armond × Anna Maria de
    Jesus") is a different surname from Alferes Francisco's wife Felizarda M. F. de Assis — further
    distinguishing the two brothers.
