transcription: >-
  [Ata da eleição para um Senador Federal, Freguesia de São Francisco da Glória, Município de
  Carangola, Estado de Minas Geraes, 6 de agosto de 1898 — p. 2 of a four-page acta (FamilySearch
  images 89–92); pp. 1, 3 and 4 are not held, and the act's own secção heading (on p. 1) is not on
  this page. Mesários named on this page: Joaquim Ribeiro da Silva (presidente), Emiliano Ananias
  de Souza, José Luis Pires, Ramiro José de Carvalho Guimarães, Augusto Ancante da Costa Brazílio.]
  "… e forão admittidos a votar os eleitores pertencentes á primeira secção deste Districto, os
  cidadãos: Antonio Ferreira de Mello, Custódio Ferreira Lopes,
  Antonio Ferreira de Carvalho, Domingos Laviola, Antonio Engracio de Souza, Antonio Fernandes do
  Prado, Antonio Fernandes do Prado Sobrinho, Estevão José do Prado, Antonio Francisco da Silva
  Valente, Antonio Carlos de Oliveira, Antonio José Pereira, Antonio Luis da Motta, Antonio Pio de
  Abreu, Antonio Lopes Valente, Antonio Rodrigues Pedroza, Antonio Tereza Gonçalves, Antonio Joaquim
  da Rocha, Alaerino José de Carvalho Guimarães, Alaerino Carlos de Oliveira, Camillo Gonçalves,
  Estevão Camillo Pedroza, Frederico Camillo Pedroza, Carlos Camillo … [the roll breaks off at
  the foot of p. 2; p. 3 not held]." [Corrected 2026-10-08 from the image: the voter clause reads
  "forão admittidos a votar os eleitores pertencentes á primeira secção deste Districto", not "por
  trinta [pela] primeira secção"; the header no longer states that the act itself is of the 1ª
  secção, which is not on the held page.]
abstract: >-
  Municipal electoral act (senatorial election, 6 August 1898) of the Freguesia de São Francisco da
  Glória, Município de Carangola (MG); only p. 2 of the four-page acta is held. It lists Antonio
  Engracio de Souza (P-0032) among the voters admitted, who are stated to belong to the 1st secção of
  the district ("eleitores pertencentes á primeira secção deste Districto"). The act's own secção
  number is unconfirmed until p. 1 is held (the retrieval side reads p. 1's heading as "2ª secção"
  [LEAD]). This is a functional-role civic appearance corroborating that he was **alive, a
  qualified (literate) voter, and resident in São Francisco da Glória / Carangola in 1898**. Context
  only (no vital event, no parentage). Also names "Ramiro José" and "Alaerino José de Carvalho
  Guimarães" among the mesa/voters — a possible cross-reference to the Guimarães line, unverified.
  [Corrected 2026-10-08 from the image: the act was previously described as "for the 1ª secção"; the
  held page states only that the admitted voters belonged to the 1st secção.]
abstract_pt: >-
  Ata de eleição municipal (Senador Federal, 6 de agosto de 1898) da Freguesia de São Francisco da
  Glória, Município de Carangola (MG); só a p. 2 da ata de quatro páginas está disponível. Arrola
  Antonio Engracio de Souza (P-0032) entre os eleitores admitidos, declarados pertencentes à 1ª secção
  do distrito ("eleitores pertencentes á primeira secção deste Districto"). O número da secção da
  própria ata não está confirmado até que a p. 1 seja obtida (o lado da recuperação lê o cabeçalho da
  p. 1 como "2ª secção" [LEAD]). Trata-se de aparição cívica em papel funcional, corroborando que
  ele estava **vivo, era eleitor habilitado (alfabetizado) e residente em São Francisco da Glória / Carangola em 1898**.
  Apenas contexto (nenhum evento vital, nenhuma filiação). Também nomeia "Ramiro José" e "Alaerino
  José de Carvalho Guimarães" na mesa/entre eleitores — possível referência cruzada à linha Guimarães,
  não verificada. [Corrigido em 2026-10-08 a partir da imagem: a ata era antes descrita como "da 1ª
  secção"; a página disponível declara apenas que os eleitores admitidos pertenciam à 1ª secção.]
reliability:
  assessment: >-
    Primary civic (electoral) act; direct for the fact that Antonio Engracio de Souza was a resident
    qualified voter in São Francisco da Glória (Carangola) in 1898. Context only — it attests no vital
    event, birthplace or parentage.
  informant: >-
    The electoral board (mesa) of the secção, presided by Joaquim Ribeiro da Silva; the secção's own
    number is on the unheld p. 1. [Corrected 2026-10-08 from the image: previously "the mesa of the
    1ª secção".]
  limitations: >-
    A functional-role appearance among many voters; corroborates residence and civic status, nothing
    more. The "Carvalho Guimarães" names on the board are an unverified possible cross-reference. Only
    p. 2 of the four-page acta (FamilySearch images 89–92) is held; pp. 1, 3 and 4 are not, so the
    act's own secção heading and the rest of the voter roll (which breaks off at "Carlos Camillo")
    are unread. The held page says only that the admitted voters belonged to the 1st secção of the
    district; the retrieval side's reading of p. 1's heading as "2ª secção" is a [LEAD] until p. 1 is
    held.
