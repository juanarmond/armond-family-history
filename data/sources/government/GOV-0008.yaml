transcription: >-
  [Ata da eleição para um Senador Federal, 1ª secção da Freguesia de São Francisco da Glória,
  Município de Carangola, Estado de Minas Geraes, 6 de agosto de 1898; mesários Joaquim Ribeiro da
  Silva (presidente), Emiliano Ananias de Souza, José Luis Pires, Ramiro José de Carvalho Guimarães,
