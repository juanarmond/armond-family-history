  Antonio Ferreira de Carvalho, Domingos Laviola, Antonio Engracio de Souza, Antonio Fernandes do
  Prado, Antonio Fernandes do Prado Sobrinho, Estevão José do Prado, Antonio Francisco da Silva
  Valente, Antonio Carlos de Oliveira, Antonio José Pereira, Antonio Luis da Motta, Antonio Pio de
  Abreu, Antonio Lopes Valente, Antonio Rodrigues Pedroza, Antonio Tereza Gonçalves, Antonio Joaquim
  da Rocha, Alaerino José de Carvalho Guimarães, Alaerino Carlos de Oliveira, Camillo Gonçalves,
  Estevão Camillo Pedroza, Frederico Camillo Pedroza, Carlos Camillo … [lista continua]."
abstract: >-
  Municipal electoral act (senatorial election, 6 August 1898) for the 1ª secção of the Freguesia de
  São Francisco da Glória, Município de Carangola (MG). Lists Antonio Engracio de Souza (P-0032) among
  the admitted voters — a functional-role civic appearance corroborating that he was **alive, a
  qualified (literate) voter, and resident in São Francisco da Glória / Carangola in 1898**. Context
  only (no vital event, no parentage). Also names "Ramiro José" and "Alaerino José de Carvalho
  Guimarães" among the mesa/voters — a possible cross-reference to the Guimarães line, unverified.
abstract_pt: >-
  Ata de eleição municipal (Senador Federal, 6 de agosto de 1898) da 1ª secção da Freguesia de São
  Francisco da Glória, Município de Carangola (MG). Arrola Antonio Engracio de Souza (P-0032) entre os
  eleitores admitidos — aparição cívica em papel funcional, corroborando que ele estava **vivo, era
  eleitor habilitado (alfabetizado) e residente em São Francisco da Glória / Carangola em 1898**.
  Apenas contexto (nenhum evento vital, nenhuma filiação). Também nomeia "Ramiro José" e "Alaerino
  José de Carvalho Guimarães" na mesa/entre eleitores — possível referência cruzada à linha Guimarães,
  não verificada.
