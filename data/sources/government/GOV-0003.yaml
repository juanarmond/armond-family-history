notes:
- text: >-
    Nº 145's "por minha Mãe, irmãos e cunhados" confirms José Cesário de Toledo Lima's
    (P-0054) mother was alive in April 1856 — consistent with Mathilde Maria de Jesus
    (P-0027, d. 1879) as his mother, and with the family's ownership of the Fazenda da
    Concórdia settled in her 1879 inventário (PRB-0006) and the 1877/1862 Concórdia
    deeds (PRB-0003, PRB-0007). Resolves the "his mother registered land in 1856"
    research lead (record-coverage P-0017 notes / Nilza Cantoni).
- text: >-
    Both declarants are Toledo relatives holding within the same Fazenda da Concórdia;
    the neighbours (Felisberto da Silva Gonçalves, Antonio Custódio, Manoel [Gonçalves]
    Pinto Braga, D. Antonia Maria de Jesus, D. Anna Maria de Assumpção, heirs of
    Joaquim Ferreira) recur across the Concórdia probate cluster.
