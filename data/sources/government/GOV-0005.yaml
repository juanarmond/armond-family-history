transcription: >-
  [Minas Geraes — Órgão Official dos Poderes do Estado, Anno VIII, N.196,
  sexta-feira 28 de julho de 1899, p.1, "GOVERNO DO ESTADO → ACTOS DO
  PRESIDENTE", sob "SECRETARIA DA POLICIA — AUCTORIDADES POLICIAES". Página
  completa retida; transcreve-se apenas o trecho que nomeia o membro da
  família.] "Por acto da mesma data, foram nomeados os cidadãos Joaquim Marques
  Corredoura, Francisco José de Sousa Salles, João Gonçalves Bahia e Benedicto
  Figueiró para subdelegado, 1.º, 2.º e 3.º supplentes do districto de Bom Jesus
  da Cachoeira Alegre; Antonio Menezes de Vasconcellos e Simplicio José Ferreira
  Armond para 1.º e 2.º supplentes do districto de Boa Familia, todos do
  municipio de Muriahé; […]" [Assim, Simplício é o 2.º suplente do subdelegado
  do distrito de Boa Família.]
abstract: >-
  The Minas Geraes state official gazette of 28 July 1899 publishes the State
  President's act appointing Simplicio José Ferreira Armond (P-0016) 2nd
  substitute (2º suplente) of the subdelegado for the Boa Família district,
  Muriaé, Minas Gerais — an unpaid honorary local police office, three years
  before his 1902 São Paulo do Muriaé appointment. It is his earliest documented
  public office and extends his documented Muriaé activity back to 1899.
abstract_pt: >-
  A gazeta oficial Minas Geraes de 28 de julho de 1899 publica o ato do
  Presidente do Estado nomeando Simplicio José Ferreira Armond (P-0016) 2º
  suplente do subdelegado do distrito de Boa Família, Muriaé, Minas Gerais — um
  cargo honorário não remunerado de autoridade policial local, três anos antes da
  nomeação de 1902 em São Paulo do Muriaé. É o seu cargo público documentado mais
  antigo e recua a sua atividade documentada em Muriaé para 1899.
reliability:
  assessment: >-
    Original, contemporaneous official act published in the State's official
    organ — direct primary evidence of the 1899 appointment and of Simplício's
    presence and standing in the Muriaé area. The office is an honorary/unpaid
    substitute police authority.
  informant: The State Government of Minas Gerais (official gazette).
  limitations: >-
    The page carries many unrelated official acts, not transcribed. The name is
    printed "Simplicio José Ferreira Armond"; identification is secure given the
    full given+surname and the Muriaé locality consistent with the family.
