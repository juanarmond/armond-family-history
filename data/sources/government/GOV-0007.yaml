abstract: >-
  A Nova Friburgo Swiss-colony settler register recording the Heureux Voyage cohort
  (arrived 1819–1820), with colonists' given names, ages, ship and death-date columns. It
  names "Laurent Bocher [Borer], 18" — Laurent Borer (P-0068, BORER II of Grindel), the
  owner's Swiss-immigrant ancestor — and, on the second opening (the Casa/Lote 70/56 group),
  "Jacques [Jacob] Bocher, 17" — Jacob Bohrer (P-0050, BORER I of Erschwil, the separate,
  not-proven-related Borer line) — plus a Wehrli family and other Borer members. A primary
  record image corroborating the Heureux Voyage immigration already documented from PUB-0003
  and Francisco José Bohrer's 1888 will. The roster ages are [uncertain] and do NOT override
  the birth years already on file: Laurent (P-0068) is recorded b. 27 Feb 1797 (PUB-0003), so
  an age of "18" here (→ ~1802) is a ~5-year discrepancy; Jacob (P-0050) is recorded b. c.1801,
  so "17" (→ ~1803) is within ~2 years. Both are preserved as roster-age discrepancies, not
  adopted.
abstract_pt: >-
  Registro de colonos da colônia suíça de Nova Friburgo referente ao grupo do Heureux
  Voyage (chegado em 1819–1820), com prenomes, idades, navio e colunas de data de óbito. Ele
  nomeia "Laurent Bocher [Borer], 18" — Laurent Borer (P-0068), ancestral imigrante suíço do
  proprietário — e "Jacques [Jacob] Bocher, 17", além de uma família Wehrli e outros membros
  Borer. Uma imagem de registro primário que corrobora a imigração do Heureux Voyage já
  documentada por PUB-0003 e pelo testamento de 1888 de Francisco José Bohrer. As idades de
  chegada declaradas (Laurent 18 → n. ~1802; Jacob 17 → n. ~1803) NÃO substituem os anos de
  nascimento primários já registrados (Jacob Borer n. 11 maio 1801); a diferença de ~2 anos é
  uma discrepância conhecida e preservada.
reliability:
  assessment: >-
    A primary record image (a period colonist register), corroborating the Nova Friburgo
    immigration independently established elsewhere. Ages are informant-reported roster
    figures, so they inform but do not fix birth years.
  informant: >-
    Colony registration officer (roster entries); the settlers' reported ages.
  limitations: >-
    Provenance runs through a genealogy blog (Fundação D. João VI digitisation, César
    Raibert republication); the archival original was not independently authenticated.
    Moderate legibility — many given names and ages are [uncertain]. Two modelled people are
    matched: "Laurent Bocher" (the arrow-marked entry) → Laurent Borer (P-0068), and, on the
    Casa/Lote 70/56 opening, "Jacques Bocher" → Jacob Bohrer (P-0050). The register is
    corroborative only: it does not, by itself, prove any filiation, and its roster ages
    conflict with the held birth years (~5 years for Laurent, ~2 for Jacob) — preserved, not
    resolved.
