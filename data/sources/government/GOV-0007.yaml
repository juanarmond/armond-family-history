notes:
- text: >-
    Corroborative primary image for the Heureux Voyage immigration of the two distinct
    Nova Friburgo Borer lines — Laurent Borer (P-0068, BORER II, the owner's ancestor) and
    Jacob Bohrer (P-0050, BORER I) — catalogued per the owner's standing preference to
    attach every record image naming a modelled person. Only these two are confidently
    matched; the other Borer/Wehrli roster names are left unlinked (legibility). The roster
    ages restate — but do not resolve — the birth-year discrepancies (Laurent b.1797 vs age
    18; Jacob b.c.1801 vs age 17); the held birth years (PUB-0003 + the 1888 will) stand.
    Do NOT let this register conflate the two Borer lines, which are not proven related.
