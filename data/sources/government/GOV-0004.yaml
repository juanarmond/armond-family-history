transcription: >-
  [Minas Geraes — Órgão Official dos Poderes do Estado, N.2, sexta-feira 7 de
  agosto de 1931, p.2, secção "GOVERNO DO ESTADO". Página completa retida;
  transcreve-se apenas o ato que nomeia o membro da família — os demais atos de
  nomeação da mesma lista são omitidos.] "Em data de ontem, foram expedidos,
  pelo sr. Presidente do Estado, os seguintes atos: […] Aristão Ferreira Armond,
  para o cargo de subdelegado de policia do districto de Limeira, municipio de
  Muriaé; […]" [Uma pessoa distinta, "Aristão Ferreira de Castro", figura na
  mesma lista como suplente do subdelegado do distrito de Itamuri, município de
  Muriaé — não é este sujeito; a identificação apoia-se no sobrenome exato
  "Ferreira Armond" e na localidade de Muriaé, coerente com a família.]
abstract: >-
  The Minas Geraes state official gazette of 7 August 1931 publishes the State
  President's act (of the previous day) appointing Aristão Ferreira Armond
  (P-0008) subdelegado de polícia of the Limeira district, Muriaé, Minas Gerais —
  an unpaid honorary local police office. It is his latest documented public
  role and places him in the Muriaé area in 1931.
abstract_pt: >-
  A gazeta oficial Minas Geraes de 7 de agosto de 1931 publica o ato do
  Presidente do Estado (da véspera) nomeando Aristão Ferreira Armond (P-0008)
  subdelegado de polícia do distrito de Limeira, Muriaé, Minas Gerais — um cargo
  honorário não remunerado de autoridade policial local. É o seu último papel
  público documentado e o situa na região de Muriaé em 1931.
reliability:
  assessment: >-
    Original, contemporaneous official act published in the State's official
    organ — direct primary evidence of the appointment and of Aristão's presence
    in the Muriaé area in 1931. The office is an honorary/unpaid substitute
    police authority.
  informant: The State Government of Minas Gerais (official gazette).
  limitations: >-
    A namesake, "Aristão Ferreira de Castro", appears in the same act list (a
    different appointment); the identification of this subject rests on the exact
    surname "Ferreira Armond" and the Muriaé locality. The page carries many
    unrelated official acts, not transcribed.
