notes:
- text: >-
    The mother's surname slip. The certidão gives Aristides's mother as "LUIZA SECUNDINA DE
    OLIVEIRA". It is transcribed exactly as printed and must not be propagated as a name
    variant of P-0013. Every other record of her has "de Azevedo" — "Luiza Secundina de
    Azevedo" at this same man's 1922 baptism (PAR-0003), and "Luiza Fernandes de Azevedo" at
    her own 1916 marriage (CIV-0001, CIV-0006) — and nothing anywhere suggests an Oliveira
    surname. The likeliest cause is a copying slip, and the presiding judge's surname, de
    Oliveira, two lines lower, is a possible source of contamination. That is an inference;
    an inteiro teor of termo 21425 would show whether the error is in the 1953 termo itself.
  text_pt: >-
    O lapso no sobrenome da mãe. A certidão dá a mãe de Aristides como "LUIZA SECUNDINA DE
    OLIVEIRA". É transcrito exatamente como impresso e não deve ser propagado como variante
    de nome de P-0013. Todos os outros registros dela têm "de Azevedo" — "Luiza Secundina de
    Azevedo" no batismo de 1922 deste mesmo homem (PAR-0003) e "Luiza Fernandes de Azevedo"
    no seu próprio casamento de 1916 (CIV-0001, CIV-0006) — e nada sugere um sobrenome
    Oliveira. A causa mais provável é um lapso de cópia, e o sobrenome do juiz que presidiu,
    de Oliveira, duas linhas abaixo, é uma possível fonte de contaminação. Isso é uma
    inferência; uma certidão de inteiro teor do termo 21425 mostraria se o erro está no
    próprio termo de 1953.
- text: >-
    Identification. This Aristides is the son of F-0001 recorded at his 1922 baptism
    (PAR-0003): the certidão repeats his exact birth date (22 July 1922), his father's full
    name and his mother's two given names, and the baptism took place at Carangola, the
    birthplace stated here. The identification is secure. The wrong maternal surname does
    not weaken it, because every other element agrees.
  text_pt: >-
    Identificação. Este Aristides é o filho de F-0001 registrado no batismo de 1922
    (PAR-0003): a certidão repete sua data de nascimento exata (22 de julho de 1922), o nome
    completo do pai e os dois prenomes da mãe, e o batismo foi em Carangola, a naturalidade
    declarada aqui. A identificação é segura. O sobrenome materno errado não a enfraquece,
    porque todos os outros elementos concordam.
- text: >-
    What the record adds for modelling. It is the first held record to state Aristides's
    birthplace (Carangola; PAR-0003 gives the date but not the place). It also gives his
    marriage on 16 May 1953 at São João de Meriti to Manoela da Silva (born 30 October 1922,
    Minas Gerais; daughter of João Luiz da Silva and Durfina Maria da Luz), who took the
    name Manoela da Silva Bittencourt. It can be cited on Aristides's documented_children
    entry on F-0001. It documents his move from Minas Gerais to the Rio de Janeiro Baixada
    by 1953.
  text_pt: >-
    O que o registro acrescenta à modelagem. É o primeiro registro guardado que declara a
    naturalidade de Aristides (Carangola; PAR-0003 dá a data, mas não o lugar). Dá também
    seu casamento em 16 de maio de 1953, em São João de Meriti, com Manoela da Silva
    (nascida em 30 de outubro de 1922, Minas Gerais; filha de João Luiz da Silva e de Durfina
    Maria da Luz), que passou a usar o nome Manoela da Silva Bittencourt. Pode ser citado na
    entrada de Aristides em documented_children de F-0001. Documenta sua mudança de Minas
    Gerais para a Baixada Fluminense até 1953.
- text: >-
    Checked against the retrieval side's verbatim draft (profile
    aristides-muniz-bittencourt.md, 2026-09-13): the draft is accurate. This transcription
    adds the selo, the header, the adopted-name section, the cadastro note and the issuing
    office's details, which the draft summarised. Privacy: the owner states that everyone
    named in these records is deceased. The 2019 registry staff appear only in their
    official capacity, and the escrevente's CTPS (work-card) number is withheld as an
    identity-document number of a third party. The CPFs are already masked on the certidão.
  text_pt: >-
    Conferido com o rascunho literal da pesquisa de recuperação (perfil
    aristides-muniz-bittencourt.md, 2026-09-13): o rascunho é exato. Esta transcrição
    acrescenta o selo, o cabeçalho, a seção do nome adotado, a nota de cadastro e os dados do
    ofício emissor, que o rascunho resumia. Privacidade: o proprietário afirma que todos os
    nomeados nestes registros são falecidos. Os funcionários do registro de 2019 aparecem
    apenas na qualidade de oficiais, e o número da CTPS da escrevente é omitido, por ser
    número de documento de identidade de terceiro. Os CPFs já vêm mascarados na certidão.
