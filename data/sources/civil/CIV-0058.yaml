abstract: >-
  A certidão de casamento issued on 11 June 2019 by the 1st District civil registry of São
  João de Meriti (Rio de Janeiro state), abstracting termo 21425 (book 52, now B-52, fl.
  141v). Aristides Muniz Bittencourt, born 22 July 1922 at Carangola, Minas Gerais,
  Brazilian, son of Deocleciano Muniz Bittencourt (P-0012) and "LUIZA SECUNDINA DE
  OLIVEIRA", married Manoela da Silva, born 30 October 1922 in the state of Minas Gerais,
  Brazilian, daughter of João Luiz da Silva and Durfina Maria da Luz. The marriage was
  celebrated in the cartório at São João de Meriti before the Juiz de Direito Adherbal de
  Oliveira on 16 May 1953, under the regime of comunhão de bens; she took the name Manoela da
  Silva Bittencourt. His mother's surname is a slip for "de Azevedo": she is Luiza Secundina
  de Azevedo (P-0013), as at his 1922 baptism (PAR-0003), whose birth date (22 July 1922)
  this certidão repeats. Aristides is a collateral child of F-0001, a brother of Antenor
  Muniz (P-0006).
abstract_pt: >-
  Certidão de casamento emitida em 11 de junho de 2019 pelo registro civil do 1.º Distrito
  de São João de Meriti (Estado do Rio de Janeiro), em breve relato do termo 21425 (livro 52,
  atual B-52, fl. 141v). Aristides Muniz Bittencourt, nascido em 22 de julho de 1922 em
  Carangola, Minas Gerais, brasileiro, filho de Deocleciano Muniz Bittencourt (P-0012) e de
  "LUIZA SECUNDINA DE OLIVEIRA", casou-se com Manoela da Silva, nascida em 30 de outubro de
  1922 no Estado de Minas Gerais, brasileira, filha de João Luiz da Silva e de Durfina Maria
  da Luz. O casamento foi realizado em cartório, em São João de Meriti, perante o Juiz de
  Direito Adherbal de Oliveira, em 16 de maio de 1953, sob o regime de comunhão de bens; ela
  passou a usar o nome Manoela da Silva Bittencourt. O sobrenome da mãe dele é um lapso por
  "de Azevedo": ela é Luiza Secundina de Azevedo (P-0013), como no batismo dele de 1922
  (PAR-0003), cuja data de nascimento (22 de julho de 1922) esta certidão repete. Aristides é
  filho colateral de F-0001, irmão de Antenor Muniz (P-0006).
reliability:
  assessment: >-
    A modern certified abstract (2019) of an original 1953 civil marriage termo, so a
    derivative. The marriage itself, its date, place, officiating judge and property
    regime are primary information recorded at the time. The spouses' birth dates,
    birthplaces and filiations were declared by the parties in 1953 and are secondary for
    those births. The abstract has lost the witnesses, ages, occupations and residences that
    the full termo would hold, and it carries at least one error in the filiation.
  informant: >-
    The contracting parties (1953), as abstracted by the São João de Meriti registry
    (escrevente Cristiane Chaves de Oliveira da Silva, 2019).
  limitations: >-
    The mother's surname is wrong ("de Oliveira" for "de Azevedo"); a breve relato cannot
    show whether the slip is in the 1953 termo or in the 2019 abstract. Only an inteiro teor
    would show the witnesses, the spouses' ages, occupations and residences, and the exact
    wording of the filiation. The CPF fields are masked on the certidão.
