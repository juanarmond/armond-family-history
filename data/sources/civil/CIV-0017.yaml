transcription: >-
  [Óbito nº 37.787.] "Aos vinte e dois de junho de mil novecentos e sessenta e
  quatro, nesta Cidade e em meu Cartório, compareceu [Werner Engracio Guimarães],
  solteiro, nacionalidade brasileira, com 32 anos de idade, profissão
  comerciário, residente na rua Honorio Hermeto, nº 138, Pavuna, est. G[uanabara],
  e exibindo atestado de óbito firmado pelo médico Frediano Martinelli, declarou:
  Que no dia de ontem, na rua Doze de Outubro, nº 805, neste, às 14 horas ... faleceu Antonio Engracio
  Filho, do sexo masculino, côr branca, com sessenta e nove anos de idade, natural
  do Estado de Minas Gerais, estado civil casado com Maria Aurora Guimarães,
  profissão negociante, residente rua Honorio Hermeto, nº 138, Pavuna, est. da
  Guanabara, filho de Antonio Engracio de Souza e de Luzia Pinheiro da Conceição,
  falecidos. Causa mortis: câncer da próstata. Vai ser sepultado no Cemitério de
  São João de Meriti. Observações: não deixou bens e deixou seis filhos maiores."
  The declarant Werner Engracio Guimarães exhibited the physician's death
  attestation (firmado pelo médico Frediano Martinelli); the form records no
  separate identity-document number for him.
abstract: >-
  Original civil death register recording the death of Antonio Engracio Filho
  (P-0010) on 21 June 1964 (act 22 June), aged 69 (so born c.1895), a negociante
  born in Minas Gerais, married to Maria Aurora Guimarães (P-0011). It names his
  parents as Antonio Engracio de Souza (P-0032) and Luzia Pinheiro da Conceição
  (P-0033), both already deceased, and reports six surviving adult children.
abstract_pt: >-
  Registro civil de óbito original que registra o óbito de Antonio Engracio
  Filho (P-0010) em 21 de junho de 1964 (assento de 22 de junho), aos 69 anos
  (portanto nascido por volta de 1895), negociante nascido em Minas Gerais,
  casado com Maria Aurora Guimarães (P-0011). Nomeia seus pais como Antonio
  Engracio de Souza (P-0032) e Luzia Pinheiro da Conceição (P-0033), ambos já
  falecidos, e informa seis filhos adultos sobreviventes.
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly reports his marriage to Maria Aurora Guimarães. His parents are
    stated as secondary (informant-reported) information given by a son.
  informant: Werner Engracio Guimarães, a son of the deceased.
  limitations: >-
    The register page also carries an unrelated adjacent death entry (nº 37.786,
    Divaldino Rosalino da Silva). The parent names are informant-reported at
    death. The exact death-address street and cartório are only partly legible on
    the retained tile.
