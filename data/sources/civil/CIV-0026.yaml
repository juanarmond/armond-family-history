transcription: >-
  [Óbito Nº 91.554, fl. 27, Rio de Janeiro. Left-hand entry.] "Aos vinte e quatro de
  novembro de mil novecentos e sessenta e um, nesta Cidade, e neste cartório, compareceu
  [Nicolau Mozaguio — uncertain], profissão comércio, residente Santa Luzia 206, e
  exibindo atestado de óbito firmado pelo Doutor [illegible] CRM 7230, declarou: Que no
  dia dezenove do corrente às 5 horas, [no] Hospital Estadual Santa Ma[ria], faleceu
  Hermogenes Engracio de Souza, do sexo masculino, côr branca, com 65 annos de idade,
  natural de Minas Gerais, estado civil casado com Maria Dutra de Souza, profissão
  lavrador, residente rua 'R' lote 30 quadra 38 [Duque de] Caxias, filho de Antonio
  Engracio de Souza e Luzia Pinheiro [da] Conceição — e será sepultado no cemitério de
  São Francisco Xavier. Causa Mortis: caquexia, tuberculose pulmonar. O obitado deixou
  tres filhas maiores; não deixou bens."
abstract: >-
  Civil death of Hermogenes Engracio de Souza (b. ~1896, Minas Gerais; d. 19 November
  1961, Rio de Janeiro, aged 65), lavrador, married to Maria Dutra de Souza. Names his
  parents as Antonio Engracio de Souza (P-0032) and Luzia Pinheiro da Conceição (P-0033)
  — a second independent primary confirming that couple's names, and documenting a further
  child of theirs (a brother of Antonio Engracio Filho, P-0010). He left three adult
  daughters (not named in the record).
abstract_pt: >-
  Óbito civil de Hermogenes Engracio de Souza (n. ~1896, Minas Gerais; f. 19 de novembro
  de 1961, Rio de Janeiro, aos 65 anos), lavrador, casado com Maria Dutra de Souza. Nomeia
  seus pais Antonio Engracio de Souza (P-0032) e Luzia Pinheiro da Conceição (P-0033) — uma
  segunda confirmação primária independente dos nomes do casal, e documenta mais um filho
  deles (irmão de Antonio Engracio Filho, P-0010). Deixou três filhas maiores (não nomeadas
  no registro).
reliability:
  assessment: >-
    Primary civil death register entry; the filiation is informant-reported (by a
    non-relative declarant), so it corroborates the parents' names rather than proving them.
  informant: "[Nicolau Mozaguio — uncertain], declarant; not a relative."
  limitations: >-
    The declarant's name and the attesting doctor are partly illegible; the daughters are
    unnamed. "SEM VALOR LEGAL" watermark ignored (a working copy).
