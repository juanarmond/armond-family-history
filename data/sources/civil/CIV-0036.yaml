transcription: >-
  [Registro Civil de casamentos, 1º Distrito de São João Baptista, Nova Friburgo, termo N.399, folio
  162-163, 1895; escrivão Carlos Miguel Noel.] "Aos vinte e oito dias do mês de Dezembro de mil
  oitocentos noventa e cinco, ás doze horas do dia, nesta Cidade de Nova Friburgo ... receberam-se em
  matrimonio no regimen commum Octavio Ferreira da Silva com Dona Octavia Froidevaux, moradores neste
  Districto, com vinte e sete annos de idade, solteiro, operario, natural da Freguesia de Nossa
  Senhora da Conceição de Apparecida (Estado do Rio de Janeiro), residente em companhia de seus Pais,
  filho legitimo de Antonio da Silva Ferreira e de Maria Joanna da Silva Ferreira, moradores neste
  Districto. Ella ... com vinte e dois annos de idade, solteira ... filha legitima de João Julião
  Froidevaux e de Joaquina Brazília da Silva Froidevaux, moradores neste Districto ..."
abstract: >-
  Civil marriage of Octávio Ferreira da Silva (27, b. ~1868, operário) and Octavia Froidevaux, 28
  December 1895 at Nova Friburgo. Octávio is a "filho legitimo de Antonio da Silva Ferreira e de
  Maria Joanna da Silva Ferreira, moradores neste Districto" — so BOTH his parents (P-0036 × P-0037)
  were ALIVE and resident at Nova Friburgo in December 1895. Octávio is a documented sibling of the
  direct ancestor Lucinda (P-0031); Octavia is a daughter of the Swiss-NF colony Froidevaux family.
  Corroborates the parents (F-0017) and brackets Maria Joanna's death (alive Dec 1895).
abstract_pt: >-
  Casamento civil de Octávio Ferreira da Silva (27 anos, n. ~1868, operário) e Octavia Froidevaux,
  28 de dezembro de 1895, em Nova Friburgo. Octávio é "filho legitimo de Antonio da Silva Ferreira e
  de Maria Joanna da Silva Ferreira, moradores neste Districto" — logo AMBOS os pais (P-0036 × P-0037)
  estavam VIVOS e residentes em Nova Friburgo em dezembro de 1895. Octávio é irmão documentado da
  ancestral direta Lucinda (P-0031); Octavia é filha da família Froidevaux, da colônia suíça de NF.
  Corrobora os pais (F-0017) e delimita o óbito de Maria Joanna (viva em dez. 1895).
reliability:
