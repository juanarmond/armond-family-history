transcription: >-
  [Termo n.º 18892, páginas 264/265; imagem com marca "SEM VALOR LEGAL".] Em
  quinze de novembro de mil novecentos e sessenta e dois, nesta cidade de
  [Itaperuna?], no Estado do Rio de Janeiro, em cartório, compareceu [Gustavo?]
  Barroso, comerciante aqui residente [à rua 1.º de Maio?], e exibindo atestado
  de óbito firmado pelo Dr. Carlos Antonio Deslandes, dando como causa da morte
  [colapso?] cardíaco, declarou que no dia de hoje, às treze horas e trinta
  minutos, [em rua Paes de Azevedo, 100?], faleceu Marfiza Ferreira Armond, do
  sexo feminino, de cor branca, profissão doméstica, natural [do Estado] de
  Minas, com oitenta e nove (89) anos de idade [b. ~1873], estado civil viúva,
  filha legítima de Simplício Ferreira Armond e [d.] Eliza Ferreira Toledo. O
  sepultamento será feito no cemitério desta cidade. [Assinado o declarante,]
  [Gustavo?] Barroso.
abstract: >-
  An owner-supplied civil death register image (entry n.º 18892, watermarked
  "SEM VALOR LEGAL") recording the death of Marfiza Ferreira Armond on 15
  November 1962 in Rio de Janeiro state (registration city read as Itaperuna,
  uncertain). A widow and doméstica, natural of Minas Gerais, she is recorded as
  the legitimate daughter of Simplício Ferreira Armond and Eliza Ferreira
  Toledo. This independently confirms Eliza's Toledo surname and documents
  Marfiza as a daughter of Simplício and Eliza — that is, a sister of Aristão
  Ferreira Armond (P-0008).
reliability:
  assessment: >-
    Original civil-register evidence for Marfiza's death that directly names her
    parents (secondary information, reported at death). Together with CIV-0005
    (Aristão's 1957 death) it provides a second primary attestation that
    Simplício and Eliza (Toledo) were her parents, strengthening Eliza's Toledo
    surname and the Simplício x Eliza couple.
  informant: >-
    The declarant, a commerciante recorded as "[Gustavo?] Barroso", reporting at
    the civil registry on a physician's death certificate.
  limitations: >-
    A watermarked "SEM VALOR LEGAL" copy with no supplied FamilySearch/portal
    citation; the exact archival reference must still be captured. Several fields
    are read with uncertainty from the handwriting: the registration city
    (Itaperuna?), the declarant's given name and the mother's middle name. The
    recorded age of 89 (b. ~1873) matches Marfiza's separately-noted ~1873 birth
    lead. The parentage is secondary information reported at death.
