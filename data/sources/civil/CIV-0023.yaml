notes:
- text: >-
    Adds Aristides Ferreira Armand (daughter, b.~1875 Rio Pardo da Leopoldina,
    m.1894) as a documented child of Simplício × Eliza (F-0006) — a sister of Aristão
    and Marfiza. Gives Eliza's name here as "Elisa Balbina de Jesus" (a further
    variant). Locality leads for the Simplício line: the family resided at São
    Fernando do Divisório, Boa Família (Muriaé) in 1894, and Aristides was born
    ~1875 at Rio Pardo da Leopoldina (the Argirita/Bom Jesus do Rio Pardo area).
