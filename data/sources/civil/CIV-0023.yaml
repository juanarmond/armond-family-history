transcription: >-
  [Certidão de inteiro teor — casamento; Registro Civil das Pessoas Naturais com
  Atribuição Notarial de Boa Família, Muriaé-MG; nomes João Rodrigues Braga e
  Aristides Ferreira Armand; matrícula 0438770155 1894 2 00001 134 0000009 15.]
  "CERTIFICO, a pedido por requerimento de pessoa interessada e com autorização da
  MMª. Juíza de Direito Diretora do Foro da Comarca de Muriaé-MG, Drª. Alinne
  Arquette Leite Novais na data de 06/08/2019, que revendo os livros de casamento
  neles achou constar o registro que abaixo se transcreve, extraindo a presente
  Certidão de Inteiro Teor: Livro 1-B, Folha 134, Termo 9: Aos onze dias do mez de
  Agosto do anno de mil oito centos e noventa e quatro as quatro horas da tarde,
  neste Districto de São Francisco de Paula da Boa Familia, Comarca do Muriahé,
  Estado de Minas Geraes, no logar denominado São Fernando do Divizorio, em casa de
  residencia do cidadão Simplicio José Ferreira Armand, onde eu escrivão a chamado
  vim, presentes o cidadão José Eugenio de Miranda, Juiz de Paz e dos casamentos
  commigo escrivão do seu cargo abaixo assignado e as testemunhas Balduino
  Rodrigues de Almeida "ilegível" e Anastacio Theodoro de Souza, receberam-se em
  matrimonio, JOÃO RODRIGUES BRAGA e Dona ARISTIDES FERREIRA ARMAND, ambos
  solteiros; elle com vinte e quatro annos de idade, lavrador, natural do Gloria do
  Muriahé, e ali residente, filho legitimo de Francisco Rodrigues Pereira Braga, já
  fallecido e Dª Constancia Leopoldina Campos, ali residente e ella, do serviço
  domestico com dezenove annos de idade, natural do Rio Pardo da Leopoldina,
  residente neste Districto, filha legitima de Simplicio José Ferreira Armand e Dª
  Elisa Balbina de Jesus residentes neste districto. Em firmeza do que eu José
  Lourenço Vianna, official do registro civil lavrei este acto em que assignam e
  assigna tambem o juiz e as testemunhas. Eu José Lourenço Vianna official do
  registro civil o escrevi e assigno. (a.a) José Lourenço Vianna; Jose Eugenio de
  Miranda; João Rodrigues Braga; Aristides Ferreira Armand; Balduino Rodrigues de
  Almeida "ilegível" com trinta annos de idade, lavrador residente no districto da
  Leopoldina; Anastacio Theodoro de Souza, negociante com vinte e dous annos,
  rezidente no Gloria do Muriahé; Antonio Franº dos Santos; G. Haas; Manoel Ferr.
  "ilegível"; Dr. Augusto Ferr. de Macedo e Simplicio José Ferr. Armand. //////" O
  conteúdo da certidão é verdadeiro. Dou fé. Boa Família, Muriaé-MG, 06 de agosto
  de 2019. (Roberto Alves Barcellos, Oficial de Registro Civil.)
abstract: >-
  A 2019 certified inteiro-teor of the 11 August 1894 civil marriage of João
  Rodrigues Braga and Dona Aristides Ferreira Armand at São Fernando do Divisório,
  Boa Família (Muriaé, MG) — held at the house of Simplício José Ferreira Armand,
  who also signed as a witness. The bride, aged 19 (so born c.1875, "natural do Rio
  Pardo da Leopoldina"), is recorded as the legitimate daughter of Simplício José
  Ferreira Armand (P-0016) and Dª Elisa Balbina de Jesus (P-0017) — a third
  documented child of that couple and a sister of Aristão (P-0008) and Marfiza.
reliability:
  assessment: >-
    Direct primary evidence of the 1894 marriage and of the bride's parentage,
    which is stated by the officiant with the father present and signing. A third
    primary attestation of the couple Simplício × Eliza and of Simplício's full
    signed name.
  informant: >-
    The civil registrar (José Lourenço Vianna); the bride's father Simplício José
    Ferreira Armand was present and among the signatories.
  limitations: >-
    A 2019 certified copy, not the original register image. The bride Aristides
    Ferreira Armand and the groom's family are collateral and not modelled as
    entities. Some witness names are read with uncertainty.
