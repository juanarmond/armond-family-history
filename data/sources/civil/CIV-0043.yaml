transcription: >-
  [Óbito termo Nº 18.941, livro de óbitos de Itaperuna, Estado do Rio de Janeiro,
  fl. ~289; lower-right entry. In the left margin: "Indigente", with a mark.] "Em
  vinte e seis de dezembro de mil novecentos e sessenta e dois, nesta cidade de
  Itaperuna, no Estado do Rio de Janeiro, em cartório, compareceu Engracio Antonio
  de Souza, lavrador aqui residente, e exibindo atestado de óbito firmado por Dr.
  Munir Bussade, dando como causa da morte insuficiência cardíaca congestiva,
  declarou que no dia de ontem às dezessete horas, em rua da Harmonia, faleceu
  Teodolina Engracia de Souza, do sexo feminino, de côr branca, profissão
  doméstica, natural de E[stado] de Minas, domiciliada e residente em esta cidade,
  com 60 anos de idade, estado civil viúva, filha legítima de Antonio Engracio e
  Luzia Pinheiro. O sepultamento será feito no cemitério desta cidade. Era viúva de
  Alcesterman [uncertain] Pinheiro, deixa os filhos: Luzia e o declarante, maiores,
  não deixa bens. Para constar lavrei este termo que assina o declarante comigo
  Sebastiana de Souza Medeiros, escrevente de justiça, que escrevi. Eu, [ilegível]
  de Souza, oficial, que subscrevo e assino." [Assinatura do oficial; na linha
  seguinte: "x Maria José Glória".]
abstract: >-
  Civil death of Teodolina Engracia de Souza (b. ~1902, Minas Gerais; d. 25
  December 1962, Itaperuna, Rio de Janeiro, aged 60), doméstica, widow. Names her
  parents as Antonio Engracio de Souza (P-0032) and Luzia Pinheiro da Conceição
  (P-0033) — "filha legítima de Antonio Engracio e Luzia Pinheiro" — a further
  documented child of that couple and hence a sister of Antonio Engracio Filho
  (P-0010). PROVEN: both parents named and both match F-0015. Recorded as a
  documented_child on F-0015; not modelled as a person entity, so no event
  created. The act adds that she was the widow of Alcesterman [uncertain] Pinheiro
  and left two adult children, Luzia and the declarant, Engracio Antonio de Souza
  (lavrador, of Itaperuna).
abstract_pt: >-
  Óbito civil de Teodolina Engracia de Souza (n. ~1902, Minas Gerais; f. 25 de
  dezembro de 1962, Itaperuna, Rio de Janeiro, aos 60 anos), doméstica, viúva.
  Nomeia seus pais Antonio Engracio de Souza (P-0032) e Luzia Pinheiro da
  Conceição (P-0033) — "filha legítima de Antonio Engracio e Luzia Pinheiro" —
  mais um filho documentado desse casal e, portanto, irmã de Antonio Engracio
  Filho (P-0010). COMPROVADO: ambos os pais nomeados e ambos coincidem com F-0015.
  Registrada como documented_child em F-0015; não modelada como entidade de
  pessoa, logo nenhum evento criado. O assento acrescenta que ela era viúva de
  Alcesterman [incerto] Pinheiro e deixou dois filhos maiores, Luzia e o
  declarante, Engracio Antonio de Souza (lavrador, de Itaperuna).
reliability:
  assessment: >-
    Primary civil death register entry; the filiation is informant-reported at
    death, so it corroborates the parents' names (already established for F-0015
    by CIV-0017 and CIV-0026) and documents a further child of the couple.
  informant: >-
    Her son Engracio Antonio de Souza, lavrador, resident in Itaperuna ("deixa os
    filhos: Luzia e o declarante").
  limitations: >-
    Age→birth (~1902) is approximate; her late husband's given name is an uncertain
    reading. The signature line reads "x Maria José Glória", a name not otherwise
    explained in the act. "SEM VALOR LEGAL" watermark ignored
    (a working copy).
