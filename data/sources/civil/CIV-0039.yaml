transcription: >-
  [Primeira Circunscrição do Registro Civil (Volta Redonda). Livro C-0126, Folhas 246. Termo de
  óbito nº 54404 (typewritten).] "Aos nove de abril de dois mil e cinco, nesta cidade de Volta
  Redonda, do Estado do RJ, compareceu: PAULO CESAR BORHER, brasileira, casado, 53 anos, aposentado,
  RG: 12104304-6 IFP/RJ, residente na Avenida Julio Caruso nº830, Belmonte, Volta Redonda-RJ
  exibindo atestado de óbito firmado pelo Dr. EDUARDO SAMPAIO DINIZ CRM Nº 52277150, do qual consta
  que no dia oito de abril de dois mil e cinco (08/04/2005), às quatorze horas e trinta minutos, no
  Hospital Vita Volta Redonda, Volta Redonda-RJ, dando como causa da morte: falencia multipla
  organica, choque refratario, insuficiencia renal aguda, acidente vascular encefalico, faleceu
  ALICIO BORHER, nascido aos vinte e seis de julho de mil novecentos e vinte e quatro (26/07/1924),
  do sexo masculino, profissão aposentado industriario, natural de Divino-MG, com 80 anos de idade,
  estado civil viúvo, conforme declaração de óbito, residente e domiciliado no(a) Avenida Julio
  Caruso nº830, Belmonte, Volta Redonda, RJ, deixou dois filhos(as) maior(es), KATIA REGINA BORHER
  GRECIA 31 anos, PAULO CEZAR BORHER 53 anos e não deixou filhos(as) menor(es), a existência de bens
  não foi firmada por falta de documento probante, era eleitor e não deixou testamento conhecido.
  Filho de JOÃO GONÇALVES BORHER e de CELINA BORHER. O sepultamento será realizado no cemitério de
  Volta Redonda-RJ conforme informação prestada pelo declarante. Documento(s) apresentado(s): RG n.º
  11284517-7-RJ, Cod. org. expedidor: 01, CPF n.º 04874390749, certidão de casamento sob nº 35,
  livro nº 20, folhas nº 20 do Cartório de Divino-MG. Outros documentos apresentados: KATIA,
  Certidão de casamento deste Cartório LºBA-33 [uncertain], fls 285, tº10.153; PAULO RG: 12104304-6
  IFP/RJ. Certidão de casamento do Cartório de Divino-MG Lº20, fls 20, tº35. O declarante
  compareceu na qualidade de filho do falecido. Nada Mais. Dou fé. Eu, [assinatura], CLEIA
  APARECIDA DUQUE, Escrevente, digitei. Eu, ______, TAIS GUILHERME DE BARROS, oficial, conferi,
  subscrevo e assino. Declarante: x [assinatura: "Borher"]." [Rodapé: "SEM EMOLUMENTO / Digitado
  por: CLÉIA"; carimbo da 1ª Circ. do Registro Civil, Volta Redonda (Cléia A. Duque, Autorizada);
  selo "(RO) 1 ato RFU98190".]
abstract: >-
  Original civil death register recording the death of Alício Borher on 8 April 2005 at the Hospital
  Vita, Volta Redonda (RJ), aged 80 (stated birth 26 July 1924, Divino-MG), widower, retired
  industrial worker — named as "filho de João Gonçalves Borher e de Celina Borher" (P-0014 × P-0015),
  i.e. a brother of Iris Bohrer Muniz (P-0007). PROVEN sibling. Recorded as a documented_child on
  F-0005; no event (Alício is not modelled). CONFLICT to note: this cert's informant-reported birth
  "26 Jul 1924" clashes with the held 1924 Nova Friburgo birth act of his brother Eunir (b. 17 May
  1924, CIV-0016) — two full-term births to the same mother about 10 weeks apart are impossible, so
  one year/date is in error; the birth act (Eunir) outranks this death informant. [Corrected
  2026-10-08 from the image: Eunir's birth is 17 May 1924, not 7 May, so the gap is about 10 weeks,
  not 11.] The declarant was his son Paulo Cesar (also written Cezar) Borher, 53; the act names
  two adult children, Katia Regina Borher Grecia (31) and Paulo Cezar Borher (53).
abstract_pt: >-
  Registro civil de óbito de Alício Borher em 8 de abril de 2005 no Hospital Vita, Volta Redonda (RJ),
  aos 80 anos (nascimento declarado 26 de julho de 1924, Divino-MG), viúvo, aposentado industriário —
  nomeado como "filho de João Gonçalves Borher e de Celina Borher" (P-0014 × P-0015), ou seja, irmão
  de Iris Bohrer Muniz (P-0007). Irmão PROVEN. Registrado como documented_child em F-0005; sem evento
  (Alício não é modelado). CONFLITO a registrar: o nascimento "26/07/1924" declarado neste óbito
  conflita com o assento de nascimento de 1924 de Nova Friburgo de seu irmão Eunir (n. 17 de maio de
  1924, CIV-0016) — dois nascimentos a termo da mesma mãe com cerca de 10 semanas de intervalo são
  impossíveis, logo uma das datas/anos está errada; o assento de nascimento (Eunir) prevalece sobre o
  informante do óbito. [Corrigido em 2026-10-08 a partir da imagem: o nascimento de Eunir é 17 de
  maio de 1924, e não 7 de maio, de modo que o intervalo é de cerca de 10 semanas, e não 11.]
  O declarante foi seu filho Paulo Cesar (também grafado Cezar) Borher, 53 anos; o assento nomeia
  dois filhos maiores, Katia Regina Borher Grecia (31 anos) e Paulo Cezar Borher (53 anos).
