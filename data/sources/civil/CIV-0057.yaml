notes:
- text: >-
    Readings that differ from the retrieval side's verbatim draft (profile
    rozalina-bittencourt-alves.md, 2026-09-13). (1) The husband's name: the draft's
    "[W]eimar Joaquim Alves" is not supported. The middle name reads "Chrispim", not
    "Joaquim" (C with a loop, h, r, i, a long-tailed s or p, i, m). The given name ends
    clearly in "-mar", but its opening is a tall stroke that may be an L (Leomar) or the
    lead-in of a W (Weimar); I cannot decide. (2) The mother is written "Luiza Secunda[s] de
    Azevedo", not "Luiza Secundina": after "Secund" come an a and a final letter shaped like
    this clerk's final s (it could be an o). (3) The time is "8 horas e 7 minutos", not "8
    horas e 4 minutos": the minute figure has the same crossed 7 as the entry number 3.705.
    (4) The place is written "Hospital Duque de Caxias" (no "de" after Hospital). (5) The
    declarant signs "João Mau[ricio or rilio] Pimentel", not "José Mauricio Pimenta". (6)
    The draft omits the left-margin annotation "Cert. Cas. [Xerem.] D. Caxias L: 2 fls. 423
    N.º 1023 em 10-8-63". (7) The escrivão's signature reads "Neyde [illegible]
    M[eires]", not "Neyde Mal[…] Meirel[es]". The age 54, the 3 adult children, the
    address, the doctor and the cemetery are confirmed.
  text_pt: >-
    Leituras que diferem do rascunho literal da pesquisa de recuperação (perfil
    rozalina-bittencourt-alves.md, 2026-09-13). (1) O nome do marido: o "[W]eimar Joaquim
    Alves" do rascunho não se sustenta. O nome do meio lê-se "Chrispim", não "Joaquim" (C com
    laço, h, r, i, um s ou p de cauda longa, i, m). O prenome termina claramente em "-mar",
    mas abre com um traço alto que pode ser um L (Leomar) ou o traço inicial de um W
    (Weimar); não consigo decidir. (2) A mãe está escrita "Luiza Secunda[s] de Azevedo", não
    "Luiza Secundina": depois de "Secund" vêm um a e uma letra final com a forma do s final
    deste escrevente (poderia ser um o). (3) A hora é "8 horas e 7 minutos", não "8 horas e 4
    minutos": o algarismo dos minutos tem o mesmo 7 cortado do número do termo, 3.705. (4) O
    local está escrito "Hospital Duque de Caxias" (sem "de" depois de Hospital). (5) O
    declarante assina "João Mau[ricio ou rilio] Pimentel", não "José Mauricio Pimenta". (6)
    O rascunho omite a anotação da margem esquerda "Cert. Cas. [Xerem.] D. Caxias L: 2 fls.
    423 N.º 1023 em 10-8-63". (7) A assinatura do escrivão lê-se "Neyde [ilegível]
    M[eires]", não "Neyde Mal[…] Meirel[es]". A idade de 54 anos, os 3 filhos maiores, o
    endereço, o médico e o cemitério confirmam-se.
- text: >-
    Identification and filiation. Rozalina's parents are recorded as "Deocleciano Muniz
    Bittencourt" — the exact name of P-0012 — and "dona Luiza Secunda[s] de Azevedo", a
    shortened or garbled form of the "Luiza Secundina de Azevedo" by which P-0013 appears at
    her son Aristides's 1922 baptism (PAR-0003). With her Minas Gerais birth and her surname
    Bittencourt, this makes her a daughter of F-0001. The identification is strong, not
    proven: the filiation comes from a non-relative declarant, and her own birth or baptism
    (Minas Gerais, 1928) is not held. The age gives a birth year of 1928 (or the first six
    days of January 1929), not the c. 1929 that the retrieval side derived.
  text_pt: >-
    Identificação e filiação. Os pais de Rozalina são registrados como "Deocleciano Muniz
    Bittencourt" — o nome exato de P-0012 — e "dona Luiza Secunda[s] de Azevedo", forma
    abreviada ou truncada de "Luiza Secundina de Azevedo", nome com que P-0013 aparece no
    batismo de 1922 de seu filho Aristides (PAR-0003). Com o nascimento em Minas Gerais e o
    sobrenome Bittencourt, isso a faz filha de F-0001. A identificação é forte, não provada:
    a filiação vem de um declarante não parente, e o nascimento ou batismo dela (Minas
    Gerais, 1928) não está guardado. A idade dá o ano de nascimento de 1928 (ou os seis
    primeiros dias de janeiro de 1929), e não o c. 1929 que a pesquisa de recuperação
    derivou.
- text: >-
    What the record adds for modelling. Rozalina can be added to F-0001's
    documented_children (b. 1928, Minas Gerais; d. 6 January 1983, Duque de Caxias), citing
    this record. It also gives her occupation ("do lar"), her husband's surname and middle
    name (Chrispim Alves), her last address (Rua Capim Melado nº 9, Duque de Caxias), that
    she left property, and that she had three adult children, unnamed. The margin note is a
    lead: it points to her civil marriage, recorded at Xerém (Duque de Caxias), book 2,
    folio 423, Nº 1023, with the date 10 August 1963. Whether that date is the marriage or
    its registration is not stated. That act would settle her husband's given name and
    should name her parents again.
  text_pt: >-
    O que o registro acrescenta à modelagem. Rozalina pode ser acrescentada a
    documented_children de F-0001 (n. 1928, Minas Gerais; f. 6 de janeiro de 1983, Duque de
    Caxias), citando este registro. Ele também dá sua ocupação ("do lar"), o sobrenome e o
    nome do meio do marido (Chrispim Alves), seu último endereço (Rua Capim Melado nº 9,
    Duque de Caxias), que ela deixou bens e que tinha três filhos maiores, não nomeados. A
    nota marginal é uma pista: aponta para o casamento civil dela, registrado em Xerém
    (Duque de Caxias), livro 2, folha 423, Nº 1023, com a data de 10 de agosto de 1963. Não
    se diz se essa data é a do casamento ou a do registro. Esse ato resolveria o prenome do
    marido e deve nomear de novo os pais dela.
- text: >-
    Privacy. The owner states that everyone named in these records is deceased (only
    P-0001–P-0003 are living, and they do not appear), so the termo is transcribed in full.
    The three children are not named. The record carries no identity-document numbers. The
    triage index lists this scan as privacy-excluded since 2026-07-30; that disposition
    predates the owner's statement and needs updating if this draft is promoted.
  text_pt: >-
    Privacidade. O proprietário afirma que todos os nomeados nestes registros são falecidos
    (apenas P-0001–P-0003 estão vivos, e não aparecem), de modo que o termo é transcrito na
