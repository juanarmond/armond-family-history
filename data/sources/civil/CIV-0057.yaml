reading_reliability: complete
abstract: >-
  Civil death termo N.º 3.705 of the 1st District registry of Duque de Caxias (Rio de
  Janeiro state), drawn on 7 January 1983 on the declaration of João Mauricio Pimentel,
  brasileiro, servente, resident in the town and born in Minas Gerais (not stated to be a
  relative). Rozalina Bittencourt Alves, female, aged 54 (so born between 7 January 1928
  and 6 January 1929), "natural de Minas Gerais", "do lar", married to [Leomar or Weimar]
  Chrispim Alves, died at 8.07 a.m. on 6 January 1983 at the Hospital Duque de Caxias, of
  acute gastroenteritis and cachexia, as attested by Dr. Gildo Gilberto Martins Neves. She
  is recorded as the child of Deocleciano Muniz Bittencourt (P-0012) and "dona Luiza
  Secunda[s] de Azevedo" (P-0013). She left property to be inventoried and three adult
  children ("Deixa 3 filhos maiores", unnamed), lived at Rua Capim Melado nº 9, and was to
  be buried in the Nossa Senhora de Fátima cemetery. A later margin note cites her
  marriage certificate: Xerém (Duque de Caxias), book 2, folio 423, Nº 1023, dated 10
  August 1963. She is a sister of Antenor Muniz (P-0006), a collateral child of F-0001.
abstract_pt: >-
  Termo de óbito civil N.º 3.705 do registro do 1.º Distrito de Duque de Caxias (Estado do
  Rio de Janeiro), lavrado em 7 de janeiro de 1983 sobre declaração de João Mauricio
  Pimentel, brasileiro, servente, residente na cidade e natural de Minas Gerais (não
  declarado parente). Rozalina Bittencourt Alves, do sexo feminino, com 54 anos (logo,
  nascida entre 7 de janeiro de 1928 e 6 de janeiro de 1929), "natural de Minas Gerais",
  "do lar", casada com [Leomar ou Weimar] Chrispim Alves, faleceu às 8h07 de 6 de janeiro de
  1983 no Hospital Duque de Caxias, de gastroenterite aguda e caquexia, conforme atestou o
  Dr. Gildo Gilberto Martins Neves. É registrada como filha de Deocleciano Muniz
  Bittencourt (P-0012) e de "dona Luiza Secunda[s] de Azevedo" (P-0013). Deixou bens a
  inventariar e três filhos maiores ("Deixa 3 filhos maiores", não nomeados), morava na Rua
  Capim Melado nº 9 e seria sepultada no Cemitério Nossa Senhora de Fátima. Uma nota
  marginal posterior cita sua certidão de casamento: Xerém (Duque de Caxias), livro 2,
  folha 423, Nº 1023, de 10 de agosto de 1963. É irmã de Antenor Muniz (P-0006), filha
  colateral de F-0001.
reliability:
  assessment: >-
    Original civil death register entry, drawn the day after the death. It is primary for
    the death, its date, time, place and cause. The parents, age, birthplace, marriage and
    children are the report of a declarant who is not stated to be a relative, given about
    54 years after her birth, so they are secondary information. The parents' names still
    agree with the family's own records: Deocleciano's name exactly, and Luiza's as a
    variant of the "Luiza Secundina de Azevedo" of PAR-0003.
  informant: >-
    João Mauricio Pimentel, brasileiro, servente, resident in Duque de Caxias, natural of
    Minas Gerais; relationship to the deceased not stated. He signed the termo.
  limitations: >-
    The husband's given name is uncertain (Leomar or Weimar), and the mother's second name
    is written in a shortened or garbled form ("Secunda[s]"). The three children are not
    named. The colour field is a dash. The clerk's and the escrivão's names are partly
    illegible. The margin note on the marriage is a later reference, not the marriage act
    itself. A "SEM VALOR LEGAL" watermark covers the image, which is a research copy.
