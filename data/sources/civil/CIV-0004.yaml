transcription: >-
  [Certidão manuscrita em formulário impresso; documento dobrado, com fita
  adesiva e manchas, margens rasgadas; leitura da cursiva difícil em vários
  campos.] República dos Estados Unidos do Brasil. REGISTRO CIVIL. Vila de
  Alvorada, Estado de Minas Geraes. CASAMENTO N.º [em branco]. [carimbos do
  cartório: "Antônio d'Oliveira Valente, Escrivão do Registro Civil, Vila de
