  interina]. CERTIFICA que a fls. 66-v. [uncertain: 167] do livro n.º 5 do
  registro de casamentos consta o assento do matrimônio de Antenor Muniz e Iris
  Bohrer, contraído perante o Juiz de Paz [uncertain: Francisco Guizotti Gobbi]
  e as testemunhas [uncertain: Yaci Lopes de Faria] e João Machado Simas,
  realizado aos 7 de Dezembro de 1949. Ele, nascido em este distrito de
  Alvorada aos 2 de Novembro de 1923, com [em branco] anos de idade, profissão
  da lavoura, domiciliado e residente esta comarca, filho legítimo de
  Deocleciano Muniz, profissão [em branco], em [em branco], domiciliado e
  residente [em branco], e de Dona Luiza Fernandes de Azevedo, em [em branco],
  domiciliada e residente [em branco]. Ela, nascida em Presidente Soares, E. de
  Minas, aos 27 de Fevereiro de 1929, com [em branco] anos de idade, profissão
  [uncertain: agricultora], domiciliada e residente em este distrito, filha
  [legítima riscado] de João Gonçalves Bohrer, profissão [em branco], em [em
  branco], domiciliado e residente [em branco], e de Dona Selina Bohrer, em [em
  branco], domiciliada e residente [em branco], a qual passa a assinar-se Iris
