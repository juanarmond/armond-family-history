abstract: >-
  A civil marriage certificate (livro 5, fls 66-v) records the marriage of
  Antenor Muniz and Iris Bohrer at Alvorada on 7 December 1949. It reports
  Antenor as born in the district of Alvorada on 2 November 1923, a farm
  worker, son of Deocleciano Muniz and Luiza Fernandes de Azevedo; and Iris as
  born in Presidente Soares, Minas Gerais, on 27 February 1929, daughter of
  João Gonçalves Bohrer and Selina Bohrer. Iris would thereafter sign Iris
  Bohrer Muniz. The certificate was issued at Alvorada on 11 August 1955.
abstract_pt: >-
  Uma certidão de casamento civil (livro 5, fls 66-v) registra o casamento de
  Antenor Muniz e Iris Bohrer em Alvorada em 7 de dezembro de 1949. Registra
  Antenor como nascido no distrito de Alvorada em 2 de novembro de 1923,
  trabalhador da lavoura, filho de Deocleciano Muniz e Luiza Fernandes de
  Azevedo; e Iris como nascida em Presidente Soares, Minas Gerais, em 27 de
  fevereiro de 1929, filha de João Gonçalves Bohrer e Selina Bohrer. Iris
  passaria a assinar Iris Bohrer Muniz. A certidão foi emitida em Alvorada em
  11 de agosto de 1955.
reliability:
  assessment: >-
    Direct derivative evidence for the marriage, spouse names and married-name
    form. The reported parents are secondary information but are directly
    stated in the certificate.
  informant: The spouses' declarations as entered in the marriage register.
  limitations: >-
    The photographed certificate is folded, taped and stained, and a few fields
    (the witnesses' given names and the exact term number) are only partly
    legible. Most vital details, including both spouses' reported birth dates
    and places and the register book and folha, are legible. The reported birth
    facts are secondary information stated in a marriage record, not birth
    records. The repository retains the originally uploaded JPEG at its
    authorised download resolution.
