transcription: >-
  [Óbito nº 19.798.] "Aos três de agôsto de mil novecentos e setenta ... faleceu
  no Hospital da C.S.N., nesta cidade, João Gonçalves Bohrer, do sexo masculino,
  côr branca, com setenta e seis anos de idade, natural dêste Estado, estado
  civil casado com Celina Bohrer, profissão comerciante, filho de Valentim
  Martinho Bohrer, falecido ... e de Carolina Bohrer, doméstica, natural dêste
  Estado ... Causa mortis: infarto do miocárdio ... deixou quinze filhos." The
  declarant's identity and the residential addresses are omitted here for privacy
  (see the private image).
abstract: >-
  The original Volta Redonda civil death register records the death of João
  Gonçalves Bohrer (P-0014) on 3 August 1970, aged 76 (so born c.1894), married
  to Celina Bohrer, and names his parents as Valentim Martinho Bohrer (deceased)
  and Carolina Bohrer — extending the Bohrer line one generation.
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly states his parents as secondary (informant-reported) information.
  informant: >-
    A son-in-law of the deceased (name withheld here for privacy).
  limitations: >-
    The register page also carries an unrelated adjacent death entry. The parent
    names are informant-reported at death, not a filiation record.
