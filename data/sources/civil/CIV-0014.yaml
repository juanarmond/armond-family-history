transcription: >-
  ÓBITO. NÚMERO 19798. Talão 98. Pág. 198. [Formulário impresso preenchido à
  mão; imagem com marca "SEM VALOR LEGAL". Somente este assento é transcrito; o
  assento adjacente refere-se a terceiro e é omitido. Os dados do declarante,
  terceiro que comparece na qualidade de genro, são transcritos na íntegra.]
  Aos três de agôsto de mil novecentos e sessenta, digo, e setenta, nesta Cidade
  e em meu Cartório, compareceu Raimundo Ossilon Oliveira Lopes,
  nacionalidade brasileira, com 40 anos de idade, profissão industriário, residente
  à rua Coimbra, 179, nesta cidade, e exibindo atestado de ÓBITO firmado
  pelo médico Pedro Carlos Teixeira da Silva, declarou: Que no dia hoje (03/08/1970) às 02 horas
  30 minutos, no Hospital da C.S.N., nesta cidade, faleceu João Gonçalves
  Bohrer, do sexo masculino, côr branca, com setenta e seis anos de idade,
  natural dêste Estado, estado civil casado com Celina Bohrer em Carangola, Minas Gerais, profissão comerciante,
  residente à rua [uncertain: Dr.] Paulo Mendes, 205 nesta cidade, filho de Valentim Martinho Bohrer,
  falecido, natural [em branco], residente [em branco], e de Carolina Bohrer,
  doméstica, natural dêste Estado, residente nesta cidade. Causa mortis: Infarto
  do miocárdio. Vai ser sepultado no Cemitério desta cidade. Observações: O
  falecido não deixou testamento, deixou bens a inventariar e deixou quinze
  filhos. O declarante compareceu na qualidade de genro do falecido. Para
  constar lavrei êste têrmo que, lido e achado conforme, assino. Eu,
  [assinatura] Escrevente juramentado, o escrevi. Eu, [assinatura] Oficial do
  Registro Civil, subscrevo e assino. [assinatura do declarante] Raimundo
  Ossilon Oliveira Lopes.
abstract: >-
  The original Volta Redonda civil death register records the death of João
  Gonçalves Bohrer (P-0014) on 3 August 1970, aged 76 (so born c.1894), married
  to Celina Bohrer, and names his parents as Valentim Martinho Bohrer (deceased)
  and Carolina Bohrer — extending the Bohrer line one generation.
abstract_pt: >-
  O registro civil de óbito original de Volta Redonda registra o óbito de João
  Gonçalves Bohrer (P-0014) em 3 de agosto de 1970, aos 76 anos (portanto
  nascido por volta de 1894), casado com Celina Bohrer, e nomeia seus pais como
  Valentim Martinho Bohrer (falecido) e Carolina Bohrer — estendendo a linha
  Bohrer em uma geração.
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly states his parents as secondary (informant-reported) information.
  informant: >-
    Raimundo Ossilon Oliveira Lopes, a son-in-law of the deceased.
  limitations: >-
    The register page also carries an unrelated adjacent death entry. The parent
    names are informant-reported at death, not a filiation record.
