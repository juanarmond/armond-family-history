transcription: >-
  [Registro Civil, Volta Redonda — right-hand entry Nº 39.854 (handwritten).] "Aos quatro
  de maio de mil novecentos e noventa e dois, em meu Cartório, compareceu [o declarante —
  nacionalidade brasileira, 44 anos, industriário; relação não declarada; dados de
  identificação e endereço omitidos], e exibindo atestado de óbito firmado pelo médico
  Luiz Carlos [Abdallack] Sarkis [uncertain], declarou: que no dia de hoje às 10 horas, em
  domicílio ([rua], Volta Redonda), faleceu João José de Carvalho Guimarães, do sexo
  masculino, com setenta e nove anos de idade, natural de Minas Gerais, estado civil viúvo,
  profissão aposentado, residente em Monte Castelo, nesta cidade, filho de Francisco José
  de Carvalho Guimarães e de Emerenciana Maria de Jesus. Causa mortis: edema agudo do
  pulmão; congestão. Vai ser sepultado no cemitério municipal desta cidade. Observações: o
  falecido não deixou testamento, deixou bens a inventariar, deixou quatorze [uncertain]
  filhos." [Documentos de identificação do falecido constam do registro; omitidos desta
  transcrição pública.]
abstract: >-
  Civil death of João José de Carvalho Guimarães on 4 May 1992 at Volta Redonda, RJ, aged
  79 (b. ~1913; matches the 16 December 1912 birth registered in CIV-0007), a widower,
  retired. Names his parents as Francisco José de Carvalho Guimarães (P-0021) and
  Emmerenciana Maria de Jesus (P-0022) — i.e. Maria Aurora Guimarães's (P-0011) parents —
  confirming that he is Cidalia Engracio Guimarães's (P-0005) maternal uncle. Upgrades his
  existing documented_child entry on F-0008 with a death record. He left an estate and,
  per the record, "quatorze" (14, uncertain) adult children (not modelled — direct-line
  scope; possibly living).
abstract_pt: >-
  Óbito civil de João José de Carvalho Guimarães em 4 de maio de 1992, em Volta Redonda,
  RJ, aos 79 anos (n. ~1913; coincide com o nascimento em 16 de dezembro de 1912
  registrado em CIV-0007), viúvo, aposentado. Nomeia seus pais Francisco José de Carvalho
  Guimarães (P-0021) e Emmerenciana Maria de Jesus (P-0022) — isto é, os pais de Maria
  Aurora Guimarães (P-0011) — confirmando que ele é tio materno de Cidalia Engracio
  Guimarães (P-0005). Eleva sua entrada existente de documented_child em F-0008 com um
  registro de óbito. Deixou bens a inventariar e, segundo o registro, "quatorze" (14,
  incerto) filhos maiores (não modelados — escopo de linha direta; possivelmente vivos).
reliability:
  assessment: >-
    Primary civil death register entry. Direct primary for the death; the filiation is
    informant-reported and corroborates the parents already modelled for F-0008 (and the
    b.1912 identification from CIV-0007).
  informant: >-
    The declarant (relationship not stated; a living person — identifiers withheld).
  limitations: >-
    Handwritten; the number of children ("quatorze"), the doctor's surname and the
    deceased's document numbers are uncertain or withheld. His children (Cidalia's first
    cousins) are not modelled, per the direct-line scope.
