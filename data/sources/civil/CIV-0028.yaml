transcription: >-
  [Certidão de Óbito, Registro Civil das Pessoas Naturais — República Federativa do
  Brasil.] Nome: ANTENOR MUNIZ. Sexo: masculino. Cor: branca. Estado civil e idade:
  casado — 90 ano(s). Naturalidade: Alvorada de Minas - MG. Eleitor: Não. Filiação:
  "DEOCLECIANO MUNIZ e LUIZA FERNANDES DE AZEVEDO." Data e hora do falecimento: "aos
  dezessete (17) dias do mês de outubro (10) do ano de dois mil e quatorze (2014) - à(s)
  18:45 hora(s)" (17/10/2014). Local de falecimento: "Hospital São João Batista - Volta
  Redonda - RJ." Causa da morte: "insuficiência respiratória aguda - edema agudo de
  pulmão - hipertensão arterial sistêmica." Local do sepultamento: "Cemitério Volta
  Redonda-RJ." Declarante: [genro do falecido — familiar vivo; nome e documentos
  omitidos]. Médico: Márcia Laureano Candido, CRM nº 5287760-3. Observações/averbações:
  "LIVRO C-172, FOLHA 84, TERMO 68042. Data do Registro: [18/10/2014]. O(A) falecido era
  casado com IRIS BOHRER MUNIZ, profissão bombeiro hidráulico, residente no(a) [rua] -
  Monte Castelo, Volta Redonda, RJ. O(A) declarante apresentou certidão de Casamento do
  obituado(a), registro no cartório Alvorada - MG, no livro 05, folhas 066, deixou bens a
  inventariar, não deixou testamento conhecido, deixou 5 filhos(as) maiores [...]. O
  declarante compareceu na qualidade de genro do falecido." [CPF e documentos de
  identificação do falecido, e os dados do declarante, constam do documento digitalizado;
  omitidos desta transcrição pública.]
abstract: >-
  Civil death certificate of Antenor Muniz (P-0006), the owner's maternal grandfather:
  died 17 October 2014, 18:45, at the Hospital São João Batista, Volta Redonda, RJ, aged
  90, married (to Iris Bohrer Muniz, P-0007). Profession recorded as "bombeiro hidráulico"
  (plumber), resident in Monte Castelo, Volta Redonda — evidence that he urbanized to the
  Rio de Janeiro industrial region, NOT that he remained a rural lavrador (his 1949
  marriage, CIV-0004, had recorded "da lavoura"). Names his parents as Deocleciano Muniz
  Bittencourt (P-0012) and Luiza Fernandes de Azevedo (P-0013). His 1949 Alvorada-MG
  marriage (livro 05, fls 066) is referenced. He left an estate to inventory ("bens a
  inventariar") and 5 adult children (not named, for privacy). The stated naturalidade
  "Alvorada de Minas-MG" conflicts with the district of Alvorada (Carangola) reported at
  his marriage.
abstract_pt: >-
  Certidão de óbito de Antenor Muniz (P-0006), avô materno do proprietário: faleceu em 17
  de outubro de 2014, às 18:45, no Hospital São João Batista, Volta Redonda, RJ, aos 90
  anos, casado (com Iris Bohrer Muniz, P-0007). Profissão registrada como "bombeiro
  hidráulico", residente em Monte Castelo, Volta Redonda — indício de que se urbanizou
  rumo à região industrial do Rio de Janeiro, e NÃO de que permaneceu lavrador rural (seu
  casamento de 1949, CIV-0004, registrava "da lavoura"). Nomeia seus pais Deocleciano
  Muniz Bittencourt (P-0012) e Luiza Fernandes de Azevedo (P-0013). Referencia seu
  casamento de 1949 em Alvorada-MG (livro 05, fls 066). Deixou bens a inventariar e 5
  filhos maiores (não nomeados, por privacidade). A naturalidade declarada "Alvorada de
  Minas-MG" conflita com o distrito de Alvorada (Carangola) informado em seu casamento.
reliability:
  assessment: >-
    Primary civil death register entry, registered the day after death — direct primary
    for the death date, place, civil status and profession. The filiation is
    informant-reported but corroborates the parents already established by CIV-0004 and
    the marriage record CIV-0030.
  informant: >-
    The deceased's son-in-law (a living family member; name and identifiers withheld for
    privacy).
  limitations: >-
    "bombeiro hidráulico" is his profession as reported at death (2014); his 1949
    marriage recorded "da lavoura" — the two record different life stages, not a conflict.
    The stated naturalidade "Alvorada de Minas-MG" is likely a registrar expansion of the
    Alvorada (Carangola) district and should not override the marriage record. Identity
    numbers and the living declarant's data are withheld from the transcription.
