notes:
- text: >-
    Identification of the mother. "Marfiza Ferreira Almond" is taken to be Marfiza Ferreira
    Armond, the documented child of Simplício and Eliza on F-0006 (her 1962 Itaperuna civil
    death, CIV-0013, gives her as a widow aged 89). The identification rests on the rare
    given name Marfiza, the name "Ferreira A[l/r]mond", her residence in Itaperuna ("aqui
    residente"), where she died twelve years later, and an age gap that fits (she was
    baptised in 1873 and the son was born c. 1900). Her 1962 death was declared by a man
    surnamed Barrozo (CIV-0013), which is consistent with a Barroso household. It is
    strong, not proven. "Almond" is checked letter by letter: the second letter rises above
    the line like the scribe's l, not his r.
  text_pt: >-
    Identificação da mãe. "Marfiza Ferreira Almond" é tomada como Marfiza Ferreira Armond, a
    filha documentada de Simplício e Eliza em F-0006 (seu óbito civil de 1962 em Itaperuna,
    CIV-0013, dá-a como viúva, com 89 anos). A identificação apoia-se no prenome raro
    Marfiza, no nome "Ferreira A[l/r]mond", na residência em Itaperuna ("aqui residente"),
    onde ela morreu doze anos depois, e numa diferença de idade compatível (ela foi
    batizada em 1873 e o filho nasceu c. 1900). Seu óbito de 1962 foi declarado por um homem
    de sobrenome Barrozo (CIV-0013), o que é coerente com uma família Barroso. É forte, não
    provada. "Almond" foi conferido letra a letra: a segunda letra sobe acima da linha como
    o l do escrevente, não como o seu r.
- text: >-
    What the record adds for modelling. It names Marfiza's husband, Antonio Antunes
    Barroso, dead by 20 October 1950, and shows Marfiza alive, a doméstica, in Itaperuna in
    October 1950. It documents her son Silverio Antunes Barroso (born c. 1899–1900 in Minas;
    died 19 October 1950), lavrador, his marriage to Jovelina Muniz da Paixão and their nine
    children (born c. 1925–1946). Silverio is a grandchild of Simplício and Eliza, not their
    child, so he does not belong in F-0006's documented_children; the record supports the
    existing Marfiza entry there (her husband, and that she was living in 1950) and can be
    cited on it. The declarant's given name, Simplicio, is the same as Marfiza's father's,
    but no relationship is stated. "Muniz" in the widow's name is not by itself evidence of
    any link to the Muniz Bittencourt line, and none is asserted.
  text_pt: >-
    O que o registro acrescenta à modelagem. Nomeia o marido de Marfiza, Antonio Antunes
    Barroso, falecido antes de 20 de outubro de 1950, e mostra Marfiza viva, doméstica, em
    Itaperuna em outubro de 1950. Documenta seu filho Silverio Antunes Barroso (nascido c.
    1899–1900 em Minas; falecido em 19 de outubro de 1950), lavrador, seu casamento com
    Jovelina Muniz da Paixão e os nove filhos do casal (nascidos c. 1925–1946). Silverio é
    neto de Simplício e Eliza, não filho, de modo que não cabe em documented_children de
    F-0006; o registro apoia a entrada já existente de Marfiza ali (o marido, e que ela
    vivia em 1950) e pode ser citado nela. O prenome do declarante, Simplicio, é o mesmo do
    pai de Marfiza, mas nenhum parentesco é declarado. O "Muniz" no nome da viúva não é, por
    si só, evidência de ligação com a linha Muniz Bittencourt, e nenhuma é afirmada.
- text: >-
    Checked against the retrieval side's verbatim draft (2026-10-12): the draft is
    accurate. Refinements: the printed closing formula reads "vai assinedo" as printed; the
    official's name is legible only as "Bene…" plus "de Souza", with the stamp reading
    BENEDITO … SOUZA; the declarant's signature ends in a shaky "Barozo"; and the capital of
    "Maria Irene", in the body and in the margin note, has a lead-in loop that could be read
    as "Eirene". The age, the parents' names, the children's names and ages, and "Paraizo
    Tobias" are confirmed on the image.
  text_pt: >-
    Conferido com o rascunho literal da pesquisa de recuperação (2026-10-12): o rascunho é
    exato. Refinamentos: a fórmula impressa de fecho lê-se "vai assinedo", tal como impressa;
    o nome do oficial só se lê como "Bene…" mais "de Souza", e o carimbo diz BENEDITO …
    SOUZA; a assinatura do declarante termina num "Barozo" trêmulo; e a maiúscula de "Maria
    Irene", no corpo e na nota marginal, tem um laço inicial que poderia ser lido "Eirene".
    A idade, os nomes dos pais, os nomes e idades dos filhos e "Paraizo Tobias" confirmam-se
    na imagem.
- text: >-
    Privacy. The owner states that everyone named in this 1950 termo is deceased (only
    P-0001–P-0003 are living, and they do not appear), so the termo, including the widow and
    the nine children, is transcribed in full. The record carries no identity-document
    numbers.
  text_pt: >-
    Privacidade. O proprietário afirma que todos os nomeados neste termo de 1950 são
    falecidos (apenas P-0001–P-0003 estão vivos, e não aparecem), de modo que o termo,
    incluindo a viúva e os nove filhos, é transcrito na íntegra. O registro não contém
    números de documentos de identidade.
