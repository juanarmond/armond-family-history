abstract: >-
  Civil death termo Nº 13.297 of the Itaperuna (Rio de Janeiro state) registry, drawn on 20
  October 1950 on the declaration of Simplicio Antunes Barroso, lavrador, resident at the
  lugar Córrego do Ouro in the same district (his relationship to the deceased is not
  stated). Silverio Antunes Barroso, married, lavrador, white, aged 50 (so born between
  late October 1899 and October 1900), "natural de Minas", resident in the district, died at
  home at Córrego do Ouro at 6 p.m. on 19 October 1950 of pulmonary tuberculosis, as attested
  by Dr. Walter Anderson. He was the son of "Antonio Antunes Barroso, falecido e Marfiza
  Ferreira Almond, domestica, brasileiros, aqui residente" — that is, his father was dead
  and his mother was alive and living in Itaperuna. He was married to Jovelina Muniz da
  Paixão, "em Paraizo Tobias - E. do Rio", and left nine children — João, Maria Irene, Zelia,
  José, Geraldo, Antonio, Silverio, Jorge and Maria, aged 25, 24, 21, 19, 17, 15, 13, 11 and
  4 — and property ("Deixa bens. (feito o inventario)"). He was to be buried in the town
  cemetery. The mother is Marfiza Ferreira Armond, the sister of Aristão Ferreira Armond
  (P-0008), recorded as a documented child of Simplício and Eliza (F-0006). The record
  names her husband for the first time and shows her alive in Itaperuna in 1950. It names
  no grandparents.
abstract_pt: >-
  Termo de óbito civil Nº 13.297 do registro de Itaperuna (Estado do Rio de Janeiro),
  lavrado em 20 de outubro de 1950 sobre declaração de Simplicio Antunes Barroso, lavrador,
  residente no lugar Córrego do Ouro, no mesmo distrito (seu parentesco com o falecido não é
  declarado). Silverio Antunes Barroso, casado, lavrador, de cor branca, com 50 anos (logo,
  nascido entre o fim de outubro de 1899 e outubro de 1900), "natural de Minas", residente
  no distrito, faleceu em domicílio, no Córrego do Ouro, às 18 horas de 19 de outubro de
  1950, de tuberculose pulmonar, conforme atestado do Dr. Walter Anderson. Era filho de
  "Antonio Antunes Barroso, falecido e Marfiza Ferreira Almond, domestica, brasileiros, aqui
  residente" — ou seja, o pai já era falecido e a mãe estava viva e morava em Itaperuna. Era
  casado com Jovelina Muniz da Paixão, "em Paraizo Tobias - E. do Rio", e deixou nove filhos
  — João, Maria Irene, Zelia, José, Geraldo, Antonio, Silverio, Jorge e Maria, com 25, 24,
  21, 19, 17, 15, 13, 11 e 4 anos — e bens ("Deixa bens. (feito o inventario)"). Seria
  sepultado no cemitério da cidade. A mãe é Marfiza Ferreira Armond, irmã de Aristão
  Ferreira Armond (P-0008), registrada como filha documentada de Simplício e Eliza
  (F-0006). O registro nomeia pela primeira vez o marido dela e mostra-a viva em Itaperuna
  em 1950. Não nomeia avós.
reliability:
  assessment: >-
    Original civil death register entry, written the day after the death. It is primary
    for the death, its date, place and cause, and for the declarant's own details. The
    parents, the deceased's age, birthplace and marriage, and the children's names and ages
    are the declarant's report, so they are secondary information, though from a man who
    lived in the same lugar and shared the surname.
  informant: >-
    Simplicio Antunes Barroso, lavrador, of the lugar Córrego do Ouro, Itaperuna district;
    relationship to the deceased not stated. He signed with a shaky hand.
  limitations: >-
    The registry official's name and signature are only partly legible. The deceased's
    birthplace is only "Minas" (Minas Gerais). The record does not say where or when
    Silverio married; "em Paraizo Tobias" may be the place of the marriage or Jovelina's
    residence. It names no grandparents, so it gives no direct evidence for Marfiza's own
    parentage. The mother's surname is written "Almond", a variant of Armond. A "SEM VALOR
    LEGAL" watermark covers the image, which is a research copy.
