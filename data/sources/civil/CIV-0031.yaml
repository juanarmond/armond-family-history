transcription: >-
  [Registro Civil, Volta Redonda — right-hand entry Nº 21.690, folha 108.] "Aos vinte e
  dois de outubro de mil novecentos e setenta e dois, em meu Cartório, compareceu Amauri
  Martins, nacionalidade brasileira, com 23 anos de idade, profissão motorista, residente
  à Av. Amaral Pe-ceto [uncertain], 456 nesta cidade, e exibindo atestado de óbito firmado pelo médico
  José Joaquim de Figueiredo Filho, declarou: Que no dia de ontem (21/10/1972) às 19 horas
  e 45 minutos, em trânsito para o Pronto Socorro, faleceu nesta cidade Ercy Bohrer, do
  sexo masculino, côr branca, com quarenta anos de idade, natural do Estado de Minas Gerais,
  estado civil casado com Lailia [uncertain] Novaes Bohrer em Carangola, Estado de Minas
  Gerais, profissão ajudante, residente à rua Hortensias [uncertain], 9 nesta cidade,
  filho de João Gonçalves Bohrer, falecido, e de Celina [uncertain:
  Celina/Belina] Bohrer, doméstica. Causa mortis: politraumatizado. Vai ser sepultado no
  cemitério desta cidade. Observações: o falecido não deixou bens nem testamento, deixou
  cinco filhos, era eleitor e reservista; teve morte violenta por acidente; atestado
  visado por autoridade policial; o declarante compareceu no impedimento ocasional de
  membros da família do falecido." [Averbação, 23/11/1972:] "Face ao despacho judicial no
  processo de retificação de nomes nº 575, procede-se à retificação do nome do falecido
  para HERCY BOHRER e do nome de sua mulher para Lília [uncertain] de Novaes Bohrer. Volta Redonda,
  23-11-1972." [Corrected 2026-10-08 from the image: the age reads "com quarenta anos", not
  "trinta".]
abstract: >-
  Civil death of Ercy Bohrer — judicially corrected to HERCY BOHRER — on 21 October 1972
  at Volta Redonda, RJ, aged 40 (b. ~1932) [Corrected 2026-10-08 from the image: "com quarenta anos", not
  30], married to Lailia [uncertain] Novaes Bohrer (judicially corrected to Lília
  [uncertain] de Novaes Bohrer); a violent
  accidental death (politraumatismo). Names his parents as João Gonçalves Bohrer (already
  deceased) and Celina Bohrer — i.e. P-0014 and P-0015 — making Ercy a further child of
  that couple and Iris Bohrer Muniz's (P-0007) brother. A third independent primary for
  Iris's parents. He left five children (not named in the record). Recorded as a
  documented_child on F-0005.
abstract_pt: >-
  Óbito civil de Ercy Bohrer — retificado judicialmente para HERCY BOHRER — em 21 de
  outubro de 1972, em Volta Redonda, RJ, aos 40 anos (n. ~1932) [Corrigido em 2026-10-08 a partir da imagem: "com quarenta anos", não 30], casado com Lailia [uncertain] Novaes Bohrer (retificado judicialmente para Lília [uncertain] de Novaes Bohrer); morte violenta acidental (politraumatismo). Nomeia seus pais João
  Gonçalves Bohrer (já falecido) e Celina Bohrer — isto é, P-0014 e P-0015 — tornando Ercy
  mais um filho do casal e irmão de Iris Bohrer Muniz (P-0007). Terceiro primário
  independente para os pais de Iris. Deixou cinco filhos (não nomeados no registro).
  Registrado como documented_child em F-0005.
reliability:
  assessment: >-
    Primary civil death register entry with a later judicial name-correction. Direct
    primary for the death; the filiation is informant-reported (by a non-relative), so it
    corroborates the parents' names already established for F-0005.
  informant: >-
    Amauri Martins, aged 23, motorista, of Av. Amaral Pe-ceto [uncertain], 456, Volta
    Redonda — a non-relative declarant (appeared for the family's occasional
    impediment).
  limitations: >-
    The mother's given name reads Celina/[Belina] — uncertain. The five children are not named in
    the entry; the wife's given name differs between the entry (Lailia [uncertain]) and
    the averbação (Lília [uncertain]). Judicial correction of the surname from
    "Ercy" to "Hercy" preserved. The stated age is "quarenta" (40), informant-reported by a
    non-relative, so the derived birth year c.1932 is approximate.
