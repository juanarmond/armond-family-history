transcription: >-
  [Óbito nº 23.828, Segunda Circunscrição do Registro Civil de Volta Redonda, Livro
  51-C, Folha 233. Cópia informativa ("SEM VALOR LEGAL"). Transcrição integral do
  assento; o falecido está morto, portanto seus dados são exibidos por completo.
  Apenas o RG e o endereço do declarante — Jorge de Paulo Campos, genro do falecido,
  pessoa viva — foram omitidos, por serem identificadores de um terceiro vivo.]
  "Aos 12 de janeiro de 2001, nesta cidade de Volta Redonda e em cartório,
  compareceu Jorge de Paulo Campos, aposentado, [documento de identidade e endereço
  do declarante omitidos — terceiro vivo], e, exibindo o atestado de óbito firmado
  pela médica Evelin Wardini Rayes, prestou as seguintes declarações: Nome do
  obituado: JOÃO BOHRER. Data e hora do falecimento: 12 de janeiro de 2001, às 09:15
  horas. Estado civil: casado com Alice Batista Bohrer. Sexo: masculino. Idade: 61
  anos. Lugar de falecimento: Hospital Evangélico Regional, nesta cidade. Residência:
  Rua Diolindo Miguel, 156, Mariana Torres, nesta cidade. Profissão: aposentado.
  Naturalidade: Carangola-MG. Nome dos pais do obituado: JOÃO GONÇALVES BOHRER e
  CELINA BOHRER. Lugar do sepultamento: Cemitério Municipal de Volta Redonda-RJ.
  Deixou quatro filhos maiores, não deixou bens, era eleitor e faleceu sem testamento
  conhecido. Causa mortis: parada cárdio-respiratória, insuficiência respiratória
  aguda, choque hipovolêmico, hemorragia digestiva alta. Observações: documentos
  apresentados do falecido: xerox da certidão de casamento deste cartório, L.° 8,
  Fls. 220, T. 1682; RG 12.158.374-4 IFP emitida em 18/02/1997; CIC 118.771.117-91; e
  cartão de benefício do Banco Bamerindus n.° 42/104539621-1. O declarante é genro do
  falecido."
abstract: >-
  Informational copy of the civil death registration of João Bohrer, who died 12
  January 2001 at the Hospital Evangélico Regional, Volta Redonda (RJ), aged 61
  (born c.1940), a retired man natural of Carangola (MG), married to Alice Batista
  Bohrer. His parents are named as João Gonçalves Bohrer (P-0014) and Celina Bohrer
  (P-0015), making him a brother of Iris Bohrer (P-0007) — one of the fifteen
  children of that couple. Recorded as a documented (collateral) sibling on F-0005.
  The deceased's own record is transcribed in full; only the RG and address of the
  living declarant (his son-in-law) are withheld, as those identify a living third
  party.
abstract_pt: >-
  Cópia informativa do assento de óbito civil de João Bohrer, falecido em 12 de
  janeiro de 2001 no Hospital Evangélico Regional, Volta Redonda (RJ), aos 61 anos
  (nascido por volta de 1940), aposentado, natural de Carangola (MG), casado com
  Alice Batista Bohrer. Seus pais são nomeados como João Gonçalves Bohrer (P-0014) e
  Celina Bohrer (P-0015), tornando-o irmão de Iris Bohrer (P-0007) — um dos quinze
  filhos daquele casal. Registrado como irmão (colateral) documentado em F-0005. O
  registro do falecido é transcrito integralmente; apenas o RG e o endereço do
  declarante vivo (seu genro) são omitidos, por identificarem um terceiro vivo.
reliability:
  assessment: >-
    Contemporary civil death entry: the death facts (date, place, age, cause) are
    primary; the parentage is reported by the declarant (the deceased's son-in-law),
    hence mixed information quality. Directly confirms João Bohrer as a son of João
    Gonçalves Bohrer × Celina Bohrer and therefore a brother of Iris (P-0007).
  informant: >-
    The deceased's son-in-law (declarant), Volta Redonda, 12 January 2001; medical
    attestation by Dr. Evelin Wardini Rayes.
  limitations: >-
    An informational copy marked "SEM VALOR LEGAL", not a certified certidão. The four
    surviving adult children are referenced but not named in the entry.
