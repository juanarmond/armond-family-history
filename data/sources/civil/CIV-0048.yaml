transcription: >-
  [Registro Civil de Bom Jardim (Barra Alegre), livro de casamentos, p.112, termo
  nº 164, 1913. Imagem com marca d'água "SEM VALOR LEGAL".] "Aos dois dias do mez
  de Maio do anno do Nascimento de Nosso Senhor Jesus Christo de mil novecentos e
  treze neste Districto de Barra Alegre, Município de Bom Jardim, Estado do Rio de
  Janeiro, no lugar denominado Maravilhas, em casa de Seu Philomeno Victorino
  Bocher … o Juiz de Paz em exercício João Eugenio Erthal … e as testemunhas José
  Vito Eboli, com trinta e tres annos de idade, casado, lavrador … e Manuel
  Rosseira de Oliveira, com vinte e tres annos de idade, empregado no commercio,
  solteiro … celebraram-se um matrimonio sob o regimen de communhão de bens … os
  contrahentes José Maria Bocher e Dona Maria Rosaria Pacheco; elle filho legítimo
  de Vicente Bocher e Maria [Regina — uncertain] Haggendorn, com vinte e sete
  annos de idade, natural deste Estado, lavrador, ella, filha legítima de
  Philomeno Victorino Bocher e Maria Justina de Azevedo, com dezoito annos de
  idade, de occupação doméstica … ambos solteiros e residentes neste districto …
  Declararam neste acto não serem parentes e não haver impedimento …" Assignatura
  a rogo da nubente por Osvaldo Gardim (21, solteiro, negociante). No bloco de
  assinaturas figura, entre os presentes, "Valentim Martinho Borer" (grafado
  "Borer"). Escrivão interino Francisco Reis.
abstract: >-
  Civil marriage of José Maria Bocher, aged 27 (born ~1886), a farmer "natural
  deste Estado" (Rio de Janeiro), to Maria Rosaria Pacheco (18) on 2 May 1913 at
  Maravilhas, Barra Alegre (Bom Jardim, RJ). It names his parents Vicente Bocher
  and Maria [Regina?] Haggendorn — i.e. Vicente Borer (P-0070) × Maria Thecla
  Regina Eggendorn (P-0071), family F-0034 — hence José Maria is a younger brother
  of Valentim Martinho Bohrer (P-0028), who himself appears among the signatories
  ("Valentim Martinho Borer"), corroborating the sibling group. Recorded as a
  documented child on family F-0034. The surname is written "Bocher" in the body
  (a scribal variant of Bohrer/Borer); the mother's given/middle name after
  "Maria" is uncertain. PROVEN. Not modelled as a person entity; no event created.
abstract_pt: >-
  Casamento civil de José Maria Bocher, de 27 anos (nascido ~1886), lavrador
  "natural deste Estado" (Rio de Janeiro), com Maria Rosaria Pacheco (18) em 2 de
  maio de 1913 em Maravilhas, Barra Alegre (Bom Jardim, RJ). Nomeia seus pais
  Vicente Bocher e Maria [Regina?] Haggendorn — ou seja, Vicente Borer (P-0070) ×
  Maria Thecla Regina Eggendorn (P-0071), família F-0034 — portanto José Maria é
  irmão mais novo de Valentim Martinho Bohrer (P-0028), que consta entre os
  signatários ("Valentim Martinho Borer"), corroborando o grupo de irmãos.
  Registrado como filho documentado na família F-0034. O sobrenome está grafado
  "Bocher" no corpo do ato (variante de Bohrer/Borer); o nome do meio da mãe após
  "Maria" é incerto. PROVADO. Não modelado como entidade pessoa; sem evento criado.
reliability:
  assessment: >-
    Primary civil marriage entry — direct primary for the marriage and for the
    groom's filiation to Vicente Bocher (Borer) and Maria (Regina) Haggendorn
    (Eggendorn). Valentim Martinho Borer's own signature independently corroborates
    the sibling connection to family F-0034.
  informant: >-
    The Juiz de Paz João Eugenio Erthal and the escrivão interino Francisco Reis,
    Barra Alegre, 2 May 1913.
  limitations: >-
    The image is an uncertified reference copy ("SEM VALOR LEGAL" watermark). The
    surname is written "Bocher" (Bohrer/Borer); the mother's given/middle name
    after "Maria" is uncertain (plausibly "Regina"). The filename's "joaomaria" is
    wrong — the groom is "José Maria".
