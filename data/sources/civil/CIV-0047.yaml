transcription: >-
  [Registro Civil da 3ª Zona Judiciária — 1º Distrito de Niterói-RJ. ASSENTO DE
  ÓBITO. Livro C-97; Número 47406; Folha 172 (typewritten).] "Aos VINTE E TRÊS
  dia(s) do mês de SETEMBRO do ano de DOIS MIL E TRÊS, compareceu nesta serventia,
  Iara Caetano Rodrigues Janes, natural RJ., 42 anos, viúva, aux. de serviços
  gerais, IFP nº 11508426-1, residente na Rua Nilo Peçanha n. 589, São Miguel, São
  Gonçalo – RJ, e exibindo o atestado de óbito firmado pelo Dr(ª). Mauricio M.
  Garcia Justo – CRM n. 52.58951-1, dando como causa da morte insuficiência
  respiratória, arritmia cardíaca e insuficiência cardíaca, declarou que no dia
  VINTE E DOIS do mês de SETEMBRO do ano de DOIS MIL E TRÊS à(s) 19:10 hora(s),
  no(a) Hospital Estadual Azevedo Lima, nesta cidade, faleceu MARIA BOHRER
  TEIXEIRA, do sexo feminino, cor branca, profissão do lar, natural do(a) Rio de
  Janeiro, residente na(o) R. Anselmo de Andrade n. 287, Alcântara, São Gonçalo –
  RJ. Idade: oitenta e quatro anos (08/08/1919). Estado civil viúva. Identidade:
  IFP; nº 5120588. CPF: ignora. INSS nº 110973313-31. Filha de Valentin Martinho
  Bohrer e de Carolina Klein Bohrer. Deixa bens? Sim. Deixa Filhos? 05 filhos
  maiores. Fez testamento? Não. Era Eleitor? Não. O sepultamento será feito no
  cemitério Pacheco, em São Gonçalo, neste Estado. OBSERVAÇÃO: Declaração de óbito
  nº 4309644. Autorizado o sepultamento antes de 24 horas. A declarante ignora
  demais elementos previstos em Lei. Nada mais declarou. Lido e achado conforme,
  assina. Eu, [assinatura] (Paulo Roberto de A. Sabdin — Responsável pelo
  Expediente), lavrei, li e encerro o presente ato." [Declarante: assinatura "Iara
  Caetano Rodrigues Janes". Carimbo "Paulo Roberto de Almeida Sabdin (Respons. p/
  Exp.)"; selo "1 ATO REGISTRADO Nº REA90769"; carimbo "3ª Zona Judiciária RCPN
  Niterói-RJ". Averbações: em branco.]
abstract: >-
  Civil death registration of Maria Bohrer Teixeira, who died 22 September 2003 at
  19:10 in the Hospital Estadual Azevedo Lima, Niterói (RJ), aged 84 (born 8 August
  1919), a widow, "do lar", of respiratory and cardiac failure. She is named as the
  daughter of Valentin Martinho Bohrer (P-0028) and Carolina Klein Bohrer (P-0029)
  — i.e. a sister of the direct ancestor João Gonçalves Bohrer (P-0014). PROVEN.
  Recorded as a documented child on family F-0013; not modelled as a person entity;
  no event created. The declarant was Iara Caetano Rodrigues Janes, 42, a widow and
  aux. de serviços gerais of São Gonçalo (relationship not stated); the death was
  attested by Dr(ª). Mauricio M. Garcia Justo. The five adult children are not
  named in the act.
abstract_pt: >-
  Registro civil de óbito de Maria Bohrer Teixeira, falecida em 22 de setembro de
  2003 às 19:10 no Hospital Estadual Azevedo Lima, Niterói (RJ), aos 84 anos
  (nascida em 8 de agosto de 1919), viúva, "do lar", por insuficiência respiratória
  e cardíaca. É nomeada como filha de Valentin Martinho Bohrer (P-0028) e Carolina
  Klein Bohrer (P-0029) — ou seja, irmã do ancestral direto João Gonçalves Bohrer
  (P-0014). PROVEN. Registrada como filha documentada na família F-0013; não
  modelada como entidade pessoa; sem evento. A declarante foi Iara Caetano
  Rodrigues Janes, 42 anos, viúva, aux. de serviços gerais, de São Gonçalo
  (parentesco não declarado); o óbito foi atestado pelo(a) Dr(ª). Mauricio M.
  Garcia Justo. Os cinco filhos maiores não são nomeados no assento.
