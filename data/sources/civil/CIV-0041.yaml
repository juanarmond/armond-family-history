transcription: >-
  [Cartório de Paz de Sapucaia, RJ; livro de nascimentos, fl. 34. Margem: "Ritta".]
  "Nº 65. Assento numero sessenta e cinco. Aos vinte e tres de Janeiro de mil
  oitocentos e noventa, neste unico Districto de Paz da Parochia e Cidade de
  Sapucaia, Estado do Rio de Janeiro da Republica Federal dos Estados Unidos do
  Brazil, em meu cartorio compareceu João Muniz Bittencourt e declarou: Que no dia
  quinze do corrente, ao meio dia, no lugar denominado Conceição nesta freguezia, e
  distante em [duas — uncertain] leguas da Sede desta Cidade, nasceu uma criança do
  sexo feminino, que ha de baptizar-se com o nome de Ritta, filha legitima do
  declarante e Dona Suzana Rita Bittencourt digo Rita Brandão, lavradores, e
  moradores no lugar acima declarado; neta paterna de Manoel Muniz Bittencourt e
  Dona Francisca Roza do Espirito Santo, e materna de Jose do Rego Brandão e Dona
  Rita Ignacia de Jesus. E para constar lavrou este termo que commigo assigna o
  declarante e as testemunhas João Evangelista Vieira e Ale[xandre — illegible]."
  (The clerk first wrote the mother's surname "Bittencourt" and self-corrected to
  "Rita Brandão" with the notation "digo".)
abstract: >-
  Original 1890 civil birth register entry (Cartório de Paz de Sapucaia, RJ) of
  Ritta, a female child born 15 January 1890 at Conceição (Sapucaia) and
  registered 23 January 1890, declared by her father. It names both parents —
  João Muniz Bittencourt (P-0019) and Suzana Rita Brandão (P-0020) — hence a
  sibling of Deocleciano (P-0012); and both grandparent couples: paternal Manoel
  Muniz Bittencourt (P-0042) and Francisca Roza do Espirito Santo (P-0047), and
  maternal José do Rego Brandão (P-0040) and Rita Ignacia de Jesus (P-0041) —
  corroborating families F-0020 and F-0019. PROVEN. Recorded as a documented child
  on F-0007; not modelled as a person entity, no event created.
abstract_pt: >-
  Assento original de nascimento civil de 1890 (Cartório de Paz de Sapucaia, RJ)
  de Ritta, criança do sexo feminino nascida em 15 de janeiro de 1890 em Conceição
  (Sapucaia) e registrada em 23 de janeiro de 1890, declarada pelo pai. Nomeia
  ambos os pais — João Muniz Bittencourt (P-0019) e Suzana Rita Brandão (P-0020) —
  portanto irmã de Deocleciano (P-0012); e os dois casais de avós: paternos Manoel
  Muniz Bittencourt (P-0042) e Francisca Roza do Espirito Santo (P-0047), e
  maternos José do Rego Brandão (P-0040) e Rita Ignacia de Jesus (P-0041) —
  corroborando as famílias F-0020 e F-0019. PROVADO. Registrada como filha
  documentada em F-0007; não modelada como entidade pessoa, sem evento criado.
reliability:
  assessment: >-
    Direct primary civil-register evidence that Ritta is a legitimate daughter of
    João Muniz Bittencourt and Suzana Rita Brandão (a sibling of Deocleciano). The
    same entry names both grandparent couples, corroborating F-0020 (paternal) and
    F-0019 (maternal). The informant is the child's own father.
  informant: >-
    The child's father, João Muniz Bittencourt (declarant), Sapucaia, 23 January
    1890.
  limitations: >-
    Handwritten register; the second witness's given name and the distance in
    leagues are slightly uncertain in the cursive. Ritta is a collateral (a
    sibling of Deocleciano) recorded as a documented child, not modelled as a
    person entity. The surname is not written out in the act (the child is named
    only "Ritta"); "Muniz Bittencourt" follows the family.
