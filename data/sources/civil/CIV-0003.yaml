transcription: >-
  [Assento nº 39.006, à folha 557; a entrada 39.005 na folha oposta 556 é um óbito
  de criança, não relacionado. O declarante é o filho do falecido, pessoa viva
  (P-0002); seu número de identidade e endereço impressos no assento são omitidos por
  privacidade (nome, idade e profissão são mantidos).]

  ÓBITO. NÚMERO 39.006. Aos dezenove de fevereiro de mil novecentos e noventa e um,
  em meu Cartório, compareceu Luís Carlos Ignacio Armond, C.I. [número de identidade
  omitido por privacidade — declarante vivo, P-0002], nacionalidade brasileira, com 33
  anos de idade, profissão vendedor, residente [logradouro omitido por privacidade],
  Rio - RJ, e exibindo atestado de óbito firmado
  pelo médico Antonio Jorge [uncertain: Sirrão] Borges, declarou: que no dia dezoito
  do corrente mês e ano, às 19 horas [minutos em branco], [no] Hospital Santa
  Margarida faleceu Geraldo Paz Armond, do sexo masculino, cor branca, com setenta e
  seis anos de idade, natural do Estado de Minas Gerais, estado civil casado com
  Cidalia Engracio Armond, profissão aposentado, residente nesta cidade [logradouro
  e número omitidos por privacidade], filho de Aristão Ferreira Armond, falecido,
  natural do M.G., residente —, e de Liliosa Paz Armond, falecida, natural do M.G.,
  residente —. Causa mortis: Desequilíbrio metabólico. Vai ser sepultado no Cemitério
  desta cidade. Observações: O falecido não deixou testamento, deixou bens a
  inventariar e deixou um filho.

  Para constar lavrei este termo que, lido e achado conforme, assino. Eu [assinatura],
  escrevente juramentado, o escrevi. Eu [assinatura], Oficial de Registro Civil,
  subscrevo e assino. [assinatura do declarante] Luis Armond.
abstract: >-
  The original Volta Redonda civil death register records that Geraldo Paz
  Armond died on 18 February 1991 at 19h in the Hospital Santa Margarida, aged
  76, of metabolic imbalance ("desequilíbrio metabólico"), and was registered
  the next day, 19 February 1991, as entry 39006 on page 557. It names his
  spouse as Cidalia Ingracio Armond and his parents as Aristão Ferreira Armond
  and Liliosa Paz Armond, both deceased. The register states that he left one
  child.
abstract_pt: >-
  O registro civil de óbito original de Volta Redonda registra que Geraldo Paz
  Armond faleceu em 18 de fevereiro de 1991, às 19h, no Hospital Santa
  Margarida, aos 76 anos, por desequilíbrio metabólico ("desequilíbrio
  metabólico"), e foi registrado no dia seguinte, 19 de fevereiro de 1991, como
  assento 39006 à folha 557. Nomeia sua cônjuge como Cidalia Ingracio Armond e
  seus pais como Aristão Ferreira Armond e Liliosa Paz Armond, ambos falecidos.
  O registro declara que ele deixou um filho.
reliability:
  assessment: >-
    Original civil-register evidence directly supports the death, date, place,
    age and identity. The reported spouse and parentage are secondary
    information supplied at death but directly stated in the record.
  informant: >-
    The declarant was the deceased's son, a living person recorded in this
    repository as P-0002; his personal identifiers printed on the record are
    intentionally not transcribed.
  limitations: >-
    Some handwriting is faint. The register spread's facing page 556 carries an
    unrelated infant death numbered 39005, which an earlier reading mistook for
    this entry; Geraldo's entry is unambiguously 39006. The register states "um
    filho" (one child), which appears to undercount the known family and should
    be treated as recorded rather than as a family census. The retained JPEG is
    FamilySearch's authorised `JPG Only` download from the original-image ARK.
