transcription: >-
  [República Federativa do Brasil. Estado do Rio de Janeiro. Euclydes Pereira
  Cortez, Oficial da 10ª Circunsc. do Reg. Civil das Pessoas Naturais — Rua
  Carolina Meier 31, Meier, Rio de Janeiro — 2281-2270 — Comarca do Estado do Rio
  de Janeiro, 5ª Zona.] "CERTIDÃO DE NASCIMENTO. Certifico que à fl. 98 do livro
  nº A-350 sob o número de ordem 24241, foi lavrado o assentamento de JUAN CARLOS
  MUNIZ ARMOND, nascido aos vinte e dois (22) dias do mês de Junho do ano de mil
  novecentos e oitenta e dois (1982), às 03:45 horas, no(a) HOSPITAL CARMELA DUTRA
  — NESTA CIDADE, do sexo masculino, filho de LUIS CARLOS IGRACIO ARMOND e LUCINÉA
  APARECIDA MUNIZ ARMOND, sendo avós paternos: GERALDO PAZ ARMOND e CIDALIA IGRACIO
  ARMOND e maternos: ANTENOR MUNIZ e IRIS BOHRER MUNIZ. Foi declarante LUIS CARLOS
  IGRACIO ARMOND. Observações: Registro feito aos vinte e dois (22) dias do mês de
  Junho do ano de mil novecentos e oitenta e dois (1982). TALÃO Nº 300524.
  *--*--*--*--*--*--*--*" Certification: "Eu, [assinatura], escrevente, a extraí. O
  referido é verdade e dou fé. Rio de Janeiro, 20 de Junho de 2008." Signed
  Priscila Xavier da Silveira, escrevente (CTPS 61988-148/RJ); stamps of Antônio
  de Oliveira Lopes, escrevente (CTPS 35508-110/RJ) and the Serviço Registral e
  Notarial da 10ª Circunscrição do Registro Civil, with Corregedoria Geral da
  Justiça-RJ "Selo de Fiscalização" and a "reconhecimento de firma" sticker
  (TZB74263). Top-left: stamp of the Consolato Generale d'Italia, Rio de Janeiro —
  "ITALO GROSSI fu Luigi, Traduttore [tradutor público juramentado]" — with a
  handwritten reference "39 390/08".
abstract: >-
  A certified derivative of the subject's Brazilian civil birth registration
  (10th District of Rio de Janeiro, livro A-350, folha 98, número de ordem
  24241) reports his birth at 03:45 on 22 June 1982 in the Hospital Carmela
  Dutra, Rio de Janeiro; parents Luis Carlos Igracio Armond and Lucinea
  Aparecida Muniz Armond; and grandparents Geraldo Paz Armond, Cidalia Igracio
  Armond, Antenor Muniz and Iris Bohrer Muniz. The father was the declarant.
