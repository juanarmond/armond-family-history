transcription: >-
  [Coat of arms of the Comune]

  COMUNE DI CARONNO PERTUSELLA

  UFFICIO DELLO STATO CIVILE – AIRE –LEVA MILITARE

  Tel. 029650354 Fax 029656795 anagrafe@caronnopertusella.va.it

  CERTIFICATO DI MATRIMONIO

  ANNO 2007  N. 30  PARTE  II  SERIE  C

  Dal registro degli atti di matrimonio di questo Comune anno parte serie e
  numero sopraindicati risulta che il giorno SEDICI  **** del mese di AGOSTO
  ****    dell'anno DUEMILATRE' ***** in TORONTO (CANADA) ***** È stato
  celebrato nelle forme di legge il matrimonio fra

  ARMOND JUAN CARLOS MUNIZ

  NATO IN BRASILE IL 22.6.1982

  E

  BEVILACQUA VANESSA

  NATA IN BRASILE IL 15.11.1980

  Il presente certificato viene rilasciato per gli usi consentiti dalla Legge.

  Caronno Pertusella, 24 ottobre 2007

  L'Ufficiale dello Stato Civile [signature over the official round stamp of
  the Comune di Caronno Pertusella; the printed name beneath the caption reads,
  uncertain: (Gabriela CATTANEO)]
