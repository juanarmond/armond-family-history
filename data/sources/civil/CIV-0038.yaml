transcription: >-
  [Registro Civil de nascimentos, Nova Friburgo, 1923. The entry begins at the foot of the
  left-hand page and continues on folio 125. Margin: "19511 [uncertain] / Senira / Borher".]
  "Aos trinta e um dias do mez de Março de mil novecentos e vinte e tres, nesta cidade de Nova
  Fri- [folio 125] burgo, Estado do Rio de Janeiro, em meu cartorio compareceu João Gonçalves
  Bohrer, brazileiro, lavrador, residente no lugar denominado kilometro cento e dois [km 102],
  neste Districto, e perante as testemunhas adiante nomeadas e assignadas declarou: Que no dia
  vinte do corrente mez, na casa de residencia do declarante, ás vinte e uma horas, nasceu uma
  criança do sexo feminino, de côr branca, que se chamará = Senira Borherer = filha legitima
  delle declarante e de sua mulher Celina Borherer, naturaes deste Estado, casados civilmente no
  segundo Districto deste municipio. Netta paterna de Valentim Martinho Borherer e de Carolina
  Borherer, netta materna de Joaquim José Borher e de Lucinda Ferreira Borherer, já fallecida.
  … testemunhas Honorio Francisco Portella e Alípio de Carvalho. Eu, José Nunes Pimentel,
  escrivão que o subscrevo e assigno." [Corrected 2026-10-08 from the image: the opening date
  at the foot of the left-hand page is now transcribed; the grandparents' clause reads "netta
  materna de Joaquim José Borher e de Lucinda Ferreira Borherer, já fallecida" — singular
  "fallecida", so only Lucinda is marked deceased — replacing "Lucinda [Sandra — uncertain]
  Bohrer, já falecida"; the place of the parents' civil marriage reads "deste municipio", not
  "desta [cidade]"; the surnames are given in the register's own spellings (Borherer / Borher)
  rather than normalised to Bohrer.]
abstract: >-
  Original civil birth register recording the birth of Senira Bohrer, a legitimate daughter of João
  Gonçalves Bohrer (P-0014) and Celina Bohrer (P-0015) — a sister of Iris Bohrer Muniz (P-0007), so a
  maternal aunt of Cidalia's grandchildren's line. Born 20 March 1923 at the declarant's house at
  kilometro 102, registered 31 March 1923. PROVEN sibling (both parents named). The record also names
  both grandparent couples — paternal Valentim Martinho Borherer × Carolina Borherer (P-0028 × P-0029)
  and maternal Joaquim José Borher × Lucinda Ferreira Borherer, "já fallecida" (P-0030 × P-0031); the
  singular "fallecida" marks only Lucinda as deceased by March 1923, not Joaquim José — so it is a
  further primary corroborating those direct-ancestor couples. [Corrected 2026-10-08 from the image:
  exact birth and registration dates added; the maternal grandmother reads "Lucinda Ferreira
  Borherer", not "Lucinda [Ferreira da Silva]", and only she is marked deceased.] Recorded as a documented_child on
  F-0005; no event (Senira is not modelled as a person entity).
abstract_pt: >-
  Registro civil de nascimento original de Senira Bohrer, filha legítima de João Gonçalves Bohrer
  (P-0014) e Celina Bohrer (P-0015) — irmã de Iris Bohrer Muniz (P-0007). Nascida em 20 de março de
  1923 na casa do declarante, no quilômetro 102, e registrada em 31 de março de 1923. Irmã PROVEN
  (ambos os pais nomeados). O registro também nomeia os dois casais de avós — paternos Valentim
  Martinho Borherer × Carolina Borherer (P-0028 × P-0029) e maternos Joaquim José Borher × Lucinda
  Ferreira Borherer, "já fallecida" (P-0030 × P-0031); o singular "fallecida" marca apenas Lucinda
  como falecida em março de 1923, e não Joaquim José — sendo, portanto, uma nova fonte primária que
  corrobora esses casais de ancestrais diretos. [Corrigido em 2026-10-08 a partir da imagem: datas
  exatas de nascimento e registro acrescentadas; a avó materna lê-se "Lucinda Ferreira Borherer", e
  não "Lucinda [Ferreira da Silva]", e apenas ela é dada como falecida.] Registrada como documented_child em F-0005; sem evento (Senira não é modelada
  como entidade pessoa).
reliability:
  assessment: >-
    Primary civil birth entry — direct primary for Senira's parentage (João Gonçalves Bohrer × Celina)
    and corroborating for both named grandparent couples.
  informant: The father, João Gonçalves Bohrer, before the escrivão.
  limitations: >-
    Delivered via the FamilySearch digitisation ("Sem valor legal"). The margin entry number
    ("19511") is an [uncertain] read. The record states only that Lucinda was deceased; it says
    nothing of Joaquim José's status. [Corrected 2026-10-08 from the image: the earlier uncertain
    reads — the grandmother's middle name "Sandra" and the registration month — are resolved as
    "Lucinda Ferreira Borherer" and 31 March 1923.]
