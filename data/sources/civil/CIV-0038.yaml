transcription: >-
  [Registro Civil de nascimentos, Nova Friburgo, folio 125, 1923.] "… em meu cartorio compareceu
  João Gonçalves Bohrer, brazileiro, lavrador, residente no lugar denominado kilometro cento e dois
  [km 102], neste Districto, e perante as testemunhas adiante nomeadas e assignadas declarou: Que no
  dia vinte do corrente, na casa de residencia do declarante, ás vinte e uma horas, nasceu uma
  criança do sexo feminino, de côr branca, que se chamará = Senira Bohrer = filha legitima delle
  declarante e de sua mulher Celina Bohrer, naturaes deste Estado, casados civilmente no segundo
  Districto desta [cidade]; netta paterna de Valentim Martinho Bohrer e de Carolina Bohrer, e materna
  de Joaquim José Bohrer e de Lucinda [Sandra — uncertain] Bohrer, já falecida. … testemunhas Honorio
  Francisco Portella e Alípio de Carvalho. Eu, José Nunes Pimentel, escrivão que o subscrevo e
  assigno."
abstract: >-
  Original civil birth register recording the birth of Senira Bohrer, a legitimate daughter of João
  Gonçalves Bohrer (P-0014) and Celina Bohrer (P-0015) — a sister of Iris Bohrer Muniz (P-0007), so a
  maternal aunt of Cidalia's grandchildren's line. PROVEN sibling (both parents named). The record
  also names both grandparent couples — paternal Valentim Martinho Bohrer × Carolina (P-0028 × P-0029)
  and maternal Joaquim José Bohrer × Lucinda [Ferreira da Silva], já falecida (P-0030 × P-0031) — so it
  is a further primary corroborating those direct-ancestor couples. Recorded as a documented_child on
  F-0005; no event (Senira is not modelled as a person entity).
abstract_pt: >-
  Registro civil de nascimento original de Senira Bohrer, filha legítima de João Gonçalves Bohrer
