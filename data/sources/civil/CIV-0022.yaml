abstract: >-
  A 1995 certified copy of Cidália's 1930 birth registration (nº 132, livro 2, fl.
  142, Alvorada, Carangola, MG). Her own primary birth record: born 15 September
  1930 at Alvorada, daughter of Antonio Engracio de Souza (P-0010) and Maria Aurora
  Guimarães (P-0011), declared by her father. Names the paternal grandparents
  Antonio Engracio de Souza + Luzia (Pinheiro) da Conceição (P-0032/P-0033) and the
  maternal grandparents Francisco José de Carvalho Guimarães + Emerenciana Maria de
  Jesus (P-0021/P-0022).
abstract_pt: >-
  Uma certidão de 1995 do registro de nascimento de 1930 de Cidália (nº 132,
  livro 2, fl. 142, Alvorada, Carangola, MG). Seu próprio registro de nascimento
  primário: nascida em 15 de setembro de 1930 em Alvorada, filha de Antonio
  Engracio de Souza (P-0010) e Maria Aurora Guimarães (P-0011), declarada por
  seu pai. Nomeia os avós paternos Antonio Engracio de Souza + Luzia (Pinheiro)
  da Conceição (P-0032/P-0033) e os avós maternos Francisco José de Carvalho
  Guimarães + Emerenciana Maria de Jesus (P-0021/P-0022).
reliability:
  assessment: >-
    Direct primary evidence for Cidália's birth date, place and parentage — her own
    civil birth registration, declared by her father in 1930 (here as a certified
    copy). Resolves material conflict 1 (15 September, not 15 November 1930).
  informant: Her father, Antonio Engracio (de Souza) Filho, was the declarant.
  limitations: >-
    A 1995 certified copy, not the original register image; the given name is
    recorded as "Cidália" (the surname was assigned later).
