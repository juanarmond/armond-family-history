transcription: >-
  [República Federativa do Brasil, Registro Civil, Comarca de Carangola, Distrito
  de Alvorada, MG. Certidão de Nascimento.] "CERTIFICO que, sob Nº 132, a fls. 142,
  do livro Nº Dois (02) de Registro de Nascimentos, encontra-se o assento de
  'CIDÁLIA', nascida a 15 (quinze) de setembro (09) de mil novecentos e trinta
  (1930), em domicílio, neste distrito de Alvorada, Município de Carangola, Minas
  Gerais. Do sexo feminino, filha de Antonio Engracio de Souza e Maria Aurora
  Guimarães. Sendo avós paternos Antonio Engracio de Souza e dona Luzia da
  Conceição; e maternos Francisco José de Carvalho Guimarães e dona Emerenciana
  Maria de Jesus. Tendo sido declarante o pai. E testemunhas as constantes no
  termo. O assento foi feito em 15 de setembro de 1930. Observações: para todos os
  fins." Certified Alvorada (MG), 4 May 1995.
