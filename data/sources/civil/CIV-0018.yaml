transcription: >-
  [Óbito nº 63.792.] "Aos dezesseis de setembro de mil novecentos e noventa e um,
  nesta cidade e em cartório, compareceu [Antonio Engracio Neto], prof. policial
  ... e exibindo o atestado de óbito firmado pelo médico Dr. Braulio dos Santos
  Junior, prestou as seguintes declarações: Nome do obituado: Maria Aurora
  Guimarães. Data e hora do falecimento: 15/setembro/1991 às 13,30 horas. Est.
  civil viúva de Antonio Engracio Filho. Sexo feminino, idade 87 anos. Lugar do
  falecimento: rua David Campista, 326 - Hospital. Residência: Av. Ten. Ribeiro,
  361/201, prof. do lar. Naturalidade: Estado de Minas Gerais. Nome dos pais do
  obituado: Francisco José de Carvalho Guimarães e Emerenciana Maria de Jesus.
  Causa mortis: infecção respiratória, doença pulmonar obstrutiva crônica,
  hipertensão arterial sistêmica, insuficiência renal aguda. Lugar do sepultamento:
  Cemitério São Francisco Xavier. Deixou cinco filhos maiores." The declarant
  (a relative) is named in the register; his identifying document is withheld here
  for privacy.
abstract: >-
  Original civil death register recording the death of Maria Aurora Guimarães
  (P-0011) on 15 September 1991 at Rio de Janeiro, aged 87 (so born c.1904),
  widow of Antonio Engracio Filho (P-0010), born in Minas Gerais. It names her
  parents as Francisco José de Carvalho Guimarães (P-0021) and Emerenciana Maria
  de Jesus (P-0022) — the same couple named in her 1904 birth registration
  (CIV-0007) — and reports five surviving adult children.
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly reports her as the widow of Antonio Engracio Filho. Her parents are
    stated as secondary (informant-reported) information, but they match CIV-0007
    exactly.
  informant: A relative of the deceased (name withheld here for privacy).
  limitations: >-
    The register page also carries three unrelated adjacent death entries
    (nº 63.793, 63.794, 63.795). The parent names are informant-reported at death.
