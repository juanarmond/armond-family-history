notes:
- text: >-
    Resolves material conflict 10: the 1904 birth registration (CIV-0007) recorded
    "Maria Amora Guimarães" and this 1991 death records "Maria Aurora Guimarães",
    but both name the identical parents (Francisco José de Carvalho Guimarães +
    Emerenciana Maria de Jesus), proving the two forms are one woman (P-0011).
    "Emerenciana" here matches "Emmerenciana" in CIV-0007 (spelling preserved).
