transcription: >-
  [Coat of arms of the Comune]

  COMUNE DI CARONNO PERTUSELLA

  UFFICIO DELLO STATO CIVILE – AIRE –LEVA MILITARE

  Tel. 02965121Fax 0296512207 anagrafe@caronnopertusella.va.it

  ESTRATTO PER RIASSUNTO DELL'ATTO DI MATRIMONIO

  ANNO 2007  N. 30  PARTE  II  SERIE  B

  Dal registro degli atti di matrimonio di questo Comune anno parte serie e
  numero sopraindicati risulta che il giorno SEDICI  *** Del mese di AGOSTO
  ***    dell'anno DUEMILATRE ***** A TORONTO (ONTARIO)  **** È stato celebrato
  nelle forme di legge il matrimonio fra

  1)  ARMOND JUAN CARLOS MUNIZ

  nato in BRASILE  di anni 21

  2)  BEVILACQUA VANESSA

  nata a VINHEDO (BRASILE)  il 15.11.1980

  certifica inoltre che a margine dell'atto stesso risulta l'annotazione
  contraddistinta al numero********************************* NESSUNA
  ANNOTAZIONE***********************************

  ANNOTAZIONI

  1. Con dichiarazione resa nell'atto di matrimonio controscritto gli sposi
  hanno scelto il regime della separazione dei beni (art. 162, secondo comma,
  del Codice Civile)

  2. Con atto in data [blank] nr [blank] a rogito del Notaio [blank] del
  distretto notarile di  MILANO gli sposi [blank] hanno • Stipulato convenzioni
  matrimoniali di separazione dei beni Caronno Pertusella, lì [blank]

  3. In data [blank] ha/nno presentato ricorso al Tribunale di [blank] per
  ottenere lo scioglimento/la cessazione degli effetti civili del matrimonio
  cui si riferisce l'atto controscritto. Caronno Pertusella, lì [blank]

  4. Con provvedimento del Tribunale di [blank] in data [blank] • E' stata
  pronunciata la separazione giudiziale • E' stata omologata la separazione
  consensuale Fra i coniugi di cui all'atto di matrimonio controscritto.

  5. Con sentenza del Tribunale di [blank] nr. [blank] in data [blank] E' stat.
  Dichiarat... lo scioglimento/la cessazione degli effetti civili del
  matrimonio cui si riferisce l'atto controscritto. Caronno Pertusella, lì
  [blank]

  6. Con atto in data [blank] n [blank] iscritto nei registri di matrimonio del
  Comune di [blank] il/i coniuge/i [blank] hanno scelto il regime patrimoniale
  ai sensi del 1° comma dell'art. 228 della legge 18.5.1975 n. 151 (separazione
  Beni). Caronno Pertusella' lì [blank]

  7. Con atto in data [blank] n. [blank] a rogito del Notaio del distretto
  notarile di [blank] il/i coniuge/i [blank] hanno scelto il regime
  patrimoniale ai sensi del 2° comma dell'art. 228 della legge 18.5.1975 n. 151
  (comunione dei beni). Caronno Pertusella [blank]

  8. Con sentenza della Corte di Appello di Milano n. [blank] del [blank] e
  trascritta nei registri degli atti di matrimonio del Comune di Caronno
  Pertusella Anno  P..S.. n. [blank] e passata in giudicato il [blank] e' stato
  dichiarato l'annullamento del  matrimonio di cui all'atto controscritto.-

  9  Con atto in data [blank] n. [blank] del Notaio del distretto notarile di
  [blank] gli sposi suddetti hanno costituito Fondo Patrimoniale (art.167 e
  segg.c.c.) Caronno Pertusella,li' [blank]

  sabato 5 luglio 2008

  L'UFFICIALE DELLO STATO CIVILE [a faint printed caption overlaps here —
  "Ufficiale dello Stato Civile e d'anagrafe del ... [Istruttore] delegato dal
  Sindaco ..." — with the printed name (Gabriela CATTANEO); signature over the
  official round stamp of the Comune]

  Per estratto dall'originale, ai sensi degli artt. 106 e segg.DPR 396/2000.
  esente da imposta di bollo ai sensi dell'art 7 comma 5 della L. 405/1990.

  Il presente estratto ha validità di 6 mesi dalla data di rilascio.
