transcription: >-
  [Registro Civil de Mesquita (RJ), livro de óbitos, p.96, óbito nº 10.977, 1975.
  Nome e endereço do declarante (terceiro possivelmente vivo) e os filhos
  sobreviventes omitidos por privacidade.] "Aos vinte (20) de maio de mil
  novecentos e setenta e cinco, em meu Cartório, compareceu [declarante —
  omitido: privacidade], nacionalidade brasileiro, com 37 anos de idade, profissão
  pintor, residente [endereço — omitido: privacidade], neste distrito, e exibindo
  atestado de óbito firmado pelo médico Dr. Joaquim da Silva Duarte, declarou: Que
  no dia 20 de maio de 1975, às 13 horas, no domicílio à rua S. Paulo, Mesquita,
  faleceu Alcida Fernandes de Azevedo, do sexo feminino, côr branca, com 80 anos de
  idade, natural de [Minas — uncertain] Geraes, estado civil viúva de Manoel Muniz
  Bittencourt, profissão doméstica, residente neste distrito, filha de Ascendino
  Maria de Azevedo, digo Ascendino Maria de Asevedo, falecido, e de Thereza
  Fernandes de Azevedo, falecida. Causa mortis: insuficiencia vascular cerebral,
  insuficiencia cardiaca congestiva, arteriosclerose generalizada. Vai ser
  sepultada no Cemitério de Mesquita. Observações: Não deixou bens, e deixou dez
  filhos [descendentes possivelmente vivos, não nomeados]…"
abstract: >-
  Civil death of Alcida Fernandes de Azevedo, a widow, who died 20 May 1975 at
  Mesquita (RJ), aged 80 (implied born ~1895), "natural de [Minas] Gerais", a
  domestic worker, widow of a (later-generation) Manoel Muniz Bittencourt. It names
  her mother "Thereza Fernandes de Azevedo" (an exact match to P-0039) and her
  father as "Ascendino Maria de Azevedo" — a 1975 informant-reported variant of the
  father otherwise attested "Secundino / José Secundino Maria de Azevedo" (P-0038)
  in his daughter Luiza's 1916 marriage (CIV-0001, PAR-0012) and 1922 grandchild
  baptism (PAR-0003). On the exact mother-name match plus the father's matching
  middle name + surname + a phonetically adjacent given name, and Alcida's own
  "Fernandes de Azevedo" compound, MG birth ~1895 and marriage into the same Muniz
  Bittencourt family, Alcida is Luiza's sister [STRONG-EVIDENCE, not proven].
  Recorded as a documented collateral child on family F-0018. The father-name
  variant is preserved on P-0038, not allowed to override the three better
  attestations. Private record. Not modelled as a person entity; no event created.
abstract_pt: >-
  Óbito civil de Alcida Fernandes de Azevedo, viúva, falecida em 20 de maio de 1975
  em Mesquita (RJ), com 80 anos (nascida ~1895), "natural de [Minas] Gerais",
  doméstica, viúva de um Manoel Muniz Bittencourt (de geração posterior). Nomeia sua
  mãe "Thereza Fernandes de Azevedo" (correspondência exata a P-0039) e seu pai como
  "Ascendino Maria de Azevedo" — uma variante informada em 1975 do pai atestado como
  "Secundino / José Secundino Maria de Azevedo" (P-0038) no casamento de 1916 da
  filha Luiza (CIV-0001, PAR-0012) e no batismo de 1922 do neto (PAR-0003). Pela
  correspondência exata do nome da mãe, além do nome do meio + sobrenome do pai e um
  primeiro nome foneticamente próximo, do próprio composto "Fernandes de Azevedo" de
  Alcida, do nascimento em MG ~1895 e do casamento com a mesma família Muniz
  Bittencourt, Alcida é irmã de Luiza [STRONG-EVIDENCE, não provado]. Registrada como
  filha colateral documentada na família F-0018. A variante do nome do pai é
  preservada em P-0038, sem sobrepor as três atestações melhores. Registro privado.
  Não modelada como entidade pessoa; sem evento criado.
reliability:
  assessment: >-
    Direct primary for the death; the parents' names, age and birthplace are
    informant-reported by a non-relative declarant 59 years after the parents'
    generation, hence information_quality mixed. It corroborates Alcida's siblinghood
    to Luiza (P-0013) via the exact mother match, but its "Ascendino" for the father
    is a low-reliability variant of the better-attested "Secundino / José Secundino".
  informant: >-
    A non-relative declarant (a painter, aged 37) who exhibited the attending
    physician's death certificate, Mesquita, 20 May 1975 (name withheld for privacy).
  limitations: >-
    Informant-reported filiation from a non-relative; the father's given name
    ("Ascendino") conflicts with three near-contemporary attestations naming him
    "Secundino / José Secundino Maria de Azevedo" — treated as a variant, not a
    correction. "[Minas] Gerais" is an uncertain read. The declarant, the ten
    surviving children and the addresses are withheld for privacy.
