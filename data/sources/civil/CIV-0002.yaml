transcription: >-
  [Certidão de casamento nº 898, Registro Civil de Eugenópolis, Minas Gerais, livro
  13-B, fls. 22 — formulário impresso preenchido à mão, gravemente danificado:
  rasgado nas bordas e com manchas de água que tornam ilegíveis trechos da filiação
  e do texto de certificação. Sobre o canto superior esquerdo há um recorte dobrado
  de reconhecimento de firma.]

  [Recorte dobrado, canto superior esquerdo — reconhecimento de firma:] "Reconheço
  verdadeira a [...] firma [uncertain: infra] de Hélio Bomtempo [uncertain: Secunho].
  Dou fé. Muriaé, [data ilegível]. Em testemunho (T) da verdade [assinatura]."
  [Carimbo do oficial:] "Hélio Bomtempo [uncertain: Secunho] — Oficial de Registro
  Civil — Cidade de Eugenópolis — Minas Gerais." [Carimbo redondo de reconhecimento
  de firma, com selo e nomes verticais parcialmente legíveis: MACIEL [illegible]
  BOLIVAR [illegible].]

  REPÚBLICA FEDERATIVA DO BRASIL. Página Nº [em branco]. Estado de [obscurecido pelo
  carimbo — Minas Gerais]. Comarca de [uncertain: Eugenópolis]. Município de
  [uncertain: Eugenópolis]. Distrito de [uncertain: Cidade]. REGISTRO CIVIL.
  [assinatura] Escrivão de Paz e Oficial do Registro Civil. CASAMENTO N. 898.

  CERTIFICO que, às fls. 22 do livro nº 13-B, de registro de Casamentos, foi extraído
  hoje o assento do matrimônio de Geraldo Paz Armond [uncertain: Armand] e Cidália
  Engrácio Guimarães, contraído perante o Juiz [uncertain: Cyrano Portilho], e as
  testemunhas [uncertain: Camilo Soares Galvão Filho] e [uncertain: Mário Dutra da
  Silva].

  ÊLE, nascido em Limeira, Minas, aos 30 de janeiro de 19[15] [canto superior direito
  rasgado; os dígitos finais do ano não são legíveis com segurança neste exemplar],
  profissão padeiro, domiciliado [em branco] e residente nesta cidade [em branco];
  filho de [torn/stain: nome do pai perdido no rasgo e na mancha] [...] e de Dona
  Liliosa Paz [uncertain: Armond], nascida aqui, falecida em 16-4-946, domiciliada
  [em branco] e residente [em branco].

  ELA, nascida em Alvorada, Minas, aos 15 de setembro de 1930, profissão doméstica, —
  domiciliada [em branco] e residente nesta cidade, — filha de Antônio Engrácio de
  Souza, — nascido em 15 de junho de 1894, domiciliado [em branco] e residente nesta
  cidade, — e Dona Maria Aurora Guimarães, nascida em 01 de janeiro de 1904,
  domiciliada [em branco] e residente nesta cidade, — a qual passa a assinar-se
  "Cidalia Engrácia [uncertain: Engrácio] Armond [uncertain: Armand]".

  Foram apresentados os documentos a que se refere o Art. 180, números 1, 2, 4 do
  Código Civil.

  Observações: O casamento realizou-se no dia 31 de maio de 19[52] [dígitos do ano
  sob mancha], às 14:00 horas, [stain: trecho desbotado — regime de bens] [...] de
  bens. — O termo do casamento foi [uncertain: alterado] por ordem judicial, datada
  de 06-3-19[7-, restante rasgado/ilegível].

  O referido é verdade e dou fé. Eugenópolis, 05 de maio de 19[72]. [assinatura] Hélio
  Bomtempo [uncertain: Secunho] — OFICIAL.
abstract: >-
  A damaged civil marriage certificate (Casamento nº 898, Eugenópolis, livro 13-B)
  recording the 31 May 1952 marriage of Geraldo Paz Armond (born Limeira, MG,
  30 January 1915, padeiro) and Cidalia Engracio Guimarães (born Alvorada, MG,
  15 September 1930, doméstica; thereafter signing "Cidalia Engrácio Armond"). A
  clearer alternate view (2026-07-30 retrieval sync) resolves the previously obscured
  lines: Geraldo's mother is D. Liliosa Paz, "nascida aqui" (Eugenópolis), "falecida
  em 16-4-946"; Cidalia's parents are Antônio Engrácio de Souza (born 15 June 1894)
  and D. Maria Aurora Guimarães (born 1 January 1904).
abstract_pt: >-
  Uma certidão de casamento civil danificada (Casamento nº 898, Eugenópolis,
  livro 13-B) que registra o casamento, em 31 de maio de 1952, de Geraldo Paz
  Armond (nascido em Limeira, MG, 30 de janeiro de 1915, padeiro) e Cidalia
  Engracio Guimarães (nascida em Alvorada, MG, 15 de setembro de 1930,
  doméstica; que passou a assinar "Cidalia Engrácio Armond"). Uma vista
  alternativa mais nítida (sincronização de recuperação de 2026-07-30) resolve
  as linhas antes obscurecidas: a mãe de Geraldo é D. Liliosa Paz, "nascida
  aqui" (Eugenópolis), "falecida em 16-4-946"; os pais de Cidalia são Antônio
  Engrácio de Souza (nascido em 15 de junho de 1894) e D. Maria Aurora Guimarães
  (nascida em 1 de janeiro de 1904).
reliability:
  assessment: >-
    Direct evidence for the marriage, the spouses' names and the married-name
    form. The stated birth facts are secondary information for those events.
  informant: The spouses' declarations as entered on the marriage certificate.
  limitations: >-
    The certificate is severely damaged and repaired with opaque tape. Several
    words, including portions of the parentage and certification text, cannot
    be read safely. The repository retains the originally uploaded JPEG for the
    clearest of the three reviewed photographs.
