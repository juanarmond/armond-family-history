transcription: >-
  [Registro Civil de casamentos, 1º Distrito de São João Baptista, Nova Friburgo, termo N.580, folio
  128-129, 1899; escrivão Carlos Miguel Noel; juiz de paz Antonio José da Silva Araujo Braga.] "Aos
  vinte e oito dias do mês de Outubro de mil oitocentos noventa e nove ... nesta Cidade de Nova
  Friburgo, ás cinco e meia horas da tarde ... receberão-se em matrimonio no regimen commum Ezequiel
  Mathias Dias com Dona Maria da Gloria da Silva Ferreira, ambos solteiros, elle com vinte e oito
  annos de idade, negociante, natural de Portugal, filho legitimo de Antonio Mathias e de Rosalina
  Dias, moradores em Portugal; ella com vinte e tres annos de idade, occupa-se em serviços domesticos,
  natural desta Cidade, filha legitima de Antonio da Silva Ferreira, morador na mesma Cidade, e de
  Maria Joanna da Silva Ferreira aqui fallecida, ambos os contrahentes são moradores na mesma Cidade
  ... [assinam, entre outros:] Ezequiel Mathias Dias, Maria da Gloria da S. Ferreira, Antonio da Silva
  Ferreira [o pae], João Julião Froidevaux, Carlos Miguel Noel."
abstract: >-
  Civil marriage of Maria da Gloria da Silva Ferreira (23, b. ~1876, "natural desta Cidade" = Nova
  Friburgo) and the Portuguese Ezequiel Mathias Dias, 28 October 1899 at Nova Friburgo. She is a
  "filha legitima de Antonio da Silva Ferreira, morador na mesma Cidade [ALIVE], e de Maria Joanna da
  Silva Ferreira aqui fallecida [DEAD, at Nova Friburgo]" — so Maria Joanna Rutschmann (P-0037) had
  died at Nova Friburgo by October 1899 (event E-0125), and Antonio (P-0036) was alive and personally
  SIGNED the act. Maria da Gloria is a documented sibling of the direct ancestor Lucinda (P-0031), and
  was a godparent at Celina Bohrer's 1899 baptism. Two-page act (folio 128 start → folio 129 signatures).
abstract_pt: >-
  Casamento civil de Maria da Gloria da Silva Ferreira (23 anos, n. ~1876, "natural desta Cidade" =
  Nova Friburgo) e do português Ezequiel Mathias Dias, 28 de outubro de 1899, em Nova Friburgo. Ela é
  "filha legitima de Antonio da Silva Ferreira, morador na mesma Cidade [VIVO], e de Maria Joanna da
  Silva Ferreira aqui fallecida [FALECIDA, em Nova Friburgo]" — logo Maria Joanna Rutschmann (P-0037)
  já falecera em Nova Friburgo até outubro de 1899 (evento E-0125), e Antonio (P-0036) estava vivo e
  ASSINOU pessoalmente o assento. Maria da Gloria é irmã documentada da ancestral direta Lucinda
  (P-0031) e foi madrinha no batismo de 1899 de Celina Bohrer. Assento em duas páginas (folha 128
  início → folha 129 assinaturas).
reliability:
  assessment: Primary civil marriage entry — direct primary for the marriage and for Antonio being alive (signs) and Maria Joanna deceased at NF by Oct 1899.
  informant: The contracting parties before the juiz de paz and escrivão.
  limitations: Delivered via the FamilySearch digitisation ("Sem valor legal"); Maria da Gloria is a collateral (sibling of the direct ancestor), recorded as a documented_child on F-0017. "Aqui fallecida" gives Maria Joanna's death as before Oct 1899 at NF (no exact date).
