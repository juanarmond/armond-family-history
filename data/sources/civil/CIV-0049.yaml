transcription: >-
  [Registro Civil de Califórnia (Arapoti, PR), livro de óbitos, fl.170, termo nº
  1876, 1964. Transcrito na íntegra; as omissões de privacidade foram restauradas
  a partir da imagem em 2026-10-08.] "Em vinte e dois de Dezembro de mil
  novecentos e sessenta e quatro, nesta cidade da Califórnia, Comarca de Arapoti,
  Est. do Paraná, em cartório, compareceu José Braz de Faria, abaixo assinado, e
  exibindo o atestado de óbito firmado por Dr. Fauad [uncertain] E. M. Salomão,
  dando como causa de morte Colapso Cardíaco, declarou que no dia vinte e um do
  dito mês e ano, às treze horas, em seu domicílio, no Bairro Uaraijal
  [uncertain], neste Distrito, faleceu 'José de Carvalho Guimarães Sobrinho', do
  sexo masculino, de côr branca, profissão Lavrador, natural do Estado de Minas
  Gerais, São Francisco da Glória, domiciliado e residente neste Distrito, com
  sessenta e três anos de idade, estado civil Casado, filho legítimo de Francisco
  J[osé de] C[arvalho] Guimarães e Dª. [Emerenciana — uncertain] M[aria de]
  J[esus] Guimarães, ambos naturais do Estado de Minas Gerais, e ambos já
  falecidos. O sepultamento será feito no Cemitério de Califórnia. O falecido era
  casado civilmente com Dª. Felisberta Nunes de Carvalho. Deixou onze filhos,
  sendo dez maiores e um menor. Deixou bens a inventariar. Do que para constar,
  lavrei êste termo que lido e achado conforme vai assinado pelo declante, digo,
  pelo declarante. Eu, Araci Kapun [uncertain], Escrevente Juramentada interina,
  que o lavrei." [Assinatura:] "x José Braz de Faria".
abstract: >-
  Civil death of José de Carvalho Guimarães Sobrinho, a farmer, who died 21
  December 1964 (registered 22 December) at Califórnia (Arapoti, PR), aged 63
  (implied born ~1901), "natural do Estado de Minas Gerais, São Francisco da
  Glória", married. It names his parents Francisco José de Carvalho Guimarães
  (P-0021) and Emerenciana Maria de Jesus (P-0022) — "ambos já falecidos" — hence
  José Sobrinho is a brother of Maria Aurora Guimarães (P-0011). Recorded as a
  documented child on family F-0008. The mother's given name reads "Emerenciana"
  (uncertain here; corroborated as "Emmerenciana Maria de Jesus" by CIV-0050).
  PROVEN. Not modelled as a person entity; no event created. Private record. The
  declarant was José Braz de Faria (relationship not stated); the death
  certificate was signed by Dr. Fauad [uncertain] E. M. Salomão; he died at home
  in the Bairro Uaraijal [uncertain]. He was civilly married to Felisberta Nunes
  de Carvalho and left eleven children (ten of age, one minor; not named) and
  property to be inventoried.
abstract_pt: >-
  Óbito civil de José de Carvalho Guimarães Sobrinho, lavrador, falecido em 21 de
  dezembro de 1964 (registrado em 22 de dezembro) em Califórnia (Arapoti, PR), com
  63 anos (nascido ~1901), "natural do Estado de Minas Gerais, São Francisco da
  Glória", casado. Nomeia seus pais Francisco José de Carvalho Guimarães (P-0021)
  e Emerenciana Maria de Jesus (P-0022) — "ambos já falecidos" — portanto José
  Sobrinho é irmão de Maria Aurora Guimarães (P-0011). Registrado como filho
  documentado na família F-0008. O nome da mãe lê-se "Emerenciana" (incerto aqui;
  corroborado como "Emmerenciana Maria de Jesus" por CIV-0050). PROVADO. Não
  modelado como entidade pessoa; sem evento criado. Registro privado. O
  declarante foi José Braz de Faria (parentesco não declarado); o atestado de
  óbito foi firmado pelo Dr. Fauad [incerto] E. M. Salomão; faleceu em seu
  domicílio no Bairro Uaraijal [incerto]. Era casado civilmente com Felisberta
  Nunes de Carvalho e deixou onze filhos (dez maiores e um menor; não nomeados) e
  bens a inventariar.
reliability:
  assessment: >-
    Direct primary for the death; the parents and the age/birthplace are
    informant-reported (hence information_quality mixed). It names both parents of
    the deceased, placing José Sobrinho as a child of Francisco José de Carvalho
    Guimarães × Emerenciana Maria de Jesus (F-0008).
  informant: >-
    José Braz de Faria (relationship to the deceased not stated), who exhibited
    the death certificate signed by Dr. Fauad [uncertain] E. M. Salomão,
    Califórnia (Arapoti), 22 December 1964.
  limitations: >-
    Informant-reported filiation and age. The mother's given name ("Emerenciana")
    is uncertain on this handwritten act (corroborated by CIV-0050). No government
    identity numbers appear. The eleven children are not named in the act. Two
    earlier misreadings were corrected from the image on 2026-10-08: the hour is
    "às treze horas" (not "três"), and the act says "Deixou bens a inventariar"
    (not "Não tem bens a inventariar").
