transcription: >-
  [Nascimento nº 20.525. Eunir. Somente este assento é transcrito; os demais
  assentos da folha referem-se a terceiros e são omitidos.] Aos vinte e quatro
  dias do mez de Maio de mil novecentos e vinte e quatro, neste Districto de São
  João Baptista, Município de Nova Friburgo, Estado do Rio de Janeiro, em meu
  cartorio compareceu João Gonçalves Bohrer, brazileiro, lavrador, residente no
  Morro do [illegible], e perante as testemunhas adeante nomeados e assignados,
  declarou: Que no dia dezesete do corrente mez, ás vinte e duas horas e trinta
  minutos, na casa de sua residencia nasceu uma criança do sexo masculino, de
  côr branca, que se chamará "Eunir", filho legitimo delle declarante e de
  Celina Bohrer, natural deste Districto, e casados civilmente neste Município.
  Netto paterno de Valentim Martinho Bohrer e de Carolina Bohrer, e materno de
  Joaquim José Bohrer e de Lucinda Ferreira Bohrer, já fallecidos. Do que para
  constar, fiz este termo que depois de lido assignam commigo o declarante e as
  testemunhas Antonio da Silva Brandão e Olympio de Carvalho. Eu, José Alves Pimentel, Escrivão de Paz, o escrevi. [assinaturas:] José Alves Pimentel; João Gonçalves Bohrer; Antonio da Silva Brandão; Olympio
  de Carvalho.
abstract: >-
  The 1924 Nova Friburgo birth registration of Eunir Bohrer, declared by the
  father João Gonçalves Bohrer (P-0014). The mother, Celina Bohrer (P-0015), is
  recorded as "natural deste Districto" (born in Nova Friburgo, RJ). It names both
  grandparent couples — paternal Valentim Martinho Bohrer + Carolina Bohrer,
  maternal Joaquim José Bohrer + Lucinda Ferreira Bohrer (deceased) — corroborating
  the parentage of P-0014 and P-0015 and fixing Celina's origin as Nova Friburgo.
abstract_pt: >-
  O registro de nascimento de 1924, em Nova Friburgo, de Eunir Bohrer, declarado
  pelo pai João Gonçalves Bohrer (P-0014). A mãe, Celina Bohrer (P-0015), é
  registrada como "natural deste Districto" (nascida em Nova Friburgo, RJ).
  Nomeia os dois casais de avós — paternos Valentim Martinho Bohrer + Carolina
  Bohrer, maternos Joaquim José Bohrer + Lucinda Ferreira Bohrer (falecidos) —
  corroborando a filiação de P-0014 e P-0015 e fixando a origem de Celina como
  Nova Friburgo.
reliability:
  assessment: >-
    Original civil-register evidence; the informant is the father, João Gonçalves
    Bohrer, giving primary knowledge of his own and (as her husband) his wife's
    parents. Indirect for our ancestors because the record's subject is their
    child, Eunir.
  informant: The father, João Gonçalves Bohrer.
  limitations: >-
    The page carries other, unrelated birth entries. Eunir (the child, a sibling
    of Iris P-0007) is a collateral person and is not modelled as an entity.
