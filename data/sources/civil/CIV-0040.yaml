  nomeado como "filho de João Gonçalves Borher e de Celina Borher" (P-0014 × P-0015), ou seja, irmão de
  Iris Bohrer Muniz (P-0007). Irmão PROVEN. O assento declara que deixou seis filhos (não nomeados).
