  árvore do FamilySearch é provável duplicata deste Ivanyr (a coleção tem apenas um filho do casal
  nascido por volta de 1930). Privado (o declarante, Wilson Cabral Borher, pode estar vivo); seu número
  de documento de identidade é omitido.
