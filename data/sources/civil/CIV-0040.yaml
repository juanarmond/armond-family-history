transcription: >-
  [Assento de óbito nº 16.925, Livro C nº 80, pág. 156, Registro Civil de Barra Mansa. O número de
  documento de identidade do declarante é omitido por privacidade.] "Em vinte e cinco de agosto de mil
  novecentos e noventa e dois, nesta cidade de Barra Mansa, Estado do Rio de Janeiro, compareceu neste
  cartório [declarante — Wilson Cabral Borher, documento de identidade omitido], profissão eletricista,
  residente em Volta Redonda, neste Estado, e exibindo atestado de óbito firmado pela Dra. Luciene
  Aparecida Ribeiro de Souza, dando como causa da morte insuficiência respiratória aguda, acidente
  vascular encefálico hemorrágico, carcinomatose, e declarou que, no dia vinte e quatro de agosto de
  mil novecentos e noventa e dois, às vinte e duas horas e dez minutos, na Casa de Saúde Santa Maria,
  nesta cidade, faleceu 'IVANYR BORHER', do sexo masculino, profissão aposentado, natural do Estado de
  Minas Gerais, e residente à Rua Visconde Cunha Bueno nº 63, Santo Agostinho, em Volta Redonda, neste
  Estado, com sessenta e dois anos de idade, estado civil separado judicialmente, filho de JOÃO
  GONÇALVES BORHER e de CELINA BORHER, falecidos, naturais do Estado de Minas Gerais. Não deixou bens.
  Deixou seis filhos. Era eleitor. O sepultamento será feito no Cemitério Municipal situado em Volta
  Redonda … Eu, Maria Aparecida de Souza Reis, Oficial do Registro Civil, mandei datilografar."
abstract: >-
  Original civil death register recording the death of Ivanyr Borher on 24 August 1992 at the Casa de
  Saúde Santa Maria, Barra Mansa (RJ), aged 62 (→ b. ~1930), natural of Minas Gerais, judicially
  separated, retired — named as "filho de João Gonçalves Borher e de Celina Borher" (P-0014 × P-0015),
  i.e. a brother of Iris Bohrer Muniz (P-0007). PROVEN sibling. The act states he left six children
  (unnamed). Recorded as a documented_child on F-0005; no event (Ivanyr is not modelled). A separate
  FS-tree "Ivan Bohrer" is a probable duplicate of this Ivanyr (the collection holds only one ~1930-born
  son of the couple). Private (the declarant, Wilson Cabral Borher, may be living); his identity-document
  number is redacted.
abstract_pt: >-
