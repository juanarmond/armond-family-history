transcription: >-
  [Página 1 — certidão de inteiro teor, datilografada.] REPÚBLICA FEDERATIVA DO
  BRASIL. REGISTRO CIVIL DAS PESSOAS NATURAIS. Eu, LUIZ DE SOUZA LIMA, Escrivão de
  Paz e Oficial do 1º Registro Civil do Distrito da Cidade de Carangola, Estado de
  Minas Gerais, Brasil, na forma da lei, etc. CERTIDÃO DE INTEIRO TEOR. MATRÍCULA:
  0511100155 1916 2 00008 118 0000062 02. Certifico que dos arquivos do Cartório a
  meu cargo, consta o inteiro teor fielmente reproduzido, que vai por mim assinado,
  numerado e rubricado com a rubrica [rubrica], referente ao livro 8 B, folha 118 e
  termo 62, onde contém o registro de Casamento de DEOCLECIANO MUNIZ BITTENCOURT e
  LUIZA FERNANDES DE AZEVEDO ,, reproduzida de acordo com o artigo 19 da Lei
  6.015/1973, a Lei de Registros Públicos, normatizada pelo artigo 92 do Provimento
  nº 260/CGJ/2013, o Código de Normas da Corregedoria Geral de Justiça do Estado de
  Minas Gerais. Contem 3 (três) laudas. 1º OFICIO DO REGISTRO CIVIL DAS PESSOAS
  NATURAIS DE CARANGOLA. Oficial: LUIZ DE SOUZA LIMA. Rua Silva Jardim, 27-B Centro.
  Carangola-MG. (32)3741-3050. O conteúdo da certidão é verdadeiro. Dou fé.
  Carangola-MG, 15 de julho de 2019. [assinatura] Assinatura do Oficial/Substituto.
  Luiz de Souza Lima, Oficial de Registro Civil das Pessoas Naturais interino. Sheila
  Jaqueline Pereira, Escrevente. Rua Silva Jardim, 27-B-Centro. Tel: (32) 3741-3050.
  36800-000 – Carangola – MG. PODER JUDICIÁRIO - TJMG. CORREGEDORIA - GERAL DE
  JUSTIÇA. 1º OFICIO DO REGISTRO CIVIL DAS PESSOAS NATURAIS DE CARANGOLA - MG. Selo
  Digital: CXQ18429 - Cod. Seg: 4700.2041.4151.2858 - Cod. e Quantidade do(s) ato(s)
  Praticado(s): 1 (7803) - Emol.: R$ 65,91 - Tx.Judic.: R$ 13,31 - Total: R$ 79,22.
  Consulte a validade deste Selo no site: https://selos.tjmg.jus.br

  [Páginas 2–3 — fotografias do assento manuscrito de 1916, esmaecidas; leitura
  cursiva de baixo contraste.] Aos vinte e um dias do mez de outubro do anno de mil
  novecentos e dezeseis, nesta cidade do Carangola, Estado de [...] dito anno digo,
  Estado de Minas Geraes e Republica dos Estados Unidos do Brasil, em cartorio no
  Forum ás onze horas presente o senhor Major Americo de Lacerda, Primeiro Juiz digo,
  Juiz de Paz e privativo dos casamentos, com migo escrivão e official do Registro
  Civil de hoc abaixo assignado, presente Senhores, digo, presente as testemunhas
  senhores: Justino Ribeiro Rodrigues e Antonio Theodoro de Souza, após a leitura do
  artigo setimo e seus paragraphos do decreto numero cento e oitenta e um de mil oito
  centos e noventa, depois de preenchidas as formalidades legaes, receberam-se em
  matrimonio o cidadão Deocleciano Muniz Bittencourt e Dona Luiza Fernandes de
  Azevedo, ambos solteiros e residentes neste districto; elle contrahente com vinte e
  quatro annos de edade, lavrador, natural de Sapucaya, Estado Rio de Janeiro, filho
  legitimo de João Muniz Bittencourt, já fallecido neste districto e de Dona Suzana
  Ritta Brandão, residente neste districto; ella contrahente com dezoito annos de
  edade, de profissão domestica, e natural de Bom Jesus de Cachoeira Alegre, Municipio
  de S. Paulo do Muriahé, residente, filha legitima de Sebastião [uncertain: Manoel]
  de Azevedo e Dona Thereza Fernandes de Azevedo, esta residente neste districto e
  aquelle já fallecido. Os contrahentes neste acto declararam e provaram não serem
  parentes em grau prohibido e não existir entre elles impedimento algum que os
  inhibão de casar-se um com o outro e que casam-se pelo regimen de communhão de bens.
  Em firmeza do que lavrei este termo que lido e achado conforme assigno o [uncertain:
  Meritissimo] Juiz assignando a rogo d[a] contrahente o senhor José Augusto
  [uncertain: Soares] Pinheiro, por aquella não saber ler nem escrever, as testemunhas
  já mencionadas e mais pessoas que quizerem assignar. Eu Dario Gonçalves, escrivão e
  Official do Registro Civil ad-hoc que o escrevi e assigno.

  [Assinaturas reproduzidas, leitura parcial/incerta:] Americo de Lacerda;
  Deocleciano Muniz Bittencourt; José Augusto [uncertain: Tavares] Pinheiro; Justino
  Ribeiro Rodrigues, com 44 annos de idade, [uncertain: casado], lavrador, residente
  neste distrito; Antonio Theodoro de Souza, com 30 annos de idade, [uncertain:
  lavrador,] residente neste districto; [demais nomes ao pé, de leitura incerta:]
  José Batista Quaresma [uncertain]; Pastor Lopes Barbosa [uncertain]; Leandro Alves
  Hyppolito [uncertain]; Dario Gonçalves.
abstract: >-
  A three-page full-content certificate issued on 15 July 2019 reproduces the
  1916 marriage entry for Deocleciano Muniz Bittencourt and Luiza Fernandes de
  Azevedo in book 8-B, page 118, record 62 of the Carangola civil registry. It
  independently identifies the same marriage record already represented by
  CIV-0001 while preserving a longer reproduction of the underlying entry.
abstract_pt: >-
  Uma certidão de inteiro teor de três páginas, emitida em 15 de julho de 2019,
  reproduz o assento de casamento de 1916 de Deocleciano Muniz Bittencourt e
  Luiza Fernandes de Azevedo no livro 8-B, folha 118, termo 62 do registro
  civil de Carangola. Identifica de forma independente o mesmo registro de
  casamento já representado por CIV-0001, preservando uma reprodução mais longa
  do assento subjacente.
reliability:
  assessment: >-
    Direct derivative evidence for the marriage event. The 2019 registrar's
    certificate reproduces the 1916 entry and supplies the archival locator.
  informant: The spouses' declarations as reproduced from the 1916 register.
  limitations: >-
    This is a modern certified derivative rather than the register volume
    itself. The three authorised original-upload photographs are skewed and
    parts of the handwritten reproduction are low contrast; no uncertain text
    has been supplied from the collaborative tree.
