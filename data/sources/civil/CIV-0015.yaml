transcription: >-
  [Óbito nº 25.651.] "Aos vinte de fevereiro de mil novecentos e setenta e sete
  ... [declarou] que no dia dezenove ... na Casa de Saúde São José, nesta cidade,
  faleceu Celina Bohrer, do sexo feminino, cor branca, com setenta e sete anos de
  idade, natural dêste Estado, estado civil viúva, profissão doméstica, filha de
  Joaquim José Bohrer, falecido ... e de Lucinda Ferreira da Silva Bohrer,
  falecida ... Causa mortis: blastoma gástrico ... deixou quatorze filhos." The
  declarant appeared "no impedimento ocasional de membros da família" (a
  non-family functionary); his details are omitted for privacy.
abstract: >-
  The original Volta Redonda civil death register records the death of Celina
  Bohrer (P-0015) on 19 February 1977, aged 77 (so born c.1900), widow, and names
  her parents as Joaquim José Bohrer (deceased) and Lucinda Ferreira da Silva
  Bohrer (deceased). Registered here as "Celina" (the 1949 marriage, CIV-0004,
  used "Selina").
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly states her parents as secondary (informant-reported) information.
  informant: >-
    A non-family declarant appearing in the occasional absence of the deceased's
    relatives (name withheld here for privacy).
  limitations: >-
    A faint FamilySearch preview watermarked "SEM VALOR LEGAL"; the register page
    also carries an unrelated adjacent death entry (an unrelated infant). The
    parent names are informant-reported at death.
