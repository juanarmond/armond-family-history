transcription: >-
  ÓBITO. NÚMERO 25651. [fl. 154; formulário impresso preenchido à mão; imagem
  com marca "SEM VALOR LEGAL". Somente este assento é transcrito; o assento
  adjacente refere-se a terceiro (um menor sem relação) e é omitido. Os dados do
  declarante, terceiro sem relação de parentesco, são transcritos na
  íntegra.] Aos vinte de fevereiro de mil novecentos e setenta e sete, nesta
  Cidade e em meu Cartório, compareceu José Davi de Oliveira, nacionalidade
  brasileira, com 97 anos de idade, profissão mecânico, residente à
  Av. Savio Gama, 888, nesta cidade, e exibindo atestado de ÓBITO
  firmado pelo médico Gilson Ribeiro de Carvalho, declarou: Que no dia dezenove do corrente
  mês e ano, às 18 horas [em branco] minutos, na Casa de Saúde São José, nesta
  cidade, faleceu Celina Bohrer, do sexo feminino, cor branca, com setenta e
  sete anos de idade, natural dêste Estado, estado civil viúva, profissão
  doméstica, residente na rua Paulo Mendes, 205, nesta cidade,
  filha de Joaquim José Bohrer, falecido, natural [em branco], residente [em
  branco], e de Lucinda Ferreira da Silva Bohrer, falecida, natural [em branco],
  residente [em branco]. Causa mortis: Blastoma gástrico. Vai ser sepultado no
  Cemitério desta cidade. Observações: A falecida não deixou bens nem
  testamento, deixou quatorze filhos. O declarante compareceu no impedimento
  ocasional de membros da família da falecida. Para constar lavrei este termo
  que, lido e achado conforme, assino. Eu, [assinatura] Escrevente Juramentado,
  o escrevi. Eu, [assinatura] Oficial do Registro Civil, subscrevo e assino.
  [assinatura do declarante] José Davi de Oliveira.
abstract: >-
  The original Volta Redonda civil death register records the death of Celina
  Bohrer (P-0015) on 19 February 1977, aged 77 (so born c.1900), widow, and names
  her parents as Joaquim José Bohrer (deceased) and Lucinda Ferreira da Silva
  Bohrer (deceased). Registered here as "Celina" (the 1949 marriage, CIV-0004,
  used "Selina").
abstract_pt: >-
  O registro civil de óbito original de Volta Redonda registra o óbito de
  Celina Bohrer (P-0015) em 19 de fevereiro de 1977, aos 77 anos (portanto
  nascida por volta de 1900), viúva, e nomeia seus pais como Joaquim José Bohrer
  (falecido) e Lucinda Ferreira da Silva Bohrer (falecida). Registrada aqui como
  "Celina" (o casamento de 1949, CIV-0004, usou "Selina").
reliability:
  assessment: >-
    Original civil-register evidence: direct for the death, date and age, and it
    directly states her parents as secondary (informant-reported) information.
  informant: >-
    José Davi de Oliveira, a non-family declarant appearing in the occasional
    absence of the deceased's relatives.
  limitations: >-
    The register page also carries an unrelated adjacent death entry (an
    unrelated infant). The parent names are informant-reported at death.
