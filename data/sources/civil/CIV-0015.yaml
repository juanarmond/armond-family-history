notes:
- text: >-
    The record spells the name "Celina"; the 1949 marriage (CIV-0004) recorded
    "Selina". Both variants are preserved (see P-0015). Names her parents
    (Joaquim José Bohrer + Lucinda Ferreira da Silva); corroborated by Eunir
    Bohrer's 1924 birth (CIV-0016). "Viúva" is consistent with João Gonçalves
    Bohrer's 1970 death (CIV-0014).
