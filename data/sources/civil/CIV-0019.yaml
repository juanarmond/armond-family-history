- text: >-
    Linchpin of the Bohrer maternal-line extension: this single record names both
    of Celina's grandparent couples. It corroborates Joaquim José × Lucinda
    (already in F-0014) and establishes families F-0016 (Francisco José Bohrer ×
    Roza Eugenia de Lemos) and F-0017 (Antonio da Silva Ferreira × Maria Joanna da
