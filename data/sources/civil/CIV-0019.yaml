transcription: >-
  [Nascimento nº 569.] "Aos vinte e cinco dias do mez de junho de mil oito centos
  e noventa, nesta Freguezia de São João Baptista, Município de Nova Friburgo,
  Estado do Rio de Janeiro, em meu cartorio compareceu Guilherme Samuel Bohrer,
  morador no Alto da Serra desta Freguezia, distante deste cartorio tres leguas, e
  perante as testemunhas abaixo nomeadas e assignadas, declarou: Que no dia
  dezesete do corrente mez, ás seis horas da manhã, na casa de residencia de seu
  irmão Joaquim José Bohrer nasceu uma criança do sexo masculino, filho legítimo
  de seu dito irmão Joaquim José Bohrer, negociante, natural desta Freguezia,
  morador no dito Alto da Serra, e sua mulher Lucinda Ferreira da Silva Bohrer,
  natural desta Freguezia, moradora no dito Alto da Serra, [uncertain: casados na
  Igreja Matriz desta Freguezia], a qual na pia baptismal receberá o nome de
  Alberto, neto paterno de Francisco José Bohrer já falecido e de sua mulher Roza
  Eugenia de Lemos Bohrer, e materno de Antonio da Silva Ferreira e de sua mulher
  Maria Joanna da Silva Ferreira, e que faz esta declaração por achar-se o seu dito
  irmão ausente. De que para constar lavrei este termo que depois de lido comigo
  assignaram o declarante e as testemunhas Francisco Ignacio da Silva, jornaleiro,
  e André Justino do Nascimento, caçeiro, moradores nesta Freguezia. Eu Carlos
  Miguel Noel, escrivão de Paz o escrevi."
abstract: >-
  1890 Nova Friburgo civil birth of Alberto Bohrer, declared by his paternal uncle
  Guilherme Samuel Bohrer because the father was absent. It names the parents
  Joaquim José Bohrer (P-0030, negociante, "natural desta Freguezia") and Lucinda
  Ferreira da Silva Bohrer (P-0031, "natural desta Freguezia"), states they were
  married in the Igreja Matriz of Nova Friburgo, and names both grandparent
  couples: paternal Francisco José Bohrer (deceased) + Roza Eugenia de Lemos, and
  maternal Antonio da Silva Ferreira + Maria Joanna da Silva Ferreira.
reliability:
  assessment: >-
    Original civil-register evidence. Direct for Alberto's birth; indirect for our
    ancestors, since it names Joaquim José's and Lucinda's parents as the child's
    grandparents. The informant is Joaquim José's own brother, so he has primary
    knowledge of the paternal grandparents.
  informant: >-
    Guilherme Samuel Bohrer, the child's paternal uncle (brother of Joaquim José
    Bohrer), declaring in the father's absence.
  limitations: >-
    Alberto (the subject) is a collateral sibling of Celina (P-0015) and is not
    modelled as an entity. The maternal grandparents are named without their own
    origins. The register page also carries unrelated adjacent entries (a "Boj"
    family and a nº 570 birth in another family).
