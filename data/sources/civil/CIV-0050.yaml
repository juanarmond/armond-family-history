transcription: >-
  [Registro Civil de Jacarezinho (PR), livro de óbitos, fl.174, termo nº 2207,
  1982 (datilografado). Nomes de terceiros possivelmente vivos e o número do
  registro de nascimento omitidos por privacidade.] "Em treze — 13 — de abril de
  mil novecentos e oitenta e dois, nesta cidade e comarca de Jacarezinho — Pr., em
  cartório, compareceu [declarante — omitido: privacidade], aposentado, casado,
  brasileiro, e exibindo atestado de óbito firmado pelo médico [omitido] — aquí
  residentes, dando como causa de morte: síncope cardíaca. Declarou que no dia de
  hoje, à 1 hora, nesta cidade, na porta da Catedral, faleceu Sebastião José de
  Carvalho Guimarães, do sexo masculino, de cor branca, profissão lavrador,
  natural de S. Francisco do Gloria — MG., domiciliado e residente no Asilo S.
  Vicente de Paula, nesta cidade, com 72 anos de idade, estado civil solteiro,
  filho de Francisco José de Carvalho Guimarães e Emmerenciana Maria de Jesus. O
  sepultamento será feito no cemitério local. Não era eleitor. Não deixa bens.
  Registrado onde nasceu, sob nº [omitido — privacidade], fls. 23 do livro 4-A. Do
  que faço este termo que lido e achado conforme vai assinado pelo declarante…"
abstract: >-
  Civil death of Sebastião José de Carvalho Guimarães, a farmer, who died 13 April
  1982 at Jacarezinho (PR), aged 72 (implied born ~1910), single, "natural de São
  Francisco do Glória, MG", resident of the São Vicente de Paula asylum. It names
  his parents Francisco José de Carvalho Guimarães (P-0021) and Emmerenciana Maria
  de Jesus (P-0022) — hence Sebastião is a brother of Maria Aurora Guimarães
  (P-0011) and of José de Carvalho Guimarães Sobrinho (CIV-0049). Recorded as a
  documented child on family F-0008. It confirms the mother's full name
  "Emmerenciana Maria de Jesus" (uncertain on the 1964 act CIV-0049). PROVEN. Not
  modelled as a person entity; no event created. Private record — the declarant,
  the physician, the registrar and the birth-record number are withheld for
  privacy.
abstract_pt: >-
  Óbito civil de Sebastião José de Carvalho Guimarães, lavrador, falecido em 13 de
  abril de 1982 em Jacarezinho (PR), com 72 anos (nascido ~1910), solteiro,
  "natural de São Francisco do Glória, MG", residente no Asilo S. Vicente de
  Paula. Nomeia seus pais Francisco José de Carvalho Guimarães (P-0021) e
  Emmerenciana Maria de Jesus (P-0022) — portanto Sebastião é irmão de Maria
  Aurora Guimarães (P-0011) e de José de Carvalho Guimarães Sobrinho (CIV-0049).
  Registrado como filho documentado na família F-0008. Confirma o nome completo da
  mãe "Emmerenciana Maria de Jesus" (incerto no ato de 1964, CIV-0049). PROVADO.
  Não modelado como entidade pessoa; sem evento criado. Registro privado — o
  declarante, o médico, a oficiala e o número do registro de nascimento são
  omitidos por privacidade.
