transcription: >-
  [Verbatim transcription of a densely typewritten Italian civil-register
  entry (itself a transcription into Italian of the Canadian marriage record).
  Runs of dashes ("---") reproduce the typewriter filler dashes; their exact
  length is not significant and is not counted here. Original spelling and
  typographic errors are preserved (sic). Text set in [brackets] is editorial.]

  [Centred title:] ATTI DI MATRIMONIO - Parte II - Serie C

  [LEFT COLUMN — the register entry:]

  Oggi ventidue--- del mese di ottobre--- dell'anno duemilasette--- alle ore
  otto--- e minuti trenta---, nella Casa Comunale

  Io sottoscritto CATTANEO GABRIELA---, ISTRUTTORE AMM.VO---,Ufficiale dello
  Stato Civile del Comune di CARONNO PERTUSELLA---,PER DELEGAZIONE AVUTA--- ho
  ricevuto da BEVILACQUA ARAUJO VANESSA,nata a Vinhedo (BR) il 15.11.1980 a
  seguito- del riconoscimento della Cittadinanza Italiana "Jure Sanguinis" in
  data 20/10/2007--- la richiesta--- di trascrivere il proprio atto di
  matrimonio---

  Aderendo a tale richiesta provvedo alla trascrizione per intero--- del
  documento come segue: ---CONSOLATO GENERALE D'ITALIA--- ---Dichiarazione
  Consolare-

  Oggetto:ARMOND Juan Carlos Muniz e BEVILACQUA Vanessa Araujo. Licenza di
  matrimonio.-

  Si dichiara che la presente traduzione in italino [sic],composta di n.03
  (tre) fogli,non--- eseguita da questo Consolato Generale,corrisponde al testo
  originale in lingua ingle- se ad essa allegato in n.01 (uno) foglio,in copia
  autenticata da questo Ufficio.Segue sul retro del documento originale,la
  legalizzazione della firma del Vice ufficiale di Stato Civile dell'Ontario
  (Canada).---

  Toronto,16 aprile 2007--- ---p.IL CONSOLE GENERALE--- ---L'Impiegata
  Addetta--- ---Giuseppa Spedicato---

  Segue timbro con pagamento degli emolumenti.--- (Stemma della provincia
  dell'Ontario) Ufficio dell'Ufficiale Generale di Stato Civile ---Copia
  fotostatica autenticata conforme di documento agli atti presso l'Ufficio
  dell'Ufficiale Generale dello Stato Civile dell'Ontario (Canada)---

  Numero della registrazione:2003 0400425--- [sic; CIV-0009 shows this
  registration number as 2003 040425]

  Pag 1 di 1---

  Certificato numero:P 026742---

  Data di emissione:13 gennaio 2005---

  Numero del fascicolo:04406366-01-3---

  Ministero dei Servizi per il Consumatore e l'Impresa--- Ufficio dell'Ufficiale
  Generale di Stato Civile (Stemma della Provincia dell'Ontario) Ontario---

  Licenza di matrimonio--- Licenza n.E250832---

  Il presente modulo e un documento legale a carattere permanente e puo'essere
  usato--- esclusivamente pre [sic] registrare un matrimonio celebrato in
  Ontario.---

  Parte 1 Da completarsi a cura dell'ufficio che emette la licenza---

  1-Data di emissione della licenza--- (giorno/mese/anno)--- 07/07/2003---

  2.Comune di emissione della licenza--- City di Toronto---

  3. Nome di chi emette la licenza o di chi ne fa le veci--- Irena
  Kuznik-Perez---

  4.Firma di chi emette la licenza o di chi ne fa le veci--- (Firma)---

  5.Luogo proposto per la celebrazione del matrimonio (Comune)--- Toronto---

  6.Data proposta del matrimonio (giorno/mese/anno) Deve cadere entro 9 mesi
  dalla data di emissione--- 16/08/2003---

  Parte 2 Dichiarazione giurata sul matrimonio (modello 4)

  Dati relativi allo sposo--- Dati relativi alla sposa---

  7.Cognome--- Armond--- | 24.Ultimo nome legalmente riconosciuto prima del
  presente matrimonio--- Bevilacqua---

  8.Nomi (inclusi quelli secondari)--- Juan Carlos Muniz--- | 25 Nomi (inclusi
  quelli secondari)--- Vanessa Araujo---

  9. Stato Civile--- Mai coniugato--- | 26.Stato Civile: Mai coniugata---

  10.Eta':21--- | 27.Eta':22---

  11.Provincia in cui e'nato lo sposo--- Brasile--- | 28.Provincia in cui e'
  nata la sposa--- Brasile---

  12.Nome del padre--- ARMOND Luis Carlos Igracio--- | 29--- BEVILACQUA
  Vanderlei---

  13 Nome della madre--- MUNIZ Lucinea A.--- | 30 Nome della madre--- Araujo
  Walkiria---

  14.Nome completo del richiedente--- Juan Carlos Muniz Armond--- e--- Nome
  completo della richiedente--- Vanessa Araujo Bevilacqua---

  dichiarano sotto giuramento quanto segue:Credo in fede che non vi sia
  affinita',consanguineita',matrimonio precedente o altra causa di legge o
  impedimento legale che impediscano o ostacolino la celebrazione del
  matrimonio,e che i dati qui dichiarati sia no,al meglio di quanto a nostra
  conoscenza,delle informazioni possedute e di quanto--- riteniamo,--- mia o
  nostra.--- veritieri in ogni particolare.---

  Giurato/affermato solennemente davanti a me,nella City di Toronto,Provincia
  dell'Ontario addi' 7 luglio 2003---

  (Firma)--- (Firma)--- Firma del richiedente --- Firma della corichiedente--
  Firma di chi emette la licenza o di chi ne fa le veci--- (Firma)---

  15.Comune--- Toronto--- 31 Provincia--- Ontario--- 16 Comune--- Toronto--- 32
  Provincia--- Ontario---

  Parte 3 Dichiarazione di matrimonio - Da completarsi dopo la celebrazione del
  matrimonio-

  17 Luogo del matrimonio--- TORONTO,ONTARIO--- | 33 Data del matrimonio---
  16.8.2003---

  18 Firma dello sposo--- (Firma)--- | 34 Firma della sposa--- (Firma)---

  19 Firma del(la) testimone--- | 35 Firma del (la) testimone---

  Con la firma apposta qui sotto,certifico che il matrimonio fra lo sposo e la
  sposa--- menzionati nella licenza di matrimonio e'stato celebrato nella data
  e nel luogo sopra indicati.---

  20 Firma del celebrante--- WAGNER DA COSTA--- | 36 Status del celebrante:
  Ministro del Culto---

  21 Numero di registrazione del celebrante--- 52880- | 37 Nome della
  confessione religiosa--- ASSEMBLY OF GOD (ASSEMBLEA DI DIO)---

  Per uso esclusivo dell'Ufficiale Generale di Stato Civile: Sono soddisfatta
  della correttezza della presente dichiarazione e registro il matrimonio
  relativo.---

  Firma:(Judith M.Hartman)--- Data 15 settembre 2003.---

  I dati personali contenuti nel presente modulo sono raccolti in base ai
  poteri del--- Marriage Act(Legge sul matrimonio),revisione Leggi dell'Ontario
  1980,capitolo M.3,e-- saranno usati per determinare se emmettere [sic] la
  licenza di matrimonio,registrare il matrimonio,fornire copie
  certificate,estratti,certificati,notizie di ricerche,fotocopie, e per fini
  statistici,di ricerca,medici,per l'applicazione della legge,adozioni e co-
  municazione di dati sulle adozioni.I quesiti in merito alla raccolta devono
  essere indirizzati all'Ufficiale genrale [sic] aggiunto di Stato Civile.---
  COPIA CERTIFICATA NON VALIDA SE NON INCLUDE TUTTE LE PAGINE. Firmato Judith
  M.Hartman -Ufficiale Generale Agghiunto [sic] di Stato Civile---

  Segue(sigillo in rilievo:L'Ufficiale Generale di Stato Civile ONTARIO)---

  Segue firma del traduttore GIOVANNI SCAROLA  effettuata a Toronto in data
  13.4.2007.-

  Il presente atto viene letto all'intervenuta,la quale insieme a me, lo
  sottoscrive.---

  Dopo di che, ho munito del mio visto ed inserito nel volume  degli allegati a
  questo registro la richiesta di trascrizione e la copia del documento
  trascritto.--- [signature] L'UFFICIALE DELLO STATO CIVILE [signature]

  [left margin, printed vertically, uncertain: 20910]

  [RIGHT COLUMN / MARGIN:]

  NUMERO   30

  ARMOND JUAN CARLOS MUNIZ

  BEVILACQUA VANESSA ARAUJO

  [marginal printed note, left edge clipped:] *Ai sensi dell'art. 98
