transcription: >-
  [Assento nº 9890, folha 315 — lado direito de uma folha dupla (páginas 314–315),
  com marca d'água "SEM VALOR LEGAL"; a entrada 9889 na página 314 é um óbito não
  relacionado. Manuscrito de baixo contraste.]

  N.o 9890. Tal. 49. Pg. 90. Aos DOIS dias do mês de Novembro de mil novecentos e
  cincoenta e sete, neste Distrito Volta Redonda, Município de Volta Redonda, Comarca
  [em branco], Estado de Rio de Janeiro, em cartório compareceu João Malheiros, maior,
  comerciário, residente e domiciliado em nesta cidade, e exibindo um atestado de
  óbito firmado pelo Dr. João Batista Ferreira N[eto] [uncertain], declarou: Que no
  dia Primeiro, às Dezesseis horas, em domicílio nesta cidade, faleceu vitimado por
  "Arteriosclerose Generalizada", conforme declara o referido atestado que fica
  arquivado neste Cartório, Aristão Ferreira Amaral, dito Armond [the given name is
  written idiosyncratically and the "Amaral, dito Armond" alias clause reading remains
  uncertain], do sexo masculino, de côr branca, natural de Estado de Minas Gerais,
  residente em nesta cidade, domiciliado em nesta cidade, de profissão padeiro, com
  setenta e oito anos de idade, filho de Simplicio [uncertain: Armand], de profissão
  [em branco], falecido, natural de Ignorado, residente e domiciliado em falecido, e
  de dona Eliza Ferreira [uncertain: Armand], de profissão [em branco], falecida,
  natural de [uncertain: Ignorada], residente e domiciliada em falecida. O declarante
  age no impedimento ocasional de membros da família do falecido e [uncertain:
  forneceu] dados com referência ao mesmo. O falecido [em branco] deixa bens a
  inventariar; vai ser sepultado no Cemitério público desta cidade. Para constar
  lavrei êste têrmo que, lido e achado conforme, vai assinado pelo declarante
  [assinaturas do escrevente e do oficial, ilegíveis] e [assinatura do declarante:
  João Malheiros].
abstract: >-
  The original Volta Redonda civil death register records that Aristão
  Ferreira Armond died on 1 November 1957, aged 78. It reports his parents as
  Simplicio Armand and Eliza Ferreira Armand. The entry was registered on 2
  November 1957 as number 9890 on page 315.
abstract_pt: >-
  O registro civil de óbito original de Volta Redonda registra que Aristão
  Ferreira Armond faleceu em 1 de novembro de 1957, aos 78 anos. Registra seus
  pais como Simplicio Armand e Eliza Ferreira Armand. O assento foi registrado
  em 2 de novembro de 1957 sob o número 9890 à folha 315.
reliability:
  assessment: >-
    Original civil-register evidence directly supports the death, date, age
    and identity. The parent names are secondary information reported at death
    but are directly stated in the record.
  informant: >-
    The declarant was João Malheiros, described as a commerciário, recorded as
    acting in the occasional absence of the deceased's family.
  limitations: >-
    The handwriting is low contrast and several fields remain unsafe to
    transcribe. The FamilySearch index badly mistranscribes Aristão's name as
    "Axstai Ferreira Armand Armand" and duplicates part of his mother's
    surname. The retained JPEG is FamilySearch's authorised `JPG Only`
    download from the original-image ARK.
