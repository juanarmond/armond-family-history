notes:
- text: >-
    Identity and event conclusions rely on the original register image, not
    the collaborative Family Tree profile or the malformed index name.
- text: >-
    The index reads "Simplicio Armand" and "Eliza Ferreira Armand Armand".
    The retained image supports one occurrence of Armand in the mother's name.
    Fuller forms such as Simplício Ferreira Armond and Elizia Balbina Toledo
    remain uncatalogued leads pending a closer record.
- text: >-
    The image contains medical, address and signature data and an unrelated
    death entry. Retain it only in this private repository.
- text: >-
    An owner-supplied alternate scan of the same entry 9890 (a two-page spread,
    pages 314-315, watermarked "SEM VALOR LEGAL") was reviewed and confirmed entry
    9890, but is not retained: the evidence model keeps one authoritative image per
    record, and the authorised FamilySearch JPG above remains the preservation
    image.
