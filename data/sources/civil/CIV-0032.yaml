transcription: >-
  [Registro Civil, Volta Redonda — Livro C-90, Folha 175, Termo 43.722.] "Aos 03 dias de
  julho de mil novecentos e noventa e seis, em Cartório, compareceu [o declarante — casado,
  aposentado, 65 anos; não familiar (impedimento ocasional de membros da família da
  falecida); dados de identificação e endereço omitidos], e exibindo atestado de óbito
  firmado pelo Doutor José Roberto Barroso Arantes, declarou: que no dia 03 de julho de
  1996 às 11 horas e 30 minutos, no Lar dos Velhinhos de Volta Redonda, faleceu LUCINDA
  BOHRER MOREIRA, nascida em 26/07/1909, sexo feminino, com 86 anos de idade, natural do
  Rio de Janeiro-RJ, estado civil viúva de Antonio Moreira, profissão do lar, filha de
  Joaquim José Bohrer e de Lucinda Ferreira da Silva Bohrer. Local do sepultamento:
  cemitério de Volta Redonda-RJ. Causa da morte: parada cardio-respiratória; demência
  senil. Deixa filhos? Não. Deixa bens? Não. Fez testamento? Não." [Documentos de
  identificação da falecida constam do registro; omitidos desta transcrição pública.]
abstract: >-
  Civil death of Lucinda Bohrer Moreira on 3 July 1996 at Volta Redonda, RJ, aged 86 (b.
  26 July 1909, Rio de Janeiro), widow of Antonio Moreira, leaving no children. Names her
  parents as Joaquim José Bohrer (P-0030) and Lucinda Ferreira da Silva Bohrer (P-0031) —
  i.e. Celina Bohrer's (P-0015) parents — making Lucinda a sister of Celina and the
  maternal aunt of Iris Bohrer Muniz (P-0007). A primary corroborating that couple.
  Recorded as a documented_child on F-0014.
abstract_pt: >-
  Óbito civil de Lucinda Bohrer Moreira em 3 de julho de 1996, em Volta Redonda, RJ, aos
  86 anos (n. 26 de julho de 1909, Rio de Janeiro), viúva de Antonio Moreira, sem filhos.
  Nomeia seus pais Joaquim José Bohrer (P-0030) e Lucinda Ferreira da Silva Bohrer
  (P-0031) — isto é, os pais de Celina Bohrer (P-0015) — tornando Lucinda irmã de Celina e
  tia materna de Iris Bohrer Muniz (P-0007). Primário que corrobora o casal. Registrada
  como documented_child em F-0014.
