transcription: >-
  REPÚBLICA FEDERATIVA DO BRASIL. REGISTRO CIVIL DAS PESSOAS NATURAIS. CERTIDÃO DE
  INTEIRO TEOR DE REGISTRO DE NASCIMENTO. JOÃO JOSÉ DE CARVALHO GUIMARÃES. MATRÍCULA:
  0424650155 1915 1 00004 023 0000038 91.

  Certifico e dou fé, que atendendo a pedido verbal de pessoa interessada, que revendo
  em meu poder e Cartório, os Livros de Nascimento, encontrei sob o n.º 38, do Livro
  n.º 4-A, às Folhas 23, o Registro que passa a ser aqui transcrito. Aos doze dias do
  mez de Outubro de mil novecentos e quinze, neste districto de São Francisco do
  Gloria, Municipio e Comarca do Carangola, Estado de Minas Geraes, em cartório
  compareceu Francisco José de Carvalho Guimarães e declarou que aproveitando o prazo
  concedido pelo decreto número dois mil oitocentos e oitenta e sete, de vinte e cinco
  de novembro do anno passado, vinha dar a registro os nascimentos de seus filhos
  seguintes: José de Carvalho Guimarães, nascido a oito de novembro de mil novecentos
  e um, às nove horas da manhã, Maria Amora Guimarães nascida a primeiro de janeiro de
  mil novecentos e quatro, às oito horas digo as cinco horas da manhã, Maria da
  Conceição Guimarães, nascida a oito de setembro de mil novecentos e seis, as seis
  horas da manhã, Sebastião José de Carvalho Guimarães, nascida a dois de junho de mil
  novecentos e nove, ao meio dia, JOÃO JOSÉ DE CARVALHO GUIMARÃES, nascido a uma hora
  da madrugada de dezeseis de dezembro de mil novecentos e doze, e Maria de Lourdes
  Guimarães, nascida a vinte e quatro de junho de mil novecentos e quinze as oito
  horas da noite. Todos nasceram na fazenda do Barroso deste Districto, em domicilio e
  são filhos legítimos do declarante, natural da Villa do Rio Claro e sua mulher
  Emmerenciana Maria de Jesus natural desde districto, lavradores, rezidentes neste
  districto. São seus avós paternos Vicente José de Carvalho Guimarães, portuguez,
  fallecido na cidade do Carangola e Maria Tertuliana da Conceição, natural da Villa
  do Rio Claro, também fallecida na cidade do Carangola. São avós maternos Antonio
  Francisco da Silva e Maria Paula de Jesus, naturaes deste districto, onde aquelle
  falleceu e esta rezide. São respectivamente o primeiro, segundo, terceiro, quarto,
  quinto e sexto filhos do casal. Para constar lavrei este acto, digo este termo que
  lido e achado conforme vae assignado pelo declarante e pelas testemunhas José Guida,
  commerciante e Joaquim Ferreira de Mello Official de pharmacia rezidentes neste
  districto. Eu Azarias Varella de Azevedo, Official do Registro Civil que o escrevi.
  Francisco José de Carvalho Guimarães. (Ass): -Joaquim Ferreira de Mello. -Jose
  Guida. -Azarias Varella de Azevedo. -Nada mais continha no presente Assento de
  Nascimento fielmente transcrito por mim e ao original me reporta por ter conferido e
  achado conforme. Dou fé. São Francisco do Glória, aos 11 de março de 2025.
abstract: >-
  A full-content certificate issued on 11 March 2025 transcribes record 38,
  book 4-A, page 23, registered on 12 October 1915. Francisco José de Carvalho
  Guimarães retrospectively registered six children born from 1901 through
  1915 at Fazenda do Barroso, including Maria Amora Guimarães, born
  1 January 1904. The record identifies his wife as Emmerenciana Maria de
  Jesus; his parents as Vicente José de Carvalho Guimarães, described only as
  Portuguese, and Maria Tertuliana da Conceição; and her parents as Antonio
  Francisco da Silva and Maria Paula de Jesus.
abstract_pt: >-
  Uma certidão de inteiro teor emitida em 11 de março de 2025 transcreve o
  assento 38, livro 4-A, folha 23, registrado em 12 de outubro de 1915.
  Francisco José de Carvalho Guimarães registrou retroativamente seis filhos
  nascidos entre 1901 e 1915 na Fazenda do Barroso, incluindo Maria Amora
  Guimarães, nascida em 1 de janeiro de 1904. O registro identifica sua esposa
  como Emmerenciana Maria de Jesus; seus pais como Vicente José de Carvalho
  Guimarães, descrito apenas como português, e Maria Tertuliana da Conceição; e
  os pais dela como Antonio Francisco da Silva e Maria Paula de Jesus.
reliability:
  assessment: >-
    Direct derivative evidence for the statements recorded in 1915 and the
    closest currently available record to Maria Amora's birth. It is a modern
    certified transcription rather than an image of the 1915 register.
  informant: >-
    Francisco José de Carvalho Guimarães declared the children's births and
    reported the parent and grandparent information in 1915.
  limitations: >-
    The children's births were registered retrospectively between about four
    months and fourteen years after the events. The 2025 certificate is a
    derivative and the original register image has not been inspected.
    "Portuguez" supplies nationality only and cannot establish a Portuguese
    district, municipality, island or parish.
