transcription: >-
  Certifico e dou fé, que atendendo a pedido verbal de pessoa interessada, que
  revendo em meu poder e Cartório, os Livros de Nascimento, encontrei sob o
  n.º 38, do Livro n.º 4-A, às Folhas 23, o Registro que passa a ser aqui
  transcrito. Aos doze dias do mês de Outubro de mil novecentos e quinze,
  neste distrito de São Francisco do Glória, Município e Comarca de Carangola,
  Estado de Minas Gerais, em cartório compareceu Francisco José de Carvalho
  Guimarães e declarou que [...] vinha dar a registro os nascimentos de seus
  filhos seguintes: José de Carvalho Guimarães, nascido a oito de novembro de
  mil novecentos e um [...], Maria Amora Guimarães nascida a primeiro de
  janeiro de mil novecentos e quatro [...], Maria da Conceição Guimarães,
  nascida a oito de setembro de mil novecentos e seis [...], Sebastião José de
  Carvalho Guimarães, nascido a dois de junho de mil novecentos e nove [...],
  João José de Carvalho Guimarães, nascido [...] dezesseis de dezembro de mil
  novecentos e doze, e Maria de Lourdes Guimarães nascida a vinte e quatro de
  junho de mil novecentos e quinze [...]. Todos nasceram na fazenda do Barroso
  deste Distrito, em domicilio e são filhos legítimos do declarante, natural
  da Villa do Rio Claro e sua mulher Emmerenciana Maria de Jesus, natural
  deste distrito, lavradores e residentes neste distrito. São seus avós
  paternos Vicente José de Carvalho Guimarães, portuguez, fallecido na cidade
  de Carangola e Maria Tertuliana da Conceição, natural da Villa do Rio Claro,
  também fallecida na cidade de Carangola. São avós maternos Antonio Francisco
  da Silva e Maria Paula de Jesus, naturaes deste districto, onde aquelle
  falleceu e esta reside. [...] São Francisco do Glória, aos 11 de março de
  2025.
abstract: >-
  A full-content certificate issued on 11 March 2025 transcribes record 38,
  book 4-A, page 23, registered on 12 October 1915. Francisco José de Carvalho
  Guimarães retrospectively registered six children born from 1901 through
  1915 at Fazenda do Barroso, including Maria Amora Guimarães, born
  1 January 1904. The record identifies his wife as Emmerenciana Maria de
  Jesus; his parents as Vicente José de Carvalho Guimarães, described only as
  Portuguese, and Maria Tertuliana da Conceição; and her parents as Antonio
  Francisco da Silva and Maria Paula de Jesus.
reliability:
  assessment: >-
    Direct derivative evidence for the statements recorded in 1915 and the
    closest currently available record to Maria Amora's birth. It is a modern
    certified transcription rather than an image of the 1915 register.
  informant: >-
    Francisco José de Carvalho Guimarães declared the children's births and
    reported the parent and grandparent information in 1915.
  limitations: >-
    The children's births were registered retrospectively between about four
    months and fourteen years after the events. The 2025 certificate is a
    derivative and the original register image has not been inspected.
    "Portuguez" supplies nationality only and cannot establish a Portuguese
    district, municipality, island or parish.
