transcription: >-
  [Nascimento nº 1192.] "Aos trinta dias do mez de Dezembro de mil oito centos e
  noventa e um, nesta Freguezia de São João Baptista, Município de Nova Friburgo,
  Estado do Rio de Janeiro, em meu cartorio compareceu Joaquim José Bohrer,
  negociante, morador no Alto da Serra desta Freguezia, distante deste cartorio
  mais de uma legua, e perante as testemunhas abaixo nomeadas e assignadas,
  declarou: Que no dia vinte e tres do corrente mez, ás nove e meia hora da manhã
  na casa de sua residencia nasceu uma criança do sexo masculino, filho legítimo
  delle declarante e de sua mulher Lucinda Fe[rreira] ..." [O restante do assento,
  inclusive o nome do baptizando, continua fora da porção retida da imagem.]
  Marginal note: "Falleceu no dia vinte e nove de Janeiro de mil oito centos
  noventa e dois, conforme consta do livro numero dois de Registro de obito a folha
  cento oitenta sob numero seiscentos cincoenta e quatro. Nova Friburgo, vinte e
  nove de Janeiro de mil oito centos noventa e dois. [uncertain: O Escrivão Carlos
  Miguel Noel]."
abstract: >-
  1891 Nova Friburgo civil birth of a son of Joaquim José Bohrer (P-0030) and
  Lucinda Ferreira (P-0031), declared by the father. A marginal note records the
  child's death on 29 January 1892 (livro 2 de óbito, fl. 180, nº 654), so he died
  in infancy. Corroborates the couple Joaquim José × Lucinda as parents in Nova
  Friburgo.
abstract_pt: >-
  Nascimento civil de 1891, em Nova Friburgo, de um filho de Joaquim José Bohrer
  (P-0030) e Lucinda Ferreira (P-0031), declarado pelo pai. Uma nota à margem
  registra o óbito da criança em 29 de janeiro de 1892 (livro 2 de óbito, fl.
  180, nº 654), portanto ele faleceu ainda na infância. Corrobora o casal
  Joaquim José × Lucinda como pais em Nova Friburgo.
reliability:
  assessment: >-
    Original civil-register evidence; the informant is the father, Joaquim José
    Bohrer. Direct for this infant's birth; indirect for our line (the subject is a
    collateral sibling of Celina).
  informant: The father, Joaquim José Bohrer.
  limitations: >-
    The infant (the subject) is a collateral sibling of Celina (P-0015), not
    modelled as an entity. The retrieval agent labelled the file "joao-birth-1891";
    the given name is not clearly legible on the retained tile, but the marginal
    death note (29 Jan 1892) makes this an infant who died in 1892 — distinct from
    Iris's father João Gonçalves Bohrer (P-0014, d.1970). The register page also
    carries an unrelated adjacent entry (nº 1191, a Nóbrega family from Madeira).
