transcription: >-
  [Registro Civil de óbitos, 1º Distrito de São João Baptista, Nova Friburgo, termo N.5045, folio
  172, 1914; escrivão Pedro Gonçalves Franco.] "Aos vinte de Setembro de mil novecentos e quatorze,
  nesta Cidade de Friburgo, Estado do Rio de Janeiro, em meu cartorio, compareceu Antonio da Silva
  Ferreira Junior, operario, residente nesta Cidade ... e exhibindo attestado do Doutor Henrique de
  Blanchin [uncertain] declarou que na casa da Rua Sete de Setembro, ás vinte e quatro horas de
  hontem, falleceu de arterio sclerose, seu pae Antonio da Silva Ferreira, com oitenta e oito annos
  de edade, do sexo masculino, cor branca, Portuguez, viuvo, e vae ser sepultado no Cemiterio
  Publico desta Cidade. E para constar fiz este termo ... Pedro Gonçalves Franco, escrivão que o
  escrevi."
abstract: >-
  Civil death registration of Antonio da Silva Ferreira (P-0036) — died at 24h on 19 September 1914
  (registered 20 September) at the Rua Sete de Setembro, Nova Friburgo, of arteriosclerosis, aged 88
  (→ b. ~1826), "Portuguez, viuvo" (widower — so Maria Joanna Rutschmann P-0037 predeceased him);
  buried in the Cemitério Público de Nova Friburgo. Declarant = his son Antonio da Silva Ferreira
  Junior. Source for death event E-0123. Falsifies the earlier "Antonio died in Rio" hypothesis —
  the family returned to Nova Friburgo. The record states no parish of origin and no parents, so the
  Portuguese-origin-parish gap is untouched.
abstract_pt: >-
  Registro civil de óbito de Antonio da Silva Ferreira (P-0036) — falecido às 24h de 19 de setembro
  de 1914 (registrado em 20 de setembro) na Rua Sete de Setembro, Nova Friburgo, de arteriosclerose,
  com 88 anos (→ n. ~1826), "Portuguez, viuvo" (viúvo — logo Maria Joanna Rutschmann P-0037 faleceu
  antes dele); sepultado no Cemitério Público de Nova Friburgo. Declarante = seu filho Antonio da
  Silva Ferreira Junior. Fonte do evento de óbito E-0123. Falsifica a hipótese anterior de que
  "Antonio faleceu no Rio" — a família retornou a Nova Friburgo. O registro não declara freguesia de
  origem nem os pais, de modo que a lacuna da freguesia portuguesa permanece.
