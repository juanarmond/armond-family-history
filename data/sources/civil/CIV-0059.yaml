notes:
- text: >-
    Identification with Aristides Muniz Bittencourt (born 22 July 1922, son of F-0001;
    PAR-0003, CIV-0058). For it: (1) the full name matches. The given name Aristides with
    the double surname Muniz Bit(t)encourt is an uncommon combination; only the single-t
    spelling differs, and the 1953 certidão itself spells the surname Bittencourt. (2) The
    place fits. Itaguaí is in the same Rio de Janeiro metropolitan region where he married in
    1953 (São João de Meriti, CIV-0058) and where his sister Rozalina died in 1983 (Duque de
    Caxias, CIV-0057). (3) Context only, not evidence: the three 2019 certidões of his
    baptism (17 April), marriage (11 June) and this death (2 July) were issued within eleven
    weeks of each other. The two civil ones were photographed on the same backing sheet
    beside the same object, and PAR-0003 records its 2019 baptism copy as owner-supplied,
    so the family that gathered the set took this death to be his. Against or
    neutral: the record states no age, birthplace, civil status, spouse or parents, so no
    detail can be checked against the 1922 baptism or the 1953 marriage. A namesake cannot be
    excluded. The record does not even say that he was married, although the man of 1953 was.
    Conclusion: the identification rests on the name and the region alone. It is a
    plausible working hypothesis, weaker than strong, and should be used only with that
    hedge, for example as "d. 1981?" on his documented_children entry. The full termo
    (inteiro teor) of termo 2335 might hold more.
  text_pt: >-
    Identificação com Aristides Muniz Bittencourt (nascido em 22 de julho de 1922, filho de
    F-0001; PAR-0003, CIV-0058). A favor: (1) o nome completo coincide. O prenome Aristides
    com o sobrenome duplo Muniz Bit(t)encourt é uma combinação pouco comum; só difere a
    grafia com um t, e a própria certidão de 1953 grafa Bittencourt. (2) O lugar condiz.
    Itaguaí fica na mesma região metropolitana do Rio de Janeiro em que ele se casou em 1953
    (São João de Meriti, CIV-0058) e em que sua irmã Rozalina morreu em 1983 (Duque de
    Caxias, CIV-0057). (3) Apenas contexto, não evidência: as três certidões de 2019 — do
    batismo (17 de abril), do casamento (11 de junho) e deste óbito (2 de julho) — foram
    emitidas num intervalo de onze semanas. As duas civis foram fotografadas sobre a mesma
    folha de fundo, ao lado do mesmo objeto, e PAR-0003 registra a sua cópia de 2019 do
    batismo como fornecida pelo proprietário, de modo que a família que reuniu o conjunto
    tomou este óbito como sendo dele. Contra ou neutro: o registro não declara idade, naturalidade, estado civil,
    cônjuge nem pais, de modo que nenhum detalhe pode ser conferido com o batismo de 1922 ou
    com o casamento de 1953. Não se pode excluir um homônimo. O registro nem sequer diz que
    ele era casado, embora o homem de 1953 o fosse. Conclusão: a identificação apoia-se
    apenas no nome e na região. É uma hipótese de trabalho plausível, mais fraca que forte,
    e deve ser usada somente com essa ressalva, por exemplo como "f. 1981?" na sua entrada
    em documented_children. O inteiro teor do termo 2335 talvez contenha mais.
- text: >-
    Why linked to F-0001 but to no person. The record names no parent, so it is not cited
    for P-0012 or P-0013. It is linked to F-0001 only as the probable death of that family's
    documented child Aristides, subject to the identification note above. The retrieval
    side's profile gives this death as his without qualification; this catalogue entry
    narrows that to a hedged identification.
  text_pt: >-
    Por que vinculado a F-0001, mas a nenhuma pessoa. O registro não nomeia pai nem mãe, de
    modo que não é citado para P-0012 nem P-0013. É vinculado a F-0001 apenas como o provável
    óbito do filho documentado Aristides, sob a ressalva da nota de identificação acima. O
    perfil da pesquisa de recuperação dá este óbito como dele sem ressalva; esta entrada de
    catálogo restringe isso a uma identificação com ressalva.
- text: >-
    Checked against the retrieval side's verbatim draft (profile
