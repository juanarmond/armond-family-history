abstract: >-
  A certidão de óbito issued on 2 July 2019 by the 1st District civil registry of Itaguaí
  (Rio de Janeiro state), abstracting termo 2335 (book C-5, fl. 3), registered on 4 May
  1981. Aristides Muniz Bitencourt, male, white, died at 8.15 a.m. on 3 May 1981 at the
  Hospital do SASE, Itaguaí, of acute respiratory failure and septicaemia, attested by
  Delson Araujo Lima, and was buried in the Cemitério Padre Cezare Vegezzi, Itaguaí. He lived
  on the Estrada da Raiz da Serra, Itaguaí. His civil status, age, birthplace and parents
  are all recorded as "Ignorado", and it was not known whether he left property or
  children. The declarant was Roberto Alfredo do Espirito Santo, whose relationship is not
  stated. The man is probably, but not provably, Aristides Muniz Bittencourt, born in 1922,
  a son of F-0001: the record holds nothing but his name and his residence in the Rio de
  Janeiro region to tie it to him.
abstract_pt: >-
  Certidão de óbito emitida em 2 de julho de 2019 pelo registro civil do 1.º Distrito de
  Itaguaí (Estado do Rio de Janeiro), em breve relato do termo 2335 (livro C-5, fl. 3),
  lavrado em 4 de maio de 1981. Aristides Muniz Bitencourt, do sexo masculino, de cor
  branca, faleceu às 8h15 de 3 de maio de 1981 no Hospital do SASE, em Itaguaí, de
  insuficiência respiratória aguda e septicemia, atestadas por Delson Araujo Lima, e foi
  sepultado no Cemitério Padre Cezare Vegezzi, em Itaguaí. Morava na Estrada da Raiz da
  Serra, Itaguaí. Seu estado civil, idade, naturalidade e filiação são todos registrados
  como "Ignorado", e não se sabia se deixou bens ou filhos. O declarante foi Roberto Alfredo
  do Espirito Santo, cujo parentesco não é declarado. O homem é provavelmente, mas não
  comprovadamente, Aristides Muniz Bittencourt, nascido em 1922, filho de F-0001: o registro
  não contém nada além do nome e da residência na região do Rio de Janeiro que o ligue a ele.
reliability:
  assessment: >-
    A modern certified abstract (2019) of an original 1981 civil death termo, so a
    derivative. It is primary for the death, its date, time, place and cause, and for the
    burial. Every identifying field about the man except his name, sex, colour and residence
    is "Ignorado", which shows that the declarant did not know him personally or his family.
    The record therefore cannot by itself identify him with any particular Aristides.
  informant: >-
    Roberto Alfredo do Espirito Santo, declarant (1981); relationship not stated. His
    ignorance of the dead man's age, birthplace, civil status and parents suggests he was
    not a relative; that is an inference.
  limitations: >-
    No age, birthplace, civil status, spouse, parents or children are recorded, and the
    surname is spelt Bitencourt with one t. A breve relato does not show the full termo,
    which may hold more (for example, a note of who brought the body). The identity-document
    and voter fields are blank or masked on the certidão.
