transcription: >-
  [Page 1 — certidão header and body of the óbito term:]

  Luiz Gastão Fortes Bustamante, escrivão da paz e Official do Registro civil
  do districto de Thebes, município de Leopoldina, na forma da lei etc... e

  Certifico que revendo o livro do registro de óbitos do anno de mil novecentos
  e nove, n'elle a folhas cento e quarenta e quatro, usque cento e quarenta e
  cinco, encontrei o termo do thêr seguinte; Nº 6 (seis)

  Aos doze dias do mez de Fevereiro de mil novecentos e nove, n'este districto
  de Thebes, em meu cartório compareceu Jose Bernado do Silva Junior, lavrador,
  aqui residente e exhibindo atestado de Quirino Symphonio de Rezende e
  Francisco Barboza de Miranda, declarou que hontem as nove horas da noite, sem
  a assistência medica e victimado por uma lesão cardioaca, falleceu na fazenda
  da Concordia, d'este districto, Antonio Toledo, brazileiro, natural d'este
  Estado, de côr branca, com setenta annos presumíveis de idade, viuvo de Maria
  Euphronyza de Jesus, carpinteiro, filho legítimo de Ladislao Igidio Ferreira de
  Toledo, e Mathilde Luiza de Toledo, aqui residentes. Deixou quatro filhos todos
  maiores que são: Francisco Themotheo de Toledo, Jose Ladislao de Toledo, Amelia
  cazada com Frederico Augusto,

  [Page 2 — continuation and closing:]

  Rodrigues, e Mathilde Solteira. Vai ser sepultado no cemitério público do
  districto. E faço este termo que é assignado Eu Luiz Gastão Fortes Bustamante,
  escrivão [o] escrevi Jose Bernados da Silva Junior.

  Nada mais consta do dito livro que é fielmente copiado e ao livro respectivo me
  refello e dou fé. Thebes, 4 de outubro de 1910.

  [fiscal stamp; fees: C$R 6h,000 / S$ 460 / 645$00]

  Luiz G. Fortes de Bustamante [rubrica/signature]
abstract: >-
  Two-page certified extract (certidão) of the civil death registration of
  António Ladislão de Toledo, recorded as Termo Nº 6, folhas 144–145, Livro de
  Óbitos 1909, Districto de Thebes, Leopoldina MG. The declarant, José Bernado
  do Silva Junior (lavrador, local resident), appeared at the cartório on 12
  February 1909 with an atestado from Quirino Symphonio de Rezende and Francisco
  Barboza de Miranda, declaring that the previous evening (11 February 1909 at
  9pm) António Toledo had died without medical attendance at Fazenda da
  Concórdia from a cardiac lesion (lesão cardíaca). He is described as
  Brazilian, natural of Minas Gerais, cor branca, approximately 70 years of age,
  widower of Maria Euphronyza de Jesus, and carpinteiro. He is identified as the
  legitimate son of Ladislao Igidio Ferreira de Toledo and Mathilde Luiza de
  Toledo (both resident in the district). He left four adult children: Francisco
  Themotheo de Toledo, José Ladislao de Toledo, Amélia (married to Frederico
  Augusto Rodrigues), and Mathilde (unmarried). The certidão was issued
  4 October 1910 and signed by Luiz G. Fortes de Bustamante, escrivão da paz.
abstract_pt: >-
  Extrato certificado (certidão) de duas páginas do registro civil de óbito de
  António Ladislão de Toledo, registrado como Termo Nº 6, folhas 144–145, Livro
  de Óbitos de 1909, Districto de Thebes, Leopoldina MG. O declarante, José
  Bernado do Silva Junior (lavrador, residente local), compareceu ao cartório em
  12 de fevereiro de 1909 com um atestado de Quirino Symphonio de Rezende e
  Francisco Barboza de Miranda, declarando que na noite anterior (11 de fevereiro
  de 1909 às 21h) António Toledo havia falecido sem assistência médica na Fazenda
  da Concórdia por uma lesão cardíaca (lesão cardíaca). É descrito como
  brasileiro, natural de Minas Gerais, cor branca, com aproximadamente 70 anos de
  idade, viúvo de Maria Euphronyza de Jesus, e carpinteiro. É identificado como
  filho legítimo de Ladislao Igidio Ferreira de Toledo e Mathilde Luiza de Toledo
  (ambos residentes no distrito). Deixou quatro filhos adultos: Francisco
  Themotheo de Toledo, José Ladislao de Toledo, Amélia (casada com Frederico
  Augusto Rodrigues) e Mathilde (solteira). A certidão foi emitida em 4 de outubro
  de 1910 e assinada por Luiz G. Fortes de Bustamante, escrivão da paz.
reliability:
  assessment: >-
    Direct primary evidence of the death of António Ladislão de Toledo (P-0063)
    and of his parentage (Ladisláo Egídio Ferreira de Toledo = P-0056, and
    Mathilde). The declarant is a local lavrador, not a family member, which
    reduces reliability for secondary information (age, mother's name). The
    approximate age ("setenta annos presumíveis") signals that the informant was
    estimating. The father's name ("Ladislao Igidio Ferreira de Toledo") matches
    P-0056 closely. The mother's name ("Mathilde Luiza de Toledo") is a new
    variant: PRB-0009 records her as "Mathilde Maria de Jesus"; the informant
    likely used the family surname "de Toledo" in place of her maiden surname "de
    Jesus" — a common simplification by a non-family neighbour.
  informant: >-
    José Bernado do Silva Junior, lavrador and local resident of Thebes district,
    presenting an atestado from Quirino Symphonio de Rezende and Francisco
    Barboza de Miranda.
  limitations: >-
    Certified derivative copy, not the original register image. The name in the
    record is abbreviated to "Antonio Toledo" (full name was António Ladislão de
    Toledo). Age at death (~70 years) is explicitly estimated ("presumíveis");
    actual birth year is uncertain. The mother's name variant ("Mathilde Luiza de
    Toledo") conflicts with PRB-0009 ("Mathilde Maria de Jesus"): this is likely
    a non-family informant's simplification, not a different person. The escrivão's
    surname appears as "Forles" within the body text and "Fortes" in the
    signature; the signature reading "Fortes" is adopted as authoritative.
    The children named are not modelled as person entities.
