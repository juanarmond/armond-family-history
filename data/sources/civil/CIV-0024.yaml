- text: >-
    António Ladislão de Toledo is child #7 of Ladisláo (P-0056) × Mathilde
    (P-0027) per PRB-0009, listed there as "surdo e mudo" (deaf-mute). The death
    record does not mention this condition. Consistent with promotion from
    documented_child in F-0027 to person entity P-0063 on the basis of this
    primary civil death record.
