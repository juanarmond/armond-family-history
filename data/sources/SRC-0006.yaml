transcription: >-
  [Entry 9890.] Aos dois dias do mês de novembro de mil novecentos e cinquenta
  e sete [...] declarou que no dia um do corrente mês [...] faleceu Aristão
  Ferreira Armond, do sexo masculino, cor branca, com setenta e oito anos de
  idade [...] filho de Simplicio Armand e de Eliza Ferreira Armand. [The
  remaining handwriting is partly illegible in the retained image.]
abstract: >-
  The original Volta Redonda civil death register records that Aristão
  Ferreira Armond died on 1 November 1957, aged 78. It reports his parents as
  Simplicio Armand and Eliza Ferreira Armand. The entry was registered on 2
  November 1957 as number 9890 on page 315.
reliability:
  assessment: >-
    Original civil-register evidence directly supports the death, date, age
    and identity. The parent names are secondary information reported at death
    but are directly stated in the record.
  informant: The declarant's name is not safely legible in the retained image.
  limitations: >-
    The handwriting is low contrast and several fields remain unsafe to
    transcribe. The FamilySearch index badly mistranscribes Aristão's name as
    "Axstai Ferreira Armand Armand" and duplicates part of his mother's
    surname. The retained PNG is a pixel-preserving reconstruction from the
    original-image viewer's complete Deep Zoom tile set, not a controlled
    FamilySearch download.
