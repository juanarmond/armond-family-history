transcription: >-
  Eu, AILTON LOPES FERREIRA, Escrivão de Paz e Oficial de Registro Civil do
  Distrito da Cidade de Carangola, Estado de Minas Gerais, Brasil, na forma da
  lei, etc. CERTIFICO que no livro nº 8 de registro de Casamentos, às fls 118-v
  sob o nº 62, consta o de DEOCLECIANO MUNIZ BITTENCOURT com LUIZA FERNANDES DE
  AZEVEDO. Solteiros. Ele, nascido em Sapucaia Estado do Rio de Janeiro, com
  vinte e quatro anos de idade, filho de João Muniz Bittencourt e de Suzana
  Ritta Brandão. Ela, nascida em Bom Jesus da Cachoeira Alegre Município de São
  Paulo do Muriaé, com dezoito anos de idade, filha de Secundino Maria de
  Azevedo e de Theresa Fernandes de Azevedo. A contraente passou assinar: Não
  consta do termo. O regime adotado é o de Comunhão de Bens. Casamento esse
  realizado em vinte e um de outubro de mil novecentos e dezesseis. O referido
  é verdade e dou fé. Carangola, 06 de janeiro de 2004.
abstract: >-
  A certified copy issued on 6 January 2004 states that Deocleciano Muniz
  Bittencourt and Luiza Fernandes de Azevedo, both single, married in Carangola
  on 21 October 1916. Deocleciano, aged 24 and born in Sapucaia, Rio de
  Janeiro, was a son of João Muniz Bittencourt and Suzana Ritta Brandão. Luiza,
  aged 18 and born in Bom Jesus da Cachoeira Alegre in the municipality of São
  Paulo do Muriaé, was a daughter of Secundino Maria de Azevedo and Theresa
  Fernandes de Azevedo.
