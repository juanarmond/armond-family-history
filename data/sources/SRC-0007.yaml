transcription: >-
  [Page 1.] REPÚBLICA FEDERATIVA DO BRASIL. REGISTRO CIVIL DAS PESSOAS
  NATURAIS. CERTIDÃO DE INTEIRO TEOR. MATRÍCULA: 0511100155 1916 2 00008 118
  0000062 02. Certifico que dos arquivos do Cartório a meu cargo, consta o
  inteiro teor fielmente reproduzido [...] referente ao livro 8 B, folha 118 e
  termo 62, onde contém o registro de Casamento de DEOCLECIANO MUNIZ
  BITTENCOURT e LUIZA FERNANDES DE AZEVEDO [...]. Contém 3 (três) laudas. [...]
  Carangola-MG, 15 de julho de 2019. [Pages 2–3 reproduce the handwritten
  marriage entry; a complete diplomatic transcription remains pending because
  the photographed writing is low contrast.]
abstract: >-
  A three-page full-content certificate issued on 15 July 2019 reproduces the
  1916 marriage entry for Deocleciano Muniz Bittencourt and Luiza Fernandes de
  Azevedo in book 8-B, page 118, record 62 of the Carangola civil registry. It
  independently identifies the same marriage record already represented by
  SRC-0001 while preserving a longer reproduction of the underlying entry.
reliability:
  assessment: >-
    Direct derivative evidence for the marriage event. The 2019 registrar's
    certificate reproduces the 1916 entry and supplies the archival locator.
  informant: The spouses' declarations as reproduced from the 1916 register.
  limitations: >-
    This is a modern certified derivative rather than the register volume
    itself. The three authorised original-upload photographs are skewed and
    parts of the handwritten reproduction are low contrast; no uncertain text
    has been supplied from the collaborative tree.
