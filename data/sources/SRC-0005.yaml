abstract: >-
  A damaged civil marriage certificate records the marriage of Antenor Muniz
  and Iris Bohrer at Alvorada on 7 December 1949. It identifies Antenor's
  parents as Deocleciano Muniz and Luiza Fernandes de Azevedo, and Iris's
  parents as João Gonçalves Bohrer and Selina Bohrer. Antenor is recorded as a
  farm worker, and the certificate states that Iris would thereafter sign Iris
  Bohrer Muniz.
reliability:
  assessment: >-
    Direct derivative evidence for the marriage, spouse names and married-name
    form. The reported parents are secondary information but are directly
    stated in the certificate.
  informant: The spouses' declarations as entered in the marriage register.
  limitations: >-
    The photographed certificate is folded, taped, stained and partly obscured.
    Book, page, record number and several vital-detail fields cannot be read
    safely. The repository retains the originally uploaded JPEG at its
    authorised download resolution.
