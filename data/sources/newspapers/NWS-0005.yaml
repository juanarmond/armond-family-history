notes:
- text: >-
    Corroborates Joaquim José Bohrer (P-0030) as living in December 1898 and fixes his
    birthday on 16 December (day/month only; year unknown). Split off from the former
    aggregate NWS-0002, which grouped three distinct A Sentinella issues; the 30 Jan
    1898 Manoel Pereira de Lemos death notice remains NWS-0002 and the 4 Apr 1899
    Antonio José Bohrer death notice is now NWS-0006.
  text_pt: >-
    Corrobora Joaquim José Bohrer (P-0030) como vivo em dezembro de 1898 e fixa seu
    aniversário em 16 de dezembro (apenas dia e mês; ano desconhecido). Desmembrado do
    antigo agregado NWS-0002, que reunia três edições distintas de A Sentinella; a nota
    de falecimento de Manoel Pereira de Lemos (30 jan. 1898) permanece em NWS-0002 e a
    de Antonio José Bohrer (4 abr. 1899) é agora NWS-0006.
