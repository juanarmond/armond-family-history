abstract: >-
  A "Parabéns / Fizeram annos" birthday notice in the Nova Friburgo weekly "A
  Sentinella" (managed by Capitão Guilherme Samuel Bohrer) of 18 December 1898 lists,
  among those whose birthday fell "no dia 16", "os Srs. Joaquim José Bohrer e Carlos
  Alberto da Costa". It fixes Joaquim José Bohrer's (P-0030) birthday on 16 December
  (day and month only; the year is not given).
abstract_pt: >-
  Uma nota de aniversário "Parabéns / Fizeram annos" no semanário friburguense "A
  Sentinella" (dirigido pelo Capitão Guilherme Samuel Bohrer), de 18 de dezembro de
  1898, lista, entre os que fizeram anos "no dia 16", "os Srs. Joaquim José Bohrer e
  Carlos Alberto da Costa". Fixa o aniversário de Joaquim José Bohrer (P-0030) em 16
  de dezembro (apenas dia e mês; o ano não é indicado).
reliability:
  assessment: >-
    A contemporary newspaper birthday notice from a family-run paper (Guilherme Samuel
    Bohrer, Joaquim's nephew). Reliable for the day it reports but secondary and
    indirect: it fixes only the day (16 December), not the year, of Joaquim José
    Bohrer's birth.
  informant: >-
    "A Sentinella", Nova Friburgo (family-run by Guilherme Samuel Bohrer), 1898.
  limitations: >-
    A print newspaper social notice, not a vital record: it gives the birthday day and
    month (16 December) but no birth year.
