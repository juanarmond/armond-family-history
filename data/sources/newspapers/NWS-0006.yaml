transcription: >-
  [A Sentinella, Nova Friburgo, 4 de abril de 1899 — secção "VICTIMA DE UM
  JARARACUSSÚ":] "Chega-nos do districto de S. Pedro de Nova Friburgo a tristissima
  noticia do fallecimento de Antonio José Bohrer, filho de nosso amigo Joaquim Bohrer
  e sobrinho do gerente desta folha. O malogrado joven que apenas contava 13
  primaveras succumbiu no dia 2 do corrente em consequencia de mordedura de cobra
  jararacussú, tendo sido baldados todos os esforços para salval-o. Deixa de si
  recordações saudosas por suas bellas qualidades que o faziam estimado de todos. A
  «Sentinella» apresenta sinceras condolencias á seus inditosos paes."
abstract: >-
  A death notice in the Nova Friburgo weekly "A Sentinella" (managed by Capitão
  Guilherme Samuel Bohrer) of 4 April 1899: the death, on 2 April 1899 aged 13, of
  Antonio José Bohrer, "filho de nosso amigo Joaquim Bohrer" (i.e. a son of Joaquim
  José Bohrer, P-0030, and a brother of Celina, P-0015), from a jararacussú snakebite
  in the São Pedro de Nova Friburgo district. The "gerente desta folha" (Guilherme
  Samuel Bohrer) is named as Antonio José's uncle.
abstract_pt: >-
  Uma nota de falecimento no semanário friburguense "A Sentinella" (dirigido pelo
  Capitão Guilherme Samuel Bohrer), de 4 de abril de 1899: o falecimento, em 2 de
  abril de 1899 aos 13 anos, de Antonio José Bohrer, "filho de nosso amigo Joaquim
  Bohrer" (isto é, filho de Joaquim José Bohrer, P-0030, e irmão de Celina, P-0015),
  por mordedura de cobra jararacussú no distrito de São Pedro de Nova Friburgo. O
  "gerente desta folha" (Guilherme Samuel Bohrer) é indicado como tio de Antonio José.
reliability:
  assessment: >-
    A contemporary newspaper death notice from a family-run paper (Guilherme Samuel
    Bohrer, Antonio José's uncle). Reliable for the facts it reports (date of death,
    age, cause, filiation) but secondary in form. It directly states Antonio José
    Bohrer was a son of Joaquim José Bohrer (P-0030).
  informant: >-
    "A Sentinella", Nova Friburgo (family-run by Guilherme Samuel Bohrer), 1899.
  limitations: >-
    A print newspaper death notice, not a civil or parish record: the age is reported
    ("13 primaveras", implying ~b.1885–1886) and no birth date is given. The father is
    named only as "Joaquim Bohrer".
