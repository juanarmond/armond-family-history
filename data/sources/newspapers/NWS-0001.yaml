transcription: >-
  [Jornal "O Processo", Conselheiro Lafaiete, MG — Ano II, n.º 42, 1.º a 15 de
  fevereiro de 1975, p. 6. Secção:] Editais de Casamento.

  IRENE LÚCIA DE ALBUQUERQUE e JOSÉ ALEIXO MATOS, Escrivães de Paz e Oficiais do
  Registro Civil do Distrito de Conselheiro Lafaiete, Estado de Minas Gerais,
  República Federativa do Brasil, na forma da lei, etc.

  FAZ SABER QUE PRETENDEM CASAR-SE: [...]

  [O edital do interesse, entre vários outros do mesmo oficial (Borotto, Braga,
  Paula, Silva):] JOSÉ CLAVO ARMOND [sic; = José Olavo Armond], natural de
  Eugenópolis, maior, representante comercial, residente no Rio de Janeiro, à
  Avenida Ministro Edgar Romero, 351, Bloco 18, apt.º 102, filho de Aristão
  Ferreira Armond e de d. Liliosa Paz Armond e MARIA DE FÁTIMA GOMES BEATO,
  natural de Cons. Lafaiete, maior, professora, residente nesta cidade à rua
  Wenceslau Braz, 260, filha de Agostinho Gomes Beato e de d. Anadem de Siqueira
  Beato.

  Apresentaram os documentos exigidos pelo artigo 180, n.ºs 1, 2 e 4, do Código
  Civil. Se alguém souber de algum impedimento, oponha-o na forma da lei. a) Irene
  Lúcia de Albuquerque. a) José Aleixo de Matos. — Oficiais de Registro Civil.
abstract: >-
  A marriage-banns notice (edital de proclamas) published in the fortnightly
  newspaper O Processo (Conselheiro Lafaiete, MG), issue n.º 42 of 1–15 February
  1975, announcing the intended marriage of José Olavo Armond and Maria de
  Fátima Gomes Beato. It records José Olavo as natural de Eugenópolis, a
  commercial representative then resident in Rio de Janeiro, and names his
  parents as Aristão Ferreira Armond and Liliosa Paz Armond. Independently
  corroborates the 1973 driver-dossier index (GOV-0001) and Aristão's death
  record (CIV-0005) on José Olavo's parentage, and newly supplies his stated
  birthplace (Eugenópolis).
reliability:
  assessment: >-
    A published legal notice reproducing the civil registrar's proclamas. Direct
    on José Olavo's parentage (Aristão Ferreira Armond + Liliosa Paz Armond) and
    naturalidade (Eugenópolis); consistent with GOV-0001 and CIV-0005. Together
    with GOV-0001 (birth date 25 September 1926) it fixes both the date and place
    of José Olavo's birth even though no birth/baptism record has been located.
  informant: >-
    The Oficial do Registro Civil de Conselheiro Lafaiete (proclamas), whose
    notice the newspaper republished; the parentage and origin data originate in
    the couple's civil-registry documents.
  limitations: >-
    A marriage bann evidences the intent to marry, not a completed marriage; the
    marriage act itself (with its exact date and place) must be sought in the
    civil registry. The newspaper print is small, so the mother's given name and
    the bride's maternal surname were read from a low-resolution scan. Being a
    newspaper republication of registry proclamas, the information is secondary.
