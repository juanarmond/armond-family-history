transcription: >-
  [A Sentinella, Nova Friburgo, 30 de janeiro de 1898 — secção "NECROLOGIA":]
  "Victimado por cruel enfermidade, desceo ao tumulo, no dia 20 do corrente, com a
  avançada idade de 72 annos, o conhecido industrial da Venda das Pedras Manoel
  Pereira de Lemos. O finado que gosava de geral estima de seus conterraneos era tio
  do gerente desta folha e irmão da Exma. Sra. D. Roza Bohrer, a quem enviamos
  sentidos pezames."

  [A Sentinella, 18 de dezembro de 1898 — secção "PARABENS" / "Fizeram annos":]
  "— No dia 16 os Srs. Joaquim José Bohrer e Carlos Alberto da Costa."

  [A Sentinella, 4 de abril de 1899 — secção "VICTIMA DE UM JARARACUSSÚ":] "Chega-nos
  do districto de S. Pedro de Nova Friburgo a tristissima noticia do fallecimento de
  Antonio José Bohrer, filho de nosso amigo Joaquim Bohrer e sobrinho do gerente
  desta folha. O malogrado joven que apenas contava 13 primaveras succumbiu no dia 2
  do corrente em consequencia de mordedura de cobra jararacussú, tendo sido baldados
  todos os esforços para salval-o. Deixa de si recordações saudosas por suas bellas
  qualidades que o faziam estimado de todos. A «Sentinella» apresenta sinceras
  condolencias á seus inditosos paes."
abstract: >-
  Three clippings from the Nova Friburgo weekly "A Sentinella" (managed by Capitão
  Guilherme Samuel Bohrer, a son of Francisco José Bohrer × Rosa Eugenia de Lemos):
  (1) 30 Jan 1898 — the death, on 20 Jan 1898 aged 72, of Manoel Pereira de Lemos,
  industrialist of Venda das Pedras, expressly "irmão da Exma. Sra. D. Roza Bohrer",
  i.e. a brother of Rosa Eugenia de Lemos (P-0035); (2) 18 Dec 1898 — a birthday
  notice placing Joaquim José Bohrer's (P-0030) birthday on 16 December; (3) 4 Apr
  1899 — the death, on 2 Apr 1899 aged 13, of Antonio José Bohrer, "filho de … Joaquim
  Bohrer" (i.e. a son of Joaquim José Bohrer P-0030 and a brother of Celina, P-0015),
  from a jararacussú snakebite in the S. Pedro de Nova Friburgo district. The
  "gerente desta folha" (Guilherme Samuel Bohrer) is Rosa's son, Manoel's nephew and
  Antonio José's uncle.
abstract_pt: >-
  Três recortes do semanário friburguense "A Sentinella" (dirigido pelo Capitão
  Guilherme Samuel Bohrer, filho de Francisco José Bohrer × Rosa Eugenia de Lemos):
  (1) 30 jan. 1898 — o falecimento, em 20 jan. 1898 aos 72 anos, de Manoel Pereira de
  Lemos, industrial da Venda das Pedras, expressamente "irmão da Exma. Sra. D. Roza
  Bohrer", isto é, irmão de Rosa Eugenia de Lemos (P-0035); (2) 18 dez. 1898 — nota de
  aniversário que fixa o aniversário de Joaquim José Bohrer (P-0030) em 16 de
  dezembro; (3) 4 abr. 1899 — o falecimento, em 2 abr. 1899 aos 13 anos, de Antonio
  José Bohrer, "filho de … Joaquim Bohrer" (isto é, filho de Joaquim José Bohrer
  P-0030 e irmão de Celina, P-0015), por mordedura de cobra jararacussú no distrito de
  S. Pedro de Nova Friburgo. O "gerente desta folha" (Guilherme Samuel Bohrer) é filho
  de Rosa, sobrinho de Manoel e tio de Antonio José.
reliability:
  assessment: >-
    Contemporary newspaper notices — reliable for the facts they report (dates of
    death, ages, kinship as stated by a family-run paper), but secondary in form. The
    óbito of Manoel Pereira de Lemos directly states he was a brother of Rosa Eugenia
    de Lemos (P-0035); the jararacussú notice directly states Antonio José Bohrer was
    a son of Joaquim José Bohrer (P-0030). The birthday notice fixes only the day
    (16 December), not the year, of Joaquim José's birth.
  informant: >-
    "A Sentinella", Nova Friburgo (family-run by Guilherme Samuel Bohrer), 1898–1899.
  limitations: >-
    Print newspaper social/death notices, not civil or parish records: ages are
    reported (Manoel "72", Antonio "13") and the surname of Manoel appears as
    "Pereira de Lemos" here but "Antunes de Lemos" in the 6 Feb 1898 mass notice
    (one is a typo; "Pereira de Lemos" matches this family's Candido Pereira de
    Lemos). No birth years are given.
