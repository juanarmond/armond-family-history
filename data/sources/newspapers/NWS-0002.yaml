notes:
- text: >-
    Manoel Pereira de Lemos (d. 20 Jan 1898, aged 72, ~b.1826) is added as a
    documented_child (brother of Rosa Eugenia de Lemos) on F-0025. Antonio José
    Bohrer (d. 2 Apr 1899, aged 13, ~b.1885) is added as a documented_child (son of
    Joaquim José Bohrer, brother of Celina P-0015) on F-0014. Both clearly deceased;
    recorded as documented_children rather than person entities.
- text: >-
    Corroborates two direct-line ancestors as living in 1898: Rosa Eugenia de Lemos
    (P-0035, "D. Roza Bohrer") and Joaquim José Bohrer (P-0030). The 18 Dec 1898
    notice fixes Joaquim José's birthday on 16 December (day/month only; year
    unknown). Additional Bohrer/Lemos clippings from the same paper (a 6 Feb 1898
    mass for Manoel de Lemos; birthday/mass notices for the collateral Guilherme
    Samuel, Fernando José and Francisco Portella Bohrer) were read but not catalogued
    (social notices, no new vital facts).
