- text: >-
    Corroborates a direct-line ancestor as living in 1898: Rosa Eugenia de Lemos
    (P-0035, "D. Roza Bohrer"). This 30 Jan 1898 issue was originally catalogued
    together with two other A Sentinella clippings — the 18 Dec 1898 Joaquim José
    Bohrer birthday notice (now NWS-0005) and the 4 Apr 1899 Antonio José Bohrer death
    notice (now NWS-0006); the aggregate was split so each issue is its own source.
    Additional Bohrer/Lemos clippings from the same paper (a 6 Feb 1898 mass for Manoel
    de Lemos; birthday/mass notices for the collateral Guilherme Samuel, Fernando José
    and Francisco Portella Bohrer) were read but not catalogued (social notices, no new
    vital facts).
