transcription: >-
  [A Sentinella, Nova Friburgo, 30 de janeiro de 1898 — secção "NECROLOGIA":]
  "Victimado por cruel enfermidade, desceo ao tumulo, no dia 20 do corrente, com a
  avançada idade de 72 annos, o conhecido industrial da Venda das Pedras Manoel
  Pereira de Lemos. O finado que gosava de geral estima de seus conterraneos era tio
  do gerente desta folha e irmão da Exma. Sra. D. Roza Bohrer, a quem enviamos
  sentidos pezames."
abstract: >-
  A clipping from the Nova Friburgo weekly "A Sentinella" (managed by Capitão
  Guilherme Samuel Bohrer, a son of Francisco José Bohrer × Rosa Eugenia de Lemos):
  the 30 Jan 1898 death notice of Manoel Pereira de Lemos, industrialist of Venda das
  Pedras, who died on 20 Jan 1898 aged 72, expressly "irmão da Exma. Sra. D. Roza
  Bohrer", i.e. a brother of Rosa Eugenia de Lemos (P-0035). The "gerente desta folha"
  (Guilherme Samuel Bohrer) is Rosa's son and Manoel's nephew.
abstract_pt: >-
  Um recorte do semanário friburguense "A Sentinella" (dirigido pelo Capitão
  Guilherme Samuel Bohrer, filho de Francisco José Bohrer × Rosa Eugenia de Lemos):
  a nota de falecimento, de 30 jan. 1898, de Manoel Pereira de Lemos, industrial da
  Venda das Pedras, falecido em 20 jan. 1898 aos 72 anos, expressamente "irmão da
  Exma. Sra. D. Roza Bohrer", isto é, irmão de Rosa Eugenia de Lemos (P-0035). O
  "gerente desta folha" (Guilherme Samuel Bohrer) é filho de Rosa e sobrinho de
  Manoel.
reliability:
  assessment: >-
    A contemporary newspaper death notice — reliable for the facts it reports (date of
    death, age, kinship as stated by a family-run paper), but secondary in form. The
    óbito of Manoel Pereira de Lemos directly states he was a brother of Rosa Eugenia
    de Lemos (P-0035).
  informant: >-
    "A Sentinella", Nova Friburgo (family-run by Guilherme Samuel Bohrer), 1898.
  limitations: >-
    A print newspaper death notice, not a civil or parish record: the age is reported
    (Manoel "72") and the surname appears as "Pereira de Lemos" here but "Antunes de
    Lemos" in the 6 Feb 1898 mass notice (one is a typo; "Pereira de Lemos" matches
    this family's Candido Pereira de Lemos). No birth year is given.
