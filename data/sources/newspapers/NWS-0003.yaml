notes:
- text: >-
    First record of a public office held by Simplício José Ferreira Armond (P-0016):
    3rd substitute (supplente) to the police delegate of São Paulo do Muriaé, appointed
    10 September 1902. Complements his other Muriaé roles (attorney/witness/arbitrator
    in the FAN documents and the 1904 inventário) and confirms he was living and active
    in Muriaé in 1902. This is our direct-line Simplício (Eliza's husband), not the
    elder Barbacena namesake.
