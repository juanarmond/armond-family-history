transcription: >-
  [O Leopoldinense, Leopoldina (MG), p.3, "SECÇÃO LIVRE → Grande Loteria da
  Côrte". Full page retained; only the consortium notice is transcribed.] "A
  sociedade loterica organizada ultimamente entre os socios abaixo declarados,
  consta de 5 bilhetes inteiros e 10 meios da grande loteria da côrte os quaes se
  acham em poder do socio Ladislao Egidio Ferreira de Toledo, como depositario, e
  cujos numeros são os seguintes: [dez números de bilhete omitidos]. Os premios
  que sahirem por sorte na extracção serão divididos em partes iguaes com os
  socios: Ladislão Egydio Ferreira de Toledo, Francisco de Andrade Vasconcellos,
  Francisco José da Silva Toledo, Bento Marques Pereira, Lyndolpho José de Toledo,
  Candido Fernando dos Reis, Narcizo Feliciano de Almeida, Simplicio José Ferreira
  Armond & Jeronymo, João Hermenegildo da Silva & Marciano, Aurelio Silvino de
  Toledo, Leoniano José de Toledo & Altina, Antonio Rodrigues Paiva, Laurentino de
  Araujo Ferraz, Philomena Maria de Jesus & Vicente, Diogo Luiz Pessoa, Joaquim
  Rodrigues da Cunha, Virginio Estanislão de Lima & Bernabé, Christina & Flausina,
  Agostinho & Honorio, João Bento & Raymundo. Leopoldina, 23 de Julho de 1881."
abstract: >-
  An 1881 O Leopoldinense (Leopoldina, MG) notice announces a "Grande Loteria da
  Côrte" ticket consortium held by the depositario Ladisláo Egídio Ferreira de
  Toledo (P-0056) and lists its members, among them "Simplicio José Ferreira
  Armond" (P-0016) alongside a run of Toledos. It independently places Simplício
  in the Leopoldina Toledo circle in 1881 — before his 1899/1902 Muriaé police
  offices — and corroborates his integration into the Toledo family he married
  into (Eliza Balbina de Toledo). This is our Simplício, the Toledo son-in-law,
  not the elder Barbacena Tenente-Coronel namesake.
abstract_pt: >-
  Uma nota de 1881 em O Leopoldinense (Leopoldina, MG) anuncia um consórcio de
  bilhetes da "Grande Loteria da Côrte" sob depósito de Ladisláo Egídio Ferreira
  de Toledo (P-0056) e lista seus membros, entre eles "Simplicio José Ferreira
  Armond" (P-0016) ao lado de vários Toledos. Situa Simplício, de forma
  independente, no círculo Toledo de Leopoldina em 1881 — antes de seus cargos
  policiais em Muriaé (1899/1902) — e corrobora sua integração à família Toledo
  na qual se casou (Eliza Balbina de Toledo). É o nosso Simplício, genro dos
  Toledo, não o Tenente-Coronel Simplício, o mais velho, de Barbacena.
reliability:
  assessment: >-
    A contemporaneous newspaper notice naming Simplício as a lottery-consortium
    member alongside Ladisláo and other Toledos. Secondary and indirect for any
    vital fact, but a strong corroboration of his presence and Toledo social ties
    at Leopoldina in 1881. The Toledo consortium context is what identifies him as
    the son-in-law rather than the Barbacena namesake.
  informant: The lottery consortium (self-declared notice, signed at Leopoldina).
  limitations: >-
    A social/financial association notice, not a vital record: it attests presence
    and association, not a dated life event. The ticket numbers are omitted from
    the transcription.
