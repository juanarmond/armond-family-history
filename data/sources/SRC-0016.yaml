abstract: >-
  Chagas studies endogamous marriage strategies among families around Serra
  do Camapuã from 1750 to 1890. A section on the Ferreira Armond family states,
  while citing Antônio Henrique Duarte Lacerda, that the historical group was
  of Azorean origin, first established in São João del-Rei, then Barbacena and
  later parts of the Zona da Mata. It describes 1804 marriages linking the
  Ferreira Armond and Ferreira da Fonseca families and points to Lacerda's
  dissertation and archival marriage records for further investigation.
reliability:
  assessment: >-
    A scholarly secondary source useful for historical context and for locating
    earlier cited research and primary records.
  informant: >-
    Gabriel Afonso Vieira Chagas, writing a 2018 UFMG master's dissertation
    under academic supervision.
  limitations: >-
    The dissertation does not name Aristão Ferreira Armond, Simplicio Armand
    or Liliosa Paz Armond and does not establish that the repository's
    documented line descends from the historical Ferreira Armond group. Its
    Azorean-origin statement cannot be applied to this family line without a
    primary-source chain.
