  [f. 151:] [Page number, top right:] 151

  [Sentence continued from f. 150, not transcribed:] Padre Gonçalo Ferreira da
  Fonseca era vereador a Câmera de Queluz e, pelo que consta dos autos da
  Revolução Liberal,[34] o sacerdote foi um dos principais difusores da revolta
  entre os vereadores da vila que levou a decisão de declarar apoio aos
  revoltosos. Não por acaso, o Cônego Marinho, uma das principais figuras da
  revolta, esteve na fazenda dos Olhos D’Água entre 1842 e 1844 refugiado da
  perseguição do Império.

  A aliança entre as famílias Ferreira Armond e Ferreira da Fonseca foi selada
  definitivamente em 12 de junho de 1804, onze anos antes da data natalícia do
  Conde de Prados, através dos enlaces matrimoniais dos irmãos João Ferreira da
  Fonseca (neto) e Felisberto Ferreira da Fonseca com as irmãs Josepha Maria da
  Assunção e Joana Maria da Conceição ocorrido na capela de Nossa Senhora do
  Rosário do Curral Novo, filial da matriz de Nossa Senhora da Piedade de
  Barbacena, vila de residência dos Armond. Os contraentes eram irmãos do padre
  Gonçalo Ferreira da Fonseca, que à época, ainda era um aspirante ao sacerdócio,
  e as contraentes eram primas de Camillo Maria Ferreira Armond.

  Crê-se que a afinidade entre Camilo e Gonçalo em 1842, resultante da união das
  duas famílias, (afinal, dos 55 sobrinhos de Gonçalo, 22 eram primos de Camilo)
  foi decisiva na posição tomada pelas Câmeras de Barbacena e Queluz na revolução
  Liberal. Após o término do conflito, observa-se um aprofundamento das relações
  entre esses grupos, atestada pela troca de correspondência entre eles. Esses
  documentos encontram-se no Arquivo Particular da Fazenda de Santa Sophia,
  localizada em Santana do Deserto, nas proximidades da fronteira com o Estado do
  Rio de Janeiro e foram esmiuçados por Antônio Henrique Duarte Lacerda.[35] Das
  700 cartas que Lacerda selecionou no acervo da fazenda, 8 foram trocadas entre
  membros dos dois grupos que não tinham parentesco entre si, o que demonstra que
  o acordo selado no altar da Capela do Rosário beneficiou inclusive aqueles
  membros que não descenderam desse enlace matrimonial. Entretanto, é importante
  ressaltar que o objeto do trabalho de Lacerda eram as relações comerciais da
  família Ferreira Armond que se direcionavam prioritariamente à praça mercantil
  do Rio de Janeiro.

  [Footnotes:]

  [34] Arquivados no Museu e Arquivo Antônio Perdigão, em Conselheiro Lafaiete,
  Minas Gerais. Sem caixa e número.

  [35] LACERDA, Antônio Henrique Duarte. Negócios de Minas: família, fortuna,
  poder e redes de sociabilidades nas Minas Gerais – a família Ferreira Armonde
  (1751-1850). Niterói: Universidade Federal Fluminense, Instituto de Ciências
  Humanas e Filosofia, Departamento de História, 2010. [Tese de Doutorado]

  [f. 152:] [Page number, top right:] 152

  Quando retém-se o olhar apenas sobre a questão política, observa-se que as duas
  famílias permaneceram a totalidade do período imperial brasileiro nas fileiras
  do Partido Liberal. O padre Gonçalo Ferreira da Fonseca, afastado do cargo de
  vereador após a Revolução Liberal, retomou, poucos anos depois, sua cadeira na
  câmara de Queluz e lá ficou até 1857, ano de sua morte. Na legislatura seguinte,
  vislumbra-se entre os nomes dos eleitos a figura do padre Francisco Ferreira da
  Fonseca, sobrinho e afilhado de Gonçalo que herdou do tio o prestígio político e
  a vaga na câmera. Simplício José Ferreira da Fonseca e Cândido Ferreira da
  Fonseca (membros das duas famílias) assumiram cadeiras na câmera de Barbacena
  juntamente com o Conde de Prados e posteriormente são responsáveis pelos acordos
  políticos que possibilitaram a criação das vilas de Além Paraíba, Mar de Espanha
  e Santana do Deserto, respectivamente.

  As relações estabelecidas entre a parentela do Camapuã e aquela que se deslocou
  para a região do Paraibuna e lá arrematou considerável fortuna mantiveram um
  forte vínculo durante todo o século XIX e ultrapassaram as balizas estabelecidas
  para esse trabalho. Pode-se atestar essa relação próxima pelos inúmeros
  casamentos consanguíneos encetados entre esses dois grupos. Também é notório que
  o grupo residente no Camapuã beneficiou-se de sobremaneira dessa relação, haja
  vista o crescimento da influência política do ramo do Paraibuna nas negociações
  da corte, especialmente na proximidade com o Imperador Dom Pedro II, e no
  comércio da Praça do Rio de Janeiro.

  [Section heading:] 4.6 A família Ferreira Armond:

  Também de origem açoriana, a família Ferreira Armond se estabeleceu inicialmente
  em São João Del Rei, logo transferindo-se para Barbacena e, já no período do
  Império, vários de seus membros passaram a residir na Zona da Mata mineira.
  Segundo Antônio Henrique Duarte Lacerda, não obstante ter chegado nas Minas sem
  aparente relações familiares ou rede de sociabilidades que lhe permitissem
  sustentação na sua escalada econômica, os Ferreira Armond logo encontraram no
  comércio a oportunidade de ascensão social. Os membros de essa

  [No footnotes on this page.]

  [f. 153:] [Page number, top right:] 153

  família atuaram em toda a província e estenderam suas atividades à província do
  Rio de Janeiro.[36]

  Dentre as poucas famílias que se uniram pelos laços matrimoniais à Família
  Ferreira da Fonseca, destacam-se os Ferreira Armond. Seria necessário
  aventurar-se em outras fontes para averiguar se ambas famílias açorianas
  guardavam entre si laços de parentesco, o que o sobrenome em comum poderia
  sugerir. Entretanto, carecendo essas fontes, resta considerar os laços
  constituídos em território mineiro.

  Uma das figuras de maior renome dentre esse grupo é o referido Conde de Prados,
  Camilo Maria Ferreira Armond, que com agudo sentimento de unidade familiar,
  valeu-se de suas relações familiares para estender sua influência em diversos
  setores, desde os comerciais aos políticos. Camillo nasceu na Fazenda do Moinho
  em Barbacena, no dia 7 de agosto de 1815 e faleceu no Rio de Janeiro, no dia 14
  de agosto de 1882, sendo sepultado no Cemitério do Catumbi. Graduou-se em
  medicina pela Academia de Medicina de Paris, aos 27 dias do mês de novembro de
  1837. Próximo da metade do século XIX construiu a Fazenda de Santa Sophia,
  situada em Santana do Deserto, que lhe aproximaria ainda mais da corte
  localizada na cidade do Rio de Janeiro. Em 30 de março de 1861 foi agraciado com
  o título de Barão de Prados pelas mãos do Imperador Dom Pedro II e, por mercê do
  mesmo, elevado a Visconde de Prados em 17 de maio de 1871. O título de Conde de
  Prados viria dez anos depois, em 15 de junho de 1881.

  Semelhantemente a primazia familiar assumida pelo padre Gonçalo Ferreira da
  Fonseca em relação ao seu grupo familiar, enquanto cabeça política do grupo e,
  portanto, grande responsável pelos arranjos matrimoniais, o Conde de Prados pode
  ser visto como a figura central da família Ferreira Armond. Ambos guiaram suas
  famílias, no sentido de preservarem o patrimônio através do encetamento de
  casamentos consanguíneos. Entretanto, para além do fator da repercussão
  patrimonial e das alianças políticas ligadas ao Partido Liberal, coube ao Conde
  proteger ainda a nobreza conquistada através dos títulos imperiais. Nesse
  sentido, credita-se a ele a interferência para a celebração do matrimônio de sua
  irmã, Camilla Maria Ferreira de Assis com o Tenente-Coronel José Ribeiro de
  Rezende que viria ser agraciado com o título de Barão de Juiz de Fora também em
  1881.

  [Footnotes:]

  [36] LACERDA, Antônio Henrique Duarte. Negócios de Minas: família, fortuna,
  poder e redes de sociabilidades nas Minas Gerais – a família Ferreira Armonde
  (1751-1850). Niterói: Universidade Federal Fluminense, Instituto de Ciências
  Humanas e Filosofia, Departamento de História, 2010, p. 53. [Tese de Doutorado]

  [f. 154:] [Page number, top right:] 154

  Camilla Maria Ferreira de Assis era viúva de primeiras núpcias do primo Cândido
  Ferreira da Fonseca, filho de João Ferreira da Fonseca (irmão do padre Gonçalo)
  e Josepha Joaquina da Assunção. Fora com o primeiro marido que Camilla mudara-se
  de Barbacena para Santana do Deserto, onde Cândido logrou sucesso em sua
  empreitada, enquanto fazendeiro de café, tornando-se consideravelmente abastado.
  Foi proprietário da Fazenda Santana e um dos organizadores da Empresa União
  Indústria. Acredita-se que não conquistou os mesmos títulos de seu cunhado
  porque viera a falecer ainda em 10 de agosto de 1855. Seu irmão, Simplício José
  Ferreira da Fonseca, cuja trajetória marcada pelo casamento com duas sobrinhas
  já foi analisada, foi agraciado com o título de Comendador da Ordem da Rosa.

  Entretanto, a importância política ascendente assumida pela família Ferreira
  Armond, ao longo do século XIX, teve princípio com as trajetórias pessoais de
  Marcelino José Ferreira Armond e Mariano José Ferreira Armond que eram tios do
  Conde de Prados, de Camilla, Candido e Simplício. Marcelino foi o primeiro Barão
  de Pitangui, título posteriormente herdado pelo seu filho, Honório Augusto José
  Ferreira Armond; e seu irmão Mariano fora vereador da Câmara Municipal de
  Barbacena, tendo hospedado Dom Pedro I, quando o Imperador esteve na Província
  de Minas Gerais em 1831. No período regencial, Mariano fora deputado na
  Assembleia de Minas Gerais, de 1835 a 1839. Credita-se a ele os primeiros riscos
  do projeto de uma estrada de rodagem que ligaria a Corte à sede da Província de
  Minas, executado anos depois pelo seu filho Mariano Procópio Ferreira Lage.

  Tal como o primo Simplício, também agraciado com o título de Comendador, Mariano
  Procópio Ferreira Lage[37] havia estudado na Europa e nos Estados Unidos em sua
  juventude. Adquiriu considerável prestígio por aperfeiçoar e executar o projeto
  do pai, a Estrada de Rodagem União Indústria, que objetivava facilitar o
  escoamento da produção de café para o porto do Rio de Janeiro, haja vista a
  família Ferreira Armond devesse sua ascensão social a esse produto. Na execução
  da obra, Mariano Procópio promoveu a chegada de considerável leva de imigrantes
  italianos e alemães que se estabeleceram em Juiz de Fora. Fundou a Escola
  Agrícola União Indústria e dirigiu a Estrada de Ferro Dom Pedro II. Sua
  biografia

  [Footnotes:]

  [37] Embora seu último sobrenome fosse Armond, preferiu assinar Lage em
  referência a Fazenda da Laje, localizada na Vila de Barbacena, onde nasceu no
  dia 23 de junho de 1821.

  [f. 155:] [Page number, top right:] 155

  aponta que foi ainda presidente do Jockey Club Brasileiro e integrante da
  delegação brasileira à Exposição Universal de Paris, em 1867.[38]

  Entretanto, dentro dessa considerável biografia, é importante destacar que
  Mariano seguiu os passos do pai na carreira política, sendo também deputado na
  Assembleia Provincial de Minas Gerais entre 1861 e 1863. Tal como o pai,
  hospedou o Imperador Dom Pedro II, quando da inauguração da Estrada União
  Indústria em 23 de junho de 1861 e, seguindo os passos dos primos, recebeu de
  Dom Pedro II o título de Barão de Santana em 20 de junho de 1861. Entretanto,
  Mariano transferiu a honraria à sua mãe, Maria José Ferreira Lage, que tornou-se
  a Baronesa de Santana.[39]

  Homônima da mãe, Maria José Ferreira Lage, irmã de Mariano Procópio, uniu-se em
  matrimônio com o primo Honório Augusto José Ferreira Armond, o Barão de
  Pitangui, tornando-se portanto a segunda Baronesa de Pitangui. Conforme apontado
  anteriormente, esse casamento entre primos não é exceção na família, pelo
  contrário, a opção por matrimônios intrafamiliares foi uma estratégia muito
  usada pelos Ferreira Armond. Dos 13 membros da geração de Maria José, para os
  quais foi possível realizar algum levantamento, chega-se a 6 casamentos
  intrafamiliares, gerando um índice de 46,15% de consanguinidade dentre as
  uniões.

  A forte influência angariada pela família Ferreira Armond no cenário político da
  Província de Minas Gerais e da corte do Rio de Janeiro favoreceu
  consideravelmente os negócios empreendidos pela família Ferreira da Fonseca,
  especialmente no que tange à escoação das safras das fazendas localizadas no
  entorno da Serra do Camapuã. Além disso, incontáveis membros da família Ferreira
  da Fonseca valeram-se do parentesco com a família Armond e fixaram residência na
  Comarca do Paraibuna na segunda metade do século XIX, muitas vezes, através da
  união matrimonial com o ramo Armond. Esse é o caso de José Ferreira da Fonseca
  que passou a residir em Além Paraíba, nas proximidades do primo Simplício José
  Ferreira da Fonseca, e uniu seu filho primogênito Antônio Ferreira Martins com
  Joana Ferreira da Fonseca em 1863, quando essa contava com apenas nove anos de
  idade. Joana era filha de Manoel Ferreira da Fonseca e Maria Romana da

  [Footnotes:]

  [38]
  http://alemparaibahistoria.blogspot.com.br/2011/08/ferreira-armond-uma-familia-mineira.html
  Consultado em 27 de junho de 2017 às 14:06.

  [39] Santana refere-se a Santana do Deserto, localidade de residência de Maria
  José Ferreira Lage.

  [f. 156:] [Page number, top right:] 156

  Conceição que haviam herdado a Fazenda dos Olhos D’Água com o falecimento do
  Padre Gonçalo Ferreira da Fonseca.

  A consanguinidade entre essas duas famílias eram tidas em enorme consideração
  por seus membros, como pode-se aventar pelos cinco casamentos levantados entre
  os dois ramos na geração analisada. Tais relações foram utilizadas para proteção
  mútua e redes de influência, especialmente no que toca aos negócios envolvendo a
  corte do Rio de Janeiro e a política local, como visto durante a Revolução
  Liberal de 1842.

  [Section heading:] 4.7 Em vias de conclusão...

  A pujança econômica vivida pelas famílias Ferreira da Fonseca e Ferreira Armond
  no período imperial brasileiro não se assemelha de nenhuma forma com a situação
  econômica dos descendentes desse grupo que ainda hoje residem nas regiões da
  Serra do Camapuã, Entre Rios de Minas e Zona da Mata mineira. A prosperidade e
  requinte ficaram no passado e deram lugares a regiões, como a que abrigava a
  fazenda dos Olhos D’água, que escondem o áureo passado que tiveram.

  Locus por excelência da família Ferreira da Fonseca, a fazenda dos Olhos D’Água
  foi completamente destruída por um incêndio na década de 1980. Perdeu-se desde
  mobiliários a documentos que eram guardados em seu interior. A julgar pelo
  acervo encontrado em outras fazendas que foram propriedades dessa família,
  acredita-se que a perda foi irreparável.

  Quem hoje visita o sítio no qual se localizava a sede da fazenda encontra apenas
  as bases de pedra do casarão que dão margem a concluir a enorme extensão da
  residência que, segundo relatos dos descendentes, era construída em dois andares
  e contava com mais de dez dormitórios. Há ainda a pequena capela de Nossa
  Senhora da Lapa dos Olhos D’Água, sita de fronte as ruínas do casarão, e que
  ainda hoje recebe ritos religiosos esporádicos. Já os descendentes da família
  oitocentista encontram-se espalhados em pequenos sítios no entorno do extinto
  arraial dos Olhos d’Água, tendo muitos deles migrado para os municípios
  limítrofes a partir de 1884, quando um surto de febre tifo dizimou considerável
  parte dos habitantes dessa localidade, como se pode inferir pela análise dos
  acentos de óbitos [The sentence continues on f. 157, not transcribed.]

  [No footnotes on this page.]
