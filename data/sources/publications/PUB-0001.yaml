transcription: >-
  Relevant passages transcribed verbatim from the 185-page dissertation (PDF text
  layer), page numbers as printed; a secondary academic lead, so only the parts
  naming the Ferreira Armond family are transcribed. [Sumário, f. 16: "4.2. Dos
  Açores para as Minas: a descendência da família Ferreira da Fonseca ... 4.6. A
  família Ferreira Armond".] [f. 151:] "A aliança entre as famílias Ferreira
  Armond e Ferreira da Fonseca foi selada definitivamente em 12 de junho de 1804,
  onze anos antes da data natalícia do Conde de Prados, através dos enlaces
  matrimoniais dos irmãos João Ferreira da Fonseca (neto) e Felisberto Ferreira da
  Fonseca com as irmãs Josepha Maria da Assunção e Joana Maria da Conceição
  ocorrido na capela de Nossa Senhora do Rosário do Curral Novo, filial da matriz
  de Nossa Senhora da Piedade de Barbacena, vila de residência dos Armond. Os
  contraentes eram irmãos do padre Gonçalo Ferreira da Fonseca [...] e as
  contraentes eram primas de Camillo Maria Ferreira Armond." [f. 153:] "Dentre as
  poucas famílias que se uniram pelos laços matrimoniais à Família Ferreira da
  Fonseca, destacam-se os Ferreira Armond. Seria necessário aventurar-se em outras
  fontes para averiguar se ambas famílias açorianas guardavam entre si laços de
  parentesco, o que o sobrenome em comum poderia sugerir. Entretanto, carecendo
  essas fontes, resta considerar os laços constituídos em território mineiro. Uma
  das figuras de maior renome dentre esse grupo é o referido Conde de Prados,
  Camilo Maria Ferreira Armond [...]. Camillo nasceu na Fazenda do Moinho em
  Barbacena, no dia 7 de agosto de 1815 e faleceu no Rio de Janeiro, no dia 14 de
  agosto de 1882, sendo sepultado no Cemitério do Catumbi."
