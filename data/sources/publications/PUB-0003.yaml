notes:
- text: >-
    BORER I and BORER II are treated by the compiler as separate immigrant families despite
    the shared "Borer" surname. [Corrected 2026-10-09 from the full transcription: the
    quotation "não havendo evidência de parentesco próximo entre os dois grupos (Borer e
    Bohrer)" is on p.302 and contrasts these Soleure Borers with the Jura Bohrers, not
    BORER I with BORER II; and BORER I's "Casa/Lote 70/56", earlier given here, is on no
    held page.] Laurent Borer (BORER II, P-0068) had house 73 / lot 86 (p.300). Valentim
    Martinho Bohrer (P-0028) descends from Laurent (BORER II), while Francisco José Bohrer
    (P-0034) descends from Jacob (BORER I). Iris Bohrer Muniz (P-0007) is the junction of
    both lines: her father João Gonçalves Bohrer (P-0014) descends from BORER II and her
    mother Celina Bohrer (P-0015) from BORER I. [Corrected 2026-10-09: this note earlier
    named Antenor Muniz as her father; he was her husband.]
- text: >-
    The Grindel Catholic marriage register (image rec-bohrer-werly-borer-marriages-grindel-1780.jpg)
    provides PRIMARY evidence for the marriage of Jacobus Wehrli × Elisabetha Borer
    on 27 January 1782, Grindel (entry 4, page 71). This image is in the retrieval
    area; it needs to be archived as a PAR source in evidence/parish/ when the owner
    transfers it. [Superseded: the image is now held as PAR-0029 and the 1782 marriage is
    confirmed on F-0035.] For now, the marriage date 27 Jan 1782 is recorded as strong-evidence
    (image read directly by the retrieval agent and transcribed in the 2026-08-07
    receipt, receipt path research/from-retrieval/output/receipts/bohrer-images-deep-read-2026-08-07.md).
