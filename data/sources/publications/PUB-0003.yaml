transcription: >-
  [p.300 — BORER (I), Jacob b.1801 Erschwil → Francisco José's line:]
  "1.1.4. Francisco José Borer — n. 04/07/1832, f. 06/07/1888, causa mortis:
  insuficiência mitral e dilatação aórtica. ... O casal morava no Alto da Serra."
  Children listed: Ludovina n.21/07/1862 f.27/12/1862 (infant); Laura n.16/08/1866;
  Guilherme n.06/04/1868; Fernando n.03/01/1872 cas.06/05/1911 × Julia de Oliveira
  Cerbino. ⚠ Joaquim José absent from this list (conflict with PRB-0005 will, which
  names him as firstborn — compiler apparently missed his baptism record).
  Francisco José's siblings: Catharina n.24/07/1830 f.16/01/1872 (⚭ Frederico
  Chaboudez); Maria n.21/09/1834 (⚭ Francisco Xavier Chaboudez); Augusto
  n.10/02/1837; João José n.10/09/1840 f.16/06/1859 (solteiro). Jacob Borer
  (Patriarca, BORER I) assigned Casa/Lote 70/56 per DB.

  [pp.300-301 — BORER (II), Laurent b.1797 Grindel → Vicente → Valentim line:]
  "Laurent Borer, filho de certo Jacob Borer, de Grindel, Soleure, veio
  aparentemente só para o Brasil … embarcaria ele no Heureux Voyage, ocupando em
  Nova Friburgo a casa 73 e o lote 86. Nesta vila viria a se casar em 3 de julho
  de 1820, com Anna Maria Werhly …" Compilation counts "ao menos onze filhos";
  Casa Suíça DB narrative gives "doze filhos" — one-child discrepancy noted.
  Children genealogy tree p.301 (selected): José n.28/03/1821; Anna Maria n.19/06/1822;
  José Lourenço n.07/07/1823; Anna Maria (2nd) n.03/05/1825; Justina n.06/06/1827;
  José Joaquim [entry cut off]; Vicente n.06/09/1828 ⚭ 11/04/1864 × Maria Heggendorn
  (filha de Joseph Heggendorn × Maria (Maria Amélia?) Freese); José Constantino
  n.08/09/1829; Barbara Elisabeth n.14/12/1830; Regina n.07/07/1832; Maria
  n.27/12/1834; Thereza n.25/08/1836. Vicente's children: José Domingos n.19/03/1864;
  Maria Elisabeth n.15/12/1866; Valentim Martinho n.14/11/1868; Vicente n.16/04/1871.
  Note: José Domingos born ~3 weeks before parents' 11 April 1864 civil marriage.

  [WEHRLI — Casa Suíça DB entries:]
  Johann Jacob Wehrli, patriarca, b.17/01/1751 Grindel, Soleure; profession:
  agricultor; arrived 1819 on Heureux Voyage, Casa/Lote 73/86; married Elisabetha
  Borer [27 Jan 1782 per Swiss marriage register primary image]; died NF 28/05/1827.
  Anna Maria Werhly, 5th daughter, b.1793 Grindel, Solothurn; arrived 1819 Heureux
  Voyage; married Laurent Borer 03/07/1820 NF; 12 children.

  [p.302 — BORER (III), Johann b.01/08/1792 Erschwil — DISTINCT from our family:]
  Descendants use "Borer" surname; no proven kinship with Borer I or Borer II.

transcription_pt: >-
  [p.300 — BORER (I), Jacob n.1801 Erschwil → linha de Francisco José:]
  "1.1.4. Francisco José Borer — n. 04/07/1832, f. 06/07/1888, causa mortis:
  insuficiência mitral e dilatação aórtica. ... O casal morava no Alto da Serra."
  Filhos listados: Ludovina n.21/07/1862 f.27/12/1862 (falecida na infância); Laura n.16/08/1866;
  Guilherme n.06/04/1868; Fernando n.03/01/1872 cas.06/05/1911 × Julia de Oliveira
  Cerbino. ⚠ Joaquim José ausente desta lista (conflito com o testamento PRB-0005, que
  o nomeia como primogênito — o compilador aparentemente não encontrou seu registro de batismo).
  Irmãos de Francisco José: Catharina n.24/07/1830 f.16/01/1872 (⚭ Frederico
  Chaboudez); Maria n.21/09/1834 (⚭ Francisco Xavier Chaboudez); Augusto
  n.10/02/1837; João José n.10/09/1840 f.16/06/1859 (solteiro). Jacob Borer
  (Patriarca, BORER I) recebeu a Casa/Lote 70/56 conforme o DB.

  [pp.300-301 — BORER (II), Laurent n.1797 Grindel → linha Vicente → Valentim:]
  "Laurent Borer, filho de certo Jacob Borer, de Grindel, Soleure, veio
  aparentemente só para o Brasil … embarcaria ele no Heureux Voyage, ocupando em
  Nova Friburgo a casa 73 e o lote 86. Nesta vila viria a se casar em 3 de julho
  de 1820, com Anna Maria Werhly …" A compilação conta "ao menos onze filhos";
  a narrativa do DB da Casa Suíça dá "doze filhos" — discrepância de um filho registrada.
  Árvore genealógica dos filhos p.301 (selecionados): José n.28/03/1821; Anna Maria n.19/06/1822;
  José Lourenço n.07/07/1823; Anna Maria (2ª) n.03/05/1825; Justina n.06/06/1827;
  José Joaquim [entrada cortada]; Vicente n.06/09/1828 ⚭ 11/04/1864 × Maria Heggendorn
  (filha de Joseph Heggendorn × Maria (Maria Amélia?) Freese); José Constantino
  n.08/09/1829; Barbara Elisabeth n.14/12/1830; Regina n.07/07/1832; Maria
  n.27/12/1834; Thereza n.25/08/1836. Filhos de Vicente: José Domingos n.19/03/1864;
  Maria Elisabeth n.15/12/1866; Valentim Martinho n.14/11/1868; Vicente n.16/04/1871.
  Nota: José Domingos nascido ~3 semanas antes do casamento civil dos pais em 11 de abril de 1864.

  [WEHRLI — entradas do DB da Casa Suíça:]
  Johann Jacob Wehrli, patriarca, n.17/01/1751 Grindel, Soleure; profissão:
  agricultor; chegou em 1819 no Heureux Voyage, Casa/Lote 73/86; casou-se com Elisabetha
  Borer [27 jan 1782 conforme imagem primária do registro de casamento suíço]; faleceu em NF 28/05/1827.
  Anna Maria Werhly, 5ª filha, n.1793 Grindel, Solothurn; chegou em 1819 no Heureux
  Voyage; casou-se com Laurent Borer 03/07/1820 NF; 12 filhos.

  [p.302 — BORER (III), Johann n.01/08/1792 Erschwil — DISTINTO da nossa família:]
  Os descendentes usam o sobrenome "Borer"; nenhum parentesco comprovado com Borer I ou Borer II.

abstract: >-
  Genealogical compilation for Nova Friburgo Swiss-German immigrant families.
  Pp.300-301 cover BORER I (Jacob Borer b.1801 Erschwil — Francisco José Bohrer's
  line) and BORER II (Laurent Borer b.1797 Grindel — Valentim Martinho Bohrer's
  line). Pp.302-303 cover BORER III (unrelated Johann Borer b.1792 Erschwil line).
  The Casa Suíça database entries and WEHRLI section document Johann Jacob Wehrli
  × Elisabetha Borer as the parents of Anna Maria Werhly, Laurent's wife, with
  primary confirmation of their 1782 Grindel marriage from the Swiss parish register
  (image rec-bohrer-werly-borer-marriages-grindel-1780.jpg, entry 4, page 71).
abstract_pt: >-
  Compilação genealógica das famílias imigrantes suíço-alemãs de Nova Friburgo.
  As pp.300-301 abrangem BORER I (Jacob Borer n.1801 Erschwil — linha de
  Francisco José Bohrer) e BORER II (Laurent Borer n.1797 Grindel — linha de
  Valentim Martinho Bohrer). As pp.302-303 abrangem BORER III (linha não
  aparentada de Johann Borer n.1792 Erschwil). Os registros do banco de dados da
  Casa Suíça e a seção WEHRLI documentam Johann Jacob Wehrli × Elisabetha Borer
  como os pais de Anna Maria Werhly, esposa de Laurent, com confirmação primária
  de seu casamento de 1782 em Grindel a partir do registro paroquial suíço
  (imagem rec-bohrer-werly-borer-marriages-grindel-1780.jpg, entrada 4, página
  71).
reliability:
  assessment: >-
    A NF record-citing genealogical compilation that draws on local parish and civil
    registers. Treated as strong-evidence for specific dates and parentage assertions.
    Two compilation-internal conflicts noted: Laurent's child count (11 in narrative
    vs 12 in DB text); and Joaquim José Bohrer's absence from Francisco José's
    children despite being named firstborn in PRB-0005. On Vicente's middle name:
    family-bohrer.md plan notes "Lourenço" as blog-sourced; the compilation gives
    only "Vicente" with no middle name — "Lourenço" is not confirmed here.
    On Vicente's wife: the compilation confirms "Maria Heggendorn" but does not
    give "Thecla Regina" or a birth date — those details appear only in blog sources.
  informant: Henrique Bon (compiler); Casa Suíça database (same underlying data)
  limitations: >-
    Secondary compiled source; not all NF colonist records are indexed. Swiss origin
    data (Laurent's father "Jacob Borer de Grindel") is cited by the compiler, not
    independently verified in Swiss parish registers by this repository. Laurent's
    father is named "certo Jacob Borer" — the "certo" hedges the compiler's
    confidence. The Grindel parish register images held in the retrieval drop
    (images 13–16) show a "Joannes Borer × Ana Maria Werli" baptising daughter
    Maria Barbara on 23 Dec 1782, Grindel — a strong lead for Laurent's parentage
    but not yet confirmed as the same Jacob/Joannes Borer.
