notes:
- text: >-
    BORER I and BORER II are distinct immigrant families despite the shared "Borer"
    surname. The compilation states "não há evidência de parentesco próximo entre os
    dois grupos." Jacob Borer (BORER I, P-0050) had Casa/Lote 70/56; Laurent Borer
    (BORER II, P-0068) had Casa/Lote 73/86 — they were co-passengers on the same
    Heureux Voyage but allocated different lots. Valentim Martinho Bohrer (P-0028)
    descends from Laurent (BORER II), while Francisco José Bohrer (P-0034) descends
    from Jacob (BORER I). Iris Bohrer (P-0007) is the junction of both lines (her
    father Antenor Muniz married into the BORER I line through Celina; her own
    Bohrer surname comes through BORER II via her father's side — but see family
    connections for the exact path).
- text: >-
    The Grindel Catholic marriage register (image rec-bohrer-werly-borer-marriages-grindel-1780.jpg)
    provides PRIMARY evidence for the marriage of Jacobus Wehrli × Elisabetha Borer
    on 27 January 1782, Grindel (entry 4, page 71). This image is in the retrieval
    area; it needs to be archived as a PAR source in evidence/parish/ when the owner
    transfers it. For now, the marriage date 27 Jan 1782 is recorded as strong-evidence
    (image read directly by the retrieval agent and transcribed in the 2026-08-07
    receipt, receipt path research/from-retrieval/output/receipts/bohrer-images-deep-read-2026-08-07.md).
