  Histórico da família: Wehrli

  Johann Jacob 68 anos, católico, viajou com sua esposa Elisa Borer 59 anos, e filhos,
  Henri 37 anos, Salomé 34 anos, Marianne 30 anos, Catherine 29 anos, Anne-Marie 26 anos,
  Sophrosine 25 anos, Elise 24 anos, Jacques 18 anos, Joseph 14 anos, Catherine Kilker
  (Kilcher) 08 anos.

  Sendo que Marianne 30 anos e Elise 24 anos, não embarcaram, estavam escritas, mas
  permaneceram na Europa.

  Em Nova Friburgo, o patriarca dedicou-se a agricultura até sua morte em 28/05/1827, e a
  matriarca faleceu em 10/10/1832. Os filhos:

  Jacques (Jacob) Wehrli casou-se em 05/08/1833 com Anna Maria Vogt, tiveram oito filhos.

  Joseph Wehrli casou-se em 15/04/1828 com Margueritte Montavon.

  Salomé Wehrli. Viúva com uma filha, casou-se no Brasil, em 03/07/1820 com o viúvo Louis
  Nicolas Villette.

  Marianne Wehrli. Permaneceu na Suiça.

  Catherine Wehrli casou-se na Holanda com Johann Borer, provavelmente seu primo, tiveram
  sete filhos.

  Anne Marie Wehrli casou-se em 03/07/1820 (mesma data do matrimônio de Salomé Wehrli) com
  Lorenz (Laurent) Borer, tiveram doze filhos.

  Elise Wehrli, permaneceu na Suiça.

  Henri Wehrli casou-se desde a Europa com Sophorosine Marie (Borer?). Ele faleceu já
  viúvo em 23/06/1865 e ela em 22/05/1861. Tiveram nove filhos.

