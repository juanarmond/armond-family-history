  BORER ( II )

  Grindel — Soleure | Heureux Voyage | Alemão | Cat. | 73/86

  NP | MO | NE | NOME | IDADE/D. N | DESFECHO | DATA FALEC. | LOCAL

  1874 | … | 165 | Laurent | 27/02/1797 | Chegou | [blank] | [blank]

  Laurent Borer, filho de certo Jacob Borer, de Grindel, Soleure, veio aparentemente só
  para o Brasil, certamente porém, contando entre seus parentes os conterrâneos e também
  imigrantes, Jacob e Johann Borer. Segundo o RGCS não fora o mesmo matriculado na Suíça,
  estando sem passaporte tendo ocupado o lugar de Joseph Lutz, candidato que desertara.

  Católico, de idioma alemão e com 22 anos em 1819 (o LC assinala 18), embarcaria ele no
  Heureux Voyage, ocupando em Nova Friburgo a casa 73 e o lote 86. Nesta vila viria a se
  casar em 3 de julho de 1820, com Anna Maria Werhly, consórcio este, ao que tudo indica,
  apenas uma forma de regularizar uma situação pré-existente. Sua noiva, uma jovem que
  vivia à mesma casa, em companhia dos patriarcas Johann-Jacob Werhly e Elisabeth Borer,
  seus pais, teria grande chance de ser mesmo prima de seu futuro marido. O casal gerou
  pelo menos onze filhos relacinados [sic] no tópico “Genealogia”.

  Não há referências quanto ao óbito deste colono, que teria permanecido toda a vida no
  perímetro municipal, provavelmente na região do vale do Macaé. Seus descendentes
  atualmente, ao que tudo indica, utilizam o sobrenome na forma “Bohrer”, confundindo-se,
  pois, com aqueles do Jura.

