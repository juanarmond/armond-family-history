  Johann Borer, alfaiate de Erchwil [sic], casou-se na Holanda com Catharina Werhly, filha
  de Johann Werhly e Elisabeth Borer, com cuja família dividiria a casa 73 e o lote 86.
  Como se pode observar também pelo exposto em Laurent Borer, estabeleceriam ambas as
  famílias desde a Suíça uma estreita ligação, que se manteria no Novo Mundo. Passageiro
  do Heureux Voyage, como o antecessor, de religião católica e idioma alemão, teria ele
  pelo menos sete filhos em Nova Friburgo, sendo desconhecida a data de seu óbito. Sabe-se
  porém, que em 1855 estaria este imigrante ainda vivo, registrando toda a data colonial
  87 e metade da 86 e 96 (as outras metades pertenceriam ao cunhado Heinrich Wehrli),
  perfazendo a primeira gleba 300 por 750 braças e as outras duas 150 por 1500 braças.

  Os descendentes deste ramo dos Borer utilizam também, atualmente, o sobrenome como os do
  Jura, não havendo evidência de parentesco próximo entre os dois grupos (Borer e Bohrer).

