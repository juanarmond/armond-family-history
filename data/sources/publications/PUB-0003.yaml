  Histórico da família: Borer ( II )

  Laurent, 22 anos, viajou só aparentemente a bordo do Heureux Voyage, chegando ao Brasil.

  Já em Nova Friburgo, se casa com Anna Maria Werhly em 3 de julho de 1820, ao que tudo
  indica estariam apenas regularizando uma situação pré-existente, o casal teria 11
  filhos. Provavelmente o casal permaneceu toda a vida na região do vale do Macaé.

  José Borer nasceu em 28/03/1821, casa-se com Ana Luíza Marfurt. Uma vez viúvo se casa
  com Bibiana Heggendorn. Tendo 9 filhos, apenas do segundo matrimônio.

  Anna Maria Borer nasceu em 19/06/1822. Casa-se com Stefan Wermelinger. Descendentes em
  Wermelinger. [o histórico continua abaixo da margem inferior da captura]

  [imagem genérica à direita:] IMAGEM NÃO DISPONÍVEL

  [Nota editorial: “6º filho” corresponde à posição de Vicente como sexto filho listado na
  p.301 (numerado 1.1.7 porque falta o 1.1.5). Nenhum segundo nome é dado.]

abstract: >-
  Genealogical compilation for Nova Friburgo's Swiss immigrant families. The held pages are p.300
  (the end of BORER I — Francisco José Bohrer's line and his siblings — and the opening of BORER
  II), p.301 (BORER II: Laurent Borer, b. 27/02/1797, Grindel, and his eleven numbered children,
  among them Vicente, father of Valentim Martinho Bohrer), and pp.302–303 (the end of BORER II,
  then BORER III, BORNET and BORTER). BORER III is Johann Borer of Erschwil, whom the compiler
  calls "provavelmente também filho de Jacob Borer" and who married Catharina Werhly, daughter of
  Johann Werhly and Elisabeth Borer — a sister of Laurent's wife — sharing house 73 / lot 86 with
  her family. The Casa Suíça database entries (Johann Jacob Wehrli, Anne-Marie Wehrli, Vicente
  Borer) give Johann Jacob Wehrli × Elisabetha ("Elisa") Borer as the parents of Anna Maria
  Werhly, Laurent's wife; their 1782 Grindel marriage is held separately as an original record
  (PAR-0029). The BORER I header (Jacob Borer) is on p.299, not held. All pages are transcribed in
  full.
abstract_pt: >-
  Compilação genealógica das famílias imigrantes suíças de Nova Friburgo. As páginas guardadas são
  a p.300 (o fim de BORER I — a linha de Francisco José Bohrer e seus irmãos — e o início de BORER
  II), a p.301 (BORER II: Laurent Borer, n. 27/02/1797, Grindel, e seus onze filhos numerados,
  entre eles Vicente, pai de Valentim Martinho Bohrer) e as pp.302–303 (o fim de BORER II, depois
  BORER III, BORNET e BORTER). BORER III é Johann Borer, de Erschwil, que o compilador diz
  "provavelmente também filho de Jacob Borer" e que casou com Catharina Werhly, filha de Johann
  Werhly e Elisabeth Borer — irmã da mulher de Laurent —, dividindo com a família dela a casa 73 /
  lote 86. Os registros do banco de dados da Casa Suíça (Johann Jacob Wehrli, Anne-Marie Wehrli,
  Vicente Borer) dão Johann Jacob Wehrli × Elisabetha ("Elisa") Borer como pais de Anna Maria
  Werhly, mulher de Laurent; o casamento deles em Grindel, em 1782, está guardado à parte como
  registro original (PAR-0029). O cabeçalho de BORER I (Jacob Borer) está na p.299, que não temos.
  Todas as páginas estão transcritas na íntegra.
reliability:
  assessment: >-
    A NF record-citing genealogical compilation that draws on local parish and civil
    registers. Its dates and parentage assertions corroborate records; alone they support
    a hypothesis (research/README.md, since 2026-10-09). Two compilation-internal
    conflicts noted: Laurent's child count ("pelo menos onze" and eleven numbered
    children in the book, "11 filhos" in the Borer database history, "doze filhos" only
    in the Wehrli database history); and Joaquim José Bohrer's absence from Francisco José's
    children despite being named firstborn in PRB-0005. On Vicente's middle name:
    family-bohrer.md plan notes "Lourenço" as blog-sourced; the compilation gives
    only "Vicente" with no middle name — "Lourenço" is not confirmed here.
    On Vicente's wife: the compilation confirms "Maria Heggendorn" but does not
    give "Thecla Regina" or a birth date — those details appear only in blog sources.
  informant: Henrique Bon (compiler); Casa Suíça database (same underlying data)
  limitations: >-
    Secondary compiled source; not all NF colonist records are indexed. Swiss origin
    data (Laurent's father "Jacob Borer de Grindel") is cited by the compiler, not
    independently verified in Swiss parish registers by this repository. Laurent's
    father is named "certo Jacob Borer" — the "certo" hedges the compiler's
    confidence. The Grindel parish register images held in the retrieval drop
    (images 13–16) show a "Joannes Borer × Ana Maria Werli" baptising daughter
    Maria Barbara on 23 Dec 1782, Grindel — a strong lead for Laurent's parentage
    but not yet confirmed as the same Jacob/Joannes Borer.
