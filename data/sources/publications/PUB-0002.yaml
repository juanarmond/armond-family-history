transcription: >-
  Relevant passages transcribed verbatim from the ~504-page (2-vol.) doctoral
  thesis (PDF text layer), page numbers as printed; a secondary academic lead.
  Only the passages bearing on the historical Barbacena Ferreira Armonde family
  and its Simplício José Ferreira Armonde are transcribed. [f. 150:] "A riqueza de
  Francisco Ferreira Armonde veio junto com a distinção. Em algum momento de sua
  vida ele se tornou Alferes, uma vez que assim foi qualificado na documentação
  analisada. Consta de seu inventário que por ocasião do ordenamento do filho
  Francisco Antônio Ferreira Armonde, foi doado para o patrimônio do mesmo, uma
  morada de casa na rua direita do Rosário, na Vila de Barbacena [...]. Para o
  outro filho padre, José Joaquim Ferreira Armonde, o casal doou uma sesmaria de
  terras [...]. A viúva, Felizarda Maria Francisca de Assis [...]." [f. 152, on
  the 1831 Barbacena census:] "Simplício, aos 46 anos, não teve sua profissão
  discriminada, mas assina o censo do lugar na qualidade de Juiz de Paz. A casa
  contava com 66 mancípios." [f. 155, the 1845 partilha:] "a justiça calculou o
  monte-mor do casal Francisco Ferreira Armonde e Felizarda Maria de Assis em R$
  321:751$000 [...] deste monte deveriam ser abatidas as quantias relativas aos
  créditos que havia na casa e pertencentes aos herdeiros Simplício e Joaquim, que
  somavam R$ 89:860$000 [...] 'as quantias provenientes de créditos que existiam
  na casa pertencentes aos herdeiros falecidos Simplício e Joaquim'." [f. 218:] "O
  primogênito de Mariano José Ferreira Armonde e Maria José de Santana nasceu em
  Barbacena no dia 23 de junho de 1821, sendo seus padrinhos de batismo o tio
  Simplício José Ferreira Armonde e a avó Felizarda Maria Francisca de Assis. O
  batismo foi realizado pelo padre e tio paterno José Joaquim Ferreira Armonde."
  (The thesis's "died solteiro" characterisation summarised in the abstract was
  not located verbatim in the text layer; these passages establish this Simplício
  as a Barbacena son of Francisco, a Juiz de Paz aged 46 in 1831, deceased as an
  heir by the 1845 partilha — distinct from P-0016.)
