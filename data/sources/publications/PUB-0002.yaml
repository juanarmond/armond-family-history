  (Nota editorial: a caracterização "died solteiro" (morreu solteiro) resumida
  no resumo, que a transcrição anterior, só de trechos, dava como não localizada
  literalmente, aparece nestas páginas completas. A f. 150 chama Simplício José
  Ferreira Armonde de "solteiro, então com aproximadamente 30 anos" quando foi
  indicado tutor no inventário do pai, de 1814; a f. 151 o situa em 1831, no
  Censo dos Habitantes de Nossa Senhora do Curral Novo, entre os sete filhos,
  "todos solteiros", que viviam no fogo da viúva Felizarda; e as f. 152-153
  relatam a declaração da inventariante, em 1845, de que quatro dos doze filhos
  haviam falecido depois do pai e antes da mãe: Mariano José Ferreira Armonde
  (casado, deixou filhos) e Simplício José, Joaquim José e Honório José Ferreira
  Armonde, cada um "solteiro". As palavras "faleceu solteiro" não ocorrem. Com a
  idade de 46 anos no censo de 1831 dada na f. 152 e o "herdeiro Simplício,
  falecido" da f. 155, estas páginas estabelecem este Simplício como um filho de
  Francisco do fogo do Curral Novo, solteiro, Juiz de Paz com 46 anos em 1831 e
  falecido, como herdeiro, até a partilha de 1845 — distinto de P-0016. A
  passagem do censo (f. 151-152) remete, em nota, apenas a um sítio na internet
  (Projeto Compartilhar, n. 284), não ao manuscrito do censo. A origem açoriana
  do resumo assenta na f. 54, onde o autor afirma que o fundador Francisco
  Ferreira Armonde (falecido em 1751) "veio de Portugal, mais precisamente do
  arquipélago dos Açores", e na f. 55, que cita o seu testamento de 1751 (n. 74:
  MRSJDR, fls. 17) como "natural da Ilha Terceira da Freguesia da Vila de São
  Sebastião em Portugal". As f. 54-55 distinguem este Francisco Ferreira Armonde
  pai (inventário de 1751) de Francisco Ferreira Armonde filho (inventário de
  1814, aberto por Felizarda), que é o Francisco das f. 150-155 e pai de
  Simplício.)
abstract: >-
  A document-based doctoral study (post-mortem inventories, the 1831 Curral Novo population
  list and notarial records) of the historical Ferreira Armonde family of the Termo de
  Barbacena, Minas Gerais, 1751-1850: its Azorean patriarch Francisco Ferreira Armonde (d.
  1751), whose will, as quoted on f. 55, makes him a native of São Sebastião, Terceira, son of
  Gaspar de Souto Maior and Margarida das Candeyas; the fortune of his son Francisco Ferreira
  Armonde (filho) and Felizarda Maria Francisca de Assis, whose joint estate was valued in
  1845 at a monte-mor of 321:751$000 réis; and the family's social and marriage networks. It
  is the primary scholarship behind the "anti-merge": the Simplício José Ferreira Armonde of
  the Curral Novo household — the patriarch's grandson, about 30 in 1814 and 46 in 1831 — is
  listed as "solteiro" among the heirs who died before 1845, so he cannot be the Simplício
  José Ferreira Armond (P-0016) who married Eliza Balbina de Toledo and fathered Aristão.
abstract_pt: >-
  Um estudo doutoral baseado em documentos (inventários post-mortem, a lista nominativa do
  Curral Novo de 1831 e registros notariais) da histórica família Ferreira Armonde do Termo de
  Barbacena, Minas Gerais, 1751-1850: seu patriarca açoriano Francisco Ferreira Armonde (f.
  1751), cujo testamento, citado na f. 55, o dá como natural de São Sebastião, Ilha Terceira,
  filho de Gaspar de Souto Maior e de Margarida das Candeyas; a fortuna de seu filho Francisco
  Ferreira Armonde (filho) e de Felizarda Maria Francisca de Assis, cujo espólio conjunto foi
  avaliado em 1845 num monte-mor de 321:751$000 réis; e as redes sociais e matrimoniais da
  família. É a principal produção acadêmica por trás do "anti-merge": o Simplício José
  Ferreira Armonde do domicílio do Curral Novo — neto do patriarca, com cerca de 30 anos em
  1814 e 46 em 1831 — aparece como "solteiro" entre os herdeiros falecidos antes de 1845,
  portanto não pode ser o Simplício José Ferreira Armond (P-0016) que se casou com Eliza
  Balbina de Toledo e foi pai de Aristão.
reliability:
  assessment: >-
    A peer-examined scholarly secondary source, valuable for historical context
    and for locating the underlying primary records (inventories, the 1831
    census). Not itself proof of this repository's descent.
  informant: >-
    Antônio Henrique Duarte Lacerda, in a 2010 UFF doctoral thesis examined by
    Carlos Gabriel Guimarães (advisor), Afonso Alencastro Graça Filho, Angelo
    Alves Carrara, Sheila de Castro Faria and Théo Labarinhas Piñeiro.
  limitations: >-
    Concerns the historical Barbacena Ferreira Armonde family, which is NOT
    established as the ancestry of Aristão Ferreira Armond (this repository's
    line). Its statements — including Azorean origin and the celibate death of
    the patriarch's grandson Simplício (the thesis counts the two Franciscos, father
    and son, as its first two generations, f. 54) — are context leads until confirmed against the cited
    primary records. The Piacatuba-to-Barbacena bridge remains unproven.
