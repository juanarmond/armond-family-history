abstract: >-
  A document-based doctoral study (post-mortem inventories, the 1831 Barbacena
  population lists and notarial records) of the historical Ferreira Armonde
  family of the Termo de Barbacena, Minas Gerais, 1751-1850: its Azorean
  patriarch Francisco Ferreira Armonde, the accumulation of its fortune (an
  1845 monte-mor of roughly 321:751$000 réis) and its social and marriage
  networks. It is the primary scholarship behind the "anti-merge": the
  Simplício José Ferreira (Armonde) of the Curral Novo household, born
  c.1784-1785, died solteiro, so he cannot be the Simplício José Ferreira
  Armond (P-0016) who married Eliza Balbina de Toledo and fathered Aristão.
reliability:
  assessment: >-
    A peer-examined scholarly secondary source, valuable for historical context
    and for locating the underlying primary records (inventories, the 1831
    census). Not itself proof of this repository's descent.
  informant: >-
    Antônio Henrique Duarte Lacerda, in a 2010 UFF doctoral thesis examined by
    Carlos Gabriel Guimarães (advisor), Afonso Alencastro Graça Filho, Angelo
    Alves Carrara, Sheila de Castro Faria and Théo Labarinhas Piñeiro.
  limitations: >-
    Concerns the historical Barbacena Ferreira Armonde family, which is NOT
    established as the ancestry of Aristão Ferreira Armond (this repository's
    line). Its statements — including Azorean origin and the celibate death of
    the Gen-2 Simplício — are context leads until confirmed against the cited
    primary records. The Piacatuba-to-Barbacena bridge remains unproven.
