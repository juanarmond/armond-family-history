transcription: >-
  The cited pages (f. 54, 55, 150, 151, 152, 153, 154, 155 and 218) transcribed
  verbatim and in full from the ~504-page (2-vol.) doctoral thesis (PDF text
  layer, checked line by line against the page images), page numbers as printed;
  a secondary academic lead. Every line of each cited page is given, including
  its footnotes and printed page number. Superscript footnote numbers are shown
  in square brackets where they stand in the text; italics and bold are rendered
  as plain text; a word divided at a line break is rejoined; indented block
  quotations are marked; the bracketed access dates in nn. 74 and 284 are the
  thesis's own. Where a sentence runs from one transcribed page to the next, the
  text simply continues after the next page marker; a break to or from an
  untranscribed page (f. 53, 56, 149, 217) is noted.

  [f. 54:] [continued from f. 53, not transcribed] necessário tento compreender
  a localidade a partir dos resultados de pesquisa elaborados para a sua região.

  Parto de 1751, ano em que faleceu Francisco Ferreira Armonde, o patriarca e
  fundador da “dinastia”. Ele veio de Portugal, mais precisamente do arquipélago
  dos Açores, e se estabeleceu nas Minas Gerais, operando como comerciante e
  pequeno produtor. Finalizo a pesquisa em 1850, data de morte de Marcelino José
  Ferreira Armonde, neto de Francisco, que morreu dono de uma grande fortuna;
  foi negociante, fazendeiro, traficante de negros escravizados e obteve o
  título de nobreza – foi o primeiro Barão de Pitangui. A riqueza gerada e
  acumulada pelas duas primeiras gerações foi multiplicada e diversificada por
  Marcelino e seus irmãos. No texto darei destaque (itálico) ao nome de alguns
  personagens que com os Armonde se relacionaram, cujas inclusões serão
  retomadas oportunamente.

  Na análise das duas primeiras gerações da família, o fio condutor da análise
  documental foram os inventários post mortem. Primeiro o de Francisco Ferreira
  Armonde pai (1751), que teve por inventariante sua segunda esposa, Ana Antônia
  de São José, feito na Borda do Campo,[72] freguesia de Nossa Senhora da
  Piedade (arraial da Igreja Nova de Campolide/Barbacena), no sítio chamado
  Moinho, então pertencente à Comarca do Rio das Mortes. O segundo inventário
  estudado foi o de Rita Maria da Conceição, mulher de Francisco Ferreira
  Armonde filho, passado em 1775 na freguesia de Nossa Senhora Piedade, fazenda
  da Cachoeira, Comarca do Rio das Mortes. Por último, o inventário de Francisco

  [Footnotes:]

  [72] Nome dado pelos caçadores de esmeralda à região onde se desenvolveu o
  arraial da Igreja Nova de Campolide, depois Vila de Barbacena, cf. TEIXEIRA,
  Adriano, op. cit, p. 21.

  [Printed page number:] 54

  [f. 55:] Ferreira Armonde filho, inventariado por sua segunda esposa,
  Felizarda Maria Francisca de Assis, aberto na Fazenda dos Moinhos, em 1814,
  então Termo da Vila de Barbacena e Comarca do Rio das Mortes.

  No tocante a terceira geração, além da analise dos inventários post-mortem, a
  documentação particular e comercial existente na Fazenda Santa Sofia foi de
  suma importância. Estes últimos perfazem um total de aproximadamente
  oitocentos itens documentais.

  1.2- Francisco Ferreira Armonde: negócios e descendência de um tropeiro:

  Francisco Ferreira Armonde nasceu entre 1691 e 1694 [73] e era “natural da
  Ilha Terceira da Freguesia da Vila de São Sebastião em Portugal. Filho
  legítimo de Gaspar de Souto Maior e de sua mulher Margarida das Candeyas, já
  defuntos”[74] no ano de seu testamento, datado de 1751. Era neto paterno do
  [continues on f. 56, not transcribed]

  [Footnotes:]

  [73] No inventário post mortem de Manuel Nunes da Cruz encontra-se um termo de
  fiança em que Francisco Ferreira Armonde atesta ter 50 anos de idade no ano de
  1747, data do dito inventário. Museu Regional de São João Del Rei (doravante
  MRSJDR). Inventário post mortem de Manuel Nunes da Cruz, 1747.

  [74] MRSJDR. Testamento juntado ao inventário post mortem de Francisco
  Ferreira Armonde, 1751, fls. 17. Esta informação está presente também em
  algumas mensagens eletrônicas trocadas entre pesquisadores de genealogias de
  famílias. Através de pesquisas nos arquivos dos mórmons e mesmo em Portugal,
  estes genealogistas compartilham informações quanto à família dos Armonde,
  objeto de minhas reflexões. Margarida das Candeyas (batizada em 29 de maio de
  1667, na Vila de São Sebastião, da Ilha Terceira, Açores, faleceu em 9 de
  abril de 1693, na mesma vila) foi a primeira esposa de Gaspar de Souto Maior
  (batizado em 23 de setembro de 1657 e falecido em 2 de dezembro de 1727), que
  após a viuvez contraiu segundas núpcias com Maria Mendes Borba.
  <http://archiver.rootsweb.com/th/read/AZORES/2005-05/1117156232> [02 de abril
  de 2007]. Algumas destas informações estão disponibilizadas no site do Projeto
  Compartilhar, coordenado por Bartyra Sette e Regina Moraes Junqueira,
  <http://geocites.yahoo.com.br/projetocompartilhar>, outras estão sendo
  preparadas para serem [footnote continues on f. 56, not transcribed]

  [Printed page number:] 55

  [f. 150:] [continued from f. 149, not transcribed] percentualmente menos
  significativas do que em 1775, ainda ocupam o terceiro lugar no montante dos
  bens de Francisco em 1814.

  A riqueza de Francisco Ferreira Armonde veio junto com a distinção. Em algum
  momento de sua vida ele se tornou Alferes, uma vez que assim foi qualificado
  na documentação analisada. Consta de seu inventário que por ocasião do
  ordenamento do filho Francisco Antônio Ferreira Armonde, foi doado para o
  patrimônio do mesmo, uma morada de casa na rua direita do Rosário, na Vila de
  Barbacena, no valor de R$ 280$000, além de dois escravos, no valor de R$
  800$000. Para o outro filho padre, José Joaquim Ferreira Armonde, o casal doou
  uma sesmaria de terras de cultura nos fundos da fazenda denominada Medeiros,
  no caminho para o Rio de Janeiro (Caminho Novo), cujo valor não foi declarado,
  e um escravo avaliado em R$ 150$000.[280]

  A viúva, Felizarda Maria Francisca de Assis, solicitou a tutela dos filhos
  menores, mas seu pedido foi indeferido, sendo indicado para a função o seu
  filho Simplício José Ferreira Armonde, solteiro, então com aproximadamente 30
  anos. Juntado a este inventário encontramos uma certidão de batismo do filho
  mais jovem do casal Francisco e Felizarda, Lino José. Pela certidão sabe-se
  que Lino foi batizado no dia cinco de setembro de 1802, na capela da Senhora
  do Rosário do Curral Novo, pelo primo, o vigário Francisco Pereira da Cunha, e
  que foram seus padrinhos seu irmão mais velho, o padre Francisco Antônio
  Ferreira Armonde, e dona Inácia Rita, filha do Coronel Manoel de Sá Fortes
  Bustamante Nogueira.[281]

  [Footnotes:]

  [280] MRSJDR, inventário post mortem de Francisco Ferreira Armonde, 1814.

  [281] Idem, fls. 25.

  [Printed page number:] 150

  [f. 151:] Retornando ao valor do monte-mor de R$ 23:746$640 (tabela 2.3), este
  foi calculado por mim a partir da soma dos bens listados, uma vez que deste
  inventário não consta o termo de encerramento e partilha dos bens. Não sei as
  razões porque este inventário ficou inconcluso, mas isto explica por que em
  1845, ano em que Felizarda faleceu, foi aberto um “inventário dos bens do
  casal Francisco Ferreira Armonde e sua mulher Felizarda Francisca de
  Assis”.[282] Sheila Faria observou que o momento da realização de inventários
  representava situações delicadas, com a possibilidade de risco e fragmentação
  do patrimônio familiar. De acordo com a legislação em vigor, ainda calcada nas
  Ordenações Filipinas, a herança deveria ser distribuída igualitariamente entre
  todos os herdeiros, mas na prática, isso nem sempre acontecia. Acordos
  informais, rearranjos, postergação do pagamento das legítimas, tudo isto podia
  acontecer.[283] Do inventário do casal Francisco Ferreira Armonde e Felizarda
  de Assis, embora as questões pendentes não estejam explícitas, se conclui que
  os bens do casal foram mantidos em comum por seus filhos, numa espécie de
  sociedade, que se desfez somente com a morte de Felizarda, em 1845.
  Aparentemente os irmãos Armonde além de manter a sociedade nos bens dos pais
  também tocavam seus negócios particulares.

  Em 1831, no Censo dos Habitantes de Nossa Senhora do Curral Novo, Felizarda
  Maria Francisca de Assis, foi qualificada como lavradora, viúva, com 70 anos,
  e chefe de um fogo no qual convivia com sete de seus filhos, todos solteiros:
  Ana, Simplício, Antônio, Joaquim, Manoel, Flávio e Lino. As idades dos filhos
  iam

  [Footnotes:]

  [282] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845.

  [283] FARIA, Sheila, op. cit., p. 256-265.

  [Printed page number:] 151

  [f. 152:] de 28 a 46 anos. Antônio, Joaquim e Manoel foram qualificados como
  negociantes. Flávio e Lino, os dois mais novos, foram classificados como
  tropeiros. Simplício, aos 46 anos, não teve sua profissão discriminada, mas
  assina o censo do lugar na qualidade de Juiz de Paz. A casa contava com 66
  mancípios.[284]

  Quando Felizarda faleceu, em 1845, foi inventariante dos bens do casal
  Francisco Ferreira Armonde e Felizarda Maria de Assis, a filha dona Ana
  Quitéria Umbelina de Barbosa. Ela foi também a testamenteira de sua mãe. O
  testamento de dona Felizarda, no que diz respeito às disposições religiosas,
  não fugiu ao costume. No mais, foi bastante simples, demonstrando preocupações
  e cuidados com a filha, manifestos na seguinte deixa:

  [indented quotation:] Quero que da minha meação se faça terça, a qual deixo à
  minha filha Ana, e recomendo aos meus filhos que se arranjem nas duas fazendas
  de campo para se lhe inteirar a parte que lhe couber na fazenda do mato,
  porque assim pede a razão, porque sendo mulher não pode acudir ao mesmo tempo
  a um outro ponto que lhe seja assinalado, e muito desejo este cômodo para seu
  descanso em remuneração da boa companhia que me fez, tratando e zelando minha
  família.[285]

  Em outubro de 1845, quando dona Felizarda faleceu, na fazenda dos Moinhos,
  onde a família vivia deste [sic] os tempos em que os Armonde se estabeleceram
  em Minas Gerais, ela possuía oito filhos vivos. Ana Quitéria, a filha
  inventariante, declarou que dos doze filhos do casal quatro haviam falecido
  depois do pai e antes da mãe, os quais eram: Mariano José Ferreira Armonde –
  casado, deixou filhos –; Simplício José Ferreira Armonde, solteiro; Joaquim
  José Ferreira

  [Footnotes:]

  [284] Projeto Compartilhar, <http://geocites.yahoo.com.br/projetocompartilhar>
  [03 de janeiro de 2009].

  [285] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845, fls. 38.

  [Printed page number:] 152

  [f. 153:] Armonde, solteiro; Honório José Ferreira Armonde, solteiro. Dos
  demais, Francisco Antônio e José Joaquim eram padres, Manoel era casado e para
  os outros seis o estado civil não foi declarado, mas sabe-se que eram
  solteiros, embora alguns tenham mantidos relações informais estáveis, como
  Marcelino José Ferreira Armonde, que em 1847 perfilhou três filhos ainda vivos
  dos quatro que teve em estado de solteiro. A trajetória de Marcelino José
  Ferreira Armonde e seus filhos será objeto de análise do próximo capítulo.

  Uma análise comparativa entre os inventários de Francisco Ferreira Armonde e
  de suas duas esposas, Rita Maria e Felizarda Maria de Assis, deixam logo
  evidentes a transformação na fortuna da família. O monte-mor do inventário do
  casal em 1845 era de R$ 321:751$000, isto é, £ 90.506,610. Portanto, nos
  trinta anos que separam a morte de Francisco Ferreira Armonde da morte de
  Felizarda Maria de Assis o patrimônio foi aumentado em aproximadamente R$
  300:000$000, – tabela 2.6. Não pretendo me deter na análise e comparação da
  transformação da riqueza material a partir dos móveis, louças, jóias e trastes
  arrolados, mesmo porque os primeiros inventários não são tão detalhados. Mas
  as listas destes objetos, presente no inventário de 1845, é bastante extensa e
  reveladora. Constatamos a presença de ouro e jóias, objetos de prata, ermidas
  com seus pertences, colchas de damasco e de seda, “lençóis finos”, móveis,
  louças e utensílios de toda espécie. Especialmente o inventário descreve
  inúmeros instrumentos de trabalho, tais como: tachos e bacias de diversos
  tamanhos (de cobre e arame), forno de farinha, balanças e ganchos de tamanhos
  variados, cabeças, cabeçalhos e freios (para os animais de carga), alambiques,

  [No footnotes on this page.]

  [Printed page number:] 153

  [f. 154:] instrumentos de trabalho para a roça (enxada, foices, machados),
  ferramentas de carpinteiros, formas de açúcar, barris de aguardente, cocho de
  azedar garapa.[286]

  Na próxima seção deste capítulo analisarei a trajetória dos filhos de
  Francisco Ferreira Armonde e Felizarda Francisca de Assis, procurando
  demonstrar, para todos os que as fontes assim o permitirem como eles
  conquistaram fortuna e poder. Por ora, é necessário adiantar alguns pontos.
  Creio que o fato de a maioria dos filhos ter optado pelo celibato ou seguido a
  carreira religiosa contribuiu para o sucesso do acordo em manter os bens em
  comum, sob uma aparente sociedade. Isto não impediu que acordos, adiantamentos
  de legítimas e empréstimos tenham sido feitos aos que assim solicitaram. Na
  relação das dívidas ativas da Casa constam débitos dos herdeiros Flávio José,
  no valor de R$ 1:340$000; de Lino José, estimadas em R$ 3:100$000; de
  Francisco Antônio (padre), avaliadas em 6:056$903 e de Honório José,
  considerada em R$ 17:153$353.[287] E, há também um documento atestando que:

  [indented quotation:] o herdeiro Manoel recebeu da casa para comprar a fazenda
  do Ribeirão Fundo em lugar dos bens de raiz desta herança, e para a compra de
  criações, como constará da escritura de compra e venda do Ribeirão fundo, a
  quantia de vinte e dois contos, setecentos e dezoito mil reis.[288]

  Para que melhor se compreenda a evolução da riqueza e das atividades
  econômicas dos Armonde, partindo da comparação dos inventários de 1814 e de
  1845, é necessário que se preceda, antes, a uma explicação detalhada de

  [Footnotes:]

  [286] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845.

  [287] Idem, fls. 25 e seguintes.

  [288] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845, fls. 23v.

  [Printed page number:] 154

  [f. 155:] questões fundamentais à análise e dos procedimentos jurídicos
  adotados em 1845 para a partilha dos bens. Nas declarações da inventariante,
  ela informou que

  [indented quotation:] no monte deste inventário existiam de créditos cobranças
  feitas pertencentes ao herdeiro Simplício, falecido, a quantia de 48:275$881.
  E assim mais, da mesma forma, pertencente ao herdeiro Joaquim, falecido, a
  quantia de 41:584$561.[289]

  Considerando as informações da inventariante, a justiça calculou o monte-mor
  do casal Francisco Ferreira Armonde e Felizarda Maria de Assis em R$
  321:751$000, mas concluíram que deste monte deveriam ser abatidas as quantias
  relativas aos créditos que havia na casa e pertencentes aos herdeiros
  Simplício e Joaquim, que somavam R$ 89:860$000. Feito isto, restou R$
  231:891$000, que foi dividido em duas partes iguais: R$ 115:945$000 – metade
  correspondendo à legítima paterna e metade à legítima da falecida Felizarda.

  Os R$ 115:945$000 da herança paterna foram divididos em 12 partes, uma para
  cada um dos doze filhos que existiam quando Francisco Ferreira Armonde
  faleceu. Aos R$ 115:945$000 relativos à parte de Felizarda Maria de Assis
  foram acrescidas “as quantias provenientes de créditos que existiam na casa
  pertencentes aos herdeiros falecidos Simplício e Joaquim, na importância de
  89:860$000”. [290] Resolveram, também,

  [indented quotation:] ajuntar todos os bens constantes do inventário do
  herdeiro falecido Honório José Ferreira Armonde, por ter sido o mesmo falecido
  sem herdeiros, na importância todos de trinta e sete contos, novecentos e
  oitenta e quatro mil e trezentos e cinqüenta e três réis.[291]

  [Footnotes:]

  [289] Idem, fls. 27f-v.

  [290] Idem, fls. 38.

  [291] Idem.

  [Printed page number:] 155

  [f. 218:] [continued from f. 217, not transcribed] herança dos filhos em
  apólices. Este mesmo procedimento ela adotou quando da partilha dos bens dos
  avós paternos (1845), o que analisamos nas seções anteriores. O patrimônio
  rural preservado em Minas Gerais por dona Maria José foi a fazenda Fortaleza
  de Santana, que ela herdou de seu pai, falecido depois de seu esposo e onde o
  filho mais velho, Mariano Procópio Ferreira Lage, montou uma unidade agrária
  considerada modelo pelos viajantes que a conheceram.[354]

  O primogênito de Mariano José Ferreira Armonde e Maria José de Santana nasceu
  em Barbacena no dia 23 de junho de 1821, sendo seus padrinhos de batismo o tio
  Simplício José Ferreira Armonde e a avó Felizarda Maria Francisca de Assis. O
  batismo foi realizado pelo padre e tio paterno José Joaquim Ferreira Armonde.
  Wilson de Lima Barros [sic] informa que Mariano Procópio aprendeu em casa as
  primeiras letras e aos quinze anos de idade foi estudar no Colégio de
  Congonhas do Campo, sob a direção dos padres do Caraça. Ao completar o curso
  transferiu-se para o Rio de Janeiro, onde se iniciou nas atividades
  comerciais. Logo, porém, o pai o mandou para a Europa, com a finalidade de
  aperfeiçoar seus estudos. Da Europa, Mariano Procópio solicitou ao pai que
  permitisse sua ida para os Estados Unidos, onde conheceu duas novidades que:
  “o empolgaram porque vinham ao encontro do projeto que o pai há muito
  alimentava da construção de uma estrada de rodagem: o novo processo de
  pavimentação do leito de estradas e o sistema de cobranças de
  pedágio”.[355]Note-se que a dar crédito às informações de Lima Bastos, Mariano
  Procópio teria feito estas viagens antes dos 17 anos, visto que seu pai
  faleceu em 1837.

  [Footnotes:]

  [354] AGASSIZ, Luís & AGASSIZ, Elizabeth Cary. Viagem ao Brasil, 1865-1866.
  Brasília: Senado Federal, Conselho Editorial 2000, Edição Eletrônica.

  [355] BASTOS, Wilson de Lima. op. cit., p. 14-15, citação na p. 15.

  [Printed page number:] 218

  (Editorial note: the "died solteiro" characterisation summarised in the
  abstract, which the earlier excerpt-only transcription reported as not located
  verbatim, does appear on these full pages. f. 150 calls Simplício José
  Ferreira Armonde "solteiro, então com aproximadamente 30 anos" when he was
  named tutor at his father's 1814 inventory; f. 151 places him in 1831, in the
  Censo dos Habitantes de Nossa Senhora do Curral Novo, among the seven
  children, "todos solteiros", living in the widowed Felizarda's household; and
  f. 152-153 report the inventariante's 1845 declaration that four of the twelve
  children had died after the father and before the mother: Mariano José
  Ferreira Armonde (casado, deixou filhos) and Simplício José, Joaquim José and
  Honório José Ferreira Armonde, each "solteiro". The words "faleceu solteiro"
  themselves do not occur. With f. 152's age of 46 at the 1831 census and f.
  155's "herdeiro Simplício, falecido", these pages establish this Simplício as
  a son of Francisco in the Curral Novo household, unmarried, a Juiz de Paz aged
  46 in 1831, and deceased as an heir by the 1845 partilha — distinct from
  P-0016. The census passage (f. 151-152) is footnoted only to a website
  (Projeto Compartilhar, n. 284), not to the census manuscript. The abstract's
  Azorean origin rests on f. 54, where the author states that the founder
  Francisco Ferreira Armonde (d. 1751) "veio de Portugal, mais precisamente do
  arquipélago dos Açores", and on f. 55, which quotes his 1751 testament (n. 74:
  MRSJDR, fls. 17) as "natural da Ilha Terceira da Freguesia da Vila de São
  Sebastião em Portugal". f. 54-55 distinguish this Francisco Ferreira Armonde
  pai (inventory 1751) from Francisco Ferreira Armonde filho (inventory 1814,
  opened by Felizarda), who is the Francisco of f. 150-155 and Simplício's
  father.)
transcription_pt: >-
  As páginas citadas (f. 54, 55, 150, 151, 152, 153, 154, 155 e 218) transcritas
  literalmente e na íntegra da tese de doutorado de ~504 páginas (2 vols.)
  (camada de texto do PDF, conferida linha a linha com as imagens das páginas),
  com os números de página conforme impressos; uma pista acadêmica secundária.
  Cada linha de cada página citada é transcrita, incluindo as notas de rodapé e
  o número de página impresso. Os números sobrescritos das notas aparecem entre
  colchetes no ponto do texto em que estão; itálico e negrito são dados como
  texto simples; a palavra dividida em fim de linha é reunida; as citações
  recuadas são assinaladas; as datas de acesso entre colchetes nas n. 74 e 284
  são da própria tese. Quando uma frase passa de uma página transcrita para a
  seguinte, o texto simplesmente continua após o marcador da página seguinte; a
  passagem de ou para uma página não transcrita (f. 53, 56, 149, 217) é
  assinalada.

  [f. 54:] [continuação da f. 53, não transcrita] necessário tento compreender a
  localidade a partir dos resultados de pesquisa elaborados para a sua região.

  Parto de 1751, ano em que faleceu Francisco Ferreira Armonde, o patriarca e
  fundador da “dinastia”. Ele veio de Portugal, mais precisamente do arquipélago
  dos Açores, e se estabeleceu nas Minas Gerais, operando como comerciante e
  pequeno produtor. Finalizo a pesquisa em 1850, data de morte de Marcelino José
  Ferreira Armonde, neto de Francisco, que morreu dono de uma grande fortuna;
  foi negociante, fazendeiro, traficante de negros escravizados e obteve o
  título de nobreza – foi o primeiro Barão de Pitangui. A riqueza gerada e
  acumulada pelas duas primeiras gerações foi multiplicada e diversificada por
  Marcelino e seus irmãos. No texto darei destaque (itálico) ao nome de alguns
  personagens que com os Armonde se relacionaram, cujas inclusões serão
  retomadas oportunamente.

  Na análise das duas primeiras gerações da família, o fio condutor da análise
  documental foram os inventários post mortem. Primeiro o de Francisco Ferreira
  Armonde pai (1751), que teve por inventariante sua segunda esposa, Ana Antônia
  de São José, feito na Borda do Campo,[72] freguesia de Nossa Senhora da
  Piedade (arraial da Igreja Nova de Campolide/Barbacena), no sítio chamado
  Moinho, então pertencente à Comarca do Rio das Mortes. O segundo inventário
  estudado foi o de Rita Maria da Conceição, mulher de Francisco Ferreira
  Armonde filho, passado em 1775 na freguesia de Nossa Senhora Piedade, fazenda
  da Cachoeira, Comarca do Rio das Mortes. Por último, o inventário de Francisco

  [Notas de rodapé:]

  [72] Nome dado pelos caçadores de esmeralda à região onde se desenvolveu o
  arraial da Igreja Nova de Campolide, depois Vila de Barbacena, cf. TEIXEIRA,
  Adriano, op. cit, p. 21.

  [Número de página impresso:] 54

  [f. 55:] Ferreira Armonde filho, inventariado por sua segunda esposa,
  Felizarda Maria Francisca de Assis, aberto na Fazenda dos Moinhos, em 1814,
  então Termo da Vila de Barbacena e Comarca do Rio das Mortes.

  No tocante a terceira geração, além da analise dos inventários post-mortem, a
  documentação particular e comercial existente na Fazenda Santa Sofia foi de
  suma importância. Estes últimos perfazem um total de aproximadamente
  oitocentos itens documentais.

  1.2- Francisco Ferreira Armonde: negócios e descendência de um tropeiro:

  Francisco Ferreira Armonde nasceu entre 1691 e 1694 [73] e era “natural da
  Ilha Terceira da Freguesia da Vila de São Sebastião em Portugal. Filho
  legítimo de Gaspar de Souto Maior e de sua mulher Margarida das Candeyas, já
  defuntos”[74] no ano de seu testamento, datado de 1751. Era neto paterno do
  [continua na f. 56, não transcrita]

  [Notas de rodapé:]

  [73] No inventário post mortem de Manuel Nunes da Cruz encontra-se um termo de
  fiança em que Francisco Ferreira Armonde atesta ter 50 anos de idade no ano de
  1747, data do dito inventário. Museu Regional de São João Del Rei (doravante
  MRSJDR). Inventário post mortem de Manuel Nunes da Cruz, 1747.

  [74] MRSJDR. Testamento juntado ao inventário post mortem de Francisco
  Ferreira Armonde, 1751, fls. 17. Esta informação está presente também em
  algumas mensagens eletrônicas trocadas entre pesquisadores de genealogias de
  famílias. Através de pesquisas nos arquivos dos mórmons e mesmo em Portugal,
  estes genealogistas compartilham informações quanto à família dos Armonde,
  objeto de minhas reflexões. Margarida das Candeyas (batizada em 29 de maio de
  1667, na Vila de São Sebastião, da Ilha Terceira, Açores, faleceu em 9 de
  abril de 1693, na mesma vila) foi a primeira esposa de Gaspar de Souto Maior
  (batizado em 23 de setembro de 1657 e falecido em 2 de dezembro de 1727), que
  após a viuvez contraiu segundas núpcias com Maria Mendes Borba.
  <http://archiver.rootsweb.com/th/read/AZORES/2005-05/1117156232> [02 de abril
  de 2007]. Algumas destas informações estão disponibilizadas no site do Projeto
  Compartilhar, coordenado por Bartyra Sette e Regina Moraes Junqueira,
  <http://geocites.yahoo.com.br/projetocompartilhar>, outras estão sendo
  preparadas para serem [a nota continua na f. 56, não transcrita]

  [Número de página impresso:] 55

  [f. 150:] [continuação da f. 149, não transcrita] percentualmente menos
  significativas do que em 1775, ainda ocupam o terceiro lugar no montante dos
  bens de Francisco em 1814.

  A riqueza de Francisco Ferreira Armonde veio junto com a distinção. Em algum
  momento de sua vida ele se tornou Alferes, uma vez que assim foi qualificado
  na documentação analisada. Consta de seu inventário que por ocasião do
  ordenamento do filho Francisco Antônio Ferreira Armonde, foi doado para o
  patrimônio do mesmo, uma morada de casa na rua direita do Rosário, na Vila de
  Barbacena, no valor de R$ 280$000, além de dois escravos, no valor de R$
  800$000. Para o outro filho padre, José Joaquim Ferreira Armonde, o casal doou
  uma sesmaria de terras de cultura nos fundos da fazenda denominada Medeiros,
  no caminho para o Rio de Janeiro (Caminho Novo), cujo valor não foi declarado,
  e um escravo avaliado em R$ 150$000.[280]

  A viúva, Felizarda Maria Francisca de Assis, solicitou a tutela dos filhos
  menores, mas seu pedido foi indeferido, sendo indicado para a função o seu
  filho Simplício José Ferreira Armonde, solteiro, então com aproximadamente 30
  anos. Juntado a este inventário encontramos uma certidão de batismo do filho
  mais jovem do casal Francisco e Felizarda, Lino José. Pela certidão sabe-se
  que Lino foi batizado no dia cinco de setembro de 1802, na capela da Senhora
  do Rosário do Curral Novo, pelo primo, o vigário Francisco Pereira da Cunha, e
  que foram seus padrinhos seu irmão mais velho, o padre Francisco Antônio
  Ferreira Armonde, e dona Inácia Rita, filha do Coronel Manoel de Sá Fortes
  Bustamante Nogueira.[281]

  [Notas de rodapé:]

  [280] MRSJDR, inventário post mortem de Francisco Ferreira Armonde, 1814.

  [281] Idem, fls. 25.

  [Número de página impresso:] 150

  [f. 151:] Retornando ao valor do monte-mor de R$ 23:746$640 (tabela 2.3), este
  foi calculado por mim a partir da soma dos bens listados, uma vez que deste
  inventário não consta o termo de encerramento e partilha dos bens. Não sei as
  razões porque este inventário ficou inconcluso, mas isto explica por que em
  1845, ano em que Felizarda faleceu, foi aberto um “inventário dos bens do
  casal Francisco Ferreira Armonde e sua mulher Felizarda Francisca de
  Assis”.[282] Sheila Faria observou que o momento da realização de inventários
  representava situações delicadas, com a possibilidade de risco e fragmentação
  do patrimônio familiar. De acordo com a legislação em vigor, ainda calcada nas
  Ordenações Filipinas, a herança deveria ser distribuída igualitariamente entre
  todos os herdeiros, mas na prática, isso nem sempre acontecia. Acordos
  informais, rearranjos, postergação do pagamento das legítimas, tudo isto podia
  acontecer.[283] Do inventário do casal Francisco Ferreira Armonde e Felizarda
  de Assis, embora as questões pendentes não estejam explícitas, se conclui que
  os bens do casal foram mantidos em comum por seus filhos, numa espécie de
  sociedade, que se desfez somente com a morte de Felizarda, em 1845.
  Aparentemente os irmãos Armonde além de manter a sociedade nos bens dos pais
  também tocavam seus negócios particulares.

  Em 1831, no Censo dos Habitantes de Nossa Senhora do Curral Novo, Felizarda
  Maria Francisca de Assis, foi qualificada como lavradora, viúva, com 70 anos,
  e chefe de um fogo no qual convivia com sete de seus filhos, todos solteiros:
  Ana, Simplício, Antônio, Joaquim, Manoel, Flávio e Lino. As idades dos filhos
  iam

  [Notas de rodapé:]

  [282] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845.

  [283] FARIA, Sheila, op. cit., p. 256-265.

  [Número de página impresso:] 151

  [f. 152:] de 28 a 46 anos. Antônio, Joaquim e Manoel foram qualificados como
  negociantes. Flávio e Lino, os dois mais novos, foram classificados como
  tropeiros. Simplício, aos 46 anos, não teve sua profissão discriminada, mas
  assina o censo do lugar na qualidade de Juiz de Paz. A casa contava com 66
  mancípios.[284]

  Quando Felizarda faleceu, em 1845, foi inventariante dos bens do casal
  Francisco Ferreira Armonde e Felizarda Maria de Assis, a filha dona Ana
  Quitéria Umbelina de Barbosa. Ela foi também a testamenteira de sua mãe. O
  testamento de dona Felizarda, no que diz respeito às disposições religiosas,
  não fugiu ao costume. No mais, foi bastante simples, demonstrando preocupações
  e cuidados com a filha, manifestos na seguinte deixa:

  [citação recuada:] Quero que da minha meação se faça terça, a qual deixo à
  minha filha Ana, e recomendo aos meus filhos que se arranjem nas duas fazendas
  de campo para se lhe inteirar a parte que lhe couber na fazenda do mato,
  porque assim pede a razão, porque sendo mulher não pode acudir ao mesmo tempo
  a um outro ponto que lhe seja assinalado, e muito desejo este cômodo para seu
  descanso em remuneração da boa companhia que me fez, tratando e zelando minha
  família.[285]

  Em outubro de 1845, quando dona Felizarda faleceu, na fazenda dos Moinhos,
  onde a família vivia deste [sic] os tempos em que os Armonde se estabeleceram
  em Minas Gerais, ela possuía oito filhos vivos. Ana Quitéria, a filha
  inventariante, declarou que dos doze filhos do casal quatro haviam falecido
  depois do pai e antes da mãe, os quais eram: Mariano José Ferreira Armonde –
  casado, deixou filhos –; Simplício José Ferreira Armonde, solteiro; Joaquim
  José Ferreira

  [Notas de rodapé:]

  [284] Projeto Compartilhar, <http://geocites.yahoo.com.br/projetocompartilhar>
  [03 de janeiro de 2009].

  [285] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845, fls. 38.

  [Número de página impresso:] 152

  [f. 153:] Armonde, solteiro; Honório José Ferreira Armonde, solteiro. Dos
  demais, Francisco Antônio e José Joaquim eram padres, Manoel era casado e para
  os outros seis o estado civil não foi declarado, mas sabe-se que eram
  solteiros, embora alguns tenham mantidos relações informais estáveis, como
  Marcelino José Ferreira Armonde, que em 1847 perfilhou três filhos ainda vivos
  dos quatro que teve em estado de solteiro. A trajetória de Marcelino José
  Ferreira Armonde e seus filhos será objeto de análise do próximo capítulo.

  Uma análise comparativa entre os inventários de Francisco Ferreira Armonde e
  de suas duas esposas, Rita Maria e Felizarda Maria de Assis, deixam logo
  evidentes a transformação na fortuna da família. O monte-mor do inventário do
  casal em 1845 era de R$ 321:751$000, isto é, £ 90.506,610. Portanto, nos
  trinta anos que separam a morte de Francisco Ferreira Armonde da morte de
  Felizarda Maria de Assis o patrimônio foi aumentado em aproximadamente R$
  300:000$000, – tabela 2.6. Não pretendo me deter na análise e comparação da
  transformação da riqueza material a partir dos móveis, louças, jóias e trastes
  arrolados, mesmo porque os primeiros inventários não são tão detalhados. Mas
  as listas destes objetos, presente no inventário de 1845, é bastante extensa e
  reveladora. Constatamos a presença de ouro e jóias, objetos de prata, ermidas
  com seus pertences, colchas de damasco e de seda, “lençóis finos”, móveis,
  louças e utensílios de toda espécie. Especialmente o inventário descreve
  inúmeros instrumentos de trabalho, tais como: tachos e bacias de diversos
  tamanhos (de cobre e arame), forno de farinha, balanças e ganchos de tamanhos
  variados, cabeças, cabeçalhos e freios (para os animais de carga), alambiques,

  [Sem notas de rodapé nesta página.]

  [Número de página impresso:] 153

  [f. 154:] instrumentos de trabalho para a roça (enxada, foices, machados),
  ferramentas de carpinteiros, formas de açúcar, barris de aguardente, cocho de
  azedar garapa.[286]

  Na próxima seção deste capítulo analisarei a trajetória dos filhos de
  Francisco Ferreira Armonde e Felizarda Francisca de Assis, procurando
  demonstrar, para todos os que as fontes assim o permitirem como eles
  conquistaram fortuna e poder. Por ora, é necessário adiantar alguns pontos.
  Creio que o fato de a maioria dos filhos ter optado pelo celibato ou seguido a
  carreira religiosa contribuiu para o sucesso do acordo em manter os bens em
  comum, sob uma aparente sociedade. Isto não impediu que acordos, adiantamentos
  de legítimas e empréstimos tenham sido feitos aos que assim solicitaram. Na
  relação das dívidas ativas da Casa constam débitos dos herdeiros Flávio José,
  no valor de R$ 1:340$000; de Lino José, estimadas em R$ 3:100$000; de
  Francisco Antônio (padre), avaliadas em 6:056$903 e de Honório José,
  considerada em R$ 17:153$353.[287] E, há também um documento atestando que:

  [citação recuada:] o herdeiro Manoel recebeu da casa para comprar a fazenda do
  Ribeirão Fundo em lugar dos bens de raiz desta herança, e para a compra de
  criações, como constará da escritura de compra e venda do Ribeirão fundo, a
  quantia de vinte e dois contos, setecentos e dezoito mil reis.[288]

  Para que melhor se compreenda a evolução da riqueza e das atividades
  econômicas dos Armonde, partindo da comparação dos inventários de 1814 e de
  1845, é necessário que se preceda, antes, a uma explicação detalhada de

