  [286] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845.

  [287] Idem, fls. 25 e seguintes.

  [288] AHMPAJS, inventário post mortem de Francisco Ferreira Armonde e
  Felizarda Francisca de Assis, caixa 385, ordem 20, 1845, fls. 23v.

  [Número de página impresso:] 154

  [f. 155:] questões fundamentais à análise e dos procedimentos jurídicos
  adotados em 1845 para a partilha dos bens. Nas declarações da inventariante,
  ela informou que

  [citação recuada:] no monte deste inventário existiam de créditos cobranças
  feitas pertencentes ao herdeiro Simplício, falecido, a quantia de 48:275$881.
  E assim mais, da mesma forma, pertencente ao herdeiro Joaquim, falecido, a
  quantia de 41:584$561.[289]

  Considerando as informações da inventariante, a justiça calculou o monte-mor
  do casal Francisco Ferreira Armonde e Felizarda Maria de Assis em R$
  321:751$000, mas concluíram que deste monte deveriam ser abatidas as quantias
  relativas aos créditos que havia na casa e pertencentes aos herdeiros
  Simplício e Joaquim, que somavam R$ 89:860$000. Feito isto, restou R$
  231:891$000, que foi dividido em duas partes iguais: R$ 115:945$000 – metade
  correspondendo à legítima paterna e metade à legítima da falecida Felizarda.

  Os R$ 115:945$000 da herança paterna foram divididos em 12 partes, uma para
  cada um dos doze filhos que existiam quando Francisco Ferreira Armonde
  faleceu. Aos R$ 115:945$000 relativos à parte de Felizarda Maria de Assis
  foram acrescidas “as quantias provenientes de créditos que existiam na casa
  pertencentes aos herdeiros falecidos Simplício e Joaquim, na importância de
  89:860$000”. [290] Resolveram, também,

  [citação recuada:] ajuntar todos os bens constantes do inventário do herdeiro
  falecido Honório José Ferreira Armonde, por ter sido o mesmo falecido sem
  herdeiros, na importância todos de trinta e sete contos, novecentos e oitenta
  e quatro mil e trezentos e cinqüenta e três réis.[291]

  [Notas de rodapé:]

