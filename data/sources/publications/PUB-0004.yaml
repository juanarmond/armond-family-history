abstract: >-
  Genealogical compilation for the FAGUNDES surname on Terceira Island. § 6º covers
  Pedro Lourenço Machado (b. 2 Feb 1571, d. 27 Jan 1655, Santa Bárbara) × Maria Fernandes
  da Costa (m. 14 Jun 1598). Their son António Martins Fagundes × Catarina Machado de Faria
  is the father of Mariana Fagundes who married Belchior da Ponte Cardoso on 26 Sep 1650 at
  Santa Bárbara. The cross-reference "vid. SOUTO-MAIOR, § 5º, nº 5" ties the Fagundes line
  directly to the Belchior entry in Vol. IX.
abstract_pt: >-
  Compilação genealógica do sobrenome FAGUNDES na Ilha Terceira. O § 6º cobre Pedro Lourenço
  Machado (n. 2 fev. 1571, f. 27 jan. 1655, Stª Bárbara) × Maria Fernandes da Costa (c. 14
  jun. 1598). O filho António Martins Fagundes × Catarina Machado de Faria é o pai de Mariana
  Fagundes, que casou com Belchior da Ponte Cardoso em 26 set. 1650, em Stª Bárbara. A
  referência cruzada "vid. SOUTO-MAIOR, § 5º, nº 5" liga diretamente esta linha à entrada de
  Belchior no Vol. IX.
reliability:
  assessment: >-
    Mendes Forjaz is a rigorous Terceira genealogical compiler drawing on parish registers and
    notarial records. Treated as strong-evidence for specific dates, parentage assertions, and
    cross-references where corroborated by parallel compilations or primary images. The key facts
    for our line (Pedro Lourenço Machado dates; António Martins Fagundes + Catarina Machado de
    Faria as Mariana's parents; marriage date 26.9.1650 confirmed in both Vol. IV and Vol. IX
    cross-reference; Mariana's death 7.7.1684) are internally consistent and are seconded by the
    primary parish image of the 1650 marriage (PAR-0086). The death date for António Martins
    Fagundes (17 Apr 1664) and the birth date for Pedro Lourenço Machado (2 Feb 1571) are
    compiled-only — no primary image held.
  informant: Mendes Forjaz (compiler)
  limitations: >-
    Secondary compiled source; primary parish images for António Martins Fagundes's and Catarina
    Machado de Faria's own vital records are not held. María Fernandes da Costa's birth and death
    dates are not given; her parentage (Belchior Fernandes da Costa × Beatriz Pires) is stated
    by the compiler but no primary image is held. Catarina Machado de Faria's own line is in
    LEMOS § 3º, nº 5 (not read this session).
