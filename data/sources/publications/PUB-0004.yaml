notes:
- text: >-
    The cross-reference "vid. SOUTO-MAIOR, § 1º, nº 5" [corrected 2026-10-09 from a misread
    "§ 5º"] in Vol. IV (Mariana's entry) and
    "vid. FAGUNDES, § 6º, nº 7" in Vol. IX (Belchior's entry) provide bilateral confirmation
    of the Belchior × Mariana 1650 marriage across both compilations. This internal consistency
    strengthens the strong-evidence classification. [Corrected 2026-10-09: the partnership is
    confirmed by the original 1650 marriage act PAR-0086; the two volumes' cross-references
    corroborate it, and as published genealogy they could not by themselves carry a
    strong-evidence classification (research/README.md, since 2026-10-09).]
- text: >-
    Mariana Fagundes's death date (7.7.1684, S. Sebastião) from Vol. IV is the only held
    source for her death. It implies she survived Belchior by approximately three years (he
    d.26.6.1687 per Vol. IX — actually Belchior died AFTER Mariana; 1687 > 1684 ✓).
