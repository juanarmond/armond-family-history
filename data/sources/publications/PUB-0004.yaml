transcription: >-
  [Full verbatim transcription of printed pp. 312–313 (PDF pp. 305–306). Everything outside
  square brackets is the book's text; each printed paragraph is on its own line; bold, italic
  and small capitals are rendered as plain text; the line-end break SOUTO-/-MAIOR is rejoined;
  generation numbers (5–8) and footnote calls (⁹⁰, ⁹¹) are as printed. The bracketed "of …"
  notes after each "Filhos:"/"Filhas:"/"Filha:" are editorial, derived from the printed
  numbering and indentation.]

  [Abbreviations (editorial gloss, not from the book's own key): B./b. = baptizado (baptised) —
  the book uses n. separately for nascido/natural de (born/native of); f. = faleceu (died);
  C./c. = casou (married); c. c. = casou com; C.g./S.g. = com/sem geração (with/without issue);
  n.p./n.m. = neto(a) paterno(a)/materno(a); vid. = vide; Stª = Santa; D. = Dona.]

  [p.312 — § 6º, PEDRO LOURENÇO MACHADO (5)]

  [Running head:] GENEALOGIAS DA ILHA TERCEIRA

  § 6º

  5 PEDRO LOURENÇO MACHADO – Filho de Antão Martins Fagundes e de Bárbara Dias Vieira (vid. §
  5º, nº 4).

  B. em Stª Bárbara a 2.2.1571 e f. em Stª Bárbara a 27.1.1655.

  Capitão de uma companhia de 79 homens, que tomou parte no assalto do Castelo de S. Filipe, de
  Angra em 1642.

  C. em Stª Bárbara a 14.6.1598 com Maria Fernandes da Costa (ou de Toledo), filha de Belchior
  Fernandes da Costa e de Beatriz Pires.

  Filhos:

  6 Pedro Lourenço Machado, que segue.

  6 Antão Martins Fagundes, o Giga, f. em Stª Bárbara a 28.1.1661.

  C. em Stª Bárbara a 19.2.1659 com Beatriz Dias – vid. BRETÃO, § 1º, nº 2 –.

  6 António Martins Fagundes (ou Machado Fagundes), f. em Stª Bárbara a 17.4.1664.

  Capitão de ordenanças.

  C. c. Catarina Machado de Faria – vid. LEMOS, § 3º, nº 5 –.

  Filhos: [of António Martins Fagundes (6)]

  7 António Machado, padre.

  7 Manuel Machado, que saiu da Terceira.

  7 Mariana Fagundes, f. em S. Sebastião a 7.7.1684.

  C. em Stª Bárbara a 26.9.1650 com Belchior da Ponte Cardoso – vid. SOUTO-MAIOR, § 1º, nº 5 –.
  C.g. que aí segue. ["§ 1º" as printed; the earlier excerpt misread it as "§ 5º".]

  7 Margarida de Lemos Machado, c. c. André de Azedias, alferes de ordenanças, f. na Conceição a
  15.6.1658, com testamento.

  Filhos: [of Margarida de Lemos Machado (7)]

  8 Manuel Machado de Faria

  8 Lázaro Machado

  7 Inês de Lemos Machado, c. nas Lajes a 15.2.1669 com António Ferreira de Melo – vid. AGUIAR,
  § 3º, nº 5 –. C.g. que aí segue.

  7 Pedro Lourenço Machado, n. nas Lajes.

  Alferes de Ordenanças.

  C. nas Lajes a 17.11.1669 com D. Maria, filha de Domingos Pires e de D. Isabel, todos das
  Lajes.

  Filhos: [of Pedro Lourenço Machado (7)]

  8 Manuel, n. nas Lajes a 22.11.1670

