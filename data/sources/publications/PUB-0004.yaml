transcription: >-
  [p.312 — § 6º, PEDRO LOURENÇO MACHADO (5)]
  "PEDRO LOURENÇO MACHADO – Filho de Antão Martins Fagundes e de Bárbara Dias Vieira (vid.
  § 5º, nº 4). B. em Stª Bárbara a 2.2.1571 e f. em Stª Bárbara a 27.1.1655. Capitão de
  uma companhia de 79 homens, que tomou parte no assalto do Castelo de S. Filipe, de Angra
  em 1642. C. em Stª Bárbara a 14.6.1598 com Maria Fernandes da Costa (ou de Toledo), filha
  de Belchior Fernandes da Costa e de Beatriz Pires."
  Filhos:
  "6 Pedro Lourenço Machado, que segue."
  "6 Antão Martins Fagundes, o Giga, f. em Stª Bárbara a 28.1.1661. C. em Stª Bárbara a
  19.2.1659 com Beatriz Dias – vid. BRETÃO, § 1º, nº 2 –."
  "6 António Martins Fagundes (ou Machado Fagundes), f. em Stª Bárbara a 17.4.1664. Capitão
  de ordenanças. C. c. Catarina Machado de Faria – vid. LEMOS, § 3º, nº 5 –."
  [António's children:]
  "7 António Machado, padre."
  "7 Manuel Machado, que saiu da Terceira."
  "7 Mariana Fagundes, f. em S. Sebastião a 7.7.1684. C. em Stª Bárbara a 26.9.1650 com
  Belchior da Ponte Cardoso – vid. SOUTO-MAIOR, § 5º, nº 5 –."
  "7 Margarida de Lemos Machado, c. c. André de Azedias, alferes de ordenanças, f. na
  Conceição a 15.6.1658, com testamento."
  [additional siblings in António's line listed to gen 7]

  [p.313 — continuation]
  "6 Belchior Machado Fagundes, frade franciscano."
  "6 Manuel Machado Fagundes, f. em Stª Bárbara a 22.3.1643. C. em Stª Bárbara a 21.11.1635
  com Maria Coelho – vid. COELHO, § 11º, nº 3 –."
  [additional children of Pedro Lourenço Machado listed]
  "6 Pedro Lourenço Machado – B. em Stª Bárbara a 15.9.1603 e f. em S. Sebastião a
  20.10.1665, com testamento lavrado no tabelião Bartolomeu Pacheco. Alferes de ordenanças.
  C. 1ª vez com Filipa de Lemos – vid. PACHECO, § 7º, nº 3 –. C. 2ª vez com Maria Gato
  – vid. TOSTE, § 18º, nº 2 –."

