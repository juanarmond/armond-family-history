notes:
- text: >-
    The genealogical chain from the repository root to Belchior, as established by Vol. IX:
    Gaspar de Souto Cardoso (gen 3) × Catarina Valadão → Manuel da Ponte Valadão (gen 4)
    × Maria da Costa Leonardes → Belchior da Ponte Cardoso (gen 5) × Mariana Fagundes →
    Gaspar de Souto-Maior (gen 6, b.23.2.1657, identified as P-0092). The STATUS description
    "Roque→Manuel→Belchior chain" is imprecise: Roque da Ponte Cardoso (b.13.2.1575) is
    Manuel's BROTHER (not father); the grandfather is Gaspar de Souto Cardoso × Catarina Valadão.
- text: >-
    Gaspar de Souto-Maior (gen 6) death date: the compilation gives f.2.12.1727 in S. Sebastião.
    However, P-0092 (Gaspar Ferreira) is documented in Villa Rica, Minas Gerais, with his son
    marrying in 1783. For P-0092 to be the same Gaspar, either the 1727 date is erroneous, or
    P-0092 is a different (next-generation) Gaspar. This conflict must be resolved by future
    primary research. The Vol. IX Gaspar's 2nd-marriage children (born 1698–1701) could be
    the parents of a subsequent Gaspar who emigrated; no primary evidence resolves this yet.
    The F-0062 connection to P-0092 is therefore flagged [COMPILED/LEAD] until primary evidence
    confirms the emigration link.
