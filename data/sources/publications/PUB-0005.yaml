abstract: >-
  Genealogical compilation for the SOUTO-MAIOR / Ponte Cardoso family on Terceira Island.
  § 1º traces the Gaspar de Souto Cardoso (died 15.2.1618) line through his son Manuel da
  Ponte Valadão (died 19.8.1652) × Maria da Costa Leonardes (died 27.12.1654) to their son
  Belchior da Ponte Cardoso (b.10.1.1615, d.26.6.1687), Alferes de ordenanças. Belchior
  married Mariana Fagundes at Santa Bárbara on 26.9.1650. Their son Gaspar de Souto-Maior
  was born 23.2.1657. This Gaspar is the ancestor identified as P-0092 (Gaspar Ferreira)
  in the Armond-Toledo repository — note the death date conflict (Vol. IX gives d.2.12.1727
  in São Sebastião; P-0092 is placed in Villa Rica, Brazil, with a son marrying in 1783).
abstract_pt: >-
  Compilação genealógica da família SOUTO-MAIOR / Ponte Cardoso na Ilha Terceira.
  O § 1º traça a linha de Gaspar de Souto Cardoso (f. 15.2.1618) pelo filho Manuel da Ponte
  Valadão (f. 19.8.1652) × Maria da Costa Leonardes (f. 27.12.1654) até o neto Belchior da
  Ponte Cardoso (n.10.1.1615, f.26.6.1687), Alferes de ordenanças. Belchior casou com Mariana
  Fagundes em Stª Bárbara a 26.9.1650. O filho Gaspar de Souto-Maior nasceu a 23.2.1657.
  Este Gaspar é o ancestral identificado como P-0092 (Gaspar Ferreira) — nota: conflito de
  data de óbito (Vol. IX dá f.2.12.1727 em S. Sebastião; P-0092 situa-se em Villa Rica, Brasil,
  com filho casando em 1783).
reliability:
  assessment: >-
    Mendes Forjaz is a rigorous Terceira genealogical compiler. Treated as strong-evidence
    for specific dates and parentage. Key data for our line confirmed internally across
    Vol. IV × Vol. IX cross-references: both volumes record the Belchior × Mariana 1650
    marriage. Belchior's birth (10.1.1615) and death (26.6.1687) are compiled-only; his
    military rank (Alferes de ordenanças) is stated without documentary reference. Manuel da
    Ponte Valadão and Maria da Costa Leonardes death dates (1652, 1654) are stated by the
    compiler. Gaspar de Souto-Maior's birth (23.2.1657) and death (2.12.1727) are compiled-only.
    ⚠ The stated death date (2.12.1727 in S. Sebastião) conflicts with his role as ancestor of
    P-0092 who was in Villa Rica c.1750–1783; this is unresolved and flagged in P-0092 notes.
  informant: Mendes Forjaz (compiler)
  limitations: >-
    Secondary compiled source; no primary parish images held for Belchior's own baptism or
    death, for Manuel × Maria da Costa's marriage, or for Gaspar's Azorean vital records.
    The Gaspar de Souto-Maior death date conflict with P-0092's Brazil context is a material
    uncertainty (see P-0092 notes). Belchior's first wife (Bárbara Gato) and that marriage
    are stated S.g. (no children); we do not hold a primary image for that event.
