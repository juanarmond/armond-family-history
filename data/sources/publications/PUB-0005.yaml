  [p.257 — SOUTO-MAIOR, § 1º: PEDRO GONÇALVES DO SOUTO (1)]

  SOUTO-MAIOR

  § 1º

  1 PEDRO GONÇALVES DO SOUTO, o Cavaleiro – Segundo Frei Diogo das Chagas¹, veio para a Terceira,
  depois de ter estado durante alguns anos no Norte de África, onde foi armado cavaleiro².

  F. na Praia depois de 1547 e depois de enviuvar ordenou-se e foi padre beneficiado na Matriz da
  Praia.

  C. na Praia com Margarida Cardoso – vid. CARDOSO, § 1º, nº 6 –.

  Filhos:

  2 Gaspar de Souto Cardoso, fez testamento na Praia a 25.3.1547, instituindo um vínculo que veio
  a ser abolido a pedido do padre José Coelho Souto-Maior (vid. adiante, nº 8), por provisão de
  19.11.1774³.

  C. c. Iria Fernandes, f. na Praia a 5.7.1570 (sep. na Misericórdia). S.g.

  2 Maria Vaz Cardoso, que segue.

  2 Helena de Souto Cardoso, f. na Praia em Junho de 1563.

  C. depois de 1547 com Carlos de Teive e Gusmão – vid. TEIVE, § 1º, nº 10 –. C.g. que aí segue.

  2 Isabel de Souto Cardoso, f. na Praia a 24.4.1598, com testamento (sep. na capela-mor da
  Matriz).

  C. 1ª vez com Francisco Barbosa – vid. BARBOSA, § 1º, nº 2 –. S.g. Por morte do marido, Isabel
  do Souto teve mercê dos ofícios dele, para serem exercidos pela pessoa que com ela viesse a
  casar, por alvará de 29.3.1546⁴.

  C. 2ª vez (entre Março de 1546 e Março de 1547)⁵ com Francisco Ferreira Teixeira⁶, f. na Praia a
  10.3.1586, escudeiro de D. Martinho de Portugal, arcebispo do Funchal (1533-1547), [continues on
  p.258]

  [Footnotes:]

  1 Espelho Cristalino, p. 325.

  2 Não se conhece a razão porque, a partir de certa altura (finais do séc. XVIII) passaram a
  assinar-se Souto-Maior, quando é certo que o apelido inicial é Souto, embora alguns cronistas
  refiram, sem aduzirem qualquer prova, que ele pertenceria à família Sotto-Mayor. Usámos sempre a
  grafia Souto-Maior, por ser aquela que prevaleceu mais tempo e que é mais conforme com a raiz
  inicial, apesar de, recentemente, alguns dos descendentes terem optado pela grafia Sotto-Mayor.

  3 A.N.T.T., D.P.C.E.I., M. 40, nº 4.

  4 A.N.T.T., Chanc. de D. João III, L. 15, fl. 102-v. e 110.

  5 Ou seja, entre a concessão à viúva da mercê dos ofícios e a data da certidão do 2º casamento,
  feita pelo tabelião Roque Rodrigues, da Praia.

  6 Irmão de António Ferreira, c.c. Antónia Teixeira – vid. TEIXEIRA, § 9º, nº 1 –.

