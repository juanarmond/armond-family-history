transcription: >-
  [p.258 — GASPAR DE SOUTO CARDOSO (3)]
  "GASPAR DE SOUTO CARDOSO – F. na Praia a 15.2.1618, em idade avançada (sep. na Matriz).
  C. c. Catarina Valadão – vid. VALADÃO, § 1º, nº 4 –."
  Children include:
  "4 Manuel da Ponte Valadão, que segue."
  "4 Roque da Ponte Cardoso, b. na Praia a 13.2.1575. C. c. Beatriz Álvares Cardoso.
  Viveram no Pico de Gil de Borba."
  "4 Belchior da Ponte Maciel, que segue no § 3º."

  [p.259 — MANUEL DA PONTE VALADÃO (4)]
  "MANUEL DA PONTE VALADÃO – Ou Manuel da Ponte Cardoso. F. em S. Sebastião a 19.8.1652.
  C. c. Maria da Costa Leonardes, f. em S. Sebastião a 27.12.1654."
  Children include (gen 5):
  "5 Baltazar, b. em S. Sebastião a 6.11.1612."
  "5 Belchior da Ponte Cardoso, que segue."
  "5 Francisco Cardoso da Ponte (ou Cardoso Souto-Maior), b. em S. Sebastião a 12.3.1617
  e f. em S. Sebastião a 28.12.1679. Solteira."
  "5 António Coelho Souto-Maior, b. em S. Sebastião a 13.2.1619 e f. em S. Sebastião a
  17.7.1686 [footnote 9: Deve ter morrido de repente pois é ele que assina o registo de
  óbito anterior, lavrado a 6 de Junho]. Padre vigário da Matriz de S. Sebastião."

  [p.260 — BELCHIOR DA PONTE CARDOSO (5)]
  "BELCHIOR DA PONTE CARDOSO – Ou Belchior da Ponte Souto-Maior. B. em S. Sebastião a
  10.1.1615 e f. em S. Sebastião a 26.6.1687. Alferes de ordenanças.
  C. 1ª vez com Bárbara Gato. S.g.
  C. 2ª vez em Stª Bárbara a 26.9.1650 com Mariana Fagundes – vid. FAGUNDES, § 6º, nº 7 –.
  Viveram no Belo Jardim, termo da vila da Praia."
  Children of 2nd marriage (gen 6):
  "6 Mariana Fagundes, c. em S. Sebastião a 30.3.1693 com António Gonçalves da Costa,
  viúvo de Maria de S. Mateus."
  "6 Maria, b. em S. Sebastião a 5.9.1651."
  "6 Manuel, b. em S. Sebastião a 13.10.1652."
  "6 António Coelho Souto-Maior, que segue."

  [p.261 — continuation of Belchior's children]
  "6 Manuel, b. em S. Sebastião a 16.1.1656. Solteiro."
  "6 Gaspar de Souto-Maior, b. em S. Sebastião a 23.2.1657 e f. a 2.12.1727.
  Capitão de ordenanças.
  C. no Porto Judeu a 5.6.1687 com D. Ana de Sousa – vid. REGO, § 3º, nº 6 –. S.g.
  [wait — checking actual text: 'C. 1ª vez na Igreja do Convento da Graça em Angra
  (reg. S. Sebastião) a 2.10.1690 com D. Margarida Machado – vid. DRUMMOND, § 3º, nº 5 –.
  C.g. que aí segue, por ter preferido os apelidos maternos.
  C. 2ª vez em S. Sebastião a 8.2.1694 com Maria Mendes de Borba [footnote 10], filha de
  Bartolomeu Vieira de Borba e de Iria Mendes.']"
  Filhos do 2º casamento (gen 7):
  "7 Maria, b. em S. Sebastião a 16.2.1698."
  "7 António, b. em S. Sebastião a 4.6.1700."
  "7 Lourença, b. em S. Sebastião a 17.8.1701."
  "6 Maria, b. em S. Sebastião a 18.5.1662."
  "6 Belchior da Ponte Cardoso, b. em S. Sebastião a 20.5.1664. C.c. Joana Baptista."
  "6 Isabel de Souto-Maior, b. em S. Sebastião a 19.9.1666."

