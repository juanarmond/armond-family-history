notes:
- text: >-
    The genealogical chain from the repository root to Belchior, as established by Vol. IX:
    Gaspar de Souto Cardoso (gen 3) × Catarina Valadão → Manuel da Ponte Valadão (gen 4)
    × Maria da Costa Leonardes → Belchior da Ponte Cardoso (gen 5) × Mariana Fagundes →
    Gaspar de Souto-Maior (gen 6, b.23.2.1657, identified as P-0092 [corrected 2026-10-09: only
    as a weakened hypothesis — see the next note] [corrected 2026-10-10: rejected — this
    Gaspar is P-0131; see the 2026-10-10 note]). The STATUS description
    "Roque→Manuel→Belchior chain" is imprecise: Roque da Ponte Cardoso (b.13.2.1575) is
    Manuel's BROTHER (not father); the grandfather is Gaspar de Souto Cardoso × Catarina Valadão.
- text: >-
    Gaspar de Souto-Maior (gen 6) death date: the compilation gives f.2.12.1727 in S. Sebastião
    [corrected 2026-10-09: the book prints "f. a 2.12.1727" with no place].
    However, P-0092 (Gaspar Ferreira) is placed at Villa Rica, Minas Gerais, only by his son's
    birthplace (corrected 2026-10-08 from "documented in Villa Rica"), with his son
    marrying in 1783. For P-0092 to be the same Gaspar, either the 1727 date is erroneous, or
    P-0092 is a different (next-generation) Gaspar. This conflict must be resolved by future
    primary research. The Vol. IX Gaspar's 2nd-marriage children (born [corrected 2026-10-09:
    baptised at São Sebastião] 1698–1701) could be
    the parents of a subsequent Gaspar who emigrated; no primary evidence resolves this yet.
    The F-0062 connection to P-0092 is therefore flagged [COMPILED/LEAD] until primary evidence
    confirms the emigration link. [Resolved 2026-10-10: the primary evidence went the other
    way — his death act (PAR-0100) records his death at São Sebastião in 1727, aged about
    seventy; the F-0062 link to P-0092 is rejected and this Gaspar is P-0131.]
- text: >-
    Corrections of 2026-10-09, from the full verbatim transcription of pp. 257–261 checked
    against the page images. (1) In this book "b." means baptised and "n." born, so 23.2.1657
    (Gaspar) and 10.1.1615 (Belchior, printed "B.") are baptism dates. (2) No place is printed
    for Gaspar b.1657's death on 2.12.1727; earlier statements here that he died "in S.
    Sebastião" were wrong. (3) His entry gives him no rank: the Capitão de ordenanças who married
    D. Ana de Sousa at Porto Judeu on 5.6.1687 (S.g.) is a cousin, also "Gaspar de Souto-Maior,
    n. em S. Sebastião", son of Águeda Simões Cardoso × Baltazar Gonçalves Leonardes (p.260).
    (4) Vol. IX names his first wife (m. 2.10.1690) "D. Margarida Machado"; the "D. Maria das
    Candeias" of footnote 10 is the wife of Domingos Mendes de Borba, brother of his second wife
    Maria Mendes de Borba (m. 8.2.1694). A different source, PUB-0002 f. 55 (Lacerda, quoting
    the 1751 will of Francisco Ferreira Armonde, and his footnote 74 citing an online
    mailing-list post), names a "Margarida das Candeyas" as the wife of a Gaspar de Souto Maior;
    whether she is D. Margarida Machado is an open question, not settled by this book.
    [Updated 2026-10-09: footnote 10 cross-refers D. Maria das Candeias to the same "DRUMMOND,
    § 3º, nº 5" as D. Margarida Machado — and the book's "nº" is the person's generation number
    in the cited section — so she is a different woman from Margarida but of her family and
    generation [INFERRED]; and PUB-0002 f. 56, quoting a private 2008 typescript by Paulo Ribeiro Luz, makes
    Francisco Ferreira Armonde "neto paterno do Alferes Belchior da Ponte Cardoso e de sua
    segunda esposa Mariana Fagundes" and calls his mother "Margarida das Candeyas Machado",
    daughter of Capitão Francisco Ferreira Ermonde/Armonde (1601–1672) and Ana/Maria Machado
    alias Maria das Candeyas (1631–1704). Vol. IX's D. Margarida Machado and the will's Margarida
    das Candeyas are therefore probably one woman — a [LEAD] resting on a compiled typescript
    quoted second-hand, not proof.] (5) The 1694 remarriage and the three 1698–1701 São
    Sebastião baptisms keep him on Terceira into his forties and make the identification with
    P-0092 weaker; it stays an unresolved hypothesis [superseded 2026-10-10: rejected]. (6) § 1º names several Gaspars; only one
    is a child of Belchior × Mariana. (7) § 1º begins one generation above Gaspar de Souto
    Cardoso: Pedro Gonçalves do Souto, o Cavaleiro (1) × Margarida Cardoso → Maria Vaz Cardoso
    (2) → Gaspar de Souto Cardoso (3).
  text_pt: >-
    Correções de 2026-10-09, a partir da transcrição integral e literal das pp. 257–261
    conferida com as imagens das páginas. (1) Neste livro "b." significa batizado e "n."
    nascido; logo, 23.2.1657 (Gaspar) e 10.1.1615 (Belchior, impresso "B.") são datas de
    batismo. (2) O óbito de Gaspar (bat. 1657) a 2.12.1727 não tem local impresso (sem local
    impresso); as afirmações anteriores aqui de que morreu "em S. Sebastião" estavam erradas.
    (3) A entrada dele não lhe dá posto: o Capitão de ordenanças que casou com D. Ana de Sousa
    no Porto Judeu a 5.6.1687 (S.g.) é um primo, também "Gaspar de Souto-Maior, n. em S.
    Sebastião", filho de Águeda Simões Cardoso × Baltazar Gonçalves Leonardes (p.260). (4) O
    Vol. IX nomeia a primeira mulher dele (c. 2.10.1690) "D. Margarida Machado"; a "D. Maria
    das Candeias" da nota 10 é a mulher de Domingos Mendes de Borba, irmão da segunda mulher,
    Maria Mendes de Borba (c. 8.2.1694). Outra fonte, PUB-0002 f. 55 (Lacerda, citando o
    testamento de 1751 de Francisco Ferreira Armonde, e a sua nota 74, que cita uma mensagem de
    lista de discussão on-line), nomeia uma "Margarida das Candeyas" como mulher de um Gaspar de
    Souto Maior; se ela é D. Margarida Machado é pergunta aberta, que este livro não resolve.
    [Atualizado em 2026-10-09: a nota 10 remete D. Maria das Candeias para o mesmo "DRUMMOND,
    § 3º, nº 5" que D. Margarida Machado — e o "nº" do livro é o número de geração da pessoa na
    secção citada —, pelo que é outra mulher que não Margarida, mas da família e da geração dela
    [INFERRED]; e o PUB-0002 f. 56, citando um datiloscrito particular de 2008 de Paulo Ribeiro Luz, faz de
    Francisco Ferreira Armonde "neto paterno do Alferes Belchior da Ponte Cardoso e de sua
    segunda esposa Mariana Fagundes" e chama à mãe dele "Margarida das Candeyas Machado", filha
    do Capitão Francisco Ferreira Ermonde/Armonde (1601–1672) e de Ana/Maria Machado, dita Maria
    das Candeyas (1631–1704). A D. Margarida Machado do Vol. IX e a Margarida das Candeyas do
    testamento são, portanto, provavelmente a mesma mulher — [LEAD] apoiada num datiloscrito
    compilado citado em segunda mão, não prova.] (5) O segundo casamento de 1694 e os três batismos de
    1698–1701 em São Sebastião mantêm-no na Terceira até passados os quarenta anos e enfraquecem
    a identificação com P-0092, que continua hipótese não resolvida [superado em 2026-10-10:
    rejeitada]. (6) O § 1º nomeia vários
    Gaspares; só um é filho de Belchior × Mariana. (7) O § 1º começa uma geração acima de Gaspar
    de Souto Cardoso: Pedro Gonçalves do Souto, o Cavaleiro (1) × Margarida Cardoso → Maria Vaz
    Cardoso (2) → Gaspar de Souto Cardoso (3).
- text: >-
    2026-10-10 — Owner's decision: two men. The gen-6 Gaspar de Souto-Maior of § 1º is now a
    separate person, P-0131, and his identification with Gaspar Ferreira (P-0092), the Vila
    Rica father of Joaquim José Ferreira de Toledo (P-0057), is REJECTED. His own baptism is
    held as PAR-0099 (BPAR 300-dpi scan of the original, São Sebastião B-1611-1687 image 0324):
    23 December 1657, son of the Alferes Belchior da Ponte Cardoso and Mariana Fagundes — so
    this book's "b. 23.2.1657" is a slip [INFERRED: a lost "1" of "12"]. His death act is held
    as PAR-0100: São Sebastião, 2 December 1727, "de idade de setenta annos", "casado com Maria
    Mendes" — which supplies the place the book omits and matches its date. The book's
    evidential weight is unchanged; what changes is that the people of § 1º are no longer
    modelled as ancestors of the archive's owner. They are kept as the Terceira Armond trunk,
    which family tradition (PUB-0002, ff. 55–56) claims for the Ferreira Armonde of Barbacena,
    a family that would attach to the owner only through the unknown parents of Simplício José
    Ferreira Armond (P-0016). Neither link is proven.
  text_pt: >-
    2026-10-10 — Decisão do proprietário: dois homens. O Gaspar de Souto-Maior da geração 6 do
    § 1º é agora uma pessoa distinta, P-0131, e a sua identificação com Gaspar Ferreira
    (P-0092), o pai, em Vila Rica, de Joaquim José Ferreira de Toledo (P-0057), foi REJEITADA.
    O próprio batismo está disponível como PAR-0099 (digitalização a 300 dpi do original, feita
    pelo BPAR, São Sebastião B-1611-1687, imagem 0324): 23 de dezembro de 1657, filho do
    Alferes Belchior da Ponte Cardoso e de Mariana Fagundes — pelo que o "b. 23.2.1657" deste
    livro é um lapso [INFERRED: um "1" perdido de "12"]. O assento de óbito está disponível
    como PAR-0100: São Sebastião, 2 de dezembro de 1727, "de idade de setenta annos", "casado
    com Maria Mendes" — o que dá o local que o livro omite e confirma a data. O peso probatório
    do livro não muda; muda que as pessoas do § 1º deixam de ser modeladas como ancestrais do
    proprietário do arquivo. Ficam guardadas como o tronco Armond terceirense, que a tradição
    familiar (PUB-0002, f. 55–56) reclama para os Ferreira Armonde de Barbacena, família que só
    se ligaria ao proprietário pelos pais desconhecidos de Simplício José Ferreira Armond
    (P-0016). Nenhum dos dois elos está provado.
