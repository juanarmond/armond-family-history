  [Full verbatim transcription of printed pp. 257–261 (PDF pp. 255–259) of Vol. IX, SOUTO-MAIOR §
  1º: every line on each page, including entries for other people, running heads, footnotes and
  printed page numbers. Everything outside square brackets is the book's text as printed
