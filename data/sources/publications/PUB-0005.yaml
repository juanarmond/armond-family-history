abstract: >-
  Genealogical compilation for the SOUTO-MAIOR / Ponte Cardoso family on Terceira Island.
  § 1º opens with Pedro Gonçalves do Souto, o Cavaleiro (1) × Margarida Cardoso, whose
  daughter Maria Vaz Cardoso (2) was the mother of Gaspar de Souto Cardoso (3, died
  15.2.1618). The line continues through his son Manuel da Ponte Valadão (4, died 19.8.1652)
  × Maria da Costa Leonardes (died 27.12.1654) to their son Belchior da Ponte Cardoso (5,
  baptised 10.1.1615, died 26.6.1687), Alferes de ordenanças. Belchior married Mariana
  Fagundes at Santa Bárbara on 26.9.1650. Their son Gaspar de Souto-Maior (6) was baptised at
  São Sebastião on 23.2.1657 and died on 2.12.1727 (the book prints no place of death); he
  married first D. Margarida Machado (Convento da Graça, Angra, 2.10.1690) and secondly Maria
  Mendes de Borba (São Sebastião, 8.2.1694), and three children of the second marriage were
  baptised at São Sebastião in 1698–1701. The book writes "b." for baptised and "n." for
  born. § 1º names several other Gaspars (bapt. 1567, bapt. 1621, a godfather in 1622, and a
  cousin who was a Capitão de ordenanças and married at Porto Judeu in 1687); only one is a
  son of Belchior × Mariana. This Gaspar is P-0131 in this repository; his own baptism
  (PAR-0099, 23 December 1657 — the book's 23.2.1657 is a slip) and death act (PAR-0100, São
  Sebastião, 2 December 1727) are now held. The repository once identified him, tentatively,
  with Gaspar Ferreira (P-0092), placed at Villa Rica, Brazil, by his son's birthplace, with
  that son marrying in 1783; that identification was rejected on 10 October 2026 (owner's
  decision) — he lived and died on Terceira. The people of this section are kept as the
  Terceira Armond trunk, a family tradition (PUB-0002), not as proven ancestors of the
  archive's owner.
abstract_pt: >-
  Compilação genealógica da família SOUTO-MAIOR / Ponte Cardoso na Ilha Terceira. O § 1º
  começa em Pedro Gonçalves do Souto, o Cavaleiro (1) × Margarida Cardoso, cuja filha Maria
  Vaz Cardoso (2) foi mãe de Gaspar de Souto Cardoso (3, f. 15.2.1618). A linha segue pelo
  filho deste, Manuel da Ponte Valadão (4, f. 19.8.1652) × Maria da Costa Leonardes (f.
  27.12.1654), até o filho deles, Belchior da Ponte Cardoso (5, batizado a 10.1.1615, f.
  26.6.1687), Alferes de ordenanças. Belchior casou com Mariana Fagundes em Stª Bárbara a
  26.9.1650. O filho Gaspar de Souto-Maior (6) foi batizado em São Sebastião a 23.2.1657 e
  faleceu a 2.12.1727 (sem local impresso); casou primeiro com D. Margarida Machado (Convento
  da Graça, Angra, 2.10.1690) e depois com Maria Mendes de Borba (São Sebastião, 8.2.1694), e
  três filhos do segundo casamento foram batizados em São Sebastião em 1698–1701. O livro
  escreve "b." para batizado e "n." para nascido. O § 1º nomeia vários outros Gaspares (bat.
  1567, bat. 1621, um padrinho em 1622 e um primo, Capitão de ordenanças, casado no Porto
  Judeu em 1687); só um é filho de Belchior × Mariana. Este Gaspar é P-0131 neste
  repositório; o próprio batismo (PAR-0099, 23 de dezembro de 1657 — o 23.2.1657 do livro é
  um lapso) e o assento de óbito (PAR-0100, São Sebastião, 2 de dezembro de 1727) estão agora
  disponíveis. O repositório chegou a identificá-lo, a título de hipótese, com Gaspar
  Ferreira (P-0092), situado em Villa Rica, Brasil, pelo local de nascimento do filho, que
  casou em 1783; essa identificação foi rejeitada em 10 de outubro de 2026 (decisão do
  proprietário) — ele viveu e morreu na Terceira. As pessoas desta secção ficam guardadas
  como o tronco Armond terceirense, uma tradição familiar (PUB-0002), e não como ancestrais
  provados do proprietário do arquivo.
reliability:
  assessment: >-
    Mendes Forjaz is a rigorous Terceira genealogical compiler. Its dates and parentage
    corroborate the primary records; alone they support a hypothesis, not strong evidence
    (research/README.md, Confidence statuses, since 2026-10-09) [reworded 2026-10-09 from
    "Treated as strong-evidence for specific dates and parentage"]. Key data for our line
    [corrected 2026-10-10: for the Terceira trunk — a family tradition, not a proven line of
    the owner's] confirmed internally across Vol. IV × Vol. IX cross-references [corrected 2026-10-09:
    corroborated, not confirmed — the 1650 marriage is confirmed by the original act PAR-0086;
    the two volumes' cross-references corroborate it]: both volumes record the Belchior × Mariana 1650
    marriage. Belchior's birth [corrected 2026-10-09: baptism — the book prints "B."]
    (10.1.1615) and death (26.6.1687) are compiled-only [corrected 2026-10-09: no longer — his
    original baptism act PAR-0087 (which reads ~9 January 1615, a day before the book) and
    burial act PAR-0088 (26.6.1687) are held, and E-0126/E-0127 are confirmed]; his
    military rank (Alferes de ordenanças) is stated without documentary reference [added
    2026-10-09: the book cites none, but his own burial act PAR-0088 records the rank]. Manuel da
    Ponte Valadão and Maria da Costa Leonardes death dates (1652, 1654) are stated by the
    compiler [added 2026-10-09: both are now confirmed by the original burial acts PAR-0097 and
    PAR-0098, which write him Manuel "de Ponte Cardozo/Cardoso"]. Gaspar de Souto-Maior's birth [corrected 2026-10-09: baptism — the book prints
    "b."] (23.2.1657) and death (2.12.1727) are compiled-only [added 2026-10-09: no record of
    either is catalogued here; the retrieval agent has seen an image it identifies as his
    baptism, at the CDN maximum of 383×527 px with the filiation illegible, which it dates
    23.12.1657 — not promoted, so a lead] [updated 2026-10-10: both are now held — his
    baptism as PAR-0099, the BPAR 300-dpi scan of the original, which reads 23 December 1657
    (so the book's 23.2.1657 is a slip), and his death as PAR-0100, São Sebastião, 2 December
    1727].
    ⚠ The stated death date (2.12.1727 in S. Sebastião [corrected 2026-10-09: the book prints
    no place of death]) conflicts with his role as ancestor of
    P-0092, placed at Villa Rica c.1750 only by his son's birthplace; this is unresolved and flagged in P-0092 notes.
    [Added 2026-10-09: the same entry records his second marriage at São Sebastião on 8.2.1694
    and three children baptised there in 1698–1701, which keep him on Terceira into his forties
    and make the identification with P-0092 weaker; it remains unresolved.] [Resolved
    2026-10-10: there is no such role. The identification of this Gaspar — now P-0131 — with
    P-0092 is rejected (owner's decision), and his death act (PAR-0100) records his death at
    São Sebastião, "de idade de setenta annos".]
  informant: Mendes Forjaz (compiler)
  limitations: >-
    Secondary compiled source; no primary parish images held for Belchior's own baptism or
    death, for Manuel × Maria da Costa's marriage, or for Gaspar's Azorean vital records.
    [Corrected 2026-10-09: Belchior's baptism (PAR-0087) and burial (PAR-0088) are now held, as
    are his parents' burials (PAR-0097, PAR-0098); no image is held for Manuel × Maria da Costa's
    marriage or for any of Gaspar's Azorean vital records.]
    The Gaspar de Souto-Maior death date conflict with P-0092's Brazil context is a material
    uncertainty (see P-0092 notes). [Resolved 2026-10-10: the identification with P-0092 is
    rejected; Gaspar de Souto Maior is P-0131, and his baptism and death acts (PAR-0099,
    PAR-0100) are now held.] Belchior's first wife (Bárbara Gato) and that marriage
    are stated S.g. (no children); we do not hold a primary image for that event.
