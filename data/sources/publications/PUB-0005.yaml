  text; the number before each entry is the book's generation number; superscript digits are its
  footnote markers). Square brackets are editorial. Abbreviations per the book's own key (PDF pp.
  6–7): B./b. = baptizado; N./n. = nasceu, nascido/nascida, natural; F./f. = faleceu; C. = casou;
