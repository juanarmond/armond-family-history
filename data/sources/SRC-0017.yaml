abstract: >-
  A page from an 1881 Leopoldina probate/partilha listing the heirs of an estate
  on Eliza Balbina de Toledo's side. It names Eliza Balbina de Toledo as the wife
  of Simplício José Ferreira Armond and lists her Toledo siblings with ages:
  Maria Bulandina de Toledo (m. Manoel Marques Jorge), Ladisláo Egydio Ferreira
  de Toledo (~23, b. ~1858), Geraldo Augusto de Toledo Lima (~15, b. ~1866, then
  living in Rio de Janeiro), and Josepha Olympia da Paixão (~12, b. ~1869), plus a
  predeceased Carolina Leopoldina Marques inheriting by representation. The
  companion 1884 petition (SRC-0018) names the decedent as D. Mathilde Maria de
  Jezus.
reliability:
  assessment: >-
    Direct primary evidence, from an original court/probate record, that Eliza
    Balbina de Toledo was married to Simplício José Ferreira Armond and that the
    named individuals were her siblings/co-heirs. Establishes Eliza's own (Toledo)
    family — the parents of Aristão Ferreira Armond's mother.
  informant: >-
    The court record (autos de inventário/partilha) prepared by the escrivão; the
    heir relationships are stated in the legal filing.
  limitations: >-
    This downloaded page is a mid-document heir list and does not itself name the
    decedent. The estate's opening pages (and the companion page captioning the
    heirs "Primeiros Nettos") are needed to fix whether the matriarch D. Mathilde
    Maria de Jezus is Eliza's mother or grandmother, and to name the intervening
    Ferreira de Toledo parent. Read from a FamilySearch Full-Text preview image.
