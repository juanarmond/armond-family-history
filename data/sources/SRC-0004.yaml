transcription: >-
  [Entry number appears 39005.] Aos [date partly illegible] de fevereiro de mil
  novecentos e noventa e um [...] declarou que no dia dezoito do corrente mês
  [...] no Hospital Santa Margarida faleceu Geraldo Paz Armond, do sexo
  masculino, cor branca, com setenta e seis anos de idade, natural do Estado de
  Minas Gerais, estado civil casado com Cidalia Engracio Armond, profissão
  aposentado, residente nesta cidade [...], filho de Aristão Ferreira Armond e
  de Liliosa Paz Armond. [Cause and burial text partly illegible.] Observações:
  O falecido não deixou testamento, deixou bens a inventariar e deixou cinco
  filhos.
abstract: >-
  The original Volta Redonda civil death register records that Geraldo Paz
  Armond died on 18 February 1991 at Hospital Santa Margarida, aged 76. It
  identifies his spouse as Cidalia Engracio Armond and his parents as Aristão
  Ferreira Armond and Liliosa Paz Armond. FamilySearch indexes the entry on
  page 557 as certificate 39006, while the handwritten number appears to read
  39005.
reliability:
  assessment: >-
    Original civil-register evidence directly supports the death, date, place,
    age and identity. The reported spouse and parentage are secondary
    information supplied at death but directly stated in the record.
  informant: The declarant's name is not safely legible in the retained image.
  limitations: >-
    Some handwriting is faint. The FamilySearch index duplicates surnames and
    conflicts with the apparent handwritten record number. The retained PNG is
    a pixel-preserving reconstruction of the user-uploaded register image, not
    the downloadable FamilySearch JPG.
