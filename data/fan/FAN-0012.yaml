abstract: >-
  A two-page account and apportionment among creditors (conta e rateio) in a
  Muriaé probate (30 May 1917), listing Aristão Ferreira Armond (P-0008) among
  the creditors. Two successive versions of the account are recorded: the first
  apportions 321$035 among the creditors (Armond receiving 19$352); the revised,
  definitive version adds further costs (custas 382$165), apportions 308$635, and
  reduces Armond's share to 18$584, with each creditor marked "Pg" (Pago/paid). A
  functional (creditor) role; retained as FAN context, subject not this family.
abstract_pt: >-
  Uma conta e rateio entre credores de duas páginas em um inventário de Muriaé
  (30 de Maio de 1917), listando Aristão Ferreira Armond (P-0008) entre os
  credores. Duas versões sucessivas da conta são registradas: a primeira rateia
  321$035 pelos credores (Armond recebendo 19$352); a versão revista e definitiva
  acrescenta custas (382$165), rateia 308$635 e reduz a quota de Armond para
  18$584, com cada credor marcado "Pg" (Pago). Um papel funcional (credor);
  mantido como contexto FAN, cujo objeto não é esta família.
