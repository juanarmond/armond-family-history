transcription: |-
  [Full manual transcription of both pages of the record, read as one continuous
  act. Original spelling and accents preserved; abbreviations expanded in
  [brackets]; uncertain reads marked. FAN context: Aristão appears in a
  functional role (requerente/creditor) in a third party's inventário.]

  [p.1]
  [fl.] 23        [margem sup. dir.: 2$400 / Pregão 12$00 / sinal de conferido a lápis vermelho]

  Audiencia
  Aos vinte dias do mez de Maio do anno do Nascimento de Nosso Senhor
  Jesús-Christo de mil novecentos e vinte e dois, em publica audiencia que na
  sala propria do edificio do "Forum", desta cidade de São Paulo do Muriahé,
  Estado de Minas Geraes, dava o Juiz de Direito da comarca, o Exmo. Snr. Doutor
  Lydio [uncertain: Alexano] Bandeira de Mello, aberta ás doze horas ao toque de
  campainha pelo official de justiça Cypriano José de Oliveira, compareceu o
  Doutor Agripino Gomes Veado e fez o seguinte requerimento:- Por parte de
  Aristão Ferreira Armond, no inventario de Joaquim dos Santos Garcia, accusa a
  citação feita á viuva deste, Dona Felisbina dos Santos Garcia, bem como a seus
  herdeiros Raymundo Wenceslau Rosa, Rita Felisbina Garcia, Maria Felisbina
  Garcia e ainda ao Doutor Promotor de Justiça para nesta audiencia louvar-se com
  o requerente em um avaliador que com o do judicial, que for designado, avalie
  os bens do espolio, e requer que havidas as citações por feitas e accusadas sob
  pregão, se faça a louvação, offerecendo para isso, a escolha das partes os
  cidadãos Antonio de Paula Andrade e Alypio Rodrigues Ferreira, louvando-se no
  primeiro. P.[ede] deferimento sob pregão. Apre-

  [p.2]
  goados não compareceram, pelo Juiz foi nomeado o louvado approvado na ordem de
  sua indicação, ordenando que depois de intimado e juramentado, e designado o do
  judicial, se expedisse o mandado para a avaliação." - É o que consta de meu
  protocollo, a respeito, de cujas notas extrahi o presente termo que vae
  assignado. Eu, [uncertain: Alcilio] Freitas, escrevente juramentado que o
  escrevi. Eu, Christovam Colombo Paula, escr[ivão] que o sub[screvi] [e o]
  assign[ei]. [assinatura] Christovam Colombo Paula

  [margem esq.: 3$600]
  Certidão
  Certifico haver intimado ao Sr. Antonio de Paula Andrade, para acceitar o cargo
  de avaliador particular, para que foi nomeado neste feito, bem como para vir em
  cartorio prestar juramento e assignar o respectivo termo. Ficou sciente, dou fé.
  Muriahé, 22 de Maio de 1922. Eu, [uncertain: Alcilio] Freitas, escrevente
  juramentado o escrevi. [assinatura] Christovam Colombo Paula
abstract: >-
  A two-page audiência (20 May 1922, fl. 23) in the probate inventory of Joaquim
  dos Santos Garcia (Muriaé) in which Aristão Ferreira Armond (P-0008) acts as
  petitioner/requerente: his attorney Dr. Agripino Gomes Veado accuses the
  citation of the widow Dona Felisbina dos Santos Garcia and the heirs and asks
  that appraisers be named. The judge appoints the appraiser (louvado) Antonio de
  Paula Andrade, and an appended certidão records his citation to accept the
  post. A functional role in a third party's estate; retained as FAN context for
  Aristão's adult activity in the Muriaé comarca (1922).
abstract_pt: >-
  Uma audiência de duas páginas (20 de Maio de 1922, fl. 23) no inventário de
  Joaquim dos Santos Garcia (Muriaé) na qual Aristão Ferreira Armond (P-0008)
  atua como requerente: o seu advogado Dr. Agripino Gomes Veado acusa a citação
  da viúva Dona Felisbina dos Santos Garcia e dos herdeiros e requer a nomeação
  de avaliadores. O Juiz nomeia o avaliador (louvado) Antonio de Paula Andrade, e
  uma certidão anexa registra a sua intimação para aceitar o cargo. Um papel
  funcional no espólio de um terceiro; mantido como contexto FAN pela atividade
  adulta de Aristão na comarca de Muriaé (1922).
