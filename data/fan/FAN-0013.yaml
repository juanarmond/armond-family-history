transcription: |-
  [Full transcription read from the evidence scan (a single retained page of the FamilySearch Full-Text image).]

  [fl.] 23        [margem sup. dir.: 2$400 / Pregão 12$00 / sinal de conferido a lápis vermelho]

  Audiencia
  Aos vinte dias do mez de Maio do
  anno do Nascimento de Nosso Se-
  nhor Jesús-Christo de mil novecentos
  e vinte e dois, em publica audiencia
  que na sala propria do edificio do
  "Forum", desta cidade de São Paulo do
  Muriahé, Estado de Minas Geraes, da-
  va o Juiz de Direito da comarca, o
  Exmo. Snr. Doutor Lydio [uncertain: Alexano] Ban-
  deira de Mello, aberta ás doze horas ao
  toque de campainha pelo official de
  justiça Cypriano José de Oliveira, com-
  pareceu o Doutor Agripino Gomes Veado
  e fez o seguinte requerimento:- Por par-
  te de Aristão Ferreira Armond, no in-
  ventario de Joaquim dos Santos Garcia,
  accusa a citação feita á viuva deste,
  Dona Felisbina dos Santos Garcia, bem
  como a seus herdeiros Raymundo Wen-
  ceslau Rosa, Rita Felisbina Garcia, Maria
  Felisbina Garcia e ainda ao Doutor
  Promotor de Justiça para nesta au-
  diencia louvar-se com o requerente
  em um avaliador que com o do judi-
  cial, que for designado, avalie os bens
  do espolio, e requer que havidas as
  citações por feitas e accusadas sob pregão,
  se faça a louvação, offerecendo para is-
  so, a escolha das partes os cidadãos
  Antonio de Paula Andrade e Alypio Ro-
  drigues Ferreira, louvando-se no pri-
  meiro. P. deferimento sob pregão. Apre-
  [o texto continua na página seguinte]
