notes:
- text: >-
    Date corrected against the retrieval side's claim (2026-10-10): the entry reads
    "Aos dezoito dias" — 18 September 1859, not the 17 September reported. Confirmed:
    the child Roza is the legitimate daughter of José Vicente Ribeiro and "Joaquina
    Maria de Lemos" (exactly so written, nothing added), and the godmother is "Roza
    Eugenia de Lemos". Added from the image: the father is "natural de Portugal", the
    mother "natural desta"; the child "branca, nascida a quatro mezes" (born about May
    1859); the godfather "Manoel Alves de Souza Porto [uncertain]"; the officiant "o
    Vigario Rufino".
  text_pt: >-
    Data corrigida em relação à afirmação da pesquisa de recuperação (2026-10-10): o
    assento diz "Aos dezoito dias" — 18 de setembro de 1859, não o 17 de setembro
    relatado. Confirmado: a criança Roza é filha legítima de José Vicente Ribeiro e de
    "Joaquina Maria de Lemos" (assim escrito, sem acréscimo), e a madrinha é "Roza
    Eugenia de Lemos". Acrescentado a partir da imagem: o pai é "natural de Portugal",
    a mãe "natural desta"; a criança "branca, nascida a quatro mezes" (nascida por
    volta de maio de 1859); o padrinho "Manoel Alves de Souza Porto [uncertain]"; o
    oficiante "o Vigario Rufino".
- text: >-
    Bearing on her marriage date. Her marriage to Francisco José Bohrer was celebrated
    at Itaboraí before Rufino José Alves, then coadjutor, and registered only on 1
    August 1879 after a judicial justification whose witnesses put it "a mais de vinte
    annos" earlier (PAR-0002; the clause is read with some uncertainty) — so about
    1858 or before. In September 1859 she is still entered as "Roza Eugenia de Lemos",
    with no married surname, "D." or "mulher de". That is compatible with her being
    unmarried then and with a wedding in late 1859 or after; it does not exclude an
    earlier private wedding, since a married woman could still be entered under her
    own name and an unregistered union need not have changed how the vigário styled
    her. It weighs, weakly, against reading "a mais de vinte annos" as a wedding before
    September 1859 [INFERRED].
  text_pt: >-
    Relevância para a data do casamento. Seu casamento com Francisco José Bohrer foi
    celebrado em Itaboraí perante Rufino José Alves, então coadjutor, e só registrado em
    1º de agosto de 1879, após uma justificação judicial cujas testemunhas o situaram "a
    mais de vinte annos" antes (PAR-0002; a cláusula é lida com alguma incerteza) — ou
    seja, por volta de 1858 ou antes. Em setembro de 1859 ela ainda é lançada como "Roza
    Eugenia de Lemos", sem sobrenome de casada, "D." nem "mulher de". Isso é compatível
    com estar então solteira e com um casamento no fim de 1859 ou depois; não exclui um
    casamento anterior em casa, pois uma mulher casada ainda podia ser lançada com o
    próprio nome e uma união não registrada podia não ter mudado a forma como o vigário
    a tratava. Pesa, fracamente, contra ler "a mais de vinte annos" como um casamento
    anterior a setembro de 1859 [INFERRED].
- text: >-
    Identification of the godmother with Rosa Eugenia de Lemos (P-0035) [STRONG]: the
    full name is exact, in her natal parish, eighteen months after her two 1858
    entries beside João de Lemos Pereira (FAN-0014, FAN-0015). The mother "Joaquina
    Maria de Lemos" is not modelled. The retrieval side takes her for Rosa's elder
    sister Joaquina, baptised 13 September 1823, and separately reports an elder sister
    Emerenciana as José Vicente Ribeiro's wife in 1840 [LEAD — images not held]; if
    both readings stand, José Vicente Ribeiro married two Lemos sisters in turn, or one
    of the readings is wrong [OPEN]. Kept as FAN context (record_category "other",
    because the FAN schema has no parish-register category).
  text_pt: >-
    Identificação da madrinha com Rosa Eugenia de Lemos (P-0035) [STRONG]: o nome
    completo é exato, na sua freguesia natal, dezoito meses depois dos dois assentos de
    1858 ao lado de João de Lemos Pereira (FAN-0014, FAN-0015). A mãe "Joaquina Maria de
    Lemos" não é modelada. A pesquisa de recuperação a toma pela irmã mais velha de
    Rosa, Joaquina, batizada em 13 de setembro de 1823, e relata à parte uma irmã mais
    velha, Emerenciana, como mulher de José Vicente Ribeiro em 1840 [LEAD — imagens não
    disponíveis]; se as duas leituras se mantiverem, José Vicente Ribeiro casou-se
    sucessivamente com duas irmãs Lemos, ou uma das leituras está errada [OPEN].
    Mantido como contexto FAN (record_category "other", porque o esquema FAN não tem
    categoria de registro paroquial).
