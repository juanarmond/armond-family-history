transcription: >-
  [Matriz de São João Batista de Itaboraí; baptism register, two-page spread: an
  unnumbered left-hand page and fl. 121 (folio number at the top right, under an
  illegible flourished rubric). No running head. Thirteen entries: twelve of 14
  August-18 September 1859, each signed by the vigário Mariano de Castro Araujo, and
  one of 13 April 1877 entered later in the blank foot of fl. 121. Damage along the
  binding cuts some line ends on the left page. Every entry on the spread is
  transcribed below in reading order. Read from the image 2026-10-10. TARGET entry:
  fl. 121, sixth entry (margin "Roza."), where Roza Eugenia de Lemos (P-0035) is
  godmother.]


  [Left page, entry 1; margin "Leonel."] "Aos quatorze dias do mez de Agosto de mil
  oitocentos e cincoenta e nove, ne[damaged] freguesia, de licença, baptizou o
  Reverendo Chavão, à Leonel, pardo, [damaged]cido a dois mezes, filho natural de Maria
  Luiza do Espirito Santo; n[damaged]tural desta; padrinhos Alexandrino José de Santa
  Anna e Maria A[damaged]nia de Jesus; do que fiz este assento. O Vig.o J.m Mariano de
  Castro Araujo [rubrica]."


  [Left page, entry 2; margin "Carolina."] "Aos quatorze dias do mez de Agosto de mil
  oitocentos e cincoenta e [uncertain: faint at the binding] nove, nesta freguesia,
  baptizou de licença o Reverendo Chavão a [uncertain: faint] Carolina, parda,
  nascida a quatro mezes, filha natural de Ma[damaged]ria Rosa do Amor Divino natural
  desta; padrinhos Laurindo [uncertain: last letter at the edge] José da Silva e
  Maria Luiza de Jesus; do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo
  [rubrica]."


  [Left page, entry 3; margin "Augusta"] "Aos vinte e seis de Agosto de mil oitocentos
  e cincoenta e nove, nesta fre-guesia baptizou o Reverendo Chavão a Augusta, branca,
  nascida a nove mezes, filha natural de Josefina Maria da Conceição, natu-ral desta,
  padrinhos Fortunato Ferreira da Costa e Candida Bo-thelho [uncertain: thelho /
  telho] de Lacerda, do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo
  [rubrica]."


  [Left page, entry 4; margin "Francisco."] "Aos trez dias do mez de Setembro de mil
  oitocentos e cincoenta e nove nesta Matriz, baptizou o Vigario Rufino à Francisco,
  branco, nas-cido a seis mezes, filho legitimo de José Joaquim da Fonceca e
  Alexandrina Roza da Conceição; naturaes desta. Protectora Nossa Senhora padrinho
  Crispim José de Bessa, do q. fiz est[damaged] assento. O Vig.o J.m Mariano de Castro
  Araujo [rubrica]."


  [Left page, entry 5; margin "Joanna."] "Aos quatro de Agosto, digo Setembro de mil
  oitocentos e cincoenta e no[damaged] nesta Matriz, baptizou o Vigario Rufino à
  Joanna, branca, nasc[damaged]da a um mez, filha natural de Luiza Maria da Conceição,
  natu[damaged] de Inhomerim, Padrinhos João Bernardino da Motta e Joanna Maria da
  Motta; do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Left page, entry 6; margin "João."] "Aos quatro de Setembro de mil oitocentos e
  cincoenta e nove, nest[damaged] Matriz, baptizou o Vigario Rufino à João, preto,
  nascido a quinze dias filho natural de Raimunda Maria do Espirito Santo, natural
  desta Protectora Nossa Senhora, padrinho João Ferrei-ra de Oliveira; do que fiz este
  assento. O Vig.o J.m Mariano de Castro [damaged at the binding; rubrica]." [The
  lower part of the left page is blank.]


  [Fl. 121, head] "[rubric, illegible] 121"


  [Fl. 121, entry 1; margin "Boaventura."] "Aos seis dias do mez de Setembro de mil
  oitocentos e cincoenta e nove annos, nes-ta Matriz, baptizou o Vigario Rufino à
  Boaventura, branco, nascido a dois mezes, filho legitimo de José Antonio da Silva e
  Custodia Feli-ciana do Amor Divino, natural desta, Protectora N.ssa Senhora padrinho
  Francisco Antonio da Silva Chaves, do que fiz este assento. O Vig.o J.m Mariano de
  Castro Araujo [rubrica]."


  [Fl. 121, entry 2; margin "Heduviges."] "Aos treze dias do mez de Setembro de mil
  oitocentos e cincoenta e nove nesta freguesia; baptizou o Vigario Rufino à
  Heduviges, parda, nascida a onze mezes, filha natural de Custodia Antonia da
  Con-ceição, natural desta, padrinhos Sabino José Alves Nogueira e Ger-trudes Maria
  da Conceição, do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo
  [rubrica]."


  [Fl. 121, entry 3; margin "Luiz."] "Aos treze de Setembro de mil oitocentos e
  cincoenta e nove, nesta Matriz, baptizou o Vigario Rufino à Luiz, branco, nascido a
  um anno, filho legitimo de Antonio Cyrne [uncertain: rn / m] de Vasconcellos e Maria
  Rosa da Conceiç[damaged] naturaes desta; padrinhos José Luiz de Azeredo e Firmina
  Rosa da Conceiç[damaged] do que fiz este assento. O Vig.o J.m Mariano de Castro
  Araujo [rubrica]."


  [Fl. 121, entry 4; margin "Galdino."] "Aos treze de Setembro de mil oitocentos e
  cincoenta e nove, nesta Matriz, baptizou o Vigario Rufino à Galdino, pardo, nascido
  a seis mezes, filho legitimo de Laureano José Barbosa e Elizia Rosa do Espirito
  Santo, naturaes desta; Protectora Nossa Senhora, pa-drinho Joaquim Mariano Machado;
  do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Fl. 121, entry 5; margin "Rufino."] "Aos treze dias do mez de Setembro de mil
  oitocentos e cincoenta e nove nesta freguesia, baptizou o Vigario Rufino à Rufino,
  bran[damaged]co, nascido a dois mezes, filho legitimo de Joaquim Manoel da Silva, e
  Alexandrina Maria da Silva, naturaes desta, padrinhos Manoel Joaquim da Silva e
  Angela Maria da Conceição; do que fiz este assento. O Vig.o J.m Mariano de Castro
  Araujo [rubrica]."


  [Fl. 121, entry 6 — TARGET; margin "Roza."] "Aos dezoito dias do mez de Setembro de
  mil oitocentos e cincoenta e nove, nesta Matriz, baptizou o Vigario Rufino a Roza,
  branca, nascida a quatro mezes, filha legitima de José Vicente Ribeiro, natural de
  Portugal e Joaquina Maria de Lemos, natural desta, padrinhos Manoel Alves de Souza
  Porto [uncertain] e Roza Eugenia de Lemos, do que fiz este assento. O Vig.o J.m
  Mariano de Castro Araujo [rubrica]." [A long stroke from "assento" on the line above
  crosses the third letter of "dezoito"; the "-oito" ending, compared with
  "oitocentos" in the same entry, fixes the day as the 18th. In "Porto" no i-dot is
  visible and the middle letters look like "or" ("Pinto" is not supported).]


  [Fl. 121, entry 7 — added later, in another hand; margin "Joachim."] "Aos treze de
  Abril de mil oitocentos e setenta e sete, nesta freguezia [uncertain: s / z],
  baptisei solemnemente a Joachim, branco, nascido em vinte e um de Fevereiro dese
  [uncertain] anno, filho legitimo de Custodio Xavier de Barros e Amelia Augusta dos
  Santos [uncertain: ink and paper damage] Barros, naturaes desta, padrinhos Miguel
  Archangelo Marques Rosa [line-filler stroke] Protectora N. Senhora: do que fiz este
  assento. Vig.o J.m Mariano de Castro [damaged at the corner; rubrica]."
abstract: >-
  A baptism entry of 18 September 1859 at the Itaboraí matriz: Roza, four months old,
  legitimate daughter of José Vicente Ribeiro, "natural de Portugal", and Joaquina
  Maria de Lemos, "natural desta", baptised by "o Vigario Rufino" (presumably Rufino
  José Alves, styled coadjutor in the 1858 entries of FAN-0014), with Manoel Alves de
  Souza Porto and "Roza Eugenia de Lemos" as godparents. Rosa
  Eugenia de Lemos (P-0035) appears only in a functional role — as godmother — still
  under her own name with no married surname or "D.", about eighteen months after her
  March and June 1858 godmother entries (FAN-0014, FAN-0015). The mother's surname "de
  Lemos" and the child's name suggest kinship — the retrieval side takes the mother for
  Rosa's elder sister Joaquina (b. 1823) [LEAD]; no relationship is stated. The
  officiant is the same Rufino before whom Rosa's own marriage was celebrated
  (PAR-0002). FAN context only, never evidence for a genealogical conclusion.
abstract_pt: >-
  Um assento de batismo de 18 de setembro de 1859 na matriz de Itaboraí: Roza, de
  quatro meses, filha legítima de José Vicente Ribeiro, "natural de Portugal", e de
  Joaquina Maria de Lemos, "natural desta", batizada pelo "Vigario Rufino"
  (presumivelmente Rufino José Alves, tratado por coadjutor nos assentos de 1858 de
  FAN-0014), tendo Manoel Alves de Souza Porto e "Roza Eugenia de Lemos" como padrinhos.
  Rosa Eugenia de Lemos (P-0035) aparece apenas num papel funcional — como madrinha —
  ainda com o próprio nome, sem sobrenome de casada nem "D.", cerca de dezoito meses
  depois dos seus assentos de madrinha de março e junho de 1858 (FAN-0014, FAN-0015).
  O sobrenome "de Lemos" da mãe e o nome da criança sugerem parentesco — a pesquisa de
  recuperação toma a mãe pela irmã mais velha de Rosa, Joaquina (n. 1823) [LEAD];
  nenhum parentesco é declarado. O oficiante é o mesmo Rufino perante quem se celebrou
  o casamento da própria Rosa (PAR-0002). Apenas contexto FAN, nunca evidência para
  uma conclusão genealógica.
