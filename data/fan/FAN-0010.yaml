transcription: |-
  [Full manual transcription of the three-page 1º traslado (certified copy) of
  the escritura de hypotheca. Old-Brazilian-Portuguese notarial hand; original
  spelling and accents preserved, abbreviations expanded in [brackets],
  unreadable words marked [illegible] and doubtful reads [uncertain: …].]

  [p.1] [folio 3]
  [Top of page — later fiscal revalidation: revenue stamp "SECRETARIA DAS
  FINANÇAS … REIS"; ink annotation:] Muri[ah]é 26 de Ju[nho] 1906 [Albuquerque
  rubric] 1 [right margin: Fl.] [uncertain: Medeiros]

  Livro de Notas do 1º Off[icio] de Muriahé em f[olha]s [uncertain] em q[ue]
  f[olha]s [uncertain] — O Tabellião [rubric:] Albuquerque

  1º Traslado.
  Escriptura de hyppotheca q[ue] entre si fazem e passão como outorgantes
  Francisco Garcia de Souza e sua m[ulhe]r D. Thereza Gomes de Jesus e como
  outorgado Missias Pereira Leite, como abaixo se vê. Saibão quantos esta virem
  que no anno do Nascimento de N. S. Jesus Christo de 1903, aos vinte e um dias
  do mez de Outubro do dito anno, neste Sitio - [uncertain: Sofocó] - na
  Laginha, onde a chamado vim, por me ser distribuida esta escriptura, em casa
  de residencia de Missias Pereira Leite, ahi perante mim Tabellião e as duas
  testemunhas abaixo assignadas compareceram como outorgantes devedores
  Francisco Garcia de Souza e sua mulher D. Thereza Gomes de Jesus, lavradores,
  residentes no Districto do Gloria e como outorgado credor Missias Pereira
  Leite, tambem lavrador e [uncertain: Aropiro], residente nesta situação, na -
  Laginha - do Districto da Cidade do Muriahé todos no gozo de seus direitos
  civis e conhecidos de mim Tabellião e das testemunhas presentes, do que dou
  fé. E logo pelos outorgantes, ditos Francisco Garcia de Souza e sua m[ulhe]r
  D. Thereza Gomes de Jesus, me foi dito, perante [interlineado] as testemunhas,
  que se confessão devedores ao outorgado Missias Pereira Leite da quantia de
  dous contos de reis que a titulo de emprestimo lhes foi fornecida por diversas
  vezes e em parcellas de dinheiro desta Republica dos E. U. do Brazil, a qual
  q[uan]tª se comprometterem a pagar desta data a quatro annos em 4 pagamentos
  de 500$000 cada um, sendo o 1º de hoje a um anno, o 2º de hoje a 2 annos, o 3º
  desta data a 3 annos e o 4º desta data a quatro annos, pagando com cada
  pagamento

  [p.2]
  pagamento o juro de seis por cento que fica correndo desde hoje, sendo mais
  obrigados a pagar a multa de vinte por cento pela quantia que deverem, no caso
  de ser preciso cobrança judicial, em qualquer caso; disserão mais que este
  debito se considerará vencido desde que os outorgantes forem accionados por
  qualquer outro credor, podendo logo o outorgado promover sua cobrança: para
  garantia deste debito disserão ainda os outorgantes que dão à hyppotheca os
  bens seguintes: quarenta alqueires de terra na fazenda - Boa Sorte = Districto
  desta Cidade, terras que divisam com a fazenda da [uncertain: Caissara], com a
  fazenda da Boa Vista, com a fazenda de Joaquim Ferreira da Cunha e com
  Marcellino Luiz da Silva, contendo as benfeitorias seguintes = Metade da casa
  de vivenda, um paiol e uma tulha para guardar café, moinho, 15 mil pés de café
  mais ou menos, cuja fazenda como descripta vem, não está hyppothecada por
  qualquer escriptura convencional ou legal. Pelo outorgado foi dito que acceita
  a presente escriptura e me apresentou o tallão seguinte = Vale a emenda - dez
  mil reis - Oliveira. Nº 43 Renda do Estado de Minas Geraes. Exercicio de 1903.
  A folhas do Caderno de receita fica debitada ao Collector a importancia de dez
  mil reis recebida de Missias Pereira Leite pelo imposto de [uncertain: ½] por %
  e 10 % add[icionaes] sobre 2:000$000, por q[ue] Francisco Garcia de Souza e sua
  m[ulhe]r dão escriptura hyppothicaria de um sitio e benfeitorias nesta Cidade.
  Collectoria Municipal de Muriahé 21 de 8bro [Outubro] de 1903. O Collector A.
  F. de Oliveira. Foi me tambem apresentado o tallão de imposto territorial
  datado de 26 de Junho do corr[ente] anno, de nº 128, assignado pelo [uncertain:
  Cel.] Guimarães. Assim juntos e contractados me pedirão lhe lavrasse a presente
  Escriptura, que sendo lhes lida, a acharão confor-
  me

  [p.3] [folio 4]
  [Top of page — later fiscal revalidation: revenue stamp; ink annotation:]
  [uncertain: A] 26 de Junho 1906 [uncertain: Abro] o o [Albuquerque rubric]
  [uncertain: Medeiros] 2

  conforme e a assignão com as testemunhas Henrique [uncertain: Haitenreiter] e
  Aristão Ferreira Armond, do que dou fé. Eu Romualdo Moreira de Albuquerque
  Tabellião que a escrevi e assigno. Romualdo Moreira de Albuquerque. (Sobre
  2.200 em estampilhas [uncertain: federaes]). Laginha 21 de Outubro de 1903.
  Francisco Garcia de Souza. Thereza Gomes de Jesus. [uncertain: Missias]
  Pereira Leite. Henrique [uncertain: Haitenreiter]. Aristão Ferreira Armond —
  Vale a entre linha que diz = perante = e dou fé. Trasladada hoje 23 de 8bro
