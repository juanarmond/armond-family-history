abstract: >-
  A notarial deed at Laginha (Muriaé) witnessed by Aristão Ferreira Armond
  (P-0008), alongside Henrique Haitenreiter (the OCR-derived "Martins" was a
  misreading; the image shows a German surname, spelling uncertain), before the
  tabelião Romualdo Moreira de
  Albuquerque. A functional (witness) role; the earliest Full-Text placement of
  Aristão as an adult in the Muriaé area. Retained as FAN context.
abstract_pt: >-
  Uma escritura notarial em Laginha (Muriaé) testemunhada por Aristão Ferreira
  Armond (P-0008), ao lado de Henrique Haitenreiter (o "Martins" derivado do OCR era
  uma leitura equivocada; a imagem mostra um sobrenome alemão, grafia incerta),
  perante o tabelião Romualdo
  Moreira de Albuquerque. Um papel funcional (testemunha); a mais antiga
  localização em Full-Text de Aristão como adulto na região de Muriaé. Mantido
  como contexto FAN.
