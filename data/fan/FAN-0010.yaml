abstract: >-
  A notarial hypothec deed (1º traslado of an escritura de hypotheca) drawn at
  the Sítio [uncertain: Sofocó], Laginha, in the district of the city of Muriaé,
  on 21 October 1903. The farming couple Francisco Garcia de Souza and his wife
  D. Thereza Gomes de Jesus acknowledged a debt of two contos de réis
  (2:000$000) owed to the creditor Missias Pereira Leite — repayable over four
  years in four annual installments of 500$000 at 6% interest, with a 20%
  penalty on judicial collection — and secured it by mortgaging forty alqueires
  in the "Boa Sorte" farm together with half the dwelling house, a paiol, a
  tulha and about 15,000 coffee trees. Aristão Ferreira Armond (P-0008) and
  Henrique Haitenreiter (surname uncertain) served as the two witnesses, before
  the tabelião Romualdo Moreira de Albuquerque; the traslado was made 23 October
  and the deed registered 24 October 1903 (Livro 2 D, fs. 148, nº 1566).
  Aristão's role is purely functional (witness), so the record is retained as FAN
  context — never evidence — and marks the earliest Full-Text placement of him as
  an adult in the Muriaé area. (An earlier OCR read of the co-witness surname as
  "Martins" was a misreading; the image shows a German-looking surname, spelling
  uncertain.)
abstract_pt: >-
  Uma escritura de hypotheca (1º traslado de uma escritura de hypotheca) lavrada
  no Sítio [uncertain: Sofocó], Laginha, no Districto da Cidade do Muriahé, em 21
  de Outubro de 1903. O casal de lavradores Francisco Garcia de Souza e sua
  mulher D. Thereza Gomes de Jesus confessaram uma dívida de dois contos de réis
  (2:000$000) ao credor Missias Pereira Leite — a pagar em quatro anos, em quatro
  prestações anuais de 500$000 a 6% de juros, com multa de 20% em caso de
  cobrança judicial — garantida pela hipoteca de quarenta alqueires na fazenda
  "Boa Sorte" com metade da casa de vivenda, um paiol, uma tulha e cerca de
  15.000 pés de café. Aristão Ferreira Armond (P-0008) e Henrique Haitenreiter
  (sobrenome incerto) figuram como as duas testemunhas, perante o tabelião
  Romualdo Moreira de Albuquerque; o traslado foi feito em 23 de Outubro e a
  escritura registrada em 24 de Outubro de 1903 (Livro 2 D, fs. 148, nº 1566). O
  papel de Aristão é meramente funcional (testemunha), de modo que o registro é
  mantido como contexto FAN — nunca evidência — e marca a mais antiga
  localização em Full-Text dele como adulto na região de Muriaé. (Uma leitura
  anterior de OCR do sobrenome da co-testemunha como "Martins" era equivocada; a
  imagem mostra um sobrenome de aparência alemã, grafia incerta.)
