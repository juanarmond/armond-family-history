transcription: >-
  [Matriz de São João Batista de Itaboraí; baptism register, two-page spread: an
  unnumbered left-hand page and fl. 92 (folio number at the top right, followed by a
  rubric, [uncertain: "Araujo"]). No running head; every entry is of June 1858.
  Thirteen entries, each signed by the vigário Mariano de Castro Araujo; neither page
  opens with a continuation. Ink blots and damage at the gutter cut some line ends on
  the left page. Every entry on the spread is transcribed below in reading order.
  Read from the image 2026-10-10. TARGET entry: left page, fourth entry (margin
  "Ernestina."), where Rosa Eugenia de Lemos (P-0035) is godmother.]


  [Left page, entry 1; margin "Maria."] "Aos quatro dias do mez de Junho de mil
  oitocentos e cincoenta e oi[damaged] annos, nesta Matriz, baptizou o Reverendo
  Coadjuctor à Maria branca, nascida a vinte e trez de Junho de cincoenta e sete,
  filha legi-tima de Francisco dos Santos Porto e Anna Bernarda do Es[damaged]pirito
  Santo, elle natural de Portugal e ella desta freguezia; pa[damaged]nhos Nabuco
  Monteiro Sarzedas e Maria Cerilma de Macedo; do que fiz este assento que assig-nei.
  O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Left page, entry 2; margin "Manoela"] "Aos cinco dias do mez de Junho de mil
  oitocentos e cincoenta e oito annos, nesta freguesia baptizou o Reverendo
  Coadjuctor à Manoela, parda, nascida a seis mezes, filha natural de Virgi-nia Maria
  de Azevedo, natural desta freguezia; padrinhos Ma-riano Alves de Azevedo e Fermiana
  Maria de Azevedo, do q[damaged] este assento, que assignei. O Vig.o J.m Mariano de
  Castro Araujo [rubrica]."


  [Left page, entry 3; margin "Aurelia"] "Aos cinco dias do mez de Junho de mil
  oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o Reverendo Rufino à
  Aurelia, parda, nascida a trez mezes, filha natural de Gertrudes Maria de Jesus,
  natural desta freguesia; padrinhos Floreano [uncertain: Floreano / Floriano] Joaquim
  d'Alvarenga e Maria Joaquina de Azevedo do que fiz este assento que assignei: O
  Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Left page, entry 4 — TARGET; margin "Ernestina."] "Aos oito dias do mez de Junho de
  mil oitocentos e cincoenta e oito annos, nesta Matriz baptizou o Reverendo
  Coadjuctor à Ernesti-na, branca, nascida a quatro mezes, filha natural de
  Francis-ca Maria da Conceição, natural desta freguesia; padrinho João de Lemos
  Pereira e Rosa Eugenia de Lemos, do que fiz este assen-to que assignei. O Vig.o J.m
  Mariano de Castro Araujo [rubrica]." ["Rosa" is written with an "s": the same hand
  writes "Roza" with a descending "z" in "Maria Roza da Silva" (fl. 92, entry 1).
  "padrinho" is singular, as written.]


  [Left page, entry 5; margin "Jeminiano."] "Aos dezenove [uncertain: faint] dias do
  mez de Junho de mil oitocentos e cincoenta e oito annos, nes-ta Matriz, baptizou o
  Coadjuctor Rufino José Alvares à Jeminiano, pardo, nascido a seis mezes, filho
  natural de Senhorinha [uncertain] Rosa de Jesus; natural desta freguesia; padrinhos
  Francisco Nunes Vieira e Carolina Maria de Jesus; do que fiz este termo que
  assignei. O Vig.o J.m Mar.o de Castro Araujo [rubrica]."


  [Left page, entry 6; margin "Francisca."] "Aos vinte e trez dias do mez de Junho de
  mil oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o Reverendo
  Coadjuctor Ruf[damaged] a Francisca, parda, filha natural de Eufrazina Maria
  Alv[damaged] natural desta freguesia; padrinhos José Fernandes Maldonado e –
  Jeronima Rosa do Amor Devino, do que fiz este assento que assig-nei: O Vig.o J.m
  Mariano de Castro Araujo [rubrica]."


  [Left page, entry 7; margin "Justiniano:"] "Aos vinte e trez de Junho de mil
  oitocentos e cincoenta e oito, nesta Freguesia, baptizou [damaged] Reverendo
  Coadjuctor [a word overwritten with a heavy stroke] Rufino a Justiniano, pardo,
  nascido a dois mezes, filho [damaged]ral de Eufrasina, escr.a [uncertain] de Joaquim
  Vieira de Souza [uncertain: Souza / Sousa]; padrinhos João Victorino [damaged]
  Mattos e Protectora N. Senhora [uncertain: overlapped by the signature flourish]; do
  que fiz este assento. O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Fl. 92, head] "92 [rubric — uncertain: Araujo]"


  [Fl. 92, entry 1; margin "Pedro" (initial damaged)] "Aos vinte e quatro dias do mez
  de Junho de mil oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o
  Reverendo Rufino a Pedro, branco, nascido a dez mezes, filho legitimo de Delfino
  Manoel da Silva e Maria Roza da Silva, naturaes desta freguesia, pa-drinhos Vergilio
  Constancio Gomes de Araujo e D. Olivia Ma-riana Gomes de Araujo; do que fiz este
  assento, que assignei: O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Fl. 92, entry 2; margin "Domingas."] "Aos vinte e seis dias do mez de Junho de mil
  oitocentos e cincoen-ta e oito annos, nesta Matriz, baptizou o R.do Coadjuctor
  Rufino a Domingas, parda nascida a dez mezes, filha natural de Maria Apolinaria de
  Jesus, natural de Maricá, Protectora Nossa Senhora e Padrinho Joaquim Manoel de
  Santa Anna; do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo
  [rubrica]."


  [Fl. 92, entry 3; margin "João"] "Aos vinte e nove dias do mez de Junho de mil
  oitocentos e cincoen-ta e oito annos, nesta Matriz, baptizou o Reverendo Coadjuctor
  Rufino a João, pardo, nascido a dois annos, filho natural de Joanna Maria da
  Conceição, natural desta freguesia; padrinhos Francis-co Joaquim do Couto e Balbina
  Carolina do Amor Devino do que mandei fazer [uncertain] este assento que assignei O
  Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Fl. 92, entry 4; margin "Maria"] "Aos vinte e nove dias do mez de Junho de mil
  oitocentos e cincoenta e oito, nesta Matriz, baptizou o Reverendo Coadjuctor à
  Ma-ria, pardo [uncertain: pardo / parda], nascida a nove mezes, filha natural de
  Maria Ber-narda da Conceição, natural desta; padrinhos Francisco José da Silva
  Reis; do que fiz este assento, que assignei. O Vig.o J.m Mariano de Castro Araujo
  [rubrica]."


  [Fl. 92, entry 5; margin "Maria"] "Aos vinte e nove dias do mez de Junho de mil
  oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o Reverendo Coadjuctor
  à Maria, parda, nascida a cinco mezes, filha natural de Josefina F.e.cia [uncertain:
  abbreviated forename] da Matta, natural desta; padrinhos Mariano Antonio de Souza
  [uncertain: Souza / Sousa] e Rosa Maria de Jesus, do que fiz este assento, que
  assig-nei. O Vig.o J.m Mariano de Castro Araujo [rubrica]."


  [Fl. 92, entry 6; margin "[damaged]minda"] "Aos dose dias do mez de Junho de mil
  oitocentos e cincoenta e oito, nesta Freguesia, baptizou o Reverendo Coadjuctor
  Ru-fino, à Arminda, branca, nascida a trez de Janeiro desse [uncertain: desse /
  deste] anno, filha natural de Joaquina Maria do Espirito San-to, natural desta;
  padrinhos Pedro Sedrino [uncertain] Quintanilha [uncertain] [damaged] do que fiz
  este assento. O Vig.o J.m Mariano de Castro Araujo [rubrica]."
abstract: >-
  A baptism entry of 8 June 1858 at the Itaboraí matriz: Ernestina, white, four months
  old, natural daughter of Francisca Maria da Conceição, baptised by the coadjutor,
  with "João de Lemos Pereira e Rosa Eugenia de Lemos" as godparents. Rosa Eugenia de
  Lemos (P-0035) appears only in a functional role — as godmother — under her own name
  with no married surname or "D.", eleven weeks after she and the same João de Lemos
  Pereira stood for Pedro (24 March 1858, FAN-0014). João is probably her younger
  brother, baptised in 1841 (PAR-0102) [INFERRED — no relationship is stated]. The
  coadjutor named elsewhere on the spread is Rufino José Alvares — presumably the
  Rufino before whom her marriage to Francisco José Bohrer was celebrated (PAR-0002).
  FAN context only, never evidence for a genealogical conclusion.
abstract_pt: >-
  Um assento de batismo de 8 de junho de 1858 na matriz de Itaboraí: Ernestina,
  branca, de quatro meses, filha natural de Francisca Maria da Conceição, batizada pelo
  coadjutor, tendo "João de Lemos Pereira e Rosa Eugenia de Lemos" como padrinhos. Rosa
  Eugenia de Lemos (P-0035) aparece apenas num papel funcional — como madrinha — com o
  próprio nome, sem sobrenome de casada nem "D.", onze semanas depois de ela e o mesmo
  João de Lemos Pereira terem sido padrinhos de Pedro (24 de março de 1858, FAN-0014).
  João é provavelmente seu irmão mais novo, batizado em 1841 (PAR-0102) [INFERRED —
  nenhum parentesco é declarado]. O coadjutor nomeado noutros assentos da página dupla
  é Rufino José Alvares — presumivelmente o Rufino perante quem se celebrou seu
  casamento com Francisco José Bohrer (PAR-0002). Apenas contexto FAN, nunca evidência
  para uma conclusão genealógica.
