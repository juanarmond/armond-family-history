transcription: >-
  [Matriz de São João Batista de Itaboraí; baptism register, two-page spread headed
  "Março de 1858" on the left-hand page; fl. 88 numbered at the top right of the
  right-hand page. Fourteen entries (7 February-4 April 1858), each signed by the
  vigário. Every entry on the spread is transcribed below in reading order. Read
  from the image 2026-10-10. TARGET entry: left page, fifth entry (the second margin
  "Pedro"), where Roza Eugenia de Lemos (P-0035) is godmother. The vigário signs "O
  Vig.o J.m [uncertain: the superscript after the J] Mariano de Castro Araujo"
  throughout.]


  [Left page, running head] "Março de 1858."


  [Left page, entry 1; margin "Francisca."] "Aos vinte dias do mez de Março de mil
  oitocentos e cincoenta e oito nesta Matriz, baptizou o R.do Coadjuctor à Francisca,
  parda, nas-cida a dous annos, filha natural de Thomazia Maria Justina, natu-ral
  desta Freguezia; Padrinhos João Manuel Custodio e Anna Joa-quina de São José; do que
  fiz este assento. O Vig.o J.m Mariano de Castro Araujo."


  [Left page, entry 2; margin "Candida."] "Aos vinte dias do mez de Março de mil
  oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o Reverendo Coadjuctor à
  Candida, parda, nascida a desesete mezes, filha natural de Laurentina Maria do
  Espirito Santo, natural desta; Protectora N. Senhora e Padrinho Theodoro da Silva
  Barros; do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo."


  [Left page, entry 3; margin "Belarmino"] "Aos vinte dias do mez de Março de mil
  oitocentos e cincoenta e oi-to, nesta Matriz, baptizou o Reverendo Coadjuctor a
  Belarmi- parda, nascida a oito mezes, filha natural de Heduviges Maria da Conceição,
  natural desta; Padrinho Theodoro da Silva Bar-ros; do que fiz este assento. O Vig.o
  J.m Mariano de Castro Araujo." [The child's name breaks at the line end after
  "Belarmi-" and is not completed; the margin reads "Belarmino", but the entry
  describes a girl ("parda, nascida", "filha").]


  [Left page, entry 4; margin "Pedro."] "Aos vinte e quatro dias do mez de Março de mil
  oitocentos e cincoenta e oito, nesta Freguezia, baptizou o Reverendo Coadjuc-tor à
  Pedro, branco, nascido a oito mezes, filho legitimo de José Luiz Furtado de
  Mendonça, natural de Saquarema e Carlo-ta Joaquina de Azevedo, natural desta;
  padrinho Laureano Antonio da Costa e Mello; do que fiz este assento. O Vig.o J.m
  Mariano de Castro Araujo."


  [Left page, entry 5 — TARGET; margin "Pedro."] "Aos vinte e quatro dias do mez de
  Março de mil oitocentos e cincoen-ta e oito, nesta Matriz, baptizou o R.do Coadjuctor
  à Pedro, filho na-tural de Candida Angelica do Nascimento, natural desta Freguezia;
  Padrinhos João de Lemos Pereira e Roza Eugenia de Lemos; do que fiz este assento,
  que assignei. O Vig.o J.m Mariano de Castro Araujo."


  [Left page, entry 6; margin "Maria"] "Aos vinte e sete dias do mez de Março de mil
  oitocentos e cincoenta e oito, nesta Matriz baptizou solemnemente o R.do Coadjuctor
  à Maria, preta, nascida a sete mezes, filha natural de Eufrasina Maria Ca-rolina,
  natural desta. Padrinhos Vergilio Constancio Gomes de Araujo e D. Olivia Marianna
  Gomes de Araujo, do que fiz este assento, q.e assig.i O Vig.o J.m Mariano de Castro
  Araujo."


  [Left page, entry 7; margin "José / Duplicata a f. 93."] "Aos sete dias do mez de
  Fevereiro de mil oitocentos e cincoenta e oito, nesta Matriz, baptizou o R.do
  Coadjuctor Rufino José Alves [uncertain: Alves / Alvares] a José, nascido a vinte e
  oito de Dezembro de cincoenta e sete, filho legitimo de José Gregorio de Carvalho e
  de Antonia Mesquita [uncertain] de Carvalho, forão Padrinhos Antonio Ignacio de
  Mesquita e Maria Clara de Mesquita, avós maternos; do que fiz este assento. O Vig.o
  J.m Mariano de Castro Araujo." [The margin note says the entry is duplicated at fl.
  93.]


  [Right page, folio] "88" [with a rubric]


  [Right page, entry 1; margin "Francisca." (initial damaged)] "Aos vinte e nove dias
  do mez de Março de mil oitocentos e cincoenta e oito nesta Matriz baptizou
  solemnemente o R.do Coadjuctor Rufino à Francisca, parda, nascida a dois mezes, filho
  natural de Maria Custodia, natural desta Freguezia; Protectora N. Senhora e padrinho
  José Mendonça da Silva, do que fiz este assento, que assignei. O Vig.o J.m Mariano de
  Castro Araujo."


  [Right page, entry 2; margin "Mariana." (initial damaged)] "Aos quatro dias do mez de
  Fevereiro de mil oitocentos e cincoenta e oito annos, nesta freguezia, baptizou o
  R.do Chavão à Mariana, branca, nascida a vinte e trez de Dezembro de cincoenta e
  sete, filha legitima de Joaquim José de Oliveira e Carolina Maria do Amor Devino,
  naturaes desta, padrinhos Fortunato José Antunes e Maria José Antunes, do que fiz
  este assento. O Vig.o J.m Mariano de Castro Araujo."


  [Right page, entry 3; margin "Francisco."] "Aos treze dias do mez de Março de mil
  oitocentos e cincoenta e oito, nesta freguezia de licença, baptizou o R.do Chavão à
  Francisco, branco, nascido a oito mezes, filho legitimo de Manoel Ferreira da Motta e
  Maria Roza de Jesus naturaes desta, Padrinhos Joaquim José Ferreira e Maria Antonia
  da Encarnação; do que fiz este assento. O Vig.o J.m Mariano de Castro Araujo."


  [Right page, entry 4; margin "Francisco."] "Aos vinte e oito dias do mez de Março de
  mil oitocentos e cincoenta e oito, nesta freguezia de licença, baptizou o R.do
  Manoel Joaquim Hen-riques à Francisco, branco, nascido a quatro mezes, filho
  legitimo de José Antonio Espindola e Angelica Maria de Jesus, padrinhos Dou-tor
  Jacintho Pereira Machado, do que fiz este assento, que assignei. O Vig.o J.m Mariano
  de Castro Araujo."


  [Right page, entry 5; margin "Francisco"] "Aos trez dias do mez de Abril de mil
  oitocentos e cincoenta e oito nes-ta freguezia, baptizou solemnemente o R.do
  Coadjuctor à Francisco, nascido a cinco mezes, filho natural de Maria Joaquina de
  Azevedo, natu-ral desta, Padrinho [overwritten forename, illegible] Vieira Rangel e
  Maria Severina de Figueredo; do que fiz este assento que assignei. O Vig.o J.m
  Mariano de Castro Araujo."


  [Right page, entry 6; margin "Wenceslão."] "Aos trez dias do mez de Abril de mil
  oitocentos e cincoenta e oito annos, nesta Matriz, baptizou o R.do Coadjuctor à
  Wenceslão, nascido a um anno, filho natural de Luiza Maria de Azevedo, natural
  desta; Protectora Nossa Senhora e padrinho Floriano Joaquim de Alvaren-ga; do que
  fiz este assento, que assignei. O Vig.o J.m Mariano de Castro Ar[aujo]."


  [Right page, entry 7; margin "João"] "Aos quatro dias do mez de Abril de mil
  oitocentos e cincoenta e oito annos nesta Matriz, baptizou o R.do Coadjuctor à João,
  pardo, nascido a quatro de Março do corrente anno, filho legitimo de Manoel Antonio
  de Almeida e Felesmina Maria, naturaes desta; padrinhos José Antonio de Abreu e Anna
  Maria da Gloria. do que fiz este. O Vig.o J.m Mar.o de Castro Araujo."
abstract: >-
  A baptism entry of 24 March 1858 at the Itaboraí matriz: Pedro, natural son of
  Candida Angelica do Nascimento, baptised by the coadjutor, with "João de Lemos
  Pereira e Roza Eugenia de Lemos" as godparents. Rosa Eugenia de Lemos (P-0035)
  appears in a functional role only — as godmother — in her natal parish, under her
  own name with no married surname, at about 23. The godfather's name is the full form
  of a João baptised in 1841 as a son of Manoel de Lemos Pereira (PAR-0102), so he is
  probably her younger brother, then about 18 [INFERRED — no relationship is stated].
  The vigário is Mariano de Castro Araujo, and the coadjutor named elsewhere on the
  page is Rufino José Alves — the coadjutor before whom her marriage to Francisco José
  Bohrer was celebrated (PAR-0002). FAN context for her pre-marriage life, never
  evidence for a genealogical conclusion.
abstract_pt: >-
  Um assento de batismo de 24 de março de 1858 na matriz de Itaboraí: Pedro, filho
  natural de Candida Angelica do Nascimento, batizado pelo coadjutor, tendo "João de
  Lemos Pereira e Roza Eugenia de Lemos" como padrinhos. Rosa Eugenia de Lemos (P-0035)
  aparece apenas num papel funcional — como madrinha — na sua freguesia natal, com o
  próprio nome e sem sobrenome de casada, aos cerca de 23 anos. O nome do padrinho é a
  forma completa de um João batizado em 1841 como filho de Manoel de Lemos Pereira
  (PAR-0102), de modo que é provavelmente seu irmão mais novo, então com cerca de 18
  anos [INFERRED — nenhum parentesco é declarado]. O vigário é Mariano de Castro
  Araujo, e o coadjutor nomeado noutro assento da página é Rufino José Alves — o
  coadjutor perante quem se celebrou seu casamento com Francisco José Bohrer
  (PAR-0002). Contexto FAN da sua vida antes do casamento, nunca evidência para uma
  conclusão genealógica.
