notes:
- text: >-
    Identification of the godmother with Rosa Eugenia de Lemos (P-0035) [STRONG]:
    the full name "Roza Eugenia de Lemos" is exact, in her natal parish, beside a
    "João de Lemos Pereira", the full family form of her father Manoel de Lemos
    Pereira (P-0052). No relationship is stated. Kept as FAN context
    (record_category "other", because the FAN schema has no parish-register
    category); it supports no conclusion.
  text_pt: >-
    Identificação da madrinha com Rosa Eugenia de Lemos (P-0035) [STRONG]: o nome
    completo "Roza Eugenia de Lemos" é exato, na sua freguesia natal, ao lado de um
    "João de Lemos Pereira", a forma completa de família de seu pai Manoel de Lemos
    Pereira (P-0052). Nenhum parentesco é declarado. Mantido como contexto FAN
    (record_category "other", porque o esquema FAN não tem categoria de registro
    paroquial); não sustenta conclusão alguma.
- text: >-
    Bearing on her marriage date. Her marriage to Francisco José Bohrer was celebrated
    at Itaboraí before the coadjutor Rufino José Alves and registered only on 1 August
    1879, after a judicial justification whose witnesses put it "a mais de vinte
    annos" earlier (PAR-0002; the clause is read with some uncertainty). In March 1858
    she is entered under her own name alone. That is compatible with her being still
    unmarried, but does not prove it: a married woman could still be entered under
    her maiden name, and a union celebrated privately and not yet registered may not
    have changed how the vigário styled her. See FAN-0016 for her styling in September
    1859.
  text_pt: >-
    Relevância para a data do casamento. Seu casamento com Francisco José Bohrer foi
    celebrado em Itaboraí perante o coadjutor Rufino José Alves e só registrado em 1º
    de agosto de 1879, após uma justificação judicial cujas testemunhas o situaram "a
    mais de vinte annos" antes (PAR-0002; a cláusula é lida com alguma incerteza). Em
    março de 1858 ela é lançada só com o próprio nome. Isso é compatível com ainda
    estar solteira, mas não o prova: uma mulher casada ainda podia ser lançada com o
    nome de solteira, e uma união celebrada em casa e ainda não registrada podia não
    ter mudado a forma como o vigário a tratava. Ver FAN-0016 para o tratamento dela em
    setembro de 1859.
- text: >-
    Reading checked against the retrieval side's claim (2026-10-10): confirmed —
    "Padrinhos João de Lemos Pereira e Roza Eugenia de Lemos", 24 March 1858, for
    Pedro, natural son of Candida Angelica do Nascimento. One of three godmother
    entries of 1858-1859 (FAN-0014, FAN-0015, FAN-0016).
  text_pt: >-
    Leitura conferida com a afirmação da pesquisa de recuperação (2026-10-10):
    confirmado — "Padrinhos João de Lemos Pereira e Roza Eugenia de Lemos", 24 de março
    de 1858, para Pedro, filho natural de Candida Angelica do Nascimento. Um de três
    assentos de madrinha de 1858-1859 (FAN-0014, FAN-0015, FAN-0016).
