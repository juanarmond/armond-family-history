transcription: |-
  [Full transcription read from the evidence scan (a single retained page of the FamilySearch Full-Text image).]

  Doutor Joaquim Theodoro Cisneiros de
  Albuquerque, juiz de Direito da co-
  marca, onde eu escrivão fui, ahi pre-
  sente o Capitão Simplicio José Ferreira
  Armond, Supplente de arbitrador no-
  meado e [uncertain: approvador] para proceder
  na falta do effectivo á medição,
  divisão e demarcação da fazenda
  dos "[uncertain: Fartes]" em Dores da Victoria, pe-
  lo dito juiz foi deferido-lhe o jura-
  mento na forma da lei, de bem e
  fielmente desempenhar o cargo pa-
  ra o qual fora nomeado, sob pena
  de incorrer no crime de perjurio, e
  acceito por elle o juramento assim
  prommetteu cumprir. Do que pa-
  ra constar lavro este termo. Eu
  Ladislau Pedro de Paula Andrade
  escrevente juramentado o es-
  crevi. Eu Romualdo Moreira de Albu-
  querque Escrivão o subscrevi
  [assinatura:] Simplicio [uncertain: Ferr.ª] Armond
  [margem, à esquerda:] Falta [uncertain]—

                          Certidão

  [margem:] 3$000
  Certifico que intimei o [uncertain: Major] Julio do Bra-
  sil para prestar juramento, e [uncertain: dou fé].
  [uncertain: p.ª] Muriahé 14 de Abril de 1907. Eu
  Ladislau Pedro de Paula Andrade escre-
  vente o escrevi. O escrivão —
  Romualdo Moreira de Albuquerque
