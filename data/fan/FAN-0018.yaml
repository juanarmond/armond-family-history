participants:
- person_id: P-0038
  role: confrontante (land neighbour)
  note: >-
    Named as one of the three holders bounding the "Bôa Vista" property, in the district of
    Bom Jesus, of a third party's estate. A functional role. Identity with P-0038 is strong,
    not proven (see notes).
