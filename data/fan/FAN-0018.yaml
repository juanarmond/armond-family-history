  [Readings and expansions: alqueire = a land measure; braça = a linear measure; matta estragada = degraded forest; capoeira = secondary scrub; tulha = coffee or grain store; paiol = maize store; seva = ceva, a fattening pen; coberta de engenho = the shed over the cane mill; côchos = troughs; garapa = cane juice; Es. = Escrivão; Concl.ão = Conclusão; Cert.ão = Certidão; dr. = doutor. The value word is written as one word and reads as "quatrocentos" (400$000); the vowel after the c is formed like the clerk's e, but a run-together "quatro contos" (4:000$000), which would fit "de réis" better, cannot be excluded. The escrivão's surname is the same word as the rubric on fl. 7.]
abstract: >-
  Two consecutive pages (fl. 7 and its verso) of the inventário that the COARPE catalogue
  gives as that of Antonio Nunes dos Santos, Comarca de Muriaé, 1908. They hold the end of
  the description of the estate's lands. The first property, whose name and heading are on
  the preceding page (not held), had among its neighbours (the list begins on that page)
  Eloy Nogueira Dias, João Alves Bittancourt Vasconcellos, Antonio Fernandes da Silva and
  João Nunes dos Santos. It comprised two
  alqueires of degraded forest, two of capoeira, three and a half under crops, three under
  cane and four and a half of pasture, a wire fence, a dwelling house, a tulha with paiol and
  ceva, a mill house, a cane-mill shed with troughs for garapa, an animal-driven iron cane
  mill and four thousand coffee trees. The second property, the situação "Bôa Vista", "also
  in the district of Bom Jesus", was bounded by André Teixeira Crespo, Secundino de Azevedo
  and the widow of Manoel [Alves?]. It comprised two alqueires of cleared land, five hundred
  old coffee trees, a fence and an old house. The inventariante, a woman acting through her
  procurador Dr. Antonio da Silveira Brum, declared the estate worth about quatrocentos (or
  quatro contos) de réis, with no debts owed to it or by it. The escrivão was Agrippino Gomes
  [Ueado?]. A conclusão dated "2 de março de 190…" breaks off, and a certidão of notification
  to the procurador and the promotor begins. Secundino de Azevedo appears only as a
  confrontante — the holder of land adjoining "Bôa Vista" — so the record is FAN context,
  never evidence. It places a man of his name as a landholder or occupier in the district of
  Bom Jesus, next to André Teixeira Crespo, whom the 1890 will of Thereza's father names as
  the husband of her sister Maria.
abstract_pt: >-
  Duas páginas consecutivas (fl. 7 e verso) do inventário que o catálogo da COARPE dá como
  de Antonio Nunes dos Santos, Comarca de Muriaé, 1908. Contêm o fim da descrição das terras
  do espólio. A primeira propriedade, cujo nome e cabeçalho estão na página anterior (não
  guardada), tinha entre seus confrontantes (a lista começa naquela página) Eloy Nogueira
  Dias, João Alves Bittancourt Vasconcellos, Antonio Fernandes da Silva e João Nunes dos
  Santos. Compunha-se de dois alqueires de mata
  estragada, dois de capoeira, três e meio em lavouras, três em cultura de cana e quatro e
  meio em pasto, cerca de arame, casa de morada, tulha com paiol e ceva, casa de moinho,
  coberta de engenho com cochos para garapa, engenho de ferro para cana movido a animal e
  quatro mil pés de café. A segunda, a situação "Bôa Vista", "também no distrito de Bom
  Jesus", confrontava com André Teixeira Crespo, Secundino de Azevedo e a viúva de Manoel
  [Alves?]. Compunha-se de dois alqueires de terras devastadas, quinhentos pés de café
  velhos, cerca e uma casa velha. A inventariante, uma mulher, por seu procurador Dr.
  Antonio da Silveira Brum, declarou que a herança valia cerca de quatrocentos (ou quatro
  contos) de réis, sem dívidas ativas nem passivas. O escrivão foi Agrippino Gomes [Ueado?].
  Uma conclusão datada de "2 de março de 190…" interrompe-se, e começa uma certidão de
  notificação ao procurador e ao promotor. Secundino de Azevedo aparece apenas como
  confrontante — o detentor da terra vizinha da "Bôa Vista" —, de modo que o registro é
  contexto FAN, nunca evidência. Situa um homem com o seu nome como detentor ou ocupante de
  terra no distrito de Bom Jesus, ao lado de André Teixeira Crespo, que o testamento de 1890
  do pai de Thereza nomeia como marido da irmã dela, Maria.
