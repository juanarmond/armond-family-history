notes:
- text: >-
    Identity with P-0038 is strong, not proven. For it: (1) The name form. "Secundino de
    Azevedo" is exactly how Thereza's husband is written in her father Manoel João Fernandes
    da Cruz's 1890 will and 1898 inventário (PRB-0013, PRB-0014, in this batch). Those
    records also place the heirs, Thereza among them, in the district of Bom Jesus da
    Cachoeira Alegre. (2) The place. P-0038's daughter Luiza was born at Bom Jesus da
    Cachoeira Alegre c. 1898 (CIV-0001). (3) The adjoining holder. André Teixeira Crespo is
    named in the same 1890 will and 1898 inventário as the husband of Manoel João's daughter
    Maria, Thereza's sister, so the two sons-in-law would hold adjoining land. (4) The date.
    1908 falls between 1898, when he was living, and 21 October 1916, when he was dead
    ("já fallecido", CIV-0006). Against: the clause gives the neighbour no qualifier — no age,
    wife, residence or "José" — so a namesake cannot be excluded. The 1908 year rests on the
    catalogue, not on the pages. These pages do not name the deceased. Readings (1) and (3)
    rest on the drafting of PRB-0013 and PRB-0014 in this batch; I have not re-read those
    images myself.
  text_pt: >-
    A identidade com P-0038 é forte, não provada. A favor: (1) A forma do nome. "Secundino de
    Azevedo" é exatamente como o marido de Thereza é escrito no testamento de 1890 e no
    inventário de 1898 de seu pai, Manoel João Fernandes da Cruz (PRB-0013, PRB-0014, neste
    lote). Esses registros também situam os herdeiros, Thereza entre eles, no distrito de Bom
    Jesus da Cachoeira Alegre. (2) O lugar. Luiza, filha de P-0038, nasceu em Bom Jesus da
    Cachoeira Alegre c. 1898 (CIV-0001). (3) O confrontante vizinho. André Teixeira Crespo é
    nomeado no mesmo testamento de 1890 e inventário de 1898 como marido de Maria, filha de
    Manoel João e irmã de Thereza, de modo que os dois genros teriam terras contíguas. (4) A
    data. 1908 cai entre 1898, quando ele vivia, e 21 de outubro de 1916, quando já era
    falecido ("já fallecido", CIV-0006). Contra: a cláusula não dá ao confrontante nenhuma qualificação —
    idade, mulher, residência ou "José" —, de modo que não se pode excluir um homônimo. O ano
    de 1908 apoia-se no catálogo, não nas páginas. Estas páginas não nomeiam o falecido. As
    leituras (1) e (3) apoiam-se na redação de PRB-0013 e PRB-0014 neste lote; não reli eu
    mesmo essas imagens.
- text: >-
    What the record adds, and its limits. "Dividindo com … Secundino de Azevedo" says that
    the "Bôa Vista" land bordered land associated with a man of that name in 1908. It does
    not say whether he owned it, rented it or worked it, nor how large it was. It does not
    by itself prove that he was alive in 1908, because confrontations sometimes kept a dead
    holder's name. That the clerk wrote "a viuva de Manoel [Alves?]" for another neighbour
    suggests he distinguished living holders from widows, which weakly favours Secundino
    being alive; that is an inference. The record contradicts the earlier working picture of
    P-0038 as wholly landless. As a FAN record it sets no structured residence, occupation
    or property on P-0038.
  text_pt: >-
    O que o registro acrescenta, e seus limites. "Dividindo com … Secundino de Azevedo" diz
    que a terra da "Bôa Vista" confrontava, em 1908, com terra associada a um homem com esse
    nome. Não diz se ele a possuía, arrendava ou cultivava, nem qual era o seu tamanho. Não
    prova por si só que ele estivesse vivo em 1908, porque as confrontações às vezes
    conservavam o nome de um detentor falecido. Que o escrivão tenha escrito "a viuva de
    Manoel [Alves?]" para outro confrontante sugere que ele distinguia os detentores vivos
    das viúvas, o que favorece levemente que Secundino estivesse vivo; isso é uma
    inferência. O registro contradiz o retrato de trabalho anterior de P-0038 como
    inteiramente sem terra. Como registro FAN, não define residência, ocupação nem
    propriedade estruturadas em P-0038.
- text: >-
    Readings that differ from the retrieval side's verbatim draft (profile
    jose-secundino-de-azevedo.md §8, 2026-10-12). The draft is confirmed word for word on
    the descriptive text and on "dividindo com André Teixeira Crespo, Secundino de Azevedo e
    a viuva de Manoel …". Differences: (1) the neighbour's widow is "Manoel [Alves?]" — the
    capital of the surname is not the clerk's A, as in "André", "Antonio" and "Azevedo", so
    "Alves" stays uncertain; (2) the value word reads more like "quatrocentos" than the
    draft's first suggestion "quatrocontos", though "quatro contos" cannot be excluded; (3)
    the escrivão's surname, which the draft gives as "Prado [?]", is written with the same
    initial as the folio rubric, which reads like "Ueado"; "Prado" is not supported, and
    the name stays uncertain; (4) the marginal "9K" is uncertain, as in the draft.
  text_pt: >-
    Leituras que diferem do rascunho literal da pesquisa de recuperação (perfil
    jose-secundino-de-azevedo.md §8, 2026-10-12). O rascunho confirma-se palavra por palavra
    no texto descritivo e em "dividindo com André Teixeira Crespo, Secundino de Azevedo e a
    viuva de Manoel …". Diferenças: (1) a viúva confrontante é de "Manoel [Alves?]" — a
    maiúscula do sobrenome não é o A do escrivão, como em "André", "Antonio" e "Azevedo", de
    modo que "Alves" fica incerto; (2) a palavra do valor lê-se mais como "quatrocentos" do
    que como a primeira sugestão do rascunho, "quatrocontos", embora não se possa excluir
    "quatro contos"; (3) o sobrenome do escrivão, que o rascunho dá como "Prado [?]", está
    escrito com a mesma inicial da rubrica da folha, que se lê como "Ueado"; "Prado" não se
    sustenta, e o nome fica incerto; (4) o "9K" marginal é incerto, como no rascunho.
- text: >-
    Coverage and the other names. Only fl. 7 and its verso are held. The opening of the
    process (the deceased's and the inventariante's names, the date), the first property's
    name, and anything after the certidão are on images not held. Among the first property's
    neighbours is João Alves Bittancourt Vasconcellos. Other Alves Bittencourts appear in the
    Fernandes neighbourhood at Cachoeira Alegre in the 1880s, according to the drafting of
    PRB-0015 in this batch. No
    kinship with the Muniz Bittencourt line (P-0012) is asserted or examined here.
  text_pt: >-
    Cobertura e os outros nomes. Só a fl. 7 e o seu verso estão guardados. A abertura do
    processo (os nomes do falecido e da inventariante, a data), o nome da primeira
    propriedade e o que vem depois da certidão estão em imagens não guardadas. Entre os
    confrontantes da primeira propriedade está João Alves Bittancourt Vasconcellos. Outros
    Alves Bittencourt aparecem na vizinhança dos Fernandes em Cachoeira Alegre na década de
    1880, segundo a redação de PRB-0015 neste lote. Nenhum parentesco com a linha Muniz Bittencourt
    (P-0012) é afirmado nem examinado aqui.
