transcription: |-
  [Full transcription read from the evidence scan (a single retained page — the
  closing folio of the procuração — of the FamilySearch Full-Text image).
  Original spellings preserved.]
  "raiz, receber e dar quitação, as-
  signar requerimentos, termos,
  autos e papeis precisos, offere-
  cer justificação, inquirir teste-
  munhas, appellar, aggravar,
  fazer cobranças amigavel ou
  judicial, propôr acções, com po-
  deres illimitados para conciliações
  e concede todos os mais direitos
  que por lei lhe fôr permittidos e
  bem assim o de substabelecer
  esta em quem lhe convier, fi-
  cando-lhe os mesmos poderes,
  em seu vigor, que tudo haverá
  por firme e valioso. Assim o
  disse do que dou fé, me pedio
  que lhe lavrasse este instrumen-
  to que lhe fiz, li, achou conforme,
  aceitou, outorgou e assigna-se
  em presença das testemunhas
  Luiz Antonio Pereira, Antonio
  Francisco do Carmo, assignan-
  do a rogo da outorgante por não
  saber escrever Simplicio José Fer-
  reira Armond, comigo Francis-
  co de Assis Carvalho, escrivão
  de Paz, policia, servindo de Tabel-
  lião, que esta fiz e assigno em
  publico e razo. Em testemu-
  nho de verdade. (Estava o signal
  publico) Francisco de Assis Car-
  valho, Simplicio José Ferreira
  Armond, Luiz Antonio Pereira"
abstract: >-
  A power of attorney (procuração) from Muriaé, dated by FamilySearch to 1875,
  in which Simplício José Ferreira Armond signed on behalf of the grantor, who
  could not write. He appears only as a signatory/associate, not as a party to a
  record about the family. Retained as FAN context for his presence and standing
  in the Muriaé comarca by 1875.
abstract_pt: >-
  Uma procuração de Muriaé, datada pelo FamilySearch de 1875, na qual Simplício
  José Ferreira Armond assinou em nome da outorgante, que não sabia escrever. Ele
  aparece apenas como signatário/associado, não como parte de um registro sobre a
  família. Mantido como contexto FAN por sua presença e posição na comarca de
  Muriaé até 1875.
