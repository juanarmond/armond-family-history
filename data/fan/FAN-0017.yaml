abstract: >-
  A later copy (made at or after 20 March 1919) of the auto de aprovação — the notarial
  approval — of the sealed will (testamento cerrado) of Antonio Moreira de Carvalho,
  resident in the district of Patrocínio, drawn by the tabelião José Pacheco de Medeiros in
  his cartório at S. Paulo do Muriahé on 15 April 1905, followed by the opening of that will
  in 1919. The will had been written at the testator's request by Dr. João Chrysostomo
  Leopoldino de Magalhães and signed only by the testator; the tabelião found it free of
  blots, erasures or interlineations, put the questions of the law, approved it, and had it
  closed with five stitches of two-coloured thread and five drops of red sealing wax stamped
  with his initials J. P. M. The five instrumentary witnesses, "todos residentes nesta
  cidade", were Dr. João Chrysostomo Leopoldino de Magalhães, advogado, "natural desta
  cidade" (corrected by a closing ressalva: born in the town of Santa Bárbara do Mato Dentro);
  Mariano Pereira de Cerqueira Moutinho (or Montinho), solicitador, of the município of Além
  Paraíba; Simplício José Ferreira Armond (P-0016), "natural de Barbacena, commerciante";
  Capitão Sebastião José de Cerqueira, "natural de Portugal, commerciante"; and Edmundo de
  Araujo Libero, typographo, of the town of Pomba. The termo de abertura of 20 March 1919 —
  at the deceased's house on the rua Beira-Rio, seat of the Patrocínio district, before the
  escrivão interino and Coronel [uncertain: Telemaco] Pompei, first juiz de paz, with the
  witnesses Antonio Chrispim da Silva and Sergio Ferreira Reis — records José Moreira de
  Carvalho (the name of the son the will itself names, "meu filho") presenting the sealed
  envelope; the held images end
  mid-termo. Simplício's role is purely functional (instrumentary witness), so the record is
  FAN context, never evidence. It is the first record held here that states a birthplace and
  an occupation for a man of his name.
abstract_pt: >-
  Cópia posterior (feita em 20 de março de 1919 ou depois) do auto de aprovação — a
  aprovação notarial — do testamento cerrado de Antonio Moreira de Carvalho, residente no
  distrito de Patrocínio, lavrado pelo tabelião José Pacheco de Medeiros em seu cartório em
  S. Paulo do Muriahé a 15 de abril de 1905, seguida da abertura desse testamento em 1919. O
  testamento fora escrito a pedido do testador pelo Dr. João Chrysostomo Leopoldino de
  Magalhães e assinado apenas pelo testador; o tabelião não lhe achou borrão, riscado nem
  entrelinha, fez as perguntas da lei, aprovou-o e mandou fechá-lo com cinco pontos de linha
  grossa de duas cores e cinco pingos de lacre vermelho com o carimbo de suas iniciais
  J. P. M. As cinco testemunhas instrumentárias, "todos residentes nesta cidade", foram o
  Dr. João Chrysostomo Leopoldino de Magalhães, advogado, "natural desta cidade" (corrigido
  por uma ressalva final: nascido na cidade de Santa Bárbara do Mato Dentro); Mariano Pereira
  de Cerqueira Moutinho (ou Montinho), solicitador, do município de Além Paraíba; Simplício
  José Ferreira Armond (P-0016), "natural de Barbacena, commerciante"; o Capitão Sebastião
  José de Cerqueira, "natural de Portugal, commerciante"; e Edmundo de Araujo Libero,
  typographo, da cidade de Pomba. O termo de abertura de 20 de março de 1919 — na casa do
  falecido, à rua Beira-Rio, sede do distrito de Patrocínio, perante o escrivão interino e o
  Coronel [uncertain: Telemaco] Pompei, primeiro juiz de paz, com as testemunhas Antonio
  Chrispim da Silva e Sergio Ferreira Reis — registra José Moreira de Carvalho (o nome do
  filho que o próprio testamento nomeia, "meu filho") apresentando o envelope lacrado; as imagens guardadas terminam no meio do termo.
  O papel de Simplício é meramente funcional (testemunha instrumentária), de modo que o
  registro é contexto FAN, nunca evidência. É o primeiro registro guardado aqui que declara
  naturalidade e ocupação para um homem com o seu nome.
