notes:
- text: >-
    Located by the external retrieval agent in its 2026-10-09 cycle (FINDINGS
    armond-toledo.md §2; seed ARK 3:1:3QHV-ZQQP-PX2P), first as images 683–685 and then
    whole as images 683–687 of FamilySearch DGS 108401115, a Comarca de Muriaé film. The
    transcription is a full manual reading of all five images from the held scans
    (2026-10-10). Coverage is bounded: the images open on the last lines of the will itself
    (the end of a ranked list — "…ceiro, Manoel Carlos Mourão; em quarto, meu filho José
    Moreira de Carvalho" — probably its testamenteiros [INFERRED])
    and close mid-way through the 1919 termo de abertura, so the will's text, any heading of
    the copy, and the end of the termo sit on adjacent images not held here.
  text_pt: >-
    Localizado pelo agente externo de recuperação em seu ciclo de 2026-10-09 (FINDINGS
    armond-toledo.md §2; ARK semente 3:1:3QHV-ZQQP-PX2P), primeiro como imagens 683–685 e
    depois inteiro como imagens 683–687 do filme FamilySearch DGS 108401115, da Comarca de
    Muriaé. A transcrição é uma leitura manual completa das cinco imagens a partir dos scans
    guardados (2026-10-10). A cobertura é delimitada: as imagens abrem nas últimas linhas do
    próprio testamento (o fim de uma lista ordenada — "…ceiro, Manoel Carlos Mourão; em
    quarto, meu filho José Moreira de Carvalho" — provavelmente os testamenteiros [INFERRED]) e terminam no meio do termo de abertura de 1919, de modo que o texto do
    testamento, um eventual cabeçalho da cópia e o fim do termo estão em imagens vizinhas não
    guardadas aqui.
- text: >-
    Identity with P-0016 is strong, not proven. Same full name, same town and the same years:
    held FAN records place Capitão Simplício José Ferreira Armond at Muriaé as a louvado in
    July 1900 (FAN-0004) and as suplente de arbitrador c.1906–07 (FAN-0005), and the retrieval
    side reports him sworn as louvado there on 27 July 1905 [LEAD, not held]. Against it: his
    son Simplício Filho, born c.1887 according to a collaborative-tree lead only, would have
    been about 18. The record states no age, and the witness is not styled "Capitão",
    "Filho" or "Junior"; the absence of a "Filho" weakly favours the father but does not
    exclude the son [INFERRED]. The signatures on these pages are the copyist's, not
    autographs, so no handwriting comparison with his 1884 autograph (PRB-0002) is possible.
  text_pt: >-
    A identidade com P-0016 é forte, não provada. Mesmo nome completo, mesma cidade e os
    mesmos anos: registros FAN guardados situam o Capitão Simplício José Ferreira Armond em
    Muriaé como louvado em julho de 1900 (FAN-0004) e como suplente de arbitrador c.1906–07
    (FAN-0005), e a pesquisa de recuperação o dá como louvado juramentado ali em 27 de julho de
    1905 [LEAD, não guardado]. Contra: o filho Simplício Filho, nascido c.1887 segundo apenas
    uma pista de árvore colaborativa, teria cerca de 18 anos. O registro não declara idade, e a
    testemunha não é qualificada como "Capitão", "Filho" ou "Junior"; a ausência de um "Filho"
    favorece levemente o pai, mas não exclui o filho [INFERRED]. As assinaturas nestas páginas
    são do copista, não autógrafas, de modo que não é possível comparar a letra com o seu
    autógrafo de 1884 (PRB-0002).
- text: >-
    The stated naturalidade must be read with care. "Natural de Barbacena" may mean the
    município or termo rather than the town; in the 1840s the Termo de Barbacena still reached
    far into the Mata [CONTEXTUAL]. The tabelião's own closing ressalva shows how these
    naturalidades were checked: one of the five ("natural desta cidade" for Dr. João
    Chrysostomo) was wrong and was corrected only because the witness objected when the act
    was read aloud ("pois é nascido na cidade de Santa Barbara do Matto Dentro, deste
    Estado"). Simplício's "natural de Barbacena" was read aloud and stood unchallenged —
    consistent with his own statement, but not proof that he made it [INFERRED]. As a FAN
    record the act sets no structured birthplace or occupation on P-0016.
  text_pt: >-
    A naturalidade declarada deve ser lida com cuidado. "Natural de Barbacena" pode designar o
    município ou termo, e não a cidade; na década de 1840 o Termo de Barbacena ainda se
    estendia fundo pela Mata [CONTEXTUAL]. A própria ressalva final do tabelião mostra como
    essas naturalidades eram conferidas: uma das cinco ("natural desta cidade", para o Dr. João
    Chrysostomo) estava errada e só foi corrigida porque a testemunha reclamou na leitura do
    auto ("pois é nascido na cidade de Santa Barbara do Matto Dentro, deste Estado"). O
    "natural de Barbacena" de Simplício foi lido em voz alta e ficou sem reclamação —
    compatível com uma declaração dele, mas não prova de que a fez [INFERRED]. Como registro
    FAN, o auto não define naturalidade nem ocupação estruturadas em P-0016.
- text: >-
    Nature of the copy and category. The 1905 auto and the 1919 termo de abertura are written
    in one hand on consecutively numbered pages (copy pages 3–5; folios 25–27, each recto
    rubricated "Pacheco"), so the whole is a copy made at or after the opening of 20 March
    1919 — the retrieval side reports it filed in a 1919 case. The approval itself is a
    notarial act ("em meu cartorio"); the record is catalogued court_or_probate because the
    held artefact is that testamentary copy on a Comarca de Muriaé court film, together with
    the opening before the juiz de paz.
  text_pt: >-
    Natureza da cópia e categoria. O auto de 1905 e o termo de abertura de 1919 estão escritos
    por uma só mão em páginas numeradas em sequência (páginas 3–5 da cópia; folhas 25–27, cada
    frente rubricada "Pacheco"), de modo que o conjunto é uma cópia feita na abertura de 20 de
    março de 1919 ou depois — a pesquisa de recuperação a dá como juntada a um processo de
    1919. A aprovação em si é um ato notarial ("em meu cartorio"); o registro é catalogado como
    court_or_probate porque o artefato guardado é essa cópia testamentária num filme judicial
    da Comarca de Muriaé, junto com a abertura perante o juiz de paz.
- text: >-
    Checked against the retrieval-side reading (2026-10-10): the witness list, "todos
    residentes nesta cidade", the ressalva and the p5 close of the signatures are confirmed on
    the images. Refinements: the will was drafted by Dr. João Chrysostomo himself (p2, where
    the copy spells him "Crysostomo"); Mariano's clause reads "natural do munipio, digo,
    municipio de Alem Parahyba" (a slip corrected in-line, not an omission) and his surname
    may be Montinho rather than Moutinho; the fourth witness completes on p4 as "natural de
    Portugal, commerciante"; the fifth is "Edmundo de Araujo Libero, typographo, natural da
    cidade de Pomba"; the ressalva adds "deste Estado" and spells "resalva"; and the termo de
    abertura does not end on p5 but runs on to image 688.
  text_pt: >-
    Conferido com a leitura da pesquisa de recuperação (2026-10-10): a lista de testemunhas,
    "todos residentes nesta cidade", a ressalva e o fecho das assinaturas na p5 confirmam-se
    nas imagens. Refinamentos: o testamento foi redigido pelo próprio Dr. João Chrysostomo
    (p2, onde a cópia o grafa "Crysostomo"); a cláusula de Mariano lê-se "natural do munipio,
    digo, municipio de Alem Parahyba" (um lapso corrigido na linha, não uma omissão) e seu
    sobrenome pode ser Montinho em vez de Moutinho; a quarta testemunha completa-se na p4 como
    "natural de Portugal, commerciante"; a quinta é "Edmundo de Araujo Libero, typographo,
    natural da cidade de Pomba"; a ressalva acrescenta "deste Estado" e grafa "resalva"; e o
    termo de abertura não termina na p5, continuando na imagem 688.
