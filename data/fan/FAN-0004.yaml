abstract: >-
  A third party's probate inventory at Muriaé in which Captain Simplício José
  Ferreira Armond (P-0016) was intimated/summoned to serve as a court-appointed
  appraiser (louvado). His role is functional; the estate is not this family's.
  Retained as FAN context for his standing ("Capitão") in the Muriaé comarca.
abstract_pt: >-
  O inventário de um terceiro em Muriaé no qual o Capitão Simplício José Ferreira
  Armond (P-0016) foi intimado para servir como avaliador nomeado pelo juízo
  (louvado). Seu papel é funcional; o espólio não é desta família. Mantido como
  contexto FAN por sua posição ("Capitão") na comarca de Muriaé.
