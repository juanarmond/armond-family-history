  [canto superior direito:] 7   2   [uncertain: Fumos]   [uncertain: Mosqueiras]

  Cidadãos José Gomes Campos Sobri-
  nhos e José de Oliveira Barros represen-
  tados pelo procurador Simplicio José
  Ferreira Armond conforme as procu-
  rações juntas a estes autos como se
  vê a fs. 7 e 8.        Certifico que dos
  mesmos autos consta as avali-
  ações devidamente assignadas pelos
  louvados pela forma seguinte:
  43 alqueires de terra a 40$000            1.720$000
  7 ½    ,,        ,, ditas    40$000          300$000
  600  Pés de café              100            60$000
  1000  Ditos dito              100           100$000
  1 [uncertain: Caminha] p.ª [uncertain: Tinha]              60$000
  1 Moinho                                    100$000
  1 Engenho de canna                           60$000
  1 Tacho de cobre                             40$000
  1 [uncertain: Tarza] de dito                 20$000
  1 Relogio de ouro                            50$000
                                        Rs  2.510$000
  Dois contos quinhentos e dez mil reis
  Declararam os louvados que nada ma-
  is lhes foi apresentado pela inventari-
  ante.
          Certifico ainda que dos
  mesmos autos consta o pagamento do
  imposto territorial na importancia
  de dois mil setecentos e quaranta reis con-
  forme o conhecimento nº 24 de 30 de Ju-
  nho de 1906 e bem assim consta ter
  sido o pagamento do imposto de trans-
  missão causa mortis na importancia
