abstract: >-
  A probate distribution account (conta de partilha) in the estate of D. Rita
  Maria Ferreira, Leopoldina, in which Simplício José Ferreira Armond (P-0016)
  appears among the parties credited/paid. He figures only as a creditor/payee
  in a third party's estate — FAN context for his presence and standing in the
  Leopoldina comarca, not a record about this family.
abstract_pt: >-
  Uma conta de partilha no inventário de D. Rita Maria Ferreira, em Leopoldina,
  na qual Simplício José Ferreira Armond (P-0016) aparece entre as partes
  credoras/pagáveis. Ele figura apenas como credor/beneficiário no inventário de
  um terceiro — contexto FAN por sua presença e posição na comarca de Leopoldina,
  não um registro sobre esta família.
