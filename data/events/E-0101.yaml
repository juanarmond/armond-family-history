notes:
- text: >-
    Birthplace Barbacena, derived from her 1810 marriage act (PAR-0023): "naturais e batizados da
    Freguesia de Barbacena". Grammatical caveat — that clause sits after her parents' names and
    could modify the parents, but the repository reads it as attesting both spouses' Barbacena
    origin (see PAR-0023 / E-0052), corroborated by the family's residence at Barbacena in 1821
    (PAR-0017). The death source (PRB-0006 estate inventory) states no birthplace or age. The
    ~1795 baptism date is a secondary Themudo lead only (image not held), so the date is left
    unknown rather than asserted.
