notes:
- text: >-
    Birth of Jacob Klein (P-0103) on 16 November 1844, baptised 4 March 1845 in the Lutheran
    congregation of Nova Friburgo (PAR-0066, entry 22): son of the colonist Johannes (Joh.) Klein
    (P-0105) and his wife Anna Margaretha née [Neis — uncertain] (P-0106). Godparents Jacob
    Schneider and Elisabeth (daughter of Jacob Klein). His 1872 marriage (PAR-0068) records his age
    as 26.
