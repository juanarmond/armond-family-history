notes:
- text: >-
    Birth of Ritta Angélica Rodrigues (P-0058) on 3 March 1764, established by her own
    baptism (PAR-0049), which records "Nasceu no dia três de Março" and the baptism on
    9 March 1764 at the Capela de São José do Ribeirão (Borda do Campo, Barbacena). The
    baptism names her parents João Rodrigues Valle (P-0078) and Isabel Ribeira /
    Ribeiro de Lima (P-0079). The FamilySearch index gives the baptism day as 12 March;
    the primary reads 9. This is the pre-civil-registration birth record.
