notes:
- text: >-
    Marriage of Belchior da Ponte Cardoso (P-0123) × Mariana Fagundes (P-0124) on 26 September
    1650, at the church of Santa Bárbara, Terceira. Confirmed by primary parish image PAR-0086
    (image 0072 shows the marginal annotation "Belchior [da Ponte Cardoso] Com [Mariana] Fagundes"
    and body text confirming both names and the 1650 date). Bilateral cross-reference in the
    Mendes Forjaz compilation: Vol. IV (PUB-0004, p.312) "C. em Stª Bárbara a 26.9.1650 com
    Belchior da Ponte Cardoso" and Vol. IX (PUB-0005, p.260) "C. 2ª vez em Stª Bárbara a
    26.9.1650 com Mariana Fagundes." This was Belchior's second marriage. Evidence status is
    confirmed (primary image held).
- text: >-
    The September 1650 date corrects an earlier "December" misread reported in the retrieval
    agent STATUS. The primary parish image (PAR-0086) and both compilation volumes agree on
    26 September 1650.
