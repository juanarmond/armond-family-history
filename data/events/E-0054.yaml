notes:
- text: >-
    JC's death date confirmed as "2 September" by the sworn testimony of his widow
    Claudina Brandina de Jesus (P-0055) on PRB-0008 p5 (7 March 1867 oath): "seu
    marido fallecera no dia dois de Setembro." The year is cut off at the p6 page
    break (p6 not catalogued); 1866 is contextually inferred — the inventory opened
    4 March 1867 (both probate processes opened concurrently). PRB-0006 (1879 Matilde
    inventário, heir #4 "José Cezario de Tolledo Lima, fallecido") and PRB-0008 (1867
    JC inventário cover, listing him as deceased) establish he died before 4 March 1867.
    Claudina was alive on 7 March 1867 — she was physically present taking the
    inventariante oath (PRB-0008 p5). The PRB-0009-p2 text "a mae destes Dona Claudina
    Brandina de Jesus é viúva, cuja [morte do] marido falleceu depois do Inventariado"
    means JC died after Ladisláo — NOT that Claudina was deceased.
