notes:
- text: >-
    Baptism of Susanna (Suzana) Rita Brandão (P-0020) on 22 March 1866, born 20
    August 1865, a legitimate daughter of José do Rego Brandão (P-0040) and Rita
    Ignacia de Jesus (P-0041), per the parish register transcript (PAR-0005). Her
    maternal grandfather Antonio Caetano Machado (P-0045) stood as godfather (the
    baptism reads the name ambiguously; resolved to Caetano via his 1868 óbito).
    [Dates corrected 11 August 2026 on image re-read: born "vinte de Agosto … sessenta
    e cinco" = 20 Aug 1865, baptized "sessenta e seis" = 22 Mar 1866. This supersedes a
    7 August 2026 edit that read the decade as "setenta" (1875/1876) — chronologically
    impossible: she married by provisão in Dec 1882 (PAR-0001) and bore daughter Anna in
    Nov 1884 (PAR-0006).]
