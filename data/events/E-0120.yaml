notes:
- text: >-
    Birthplace: the Villa de ITU, Bispado de São Paulo, stated in her granddaughter's 1777
    Piracatu baptism (PAR-0025): "Maria Francisca Cordeira, natural da Villa de Ytù [Itu],
    Bispado de S. Paulo". Corrected read (2026-09-10, re-examination of the image): the earlier
    "Ouru/Ouro" reading is superseded and was internally impossible — Ouro Preto is in the
    Bispado de Mariana, not the "Bispado de S. Paulo" the entry names, whereas Itu is a São
    Paulo vila. Independently corroborated by the owner: the couple's marriage act (Paracatu,
    not yet catalogued) also gives her origin as Itu and points to her baptism at N.S. da
    Candelária de Itu, 1737 — the next record to retrieve (it would name her parents).
