- text: >-
    Marriage of Pedro Lourenço Machado (P-0129) × Maria Fernandes da Costa (P-0130) on
    14 June 1598, Santa Bárbara, Terceira. Source: Mendes Forjaz Vol. IV (PUB-0004, p.312):
    "C. em Stª Bárbara a 14.6.1598 com Maria Fernandes da Costa (ou de Toledo), filha de
    Belchior Fernandes da Costa e de Beatriz Pires." Compiled — no primary marriage image held.
- text: >-
    BOUNDED NEGATIVE 2026-09-23: Santa Bárbara casamentos register C-1560-1606, pages 0097–0099
    (April 1597 → June 1598 window, bracketing the target date 14 June 1598 exactly), browsed
    via Culturacores CDN. Physical damage makes names illegible at CDN resolution; the marriage
    record exists in this window but cannot be confirmed. Images held in retrieval drop:
    rec-armond-santa-barbara-casamentos-1560-1606-0097.jpg, 0098.jpg, 0099.jpg. Route to
    confirm: request C-1560-1606 microfilm pp.0097–0101 from BPAR Angra (higher resolution).
- text: >-
    Tier downgraded strong-evidence → hypothesis on 2026-10-09: the only source is PUB-0004, a
    published genealogy, which by policy cannot confirm and, as a lone secondary source, is
    below the strong-evidence bar of several consistent records (research/README.md, Confidence
    statuses) — the reasoning that downgraded E-0060 and E-0132. make check now rejects a
    strong-evidence conclusion resting only on published or authored narratives. The date stays
    as recorded; a legible reading of the 1598 Santa Bárbara marriage act (the images noted
    above) would restore it.
  text_pt: >-
    Nível rebaixado de evidência forte para hipótese em 2026-10-09: a única fonte é PUB-0004,
    uma genealogia publicada, que pela política do arquivo não pode confirmar e, sozinha, fica
    abaixo do patamar de evidência forte (vários registros concordantes; research/README.md) — o
    mesmo raciocínio que rebaixou E-0060 e E-0132. O make check agora rejeita uma conclusão de
    evidência forte apoiada só em narrativas publicadas. A data fica como registrada; uma
    leitura legível do assento de casamento de 1598 em Santa Bárbara (as imagens indicadas
    acima) a restabeleceria.
