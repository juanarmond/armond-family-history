notes:
- text: >-
    Approximate birth of Manoel Muniz Bytancourt (P-0042) about 1820, inferred from
    his age (46) at death in 1866 (PAR-0015). His own naturalidade is not stated in
    that record, but his parents were "naturaes desta freguesia" of Povoação and he
    lived and died there, so a Povoação (São Miguel) birth is the strong inference;
    it is not directly recorded, hence strong-evidence rather than confirmed.
