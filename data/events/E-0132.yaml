- text: >-
    Tier downgraded strong-evidence → hypothesis on 2026-10-09 (code review of the
    share message, which had quoted this 1571 date as the Armond line's earliest
    original record): the only source is PUB-0004, a published genealogy, which by
    policy cannot confirm and, as a lone secondary source, is below the strong-evidence
    bar of several consistent records (research/README.md, Confidence statuses) — the
    same reasoning that downgraded E-0060 on 2026-08-13. The date stays as recorded; a
    Santa Bárbara baptism image for 1571 would restore it.
