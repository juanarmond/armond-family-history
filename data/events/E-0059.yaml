notes:
- text: >-
    Date confirmed from the inventário opening juramento (PRB-0006, folio 6, already
    catalogued): the inventariante Cezário José de Toledo swore before the Juiz on
    28 April 1879 that Mathilde "faleceu em o dia doze de Março proximo passado" and
    "sem testamento." The inventário was therefore opened six weeks after her death.
    Full-text transcript of the juramento is in the retrieval agent's transcript file
    matilde-1879-part01-pp001-092.md (2026-08-08 triage). Consistent with PRB-0001
    (1881 partilha) and PRB-0002 (1884) both referring to her as already deceased.
    Corrects the earlier estimate of "circa 1877 or after" in record-coverage.
