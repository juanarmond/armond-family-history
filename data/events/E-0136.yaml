    Death of Mariana Fagundes (P-0124) on 7 July 1684, S. Sebastião, Terceira.
    Source: Mendes Forjaz Vol. IV (PUB-0004, p.312): "Mariana Fagundes, f. em S. Sebastião
    a 7.7.1684." Compiled — no primary death image held. She predeceased her husband Belchior
    da Ponte Cardoso (P-0123) by about three years (d.26.6.1687). Their son Gaspar was by
    then about 27 years old (b.23.2.1657).
