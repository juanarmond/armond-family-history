notes:
- text: >-
    Birth established by his own baptism (PAR-0004, 25 June 1892 at Santo Antônio de
    Sapucaia), which records him "nascido a [um] deste mez" — i.e. early June 1892 (the
    day is an uncertain read; the month and year are clear) — the pre-civil-registration
    birth record. Birthplace Santo Antônio de Sapucaia (RJ), corroborated by his 1916
    marriage (CIV-0001, "nascido em Sapucaia", stated age 24). Supersedes the earlier
    inference from marriage age alone.
