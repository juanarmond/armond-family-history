notes:
- text: >-
    Baptism of Thereza de Jesus at the parish church of Pousa on 6 May 1864, by the priest José
    Lopes (PAR-0108): "filha legitima de Manoel João Fernandes … alfaiate, natural da freguezia
    de São Romão da Ucha … e de Anna Exposta, costureira, cuja naturalidade é ignorada", of the
    lugar do Souto. The record itself is clear. It is confirmed for P-0039 (upgraded from strong
    evidence on 2026-10-12): her father's 1890 will and 1898 inventário name "Thereza, casada
    com Secundino de Azevedo" among his children (PRB-0013, PRB-0014), and her daughter Luiza's
    1916 marriage places that couple at Bom Jesus (PAR-0012) — a coherent body of primary evidence
    (see F-0070).
  text_pt: >-
    Batismo de Thereza de Jesus na igreja paroquial de Pousa, em 6 de maio de 1864, pelo padre
    José Lopes (PAR-0108): "filha legitima de Manoel João Fernandes … alfaiate, natural da freguezia
    de São Romão da Ucha … e de Anna Exposta, costureira, cuja naturalidade é ignorada", do lugar
    do Souto. O registro em si é claro. Está confirmado para P-0039 (elevado de evidência forte
    em 2026-10-12): o testamento de 1890 e o inventário de 1898 do pai nomeiam "Thereza, casada
    com Secundino de Azevedo" entre os filhos (PRB-0013, PRB-0014), e o casamento de 1916 da filha
    Luiza situa esse casal em Bom Jesus (PAR-0012) — um conjunto coerente de evidência primária
    (ver F-0070).
