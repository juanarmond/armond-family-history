notes:
- text: >-
    Baptism of Thereza de Jesus at the parish church of Pousa on 6 May 1864, by the priest José
    Lopes (PAR-0108): "filha legitima de Manoel João Fernandes … alfaiate, natural da freguezia
    de São Romão da Ucha … e de Anna Exposta, costureira, cuja naturalidade é ignorada", of the
    lugar do Souto. The record itself is clear. It is strong evidence, not confirmed, for P-0039
    because the link from this child to Thereza Fernandes de Azevedo rests on her father's 1890
    will and 1898 inventário naming "Thereza, casada com Secundino de Azevedo" among his children
    (PRB-0013, PRB-0014), not on a record that names both forms of her together.
  text_pt: >-
    Batismo de Thereza de Jesus na igreja paroquial de Pousa, em 6 de maio de 1864, pelo padre
    José Lopes (PAR-0108): "filha legitima de Manoel João Fernandes … alfaiate, natural da freguezia
    de São Romão da Ucha … e de Anna Exposta, costureira, cuja naturalidade é ignorada", do lugar
    do Souto. O registro em si é claro. É evidência forte, não confirmada, para P-0039 porque
    a ligação desta criança a Thereza Fernandes de Azevedo apoia-se no testamento de 1890 e no
    inventário de 1898 do pai, que nomeiam "Thereza, casada com Secundino de Azevedo" entre os
    filhos (PRB-0013, PRB-0014), e não num registro que traga as duas formas do nome juntas.
