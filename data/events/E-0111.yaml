- text: >-
    Birthplace Grindel, Solothurn, from the Imigrantes de Nova Friburgo / Casa Suíça compilation (PUB-0003), which gives her b.1793 Grindel. [corrected 2026-10-09: the compilation gives only "Nasceu em 1793." and names Grindel as her place of origin, not her birthplace — Grindel as birthplace is inferred; see the place note below.] Secondary compilation → strong-evidence, not primary; her own Grindel baptism is not held.
- text: >-
    Tier downgraded strong-evidence → hypothesis on 2026-10-09: the only source is PUB-0003, a
    published genealogy, which by policy cannot confirm and, as a lone secondary source, is
    below the strong-evidence bar of several consistent records (research/README.md, Confidence
    statuses) — the reasoning that downgraded E-0060 and E-0132. make check now rejects a
    strong-evidence conclusion resting only on published or authored narratives. The year stays
    as recorded; her c.1793 baptism in the Grindel register would restore it.
  text_pt: >-
    Nível rebaixado de evidência forte para hipótese em 2026-10-09: a única fonte é PUB-0003,
    uma genealogia publicada, que pela política do arquivo não pode confirmar e, sozinha, fica
    abaixo do patamar de evidência forte (vários registros concordantes; research/README.md) — o
    mesmo raciocínio que rebaixou E-0060 e E-0132. O make check agora rejeita uma conclusão de
    evidência forte apoiada só em narrativas publicadas. O ano fica como registrado; o batismo
    dela por volta de 1793 no registro de Grindel o restabeleceria.
- text: >-
    Place qualified 2026-10-09, from the full transcription of PUB-0003: the Casa Suíça entry
    for her reads only "Nasceu em 1793." and gives Grindel as her place of origin, not as her
    birthplace; the book's p.300 does not state where she was born. Grindel as birthplace is
    therefore an inference from her origin (her own 1820 marriage, PAR-0060, calls the father
    "natural do mesmo lugar"). Her Grindel baptism would settle both the year and the place.
  text_pt: >-
    Local qualificado em 2026-10-09, a partir da transcrição integral de PUB-0003: o registro
    da Casa Suíça diz apenas "Nasceu em 1793." e dá Grindel como local de origem, não como
    local de nascimento; a p.300 do livro não diz onde ela nasceu. Grindel como local de
    nascimento é, portanto, uma inferência a partir da origem (o casamento dela em 1820,
    PAR-0060, diz o pai "natural do mesmo lugar"). O batismo dela em Grindel resolveria o ano
    e o local.
