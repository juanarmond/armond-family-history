notes:
- text: >-
    Death of Ritta Angélica Rodrigues (P-0058) on 9 February 1832, intestate, per
    her 1833 Barbacena estate inventory (PRB-0010), in which her widower Capitão
    Joaquim José Ferreira de Toledo (P-0057) declared the date on oath before the
    Juiz dos Órfãos. She left thirteen children; the inventory opened 1 July 1833 and
    its assets were at the Fazenda Cascalhaes. The exact death place is not stated;
    Barbacena is the family's domicile.
