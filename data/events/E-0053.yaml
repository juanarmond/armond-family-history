notes:
- text: >-
    Marriage of Manoel Muniz Bitancourt (P-0042) and Francisca Roza do Espirito
    Santo (P-0047) on 17 February 1842 at Nossa Senhora Mãe de Deus, Povoação, São
    Miguel (Açores), per the parish register (PAR-0024, folio 32r). Dispensed from
    a fourth-degree consanguinity impediment. The act legibly names the groom's
    parents João Muniz Bitancourt (P-0048) × Maria Eugenia/Jacintha de Medeiros
    (P-0049) and the bride's parents Manoel de Motta [var. Mello] (P-0086) × Anna
    de Souza (P-0087). CORRECTED 11 August 2026: previously dated 1 February 1845
    from folio 73r, which was found to be a different "Manoel × Roza de Jesus"
    couple (a namesake); the true act is folio 32r, 17 February 1842. Their son
    João was born 24 October 1845 (PAR-0022).
