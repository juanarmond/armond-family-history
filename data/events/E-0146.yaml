notes:
- text: >-
    Baptism at São Romão da Ucha on 21 October 1807 of "Bento Jose", son of Manoel Fernandes and
    Jozefa Maria, of the lugar de Quintam (PAR-0109). Strong evidence, not confirmed, for P-0141:
    the parents and lugar match the paternal grandparents named in his son's 1833 baptism (PAR-0106),
    but no record ties this baptism to him directly, and the 1860 death taken as his gives his
    age as 60 (c.1800).
  text_pt: >-
    Batismo em São Romão da Ucha, em 21 de outubro de 1807, de "Bento Jose", filho de Manoel Fernandes
    e Jozefa Maria, do lugar de Quintam (PAR-0109). Evidência forte, não confirmada, para P-0141:
    os pais e o lugar coincidem com os avós paternos nomeados no batismo de 1833 do filho (PAR-0106),
    mas nenhum registro liga diretamente este batismo a ele, e o óbito de 1860 tomado como seu
    dá 60 anos (c.1800).
