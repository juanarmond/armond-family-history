notes:
- text: >-
    Death at the lugar de Quintão on 25 May 1890 of Joaquina Roza Lopes, aged 80, lavradeira,
    "viuva de Bento Fernandes", "natural da freguezia da Pouza", "filha legitima de Joze Lopes
    e de Marianna da Silva" (PAR-0111, entry Nº 10, signed by the abbot Joaquim Antonio de Miranda).
    The father's given name is "Ignacio" in eight contemporary baptisms of her children (PAR-0106,
    PAR-0113–PAR-0120); see P-0145.
  text_pt: >-
    Óbito no lugar de Quintão, em 25 de maio de 1890, de Joaquina Roza Lopes, de 80 anos, lavradeira,
    "viuva de Bento Fernandes", "natural da freguezia da Pouza", "filha legitima de Joze Lopes
    e de Marianna da Silva" (PAR-0111, assento nº 10, assinado pelo abade Joaquim Antonio de Miranda).
    O prenome do pai é "Ignacio" em oito batismos contemporâneos dos filhos dela (PAR-0106, PAR-0113–PAR-0120);
    ver P-0145.
