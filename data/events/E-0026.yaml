notes:
- text: >-
    Marriage of Francisco José Bohrer (P-0034) and Rosa Eugenia de Lemos (P-0035),
    celebrated before the coadjutor of the Freguesia de Itaboraí and later justified
    and registered at the Nova Friburgo Matriz on 1 August 1879 (PAR-0002). The
    ceremony date itself is not stated; "1879" is only the upper bound (the date of
    the justificação). The wedding was almost certainly decades earlier: their son
    Joaquim José Bohrer (P-0030) was already a father by 1890 (CIV-0019), and a
    justificação de casamento typically validates a long-past marriage.
