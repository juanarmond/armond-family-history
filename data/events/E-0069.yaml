- text: >-
    Godfather: Joseph Borer gmüpl (probably the principal's paternal uncle or
    kinsman, distinct from her father Joseph Borer fusemnistr). Godmother: Mari
    Elisabth Borr fallend (Marie Elisabetha Borer, possibly a paternal aunt).
    This primary record establishes Elisabetha Borer's (P-0073) birthplace as
    Erschwil rather than Grindel (she and Johann Jacob Wehrli both appear in the
    Grindel marriage register as "both from Grindel, Erischwyg" — the dual
    location descriptor indicates they were resident in Grindel but of Erschwil
    origin, or that Erischwyg was the parish territory encompassing both villages).
