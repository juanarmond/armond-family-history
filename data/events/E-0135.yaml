notes:
- text: >-
    Birth [corrected 2026-10-09: baptism — "b." is the book's abbreviation for baptised] of
    Gaspar de Souto-Maior (P-0092, Gaspar Ferreira) on 23 February 1657, S. Sebastião,
    Terceira. Source: Mendes Forjaz Vol. IX (PUB-0005, p.261): "Gaspar de Souto-Maior, b. em
    S. Sebastião a 23.2.1657 e f. a 2.12.1727." Son of Belchior da Ponte Cardoso (P-0123) ×
    Mariana Fagundes (P-0124), family F-0062. Compiled — no primary baptism image held.
- text: >-
    ⚠ The compiled death date (f. 2.12.1727 in S. Sebastião [corrected 2026-10-09: the book
    prints no place]) conflicts with P-0092's documented
    presence in Villa Rica, Minas Gerais [corrected 2026-10-09: PAR-0018 places only the son's
    birth and baptism at Villa Rica, not Gaspar himself] (PAR-0018, son Joaquim José marrying in 1783). The
    conflict is unresolved: either the 1727 date is an error (Gaspar emigrated and the compiler
    lacked records of his Brazilian life), or P-0092 is the next generation (a son of this
    Gaspar who also named himself Gaspar). This event records only the birth [corrected
    2026-10-09: baptism], which is
    consistent across the compilation. The Azorean death [corrected 2026-10-09: the compiled
    death; no place is printed] is NOT modelled as an event for P-0092
    pending resolution of this conflict.
- text: >-
    Tier downgraded strong-evidence → hypothesis on 2026-10-09: the only source is PUB-0005, a
    published genealogy, which by policy cannot confirm and, as a lone secondary source, is
    below the strong-evidence bar of several consistent records (research/README.md, Confidence
    statuses) — the reasoning that downgraded E-0060 and E-0132. make check now rejects a
    strong-evidence conclusion resting only on published or authored narratives. The date stays
    as recorded; it also carries the unresolved identity conflict noted above. His 1657 São
    Sebastião baptism would restore the date, though not by itself the identification with
    P-0092.
  text_pt: >-
    Nível rebaixado de evidência forte para hipótese em 2026-10-09: a única fonte é PUB-0005,
    uma genealogia publicada, que pela política do arquivo não pode confirmar e, sozinha, fica
    abaixo do patamar de evidência forte (vários registros concordantes; research/README.md) — o
    mesmo raciocínio que rebaixou E-0060 e E-0132. O make check agora rejeita uma conclusão de
    evidência forte apoiada só em narrativas publicadas. A data fica como registrada; carrega
    ainda o conflito de identidade não resolvido indicado acima. O batismo de 1657 em São
    Sebastião restabeleceria a data, mas não, por si só, a identificação com P-0092.
- text: >-
    Corrected 2026-10-09 after a full verbatim transcription of Vol. IX pp. 257–261 (PUB-0005):
    event_type changed from birth to baptism. The entry reads "6 Gaspar de Souto-Maior, b. em S.
    Sebastião a 23.2.1657 e f. a 2.12.1727", and the book's own abbreviation key uses "b." for
    baptizado and "n." for nasceu, so 23.2.1657 is his baptism; no birth date is printed. The
    book prints no place for the 2.12.1727 death, so the earlier notes here that placed it "in S.
    Sebastião" were wrong. The same entry records a second marriage at São Sebastião on 8.2.1694
    to Maria Mendes de Borba and three children baptised there in 1698–1701, which places him on
    Terceira into his forties and makes the identification with P-0092 weaker; it stays an
    unresolved hypothesis. Status, date and sources are unchanged.
  text_pt: >-
    Corrigido em 2026-10-09 após a transcrição integral e literal das pp. 257–261 do Vol. IX
    (PUB-0005): event_type passou de birth (nascimento) para baptism (batismo). A entrada diz "6
    Gaspar de Souto-Maior, b. em S. Sebastião a 23.2.1657 e f. a 2.12.1727", e a chave de
    abreviaturas do próprio livro usa "b." para baptizado e "n." para nasceu; logo, 23.2.1657 é
    o batismo, e nenhuma data de nascimento é impressa. O livro não imprime local para o óbito de
    2.12.1727 (sem local impresso), pelo que as notas anteriores que o situavam "em S. Sebastião"
    estavam erradas. A mesma entrada registra um segundo casamento em São Sebastião a 8.2.1694
    com Maria Mendes de Borba e três filhos ali batizados em 1698–1701, o que o situa na Terceira
    até passados os quarenta anos e enfraquece a identificação com P-0092; ela continua uma
    hipótese não resolvida. Estatuto, data e fontes inalterados.
- text: >-
    REPORTED PRIMARY READS, 2026-10-10 (retrieval plan PLAN-armond-azorean-origin-terceira,
    items A1–A6; images held on the retrieval side, not here): the Terceira Gaspar de Souto
    Maior's baptism, read on a BPAR 300-dpi original of São Sebastião B-1611-1687 p.0324, is
    dated 23 December 1657, parents Alferes Belchior da Ponte Cardozo × Mariana Fagundes (Vol.
    IX prints 23.2.1657; Lacerda's footnote 23.9.1657); his 2 October 1690 marriage to D.
    Margarida (C-1673-1766 p.0036) and his sister Isabel's 1693 marriage name the same parents;
    and his death, São Sebastião O-1696-1762 p.0099, 2 December 1727, "de idade de setenta
    annos". If that death entry is confirmed here, the Terceira Gaspar lived and died on
    Terceira, and identifying him with P-0092 — the Vila Rica father of Joaquim José, who
    married in 1783 — becomes untenable. The retrieval side itself attaches this trunk to the
    owner's line only through Simplício (P-0016) and the Barbacena Ferreira Armonde, never
    through P-0092. Decision pending with the owner; no status changed.
  text_pt: >-
    LEITURAS PRIMÁRIAS INFORMADAS, 2026-10-10 (plano de pesquisa PLAN-armond-azorean-origin-
    terceira, itens A1–A6; imagens guardadas pela pesquisa de recuperação, não aqui): o batismo
    do Gaspar de Souto Maior da Terceira, lido num original do BPAR a 300 dpi (São Sebastião
    B-1611-1687, p.0324), é de 23 de dezembro de 1657, pais Alferes Belchior da Ponte Cardozo ×
    Mariana Fagundes (o Vol. IX imprime 23.2.1657; a nota de Lacerda, 23.9.1657); o casamento
    dele com D. Margarida em 2 de outubro de 1690 (C-1673-1766, p.0036) e o da irmã Isabel em
    1693 nomeiam os mesmos pais; e o óbito, São Sebastião O-1696-1762, p.0099, é de 2 de
    dezembro de 1727, "de idade de setenta annos". Se esse assento de óbito se confirmar aqui, o
    Gaspar da Terceira viveu e morreu na Terceira, e identificá-lo com P-0092 — o pai, em Vila
    Rica, de Joaquim José, que casou em 1783 — torna-se insustentável. A própria pesquisa de
    recuperação liga este tronco à linha do proprietário apenas por Simplício (P-0016) e pelos
    Ferreira Armonde de Barbacena, nunca por P-0092. Decisão pendente com o proprietário; nenhum
    status alterado.
