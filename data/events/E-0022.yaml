notes:
- text: >-
    Birth of Celina Bohrer (P-0015) fixed to 13 May 1899 by her own parish baptism (PAR-0057,
    baptised 27 Sep 1899 at Nova Friburgo), legitimate daughter of Joaquim José Bohrer (P-0030)
    × Lucinda Ferreira (P-0031). This supersedes the earlier "c.1900" inferred from her age (77)
    at her 1977 death (CIV-0015); the 1899 date is consistent (77 in Feb 1977). Birthplace Nova
    Friburgo also corroborated by Eunir Bohrer's 1924 birth registration (CIV-0016).
