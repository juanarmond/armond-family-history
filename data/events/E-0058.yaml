notes:
- text: >-
    Death of António Ladislão de Toledo (P-0063) on 11 February 1909 at 9pm at
    Fazenda da Concórdia, Thebes district, Leopoldina MG. Cause: lesão cardíaca,
    without medical attendance. Declarant appeared at the cartório on 12 February
    1909; stated "hontem as nove horas da noite" (yesterday at 9pm), giving the
    death date as 11 February 1909. Burial in the public cemetery of the Thebes
    district.
