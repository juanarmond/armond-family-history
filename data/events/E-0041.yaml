notes:
- text: >-
    Birth of Susanna (Suzana) Rita Brandão (P-0020) on 20 August 1865, established by
    her own baptism (PAR-0005, which states "nascida a vinte de Agosto de mil oito centos
    sessenta e cinco"); the baptism is the pre-civil-registration birth record. Birthplace
    is the baptizing parish, Santo Antônio de Sapucaia (RJ). She was baptized the following
    year, on 22 March 1866 (event E-0035). [Day corrected 11 August 2026 from "onze" (11) to
    "vinte" (20) on image re-read; the decade is "sessenta" (1865), not the briefly-recorded
    "setenta" (1875), which is impossible against her 1882 marriage and 1884 childbirth.]
