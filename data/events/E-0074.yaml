notes:
- text: >-
    Marriage of João Francisco Muniz Bitancourt (P-0048) and Maria Jacintha de
    Medeiros (P-0049) on 7 October 1819 at N.S. Mãe de Deus, Povoação, São Miguel,
    per the parish register (PAR-0037, folio 161v). The act names the groom's
    parents Manoel Muniz Bitancourt (P-0082) × Tereza do Amaral (P-0083, already
    deceased) and the bride's parents João de Medeiros Brandão (P-0084) × Maria
    Eugenia (P-0085). The scribe wrote "Setembro" then corrected to "Outubro".
